# wairon hosting server - self-hosting starting point.
#
#   1. cp .env.example .env and set WAIRON_ADMIN_TOKEN
#   2. docker compose pull && docker compose up -d
#   3. docker compose exec wairon wairon host project create --id acme
#   4. docker compose exec wairon wairon host key mint --project acme --role editor
#
# The data plane (:8080/mcp) is published; put a TLS-terminating reverse proxy in
# front of it in production. The admin plane stays on 127.0.0.1 inside the
# container - administer via `docker compose exec` (safest), never exposed.
#
# Local development build:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build

services:
  wairon:
    image: ghcr.io/syw-apps/wairon:stable
    ports:
      - "8080:8080"                            # data plane (MCP over streamable HTTP)
    environment:
      WAIRON_DATA_DIR: /data
      # Server-global extension packs live on the data volume so they persist
      # across container recreation (and so `docker compose exec ... host packs`
      # targets the same directory the server uses).
      WAIRON_PACKS_DIR: /data/packs
      # Master admin credential - required (server refuses to start without it).
      # Read from your shell / .env; never commit the value.
      WAIRON_ADMIN_TOKEN: ${WAIRON_ADMIN_TOKEN:?set WAIRON_ADMIN_TOKEN (copy .env.example)}
    volumes:
      - wairon-data:/data
    restart: unless-stopped

volumes:
  wairon-data:
