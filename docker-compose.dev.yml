# Development override: build the image from this checkout instead of pulling
# the published GHCR image.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build

services:
  wairon:
    image: wairon:dev
    build:
      context: .
      args:
        VERSION: dev
        REVISION: local
        CREATED: local
