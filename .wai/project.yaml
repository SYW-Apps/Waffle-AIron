      # 209 finding(s), 237 unit(s).
      - kind: undecided
        why: >-
          The first measured yield of param-conformance on the signatures the contracts describe in
          their own terms, after the 40 implementations that declare their injected wiring. Four
          shapes, and each name has two legal answers that only a reader of the code can choose
          between. A contract declares an argument the function never takes, so the promise goes
          nowhere and every brief built from it passes one. A function takes an argument no contract
          names and no injection accounts for - enableGit takes a `pat`, executeApprovedLock an
          `approver` - which is an input a caller must supply that the design never mentions, and the
          credential case is the reason this rule exists at all. The two sides name the same argument
          differently, agreeing on position and type: `config` where the code says `projectConfig`,
          `credential` where it says `token`. And they disagree about whether an argument may be left
          out, which tells a caller a value is guaranteed when it is not, or the reverse. Undecided
          rather than drift because for each one the contract may be behind the code or the code may
          have grown past its contract, and the divergence does not say which. Nothing here is a limit
          of the reader: every finding is exact grade, aligned from the front, and where a name has
          several bodies only what ALL of them agree on is reported.
