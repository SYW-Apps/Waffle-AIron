schemaVersion: 1.0.0
name: Waffle-AIron
extensions:
  # wairon's own doctrine is wairon's own — nothing from a developer's global
  # packs folder (~/.wairon/packs) may govern this repo. Without this, whatever a
  # contributor happens to have installed machine-wide silently injects profiles,
  # rules, and skills here: the gate, `wairon skills list`, and the MCP
  # instructions/resources then differ per developer, and CI (which has no global
  # packs) disagrees with every local run.
  useGlobalPacks: false
targets:
  - type: claude
    outputDir: .claude/agents
    enabled: true
  - type: gemini
    outputDir: .gemini/agents
    enabled: true
  - type: agy
    outputDir: .gemini/agents
    enabled: true
  - type: cursor
    outputDir: .cursor/rules
    enabled: true
  - type: copilot
    outputDir: .github/prompts
    enabled: true
  - type: codex
    outputDir: .codex/agents
    enabled: true
rules:
  noOverlappingOwnership: true
  requireOwnedPaths: true
  complexity:
    # The hosted control-plane hub orchestrators (admin, identity, landscape)
    # legitimately coordinate up to ~10 collaborators after Phase 6 folded in
    # scoped-administration deps. A reviewed, visible cap of 10 — rather than
    # per-spec lint.allow silences — governs both the GOD_COMPONENT and
    # EXCESSIVE_DEPENDENCIES rules. Genuinely bloated components still warn.
    maxComponentDependencies: 10
    # This project IS a linter: sdd_validator's rules are dispatch ladders over
    # a closed vocabulary, where the branch count is the subject matter, not
    # tangled control flow. Judged against the shipped default (warn above
    # moderate) the rule family would warn forever, so wairon holds its own
    # tree to the next band up. The default is unchanged for everyone else,
    # and it is not the problem: of this tree's 1061 narratives, 777 are
    # linear and only 33 exceed the shipped default. A narrative that reaches
    # severe still warns here.
    cognitiveWarnAbove: complex
  # wairon's code realizes several spec-level roles inside shared modules
  # (e.g. portal+orchestrator+adapters folded into src/mcp/server.ts), so
  # per-component implementer agents would claim overlapping paths. Subsystem
  # owners own their code until the code-side split lands.
  generateComponentImplementers: false
  metaAgentTags:
    - meta
    - guardian
    - architect
    - adapter
    - portal
    - orchestrator
  enforceReproducibility: true
  # Where wairon's own source lives, and what of it no spec claims yet.
  # Declaring a source root is what opts a project into UNCLAIMED_SOURCE_FILE:
  # a project that declares none walks nothing and the check stays silent.
  conformance:
    sourceRoots:
      - src
    exclude:
      # The vendored Cytoscape bundle shipped with the canvas template. Not
      # ours to claim, and never will be, so it does not belong in a list
      # that only shrinks.
      - src/templates/canvas
    # The debt register, frozen. Every file here is source wairon ships and
    # no spec names — F17, written down where a reviewer sees the whole list
    # instead of discovering it one file at a time. It can only SHRINK: claim
    # a file with a sourcePath and delete its line, and an entry that is
    # already claimed, a proven re-export barrel, or gone is reported
    # (STALE_UNCLAIMED_ENTRY). A file that is neither claimed nor listed is
    # reported the day it appears, which is the whole point.
    unclaimed:
      - src/commands/aliases.ts
      - src/commands/diagram.ts
      - src/commands/domains.ts
      - src/commands/execution.ts
      - src/commands/status.ts
      - src/config/defaults.ts
      - src/config/loader.ts
      - src/config/userconfig.ts
      - src/core/approval.ts
      - src/core/approver.ts
      - src/core/budget_policy.ts
      - src/core/canvas-layout.ts
      - src/core/canvas.ts
      - src/core/context.ts
      - src/core/demo-seed.ts
      - src/core/detection.ts
      - src/core/diagram-export.ts
      - src/core/domains.ts
      - src/core/execution_profile.ts
      - src/core/narrative-labels.ts
      - src/core/rules/doctrine/stereotype-terms.ts
      - src/core/rules/extension/declared-assertion.ts
      - src/core/rules/index.ts
      - src/core/rules/narrative/completed-step-graph.ts
      - src/core/rules/read-model.ts
      - src/core/rules/wiring/invariant-ref.ts
      - src/core/stamp.ts
      - src/exporters/base.ts
      - src/exporters/claude.ts
      - src/exporters/custom.ts
      - src/exporters/gemini.ts
      - src/exporters/generate.ts
      - src/exporters/registry.ts
      - src/index.ts
      - src/models/domain.ts
      - src/models/execution.ts
      - src/models/template.ts
      - src/server/errors.ts
