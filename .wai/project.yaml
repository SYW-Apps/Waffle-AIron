      # 1 finding(s).
      - kind: unreadable
        why: >-
          The contract is realized by a FORWARDING BINDING, and the check reads function-like
          bodies only. src/server/adapters.ts declares its adapters as objects of forwards
          (hostGit = { publish: gitPortal.publish, ... }), and src/server/http.ts realizes
          ihost_server.init as `export { bootstrapInstance as init }`. In every one of these the
          realization is real and deliberate: the name is bound, and the body is one hop away
          through a property or an alias the model does not follow. This is the same blind spot
          the pure re-export barrel exemption closes for Level 1, one level down, and there is
          nothing in the tree to fix for it.
        findings:
          - code: METHOD_BODY_NOT_FOUND
            spec: host_server_impl
            at: 'init'
      # 6 finding(s), 10 unit(s).
      - kind: unreadable
        why: >-
          The step's target IS called by name, from a site written in a shape a pure model cannot
          resolve to a file: a bare call on a name bound to a package specifier (scaffoldPack,
          extractPack out of the SDK), a receiver holding a value the module assembled (sdkPortal,
          hostCore), and a receiver this model records no name for at all. The code is deliberate
          about this: CALL_ORIGIN_UNRESOLVED exists to report what was NOT checked, so the step is
          neither proven realized nor accused of being missing, and no working call is asked to be
          rewritten to suit the reader. Nothing here is an author defect; it is the reader's
          reach, written down.
        findings:
