      - kind: undecided
        why: >-
          src/mcp/server.ts is one file modelled as five components (mcp_portal, mcp_server,
          mcp_orchestrator, mcp_core_adapter, mcp_skills_adapter), so every hop between them is a
          boundary crossing that looks local. createMcpServer alone crosses 23 of them. Narrating
          23 cross-component calls inside one function would be an unreadable narrative, and
          splitting a 2000-line server registration into five modules is a real change with real
          risk: which of the two is right is a decision nobody has taken. It is recorded here as a
          question, not as work somebody forgot.
