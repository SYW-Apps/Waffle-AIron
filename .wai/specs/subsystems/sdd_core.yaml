id: sdd_core
name: SDD Core Spec Manager
description: Handles physical spec tree reading, parsing, writing, and dynamic agent topology resolution.
parentSystem: Waffle-AIron
publicInterfaces:
  - type: Custom
    details: Provides spec loading and topology resolution services.
    component: core_portal
trustedLinks:
  - subsystem: sdd_validator
    reason: >-
      Acknowledged mutual coupling, not a shortcut: sdd_validator must read the spec tree to judge
      it, and sdd_core's write gate must call the rule engine to judge a component before it reaches
      disk. The two ship in one process and one package, so the call is in-process by construction
      and there is no bus to route either direction over. The client-Adapter shim
      (core_validator_adapter) is kept anyway, so the hop stays swappable for a remote validator;
      this link records the commitment, and is not a licence to depend on validator_portal without
      it.
status: complete
createdAt: '2026-06-10T19:28:00.000Z'
updatedAt: '2026-09-18T21:15:54.815Z'
