id: sdd_skills
name: SDD Skills Exporter
description: >-
  Bootstraps and synchronizes the built-in SDD AI Skills (sdd-architect, sdd-narrative, sdd-auditor,
  sdd-implement, sdd-delegate) to local AI CLI directories, composes pack skill extensions into
  them, and publishes the same skill content plus the composed server instructions over MCP for
  cloud-only agents.
