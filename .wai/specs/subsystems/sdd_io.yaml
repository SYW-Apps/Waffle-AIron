id: sdd_io
name: SDD I/O
description: >-
  wairon's generic I/O: the file system, child processes, outbound HTTP and the checkout's git HEAD,
  each one call per action. Its four Adapters are published as shared, so every subsystem calls them
  directly; they hold no state and know nothing of wairon's domain, so a library or runtime change
  is made here once.
parentSystem: Waffle-AIron
publicInterfaces:
  - details: Generic file system I/O every subsystem calls directly.
    component: files_adapter
    shared: true
  - details: Generic process I/O every subsystem calls directly.
    component: process_adapter
    shared: true
  - details: Generic outbound HTTP every subsystem calls directly.
    component: http_client_adapter
    shared: true
  - details: >-
      The checkout's branch and commit, read without running git, for every subsystem that records
      or watches them.
    component: git_head_adapter
    shared: true
trustedLinks: []
status: complete
createdAt: '2026-10-31T23:14:22.614Z'
updatedAt: '2026-11-10T18:57:23.116Z'
