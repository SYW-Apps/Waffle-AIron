schemaVersion: 1.0.0
name: Waffle-AIron
vision: >
  To provide a local, spec-driven development (SDD) orchestration environment that enforces top-down
  design, interface contract compatibility, and dynamic agent topology sandboxing across software
  projects, guaranteeing blueprint-to-code symmetry.
boundaries:
  - >-
    The system only operates within the workspace boundaries of initialized wairon projects
    (directories containing a .wai/ folder).
  - All spec definitions, metadata, and cache structures must be stored locally under .wai/.
  - >-
    AI tooling configuration injection is limited to user-approved standard folders (.gemini/skills/
    and .claude/).
globalRequirements:
  - >-
    Enforce strict top-down spec dependencies (cannot define lower-level specs without parent
    specs).
  - Expose an MCP server with tools for spec manipulation, validation, and analysis.
  - Verify method implementation contracts against interface method signatures.
  - >-
    Enforce component interaction boundaries based on component type: the building blocks and
    patterns that the architecture standard (docs/standards/architecture.md) defines.
  - >-
    Export structured workflow skills to local AI agent configurations on project initialization and
    generation.
publicInterfaces:
  - id: hosted-mcp-data-plane
    name: Hosted MCP Data Plane
    subsystem: sdd_host
    component: host_http_portal
    type: REST
    details: >-
      Streamable HTTP MCP endpoint exposing the sdd_* tool surface request-scoped to the
      authenticated project, plus discovery and self-service tools. The consumable surface of a
      wairon deployment.
    audience: external
    authPolicy: project-scoped API key or user-bound token (Authorization bearer)
    stability: stable
  - id: hosted-admin-api
    name: Hosted Admin API
    subsystem: sdd_host
    component: admin_portal
    type: REST
    details: >-
      Exposure-policy-controlled control plane for project/key/pack/producer/secret/git lifecycle
      and the privileged lock. Operator-facing within a deployment.
    audience: instance
    authPolicy: master credential or scoped admin grants; disabled over HTTP by default
    stability: stable
  - name: wairon command line
    component: cli_portal
    from: sdd_cli
    as: wairon-cli
    type: Custom
    details: >-
      The `wairon` (and `wai`) binary of the @wairon/cli package (package.json bin): one CLI
      endpoint per command.
    audience: external
    stability: stable
  - name: '@wairon/sdk'
    component: sdk_portal
    from: sdd_sdk
    as: wairon-sdk
    type: Custom
    details: >-
      The @wairon/sdk package (sdk/, main dist/index.js): scaffold, build, inspect and safely
      extract .wpack pack archives and .waitree spec-tree archives.
    audience: external
    stability: stable
  - name: '@wairon/cli library: core'
    from: sdd_core
    details: >-
      The @wairon/cli package's library entry (main dist/index.js, src/index.ts) re-exports the core
      barrel, which publishes exactly sdd_core's portal contracts — each under its own public name.
    audience: external
    stability: stable
  - name: '@wairon/cli library: validation'
    component: validator_portal
    from: sdd_validator
    as: wairon-library-validation
    details: >-
      The library entry re-exports the validator portal's whole contract — validateProject (the
      owner's gate), validateFamily (the family run), validateAsComplete, the pack-impact
      measurements, the gate identity and the rest — the embedding API a wrapper compiles its gate
      from.
    audience: external
    stability: stable
  - from: sdd_sdk
    typeDef: pack_rule
    audience: external
    stability: stable
  - from: sdd_sdk
    typeDef: pack_rule_context
    audience: external
    stability: stable
  - from: sdd_sdk
    typeDef: pack_rule_spec_node
    audience: external
    stability: stable
  - from: sdd_sdk
    typeDef: pack_rule_finding
    audience: external
    stability: stable
  - from: sdd_sdk
    typeDef: pack_rule_severity
    audience: external
    stability: stable
  - name: '@wairon/cli library: surfaces'
    component: surface_portal
    from: sdd_surfaces
    as: wairon-library-surfaces
    details: >-
      The library entry re-exports the surface portal's whole contract: exportDesign (the in-process
      twin of `wairon export`), surface export and import, the stored snapshots, and pinning and
      reading the declared externals. The family migrations' pin maintenance is a separate internal
      portal and is not published here.
    audience: external
    stability: stable
databases: []
targetLanguage: typescript
