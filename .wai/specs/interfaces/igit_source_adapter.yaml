id: igit_source_adapter
name: Git Source Adapter Interface
description: >-
  Materialize a repository at a commit, resolve a ref, read a work tree's commit. Content-addressed
  and immutable per commit; network only in fetch (when the commit is not cached) and resolve.
component: git_source_adapter
methods:
  - name: fetch
    description: >-
      The cache directory holding `dir` of the repository at exactly that commit, fetching it (that
      commit only, shallow) when the cache does not hold it yet. Throws SourceUnavailable naming why
      when it cannot: offline, refused credentials, an unknown commit, or a `dir` the commit does
      not hold. Idempotent: a cached commit is answered without touching the network.
    signature: 'fetch(url: string, commit: string, dir?: string): string'
    returns: string
    params:
      - name: url
        type: string
        description: The repository URL as the source declares it
      - name: commit
        type: string
        description: The full commit to materialize
      - name: dir
        type: string
        description: The producer's root inside the repository
        optional: true
    guarantees:
      - idempotent
  - name: resolve
    description: >-
      The full commit a ref names on the remote now (the remote's default branch when no ref is
      given). Network; throws SourceUnavailable when the remote cannot be reached or the ref does
      not exist. Called only by pinning and updating, never by a validate.
    signature: 'resolve(url: string, ref?: string): string'
    returns: string
    params:
      - name: url
        type: string
        description: The repository URL
      - name: ref
        type: string
        description: A branch or tag
        optional: true
  - name: head
    description: >-
      The commit checked out in the work tree that holds a directory, or null when the directory is
      in no git work tree. No network. Provenance for a part or member stored on disk: the parent's
      lock records it, and nothing judges by it.
    signature: 'head(directory: string): string?'
    returns: string?
    params:
      - name: directory
        type: string
        description: An absolute directory
  - name: repositoryRoot
    description: >-
      The root of the git work tree that holds a directory (the nearest ancestor holding a `.git`
      entry), or null when it lies in none. No process and no network: a filesystem walk. What tells
      a producer in another repository (whose commit a pin records) from a contained or
      same-repository one (whose commit nothing records).
    signature: 'repositoryRoot(directory: string): string?'
    returns: string?
    params:
      - name: directory
        type: string
        description: An absolute directory
  - name: trackedFiles
    description: >-
      The files under the given pathspecs (relative to the directory) that the git index of the work
      tree holding the directory tracks — committed or staged — answered relative to the directory;
      ignored and untracked files are never listed. Null when the directory is in no git work tree
      or git is not installed, so a caller can tell 'git tracks none of these' (an empty list) from
      'there is no git to ask' (null). No network.
    signature: 'trackedFiles(directory: string, pathspecs: list<string>): list<string>?'
    returns: list<string>?
    params:
      - name: directory
        type: string
        description: An absolute directory the pathspecs are relative to
      - name: pathspecs
        type: list<string>
        description: Directory or file paths relative to the directory
    effect: read
  - name: lastCommitOf
    description: >-
      The last commit of the work tree holding a directory that changed the file at the pathspec
      (relative to the directory), or none when no commit did, the directory is in no work tree or
      git is not installed. No network.
    signature: 'lastCommitOf(directory: string, pathspec: string): string?'
    returns: string?
    params:
      - name: directory
        type: string
      - name: pathspec
        type: string
    effect: io
  - name: commitOf
    description: >-
      The full commit a ref (a branch, tag or commit) names in the work tree holding a directory, or
      none when it names none. No network.
    signature: 'commitOf(directory: string, ref: string): string?'
    returns: string?
    params:
      - name: directory
        type: string
      - name: ref
        type: string
    effect: io
  - name: commitIntroducing
    description: >-
      The oldest commit of the work tree holding a directory whose change to the file at the
      pathspec (relative to the directory) introduced the given text — the commit that first
      recorded it (`git log -S`, oldest first) — or none when no commit did, the directory is in no
      work tree or git is not installed. No network.
    signature: 'commitIntroducing(directory: string, pathspec: string, text: string): string?'
    returns: string?
    params:
      - name: directory
        type: string
      - name: pathspec
        type: string
      - name: text
        type: string
        description: The text the commit introduced (an approval's StateId digest)
    effect: io
status: complete
