id: ispec_file_store
name: Spec File Store Interface
description: >-
  Contract for spec-document file I/O: path-addressed reads and writes, and the recursive walk of a
  spec directory. Paths are resolved by the caller and taken as given — the store is not bound to
  one specs directory.
component: spec_file_store
methods:
  - name: read
    description: >-
      Read and parse the spec document at the given path (resolved by the caller), or null when
      absent or empty.
    signature: 'read(specPath: string): json | null'
    returns: any
    effect: read
  - name: write
    description: >-
      Serialize the document in the spec storage format and write it to the given path, creating
      parent directories as needed.
    signature: 'write(specPath: string, document: json): void'
    returns: void
    effect: write
  - name: listTree
    description: >-
      Recursively list YAML spec files under the given directory tree (empty when the root is
      absent).
    signature: 'listTree(directory: string): string[]'
    returns: list<string>
    effect: read
  - name: findChainingParent
    description: >-
      The filesystem walk realizing membership detection: from the bound root, examine ancestors
      (bounded depth) for a project that declares the bound root as a member — a `members` entry of
      its configuration (read through that ancestor's per-root binding, as the scan reads a root's
      configuration) or, for one release, a legacy L1 subsystem spec whose projectPath resolves
      exactly to the bound root — and return its root, the alias it declares the bound root under
      and the form, or null. File I/O lives here — the store is the only spec-tree component that
      touches the disk.
    signature: 'findChainingParent(): ChainingParentRef | null'
    returns: ChainingParentRef?
    effect: read
  - name: remove
    description: >-
      Delete the spec document at the given path and prune the parent directories the deletion left
      empty, stopping before the specs root so the root itself survives an emptied tree. Answers
      false when there was no file there, so a caller can tell "deleted" from "was never there"
      without a separate existence check. The root is a PARAMETER, not something the store works
      out: `paths.specsDir` is configurable and this component never reads `project.yaml`, so a
      store left to infer the boundary would delete the specs directory itself. This method is here
      because the component claims to be the single file-I/O face of the spec repository: while
      deletes unlinked files directly from the workspace, that claim was false and the one place the
      storage format is chosen did not know when a document stopped existing.
    signature: 'remove(specPath: string, specsRoot: string): bool'
    returns: bool
    params:
      - name: specPath
        type: string
        description: The spec document's path, resolved by the caller as for read and write
      - name: specsRoot
        type: string
        description: >-
          The specs directory the prune stops before; the caller resolves it, because the store
          reads no project configuration of its own
    effect: write
  - name: lockTree
    description: >-
      Take the write lock of the spec tree under the given project root, across every process on the
      machine: a lock file beside the tree created exclusively, held until unlockTree. A process
      already holding it takes it again (reentrant, counted). Another holder is waited for; a lock
      left by a process that is gone, or older than any write could take, is broken. Refused after a
      bounded wait, naming the holder, so a stuck writer never hangs a session.
    signature: 'lockTree(root: string): void'
    returns: void
    params:
      - name: root
        type: string
        description: The project root whose spec tree is locked
    effect: io
  - name: unlockTree
    description: >-
      Release one hold of the write lock of the spec tree under the given project root; the lock
      file goes with the last hold. Releasing a lock this process does not hold does nothing.
    signature: 'unlockTree(root: string): void'
    returns: void
    params:
      - name: root
        type: string
        description: The project root whose spec tree is unlocked
    effect: io
status: complete
