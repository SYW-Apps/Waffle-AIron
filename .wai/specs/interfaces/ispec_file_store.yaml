id: ispec_file_store
name: Spec File Store Interface
description: >-
  Contract for spec-document file I/O: path-addressed reads and writes, and the recursive walk of a
  spec directory. Paths are resolved by the caller and taken as given — the store is not bound to
  one specs directory.
component: spec_file_store
methods:
  - name: read
    description: >-
      Read and parse the spec document at the given path (resolved by the caller), or null when
      absent or empty.
    signature: 'read(specPath: string): json | null'
    returns: json | null
    effect: read
  - name: write
    description: >-
      Serialize the document in the spec storage format and write it to the given path, creating
      parent directories as needed.
    signature: 'write(specPath: string, document: json): void'
    returns: void
    effect: write
  - name: listTree
    description: >-
      Recursively list YAML spec files under the given directory tree (empty when the root is
      absent).
    signature: 'listTree(directory: string): string[]'
    returns: string[]
    effect: read
  - name: findChainingParent
    description: >-
      The filesystem walk realizing chaining-parent detection: from the bound root, examine
      ancestors (bounded depth) for a spec directory containing a subsystem spec whose projectPath
      resolves exactly to the bound root; return its root and subsystem id, or null. File I/O lives
      here — the store is the only spec-tree component that touches the disk.
    signature: 'findChainingParent(): ChainingParentRef | null'
    returns: ChainingParentRef | null
    effect: read
  - name: remove
    description: >-
      Delete the spec document at the given path and prune the parent directories the deletion left
      empty, stopping before the specs root so the root itself survives an emptied tree. Answers
      false when there was no file there, so a caller can tell "deleted" from "was never there"
      without a separate existence check. The root is a PARAMETER, not something the store works
      out: `paths.specsDir` is configurable and this component never reads `project.yaml`, so a
      store left to infer the boundary would delete the specs directory itself. This method is here
      because the component claims to be the single file-I/O face of the spec repository: while
      deletes unlinked files directly from the workspace, that claim was false and the one place the
      storage format is chosen did not know when a document stopped existing.
    signature: 'remove(specPath: string, specsRoot: string): boolean'
    returns: boolean
    params:
      - name: specPath
        type: string
        description: The spec document's path, resolved by the caller as for read and write
      - name: specsRoot
        type: string
        description: >-
          The specs directory the prune stops before; the caller resolves it, because the store
          reads no project configuration of its own
    effect: write
status: complete
