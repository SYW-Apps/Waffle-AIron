id: isurfaces_core_adapter
name: Surfaces Core Adapter Interface
description: Spec-tree reads from the core subsystem's published portal for surface derivation.
component: surfaces_core_adapter
methods:
  - name: loadSystemSpec
    description: Loads the L0 system spec (incl. its gateway publicInterfaces).
    signature: 'loadSystemSpec(): SystemSpec | null'
    returns: SystemSpec?
  - name: loadComponentSpecs
    description: Loads component specs (portals + dispatch tables).
    signature: 'loadComponentSpecs(): ComponentSpec[]'
    returns: list<ComponentSpec>
  - name: loadInterfaceSpecs
    description: Loads interface specs (the contracts to export).
    signature: 'loadInterfaceSpecs(): InterfaceSpec[]'
    returns: list<InterfaceSpec>
  - name: loadTypeSpecs
    description: Loads type specs (closure source).
    signature: 'loadTypeSpecs(): TypeSpec[]'
    returns: list<TypeSpec>
  - name: computeStateId
    description: >-
      Forward to approval_portal.computeStateId: the spec tree's content identity a snapshot is
      stamped with
    signature: 'computeStateId(): StateId'
    returns: StateId
    params: []
  - name: resolveProjectExports
    description: >-
      Forward to spec_tree_portal.resolveProjectExports: a project's resolved L0 export table —
      every public name bound to its canonical target, with its audience. The bound project's when
      no project is named, which the snapshot projector flattens; a member's, by its namespace,
      which the design export reads to write a reference into that member as `alias::publicName`.
    signature: 'resolveProjectExports(project?: string): ResolvedExportTable'
    returns: ResolvedExportTable
    params:
      - name: project
        type: string
        description: >-
          The namespace of a project the scan read (a member's alias key); the bound project when
          omitted
        optional: true
    guarantees:
      - idempotent
  - name: loadProjectConfig
    description: >-
      Forward to project_config_portal.loadProjectConfig: the bound project's configuration, or null
      when it has none — read for the project's effective id, which a snapshot records beside its
      name.
    signature: 'loadProjectConfig(): ProjectConfig?'
    returns: ProjectConfig?
    params: []
    guarantees:
      - idempotent
  - name: resolveExternals
    description: >-
      Forward to the core portal: the bound project's declared externals and its referenced project
      members (a `../`, git or hosted source), each bound to its producer (family, source.path, git,
      hosted), with the project's references into each by public name. The surfaces plane never
      walks the family itself.
    signature: 'resolveExternals(offline?: bool): list<ExternalBinding>'
    returns: list<ExternalBinding>
    params:
      - name: offline
        type: bool
        description: Read no producer over the network (see external_producers.resolveDeclared)
        optional: true
  - name: excerptParent
    description: >-
      Forward to the core portal: a part's excerpt of its parent, for `wairon externals pin` at a
      part.
    signature: 'excerptParent(): ParentExcerpt'
    returns: ParentExcerpt
    params: []
  - name: loadSubsystemSpecs
    description: >-
      Forward to spec_tree_portal.loadSubsystemSpecs: every loaded subsystem, a part's included, for
      the design export
    signature: 'loadSubsystemSpecs(): list<SubsystemSpec>'
    returns: list<SubsystemSpec>
    params: []
    guarantees:
      - idempotent
  - name: loadImplementationSpecs
    description: >-
      Forward to spec_tree_portal.loadImplementationSpecs: every loaded implementation with its
      narratives, for the design export
    signature: 'loadImplementationSpecs(): list<ImplementationSpec>'
    returns: list<ImplementationSpec>
    params: []
    guarantees:
      - idempotent
  - name: resolveSubsystemExports
    description: >-
      Forward to spec_tree_portal.resolveSubsystemExports: one subsystem's resolved L1 export table,
      which the design export carries on each subsystem
    signature: 'resolveSubsystemExports(subsystemId: string): ResolvedExportTable'
    returns: ResolvedExportTable
    params:
      - name: subsystemId
        type: string
        description: The subsystem whose table to resolve
    guarantees:
      - idempotent
  - name: projectFamily
    description: >-
      Forward to spec_tree_portal.projectFamily: the project graph of the current scan — every
      project root it read with its alias, id and parent — from which the design export lists the
      bound project's direct project members as dependencies.
    signature: 'projectFamily(): ProjectFamily'
    returns: ProjectFamily
    params: []
    guarantees:
      - idempotent
  - name: declareExternal
    description: >-
      Forward to project_config_portal.declareExternal: write one external declaration into the
      bound project's configuration (refused for a malformed alias or producer id, or an alias
      holding a different declaration; a no-op for the same one). Returns whether it wrote.
    signature: 'declareExternal(alias: string, declaration: ExternalDeclaration): bool'
    returns: bool
    params:
      - name: alias
        type: string
        description: The alias key
      - name: declaration
        type: ExternalDeclaration
        description: The normalized declaration (object form) to write under it
  - name: removeExternal
    description: >-
      Forward to project_config_portal.removeExternal: take one external declaration out of the
      configuration — `externals remove`, and the restatement half of a `use` change that drops
      names. Returns whether it removed.
    signature: 'removeExternal(alias: string): bool'
    returns: bool
    params:
      - name: alias
        type: string
        description: The external's alias
  - name: resolveExternalCandidate
    description: >-
      Forward to the core portal: one external declaration not yet written, bound to its producer as
      the written one will be — what `externals add` checks before it writes, dry run included.
    signature: 'resolveExternalCandidate(alias: string, declaration: ExternalDeclaration): ExternalBinding'
    returns: ExternalBinding
    params:
      - name: alias
        type: string
        description: The alias the declaration would be written under
      - name: declaration
        type: ExternalDeclaration
        description: The normalized declaration
  - name: listExternalConsumers
    description: >-
      Forward to the core portal: the projects that consume the bound project — the family in reach,
      and every project root in the searched folders declaring it by path or git — with the names
      each uses. The surfaces plane never walks the family itself.
    signature: 'listExternalConsumers(search?: list<string>): list<ExternalConsumer>'
    returns: list<ExternalConsumer>
    params:
      - name: search
        type: list<string>
        description: Folders to scan for consumers outside the family
        optional: true
  - name: importNames
    description: >-
      Forward to project_config_portal.importNames: add public names to one external's `use`,
      append-only and idempotent (`*` already imports them all). Returns whether it wrote.
    signature: 'importNames(alias: string, names: list<string>): bool'
    returns: bool
    params:
      - name: alias
        type: string
        description: The external's alias
      - name: names
        type: list<string>
        description: The public names to import
  - name: getLoaderIssues
    description: >-
      Forward to the core portal: the loader's diagnostics for the bound tree — read with a
      producer's root bound, a spec file that failed to parse makes the producer unreadable, never a
      producer that removed names.
    signature: 'getLoaderIssues(): list<ValidationIssue>'
    returns: list<ValidationIssue>
    params: []
  - name: approvedRevision
    description: >-
      Forward to the core portal: the bound project's tree at its last committed approval, or at a
      named git revision, materialized read-only — the baseline of `wairon surface diff`.
    signature: 'approvedRevision(against?: string): approved_revision'
    returns: approved_revision
    params:
      - name: against
        type: string
        description: A git revision; the last committed approval when omitted
        optional: true
    effect: io
  - name: memberRevisions
    description: >-
      Forward to the core portal: each live member of the bound project with its usage and its tree
      at the approval it is judged against — what a member consumer's relation and binding are
      compared with.
    signature: 'memberRevisions(): list<member_revision>'
    returns: list<member_revision>
    params: []
    effect: io
status: complete
