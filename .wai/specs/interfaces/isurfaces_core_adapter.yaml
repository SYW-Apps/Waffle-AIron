id: isurfaces_core_adapter
name: Surfaces Core Adapter Interface
description: Spec-tree reads from the core subsystem's published portal for surface derivation.
component: surfaces_core_adapter
methods:
  - name: loadSystemSpec
    description: Loads the L0 system spec (incl. its gateway publicInterfaces).
    signature: 'loadSystemSpec(): SystemSpec | null'
    returns: SystemSpec | null
  - name: loadSubsystemSpecs
    description: Loads subsystem specs (public surfaces + chained mounts).
    signature: 'loadSubsystemSpecs(): SubsystemSpec[]'
    returns: SubsystemSpec[]
  - name: loadComponentSpecs
    description: Loads component specs (portals + dispatch tables).
    signature: 'loadComponentSpecs(): ComponentSpec[]'
    returns: ComponentSpec[]
  - name: loadInterfaceSpecs
    description: Loads interface specs (the contracts to export).
    signature: 'loadInterfaceSpecs(): InterfaceSpec[]'
    returns: InterfaceSpec[]
  - name: loadTypeSpecs
    description: Loads type specs (closure source).
    signature: 'loadTypeSpecs(): TypeSpec[]'
    returns: TypeSpec[]
  - name: resolveChainingParent
    description: >-
      Detect whether the CURRENT project root is a chained subproject: walk the filesystem upward
      for an ancestor project whose subsystem projectPath resolves exactly to this root. Returns the
      parent root and mounting subsystem id, or null when the tree is a genuine top root — and null
      when the bound request may not read above its root (a hosted credential narrowed to the child,
      or a parent above the request's top project root). Forwarded from the core portal's chaining
      detection — the surfaces plane never walks the filesystem itself.
    signature: 'resolveChainingParent(): ChainingParentRef | null'
    returns: ChainingParentRef | null
  - name: resolveSubprojectForNamespace
    description: >-
      Resolve a chained mount's qualified namespace to its project root through the core portal, or
      null — how the surfaces plane finds the `.wai/surfaces/` a mount holds without walking the
      filesystem itself.
    signature: 'resolveSubprojectForNamespace(namespace: string): string | null'
    returns: string | null
    params:
      - name: namespace
        type: string
  - name: computeStateId
    description: >-
      Forward to approval_portal.computeStateId: the spec tree's content identity a snapshot is
      stamped with
    signature: 'computeStateId(): StateId'
    returns: StateId
    params: []
status: complete
createdAt: '2026-07-10T23:14:05.167Z'
updatedAt: '2026-09-25T21:09:24.181Z'
