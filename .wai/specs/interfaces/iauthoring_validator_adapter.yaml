id: iauthoring_validator_adapter
name: Core Validator Client Adapter Interface
description: >-
  Client adapter to sdd_validator: the component candidate gate, forwarded 1:1 to the validator
  portal. Nothing else of the validator's surface is needed on this side of the boundary — sdd_core
  runs no tree validation of its own.
component: authoring_validator_adapter
methods:
  - name: validateComponentCandidate
    description: >-
      Judge one component that is not yet written against the spec-scoped rules, and return the
      verdict split by severity. Forwarded to the validator portal.
    signature: >-
      validateComponentCandidate(candidate: ComponentSpec, opts?: CandidateOptions):
      CandidateVerdict
    returns: CandidateVerdict
    params:
      - name: candidate
        type: ComponentSpec
        description: The component as it would be written
      - name: opts
        type: CandidateOptions
        description: The project's rule severities and project type to judge with
        optional: true
    guarantees:
      - idempotent
  - name: findTestsReferencing
    description: >-
      Forward the test search to the validator portal, so a gated write can name the tests that
      encode a method it just changed or deleted. Answers empty when the project declares no test
      roots — the search must never be the thing that fails a write.
    signature: >-
      findTestsReferencing(methods: MethodImplementation[], projectRoot: string, testRoots:
      string[]): TestsToRevisit[]
    returns: TestsToRevisit[]
    params:
      - name: methods
        type: MethodImplementation[]
        description: The methods the write changed or deleted
      - name: projectRoot
        type: string
        description: The root the test roots are resolved within
      - name: testRoots
        type: string[]
        description: Project-relative test directories from the project's conformance settings
    guarantees:
      - idempotent
status: complete
