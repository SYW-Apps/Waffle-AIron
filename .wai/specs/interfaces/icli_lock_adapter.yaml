id: icli_lock_adapter
name: CLI Lock Adapter Interface
description: >-
  Contract for the lock record and the build inputs beside it: the commit-scoped record carrying one
  project's approval (its approval identity over its own design and policy, its own spec digests,
  the identity's parts, and the code results beside the claim), the refresh of the owed inputs a
  lock takes first, and the read-only verdict on whether the record still covers the design on disk
  and its inputs hold. Callers of the WRITE gate on the design half of an as-complete validation
  FIRST and capture the approval identity before it: this adapter never locks an invalid design on
  its own authority, and it refuses to write when the identity moved while the lock ran. The READ
  decides nothing about legality: a tree can be approved and illegal, or legal and unapproved, and
  `wairon validate` answers the other question.
component: cli_lock_adapter
methods:
  - name: lockTree
    description: >-
      Summarize what the human is approving (own specs changed since the last approval, or the
      policy parts that moved; each direct member's own state, with the bottom-up warning for a
      drifted one), refuse what assertApprovable refuses (writing nothing), confirm with the human
      (skipped under --yes), then, immediately before writing, recompute the approval identity and
      refuse when it differs from the one the caller captured before validation. Writes a format-4
      record: stateId = the captured identity, parts = its five parts, specs = one design digest per
      own spec, `code` (the code-conformance results and analyzer identity, beside the claim),
      validationResult = the design half's counts, and the project's effective id. Records no member
      and never writes into the spec tree or below this project. Returns the written record, or null
      when the human declined.
    signature: 'lockTree(options: LockOptions, gate: ValidationResult, captured: StateId): async LockRecord?'
    returns: async LockRecord?
    params:
      - name: options
        type: LockOptions
        description: >-
          CLI flags: --yes (skip confirmation), --subsystem (re-approve one subsystem: refused as a
          first approval and whenever anything outside the scope moved since the approval, so the
          record always agrees with the whole-tree identity it certifies), --all (list every changed
          spec of the summary)
      - name: gate
        type: ValidationResult
        description: >-
          The as-complete result the caller gated on; its design half is counted as validationResult
          and its analysis recorded as `code`
      - name: captured
        type: StateId
        description: The gate identity the caller captured BEFORE validating — what the record certifies
  - name: checkApproval
    description: >-
      The verdict `wairon lock-check` exits on: the approval identity from the validator, the
      committed record resolved against it, each family member's own approval, and the build inputs,
      turned into one decision. Passes when the record covers the design and its policy, every
      member project's own approval covers it, and no input is owed.


      The APPROVAL identity, not the per-spec digests the same record carries: it hashes the parsed
      own design (code linkage out) and the project's own policy (projectType, design rule tuning,
      composition, network, pack selections by name, declared version and scope), and answers "has
      the approved design or the policy it was approved under changed". The wairon release, the
      pins, the resolved packs and the members' approvals are not part of it: none of them ever
      re-opens an approval. A record written before format 4 is refused by the lock store, and this
      verdict says so: run `wairon upgrade`. `stale` refuses at every strictness, naming the parts
      that moved. `unlocked` is the opt-in seam and passes with a notice unless `strict` is asked
      for. A repository with no spec tree is reported as such rather than crashing or being mistaken
      for an unapproved one.
    signature: 'checkApproval(strict: bool): ApprovalCheck'
    returns: ApprovalCheck
    params:
      - name: strict
        type: bool
        description: >-
          Whether the absence of an approval is itself a refusal. False (the default) passes an
          unlocked or spec-tree-less repository with a notice.
        optional: false
  - name: holdsNoDesign
    description: >-
      Whether there is nothing approvable: the tree holds the L0 and nothing below it — no
      subsystem, no type anywhere, no entry in the L0 export table, no direct member project — and
      no approval is on record. The predicate is the shared spec_tree_portal.holdsDesign, so a
      types-only project (an L0, an export table and types) is lockable. `wairon lock` writes no
      record for an empty tree (approving an empty design approves nothing) and says there is
      nothing approvable yet; it never prescribes adding a subsystem. `lock-check` and `status` say
      the same of such a tree. A tree emptied after an approval is not this state: that change is
      the approval's to take.
    signature: 'holdsNoDesign(): bool'
    returns: bool
    params: []
  - name: treeVerdict
    description: >-
      The lock-check verdict on a project whose specs folder holds no L0, or none when it holds one:
      no tree at all is said so (approved unless strict — a repository with no design yet must not
      start failing every strict consumer), and a specs folder whose L0 was deleted while spec files
      remain below it is refused at every strictness, naming the missing .wai/specs/.index.yaml, how
      many files it leaves unjudged and the fix — a bad merge never turns the gate green.
    signature: 'treeVerdict(strict: bool): ApprovalCheck?'
    returns: ApprovalCheck?
    params:
      - name: strict
        type: bool
        description: Whether --strict asks for an approved design
  - name: coverageVerdict
    description: >-
      What the approval on record owes beside its identity, and what its build owes, as a merge-gate
      refusal: the configuration gone, the project id moved since the approval, or input debts (an
      external never pinned or used beyond its pin, a pack not recorded or changed since, a member
      not approved under requireApprovedMembers), each with its fix. None when nothing is owed.
    signature: 'coverageVerdict(record: LockRecord, own: ProjectApproval?): ApprovalCheck?'
    returns: ApprovalCheck?
    params:
      - name: record
        type: LockRecord
        description: The approval on record
      - name: own
        type: ProjectApproval?
        description: The root's own approval entry
  - name: assertApprovable
    description: >-
      Refuse, writing nothing, what no lock may approve: a tree the loader could not read whole (a
      loader error: an escaping or circular member path, an unreadable document) or a family that
      could not be composed (a declared member with no project on disk, two members resolving to one
      id), which no --force overrides; a project requiring approved members with a member project
      not approved, or, unless forced, a pending lock request made on another branch than the
      checkout has now while none was made on the checkout's own branch. Inputs are not refused
      here: the lock refreshes the owed ones first, and lock-check refuses what stays owed.
    signature: 'assertApprovable(members: list<ProjectApproval>, force?: bool): void'
    returns: void
    params:
      - name: members
        type: list<ProjectApproval>
        description: The direct members' approval entries
      - name: force
        type: bool
        description: >-
          `wairon lock --force`: approve this checkout although a pending lock request was made on
          another branch
        optional: true
  - name: refreshInputs
    description: >-
      Refresh what the build owes before a lock approves: pin each owed external (declared but never
      pinned, or used beyond its pin) from its producer's approved state, and record the selected
      packs as they resolve now. An up-to-date pin is never advanced: moving a dependency forward
      stays `wairon externals pin`'s. A refused pin is reported and the lock goes on: inputs never
      block the approval, lock-check refuses what stays owed. Writes .wai/inputs.lock.yaml and its
      snapshots only.
    signature: 'refreshInputs(): InputsRefresh'
    returns: InputsRefresh
    params: []
    effect: write
status: complete
