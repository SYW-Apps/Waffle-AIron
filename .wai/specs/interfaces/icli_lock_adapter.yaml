id: icli_lock_adapter
name: CLI Lock Adapter Interface
description: >-
  Contract for the lock record: the commit-scoped record carrying one project's approval — its gate
  identity, its own spec digests, its direct members' subjects and states, and the code results
  beside the claim — and the read-only verdict on whether that record still covers the design on
  disk. Callers of the WRITE gate on the design half of an as-complete validation FIRST and capture
  the gate identity before it — this adapter never locks an invalid design on its own authority, and
  it refuses to write when the identity moved while the lock ran. The READ decides nothing about
  legality: a tree can be approved and illegal, or legal and unapproved, and `wairon validate`
  answers the other question.
component: cli_lock_adapter
methods:
  - name: lockTree
    description: >-
      Summarize what the human is approving (own specs changed since the last approval; each direct
      member's approval state and whether its pin moved), refuse when
      composition.requireApprovedMembers is set and a direct member is drifted or never approved
      (naming each, writing nothing), confirm with the human (skipped under --yes), then —
      immediately before writing — recompute the gate identity and refuse when it differs from the
      one the caller captured before validation. Writes a format-3 record: stateId = the captured
      identity (design gate algorithm — code linkage is not part of what is approved), the approval
      (one DESIGN digest per OWN spec, specsReading `design`), `members` (each direct member's
      subject and state), `code` (the code-conformance results and analyzer identity, beside the
      claim), validationResult = the design half's counts, and the project's effective id. Never
      writes `children`, never writes anything into the spec tree or below this project. Returns the
      written record, or null when the human declined.
    signature: 'lockTree(options: LockOptions, gate: ValidationResult, captured: StateId): async LockRecord?'
    returns: async LockRecord?
    params:
      - name: options
        type: LockOptions
        description: >-
          CLI flags: --yes (skip confirmation), --subsystem (scope narrowing of the approved
          digests), --all (list every changed spec of the summary)
      - name: gate
        type: ValidationResult
        description: >-
          The as-complete result the caller gated on; its design half is counted as validationResult
          and its analysis recorded as `code`
      - name: captured
        type: StateId
        description: The gate identity the caller captured BEFORE validating — what the record certifies
  - name: checkApproval
    description: >-
      The verdict `wairon lock-check` exits on: obtain the tree's gate identity from the validator
      and resolve the committed record against it, then turn the three honest lock states into one
      decision.


      The GATE identity, not the per-spec digests the same record carries. The gate identity hashes
      the parsed own DESIGN (code linkage out since format 3), the governing design doctrine, the
      declared inputs, `composition` and the direct members' subjects, and answers "has the approved
      DESIGN or anything it was approved under changed" — the only question a merge gate is entitled
      to refuse on. Code-conformance results and code linkage are not part of it, so neither an
      analyzer upgrade nor a sourcePath added after implementation ever fails this gate: conformance
      judges linkage, in `validate --ci`.


      A format-2 record is judged under its own algorithm (StateId.asRecorded), so upgrading wairon
      never fails this gate on an unchanged design. `stale` refuses at every strictness. A stale
      verdict under an earlier identity (LockStatus.upgraded) still refuses — nothing proves the
      design unchanged — but says so plainly: for a format-2 record, that it predates code linkage
      leaving the approval and something it covered moved (the design or only linkage, which can no
      longer be told apart), whether any own spec file changed since the approval, and that one
      re-lock clears it for good; a format-2 record that still matches passes, with a hint that
      `wairon doctor --fix` re-expresses it. `unlocked` is the opt-in seam and passes with a notice
      unless `strict` is asked for. A repository with no spec tree is reported as such rather than
      crashing or being mistaken for an unapproved one.
    signature: 'checkApproval(strict: bool): ApprovalCheck'
    returns: ApprovalCheck
    params:
      - name: strict
        type: bool
        description: >-
          Whether the absence of an approval is itself a refusal. False (the default) passes an
          unlocked or spec-tree-less repository with a notice.
        optional: false
  - name: reexpressApproval
    description: >-
      Carry a format-2 lock record into the design reading without a review, when that is provable:
      compute the gate identity (which carries the record's own identity recomputed as asRecorded),
      ask approval_comparison.reexpress for the carried record, and write it when there is one. The
      approval stays the human's (lockedAt, lockedBy unchanged); the record gains `reexpressed`.
      Returns the written record, or null when there was nothing to carry or nothing proves the
      design unchanged — then the caller says so and points at one `wairon lock`. The write behind
      `wairon doctor --fix`'s approval step; it writes this project's .wai/lock.json only.
    signature: 'reexpressApproval(): LockRecord?'
    returns: LockRecord?
    params: []
status: complete
