id: icli_lock_adapter
name: CLI Lock Adapter Interface
description: >-
  Contract for the lock-record half of `wairon lock`: the commit-scoped lock record carrying the
  approved spec content and the tree's gate identity. Callers gate on an as-complete validation
  FIRST — this adapter never locks an invalid tree on its own authority.
component: cli_lock_adapter
methods:
  - name: lockTree
    description: >-
      Write the (scope-filtered) lock record: the approval, one digest per approved spec, and the
      tree's current gate identity from the validator (spec content plus the governing doctrine and
      consumed contract inputs, so a later doctrine change invalidates the lock by state mismatch
      exactly as a spec edit does). Writes nothing into the spec tree. Returns the written record.
    signature: 'lockTree(subsystem?: string): LockRecord'
    returns: LockRecord
    params:
      - name: subsystem
        type: string
        description: Optional subsystem id narrowing the lock scope (matches the CLI --subsystem flag).
        optional: true
status: complete
