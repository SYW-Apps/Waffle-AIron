id: iauthoring_orchestrator
name: Authoring Orchestrator Interface
description: >-
  The gated write workflows behind the authoring portal. A write that violates an intrinsic rule
  throws with the rule codes and nothing reaches disk; a write that changes nothing writes nothing
  and reports that it did not.
component: authoring_orchestrator
methods:
  - name: updateSpecGated
    description: >-
      Patch an existing spec of any level through the same judgement, by injecting it into the
      store's delta update as a write hook. The hook judges the MERGED spec, because a delta on its
      own cannot tell you the resulting componentType, and it is the resulting componentType that
      decides whether a field belongs. Answers with the change report: exactly what changed, which
      of the delta's paths changed nothing, or that nothing did and nothing was written. A dry run
      forwards the caller's request to be told what the delta would do without writing it.
    signature: >-
      updateSpecGated(kind: string, id: string, delta: SpecDelta, dryRun?: boolean):
      SpecChangeReport
    returns: SpecChangeReport
    params:
      - name: kind
        type: string
        description: system, subsystem, component, interface, implementation or type
      - name: id
        type: string
        description: The stored spec's id
      - name: delta
        type: SpecDelta
        description: The partial change to merge, shaped like the spec, carrying the delta's own verbs
      - name: dryRun
        type: boolean
        description: Answer with what the delta would do and write nothing
        optional: true
  - name: moveMethods
    description: >-
      Move methods from one component to another as one gated write: lift each method's contract and
      its implementation (narrative, calls, sourcePath, technologies) onto the target, re-point
      every reference that named the old home, and judge the RESULT before anything reaches disk.
      The judgement is the point — a rename changes identity and can stay mechanical, but a move
      changes which component owns behaviour, which is exactly what the stereotype and dependency
      rules judge. On a refusal nothing is written and the report names the rule plus where the
      methods could live instead, because a refusal that only names the rule leaves the caller to
      search for a legal home by hand.
    signature: 'moveMethods(from: string, to: string, methods: string[], dryRun?: boolean): MethodMoveReport'
    returns: MethodMoveReport
    params:
      - name: from
        type: string
        description: The component id the methods currently belong to
      - name: to
        type: string
        description: The component id that should receive them
      - name: methods
        type: string[]
        description: The method names to move; every one must exist on the source contract
      - name: dryRun
        type: boolean
        description: >-
          Run the whole move, gate included, and answer with the report it would have produced
          without touching disk
        optional: true
  - name: writeSpec
    description: >-
      Write a whole spec as a create tool states it, at any level: require its parent, apply the
      restatement to the stored spec (status, carry, clear, removal), resolve narrative labels,
      judge a component candidate against the intrinsic rules, and persist — scaffolding the child
      project of a chained subsystem. A refused status, a missing parent, an unresolved label or an
      intrinsic error throws before anything touches disk. Answers with the write receipt, carrying
      the tests a changed or removed method invalidated.
    signature: 'writeSpec(restatement: SpecRestatement): SpecWriteReceipt'
    returns: SpecWriteReceipt
    params:
      - name: restatement
        type: SpecRestatement
        description: The spec as stated, with the fields its caller's input can express
  - name: deleteSpec
    description: >-
      Delete one spec of the named kind and report the tests that encode a method the deletion took
      away. The L0 cannot be deleted.
    signature: 'deleteSpec(kind: string, id: string): SpecDeletion'
    returns: SpecDeletion
    params:
      - name: kind
        type: string
        description: subsystem, component, interface, implementation or type
      - name: id
        type: string
        description: The spec id
status: complete
