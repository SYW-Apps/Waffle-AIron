id: iauthoring_orchestrator
name: Authoring Orchestrator Interface
description: >-
  The gated write workflows behind the authoring portal. A write that violates an intrinsic rule
  throws with the rule codes and nothing reaches disk; a write that changes nothing writes nothing
  and reports that it did not.
component: authoring_orchestrator
methods:
  - name: updateSpecGated
    description: >-
      Patch an existing spec of any level through the same judgement, by injecting it into the
      store's delta update as a write hook. The hook judges the MERGED spec, because a delta on its
      own cannot tell you the resulting componentType, and it is the resulting componentType that
      decides whether a field belongs; for a component or a contract it also judges the merged spec
      IN its tree (introducedFindings) and refuses an error-level doctrine edge or route collision
      the write itself introduces, exactly as it refuses an intrinsic error. A type position the
      delta writes as an alias is stored canonical and reported back; one the delta writes that is
      not canonical at all is refused, naming the replacement, while a stored one it leaves alone is
      not judged. Answers with the change report: exactly what changed, which of the delta's paths
      changed nothing, or that nothing did and nothing was written — the respellings applied, and
      every key the stored file carries that the schema will drop (strippedKeys), so no write loses
      data unannounced. A dry run takes the same path and is refused exactly as the write would be.
    signature: >-
      updateSpecGated(kind: WritableSpecKind, id: string, delta: SpecDelta, dryRun?: bool):
      SpecChangeReport
    returns: SpecChangeReport
    params:
      - name: kind
        type: WritableSpecKind
        description: The kind of spec the id names
      - name: id
        type: string
        description: The stored spec's id
      - name: delta
        type: SpecDelta
        description: The partial change to merge, shaped like the spec, carrying the delta's own verbs
      - name: dryRun
        type: bool
        description: Answer with what the delta would do and write nothing
        optional: true
  - name: moveMethods
    description: >-
      Move methods from one component to another as one gated write: lift each method's contract and
      its implementation (narrative, calls, sourcePath, technologies) onto the target, re-point
      every reference that named the old home, and judge the RESULT before anything reaches disk.
      The judgement is the point — a rename changes identity and can stay mechanical, but a move
      changes which component owns behaviour, which is exactly what the stereotype and dependency
      rules judge. On a refusal nothing is written and the report names the rule plus where the
      methods could live instead, because a refusal that only names the rule leaves the caller to
      search for a legal home by hand.
    signature: 'moveMethods(from: string, to: string, methods: list<string>, dryRun?: bool): MethodMoveReport'
    returns: MethodMoveReport
    params:
      - name: from
        type: string
        description: The component id the methods currently belong to
      - name: to
        type: string
        description: The component id that should receive them
      - name: methods
        type: list<string>
        description: The method names to move; every one must exist on the source contract
      - name: dryRun
        type: bool
        description: >-
          Run the whole move, gate included, and answer with the report it would have produced
          without touching disk
        optional: true
  - name: writeSpec
    description: >-
      Write a whole spec as a create tool states it, at any level: require its parent, apply the
      restatement to the stored spec (status, carry, clear, removal), resolve narrative labels, read
      an interface's or a type's type positions under the grammar, judge a component candidate
      against the intrinsic rules, judge a component or contract candidate in its tree for the
      doctrine edges and route collisions it introduces, and persist. A subsystem naming a
      projectPath is refused: that is the legacy mount form, and a member is declared in
      project.yaml `members` instead. An interface method naming a signatureFrom and also stating
      params or returns is refused (SIGNATURE_SOURCE_RESTATED): the source supplies them. A type
      position written as an alias is accepted and stored canonical, and reported back; one that is
      not canonical at all is refused (TYPE_EXPRESSION_INVALID, TYPE_POSITION_INVALID,
      TYPE_FORM_UNSUPPORTED, TYPE_NOT_NEUTRAL), naming the replacement. A refused status, a missing
      parent, an unresolved label, the mount form, a restated source, a non-canonical type, an
      intrinsic error or an introduced design error throws before anything touches disk. Answers
      with the write receipt, carrying the respellings applied and the tests a changed or removed
      method invalidated.
    signature: 'writeSpec(restatement: SpecRestatement): SpecWriteReceipt'
    returns: SpecWriteReceipt
    params:
      - name: restatement
        type: SpecRestatement
        description: The spec as stated, with the fields its caller's input can express
  - name: deleteSpec
    description: >-
      Delete one spec of the named kind together with everything it contains, and report what went.
      A container's content means nothing without it, so the deletion takes its subtree
      (spec_index.subtreeOf): a contract its implementations, a component its contracts and the
      members it owns, a subsystem its components and types. When another spec still references what
      would go (spec_index.referencesTo), the deletion is refused, naming each reference, because
      those are the error findings (invalid references) the write itself would introduce — the same
      stance the gate takes on every other write; `force` deletes anyway and answers the references
      it left dangling, for a staged teardown. `dryRun` answers the same plan — what would be
      removed, what references it, the tests to revisit — and removes nothing. The tests that encode
      a removed method are found before anything goes, while the implementations that place them
      still exist. The L0 cannot be deleted.
    signature: 'deleteSpec(kind: WritableSpecKind, id: string, dryRun?: bool, force?: bool): SpecDeletion'
    returns: SpecDeletion
    params:
      - name: kind
        type: WritableSpecKind
        description: 'The kind of spec the id names (never system: the L0 is not deleted)'
      - name: id
        type: string
        description: The spec id
      - name: dryRun
        type: bool
        description: Answer with the plan and remove nothing
        optional: true
      - name: force
        type: bool
        description: >-
          Delete even though other specs still reference what goes, leaving those references
          dangling
        optional: true
status: complete
