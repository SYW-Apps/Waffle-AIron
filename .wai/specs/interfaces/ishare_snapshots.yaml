id: ishare_snapshots
name: Share Snapshots Interface
description: >-
  Captures a view into an immutable snapshot payload set at share-creation / refresh. The one place
  a live view is frozen into what a link serves.
component: share_snapshots
methods:
  - name: capture
    description: >-
      For the authenticated caller and the target project + view, build exactly the requested
      artifact payloads (canvas model via the host core adapter; openapi / standalone html via the
      host surfaces adapter / renderer) and return an immutable snapshot ready to persist. The
      scoped canvas build applies the caller's own read authority, so a snapshot can never capture
      more than its creator may see. The canvas (model and html alike) carries the family's relation
      health as it was at capture — each relation with its compared-at time, read within the
      creator's reach, what was out of it unavailable — and no member record ids, so a shared page
      links to nothing its viewer may not open.
    signature: >-
      capture(principal: Principal, projectId: string, view: string, artifacts: string[]):
      ShareSnapshot
    returns: ShareSnapshot
    params:
      - name: principal
        type: Principal
        description: The already-authenticated caller whose read reach bounds what the snapshot may hold
      - name: projectId
        type: string
      - name: view
        type: string
      - name: artifacts
        type: string[]
lint:
  allow: []
status: complete
