id: idiagram_layout
name: Diagram Layout Interface
description: >-
  One arrangement question, answered in absolute coordinates: given the graph and which containers
  are collapsed, where does every visible box sit. Pure — the same input always gives the same
  boxes, which is what lets two exporters of different formats produce the same picture.
component: diagram_layout
methods:
  - name: arrange
    description: >-
      Place every visible component and every subsystem container in absolute coordinates, laying
      members out inside the pattern that owns them and wrapping rows at a fixed maximum width. A
      collapsed container contributes its header only and hides what it holds, so collapsing changes
      the arrangement rather than merely hiding part of it.
    signature: 'arrange(model: LayoutModel, collapsed: Record<string, boolean>): LayoutResult'
    returns: LayoutResult
    params:
      - name: model
        type: LayoutModel
        description: The subsystems, components and pattern membership to arrange
      - name: collapsed
        type: Record<string, boolean>
        description: Which containers are collapsed, keyed by id
    guarantees:
      - idempotent
status: complete
createdAt: '2026-09-20T16:38:35.933Z'
updatedAt: '2026-09-20T18:28:50.067Z'
