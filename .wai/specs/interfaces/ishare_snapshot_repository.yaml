id: ishare_snapshot_repository
name: Share Snapshot Repository Interface
description: >-
  Facade contract for the immutable captured payloads. Pure 1:1 forwarding: write to the registry,
  reads to the index.
component: share_snapshot_repository
methods:
  - name: put
    description: 'Facade: persist a captured snapshot through the registry.'
    signatureFrom: share_snapshot_registry.put
    guarantees:
      - atomic
  - name: get
    description: 'Facade: a captured snapshot by id through the index.'
    signatureFrom: share_snapshot_index.get
  - name: getArtifact
    description: >-
      Facade: one captured artifact of a snapshot through the index. For openapi, an optional
      portalId selects one per-portal document; with several captured specs and none selected the
      payload is an openapi_spec_index listing them, and with exactly one it is that document.
    signatureFrom: share_snapshot_index.getArtifact
status: complete
createdAt: '2026-07-17T22:29:54.324Z'
updatedAt: '2026-10-03T21:10:42.581Z'
