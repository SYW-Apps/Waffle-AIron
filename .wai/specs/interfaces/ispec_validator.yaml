id: ispec_validator
name: Spec Validator Interface
description: >-
  Interface contract for validating spec tree hierarchies, registry ownerships, project configs,
  subsystem boundaries, semantic wiring edges (dispatch-table capability contracts, dispatch-,
  lifecycle-, and declared-invocation-rooted reachability with register-step handoff edges,
  durability round-trip hydration, typed cross-subsystem seams, prose-claim realization), writer
  round-trip serializability, structural code↔spec conformance (every implementation and method
  sourcePath resolves to a real file within the project root; each contract method is realized in
  its own source file at its conformance tier, and every finding code it declares appears in that
  file), and dependency conformance (the runtime import graph between component-mapped files must
  match declared dependsOn/owns edges, with cross-subsystem imports justified by a declared edge to
  the target subsystem's published surface).
component: spec_validator
methods:
  - name: validateProject
    description: >-
      The owner's gate (stage 4): judge the bound project from its own files alone — its specs, its
      configuration and doctrine, its code, its lock, its externals lock and pinned snapshots, and
      the export tables of the members it contains — and nothing else. It never walks up to a
      parent, never reads a sibling's live tree and discovers nothing, so a project's verdict is the
      same from every root and with or without its family on disk. A reference into another project
      is judged before any severity (the rule context's resolveCrossProject): into a contained
      member, against that member's live L0 table; into a declared external, against the pinned
      snapshot only — the public name exists, its audience covers the project, the used member
      exists — and what cannot be compared is EXTERNAL_CHECK_UNAVAILABLE, never a pass. Every
      finding about such a reference carries its ReferenceResolution. A contained member's own specs
      are never judged here: its gate judges them under its own configuration. A --subsystem scope
      that names no loaded subsystem fails fast with SUBSYSTEM_NOT_FOUND. When the project declares
      externals the result carries a one-line hint that `validate --family` composes them against
      their live producers.
    signature: 'validateProject(options?: ValidationOptions, projectType?: string): ValidationResult'
    returns: ValidationResult
    params:
      - name: options
        type: ValidationOptions
        description: >-
          What this run may vary: rules, project type, subsystem scope, pre-loaded packs and full
          strictness. A bare RulesConfig is accepted for callers that only override severities
        optional: true
      - name: projectType
        type: string
        description: >-
          The project type whose doctrine applies, when it is not carried on the options; defaults
          to backend
        optional: true
  - name: validateRegistry
    description: Validates legacy/resolved Agent registry constraints
    signature: 'validateRegistry(registry: Registry, rules: RulesConfig): ValidationResult'
    returns: ValidationResult
  - name: validateProjectConfig
    description: Validates project.yaml configuration file structure
    signature: 'validateProjectConfig(config: ProjectConfig): ValidationResult'
    returns: ValidationResult
  - name: validateAsComplete
    description: >-
      The owner's gate at full strictness, treating every spec as complete (no draft severity
      relaxation) and mutating nothing — the gate behind `wairon lock`. It judges the bound project
      alone, exactly as validateProject does, so a member locked at its own root and one locked
      inside its family are held to one verdict; a member's own findings never block its parent's
      lock (a parent that refuses on an unapproved member is stage 5). The strictness flip happens
      inside the run, because invalidating the spec cache would discard any status set beforehand.
    signature: 'validateAsComplete(options?: ValidationOptions, projectType?: string): ValidationResult'
    returns: ValidationResult
    params:
      - name: options
        type: ValidationOptions
        description: >-
          What this run may vary; `treatAllAsComplete` is set by this method and not the caller's to
          unset
        optional: true
      - name: projectType
        type: string
        description: The project type whose doctrine applies; defaults to backend
        optional: true
  - name: listRules
    description: >-
      Return the active conformance rule set — the built-in rules plus the loaded programmatic pack
      rules, in run order — for display by `wairon rules list`. Loads and registers the governing
      packs, then reads the composed sequence.
    signature: 'listRules(): SddRule[]'
    returns: SddRule[]
    params: []
  - name: validateComponentCandidate
    description: >-
      Run the spec-scoped rules against one component that is not yet written: a rule context
      holding only the candidate (a stub system and no other specs), the rule set seeded with the
      built-ins and any pack rules, then only the candidate's own findings, split by severity. Draft
      status relaxes completeness findings as in a tree run; a misplaced field is an error, and the
      write is refused.
    signature: >-
      validateComponentCandidate(candidate: ComponentSpec, opts?: CandidateOptions):
      CandidateVerdict
    returns: CandidateVerdict
    params:
      - name: candidate
        type: ComponentSpec
        description: The component about to be written
      - name: opts
        type: CandidateOptions
        description: Rules config, project type and loaded packs
        optional: true
  - name: computeGateStateId
    description: >-
      Gather the content identity, the governing extensions, the project's gate config, the consumed
      contract inputs and the built-in rule sequence, and compute the gate identity from them. Every
      input is the bound project's own (its tree including the members it contains, its doctrine,
      its externals lock and pinned snapshots, its foreign surface snapshots) — never an ancestor's
      state — so a lock taken at a member's own root and one taken inside its family record the same
      identity. With resolve-through-parent gone, the verdict a lock certifies no longer depends on
      an ancestor either.
    signature: 'computeGateStateId(): StateId'
    returns: StateId
    params: []
  - name: findTestsReferencing
    description: >-
      Find the tests that encode a given set of methods, resolving the project's declared test roots
      before handing the walk to the source analyzer. A project that declares none answers empty.
    signature: >-
      findTestsReferencing(methods: MethodImplementation[], projectRoot: string, testRoots:
      string[]): TestsToRevisit[]
    returns: TestsToRevisit[]
    params:
      - name: methods
        type: MethodImplementation[]
        description: The methods to look for
      - name: projectRoot
        type: string
        description: The root the test roots are resolved within
      - name: testRoots
        type: string[]
        description: Project-relative test directories; empty answers empty
    guarantees:
      - idempotent
  - name: builtinProfileIds
    description: >-
      The ids of wairon's built-in architectural profiles — the built-in half of the profiles a
      projectType may name. A read of a bundled constant; never fails.
    signature: 'builtinProfileIds(): string[]'
    returns: string[]
    params: []
  - name: builtinProjectKinds
    description: >-
      The ids of wairon's built-in composite project kinds (fullstack, system-of-systems, monorepo):
      legal projectType values that are not architectural profiles and carry no doctrine of their
      own. A read of a bundled constant; never fails.
    signature: 'builtinProjectKinds(): string[]'
    returns: string[]
    params: []
status: design
