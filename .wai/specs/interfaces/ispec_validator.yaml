id: ispec_validator
name: Spec Validator Interface
description: >-
  Interface contract for validating spec tree hierarchies, registry ownerships, project configs,
  subsystem boundaries, semantic wiring edges (dispatch-table capability contracts, dispatch-,
  lifecycle-, and declared-invocation-rooted reachability with register-step handoff edges,
  durability round-trip hydration, typed cross-subsystem seams, prose-claim realization), writer
  round-trip serializability, structural code↔spec conformance (every implementation and method
  sourcePath resolves to a real file within the project root; each contract method is realized in
  its own source file at its conformance tier, and every finding code it declares appears in that
  file), and dependency conformance (the runtime import graph between component-mapped files must
  match declared dependsOn/owns edges, with cross-subsystem imports justified by a declared edge to
  the target subsystem's published surface).
component: spec_validator
methods:
  - name: validateProject
    description: >-
      The owner's gate (stage 4): judge the bound project from its own files alone — its specs and
      its PARTS' specs (stage 8: a part's subsystems are the project's own, whether contained, in a
      `../` sibling checkout or fetched from git at the pinned commit; a part that cannot be read is
      PART_UNAVAILABLE, never a pass), its configuration and doctrine, its code, its lock, its
      externals lock and pinned snapshots, and the export tables of the project members it contains
      — and nothing else. It never walks up to a parent, never reads a sibling's live tree and
      discovers nothing, so a project's verdict is the same from every root and with or without its
      family on disk. A reference into another project is judged before any severity (the rule
      context's resolveCrossProject): into a contained project member, against that member's live L0
      table; into a declared external or a referenced project member (a `../`, git or hosted
      source), against the pinned snapshot only — the public name exists, its audience covers the
      project, the used member exists — and what cannot be compared is EXTERNAL_CHECK_UNAVAILABLE,
      never a pass. Every finding about such a reference carries its ReferenceResolution. A project
      member's own specs are never judged here: its gate judges them under its own configuration.
      Opened at a non-contained PART (stage 8; a contained part's directory resolves to its parent's
      root), the gate judges the part's specs alone against its pinned parent excerpt under the
      excerpt's governing configuration, skipping the rules flagged needsWholeTree and naming them
      (PART_JUDGED_ALONE, notice), or — with no pin — judges nothing and says "part of <parent>;
      validate from the parent" (PART_UNPINNED, warning). A --subsystem scope that names no loaded
      subsystem fails fast with SUBSYSTEM_NOT_FOUND. When the project declares externals the result
      carries a one-line hint that `validate --family` composes them against their live producers.
    signature: 'validateProject(options?: ValidationOptions, projectType?: string): ValidationResult'
    returns: ValidationResult
    params:
      - name: options
        type: ValidationOptions
        description: >-
          What this run may vary: rules, project type, subsystem scope, pre-loaded packs and full
          strictness. A bare RulesConfig is accepted for callers that only override severities
        optional: true
      - name: projectType
        type: string
        description: >-
          The project type whose doctrine applies, when it is not carried on the options; defaults
          to backend
        optional: true
    findings:
      - code: PART_UNPINNED
        severity: warning
        summary: >-
          A part opened alone has no pinned parent excerpt: part of <parent>; validate from the
          parent.
      - code: PART_JUDGED_ALONE
        severity: notice
        summary: >-
          A part was judged alone against its pinned parent excerpt; the named whole-system rules
          were skipped and the full verdict is the parent's.
  - name: validateRegistry
    description: Validates legacy/resolved Agent registry constraints
    signature: 'validateRegistry(registry: Registry, rules: RulesConfig): ValidationResult'
    returns: ValidationResult
  - name: validateProjectConfig
    description: Validates project.yaml configuration file structure
    signature: 'validateProjectConfig(config: ProjectConfig): ValidationResult'
    returns: ValidationResult
  - name: validateAsComplete
    description: >-
      The owner's gate at full strictness, treating every spec as complete (no draft severity
      relaxation) and mutating nothing — the gate behind `wairon lock`. It judges the bound project
      alone, exactly as validateProject does, so a member locked at its own root and one locked
      inside its family are held to one verdict; a member's own findings never block its parent's
      lock (a parent that requires approved members refuses in the lock workflow, on the members'
      approval states, not here). Its result carries `analysis`: the code-conformance half
      summarized with the analyzer identity (validator version, code doctrine digest, weakest
      analysis grade), so the lock can gate and record on the design half alone
      (ValidationResult.designOnly) and record the code half beside it. The strictness flip happens
      inside the run, because invalidating the spec cache would discard any status set beforehand.
    signature: 'validateAsComplete(options?: ValidationOptions): ValidationResult'
    returns: ValidationResult
    params:
      - name: options
        type: ValidationOptions
        description: >-
          What this run may vary; `treatAllAsComplete` is set by this method and not the caller's to
          unset
        optional: true
  - name: listRules
    description: >-
      Return the active conformance rule set — the built-in rules plus the loaded programmatic pack
      rules, in run order — for display by `wairon rules list`. Loads and registers the governing
      packs, then reads the composed sequence.
    signature: 'listRules(): list<SddRule>'
    returns: list<SddRule>
    params: []
  - name: validateComponentCandidate
    description: >-
      Run the spec-scoped rules against one component that is not yet written: a rule context
      holding only the candidate (a stub system and no other specs), the rule set seeded with the
      built-ins and any pack rules, then only the candidate's own findings, split by severity. Draft
      status relaxes completeness findings as in a tree run; a misplaced field is an error, and the
      write is refused.
    signature: >-
      validateComponentCandidate(candidate: ComponentSpec, opts?: CandidateOptions):
      CandidateVerdict
    returns: CandidateVerdict
    params:
      - name: candidate
        type: ComponentSpec
        description: The component about to be written
      - name: opts
        type: CandidateOptions
        description: Rules config, project type and loaded packs
        optional: true
  - name: computeGateStateId
    description: >-
      Gather the project's OWN content identity, the governing extensions, the project's gate config
      (type, rule tuning, composition), its own consumed contract inputs, the built-in rule
      sequence, and each direct member's composition subject — read from the member's own lock
      record, never recomputed and never its specs — and compute the gate identity from them. Every
      input is the bound project's own or a direct member's recorded decision, never an ancestor's
      state and never a member's tree, so a lock taken at a member's own root and one taken inside
      its family record the same identity, and a parent's identity costs its own tree plus one lock
      file per direct member. This closes the stage-4 inconsistency where a parent's identity hashed
      its members' specs and pins although its lock gate never judged them.
    signature: 'computeGateStateId(): StateId'
    returns: StateId
    params: []
  - name: findTestsReferencing
    description: >-
      Find the tests that encode a given set of methods, resolving the project's declared test roots
      before handing the walk to the source analyzer. A project that declares none answers empty.
    signature: >-
      findTestsReferencing(methods: list<MethodImplementation>, projectRoot: string, testRoots:
      list<string>): list<TestsToRevisit>
    returns: list<TestsToRevisit>
    params:
      - name: methods
        type: list<MethodImplementation>
        description: The methods to look for
      - name: projectRoot
        type: string
        description: The root the test roots are resolved within
      - name: testRoots
        type: list<string>
        description: Project-relative test directories; empty answers empty
    guarantees:
      - idempotent
  - name: builtinProfileIds
    description: >-
      The ids of wairon's built-in architectural profiles — the built-in half of the profiles a
      projectType may name. A read of a bundled constant; never fails.
    signature: 'builtinProfileIds(): list<string>'
    returns: list<string>
    params: []
  - name: builtinProjectKinds
    description: >-
      The ids of wairon's built-in composite project kinds (fullstack, system-of-systems, monorepo):
      legal projectType values that are not architectural profiles and carry no doctrine of their
      own. A read of a bundled constant; never fails.
    signature: 'builtinProjectKinds(): list<string>'
    returns: list<string>
    params: []
status: complete
