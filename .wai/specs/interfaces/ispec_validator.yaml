id: ispec_validator
name: Spec Validator Interface
description: >-
  Interface contract for validating spec tree hierarchies, registry ownerships, project configs,
  subsystem boundaries, semantic wiring edges (dispatch-table capability contracts, dispatch-,
  lifecycle-, and declared-invocation-rooted reachability with register-step handoff edges,
  durability round-trip hydration, typed cross-subsystem seams, prose-claim realization), writer
  round-trip serializability, structural code↔spec conformance (every implementation and method
  sourcePath resolves to a real file within the project root; each contract method is realized in
  its own source file at its conformance tier, and every finding code it declares appears in that
  file), and dependency conformance (the runtime import graph between component-mapped files must
  match declared dependsOn/owns edges, with cross-subsystem imports justified by a declared edge to
  the target subsystem's published surface).
component: spec_validator
methods:
  - name: validateSddTree
    description: >-
      Performs full SDD spec tree structural validation and returns results. A --subsystem scope
      that names no loaded subsystem fails fast with SUBSYSTEM_NOT_FOUND (listing the known
      subsystems) rather than silently passing. When the tree is a chained subproject whose parent
      is on disk (detected via the loader's findChainingParent) and it still holds references no
      surface snapshot covers, the verdict is resolved THROUGH the parent: the top root is validated
      scoped to the mount chain, its findings are renamed into the child's own ids, and they are
      merged with the child's own findings — never replacing them, never changing a severity — and
      the result names the root it was resolved through. A credential narrowed to the child alone
      never reaches the parent this way. When no usable parent is reachable, uncovered references
      fall back to the standalone verdict.
    signature: 'validateSddTree(): ValidationResult'
    returns: ValidationResult
  - name: validateRegistry
    description: Validates legacy/resolved Agent registry constraints
    signature: 'validateRegistry(registry: Registry, rules: RulesConfig): ValidationResult'
    returns: ValidationResult
  - name: validateProjectConfig
    description: Validates project.yaml configuration file structure
    signature: 'validateProjectConfig(config: ProjectConfig): ValidationResult'
    returns: ValidationResult
  - name: validateAsComplete
    description: >-
      Run full SDD tree validation at full strictness, treating every spec as complete (no draft
      severity relaxation) and mutating nothing. Returns the as-complete results.
    signature: 'validateAsComplete(): ValidationResult'
    returns: ValidationResult
  - name: listRules
    description: >-
      Return the active conformance rule set — the built-in rules plus the loaded programmatic pack
      rules, in run order — for display by `wairon rules list`. Loads and registers the governing
      packs, then reads the composed sequence.
    signature: 'listRules(): SddRule[]'
    returns: SddRule[]
    params: []
  - name: validateComponentCandidate
    description: >-
      Run the spec-scoped rules against one component that is not yet written: a rule context
      holding only the candidate (a stub system and no other specs), the rule set seeded with the
      built-ins and any pack rules, then only the candidate's own findings, split by severity. Draft
      status relaxes completeness findings as in a tree run; a misplaced field is an error, and the
      write is refused.
    signature: >-
      validateComponentCandidate(candidate: ComponentSpec, opts?: CandidateOptions):
      CandidateVerdict
    returns: CandidateVerdict
    params:
      - name: candidate
        type: ComponentSpec
        description: The component about to be written
      - name: opts
        type: CandidateOptions
        description: Rules config, project type and loaded packs
        optional: true
  - name: computeGateStateId
    description: >-
      Gather the content identity, the governing extensions, the project's gate config, the consumed
      contract inputs and the built-in rule sequence, and compute the gate identity from them.
    signature: 'computeGateStateId(): StateId'
    returns: StateId
    params: []
  - name: resolveThroughParent
    description: >-
      Resolve this tree's verdict THROUGH its chained parent: walk up to the top root collecting the
      mount chain, validate there scoped to that chain with the parent's own doctrine — for each
      rule the stricter of the parent's and this project's severity, the same as-complete
      strictness, and without resolving again — and rename the findings into this project's own ids
      for the caller to merge. Null when no usable parent is reachable (its L0 missing, the mount
      unknown, or reach denied), and the caller then keeps the standalone verdict. Reach-gated: the
      walk never climbs above the bound request's top project root.
    signature: >-
      resolveThroughParent(boundRoot: string, treatAllAsComplete: boolean, childRules?:
      RulesConfig): ParentResolution
    returns: ParentResolution
    params:
      - name: boundRoot
        type: string
        description: The root this tree was validated at — where the walk up starts
      - name: treatAllAsComplete
        type: boolean
        description: Judge the parent's run at the same as-complete strictness as this one
      - name: childRules
        type: RulesConfig
        description: >-
          This project's own rule severities; each rule is judged at the stricter of the parent's
          and these
        optional: true
  - name: findTestsReferencing
    description: >-
      Find the tests that encode a given set of methods, resolving the project's declared test roots
      before handing the walk to the source analyzer. A project that declares none answers empty.
    signature: >-
      findTestsReferencing(methods: MethodImplementation[], projectRoot: string, testRoots:
      string[]): TestsToRevisit[]
    returns: TestsToRevisit[]
    params:
      - name: methods
        type: MethodImplementation[]
        description: The methods to look for
      - name: projectRoot
        type: string
        description: The root the test roots are resolved within
      - name: testRoots
        type: string[]
        description: Project-relative test directories; empty answers empty
    guarantees:
      - idempotent
status: complete
