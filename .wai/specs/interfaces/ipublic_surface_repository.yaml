id: ipublic_surface_repository
name: Public Surface Repository Interface
description: >-
  Facade contract for redacted project public-surface snapshots. This is the only hosted read model
  other projects may use to understand a target project's public contract.
component: public_surface_repository
methods:
  - name: replaceSnapshot
    description: >-
      Replace one project's public-surface snapshot after the caller validated that every exported
      interface maps to an L1 public surface.
    signatureFrom: public_surface_registry.replaceSnapshot
    guarantees:
      - atomic
  - name: getSnapshot
    description: Return the latest public-surface snapshot for a project, or null if none exists.
    signatureFrom: public_surface_index.getSnapshot
  - name: findInterface
    description: Return one public interface summary from a project's snapshot, or null if absent.
    signatureFrom: public_surface_index.findInterface
status: complete
createdAt: '2026-07-08T21:13:24.102Z'
updatedAt: '2026-10-03T21:10:30.285Z'
