id: iproject_policy_orchestrator
name: Project Policy Orchestrator Interface
description: >-
  Contract for profile-aware hosted project initialization and pack/profile policy enforcement.
  Credential-bearing methods authenticate the caller and resolve their permissions through the
  authorization seam; two pre-authorized entries (executeApprovedInit, evaluateInitRequest) serve
  the project-lifecycle chain and are never exposed on a portal. Identity-provider (SSO)
  configuration is deferred to Phase 5.
component: project_policy_orchestrator
methods:
  - name: initializeProjectWithProfile
    description: >-
      Authenticate the caller credential and resolve the caller's project:create permission over the
      request's required owner unit via the authorization seam — the resolved value must be yes (an
      approval-valued caller must use the execute-primary project-lifecycle path instead) — then
      perform the same profile-aware initialization body as executeApprovedInit: validate the
      request against the active pack policy (throwing on violations under an enforcing policy),
      create the hosted project, apply the instance's required/default declarative packs via the
      pack registry, record the resolved profile selection into the project's config, APPLY that
      selection so it actually governs the new project (the first recorded id that resolves —
      project kind, built-in, or pack-contributed profile whose pack is vendored as part of the same
      step — is written as projectType; the remaining ids stay recorded but unapplied, since
      projectType takes exactly one profile), and audit the initialization including the applied
      profile and any unapplied remainder. A selection no tier can resolve leaves the default
      projectType in place and is recorded in the audit rather than failing project creation.
      Returns the created hosted project record.
    signature: >-
      initializeProjectWithProfile(credential: string, request: ProjectInitRequest):
      HostedProjectRecord
    returns: HostedProjectRecord
    params:
      - name: credential
        type: string
      - name: request
        type: ProjectInitRequest
    guarantees:
      - atomic
  - name: evaluateProjectPolicy
    description: >-
      Authenticate the caller credential and resolve the caller's project:write permission over the
      target project through the authorization seam (must be yes; an instance-admin bypasses),
      resolve the hosted project, and evaluate its active packs and recorded profile selection
      against the active instance pack policy without side effects. Also reports the profile REALITY
      alongside policy compliance: governingProfileId (the projectType the validator actually
      enforces) and unappliedProfileIds (recorded selection ids that are not governing) — so a
      profile that was selected, or required by policy, but never applied is visible instead of
      passing as compliant.
    signature: 'evaluateProjectPolicy(credential: string, projectId: string): PolicyEvaluationResult'
    returns: PolicyEvaluationResult
    params:
      - name: credential
        type: string
      - name: projectId
        type: string
  - name: reconcileProjectPolicy
    description: >-
      Authenticate the caller credential and resolve the caller's project:write permission over the
      target project through the authorization seam (must be yes; an instance-admin bypasses), then
      — as an EXPLICIT, authorized reconciliation — evaluate the project against the active instance
      pack policy and apply the missing required/default declarative packs that the server-global
      set can resolve, REGARDLESS of enforcementMode. This action only ever applies the INSTANCE
      POLICY's own required/default packs, never discretionary changes, which is why project:write
      (not project:admin) suffices. Required/default packs the server-global set cannot resolve are
      reported as unresolvedPacks (never silently skipped); enforcementMode governs init-time
      blocking and automatic reconciliation, not this explicit action. Reconciliation also REPAIRS
      the governing profile, but only when it is broken or non-compliant: when instance policy
      requires profiles and none of the required ids is governing, or when the recorded projectType
      resolves to no loaded profile, apply the first resolvable id (required ids first, then the
      recorded selection) through the pack registry's ensure seam — vendoring its contributing pack
      — and write it as projectType. A resolvable, policy-compliant projectType is reported, never
      overwritten, so a deliberate local choice survives reconciliation. Audit the reconciliation
      and return the post-reconciliation PolicyEvaluationResult, including governingProfileId and
      any unapplied selection remainder.
    signature: 'reconcileProjectPolicy(credential: string, projectId: string): PolicyEvaluationResult'
    returns: PolicyEvaluationResult
    params:
      - name: credential
        type: string
      - name: projectId
        type: string
  - name: getPackPolicy
    description: >-
      Authenticate the caller credential (any authenticated principal may read the policy — agents
      need to see what initialization requires) and return the active hosted instance pack/profile
      policy, substituting the documented permissive default (empty pack lists,
      requireProfileSelection false, enforcementMode 'warn') when none has ever been configured.
    signature: 'getPackPolicy(credential: string): InstancePackPolicy'
    returns: InstancePackPolicy
    params:
      - name: credential
        type: string
  - name: setPackPolicy
    description: >-
      Authenticate the caller credential and resolve the caller's project:admin permission at
      INSTANCE scope through the authorization seam (must be yes — the pack policy governs every
      project's initialization; a project- or unit-scoped admin does NOT suffice), stamp updatedBy
      from the authenticated caller, replace the active pack/profile policy wholesale through the
      repository, and audit the change at security level.
    signature: 'setPackPolicy(credential: string, policy: InstancePackPolicy): InstancePackPolicy'
    returns: InstancePackPolicy
    params:
      - name: credential
        type: string
      - name: policy
        type: InstancePackPolicy
    guarantees:
      - atomic
  - name: executeApprovedInit
    description: >-
      Pre-authorized entry for the project-lifecycle chain: performs NO authentication — the caller
      (project_lifecycle_orchestrator) has already enforced permission-based authorization; never
      exposed on any portal. Validates the request against the active pack policy (under an
      enforcing policy, throws on violations), creates the hosted project via
      admin_orchestrator.executeApprovedCreate, applies the instance's requiredGlobalPacks and
      defaultProjectPacks as declarative packs via the pack registry, records the resolved
      ProjectProfileSelection into the project's config, APPLIES that selection as the project's
      governing projectType (first resolvable id, contributing pack vendored through the pack
      registry's ensure seam; remaining ids recorded but unapplied; an entirely unresolvable
      selection leaves the default projectType and is reported in the audit rather than failing
      creation), and audits 'project.init.policy'. This is the single initialization body shared by
      the gated portal path (initializeProjectWithProfile) and approval execution.
    signature: 'executeApprovedInit(request: ProjectInitRequest): HostedProjectRecord'
    returns: HostedProjectRecord
    params:
      - name: request
        type: ProjectInitRequest
  - name: evaluateInitRequest
    description: >-
      Pure pre-creation policy evaluation with no side effects and no authentication (the caller
      authenticated upstream): read the active pack policy (or the documented permissive default
      when unset) and evaluate the ProjectInitRequest against it — flagging a missing required
      profile selection, requested blocked packs, and unknown profile ids — returning a
      PolicyEvaluationResult. Used by the project lifecycle orchestrator to gate a project-init
      request before executing it or creating an approval; never exposed on any portal.
    signature: 'evaluateInitRequest(request: ProjectInitRequest): PolicyEvaluationResult'
    returns: PolicyEvaluationResult
    params:
      - name: request
        type: ProjectInitRequest
  - name: getProjectConfig
    description: >-
      Authenticate the caller credential and resolve the caller's project:read permission over the
      target project through the authorization seam (must be yes; an instance-admin bypasses),
      resolve and bind the project's isolated root, then read the project's project-level
      configuration AND whether it is genuinely in force: the projectType from project.yaml
      (defaulting to 'backend' when the config omits it), whether the project currently holds a lock
      (via the core adapter's lock record), where that profile comes from and whether it resolves at
      all (against the project-scoped profile catalog — built-ins, the project's own registered
      packs, the server-global packs), the recorded profile-selection ids that are not the governing
      one, and the subsystems declaring their own profile (which the project-level profile does not
      govern). Returns the assembled ProjectConfigView. No side effects: an unresolvable recorded
      projectType is REPORTED via profileResolvable, never repaired here.
    signature: 'getProjectConfig(credential: string, projectId: string): ProjectConfigView'
    returns: ProjectConfigView
    params:
      - name: credential
        type: string
      - name: projectId
        type: string
  - name: setProjectType
    description: >-
      Authenticate the caller credential and resolve the caller's project:write permission over the
      target project through the authorization seam (must be yes; an instance-admin bypasses),
      resolve and bind the project's isolated root, then make the requested projectType actually
      GOVERN the project rather than merely recording a name: ensure the profile is resolvable
      through the pack registry's ensure-profile-installed seam (a built-in profile or project kind
      and an already-registered pack profile pass through unchanged; a profile contributed only by a
      server-global pack has that pack vendored into the project and registered in extensions.packs;
      an id no tier contributes is REFUSED, because writing it would silently disable the whole
      profile doctrine), write the profile into the project's project.yaml, and fold the applied id
      to the FRONT of the project's recorded profileSelection — keeping the other recorded ids and
      stamping selectedBy/selectedAt from the authenticated caller, so the record and the governing
      reality agree. Returns the enriched ProjectConfigView: projectType, lock status,
      profileSource, profileResolvable, any adoptedPackName, the unapplied selection remainder, and
      the subsystems whose own profile overrides the project-level one.
    signature: 'setProjectType(credential: string, projectId: string, projectType: string): ProjectConfigView'
    returns: ProjectConfigView
    params:
      - name: credential
        type: string
      - name: projectId
        type: string
      - name: projectType
        type: string
status: complete
