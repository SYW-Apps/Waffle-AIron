id: iidentity_orchestrator
name: Identity Orchestrator Interface
description: >-
  Contract for hosted identity workflows behind the identity portal: headless SSO login
  (unauthenticated start/complete with first-login user provisioning), plus credential-authenticated
  management of users, grants, user-bound MCP/API tokens, identity-provider (SSO) configuration, and
  admin-only audit read/count. Follows the control-plane house pattern: every credential-bearing
  method authenticates via the auth specialist before any effect. The SSO start/complete pair
  carries no credential and derives trust entirely from the signed SSO state and the provider code
  exchange.
component: identity_orchestrator
methods:
  - name: mintToken
    description: >-
      Authenticate the caller, authorize token delegation against the caller's grants (key:manage
      covering every requested project, or an instance-wide admin grant), validate the requested
      projects exist, mint a user-bound MCP/API token, persist only its hashed credential record
      with owner/grant metadata, and append a redacted audit event. Returns the plaintext token
      exactly once.
    signature: 'mintToken(credential: string, request: TokenMintRequest): string'
    returns: string
    params:
      - name: credential
        type: string
      - name: request
        type: TokenMintRequest
  - name: revokeToken
    description: >-
      Authenticate the caller, authorize key management for the token's owner and project scope,
      revoke the credential record, and append a redacted audit event.
    signature: 'revokeToken(credential: string, tokenId: string): void'
    returns: void
    params:
      - name: credential
        type: string
      - name: tokenId
        type: string
  - name: replaceUserGrants
    description: >-
      Authenticate the caller, authorize grant administration (instance-wide admin grant required),
      replace the user's grants wholesale through the user repository, and append a redacted audit
      event.
    signature: >-
      replaceUserGrants(credential: string, userId: string, grants: ProjectGrant[]):
      HostedUserRecord
    returns: HostedUserRecord
    params:
      - name: credential
        type: string
      - name: userId
        type: string
      - name: grants
        type: ProjectGrant[]
    guarantees:
      - atomic
  - name: listUsers
    description: >-
      Authenticate the caller, authorize user administration, and list hosted users optionally
      narrowed to one project's grant holders.
    signature: 'listUsers(credential: string, project: string): HostedUserRecord[]'
    returns: HostedUserRecord[]
    params:
      - name: credential
        type: string
      - name: project
        type: string
        optional: true
  - name: queryAuditEvents
    description: >-
      Authenticate the caller, authorize admin-only audit read access, and return redacted audit
      events matching the query.
    signature: 'queryAuditEvents(credential: string, query: AuditQuery): AuditEvent[]'
    returns: AuditEvent[]
    params:
      - name: credential
        type: string
      - name: query
        type: AuditQuery
  - name: pruneAuditEvents
    description: >-
      Authenticate the caller, authorize admin-only audit administration, apply the instance's
      active retention policy, append a redacted audit event for the prune itself, and return the
      number of events removed.
    signature: 'pruneAuditEvents(credential: string): number'
    returns: number
    params:
      - name: credential
        type: string
  - name: upsertUser
    description: >-
      Authenticate the caller, authorize user administration (instance-wide admin grant), create or
      update the hosted user through the user repository, and append a redacted audit event
      distinguishing creation from update.
    signature: 'upsertUser(credential: string, record: HostedUserRecord): HostedUserRecord'
    returns: HostedUserRecord
    params:
      - name: credential
        type: string
      - name: record
        type: HostedUserRecord
    guarantees:
      - atomic
  - name: setUserStatus
    description: >-
      Authenticate the caller, authorize user administration (instance-wide admin grant), set the
      user's lifecycle status through the user repository, and append a redacted audit event.
    signature: 'setUserStatus(credential: string, userId: string, status: string): HostedUserRecord'
    returns: HostedUserRecord
    params:
      - name: credential
        type: string
      - name: userId
        type: string
      - name: status
        type: string
    guarantees:
      - atomic
  - name: startSsoLogin
    description: >-
      Begin a headless SSO login: resolve the enabled identity-provider configuration through the
      policy repository, generate a nonce, sign an SSO state binding providerId, nonce, and
      redirectUri via the auth specialist, build the provider authorization URL through the identity
      provider adapter, append a best-effort sso.start (info) audit event, and return the
      authorization URL. Starting a login is unauthenticated by nature — no caller credential is
      required or accepted; the signed state is the only integrity anchor carried into the callback.
    signature: 'startSsoLogin(providerId: string, redirectUri: string): string'
    returns: string
    params:
      - name: providerId
        type: string
      - name: redirectUri
        type: string
  - name: completeSsoLogin
    description: >-
      Complete a headless SSO login: verify the signed SSO state via the auth specialist (a tampered
      or expired state is rejected), resolve the bound identity-provider configuration, exchange the
      authorization code and resolve the external subject through the provider adapter, look up the
      hosted user by issuer + external subject, provision a first-login active user record with
      empty grants when absent (an admin assigns grants afterwards), mint a user-bound MCP/API token
      for the resolved user persisting only its hashed credential record, append a best-effort
      sso.login (security) audit event, and return the plaintext token exactly once. Inlines
      first-login provisioning — there is no separate resolve-or-create method. Unauthenticated by
      nature: no caller credential is required or accepted.
    signature: 'completeSsoLogin(state: string, code: string): string'
    returns: string
    params:
      - name: state
        type: string
      - name: code
        type: string
  - name: listIdentityProviders
    description: >-
      Authenticate the caller, authorize instance-admin-only identity-provider administration, and
      return every configured identity provider by forwarding to the policy repository. Not audited
      (a read).
    signature: 'listIdentityProviders(credential: string): IdentityProviderConfig[]'
    returns: IdentityProviderConfig[]
    params:
      - name: credential
        type: string
  - name: upsertIdentityProvider
    description: >-
      Authenticate the caller, authorize instance-admin-only identity-provider administration,
      create or update one identity-provider configuration through the policy repository, append a
      redacted idp.upsert (security) audit event, and return the stored config. The config carries a
      clientSecretRef, never a raw secret.
    signature: >-
      upsertIdentityProvider(credential: string, config: IdentityProviderConfig):
      IdentityProviderConfig
    returns: IdentityProviderConfig
    params:
      - name: credential
        type: string
      - name: config
        type: IdentityProviderConfig
    guarantees:
      - atomic
  - name: removeIdentityProvider
    description: >-
      Authenticate the caller, authorize instance-admin-only identity-provider administration,
      remove one identity-provider configuration by id through the policy repository (an unknown id
      is rejected), and append a redacted idp.remove (security) audit event.
    signature: 'removeIdentityProvider(credential: string, id: string): void'
    returns: void
    params:
      - name: credential
        type: string
      - name: id
        type: string
    guarantees:
      - atomic
  - name: countAuditEvents
    description: >-
      Authenticate the caller, authorize admin-only audit read access (audit:read or an
      instance-wide admin grant), and return the count of redacted audit events matching the query
      by forwarding to the audit repository. Not audited (a read).
    signature: 'countAuditEvents(credential: string, query: AuditQuery): number'
    returns: number
    params:
      - name: credential
        type: string
      - name: query
        type: AuditQuery
status: complete
