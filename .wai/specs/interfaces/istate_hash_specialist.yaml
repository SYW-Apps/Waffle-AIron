id: istate_hash_specialist
name: State Hash Specialist Interface
description: >-
  Contract for computing the deterministic content identity of the spec tree, and the identity of
  the GATE that validated it (spec tree + governing doctrine).
component: state_hash_specialist
methods:
  - name: hashSpecTree
    description: >-
      Load every spec via the loader, canonicalize (stable key order, normalized serialization), and
      digest into a StateId. Pure and reproducible.
    signature: 'hashSpecTree(): StateId'
    returns: StateId
    guarantees:
      - idempotent
  - name: hashGateState
    description: >-
      Digest the spec tree TOGETHER WITH the governing doctrine and the consumed contract inputs
      into a gate StateId: what the conformance gate actually consisted of when it passed. Doctrine
      and inputs are parameters, not loads, so this stays pure and reproducible. Only doctrine that
      can change a conformance verdict participates — pack identities, merged profiles and language
      tables, patterns, guarantee tokens, assertions, and programmatic rule names/codes; pack skills
      and instruction blocks are excluded because they never affect a verdict. The inputs are the
      CONTENT of the stored surface snapshots a verdict can consult (provenance excluded), so
      swapping a pinned contract that changes a verdict changes the identity, while re-pinning an
      unchanged one does not. The returned algorithm is marked (sha256+doctrine+inputs) so a
      content-only StateId, or a gate StateId taken before inputs were covered, never compares
      equal.
    signature: 'hashGateState(doctrine: LoadedExtensions, inputs: string[]): StateId'
    returns: StateId
    params:
      - name: doctrine
        type: LoadedExtensions
        description: The governing extension packs, already loaded and merged by the caller.
      - name: inputs
        type: string[]
        description: >-
          The consumed contract inputs: one provenance-free content key per stored surface snapshot
          a verdict can consult (this root's and each chained mount's), in any order — the
          specialist orders them.
    guarantees:
      - idempotent
status: complete
