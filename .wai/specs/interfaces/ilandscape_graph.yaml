id: ilandscape_graph
name: Landscape Graph Interface
description: >-
  Contract for projecting hosted organization, project, public-surface, and relation records into a
  landscape graph.
component: landscape_graph
methods:
  - name: build
    description: >-
      Build a hosted-instance landscape graph from authorized organization units, projects,
      placements, snapshots, and relations.
    signature: >-
      build(units: OrganizationUnitRecord[], projects: HostedProjectRecord[], placements:
      ProjectPlacement[], snapshots: ProjectPublicSurfaceSnapshot[], relations:
      ProjectRelationRecord[]): LandscapeGraphModel
    returns: LandscapeGraphModel
    params:
      - name: units
        type: OrganizationUnitRecord[]
      - name: projects
        type: HostedProjectRecord[]
      - name: placements
        type: ProjectPlacement[]
      - name: snapshots
        type: ProjectPublicSurfaceSnapshot[]
      - name: relations
        type: ProjectRelationRecord[]
lint:
  allow: []
status: complete
