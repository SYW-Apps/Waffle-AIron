id: iproject_relation_repository
name: Project Relation Repository Interface
description: >-
  Facade contract for cross-project relation state. Relations are hosted-instance metadata and may
  target only exported system public interfaces.
component: project_relation_repository
methods:
  - name: upsert
    description: Create or update one cross-project relation after public-surface validation.
    signatureFrom: project_relation_registry.upsert
    guarantees:
      - atomic
  - name: remove
    description: Mark a cross-project relation removed or delete it according to retention policy.
    signatureFrom: project_relation_registry.remove
  - name: list
    description: >-
      List cross-project relations by source project, target project, public interface, kind, or
      status.
    signatureFrom: project_relation_index.list
status: complete
createdAt: '2026-07-08T21:13:16.884Z'
updatedAt: '2026-10-03T21:10:20.454Z'
