id: iaudit_store
name: Audit Store Interface
description: >-
  Private store contract for redacted hosted audit events: read-through file I/O over
  audit-events.json. Every read parses the file fresh; every change is an update under the file's
  write lock - there is no bare write.
component: audit_store
methods:
  - name: load
    description: >-
      Read the persisted audit events fresh from audit-events.json (no in-memory copy). A missing
      file yields an empty set; an unreadable file or structurally invalid JSON fails with a storage
      error naming the path.
    signature: 'load(): list<AuditEvent>'
    returns: list<AuditEvent>
    params: []
  - name: update
    description: >-
      Read the audit events fresh and persist what the change makes of them, holding the file's
      write lock (file_write_lock) across both, so a writer in another process that reads and writes
      the same file in between is never lost; a change that throws writes nothing; a file that
      exists but cannot be read or parsed throws, so a change is never applied to a set read as
      empty. Answers the set written.
    signature: 'update(change: (events: AuditEvent[]) => AuditEvent[]): AuditEvent[]'
    returns: list<AuditEvent>
    effect: write
lint:
  allow:
    - code: UNUSED_METHOD
      at: load
      reason: >-
        The read-through store's hydration is called by the repository FACADE, not by a member:
        every exported facade function in src/server/audit.ts constructs the store, calls load(),
        and only then forwards to the registry or index. A Repository facade narrative is held to a
        single call step (FACADE_FORWARDING), so that hydration call has nowhere to live in the
        model and load has no modelled caller. Modelling the hydration as a facade method of its own
        that forwards to the read-back (or letting the facade doctrine carry a hydrate-then-forward
        pair) is the decision owed; declaring a call from the registry or index would be declaring
        one the code does not make.
status: complete
