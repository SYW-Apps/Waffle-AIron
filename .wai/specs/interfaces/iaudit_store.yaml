id: iaudit_store
name: Audit Store Interface
description: Private store contract for redacted hosted audit events.
component: audit_store
methods:
  - name: load
    description: Load persisted audit events into the authoritative store representation.
    signature: 'load(): AuditEvent[]'
    returns: AuditEvent[]
    params: []
  - name: replaceAll
    description: >-
      Replace the store contents with the supplied complete audit-event set after persistence has
      succeeded.
    signature: 'replaceAll(events: AuditEvent[]): void'
    returns: void
    params:
      - name: events
        type: AuditEvent[]
lint:
  allow:
    - code: UNUSED_METHOD
      at: load
      reason: >-
        The read-through store's hydration is called by the repository FACADE, not by a member:
        every exported facade function in src/server/audit.ts constructs the store, calls load(),
        and only then forwards to the registry or index. A Repository facade narrative is held to a
        single call step (FACADE_FORWARDING), so that hydration call has nowhere to live in the
        model and load has no modelled caller. The shape that fixes it already exists in this tree —
        surface_repository.hydrate forwards to surface_registry.hydrateFromFiles — and this family
        predates it. Modelling the hydration that way (or letting the facade doctrine carry a
        hydrate-then-forward pair) is the decision owed; declaring a call from the registry or index
        would be declaring one the code does not make.
status: complete
