id: isecret_portal
name: Secret Portal Interface
description: Published in-process read of one integration secret, for the adapter that presents it.
component: secret_portal
methods:
  - name: resolve
    description: >-
      The value of one secret key — stored in the data-dir store, else the first of its environment
      fallbacks that is set, else null. Answered only to the adapter presenting that credential to
      its service; a caller treats null as the credential being absent.
    signature: 'resolve(key: string): string | null'
    returns: string | null
    params:
      - name: key
        type: string
        description: >-
          The secret key, e.g. git-token, notion-token, miro-token, or a connection's own credential
          ref
status: complete
