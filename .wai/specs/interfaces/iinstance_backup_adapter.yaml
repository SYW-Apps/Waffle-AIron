id: iinstance_backup_adapter
name: Data Dir Backup Adapter Contract
description: >-
  A whole copy of the data directory, and - for the disposable local development data directory only
  - its removal.
component: instance_backup_adapter
methods:
  - name: copy
    description: >-
      Copy the data directory whole to a sibling folder named for the two majors and the time, and
      answer its path.
    signature: 'copy(fromMajor: int, toMajor: int): string'
    returns: string
    params:
      - name: fromMajor
        type: int
      - name: toMajor
        type: int
    effect: io
  - name: discard
    description: >-
      Delete the data directory and every `<dataDir>.backup-*` folder beside it, and answer the
      paths removed. Only the local development server's data directory is ever discarded: a hosted
      data directory is never deleted, whatever its major.
    signature: 'discard(): list<string>'
    returns: list<string>
    params: []
    effect: io
previousIds:
  - idata_dir_backup_adapter
status: draft
createdAt: '2026-10-18T14:27:53.220Z'
updatedAt: '2026-10-23T22:28:30.893Z'
