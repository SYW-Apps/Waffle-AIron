id: idiagnostics
name: Diagnostics Interface
description: >-
  Contract for pure redacted hosted-instance diagnostics, usage derivation, and health report
  assembly over supplied hosted project records. No I/O: the caller supplies the records.
component: diagnostics
methods:
  - name: runChecks
    description: >-
      Derive redacted operational diagnostic checks purely from the supplied inputs:
      project-registry consistency, per-project state presence, project-count sanity, pack
      shadowing, missing pack references, and — when relation data is supplied — relation health (an
      ACTIVE cross-project relation must target a project with a stored public-surface snapshot that
      still exposes the referenced interface; missing snapshots or drifted interfaces produce a
      warn). Pure: no I/O.
    signature: >-
      runChecks(projects: list<HostedProjectRecord>, imagePackNames: list<string>,
      instancePackNames: list<string>, projectReferences: list<ProjectPackReference>, scope?:
      string, relations?: list<ProjectRelationRecord>, relationSnapshots?:
      list<ProjectPublicSurfaceSnapshot>): list<DiagnosticCheckResult>
    returns: list<DiagnosticCheckResult>
    params:
      - name: projects
        type: list<HostedProjectRecord>
      - name: imagePackNames
        type: list<string>
        description: Pack names present in the immutable image-layer tier (WAIRON_IMAGE_PACKS_DIR).
      - name: instancePackNames
        type: list<string>
        description: Pack names present in the mutable instance tier (WAIRON_PACKS_DIR).
      - name: projectReferences
        type: list<ProjectPackReference>
        description: >-
          Per-project declared pack/profile references, so the check can flag references absent from
          both tiers.
      - name: scope
        type: string
        optional: true
      - name: relations
        type: list<ProjectRelationRecord>
        description: >-
          The declared project relations, so the relation-health check can judge each against its
          producer
        optional: true
      - name: relationSnapshots
        type: list<ProjectPublicSurfaceSnapshot>
        description: The producers' stored public-surface snapshots the relations are judged against
        optional: true
  - name: collectUsage
    description: >-
      Derive resource usage snapshots for the requested scope from the supplied hosted project
      records, without exposing private specs or secrets.
    signature: 'collectUsage(projects: list<HostedProjectRecord>, scope?: string): list<ResourceUsageSnapshot>'
    returns: list<ResourceUsageSnapshot>
    params:
      - name: projects
        type: list<HostedProjectRecord>
      - name: scope
        type: string
        optional: true
  - name: buildHealthReport
    description: >-
      Assemble an aggregated instance health report from diagnostic checks and usage snapshots,
      computing the overall status.
    signature: >-
      buildHealthReport(checks: list<DiagnosticCheckResult>, usage: list<ResourceUsageSnapshot>):
      InstanceHealthReport
    returns: InstanceHealthReport
    params:
      - name: checks
        type: list<DiagnosticCheckResult>
      - name: usage
        type: list<ResourceUsageSnapshot>
status: complete
