id: ispec_canvas
name: Spec Canvas Interface
description: >-
  Building the canvas model from the spec tree, and drawing it as a page that needs nothing else to
  open. The two are separate because the model is also what the live web canvas consumes — rendering
  is one consumer of it, not its purpose.
component: spec_canvas
methods:
  - name: build
    description: >-
      Project the current project's spec tree into the canvas model: the nodes, their containment,
      the edges between them, and any findings to surface on them. A contract method is drawn with
      the signature text the loaded tree carries — derived from its params, and its source's when it
      names a signatureFrom, which the node shows beside it ("from billing_portal.createInvoice") —
      and a signature type is drawn with its derived text in place of a field list. The overview
      follows composition, not storage (stage 8): each PROJECT member of the bound project —
      contained, or referenced (a `../`, git or hosted source) — gets a project node, its specs
      contained in it and reached through its exports, with consumption edges between projects; each
      external the bound project declares that is not a project of its family gets an EXTERNAL
      project node (dashed) that its consumption edges land on, so peers that only consume each
      other still show their relations; each PART's subsystems are drawn as the bound project's own
      subsystems with a storage badge (contained, sibling, git and its commit). A subsystem whose
      key repeats its member's alias (`billing::billing`) keeps its honest id and is labelled by its
      local name only. Findings and relation health are passed in rather than computed here — the
      canvas draws a judgement, it does not make one: given the family's relations, each
      consumer-to-producer pair the edges connect becomes a CanvasRelation (its health from
      ExternalStatus.health(), the uses that changed, were removed or could not be compared, the pin
      and when it was compared) and each consumption edge names it; a pair the relations do not
      answer is unavailable, never ok. Without relations the model carries none, and the canvas says
      health was not checked.
    signature: 'build(issues?: ValidationIssue[], relations?: ProjectRelations[]): CanvasModel'
    returns: CanvasModel
    params:
      - name: issues
        type: ValidationIssue[]
        description: Findings to mark on the nodes they name; none when omitted
        optional: true
      - name: relations
        type: ProjectRelations[]
        description: >-
          The family's relation health (family_validator.relations) to colour consumption edges by;
          when omitted the model carries no relations and every consumption edge is drawn as not
          checked
        optional: true
    guarantees:
      - idempotent
  - name: render
    description: >-
      Draw a canvas model as a single self-contained HTML page: markup, styles and the interaction
      engine all embedded, so the file opens from disk with no server and no network. That embedding
      is why this component's file is mostly text. The engine draws each consumption edge by its
      relation's health with a cue that does not rely on colour — a glyph at the edge's middle (✓
      ok, Δ drifted, ✕ incompatible, ? unavailable) and a dotted line for unavailable — its health
      colour replacing the boundary-hop colour on that edge; where edges fold into one at a
      collapsed level the worst health wins (incompatible, then unavailable, then drifted, then ok).
      Hovering or selecting the edge shows the relation: consumer and producer, which uses changed
      or were removed and why one could not be compared, the pin's commit or short digest, and when
      it was compared. The legend gains one row — only when the model has a consumption edge —
      naming the four states with their glyphs and the compared-at time, or saying relation health
      was not checked when the model carries no relations. An external project node is drawn with a
      dashed border. A project node opens by drilling in when it holds specs (a contained member, a
      part's subsystem); a referenced or external project node selects to show its storage and the
      relations landing on it; and when the host provides an open-project hook (the web app) a node
      carrying a recordId offers “Open project ↗” in its panel and opens on double-click when it
      holds nothing to drill into — never in a standalone file or on a shared page, which have no
      such hook.
    signature: 'render(model: CanvasModel): string'
    returns: string
    params:
      - name: model
        type: CanvasModel
        description: The model to draw
    guarantees:
      - idempotent
status: complete
