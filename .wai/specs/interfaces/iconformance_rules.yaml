id: iconformance_rules
name: Conformance Rules Interface
description: >-
  One method per rule, named after it, in run order. Each takes the run's RuleContext, reports
  through its addIssue, and declares the codes it reports as findings. These rules judge whether
  code matches the spec, from the source-code model the validator gathers.
component: conformance_rules
methods:
  - name: sourceFileLinkage
    description: >-
      Rule source-file-linkage. Code↔spec Level 1: every source file an implementation names — its
      own sourcePath and each method's — must resolve to a real, readable file inside the project
      root, and an implementation that names no file at all, or leaves a contract method without
      one, is linked to no code. A file that escapes the root, is missing or cannot be analyzed is
      reported once and blocks only the methods realized in it. A run in which TypeScript/JavaScript
      files were analyzed below exact grade reports that once (CONFORMANCE_DEGRADED), since
      dependency conformance then skips them. Implementations under chained subsystems (projectPath)
      validate standalone in their own project run and are skipped here.
    signature: 'sourceFileLinkage(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: MISSING_SOURCE_PATH
        severity: warning
        summary: >-
          An implementation names no source file at all, or a contract method is left without one —
          structural conformance cannot link it to code
      - code: MISSING_SOURCE_FILE
        severity: error
        summary: >-
          A source file an implementation or one of its methods names does not resolve to a file on
          disk
      - code: SOURCE_PATH_ESCAPES_ROOT
        severity: error
        summary: >-
          A source file an implementation or one of its methods names is absolute or escapes the
          project root (containment refusal)
      - code: CONFORMANCE_ANALYSIS_SKIPPED
        severity: warning
        summary: >-
          A source file an implementation or one of its methods names could not be analyzed
          (binary/unreadable) — realization of the methods in it was not checked
      - code: CONFORMANCE_DEGRADED
        severity: warning
        summary: >-
          TypeScript/JavaScript files were analyzed below exact grade (compiler not resolvable) —
          dependency conformance skips them
  - name: methodRealization
    description: >-
      Rule method-realization. Code↔spec Level 1: every L3 contract method must be realized in its
      own source file (the method's sourcePath, else the implementation's) at its conformance tier —
      declared | anchored | off; Portals default to anchored, everything else to declared, and a
      per-method `symbol` maps an intent-language name onto the code name. A method realized by a
      DECLARATION owes a function BODY as well: at exact grade one must be reachable under the
      symbol, here or through the imports and republications this file forwards it by, so a
      signature, an ambient or interface declaration or a plain value binding stops reading as an
      implementation (METHOD_BODY_NOT_FOUND). Findings carry the analysis grade (exact AST | pattern
      table | generic scan) so weaker analysis is visible. Methods whose file escapes the root, is
      missing or could not be analyzed are left to source-file-linkage, and implementations under
      chained subsystems (projectPath) validate standalone in their own project run.
    signature: 'methodRealization(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: UNREALIZED_METHOD
        severity: warning
        summary: >-
          An L3 contract method has no anchor in its own source file (the method's sourcePath, else
          the implementation's) at the required conformance tier
      - code: METHOD_BODY_NOT_FOUND
        severity: warning
        summary: >-
          The method symbol IS declared in its own source file, but the file holds no function-like
          body under it — a signature, an ambient or interface declaration, a value binding, an
          imported or re-exported name
  - name: findingRealization
    description: >-
      Rule finding-realization. Code↔spec Level 1: every finding code an L3 contract method declares
      must be anchored in the method's own source file (the method's sourcePath, else the
      implementation's) — as a string literal or, at exact grade, a property-access name, so a code
      reported through a constants object counts. Below exact grade any identifier or word counts,
      and the grade rides on the finding. Respects the conformance dial (off skips), leaves
      unresolvable files to source-file-linkage, and skips implementations under chained subsystems
      (projectPath), which validate standalone in their own project run.
    signature: 'findingRealization(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: UNREALIZED_FINDING
        severity: warning
        summary: >-
          A finding code a contract method declares appears in the method's source file neither as a
          string literal nor as a property-access name (below exact grade, any identifier counts)
  - name: callConformance
    description: >-
      Rule call-conformance. Code↔spec Level 3: the CLAIMED call ↔ realized call relation, judged
      both ways against the method's own source file (its sourcePath, else the implementation's), at
      exact analysis grade only. A method claims a call two ways and they face one check: a
      narrative `call` step, and an entry of the declared `calls` a narrative-less method reaches
      its collaborators through. They assert the same thing, and the step number is no part of the
      claim — this check never reads order, so it is only how a finding points at one. Forward:
      every claim must be realized by a call whose callee RESOLVES TO one of the target method's own
      source files — the target's contract name or a per-method `symbol` override, closed
      transitively over the named helpers the realized function calls, and resolved against every
      file the call CAN have reached: a `this.<field>.<method>()` receiver followed through the
      field's DECLARED TYPE, a `new Class(...).<method>()` receiver through the module its CLASS
      NAME came from. A matching call whose origin a pure model cannot resolve is reported apart as
      CALL_ORIGIN_UNRESOLVED, which NAMES the shape it could not follow and asks for nothing — a
      coverage hole in the reader, reported for the reason CONFORMANCE_DEGRADED is: a silently
      degraded gate is worse than a degraded one. A finding names a landing only from the PROVEN
      tier so that widening what a call reached can accept a claim but never accuse one, and a
      target that names no file of its own falls back to name membership. Converse: a call that
      resolves to a modelled method of ANOTHER component in the SAME file crosses a component
      boundary while looking local, so the method must claim it — in a step or in `calls`
      (UNDECLARED_COLOCATED_CALL) — judged on the proven tier alone, and a same-file private helper
      is no modelled method and is never reported. A method that claims nothing at all is judged in
      neither direction: what it leaves unsaid is UNUSED_*'s subject. Order, arguments and
      conditions stay unverified, dispatch steps (runtime-table routed) are no claim about a call
      site, a malformed declared reference is MALFORMED_DECLARED_CALL's finding and names no target
      here, the conformance dial (off) skips, and weaker analysis grades never guess.
    signature: 'callConformance(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: CALL_STEP_UNREALIZED
        severity: warning
        summary: >-
          Narrative call step or declared call realized by no call that resolves to the target
          method's own source file — the call is absent, or it lands in another module
      - code: CALL_ORIGIN_UNRESOLVED
        severity: warning
        summary: >-
          Narrative call step or declared call whose target name IS called, but only from call sites
          written in a shape this analysis cannot resolve to a file — the claim was not checked, and
          is neither proven realized nor accused
      - code: UNDECLARED_COLOCATED_CALL
        severity: warning
        summary: >-
          The realized function calls a modelled method of another component living in the same
          source file, and neither a narrative step nor a declared call names it
  - name: hiddenState
    description: >-
      Rule hidden-state. The fields-vs-Store criterion, statically approximated: module-scope
      mutable bindings (let/var) in a source file mapped EXCLUSIVELY to logic that holds no state (a
      component whose type isLogic() and not holdsState(): an Orchestrator, or a Specialist until it
      is retired) are flagged as hidden held state. A component maps every file its implementations
      and their methods name. State a logic component keeps for itself is invisible to the spec, the
      canvas, and every persistence rule: promote it to a Store (durability: cache for loss-safe
      memo state), or lint.allow with the reason it is genuinely wiring or ephemeral. Supervisor and
      Actor files may hold runtime state. Exact analysis grade only; files also mapped to data or
      boundary components are exempt (N:1 collapse); const-bound container mutation is beyond this
      check and the finding says so.
    signature: 'hiddenState(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: HIDDEN_STATE
        severity: warning
        summary: >-
          Module-scope mutable binding in a file mapped only to stateless logic (Orchestrators) —
          held state hiding outside a Store, Supervisor or Actor
  - name: dependencyConformance
    description: >-
      Rule dependency-conformance. Code↔spec Level 2: runtime import edges between component-mapped
      source files (a component maps to every file its implementations and their methods name) must
      be justified by declared relations — a direct dependsOn/owns pair, a shared component,
      membership in a depended-on pattern, or (across subsystems) a declared edge to the target
      subsystem's published surface (UNDECLARED_DEPENDENCY). Conversely, a declared dependsOn/owns
      edge between components realized in different files should be visible as an import between any
      file of the source and any file of the target (UNREALIZED_DEPENDENCY — DI indirection can
      defeat this, hence warning). Only exact-grade analyzed files participate; type-only imports
      are exempt; chained subprojects validate standalone.
    signature: 'dependencyConformance(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: UNDECLARED_DEPENDENCY
        severity: warning
        summary: >-
          A runtime import between component-mapped files has no declared dependsOn/owns (or
          published-surface) justification
      - code: UNREALIZED_DEPENDENCY
        severity: warning
        summary: >-
          A declared dependsOn/owns edge between components in different files is realized by no
          import between any of their files
  - name: integrationSimDeclaration
    description: >-
      Rule integration-sim-declaration. Once a subsystem has adopted integration sims (its first
      declared L4 simPath), every OTHER complete, non-leaf implementation of that subsystem must
      declare one too: its unit suite proves contract shape against mocks, not that the wired
      components run together. A leaf component's unit suite IS its sim, and a subsystem that has
      adopted nothing is never flooded.
    signature: 'integrationSimDeclaration(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: MISSING_INTEGRATION_SIM
        severity: warning
        summary: Complete non-leaf implementation in a sim-adopting subsystem declares no simPath
  - name: integrationSimFile
    description: >-
      Rule integration-sim-file. A declared L4 simPath must resolve to a readable, committed file
      inside the project root — the integration harness is a re-runnable file, not a claim.
      Execution stays CI's job.
    signature: 'integrationSimFile(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: SIM_FILE_MISSING
        severity: warning
        summary: Declared simPath resolves to no file inside the project root
  - name: integrationSimWiring
    description: >-
      Rule integration-sim-wiring. A committed integration harness's import graph — closed
      transitively over the analyzed module set, exact grade only — must reach at least one of the
      component's own source modules (its implementation's or a method's) and at least one source
      module of each direct dependsOn/owns component (technology-boundary dependencies exempt: their
      contract-faithful fakes are sanctioned). Execution is CI's job — this proves wiring, never
      that the sim passes.
    signature: 'integrationSimWiring(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: UNWIRED_INTEGRATION_SIM
        severity: warning
        summary: Sim file does not import the real modules it claims to wire
  - name: integrationSimCoverage
    description: >-
      Rule integration-sim-coverage. Once a committed integration harness carries
      sim:<component-id>. anchors, that component claims path coverage: every narrated method's
      happy path and every labeled throw step needs its exact sim:<component>.<method>[:<label>]
      string-literal anchor. Anchors prove the path is NAMED — assertion quality and execution stay
      CI's job.
    signature: 'integrationSimCoverage(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: SIM_PATH_UNCOVERED
        severity: warning
        summary: >-
          A narrative path has no sim:<component>.<method>[:<label>] anchor in the component's
          coverage-opted harness
  - name: typeRealization
    description: >-
      Rule type-realization. Code↔spec Level 1 for the data model: a type that names a sourcePath is
      claiming code, so every file it names — its own and each method's — must resolve to a real,
      readable file inside the project root, its file must PUBLISH its declaration (an exported name
      at exact grade, the declaration tier below it, under its `symbol` when the code-level name
      differs from the type's name — and a pure re-export barrel publishes nothing of its own, so a
      claim on one is never realized), and each of its pure methods must appear in its own file (the
      method's sourcePath, else the type's) at the declaration tier, under the method's `symbol`,
      else the method's name. A type that names no sourcePath claims nothing and is never reported.
      Findings carry the analysis grade (exact AST | pattern table | generic scan) so weaker
      analysis is visible, a file that escapes the root, is missing or could not be analyzed is
      reported once and blocks only what it would have realized, and types under chained subsystems
      (projectPath) validate standalone in their own project run.
    signature: 'typeRealization(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: UNREALIZED_TYPE
        severity: warning
        summary: >-
          A type names a sourcePath but its declaration is nowhere in that file — the claim points
          at code that does not hold it
      - code: UNREALIZED_TYPE_METHOD
        severity: warning
        summary: >-
          A pure method of a claimed type is nowhere in its own source file (the method's
          sourcePath, else the type's)
      - code: MISSING_SOURCE_FILE
        severity: error
        summary: A source file a type or one of its methods names does not resolve to a file on disk
      - code: SOURCE_PATH_ESCAPES_ROOT
        severity: error
        summary: >-
          A source file a type or one of its methods names is absolute or escapes the project root
          (containment refusal)
      - code: CONFORMANCE_ANALYSIS_SKIPPED
        severity: warning
        summary: >-
          A source file a type or one of its methods names could not be analyzed (binary/unreadable)
          — what it would have realized was not checked
  - name: unclaimedSource
    description: >-
      Rule unclaimed-source. Code↔spec Level 1, asked the other way round: every source file under
      the project's declared source roots must be named by some spec — an implementation's
      sourcePath, a method's, a simPath, or a type's — or be carried in the frozen
      `rules.conformance.unclaimed` list. A pure re-export barrel declares nothing of its own and
      only republishes other modules, so it has no code to claim and is exempt (exact grade only: a
      weaker grade cannot tell a barrel from a file it failed to parse). Declaring no source roots
      leaves the check silent, which is what makes it opt-in; the unclaimed list is a one-way debt
      register, so an entry the walk no longer finds unclaimed must be deleted and the list can only
      shrink.
    signature: 'unclaimedSource(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: UNCLAIMED_SOURCE_FILE
        severity: warning
        summary: >-
          A source file under a declared source root that no spec names and the frozen unclaimed
          list does not carry — code nobody designed
      - code: STALE_UNCLAIMED_ENTRY
        severity: warning
        summary: >-
          An entry of the frozen unclaimed list names a file that is now claimed, or that the
          source-root walk no longer finds — delete it, the list only shrinks
  - name: carriedDebt
    description: >-
      Rule carried-debt. The conformance debt register (`rules.conformance.carried`) holds the
      code↔spec findings this tree carries as declared, classified debt — `unclaimed`'s one-way
      shape, for findings about code a spec does name. It is not a second lint.allow: an allow says
      a finding is wrong here by design, an entry here says the finding is right and unpaid, and
      each entry states which of the three kinds it is (drift: spec and code disagree; undecided:
      the fix waits on a modelling decision nobody has taken; unreadable: the analysis cannot follow
      the shape the code is written in) and why. Only a code a rule declares CARRYABLE may appear,
      and naming any other is an error, so the register can never widen into general-purpose
      suppression. An entry carries a finding only when it lists EVERY unit that finding reports, so
      an aggregating finding cannot grow behind it; an entry that matched nothing, that duplicates
      another, that names a spec the tree does not hold, or that lists a unit no longer reported is
      STALE_CARRIED_FINDING, so the register only shrinks. The audit is silent in a run that could
      not have fired the findings at all: one that built no code model, the specs outside a scoped
      run, and a code the project switched off. Nothing can check a reason for TRUTH — a stale entry
      is one that stopped applying, never one that still applies for a reason that has become false
      — so a reason group may declare its own classification provisional (`revisit`: what would
      settle it), and every run counts those findings beside the kind totals.
    signature: 'carriedDebt(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: UNCARRYABLE_FINDING
        severity: error
        summary: >-
          The conformance debt register names an issue code no rule emits, or one no rule declares
          carryable — the register holds measured code↔spec debt, never a design rule somebody wants
          quiet
      - code: STALE_CARRIED_FINDING
        severity: warning
        summary: >-
          An entry of the conformance debt register carries a finding that no longer fires, or lists
          a unit that finding no longer reports — delete it, the register only shrinks
status: complete
