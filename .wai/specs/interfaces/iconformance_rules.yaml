id: iconformance_rules
name: Conformance Rules Interface
description: >-
  One method per rule, named after it, in run order. Each takes the run's RuleContext, reports
  through its addIssue, and declares the codes it reports as findings. These rules judge whether
  code matches the spec, from the source-code model the validator gathers.
component: conformance_rules
methods:
  - name: sourceFileLinkage
    description: >-
      Rule source-file-linkage. Code↔spec Level 1: every source file an implementation names — its
      own sourcePath and each method's — is checked against the code on disk. A named file that is
      not on disk is PLANNED (SOURCE_FILE_PLANNED, a notice — planned, not written yet), at method
      level as at implementation level and whether or not the implementation's realization has
      begun: a design names the file a method will live in before the method is written, and code
      linkage, outside the approval since format 3, costs nothing to declare. The planned files of
      one implementation are one notice naming them all, so a planned design reads as one line per
      component, never one per file. Whether the realization has BEGUN (code_index.holdsAny over the
      files it names: at least one exists) decides only how an unlinked method is reported: before
      that, an implementation that names no file is unlinked design (MISSING_SOURCE_PATH, a notice),
      so a design-only tree passes `validate --ci`; once it has begun, a contract method that names
      no file while others do is unlinked (METHOD_SOURCE_PATH_MISSING, a warning), and a method its
      named, existing file does not hold is method-realization's UNREALIZED_METHOD. A team that
      wants CI to demand code for every designed implementation sets rules.conformance.requireCode,
      which reports the two notices at error, naming the setting. A file that escapes the root or
      cannot be analyzed is reported once and blocks only the methods realized in it. A run in which
      TypeScript/JavaScript files were analyzed below exact grade reports that once
      (CONFORMANCE_DEGRADED). Implementations under chained subsystems (projectPath) validate
      standalone in their own project run and are skipped here.
    signature: 'sourceFileLinkage(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: MISSING_SOURCE_PATH
        severity: notice
        summary: >-
          An implementation whose realization has not begun names no source file (for itself or for
          some contract methods) — designed, not linked to code yet; an error under
          rules.conformance.requireCode
      - code: SOURCE_PATH_ESCAPES_ROOT
        severity: error
        summary: >-
          A source file an implementation or one of its methods names is absolute or escapes the
          project root (containment refusal)
      - code: CONFORMANCE_ANALYSIS_SKIPPED
        severity: warning
        summary: >-
          A source file an implementation or one of its methods names could not be analyzed
          (binary/unreadable) — realization of the methods in it was not checked
      - code: CONFORMANCE_DEGRADED
        severity: warning
        summary: >-
          TypeScript/JavaScript files were analyzed below exact grade (no usable compiler could be
          loaded, or it could not read them) — dependency conformance skips them
      - code: SOURCE_FILE_PLANNED
        severity: notice
        summary: >-
          Source files an implementation or its methods name are not on disk — planned, not written
          yet, whether or not another file it names exists; one notice per implementation naming
          every planned file, and method-realization judges the methods in each once it exists. An
          error under rules.conformance.requireCode
      - code: METHOD_SOURCE_PATH_MISSING
        severity: warning
        summary: >-
          An implementation whose realization has begun leaves contract methods without a source
          file — structural conformance cannot link them to code
  - name: methodRealization
    description: >-
      Rule method-realization. Code↔spec Level 1: every L3 contract method must be realized in its
      own source file (the method's sourcePath, else the implementation's) at its conformance tier —
      declared | anchored | off; Portals default to anchored, everything else to declared, and a
      per-method `symbol` maps an intent-language name onto the code name. A method realized by a
      DECLARATION owes a function BODY as well: at exact grade one must be reachable under the
      symbol, here or through the imports and republications this file forwards it by, so a
      signature, an ambient or interface declaration or a plain value binding stops reading as an
      implementation (METHOD_BODY_NOT_FOUND). Findings carry the analysis grade (exact AST | pattern
      table | generic scan) so weaker analysis is visible. Methods whose file escapes the root, is
      missing or could not be analyzed are left to source-file-linkage, and implementations under
      chained subsystems (projectPath) validate standalone in their own project run.
    signature: 'methodRealization(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: UNREALIZED_METHOD
        severity: warning
        summary: >-
          An L3 contract method has no anchor in its own source file (the method's sourcePath, else
          the implementation's) at the required conformance tier
      - code: METHOD_BODY_NOT_FOUND
        severity: warning
        summary: >-
          The method symbol IS declared in its own source file, but the file holds no function-like
          body under it — a signature, an ambient or interface declaration, a value binding, an
          imported or re-exported name
  - name: findingRealization
    description: >-
      Rule finding-realization. Code↔spec Level 1: every finding code an L3 contract method declares
      must be anchored in the method's own source file (the method's sourcePath, else the
      implementation's) — as a string literal or, at exact grade, a property-access name, so a code
      reported through a constants object counts. Below exact grade any identifier or word counts,
      and the grade rides on the finding. Respects the conformance dial (off skips), leaves
      unresolvable files to source-file-linkage, and skips implementations under chained subsystems
      (projectPath), which validate standalone in their own project run.
    signature: 'findingRealization(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: UNREALIZED_FINDING
        severity: warning
        summary: >-
          A finding code a contract method declares appears in the method's source file neither as a
          string literal nor as a property-access name (below exact grade, any identifier counts)
  - name: callConformance
    description: >-
      Rule call-conformance. Code↔spec Level 3: the CLAIMED call ↔ realized call relation, judged
      both ways against the method's own source file (its sourcePath, else the implementation's), at
      exact analysis grade only. A method claims a call two ways and they face one check: a
      narrative `call` step, and an entry of the declared `calls` a narrative-less method reaches
      its collaborators through. They assert the same thing, and the step number is no part of the
      claim — this check never reads order, so it is only how a finding points at one. Forward:
      every claim must be realized by a call whose callee RESOLVES TO one of the target method's own
      source files — the target's contract name or a per-method `symbol` override, closed
      transitively over the named helpers the realized function calls, and resolved against every
      file the call CAN have reached: a `this.<field>.<method>()` receiver followed through the
      field's DECLARED TYPE, a `new Class(...).<method>()` receiver through the module its CLASS
      NAME came from, a plain `<name>.<method>()` receiver through the type the file ANNOTATES that
      name with — a parameter's, or an annotated variable's, which is how a module that wires its
      collaborators as closures writes every one of its calls — a `fn(...).<method>()` receiver
      through the type fn RETURNS where the code settles it, and a `this.<method>()` receiver
      through the class whose own method it sits in, and a receiver CHAIN
      (`this.<field>.<property>.<method>()`, `<name>.<property>.<method>()`) link by link through
      each link's declared type — a declared type read through a member-preserving utility (Pick,
      Omit, Partial, Required, Readonly) and one alias hop; a package specifier naming a package of
      this repository resolves like a relative one, and an export alias (`export { a as b }`, an
      adapter object property `{ b: a }`) forwards by identity like a re-export. A matching call
      whose origin a pure model cannot resolve is reported apart as CALL_ORIGIN_UNRESOLVED, which
      NAMES the shape it could not follow and asks for nothing — a coverage hole in the reader,
      reported for the reason CONFORMANCE_DEGRADED is: a silently degraded gate is worse than a
      degraded one. Where that claim's target has no code yet — no file any of its implementations
      names exists, the normal state after the first component of a service is implemented from its
      brief through a port to a collaborator still planned — the call is planned rather than
      unresolved (CALL_TARGET_PLANNED, a notice, as SOURCE_FILE_PLANNED is), and it is judged like
      any other claim once the target's realization begins. A finding names a landing only from the
      PROVEN tier so that widening what a call reached can accept a claim but never accuse one, and
      a target that names no file of its own falls back to name membership. Where a type checker
      read the file, a claim is also realized by any call or reference in the bodies the function
      reaches — and in the unowned code they call — that the checker lands on the target: its file
      under a name it is realized by, a class realizing the port the call was typed by, or what the
      target forwards to by identity — whatever the receiver's spelling (a type-only or `export *`
      barrel, a port declared in a shared module, a dependency bag typed inline); a claim it does
      not land keeps the shape tier's answer, since the checker's landing on a declaration says what
      a receiver is TYPED as, never where the call went instead. N:1 identity — a caller that IS the
      target — is judged on the body, the same anchor in the same file, never on a shared name: a
      Portal method forwarding to a same-named Orchestrator method elsewhere must make that call.
      Converse: a call that resolves to a modelled method of ANOTHER component in the SAME file
      crosses a component boundary while looking local, so the method must claim it — in a step or
      in `calls` (UNDECLARED_COLOCATED_CALL) — judged on the proven tier alone, and a same-file
      private helper is no modelled method and is never reported; a function forwarding by identity
      to a modelled method written in another file IS that method, so what it calls is that method's
      subject. And a call — or a reference the code takes as a value — that the TypeScript type
      checker resolves into ANOTHER file, onto a write- or lifecycle-effect contract method of
      another component, or, from a Portal method whose body is its own, onto a verb of an
      Orchestrator, Supervisor or Actor whose effect is a write — declared (write, lifecycle or io),
      or, where its contract declares none, read off the verb's own narrative transitively: a call
      step or declared call reaching a method that changes state makes it a write, only reads or
      none a read, and a verb that settles nothing (no narrative and no declared calls, a dispatch
      step, a target outside this tree, a non-workflow method declaring no effect) is reported as an
      unnarrated call whose effect is undeclared, never as a write (a Portal changes state only by
      dispatching to such a verb, so its narrative is the list of those it may reach), that the
      method claims nowhere is a mutation the design says the method never makes
      (UNDECLARED_WRITE_CALL): narrate it, declare it in `calls`, or remove it — judged in the
      bodies the method's function reaches and in the UNOWNED code they call (a function in a file
      no component realizes, or one that is none of its file's components' modelled methods, read as
      if inlined at the call site, transitively to a bounded depth, the finding naming the hops),
      never for a Portal's call into a data component (PORTAL_WRITE_SHORTCUT_IN_CODE's subject), and
      only where a type checker was loaded. A call there the checker cannot follow — its receiver
      typed any or unknown, cast to either or to an index signature, or its member picked by a
      computed key — under the name of such a write the method claims nowhere (where the checker
      recorded the receiver's original type, a write of the component that type lands on, any of its
      writes when a computed key names none; else a write of that name in the method's own subsystem
      or one its component depends into) fails closed as CALL_ORIGIN_UNRESOLVED: neither proven an
      unnarrated write nor cleared. A member picked by a key that names no single member, on a
      receiver that was one of this project's classes before any cast, is such a call however the
      receiver or the key is cast and whether it is invoked on the spot or taken as a value and
      invoked later (`const f = store[k]; f.call(store, …)`); a key the checker types as one literal
      names its member by that literal's value, never by the variable holding it. A method that
      claims nothing at all is judged in neither direction: what it leaves unsaid is UNUSED_*'s
      subject. Order, arguments and conditions stay unverified, dispatch steps (runtime-table
      routed) are no claim about a call site, a malformed declared reference is
      MALFORMED_DECLARED_CALL's finding and names no target here, the conformance dial (off) skips,
      and weaker analysis grades never guess.
    signature: 'callConformance(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: CALL_STEP_UNREALIZED
        severity: warning
        summary: >-
          Narrative call step or declared call realized by no call that resolves to the target
          method's own source file — the call is absent, or it lands in another module
      - code: CALL_ORIGIN_UNRESOLVED
        severity: warning
        summary: >-
          Narrative call step or declared call whose target name IS called, but only from call sites
          written in a shape this analysis cannot resolve to a file — the claim was not checked, and
          is neither proven realized nor accused; or, the fail-closed half of UNDECLARED_WRITE_CALL,
          a call through a receiver the analysis cannot follow (typed any or unknown, cast to either
          or to an index signature, a computed key) under the name of a write the method claims
          nowhere. Where a type checker read the file, whatever the checker resolves; without one,
          what resolves is a name bound to a module of THIS project: a bare or namespaced call
          through such an import binding, a this.<field> receiver whose declared type names one, a
          receiver chain (this.<field>.<property>, <name>.<property>) each of whose links the code
          declares a type for, a new Class(…) receiver whose class does, a receiver name the file
          annotates with such a type, a fn(…) receiver whose return the code settles, and this
          inside a class's own method — a declared type read through
          Pick/Omit/Partial/Required/Readonly and one alias hop. What does not: a third-party
          package import, a value the module assembled, and a receiver the file declares nothing for
      - code: UNDECLARED_COLOCATED_CALL
        severity: warning
        summary: >-
          The realized function calls a modelled method of another component living in the same
          source file, and neither a narrative step nor a declared call names it
      - code: UNDECLARED_WRITE_CALL
        severity: warning
        summary: >-
          The realized function, or unowned code it calls, calls or takes as a value a write- or
          lifecycle-effect method of another component in another file — or, from a Portal, a
          workflow verb whose effect, declared or read off its own narrative, is a write, or that
          nothing settles (said as an unnarrated call whose effect is undeclared) — as the type
          checker resolves it, and neither a narrative step nor a declared call names it — an
          unnarrated mutation
      - code: CALL_TARGET_PLANNED
        severity: notice
        summary: >-
          A narrative call step or declared call written by name through a receiver nothing realizes
          yet, whose target component has no code yet (no file its implementations name exists) —
          planned, not unresolved; judged like any other claim once the target's realization begins
  - name: hiddenState
    description: >-
      Rule hidden-state. The fields-vs-Store criterion, statically approximated: module-scope
      mutable bindings (let/var) in a source file mapped EXCLUSIVELY to logic that holds no state (a
      component whose type isLogic() and not holdsState(): an Orchestrator, or a Specialist until it
      is retired) are flagged as hidden held state. A component maps every file its implementations
      and their methods name. State a logic component keeps for itself is invisible to the spec, the
      canvas, and every persistence rule: promote it to a Store (durability: cache for loss-safe
      memo state), or lint.allow with the reason it is genuinely wiring or ephemeral. Supervisor and
      Actor files may hold runtime state. Exact analysis grade only; files also mapped to data or
      boundary components are exempt (N:1 collapse); const-bound container mutation is beyond this
      check and the finding says so.
    signature: 'hiddenState(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: HIDDEN_STATE
        severity: warning
        summary: >-
          Module-scope mutable binding in a file mapped only to stateless logic (Orchestrators) —
          held state hiding outside a Store, Supervisor or Actor
  - name: dependencyConformance
    description: >-
      Rule dependency-conformance. Code↔spec Level 2: runtime import edges between component-mapped
      source files (a component maps to every file its implementations and their methods name) must
      be justified by declared relations — a direct dependsOn/owns pair, a shared component,
      membership in a depended-on pattern, or (across subsystems) a declared edge to the target
      subsystem's published surface (UNDECLARED_DEPENDENCY). A type-only import alone never accuses
      — type coupling is allowed — but a CALL of a modelled contract method through a collaborator
      whose declared type comes from another component's file is runtime collaboration whatever the
      import's form, and the same justification is owed (UNDECLARED_DEPENDENCY on that edge).
      Conversely, a declared dependsOn/owns edge between components realized in different files
      should be visible as an import between any file of the source and any file of the target, or —
      where the type checker read a file of the source — as a call or reference the checker lands in
      a file of the target, through every barrel, port declaration, dependency bag and unowned
      helper (UNREALIZED_DEPENDENCY — DI indirection can defeat the import reading, hence warning);
      a type-only import realizes it, since `import type` is what dependency injection writes down.
      An Adapter's edge to a Portal reached over an out-of-process transport (HTTP, gRPC, a bus, a
      CLI…) is the link the design models: the Adapter's transport client realizes it, never an
      import, so it is never UNREALIZED_DEPENDENCY — and nothing asks for an import across that
      boundary, which would couple two deployables' builds. Two twins of design rules are judged on
      the same code: a Portal file calling a write- or lifecycle-effect contract method of a
      Repository, Index, Store or Registry is the persistence shortcut the design rule
      PORTAL_WRITE_SHORTCUT refuses, unless the Portal's own narrative already claims that call (the
      design rule's finding then) (PORTAL_WRITE_SHORTCUT_IN_CODE). A Portal's calls are resolved by
      the TypeScript type checker: every call written in a file realizing only Portals — in a file
      shared with other components, every call in a body the Portal's own methods reach — and every
      reference there to a function or method the code takes as a value (passed as an argument,
      assigned, returned, bound, handed to Reflect.apply), together with every call the UNOWNED code
      they reach makes (a function in a file no component realizes, or one that is none of its
      file's components' modelled methods, read as if inlined at the call site, transitively to a
      bounded depth, the finding naming the hops), lands on the declaration its signature resolves
      to, whatever the receiver's spelling, and a declaration in an interface or type shape, a port
      the Portal declares for itself included, lands on each class of the project that realizes it
      (the classes whose implements clause names it when any does, else every class the checker
      finds assignable to it); such a landing on a component the file neither imports at runtime nor
      is justified to reach is UNDECLARED_DEPENDENCY on that edge. Where no type checker could be
      loaded, the receiver is followed through the shape facts instead: a non-null assertion,
      parentheses, `satisfies`, a cast to a named type and a local alias or destructuring of a field
      exactly as through the field itself. A call in a Portal's own code the analysis cannot resolve
      at all — its receiver typed any or unknown, cast to either or to an index signature, its
      member picked by a computed key, or typed nothing — under the name of a write- or
      lifecycle-effect method of a data component, or reading a member by a key that names no single
      member off a receiver that was a data component before any cast — invoked on the spot or taken
      as a value, however the receiver or the key is cast (where the checker recorded the receiver's
      ORIGINAL type, before any cast, a write of the data component that type lands on — any of its
      writes when a computed key names none; else one in the Portal's own subsystem or one it
      depends into), which the Portal does not already claim, fails closed: it is neither proven a
      shortcut nor cleared, and it is a warning, so a CI gate never passes what it could not read
      (PORTAL_CALL_UNRESOLVED). And a file importing a technology's package — itself, or through the
      UNOWNED modules it imports (a module no component realizes, read as if inlined in its
      importer, transitively to a bounded depth, the finding naming the hops; a module a component
      realizes is judged as its own) — while no component it realizes is that technology's home is
      the leak TECH_LEAKAGE refuses in the design (TECH_LEAKAGE_IN_CODE): a technology's packages
      are its declared tokens (its name, or its `matches`), the curated built-in table of the common
      packages its name is known by (postgres: pg, postgres, @neondatabase/serverless,
      @vercel/postgres; mysql: mysql2, mysql; redis: redis, ioredis; mongodb: mongodb, mongoose;
      sqlite: better-sqlite3, sqlite3; kafka: kafkajs; rabbitmq: amqplib — an HTTP client is never a
      technology leak), and the packages a loaded pack contributes for it, each compared exactly
      with an import's package name. A package of the built-in table or of a loaded pack whose
      technology NO implementation binds is reported too, since the design never says where that
      technology lives: bind it on the data-layer component that owns the vendor call. Only
      exact-grade analyzed files participate; chained subprojects validate standalone.
    signature: 'dependencyConformance(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: UNDECLARED_DEPENDENCY
        severity: warning
        summary: >-
          A runtime import, a call through a type-only-imported collaborator, or a Portal's call the
          type checker resolves into another component's file, between component-mapped files has no
          declared dependsOn/owns (or published-surface) justification
      - code: UNREALIZED_DEPENDENCY
        severity: warning
        summary: >-
          A declared dependsOn/owns edge between components in different files is realized by no
          import between any of their files, nor by any call the type checker lands across it
      - code: PORTAL_WRITE_SHORTCUT_IN_CODE
        severity: error
        summary: >-
          A Portal's code calls, or takes as a value, a write- or lifecycle-effect method of a data
          component (Repository, Index, Store, Registry) — directly or through unowned code it calls
          — the code twin of PORTAL_WRITE_SHORTCUT: mutations route through an Orchestrator
      - code: TECH_LEAKAGE_IN_CODE
        severity: warning
        summary: >-
          A source file imports a technology's package although no component it realizes binds that
          technology — the code twin of TECH_LEAKAGE
      - code: PORTAL_CALL_UNRESOLVED
        severity: warning
        summary: >-
          A call in a Portal's own code, under the name of a data component's write- or
          lifecycle-effect method — or with its member picked by a computed key on a receiver that
          was a data component before a cast — goes through a receiver the analysis cannot resolve
          (typed any or unknown, cast to either or to an index signature, or typed nothing) —
          neither proven a shortcut nor cleared, so it fails closed until the receiver carries its
          type
  - name: integrationSimDeclaration
    description: >-
      Rule integration-sim-declaration. Once a subsystem has adopted integration sims (its first
      declared L4 simPath), every OTHER complete, non-leaf implementation of that subsystem whose
      realization has begun must declare one too: its unit suite proves contract shape against
      mocks, not that the wired components run together. A leaf component's unit suite IS its sim, a
      subsystem that has adopted nothing is never flooded, and an implementation with no code yet
      (code_index.holdsAny over its named files is false — none named, or only planned ones) has
      nothing to wire and is not asked for a harness.
    signature: 'integrationSimDeclaration(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: MISSING_INTEGRATION_SIM
        severity: warning
        summary: Complete non-leaf implementation in a sim-adopting subsystem declares no simPath
  - name: integrationSimFile
    description: >-
      Rule integration-sim-file. A declared L4 simPath must resolve to a readable, committed file
      inside the project root — the integration harness is a re-runnable file, not a claim;
      execution stays CI's job. A harness declared for an implementation whose realization has not
      begun is planned with the code it will wire (SOURCE_FILE_PLANNED, a notice; an error under
      rules.conformance.requireCode), so a design may name its harness up front.
    signature: 'integrationSimFile(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: SIM_FILE_MISSING
        severity: warning
        summary: >-
          Declared simPath resolves to no file inside the project root although the implementation
          it wires has begun
      - code: SOURCE_FILE_PLANNED
        severity: notice
        summary: >-
          A declared simPath is not on disk and the implementation it wires has no code yet either —
          planned, not written yet
  - name: integrationSimWiring
    description: >-
      Rule integration-sim-wiring. A committed integration harness's import graph — closed
      transitively over the analyzed module set, exact grade only — must reach at least one of the
      component's own source modules (its implementation's or a method's) and at least one source
      module of each direct dependsOn/owns component (technology-boundary dependencies exempt: their
      contract-faithful fakes are sanctioned). Execution is CI's job — this proves wiring, never
      that the sim passes.
    signature: 'integrationSimWiring(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: UNWIRED_INTEGRATION_SIM
        severity: warning
        summary: Sim file does not import the real modules it claims to wire
  - name: integrationSimCoverage
    description: >-
      Rule integration-sim-coverage. Once a committed integration harness carries
      sim:<component-id>. anchors, that component claims path coverage: every narrated method's
      happy path and every labeled throw step needs its exact sim:<component>.<method>[:<label>]
      string-literal anchor. Anchors prove the path is NAMED — assertion quality and execution stay
      CI's job.
    signature: 'integrationSimCoverage(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: SIM_PATH_UNCOVERED
        severity: warning
        summary: >-
          A narrative path has no sim:<component>.<method>[:<label>] anchor in the component's
          coverage-opted harness
  - name: typeRealization
    description: >-
      Rule type-realization. Code↔spec Level 1 for the data model: a type that names a sourcePath is
      claiming code. Until that claim has BEGUN (code_index.holdsAny over the type's own file and
      its methods' files) a named file that is not on disk is PLANNED (SOURCE_FILE_PLANNED, a
      notice; an error under rules.conformance.requireCode). Once it has begun, every file it names
      must resolve to a real, readable file inside the project root (MISSING_SOURCE_FILE, an error,
      otherwise), its file must PUBLISH its declaration (an exported name at exact grade, the
      declaration tier below it, under its `symbol` when the code-level name differs from the type's
      name — and a pure re-export barrel publishes nothing of its own, so a claim on one is never
      realized), and each of its pure methods must appear in its own file (the method's sourcePath,
      else the type's) at the declaration tier, under the method's `symbol`, else the method's name.
      A type that names no sourcePath of its own claims no code, so nothing ever compares its shape
      with the code — and that is said, never left silent: before the code of the type's subsystem
      has begun (no file an implementation of that subsystem names exists; for a type no subsystem
      owns, no file of any implementation) it is unlinked design (MISSING_TYPE_SOURCE_PATH, a notice
      — plan the type's sourcePath with the implementations'), and once that code exists it is a
      type no check reads (a warning). rules.conformance.requireCode reports the notice at error,
      naming the setting. Findings carry the analysis grade, a file that escapes the root or could
      not be analyzed is reported once and blocks only what it would have realized, and types under
      chained subsystems (projectPath) validate standalone in their own project run.
    signature: 'typeRealization(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: UNREALIZED_TYPE
        severity: warning
        summary: >-
          A type names a sourcePath but its declaration is nowhere in that file — the claim points
          at code that does not hold it
      - code: UNREALIZED_TYPE_METHOD
        severity: warning
        summary: >-
          A pure method of a claimed type is nowhere in its own source file (the method's
          sourcePath, else the type's)
      - code: MISSING_SOURCE_FILE
        severity: error
        summary: >-
          A source file a type or one of its methods names does not resolve to a file on disk
          although the type's realization has begun (another file it names exists)
      - code: SOURCE_PATH_ESCAPES_ROOT
        severity: error
        summary: >-
          A source file a type or one of its methods names is absolute or escapes the project root
          (containment refusal)
      - code: CONFORMANCE_ANALYSIS_SKIPPED
        severity: warning
        summary: >-
          A source file a type or one of its methods names could not be analyzed (binary/unreadable)
          — what it would have realized was not checked
      - code: SOURCE_FILE_PLANNED
        severity: notice
        summary: >-
          A source file a type names is not on disk and none of its named files is — planned, not
          written yet; an error under rules.conformance.requireCode
      - code: MISSING_TYPE_SOURCE_PATH
        severity: notice
        summary: >-
          A type names no sourcePath of its own, so its shape is never compared with code — a notice
          while its subsystem has no code yet (plan the path with the implementations'), a warning
          once it has; an error under rules.conformance.requireCode
  - name: unclaimedSource
    description: >-
      Rule unclaimed-source. Code↔spec Level 1, asked the other way round: every source file under
      the project's declared source roots must be named by some spec — an implementation's
      sourcePath, a method's, a simPath, a binding module an implementation declares in `bindings`,
      or a type's — or be carried in the frozen `rules.conformance.unclaimed` list. A pure re-export
      barrel declares nothing of its own and only republishes other modules, so it has no code to
      claim and is exempt (exact grade only: a weaker grade cannot tell a barrel from a file it
      failed to parse). Declaring no source roots leaves the check silent, which is what makes it
      opt-in; the unclaimed list is a one-way debt register, so an entry the walk no longer finds
      unclaimed must be deleted and the list can only shrink.
    signature: 'unclaimedSource(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: UNCLAIMED_SOURCE_FILE
        severity: warning
        summary: >-
          A source file under a declared source root that no spec names and the frozen unclaimed
          list does not carry — code nobody designed
      - code: STALE_UNCLAIMED_ENTRY
        severity: warning
        summary: >-
          An entry of the frozen unclaimed list names a file that is now claimed, or that the
          source-root walk no longer finds — delete it, the list only shrinks
  - name: carriedDebt
    description: >-
      Rule carried-debt. The conformance debt register (`rules.conformance.carried`) holds the
      code↔spec findings this tree carries as declared, classified debt — `unclaimed`'s one-way
      shape, for findings about code a spec does name. It is not a second lint.allow: an allow says
      a finding is wrong here by design, an entry here says the finding is right and unpaid, and
      each entry states which of the three kinds it is (drift: spec and code disagree; undecided:
      the fix waits on a modelling decision nobody has taken; unreadable: the analysis cannot follow
      the shape the code is written in) and why. Only a code a rule declares CARRYABLE may appear,
      and naming any other is an error, so the register can never widen into general-purpose
      suppression. An entry carries a finding only when it lists EVERY unit that finding reports, so
      an aggregating finding cannot grow behind it; an entry that matched nothing, that duplicates
      another, that names a spec the tree does not hold, or that lists a unit no longer reported is
      STALE_CARRIED_FINDING, so the register only shrinks. The audit is silent in a run that could
      not have fired the findings at all: one that built no code model, the specs outside a scoped
      run, and a code the project switched off. Nothing can check a reason for TRUTH — a stale entry
      is one that stopped applying, never one that still applies for a reason that has become false
      — so a reason group may declare its own classification provisional (`revisit`: what would
      settle it), and every run counts those findings beside the kind totals.
    signature: 'carriedDebt(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: UNCARRYABLE_FINDING
        severity: error
        summary: >-
          The conformance debt register names an issue code no rule emits, or one no rule declares
          carryable — the register holds measured code↔spec debt, never a design rule somebody wants
          quiet
      - code: STALE_CARRIED_FINDING
        severity: warning
        summary: >-
          An entry of the conformance debt register carries a finding that no longer fires, or lists
          a unit that finding no longer reports — delete it, the register only shrinks
  - name: exportConformance
    description: >-
      Rule export-conformance. Code-to-contract for the SURFACE: does this file publish anything the
      components it realizes never promised, that another component then takes? The rest of the
      conformance set reads contract-to-code (it asks whether the code holds what a spec claims), so
      a file could export whatever it liked under a component's name and nothing looked. That is one
      half of the same hole as a contract promising a parameter it never passes. A method's
      `exportedVia` names the export a consumer imports to REACH it: the value that composes it,
      which `symbol` cannot name because `symbol` names the function inside. A Portal
      implementation's `router` names the entry whatever serves the Portal calls to hand it its
      requests. Both are declared publication, and a declared handle the file does not actually
      export is itself a finding, so naming one can never become a free-text suppression. Both
      questions are asked only of a file read at exact grade, and a taker counts only when its own
      import specifier resolves to the file it is accused of taking from: below that nothing
      separates an export from a mention, or a shared word from a shared module. A taker inside the
      owns fence is no crossing: a pattern constructs the blocks it owns, so the owner's file, or
      another member of the same pattern, importing a member's class is the owns relation made real.
    signature: 'exportConformance(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: 'The rule context: specs, the code model, and the issue sink'
    findings:
      - code: UNDECLARED_EXPORT
        severity: warning
        summary: >-
          A file realizing a component exports a name no contract of that component declares, and a
          file realizing a DIFFERENT component imports it — a surface reached across a boundary that
          the design never promised
      - code: UNREALIZED_EXPORT_HANDLE
        severity: warning
        summary: >-
          A declared publication handle (a method's `exportedVia`, or a Portal implementation's
          `router`) names an export its own source file does not have: the spec names a route to the
          code that nobody can import
  - name: typeShape
    description: >-
      Rule type-shape. Code-to-contract for the DATA: a type spec's `fields` are compared, name by
      name, against the shape its `sourcePath` actually declares. `typeRealization` asks whether a
      type EXISTS in code; nothing asked whether it is the shape the spec claims, so a type spec
      could describe two fields of a six-field record — and call the two that are optional required
      — straight through a lock and a CI gate, while the ERD, the agent briefs and every implementer
      read it as truth. That is the worst of the code-to-spec gaps, because a wrong signature
      eventually breaks at a call site and a type spec that lies is only ever read by humans and
      agents. Two origins answer at exact grade: a DECLARED shape, whose members the file lists — a
      class's constructor parameter properties (`constructor(public readonly amount: number)`) among
      them, the language's shorthand for a field declaration, while a PRIVATE field a getter of the
      same class reads is that getter's backing storage, implementation rather than the type's data,
      and is no member — and a DERIVED one, an alias followed one hop to the object literal its
      schema is built from, where the keys are the members — and on through a composition the same
      file writes out (`Base.extend({…})` on a schema constant it declares), the extension's keys
      laid over the base's. A shape that extends another is judged on what it shows and never on
      what it omits, since its inherited members are not in this file to count. A NAMED SCALAR (a
      value-object declaring `holds`) has no field list: its shape is the primitive it holds,
      compared with the right side of the type alias the file declares under its name, read through
      the file's dialect (`type PackPath = string` agrees with holds string); an object shape under
      that name, or an alias the dialect does not read as that primitive, is TYPE_HOLDS_MISMATCH.
    signature: 'typeShape(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: UNREALIZED_TYPE_FIELD
        severity: warning
        summary: >-
          A type spec declares a field the shape at its sourcePath does not carry — the spec
          describes data the code does not have, and every reader of the ERD and the briefs has been
          told it exists
      - code: UNDECLARED_TYPE_FIELD
        severity: warning
        summary: >-
          The shape at a type's sourcePath carries a field the type spec does not declare — data the
          design never described, so no diagram draws it and no brief hands it to an implementer
      - code: TYPE_FIELD_OPTIONALITY
        severity: warning
        summary: >-
          A type spec and the shape at its sourcePath disagree about whether a field may be absent —
          one of them is telling a reader the data is guaranteed when it is not, or the reverse
      - code: TYPE_HOLDS_MISMATCH
        severity: warning
        summary: >-
          A named scalar's holds disagrees with what its sourcePath declares under its name — an
          alias of another type, or a record — so every reader is told one value of it is something
          the code says it is not
  - name: paramConformance
    description: >-
      Rule param-conformance. Code-to-contract for the SIGNATURE, the last of the three readings a
      spec-driven gate never made: a contract declares `params`, and nothing ever compared them to
      the parameters of the function that realizes the method. A contract could promise an argument
      the code does not take, take one the contract never mentions — including a secret — or name
      the same argument two different things, and the brief handed to an implementer would carry the
      contract's version. Parameters are matched by POSITION against the tail of the realization's
      list, and the declared type is what tells a rename from a dropped argument: `seed(config:
      HostConfig)` realized as `bootstrapInstance(cfg: HostConfig)` is one parameter under two
      names, which anything matching on names alone reads as a parameter the code lost. Types agree
      when the code's annotation, read through the dialect of the language the file was analyzed as
      (type_dialect.agrees), is the contract's canonical type — so `string[]` in the code agrees
      with `list<string>` in the contract, TypeScript's `number` with int and float alike, and an
      annotation the dialect cannot read agrees with nothing; a named type agrees through its
      code-level name, an EXTERNAL one (`alias::name`) through the name its pinned snapshot gives
      it, else its public name's last segment in the code's type casing — so a rename is reported
      the same whether the parameter's type is the project's own, a producer's or a primitive. A
      parameter whose name starts with an underscore is the universal mark of one the signature must
      take but does not use — the request and URL a transport hands a handler — so it is never
      undeclared: where the code takes more than the contract declares, underscore-named parameters
      are set aside first, front first, so they are never paired with a declared argument, and a
      name compared for a rename is read without its leading underscores. Where the code takes more
      parameters than the contract declares and its TRAILING ones carry the contract's names one for
      one while its leading ones do not, the leading surplus is what is undeclared — an inserted
      first argument is named, never the declared one it pushed along. What a realization takes
      BEFORE the contract's own parameters is wiring, and it is declared on the implementation as
      `injectedParams` rather than inferred, because an inferred prefix cannot be told from a
      renamed first argument. A method the named file only CALLS is left to `methodRealization`,
      which already reports that the body is not here.
    signature: 'paramConformance(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: UNREALIZED_PARAM
        severity: warning
        summary: >-
          A contract declares a parameter the function realizing the method does not take — the
          contract promises an argument that would go nowhere, and every brief and caller built from
          it passes one
      - code: UNDECLARED_PARAM
        severity: warning
        summary: >-
          The realizing function takes a parameter no contract parameter names and no declared
          injection accounts for — an argument a caller must supply that the design never mentions
      - code: PARAM_NAME_MISMATCH
        severity: warning
        summary: >-
          A contract parameter and the one realizing it agree on position and type but not on name —
          the contract, the ERD and every brief say one word while the code says another
      - code: PARAM_OPTIONALITY
        severity: warning
        summary: >-
          A contract and its realization disagree about whether a parameter may be left out — one of
          them is telling a caller an argument is required when it is not, or the reverse
  - name: routeCoverage
    description: >-
      Rule route-coverage. Code-to-contract for the ROUTES: does every route a router actually
      answers have a contract endpoint, and does every contract endpoint have a route that answers
      it? A portal's endpoints are what its contract promises; the router is what the code serves;
      nothing compared the two, so a route with no contract (including a write) could run for months
      without a single rule noticing. The Portal's own implementation names its router entry
      (`router`, code linkage), and the routes are read out of that function's guards. A leading
      path segment the router never checks is completed from the first segments of the Portal's own
      HTTP endpoint paths, the segments whatever serves the Portal routes on. Which process serves
      which Portal is implementation, so no listener is consulted. One idiom is read (a method
      comparison with comparisons on the path's split segments), and a router that yields no route
      in it is reported as unread, never passed: a check that cannot see a router must say so rather
      than stay quiet.
    signature: 'routeCoverage(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: UNDECLARED_ROUTE
        severity: warning
        summary: >-
          A router answers a route that no contract endpoint of the portal it serves declares — a
          surface the code serves and the design never promised
      - code: UNROUTED_ENDPOINT
        severity: warning
        summary: >-
          A contract endpoint no route of the portal's router answers — the contract promises a
          route that no request can reach
      - code: UNREADABLE_ROUTER
        severity: warning
        summary: >-
          A Portal's router entry yields no route this analysis can read, so its routes were not
          checked against the contract at all
  - name: portalImports
    description: >-
      Rule portal-imports. A runtime import that crosses a subsystem boundary must land on a file
      that realizes one of the target subsystem's PUBLISHED components — its portal file.
      dependency-conformance asks whether the hop is declared; this asks where it lands. An import
      that reaches past the portal into a concrete module can use anything that module exports,
      published or not, so the portal stops being the boundary and names no contract ever promised
      leak across it — which is how a surface grows that nobody designed. In-process it is cosmetic
      at runtime; it is not cosmetic for the contract. Only exact-grade component-mapped files
      participate; type-only imports are exempt; chained subprojects validate standalone.
    signature: 'portalImports(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: IMPORT_BYPASSES_PORTAL
        severity: warning
        summary: >-
          A runtime import crosses into another subsystem through a file that realizes none of its
          published components
  - name: enumValues
    description: >-
      Rule enum-values. Code-to-contract for an ENUM: an enum type's values are compared, name by
      name, with the values the declaration at its sourcePath holds — a string-literal union alias,
      the array a z.enum constant holds, or a string enum's member values
      (source_file_facts.enumValues). `typeRealization` already asks whether the declaration exists;
      nothing asked whether it holds the values the design lists, and an enum is read by every
      diagram, OpenAPI document and brief as the closed set it claims. Exact grade only; a
      declaration the analyzer reads no values from is typeRealization's question, never this
      rule's. Order is not judged: languages differ on whether declaration order is observable.
    signature: 'enumValues(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: UNREALIZED_ENUM_VALUE
        severity: warning
        summary: >-
          An enum type lists a value the declaration at its sourcePath does not hold — the design
          promises a value the code would reject
      - code: UNDECLARED_ENUM_VALUE
        severity: warning
        summary: >-
          The declaration at an enum type's sourcePath holds a value the enum does not list — a
          value the design never described
  - name: asyncConformance
    description: >-
      Rule async-conformance. Code-to-contract for ASYNC: a contract method whose returns is `async
      T` is realized by a function that completes later, and one whose returns is not, by one that
      completes now — every caller in every language with async/await is shaped by the difference,
      so a contract that hides it misleads every implementer and translation built from it. Compared
      with source_file_facts.asyncFunctions for the method's realizing function (under its
      `symbol`), at exact grade only; where a name has several bodies only what they all agree on is
      reported, as param-conformance does. A method whose file only calls the function is
      methodRealization's finding.
    signature: 'asyncConformance(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: ASYNC_MISMATCH
        severity: warning
        summary: >-
          A contract method and the function realizing it disagree about whether the call completes
          later: the returns says `async T` and the code completes now, or the code is async and the
          returns does not say so
  - name: bindingModules
    description: >-
      Rule binding-modules. Code-to-pin for a consumer's hand-written binding module
      (implementation_spec.bindings): the one file where the consumer's code spells another
      project's names is compared with the pinned snapshots of the externals the implementation's
      component reaches, so a re-pin that renamed, removed or reshaped a name the binding still
      declares is reported instead of surviving tsc and the tests on the binding's own stale
      declarations. A member project the component reaches (an alias the bound root declares under
      `members`, which is read live and never pinned) is compared the same way against what its L0
      export table exports now — each exported contract's methods with their params and rename
      traces, each exported type's fields with theirs — so a parameter, field or method rename in a
      member reaches a member consumer at validate time, with the rename to follow, as a pinned
      consumer is told at re-pin. Each binding declaration is matched to a pinned interface or type
      by the `alias::name` its doc comment names, else by name (nameKey of the interface's id or
      name, a type's id or name, with an Api/Port/Client suffix ignored), else — for an interface
      with methods — by the pinned interface most of its member names belong to (a trace in
      `formerly` counts); an exported function is matched by name against the methods of every
      pinned interface. A matched member that is a pinned name's former name is reported with the
      rename to follow; a member of a matched interface the pin does not export, a parameter list
      whose arity or names differ from the pinned method's (a param's previousNames giving the
      rename), and a field the matched pinned type does not declare (a field's `formerly` giving the
      rename) or a pinned field the binding lacks are reported. Names compare by nameKey, so
      snake_case and camelCase spellings of one name agree. A declaration nothing matches is the
      binding's own plumbing and is never judged. A binding that cannot be read, is not TypeScript
      or JavaScript, or whose implementation's component reaches neither a pinned external nor a
      member project is reported once as unread — a notice, so a planned binding passes a
      design-only gate.
    signature: 'bindingModules(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: BINDING_DRIFT
        severity: warning
        summary: >-
          A binding module declares a producer name its pin (or a member project's live export)
          renamed (with the rename to follow) or no longer exports, a parameter list that differs
          from the pinned method's, or fields that differ from the pinned type's — code calling into
          another project through a shape the pin no longer has
      - code: BINDING_UNREAD
        severity: notice
        summary: >-
          A binding module an implementation names could not be compared with a pin: it is not on
          disk yet, escapes the root, cannot be read, is in a language the reader does not read, or
          its component reaches neither a pinned external nor a member project
