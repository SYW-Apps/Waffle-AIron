id: iaudit_repository
name: Audit Repository Interface
description: >-
  Facade contract for durable hosted audit storage. Hosted workflows append events through this
  contract and admin-only workflows query or prune through it.
component: audit_repository
methods:
  - name: append
    description: >-
      Append one redacted audit event if the policy says it should be persisted. The repository must
      reject raw token, secret, or full-spec payload metadata.
    signatureFrom: audit_registry.append
  - name: query
    description: Return redacted audit events matching an admin query filter.
    signatureFrom: audit_index.query
  - name: count
    description: Count redacted audit events matching an admin query filter.
    signatureFrom: audit_index.count
  - name: prune
    description: Apply retention policy and delete expired audit events.
    signatureFrom: audit_registry.prune
status: complete
createdAt: '2026-07-08T20:17:01.026Z'
updatedAt: '2026-10-03T21:09:41.342Z'
