id: iauthorization
name: Authorization Interface
description: >-
  The I/O-backed authorization seam. The caller has already authenticated (holds a Principal with
  its permissionSubject); this gathers the permission world — including the member records' parent
  links, so a member resolves through its project chain — and delegates to the pure permission
  rules. Performs no authentication and no workflow routing.
component: authorization
methods:
  - name: authorize
    description: >-
      Gather the permission world (assignments, roles, organization units, placements) and resolve
      the principal's effective permission (yes/approval/no) for the capability at the target scope
      through the permission rules, using the principal's permissionSubject. Consumers branch on the
      returned value: yes acts, approval gates, no denies.
    signature: >-
      authorize(principal: Principal, capability: string, scopeKind: string, scopeId: string):
      EffectivePermission
    returns: EffectivePermission
    params:
      - name: principal
        type: Principal
      - name: capability
        type: string
      - name: scopeKind
        type: string
      - name: scopeId
        type: string
  - name: visibleScopes
    description: >-
      Gather the permission world and compute the scopes on which the principal's effective
      permission for the capability is yes or approval (actionable), plus their ancestor breadcrumb
      (context) — for scope-filtered control-plane listings and the hierarchical UI. Delegates to
      permission_rules.resolveVisibleScopes.
    signature: 'visibleScopes(principal: Principal, capability: string): VisibleScope[]'
    returns: VisibleScope[]
    params:
      - name: principal
        type: Principal
      - name: capability
        type: string
  - name: world
    description: >-
      Gather the permission world exactly as authorize resolves over it — assignments, organization
      units, placements, the member records' parent links, and the stored roles MERGED with the
      intrinsic built-in roles — for a caller that must reason about resolution itself (the member
      upgrade's reach proof, a membership change's reach listing). A read; performs no
      authentication.
    signature: 'world(): PermissionWorld'
    returns: PermissionWorld
    params: []
  - name: reach
    description: >-
      Gather the permission world once and answer which of the given hosted records the principal
      may read (project:read yes) and write (project:write yes at the project rung), each resolved
      through its OWN chain — its own scope, its parents', its family root's units — so a parent's
      grant reaches its members and an explicit no on a member removes it; and, per record, the
      subsystem rungs the principal meets there (each subsystem carrying a setting that applies to
      the principal, with project:write resolved at it). The data plane asks it for the bound
      project's family, so a family run composes, a family migration writes only within it, and a
      spec write lands only in a subsystem the principal may change. With no subsystem settings the
      subsystems list is empty and the answer is exactly what it was before subsystem rules existed.
    signature: 'reach(principal: Principal, projectIds: string[]): FamilyReach'
    returns: FamilyReach
    params:
      - name: principal
        type: Principal
      - name: projectIds
        type: string[]
        description: The record ids to judge, typically the bound project's family
  - name: explain
    description: >-
      Gather the permission world and resolve a GIVEN subject's effective permission for a
      capability at a target scope (unit, project or subsystem) through the permission rules — the
      same walk authorize takes for a principal — answering the value, its source and the rung that
      decided it. For the permission administration's explanation of why someone can or cannot act;
      it authenticates and authorizes nobody, so its caller must already have authorized the asker
      over the scope.
    signature: >-
      explain(subject: PermissionSubject, capability: string, scopeKind: string, scopeId: string):
      EffectivePermission
    returns: EffectivePermission
    params:
      - name: subject
        type: PermissionSubject
        description: The subject explained, as its user record resolves it
      - name: capability
        type: string
      - name: scopeKind
        type: string
      - name: scopeId
        type: string
    guarantees:
      - idempotent
status: complete
