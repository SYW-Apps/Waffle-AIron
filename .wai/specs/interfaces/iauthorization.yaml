id: iauthorization
name: Authorization Interface
description: >-
  The I/O-backed authorization seam. The caller has already authenticated (holds a Principal with
  its permissionSubject); this gathers the permission world and delegates to the pure permission
  rules. Performs no authentication and no workflow routing.
component: authorization
methods:
  - name: authorize
    description: >-
      Gather the permission world (assignments, roles, organization units, placements) and resolve
      the principal's effective permission (yes/approval/no) for the capability at the target scope
      through the permission rules, using the principal's permissionSubject. Consumers branch on the
      returned value: yes acts, approval gates, no denies.
    signature: >-
      authorize(principal: Principal, capability: string, scopeKind: string, scopeId: string):
      EffectivePermission
    returns: EffectivePermission
    params:
      - name: principal
        type: Principal
      - name: capability
        type: string
      - name: scopeKind
        type: string
      - name: scopeId
        type: string
  - name: visibleScopes
    description: >-
      Gather the permission world and compute the scopes on which the principal's effective
      permission for the capability is yes or approval (actionable), plus their ancestor breadcrumb
      (context) — for scope-filtered control-plane listings and the hierarchical UI. Delegates to
      permission_rules.resolveVisibleScopes.
    signature: 'visibleScopes(principal: Principal, capability: string): VisibleScope[]'
    returns: VisibleScope[]
    params:
      - name: principal
        type: Principal
      - name: capability
        type: string
  - name: world
    description: >-
      Gather the permission world exactly as authorize resolves over it — assignments, organization
      units, placements, and the stored roles MERGED with the intrinsic built-in roles — for a
      caller that must reason about resolution itself (the member upgrade proves no-widening over
      it). A read; performs no authentication.
    signature: 'world(): PermissionWorld'
    returns: PermissionWorld
    params: []
  - name: reach
    description: >-
      Gather the permission world once and answer which of the given hosted records the principal
      may read (project:read yes) and write (project:write yes), each resolved over its OWN record
      through the permission rules — a member's reach is never inferred from its parent's. The data
      plane asks it for the bound project's family, so a family run composes and a family migration
      writes only within it.
    signature: 'reach(principal: Principal, projectIds: string[]): FamilyReach'
    returns: FamilyReach
    params:
      - name: principal
        type: Principal
      - name: projectIds
        type: string[]
        description: The record ids to judge, typically the bound project's family
status: complete
