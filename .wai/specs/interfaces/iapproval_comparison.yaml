id: iapproval_comparison
name: Approval Comparison Interface
description: >-
  The approval's arithmetic over a spec tree: what the tree digests to now, what the record says it
  digested to when it was approved, and the difference. Every read defaults to the bound project
  root, so a caller that has one tree passes nothing. Nothing here throws on an unapproved project —
  a tree with no record answers null, because "never approved" and "approved and drifted" are
  different answers and a caller has to tell them apart.
component: approval_comparison
methods:
  - name: captureApprovedSpecs
    description: >-
      Build the per-spec digest map to write into an approval record, for the tree as it stands: the
      project's own spec files by their path from its root, and — since stage 8 — each part's spec
      files under `members/<alias>/<path inside the part>`, so a part's specs are approved by its
      parent's lock spec by spec and moving a part's storage changes no key. A part fetched from git
      is digested from the cache at its pinned commit.
    signature: 'captureApprovedSpecs(root?: string): Record<string, string>'
    returns: Record<string, string>
    params:
      - name: root
        type: string
        description: The project root being approved; the bound project when omitted
        optional: true
  - name: diffAgainstApproval
    description: >-
      What differs between the tree as it stands and the approval on record: which specs were added,
      which changed, which were removed, and which are untouched. Null when the project has no
      record at all — never approved is not the same as approved and drifted.
    signature: 'diffAgainstApproval(root?: string): ApprovalDiff | null'
    returns: ApprovalDiff | null
    params:
      - name: root
        type: string
        description: The project root to compare; the bound project when omitted
        optional: true
    guarantees:
      - idempotent
  - name: approvalRecord
    description: The approval record this project carries, or null when it has none.
    signature: 'approvalRecord(root?: string): LockRecord | null'
    returns: LockRecord | null
    params:
      - name: root
        type: string
        description: The project root; the bound project when omitted
        optional: true
    guarantees:
      - idempotent
  - name: settledSpecPaths
    description: >-
      The spec paths the approval on record covers, as a set for membership tests. Null when there
      is no record.
    signature: 'settledSpecPaths(root?: string): Set<string> | null'
    returns: Set<string> | null
    params:
      - name: root
        type: string
        description: The project root; the bound project when omitted
        optional: true
    guarantees:
      - idempotent
  - name: verdict
    description: >-
      What the lock says about the tree as it stands, as a line to show plus whether it is drift.
      Silent for a project that was never approved. Takes the pin tree the caller obtained from the
      validator (validator_portal.familyApprovals), because a member's state and its pin need gate
      identities that only the validator computes: the verdict names each direct member whose pin
      MOVED (its parent's lock records another subject than the member carries now — so this lock is
      stale until it re-locks) and each that is drifted or never approved, and says plainly when
      this project's own lock was taken under an earlier gate identity ("the gate identity gained
      inputs in stage 5 — re-lock once"). Without approvals it reports the own-spec diff alone.
      Published rather than kept private because every presenter needs the same answer — the
      terminal, the MCP status tool and anything else — and two renderings of "has this drifted"
      that can disagree is precisely the thing a lock exists to prevent.
    signature: 'verdict(approvals?: ProjectApproval[]): ApprovalVerdict'
    returns: ApprovalVerdict
    params:
      - name: approvals
        type: ProjectApproval[]
        description: >-
          The pin tree from validator_portal.familyApprovals: the root's own entry and its members'.
          Omitted: no member or upgrade note.
        optional: true
    guarantees:
      - idempotent
status: complete
