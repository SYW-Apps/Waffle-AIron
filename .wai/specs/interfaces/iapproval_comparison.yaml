id: iapproval_comparison
name: Approval Comparison Interface
description: >-
  The approval's arithmetic over a spec tree: what the tree digests to now, what the record says it
  digested to when it was approved, and the difference. Every read defaults to the bound project
  root, so a caller that has one tree passes nothing. Nothing here throws on an unapproved project —
  a tree with no record answers null, because "never approved" and "approved and drifted" are
  different answers and a caller has to tell them apart.
component: approval_comparison
methods:
  - name: captureApprovedSpecs
    description: >-
      Build the per-spec digest map to write into an approval record, for the tree as it stands:
      each spec parsed and projected to its design view — an implementation, type or component
      through its type's designView, every other kind with its timestamps dropped — canonicalized
      and digested, so code linkage (sourcePath, symbol, exportedVia, simPath, injectedParams,
      conformance tiers, external links), readiness, whitespace and a no-op re-save never move a
      digest. Keyed by the project's own spec files' path from its root, and each part's under
      `members/<alias>/<path inside the part>`. A part fetched from git is digested from the cache
      at its pinned commit.
    signature: 'captureApprovedSpecs(root?: string, scope?: any): map<string, string>'
    returns: map<string, string>
    params:
      - name: root
        type: string
        description: The project root being approved; the bound project when omitted
        optional: true
      - name: scope
        type: any
        description: >-
          { paths: Set<string> } — a scoped approval (lock --subsystem) restricts the capture to
          those spec files; everything outside keeps the approval it already had. Omitted captures
          the whole tree
        optional: true
  - name: diffAgainstApproval
    description: >-
      What differs between the tree as it stands and the approval on record, compared as design
      digests (the one reading a format-4 record carries). Which specs were added, which changed,
      which were removed, and which are untouched — and which only MOVED: an added path and a
      removed one carrying the same digest are one spec whose storage moved with its content
      unchanged (a part's folder relocating it), named in `moved` and counted among the untouched.
      Null when the project has no record at all — never approved is not the same as approved and
      drifted.
    signature: 'diffAgainstApproval(root?: string): ApprovalDiff?'
    returns: ApprovalDiff?
    params:
      - name: root
        type: string
        description: The project root to compare; the bound project when omitted
        optional: true
    guarantees:
      - idempotent
  - name: approvalRecord
    description: The approval record this project carries, or null when it has none.
    signature: 'approvalRecord(root?: string): LockRecord?'
    returns: LockRecord?
    params:
      - name: root
        type: string
        description: The project root; the bound project when omitted
        optional: true
    guarantees:
      - idempotent
  - name: settledSpecPaths
    description: >-
      The spec paths the approval on record covers, as a set for membership tests. Null when there
      is no record.
    signature: 'settledSpecPaths(root?: string): set<string>?'
    returns: set<string>?
    params:
      - name: root
        type: string
        description: The project root; the bound project when omitted
        optional: true
    guarantees:
      - idempotent
  - name: verdict
    description: >-
      What the lock says about the tree as it stands, as a line to show plus whether it is drift.
      Silent for a project that was never approved. Takes the approvals the caller obtained from the
      validator (validator_portal.familyApprovals), because the approval identity and the inputs are
      judged there: the root's own entry decides drift and names what moved (the specs, else the
      policy parts in partsMoved, else the owed project id), and lists what its build inputs owe
      (ProjectApproval.inputs) as a separate line that is never drift; each direct member that is
      drifted or never approved is named as the member's to lock, never as this project's drift.
      Without approvals it reports the own-spec diff alone. Published rather than kept private
      because every presenter needs the same answer — the terminal, the MCP status tool, the dev
      page — and two renderings of "has this drifted" that can disagree is precisely the thing a
      lock exists to prevent.
    signature: 'verdict(approvals?: list<ProjectApproval>): ApprovalVerdict'
    returns: ApprovalVerdict
    params:
      - name: approvals
        type: list<ProjectApproval>
        description: >-
          The pin tree from validator_portal.familyApprovals: the root's own entry and its members'.
          Omitted: no member or upgrade note.
        optional: true
    guarantees:
      - idempotent
status: complete
