id: ispec_index
name: Spec Index Interface
description: >-
  Read/lookup face of the spec repository: per-level bulk and by-id loads, resolving file locations
  and parsing against the level schemas.
component: spec_index
methods:
  - name: loadSystemSpec
    description: Loads the L0 system specification, or null when the project has none.
    signature: 'loadSystemSpec(): SystemSpec | null'
    returns: SystemSpec | null
  - name: loadSubsystemSpecs
    description: >-
      Loads all L1 subsystem specifications, including those of chained subprojects under their
      mount's namespace. A subsystem a child declares under its mount's own local name is that mount
      — merged with it at any nesting depth — and every reference to that name inside the child
      resolves to the mount id. A mount whose path escapes the project that DECLARES it — absolute,
      ../-escaping, or through a link — is refused as PROJECTPATH_ESCAPE and not followed,
      identically from every loading root; every loader issue about a mount (escaping, cyclic,
      missing) carries the mount's qualified id, so a validation scope that includes the mount keeps
      it.
    signature: 'loadSubsystemSpecs(): SubsystemSpec[]'
    returns: SubsystemSpec[]
  - name: loadSubsystemSpec
    description: Loads a single subsystem specification by id.
    signature: 'loadSubsystemSpec(id: string): SubsystemSpec | null'
    returns: SubsystemSpec | null
  - name: loadComponentSpecs
    description: Loads all L2 component specifications.
    signature: 'loadComponentSpecs(): ComponentSpec[]'
    returns: ComponentSpec[]
  - name: loadComponentSpec
    description: Loads a single component specification by id.
    signature: 'loadComponentSpec(id: string): ComponentSpec | null'
    returns: ComponentSpec | null
  - name: loadInterfaceSpecs
    description: Loads all L3 interface specifications.
    signature: 'loadInterfaceSpecs(): InterfaceSpec[]'
    returns: InterfaceSpec[]
  - name: loadInterfaceSpec
    description: Loads a single interface specification by id.
    signature: 'loadInterfaceSpec(id: string): InterfaceSpec | null'
    returns: InterfaceSpec | null
  - name: loadImplementationSpecs
    description: Loads all L4 implementation specifications.
    signature: 'loadImplementationSpecs(): ImplementationSpec[]'
    returns: ImplementationSpec[]
  - name: loadImplementationSpec
    description: Loads a single implementation specification by id.
    signature: 'loadImplementationSpec(id: string): ImplementationSpec | null'
    returns: ImplementationSpec | null
  - name: loadTypeSpecs
    description: Loads all type specifications across flat, per-subsystem, and grouped layouts.
    signature: 'loadTypeSpecs(): TypeSpec[]'
    returns: TypeSpec[]
  - name: listChainedRoots
    description: >-
      Every chained subproject root beneath the bound project, as project-relative directories in
      walk order, recursing through nested mounts (a child that itself chains a grandchild
      contributes both). Empty for a project that chains nothing. The roots half of
      inspectChainedRoots.
    signature: 'listChainedRoots(): string[]'
    returns: string[]
    guarantees:
      - idempotent
  - name: resolveSubprojectForNamespace
    description: >-
      Resolve a chained mount's qualified namespace (e.g. `kid`, `par::kid2`) to that mount's
      project root, walking each segment through the scanned index and resolving every mount's
      projectPath against the previous mount's directory. A hop whose path escapes the project that
      declares it — absolute, ../-escaping, or through a link — is refused as a loader issue and
      skipped; returns null when no segment is a mount.
    signature: 'resolveSubprojectForNamespace(namespace: string): string | null'
    returns: string | null
    params:
      - name: namespace
        type: string
  - name: inspectChainedRoots
    description: >-
      Walk every chained mount beneath the bound project, in walk order, and report both halves: the
      project-relative roots that can be followed, and every mount that cannot — escaping the
      project that declares it (absolute, ../-escaping, or through a link), missing on disk, cyclic,
      or nested past the depth bound — each with its qualified mount id, declared path and reason.
      The one place a whole-tree operation learns whether it is seeing the whole tree.
    signature: 'inspectChainedRoots(): ChainedRootsInspection'
    returns: ChainedRootsInspection
    guarantees:
      - idempotent
  - name: loadTypeSpec
    description: >-
      Loads a single type specification by id, across the flat, per-subsystem and grouped layouts;
      null when the workspace holds none under that id.
    signature: 'loadTypeSpec(id: string): TypeSpec | null'
    returns: TypeSpec | null
    params:
      - name: id
        type: string
        description: The type's id, qualified when it lives in a chained subproject
  - name: load
    description: >-
      Load one spec of the named kind by id through the typed loader of that kind, or null when none
      is stored. The L0 is a singleton: its id is informational.
    signature: >-
      load(kind: string, id: string): SystemSpec | SubsystemSpec | ComponentSpec | InterfaceSpec |
      ImplementationSpec | TypeSpec | null
    returns: >-
      SystemSpec | SubsystemSpec | ComponentSpec | InterfaceSpec | ImplementationSpec | TypeSpec |
      null
    params:
      - name: kind
        type: string
        description: system, subsystem, component, interface, implementation or type
      - name: id
        type: string
        description: The spec id (namespaced if needed)
    effect: read
  - name: listProjectRoots
    description: >-
      The project roots the current scan read, bound root first, then each chained member in walk
      order: where each sits in the mount chain, its own L0 (qualified into its namespace), its
      configuration (read through that root's binding), the ids of the specs its files declared, and
      the references its files wrote with a leading `::`. Served from the same cached scan as every
      other read, so it is never stale with it; the scan's freshness signature also covers each
      root's .wai/project.yaml, so an edit to a root's externals re-scans.
    signature: 'listProjectRoots(): ScannedProjectRoot[]'
    returns: ScannedProjectRoot[]
    params: []
    guarantees:
      - idempotent
    effect: read
status: complete
