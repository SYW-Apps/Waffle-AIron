id: ispec_registry
name: Spec Registry Interface
description: >-
  Validated write face of the spec repository: per-level saves through the writer schema, plus the
  in-memory round-trip dry run over the same pipeline.
component: spec_registry
methods:
  - name: saveSystemSpec
    description: Validates and persists the L0 system specification.
    signature: 'saveSystemSpec(spec: SystemSpec): void'
    returns: void
  - name: saveComponentSpec
    description: >-
      Validates and persists a component specification, returning placement notices. A spec arriving
      at draft, or without a status, keeps the status already stored unless the caller states the
      demotion.
    signature: 'saveComponentSpec(spec: ComponentSpec): void'
    returns: void
  - name: saveInterfaceSpec
    description: >-
      Validates and persists an interface specification, returning placement notices. A spec
      arriving at draft, or without a status, keeps the status already stored unless the caller
      states the demotion.
    signature: 'saveInterfaceSpec(spec: InterfaceSpec): void'
    returns: void
  - name: saveImplementationSpec
    description: >-
      Validates and persists an implementation specification, returning placement notices. A spec
      arriving at draft, or without a status, keeps the status already stored unless the caller
      states the demotion.
    signature: 'saveImplementationSpec(spec: ImplementationSpec): void'
    returns: void
  - name: dryRunSerializeSpecs
    description: >-
      Re-serializes every currently loaded spec in memory through the exact writer pipeline the save
      paths use — same relativization, same schema parse — without touching the filesystem; returns
      one ROUNDTRIP_SERIALIZATION issue per refused spec and never throws for an unserializable one.
    signature: 'dryRunSerializeSpecs(include?: (specId: string) => boolean): ValidationIssue[]'
    returns: ValidationIssue[]
    guarantees:
      - idempotent
  - name: invalidateCache
    description: >-
      Drop every workspace's cached index IN PLACE (never evicting the workspace itself, so a caller
      holding a reference keeps receiving invalidations). Every save path already calls this; it is
      exposed on the contract for the one case that bypasses them — a spec tree that arrived as a
      directory swap, which the cache's own change detection would otherwise only notice after its
      staleness window.
    signature: 'invalidateCache(): void'
    returns: void
    guarantees:
      - idempotent
    effect: write
  - name: save
    description: >-
      Persist one spec through the typed writer of its kind, answering with that writer's placement
      notices; the stored status is kept on a draft or status-less save unless the caller states the
      demotion.
    signature: >-
      save(kind: string, spec: SystemSpec | SubsystemSpec | ComponentSpec | InterfaceSpec |
      ImplementationSpec | TypeSpec): string[]
    returns: string[]
    params:
      - name: kind
        type: string
        description: system, subsystem, component, interface, implementation or type
      - name: spec
        type: SystemSpec | SubsystemSpec | ComponentSpec | InterfaceSpec | ImplementationSpec | TypeSpec
        description: The spec to persist, of that kind
    effect: write
  - name: delete
    description: >-
      Delete one spec document of the named kind through the typed delete of that kind; false when
      none existed. A kind of system is refused: the L0 cannot be deleted.
    signature: 'delete(kind: string, id: string): boolean'
    returns: boolean
    params:
      - name: kind
        type: string
        description: subsystem, component, interface, implementation or type
      - name: id
        type: string
        description: The spec id (namespaced if needed)
    effect: write
  - name: deleteMount
    description: >-
      Delete the bound project's legacy L1 mount declaration for one alias — the subsystem document
      carrying projectPath that the scan reads as a member declaration and never loads as a
      subsystem. Idempotent: false when the project holds no such document. The caller carries the
      mount's fields and declares the member first; this only removes the old form.
    signature: 'deleteMount(alias: string): boolean'
    returns: boolean
    params:
      - name: alias
        type: string
        description: The mount subsystem's local id in the bound project
    guarantees:
      - idempotent
    effect: write
  - name: normalizeReferences
    description: >-
      Re-save one spec with every reference in its canonical stage-3 form: the writer's inverse
      applied to each in-memory value WITHOUT the authored-text carry, so a deprecated leading `::`,
      `super::` or member-path reference — and a self-prefixed one, the project's own id (for a
      member that declares no id, also the alias its parent declares it under) as the first segment,
      `registry::x` or the dotted `registry.x`, raw type positions included — is written as a bare
      local id or `alias::publicName` and an alias form stays as it is. Targets never change — only
      their spelling. Refuses a reference whose canonical form cannot be written (bound outside or
      unresolved while carrying a deprecated form), naming it. Answers whether the stored text
      changed; a spec already canonical writes nothing.
    signature: 'normalizeReferences(kind: string, id: string): boolean'
    returns: boolean
    params:
      - name: kind
        type: string
        description: subsystem, component, interface, implementation or type
      - name: id
        type: string
        description: The spec's in-memory key, from the family's top root
    guarantees:
      - idempotent
    effect: write
  - name: rewriteReferences
    description: >-
      Respell references at parsed positions of one spec: for each edit, the reference standing at
      its position — a whole reference value, or at a type position the one qualified token inside
      the type string, the display signature beside it included — whose text equals `from` is
      replaced by `to`, and nothing else in the document moves. Refuses the whole spec before
      writing, naming the position and both texts, when an edit's `from` is not at its position.
      Never re-derives a spelling and never whole-string or substring-matches the file. Compares the
      serialized document with the stored one and writes through the file store only when they
      differ, answering whether it wrote; the lock is never touched.
    signature: 'rewriteReferences(kind: string, id: string, edits: ReferenceEdit[]): boolean'
    returns: boolean
    params:
      - name: kind
        type: string
        description: system, subsystem, component, interface, implementation or type
      - name: id
        type: string
        description: The spec's in-memory key, from the family's top root
      - name: edits
        type: ReferenceEdit[]
        description: The edits for this spec
    guarantees:
      - idempotent
status: complete
