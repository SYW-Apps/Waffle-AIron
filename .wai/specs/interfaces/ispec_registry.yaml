id: ispec_registry
name: Spec Registry Interface
description: >-
  Validated write face of the spec repository: per-level saves through the writer schema, plus the
  in-memory round-trip dry run over the same pipeline.
component: spec_registry
methods:
  - name: saveSystemSpec
    description: Validates and persists the L0 system specification.
    signature: 'saveSystemSpec(spec: SystemSpec): void'
    returns: void
  - name: saveSubsystemSpec
    description: >-
      Validates and persists a subsystem specification. A spec arriving at draft, or without a
      status, keeps the status already stored, so re-authoring one never quietly reopens a frozen
      subsystem; a deliberate demotion is stated by the caller and honoured.
    signature: 'saveSubsystemSpec(spec: SubsystemSpec): void'
    returns: void
  - name: saveComponentSpec
    description: >-
      Validates and persists a component specification, returning placement notices. A spec arriving
      at draft, or without a status, keeps the status already stored unless the caller states the
      demotion.
    signature: 'saveComponentSpec(spec: ComponentSpec): void'
    returns: void
  - name: saveInterfaceSpec
    description: >-
      Validates and persists an interface specification, returning placement notices. A spec
      arriving at draft, or without a status, keeps the status already stored unless the caller
      states the demotion.
    signature: 'saveInterfaceSpec(spec: InterfaceSpec): void'
    returns: void
  - name: saveImplementationSpec
    description: >-
      Validates and persists an implementation specification, returning placement notices. A spec
      arriving at draft, or without a status, keeps the status already stored unless the caller
      states the demotion.
    signature: 'saveImplementationSpec(spec: ImplementationSpec): void'
    returns: void
  - name: dryRunSerializeSpecs
    description: >-
      Re-serializes every currently loaded spec in memory through the exact writer pipeline the save
      paths use — same relativization, same schema parse — without touching the filesystem; returns
      one ROUNDTRIP_SERIALIZATION issue per refused spec and never throws for an unserializable one.
    signature: 'dryRunSerializeSpecs(include?: (specId: string) => boolean): ValidationIssue[]'
    returns: ValidationIssue[]
    guarantees:
      - idempotent
  - name: invalidateCache
    description: >-
      Drop every workspace's cached index IN PLACE (never evicting the workspace itself, so a caller
      holding a reference keeps receiving invalidations). Every save path already calls this; it is
      exposed on the contract for the one case that bypasses them — a spec tree that arrived as a
      directory swap, which the cache's own change detection would otherwise only notice after its
      staleness window.
    signature: 'invalidateCache(): void'
    returns: void
    guarantees:
      - idempotent
    effect: write
  - name: saveTypeSpec
    description: >-
      Validates and persists a type specification, returning the placement notices it owes. A
      re-save updates fields in place and NEVER relocates an existing file, and under the flat
      layout a subsystem is recorded as a field while the document stays in the shared types
      directory — both are by design, and silent they would read as a parameter that was ignored, so
      each is reported.
    signature: 'saveTypeSpec(spec: TypeSpec): string[]'
    returns: string[]
    params:
      - name: spec
        type: TypeSpec
        description: The type to persist
  - name: deleteSubsystemSpec
    description: >-
      Resolve the subsystem's document path and remove it through the file store, then invalidate
      the index cache so the next read does not serve a document that no longer exists. False when
      there was nothing to remove.
    signature: 'deleteSubsystemSpec(id: string): boolean'
    returns: boolean
    params:
      - name: id
        type: string
        description: The subsystem id
    effect: write
  - name: deleteComponentSpec
    description: >-
      Resolve the component's document path and remove it through the file store, then invalidate
      the index cache. False when there was nothing to remove.
    signature: 'deleteComponentSpec(id: string): boolean'
    returns: boolean
    params:
      - name: id
        type: string
        description: The component id
    effect: write
  - name: deleteInterfaceSpec
    description: >-
      Resolve the interface's document path and remove it through the file store, then invalidate
      the index cache. False when there was nothing to remove.
    signature: 'deleteInterfaceSpec(id: string): boolean'
    returns: boolean
    params:
      - name: id
        type: string
        description: The interface id
    effect: write
  - name: deleteImplementationSpec
    description: >-
      Resolve the implementation's document path and remove it through the file store, then
      invalidate the index cache. False when there was nothing to remove.
    signature: 'deleteImplementationSpec(id: string): boolean'
    returns: boolean
    params:
      - name: id
        type: string
        description: The implementation id
    effect: write
  - name: deleteTypeSpec
    description: >-
      Resolve the type's document path and remove it through the file store, then invalidate the
      index cache. False when there was nothing to remove.
    signature: 'deleteTypeSpec(id: string): boolean'
    returns: boolean
    params:
      - name: id
        type: string
        description: The type id
    effect: write
  - name: save
    description: >-
      Persist one spec through the typed writer of its kind, answering with that writer's placement
      notices; the stored status is kept on a draft or status-less save unless the caller states the
      demotion.
    signature: >-
      save(kind: string, spec: SystemSpec | SubsystemSpec | ComponentSpec | InterfaceSpec |
      ImplementationSpec | TypeSpec): string[]
    returns: string[]
    params:
      - name: kind
        type: string
        description: system, subsystem, component, interface, implementation or type
      - name: spec
        type: SystemSpec | SubsystemSpec | ComponentSpec | InterfaceSpec | ImplementationSpec | TypeSpec
        description: The spec to persist, of that kind
    effect: write
  - name: delete
    description: >-
      Delete one spec document of the named kind through the typed delete of that kind; false when
      none existed. A kind of system is refused: the L0 cannot be deleted.
    signature: 'delete(kind: string, id: string): boolean'
    returns: boolean
    params:
      - name: kind
        type: string
        description: subsystem, component, interface, implementation or type
      - name: id
        type: string
        description: The spec id (namespaced if needed)
    effect: write
status: complete
