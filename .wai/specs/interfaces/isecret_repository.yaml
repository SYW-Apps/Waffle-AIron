id: isecret_repository
name: Secret Repository Interface
description: Contract for setting and listing the container's integration secrets. Values are never returned.
component: secret_repository
methods:
  - name: write
    description: >-
      Set a secret by key (git-token | notion-token | signing-secret | …) in the data-dir secret
      store.
    signature: 'write(key: string, value: string): void'
    returns: void
  - name: list
    description: List the configured secret keys (names only, never values).
    signature: 'list(): string[]'
    returns: string[]
  - name: resolve
    description: >-
      One key's value — stored, else its environment fallback, else null — forwarded to the secret
      index. For the host's own workflows only: the value is handed to the one call the host
      authorizes (a producer run, a git clone) as an argument, and nothing outside sdd_host can ask
      for a secret by name. Listings go through list, which never answers a value.
    signatureFrom: secret_index.resolve
  - name: resolveGit
    description: >-
      The git token for one connection: the connection's own credential ref first, when it has one
      and it is set, so each connection can carry its own personal access token, then the shared
      `git-token`. Null when neither is set (a public remote clones without one).
    signatureFrom: secret_index.resolveGit
    effect: read
status: complete
