id: ihost_surfaces_adapter
name: Host Surfaces Adapter Interface
description: Surface-artifact generation and externals status for the currently bound hosted project.
component: host_surfaces_adapter
methods:
  - name: exportSurface
    description: >-
      Project the bound project's L0 gateway surface at the audience ceiling via the surface portal;
      when format is openapi the result also carries the rendered OpenAPI 3.1 document.
    signature: 'exportSurface(maxAudience: string, format: string): SurfaceExportResult'
    returns: SurfaceExportResult
    params:
      - name: maxAudience
        type: string
      - name: format
        type: string
  - name: externalsStatus
    description: >-
      Forward getExternalsStatus to the surface portal against the currently bound project root:
      each declared external's pin against its live producer at signature level, what cannot be
      compared reported as unavailable, never a pass. The caller must gate on reach itself.
    signature: 'externalsStatus(): list<ExternalStatus>'
    returns: list<ExternalStatus>
    params: []
  - name: pinExternals
    description: >-
      Forward to surface_portal.pinExternals against the currently bound project root: pin the named
      hosted and git externals from their producers' approved states.
    signatureFrom: surface_portal.pinExternals
    effect: write
  - name: recordPacks
    description: >-
      Forward to surface_portal.recordPacks against the currently bound project root: record the
      packs as they resolve in its inputs lock.
    signature: 'recordPacks(packs: map<string, LockedPack>): void'
    returns: void
    params:
      - name: packs
        type: map<string, LockedPack>
        description: Pack name → its declared version, resolved version, source and content digest
    effect: write
status: complete
