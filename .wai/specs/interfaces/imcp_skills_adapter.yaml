id: imcp_skills_adapter
name: MCP Skills Client Adapter Interface
description: >-
  Adapter contract for the MCP server to list and read the built-in SDD skill resources, and to
  fetch the composed server instructions, across the boundary to sdd_skills.
component: mcp_skills_adapter
methods:
  - name: listResources
    description: List the built-in SDD skill resources via the skills portal.
    signature: 'listResources(): list<SkillResourceDescriptor>'
    returns: list<SkillResourceDescriptor>
    params: []
  - name: readResource
    description: Read one built-in SDD skill resource's content by id via the skills portal.
    signature: 'readResource(resourceId: string): string'
    returns: string
    params:
      - name: resourceId
        type: string
        description: The MCP resource id / skill id to read.
  - name: buildServerInstructions
    description: Fetch the composed MCP initialize instructions for the bound project via the skills portal.
    signature: 'buildServerInstructions(): string'
    returns: string
    params: []
  - name: exportSddSkills
    description: >-
      Export the SDD skills into a project a family migration made, via the skills portal, so its
      own sessions have them.
    signatureFrom: skills_portal.exportSddSkills
status: complete
createdAt: '2026-07-10T12:21:45.718Z'
updatedAt: '2026-10-07T06:21:47.972Z'
