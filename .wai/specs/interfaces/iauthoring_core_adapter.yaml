id: iauthoring_core_adapter
name: Authoring Core Client Adapter Interface
description: >-
  Client adapter to sdd_core: the spec reads and writes the gated workflow performs, and the project
  settings it judges with. A delta update and a method move let the store load what they apply to; a
  whole-spec restatement and a delete read the stored spec here, because it is the seam that decides
  what the restatement carries and which methods a deletion takes away.
component: authoring_core_adapter
methods:
  - name: updateSpec
    description: >-
      Apply a delta to one stored spec and persist the result, with the caller's judgement passed in
      as the write hook the store runs on the merged spec at the last point before anything reaches
      disk. A dry run is forwarded too: the store runs the whole write and answers with the report
      it would have produced, writing nothing. Forwarded to the core portal.
    signature: >-
      updateSpec(kind: WritableSpecKind, id: string, delta: SpecDelta, hooks?: SpecWriteHooks,
      dryRun?: bool): SpecChangeReport
    returns: SpecChangeReport
    params:
      - name: kind
        type: WritableSpecKind
        description: The kind of spec the id names
      - name: id
        type: string
        description: The stored spec's id
      - name: delta
        type: SpecDelta
        description: The partial change to merge
      - name: hooks
        type: SpecWriteHooks
        description: The write-boundary judgement to run on the merged spec
        optional: true
      - name: dryRun
        type: bool
        description: Report what the delta would do and write nothing
        optional: true
  - name: loadProjectConfig
    description: >-
      The bound project's configuration, or null when it has none — its rule severities and project
      type are what a candidate is judged with. An uninitialized or unreadable project answers with
      nothing rather than throwing: a configuration read must never be the thing that fails a write
      closed.
    signature: 'loadProjectConfig(): ProjectConfig?'
    returns: ProjectConfig?
    params: []
    guarantees:
      - idempotent
  - name: moveMethods
    description: >-
      Move methods between two components through the core's mechanical lift-and-retarget, with the
      caller's judgement passed in as the write hook the store runs on the resulting components
      before anything reaches disk. The store holds the tree, so it is the store that enumerates
      candidate homes when the move is refused and asks the hook to assess each; the seam still
      reads no spec of its own. A dry run is forwarded too. Forwarded to the core portal.
    signature: >-
      moveMethods(from: string, to: string, methods: list<string>, hooks?: SpecWriteHooks, dryRun?:
      bool): MethodMoveReport
    returns: MethodMoveReport
    params:
      - name: from
        type: string
        description: The component id the methods currently belong to
      - name: to
        type: string
        description: The component id that should receive them
      - name: methods
        type: list<string>
        description: The method names to move
      - name: hooks
        type: SpecWriteHooks
        description: >-
          The judgement to run on the resulting components, and to assess candidate homes with on a
          refusal
        optional: true
      - name: dryRun
        type: bool
        description: Report what the move would do and write nothing
        optional: true
  - name: loadSpec
    description: >-
      One stored spec of the named kind, or null — the spec a restatement is applied to, the parent
      it cannot be written without, or the spec a delete is about to remove. Forwarded to the core
      portal.
    signature: >-
      loadSpec(kind: WritableSpecKind, id: string): (SystemSpec | SubsystemSpec | ComponentSpec |
      InterfaceSpec | ImplementationSpec | TypeSpec)?
    returns: (SystemSpec | SubsystemSpec | ComponentSpec | InterfaceSpec | ImplementationSpec | TypeSpec)?
    params:
      - name: kind
        type: WritableSpecKind
        description: The kind of spec the id names
      - name: id
        type: string
        description: The spec id; informational for the L0
    guarantees:
      - idempotent
  - name: saveSpec
    description: >-
      Persist one judged spec of the named kind, returning the store's placement notices. Forwarded
      to the core portal.
    signature: >-
      saveSpec(kind: WritableSpecKind, spec: SystemSpec | SubsystemSpec | ComponentSpec |
      InterfaceSpec | ImplementationSpec | TypeSpec): list<string>
    returns: list<string>
    params:
      - name: kind
        type: WritableSpecKind
        description: The kind of spec the id names
      - name: spec
        type: SystemSpec | SubsystemSpec | ComponentSpec | InterfaceSpec | ImplementationSpec | TypeSpec
        description: The spec to persist, already judged
  - name: deleteSpec
    description: >-
      Delete one spec document of the named kind; false when none was stored. Forwarded to the core
      portal.
    signature: 'deleteSpec(kind: WritableSpecKind, id: string): bool'
    returns: bool
    params:
      - name: kind
        type: WritableSpecKind
        description: 'The kind of spec the id names (never system: the L0 is not deleted)'
      - name: id
        type: string
        description: The spec id
  - name: loadImplementationSpecs
    description: >-
      Every implementation spec of the bound tree — how the test search finds the files that realize
      a contract's methods, since a contract method's tests import its realization. Forwarded to the
      core portal.
    signature: 'loadImplementationSpecs(): list<ImplementationSpec>'
    returns: list<ImplementationSpec>
    params: []
  - name: scanAllSpecs
    description: >-
      Forward to spec_tree_portal.scanAllSpecs: the bound tree's spec index, which the gated write
      asks which spec retired an id (spec_index.retiredBy) before giving it to a new spec
    signatureFrom: spec_tree_portal.scanAllSpecs
  - name: loadComponentSpecs
    description: >-
      Every component spec of the bound tree — how a write that changes a Portal's transport finds
      the Adapters that call it. Forwarded to the core portal.
    signature: 'loadComponentSpecs(): list<ComponentSpec>'
    returns: list<ComponentSpec>
    params: []
status: complete
