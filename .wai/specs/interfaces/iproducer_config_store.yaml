id: iproducer_config_store
name: Producer Config Store Interface
description: Contract for reading/writing a project's producer configs.
component: producer_config_store
methods:
  - name: read
    description: Read a target's config, or null.
    signature: 'read(target: string): ProducerConfig | null'
    returns: ProducerConfig | null
    effect: read
  - name: write
    description: Persist a producer config.
    signature: 'write(config: ProducerConfig): void'
    returns: void
    effect: write
  - name: clear
    description: Remove a target's config.
    signature: 'clear(target: string): void'
    returns: void
    effect: write
  - name: list
    description: List all producer configs.
    signature: 'list(): ProducerConfig[]'
    returns: ProducerConfig[]
status: complete
