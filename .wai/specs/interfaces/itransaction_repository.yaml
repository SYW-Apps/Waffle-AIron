id: itransaction_repository
name: Transaction Repository Interface
description: Facade over the transaction aggregate; every method forwards 1:1 to the Transaction Store.
component: transaction_repository
methods:
  - name: openRehearsal
    description: >-
      Create the rehearsal directory for a transaction id and answer its path (forwarded to the
      store).
    signature: 'openRehearsal(id: string): string'
    returns: string
    params:
      - name: id
        type: string
        description: The transaction id
  - name: dropRehearsal
    description: Remove a rehearsal directory (forwarded to the store).
    signature: 'dropRehearsal(id: string): void'
    returns: void
    params:
      - name: id
        type: string
        description: The transaction id
  - name: saveJournal
    description: Write one owner's journal durably (forwarded to the store).
    signature: 'saveJournal(journal: TransactionJournal): void'
    returns: void
    params:
      - name: journal
        type: TransactionJournal
        description: The journal
  - name: readJournal
    description: One owner's journal of a transaction, or null (forwarded to the store).
    signature: 'readJournal(owner: string, id: string): TransactionJournal | null'
    returns: TransactionJournal | null
    params:
      - name: owner
        type: string
        description: The owner project's root
      - name: id
        type: string
        description: The transaction id
  - name: listJournals
    description: Every journal under one owner (forwarded to the store).
    signature: 'listJournals(owner: string): TransactionJournal[]'
    returns: TransactionJournal[]
    params:
      - name: owner
        type: string
        description: The owner project's root
  - name: putFile
    description: Store bytes durably in an owner's staged or backup area (forwarded to the store).
    signature: 'putFile(owner: string, id: string, area: string, path: string, bytes: bytes): void'
    returns: void
    params:
      - name: owner
        type: string
        description: The owner project's root
      - name: id
        type: string
        description: The transaction id
      - name: area
        type: string
        description: staged | backup
      - name: path
        type: string
        description: The file, relative to the owner's root
      - name: bytes
        type: bytes
        description: The content
  - name: readFile
    description: The bytes held in an owner's staged or backup area, or null (forwarded to the store).
    signature: 'readFile(owner: string, id: string, area: string, path: string): bytes | null'
    returns: bytes | null
    params:
      - name: owner
        type: string
        description: The owner project's root
      - name: id
        type: string
        description: The transaction id
      - name: area
        type: string
        description: staged | backup
      - name: path
        type: string
        description: The file, relative to the owner's root
  - name: locate
    description: The absolute path of a file in an owner's transaction area (forwarded to the store).
    signature: 'locate(owner: string, id: string, area: string, path: string): string'
    returns: string
    params:
      - name: owner
        type: string
        description: The owner project's root
      - name: id
        type: string
        description: The transaction id
      - name: area
        type: string
        description: staged | backup
      - name: path
        type: string
        description: The file, relative to the owner's root
  - name: close
    description: Remove an owner's transaction directory (forwarded to the store).
    signature: 'close(owner: string, id: string): void'
    returns: void
    params:
      - name: owner
        type: string
        description: The owner project's root
      - name: id
        type: string
        description: The transaction id
status: complete
