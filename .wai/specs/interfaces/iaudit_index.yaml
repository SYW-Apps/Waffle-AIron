id: iaudit_index
name: Audit Index Interface
description: Private read-path contract for admin-only audit event queries.
component: audit_index
methods:
  - name: query
    description: Return redacted audit events matching the supplied admin query filter.
    signature: 'query(query: AuditQuery): list<AuditEvent>'
    returns: list<AuditEvent>
    params:
      - name: query
        type: AuditQuery
  - name: count
    description: Count redacted audit events matching the supplied admin query filter.
    signature: 'count(query: AuditQuery): int'
    returns: int
    params:
      - name: query
        type: AuditQuery
status: complete
