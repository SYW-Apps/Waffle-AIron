id: iapproval_portal
name: Approval Portal Interface
description: Published approval reads and the lock record write of sdd_core.
component: approval_portal
methods:
  - name: computeStateId
    description: Compute the deterministic content hash (StateId) of the current spec tree.
    signature: 'computeStateId(): StateId'
    returns: StateId
  - name: readLockRecord
    description: Read the current commit-scoped lock record, or null if the project is unlocked.
    signature: 'readLockRecord(): LockRecord | null'
    returns: LockRecord | null
  - name: writeLockRecord
    description: Persist a commit-scoped lock record.
    signature: 'writeLockRecord(record: LockRecord): void'
    returns: void
  - name: computeStateIdAt
    description: >-
      Compute the current state hash of the project at the given root (read-only bind). Pure 1:1
      forward.
    signature: 'computeStateIdAt(root: string): string | null'
    returns: string | null
    params:
      - name: root
        type: string
  - name: readLockState
    description: >-
      Forward to core_orchestrator.readLockState: resolve the lock against the gate identity the
      caller computed now
    signature: 'readLockState(current: StateId): LockStatus'
    returns: LockStatus
    params:
      - name: current
        type: StateId
        description: The gate identity as it stands now
  - name: captureApprovedSpecs
    description: >-
      Capture the CURRENT spec tree as approved: one content digest per spec file, keyed by path
      relative to the project root. A chained child's own specs are excluded — the trees are
      approved separately, and the parent pins the child's StateId instead. An optional scope
      narrows the capture to one subsystem, leaving everything outside with whatever approval it
      already had. Records a decision; the caller gates it, and the caller persists it on the lock
      record.
    signature: 'captureApprovedSpecs(root?: string, scope?: ApprovalScope): Record<string, string>'
    returns: Record<string, string>
    params:
      - name: root
        type: string
        optional: true
      - name: scope
        type: ApprovalScope
        optional: true
  - name: localApprover
    description: >-
      Who to record as having approved a lock taken on THIS machine, where wairon has no account of
      its own. Prefers the git author identity (`user.name <user.email>`) — the one identity the
      repository already attributes work to, so a reviewer can match it against the author of the
      commit carrying the lock — and falls back to user@hostname. Never throws and never prompts: a
      lock must not fail because a name could not be resolved.
    signature: 'localApprover(): ApproverIdentity'
    returns: ApproverIdentity
    params: []
  - name: diffAgainstApproval
    description: >-
      What differs between this tree and the approval on record: which specs were added, changed or
      removed, and which are untouched. Null when the project was never approved — a different
      answer from approved and drifted.
    signature: 'diffAgainstApproval(root?: string): ApprovalDiff | null'
    returns: ApprovalDiff | null
    params:
      - name: root
        type: string
        description: The project root; the bound project when omitted
        optional: true
  - name: approvalRecord
    description: The approval record this project carries, or null when it has none.
    signature: 'approvalRecord(root?: string): LockRecord | null'
    returns: LockRecord | null
    params:
      - name: root
        type: string
        description: The project root; the bound project when omitted
        optional: true
  - name: settledSpecPaths
    description: >-
      The spec paths the approval on record covers, as a set for membership tests; null when there
      is no record. Published here because the validator needs it to tell an approved spec from an
      unapproved one, and the validator reaching into the approval module directly would cross a
      subsystem boundary the Portal exists to be.
    signature: 'settledSpecPaths(root?: string): Set<string> | null'
    returns: Set<string> | null
    params:
      - name: root
        type: string
        description: The project root; the bound project when omitted
        optional: true
  - name: approvalVerdict
    description: >-
      What the lock says about the tree as it stands (approval_comparison.verdict), given the pin
      tree the caller obtained from the validator; silent for a project never approved.
    signature: 'approvalVerdict(approvals?: ProjectApproval[]): ApprovalVerdict'
    returns: ApprovalVerdict
    params:
      - name: approvals
        type: ProjectApproval[]
        description: The pin tree from validator_portal.familyApprovals
        optional: true
    guarantees:
      - idempotent
  - name: computeOwnStateId
    description: >-
      The content identity of the bound project's OWN specs, never a member's: the content half of
      the gate identity (state_hash.ownTree).
    signature: 'computeOwnStateId(): StateId'
    returns: StateId
    params: []
    guarantees:
      - idempotent
status: complete
