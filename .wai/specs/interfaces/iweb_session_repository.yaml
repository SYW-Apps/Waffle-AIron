id: iweb_session_repository
name: Web Session Repository Interface
description: >-
  Facade contract for durable browser-session state. The authentication component and web
  orchestrators depend on this contract instead of the private store, registry, or index. Pure 1:1
  forwarding: create/touch/remove/pruneExpired to the registry; getById/listBySubject to the index.
  No logic lives on this facade.
component: web_session_repository
methods:
  - name: create
    description: Forward to the registry to persist a new browser session and return the stored session.
    signatureFrom: web_session_registry.create
    guarantees:
      - atomic
  - name: touch
    description: Forward to the registry to update one session's lastSeenAt activity timestamp.
    signatureFrom: web_session_registry.touch
    guarantees:
      - atomic
  - name: remove
    description: Forward to the registry to remove one session by id (sign-out).
    signatureFrom: web_session_registry.remove
    guarantees:
      - atomic
  - name: pruneExpired
    description: Forward to the registry to delete expired sessions and return the number removed.
    signatureFrom: web_session_registry.pruneExpired
    guarantees:
      - atomic
  - name: getById
    description: Forward to the index and return one browser session by id or null when absent.
    signatureFrom: web_session_index.getById
  - name: listBySubject
    description: Forward to the index and return every browser session belonging to the given user id.
    signatureFrom: web_session_index.listBySubject
  - name: removeAllForSubject
    description: >-
      Forward to the registry to remove every browser session belonging to the given user id
      (correlated revocation on deactivation) and return the number removed.
    signatureFrom: web_session_registry.removeAllForSubject
    guarantees:
      - atomic
status: complete
