id: icli_core_adapter
name: CLI Core Adapter Interface
description: Adapter contract for the CLI to load specifications from the core subsystem.
component: cli_core_adapter
methods:
  - name: loadSystemSpec
    description: Calls loadSystemSpec on the core portal
    signature: 'loadSystemSpec(): SystemSpec | null'
    returns: SystemSpec | null
  - name: moveSubsystemProject
    description: >-
      Calls moveSubsystemProject on the core portal to move an external subsystem's directory and
      update its projectPath link.
    signature: 'moveSubsystemProject(subsystemId: string, newProjectPath: string): void'
    returns: void
  - name: externalizeSubsystem
    description: >-
      Calls externalizeSubsystem on the core portal to migrate an internal subsystem into a
      standalone subproject.
    signature: 'externalizeSubsystem(subsystemId: string, projectPath: string): void'
    returns: void
  - name: internalizeSubsystem
    description: >-
      Calls internalizeSubsystem on the core portal to migrate an external subsystem back into the
      parent tree.
    signature: 'internalizeSubsystem(subsystemId: string): void'
    returns: void
  - name: composeAgentBrief
    description: >-
      Calls composeAgentBrief on core portal — the live delegation brief backing `wairon agent
      brief` and the `wairon agent customize` scaffold seed.
    signature: 'composeAgentBrief(agentId: string): AgentBrief'
    returns: AgentBrief
    params:
      - name: agentId
        type: string
  - name: exportSpecTree
    description: >-
      Pack the local project's whole spec tree (its own .wai plus every chained subproject) into a
      .waitree archive. Forwarded to the core portal.
    signature: 'exportSpecTree(includeDerived?: boolean, allowPartial?: boolean): TreeExportResult'
    returns: TreeExportResult
    params:
      - name: includeDerived
        type: boolean
        optional: true
      - name: allowPartial
        type: boolean
        description: >-
          Pack whatever CAN be packed when a chained subproject cannot be, and list the mounts left
          out in the result, instead of refusing the whole export.
        optional: true
  - name: importSpecTree
    description: >-
      Import a .waitree archive into a local project root under an explicit policy. Forwarded to the
      core portal. The CLI does NOT set the executable-entry guard: a developer extracting an
      archive from an instance they chose to trust is the trusted-filesystem tier, the same tier
      `wairon packs add` installs code packs through.
    signature: 'importSpecTree(archive: bytes, options: TreeImportOptions): TreeImportResult'
    returns: TreeImportResult
    params:
      - name: archive
        type: bytes
      - name: options
        type: tree_import_options
  - name: loadProjectConfig
    description: The local project's configuration, or null when it has none. Forwarded to the core portal.
    signature: 'loadProjectConfig(): ProjectConfig | null'
    returns: ProjectConfig | null
    params: []
    guarantees:
      - idempotent
  - name: createProjectConfig
    description: >-
      Write the configuration `wairon init` composed, for a project that has none. Forwarded to the
      core portal.
    signature: 'createProjectConfig(config: ProjectConfig): void'
    returns: void
    params:
      - name: config
        type: ProjectConfig
  - name: setExecutionTier
    description: Set `execution.tier` for `wairon execution set-tier`. Forwarded to the core portal.
    signature: 'setExecutionTier(tier: string): void'
    returns: void
    params:
      - name: tier
        type: string
    guarantees:
      - idempotent
  - name: projectConfigExists
    description: >-
      Whether the local project has a configuration — the CLI's is-this-a-wairon-project guard.
      Forwarded to the core portal.
    signature: 'projectConfigExists(): boolean'
    returns: boolean
    params: []
    guarantees:
      - idempotent
  - name: resolveAgentTopology
    description: >-
      The agent topology resolved from the current spec tree: the live records `wairon list`, `show`
      and `generate` work from. Forwarded to the core portal.
    signature: 'resolveAgentTopology(): AgentRecord[]'
    returns: AgentRecord[]
    params: []
    guarantees:
      - idempotent
  - name: ensureProjectInitialized
    description: >-
      Complete the bound project's bootstrap without overwriting anything: the default configuration
      and the L0 system spec, each only when absent. A configuration it writes declares the given
      id, else the chosen name slugified. Forwarded to the core portal.
    signature: 'ensureProjectInitialized(fallbackName: string, id?: string): ProjectBootstrap'
    returns: ProjectBootstrap
    params:
      - name: fallbackName
        type: string
        description: The project name to use when no system spec names one yet
      - name: id
        type: string
        description: >-
          The project id a configuration written here declares — a chained child's mount subsystem
          id; omitted, the chosen name slugified
        optional: true
    guarantees:
      - idempotent
  - name: listDirectChainedSubprojects
    description: >-
      The direct chained subprojects of a project root, one level deep: each child's directory and
      the subsystem that mounts it. Forwarded to the core portal.
    signature: 'listDirectChainedSubprojects(projectRoot: string): ChainedSubprojectDir[]'
    returns: ChainedSubprojectDir[]
    params:
      - name: projectRoot
        type: string
        description: The project whose own spec tree declares the mounts
    guarantees:
      - idempotent
  - name: defaultPackSelections
    description: >-
      The store packs that apply by default, shaped as selections to seed into a new project's
      configuration. Forwarded to the core portal.
    signature: 'defaultPackSelections(): PackSelection[]'
    returns: PackSelection[]
    params: []
    guarantees:
      - idempotent
  - name: readLockState
    description: Forward to core_portal.readLockState with the gate identity the caller computed now
    signature: 'readLockState(current: StateId): LockStatus'
    returns: LockStatus
    params:
      - name: current
        type: StateId
        description: The gate identity as it stands now
  - name: retireSpecialists
    description: >-
      Forward to core_portal.retireSpecialists: plan, and with apply write, the migration off the
      retired Specialist stereotype
    signature: 'retireSpecialists(apply: boolean): SpecialistRetirement'
    returns: SpecialistRetirement
    params:
      - name: apply
        type: boolean
        description: Write the plan; false plans without writing
  - name: repairForeignStepFields
    description: >-
      Forward to core_portal.repairForeignStepFields: plan, and with apply write, the removal of
      every narrative-step field its own step type cannot have
    signature: 'repairForeignStepFields(apply: boolean): ForeignFieldRepair[]'
    returns: ForeignFieldRepair[]
    params:
      - name: apply
        type: boolean
        description: Write the repair; false plans without writing
  - name: renderDiagram
    description: >-
      Calls renderDiagram on core portal: render the spec tree into the requested format and answer
      the artifact as a string. The CLI reaches diagram rendering through here rather than importing
      the canvas and exporter modules directly — those live in another subsystem, and an adapter is
      what a subsystem boundary is crossed with.
    signature: 'renderDiagram(format: string): string'
    returns: string
    params:
      - name: format
        type: string
        description: canvas, mermaid, drawio or excalidraw
  - name: generateAll
    description: >-
      Calls generateAll on core portal: write every agent's file for every configured target. The
      CLI reaches generation through here rather than importing the exporters module, which is
      another subsystem's.
    signature: >-
      generateAll(agents: AgentRecord[], config: ProjectConfig, options?: GenerateOptions):
      GenerateSummary[]
    returns: GenerateSummary[]
    params:
      - name: agents
        type: AgentRecord[]
        description: Every agent to write
      - name: config
        type: ProjectConfig
        description: The project's configuration
      - name: options
        type: GenerateOptions
        description: What this run may vary
        optional: true
  - name: resolveExpectedOutputPaths
    description: >-
      Calls resolveExpectedOutputPaths on core portal: which files a generate run would own, without
      writing any.
    signature: 'resolveExpectedOutputPaths(agents: AgentRecord[], config: ProjectConfig): Set<string>'
    returns: Set<string>
    params:
      - name: agents
        type: AgentRecord[]
        description: The agents whose outputs to enumerate
      - name: config
        type: ProjectConfig
        description: The project's configuration
  - name: resolveDomains
    description: >-
      Calls resolve on the topology repository: every domain this project has, derived and
      registered alike.
    signature: 'resolveDomains(): Domain[]'
    returns: Domain[]
    params: []
  - name: addDomain
    description: >-
      Calls addFreeStanding on the topology repository: register a domain the spec tree does not
      imply.
    signature: 'addDomain(domain: Domain): void'
    returns: void
    params:
      - name: domain
        type: Domain
        description: The domain to register
  - name: removeDomain
    description: 'Calls removeFreeStanding on the topology repository: unregister a free-standing domain.'
    signature: 'removeDomain(id: string): void'
    returns: void
    params:
      - name: id
        type: string
        description: The domain id to unregister
  - name: detectDomainCandidates
    description: >-
      Calls the domain detector: which directories look like domains nobody has registered.
      Proposals only.
    signature: >-
      detectDomainCandidates(projectRoot: string, trackedPaths?: Set<string>, trackedIds?:
      Set<string>): DetectedDomainCandidate[]
    returns: DetectedDomainCandidate[]
    params:
      - name: projectRoot
        type: string
        description: The repository root to scan
      - name: trackedPaths
        type: Set<string>
        description: Paths already claimed by a registered domain
        optional: true
      - name: trackedIds
        type: Set<string>
        description: Domain ids already in use
        optional: true
  - name: deriveExecutionProfile
    description: What an agent's work is like, for `wairon execution show`. Forwarded to the core portal.
    signature: 'deriveExecutionProfile(agent: AgentRecord): ExecutionProfile'
    returns: ExecutionProfile
    params:
      - name: agent
        type: AgentRecord
        description: The resolved agent whose work shape is wanted
    guarantees:
      - idempotent
  - name: resolveBudget
    description: >-
      What that work earns under the project's dial, for `wairon execution show`. Forwarded to the
      core portal.
    signature: >-
      resolveBudget(profile: ExecutionProfile, config: ExecutionConfig, agentId: string):
      ExecutionBudget | undefined
    returns: ExecutionBudget | undefined
    params:
      - name: profile
        type: ExecutionProfile
        description: What the work is like
      - name: config
        type: ExecutionConfig
        description: The project's dial and its per-agent overrides
      - name: agentId
        type: string
        description: Which agent, so its override can be found
    guarantees:
      - idempotent
  - name: globalGuideFilePath
    description: >-
      Where an AI tool keeps its machine-wide configuration, for `wairon init`. Forwarded to the
      core portal.
    signature: 'globalGuideFilePath(target: string): string | null'
    returns: string | null
    params:
      - name: target
        type: string
        description: The AI tool
    guarantees:
      - idempotent
  - name: localGuideFilePath
    description: >-
      Where an AI tool keeps its per-project configuration, for `wairon init` and `wairon doctor`.
      Forwarded to the core portal.
    signature: 'localGuideFilePath(projectRoot: string, target: string): string | null'
    returns: string | null
    params:
      - name: projectRoot
        type: string
        description: The project root
      - name: target
        type: string
        description: The AI tool
    guarantees:
      - idempotent
  - name: injectGuide
    description: >-
      Put the wairon guide into a tool's configuration file, for `wairon init`. Forwarded to the
      core portal.
    signature: 'injectGuide(filePath: string, scope: string): void'
    returns: void
    params:
      - name: filePath
        type: string
        description: The configuration file
      - name: scope
        type: string
        description: '`global` or `local`'
    effect: write
  - name: writeRootGuideDelegator
    description: >-
      Write the repository-root pointer at the in-project guide, for `wairon init`. Forwarded to the
      core portal.
    signature: 'writeRootGuideDelegator(projectRoot: string, target: string): void'
    returns: void
    params:
      - name: projectRoot
        type: string
        description: The project root
      - name: target
        type: string
        description: The AI tool
    effect: write
  - name: reinjectLocalGuides
    description: >-
      Refresh the in-project guides, for `wairon generate` and `wairon doctor --fix`. Forwarded to
      the core portal.
    signature: 'reinjectLocalGuides(projectRoot: string, targets: string[]): string[]'
    returns: string[]
    params:
      - name: projectRoot
        type: string
        description: The project root
      - name: targets
        type: string[]
        description: The AI tools to refresh
    effect: write
  - name: readStampVersion
    description: >-
      The wairon version stamped in generated content, for `wairon doctor`'s staleness check.
      Forwarded to the core portal.
    signature: 'readStampVersion(content: string): string | null'
    returns: string | null
    params:
      - name: content
        type: string
        description: Generated content
    guarantees:
      - idempotent
  - name: syncContextFiles
    description: >-
      Rebuild the derived context documents, for `wairon generate`, `wairon init` and `wairon doctor
      --fix`. Forwarded to the core portal.
    signature: 'syncContextFiles(): SyncResult'
    returns: SyncResult
    params: []
    effect: write
  - name: hasContext
    description: >-
      Whether the project has a human-written project document, for `wairon generate`. Forwarded to
      the core portal.
    signature: 'hasContext(): boolean'
    returns: boolean
    params: []
    guarantees:
      - idempotent
  - name: derivedDocPaths
    description: >-
      Where the derived context documents live, for `wairon doctor`'s staleness report. Forwarded to
      the core portal.
    signature: 'derivedDocPaths(): string[]'
    returns: string[]
    params: []
    guarantees:
      - idempotent
  - name: getStatusReport
    description: >-
      How complete the spec tree is, for `wairon status`, marked up with the terminal's own colours
      — and whether it could be reported on, which is what decides the exit code. Forwarded to the
      core portal.
    signature: 'getStatusReport(options: StatusOptions, decor?: StatusDecor): StatusReport'
    returns: StatusReport
    params:
      - name: options
        type: StatusOptions
        description: How much of the tree to cover
      - name: decor
        type: StatusDecor
        description: How to mark up each kind of thing
    guarantees:
      - idempotent
  - name: approvalVerdict
    description: >-
      What the lock says about the tree, for the line `wairon status` and `wairon doctor` print
      under the dashboard. Forwarded to the core portal.
    signature: 'approvalVerdict(): ApprovalVerdict'
    returns: ApprovalVerdict
    params: []
    guarantees:
      - idempotent
  - name: loadSubsystemSpec
    description: >-
      The stored subsystem under an id, or null. `wairon subsystem add` and `wairon init` in a
      subdirectory read it to tell a first write from a re-run: a re-run states only what the
      command owns, so what the author set since (the description, the published surface, the
      trusted links) is carried rather than overwritten. Forwarded to the spec tree portal.
    signature: 'loadSubsystemSpec(id: string): SubsystemSpec | null'
    returns: SubsystemSpec | null
    params:
      - name: id
        type: string
        description: The subsystem id
    guarantees:
      - idempotent
  - name: findLegacySpecFiles
    description: >-
      Forward to spec_maintenance_portal.findLegacySpecFiles: the spec files `wairon doctor` reports
      as stored under a legacy name
    signature: 'findLegacySpecFiles(): LegacySpecFile[]'
    returns: LegacySpecFile[]
    params: []
  - name: findChainingSubprojectsMissingConfig
    description: >-
      Forward to spec_maintenance_portal.findChainingSubprojectsMissingConfig: the chained
      subprojects `wairon doctor` reports as unrunnable standalone
    signature: 'findChainingSubprojectsMissingConfig(projectRoot: string): string[]'
    returns: string[]
    params:
      - name: projectRoot
        type: string
  - name: backfillChainedSubprojectConfigs
    description: >-
      Forward to spec_maintenance_portal.backfillChainedSubprojectConfigs: the `wairon doctor --fix`
      repair
    signature: 'backfillChainedSubprojectConfigs(projectRoot: string): string[]'
    returns: string[]
    params:
      - name: projectRoot
        type: string
  - name: diagnoseProjectPacks
    description: 'Forward to extension_portal.diagnoseProjectPacks: the pack situation `wairon doctor` reports'
    signature: 'diagnoseProjectPacks(): PackDiagnosis'
    returns: PackDiagnosis
    params: []
  - name: pinInstalledPacksAsSelections
    description: >-
      Forward to extension_portal.pinInstalledPacksAsSelections: the `wairon doctor --fix` pack
      migration
    signature: 'pinInstalledPacksAsSelections(): string[]'
    returns: string[]
    params: []
status: complete
createdAt: '2026-06-19T12:00:00Z'
