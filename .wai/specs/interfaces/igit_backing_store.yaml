id: igit_backing_store
name: Git Backing Store Interface
description: >-
  Private storage contract for the container-level backing bindings collection: read-through file
  I/O over git-backing.json; every change is an update under the file's write lock.
component: git_backing_store
methods:
  - name: load
    description: >-
      Read git-backing.json fresh (no in-memory copy). A missing file yields an empty set; an
      unreadable file or structurally invalid JSON fails with a storage error naming the path.
    signature: 'load(): list<GitBackingBinding>'
    returns: list<GitBackingBinding>
    params: []
  - name: update
    description: >-
      Read the bindings fresh and persist what the change makes of them, holding the file's write
      lock (file_write_lock) across both, so a writer in another process that reads and writes the
      same file in between is never lost; a change that throws writes nothing; a file that exists
      but cannot be read or parsed throws. Answers the set written.
    signature: 'update(change: (bindings: GitBackingBinding[]) => GitBackingBinding[]): GitBackingBinding[]'
    returns: list<GitBackingBinding>
    effect: write
status: complete
createdAt: '2026-07-16T15:38:48.260Z'
