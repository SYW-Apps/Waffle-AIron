id: ibinding_module_adapter
name: Binding Module Adapter Interface
description: >-
  Reads binding modules into the declarations binding conformance compares with the pinned
  snapshots.
component: binding_module_adapter
methods:
  - name: readBindingModules
    description: >-
      Read each named binding module once (a path named twice is read once): resolve it within the
      project root (absolute or escaping paths are answered escaped, never read), answer missing for
      a file not on disk, unreadable for a binary or unreadable one, unsupported for a language
      other than TypeScript or JavaScript, and otherwise the exported declarations it holds in
      source order — ES module exports: exported functions (and `declare function`s) with their
      parameter names; exported interfaces, classes, object type aliases and enums with their
      members (methods with their parameter names, data fields by name with the type they are
      declared with; a function-typed field counts as a method); and CommonJS exports: `exports.X =
      …` / `module.exports.X = …` and each property of `module.exports = { … }`, a function or arrow
      function read as a function and an object literal as an object of methods and fields — each
      with the line it starts on and the `alias::name` (or `alias::name.method`) its leading doc
      comment names. An export form it meets but cannot see into (`module.exports = require(…)`, an
      export of a bare identifier) is listed in the module's unreadForms. Never throws for a file: a
      file it cannot read is answered with its status.
    signature: 'readBindingModules(paths: list<string>, projectRoot: string): list<BindingModule>'
    returns: list<BindingModule>
    params:
      - name: paths
        type: list<string>
        description: The binding modules, project-relative, as implementations name them
      - name: projectRoot
        type: string
        description: The bound project's root, every path is resolved and contained within
    effect: io
status: complete
