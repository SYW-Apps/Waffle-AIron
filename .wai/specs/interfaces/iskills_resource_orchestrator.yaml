id: iskills_resource_orchestrator
name: Skills Resource Orchestrator Interface
description: >-
  MCP-facing guidance workflow contract for the built-in SDD skills: list resources, read one
  resource's content (shaped for MCP registration, rejecting unknown ids), and compose the server
  instructions returned on the MCP initialize handshake.
component: skills_resource_orchestrator
methods:
  - name: list
    description: >-
      List the built-in SDD skills as MCP resource descriptors for advertisement to connected
      agents.
    signature: 'list(): SkillResourceDescriptor[]'
    returns: SkillResourceDescriptor[]
    params: []
  - name: read
    description: Read one built-in SDD skill's content by MCP resource id, rejecting an unknown id.
    signature: 'read(resourceId: string): string'
    returns: string
    params:
      - name: resourceId
        type: string
        description: The MCP resource id / skill id to read.
  - name: buildServerInstructions
    description: >-
      Compose the MCP initialize instructions for the bound project — wairon's own SDD briefing plus
      the governing packs' attributed, profile-scoped instruction blocks.
    signature: 'buildServerInstructions(): string'
    returns: string
    params: []
lint:
  allow: []
status: complete
