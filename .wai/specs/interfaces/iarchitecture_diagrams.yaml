id: iarchitecture_diagrams
name: Architecture Diagrams Interface
description: Contract for rendering a spec-derived diagram artifact as a string.
component: architecture_diagrams
methods:
  - name: render
    description: >-
      Render the current project's spec tree into the requested format (canvas | mermaid | drawio |
      excalidraw) and return the artifact as a string. Self-contained (the canvas embeds everything,
      offline).
    signature: 'render(format: DiagramFormat, relations?: list<ProjectRelations>): string'
    returns: string
    params:
      - name: format
        type: DiagramFormat
        description: The format to render
      - name: relations
        type: list<ProjectRelations>
        description: >-
          The family's relation health, drawn on the canvas's consumption edges; the other formats
          ignore it. Omitted: the canvas says health was not checked
        optional: true
  - name: buildGraphModel
    description: >-
      PURE projection of the current project's spec tree into a level-of-detail WebGraphModel
      (project tier): load the specs via the loader and emit nodes from L0/L1 outward, including
      subsystems at level 1, components at level 2, and interfaces/types at level 3, keeping only
      nodes whose level is at or below the requested detail level, with containment/dependency edges
      between the included nodes. Distinct from render, which stays the static HTML/diagram export;
      this returns a live JSON graph model for the web UI. No I/O beyond the loader; no
      authorization.
    signature: 'buildGraphModel(level: int): WebGraphModel'
    returns: WebGraphModel
    params:
      - name: level
        type: int
  - name: buildCanvasDataModel
    description: >-
      The canvas model render('canvas') draws, for the current project, returned as data instead of
      a self-contained page — so a client that mounts the shared renderer itself receives the model.
      Pure derivation; relation health is drawn only when passed in.
    signature: 'buildCanvasDataModel(relations?: list<ProjectRelations>): CanvasModel'
    returns: CanvasModel
    params:
      - name: relations
        type: list<ProjectRelations>
        description: The family's relation health to carry on the model; omitted, the model carries none
        optional: true
  - name: renderTypeDiagrams
    description: >-
      Draw the current project's own types as Mermaid, organized by their type groups: the index of
      groups first, then one class diagram per group that holds types, then the ungrouped types when
      there are any. Pure derivation over the loader; an empty list when the project has no types of
      its own.
    signature: 'renderTypeDiagrams(): list<TypeDiagram>'
    returns: list<TypeDiagram>
    params: []
  - name: renderComponents
    description: >-
      Draw the Mermaid component diagram: each component in its subsystem's subgraph with its name
      and stereotype, a published one marked, its owns edges dotted and its dependsOn edges solid,
      thick where they cross a subsystem boundary. Scoped to a subsystem, it draws that subsystem's
      components and the subsystems nested under it, with each component outside that depends on or
      owns one of them or that one of them depends on or owns, for the boundary's context; a scope
      holding no component is refused.
    signature: 'renderComponents(options?: ComponentDiagramOptions): string'
    returns: string
    params:
      - name: options
        type: ComponentDiagramOptions
        description: The scope to draw; omitted, the whole system
        optional: true
  - name: renderSequence
    description: >-
      Draw one method's narrative as a Mermaid sequence diagram, expanding the narratives of the
      methods it calls and dispatches to down to the depth asked for. An unknown component, or a
      method with no narrative, is refused.
    signature: >-
      renderSequence(componentId: string, methodName: string, options?: SequenceDiagramOptions):
      string
    returns: string
    params:
      - name: componentId
        type: string
        description: >-
          The component whose method is drawn: its id, or a bare id that matches exactly one
          qualified component
      - name: methodName
        type: string
        description: The method whose narrative is drawn
      - name: options
        type: SequenceDiagramOptions
        description: How deep the callees are expanded; omitted, three levels
        optional: true
  - name: renderSet
    description: >-
      Draw the whole diagram set `wairon diagram --all` writes: the system's component diagram, one
      scoped component diagram per subsystem that holds a component, the sequence of every narrated
      method of each Portal, Observer and published component, and the type diagrams, each with the
      path it is written to.
    signature: 'renderSet(): list<DiagramFile>'
    returns: list<DiagramFile>
    params: []
  - name: indexSet
    description: >-
      The Markdown index of a diagram set: titled after the system, saying it is generated from the
      spec tree, and linking each diagram by its title. Pure.
    signature: 'indexSet(files: list<DiagramFile>, systemName: string): string'
    returns: string
    params:
      - name: files
        type: list<DiagramFile>
        description: The diagrams the index links, in the order listed
      - name: systemName
        type: string
        description: The system the index is titled after
lint:
  allow: []
