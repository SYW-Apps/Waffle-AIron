id: iarchitecture_diagrams
name: Architecture Diagrams Interface
description: Contract for rendering a spec-derived diagram artifact as a string.
component: architecture_diagrams
methods:
  - name: render
    description: >-
      Render the current project's spec tree into the requested format (canvas | mermaid | drawio |
      excalidraw) and return the artifact as a string. Self-contained (the canvas embeds everything,
      offline).
    signature: 'render(format: string, relations?: list<ProjectRelations>): string'
    returns: string
    params:
      - name: format
        type: string
        description: canvas | mermaid | drawio | excalidraw
      - name: relations
        type: list<ProjectRelations>
        description: >-
          The family's relation health, drawn on the canvas's consumption edges; the other formats
          ignore it. Omitted: the canvas says health was not checked
        optional: true
  - name: buildGraphModel
    description: >-
      PURE projection of the current project's spec tree into a level-of-detail WebGraphModel
      (project tier): load the specs via the loader and emit nodes from L0/L1 outward, including
      subsystems at level 1, components at level 2, and interfaces/types at level 3, keeping only
      nodes whose level is at or below the requested detail level, with containment/dependency edges
      between the included nodes. Distinct from render, which stays the static HTML/diagram export;
      this returns a live JSON graph model for the web UI. No I/O beyond the loader; no
      authorization.
    signature: 'buildGraphModel(level: int): WebGraphModel'
    returns: WebGraphModel
    params:
      - name: level
        type: int
  - name: buildCanvasDataModel
    description: >-
      The canvas model render('canvas') draws, for the current project, returned as data instead of
      a self-contained page — so a client that mounts the shared renderer itself receives the model.
      Pure derivation; relation health is drawn only when passed in.
    signature: 'buildCanvasDataModel(relations?: list<ProjectRelations>): CanvasModel'
    returns: CanvasModel
    params:
      - name: relations
        type: list<ProjectRelations>
        description: The family's relation health to carry on the model; omitted, the model carries none
        optional: true
lint:
  allow: []
