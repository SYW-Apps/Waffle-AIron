id: iexternals_repository
name: Externals Repository Interface
description: >-
  Facade contract for the pinned-externals aggregate at the bound root: the lock and the snapshots
  it names.
component: externals_repository
methods:
  - name: readLock
    description: The externals lock at the bound root, or null when none was written.
    signature: 'readLock(): ExternalsLock | null'
    returns: ExternalsLock | null
    params: []
  - name: saveLock
    description: Replace the externals lock at the bound root.
    signature: 'saveLock(lock: ExternalsLock): void'
    returns: void
    params:
      - name: lock
        type: ExternalsLock
  - name: readSnapshot
    description: The pinned snapshot for an alias, or null.
    signature: 'readSnapshot(alias: string): SurfaceSnapshot | null'
    returns: SurfaceSnapshot | null
    params:
      - name: alias
        type: string
  - name: saveSnapshot
    description: Replace the pinned snapshot for an alias.
    signature: 'saveSnapshot(alias: string, snapshot: SurfaceSnapshot): void'
    returns: void
    params:
      - name: alias
        type: string
      - name: snapshot
        type: SurfaceSnapshot
  - name: removeSnapshot
    description: Remove the pinned snapshot for an alias; whether one existed.
    signature: 'removeSnapshot(alias: string): boolean'
    returns: boolean
    params:
      - name: alias
        type: string
status: design
createdAt: '2026-09-26T18:12:05.304Z'
updatedAt: '2026-09-26T18:12:21.109Z'
