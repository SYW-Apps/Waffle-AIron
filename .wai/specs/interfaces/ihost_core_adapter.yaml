id: ihost_core_adapter
name: Host Core Client Adapter Interface
description: >-
  Contract for the spec-tree operations the hosting control plane composes, forwarded to the core
  portal.
component: host_core_adapter
methods:
  - name: provisionProject
    description: Bootstrap a fresh isolated spec tree at the bound root.
    signature: 'provisionProject(name: string): void'
    returns: void
  - name: computeStateId
    description: Compute the current spec-tree StateId.
    signature: 'computeStateId(): StateId'
    returns: StateId
  - name: readLockRecord
    description: Read the current lock record, or null.
    signature: 'readLockRecord(): LockRecord | null'
    returns: LockRecord | null
  - name: writeLockRecord
    description: Persist a lock record.
    signature: 'writeLockRecord(record: LockRecord): void'
    returns: void
  - name: promoteAllComplete
    description: Promote every spec to status complete.
    signature: 'promoteAllComplete(): void'
    returns: void
  - name: renderDiagram
    description: Render the bound project's spec tree into a diagram artifact string.
    signature: 'renderDiagram(format: string): string'
    returns: string
  - name: loadSystemSpec
    description: >-
      Read the bound project's L0 system spec, or null when absent. Forwarded to the core portal;
      used to project a redacted public-surface snapshot.
    signature: 'loadSystemSpec(): SystemSpec | null'
    returns: SystemSpec | null
    params: []
  - name: loadSubsystemSpecs
    description: >-
      Read the bound project's L1 subsystem specs. Forwarded to the core portal; used to resolve the
      subsystem public interfaces backing the L0 public surfaces.
    signature: 'loadSubsystemSpecs(): SubsystemSpec[]'
    returns: SubsystemSpec[]
    params: []
  - name: buildProjectGraph
    description: >-
      Project the bound project's spec tree into a level-filtered WebGraphModel, forwarded to the
      core portal. Used by the web graph orchestrator to render the project-tier graph for the web
      UI.
    signature: 'buildProjectGraph(level: number): WebGraphModel'
    returns: WebGraphModel
    params:
      - name: level
        type: number
  - name: globalPacksDir
    description: >-
      Resolve the server-global instance packs directory (WAIRON_PACKS_DIR), forwarded to the core
      extension loader.
    signature: 'globalPacksDir(): string'
    returns: string
    params: []
  - name: discoverPacks
    description: >-
      List the pack refs in a directory (sorted, deterministic), forwarded to the core extension
      loader.
    signature: 'discoverPacks(dir: string): string[]'
    returns: string[]
    params:
      - name: dir
        type: string
  - name: loadExtensionPacks
    description: >-
      Load the given pack refs against a project root into a LoadedExtensions, forwarded to the core
      extension loader (used by the hosted pack store to probe a pack in isolation).
    signature: 'loadExtensionPacks(refs: Json, projectRoot: string): LoadedExtensions'
    returns: LoadedExtensions
    params:
      - name: refs
        type: Json
      - name: projectRoot
        type: string
  - name: checkDeclarativePack
    description: >-
      Validate a parsed manifest against the declarative-pack schema; returns the first error
      message, or null when it is a valid declarative pack.
    signature: 'checkDeclarativePack(manifest: Json): string | null'
    returns: string | null
    params:
      - name: manifest
        type: Json
  - name: builtinProfileIds
    description: >-
      List the ids of wairon's built-in architectural profiles (backend, frontend-reactive, …),
      forwarded to the core rules registry — the built-in half of the selectable-profile catalog.
    signature: 'builtinProfileIds(): string[]'
    returns: string[]
    params: []
  - name: resolveContainedProjectPath
    description: >-
      Resolve a subsystem's projectPath WITHIN the given root through the core containment guard —
      absolute and '..'-escaping paths rejected. The hosted mount-resolution seam: the project
      repository never touches core modules directly.
    signature: 'resolveContainedProjectPath(projectRoot: string, projectPath: string): string'
    returns: string
    params:
      - name: projectRoot
        type: string
      - name: projectPath
        type: string
status: complete
