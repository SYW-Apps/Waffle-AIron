id: ihost_core_adapter
name: Host Core Client Adapter Interface
description: >-
  Contract for the spec-tree operations the hosting control plane composes, forwarded to the core
  portal.
component: host_core_adapter
methods:
  - name: provisionProject
    description: Bootstrap a fresh isolated spec tree at the bound root.
    signature: 'provisionProject(name: string): void'
    returns: void
  - name: computeStateId
    description: >-
      Compute the current spec-tree CONTENT StateId (used for surface/landscape snapshot stamps,
      where doctrine is irrelevant).
    signature: 'computeStateId(): StateId'
    returns: StateId
  - name: readLockRecord
    description: Read the current lock record, or null.
    signature: 'readLockRecord(): LockRecord | null'
    returns: LockRecord | null
  - name: writeLockRecord
    description: Persist a lock record.
    signature: 'writeLockRecord(record: LockRecord): void'
    returns: void
  - name: promoteAllComplete
    description: Promote every spec to status complete.
    signature: 'promoteAllComplete(): void'
    returns: void
  - name: renderDiagram
    description: Render the bound project's spec tree into a diagram artifact string.
    signature: 'renderDiagram(format: string): string'
    returns: string
  - name: loadSystemSpec
    description: >-
      Read the bound project's L0 system spec, or null when absent. Forwarded to the core portal;
      used to project a redacted public-surface snapshot.
    signature: 'loadSystemSpec(): SystemSpec | null'
    returns: SystemSpec | null
    params: []
  - name: loadSubsystemSpecs
    description: >-
      Read the bound project's L1 subsystem specs. Forwarded to the core portal; used to resolve the
      subsystem public interfaces backing the L0 public surfaces.
    signature: 'loadSubsystemSpecs(): SubsystemSpec[]'
    returns: SubsystemSpec[]
    params: []
  - name: buildProjectGraph
    description: >-
      Project the bound project's spec tree into a level-filtered WebGraphModel, forwarded to the
      core portal. Used by the web graph orchestrator to render the project-tier graph for the web
      UI.
    signature: 'buildProjectGraph(level: number): WebGraphModel'
    returns: WebGraphModel
    params:
      - name: level
        type: number
  - name: globalPacksDir
    description: >-
      Resolve the server-global instance packs directory (WAIRON_PACKS_DIR), forwarded to the core
      extension loader.
    signature: 'globalPacksDir(): string'
    returns: string
    params: []
  - name: discoverPacks
    description: >-
      List the pack refs in a directory (sorted, deterministic), forwarded to the core extension
      loader.
    signature: 'discoverPacks(dir: string): string[]'
    returns: string[]
    params:
      - name: dir
        type: string
  - name: loadExtensionPacks
    description: >-
      Load the given pack refs against a project root into a LoadedExtensions, forwarded to the core
      extension loader (used by the hosted pack store to probe a pack in isolation).
    signature: 'loadExtensionPacks(refs: Json, projectRoot: string): LoadedExtensions'
    returns: LoadedExtensions
    params:
      - name: refs
        type: Json
      - name: projectRoot
        type: string
  - name: checkDeclarativePack
    description: >-
      Validate a parsed manifest against the declarative-pack schema; returns the first error
      message, or null when it is a valid declarative pack.
    signature: 'checkDeclarativePack(manifest: Json): string | null'
    returns: string | null
    params:
      - name: manifest
        type: Json
  - name: builtinProfileIds
    description: >-
      List the ids of wairon's built-in architectural profiles (backend, frontend-reactive, …),
      forwarded to the core rules registry — the built-in half of the selectable-profile catalog.
    signature: 'builtinProfileIds(): string[]'
    returns: string[]
    params: []
  - name: resolveContainedProjectPath
    description: >-
      Resolve a subsystem's projectPath WITHIN the given root through the core containment guard —
      absolute and '..'-escaping paths rejected. The hosted mount-resolution seam: the project
      repository never touches core modules directly.
    signature: 'resolveContainedProjectPath(projectRoot: string, projectPath: string): string'
    returns: string
    params:
      - name: projectRoot
        type: string
      - name: projectPath
        type: string
  - name: builtinProjectKinds
    description: >-
      The ids of wairon's built-in COMPOSITE PROJECT KINDS (fullstack, system-of-systems, monorepo)
      — legal projectType values that are not architectural profiles and carry no profile doctrine
      of their own, read from the core rules registry's bundled constant. A pure, side-effect-free
      read, and the counterpart of builtinProfileIds: the hosted profile-application path must
      recognize a project kind as resolvable-as-is (no contributing pack to adopt) instead of
      refusing it as an unknown profile.
    signature: 'builtinProjectKinds(): string[]'
    returns: string[]
    params: []
  - name: computeGateStateId
    description: >-
      Compute the current GATE StateId (spec tree + governing doctrine) — what the hosted lock is
      scoped to.
    signature: 'computeGateStateId(): StateId'
    returns: StateId
    params: []
  - name: readLockState
    description: >-
      Resolve the bound project's lock verdict (unlocked | locked | stale) through the core portal —
      the shared authority the promote gate and every reporting surface answer from.
    signature: 'readLockState(): LockStatus'
    returns: LockStatus
    params: []
  - name: exportSpecTree
    description: >-
      Pack the bound project's whole spec tree (its own .wai plus every chained subproject) into a
      .waitree archive with provenance. Forwarded to the core portal.
    signature: 'exportSpecTree(includeDerived?: boolean): TreeExportResult'
    returns: TreeExportResult
    params:
      - name: includeDerived
        type: boolean
        optional: true
  - name: importSpecTree
    description: >-
      Import a .waitree archive into the bound project root under an explicit policy, backing up any
      tree it replaces. Forwarded to the core portal; the hosted caller always sets the
      executable-entry refusal, because the archive arrived over the wire.
    signature: 'importSpecTree(archive: bytes, options: TreeImportOptions): TreeImportResult'
    returns: TreeImportResult
    params:
      - name: archive
        type: bytes
      - name: options
        type: tree_import_options
  - name: captureBaseline
    description: >-
      Capture the CURRENT spec tree as approved, with each chained child's approved StateId pinned.
      Records a decision; the caller is responsible for having gated it.
    signature: 'captureBaseline(approvedBy: string, children: Record<string, string>): BaselineRecord'
    returns: BaselineRecord
    params:
      - name: approvedBy
        type: string
      - name: children
        type: Record<string, string>
  - name: writeBaseline
    description: >-
      Persist an approval baseline OUTSIDE the project tree, so approving never writes into the spec
      files a hosted lock then commits and pushes.
    signature: 'writeBaseline(record: BaselineRecord): string'
    returns: string
    params:
      - name: record
        type: BaselineRecord
  - name: currentChildPins
    description: >-
      The approved StateId of every chained child mounted under this root, keyed by mount id — what
      a parent approval pins. A child with no approval of its own contributes no pin.
    signature: 'currentChildPins(mounts: SubsystemSpec[]): Record<string, string>'
    returns: Record<string, string>
    params:
      - name: mounts
        type: SubsystemSpec[]
status: complete
