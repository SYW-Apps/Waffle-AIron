id: ireachability_migration
name: Reachability Migration Interface
description: Plan, and with apply write, the bound project's migration onto the reachability model.
component: reachability_migration
methods:
  - name: migrate
    description: >-
      Plan the bound project's migration from the retired forms its scan recorded, and with apply
      write it: transports, listener mounts into Portal-level entries and implementation routers,
      retired invokedBy kinds, authored export types, in-process Custom endpoints and the lint
      allows of retired codes. What it cannot decide without inventing design is reported, never
      written. Idempotent: an applied plan re-plans empty. Without apply nothing is written.
    signature: 'migrate(apply: bool): ReachabilityMigrationPlan'
    returns: ReachabilityMigrationPlan
    params:
      - name: apply
        type: bool
        description: Write the plan; false plans without writing
    guarantees:
      - idempotent
status: complete
