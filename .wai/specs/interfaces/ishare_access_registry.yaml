id: ishare_access_registry
name: Share Access Registry Interface
description: 'Write path for the access log: append one entry. Append-only.'
component: share_access_registry
methods:
  - name: append
    description: Stamp id/timestamp on the entry, append it through the store, and return the stored entry.
    signature: 'append(entry: ShareAccessEntry): ShareAccessEntry'
    returns: ShareAccessEntry
    params:
      - name: entry
        type: ShareAccessEntry
    guarantees:
      - atomic
status: complete
