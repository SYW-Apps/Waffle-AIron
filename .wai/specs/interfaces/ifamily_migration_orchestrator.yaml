id: ifamily_migration_orchestrator
name: Family Migration Orchestrator Interface
description: >-
  Plan first, applied on confirmation, all or nothing. plan() writes nothing into the family (its
  rehearsal lives in the OS temporary directory); apply(plan) makes exactly the plan's file changes
  live or none of them; re-planning a completed migration plans nothing. Nothing is ever locked:
  every plan names the projects to re-lock.
component: family_migration_orchestrator
methods:
  - name: plan
    description: >-
      Plan a family migration from the bound project: the highest root in reach and whether it is
      the family's top; the verb's edits and refusals — for verb chaining, the chaining migration's
      own plan carried whole, its blocking findings as refusals; and, when nothing refuses and the
      request does not ask otherwise, the rehearsal and its file changes, and the owners to re-lock.
      A pending transaction anywhere the plan reads refuses it (transaction-pending, naming `wairon
      doctor --fix`). A core writer's refusal met during the rehearsal becomes the plan's refusal
      (internalize-refused, externalize-refused), the rehearsal dropped. Writes nothing into the
      family.
    signature: 'plan(request: MigrationRequest): MigrationPlan'
    returns: MigrationPlan
    params:
      - name: request
        type: MigrationRequest
        description: The verb and its arguments
    guarantees:
      - idempotent
  - name: apply
    description: >-
      Apply a confirmed plan: refused (nothing written) when it is blocked; a plan made without a
      rehearsal (doctor's chaining plan, confirmed as printed) is rehearsed first, and a refusal met
      there refuses it; nothing to do when it has no file change; otherwise its rehearsal committed
      through the family transaction — every file change live, or the family byte-identical to
      before with the failure named. Answers the report with the re-lock list when committed.
    signature: 'apply(plan: MigrationPlan): FamilyMigrationReport'
    returns: FamilyMigrationReport
    params:
      - name: plan
        type: MigrationPlan
        description: The plan as plan() answered it
    guarantees:
      - atomic
  - name: discard
    description: >-
      Drop a plan's rehearsal without applying it: the end of a --report, a dryRun or a declined
      confirmation.
    signature: 'discard(plan: MigrationPlan): void'
    returns: void
    params:
      - name: plan
        type: MigrationPlan
        description: The plan
    guarantees:
      - idempotent
  - name: recover
    description: Report (fix false) or resolve (fix true) the unfinished transactions under a project root.
    signature: 'recover(root: string, fix: boolean): RecoveredTransaction[]'
    returns: RecoveredTransaction[]
    params:
      - name: root
        type: string
        description: The project root
      - name: fix
        type: boolean
        description: Resolve, or only report
    guarantees:
      - idempotent
  - name: rehearse
    description: >-
      Rehearse a plan that nothing refuses: copy the family's .wai trees (plus a project the verb
      brings in), run the verb's own writes on the copy, and answer the plan with the copy's
      difference as its file changes and every changed owner that carries a lock as a project to
      re-lock. A core writer's refusal met on the copy drops the rehearsal and becomes the plan's
      refusal. An already-refused plan is answered unchanged. Writes nothing into the family.
    signature: 'rehearse(plan: MigrationPlan): MigrationPlan'
    returns: MigrationPlan
    params:
      - name: plan
        type: MigrationPlan
        description: The verb's plan, not yet rehearsed
    guarantees:
      - idempotent
status: design
