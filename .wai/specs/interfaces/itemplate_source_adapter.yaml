id: itemplate_source_adapter
name: Template Source Adapter Interface
description: >-
  Adapter contract for loading agent instruction templates from the three-tier override chain. Pure
  read; unknown template names throw rather than silently falling back past the built-in tier.
component: template_source_adapter
methods:
  - name: loadTemplate
    description: >-
      Resolve one template by name through project → user-home → packaged built-in tiers and return
      its raw {{variable}} instruction body.
    signature: 'loadTemplate(templateName: string): AgentTemplate'
    returns: AgentTemplate
    params:
      - name: templateName
        type: string
        description: Template identifier (architect, domain-owner, implementer, …).
status: complete
