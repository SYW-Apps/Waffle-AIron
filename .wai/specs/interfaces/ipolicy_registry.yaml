id: ipolicy_registry
name: Policy Registry Interface
description: >-
  Private write-path contract for the active hosted instance pack/profile policy, the
  identity-provider (SSO) configuration collection and the instance exposure policy. The registry
  owns server-side updatedAt stamping and durable persistence, each write as one locked
  read-modify-write of its file; it performs no authorization (the orchestrator enforces that) and
  no updatedBy stamping.
component: policy_registry
methods:
  - name: setPackPolicy
    description: >-
      Persist the supplied policy as the replacement active policy: stamp updatedAt server-side
      (preserving the orchestrator-supplied updatedBy), write the single record under
      pack-policy.json's write lock, and return the stored policy. A persistence failure leaves the
      previous record intact and surfaces as a storage error.
    signature: 'setPackPolicy(policy: InstancePackPolicy): InstancePackPolicy'
    returns: InstancePackPolicy
    params:
      - name: policy
        type: InstancePackPolicy
    guarantees:
      - atomic
  - name: upsertIdentityProvider
    description: >-
      Create or update one identity-provider configuration: stamp updatedAt server-side and, in one
      locked read-modify-write of the identity-provider collection, insert or replace it by id;
      return the stored config. The config carries a clientSecretRef that points at the host secret
      mechanism; the registry persists the reference only and never a raw client secret. A
      persistence failure leaves the previous collection intact and surfaces as a storage error.
    signature: 'upsertIdentityProvider(config: IdentityProviderConfig): IdentityProviderConfig'
    returns: IdentityProviderConfig
    params:
      - name: config
        type: IdentityProviderConfig
    guarantees:
      - atomic
  - name: removeIdentityProvider
    description: >-
      Remove one identity-provider configuration by id in one locked read-modify-write: reject with
      a not-found error when no configuration has that id; otherwise persist the reduced collection.
      A persistence failure leaves the previous collection intact and surfaces as a storage error.
    signature: 'removeIdentityProvider(id: string): void'
    returns: void
    params:
      - name: id
        type: string
    guarantees:
      - atomic
  - name: setExposurePolicy
    description: >-
      Persist the supplied instance exposure policy wholesale to exposure-policy.json under that
      file's write lock and return it.
    signature: 'setExposurePolicy(policy: HostExposurePolicy): HostExposurePolicy'
    returns: HostExposurePolicy
    params:
      - name: policy
        type: HostExposurePolicy
    guarantees:
      - atomic
status: complete
