id: icredential_store
name: Credential Store Interface
description: >-
  Contract for the persisted credential-record set. Read-through file I/O: every read loads the
  backing file fresh, and every change is an update that reads the set and persists the full
  replacement (owner-only file mode) under the file's write lock — there is no bare write, which
  could replace a concurrent writer's change. Revocation is deletion, so the set holds live
  credentials only: a record an older release left carrying a revokedAt is read as absent and
  dropped by the next update.
component: credential_store
methods:
  - name: read
    description: >-
      Load the persisted credential records fresh from the backing file (an absent or unreadable
      file reads as the empty set). A record carrying a legacy revokedAt is treated as absent: it is
      not answered.
    signature: 'read(): ApiKeyRecord[]'
    returns: list<ApiKeyRecord>
    effect: read
  - name: update
    description: >-
      Read the persisted credential records fresh — without any record carrying a legacy revokedAt —
      and persist what the change makes of them, holding the backing file's write lock across both,
      so a writer in another process that reads and writes the same file in between is never lost,
      and a legacy revoked record is dropped from disk by this write; a change that throws writes
      nothing. Answers the set written.
    signature: 'update(change: (records: ApiKeyRecord[]) => ApiKeyRecord[]): ApiKeyRecord[]'
    returns: list<ApiKeyRecord>
    effect: write
status: complete
