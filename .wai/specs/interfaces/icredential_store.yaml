id: icredential_store
name: Credential Store Interface
description: >-
  Contract for the persisted credential-record set. Read-through file I/O: every read loads the
  backing file fresh, every write persists the full set (owner-only file mode).
component: credential_store
methods:
  - name: read
    description: >-
      Load the persisted credential records fresh from the backing file (an absent or unreadable
      file reads as the empty set).
    signature: 'read(): ApiKeyRecord[]'
    returns: ApiKeyRecord[]
    effect: read
  - name: write
    description: Persist the full credential record set to the backing file (owner-only permissions).
    signature: 'write(records: ApiKeyRecord[]): void'
    returns: void
    effect: write
status: complete
