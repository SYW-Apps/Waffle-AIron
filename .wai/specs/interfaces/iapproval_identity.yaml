id: iapproval_identity
name: Approval Identity Interface
description: >-
  The approval identity: the value a lock records and every staleness check compares — one project's
  own design together with its policy — and, beside it, the digests of what it consumes but does not
  approve: the code analyzer's doctrine (recorded beside the claim) and each loaded pack's doctrine
  (recorded in the inputs lock).
component: approval_identity
methods:
  - name: compute
    description: >-
      The approval identity of one project: its OWN design identity (state_hash.ownDesign) digested
      together with its policy (gate config): the project type, the design rule tuning (rules
      without rules.conformance and without the sddRuleSeverity overrides of codes a code-judging
      built-in rule declares), the `composition` block, the `network` declaration when it makes one,
      and the pack selections by name, declared version and scope. Nothing the project consumes
      enters it: wairon's built-in rules (the release), a pack's resolved content, a consumed
      contract and a member's approval are build inputs, so a new release, a re-pin, a pack update
      or a member's re-lock never re-opens an approval. The built-in rules are read only to tell
      which severity overrides tune code findings; they are not digested. Algorithm marker
      `sha256+design+policy`. Pure: the same inputs always give the same identity.
    signature: 'compute(design: StateId, builtinRules: list<SddRule>, gate: GateConfig): StateId'
    returns: StateId
    params:
      - name: design
        type: StateId
        description: The project's own design identity (state_hash.ownDesign)
      - name: builtinRules
        type: list<SddRule>
        description: The built-in rule sequence, read only to tell the code-judging codes apart
      - name: gate
        type: GateConfig
        description: 'The project''s policy: type, rule tuning, composition, network, pack selections'
    guarantees:
      - idempotent
  - name: analyzer
    description: >-
      The digest of the code analyzer's doctrine: the built-in rules that judge code, by name with
      their codes and default severities, together with the project's code-conformance tuning —
      rules.conformance and the rules.sddRuleSeverity overrides of the codes those rules declare.
      Exactly the tuning compute leaves out, projected with the same discipline (codepoint sort,
      canonical JSON, sha256 in hex), so AnalyzerIdentity.doctrineDigest moves when the analyzer's
      rule set or tuning does, and the approval identity does not.
    signature: 'analyzer(builtinRules: list<SddRule>, gate: GateConfig): string'
    returns: string
    params:
      - name: builtinRules
        type: list<SddRule>
        description: The built-in rule sequence; only the rules that judge code are projected
      - name: gate
        type: GateConfig
        description: >-
          The project's policy; only rules.conformance and the code-judging severity overrides are
          read
    guarantees:
      - idempotent
  - name: parts
    description: >-
      The approval identity's halves digested ONE BY ONE, in exactly the projection compute takes
      them in: `design` the own design identity, `rules` the project type with the design rule
      tuning, `composition`, `network` (left out when none is declared) and `selections` the pack
      selections. Never part of the identity's digest: a lock records them beside it
      (LockRecord.parts), so a later check can name the half that moved. `design`, `rules`,
      `composition` and `network` are projected exactly as the wairon 6 gate parts of the same
      names, so the v6→v7 upgrade can compare them with a wairon 6 record's parts directly. Pure.
    signature: 'parts(design: StateId, builtinRules: list<SddRule>, gate: GateConfig): map<string, string>'
    returns: map<string, string>
    params:
      - name: design
        type: StateId
        description: The project's own design identity
      - name: builtinRules
        type: list<SddRule>
        description: The built-in rule sequence, read only to tell the code-judging codes apart
      - name: gate
        type: GateConfig
        description: The project's policy
    guarantees:
      - idempotent
  - name: packContents
    description: >-
      The doctrine digest of each loaded pack, keyed by pack name: what the pack contributes to
      judging a design — its profiles, languages, patterns, guarantees, assertions and rules (each
      rule by name with its codes and default severities), projected with compute's discipline
      (codepoint sort, canonical JSON, sha256 in hex). Agent-facing prose (skills, instructions) and
      technology packages are left out, so a documentation edit inside a pack never owes a sync.
      What `wairon pack sync` and `wairon lock` record in the inputs lock, and what the build
      compares against it (InputDebtKind pack). Pure.
    signature: 'packContents(doctrine: LoadedExtensions): map<string, string>'
    returns: map<string, string>
    params:
      - name: doctrine
        type: LoadedExtensions
        description: The loaded extensions
    guarantees:
      - idempotent
previousIds:
  - igate_identity
status: complete
