id: iweb_session_store
name: Web Session Store Interface
description: >-
  Private store contract for browser sessions. The store owns state only; callers should use
  web_session_repository unless they are the owned registry or index.
component: web_session_store
methods:
  - name: load
    description: >-
      Read web-sessions.json fresh (no in-memory copy). A missing file yields an empty set; an
      unreadable file or structurally invalid JSON fails with a storage error naming the path.
    signature: 'load(): list<WebSession>'
    returns: list<WebSession>
    params: []
  - name: update
    description: >-
      Read the browser-session set fresh and persist what the change makes of it, holding the file's
      write lock (file_write_lock) across both, so a writer in another process that reads and writes
      the same file in between is never lost (a sign-in is not erased by another process's touch or
      prune); a change that throws writes nothing; a file that exists but cannot be read or parsed
      throws. Answers the set written.
    signature: 'update(change: (sessions: WebSession[]) => WebSession[]): WebSession[]'
    returns: list<WebSession>
    effect: write
lint:
  allow:
    - code: UNUSED_METHOD
      at: load
      reason: >-
        The read-through store's hydration is called by the repository FACADE, not by a member:
        every exported facade function in src/server/websessions.ts constructs the store, calls
        load(), and only then forwards to the registry or index. A Repository facade narrative is
        held to a single call step (FACADE_FORWARDING), so that hydration call has nowhere to live
        in the model and load has no modelled caller. Modelling the hydration as a facade method of
        its own that forwards to the read-back (or letting the facade doctrine carry a
        hydrate-then-forward pair) is the decision owed; declaring a call from the registry or index
        would be declaring one the code does not make.
status: complete
