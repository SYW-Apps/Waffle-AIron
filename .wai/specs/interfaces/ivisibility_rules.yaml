id: ivisibility_rules
name: Visibility Rules Interface
description: Pure surface-visibility computation over the organization graph.
component: visibility_rules
methods:
  - name: resolveVisibility
    description: >-
      Compute the observer project's visibility view: its unit membership (placement units +
      ancestors), then every target project with a placement in a unit visible to it — same-subtree
      always; same-tenant other-subtree when no closed posture intervenes on the path; cross-tenant
      only via an exposeTo grant chain — each tagged with its audience distance (department |
      instance | partner) and the granting unit. Pure: no I/O, deterministic over its inputs.
    signature: >-
      resolveVisibility(observerProjectId: string, units: list<OrganizationUnitRecord>, placements:
      list<ProjectPlacement>): VisibilityResolution
    returns: VisibilityResolution
    params:
      - name: observerProjectId
        type: string
      - name: units
        type: list<OrganizationUnitRecord>
      - name: placements
        type: list<ProjectPlacement>
    guarantees:
      - idempotent
  - name: isVisible
    description: 'Point check: whether the resolution includes the target project.'
    signature: 'isVisible(resolution: VisibilityResolution, targetProjectId: string): bool'
    returns: bool
    params:
      - name: resolution
        type: VisibilityResolution
      - name: targetProjectId
        type: string
    guarantees:
      - idempotent
  - name: audienceDistance
    description: >-
      The audience distance class of a visible target (department | instance | partner), or null
      when not visible — the value entry-level audience ceilings are intersected with.
    signature: 'audienceDistance(resolution: VisibilityResolution, targetProjectId: string): string?'
    returns: string?
    params:
      - name: resolution
        type: VisibilityResolution
      - name: targetProjectId
        type: string
    guarantees:
      - idempotent
  - name: covers
    description: >-
      Whether an entry's audience ceiling covers an observer at a distance: the second half of the
      rule audienceDistance opens. A null distance (the target is not visible through the unit
      graph) is the farthest class, so only external entries remain visible.
    signature: 'covers(entryAudience: string?, distance: string?): bool'
    returns: bool
    params:
      - name: entryAudience
        type: string?
        description: The entry's declared audience ceiling, if any.
      - name: distance
        type: string?
        description: The observer's audience distance, as audienceDistance answers it.
status: complete
