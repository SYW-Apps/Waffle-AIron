id: ihost_mcp_adapter
name: Host MCP Client Adapter Interface
description: Contract for reusing the sdd_* MCP tool surface within a bound project scope.
component: host_mcp_adapter
methods:
  - name: createScopedServer
    description: >-
      Create the request-scoped MCP server reusing the sdd_* tool surface unchanged, WITH the hosted
      data-plane tools (self-service approvals + the four landscape discovery/exchange tools)
      advertised in tools/list for discovery — their execution is intercepted by the host request
      orchestrator before any call reaches this server, so the advertised registrations carry
      descriptor stubs that only answer outside a hosted request (where the tools are unsupported by
      design).
    signature: 'createScopedServer(): McpServer'
    returns: McpServer
status: complete
