id: isecret_registry
name: Secret Registry Interface
description: Contract for setting and listing the container's integration secrets. Values are never returned.
component: secret_registry
methods:
  - name: write
    description: >-
      Set a secret by key (git-token | notion-token | signing-secret | …) in the data-dir secret
      store.
    signature: 'write(key: string, value: string): void'
    returns: void
  - name: list
    description: List the configured secret keys (names only, never values).
    signature: 'list(): string[]'
    returns: string[]
status: complete
