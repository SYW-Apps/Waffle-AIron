id: ipermission_admin_orchestrator
name: Permission Admin Orchestrator Interface
description: >-
  Control-plane contract for managing roles, the permission-assignment grid, and user role bindings,
  and for explaining one user's effective permission. Every method authenticates the caller and
  authorizes via the authorization component; role management requires instance-level project:admin,
  assignment/binding management and the explanation require project:admin over the target scope (for
  a subsystem scope, over its project — managing a subsystem's rules is administering its project).
  The reserved '*' instance-admin marker is never settable here. A subsystem scope is one more scope
  kind on the same grid, not a separate surface.
component: permission_admin_orchestrator
methods:
  - name: createRole
    description: >-
      Authenticate, require instance-level project:admin, create a role through the role repository,
      and audit. Roles are instance-level templates.
    signature: 'createRole(credential: string, role: Role): Role'
    returns: Role
    params:
      - name: credential
        type: string
      - name: role
        type: Role
    guarantees:
      - atomic
  - name: updateRole
    description: >-
      Authenticate, require instance-level project:admin, update a role's metadata/permissions
      through the role repository, and audit.
    signature: 'updateRole(credential: string, role: Role): Role'
    returns: Role
    params:
      - name: credential
        type: string
      - name: role
        type: Role
    guarantees:
      - atomic
  - name: deleteRole
    description: >-
      Authenticate, require instance-level project:admin, delete a role through the role repository,
      and audit. Bindings referencing a deleted role become inert (permission rules ignore unknown
      roles).
    signature: 'deleteRole(credential: string, roleId: string): void'
    returns: void
    params:
      - name: credential
        type: string
      - name: roleId
        type: string
  - name: listRoles
    description: Authenticate, require instance-level project:admin, and list all defined roles.
    signature: 'listRoles(credential: string): list<Role>'
    returns: list<Role>
    params:
      - name: credential
        type: string
  - name: setAssignment
    description: >-
      Authenticate, reject the reserved '*' instance-admin marker, refuse a subsystem-scope
      assignment that is not project:write with yes, no or inherit, or whose scope id is not
      `<projectId>/<subsystemId>`, require project:admin over the assignment's scope, upsert the
      assignment through the permission repository, and audit at security level. Setting or clearing
      a subsystem rule is this method and removeAssignment — one more scope kind on the existing
      grid.
    signature: 'setAssignment(credential: string, assignment: PermissionAssignment): PermissionAssignment'
    returns: PermissionAssignment
    params:
      - name: credential
        type: string
      - name: assignment
        type: PermissionAssignment
    guarantees:
      - atomic
  - name: removeAssignment
    description: >-
      Authenticate, look up the assignment (not-found when absent), require project:admin over ITS
      scope (never a caller-supplied one), remove it through the permission repository, and audit.
    signature: 'removeAssignment(credential: string, assignmentId: string): void'
    returns: void
    params:
      - name: credential
        type: string
      - name: assignmentId
        type: string
  - name: listAssignments
    description: >-
      Authenticate, require project:admin over the queried scope, and list assignments filtered by
      scope/subject through the permission repository. A subsystem-scope assignment whose project's
      tree declares no such subsystem is kept and listed with scopeNote "subsystem not found", so a
      stale rule never sits there silently.
    signature: >-
      listAssignments(credential: string, scopeKind?: ScopeKind, scopeId?: string, subjectKind?:
      AssignmentSubjectKind, subjectId?: string): list<PermissionAssignment>
    returns: list<PermissionAssignment>
    params:
      - name: credential
        type: string
      - name: scopeKind
        type: ScopeKind
        optional: true
      - name: scopeId
        type: string
        optional: true
      - name: subjectKind
        type: AssignmentSubjectKind
        optional: true
      - name: subjectId
        type: string
        optional: true
  - name: bindRole
    description: >-
      Authenticate, refuse a subsystem-scope binding whose scope id is not
      `<projectId>/<subsystemId>`, require project:admin over the binding's scope, add a {roleId,
      scope} binding to the target user's roleBindings (idempotent) through the user repository, and
      audit. A role bound at a subsystem confers only its project:write there.
    signature: >-
      bindRole(credential: string, userId: string, roleId: string, scopeKind?: ScopeKind, scopeId?:
      string): HostedUserRecord
    returns: HostedUserRecord
    params:
      - name: credential
        type: string
      - name: userId
        type: string
      - name: roleId
        type: string
      - name: scopeKind
        type: ScopeKind
        optional: true
      - name: scopeId
        type: string
        optional: true
    guarantees:
      - atomic
  - name: unbindRole
    description: >-
      Authenticate, require project:admin over the binding's scope, remove the matching {roleId,
      scope} binding from the target user's roleBindings through the user repository, and audit.
    signature: >-
      unbindRole(credential: string, userId: string, roleId: string, scopeKind?: ScopeKind,
      scopeId?: string): HostedUserRecord
    returns: HostedUserRecord
    params:
      - name: credential
        type: string
      - name: userId
        type: string
      - name: roleId
        type: string
      - name: scopeKind
        type: ScopeKind
        optional: true
      - name: scopeId
        type: string
        optional: true
  - name: explain
    description: >-
      Authenticate, require project:admin over the target scope, read the user, and answer that
      user's effective permission for a capability at the scope (unit, project or subsystem) with
      the source and the rung that decided it — why they can or cannot act, through the same walk
      every gate takes. A subsystem scope its project's tree does not declare is labelled scopeNote
      "subsystem not found". A read; not audited.
    signature: >-
      explain(credential: string, userId: string, capability: string, scopeKind: ScopeKind, scopeId:
      string): EffectivePermission
    returns: EffectivePermission
    params:
      - name: credential
        type: string
      - name: userId
        type: string
        description: The user record id or the subject's userId
      - name: capability
        type: string
      - name: scopeKind
        type: ScopeKind
        description: The kind of scope to explain the permission at
      - name: scopeId
        type: string
        description: The unit or project id, `<projectId>/<subsystemId>`, or empty for the instance
    guarantees:
      - idempotent
status: complete
