id: iweb_project_orchestrator
name: Web Project Orchestrator Interface
description: >-
  Contract for the web UI's project-lifecycle workflows. Every method is session-authenticated.
  listProjects is owned here (scoped read); create routes through the project policy orchestrator's
  profile-aware initialization; lock/promote/destroy forward to the admin orchestrator with the
  session as the credential, so the resolver authorization applies unchanged.
component: web_project_orchestrator
methods:
  - name: listProjects
    description: >-
      Resolve the session to a Principal, resolve the caller's project scope over the organization
      tree, and return the hosted project records within that scope (a super-admin sees all). A
      read; not audited.
    signature: 'listProjects(sessionId: string): HostedProjectRecord[]'
    returns: HostedProjectRecord[]
    params:
      - name: sessionId
        type: string
  - name: createProject
    description: >-
      Create a hosted project placed in the REQUIRED owner unit, optionally with a profile selection
      — builds a ProjectInitRequest and forwards to
      project_policy_orchestrator.initializeProjectWithProfile with the session as the credential,
      so the instance pack policy (required/default packs, profile requirements, enforcement mode)
      applies to a web create exactly as it does to the MCP init (project:create over the unit
      enforced there).
    signature: >-
      createProject(sessionId: string, id: string, unitId: string, profileSelection:
      ProjectProfileSelection): HostedProjectRecord
    returns: HostedProjectRecord
    params:
      - name: sessionId
        type: string
      - name: id
        type: string
      - name: unitId
        type: string
        description: REQUIRED target organization unit that owns the new project.
      - name: profileSelection
        type: ProjectProfileSelection
        description: >-
          Optional profile selection recorded into the project's config; a policy with
          requireProfileSelection rejects a create without one.
        optional: true
  - name: lockProject
    description: >-
      Lock a project (validate-as-complete then write the StateId-scoped lock); forwards to
      admin_orchestrator.lockProject with the session as the credential (project:write permission
      enforced there).
    signature: 'lockProject(sessionId: string, projectId: string): LockRecord'
    returns: LockRecord
    params:
      - name: sessionId
        type: string
      - name: projectId
        type: string
  - name: promoteProject
    description: >-
      Mark a locked project ready-for-promotion after the StateId re-check; forwards to
      admin_orchestrator.promoteProject with the session as the credential (project:write permission
      enforced there).
    signature: 'promoteProject(sessionId: string, projectId: string): PromoteResult'
    returns: PromoteResult
    params:
      - name: sessionId
        type: string
      - name: projectId
        type: string
  - name: destroyProject
    description: >-
      Deregister a project and its tree; forwards to admin_orchestrator.destroyProject with the
      session as the credential (project:admin permission enforced there).
    signature: 'destroyProject(sessionId: string, id: string): void'
    returns: void
    params:
      - name: sessionId
        type: string
      - name: id
        type: string
status: complete
