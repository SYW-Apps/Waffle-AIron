id: iweb_project_orchestrator
name: Web Project Orchestrator Interface
description: >-
  Contract for the web UI's project-lifecycle workflows. Every method is session-authenticated. list
  is owned here (scoped read); create routes through the project policy orchestrator's profile-aware
  initialization; lock/destroy forward to the admin orchestrator with the session as the credential,
  so the permission-rules authorization applies unchanged.
component: web_project_orchestrator
methods:
  - name: list
    description: >-
      Resolve the session to a Principal, resolve the caller's project scope over the organization
      tree and the project chain, and return the hosted project records within that scope (a
      super-admin sees all). Member records are projects like any other: a member is listed when the
      caller may read it through its own chain — which a read on its parent grants by inheritance,
      unless an explicit no on the member's own record removes it; each keeps parentProjectId (the
      crumb) and memberPath. A read; not audited.
    signature: 'list(sessionId: string): list<HostedProjectRecord>'
    returns: list<HostedProjectRecord>
    params:
      - name: sessionId
        type: string
  - name: create
    description: >-
      Create a hosted project placed in the REQUIRED owner unit, optionally with a profile selection
      — builds a ProjectInitRequest and forwards to
      project_policy_orchestrator.initializeProjectWithProfile with the session as the credential,
      so the instance pack policy (required/default packs, profile requirements, enforcement mode)
      applies to a web create exactly as it does to the MCP init (project:create over the unit
      enforced there). Answers the GovernedProjectCreation: the record with the impact of every pack
      and of the governing-profile step the policy applied.
    signature: >-
      create(sessionId: string, id: string, unitId: string, profileSelection?:
      ProjectProfileSelection): GovernedProjectCreation
    returns: GovernedProjectCreation
    params:
      - name: sessionId
        type: string
      - name: id
        type: string
      - name: unitId
        type: string
        description: REQUIRED target organization unit that owns the new project.
      - name: profileSelection
        type: ProjectProfileSelection
        description: >-
          Optional profile selection recorded into the project's config; a policy with
          requireProfileSelection rejects a create without one.
        optional: true
  - name: lock
    description: >-
      Lock a project (validate-as-complete then write the StateId-scoped lock); forwards to
      admin_orchestrator.lockProject with the session as the credential (project:write permission
      enforced there).
    signature: 'lock(sessionId: string, projectId: string): LockRecord'
    returns: LockRecord
    params:
      - name: sessionId
        type: string
      - name: projectId
        type: string
  - name: destroy
    description: >-
      Deregister a project and its tree; forwards to admin_orchestrator.destroyProject with the
      session as the credential (project:admin permission enforced there).
    signature: 'destroy(sessionId: string, id: string): void'
    returns: void
    params:
      - name: sessionId
        type: string
      - name: id
        type: string
lint:
  allow: []
