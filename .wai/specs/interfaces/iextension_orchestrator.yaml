id: iextension_orchestrator
name: Extension Orchestrator Interface
description: Loads and merges the extension packs governing a project into a single LoadedExtensions.
component: extension_orchestrator
methods:
  - name: loadProjectExtensions
    description: >-
      Load everything governing the current project: globally installed packs (unless
      extensions.useGlobalPacks is false), then the project's declared entries — legacy path refs
      and by-name SELECTIONS resolved against the committed bundle, then the pack store. Project
      packs win on collision. An unresolvable selection contributes an EXTENSION_LOAD_ERROR instead
      of silently reducing the rule set; the packs that did resolve still apply. An uninitialized
      project simply has none.
    signature: 'loadProjectExtensions(): LoadedExtensions'
    returns: LoadedExtensions
    params: []
  - name: load
    description: >-
      Load extension packs from explicit refs (all project-scoped) resolved against the given
      project root — the programmatic entry used when a caller injects its own pack set.
    signature: 'load(packRefs: string[], projectRoot: string): LoadedExtensions'
    returns: LoadedExtensions
    params:
      - name: packRefs
        type: string[]
      - name: projectRoot
        type: string
    invokedBy:
      kind: external
      caller: >-
        Wrapper products embedding wairon as a library call load directly as the public library
        entry point (docs/extending-wairon.md); no internal call chain exists by design.
  - name: packEntryLabel
    description: >-
      A stable human label for one configured pack entry — the path for a legacy ref, or
      name[@version] for a selection. For messages and listings, never for loading.
    signature: 'packEntryLabel(entry: PackSelection): string'
    returns: string
    params:
      - name: entry
        type: PackSelection
        description: A configured pack entry (a legacy path ref string, or a selection).
    invokedBy:
      kind: sibling-subsystem
      caller: >-
        sdd_cli pack commands (cli_packs_adapter) and sdd_host's pack plane (host_core_adapter
        forwarder into pack_store/pack_orchestrator) label pack entries for listings and messages,
        crossing over sdd_core's published barrel surface.
  - name: packEntryRef
    description: >-
      The loadable ref for one configured pack entry: a legacy path/module ref passes through
      unchanged; a selection resolves against the committed bundle then the store. Null when a
      selection cannot be resolved, leaving the caller to decide whether that is an error it reports
      or an entry it skips.
    signature: 'packEntryRef(entry: PackSelection, projectRoot: string): string | null'
    returns: string | null
    params:
      - name: entry
        type: PackSelection
      - name: projectRoot
        type: string
    invokedBy:
      kind: sibling-subsystem
      caller: >-
        sdd_cli pack commands (cli_packs_adapter) and sdd_host's pack plane (host_core_adapter
        forwarder) resolve a selection entry to its loadable ref, crossing over sdd_core's published
        barrel surface.
  - name: globalPacksEnabled
    description: >-
      Whether machine-wide packs (the pack store) ALSO apply to a project that has not said. False
      by default: a project's doctrine is what the project declares, so installing a pack makes it
      available rather than authoritative. One accessor so every reader and every config writer
      agrees on the default.
    signature: 'globalPacksEnabled(config: ProjectConfig): boolean'
    returns: boolean
    params:
      - name: config
        type: ProjectConfig
    invokedBy:
      kind: sibling-subsystem
      caller: >-
        sdd_cli pack commands and sdd_host's pack plane read the useGlobalPacks gate when rewriting
        extensions config, crossing over sdd_core's published barrel surface.
  - name: diagnoseProjectPacks
    description: >-
      Report this project's pack situation for `wairon doctor`: selections that do not resolve,
      installed packs the project does NOT apply, machine-wide packs it applies by opting in, and
      whether it ever declared a position on machine-wide packs at all. That last flag is what
      distinguishes a project that deliberately applies nothing from one that never decided — the
      latter used to inherit machine-wide doctrine automatically, so its gate may now be weaker than
      its author expects. Never throws.
    signature: 'diagnoseProjectPacks(): PackDiagnosis'
    returns: PackDiagnosis
    params: []
    invokedBy:
      kind: sibling-subsystem
      caller: >-
        The `wairon doctor` command (sdd_cli, commands/doctor.ts) runs the project pack diagnosis
        over sdd_core's published barrel surface rather than a modeled component edge.
  - name: pinInstalledPacksAsSelections
    description: >-
      The migration action behind `wairon doctor --fix`: for a project that never declared a
      position on machine-wide packs, record the installed-but-unapplied packs as explicit
      name+version selections (carrying a fetchable origin as their source) and turn machine-wide
      loading off. Doctrine that governs a project becomes declared BY that project, visible in a
      diff and reproducible for a clone. Returns the names recorded; does nothing for a project that
      already decided, so selections are never invented for one that deliberately applies nothing.
    signature: 'pinInstalledPacksAsSelections(): string[]'
    returns: string[]
    params: []
    invokedBy:
      kind: sibling-subsystem
      caller: >-
        The `wairon doctor --fix` flow (sdd_cli, commands/doctor.ts) pins installed packs as
        explicit selections over sdd_core's published barrel surface rather than a modeled component
        edge.
  - name: defaultPackSelections
    description: >-
      The store packs whose manifests declare `applyByDefault: true`, shaped as selections ready to
      seed into a NEW project. Reads each installed pack's manifest and skips any that fails to
      load, so a broken pack seeds nothing. Never throws — a machine with no such packs seeds an
      empty list. The distinction it exists for: a machine-wide install becomes a default for
      projects created from now on (written into the new project's config, visible in review and
      removable) rather than retroactive authority over every project on disk.
    signature: 'defaultPackSelections(): PackSelection[]'
    returns: PackSelection[]
    params: []
  - name: packStoreDir
    description: >-
      Where installed packs live on this machine. Published because `wairon packs` reports the path
      to a person who may need to look in it; the orchestrator fronts the store adapter so no
      consumer has to know the layout.
    signature: 'packStoreDir(): string'
    returns: string
    params: []
    guarantees:
      - idempotent
  - name: listInstalledPacks
    description: >-
      Every pack installed on this machine, whatever any project has declared. The distinction
      matters: installed and applied are different states, and a pack present but undeclared is
      exactly what `wairon doctor` reports.
    signature: 'listInstalledPacks(): InstalledPack[]'
    returns: InstalledPack[]
    params: []
    guarantees:
      - idempotent
  - name: resolveInstalledPack
    description: >-
      One installed pack by name, at a given version or the newest when none is named, or nothing
      when it is not installed.
    signature: 'resolveInstalledPack(name: string, version?: string): InstalledPack | null'
    returns: InstalledPack | null
    params:
      - name: name
        type: string
        description: The pack name
      - name: version
        type: string
        description: A specific version, or the newest when omitted
    guarantees:
      - idempotent
  - name: installPackFromDirectory
    description: >-
      Install a pack from a directory on disk, recording where it came from so a later listing can
      say whether it was fetched or made locally.
    signature: 'installPackFromDirectory(sourceDir: string, origin?: string): InstalledPack'
    returns: InstalledPack
    params:
      - name: sourceDir
        type: string
        description: The directory holding the pack
      - name: origin
        type: string
        description: Where it came from, for the record
    effect: write
  - name: uninstallPack
    description: >-
      Remove an installed pack, answering whether there was one to remove. Removing from the machine
      store never edits a project: a project that declared the pack still declares it, and that
      mismatch is something to report rather than silently repair.
    signature: 'uninstallPack(name: string, version?: string): boolean'
    returns: boolean
    params:
      - name: name
        type: string
        description: The pack name
      - name: version
        type: string
        description: A specific version, or every version when omitted
    effect: write
lint:
  allow: []
status: complete
