id: iproject_registry
name: Project Registry Interface
description: >-
  Contract for the hosted-project registry: id-to-root resolution for scoping, plus project
  lifecycle persistence.
component: project_registry
methods:
  - name: resolveRoot
    description: >-
      Resolve the isolated root path of the authorized project, honoring the optional selector only
      within the principal's authorized set; reject cross-project access.
    signature: 'resolveRoot(principal: Principal, selector: string): string'
    returns: string
  - name: create
    description: Allocate an isolated project root, create its directory, and persist the record.
    signature: 'create(id: string): HostedProjectRecord'
    returns: HostedProjectRecord
  - name: list
    description: List all hosted-project records.
    signature: 'list(): HostedProjectRecord[]'
    returns: HostedProjectRecord[]
  - name: remove
    description: Deregister a project and remove its isolated tree.
    signature: 'remove(id: string): void'
    returns: void
status: complete
createdAt: '2026-07-04T12:49:59.044Z'
updatedAt: '2026-07-04T13:06:22.868Z'
