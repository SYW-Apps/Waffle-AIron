id: iproject_registry
name: Project Registry Interface
description: >-
  Contract for the hosted-project registry: id-to-root resolution for scoping, plus project
  lifecycle persistence.
component: project_registry
methods:
  - name: resolveRoot
    description: >-
      Resolve the isolated root path of the authorized project, honoring the optional selector only
      within the principal's authorized set; reject cross-project access. A subproject-qualified
      selector or narrowing entry ('projectId::subsystemId', nested mounts composing) resolves to
      the CHAINED CHILD's root INSIDE the project's isolated tree — the mount is looked up on the
      project's subsystem specs (an unknown or non-chained subsystem id is rejected, never silently
      widened to the project root) and the child path is containment-checked against the project
      root. A principal narrowed to a subproject can never bind wider than its qualifier; the
      selector can never widen scope.
    signature: 'resolveRoot(principal: Principal, selector: string): string'
    returns: string
  - name: create
    description: Allocate an isolated project root, create its directory, and persist the record.
    signature: 'create(id: string): HostedProjectRecord'
    returns: HostedProjectRecord
  - name: list
    description: List all hosted-project records.
    signature: 'list(): HostedProjectRecord[]'
    returns: HostedProjectRecord[]
  - name: remove
    description: Deregister a project and remove its isolated tree.
    signature: 'remove(id: string): void'
    returns: void
status: complete
