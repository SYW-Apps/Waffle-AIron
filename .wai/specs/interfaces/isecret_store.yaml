id: isecret_store
name: Secret Store Interface
description: Contract for the persisted secret map. Read-through file I/O over the data-dir secret file.
component: secret_store
methods:
  - name: read
    description: >-
      Parse the persisted secret map fresh from the backing file (absent file reads as the empty
      map).
    signature: 'read(): Record<string, string>'
    returns: map<string, string>
    effect: read
  - name: update
    description: >-
      Read the secret map fresh and persist what the change makes of it, holding the secret file's
      write lock (file_write_lock) across both, so two secrets set at once in different processes
      are both kept; a change that throws writes nothing; a file that exists but cannot be read or
      parsed throws, so a corrupt file is never replaced by a map holding one key. Requires the data
      dir to be configured. Answers the map written.
    signature: >-
      update(change: (secrets: Record<string, string>) => Record<string, string>): Record<string,
      string>
    returns: map<string, string>
    effect: write
status: complete
createdAt: '2026-07-19T08:59:17.663Z'
