id: istate_hash
name: State Hash Interface
description: >-
  Contract for computing the deterministic identity of the spec tree: the whole scan (compute) and
  the bound project's own DESIGN (ownDesign) — the design half of the approval identity.
component: state_hash
methods:
  - name: compute
    description: >-
      Load every spec via the loader — the bound root's and every member the scan follows —
      canonicalize (stable key order, normalized serialization), and digest into a StateId. Pure and
      reproducible. Used for the snapshot and archive stamps, never for the gate identity since
      stage 5.
    signature: 'compute(): StateId'
    returns: StateId
    params: []
    guarantees:
      - idempotent
  - name: ownDesign
    description: >-
      The DESIGN identity of the bound project's own specs: the specs the scan keys under the bound
      root — its parts' specs included, each digested under its storage-independent path
      (`members/<alias>/<path inside the part>`), so moving a part leaves the identity unchanged
      when its content does not — never a project member's; each spec digested in its design view
      (an implementation, a type, a component, a subsystem and a contract through their type's
      designView: code linkage, readiness and timestamps out, a contract's implements in its one
      canonical form — a one-entry list as its plain string, an empty list as absent — so a re-save
      of the same entries never moves it; every other kind with createdAt/updatedAt out), in stable
      order and canonical form. Algorithm marker `sha256-design-2`, so it never compares equal to a
      content identity. The design half of the approval identity: adding, moving or removing a
      sourcePath, symbol, exportedVia, simPath, injectedParams, conformance tier or external link,
      or promoting or demoting a status, never moves it; any change to what the design says does.
    signature: 'ownDesign(): StateId'
    returns: StateId
    params: []
    guarantees:
      - idempotent
status: complete
