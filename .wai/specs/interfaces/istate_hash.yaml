id: istate_hash
name: State Hash Interface
description: Contract for computing the deterministic content identity of the spec tree.
component: state_hash
methods:
  - name: compute
    description: >-
      Load every spec via the loader, canonicalize (stable key order, normalized serialization), and
      digest into a StateId. Pure and reproducible.
    signature: 'compute(): StateId'
    returns: StateId
    guarantees:
      - idempotent
status: complete
