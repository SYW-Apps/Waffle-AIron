id: ispec_doc_pages
name: Spec Doc Pages Interface
description: Contract for projecting the spec tree into a target-agnostic DocPage tree.
component: spec_doc_pages
methods:
  - name: project
    description: >-
      Load the bound project's spec tree and Mermaid diagram and build the 'wairon specs' DocPage
      tree (subsystem/component pages with prose, method tables, a Mermaid code block, and the
      optional canvas link).
    signature: 'project(diagramUrl: string): DocPage'
    returns: DocPage
  - name: projectGraph
    description: >-
      Project the bound project's components and dependsOn edges into a GraphModel for a visual
      target (Miro).
    signature: 'projectGraph(): GraphModel'
    returns: GraphModel
status: complete
