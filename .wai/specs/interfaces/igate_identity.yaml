id: igate_identity
name: Gate Identity Interface
description: >-
  The gate identity: the value a lock records and every staleness check compares — and, beside it,
  the digest of the code analyzer's doctrine, which a lock records next to its claim and never
  inside it.
component: gate_identity
methods:
  - name: compute
    description: >-
      The gate identity of one project: its OWN spec identity digested together with the DESIGN
      doctrine that governs it, its own consumed contract inputs, its `composition` block, its
      `network` declaration when it makes one, and each direct member's composition subject keyed by
      alias. The design doctrine is the built-in rules that judge design (by name, codes and default
      severities); the packs, profiles, languages, patterns, guarantees, assertions and pack rules;
      and the project's type and its rule tuning without the code-conformance tuning
      (rules.conformance and the sddRuleSeverity overrides of code-judging codes). Rules that judge
      code, and their tuning, are left out, so neither an analyzer upgrade nor a code-severity
      change ever stales a lock. Agent-facing prose (skills, instructions) is left out, so a
      documentation edit never does either. From format 3 the content is the DESIGN identity
      (state_hash.ownDesign), so code linkage never does. A project that declares no network digests
      exactly as before, so no existing lock stales. The algorithm marker follows the content
      identity it is given: `sha256+design+doctrine+inputs+members` for a design identity
      (`sha256-design`), and the previous `sha256+content+doctrine+inputs+members` for a
      full-content identity (`sha256`), which is how the same pure function recomputes a format-2
      lock's identity exactly as it was taken. A member's specs are never hashed here: the member's
      RECORDED subject stands for them. Pure: the same inputs always give the same identity.
    signature: >-
      compute(content: StateId, doctrine: LoadedExtensions, builtinRules: list<SddRule>, inputs:
      list<string>, gate: GateConfig, members: map<string, string>): StateId
    returns: StateId
    params:
      - name: content
        type: StateId
        description: >-
          The project's own spec identity: the design identity (state_hash.ownDesign) for the
          current gate, or the full-content identity (state_hash.ownTree) to recompute a format-2
          lock's
      - name: doctrine
        type: LoadedExtensions
        description: The governing extensions
      - name: builtinRules
        type: list<SddRule>
        description: The built-in rule sequence; the rules that judge code are filtered out here
      - name: inputs
        type: list<string>
        description: The project's own consumed contract inputs, as canonical content keys
      - name: gate
        type: GateConfig
        description: The project's type, rule tuning, composition block and network declaration
      - name: members
        type: map<string, string>
        description: >-
          Each direct member's alias → its composition subject (the stateId its own lock record
          carries, rendered `<algorithm>:<digest>`), or `never` when the member carries no lock or
          has no project on disk
    guarantees:
      - idempotent
  - name: analyzer
    description: >-
      The digest of the code analyzer's doctrine: the built-in rules that judge code, by name with
      their codes and default severities, together with the project's code-conformance tuning —
      rules.conformance and the rules.sddRuleSeverity overrides of the codes those rules declare.
      Exactly the half compute leaves out, projected with the same discipline (codepoint sort,
      canonical JSON, sha256 in hex), so AnalyzerIdentity.doctrineDigest moves when the analyzer's
      rule set or tuning does, and the gate identity does not.
    signature: 'analyzer(builtinRules: list<SddRule>, gate: GateConfig): string'
    returns: string
    params:
      - name: builtinRules
        type: list<SddRule>
        description: The built-in rule sequence; only the rules that judge code are projected
      - name: gate
        type: GateConfig
        description: The project's configuration half; only rules.conformance is read
    guarantees:
      - idempotent
status: complete
