id: ilock_store
name: Lock Store Interface
description: Contract for reading and writing a project's commit-scoped lock record (.wai/lock.json).
component: lock_store
methods:
  - name: read
    description: >-
      Read the current lock record for the bound project: null when absent. A record that exists but
      cannot be read as a format-4 one fails closed with LockRecordUnreadableError, never null:
      empty, not JSON, not a lock record, a newer format — and an EARLIER format, whose error says
      it was written by an earlier wairon major and that `wairon upgrade` carries it into this
      release.
    signature: 'read(): LockRecord | null'
    returns: LockRecord?
    effect: read
  - name: write
    description: Persist the lock record for the bound project (overwrites any prior record).
    signature: 'write(record: LockRecord): void'
    returns: void
    effect: write
  - name: readAt
    description: >-
      Read the lock record of a project at a given root: null when it has none, and
      LockRecordUnreadableError when it holds one that cannot be read as format 4, exactly as
      `read`. Distinct from `read` because a contract method binds exactly one code symbol; it
      exists because a parent reads the records of the members it declares, each at its own root,
      and none of those is the bound project.
    signature: 'readAt(root: string): LockRecord?'
    returns: LockRecord?
    params:
      - name: root
        type: string
        description: The project root whose record to read
    guarantees:
      - idempotent
    effect: read
status: complete
