id: ilock_store
name: Lock Store Interface
description: Contract for reading and writing a project's commit-scoped lock record (.wai/lock.json).
component: lock_store
methods:
  - name: read
    description: Read the current lock record for the bound project, or null when absent.
    signature: 'read(): LockRecord | null'
    returns: LockRecord | null
    effect: read
  - name: write
    description: Persist the lock record for the bound project (overwrites any prior record).
    signature: 'write(record: LockRecord): void'
    returns: void
    effect: write
  - name: readAt
    description: >-
      Read the lock record of a project at a given root, or null when it has none. Distinct from
      `read` rather than a parameter on it because a contract method binds exactly one code symbol,
      and the two reads are two functions — but the real reason it exists is the chained model: a
      parent compares its approval against the records of the children it mounts, and none of those
      is the bound project.
    signature: 'readAt(root: string): LockRecord | null'
    returns: LockRecord | null
    params:
      - name: root
        type: string
        description: The project root whose record to read
    guarantees:
      - idempotent
    effect: read
status: complete
