id: ilock_store
name: Lock Store Interface
description: Contract for reading and writing a project's commit-scoped lock record (.wai/lock.json).
component: lock_store
methods:
  - name: read
    description: >-
      Read the current lock record for the bound project: null when absent; a record that exists but
      cannot be read as one (empty, not JSON, not a lock record, a newer format) fails closed with
      LockRecordUnreadableError, never null.
    signature: 'read(): LockRecord | null'
    returns: LockRecord?
    effect: read
  - name: write
    description: Persist the lock record for the bound project (overwrites any prior record).
    signature: 'write(record: LockRecord): void'
    returns: void
    effect: write
  - name: readAt
    description: >-
      Read the lock record of a project at a given root: null when it has none, and
      LockRecordUnreadableError when it holds one that cannot be read, exactly as `read`. Distinct
      from `read` rather than a parameter on it because a contract method binds exactly one code
      symbol, and the two reads are two functions — but the real reason it exists is the chained
      model: a parent compares its approval against the records of the children it mounts, and none
      of those is the bound project.
    signature: 'readAt(root: string): LockRecord?'
    returns: LockRecord?
    params:
      - name: root
        type: string
        description: The project root whose record to read
    guarantees:
      - idempotent
    effect: read
status: complete
