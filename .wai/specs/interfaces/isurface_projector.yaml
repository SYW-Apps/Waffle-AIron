id: isurface_projector
name: Surface Projector Interface
description: Contract-grade snapshot derivation from the loaded spec tree.
component: surface_projector
methods:
  - name: projectOwnSurface
    description: >-
      Project the own tree's resolved L0 export table at or below the audience ceiling into a
      self-contained contract-grade snapshot: each public name with the full L3 contract of its
      canonical target (narrowed to the entry's interface when it narrows) — every method with its
      params and returns resolved, a method that takes its signature from a source carrying the
      source's inline and never the signatureFrom, since a snapshot names no producer-internal
      method — its stereotype, dispatch table, auth and base path; the exported types listed apart;
      the transitive type closure, followed through data types' fields and through signature types'
      params and returns, a signature type arriving with both; the project's effective id beside its
      name; and StateId provenance. Every re-export is resolved once by the export index, so a
      consumer never walks the producer's chain. Every type reference inside the snapshot (params,
      returns, fields, a signature type's params and returns) is written in its canonical form
      (surface_snapshot.canonicalTypeRef), never as the author spelled it, so restating a reference
      in another legal spelling — a self-prefix dropped, a bare name imported instead of qualified —
      changes no byte of the snapshot.
    signature: 'projectOwnSurface(maxAudience: string): SurfaceSnapshot'
    returns: SurfaceSnapshot
    params:
      - name: maxAudience
        type: string
status: complete
