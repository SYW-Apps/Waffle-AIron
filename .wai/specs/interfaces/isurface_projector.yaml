id: isurface_projector
name: Surface Projector Interface
description: Contract-grade snapshot derivation from the loaded spec tree.
component: surface_projector
methods:
  - name: projectOwnSurface
    description: >-
      Project the own tree's resolved L0 export table at or below the audience ceiling into a
      self-contained contract-grade snapshot — and, for a service document (ownHttpPortals), every
      HTTP Portal of the project's own besides, exported or not: the L0 export table governs what
      other wairon projects may consume, never what the project's own API document describes. For
      each public name it carries the full L3 contract of the name's canonical target, narrowed to
      the entry's interface when it narrows. Every method has its params and returns resolved, and a
      method that takes its signature from a source carries the source's signature inline (with its
      effect, unless it declares its own) and never the signatureFrom, since a snapshot names no
      producer-internal method. A rename trace travels as `formerly` — on an entry, a method, a type
      and each field (and signature param) of a type — as provenance that no digest reads, so a
      rename moves no digest beyond the name it changed and a consumer reads the rename. Each entry
      also carries its stereotype, dispatch table, auth, base path, transport, abi, derived export
      kind and export role. The snapshot further holds the exported types listed apart; the
      transitive type closure, followed through data types' fields and through signature types'
      params and returns, a signature type arriving with both; the project's effective id beside its
      name and its targetLanguage; and StateId provenance. Every re-export is resolved once by the
      export index, so a consumer never walks the producer's chain. Every type reference inside the
      snapshot is written in its canonical form (surface_snapshot.canonicalTypeRef), so restating a
      reference in another legal spelling changes no byte of the snapshot.
    signature: 'projectOwnSurface(maxAudience: string, ownHttpPortals?: bool): SurfaceSnapshot'
    returns: SurfaceSnapshot
    params:
      - name: maxAudience
        type: string
      - name: ownHttpPortals
        type: bool
        description: >-
          Also carry every HTTP Portal of the bound project's own that its export table does not, at
          the `project` ceiling only — a service document's view
        optional: true
status: complete
