id: isurface_projector
name: Surface Projector Interface
description: Contract-grade snapshot derivation from the loaded spec tree.
component: surface_projector
methods:
  - name: projectOwnSurface
    description: >-
      Project the own tree's L0 gateway entries at or below the audience ceiling into a
      self-contained contract-grade snapshot (full L3 contracts, dispatch tables, transitive type
      closure, StateId provenance).
    signature: 'projectOwnSurface(maxAudience: string): SurfaceSnapshot'
    returns: SurfaceSnapshot
    params:
      - name: maxAudience
        type: string
  - name: projectChildSurface
    description: >-
      Project the parent surface a chained child may see: the family ceiling (a chained child is
      part of the system family, so project-audience entries are included).
    signature: 'projectChildSurface(childSubsystemId: string): SurfaceSnapshot'
    returns: SurfaceSnapshot
    params:
      - name: childSubsystemId
        type: string
  - name: projectSubsystemSurface
    description: >-
      Project ONE subsystem's published surface — its L1 publicInterfaces realized by its inbound
      Portal, with full L3 contracts, dispatch tables, and the transitive type closure — into a
      self-contained contract-grade snapshot at the family ('project') audience ceiling. This is the
      SIBLING view a chained child receives: siblings expose exactly what they publish (their
      Portal), nothing wider. The snapshot's projectName is keyed '<systemName>::<subsystemId>' so
      sibling surfaces never collide with the parent family surface or foreign imports, and carries
      the parent tree's StateId provenance.
    signature: 'projectSubsystemSurface(subsystemId: string): SurfaceSnapshot'
    returns: SurfaceSnapshot
    params:
      - name: subsystemId
        type: string
status: complete
createdAt: '2026-07-10T23:13:52.676Z'
updatedAt: '2026-07-24T17:53:43.805Z'
