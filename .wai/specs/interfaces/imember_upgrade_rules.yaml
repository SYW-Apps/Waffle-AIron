id: imember_upgrade_rules
name: Member Upgrade Rules Interface
description: >-
  Pure, deterministic rules of the member upgrade over supplied values: the grant set that keeps a
  member's reach, the no-widening comparison, and the token narrowing rewrite.
component: member_upgrade_rules
methods:
  - name: grants
    description: >-
      The grant set that makes resolution over the member's own record equal resolution over its
      family root's record: the family root's placements (same units, roles and stored order,
      projectId = the member), every assignment at (project, familyRootId) re-scoped to (project,
      memberId) with its value unchanged ('no' and 'approval' included), and every user's role
      binding anchored at (project, familyRootId) re-anchored at (project, memberId). Nothing
      anchored at a unit or the instance is copied. Deterministic.
    signature: >-
      grants(world: PermissionWorld, users: HostedUserRecord[], familyRootId: string, memberId:
      string): MemberGrantSet
    returns: MemberGrantSet
    params:
      - name: world
        type: PermissionWorld
        description: The world as stored
      - name: users
        type: HostedUserRecord[]
        description: Every user and service record, the holders of role bindings
      - name: familyRootId
        type: string
      - name: memberId
        type: string
  - name: compare
    description: >-
      The no-widening proof for one member: for every subject (each user record as its permission
      subject — its id, its diverged subject id as alias, its role bindings — plus one subject with
      no settings of its own, standing for everyone else) and every capability, resolve over
      (project, familyRootId) in the stored world and over (project, memberId) in the world with the
      grant set applied (its placements, assignments and role bindings added), and answer each pair.
      Equal everywhere is the property no-widening; the caller refuses the plan on any unequal row.
    signature: >-
      compare(world: PermissionWorld, users: HostedUserRecord[], grants: MemberGrantSet):
      ReachComparison[]
    returns: ReachComparison[]
    params:
      - name: world
        type: PermissionWorld
      - name: users
        type: HostedUserRecord[]
      - name: grants
        type: MemberGrantSet
        description: The grant set from grants, naming the member and its family root
  - name: narrowing
    description: >-
      Rewrite one API key's narrowing to hosted record ids so the key reaches exactly the trees it
      reached: a member-qualified entry becomes that member's record id plus the record ids of every
      member below it (it covered their qualifiers); a family-root entry gains every member record
      id of its family (it reached them through qualified selectors); '*' and entries naming no
      family are kept; duplicates collapse, order kept. Answers null when nothing changes, otherwise
      the rewrite and the documented widening (record-level tools on the member's own record, within
      the member only).
    signature: 'narrowing(key: ApiKeyRecord, members: PlannedMemberRecord[]): PlannedNarrowing | null'
    returns: PlannedNarrowing | null
    params:
      - name: key
        type: ApiKeyRecord
      - name: members
        type: PlannedMemberRecord[]
        description: Every planned member, with its qualifier and family root
status: design
