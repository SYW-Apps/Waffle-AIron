id: icli_authoring_adapter
name: CLI Authoring Client Adapter Interface
description: >-
  Client adapter contract for the CLI's authored spec writes, reached through the authoring portal
  instead of the spec store.
component: cli_authoring_adapter
methods:
  - name: writeSpec
    description: >-
      Forward a command's whole-spec restatement to the authoring portal: the seam applies it to the
      stored spec, judges it and writes it — refusing a subsystem that names a projectPath (members
      are declared in project.yaml) — and answers with the write receipt.
    signature: 'writeSpec(restatement: SpecRestatement): SpecWriteReceipt'
    returns: SpecWriteReceipt
    params:
      - name: restatement
        type: SpecRestatement
        description: The spec as the command states it, with the fields the command can express
  - name: updateSpecGated
    description: >-
      Forward a delta to the authoring portal: the seam merges it into the stored spec, judges the
      merged spec and writes it, or — with dryRun — runs the whole write, gate included, and writes
      nothing. Answers with the change report. Used by `doctor --fix` to add the chaining
      migration's L0 re-export entries.
    signature: >-
      updateSpecGated(kind: string, id: string, delta: SpecDelta, dryRun?: boolean):
      SpecChangeReport
    returns: SpecChangeReport
    params:
      - name: kind
        type: string
        description: system, subsystem, component, interface, implementation or type
      - name: id
        type: string
        description: The stored spec's id
      - name: delta
        type: SpecDelta
        description: The partial change to merge
      - name: dryRun
        type: boolean
        description: Answer with what the delta would do and write nothing
        optional: true
status: complete
