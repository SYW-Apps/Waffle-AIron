id: iadmin_orchestrator
name: Admin Orchestrator Interface
description: >-
  Contract for the control-plane workflows behind the admin portal: authenticate a bootstrap/admin
  (master) credential and, only for an admin principal, perform the requested project, API-key,
  lock, promote, diagram, producer, secret, or git action.
component: admin_orchestrator
methods:
  - name: createProject
    description: >-
      Authenticate the caller (bootstrap master or a user token). Validate the REQUIRED target
      unitId (every project is placed at creation so the permission resolver can always enumerate it
      — a fresh instance must create its first organization unit before creating projects; wairon
      dev provisions a synthetic local unit at boot). Resolve the caller's project:create permission
      over the target unit via the authorization seam (must be yes; an approval-valued caller must
      use the execute-primary project-lifecycle path). Allocate the project, bootstrap its isolated
      spec tree, and place it in the target unit.
    signature: 'createProject(credential: string, id: string, unitId: string): HostedProjectRecord'
    returns: HostedProjectRecord
    params:
      - name: credential
        type: string
      - name: id
        type: string
      - name: unitId
        type: string
        description: >-
          REQUIRED target organization unit that owns the new project; the caller's project:create
          permission is resolved over it and the project is auto-placed there.
  - name: destroyProject
    description: >-
      Authenticate the caller (bootstrap master or a user token), resolve the caller's project:admin
      permission over the target project via the authorization seam (must be yes; an instance-admin
      permits any), and deregister the project and its tree.
    signature: 'destroyProject(credential: string, id: string): void'
    returns: void
  - name: listProjects
    description: Authenticate and list hosted projects.
    signature: 'listProjects(credential: string): HostedProjectRecord[]'
    returns: HostedProjectRecord[]
  - name: mintKey
    description: >-
      Authenticate the master credential and mint a project-scoped API key. REFUSES any request that
      would produce an instance-wide super-admin credential: the legacy role 'admin' and the '*'
      project wildcard are instance-wide and both are rejected — only project-scoped,
      non-super-admin keys are mintable. The env-anchored built-in admin account (the
      WAIRON_ADMIN_TOKEN master credential and the WAIRON_ADMIN_USER web login) is the only
      instance-wide super-admin; those principals are not minted keys and their authentication paths
      are unaffected.
    signature: 'mintKey(credential: string, project: string, role: string): string'
    returns: string
  - name: revokeKey
    description: Authenticate and revoke an API key.
    signature: 'revokeKey(credential: string, id: string): void'
    returns: void
  - name: listKeys
    description: Authenticate and list a project's API keys.
    signature: 'listKeys(credential: string, project: string): ApiKeyRecord[]'
    returns: ApiKeyRecord[]
  - name: lockProject
    description: >-
      Authenticate the caller (bootstrap master or a user token), resolve the caller's project:write
      permission over the target project via the authorization seam (must be yes), bind the project
      scope, validate-as-complete, and on success promote statuses and write the StateId-scoped lock
      record.
    signature: 'lockProject(credential: string, project: string): LockRecord'
    returns: LockRecord
  - name: promoteProject
    description: >-
      Authenticate the caller (bootstrap master or a user token), resolve the caller's project:write
      permission over the target project via the authorization seam (must be yes), bind scope, read
      the lock, re-check the current StateId, and mark ready-for-promotion only when it still
      matches; reject stale locks.
    signature: 'promoteProject(credential: string, project: string): PromoteResult'
    returns: PromoteResult
  - name: generateDiagram
    description: Authenticate, bind the project scope, and return the rendered diagram artifact for the format.
    signature: 'generateDiagram(credential: string, project: string, format: string): string'
    returns: string
  - name: downloadDiagram
    description: Authenticate and return the diagram artifact for download (attachment).
    signature: 'downloadDiagram(credential: string, project: string, format: string): string'
    returns: string
  - name: diagramViewLink
    description: Authenticate and mint a short-lived signed link to view the project's canvas in a browser.
    signature: 'diagramViewLink(credential: string, project: string): string'
    returns: string
  - name: enableGit
    description: >-
      Authenticate, ensure the project exists, and enable git backing (clone the remote into it on
      an isolated working branch).
    signature: >-
      enableGit(credential: string, project: string, remote: string, branch: string):
      HostedProjectRecord
    returns: HostedProjectRecord
  - name: disableGit
    description: Authenticate and disable git backing for the project.
    signature: 'disableGit(credential: string, project: string): void'
    returns: void
  - name: syncGit
    description: Authenticate and sync the project's default branch into its working branch.
    signature: 'syncGit(credential: string, project: string): void'
    returns: void
  - name: configureProducer
    description: Authenticate and configure a producer target for a project.
    signature: >-
      configureProducer(credential: string, project: string, target: string, parentPageId: string):
      void
    returns: void
  - name: produceProducer
    description: Authenticate, mint a signed canvas link, and project the project to the target.
    signature: 'produceProducer(credential: string, project: string, target: string): void'
    returns: void
  - name: removeProducer
    description: Authenticate and remove a producer target.
    signature: 'removeProducer(credential: string, project: string, target: string): void'
    returns: void
  - name: listProducers
    description: Authenticate and list a project's configured producers.
    signature: 'listProducers(credential: string, project: string): ProducerConfig[]'
    returns: ProducerConfig[]
  - name: setSecret
    description: Authenticate and set an integration secret at runtime (no restart).
    signature: 'setSecret(credential: string, key: string, value: string): void'
    returns: void
  - name: listSecrets
    description: Authenticate and list configured secret keys (names only).
    signature: 'listSecrets(credential: string): string[]'
    returns: string[]
  - name: executeApprovedCreate
    description: >-
      Pre-authorized entry for the approval workflow: performs the same privileged action as
      createProject but WITHOUT credential authentication — the caller
      (project_lifecycle_orchestrator) has already enforced permission-based authorization. Creates
      the project and places it in the REQUIRED owner unit. Never exposed on any portal.
    signature: 'executeApprovedCreate(id: string, unitId: string): HostedProjectRecord'
    returns: HostedProjectRecord
    params:
      - name: id
        type: string
      - name: unitId
        type: string
        description: >-
          REQUIRED owner organization unit the new project is placed in (from
          ProjectInitRequest.ownerUnitId).
  - name: executeApprovedLock
    description: >-
      Pre-authorized entry for the approval workflow: performs the same privileged action as
      lockProject but WITHOUT credential authentication — the caller
      (project_lifecycle_orchestrator) has already enforced permission-based authorization. Never
      exposed on any portal.
    signature: 'executeApprovedLock(projectId: string): LockRecord'
    returns: LockRecord
    params:
      - name: projectId
        type: string
  - name: executeApprovedPromote
    description: >-
      Pre-authorized entry for the approval workflow: performs the same privileged action as
      promoteProject but WITHOUT credential authentication — the caller
      (project_lifecycle_orchestrator) has already enforced permission-based authorization. Never
      exposed on any portal.
    signature: 'executeApprovedPromote(projectId: string): PromoteResult'
    returns: PromoteResult
    params:
      - name: projectId
        type: string
status: complete
