id: iadmin_orchestrator
name: Admin Orchestrator Interface
description: >-
  Contract for the control-plane workflows behind the admin portal: authenticate a bootstrap/admin
  (master) credential and, only for an admin principal, perform the requested project, API-key,
  lock, promote, diagram, producer, secret, or git action.
component: admin_orchestrator
methods:
  - name: createProject
    description: >-
      Authenticate the caller (bootstrap master or a user token). Validate the REQUIRED target
      unitId (every project is placed at creation so the permission resolver can always enumerate it
      — a fresh instance must create its first organization unit before creating projects; wairon
      dev provisions a synthetic local unit at boot). Resolve the caller's project:create permission
      over the target unit via the authorization seam (must be yes; an approval-valued caller must
      use the execute-primary project-lifecycle path). Allocate the project, bootstrap its isolated
      spec tree, and place it in the target unit.
    signature: 'createProject(credential: string, id: string, unitId: string): HostedProjectRecord'
    returns: HostedProjectRecord
    params:
      - name: credential
        type: string
      - name: id
        type: string
      - name: unitId
        type: string
        description: >-
          REQUIRED target organization unit that owns the new project; the caller's project:create
          permission is resolved over it and the project is auto-placed there.
  - name: destroyProject
    description: >-
      Authenticate the caller (bootstrap master or a user token), resolve the caller's project:admin
      permission over the target project via the authorization seam (must be yes; an instance-admin
      permits any), and deregister the project and its tree.
    signature: 'destroyProject(credential: string, id: string): void'
    returns: void
  - name: listProjects
    description: Authenticate and list hosted projects.
    signature: 'listProjects(credential: string): HostedProjectRecord[]'
    returns: HostedProjectRecord[]
  - name: mintKey
    description: >-
      Authenticate the master credential and mint a project-scoped API key. REFUSES any request that
      would produce an instance-wide super-admin credential: the legacy role 'admin' and the '*'
      project wildcard are instance-wide and both are rejected — only project-scoped,
      non-super-admin keys are mintable. The env-anchored built-in admin account (the
      WAIRON_ADMIN_TOKEN master credential and the WAIRON_ADMIN_USER web login) is the only
      instance-wide super-admin; those principals are not minted keys and their authentication paths
      are unaffected.
    signature: 'mintKey(credential: string, project: string, role: string): string'
    returns: string
  - name: revokeKey
    description: Authenticate and revoke an API key.
    signature: 'revokeKey(credential: string, id: string): void'
    returns: void
  - name: listKeys
    description: Authenticate and list a project's API keys.
    signature: 'listKeys(credential: string, project: string): ApiKeyRecord[]'
    returns: ApiKeyRecord[]
  - name: lockProject
    description: >-
      Authenticate the caller (bootstrap master or a user token), resolve the caller's project:write
      permission over the target project via the authorization seam (must be yes), bind the project
      scope, validate-as-complete, and on success promote statuses and write the StateId-scoped lock
      record.
    signature: 'lockProject(credential: string, project: string): LockRecord'
    returns: LockRecord
  - name: generateDiagram
    description: Authenticate, bind the project scope, and return the rendered diagram artifact for the format.
    signature: 'generateDiagram(credential: string, project: string, format: string): string'
    returns: string
  - name: downloadDiagram
    description: Authenticate and return the diagram artifact for download (attachment).
    signature: 'downloadDiagram(credential: string, project: string, format: string): string'
    returns: string
  - name: diagramViewLink
    description: Authenticate and mint a short-lived signed link to view the project's canvas in a browser.
    signature: 'diagramViewLink(credential: string, project: string): string'
    returns: string
  - name: enableGit
    description: >-
      Authenticate, require project:admin over the project, ensure it exists, and bind it to its
      REAL repository (clone the remote into it on an isolated working branch). Wairon manages ONLY
      the .wai/ tree inside the repo — commits are .wai/-scoped, so the repository can be shared
      with the project's own codebase.
    signature: >-
      enableGit(credential: string, project: string, remote: string, branch: string):
      HostedProjectRecord
    returns: HostedProjectRecord
    params:
      - name: credential
        type: string
      - name: project
        type: string
      - name: remote
        type: string
      - name: branch
        type: string
  - name: disableGit
    description: >-
      Authenticate, require project:admin over the project, and disable its git backing (the
      repository binding; the working tree is untouched).
    signature: 'disableGit(credential: string, project: string): void'
    returns: void
    params:
      - name: credential
        type: string
      - name: project
        type: string
  - name: syncGit
    description: >-
      Authenticate, require project:write over the project, and sync the project's default branch
      into its working branch.
    signature: 'syncGit(credential: string, project: string): void'
    returns: void
    params:
      - name: credential
        type: string
      - name: project
        type: string
  - name: configureProducer
    description: >-
      Authenticate, require project:admin over the project, and configure a producer target for it
      (tokens come from the secret store by ref, never inline).
    signature: >-
      configureProducer(credential: string, project: string, target: string, parentPageId: string):
      void
    returns: void
    params:
      - name: credential
        type: string
      - name: project
        type: string
      - name: target
        type: string
      - name: parentPageId
        type: string
  - name: produceProducer
    description: >-
      Authenticate, require project:admin over the project, mint a signed canvas link, and project
      the project to the target.
    signature: 'produceProducer(credential: string, project: string, target: string): void'
    returns: void
    params:
      - name: credential
        type: string
      - name: project
        type: string
      - name: target
        type: string
  - name: removeProducer
    description: Authenticate, require project:admin over the project, and remove a producer target.
    signature: 'removeProducer(credential: string, project: string, target: string): void'
    returns: void
    params:
      - name: credential
        type: string
      - name: project
        type: string
      - name: target
        type: string
  - name: listProducers
    description: Authenticate, require project:admin over the project, and list its configured producers.
    signature: 'listProducers(credential: string, project: string): ProducerConfig[]'
    returns: ProducerConfig[]
    params:
      - name: credential
        type: string
      - name: project
        type: string
  - name: setSecret
    description: Authenticate and set an integration secret at runtime (no restart).
    signature: 'setSecret(credential: string, key: string, value: string): void'
    returns: void
  - name: listSecrets
    description: Authenticate and list configured secret keys (names only).
    signature: 'listSecrets(credential: string): string[]'
    returns: string[]
  - name: executeApprovedCreate
    description: >-
      Pre-authorized entry for the approval workflow: performs the same privileged action as
      createProject but WITHOUT credential authentication — the caller
      (project_lifecycle_orchestrator) has already enforced permission-based authorization. Creates
      the project and places it in the REQUIRED owner unit. Never exposed on any portal.
    signature: 'executeApprovedCreate(id: string, unitId: string): HostedProjectRecord'
    returns: HostedProjectRecord
    params:
      - name: id
        type: string
      - name: unitId
        type: string
        description: >-
          REQUIRED owner organization unit the new project is placed in (from
          ProjectInitRequest.ownerUnitId).
  - name: executeApprovedLock
    description: >-
      Pre-authorized entry for the approval workflow: performs the same privileged action as
      lockProject but WITHOUT credential authentication — the caller
      (project_lifecycle_orchestrator) has already enforced permission-based authorization. Never
      exposed on any portal. An optional subproject qualifier binds the CHAINED CHILD's tree instead
      of the project's own, resolved through the project registry's containment-checked qualified
      resolution (the same seam the data plane binds through, so a qualifier can never resolve
      outside the project root). Because the git binding is read from the BOUND root, a
      subproject-scoped lock finds no repository binding there and therefore performs no sync and no
      publish: the child is not the git unit. The frozen child tree persists in the project's
      working tree, but note it is NOT staged by the project's own .wai/-scoped commit either — a
      chained child lives outside that pathspec — so reaching a remote requires a commit whose scope
      covers the child's path.
    signature: 'executeApprovedLock(projectId: string, subproject?: string): LockRecord'
    returns: LockRecord
    params:
      - name: projectId
        type: string
      - name: subproject
        type: string
        description: >-
          Chained-subsystem mount chain to bind instead of the project root; absent binds the
          project's own tree.
        optional: true
  - name: commitProject
    description: >-
      Authenticate, require project:write over the project, and publish a DELIBERATE, SCOPED backup:
      stage ONLY .wai/ (or the finer .wai/specs/<subsystem>/ subpath when given), commit, and push —
      commit is the local save, push is the actual backup; both happen. Never `git add -A`: a shared
      real repository's own code is never staged. CAVEAT: a subsystem-scoped commit is a staging
      convenience only — git history is per-repo, so the log still interleaves all commits; the
      project is the clean unit. A no-op when nothing under the scoped path changed. Returns the
      publish outcome (commit id or clean).
    signature: >-
      commitProject(credential: string, project: string, subsystem: string, message: string):
      GitPublish
    returns: GitPublish
    params:
      - name: credential
        type: string
      - name: project
        type: string
      - name: subsystem
        type: string
        optional: true
      - name: message
        type: string
        optional: true
  - name: getGitBinding
    description: >-
      Authenticate, require project:admin over the project, and return its git-backing status:
      whether a repository is bound, the remote/branch, the periodic-sync setting, and whether the
      .wai/ tree is dirty (unpublished changes). A read; not audited.
    signature: 'getGitBinding(credential: string, project: string): GitBackingStatus'
    returns: GitBackingStatus
    params:
      - name: credential
        type: string
      - name: project
        type: string
  - name: runPeriodicGitSync
    description: >-
      Pre-authorized internal entry for the host supervisor's periodic backup timer — performs NO
      authentication and is never exposed on any portal. Iterates the git-bound projects whose
      binding enables periodic sync, and for each publishes a .wai/-scoped commit+push, skipping
      clean projects (skip-if-clean) so a quiet project never commits noise. Failures are recorded
      per project and never abort the sweep.
    signature: 'runPeriodicGitSync(): void'
    returns: void
    params: []
  - name: configureGitSync
    description: >-
      Authenticate, require project:admin over the project, and persist its periodic-sync setting
      (interval minutes + skip-if-clean; an absent interval disables periodic sync). Configuring the
      backup cadence is repository-binding administration, distinct from the project:write commit
      itself.
    signature: >-
      configureGitSync(credential: string, project: string, periodicSyncMinutes: number,
      skipIfClean: boolean): void
    returns: void
    params:
      - name: credential
        type: string
      - name: project
        type: string
      - name: periodicSyncMinutes
        type: number
        optional: true
      - name: skipIfClean
        type: boolean
        optional: true
status: complete
