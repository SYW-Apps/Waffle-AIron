id: iupgrade_core_adapter
name: Upgrade Core Adapter Contract
description: >-
  The sdd_core rewrites the v5 to v6 step reaches until their bodies move into it, each bound to the
  root the caller bound. Every method forwards.
component: upgrade_core_adapter
methods:
  - name: findLegacySpecFiles
    description: The spec files still under their pre-dotted names.
    signatureFrom: spec_maintenance_portal.findLegacySpecFiles
  - name: computeApprovalId
    description: >-
      The approval identity (own design plus own policy) the bound tree is approved under now, with
      its five parts: what a carried approval records
    signatureFrom: validator_portal.computeApprovalId
    previousNames:
      - iupgrade_core_adapter.computeGateStateId
  - name: writeLockRecord
    description: Write the format-4 lock record the v6-to-v7 step assembled onto the bound (rehearsal) root
    signatureFrom: approval_portal.writeLockRecord
  - name: projectFamily
    description: >-
      Forward to spec_tree_portal.projectFamily: the project graph under the bound root, from which
      the step lists the family's project roots (v6 and v7 spec forms are the same)
    signatureFrom: spec_tree_portal.projectFamily
    effect: read
  - name: getLoaderIssues
    description: >-
      Forward to spec_tree_portal.getLoaderIssues: the loader's diagnostics for the bound tree,
      where a retired wairon 5 form shows
    signatureFrom: spec_tree_portal.getLoaderIssues
    effect: read
  - name: captureApprovedSpecs
    description: >-
      Forward to approval_portal.captureApprovedSpecs: one design digest per own spec of the bound
      tree, what a v6 record's digests are compared with
    signatureFrom: approval_portal.captureApprovedSpecs
    effect: read
  - name: resolvedPacks
    description: >-
      Forward to validator_portal.resolvedPacks: the selected packs as they resolve now, recorded in
      the new inputs lock
    signature: 'resolvedPacks(): map<string, LockedPack>'
    returns: map<string, LockedPack>
    params: []
    effect: read
  - name: loadProjectConfig
    description: >-
      Forward to project_config_portal.loadProjectConfig: the bound project's configuration, whose
      external declarations tell a path producer (read live in v7, its v6 pin dropped) from a hosted
      or git one
    signatureFrom: project_config_portal.loadProjectConfig
    effect: read
  - name: validateProject
    description: >-
      Validate the project at the bound root (during an upgrade, a rehearsal copy) with the running
      major's rules: what the upgrade plan foretells.
    signatureFrom: validator_portal.validateProject
    effect: read
  - name: listRules
    description: >-
      The rules the validator runs, so the plan can set aside those that judge code, which a
      rehearsal copy without code cannot judge.
    signatureFrom: validator_portal.listRules
    effect: none
  - name: resolveExternals
    description: >-
      Forward to spec_tree_portal.resolveExternals: the bound project's declared externals each
      bound to its producer, a declaration with no source bound through the family it climbs to — so
      the v6-to-v7 step finds the family project a bare external names, and where it is on disk.
    signatureFrom: spec_tree_portal.resolveExternals
  - name: removeExternal
    description: >-
      Forward to project_config_portal.removeExternal: take one external declaration out of the
      bound (rehearsal) root's configuration, the first half of restating it with a source.
    signatureFrom: project_config_portal.removeExternal
  - name: declareExternal
    description: >-
      Forward to project_config_portal.declareExternal: write one external declaration back into the
      bound (rehearsal) root's configuration, now naming its source.
    signatureFrom: project_config_portal.declareExternal
status: draft
createdAt: '2026-10-18T13:06:25.595Z'
updatedAt: '2026-11-27T22:43:49.014Z'
