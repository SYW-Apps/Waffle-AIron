id: iapproval_store
name: Approval Store Interface
description: >-
  Private store contract for redacted hosted approval requests: read-through file I/O over
  approvals.json. Every read parses the file fresh; there is no bare write - every change is an
  update that reads the set and persists the replacement under the file's write lock, so a writer in
  another process is never lost.
component: approval_store
methods:
  - name: load
    description: >-
      Read the persisted approval-request set fresh from approvals.json under the server data root
      (no in-memory copy). A missing file yields an empty set; an unreadable file or structurally
      invalid JSON fails with a storage error naming the path.
    signature: 'load(): list<ApprovalRequest>'
    returns: list<ApprovalRequest>
    params: []
  - name: update
    description: >-
      Read the approval-request set fresh and persist what the change makes of it, holding
      approvals.json's write lock (file_write_lock) across both, so a writer in another process that
      reads and writes the same file in between is never lost; a change that throws writes nothing;
      a file that exists but cannot be read or parsed throws, so a change is never applied to a set
      read as empty. Answers the set written.
    signature: 'update(change: (requests: ApprovalRequest[]) => ApprovalRequest[]): ApprovalRequest[]'
    returns: list<ApprovalRequest>
    effect: write
lint:
  allow:
    - code: UNUSED_METHOD
      at: load
      reason: >-
        The read-through store's hydration is called by the repository FACADE, not by a member:
        every exported facade function in src/server/approvals.ts constructs the store, calls
        load(), and only then forwards to the registry or index. A Repository facade narrative is
        held to a single call step (FACADE_FORWARDING), so that hydration call has nowhere to live
        in the model and load has no modelled caller. Modelling the hydration as a facade method of
        its own that forwards to the read-back (or letting the facade doctrine carry a
        hydrate-then-forward pair) is the decision owed; declaring a call from the registry or index
        would be declaring one the code does not make.
status: complete
