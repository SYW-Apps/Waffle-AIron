id: iapproval_store
name: Approval Store Interface
description: Private store contract for redacted hosted approval requests.
component: approval_store
methods:
  - name: load
    description: Load persisted approval requests into the authoritative store representation.
    signature: 'load(): ApprovalRequest[]'
    returns: ApprovalRequest[]
    params: []
  - name: replaceAll
    description: >-
      Replace the store contents with the supplied complete approval-request set after persistence
      has succeeded.
    signature: 'replaceAll(requests: ApprovalRequest[]): void'
    returns: void
    params:
      - name: requests
        type: ApprovalRequest[]
lint:
  allow:
    - code: UNUSED_METHOD
      at: load
      reason: >-
        The read-through store's hydration is called by the repository FACADE, not by a member:
        every exported facade function in src/server/approvals.ts constructs the store, calls
        load(), and only then forwards to the registry or index. A Repository facade narrative is
        held to a single call step (FACADE_FORWARDING), so that hydration call has nowhere to live
        in the model and load has no modelled caller. The shape that fixes it already exists in this
        tree — surface_repository.hydrate forwards to surface_registry.hydrateFromFiles — and this
        family predates it. Modelling the hydration that way (or letting the facade doctrine carry a
        hydrate-then-forward pair) is the decision owed; declaring a call from the registry or index
        would be declaring one the code does not make.
status: complete
