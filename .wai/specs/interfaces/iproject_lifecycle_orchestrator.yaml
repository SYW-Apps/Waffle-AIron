id: iproject_lifecycle_orchestrator
name: Project Lifecycle Orchestrator Interface
description: >-
  Project lifecycle contract for initialize/lock requested over MCP, CLI, or UI. Execute-primary:
  every method authenticates the caller credential and resolves the caller's permission — yes
  executes the action directly and returns its natural result, approval creates a pending
  ApprovalRequest (the security exception), no raises Forbidden. Approved requests auto-execute on
  decision.
component: project_lifecycle_orchestrator
methods:
  - name: initializeProject
    description: >-
      Execute-primary project initialization. Authenticate the caller, validate the
      ProjectInitRequest structurally, evaluate it against the active instance pack policy
      (enforce-mode violations reject immediately; warn-mode findings ride the summary), then
      resolve the caller's project:create permission over the required owner unit: yes -> initialize
      the project directly via the policy orchestrator's pre-authorized executeApprovedInit and
      return a completed ProjectActionOutcome; approval -> create a pending project:init
      ApprovalRequest and return a pending-approval outcome; no -> Forbidden.
    signature: 'initializeProject(credential: string, request: ProjectInitRequest): ProjectActionOutcome'
    returns: ProjectActionOutcome
    params:
      - name: credential
        type: string
      - name: request
        type: ProjectInitRequest
    guarantees:
      - atomic
  - name: lockProject
    description: >-
      Project lock - the project's approval, so it is decided by approval:decide over the project's
      OWN record, never by the right to edit it. Authenticate the caller and resolve their
      approval:decide permission over the project: yes -> lock directly via the admin plane's
      pre-authorized executeApprovedLock, the caller recorded as the approver, and return a
      completed ProjectActionOutcome carrying the lock record. Otherwise resolve their project:write
      permission over the project: a caller who may write it at the project rung (yes or approval -
      a subsystem's yes never reaches a whole-tree action), or whose approval:decide resolves to
      approval, creates a pending project:lock ApprovalRequest that someone else holding
      approval:decide decides, and gets a pending-approval outcome; anyone else -> Forbidden. A lock
      signs the whole tree, so a request is refused - naming each subsystem and the rung that
      decided it - when a subsystem rule denies the caller write on any subsystem of the project. A
      request is also refused while the tree has validation errors: it is validated the way the
      approved lock would validate it, and the refusal names the error count and each error's code;
      warnings do not block, as at the local `wairon lock`, and no pending request is created. A
      member is a record of its own, so locking a member is locking its record.
    signature: 'lockProject(credential: string, projectId: string): ProjectActionOutcome'
    returns: ProjectActionOutcome
    params:
      - name: credential
        type: string
      - name: projectId
        type: string
    guarantees:
      - atomic
  - name: getApprovalStatus
    description: >-
      Authenticate the caller, lazily expire overdue pending requests, then return one approval
      request visible only to its original requester (matching subject or requesting token id) or to
      a caller whose resolved approval:decide permission over the request's project is yes; never
      exposes unrelated requests.
    signature: 'getApprovalStatus(credential: string, requestId: string): ApprovalRequest'
    returns: ApprovalRequest
    params:
      - name: credential
        type: string
      - name: requestId
        type: string
  - name: listPendingRequests
    description: >-
      Authenticate the caller, gather the permission world, expire overdue pending requests, then
      list pending approval requests the caller may decide: an instance-admin sees all; otherwise a
      request is included only when the caller's resolved approval:decide permission over the
      request's project is yes. Optionally narrowed to one project.
    signature: 'listPendingRequests(credential: string, projectId?: string): list<ApprovalRequest>'
    returns: list<ApprovalRequest>
    params:
      - name: credential
        type: string
      - name: projectId
        type: string
        optional: true
  - name: decideRequest
    description: >-
      Authenticate the caller and resolve their approval:decide permission over the decided
      request's project (must be yes); reject self-approval (decidedBy MUST differ from requestedBy
      - a yes-permission caller executes directly and never enters the approval path, so this guard
      cannot deadlock); record the approve/deny decision, which is refused for a request no longer
      pending (a withdrawn one included); then AUTO-EXECUTE an approved request immediately by
      dispatching by kind to the pre-authorized entrypoints (project:init -> executeApprovedInit;
      project:lock -> the admin plane on the request's record id - a member's own record for a
      member lock - with the request's gateStateId as the expected identity) and mark it completed.
      Audit at security level. A project:lock whose pinned identity no longer matches the tree is
      CANCELLED, with the reason recorded on it ("the design changed since it was requested
      (requested <id>, now <id>); request the lock again"), and the call refuses with that reason.
      Any other failure at execution leaves the approval approved, not completed (retryable via
      executeApprovedRequest).
    signature: 'decideRequest(credential: string, decision: ApprovalDecision): ApprovalRequest'
    returns: ApprovalRequest
    params:
      - name: credential
        type: string
      - name: decision
        type: ApprovalDecision
    guarantees:
      - atomic
  - name: executeApprovedRequest
    description: >-
      Authenticate the caller credential, authorize the original requester or an instance-admin,
      require the request to be approved and unexpired, then dispatch by kind: project:init to the
      policy orchestrator's pre-authorized executeApprovedInit (which enforces pack policy,
      provisions the project via the admin plane, applies required/default packs, and records the
      profile selection), and project:lock to the admin plane's pre-authorized executeApprovedLock
      on the request's record id with its gateStateId, so this retry path confines and pins exactly
      as the auto-execute path does, and cancels the request with the same reason when the tree
      moved after the request; mark the approval completed, and audit the execution at security
      level. Rejects pending, denied, expired, completed, cancelled, or unauthorized requests.
    signature: 'executeApprovedRequest(credential: string, requestId: string): string'
    returns: string
    params:
      - name: credential
        type: string
      - name: requestId
        type: string
  - name: awaitApproval
    description: >-
      Long-poll for a decision so an MCP agent can wait then continue: authenticate the caller (only
      the original requester may await), then block server-side re-reading the request until it
      leaves pending status (approved/denied/completed/expired) or the timeout elapses, and return
      the request in its current state. Pairs with decideRequest's auto-execute so an approved
      request returns already completed.
    signature: >-
      awaitApproval(credential: string, requestId: string, timeoutSeconds: int): async
      ApprovalRequest
    returns: async ApprovalRequest
    params:
      - name: credential
        type: string
      - name: requestId
        type: string
      - name: timeoutSeconds
        type: int
  - name: withdrawRequest
    description: >-
      The requester withdraws their own PENDING approval request. Authenticate the caller, lazily
      expire overdue pending requests, and require the caller to be the request's original requester
      (matching subject or requesting token id) - anyone else is refused, an approver included,
      whose path is decideRequest. The withdrawal is one atomic write in the approval repository
      that moves the request to cancelled only if it is still pending at that moment: one already
      decided, completed, expired or cancelled is refused naming its status, and a decision racing
      the withdrawal either lands first (the withdrawal is refused) or is refused as not pending.
      The cancelled request carries an executionSummary stating it was withdrawn by the requester
      and the optional reason; nothing is executed. A later decideRequest on it is refused, and
      getApprovalStatus shows it as cancelled with that summary. Audit at security level.
    signature: 'withdrawRequest(credential: string, requestId: string, reason?: string): ApprovalRequest'
    returns: ApprovalRequest
    params:
      - name: credential
        type: string
      - name: requestId
        type: string
      - name: reason
        type: string
        description: Why the requester withdraws it, recorded on the cancelled request
        optional: true
    guarantees:
      - atomic
status: complete
