id: iskills_core_adapter
name: Skills Core Adapter Interface
description: Loads the governing extension packs for the skills subsystem via the core portal.
component: skills_core_adapter
methods:
  - name: loadProjectExtensions
    description: >-
      Load and merge the governing extension packs via the core portal, returning the
      LoadedExtensions whose skills the exporter and skill_resources consume.
    signature: 'loadProjectExtensions(): LoadedExtensions'
    returns: LoadedExtensions
    params: []
  - name: loadProjectConfig
    description: >-
      The bound project's configuration, or null when it has none. Forwarded to the core portal;
      skills export reads its targets and the server instructions read its projectType.
    signature: 'loadProjectConfig(): ProjectConfig?'
    returns: ProjectConfig?
    params: []
    guarantees:
      - idempotent
status: complete
createdAt: '2026-07-14T20:14:02.590Z'
updatedAt: '2026-10-04T10:19:33.400Z'
