id: iauthoring_portal
name: Authoring Portal Interface
description: >-
  The published spec writes, shared by every access path: every write an author makes — a whole spec
  restated, a delta, a method move, a delete — enters here, and only mechanical writes (status
  promotion at lock, layout normalization, migrations, doctor repairs, renames, subproject
  relocation) stay on sdd_core. A write that violates an intrinsic rule throws with the rule codes
  and nothing reaches disk, so the remedy is to fix the arguments and call again rather than to
  repair a saved spec. A write that changes nothing writes nothing and says so.
component: authoring_portal
methods:
  - name: updateSpecGated
    description: >-
      Patch an existing spec at any level through the same gate. An update can introduce a misplaced
      field as easily as a create can, and unlike a create it can change the componentType out from
      under fields that were legal before. Answers with the change report: exactly what changed,
      which of the delta's paths changed nothing, or that nothing did and nothing was written. A dry
      run runs the whole write, gate included, and answers with the report it would have produced
      without touching disk. Routed to the gated workflow.
    signature: >-
      updateSpecGated(kind: string, id: string, delta: SpecDelta, dryRun?: boolean):
      SpecChangeReport
    returns: SpecChangeReport
    params:
      - name: kind
        type: string
        description: system, subsystem, component, interface, implementation or type
      - name: id
        type: string
        description: The stored spec's id
      - name: delta
        type: SpecDelta
        description: The partial change to merge, carrying the delta's own verbs
      - name: dryRun
        type: boolean
        description: >-
          Answer with what the delta would do and write nothing; the report carries dryRun true and
          written false
        optional: true
  - name: moveMethods
    description: >-
      Move methods between components through the gate, as one all-or-nothing write. Answers with
      what moved, every reference re-pointed to follow it, and on a refusal the rule that fired plus
      the cheapest legal home. A partial move is the failure worth preventing here: it leaves
      callers pointing at a method that is no longer where they say it is. Routed to the gated
      workflow.
    signature: 'moveMethods(from: string, to: string, methods: string[], dryRun?: boolean): MethodMoveReport'
    returns: MethodMoveReport
    params:
      - name: from
        type: string
        description: The component id the methods currently belong to
      - name: to
        type: string
        description: The component id that should receive them
      - name: methods
        type: string[]
        description: The method names to move
      - name: dryRun
        type: boolean
        description: Answer with what the move would do and write nothing
        optional: true
  - name: writeSpec
    description: >-
      Write a whole spec as a create tool states it, at any level, through the gate. On an existing
      id it re-authors in place: what the input expresses is replaced, what it cannot express is
      carried and named, what an omission cleared and a restatement removed is named, and the stored
      status is never lowered. Answers with the write receipt, carrying the tests a changed or
      removed method invalidated. Routed to the gated workflow.
    signature: 'writeSpec(restatement: SpecRestatement): SpecWriteReceipt'
    returns: SpecWriteReceipt
    params:
      - name: restatement
        type: SpecRestatement
        description: The spec as stated, with the fields its caller's input can express
  - name: deleteSpec
    description: >-
      Delete one spec of the named kind, answering with whether anything was removed and the tests
      that encode a method the deletion took away. Routed to the gated workflow.
    signature: 'deleteSpec(kind: string, id: string): SpecDeletion'
    returns: SpecDeletion
    params:
      - name: kind
        type: string
        description: subsystem, component, interface, implementation or type
      - name: id
        type: string
        description: The spec id
status: complete
