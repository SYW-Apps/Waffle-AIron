id: iauthoring_portal
name: Authoring Portal Interface
description: >-
  The published gated writes, shared by every access path. A write that violates an intrinsic rule
  throws with the rule codes and nothing reaches disk, so the remedy is to fix the arguments and
  call again rather than to repair a saved spec. A write that changes nothing writes nothing and
  says so.
component: authoring_portal
methods:
  - name: addComponent
    description: >-
      Author a NEW L2 component through the gate: the candidate is judged against the intrinsic
      rules with the project's own severities and refused on an error before anything touches disk,
      and otherwise persisted. Answers with the candidate's warnings as notices, followed by the
      store's placement notices. Routed to the gated workflow.
    signature: 'addComponent(candidate: ComponentSpec): string[]'
    returns: string[]
    params:
      - name: candidate
        type: ComponentSpec
        description: The component as the caller authored it
  - name: updateSpecGated
    description: >-
      Patch an existing spec at any level through the same gate. An update can introduce a misplaced
      field as easily as a create can, and unlike a create it can change the componentType out from
      under fields that were legal before. Answers with the change report: exactly what changed, or
      that nothing did and nothing was written. Routed to the gated workflow.
    signature: 'updateSpecGated(kind: string, id: string, delta: SpecDelta): SpecChangeReport'
    returns: SpecChangeReport
    params:
      - name: kind
        type: string
        description: system, subsystem, component, interface, implementation or type
      - name: id
        type: string
        description: The stored spec's id
      - name: delta
        type: SpecDelta
        description: The partial change to merge, carrying the delta's own verbs
status: complete
