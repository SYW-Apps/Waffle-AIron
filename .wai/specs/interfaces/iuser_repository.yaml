id: iuser_repository
name: User Repository Interface
description: >-
  Facade contract for durable hosted user and service-principal state. External hosted workflows
  depend on this contract instead of the private store, registry, or index.
component: user_repository
methods:
  - name: getById
    description: Return one hosted user by Wairon user id or null when absent.
    signatureFrom: user_index.getById
  - name: findByExternalSubject
    description: Return one hosted user by external issuer subject or null when absent.
    signatureFrom: user_index.findByExternalSubject
  - name: list
    description: >-
      List hosted users for admin UI and audit investigation workflows, optionally narrowed by
      status. There is no project filter: project membership is a permission-grid question the
      identity orchestrator answers.
    signatureFrom: user_index.list
  - name: upsert
    description: Create or update a hosted user through the repository facade.
    signatureFrom: user_registry.upsert
    guarantees:
      - atomic
  - name: setStatus
    description: Set a user's lifecycle status through the repository facade.
    signatureFrom: user_registry.setStatus
    guarantees:
      - atomic
  - name: remapUnitReferences
    description: >-
      Facade: rewrite/clear user home units and role-binding scopes for a unit rename/move/cascade
      through the registry.
    signatureFrom: user_registry.remapUnitReferences
    guarantees:
      - atomic
  - name: findByRecordOrSubjectId
    description: >-
      Resolve one hosted user by record id OR the record's subject userId — an exact record-id match
      wins; null when absent under both.
    signatureFrom: user_index.findByRecordOrSubjectId
status: complete
createdAt: '2026-07-08T20:16:35.931Z'
updatedAt: '2026-10-03T21:11:03.245Z'
