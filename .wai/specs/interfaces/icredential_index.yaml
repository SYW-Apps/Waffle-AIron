id: icredential_index
name: Credential Index Interface
description: >-
  Read-face contract of the credential repository: token-hash lookup and scoped listings, always
  redacted (hashed token only, never plaintext).
component: credential_index
methods:
  - name: findByToken
    description: Find the active credential record matching a token hash (timing-safe comparison), or null.
    signature: 'findByToken(tokenHash: string): ApiKeyRecord | null'
    returns: ApiKeyRecord | null
  - name: list
    description: List the credential records narrowed to one project.
    signature: 'list(project: string): ApiKeyRecord[]'
    returns: ApiKeyRecord[]
  - name: listByOwner
    description: List the credential records owned by one user id.
    signature: 'listByOwner(ownerUserId: string): ApiKeyRecord[]'
    returns: ApiKeyRecord[]
status: complete
createdAt: '2026-07-19T08:58:27.158Z'
updatedAt: '2026-07-19T09:00:45.393Z'
