id: iproject_family_index
name: Project Family Index Interface
description: >-
  Read contract for the project graph: a projection of the scan, memoized with it and dropped with
  it. The lookups — the project that owns a spec, the project a reference lands in, whether one
  project declares another, the loops among projects — are pure methods of the ProjectFamily it
  answers. Nothing here writes, and nothing here judges: problems come back as facts.
component: project_family_index
methods:
  - name: graph
    description: >-
      The whole project graph of the current scan: nodes, owners, cross-project references, every
      reference with `::` as bound, and the family's problems. What the validator hands the rules.
    signature: 'graph(): ProjectFamily'
    returns: ProjectFamily
    params: []
    guarantees:
      - idempotent
  - name: implementedMethods
    description: >-
      The methods of an extension point an implementing contract uses: each method it declares, by
      the name it takes its signature from when that is a method of the implemented export
      (`alias::name.method`), else by its own name. What a pin records a digest for — and what the
      graph counts an `implements` reference by, one cross-project reference per method — so a
      producer renaming or changing a method a consumer implements is a moved use like any call.
    signature: 'implementedMethods(interfaceId: string, implemented: string): list<string>'
    returns: list<string>
    params:
      - name: interfaceId
        type: string
        description: The implementing contract's in-memory key
      - name: implemented
        type: string
        description: The extension point it implements, as written (`alias::name`)
    effect: read
status: complete
