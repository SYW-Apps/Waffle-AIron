id: iproject_family_index
name: Project Family Index Interface
description: >-
  Read contract for the project graph: a projection of the scan, memoized with it and dropped with
  it. The lookups — the project that owns a spec, the project a reference lands in, whether one
  project declares another — are pure methods of the ProjectFamily it answers. Nothing here writes,
  and nothing here judges: identity problems come back as facts.
component: project_family_index
methods:
  - name: graph
    description: >-
      The whole project graph of the current scan: nodes, owners, cross-project references, the
      leading-`::` references authors wrote and identity problems. What the validator hands the
      rules.
    signature: 'graph(): ProjectFamily'
    returns: ProjectFamily
    params: []
    guarantees:
      - idempotent
status: design
createdAt: '2026-09-26T17:41:03.952Z'
updatedAt: '2026-09-26T18:13:27.382Z'
