id: inarrative_graph_projector
name: Narrative Graph Projector Interface
description: >-
  Derives what the L5 narrative graph reaches from a set of seeds, for the wiring rules that need
  reachability.
component: narrative_graph_projector
methods:
  - name: walk
    description: >-
      Breadth-first walk over the narrative graph from the seeds. Call steps and dispatch steps
      (routed through the target Portal's dispatch table) are always followed; every binding of a
      reached Portal's dispatch table and register-step handoffs are followed when the options
      enable them, which they do by default. A reached method with no implementation contributes
      nothing; one whose narrative does not show its calls contributes the ones it DECLARES (its
      `calls` references) and nothing else, so a collaborator the method does not name is not
      reached. Pure: the same context, seeds and options always give the same reach.
    signature: 'walk(ctx: RuleContext, seeds: WalkSeed[], options?: WalkOptions): NarrativeReach'
    returns: NarrativeReach
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model
      - name: seeds
        type: WalkSeed[]
        description: Where the walk starts
      - name: options
        type: WalkOptions
        description: Which optional edges to follow
        optional: true
    guarantees:
      - idempotent
  - name: stepEdges
    description: >-
      Which reachability edges ONE narrative step contributes. A call step, and a register handoff
      when the walk asked for those, name their target directly and contribute one edge each; a
      dispatch step contributes the routed Portal with no method, plus the component that Portal's
      dispatch table binds to the step's capability. Every other step type contributes none. Pure:
      it reads the step, the tree's components and the one option, and returns edges — reaching and
      enqueueing them is the walk's job, so the same step, context and option always give the same
      edges.
    signature: >-
      stepEdges(step: NarrativeStep, ctx: RuleContext, followRegisterEdges: boolean):
      NarrativeEdge[]
    returns: NarrativeEdge[]
    params:
      - name: step
        type: NarrativeStep
        description: The one narrative step to read
      - name: ctx
        type: RuleContext
        description: >-
          The validation run's shared read model, for routing a dispatch step through the target
          Portal's dispatch table
      - name: followRegisterEdges
        type: boolean
        description: >-
          Whether a register handoff contributes its edge — the walk's doctrine, not a property of
          the step
    guarantees:
      - idempotent
status: complete
