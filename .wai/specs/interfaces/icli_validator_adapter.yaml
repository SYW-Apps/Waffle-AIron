id: icli_validator_adapter
name: CLI Validator Adapter Interface
description: Adapter contract for the CLI to run validations.
component: cli_validator_adapter
methods:
  - name: validateProject
    description: >-
      Forward the owner's gate to the validator portal, carrying what the command line asked to
      vary: a --subsystem scope and the project's rules and type.
    signature: 'validateProject(options?: ValidationOptions, projectType?: string): ValidationResult'
    returns: ValidationResult
    params:
      - name: options
        type: ValidationOptions
        description: What this run may vary, as the command's flags resolved it
        optional: true
      - name: projectType
        type: string
        description: The project type whose doctrine applies; defaults to backend
        optional: true
  - name: validateRegistry
    description: Calls validateRegistry on the validator portal
    signature: 'validateRegistry(registry: Registry, rules: RulesConfig): ValidationResult'
    returns: ValidationResult
  - name: validateProjectConfig
    description: Calls validateProjectConfig on the validator portal
    signature: 'validateProjectConfig(config: ProjectConfig): ValidationResult'
    returns: ValidationResult
  - name: validateAsComplete
    description: >-
      Forward the as-complete conformance gate to the validator portal: validate the tree as if
      every spec were already complete — the dry-run `wairon lock` refuses to freeze on.
    signature: 'validateAsComplete(options?: ValidationOptions, projectType?: string): ValidationResult'
    returns: ValidationResult
    params:
      - name: options
        type: ValidationOptions
        description: What this run may vary; full strictness is the gate's own and not the caller's to unset
        optional: true
      - name: projectType
        type: string
        description: The project type whose doctrine applies; defaults to backend
        optional: true
  - name: runValidation
    description: >-
      The whole `wairon validate` workflow over the LOCAL tree: run the registry, project-config and
      spec-tree checks, render their findings (notices listed and counted apart from warnings), and
      exit non-zero when the tree is invalid (or, under --ci, carries warnings — never for notices,
      never for advisory findings). The spec-tree check is the family run at a project that declares
      members or when --family is given, and the owner's gate otherwise (--no-recursive at a parent
      asks for the owner's gate alone) — validation_options.selectsFamily decides, as it does for
      the MCP tool. Then, either way, the advisory live comparison of every external the run did not
      compose (validator_portal.adviseExternals), rendered in its own section — "Externals, compared
      live (advisory: the pin gates)" — with each moved member, who uses it and the fix; it never
      changes the exit code. A family run prints each project's findings verbatim under its project.
      The runner delegates here rather than orchestrating the checks itself, so the composition
      lives with the checks it composes.
    signature: >-
      runValidation(options: { ci?: boolean; subsystem?: string; recursive?: boolean; family?:
      boolean }): Promise<void>
    returns: async void
  - name: computeGateStateId
    description: >-
      Forward to validator_portal.computeGateStateId: the gate identity a lock records and every
      staleness check compares
    signature: 'computeGateStateId(): StateId'
    returns: StateId
    params: []
  - name: validateFamily
    description: >-
      Forward the family run to the validator portal: every selected project's own gate verbatim,
      the composition of each project's externals, and the family checks.
    signature: 'validateFamily(options: ValidationOptions): ValidationResult'
    returns: ValidationResult
    params:
      - name: options
        type: ValidationOptions
        description: >-
          What this run may vary, as the command's flags resolved it; `family` when --family was
          given
  - name: familyApprovals
    description: >-
      Forward to validator_portal.familyApprovals: the bound project's pin tree — its own approval
      state and each member's within `depth` levels, each computed at that project's own root. The
      local lock asks with depth 1; `wairon status` asks for every level.
    signature: 'familyApprovals(depth?: int): list<ProjectApproval>'
    returns: list<ProjectApproval>
    params:
      - name: depth
        type: int
        description: 'Member levels to include: 1 = direct members, omitted = every level'
        optional: true
    guarantees:
      - idempotent
  - name: familyRelations
    description: >-
      Forward to validator_portal.familyRelations: the bound family's relation health, for `wairon
      diagram` to colour the canvas's consumption edges.
    signature: 'familyRelations(): list<ProjectRelations>'
    returns: list<ProjectRelations>
    params: []
    guarantees:
      - idempotent
  - name: adviseExternals
    description: >-
      Forward to validator_portal.adviseExternals: the advisory live comparison of the bound
      project's externals the run did not compose.
    signature: 'adviseExternals(composed?: list<string>): list<ValidationIssue>'
    returns: list<ValidationIssue>
    params:
      - name: composed
        type: list<string>
        description: Aliases the run already composed as part of its gate
        optional: true
status: complete
createdAt: '2026-06-19T12:00:00Z'
