id: iweb_portal
name: Web Portal Interface
description: >-
  Browser-facing HTTP contract for the unified web UI. Serves the client app shell/static assets at
  the root and the thin session/SSO/context/graph endpoints under /web. Session-cookie
  authenticated; the served app reuses every existing scoped endpoint with the session as its
  credential, so no per-page server endpoints exist here. Each route forwards to the web
  orchestrator.
component: web_portal
methods:
  - name: serveApp
    description: >-
      Serve the unified web UI client application shell and its bundled static assets for the
      requested path (single-page app entry). No orchestrator call; the app then drives every
      feature by calling existing endpoints with the session cookie. The shell's login screen is
      DYNAMIC: it fetches GET /web/login-options and renders the username/password form only when
      the built-in admin login is configured plus one "Sign in with <displayName>" button per
      ENABLED identity provider (no free-text provider input), hiding the SSO section when no
      provider is enabled and showing a clear "No sign-in method is configured" message when neither
      method exists.
    signature: 'serveApp(pathname: string): string'
    returns: string
    params:
      - name: pathname
        type: string
        description: The request path the app shell or one of its static assets is served for
    endpoint:
      transport: HTTP
      method: GET
      path: /
  - name: startSignIn
    description: >-
      Begin a browser SSO sign-in, forwarding to the web orchestrator, and hand back the provider
      authorization URL for the browser to follow.
    signature: 'startSignIn(providerId: string, redirectUri: string): string'
    returns: string
    params:
      - name: providerId
        type: string
      - name: redirectUri
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/sso/start
  - name: completeSignIn
    description: >-
      Handle the SSO provider callback, forwarding to the web orchestrator to create the session,
      then set the session cookie and return the new session id.
    signature: 'completeSignIn(state: string, code: string, expectedNonce: string): string'
    returns: string
    params:
      - name: state
        type: string
      - name: code
        type: string
      - name: expectedNonce
        type: string
        description: >-
          The sign-in nonce the browser's pre-auth cookie carried, which the identity token must
          echo — the login-CSRF check. Null when the cookie is absent, which fails the sign-in.
    endpoint:
      transport: HTTP
      method: GET
      path: /web/sso/callback
  - name: signOut
    description: >-
      End the current browser session, forwarding to the web orchestrator, and clear the session
      cookie.
    signature: 'signOut(sessionId: string): void'
    returns: void
    params:
      - name: sessionId
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/logout
  - name: getContext
    description: >-
      Return the session-principal context (subject, grants, capability flags) by forwarding to the
      web orchestrator's getCurrentContext, for the client to render role-appropriately.
    signature: 'getContext(sessionId: string): WebContext'
    returns: WebContext
    params:
      - name: sessionId
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/context
  - name: getGraph
    description: >-
      Return the live level-of-detail graph for the requested tier/project/level by forwarding to
      the web orchestrator's getGraph.
    signature: 'getGraph(sessionId: string, tier: string, projectId: string, level: number): WebGraphModel'
    returns: WebGraphModel
    params:
      - name: sessionId
        type: string
      - name: tier
        type: string
      - name: projectId
        type: string
        description: >-
          The project whose graph is drawn; empty for the landscape tier, which spans projects
          rather than showing one
        optional: false
      - name: level
        type: number
    endpoint:
      transport: HTTP
      method: GET
      path: /web/graph
  - name: signOutEverywhere
    description: >-
      Sign the caller out of ALL their browser sessions (all devices/tabs). Forwards to the web
      orchestrator; clears the current session cookie too.
    signature: 'signOutEverywhere(sessionId: string): void'
    returns: void
    params:
      - name: sessionId
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/logout-all
  - name: devLogin
    description: >-
      Establish the local-developer session for the single-project dev server (DEV MODE ONLY):
      forward to the web orchestrator to mint or reuse it, set the session cookie, and return. The
      dev HTTP layer invokes this transparently on a cookieless request so the REUSED client shows
      no login screen. The route is mounted only under devMode, so it is absent in the hosted UI.
    signature: 'devLogin(): void'
    returns: void
    params: []
    endpoint:
      transport: HTTP
      method: GET
      path: /web/dev-login
  - name: serveProjectCanvas
    description: >-
      Serve one authorized project's interactive architecture canvas as HTML to the browser — the
      web UI shell embeds it per selected project (an iframe over this route), reusing the SAME
      canvas engine as the static export. Forwards to the web orchestrator's getProjectCanvas;
      session-cookie authenticated, so cross-project access is Forbidden.
    signature: 'serveProjectCanvas(sessionId: string, projectId: string): string'
    returns: string
    params:
      - name: sessionId
        type: string
      - name: projectId
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/canvas
  - name: adminListUsers
    description: >-
      List hosted users in the caller's scope; forwards the session to
      web_admin_orchestrator.listUsers.
    signature: 'adminListUsers(sessionId: string, project: string): HostedUserRecord[]'
    returns: HostedUserRecord[]
    params:
      - name: sessionId
        type: string
      - name: project
        type: string
        optional: true
    endpoint:
      transport: HTTP
      method: GET
      path: /web/admin/users
  - name: adminUpsertUser
    description: Create or update a hosted user; forwards to web_admin_orchestrator.upsertUser.
    signature: 'adminUpsertUser(sessionId: string, record: HostedUserRecord): HostedUserRecord'
    returns: HostedUserRecord
    params:
      - name: sessionId
        type: string
      - name: record
        type: HostedUserRecord
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/users
  - name: adminSetUserStatus
    description: Set a hosted user's lifecycle status; forwards to web_admin_orchestrator.setUserStatus.
    signature: 'adminSetUserStatus(sessionId: string, userId: string, status: string): HostedUserRecord'
    returns: HostedUserRecord
    params:
      - name: sessionId
        type: string
      - name: userId
        type: string
      - name: status
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/users/status
  - name: adminListProviders
    description: >-
      List identity-provider (SSO) configurations; forwards to
      web_admin_orchestrator.listIdentityProviders.
    signature: 'adminListProviders(sessionId: string): IdentityProviderConfig[]'
    returns: IdentityProviderConfig[]
    params:
      - name: sessionId
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/admin/providers
  - name: adminUpsertProvider
    description: >-
      Create or update an identity-provider (SSO) configuration; forwards to
      web_admin_orchestrator.upsertIdentityProvider.
    signature: 'adminUpsertProvider(sessionId: string, config: IdentityProviderConfig): IdentityProviderConfig'
    returns: IdentityProviderConfig
    params:
      - name: sessionId
        type: string
      - name: config
        type: IdentityProviderConfig
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/providers
  - name: adminRemoveProvider
    description: >-
      Remove an identity-provider configuration by id; forwards to
      web_admin_orchestrator.removeIdentityProvider.
    signature: 'adminRemoveProvider(sessionId: string, id: string): void'
    returns: void
    params:
      - name: sessionId
        type: string
      - name: id
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/providers/remove
  - name: adminListOrgUnits
    description: List organization units; forwards to web_admin_orchestrator.listOrganizationUnits.
    signature: 'adminListOrgUnits(sessionId: string): OrganizationUnitRecord[]'
    returns: OrganizationUnitRecord[]
    params:
      - name: sessionId
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/admin/org/units
  - name: adminUpsertOrgUnit
    description: >-
      Create or update an organization unit; forwards to
      web_admin_orchestrator.upsertOrganizationUnit.
    signature: 'adminUpsertOrgUnit(sessionId: string, record: OrganizationUnitRecord): OrganizationUnitRecord'
    returns: OrganizationUnitRecord
    params:
      - name: sessionId
        type: string
      - name: record
        type: OrganizationUnitRecord
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/org/units
  - name: adminPlaceProject
    description: Place a project into an organization unit; forwards to web_admin_orchestrator.placeProject.
    signature: 'adminPlaceProject(sessionId: string, projectId: string, unitId: string): void'
    returns: void
    params:
      - name: sessionId
        type: string
      - name: projectId
        type: string
      - name: unitId
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/org/placements
  - name: mintAgentToken
    description: >-
      Mint a single-project MCP token for an AI agent; forwards to
      web_admin_orchestrator.mintProjectToken. User self-service, session-authorized.
    signature: 'mintAgentToken(sessionId: string, projectId: string, write: boolean): string'
    returns: string
    params:
      - name: sessionId
        type: string
      - name: projectId
        type: string
      - name: write
        type: boolean
    endpoint:
      transport: HTTP
      method: POST
      path: /web/tokens
  - name: revokeAgentToken
    description: Revoke an MCP token by id; forwards to web_admin_orchestrator.revokeProjectToken.
    signature: 'revokeAgentToken(sessionId: string, tokenId: string): void'
    returns: void
    params:
      - name: sessionId
        type: string
      - name: tokenId
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/tokens/revoke
  - name: listAgentTokens
    description: List the caller's own MCP tokens; forwards to web_admin_orchestrator.listMyTokens.
    signature: 'listAgentTokens(sessionId: string): ApiKeyRecord[]'
    returns: ApiKeyRecord[]
    params:
      - name: sessionId
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/tokens
  - name: projectList
    description: List the projects the caller can manage; forwards to web_project_orchestrator.list.
    signature: 'projectList(sessionId: string): HostedProjectRecord[]'
    returns: HostedProjectRecord[]
    params:
      - name: sessionId
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/projects
  - name: projectCreate
    description: >-
      Create a hosted project from { id, unitId, profileSelection? } — the REQUIRED owner unit plus
      an optional profile selection; forwards to web_project_orchestrator.create, which routes
      through the policy-aware initialization.
    signature: >-
      projectCreate(sessionId: string, id: string, unitId: string, profileSelection:
      ProjectProfileSelection): HostedProjectRecord
    returns: HostedProjectRecord
    params:
      - name: sessionId
        type: string
      - name: id
        type: string
      - name: unitId
        type: string
        description: REQUIRED target organization unit that owns the new project.
      - name: profileSelection
        type: ProjectProfileSelection
        description: >-
          Optional profile selection recorded into the project's config; a policy with
          requireProfileSelection rejects a create without one.
        optional: true
    endpoint:
      transport: HTTP
      method: POST
      path: /web/projects
  - name: projectLock
    description: Lock a project; forwards to web_project_orchestrator.lock.
    signature: 'projectLock(sessionId: string, projectId: string): LockRecord'
    returns: LockRecord
    params:
      - name: sessionId
        type: string
      - name: projectId
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/projects/lock
  - name: projectDestroy
    description: Destroy a project; forwards to web_project_orchestrator.destroy.
    signature: 'projectDestroy(sessionId: string, id: string): void'
    returns: void
    params:
      - name: sessionId
        type: string
      - name: id
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/projects/destroy
  - name: loginWithPassword
    description: >-
      Sign the built-in super-admin in with a username + password posted as JSON ({user, password});
      forwards to the web orchestrator's signInWithPassword and sets the session cookie exactly like
      the SSO callback (Secure follows the effective requireTls). It ESTABLISHES a session — no
      prior cookie exists to ride — so it is intentionally NOT in the cookie-mutation CSRF set; like
      every /web route it is gated on exposure.webUiEnabled. An invalid credential (or disabled
      password login, or an active throttle lockout) answers 401 with no distinguishing detail.
    signature: 'loginWithPassword(user: string, password: string): string'
    returns: string
    params:
      - name: user
        type: string
      - name: password
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/login
  - name: adminListSecretRefs
    description: >-
      List the configured secret ref names (never values); forwards to
      web_admin_orchestrator.listSecretRefs. For the IdP form's clientSecretRef picker.
    signature: 'adminListSecretRefs(sessionId: string): string[]'
    returns: string[]
    params:
      - name: sessionId
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/admin/secrets
  - name: getLoginOptions
    description: >-
      Return the pre-auth sign-in options for the login screen by forwarding to the web
      orchestrator's getLoginOptions. UNAUTHENTICATED — a pre-auth read that requires no session and
      rides no CSRF gate (it is a GET) — and gated with every /web route on exposure.webUiEnabled
      (404 when the web UI is off). The payload carries only the password-login flag and
      enabled-provider { id, displayName } pairs; never secrets, clientIds, or endpoint config.
    signature: 'getLoginOptions(): WebLoginOptions'
    returns: WebLoginOptions
    params: []
    endpoint:
      transport: HTTP
      method: GET
      path: /web/login-options
  - name: adminRemoveUnit
    description: >-
      Remove an organization unit with a disposition (migrate/alternative/absorb/cascade); forwards
      to web_admin_orchestrator.removeUnit.
    signature: 'adminRemoveUnit(sessionId: string, unitId: string, disposition: UnitDisposition): void'
    returns: void
    params:
      - name: sessionId
        type: string
      - name: unitId
        type: string
      - name: disposition
        type: UnitDisposition
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/org/units/remove
  - name: adminListRoles
    description: List permission roles; forwards to web_admin_orchestrator.listRoles.
    signature: 'adminListRoles(sessionId: string): Role[]'
    returns: Role[]
    params:
      - name: sessionId
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/admin/roles
  - name: adminCreateRole
    description: Create a permission role; forwards to web_admin_orchestrator.createRole.
    signature: 'adminCreateRole(sessionId: string, role: Role): Role'
    returns: Role
    params:
      - name: sessionId
        type: string
      - name: role
        type: Role
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/roles
  - name: adminUpdateRole
    description: Update a permission role; forwards to web_admin_orchestrator.updateRole.
    signature: 'adminUpdateRole(sessionId: string, role: Role): Role'
    returns: Role
    params:
      - name: sessionId
        type: string
      - name: role
        type: Role
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/roles/update
  - name: adminDeleteRole
    description: Delete a permission role; forwards to web_admin_orchestrator.deleteRole.
    signature: 'adminDeleteRole(sessionId: string, roleId: string): void'
    returns: void
    params:
      - name: sessionId
        type: string
      - name: roleId
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/roles/remove
  - name: adminListAssignments
    description: >-
      List permission assignments filtered by scope/subject; forwards to
      web_admin_orchestrator.listAssignments.
    signature: >-
      adminListAssignments(sessionId: string, scopeKind: string, scopeId: string, subjectKind:
      string, subjectId: string): PermissionAssignment[]
    returns: PermissionAssignment[]
    params:
      - name: sessionId
        type: string
      - name: scopeKind
        type: string
        optional: true
      - name: scopeId
        type: string
        optional: true
      - name: subjectKind
        type: string
        optional: true
      - name: subjectId
        type: string
        optional: true
    endpoint:
      transport: HTTP
      method: GET
      path: /web/admin/permissions
  - name: adminSetAssignment
    description: Upsert a permission assignment; forwards to web_admin_orchestrator.setAssignment.
    signature: 'adminSetAssignment(sessionId: string, assignment: PermissionAssignment): PermissionAssignment'
    returns: PermissionAssignment
    params:
      - name: sessionId
        type: string
      - name: assignment
        type: PermissionAssignment
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/permissions
  - name: adminRemoveAssignment
    description: Remove a permission assignment; forwards to web_admin_orchestrator.removeAssignment.
    signature: 'adminRemoveAssignment(sessionId: string, assignmentId: string): void'
    returns: void
    params:
      - name: sessionId
        type: string
      - name: assignmentId
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/permissions/remove
  - name: adminBindRole
    description: Bind a role to a user at a scope; forwards to web_admin_orchestrator.bindRole.
    signature: >-
      adminBindRole(sessionId: string, userId: string, roleId: string, scopeKind: string, scopeId:
      string): HostedUserRecord
    returns: HostedUserRecord
    params:
      - name: sessionId
        type: string
      - name: userId
        type: string
      - name: roleId
        type: string
      - name: scopeKind
        type: string
        optional: true
      - name: scopeId
        type: string
        optional: true
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/roles/bind
  - name: adminUnbindRole
    description: Unbind a role from a user at a scope; forwards to web_admin_orchestrator.unbindRole.
    signature: >-
      adminUnbindRole(sessionId: string, userId: string, roleId: string, scopeKind: string, scopeId:
      string): HostedUserRecord
    returns: HostedUserRecord
    params:
      - name: sessionId
        type: string
      - name: userId
        type: string
      - name: roleId
        type: string
      - name: scopeKind
        type: string
        optional: true
      - name: scopeId
        type: string
        optional: true
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/roles/unbind
  - name: adminListGlobalPacks
    description: List server-global packs; forwards to project_ops_orchestrator.listGlobalPacks.
    signature: 'adminListGlobalPacks(sessionId: string): PackDescriptor[]'
    returns: PackDescriptor[]
    params:
      - name: sessionId
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/admin/packs
  - name: adminInstallGlobalPack
    description: >-
      Install a declarative pack server-wide; forwards to
      project_ops_orchestrator.installGlobalPack.
    signature: 'adminInstallGlobalPack(sessionId: string, name: string, content: string): PackDescriptor'
    returns: PackDescriptor
    params:
      - name: sessionId
        type: string
      - name: name
        type: string
      - name: content
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/packs
  - name: adminRemoveGlobalPack
    description: Remove a server-global pack; forwards to project_ops_orchestrator.removeGlobalPack.
    signature: 'adminRemoveGlobalPack(sessionId: string, name: string): void'
    returns: void
    params:
      - name: sessionId
        type: string
      - name: name
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/packs/remove
  - name: projectPacksList
    description: List one project's registered packs; forwards to project_ops_orchestrator.listProjectPacks.
    signature: 'projectPacksList(sessionId: string, project: string): PackDescriptor[]'
    returns: PackDescriptor[]
    params:
      - name: sessionId
        type: string
      - name: project
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/projects/packs
  - name: projectPackInstall
    description: >-
      Install a declarative pack into a project; forwards to
      project_ops_orchestrator.installProjectPack.
    signature: >-
      projectPackInstall(sessionId: string, project: string, name: string, content: string):
      PackDescriptor
    returns: PackDescriptor
    params:
      - name: sessionId
        type: string
      - name: project
        type: string
      - name: name
        type: string
      - name: content
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/projects/packs
  - name: projectPackRemove
    description: >-
      Remove one of a project's registered packs; forwards to
      project_ops_orchestrator.removeProjectPack.
    signature: 'projectPackRemove(sessionId: string, project: string, name: string): void'
    returns: void
    params:
      - name: sessionId
        type: string
      - name: project
        type: string
      - name: name
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/projects/packs/remove
  - name: adminGetPackPolicy
    description: Read the instance pack/profile policy; forwards to project_ops_orchestrator.getPackPolicy.
    signature: 'adminGetPackPolicy(sessionId: string): InstancePackPolicy'
    returns: InstancePackPolicy
    params:
      - name: sessionId
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/admin/policy
  - name: adminSetPackPolicy
    description: Replace the instance pack/profile policy; forwards to project_ops_orchestrator.setPackPolicy.
    signature: 'adminSetPackPolicy(sessionId: string, policy: InstancePackPolicy): InstancePackPolicy'
    returns: InstancePackPolicy
    params:
      - name: sessionId
        type: string
      - name: policy
        type: InstancePackPolicy
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/policy
  - name: projectPolicyEvaluate
    description: >-
      Evaluate one project's pack/profile compliance; forwards to
      project_ops_orchestrator.evaluateProjectPolicy.
    signature: 'projectPolicyEvaluate(sessionId: string, projectId: string): PolicyEvaluationResult'
    returns: PolicyEvaluationResult
    params:
      - name: sessionId
        type: string
      - name: projectId
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/projects/policy
  - name: projectPolicyReconcile
    description: >-
      Reconcile one project against the instance pack policy; forwards to
      project_ops_orchestrator.reconcileProjectPolicy.
    signature: 'projectPolicyReconcile(sessionId: string, projectId: string): PolicyEvaluationResult'
    returns: PolicyEvaluationResult
    params:
      - name: sessionId
        type: string
      - name: projectId
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/projects/policy/reconcile
  - name: projectProducersList
    description: >-
      List one project's configured producer targets; forwards to
      project_ops_orchestrator.listProducers.
    signature: 'projectProducersList(sessionId: string, project: string): ProducerConfig[]'
    returns: ProducerConfig[]
    params:
      - name: sessionId
        type: string
      - name: project
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/projects/producers
  - name: projectProducerConfigure
    description: >-
      Configure a producer target (Notion/Miro) for a project; forwards to
      project_ops_orchestrator.configureProducer.
    signature: >-
      projectProducerConfigure(sessionId: string, project: string, target: string, parentPageId:
      string): void
    returns: void
    params:
      - name: sessionId
        type: string
      - name: project
        type: string
      - name: target
        type: string
      - name: parentPageId
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/projects/producers
  - name: projectProducerRemove
    description: Remove a project's producer target; forwards to project_ops_orchestrator.removeProducer.
    signature: 'projectProducerRemove(sessionId: string, project: string, target: string): void'
    returns: void
    params:
      - name: sessionId
        type: string
      - name: project
        type: string
      - name: target
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/projects/producers/remove
  - name: projectProducerRun
    description: Run a configured producer projection; forwards to project_ops_orchestrator.produceProducer.
    signature: 'projectProducerRun(sessionId: string, project: string, target: string): void'
    returns: void
    params:
      - name: sessionId
        type: string
      - name: project
        type: string
      - name: target
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/projects/producers/run
  - name: projectGitStatus
    description: Read a project's git-backing status; forwards to project_ops_orchestrator.getGitBinding.
    signature: 'projectGitStatus(sessionId: string, project: string): GitBackingStatus'
    returns: GitBackingStatus
    params:
      - name: sessionId
        type: string
      - name: project
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/projects/git
  - name: projectGitBind
    description: >-
      Bind a project to its REAL repository (wairon commits only .wai/); forwards to
      project_ops_orchestrator.enableGit.
    signature: >-
      projectGitBind(sessionId: string, project: string, remote: string, branch: string, pat?:
      string): HostedProjectRecord
    returns: HostedProjectRecord
    params:
      - name: sessionId
        type: string
      - name: project
        type: string
      - name: remote
        type: string
      - name: branch
        type: string
      - name: pat
        type: string
        description: >-
          A personal access token for the remote, when reaching it needs one. Stored as a secret,
          never kept on the binding.
        optional: true
    endpoint:
      transport: HTTP
      method: POST
      path: /web/projects/git
  - name: projectGitUnbind
    description: Disconnect a project's repository binding; forwards to project_ops_orchestrator.disableGit.
    signature: 'projectGitUnbind(sessionId: string, project: string): void'
    returns: void
    params:
      - name: sessionId
        type: string
      - name: project
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/projects/git/disconnect
  - name: projectGitSync
    description: Sync the default branch into the working branch; forwards to project_ops_orchestrator.syncGit.
    signature: 'projectGitSync(sessionId: string, project: string): void'
    returns: void
    params:
      - name: sessionId
        type: string
      - name: project
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/projects/git/sync
  - name: projectGitCommit
    description: >-
      Publish a deliberate .wai/-scoped commit+push (optional subsystem subpath + message); forwards
      to project_ops_orchestrator.commitProject.
    signature: >-
      projectGitCommit(sessionId: string, project: string, subsystem: string, message: string):
      GitPublish
    returns: GitPublish
    params:
      - name: sessionId
        type: string
      - name: project
        type: string
      - name: subsystem
        type: string
        optional: true
      - name: message
        type: string
        optional: true
    endpoint:
      transport: HTTP
      method: POST
      path: /web/projects/git/commit
  - name: projectGitSyncConfig
    description: >-
      Set a project's periodic-sync cadence (interval + skip-if-clean); forwards to
      project_ops_orchestrator.configureGitSync.
    signature: >-
      projectGitSyncConfig(sessionId: string, project: string, periodicSyncMinutes: number,
      skipIfClean: boolean): void
    returns: void
    params:
      - name: sessionId
        type: string
      - name: project
        type: string
      - name: periodicSyncMinutes
        type: number
        optional: true
      - name: skipIfClean
        type: boolean
        optional: true
    endpoint:
      transport: HTTP
      method: POST
      path: /web/projects/git/sync-config
  - name: adminAuditQuery
    description: >-
      The scope-filtered, paginated, redacted audit viewer; forwards to
      project_ops_orchestrator.queryAuditEvents (filters from query params).
    signature: 'adminAuditQuery(sessionId: string, query: AuditQuery): AuditEvent[]'
    returns: AuditEvent[]
    params:
      - name: sessionId
        type: string
      - name: query
        type: AuditQuery
    endpoint:
      transport: HTTP
      method: GET
      path: /web/admin/audit
  - name: adminAuditCount
    description: >-
      The scoped audit-event count for pagination; forwards to
      project_ops_orchestrator.countAuditEvents.
    signature: 'adminAuditCount(sessionId: string, query: AuditQuery): number'
    returns: number
    params:
      - name: sessionId
        type: string
      - name: query
        type: AuditQuery
    endpoint:
      transport: HTTP
      method: GET
      path: /web/admin/audit/count
  - name: adminGetExposure
    description: Read the instance exposure policy; forwards to project_ops_orchestrator.getExposurePolicy.
    signature: 'adminGetExposure(sessionId: string): HostExposurePolicy'
    returns: HostExposurePolicy
    params:
      - name: sessionId
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/admin/exposure
  - name: adminSetExposure
    description: Replace the instance exposure policy; forwards to project_ops_orchestrator.setExposurePolicy.
    signature: 'adminSetExposure(sessionId: string, policy: HostExposurePolicy): HostExposurePolicy'
    returns: HostExposurePolicy
    params:
      - name: sessionId
        type: string
      - name: policy
        type: HostExposurePolicy
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/exposure
  - name: adminListGitBacking
    description: >-
      List the container-level backup bindings in the caller's admin reach; forwards to
      project_ops_orchestrator.listBackingBindings.
    signature: 'adminListGitBacking(sessionId: string): GitBackingBinding[]'
    returns: GitBackingBinding[]
    params:
      - name: sessionId
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/admin/git-backing
  - name: adminBindGitBacking
    description: >-
      Bind a unit container repo or the instance-structure backup repo; forwards to
      project_ops_orchestrator.bindBackingScope.
    signature: >-
      adminBindGitBacking(sessionId: string, binding: GitBackingBinding, pat?: string):
      GitBackingBinding
    returns: GitBackingBinding
    params:
      - name: sessionId
        type: string
      - name: binding
        type: GitBackingBinding
      - name: pat
        type: string
        description: >-
          A personal access token for the backing remote, when reaching it needs one. Stored as a
          secret, never kept on the binding.
        optional: true
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/git-backing
  - name: adminUnbindGitBacking
    description: >-
      Remove a container-level backup binding; forwards to
      project_ops_orchestrator.unbindBackingScope.
    signature: 'adminUnbindGitBacking(sessionId: string, bindingId: string): void'
    returns: void
    params:
      - name: sessionId
        type: string
      - name: bindingId
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/git-backing/remove
  - name: adminSyncGitBacking
    description: Run a container-level backup sync now; forwards to project_ops_orchestrator.syncBackingScope.
    signature: 'adminSyncGitBacking(sessionId: string, bindingId: string): boolean'
    returns: boolean
    params:
      - name: sessionId
        type: string
      - name: bindingId
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/git-backing/sync
  - name: adminCreateShareLink
    description: >-
      Create a share link (mint the token once); forwards the session to
      share_admin_orchestrator.createShareLink, which enforces share:create on the target scope.
    signature: 'adminCreateShareLink(sessionId: string, input: ShareLinkInput): ShareLinkCreated'
    returns: ShareLinkCreated
    params:
      - name: sessionId
        type: string
      - name: input
        type: ShareLinkInput
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/share
  - name: adminListShareLinks
    description: List a project's share links; forwards to share_admin_orchestrator.listShareLinks.
    signature: 'adminListShareLinks(sessionId: string, projectId: string): ShareLink[]'
    returns: ShareLink[]
    params:
      - name: sessionId
        type: string
      - name: projectId
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/admin/share
  - name: adminRefreshShareSnapshot
    description: Re-capture a link's immutable snapshot; forwards to share_admin_orchestrator.refreshSnapshot.
    signature: 'adminRefreshShareSnapshot(sessionId: string, linkId: string): ShareLink'
    returns: ShareLink
    params:
      - name: sessionId
        type: string
      - name: linkId
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/share/refresh
  - name: adminUpdateShareLink
    description: >-
      Update a link's mutable settings (enabled / expiry / download permissions / embedding
      allowlist); forwards to share_admin_orchestrator.updateShareLink.
    signature: 'adminUpdateShareLink(sessionId: string, linkId: string, changes: ShareLinkUpdate): ShareLink'
    returns: ShareLink
    params:
      - name: sessionId
        type: string
      - name: linkId
        type: string
      - name: changes
        type: ShareLinkUpdate
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/share/update
  - name: adminRemoveShareLink
    description: Revoke a share link; forwards to share_admin_orchestrator.removeShareLink.
    signature: 'adminRemoveShareLink(sessionId: string, linkId: string): void'
    returns: void
    params:
      - name: sessionId
        type: string
      - name: linkId
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/share/remove
  - name: adminGetShareAccessLog
    description: Read a link's access log; forwards to share_admin_orchestrator.getShareAccessLog.
    signature: 'adminGetShareAccessLog(sessionId: string, linkId: string, limit: number): ShareAccessEntry[]'
    returns: ShareAccessEntry[]
    params:
      - name: sessionId
        type: string
      - name: linkId
        type: string
      - name: limit
        type: number
    endpoint:
      transport: HTTP
      method: GET
      path: /web/admin/share/access
  - name: adminInstallGlobalPackArchive
    description: >-
      Install a declarative pack server-wide from an uploaded .wpack archive (raw application/zip
      body; pack name derived from the envelope, or overridden via the X-Wairon-Pack-Name header).
      Forwards to project_ops_orchestrator.installGlobalPackArchive. The ZIP-primary counterpart of
      adminInstallGlobalPack.
    signature: >-
      adminInstallGlobalPackArchive(sessionId: string, archive: bytes, name?: string):
      PackDescriptor
    returns: PackDescriptor
    params:
      - name: sessionId
        type: string
      - name: archive
        type: bytes
      - name: name
        type: string
        optional: true
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/packs/upload
  - name: projectPackInstallArchive
    description: >-
      Install a declarative pack into a project from an uploaded .wpack archive (raw application/zip
      body). Forwards to project_ops_orchestrator.installProjectPackArchive. The ZIP-primary
      counterpart of projectPackInstall.
    signature: >-
      projectPackInstallArchive(sessionId: string, project: string, archive: bytes, name?: string):
      PackDescriptor
    returns: PackDescriptor
    params:
      - name: sessionId
        type: string
      - name: project
        type: string
      - name: archive
        type: bytes
      - name: name
        type: string
        optional: true
    endpoint:
      transport: HTTP
      method: POST
      path: /web/projects/packs/upload
  - name: availableProfilesList
    description: >-
      List the profiles available for selection (built-in + server-global pack profiles, each tagged
      with its source); forwards to project_ops_orchestrator.listAvailableProfiles.
    signature: 'availableProfilesList(sessionId: string): AvailableProfile[]'
    returns: AvailableProfile[]
    params:
      - name: sessionId
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/admin/profiles
  - name: projectPacksAdoptable
    description: >-
      List the server-global packs a project may adopt (the instance catalog with contents);
      forwards to project_ops_orchestrator.listAdoptableProjectPacks.
    signature: 'projectPacksAdoptable(sessionId: string, project: string): PackDescriptor[]'
    returns: PackDescriptor[]
    params:
      - name: sessionId
        type: string
      - name: project
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/projects/packs/adoptable
  - name: projectPackAdopt
    description: >-
      Adopt a server-global pack into a project by name (no archive upload); forwards to
      project_ops_orchestrator.adoptProjectPack. The catalog counterpart of
      projectPackInstall/projectPackInstallArchive.
    signature: 'projectPackAdopt(sessionId: string, project: string, name: string): PackDescriptor'
    returns: PackDescriptor
    params:
      - name: sessionId
        type: string
      - name: project
        type: string
      - name: name
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/projects/packs/adopt
  - name: webGetProjectConfig
    description: >-
      Read a project's architectural config — its projectType (project-level architectural profile)
      and lock status; forwards to project_ops_orchestrator.getProjectConfig with the session as the
      credential.
    signature: 'webGetProjectConfig(sessionId: string, projectId: string): ProjectConfigView'
    returns: ProjectConfigView
    params:
      - name: sessionId
        type: string
      - name: projectId
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/projects/config
  - name: webSetProjectConfig
    description: >-
      Set a project's projectType (project-level architectural profile); forwards to
      project_ops_orchestrator.setProjectType with the session as the credential.
    signature: >-
      webSetProjectConfig(sessionId: string, projectId: string, projectType: string):
      ProjectConfigView
    returns: ProjectConfigView
    params:
      - name: sessionId
        type: string
      - name: projectId
        type: string
      - name: projectType
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/projects/config
  - name: projectProfilesList
    description: >-
      List the architectural profiles selectable FOR ONE PROJECT — built-ins plus the profiles
      contributed by the project's own registered packs (installed) plus those contributed by the
      server-global packs (adoptable on selection, vendored by the write path); forwards to
      project_ops_orchestrator.listProjectProfiles with the session as the credential. The
      project-type picker reads this instead of the instance-wide /web/admin/profiles catalog, which
      cannot see a project's own packs and cannot say which profiles still need adopting.
    signature: 'projectProfilesList(sessionId: string, project: string): AvailableProfile[]'
    returns: AvailableProfile[]
    params:
      - name: sessionId
        type: string
      - name: project
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/projects/profiles
  - name: projectTreeExport
    description: >-
      Download the scoped project's whole spec tree as a .waitree archive (the migration counterpart
      of the canvas download): reads projectId from the query, forwards to
      project_ops_orchestrator.exportProjectTree with the session as the credential, and answers
      application/zip with a download disposition naming the project. Requires project:read over the
      project upstream.
    signature: >-
      projectTreeExport(sessionId: string, project: string, subproject?: string, includeDerived?:
      boolean, allowPartial?: boolean): TreeExportResult
    returns: TreeExportResult
    params:
      - name: sessionId
        type: string
      - name: project
        type: string
      - name: subproject
        type: string
        optional: true
      - name: includeDerived
        type: boolean
        optional: true
      - name: allowPartial
        type: boolean
        description: >-
          Pack whatever CAN be packed when a chained subproject cannot be, and list the mounts left
          out in the result, instead of refusing the whole export.
        optional: true
    endpoint:
      transport: HTTP
      method: GET
      path: /web/projects/tree/export
  - name: projectTreeImport
    description: >-
      Replace the scoped project's spec tree from an uploaded .waitree archive carried as a raw
      application/zip body (the same raw-body route shape as the pack upload). Forwards to
      project_ops_orchestrator.importProjectTree with the session as the credential; requires
      project:admin over the project upstream, refuses executable entries, and reports where the
      replaced tree was backed up.
    signature: >-
      projectTreeImport(sessionId: string, project: string, archive: bytes, subproject?: string,
      replaceExisting?: boolean): TreeImportResult
    returns: TreeImportResult
    params:
      - name: sessionId
        type: string
      - name: project
        type: string
      - name: archive
        type: bytes
      - name: subproject
        type: string
        optional: true
      - name: replaceExisting
        type: boolean
        optional: true
    endpoint:
      transport: HTTP
      method: POST
      path: /web/projects/tree/import
  - name: adminSetSecret
    description: >-
      Set or replace one integration secret by key on behalf of the signed-in instance admin,
      forwarding to the web instance admin orchestrator. The value is write-only: the matching GET
      lists key names and never values.
    signature: 'adminSetSecret(sessionId: string, key: string, value: string): void'
    returns: void
    params:
      - name: sessionId
        type: string
      - name: key
        type: string
      - name: value
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/secrets
  - name: adminGetLandscape
    description: >-
      The org-unit, project and relation graph for the signed-in admin, forwarding to the landscape
      orchestrator (landscape:read).
    signature: 'adminGetLandscape(sessionId: string): LandscapeGraphModel'
    returns: LandscapeGraphModel
    params:
      - name: sessionId
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/admin/landscape
  - name: adminGetHealth
    description: The instance health report, forwarding to the operations orchestrator (operations:read).
    signature: 'adminGetHealth(sessionId: string): InstanceHealthReport'
    returns: InstanceHealthReport
    params:
      - name: sessionId
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/admin/health
  - name: adminGetUsage
    description: The resource usage snapshots, forwarding to the operations orchestrator (operations:read).
    signature: 'adminGetUsage(sessionId: string): ResourceUsageSnapshot[]'
    returns: ResourceUsageSnapshot[]
    params:
      - name: sessionId
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/admin/usage
  - name: adminListApprovals
    description: >-
      The approval requests pending in the caller's scope, forwarding to the project lifecycle
      orchestrator (approval:decide).
    signature: 'adminListApprovals(sessionId: string): ApprovalRequest[]'
    returns: ApprovalRequest[]
    params:
      - name: sessionId
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/admin/approvals
  - name: adminDecideApproval
    description: >-
      Decide a pending approval request, forwarding to the project lifecycle orchestrator. The
      decider is always the session's own principal, never a value the request supplies, and
      self-approval is refused where the decision is made.
    signature: 'adminDecideApproval(sessionId: string, decision: ApprovalDecision): ApprovalRequest'
    returns: ApprovalRequest
    params:
      - name: sessionId
        type: string
      - name: decision
        type: ApprovalDecision
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/approvals/decide
  - name: serveProjectCanvasModel
    description: >-
      Serve one authorized project's canvas model as JSON — the data the web app's in-React canvas
      mounts directly. Forwards to the web graph orchestrator's getProjectCanvasModel;
      session-cookie authenticated, so cross-project access is Forbidden.
    signature: 'serveProjectCanvasModel(sessionId: string, projectId: string): CanvasModel'
    returns: CanvasModel
    params:
      - name: sessionId
        type: string
      - name: projectId
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/canvas-model
  - name: serveProjectOpenApi
    description: >-
      Serve one authorized project's API explorer as HTML — its only public API directly, the index
      of them when it publishes several, or the one the `spec` query names. Forwards to the web
      graph orchestrator's getProjectOpenApi; session-cookie authenticated, so cross-project access
      is Forbidden.
    signature: 'serveProjectOpenApi(sessionId: string, projectId: string, portalId?: string): string'
    returns: string
    params:
      - name: sessionId
        type: string
      - name: projectId
        type: string
      - name: portalId
        type: string
        description: The public portal whose API to show, from the `spec` query
        optional: true
    endpoint:
      transport: HTTP
      method: GET
      path: /web/openapi
