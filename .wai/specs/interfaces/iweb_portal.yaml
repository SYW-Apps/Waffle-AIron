  - name: adminInstallGlobalPackArchive
    description: >-
      Install a declarative pack server-wide from an uploaded .wpack archive (raw application/zip
      body; pack name derived from the envelope, or overridden via the X-Wairon-Pack-Name header).
      Forwards to project_ops_orchestrator.installGlobalPackArchive. The ZIP-primary counterpart of
      adminInstallGlobalPack.
    signature: >-
      adminInstallGlobalPackArchive(sessionId: string, archive: bytes, name?: string):
      PackDescriptor
    returns: PackDescriptor
    params:
      - name: sessionId
        type: string
      - name: archive
        type: bytes
      - name: name
        type: string
        optional: true
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/packs/upload
  - name: projectPackInstallArchive
    description: >-
      Install a declarative pack into a project from an uploaded .wpack archive (raw application/zip
      body). Forwards to project_ops_orchestrator.installProjectPackArchive. The ZIP-primary
      counterpart of projectPackInstall. No impact preview exists for an archive upload yet: the
      SPA's confirm step says so plainly ("impact not available for an archive; install its YAML or
      adopt it from the catalog to preview") and asks before calling this route.
    signature: >-
      projectPackInstallArchive(sessionId: string, project: string, archive: bytes, name?: string):
      PackDescriptor
    returns: PackDescriptor
    params:
      - name: sessionId
        type: string
      - name: project
        type: string
      - name: archive
        type: bytes
      - name: name
        type: string
        optional: true
    endpoint:
      transport: HTTP
      method: POST
      path: /web/projects/packs/upload
  - name: availableProfilesList
    description: >-
      List the profiles available for selection (built-in + server-global pack profiles, each tagged
      with its source); forwards to project_ops_orchestrator.listAvailableProfiles.
    signature: 'availableProfilesList(sessionId: string): list<AvailableProfile>'
    returns: list<AvailableProfile>
    params:
      - name: sessionId
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/admin/profiles
  - name: projectPacksAdoptable
    description: >-
      List the server-global packs a project may adopt (the instance catalog with contents);
      forwards to project_ops_orchestrator.listAdoptableProjectPacks.
    signature: 'projectPacksAdoptable(sessionId: string, project: string): list<PackDescriptor>'
    returns: list<PackDescriptor>
    params:
      - name: sessionId
        type: string
      - name: project
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/projects/packs/adoptable
  - name: projectPackAdopt
    description: >-
      Adopt a server-global pack into a project by name (no archive upload); forwards to
      project_ops_orchestrator.adoptProjectPack. The catalog counterpart of
      projectPackInstall/projectPackInstallArchive. The SPA's confirm step calls projectPackImpact
      with the name and no content first, shows the report and adopts only on confirmation;
      cancelling writes nothing.
    signature: 'projectPackAdopt(sessionId: string, project: string, name: string): PackDescriptor'
    returns: PackDescriptor
    params:
      - name: sessionId
        type: string
      - name: project
        type: string
      - name: name
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/projects/packs/adopt
  - name: webGetProjectConfig
    description: >-
      Read a project's architectural config — its projectType (project-level architectural profile)
      and lock status; forwards to project_ops_orchestrator.getProjectConfig with the session as the
      credential.
    signature: 'webGetProjectConfig(sessionId: string, projectId: string): ProjectConfigView'
    returns: ProjectConfigView
    params:
      - name: sessionId
        type: string
      - name: projectId
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/projects/config
  - name: webSetProjectConfig
    description: >-
      Set a project's projectType (project-level architectural profile); forwards to
      project_ops_orchestrator.setProjectType with the session as the credential.
    signature: >-
      webSetProjectConfig(sessionId: string, projectId: string, projectType: string):
      ProjectConfigView
    returns: ProjectConfigView
    params:
      - name: sessionId
        type: string
      - name: projectId
        type: string
      - name: projectType
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/projects/config
  - name: projectProfilesList
    description: >-
      List the architectural profiles selectable FOR ONE PROJECT — built-ins plus the profiles
      contributed by the project's own registered packs (installed) plus those contributed by the
      server-global packs (adoptable on selection, vendored by the write path); forwards to
      project_ops_orchestrator.listProjectProfiles with the session as the credential. The
      project-type picker reads this instead of the instance-wide /web/admin/profiles catalog, which
      cannot see a project's own packs and cannot say which profiles still need adopting.
    signature: 'projectProfilesList(sessionId: string, project: string): list<AvailableProfile>'
    returns: list<AvailableProfile>
    params:
      - name: sessionId
        type: string
      - name: project
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/projects/profiles
  - name: projectTreeExport
    description: >-
      Download the scoped project's whole spec tree as a .waitree archive (the migration counterpart
      of the canvas download): reads projectId from the query, forwards to
      project_ops_orchestrator.exportProjectTree with the session as the credential, and answers
      application/zip with a download disposition naming the project. Requires project:read over the
      project upstream.
    signature: >-
      projectTreeExport(sessionId: string, project: string, includeDerived?: bool, allowPartial?:
      bool): TreeExportResult
    returns: TreeExportResult
    params:
      - name: sessionId
        type: string
      - name: project
        type: string
      - name: includeDerived
        type: bool
        optional: true
      - name: allowPartial
        type: bool
        description: >-
          Pack whatever CAN be packed when a chained subproject cannot be, and list the mounts left
          out in the result, instead of refusing the whole export.
        optional: true
    endpoint:
      transport: HTTP
      method: GET
      path: /web/projects/tree/export
  - name: projectTreeImport
    description: >-
      Replace the scoped project's spec tree from an uploaded .waitree archive carried as a raw
      application/zip body (the same raw-body route shape as the pack upload). Forwards to
      project_ops_orchestrator.importProjectTree with the session as the credential; requires
      project:admin over the project upstream, refuses executable entries, and reports where the
      replaced tree was backed up.
    signature: >-
      projectTreeImport(sessionId: string, project: string, archive: bytes, replaceExisting?: bool):
      TreeImportResult
    returns: TreeImportResult
    params:
      - name: sessionId
        type: string
      - name: project
        type: string
      - name: archive
        type: bytes
      - name: replaceExisting
        type: bool
        optional: true
    endpoint:
      transport: HTTP
      method: POST
      path: /web/projects/tree/import
  - name: adminSetSecret
    description: >-
      Set or replace one integration secret by key on behalf of the signed-in instance admin,
      forwarding to the web instance admin orchestrator. The value is write-only: the matching GET
      lists key names and never values.
    signature: 'adminSetSecret(sessionId: string, key: string, value: string): void'
    returns: void
    params:
      - name: sessionId
        type: string
      - name: key
        type: string
      - name: value
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/secrets
  - name: adminGetLandscape
    description: >-
