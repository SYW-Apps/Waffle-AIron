id: iweb_portal
name: Web Portal Interface
description: >-
  Browser-facing HTTP contract for the unified web UI. Serves the client app shell/static assets at
  the root and the thin session/SSO/context/graph endpoints under /web. Session-cookie
  authenticated; the served app reuses every existing scoped endpoint with the session as its
  credential, so no per-page server endpoints exist here. Each route forwards to the web
  orchestrator.
component: web_portal
methods:
  - name: serveApp
    description: >-
      Serve the unified web UI client application shell and its bundled static assets for the
      requested path (single-page app entry). No orchestrator call; the app then drives every
      feature by calling existing endpoints with the session cookie. The shell's login screen is
      DYNAMIC: it fetches GET /web/login-options and renders the username/password form only when
      the built-in admin login is configured plus one "Sign in with <displayName>" button per
      ENABLED identity provider (no free-text provider input), hiding the SSO section when no
      provider is enabled and showing a clear "No sign-in method is configured" message when neither
      method exists.
    signature: 'serveApp(pathname: string): string'
    returns: string
    params:
      - name: pathname
        type: string
        description: The request path the app shell or one of its static assets is served for
    endpoint:
      transport: HTTP
      method: GET
      path: /
  - name: startSignIn
    description: >-
      Begin a browser SSO sign-in, forwarding to the web orchestrator, and hand back the provider
      authorization URL for the browser to follow.
    signature: 'startSignIn(providerId: string, redirectUri: string): async string'
    returns: async string
    params:
      - name: providerId
        type: string
      - name: redirectUri
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/sso/start
  - name: completeSignIn
    description: >-
      Handle the SSO provider callback, forwarding to the web orchestrator to create the session,
      then set the session cookie and return the new session id.
    signature: 'completeSignIn(state: string, code: string, expectedNonce: string): async string'
    returns: async string
    params:
      - name: state
        type: string
      - name: code
        type: string
      - name: expectedNonce
        type: string
        description: >-
          The sign-in nonce the browser's pre-auth cookie carried, which the identity token must
          echo — the login-CSRF check. Null when the cookie is absent, which fails the sign-in.
    endpoint:
      transport: HTTP
      method: GET
      path: /web/sso/callback
  - name: signOut
    description: >-
      End the current browser session, forwarding to the web orchestrator, and clear the session
      cookie.
    signature: 'signOut(sessionId: string): void'
    returns: void
    params:
      - name: sessionId
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/logout
  - name: getContext
    description: >-
      Return the session-principal context (subject, grants, capability flags) by forwarding to the
      web orchestrator's getCurrentContext, for the client to render role-appropriately.
    signature: 'getContext(sessionId: string): WebContext'
    returns: WebContext
    params:
      - name: sessionId
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/context
  - name: getGraph
    description: >-
      Return the live level-of-detail graph for the requested tier/project/level by forwarding to
      the web orchestrator's getGraph.
    signature: 'getGraph(sessionId: string, tier: string, projectId: string, level: int): WebGraphModel'
    returns: WebGraphModel
    params:
      - name: sessionId
        type: string
      - name: tier
        type: string
      - name: projectId
        type: string
        description: >-
          The project whose graph is drawn; empty for the landscape tier, which spans projects
          rather than showing one
        optional: false
      - name: level
        type: int
    endpoint:
      transport: HTTP
      method: GET
      path: /web/graph
  - name: signOutEverywhere
    description: >-
      Sign the caller out of ALL their browser sessions (all devices/tabs). Forwards to the web
      orchestrator; clears the current session cookie too.
    signature: 'signOutEverywhere(sessionId: string): void'
    returns: void
    params:
      - name: sessionId
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/logout-all
  - name: devLogin
    description: >-
      Establish the local-developer session for the single-project dev server (DEV MODE ONLY):
      forward to the web orchestrator to mint or reuse it, set the session cookie, and return. The
      dev HTTP layer invokes this transparently on a cookieless request so the REUSED client shows
      no login screen. The route is mounted only under devMode, so it is absent in the hosted UI.
    signature: 'devLogin(): void'
    returns: void
    params: []
    endpoint:
      transport: HTTP
      method: GET
      path: /web/dev-login
  - name: serveProjectCanvas
    description: >-
      Serve one authorized project's interactive architecture canvas as HTML to the browser — the
      web UI shell embeds it per selected project (an iframe over this route), reusing the SAME
      canvas engine as the static export. Forwards to the web orchestrator's getProjectCanvas;
      session-cookie authenticated, so cross-project access is Forbidden.
    signature: 'serveProjectCanvas(sessionId: string, projectId: string): string'
    returns: string
    params:
      - name: sessionId
        type: string
      - name: projectId
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/canvas
  - name: adminListUsers
    description: >-
      List hosted users in the caller's scope; forwards the session to
      web_admin_orchestrator.listUsers.
    signature: 'adminListUsers(sessionId: string, project?: string): list<HostedUserRecord>'
    returns: list<HostedUserRecord>
    params:
      - name: sessionId
        type: string
      - name: project
        type: string
        optional: true
    endpoint:
      transport: HTTP
      method: GET
      path: /web/admin/users
  - name: adminUpsertUser
    description: Create or update a hosted user; forwards to web_admin_orchestrator.upsertUser.
    signature: 'adminUpsertUser(sessionId: string, record: HostedUserRecord): HostedUserRecord'
    returns: HostedUserRecord
    params:
      - name: sessionId
        type: string
      - name: record
        type: HostedUserRecord
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/users
  - name: adminSetUserStatus
    description: Set a hosted user's lifecycle status; forwards to web_admin_orchestrator.setUserStatus.
    signature: 'adminSetUserStatus(sessionId: string, userId: string, status: string): HostedUserRecord'
    returns: HostedUserRecord
    params:
      - name: sessionId
        type: string
      - name: userId
        type: string
      - name: status
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/users/status
  - name: adminListProviders
    description: >-
      List identity-provider (SSO) configurations; forwards to
      web_admin_orchestrator.listIdentityProviders.
    signature: 'adminListProviders(sessionId: string): list<IdentityProviderConfig>'
    returns: list<IdentityProviderConfig>
    params:
      - name: sessionId
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/admin/providers
  - name: adminUpsertProvider
    description: >-
      Create or update an identity-provider (SSO) configuration; forwards to
      web_admin_orchestrator.upsertIdentityProvider.
    signature: 'adminUpsertProvider(sessionId: string, config: IdentityProviderConfig): IdentityProviderConfig'
    returns: IdentityProviderConfig
    params:
      - name: sessionId
        type: string
      - name: config
        type: IdentityProviderConfig
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/providers
  - name: adminRemoveProvider
    description: >-
      Remove an identity-provider configuration by id; forwards to
      web_admin_orchestrator.removeIdentityProvider.
    signature: 'adminRemoveProvider(sessionId: string, id: string): void'
    returns: void
    params:
      - name: sessionId
        type: string
      - name: id
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/providers/remove
  - name: adminListOrgUnits
    description: List organization units; forwards to web_admin_orchestrator.listOrganizationUnits.
    signature: 'adminListOrgUnits(sessionId: string): list<OrganizationUnitRecord>'
    returns: list<OrganizationUnitRecord>
    params:
      - name: sessionId
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/admin/org/units
  - name: adminUpsertOrgUnit
    description: >-
      Create or update an organization unit; forwards to
      web_admin_orchestrator.upsertOrganizationUnit.
    signature: 'adminUpsertOrgUnit(sessionId: string, record: OrganizationUnitRecord): OrganizationUnitRecord'
    returns: OrganizationUnitRecord
    params:
      - name: sessionId
        type: string
      - name: record
        type: OrganizationUnitRecord
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/org/units
  - name: adminPlaceProject
    description: Place a project into an organization unit; forwards to web_admin_orchestrator.placeProject.
    signature: 'adminPlaceProject(sessionId: string, projectId: string, unitId: string): void'
    returns: void
    params:
      - name: sessionId
        type: string
      - name: projectId
        type: string
      - name: unitId
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/org/placements
  - name: mintAgentToken
    description: >-
      Mint a single-project MCP token for an AI agent; forwards to
      web_admin_orchestrator.mintProjectToken. User self-service, session-authorized.
    signature: 'mintAgentToken(sessionId: string, projectId: string, write: bool): string'
    returns: string
    params:
      - name: sessionId
        type: string
      - name: projectId
        type: string
      - name: write
        type: bool
    endpoint:
      transport: HTTP
      method: POST
      path: /web/tokens
  - name: revokeAgentToken
    description: Revoke an MCP token by id; forwards to web_admin_orchestrator.revokeProjectToken.
    signature: 'revokeAgentToken(sessionId: string, tokenId: string): void'
    returns: void
    params:
      - name: sessionId
        type: string
      - name: tokenId
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/tokens/revoke
  - name: listAgentTokens
    description: List the caller's own MCP tokens; forwards to web_admin_orchestrator.listMyTokens.
    signature: 'listAgentTokens(sessionId: string): list<ApiKeyRecord>'
    returns: list<ApiKeyRecord>
    params:
      - name: sessionId
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/tokens
  - name: projectList
    description: >-
      List the projects the caller can manage; forwards to web_project_orchestrator.list. Since
      stage 7 member records are listed like any project, each carrying parentProjectId: the SPA
      draws a member's crumb to its parent (named only when the parent is itself in the list, a
      neutral crumb otherwise) and lists under each project the members the list holds whose
      parentProjectId names it. Nothing the caller cannot read is listed or named.
    signature: 'projectList(sessionId: string): list<HostedProjectRecord>'
    returns: list<HostedProjectRecord>
    params:
      - name: sessionId
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/projects
  - name: projectCreate
    description: >-
      Create a hosted project from { id, unitId, profileSelection? } — the REQUIRED owner unit plus
      an optional profile selection; forwards to web_project_orchestrator.create, which routes
      through the policy-aware initialization. Answers the created record with the impact of every
      pack and of the governing-profile step the instance policy applied; the SPA shows them after
      creation, since the policy's packs are not the user's choice to confirm.
    signature: >-
      projectCreate(sessionId: string, id: string, unitId: string, profileSelection?:
      ProjectProfileSelection): GovernedProjectCreation
    returns: GovernedProjectCreation
    params:
      - name: sessionId
        type: string
      - name: id
        type: string
      - name: unitId
        type: string
        description: REQUIRED target organization unit that owns the new project.
      - name: profileSelection
        type: ProjectProfileSelection
        description: >-
          Optional profile selection recorded into the project's config; a policy with
          requireProfileSelection rejects a create without one.
        optional: true
    endpoint:
      transport: HTTP
      method: POST
      path: /web/projects
  - name: projectLock
    description: Lock a project; forwards to web_project_orchestrator.lock.
    signature: 'projectLock(sessionId: string, projectId: string): LockRecord'
    returns: LockRecord
    params:
      - name: sessionId
        type: string
      - name: projectId
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/projects/lock
  - name: projectDestroy
    description: Destroy a project; forwards to web_project_orchestrator.destroy.
    signature: 'projectDestroy(sessionId: string, id: string): void'
    returns: void
    params:
      - name: sessionId
        type: string
      - name: id
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/projects/destroy
  - name: loginWithPassword
    description: >-
      Sign the built-in super-admin in with a username + password posted as JSON ({user, password});
      forwards to the web orchestrator's signInWithPassword and sets the session cookie exactly like
      the SSO callback (Secure follows the effective requireTls). It ESTABLISHES a session — no
      prior cookie exists to ride — so it is intentionally NOT in the cookie-mutation CSRF set; like
      every /web route it is gated on exposure.webUiEnabled. An invalid credential (or disabled
      password login, or an active throttle lockout) answers 401 with no distinguishing detail.
    signature: 'loginWithPassword(user: string, password: string): string'
    returns: string
    params:
      - name: user
        type: string
      - name: password
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/login
  - name: adminListSecretRefs
    description: >-
      List the configured secret ref names (never values); forwards to
      web_admin_orchestrator.listSecretRefs. For the IdP form's clientSecretRef picker.
    signature: 'adminListSecretRefs(sessionId: string): list<string>'
    returns: list<string>
    params:
      - name: sessionId
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/admin/secrets
  - name: getLoginOptions
    description: >-
      Return the pre-auth sign-in options for the login screen by forwarding to the web
      orchestrator's getLoginOptions. UNAUTHENTICATED — a pre-auth read that requires no session and
      rides no CSRF gate (it is a GET) — and gated with every /web route on exposure.webUiEnabled
      (404 when the web UI is off). The payload carries only the password-login flag and
      enabled-provider { id, displayName } pairs; never secrets, clientIds, or endpoint config.
    signature: 'getLoginOptions(): WebLoginOptions'
    returns: WebLoginOptions
    params: []
    endpoint:
      transport: HTTP
      method: GET
      path: /web/login-options
  - name: adminRemoveUnit
    description: >-
      Remove an organization unit with a disposition (migrate/alternative/absorb/cascade); forwards
      to web_admin_orchestrator.removeUnit.
    signature: 'adminRemoveUnit(sessionId: string, unitId: string, disposition: UnitDisposition): void'
    returns: void
    params:
      - name: sessionId
        type: string
      - name: unitId
        type: string
      - name: disposition
        type: UnitDisposition
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/org/units/remove
  - name: adminListRoles
    description: List permission roles; forwards to web_admin_orchestrator.listRoles.
    signature: 'adminListRoles(sessionId: string): list<Role>'
    returns: list<Role>
    params:
      - name: sessionId
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/admin/roles
  - name: adminCreateRole
    description: Create a permission role; forwards to web_admin_orchestrator.createRole.
    signature: 'adminCreateRole(sessionId: string, role: Role): Role'
    returns: Role
    params:
      - name: sessionId
        type: string
      - name: role
        type: Role
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/roles
  - name: adminUpdateRole
    description: Update a permission role; forwards to web_admin_orchestrator.updateRole.
    signature: 'adminUpdateRole(sessionId: string, role: Role): Role'
    returns: Role
    params:
      - name: sessionId
        type: string
      - name: role
        type: Role
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/roles/update
  - name: adminDeleteRole
    description: Delete a permission role; forwards to web_admin_orchestrator.deleteRole.
    signature: 'adminDeleteRole(sessionId: string, roleId: string): void'
    returns: void
    params:
      - name: sessionId
        type: string
      - name: roleId
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/roles/remove
  - name: adminListAssignments
    description: >-
      List permission assignments filtered by scope/subject; forwards to
      web_admin_orchestrator.listAssignments. A subsystem scope is one more scope kind (`subsystem`,
      scope id `<projectId>/<subsystemId>`): the /admin/permissions grid offers each project's
      subsystems in its scope picker and shows a subsystem rule as `Subsystem · <project> ›
      <subsystem>`, set and cleared through the same set and remove endpoints; a rule whose
      subsystem its project no longer declares is kept and shown labelled "subsystem not found".
    signature: >-
      adminListAssignments(sessionId: string, scopeKind?: ScopeKind, scopeId?: string, subjectKind?:
      AssignmentSubjectKind, subjectId?: string): list<PermissionAssignment>
    returns: list<PermissionAssignment>
    params:
      - name: sessionId
        type: string
      - name: scopeKind
        type: ScopeKind
        optional: true
      - name: scopeId
        type: string
        optional: true
      - name: subjectKind
        type: AssignmentSubjectKind
        optional: true
      - name: subjectId
        type: string
        optional: true
    endpoint:
      transport: HTTP
      method: GET
      path: /web/admin/permissions
  - name: adminSetAssignment
    description: Upsert a permission assignment; forwards to web_admin_orchestrator.setAssignment.
    signature: 'adminSetAssignment(sessionId: string, assignment: PermissionAssignment): PermissionAssignment'
    returns: PermissionAssignment
    params:
      - name: sessionId
        type: string
      - name: assignment
        type: PermissionAssignment
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/permissions
  - name: adminRemoveAssignment
    description: Remove a permission assignment; forwards to web_admin_orchestrator.removeAssignment.
    signature: 'adminRemoveAssignment(sessionId: string, assignmentId: string): void'
    returns: void
    params:
      - name: sessionId
        type: string
      - name: assignmentId
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/permissions/remove
  - name: adminBindRole
    description: Bind a role to a user at a scope; forwards to web_admin_orchestrator.bindRole.
    signature: >-
      adminBindRole(sessionId: string, userId: string, roleId: string, scopeKind?: ScopeKind,
      scopeId?: string): HostedUserRecord
    returns: HostedUserRecord
    params:
      - name: sessionId
        type: string
      - name: userId
        type: string
      - name: roleId
        type: string
      - name: scopeKind
        type: ScopeKind
        optional: true
      - name: scopeId
        type: string
        optional: true
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/roles/bind
  - name: adminUnbindRole
    description: Unbind a role from a user at a scope; forwards to web_admin_orchestrator.unbindRole.
    signature: >-
      adminUnbindRole(sessionId: string, userId: string, roleId: string, scopeKind?: ScopeKind,
      scopeId?: string): HostedUserRecord
    returns: HostedUserRecord
    params:
      - name: sessionId
        type: string
      - name: userId
        type: string
      - name: roleId
        type: string
      - name: scopeKind
        type: ScopeKind
        optional: true
      - name: scopeId
        type: string
        optional: true
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/roles/unbind
  - name: adminListGlobalPacks
    description: List server-global packs; forwards to project_ops_orchestrator.listGlobalPacks.
    signature: 'adminListGlobalPacks(sessionId: string): list<PackDescriptor>'
    returns: list<PackDescriptor>
    params:
      - name: sessionId
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/admin/packs
  - name: adminInstallGlobalPack
    description: >-
      Install a declarative pack server-wide; forwards to
      project_ops_orchestrator.installGlobalPack.
    signature: 'adminInstallGlobalPack(sessionId: string, name: string, content: string): PackDescriptor'
    returns: PackDescriptor
    params:
      - name: sessionId
        type: string
      - name: name
        type: string
      - name: content
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/packs
  - name: adminRemoveGlobalPack
    description: Remove a server-global pack; forwards to project_ops_orchestrator.removeGlobalPack.
    signature: 'adminRemoveGlobalPack(sessionId: string, name: string): void'
    returns: void
    params:
      - name: sessionId
        type: string
      - name: name
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/packs/remove
  - name: projectPacksList
    description: List one project's registered packs; forwards to project_ops_orchestrator.listProjectPacks.
    signature: 'projectPacksList(sessionId: string, project: string): list<PackDescriptor>'
    returns: list<PackDescriptor>
    params:
      - name: sessionId
        type: string
      - name: project
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/projects/packs
  - name: projectPackInstall
    description: >-
      Install a declarative pack into a project; forwards to
      project_ops_orchestrator.installProjectPack. The SPA's confirm step (the project packs view,
      web/src/views/ProjectOps.tsx — the SPA's views are not spec'd as View components, so the
      behaviour is stated on the routes it drives): before calling this route it calls
      projectPackImpact with the same name and content, shows the report — the pack's doctrine
      changes against wairon's defaults grouped by profile, the profiles that would govern, and the
      introduced, resolved and regraded findings with both totals — and calls this route only when
      the user confirms; cancelling writes nothing. This route itself stays a plain write, so a
      non-SPA client that skips the preview is an unattended write.
    signature: >-
      projectPackInstall(sessionId: string, project: string, name: string, content: string):
      PackDescriptor
    returns: PackDescriptor
    params:
      - name: sessionId
        type: string
      - name: project
        type: string
      - name: name
        type: string
      - name: content
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/projects/packs
  - name: projectPackRemove
    description: >-
      Remove one of a project's registered packs; forwards to
      project_ops_orchestrator.removeProjectPack. The SPA's confirm step calls
      projectPackRemovalImpact first, shows what the pack accounts for now (its doctrine and the
      findings that change once it no longer applies) and removes only on confirmation; cancelling
      writes nothing.
    signature: 'projectPackRemove(sessionId: string, project: string, name: string): void'
    returns: void
    params:
      - name: sessionId
        type: string
      - name: project
        type: string
      - name: name
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/projects/packs/remove
  - name: adminGetPackPolicy
    description: Read the instance pack/profile policy; forwards to project_ops_orchestrator.getPackPolicy.
    signature: 'adminGetPackPolicy(sessionId: string): InstancePackPolicy'
    returns: InstancePackPolicy
    params:
      - name: sessionId
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/admin/policy
  - name: adminSetPackPolicy
    description: Replace the instance pack/profile policy; forwards to project_ops_orchestrator.setPackPolicy.
    signature: 'adminSetPackPolicy(sessionId: string, policy: InstancePackPolicy): InstancePackPolicy'
    returns: InstancePackPolicy
    params:
      - name: sessionId
        type: string
      - name: policy
        type: InstancePackPolicy
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/policy
  - name: projectPolicyEvaluate
    description: >-
      Evaluate one project's pack/profile compliance; forwards to
      project_ops_orchestrator.evaluateProjectPolicy.
    signature: 'projectPolicyEvaluate(sessionId: string, projectId: string): PolicyEvaluationResult'
    returns: PolicyEvaluationResult
    params:
      - name: sessionId
        type: string
      - name: projectId
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/projects/policy
  - name: projectPolicyReconcile
    description: >-
      Reconcile one project against the instance pack policy; forwards to
      project_ops_orchestrator.reconcileProjectPolicy. A policy write the user triggers but does not
      choose the packs of: the SPA shows projectPolicyEvaluate's `impacts` (what reconcile would
      apply) beside the button, and after the call shows the result's `impacts` — what it applied.
    signature: 'projectPolicyReconcile(sessionId: string, projectId: string): PolicyEvaluationResult'
    returns: PolicyEvaluationResult
    params:
      - name: sessionId
        type: string
      - name: projectId
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/projects/policy/reconcile
  - name: projectProducersList
    description: >-
      List one project's configured producer targets; forwards to
      project_ops_orchestrator.listProducers.
    signature: 'projectProducersList(sessionId: string, project: string): list<ProducerConfig>'
