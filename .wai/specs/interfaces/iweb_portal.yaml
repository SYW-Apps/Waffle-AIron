  - name: projectCreate
    description: >-
      Create a hosted project from { id, unitId, profileSelection? } — the REQUIRED owner unit plus
      an optional profile selection; forwards to web_project_orchestrator.createProject, which
      routes through the policy-aware initialization.
    signature: 'projectCreate(request: HttpRequest): HttpResponse'
    returns: HttpResponse
    params:
