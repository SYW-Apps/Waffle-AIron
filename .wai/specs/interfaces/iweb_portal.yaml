      orchestrator (landscape:read).
    signature: 'adminGetLandscape(sessionId: string): LandscapeGraphModel'
    returns: LandscapeGraphModel
    params:
      - name: sessionId
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/admin/landscape
  - name: adminGetHealth
    description: The instance health report, forwarding to the operations orchestrator (operations:read).
    signature: 'adminGetHealth(sessionId: string): InstanceHealthReport'
    returns: InstanceHealthReport
    params:
      - name: sessionId
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/admin/health
  - name: adminGetUsage
    description: The resource usage snapshots, forwarding to the operations orchestrator (operations:read).
    signature: 'adminGetUsage(sessionId: string): list<ResourceUsageSnapshot>'
    returns: list<ResourceUsageSnapshot>
    params:
      - name: sessionId
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/admin/usage
  - name: adminListApprovals
    description: >-
      The approval requests pending in the caller's scope, forwarding to the project lifecycle
      orchestrator (approval:decide).
    signature: 'adminListApprovals(sessionId: string): list<ApprovalRequest>'
    returns: list<ApprovalRequest>
    params:
      - name: sessionId
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/admin/approvals
  - name: adminDecideApproval
    description: >-
      Decide a pending approval request, forwarding to the project lifecycle orchestrator. The
      decider is always the session's own principal, never a value the request supplies, and
      self-approval is refused where the decision is made.
    signature: 'adminDecideApproval(sessionId: string, decision: ApprovalDecision): ApprovalRequest'
    returns: ApprovalRequest
    params:
      - name: sessionId
        type: string
      - name: decision
        type: ApprovalDecision
    endpoint:
      transport: HTTP
      method: POST
      path: /web/admin/approvals/decide
  - name: serveProjectCanvasModel
    description: >-
      Serve one authorized project's canvas model as JSON — the data the web app's in-React canvas
      mounts directly. Forwards to the web graph orchestrator's getProjectCanvasModel;
      session-cookie authenticated, so cross-project access is Forbidden. For a project with members
      it is the family canvas: each member is a project node, carrying the member's record id only
      when the caller may read that record, and the app hands the engine an open-project hook so
      exactly those nodes open the member's own project page (a member the caller may not read is
      drawn unlinked). Each consumption edge carries its relation's health, read within the caller's
      reach; unavailable is never shown as ok.
    signature: 'serveProjectCanvasModel(sessionId: string, projectId: string): CanvasModel'
    returns: CanvasModel
    params:
      - name: sessionId
        type: string
      - name: projectId
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/canvas-model
  - name: serveProjectOpenApi
    description: >-
      Serve one authorized project's API explorer as HTML — its only public API directly, the index
      of them when it publishes several, or the one the `spec` query names. Forwards to the web
      graph orchestrator's getProjectOpenApi; session-cookie authenticated, so cross-project access
      is Forbidden.
    signature: 'serveProjectOpenApi(sessionId: string, projectId: string, portalId?: string): string'
    returns: string
    params:
      - name: sessionId
        type: string
      - name: projectId
        type: string
      - name: portalId
        type: string
        description: The public portal whose API to show, from the `spec` query
        optional: true
    endpoint:
      transport: HTTP
      method: GET
      path: /web/openapi
  - name: projectPackImpact
    description: >-
      Measure, writing nothing, what installing (content given) or adopting (content omitted) a
      declarative pack would change on a project; forwards to
      project_ops_orchestrator.previewProjectPack. The web UI shows it before projectPackInstall /
      projectPackAdopt and asks to apply.
    signature: >-
      projectPackImpact(sessionId: string, project: string, name: string, content?: string):
      PackImpact
    returns: PackImpact
    params:
      - name: sessionId
        type: string
      - name: project
        type: string
      - name: name
        type: string
      - name: content
        type: string
        optional: true
    endpoint:
      transport: HTTP
      method: POST
      path: /web/projects/packs/impact
    guarantees:
      - idempotent
  - name: projectPackRemovalImpact
    description: >-
      Measure, writing nothing, what removing one of a project's registered packs would change;
      forwards to project_ops_orchestrator.previewProjectPackRemoval. The web UI shows it before
      projectPackRemove and asks to remove.
    signature: 'projectPackRemovalImpact(sessionId: string, project: string, name: string): PackImpact'
    returns: PackImpact
    params:
      - name: sessionId
        type: string
      - name: project
        type: string
      - name: name
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /web/projects/packs/removal-impact
    guarantees:
      - idempotent
  - name: projectExternalsStatus
    description: >-
      Serve one authorized project's relation health as JSON: its externals status, one entry per
      external (the pin compared with the live producer at signature level; unavailable is never a
      pass). Forwards to the web graph orchestrator's getProjectExternals; session-cookie
      authenticated, so cross-project access is Forbidden. Its reach is the caller's listed projects
      — the web project orchestrator's scoped list, which holds every project the caller may read,
      write or administer, not only read: the family above the project is read when the family root
      is in that list, and a source.hosted producer when its record is. The SPA renders it on the
      project page's Relations tab, one row per external with its health and reason — the same word
      the canvas's edges carry.
    signature: 'projectExternalsStatus(sessionId: string, projectId: string): list<ExternalStatus>'
    returns: list<ExternalStatus>
    params:
      - name: sessionId
        type: string
      - name: projectId
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /web/projects/externals
  - name: adminExplainPermission
    description: >-
      Explain one user's effective permission for a capability at a unit, project or subsystem scope
      — the value, its source and the rung that decided it ("why can or can't they"); forwards to
      web_admin_orchestrator.explainPermission. Shown on the /admin/permissions grid as a check
      beside the grant form, not a new screen.
    signature: >-
      adminExplainPermission(sessionId: string, userId: string, capability: string, scopeKind:
      ScopeKind, scopeId?: string): EffectivePermission
    returns: EffectivePermission
    params:
