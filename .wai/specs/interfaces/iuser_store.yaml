id: iuser_store
name: User Store Interface
description: >-
  Private store contract for hosted user records. The store owns state only; callers should use
  user_repository unless they are the owned registry or index.
component: user_store
methods:
  - name: load
    description: Load all persisted hosted user records into the authoritative store representation.
    signature: 'load(): list<HostedUserRecord>'
    returns: list<HostedUserRecord>
    params: []
  - name: replaceAll
    description: >-
      Replace the store contents with the supplied complete user-record set after persistence has
      succeeded.
    signature: 'replaceAll(records: list<HostedUserRecord>): void'
    returns: void
    params:
      - name: records
        type: list<HostedUserRecord>
status: complete
