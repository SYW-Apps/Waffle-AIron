id: ilocal_admin_portal
name: Local Admin Portal Interface
description: >-
  In-process administration contract published to sdd_cli. Each method is the owning workflow
  itself, forwarded by identity; the credential is whatever the caller holds (null when none is
  configured) and the workflow authenticates and authorizes it, refusing with the admin plane's
  authorization failure. The host configuration is wiring the caller supplies ahead of the
  contract's own parameters.
component: local_admin_portal
methods:
  - name: createProject
    description: >-
      Provision a hosted project placed in an organization unit (the caller needs project:create
      over it).
    signature: 'createProject(credential: string | null, id: string, unitId: string): HostedProjectRecord'
    returns: HostedProjectRecord
    params:
      - name: credential
        type: string | null
      - name: id
        type: string
      - name: unitId
        type: string
  - name: destroyProject
    description: Tear a hosted project down (project:admin over it).
    signature: 'destroyProject(credential: string | null, id: string): void'
    returns: void
    params:
      - name: credential
        type: string | null
      - name: id
        type: string
  - name: listProjects
    description: List every hosted project (master credential).
    signature: 'listProjects(credential: string | null): HostedProjectRecord[]'
    returns: HostedProjectRecord[]
    params:
      - name: credential
        type: string | null
  - name: lockProject
    description: >-
      Record the state-scoped lock for a project; refuses a tree that does not validate as complete
      with the lock's validation failure.
    signature: 'lockProject(credential: string | null, project: string): LockRecord'
    returns: LockRecord
    params:
      - name: credential
        type: string | null
      - name: project
        type: string
  - name: mintKey
    description: Mint a project API key for a role; the key is shown once.
    signature: 'mintKey(credential: string | null, project: string, role: string): string'
    returns: string
    params:
      - name: credential
        type: string | null
      - name: project
        type: string
      - name: role
        type: string
  - name: revokeKey
    description: Revoke an API key by id.
    signature: 'revokeKey(credential: string | null, id: string): void'
    returns: void
    params:
      - name: credential
        type: string | null
      - name: id
        type: string
  - name: listKeys
    description: List a project's API keys (metadata only).
    signature: 'listKeys(credential: string | null, project: string): ApiKeyRecord[]'
    returns: ApiKeyRecord[]
    params:
      - name: credential
        type: string | null
      - name: project
        type: string
  - name: configureProducer
    description: Configure a producer target (Notion or Miro) for a project.
    signature: >-
      configureProducer(credential: string | null, project: string, target: string, parentPageId:
      string): void
    returns: void
    params:
      - name: credential
        type: string | null
      - name: project
        type: string
      - name: target
        type: string
      - name: parentPageId
        type: string
  - name: produceProducer
    description: Run a configured producer target for a project.
    signature: 'produceProducer(credential: string | null, project: string, target: string): void'
    returns: void
    params:
      - name: credential
        type: string | null
      - name: project
        type: string
      - name: target
        type: string
  - name: removeProducer
    description: Remove a producer target from a project.
    signature: 'removeProducer(credential: string | null, project: string, target: string): void'
    returns: void
    params:
      - name: credential
        type: string | null
      - name: project
        type: string
      - name: target
        type: string
  - name: listProducers
    description: List a project's configured producer targets.
    signature: 'listProducers(credential: string | null, project: string): ProducerConfig[]'
    returns: ProducerConfig[]
    params:
      - name: credential
        type: string | null
      - name: project
        type: string
  - name: setSecret
    description: Set an integration secret at runtime (master credential).
    signature: 'setSecret(credential: string | null, key: string, value: string): void'
    returns: void
    params:
      - name: credential
        type: string | null
      - name: key
        type: string
      - name: value
        type: string
  - name: listSecrets
    description: List configured secret key names, never values (master credential).
    signature: 'listSecrets(credential: string | null): string[]'
    returns: string[]
    params:
      - name: credential
        type: string | null
  - name: enableGit
    description: Bind a project to a git remote, optionally with its own access token.
    signature: >-
      enableGit(credential: string | null, project: string, remote: string, branch: string, pat?:
      string): HostedProjectRecord
    returns: HostedProjectRecord
    params:
      - name: credential
        type: string | null
      - name: project
        type: string
      - name: remote
        type: string
      - name: branch
        type: string
      - name: pat
        type: string
        optional: true
  - name: disableGit
    description: Remove a project's git binding.
    signature: 'disableGit(credential: string | null, project: string): void'
    returns: void
    params:
      - name: credential
        type: string | null
      - name: project
        type: string
  - name: syncGit
    description: Synchronize a git-backed project with its remote.
    signature: 'syncGit(credential: string | null, project: string): void'
    returns: void
    params:
      - name: credential
        type: string | null
      - name: project
        type: string
  - name: commitProject
    description: Commit and publish a project's specs (or one chained subsystem's) to its git remote.
    signature: >-
      commitProject(credential: string | null, project: string, subsystem?: string, message?:
      string): GitPublish
    returns: GitPublish
    params:
      - name: credential
        type: string | null
      - name: project
        type: string
      - name: subsystem
        type: string
        optional: true
      - name: message
        type: string
        optional: true
  - name: getGitBinding
    description: Read a project's git binding and sync status.
    signature: 'getGitBinding(credential: string | null, project: string): GitBackingStatus'
    returns: GitBackingStatus
    params:
      - name: credential
        type: string | null
      - name: project
        type: string
  - name: configureGitSync
    description: Configure a project's periodic git sync.
    signature: >-
      configureGitSync(credential: string | null, project: string, periodicSyncMinutes?: number,
      skipIfClean?: boolean): void
    returns: void
    params:
      - name: credential
        type: string | null
      - name: project
        type: string
      - name: periodicSyncMinutes
        type: number
        optional: true
      - name: skipIfClean
        type: boolean
        optional: true
  - name: listGlobalPacks
    description: List the instance's installed extension packs.
    signature: 'listGlobalPacks(credential: string | null): PackDescriptor[]'
    returns: PackDescriptor[]
    params:
      - name: credential
        type: string | null
  - name: installGlobalPack
    description: Install a declarative extension pack instance-wide.
    signature: 'installGlobalPack(credential: string | null, name: string, content: string): PackDescriptor'
    returns: PackDescriptor
    params:
      - name: credential
        type: string | null
      - name: name
        type: string
      - name: content
        type: string
  - name: removeGlobalPack
    description: Remove an instance-wide extension pack.
    signature: 'removeGlobalPack(credential: string | null, name: string): void'
    returns: void
    params:
      - name: credential
        type: string | null
      - name: name
        type: string
  - name: listProjectPacks
    description: List a project's extension packs.
    signature: 'listProjectPacks(credential: string | null, project: string): PackDescriptor[]'
    returns: PackDescriptor[]
    params:
      - name: credential
        type: string | null
      - name: project
        type: string
  - name: installProjectPack
    description: Install a declarative extension pack into one project.
    signature: >-
      installProjectPack(credential: string | null, project: string, name: string, content: string):
      PackDescriptor
    returns: PackDescriptor
    params:
      - name: credential
        type: string | null
      - name: project
        type: string
      - name: name
        type: string
      - name: content
        type: string
  - name: removeProjectPack
    description: Remove an extension pack from one project.
    signature: 'removeProjectPack(credential: string | null, project: string, name: string): void'
    returns: void
    params:
      - name: credential
        type: string | null
      - name: project
        type: string
      - name: name
        type: string
  - name: setAssignment
    description: Create or replace a permission assignment over a scope.
    signature: >-
      setAssignment(credential: string | null, assignment: PermissionAssignment):
      PermissionAssignment
    returns: PermissionAssignment
    params:
      - name: credential
        type: string | null
      - name: assignment
        type: PermissionAssignment
  - name: removeAssignment
    description: Remove a permission assignment by id.
    signature: 'removeAssignment(credential: string | null, assignmentId: string): void'
    returns: void
    params:
      - name: credential
        type: string | null
      - name: assignmentId
        type: string
  - name: listAssignments
    description: List permission assignments, optionally narrowed by scope and subject.
    signature: >-
      listAssignments(credential: string | null, scopeKind?: string, scopeId?: string, subjectKind?:
      string, subjectId?: string): PermissionAssignment[]
    returns: PermissionAssignment[]
    params:
      - name: credential
        type: string | null
      - name: scopeKind
        type: string
        optional: true
      - name: scopeId
        type: string
        optional: true
      - name: subjectKind
        type: string
        optional: true
      - name: subjectId
        type: string
        optional: true
  - name: existingProjectRoot
    description: >-
      The root path of the project registered under an id, or null — the existence check `wairon
      host demo` makes before it reseeds. A read through the project repository's read face.
    signature: 'existingProjectRoot(id: string): string | null'
    returns: string | null
    params:
      - name: id
        type: string
  - name: registerLocalDevProject
    description: >-
      Register the local development server's project at the developer's working directory; admitted
      only for a development-mode configuration.
    signature: 'registerLocalDevProject(id: string, rootPath: string): HostedProjectRecord'
    returns: HostedProjectRecord
    params:
      - name: id
        type: string
      - name: rootPath
        type: string
  - name: seedIdentityProviderSecret
    description: >-
      Boot-time seeding of the default identity provider's client secret from the server process's
      own environment; answers the fixed reference, or null when nothing was shipped.
    signature: 'seedIdentityProviderSecret(): string | null'
    returns: string | null
    params: []
status: complete
