id: icli_migration_adapter
name: CLI Migration Client Adapter Interface
description: One forward per migration_portal method.
component: cli_migration_adapter
methods:
  - name: plan
    description: Forward to migration_portal.plan.
    signature: 'plan(request: MigrationRequest): MigrationPlan'
    returns: MigrationPlan
    params:
      - name: request
        type: MigrationRequest
        description: The verb and its arguments
  - name: apply
    description: Forward to migration_portal.apply.
    signature: 'apply(plan: MigrationPlan): FamilyMigrationReport'
    returns: FamilyMigrationReport
    params:
      - name: plan
        type: MigrationPlan
        description: The confirmed plan
  - name: discard
    description: Forward to migration_portal.discard.
    signature: 'discard(plan: MigrationPlan): void'
    returns: void
    params:
      - name: plan
        type: MigrationPlan
        description: The plan
  - name: recover
    description: Forward to migration_portal.recover.
    signature: 'recover(root: string, fix: bool): list<RecoveredTransaction>'
    returns: list<RecoveredTransaction>
    params:
      - name: root
        type: string
        description: The project root
      - name: fix
        type: bool
        description: Resolve, or only report
  - name: matchPositions
    description: Forward to migration_portal.matchPositions.
    signature: >-
      matchPositions(unresolved: list<AuthoredReference>, family: ProjectFamily, tables:
      list<ResolvedExportTable>, types: list<TypeSpec>): list<PositionalMatch>
    returns: list<PositionalMatch>
    params:
      - name: unresolved
        type: list<AuthoredReference>
        description: The references to read
      - name: family
        type: ProjectFamily
        description: The family top's graph
      - name: tables
        type: list<ResolvedExportTable>
        description: Every project's resolved L0 export table
      - name: types
        type: list<TypeSpec>
        description: Every type the family top's scan loaded
status: complete
createdAt: '2026-09-30T20:37:31.884Z'
updatedAt: '2026-10-04T10:18:36.612Z'
