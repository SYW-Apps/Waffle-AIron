id: iquota_rules
name: Quota Rules Interface
description: >-
  Contract for advisory evaluation of hosted resource usage against quota policy. Evaluation is
  observational only.
component: quota_rules
methods:
  - name: evaluateUsage
    description: >-
      Evaluate resource usage snapshots against the advisory ResourceQuotaPolicy and return them
      annotated with observe/warn quota messages, labelled by the policy's mode. Advisory only:
      never blocks or throttles.
    signature: >-
      evaluateUsage(snapshots: list<ResourceUsageSnapshot>, policy: ResourceQuotaPolicy):
      list<ResourceUsageSnapshot>
    returns: list<ResourceUsageSnapshot>
    params:
      - name: snapshots
        type: list<ResourceUsageSnapshot>
      - name: policy
        type: ResourceQuotaPolicy
status: complete
