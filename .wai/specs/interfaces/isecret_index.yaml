id: isecret_index
name: Secret Index Interface
description: >-
  Read-face contract of the secret repository: key names for listings, and one value by key for the
  integration that presents it.
component: secret_index
methods:
  - name: list
    description: List the configured secret key names (never the values).
    signature: 'list(): string[]'
    returns: string[]
  - name: resolve
    description: >-
      The value stored under a key, else the first of its environment fallbacks that is set, else
      null. The one read that answers a value — for the integration that presents that credential,
      never for a listing.
    signature: 'resolve(key: string): string | null'
    returns: string | null
    params:
      - name: key
        type: string
        description: The secret key, e.g. git-token or notion-token
status: complete
createdAt: '2026-07-19T08:59:21.174Z'
updatedAt: '2026-09-25T21:12:08.115Z'
