id: isecret_index
name: Secret Index Interface
description: >-
  Read-face contract of the secret repository: key names for listings (never values), and one value
  by key for the host workflow that hands it to the call it authorizes.
component: secret_index
methods:
  - name: list
    description: List the configured secret key names (never the values).
    signature: 'list(): string[]'
    returns: string[]
  - name: resolve
    description: >-
      The value stored under a key, else the first of its environment fallbacks that is set, else
      null. The one read that answers a value — for the host workflow that passes it, as an
      argument, to the call it authorizes; never for a listing.
    signature: 'resolve(key: string): string | null'
    returns: string | null
    params:
      - name: key
        type: string
        description: The secret key, e.g. git-token or notion-token
  - name: resolveGit
    description: >-
      The git token for one connection: the value under its own credential ref first, when it names
      one and it is set, then the shared git-token; null when neither is set.
    signature: 'resolveGit(credentialRef?: string | null): string | null'
    returns: string | null
    params:
      - name: credentialRef
        type: string | null
        description: The connection's own secret key, if it has one.
        optional: true
status: complete
createdAt: '2026-07-19T08:59:21.174Z'
updatedAt: '2026-10-03T17:57:45.013Z'
