id: ivalidator_core_adapter
name: Validator Core Adapter Interface
description: Adapter contract for validator to load specs from core portal.
component: validator_core_adapter
methods:
  - name: loadSystemSpec
    description: Loads the system spec via core portal
    signature: 'loadSystemSpec(): SystemSpec | null'
    returns: SystemSpec | null
  - name: loadSubsystemSpecs
    description: Loads subsystem specs via core portal
    signature: 'loadSubsystemSpecs(): SubsystemSpec[]'
    returns: SubsystemSpec[]
  - name: loadComponentSpecs
    description: Loads component specs via core portal
    signature: 'loadComponentSpecs(): ComponentSpec[]'
    returns: ComponentSpec[]
  - name: loadInterfaceSpecs
    description: Loads interface specs via core portal
    signature: 'loadInterfaceSpecs(): InterfaceSpec[]'
    returns: InterfaceSpec[]
  - name: loadImplementationSpecs
    description: Loads implementation specs via core portal
    signature: 'loadImplementationSpecs(): ImplementationSpec[]'
    returns: ImplementationSpec[]
  - name: loadTypeSpecs
    description: Loads type specs via core portal
    signature: 'loadTypeSpecs(): TypeSpec[]'
    returns: TypeSpec[]
  - name: dryRunSerializeSpecs
    description: >-
      Dry-runs every loaded spec through the writer relativization + schema pipeline via the core
      portal (no I/O), returning one issue per spec the writer would refuse — gives validate-time
      visibility of every write lock would reject. Accepts the validation run's scope predicate so
      scoped runs pay scoped cost.
    signature: 'dryRunSerializeSpecs(include?: (specId: string) => boolean): ValidationIssue[]'
    returns: ValidationIssue[]
status: complete
createdAt: '2026-06-19T12:00:00Z'
updatedAt: '2026-07-10T22:14:16.427Z'
