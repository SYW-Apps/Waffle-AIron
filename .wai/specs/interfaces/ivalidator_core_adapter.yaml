id: ivalidator_core_adapter
name: Validator Core Adapter Interface
description: Adapter contract for validator to load specs from core portal.
component: validator_core_adapter
methods:
  - name: loadSystemSpec
    description: Loads the system spec via core portal
    signature: 'loadSystemSpec(): SystemSpec | null'
    returns: SystemSpec | null
  - name: loadSubsystemSpecs
    description: Loads subsystem specs via core portal
    signature: 'loadSubsystemSpecs(): SubsystemSpec[]'
    returns: SubsystemSpec[]
  - name: loadComponentSpecs
    description: Loads component specs via core portal
    signature: 'loadComponentSpecs(): ComponentSpec[]'
    returns: ComponentSpec[]
  - name: loadInterfaceSpecs
    description: Loads interface specs via core portal
    signature: 'loadInterfaceSpecs(): InterfaceSpec[]'
    returns: InterfaceSpec[]
  - name: loadImplementationSpecs
    description: Loads implementation specs via core portal
    signature: 'loadImplementationSpecs(): ImplementationSpec[]'
    returns: ImplementationSpec[]
  - name: loadTypeSpecs
    description: Loads type specs via core portal
    signature: 'loadTypeSpecs(): TypeSpec[]'
    returns: TypeSpec[]
  - name: dryRunSerializeSpecs
    description: >-
      Dry-runs every loaded spec through the writer relativization + schema pipeline via the core
      portal (no I/O), returning one issue per spec the writer would refuse — gives validate-time
      visibility of every write lock would reject. Accepts the validation run's scope predicate so
      scoped runs pay scoped cost.
    signature: 'dryRunSerializeSpecs(include?: (specId: string) => boolean): ValidationIssue[]'
    returns: ValidationIssue[]
  - name: loadProjectExtensions
    description: >-
      Load the governing extension packs (global then project) via the core portal, returning the
      merged LoadedExtensions the validator uses for pack rules, profiles, languages, and pattern
      definitions.
    signature: 'loadProjectExtensions(): LoadedExtensions'
    returns: LoadedExtensions
    params: []
  - name: loadProjectConfig
    description: >-
      The bound project's configuration, or null when it has none. Forwarded to the core portal;
      validation reads its rule severities, including a parent project's when resolving through the
      parent.
    signature: 'loadProjectConfig(): ProjectConfig | null'
    returns: ProjectConfig | null
    params: []
    guarantees:
      - idempotent
  - name: computeStateId
    description: 'Forward to core_portal.computeStateId: the spec tree''s content identity'
    signature: 'computeStateId(): StateId'
    returns: StateId
    params: []
  - name: consumedContractInputs
    description: >-
      Forward to core_portal.consumedContractInputs: the consumed contract inputs a verdict can
      consult
    signature: 'consumedContractInputs(): string[]'
    returns: string[]
    params: []
  - name: resolveChainingParent
    description: >-
      Forward to spec_tree_portal.resolveChainingParent: the parent that mounts the bound root,
      within the request's reach
    signature: 'resolveChainingParent(): ChainingParentRef | null'
    returns: ChainingParentRef | null
    params: []
  - name: findChainingParent
    description: >-
      Forward to spec_tree_portal.findChainingParent: the parent mounting a named root, below a
      ceiling. Not reach-gated — the validator gates on the request's reach itself before it walks
    signature: 'findChainingParent(childRoot: string, ceiling?: string): ChainingParentRef | null'
    returns: ChainingParentRef | null
    params:
      - name: childRoot
        type: string
      - name: ceiling
        type: string
        optional: true
  - name: settledSpecPaths
    description: >-
      Forward to approval_portal.settledSpecPaths: the spec files unchanged since the approval, or
      null when the tree was never approved
    signature: 'settledSpecPaths(root?: string): Set<string> | null'
    returns: Set<string> | null
    params:
      - name: root
        type: string
        optional: true
  - name: getLoaderIssues
    description: 'Forward to spec_tree_portal.getLoaderIssues: the loader''s diagnostics for the tree just read'
    signature: 'getLoaderIssues(): ValidationIssue[]'
    returns: ValidationIssue[]
    params: []
  - name: clearLoaderIssues
    description: >-
      Forward to spec_tree_portal.clearLoaderIssues: start the run's read from disk with no stale
      diagnostics
    signature: 'clearLoaderIssues(): void'
    returns: void
    params: []
  - name: scanAllSpecs
    description: >-
      Forward to spec_tree_portal.scanAllSpecs: set the run's recursion depth, and read the index
      relating each spec to its file
    signature: 'scanAllSpecs(options?: SpecScanOptions): SpecIndex'
    returns: SpecIndex
    params:
      - name: options
        type: SpecScanOptions
        optional: true
  - name: loadProjectVariants
    description: >-
      Forward to extension_portal.loadProjectVariants: the variant registry the variant rules judge
      against
    signature: 'loadProjectVariants(): VariantDef[]'
    returns: VariantDef[]
    params: []
status: complete
createdAt: '2026-06-19T12:00:00Z'
updatedAt: '2026-09-25T21:09:18.037Z'
