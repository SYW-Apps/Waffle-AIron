id: ipinned_externals_store
name: Pinned Externals Store Interface
description: >-
  Read-through state contract for the pinned-externals aggregate at the bound root: the lock and the
  snapshots it names.
component: pinned_externals_store
methods:
  - name: readLock
    description: >-
      The lock at the bound root, or null when none was written. A malformed lock is an error, never
      an empty lock.
    signature: 'readLock(): ExternalsLock?'
    returns: ExternalsLock?
    params: []
    effect: read
  - name: writeLock
    description: Replace the lock at the bound root.
    signature: 'writeLock(lock: ExternalsLock): void'
    returns: void
    params:
      - name: lock
        type: ExternalsLock
    effect: write
  - name: readSnapshot
    description: The pinned snapshot for an alias, or null when none is stored.
    signature: 'readSnapshot(alias: string): SurfaceSnapshot?'
    returns: SurfaceSnapshot?
    params:
      - name: alias
        type: string
    effect: read
  - name: writeSnapshot
    description: Replace the pinned snapshot for an alias.
    signature: 'writeSnapshot(alias: string, snapshot: SurfaceSnapshot): void'
    returns: void
    params:
      - name: alias
        type: string
      - name: snapshot
        type: SurfaceSnapshot
    effect: write
  - name: removeSnapshot
    description: Remove the pinned snapshot for an alias; whether one existed.
    signature: 'removeSnapshot(alias: string): bool'
    returns: bool
    params:
      - name: alias
        type: string
    effect: write
  - name: readExcerpt
    description: A part's pinned parent excerpt, or null.
    signature: 'readExcerpt(project: string): ParentExcerpt?'
    returns: ParentExcerpt?
    params:
      - name: project
        type: string
        description: The parent's project id
    effect: read
  - name: writeExcerpt
    description: Replace a part's pinned parent excerpt.
    signature: 'writeExcerpt(excerpt: ParentExcerpt): void'
    returns: void
    params:
      - name: excerpt
        type: ParentExcerpt
        description: The excerpt
    effect: write
status: complete
createdAt: '2026-09-26T17:47:50.203Z'
updatedAt: '2026-10-04T10:19:14.946Z'
