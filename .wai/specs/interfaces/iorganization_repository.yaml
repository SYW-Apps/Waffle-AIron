id: iorganization_repository
name: Organization Repository Interface
description: Facade contract for hosted organization units and project placements.
component: organization_repository
methods:
  - name: listUnits
    description: List organization units, optionally below a parent unit.
    signatureFrom: organization_index.listUnits
  - name: placeProject
    description: Create or update a project placement inside an organization unit.
    signatureFrom: organization_registry.placeProject
    guarantees:
      - atomic
  - name: listPlacements
    description: List project placements by project id or organization unit id.
    signatureFrom: organization_index.listPlacements
  - name: getUnit
    description: Return one organization unit by id, or null when absent.
    signatureFrom: organization_index.getUnit
  - name: createUnit
    description: >-
      Facade: create one organization unit through the registry (qualified-id computation and
      collision rejection happen there).
    signatureFrom: organization_registry.createUnit
    guarantees:
      - atomic
  - name: updateUnit
    description: >-
      Facade: update one organization unit's metadata through the registry (slug/parent changes are
      rejected there — use reparentUnit).
    signatureFrom: organization_registry.updateUnit
    guarantees:
      - atomic
  - name: reparentUnit
    description: >-
      Facade: move a unit's subtree under a new parent through the registry, returning the old->new
      qualified-id remap for every moved unit.
    signatureFrom: organization_registry.reparentUnit
    guarantees:
      - atomic
  - name: deleteUnit
    description: 'Facade: delete one empty organization unit through the registry.'
    signatureFrom: organization_registry.deleteUnit
  - name: deletePlacement
    description: 'Facade: remove one project placement through the registry.'
    signatureFrom: organization_registry.deletePlacement
status: complete
createdAt: '2026-07-08T21:13:09.955Z'
updatedAt: '2026-10-03T21:09:56.240Z'
