id: ihost_git_adapter
name: Host Git Client Adapter Interface
description: >-
  Client contract for the sdd_git subsystem's published git portal, bound to the CURRENT project
  root. Commits are SCOPED: staging confines to .wai/ (or a finer subpath) so a bound REAL
  repository shared with the project's own codebase is never clobbered — never `git add -A`.
component: host_git_adapter
methods:
  - name: enable
    description: >-
      Enable git backing for the bound project, handing the git portal the token the host resolved
      for the clone.
    signature: 'enable(remote: string, branch: string, token: string | null, credentialRef?: string): void'
    returns: void
    params:
      - name: remote
        type: string
      - name: branch
        type: string
      - name: token
        type: string | null
        description: The token the host resolved from its own secret repository; null when none is stored
      - name: credentialRef
        type: string
        optional: true
  - name: disable
    description: Disable git backing.
    signature: 'disable(): void'
    returns: void
  - name: sync
    description: Sync the default branch into the working branch (no-op if native).
    signature: 'sync(): void'
    returns: void
  - name: publish
    description: >-
      Stage ONLY the scoped pathspecs (default ['.wai/'] — never the whole tree), commit them as one
      commit with the given message, and push to the bound remote (commit = local save, push = the
      actual backup; both happen). Called at a family root's repository root: a family root commits
      ['.wai/'], a member its own ['<path>/.wai/'], a family migration every touched project's
      pathspec at once. A no-op returning a clean outcome when nothing under the pathspecs changed.
    signature: 'publish(message: string, subpaths?: string[]): GitPublish'
    returns: GitPublish
    params:
      - name: message
        type: string
      - name: subpaths
        type: string[]
        description: >-
          Pathspecs relative to the repository root; defaults to ['.wai/'] — a subsystem commit
          passes ['<project .wai>/specs/<subsystem>/'].
        optional: true
  - name: status
    description: >-
      The project's git-backing status: bound remote/branch, the periodic-sync setting, and whether
      the .wai/ tree carries unpublished changes (scoped dirtiness, never the whole working tree).
      Returns enabled:false when no repository is bound.
    signature: 'status(): GitBackingStatus'
    returns: GitBackingStatus
    params: []
  - name: configureSync
    description: >-
      Persist the project's periodic-sync setting (interval minutes + skip-if-clean) into its
      git-backing config; an absent interval disables periodic sync for this project.
    signature: 'configureSync(periodicSyncMinutes?: number, skipIfClean?: boolean): void'
    returns: void
    params:
      - name: periodicSyncMinutes
        type: number
        optional: true
      - name: skipIfClean
        type: boolean
        optional: true
status: complete
