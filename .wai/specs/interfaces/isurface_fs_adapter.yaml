id: isurface_fs_adapter
name: Surface FS Adapter Interface
description: File I/O for this project's own .wai/surfaces/ aggregate.
component: surface_fs_adapter
methods:
  - name: readAllSnapshots
    description: Parse every snapshot file under .wai/surfaces/ (missing dir yields empty).
    signature: 'readAllSnapshots(): list<SurfaceSnapshot>'
    returns: list<SurfaceSnapshot>
    params: []
  - name: writeSnapshot
    description: Write/overwrite one snapshot file named by producing project; answers the file's path.
    signature: 'writeSnapshot(snapshot: SurfaceSnapshot): string'
    returns: string
    params:
      - name: snapshot
        type: SurfaceSnapshot
  - name: deleteSnapshot
    description: Remove a snapshot file; whether one existed.
    signature: 'deleteSnapshot(projectName: string): bool'
    returns: bool
    params:
      - name: projectName
        type: string
status: complete
