id: isurface_fs_adapter
name: Surface FS Adapter Interface
description: >-
  File I/O for this project's own .wai/surfaces/ aggregate and its pinned externals (.wai/externals/
  and .wai/externals.lock.yaml).
component: surface_fs_adapter
methods:
  - name: readAllSnapshots
    description: Parse every snapshot file under .wai/surfaces/ (missing dir yields empty).
    signature: 'readAllSnapshots(): SurfaceSnapshot[]'
    returns: SurfaceSnapshot[]
  - name: writeSnapshot
    description: Write/overwrite one snapshot file named by producing project.
    signature: 'writeSnapshot(snapshot: SurfaceSnapshot): void'
    returns: void
    params:
      - name: snapshot
        type: SurfaceSnapshot
  - name: deleteSnapshot
    description: Remove a snapshot file.
    signature: 'deleteSnapshot(projectName: string): boolean'
    returns: boolean
    params:
      - name: projectName
        type: string
  - name: readExternalsLock
    description: >-
      Parse .wai/externals.lock.yaml at the bound root; null when absent. A malformed lock is
      refused with a clear error, never read as empty — an empty lock would silently unpin
      everything.
    signature: 'readExternalsLock(): ExternalsLock | null'
    returns: ExternalsLock | null
    params: []
  - name: writeExternalsLock
    description: Write .wai/externals.lock.yaml, aliases sorted, overwriting it atomically.
    signature: 'writeExternalsLock(lock: ExternalsLock): void'
    returns: void
    params:
      - name: lock
        type: ExternalsLock
  - name: readExternalSnapshot
    description: Parse .wai/externals/<alias>.yaml; null when absent or malformed.
    signature: 'readExternalSnapshot(alias: string): SurfaceSnapshot | null'
    returns: SurfaceSnapshot | null
    params:
      - name: alias
        type: string
  - name: writeExternalSnapshot
    description: >-
      Write .wai/externals/<alias>.yaml, creating the directory when missing and overwriting
      atomically.
    signature: 'writeExternalSnapshot(alias: string, snapshot: SurfaceSnapshot): void'
    returns: void
    params:
      - name: alias
        type: string
      - name: snapshot
        type: SurfaceSnapshot
  - name: deleteExternalSnapshot
    description: Remove .wai/externals/<alias>.yaml and report whether a file existed.
    signature: 'deleteExternalSnapshot(alias: string): boolean'
    returns: boolean
    params:
      - name: alias
        type: string
status: complete
