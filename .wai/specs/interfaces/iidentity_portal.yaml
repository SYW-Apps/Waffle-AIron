id: iidentity_portal
name: Identity Portal Interface
description: >-
  Draft control-plane HTTP contract for user-bound token management, hosted user grants, and
  admin-only audit access.
component: identity_portal
methods:
  - name: mintToken
    description: Mint a user-bound MCP/API token from a TokenMintRequest; plaintext is returned once.
    signature: 'mintToken(credential: string, request: TokenMintRequest): string'
    returns: string
    params:
      - name: credential
        type: string
      - name: request
        type: TokenMintRequest
    endpoint:
      transport: HTTP
      method: POST
      path: /identity/tokens
  - name: revokeToken
    description: Revoke one hosted MCP/API token by id after authorization.
    signature: 'revokeToken(credential: string, tokenId: string): void'
    returns: void
    params:
      - name: credential
        type: string
      - name: tokenId
        type: string
    endpoint:
      transport: HTTP
      method: DELETE
      path: /identity/tokens/{id}
  - name: listUsers
    description: List hosted users or service principals, optionally filtered by project.
    signature: 'listUsers(credential: string, project: string): HostedUserRecord[]'
    returns: HostedUserRecord[]
    params:
      - name: credential
        type: string
      - name: project
        type: string
        optional: true
    endpoint:
      transport: HTTP
      method: GET
      path: /identity/users
  - name: replaceUserGrants
    description: Replace one hosted user's project grants after authorization.
    signature: >-
      replaceUserGrants(credential: string, userId: string, grants: ProjectGrant[]):
      HostedUserRecord
    returns: HostedUserRecord
    params:
      - name: credential
        type: string
      - name: userId
        type: string
      - name: grants
        type: ProjectGrant[]
    endpoint:
      transport: HTTP
      method: PUT
      path: /identity/users/{id}/grants
  - name: listAuditEvents
    description: Return admin-only redacted audit events matching the supplied query.
    signature: 'listAuditEvents(credential: string, query: AuditQuery): AuditEvent[]'
    returns: AuditEvent[]
    params:
      - name: credential
        type: string
      - name: query
        type: AuditQuery
    endpoint:
      transport: HTTP
      method: GET
      path: /identity/audit/events
  - name: pruneAuditEvents
    description: Apply the active audit retention policy and return the number of events pruned.
    signature: 'pruneAuditEvents(credential: string): number'
    returns: number
    params:
      - name: credential
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /identity/audit/prune
status: draft
