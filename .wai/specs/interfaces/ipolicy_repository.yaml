id: ipolicy_repository
name: Policy Repository Interface
description: >-
  Facade contract for durable hosted instance pack/profile enforcement policy and identity-provider
  (SSO) configuration. Hosted workflows read and replace the active InstancePackPolicy and manage
  the identity-provider collection through this repository instead of reaching into private policy
  storage blocks. Pure 1:1 forwarding: getPackPolicy and listIdentityProviders to the index;
  setPackPolicy, upsertIdentityProvider, and removeIdentityProvider to the registry. No logic lives
  on this facade.
component: policy_repository
methods:
  - name: getPackPolicy
    description: >-
      Forward to the index and return the active instance pack/profile policy, or null when none has
      ever been configured. Pure forwarding — the orchestrator substitutes the documented permissive
      default for a null result; no logic lives on this facade.
    signature: 'getPackPolicy(): InstancePackPolicy | null'
    returns: InstancePackPolicy | null
    params: []
  - name: setPackPolicy
    description: >-
      Forward to the registry to persist the supplied policy as the replacement active policy
      wholesale. Stamping (updatedAt) is the registry's job; updatedBy is supplied by the
      orchestrator from the authenticated caller. Returns the stored policy.
    signature: 'setPackPolicy(policy: InstancePackPolicy): InstancePackPolicy'
    returns: InstancePackPolicy
    params:
      - name: policy
        type: InstancePackPolicy
    guarantees:
      - atomic
  - name: listIdentityProviders
    description: >-
      Forward to the index and return every configured identity provider, or an empty list when none
      has been configured. Pure forwarding — no logic on this facade.
    signature: 'listIdentityProviders(): IdentityProviderConfig[]'
    returns: IdentityProviderConfig[]
    params: []
  - name: upsertIdentityProvider
    description: >-
      Forward to the registry to create or update one identity-provider configuration and return the
      stored config. The registry stamps updatedAt; the config carries a clientSecretRef that points
      at the host secret mechanism, never a raw client secret.
    signature: 'upsertIdentityProvider(config: IdentityProviderConfig): IdentityProviderConfig'
    returns: IdentityProviderConfig
    params:
      - name: config
        type: IdentityProviderConfig
    guarantees:
      - atomic
  - name: removeIdentityProvider
    description: >-
      Forward to the registry to remove one identity-provider configuration by id; the registry
      rejects an unknown id with a not-found error.
    signature: 'removeIdentityProvider(id: string): void'
    returns: void
    params:
      - name: id
        type: string
    guarantees:
      - atomic
status: complete
