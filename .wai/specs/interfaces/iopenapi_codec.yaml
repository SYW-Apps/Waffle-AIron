id: iopenapi_codec
name: OpenAPI Codec Interface
description: Bidirectional conversion between surface snapshots and OpenAPI 3.1 documents.
component: openapi_codec
methods:
  - name: fromOpenApi
    description: >-
      Decode a 3rd-party OpenAPI document into an authored-origin snapshot: operations become
      contract methods with endpoints, component schemas become the type closure, and every schema
      is read back into a canonical type expression (integer int, number float, an array list or
      with uniqueItems set, additionalProperties map, a null-admitting schema `T?`, a oneOf of $refs
      a union, string formats date, date-time and duration their primitives, a contentEncoding
      base64 string bytes). An operation's returns are read from its success response — the first
      2xx in code order, one with no JSON body (a 204) reading void — and, when it also declares a
      `default`, 4XX or 5XX response with a JSON body, as `result<T, E>` with E that body's type, so
      the error response a wairon document renders round-trips. A component carrying
      `x-wairon-signature` decodes back into a signature type with its params and returns, a named
      component of type string carrying `enum` into an enum type, a named component whose schema is
      one primitive's (no properties) into a named scalar holding it, so a wairon-rendered document
      round-trips; an inline anonymous enum on a parameter has no name to become a type and is read
      as string with a description listing its values; any other component is a data type. An http
      security scheme `custom` reads back as a custom auth.
    signature: 'fromOpenApi(document: string, projectName: string): SurfaceSnapshot'
    returns: SurfaceSnapshot
    params:
      - name: document
        type: string
      - name: projectName
        type: string
  - name: toOpenApiSet
    description: >-
      Render a snapshot's HTTP-transport entries as ONE OpenAPI 3.1 document per backing Portal:
      partition the entries by backing portal, render each portal over just its own entries (its own
      paths, securitySchemes and per-operation security, provenance — project, version/StateId — in
      its info block), and return the named set. One portal yields one spec; distinct portals are
      never merged. Every path is the Portal's basePath joined before the method's endpoint path
      (openApiPath), each placeholder in the `{name}` form whether the design wrote `{name}` or the
      Express idiom `:name`; the document names the basePath once more as x-wairon-base-path and
      declares no `servers` (deployment, which the design does not model). Two operations of one
      portal on the same verb and path (placeholders compared by position, as OpenAPI compares
      templated paths) are refused (OpenApiRouteCollisionError, naming both): a document holds one
      operation per path and verb, so one would otherwise be dropped from what reads as the whole
      surface. The parameter that IS the credential the Portal's auth scheme binds (credentialParam)
      is no parameter of the operation — the security scheme carries it — and is named under
      x-wairon-credential-param. Each other param goes where its endpoint carries it: named by a
      path placeholder, `in: path`, required; else `in: query` for a verb without a body, and for
      POST, PUT and PATCH the JSON body: the one object-typed param left IS the body (named under
      x-wairon-body-param), as a client sends it, and several params are the properties of a body
      object. Each operation answers the verb's conventional success code — 204 with no content when
      the method returns nothing (void, async void, a result whose success type is void), else 201
      Created for a POST that creates — a method whose effect is `lifecycle`, or one whose effect is
      undeclared, `write` or `io` and whose name says it creates (createOrder, placeOrder, signUp);
      never a method whose effect is `none` or `read` — and 200 otherwise (a POST that acts on an
      existing resource, a cancel or an archive, answers 200) — and a method returning `result<T,
      E>` also answers a `default` error response whose body is E's schema. A `custom` auth scheme
      becomes an apiKey scheme only where the design names its header or parameter (auth.name, with
      auth.in, default header); naming none, it is an http scheme `custom` carrying the design's
      description, and no header name is invented. The type closure becomes JSON-Schema components,
      every type read as its parsed canonical expression, never by pattern (primitives and formats,
      list, set, map, `T?` admitting null, a union oneOf its $refs, `async T` as T, a named type a
      $ref, an enum a string component with its values, a named scalar the schema of what it holds;
      a non-canonical position unconstrained with a description naming it). A type named
      `alias::name` resolves from that external's pinned snapshot (or that member project's surface
      as it exports it now) in the context and is rendered as `<alias>.<id>`, with the types it
      names inside its own producer's closure; without a pin it reads `Unresolved type`, never an
      invented shape. A signature type is a function type with no JSON form: no `type` constraint, a
      description saying so, and x-wairon-signature holding its params and returns. info.version is
      the context's declared version, else the snapshot's, else 0.0.0.
    signature: >-
      toOpenApiSet(snapshot: SurfaceSnapshot, context?: OpenApiRenderContext):
      list<NamedOpenApiSpec>
    returns: list<NamedOpenApiSpec>
    params:
      - name: snapshot
        type: SurfaceSnapshot
      - name: context
        type: OpenApiRenderContext
        description: The pinned externals a schema may name, and the project's declared version
        optional: true
  - name: recognizes
    description: >-
      Whether a body is an OpenAPI document: it parses as JSON or YAML into an object carrying a
      string `openapi` version. Lets a reader choose fromOpenApi over the native snapshot parse; a
      body that does not parse is not one.
    signature: 'recognizes(body: string): bool'
    returns: bool
    params:
      - name: body
        type: string
        description: The raw document body, JSON or YAML.
  - name: openApiPath
    description: >-
      The OpenAPI path of one endpoint: the basePath joined before the method's path, rooted at `/`,
      and every `/:name` placeholder respelled `/{name}` — `{name}` and the Express idiom `:name`
      are the same placeholder. Pure.
    signature: 'openApiPath(basePath: string?, endpointPath: string): string'
    returns: string
    params:
      - name: basePath
        type: string?
        description: The Portal's basePath, if any
      - name: endpointPath
        type: string
        description: The method's HTTP endpoint path
  - name: credentialParam
    description: >-
      The one string parameter of a method that is the credential its Portal's auth scheme binds, by
      name: for bearer, oauth2 and openIdConnect a token (token, bearerToken, accessToken,
      authToken, authorization, jwt, idToken …), for basic the credentials, for apiKey a param named
      like the scheme's key (`apiKey` for `X-API-Key`) — or none, always none without auth. What an
      operation leaves out of its parameters and body. Pure.
    signature: 'credentialParam(method: MethodSignature, auth: PortalAuth?): string?'
    returns: string?
    params:
      - name: method
        type: MethodSignature
      - name: auth
        type: PortalAuth?
status: complete
