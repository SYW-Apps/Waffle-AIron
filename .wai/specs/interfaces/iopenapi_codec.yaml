id: iopenapi_codec
name: OpenAPI Codec Interface
description: Bidirectional conversion between surface snapshots and OpenAPI 3.1 documents.
component: openapi_codec
methods:
  - name: toOpenApi
    description: >-
      Render a snapshot's HTTP-transport entries as an OpenAPI 3.1 document; the type closure
      becomes JSON-Schema components; provenance (project, version/StateId) lands in the info block.
      Every type is read as its parsed canonical expression, never by pattern: string, int
      (integer), float (number), bool (boolean); bytes a string with contentEncoding base64; date,
      datetime and duration strings of format date, date-time and duration; any no constraint; list
      an array, set an array with uniqueItems, map an object with additionalProperties of the
      value's schema; `T?` the schema admitting null (type [X, "null"], or anyOf with {type: "null"}
      around a $ref); a union of named types oneOf their $refs; `async T` the schema of T; a named
      type a $ref into the components; an enum a component of type string with its values as `enum`,
      their descriptions in its description. A position that is not canonical is documented as
      unconstrained with a description naming it, never as an invented object. A signature type is a
      function type, which no JSON value can carry, so it gets no invented JSON-Schema shape: its
      component carries no `type` constraint, a description saying it is a function type with no
      JSON form, and an `x-wairon-signature` extension holding its params (name, the type as wairon
      writes it and as a $ref or schema, optional) and returns (the same two forms) — honest to an
      OpenAPI reader, and complete for a wairon one. A wire operation whose param or return is typed
      by a signature therefore documents a value that cannot be sent; the codec renders it as it is
      rather than hiding it.
    signature: 'toOpenApi(snapshot: SurfaceSnapshot): string'
    returns: string
    params:
      - name: snapshot
        type: SurfaceSnapshot
    invokedBy:
      kind: sibling-subsystem
      caller: >-
        sdd_host's share/download portals render the shared single-document OpenAPI via this entry
        point — a sibling subsystem outside sdd_surfaces' modeled scope; within this subsystem the
        orchestrator renders via the per-portal toOpenApiSet.
  - name: fromOpenApi
    description: >-
      Decode a 3rd-party OpenAPI document into an authored-origin snapshot: operations become
      contract methods with endpoints, component schemas become the type closure, and every schema
      is read back into a canonical type expression (integer int, number float, an array list or
      with uniqueItems set, additionalProperties map, a null-admitting schema `T?`, a oneOf of $refs
      a union, string formats date, date-time and duration their primitives, a contentEncoding
      base64 string bytes). A component carrying `x-wairon-signature` decodes back into a signature
      type with its params and returns, a named component of type string carrying `enum` into an
      enum type, so a wairon-rendered document round-trips; an inline anonymous enum on a parameter
      has no name to become a type and is read as string with a description listing its values; any
      other component is a data type.
    signature: 'fromOpenApi(document: string, projectName: string): SurfaceSnapshot'
    returns: SurfaceSnapshot
    params:
      - name: document
        type: string
      - name: projectName
        type: string
  - name: toOpenApiSet
    description: >-
      Render a snapshot's HTTP-transport entries as ONE OpenAPI 3.1 document per backing public
      Portal: partition the entries by backing portal, render each portal over just its own entries
      (its own servers from basePath, its own securitySchemes and per-operation security), and
      return the named set. One portal yields one spec; distinct portals are never merged into a
      combined document. Signature types render as toOpenApi renders them (`x-wairon-signature`).
    signature: 'toOpenApiSet(snapshot: SurfaceSnapshot): NamedOpenApiSpec[]'
    returns: NamedOpenApiSpec[]
    params:
      - name: snapshot
        type: SurfaceSnapshot
  - name: recognizes
    description: >-
      Whether a body is an OpenAPI document: it parses as JSON or YAML into an object carrying a
      string `openapi` version. Lets a reader choose fromOpenApi over the native snapshot parse; a
      body that does not parse is not one.
    signature: 'recognizes(body: string): boolean'
    returns: boolean
    params:
      - name: body
        type: string
        description: The raw document body, JSON or YAML.
status: complete
