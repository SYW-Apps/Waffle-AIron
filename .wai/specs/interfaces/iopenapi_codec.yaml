id: iopenapi_codec
name: OpenAPI Codec Interface
description: Bidirectional conversion between surface snapshots and OpenAPI 3.1 documents.
component: openapi_codec
methods:
  - name: fromOpenApi
    description: >-
      Decode a 3rd-party OpenAPI document into an authored-origin snapshot: operations become
      contract methods with endpoints, component schemas become the type closure, and every schema
      is read back into a canonical type expression (integer int, number float, an array list or
      with uniqueItems set, additionalProperties map, a null-admitting schema `T?`, a oneOf of $refs
      a union, string formats date, date-time and duration their primitives, a contentEncoding
      base64 string bytes). A component carrying `x-wairon-signature` decodes back into a signature
      type with its params and returns, a named component of type string carrying `enum` into an
      enum type, a named component whose schema is one primitive's (no properties) into a named
      scalar holding it, so a wairon-rendered document round-trips; an inline anonymous enum on a
      parameter has no name to become a type and is read as string with a description listing its
      values; any other component is a data type.
    signature: 'fromOpenApi(document: string, projectName: string): SurfaceSnapshot'
    returns: SurfaceSnapshot
    params:
      - name: document
        type: string
      - name: projectName
        type: string
  - name: toOpenApiSet
    description: >-
      Render a snapshot's HTTP-transport entries as ONE OpenAPI 3.1 document per backing Portal:
      partition the entries by backing portal, render each portal over just its own entries (its own
      paths, securitySchemes and per-operation security, provenance — project, version/StateId — in
      its info block), and return the named set. One portal yields one spec; distinct portals are
      never merged. Every path is the Portal's basePath joined before the method's endpoint path
      (openApiPath), each placeholder in the `{name}` form whether the design wrote `{name}` or the
      Express idiom `:name`; the document names the basePath once more as x-wairon-base-path and
      declares no `servers` (deployment, which the design does not model). The parameter that IS the
      credential the Portal's auth scheme binds (credentialParam) is no parameter of the operation —
      the security scheme carries it — and is named under x-wairon-credential-param. Each other
      param goes where its endpoint carries it: named by a path placeholder, `in: path`, required;
      else `in: query` for a verb without a body and a JSON body property for POST, PUT and PATCH.
      The type closure becomes JSON-Schema components, every type read as its parsed canonical
      expression, never by pattern (primitives and formats, list, set, map, `T?` admitting null, a
      union oneOf its $refs, `async T` as T, a named type a $ref, an enum a string component with
      its values, a named scalar the schema of what it holds; a non-canonical position unconstrained
      with a description naming it). A type named `alias::name` resolves from that external's pinned
      snapshot in the context and is rendered as `<alias>.<id>`, with the types it names inside its
      own producer's closure; without a pin it reads `Unresolved type`, never an invented shape. A
      signature type is a function type with no JSON form: no `type` constraint, a description
      saying so, and x-wairon-signature holding its params and returns. info.version is the
      context's declared version, else the snapshot's, else 0.0.0.
    signature: >-
      toOpenApiSet(snapshot: SurfaceSnapshot, context?: OpenApiRenderContext):
      list<NamedOpenApiSpec>
    returns: list<NamedOpenApiSpec>
    params:
      - name: snapshot
        type: SurfaceSnapshot
      - name: context
        type: OpenApiRenderContext
        description: The pinned externals a schema may name, and the project's declared version
        optional: true
  - name: recognizes
    description: >-
      Whether a body is an OpenAPI document: it parses as JSON or YAML into an object carrying a
      string `openapi` version. Lets a reader choose fromOpenApi over the native snapshot parse; a
      body that does not parse is not one.
    signature: 'recognizes(body: string): bool'
    returns: bool
    params:
      - name: body
        type: string
        description: The raw document body, JSON or YAML.
  - name: openApiPath
    description: >-
      The OpenAPI path of one endpoint: the basePath joined before the method's path, rooted at `/`,
      and every `/:name` placeholder respelled `/{name}` — `{name}` and the Express idiom `:name`
      are the same placeholder. Pure.
    signature: 'openApiPath(basePath: string?, endpointPath: string): string'
    returns: string
    params:
      - name: basePath
        type: string?
        description: The Portal's basePath, if any
      - name: endpointPath
        type: string
        description: The method's HTTP endpoint path
  - name: credentialParam
    description: >-
      The one string parameter of a method that is the credential its Portal's auth scheme binds, by
      name: for bearer, oauth2 and openIdConnect a token (token, bearerToken, accessToken,
      authToken, authorization, jwt, idToken …), for basic the credentials, for apiKey a param named
      like the scheme's key (`apiKey` for `X-API-Key`) — or none, always none without auth. What an
      operation leaves out of its parameters and body. Pure.
    signature: 'credentialParam(method: MethodSignature, auth: PortalAuth?): string?'
    returns: string?
    params:
      - name: method
        type: MethodSignature
      - name: auth
        type: PortalAuth?
status: complete
