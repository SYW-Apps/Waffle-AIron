id: iexternal_producers
name: External Producers Interface
description: >-
  Contract for finding the producers of the bound project's declared externals through its family
  (parent, members, siblings), an explicit source.path, or — on a hosted instance — a source.hosted
  record id. Read-only in effect; the caller's binding is restored before it answers.
component: external_producers
methods:
  - name: resolveDeclared
    description: >-
      Every declared external of the bound project — and, since stage 8, every referenced project
      member it declares (a `../`, git or hosted source; role member) — bound to its producer:
      through the family graph, an explicit source.path, a source.git materialized in the fetch
      cache (an external at its ref's head, a member at its pinned commit), or the hosted record
      lookup within the request's reach; each with the project's usage of it by public name — mapped
      onto the live table for a family producer, counted by spelled name for any other — and whether
      the family was read whole. An external's source is read in either declared form (the location
      string or the object; see external_declaration.source), a `#<commit>` fixing its ref. Offline,
      nothing touches the network: a git external whose ref's head is not already known is bound
      unreachable with the reason "not compared offline — `wairon externals status` fetches it"; a
      referenced git member at its pinned commit still binds from the cache when the cache holds it.
      An unreachable producer is bound with its problem, never dropped: unavailable, never a pass.
    signature: 'resolveDeclared(offline?: bool): list<ExternalBinding>'
    returns: list<ExternalBinding>
    params:
      - name: offline
        type: bool
        description: >-
          Read no producer over the network (default false). Plain `validate` and `status` ask
          offline, so they stay fast and deterministic; `externals status` and `externals pin` do
          not
        optional: true
  - name: resolveCandidate
    description: >-
      One external declaration the bound project does NOT hold yet, bound to its producer exactly as
      the written one will be (project_family.bindExternal over the graph read from the highest root
      in reach, then git through the fetch cache and hosted through the record lookup) — so
      `externals add` checks the producer before it writes anything, and its dry run checks it too.
      No usage: nothing references the alias yet. Read-only; the caller's binding is restored.
    signature: 'resolveCandidate(alias: string, declaration: ExternalDeclaration): ExternalBinding'
    returns: ExternalBinding
    params:
      - name: alias
        type: string
        description: The alias the declaration would be written under
      - name: declaration
        type: ExternalDeclaration
        description: The normalized declaration, as it would be written
  - name: listConsumers
    description: >-
      The projects that consume the bound project, from its own root: the graph read at the highest
      root the reach-gated climb reaches, and for every other project in it that declares the bound
      project — as an external whose producer it binds to, or as a contained member — its id, key,
      root, alias, section, the public names its specs use (spec_loader.exportUsage) and the names
      it still writes that the producer no longer exports (broken). A project that composes the
      bound one as a MEMBER from a path no climb follows — a `../` sibling declared under `members:`
      — is a consumer too: the project roots in the folders enclosing the bound root and the highest
      root reached are read for a `members` entry whose path source resolves to the bound root, and
      every project of such a root's graph that declares the bound project is listed as the family's
      are (never on a hosted request, nor when the request's reach stops at its own root). With
      search folders, also every project root in (or directly under) them that declares the bound
      project as an external by a path source resolving to it or a git source naming its id — a
      sibling checkout outside the family — with the names it spells through that alias
      (spec_loader.pinnedUsage), marked found: search; and every root there that declares it as a
      member by a path source resolving to it, with every project of that root's graph that declares
      it (spec_loader.exportUsage), marked found: search. Read-only; a hosted request may not search
      folders (refused). Empty when nothing consumes it.
    signature: 'listConsumers(search?: list<string>): list<ExternalConsumer>'
    returns: list<ExternalConsumer>
    params:
      - name: search
        type: list<string>
        description: Folders to scan for consumers outside the family
        optional: true
  - name: approvedRevision
    description: >-
      The bound project's tree as it stood at a revision, materialized read-only in the fetch cache:
      the named ref (a branch, tag or commit), else the commit that last recorded its approval (the
      last commit to change .wai/lock.json). Throws naming why when the project is in no git work
      tree, the ref names no commit, or no approval was ever committed. No network: the repository
      is the local one.
    signature: 'approvedRevision(against?: string): approved_revision'
    returns: approved_revision
    params:
      - name: against
        type: string
        description: A git revision; the last committed approval when omitted
        optional: true
    effect: io
  - name: memberRevisions
    description: >-
      Each live member of the bound project — a contained member or a `../` sibling declared under
      `members`, read where it is stored and never pinned — with its root, the bound project's usage
      of it by public name (spec_loader.exportUsage) and its tree at the approval it is judged
      against, materialized read-only in the fetch cache: the commit that introduced the member
      approval the bound project's lock records for it (its composition subject), else the member's
      own last committed approval. A member in no git work tree, or whose approval no commit holds,
      comes back with no revision. Never on a hosted request (answers none). No network.
    signature: 'memberRevisions(): list<member_revision>'
    returns: list<member_revision>
    params: []
    effect: io
status: complete
