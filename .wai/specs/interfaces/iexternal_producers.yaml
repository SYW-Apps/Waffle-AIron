id: iexternal_producers
name: External Producers Interface
description: >-
  Contract for finding the producers of the bound project's declared externals through its family
  (parent, members, siblings), an explicit source.path, or — on a hosted instance — a source.hosted
  record id. Read-only in effect; the caller's binding is restored before it answers.
component: external_producers
methods:
  - name: resolveDeclared
    description: >-
      Every external the bound project declares, in declaration order, bound to its producer: a
      family producer found by id (or by the directory its source.path names) in the graph of the
      highest root the climb could reach, a path producer by its resolved directory, a hosted
      producer (source.hosted) by the root the hosting binding's record lookup answers for that id
      within the request's readable reach, or unresolved with the reason — a hosted source outside a
      hosted server, or out of reach, is unresolved as unavailable (the consumer is still judged
      against its pin, never passed). Each family producer carries the consumer's references into
      it, mapped onto its public names (used) or not (unexported). A project that declares nothing
      answers an empty list.
    signature: 'resolveDeclared(): ExternalBinding[]'
    returns: ExternalBinding[]
    params: []
status: complete
createdAt: '2026-09-26T17:43:52.033Z'
updatedAt: '2026-10-01T17:03:48.767Z'
