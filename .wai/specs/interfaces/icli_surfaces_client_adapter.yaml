id: icli_surfaces_client_adapter
name: CLI Surfaces Client Adapter Interface
description: CLI-side forwarding of surface commands to the surface portal.
component: cli_surfaces_client_adapter
methods:
  - name: exportSurface
    description: >-
      Forward export to the surface portal, including the optional portalId selecting one per-portal
      OpenAPI document.
    signature: >-
      exportSurface(maxAudience: string, format: string, outPath?: string, portalId?: string):
      SurfaceSnapshot
    returns: SurfaceSnapshot
    params:
      - name: maxAudience
        type: string
      - name: format
        type: string
      - name: outPath
        type: string
        optional: true
      - name: portalId
        type: string
        optional: true
  - name: importSurface
    description: Forward import to the surface portal.
    signature: 'importSurface(sourcePath: string, origin: string): SurfaceSnapshot'
    returns: SurfaceSnapshot
    params:
      - name: sourcePath
        type: string
      - name: origin
        type: string
  - name: listSnapshots
    description: Forward list to the surface portal.
    signature: 'listSnapshots(): SurfaceSnapshot[]'
    returns: list<SurfaceSnapshot>
  - name: pinExternals
    description: Forward to surface_portal.pinExternals.
    signature: 'pinExternals(aliases?: list<string>): list<ExternalPin>'
    returns: list<ExternalPin>
    params:
      - name: aliases
        type: list<string>
        description: The aliases to pin; all when omitted
        optional: true
  - name: getExternalsStatus
    description: Forward to surface_portal.getExternalsStatus.
    signature: 'getExternalsStatus(): list<ExternalStatus>'
    returns: list<ExternalStatus>
    params: []
  - name: listExternals
    description: Forward to surface_portal.listExternals.
    signature: 'listExternals(): list<ExternalListing>'
    returns: list<ExternalListing>
    params: []
  - name: exportDesign
    description: >-
      Forward to surface_portal.exportDesign: the bound project's design export, written to outPath
      when given
    signature: 'exportDesign(outPath?: string, approval?: DesignApproval): DesignExport'
    returns: DesignExport
    params:
      - name: outPath
        type: string
        optional: true
      - name: approval
        type: DesignApproval
        description: The lock-check state decided by checkApproval
        optional: true
  - name: declareExternal
    description: >-
      Forward to surface_portal.declareExternal: declare one external of the bound project (`wairon
      externals add`).
    signature: 'declareExternal(request: ExternalRequest): ExternalAddition'
    returns: ExternalAddition
    params:
      - name: request
        type: ExternalRequest
        description: >-
          The alias, the location, and the optional producer id, ref, dir, use, description, pin and
          dryRun
  - name: removeExternal
    description: >-
      Forward to surface_portal.removeExternal: remove one external and its pin (`wairon externals
      remove`).
    signature: 'removeExternal(alias: string, dryRun?: bool): ExternalRemoval'
    returns: ExternalRemoval
    params:
      - name: alias
        type: string
        description: The external to remove
      - name: dryRun
        type: bool
        description: Answer what would be removed, writing nothing
        optional: true
  - name: updateExternalUse
    description: >-
      Forward to surface_portal.updateExternalUse: add and remove `use` imports of one external
      (`wairon externals use`).
    signature: 'updateExternalUse(request: ExternalUseRequest): ExternalUseChange'
    returns: ExternalUseChange
    params:
      - name: request
        type: ExternalUseRequest
        description: The alias, the names to add and remove, and dryRun
  - name: listConsumers
    description: >-
      Forward to surface_portal.listConsumers: the family projects in reach that consume this
      project (`wairon externals consumers`).
    signature: 'listConsumers(): list<ExternalConsumer>'
    returns: list<ExternalConsumer>
    params: []
status: complete
createdAt: '2026-07-10T23:14:13.266Z'
updatedAt: '2026-10-06T23:06:33.042Z'
