id: icli_surfaces_client_adapter
name: CLI Surfaces Client Adapter Interface
description: CLI-side forwarding of surface commands to the surface portal.
component: cli_surfaces_client_adapter
methods:
  - name: exportSurface
    description: >-
      Forward export to the surface portal, including the optional portalId selecting one per-portal
      OpenAPI document.
    signature: >-
      exportSurface(maxAudience: string, format: string, outPath?: string, portalId?: string):
      SurfaceSnapshot
    returns: SurfaceSnapshot
    params:
      - name: maxAudience
        type: string
      - name: format
        type: string
      - name: outPath
        type: string
        optional: true
      - name: portalId
        type: string
        optional: true
  - name: importSurface
    description: Forward import to the surface portal.
    signature: 'importSurface(sourcePath: string, origin: string): SurfaceSnapshot'
    returns: SurfaceSnapshot
    params:
      - name: sourcePath
        type: string
      - name: origin
        type: string
  - name: listSnapshots
    description: Forward list to the surface portal.
    signature: 'listSnapshots(): SurfaceSnapshot[]'
    returns: SurfaceSnapshot[]
  - name: listExternalInterfaces
    description: >-
      Forward the external-surface discovery (origin, provenance, freshness per vendored snapshot)
      to the surface portal.
    signature: 'listExternalInterfaces(): ExternalSurfaceEntry[]'
    returns: ExternalSurfaceEntry[]
  - name: pinFamilySurfaces
    description: >-
      Pin the chaining parent's family and sibling surfaces into this chained child, via the surface
      portal (`wairon surface pin`). Null at a top root.
    signature: 'pinFamilySurfaces(): string[] | null'
    returns: string[] | null
    params: []
status: complete
createdAt: '2026-07-10T23:14:13.266Z'
updatedAt: '2026-09-12T12:38:12.217Z'
