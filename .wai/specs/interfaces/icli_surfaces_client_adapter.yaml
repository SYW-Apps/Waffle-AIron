id: icli_surfaces_client_adapter
name: CLI Surfaces Client Adapter Interface
description: CLI-side forwarding of surface commands to the surface portal.
component: cli_surfaces_client_adapter
methods:
  - name: exportSurface
    description: >-
      Forward export to the surface portal, including the optional portalId selecting one per-portal
      OpenAPI document.
    signature: >-
      exportSurface(maxAudience: string, format: string, outPath?: string, portalId?: string):
      SurfaceSnapshot
    returns: SurfaceSnapshot
    params:
      - name: maxAudience
        type: string
      - name: format
        type: string
      - name: outPath
        type: string
        optional: true
      - name: portalId
        type: string
        optional: true
  - name: importSurface
    description: Forward import to the surface portal.
    signature: 'importSurface(sourcePath: string, origin: string): SurfaceSnapshot'
    returns: SurfaceSnapshot
    params:
      - name: sourcePath
        type: string
      - name: origin
        type: string
  - name: listSnapshots
    description: Forward list to the surface portal.
    signature: 'listSnapshots(): SurfaceSnapshot[]'
    returns: SurfaceSnapshot[]
  - name: pinExternals
    description: Forward to surface_portal.pinExternals.
    signature: 'pinExternals(aliases?: string[]): ExternalPin[]'
    returns: ExternalPin[]
    params:
      - name: aliases
        type: string[]
        description: The aliases to pin; all when omitted
        optional: true
  - name: getExternalsStatus
    description: Forward to surface_portal.getExternalsStatus.
    signature: 'getExternalsStatus(): ExternalStatus[]'
    returns: ExternalStatus[]
    params: []
  - name: listExternals
    description: Forward to surface_portal.listExternals.
    signature: 'listExternals(): ExternalListing[]'
    returns: ExternalListing[]
    params: []
  - name: listFamilyPins
    description: >-
      Forward to the surface portal: the stage-1 family pins the bound root still holds, for `doctor
      --fix`'s chaining migration.
    signature: 'listFamilyPins(): FamilyPin[]'
    returns: FamilyPin[]
    params: []
    guarantees:
      - idempotent
  - name: removeSnapshot
    description: >-
      Forward to the surface portal: remove one stored snapshot of the bound root by its key (file
      and projection), for `doctor --fix`'s deletion of superseded family pins. False when there was
      none.
    signature: 'removeSnapshot(projectName: string): boolean'
    returns: boolean
    params:
      - name: projectName
        type: string
        description: The snapshot's storage key
    guarantees:
      - idempotent
status: complete
