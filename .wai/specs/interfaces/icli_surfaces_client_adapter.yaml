id: icli_surfaces_client_adapter
name: CLI Surfaces Client Adapter Interface
description: CLI-side forwarding of surface commands to the surface portal.
component: cli_surfaces_client_adapter
methods:
  - name: exportSurface
    description: >-
      Forward export to the surface portal, including the optional portalId selecting one per-portal
      OpenAPI document.
    signature: >-
      exportSurface(maxAudience: string, format: string, outPath?: string, portalId?: string):
      SurfaceSnapshot
    returns: SurfaceSnapshot
    params:
      - name: maxAudience
        type: string
      - name: format
        type: string
      - name: outPath
        type: string
        optional: true
      - name: portalId
        type: string
        optional: true
  - name: importSurface
    description: Forward import to the surface portal.
    signature: 'importSurface(sourcePath: string, origin: string): SurfaceSnapshot'
    returns: SurfaceSnapshot
    params:
      - name: sourcePath
        type: string
      - name: origin
        type: string
  - name: listSnapshots
    description: Forward list to the surface portal.
    signature: 'listSnapshots(): SurfaceSnapshot[]'
    returns: list<SurfaceSnapshot>
  - name: pinExternals
    description: Forward to surface_portal.pinExternals.
    signature: 'pinExternals(aliases?: list<string>): list<ExternalPin>'
    returns: list<ExternalPin>
    params:
      - name: aliases
        type: list<string>
        description: The aliases to pin; all when omitted
        optional: true
  - name: getExternalsStatus
    description: Forward to surface_portal.getExternalsStatus.
    signature: 'getExternalsStatus(): list<ExternalStatus>'
    returns: list<ExternalStatus>
    params: []
  - name: listExternals
    description: Forward to surface_portal.listExternals.
    signature: 'listExternals(): list<ExternalListing>'
    returns: list<ExternalListing>
    params: []
  - name: exportDesign
    description: >-
      Forward to surface_portal.exportDesign: the bound project's design export, written to outPath
      when given
    signature: 'exportDesign(outPath?: string, approval?: DesignApproval): DesignExport'
    returns: DesignExport
    params:
      - name: outPath
        type: string
        optional: true
      - name: approval
        type: DesignApproval
        description: The lock-check state decided by checkApproval
        optional: true
status: complete
createdAt: '2026-07-10T23:14:13.266Z'
updatedAt: '2026-10-04T14:04:59.954Z'
