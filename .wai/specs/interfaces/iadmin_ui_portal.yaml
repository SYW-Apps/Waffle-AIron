id: iadmin_ui_portal
name: Admin UI Portal Interface
description: Draft browser-facing HTTP contract for optional hosted administration UI and SSO session handling.
component: admin_ui_portal
methods:
  - name: startSignIn
    description: Start an SSO sign-in flow for one provider.
    signature: 'startSignIn(providerId: string, redirectUri: string): HttpResponse'
    returns: HttpResponse
    params:
      - name: providerId
        type: string
      - name: redirectUri
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /ui/auth/{providerId}/start
  - name: completeSignIn
    description: Complete an SSO callback and create a hosted web session.
    signature: 'completeSignIn(providerId: string, code: string, state: string): HttpResponse'
    returns: HttpResponse
    params:
      - name: providerId
        type: string
      - name: code
        type: string
      - name: state
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /ui/auth/{providerId}/callback
  - name: getDashboard
    description: Return the UI dashboard payload visible to the current session.
    signature: 'getDashboard(request: HttpRequest): HttpResponse'
    returns: HttpResponse
    params:
      - name: request
        type: HttpRequest
    endpoint:
      transport: HTTP
      method: GET
      path: /ui/dashboard
  - name: signOut
    description: Expire the current web session.
    signature: 'signOut(request: HttpRequest): HttpResponse'
    returns: HttpResponse
    params:
      - name: request
        type: HttpRequest
    endpoint:
      transport: HTTP
      method: POST
      path: /ui/sign-out
status: draft
