id: ihost_request_orchestrator
name: Host Request Orchestrator Interface
description: >-
  Contract for the per-request data-plane workflow: authenticate, resolve and scope the authorized
  project, dispatch the sdd_* call.
component: host_request_orchestrator
methods:
  - name: handle
    description: >-
      Authenticate the bearer token, resolve the authorized project root (rejecting cross-project
      access), bind the request-scoped root, then dispatch the sdd_* tool call within that scope. A
      subproject-qualified narrowing binds the mounted CHILD root: every scoped tool — validation
      included — then operates on the subtree, where the chained-subproject reference model applies
      (refs covered by the child's pinned surfaces are verified against them; reference-resolution
      failures are judged through the parent when the credential reaches the top project, and keep
      their raw verdicts when it is narrowed to the child), and nothing above the child's root is
      read for a narrowed credential. Under a subproject-qualified binding only tools declared
      tree-scoped are served — every scoped spec tool, and lock and tree transfer acting on the
      bound child; record-scoped tools (project record, repository, landscape discovery) and any
      tool with no declared scope are refused, so confinement fails closed. Permission capabilities
      keep resolving over the TOP project (a subproject qualifier narrows reach, never refines
      grants). For an ordinary scoped tool the tool is classified as a read
      (sdd_get_*/sdd_validate_*, plus the explicitly listed reads sdd_list_external_interfaces,
      listAgents, getAgent, listDomains, validateTopology and getProjectConfig) or a write (every
      other name — the explicit write prefixes AND any unrecognized or newly added name, failing
      closed) and the caller's resolved permission for the matching capability (project:read for
      reads, project:write for writes) over the bound project MUST be yes, resolved through the
      authorization component; a missing permission is rejected with a clear MCP error before
      dispatch. The execute-primary project-lifecycle MCP tools and the hosted landscape discovery
      MCP tools are dispatched to their orchestrators (already gated) instead of the scoped MCP tool
      surface and bypass this data-plane permission gate. Appends a redacted audit event for every
      handled data-plane tool call — stamped with the TOP project id for provenance plus the bound
      subproject qualifier when one applied; append failures are recorded as server diagnostics and
      never fail the request.
    signature: 'handle(request: HttpRequest): HttpResponse'
    returns: HttpResponse
    params:
      - name: request
        type: HttpRequest
  - name: viewDiagram
    description: >-
      Verify the signed view token, bind the granted project's scope, render the canvas, and return
      it as HTML.
    signature: 'viewDiagram(request: HttpRequest): HttpResponse'
    returns: HttpResponse
  - name: dispatchProjectLifecycleTool
    description: >-
      Serve a hosted tool from the matching orchestrator instead of the scoped sdd_* MCP server, and
      answer with nothing when the called tool is not one of those — the caller then falls through
      to the scoped server. Sixteen tool names are served here: the four execute-primary
      project-lifecycle tools (initialize, lock, approval status, await approval), the four hosted
      landscape discovery tools, the six hosted project-ops tools (packs, policy, producer, commit)
      and the two tree-transfer tools. Every one of them is scoped to the ALREADY BOUND project: a
      project id supplied in the tool arguments is deliberately ignored, so a caller can never act
      as, or read the neighbourhood of, a project it is not scoped to; initialization carries the
      new project as its decoded arguments, and interface discovery reads its TARGET project (the
      neighbour to inspect, still gated by reachability) from arguments. The bound subproject
      qualifier reaches only the TREE-scoped tools — lock and the two tree transfers — so a
      qualified credential freezes or transfers exactly the child tree it is scoped to, while
      permission resolution and audit provenance stay anchored at the TOP project; every
      record-level tool has already been refused upstream, so none can be reached with a qualifier.
      A tool that throws answers in the same envelope with isError set, never as a transport
      failure.
    signature: >-
      dispatchProjectLifecycleTool(request: HttpRequest, credential: string, binding:
      ProjectBinding): McpToolResponse | undefined
    returns: McpToolResponse | undefined
    params:
      - name: request
        type: HttpRequest
        description: The data-plane request whose JSON-RPC body carries the tool call
      - name: credential
        type: string
        description: The caller's credential, forwarded so each orchestrator resolves its own permission
      - name: binding
        type: ProjectBinding
        description: >-
          The resolved binding: the TOP project id every served tool is scoped to, and the
          subproject qualifier the tree-scoped ones receive
  - name: auditToolCall
    description: >-
      Append the redacted mcp.tool.call audit event for one handled data-plane tool call,
      best-effort: an append failure is recorded as a server diagnostic and never fails the request.
      The event is stamped with the TOP project id for provenance plus the bound subproject
      qualifier when one applied, and a legacy principal with no resolved subject gets a synthesized
      service actor so the required actor is always present. Every data-plane outcome flows through
      this one path — a confinement refusal, a permission refusal, a tool the data plane served
      itself, and a tool the scoped MCP server served.
    signature: >-
      auditToolCall(request: HttpRequest, principal: Principal, binding: ProjectBinding, outcome:
      string): void
    returns: void
    params:
      - name: request
        type: HttpRequest
        description: The handled request, whose body names the tool the event targets
      - name: principal
        type: Principal
        description: The authenticated caller — actor and tokenId of the event
      - name: binding
        type: ProjectBinding
        description: >-
          The TOP project id the event is stamped with, and the bound subproject qualifier recorded
          alongside it
      - name: outcome
        type: string
        description: The outcome derived from the response the call produced
