id: ihost_request_orchestrator
name: Host Request Orchestrator Interface
description: >-
  Contract for the per-request data-plane workflow: authenticate, resolve and scope the authorized
  project, dispatch the sdd_* call.
component: host_request_orchestrator
methods:
  - name: handleRequest
    description: >-
      Authenticate the bearer token, resolve the authorized project root (rejecting cross-project
      access), bind the request-scoped root, dispatch the sdd_* tool call within that scope, and
      return the response. The approval-backed self-service MCP tools
      (sdd_host_request_project_initialization, sdd_host_request_project_lock,
      sdd_host_request_project_promotion, sdd_host_get_approval_status) are dispatched to the
      self-service orchestrator instead of the scoped MCP tool surface. Appends a redacted audit
      event for every handled data-plane tool call; append failures are recorded as server
      diagnostics and never fail the request.
    signature: 'handleRequest(request: HttpRequest): HttpResponse'
    returns: HttpResponse
    params:
      - name: request
        type: HttpRequest
  - name: viewDiagram
    description: >-
      Verify the signed view token, bind the granted project's scope, render the canvas, and return
      it as HTML.
    signature: 'viewDiagram(request: HttpRequest): HttpResponse'
    returns: HttpResponse
status: complete
