id: ihost_request_orchestrator
name: Host Request Orchestrator Interface
description: >-
  Contract for the per-request data-plane workflow: authenticate, resolve and scope the authorized
  project, dispatch the sdd_* call.
component: host_request_orchestrator
methods:
  - name: handleRequest
    description: >-
      Authenticate the bearer token, resolve the authorized project root (rejecting cross-project
      access), bind the request-scoped root, then dispatch the sdd_* tool call within that scope. A
      subproject-qualified narrowing binds the mounted CHILD root: every scoped tool — validation
      included — then operates on the subtree, where the chained-subproject reference model applies
      (refs covered by the child's pinned surfaces are verified against them; reference-resolution
      failures are judged through the parent when the credential reaches the top project, and keep
      their raw verdicts when it is narrowed to the child), and nothing above the child's root is
      read for a narrowed credential. Under a subproject-qualified binding the record-level tools
      and the landscape discovery tools are refused, while lock and tree transfer act on the bound
      child. Permission capabilities keep resolving over the TOP project (a subproject qualifier
      narrows reach, never refines grants). For an ordinary scoped tool the tool is classified as a
      read (sdd_get_*/sdd_validate_*, plus the explicitly listed reads sdd_list_external_interfaces,
      listAgents, getAgent, listDomains, validateTopology and getProjectConfig) or a write (every
      other name — the explicit write prefixes AND any unrecognized or newly added name, failing
      closed) and the caller's resolved permission for the matching capability (project:read for
      reads, project:write for writes) over the bound project MUST be yes, resolved through the
      authorization specialist; a missing permission is rejected with a clear MCP error before
      dispatch. The execute-primary project-lifecycle MCP tools and the hosted landscape discovery
      MCP tools are dispatched to their orchestrators (already gated) instead of the scoped MCP tool
      surface and bypass this data-plane permission gate. Appends a redacted audit event for every
      handled data-plane tool call — stamped with the TOP project id for provenance plus the bound
      subproject qualifier when one applied; append failures are recorded as server diagnostics and
      never fail the request.
    signature: 'handleRequest(request: HttpRequest): HttpResponse'
    returns: HttpResponse
    params:
      - name: request
        type: HttpRequest
  - name: viewDiagram
    description: >-
      Verify the signed view token, bind the granted project's scope, render the canvas, and return
      it as HTML.
    signature: 'viewDiagram(request: HttpRequest): HttpResponse'
    returns: HttpResponse
status: complete
