id: ihost_request_orchestrator
name: Host Request Orchestrator Interface
description: >-
  Contract for the per-request data-plane workflow: authenticate, resolve and scope the authorized
  project, dispatch the sdd_* call.
component: host_request_orchestrator
methods:
  - name: handle
    description: >-
      Authenticate the bearer token, resolve the authorized project root (rejecting cross-project
      access), bind the request-scoped root, then dispatch the sdd_* call within that scope. A
      member-qualified narrowing ('projectId::alias', one member alias per hop — the same strings
      the legacy mount ids were, so an existing token binds the same root; stage 7 rewrites
      qualifiers to member project ids) binds the MEMBER's root: every scoped tool — validation
      included — then operates on the member's tree. Validation is the same two functions the local
      CLI calls (stage 4): the member's own gate judges it from its own files and pins alone, so its
      verdict does not depend on whether the credential reaches the top project; a family run
      composes only within the credential's reach, which it never widens, and nothing above the
      member's root is read for a narrowed credential. Under a member-qualified binding only tools
      declared tree-scoped are served — every scoped spec tool, and lock and tree transfer acting on
      the bound member; record-scoped tools (project record, repository, landscape discovery) and
      any tool with no declared scope are refused, so confinement fails closed. For an ordinary
      scoped tool the tool is classified as a read (sdd_get_*/sdd_validate_*, plus the explicitly
      listed reads listAgents, getAgent, listDomains, validateTopology and getProjectConfig) or a
      write (every other name — the explicit write prefixes AND any unrecognized or newly added
      name, failing closed) and the caller's resolved permission for the matching capability
      (project:read for reads, project:write for writes) over the bound project MUST be yes,
      resolved through the authorization component; a missing permission is rejected with a clear
      MCP error, naming the rung that decided it, before dispatch. Writes are judged per subsystem
      as well: the request binds its write reach (the subsystem rungs the principal meets, each
      writable or not), a subsystem-scoped write (one whose every change is a spec written through
      the core's spec writers) is admitted with write on any subsystem of the bound project even
      without project-wide write, and the spec writers then refuse any spec of a subsystem the
      principal may not change — a multi-subsystem write needs write on every subsystem it touches,
      and its refusal names each one denied; a spec that belongs to no subsystem follows the project
      rung. Reading stays whole-project. With no subsystem settings every call is admitted or
      refused exactly as before. The execute-primary project-lifecycle MCP tools and the hosted
      landscape discovery MCP tools are dispatched to their orchestrators (already gated) instead of
      the scoped MCP tool surface and bypass this data-plane permission gate. Appends a redacted
      audit event for every handled data-plane tool call — stamped with the TOP project id for
      provenance plus the bound member qualifier when one applied; append failures are recorded as
      server diagnostics and never fail the request.
    signature: 'handle(request: HttpRequest): HttpResponse'
    returns: HttpResponse
    params:
      - name: request
        type: HttpRequest
  - name: viewDiagram
    description: >-
      Verify the signed view token, bind the granted project's scope, render the canvas, and return
      it as HTML. The canvas carries no relation health and says so: the token is a bearer
      capability for one record with no principal behind it, so every member and producer beyond
      that record is out of its reach and could only be reported unavailable.
    signature: 'viewDiagram(request: HttpRequest): HttpResponse'
    returns: HttpResponse
  - name: dispatchProjectLifecycleTool
    description: >-
      Serve a hosted tool from the matching orchestrator instead of the scoped sdd_* MCP server, and
      answer with nothing when the called tool is not one of those — the caller then falls through
      to the scoped server. Seventeen tool names are served here: the four execute-primary
      project-lifecycle tools (initialize, lock, approval status, await approval), the four hosted
      landscape discovery tools, the seven hosted project-ops tools (packs list, install and impact;
      policy evaluate and reconcile; producer; commit) and the two tree-transfer tools.
      sdd_host_pack_impact measures an install or adoption without writing. Every one of them is
      scoped to the ALREADY BOUND record: a project id supplied in the tool arguments is
      deliberately ignored, so a caller can never act as, or read the neighbourhood of, a project it
      is not scoped to; initialization carries the new project as its decoded arguments, and
      interface discovery reads its TARGET project (the neighbour to inspect, still gated by
      reachability) from arguments. Since stage 7 a member is a record of its own, so a credential
      bound to a member reaches the member's OWN record-level tools (status, approval, lock
      requests, packs, policy, producer, commit, landscape) — the documented widening within the
      member only; it never reaches its parent's. A tool that throws answers in the same envelope
      with isError set, never as a transport failure.
    signature: >-
      dispatchProjectLifecycleTool(credential: string | null, projectId: string, body: unknown):
      McpToolResponse | undefined
    returns: McpToolResponse | undefined
    params:
      - name: credential
        type: string | null
        description: >-
          The caller's credential (null when none was presented), forwarded so each orchestrator
          resolves its own permission
      - name: projectId
        type: string
        description: The id of the already-bound record every served tool is scoped to
      - name: body
        type: unknown
        description: The decoded JSON-RPC body carrying the tool call
  - name: auditToolCall
    description: >-
      Append the redacted mcp.tool.call audit event for one handled data-plane tool call,
      best-effort: an append failure is recorded as a server diagnostic and never fails the request.
      The event names the bound record as projectId — the member's own id when a member was bound —
      and, when a deprecated member qualifier resolved the binding, the family root it named as
      composition; a legacy principal with no resolved subject gets a synthesized service actor so
      the required actor is always present. Every data-plane outcome flows through this one path — a
      permission refusal, a tool the data plane served itself, and a tool the scoped MCP server
      served.
    signature: >-
      auditToolCall(principal: Principal, binding: ProjectBinding, body: unknown, outcome: string):
      void
    returns: void
    params:
      - name: principal
        type: Principal
        description: The authenticated caller — actor and tokenId of the event
      - name: binding
        type: ProjectBinding
        description: The bound record the event names, and the deprecated qualifier recorded as composition
      - name: body
        type: unknown
        description: The decoded JSON-RPC message of the handled call, which names the tool the event targets
      - name: outcome
        type: string
        description: The outcome derived from the response the call produced
