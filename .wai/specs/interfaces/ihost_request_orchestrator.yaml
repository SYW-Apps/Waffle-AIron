id: ihost_request_orchestrator
name: Host Request Orchestrator Interface
description: >-
  Contract for the per-request data-plane workflow: authenticate, resolve and scope the authorized
  project, dispatch the sdd_* call.
component: host_request_orchestrator
methods:
  - name: handleRequest
    description: >-
      Authenticate the bearer token, resolve the authorized project root (rejecting cross-project
      access), bind the request-scoped root, then dispatch the sdd_* tool call within that scope.
      For an ordinary scoped sdd_* tool the tool is classified as a read or a write and the
      principal's grant for the bound project MUST carry the matching data-plane permission
      (mcp:read for reads — sdd_get_*/sdd_validate_*; mcp:write for writes —
      sdd_add_/sdd_update_/sdd_delete_/sdd_write_/sdd_define_/sdd_set_/sdd_initialize_/sdd_externalize_/sdd_internalize_/sdd_move_;
      a '*' permission covers both), consulting principal.grants rather than the coarse
      role/projects projection; a missing permission is rejected with a clear MCP error before
      dispatch. The approval-backed self-service MCP tools and the hosted landscape discovery MCP
      tools are dispatched to their orchestrators (already gated) instead of the scoped MCP tool
      surface and bypass this data-plane permission gate. Appends a redacted audit event for every
      handled data-plane tool call; append failures are recorded as server diagnostics and never
      fail the request.
    signature: 'handleRequest(request: HttpRequest): HttpResponse'
    returns: HttpResponse
    params:
      - name: request
        type: HttpRequest
  - name: viewDiagram
    description: >-
      Verify the signed view token, bind the granted project's scope, render the canvas, and return
      it as HTML.
    signature: 'viewDiagram(request: HttpRequest): HttpResponse'
    returns: HttpResponse
status: complete
