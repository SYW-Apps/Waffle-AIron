id: iapproval_registry
name: Approval Registry Interface
description: >-
  Private write-path contract for creating, deciding, completing, cancelling, and expiring hosted
  approval requests. The registry owns the pending-and-unexpired state invariants and the
  decidedBy/decidedAt/decisionReason stamping; it performs no authorization (the self-approval check
  is the orchestrator's job).
component: approval_registry
methods:
  - name: create
    description: >-
      Persist a new approval request with status pending, stamping its id, createdAt, and pending
      status via write-temp-then-rename.
    signature: 'create(request: ApprovalRequest): ApprovalRequest'
    returns: ApprovalRequest
    params:
      - name: request
        type: ApprovalRequest
    guarantees:
      - atomic
  - name: decide
    description: >-
      Record an approval or denial decision on a pending, unexpired request, stamping decidedBy,
      decidedAt, and decisionReason and setting the approved or denied status. Rejects a request
      that is not pending or already expired. Authorization, including the self-approval check, is
      enforced by the orchestrator, not here.
    signature: 'decide(decision: ApprovalDecision): ApprovalRequest'
    returns: ApprovalRequest
    params:
      - name: decision
        type: ApprovalDecision
    guarantees:
      - atomic
  - name: markCompleted
    description: >-
      Transition an approved request to completed after its privileged workflow has executed
      successfully; only an approved request may become completed. When the workflow reports what it
      changed (an executed project:init's executionSummary), the summary is stored on the completed
      request in the same write.
    signature: 'markCompleted(id: string, executionSummary?: string): ApprovalRequest'
    returns: ApprovalRequest
    params:
      - name: id
        type: string
      - name: executionSummary
        type: string
        description: >-
          What the executed workflow changed, recorded on the completed request (a project:init's
          applied packs and governing profile)
        optional: true
    guarantees:
      - atomic
  - name: expirePending
    description: >-
      Flip every pending request whose expiresAt is at or before the supplied now-timestamp to
      expired and return the number expired.
    signature: 'expirePending(now: string): number'
    returns: number
    params:
      - name: now
        type: string
  - name: cancel
    description: >-
      Transition an approved request to cancelled when its privileged workflow refused because the
      request no longer describes what would be done (a project:lock whose pinned gate identity
      moved), recording why as its executionSummary in the same write; only an approved request may
      be cancelled. A cancelled request is final: it is never executed, and the requester asks
      again.
    signature: 'cancel(id: string, reason: string): ApprovalRequest'
    returns: ApprovalRequest
    params:
      - name: id
        type: string
      - name: reason
        type: string
        description: Why the approved request can no longer execute, recorded on it as its executionSummary
    guarantees:
      - atomic
status: complete
