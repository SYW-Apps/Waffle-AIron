id: iagent_resolver
name: Agent Topology Resolver Interface
description: Interface contract for resolving agent topology from specification files.
component: agent_resolver
methods:
  - name: resolveAgentTopology
    description: >-
      Resolve the LAYERED agent topology for THIS project's own layer only: the system architect,
      one owner per LOCAL subsystem, and exactly ONE delegating owner per chained subproject (a
      projectPath subsystem) — never enumerating a subproject's internals, which belong to its own
      layer. Federated subprojects carry a :: namespace prefix and are excluded here.
      Component-implementer agents are emitted only when generateComponentImplementers is enabled —
      a legacy escape hatch: component-level delegation is served as live briefs
      (composeAgentBrief), not files. Keeps each generated agent set (and the context every session
      loads) proportional to a single layer instead of the whole deep tree.
    signature: 'resolveAgentTopology(): AgentRecord[]'
    returns: AgentRecord[]
  - name: composeAgentBrief
    description: >-
      Compose the LIVE delegation brief for one resolved agent: resolve the current topology, locate
      the record by id, load its instruction template through the template source adapter, render
      the record's variables into it (scope fence, domain context, variant guidance), and return the
      structured AgentBrief — rendered instructions plus ownedPaths/readPaths. Always reflects the
      CURRENT spec tree, so a re-lock changes the next call's result with no session restart; an
      unknown agentId throws.
    signature: 'composeAgentBrief(agentId: string): AgentBrief'
    returns: AgentBrief
    params:
      - name: agentId
        type: string
        description: The resolved agent id (e.g. sdd_core-owner, system-architect).
status: complete
