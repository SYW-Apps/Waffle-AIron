id: igit_orchestrator
name: Git Orchestrator Interface
description: >-
  Contract for the git-backing workflows: bind the project to its REAL repository, keep the working
  branch integrated, and publish DELIBERATE, .wai/-scoped commits (never `git add -A`).
component: git_orchestrator
methods:
  - name: enable
    description: >-
      Clone + set up the working branch + persist config. The clone authenticates with the token the
      caller handed in, passed straight to the adapter's clone; credentialRef is only recorded. Only
      container-local files (git.json) are kept out of commits: the approval record .wai/lock.json
      is committed with the rest of .wai/, so an approval reaches the remote, and an exclusion of it
      written by an earlier version is removed with a warning.
    signature: 'enable(remote: string, branch: string, token: string | null, credentialRef?: string): void'
    returns: void
    params:
      - name: remote
        type: string
      - name: branch
        type: string
      - name: token
        type: string | null
        description: The resolved credential the clone presents; null for a public remote
      - name: credentialRef
        type: string
        description: Recorded in the config for status; never resolved here
        optional: true
  - name: disable
    description: Clear the git-backing config.
    signature: 'disable(): void'
    returns: void
  - name: sync
    description: Integrate the default branch into the working branch; no-op when not git-backed.
    signature: 'sync(): void'
    returns: void
  - name: publish
    description: >-
      Commit ONLY the scoped pathspecs (default ['.wai/']) in one commit, push the working branch,
      and produce the compare URL; no-op when not git-backed or when every scoped path is clean. A
      hosted member commits through its family root's repository with its own <path>/.wai/ pathspec;
      a family migration publishes every touched project's pathspec in one commit.
    signature: 'publish(message: string, subpaths: string[]): GitPublish'
    returns: GitPublish
    params:
      - name: message
        type: string
      - name: subpaths
        type: string[]
        description: Staging pathspecs relative to the repo root; defaults to ['.wai/'].
        optional: true
  - name: status
    description: >-
      The project's git-backing status: bound remote/branch, periodic-sync setting, and scoped .wai/
      dirtiness; enabled:false when no config exists.
    signature: 'status(): GitBackingStatus'
    returns: GitBackingStatus
    params: []
  - name: configureSync
    description: >-
      Persist the periodic-sync setting (interval + skip-if-clean) into the project's git-backing
      config; rejects when the project is not git-backed.
    signature: 'configureSync(periodicSyncMinutes: number, skipIfClean: boolean): void'
    returns: void
    params:
      - name: periodicSyncMinutes
        type: number
        optional: true
      - name: skipIfClean
        type: boolean
        optional: true
status: complete
