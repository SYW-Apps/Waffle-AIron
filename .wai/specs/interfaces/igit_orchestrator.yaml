id: igit_orchestrator
name: Git Orchestrator Interface
description: >-
  Contract for the git-backing workflows: bind the project to its REAL repository, keep the working
  branch integrated, and publish DELIBERATE, .wai/-scoped commits (never `git add -A`).
component: git_orchestrator
methods:
  - name: enable
    description: Clone + set up the working branch + persist config.
    signature: 'enable(remote: string, branch: string): void'
    returns: void
  - name: disable
    description: Clear the git-backing config.
    signature: 'disable(): void'
    returns: void
  - name: sync
    description: Integrate the default branch into the working branch; no-op when not git-backed.
    signature: 'sync(): void'
    returns: void
  - name: publish
    description: >-
      Commit ONLY the scoped subpath (default .wai/), push the working branch, and produce the
      compare URL; no-op when not git-backed or when the scoped path is clean.
    signature: 'publish(message: string, subpath: string): GitPublish'
    returns: GitPublish
    params:
      - name: message
        type: string
      - name: subpath
        type: string
        description: Staging scope relative to the repo root; defaults to .wai/.
        optional: true
  - name: status
    description: >-
      The project's git-backing status: bound remote/branch, periodic-sync setting, and scoped .wai/
      dirtiness; enabled:false when no config exists.
    signature: 'status(): GitBackingStatus'
    returns: GitBackingStatus
    params: []
  - name: configureSync
    description: >-
      Persist the periodic-sync setting (interval + skip-if-clean) into the project's git-backing
      config; rejects when the project is not git-backed.
    signature: 'configureSync(periodicSyncMinutes: number, skipIfClean: boolean): void'
    returns: void
    params:
      - name: periodicSyncMinutes
        type: number
        optional: true
      - name: skipIfClean
        type: boolean
        optional: true
status: complete
