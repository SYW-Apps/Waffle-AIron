id: ispec_loader
name: Spec Loader Interface
description: Interface contract for spec loading, saving, and resolving.
component: spec_loader
methods:
  - name: loadSystemSpec
    description: Loads L0 system specification from system.yaml
    signature: 'loadSystemSpec(): SystemSpec | null'
    returns: SystemSpec?
  - name: saveSystemSpec
    description: Saves L0 system specification to system.yaml
    signature: 'saveSystemSpec(spec: SystemSpec): void'
    returns: void
  - name: loadSubsystemSpecs
    description: Loads all L1 subsystem specifications from subsystems/*.yaml
    signature: 'loadSubsystemSpecs(): SubsystemSpec[]'
    returns: list<SubsystemSpec>
  - name: loadSubsystemSpec
    description: Loads a single subsystem specification by id
    signature: 'loadSubsystemSpec(id: string): SubsystemSpec | null'
    returns: SubsystemSpec?
  - name: loadComponentSpecs
    description: Loads all L2 component specifications from components/*.yaml
    signature: 'loadComponentSpecs(): ComponentSpec[]'
    returns: list<ComponentSpec>
  - name: loadComponentSpec
    description: Loads a single component specification by id
    signature: 'loadComponentSpec(id: string): ComponentSpec | null'
    returns: ComponentSpec?
  - name: saveComponentSpec
    description: >-
      Saves a component specification. A spec arriving at draft, or without a status, keeps the
      status already stored unless the caller states the demotion.
    signature: 'saveComponentSpec(spec: ComponentSpec): void'
    returns: void
  - name: loadInterfaceSpecs
    description: Loads all L3 interface specifications from interfaces/*.yaml
    signature: 'loadInterfaceSpecs(): InterfaceSpec[]'
    returns: list<InterfaceSpec>
  - name: loadInterfaceSpec
    description: Loads a single interface specification by id
    signature: 'loadInterfaceSpec(id: string): InterfaceSpec | null'
    returns: InterfaceSpec?
  - name: saveInterfaceSpec
    description: >-
      Saves an interface specification. A spec arriving at draft, or without a status, keeps the
      status already stored unless the caller states the demotion.
    signature: 'saveInterfaceSpec(spec: InterfaceSpec): void'
    returns: void
  - name: loadImplementationSpecs
    description: Loads all L4 implementation specifications from implementations/*.yaml
    signature: 'loadImplementationSpecs(): ImplementationSpec[]'
    returns: list<ImplementationSpec>
  - name: loadImplementationSpec
    description: Loads a single implementation specification by id
    signature: 'loadImplementationSpec(id: string): ImplementationSpec | null'
    returns: ImplementationSpec?
  - name: saveImplementationSpec
    description: >-
      Saves an implementation specification. A spec arriving at draft, or without a status, keeps
      the status already stored unless the caller states the demotion.
    signature: 'saveImplementationSpec(spec: ImplementationSpec): void'
    returns: void
  - name: loadTypeSpecs
    description: Loads all type specifications (entities and value-objects) from types/*.yaml
    signature: 'loadTypeSpecs(): list<TypeSpec>'
    returns: list<TypeSpec>
    params: []
  - name: dryRunSerializeSpecs
    description: >-
      Re-serializes every currently loaded spec (subsystems, components, interfaces,
      implementations, types, and groups) in memory through the exact writer pipeline the save paths
      use — the same namespace relativization and the same schema parse, never a parallel
      reimplementation — without touching the filesystem. The optional include predicate skips
      out-of-scope specs BEFORE the expensive clone+parse so scoped validation pays scoped cost.
      Returns one ROUNDTRIP_SERIALIZATION issue per refused spec, naming the spec id and offending
      field path; never throws for an unserializable spec. Guarantees validate predicts every
      refusal lock or any save would raise.
    signature: 'dryRunSerializeSpecs(include?: (specId: string) => boolean): ValidationIssue[]'
    returns: list<ValidationIssue>
    guarantees:
      - idempotent
  - name: findChainingParent
    description: >-
      Detect whether the CURRENTLY BOUND project root is a member of another project: walk the
      filesystem upward (bounded) for an ancestor project that declares this root as a member — a
      `members` entry of its configuration or, for one release, a legacy L1 subsystem whose
      projectPath resolves exactly to this root — staying within that ancestor's own root. Returns
      the parent root, the alias and the form, or null for a genuine top root. Pure detection —
      never rebinds, never mutates, and not reach-gated: a request-scoped caller discovers its
      parent through resolveChainingParent, which checks the request's reach before reading anything
      above the bound root.
    signature: 'findChainingParent(): ChainingParentRef | null'
    returns: ChainingParentRef?
  - name: invalidateCache
    description: >-
      Drop the cached spec index, for callers that changed the tree on disk outside the save paths
      (an imported tree swapped into place).
    signature: 'invalidateCache(): void'
    returns: void
    guarantees:
      - idempotent
  - name: resolveSubprojectForNamespace
    description: Resolve a member's key to its project root, or null. Pure 1:1 forward to the index read face.
    signatureFrom: spec_index.resolveSubprojectForNamespace
  - name: inspectChainedRoots
    description: >-
      Every chained mount beneath the bound project: the followable project-relative roots in walk
      order, and every mount that cannot be followed — with its qualified id, declared path and
      reason (escapes, missing, cyclic, too-deep) — so a whole-tree operation can refuse a partial
      result.
    signature: 'inspectChainedRoots(): ChainedRootsInspection'
    returns: ChainedRootsInspection
    guarantees:
      - idempotent
  - name: loadTypeSpec
    description: Loads a single type specification (entity or value-object) by id.
    signatureFrom: spec_index.loadTypeSpec
  - name: loadSpec
    description: >-
      Load one spec of the named kind by id, or null when none is stored. The one place the store
      turns a kind into its typed loader, so a caller that holds the kind as data (a gated write, a
      delete by kind) never repeats the switch. The L0 is a singleton: its id is informational.
    signatureFrom: spec_index.load
    effect: read
  - name: saveSpec
    description: >-
      Persist one spec through the typed writer of its kind and answer with that writer's placement
      notices (none for the L0 and a subsystem, whose writers raise none). A spec arriving at draft,
      or without a status, keeps the status already stored unless the caller states the demotion,
      exactly as the typed writers do.
    signatureFrom: spec_registry.save
    effect: write
  - name: deleteSpec
    description: >-
      Delete one spec document of the named kind through the file store, and invalidate the index
      cache. Answers false when no such document existed. The L0 cannot be deleted: a kind of system
      is refused.
    signatureFrom: spec_registry.delete
    effect: write
  - name: resolveSubsystemExports
    description: >-
      One subsystem's resolved export table — what it makes visible to the other subsystems of its
      project — with the problems met resolving it as facts. Forwards 1:1 to the Export Index.
    signatureFrom: export_index.resolveSubsystemExports
    guarantees:
      - idempotent
  - name: resolveProjectExports
    description: >-
      Forward 1:1 to the Export Index: a project's resolved L0 export table — the bound root's, or
      the member project's at the given namespace — with member and family-external sources followed
      and every problem as a fact.
    signatureFrom: export_index.resolveProjectExports
    guarantees:
      - idempotent
  - name: exportUsage
    description: >-
      Forward 1:1 to the Export Index: one consumer's references into one producer — `alias::name`
      references and bare names bound through its `use` imports alike — mapped onto the producer's
      public names (used) or not (unexported).
    signatureFrom: export_index.usage
    guarantees:
      - idempotent
  - name: graph
    description: 'Forward 1:1 to the Project Family Index: the project graph of the current scan.'
    signatureFrom: project_family_index.graph
    guarantees:
      - idempotent
  - name: deleteMount
    description: >-
      Delete the bound project's legacy L1 mount declaration for one alias, once the chaining
      migration has carried its fields and declared the member; false when there is none. Pure 1:1
      forward to the registry write face.
    signatureFrom: spec_registry.deleteMount
    guarantees:
      - idempotent
    effect: write
  - name: normalizeReferences
    description: >-
      Re-save one spec with every reference in its canonical stage-3 form (bare local, or
      `alias::publicName`), targets unchanged; answers whether the stored text changed. Pure 1:1
      forward to the registry write face.
    signatureFrom: spec_registry.normalizeReferences
    guarantees:
      - idempotent
    effect: write
  - name: rewriteReferences
    description: >-
      Respell references at parsed positions of one spec, each edit replacing exactly its text at
      exactly its position; refuses the whole spec when an edit's text is not there. Answers whether
      the stored text changed. Pure 1:1 forward to the registry write face.
    signatureFrom: spec_registry.rewriteReferences
    guarantees:
      - idempotent
    effect: write
  - name: pinnedUsage
    description: >-
      Forward 1:1 to the Export Index: one consumer's references into a producer the scan did not
      read (an outside external, or a referenced project member — a `../`, git or hosted source),
      counted by the public name they spell.
    signatureFrom: export_index.pinnedUsage
    guarantees:
      - idempotent
  - name: subsystemPath
    description: >-
      The file a subsystem's spec lives in, under the bound tree: where the spec loads from and
      saves to. Consumers that derive file ownership (agent ownedPaths) read spec locations through
      it.
    signatureFrom: spec_index.subsystemPath
    effect: read
  - name: componentPath
    description: >-
      The file a component's spec lives in, under the bound tree; the owning subsystem places a
      component that is not stored yet.
    signatureFrom: spec_index.componentPath
    effect: read
  - name: interfacePath
    description: >-
      The file an interface's spec lives in, under the bound tree; the owning component places one
      that is not stored yet.
    signatureFrom: spec_index.interfacePath
    effect: read
  - name: implementationPath
    description: >-
      The file an implementation's spec lives in, under the bound tree; the contract it implements
      places one that is not stored yet.
    signatureFrom: spec_index.implementationPath
    effect: read
  - name: snapshot
    description: >-
      The bytes of every spec file of the bound tree, keyed by path: a whole-tree read an approval
      captures and a failed write restores.
    signatureFrom: spec_index.snapshot
    effect: read
  - name: signatureFacts
    description: >-
      What the current scan's signature resolution recorded (spec_index.signatureFacts): every
      signatureFrom met and how it resolved, and every stored signature text its params contradict.
    signatureFrom: spec_index.signatureFacts
    guarantees:
      - idempotent
  - name: typeSpellingFacts
    description: >-
      What the current scan's type canonicalisation recorded (spec_index.typeSpellingFacts): every
      stored type position that is an alias of its canonical spelling, and every one that is not
      canonical at all.
    signatureFrom: spec_index.typeSpellingFacts
    guarantees:
      - idempotent
  - name: retiredReachFacts
    description: >-
      What the current scan met in the forms the reachability model retired
      (spec_index.retiredReachFacts).
    signatureFrom: spec_index.retiredReachFacts
    guarantees:
      - idempotent
status: complete
