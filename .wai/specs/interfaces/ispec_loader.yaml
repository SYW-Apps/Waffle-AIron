id: ispec_loader
name: Spec Loader Interface
description: Interface contract for spec loading, saving, and resolving.
component: spec_loader
methods:
  - name: loadSystemSpec
    description: Loads L0 system specification from system.yaml
    signature: 'loadSystemSpec(): SystemSpec | null'
    returns: SystemSpec | null
  - name: saveSystemSpec
    description: Saves L0 system specification to system.yaml
    signature: 'saveSystemSpec(spec: SystemSpec): void'
    returns: void
  - name: loadSubsystemSpecs
    description: Loads all L1 subsystem specifications from subsystems/*.yaml
    signature: 'loadSubsystemSpecs(): SubsystemSpec[]'
    returns: SubsystemSpec[]
  - name: loadSubsystemSpec
    description: Loads a single subsystem specification by id
    signature: 'loadSubsystemSpec(id: string): SubsystemSpec | null'
    returns: SubsystemSpec | null
  - name: saveSubsystemSpec
    description: Saves a subsystem specification
    signature: 'saveSubsystemSpec(spec: SubsystemSpec): void'
    returns: void
  - name: loadComponentSpecs
    description: Loads all L2 component specifications from components/*.yaml
    signature: 'loadComponentSpecs(): ComponentSpec[]'
    returns: ComponentSpec[]
  - name: loadComponentSpec
    description: Loads a single component specification by id
    signature: 'loadComponentSpec(id: string): ComponentSpec | null'
    returns: ComponentSpec | null
  - name: saveComponentSpec
    description: Saves a component specification
    signature: 'saveComponentSpec(spec: ComponentSpec): void'
    returns: void
  - name: loadInterfaceSpecs
    description: Loads all L3 interface specifications from interfaces/*.yaml
    signature: 'loadInterfaceSpecs(): InterfaceSpec[]'
    returns: InterfaceSpec[]
  - name: loadInterfaceSpec
    description: Loads a single interface specification by id
    signature: 'loadInterfaceSpec(id: string): InterfaceSpec | null'
    returns: InterfaceSpec | null
  - name: saveInterfaceSpec
    description: Saves an interface specification
    signature: 'saveInterfaceSpec(spec: InterfaceSpec): void'
    returns: void
  - name: loadImplementationSpecs
    description: Loads all L4 implementation specifications from implementations/*.yaml
    signature: 'loadImplementationSpecs(): ImplementationSpec[]'
    returns: ImplementationSpec[]
  - name: loadImplementationSpec
    description: Loads a single implementation specification by id
    signature: 'loadImplementationSpec(id: string): ImplementationSpec | null'
    returns: ImplementationSpec | null
  - name: saveImplementationSpec
    description: Saves an implementation specification
    signature: 'saveImplementationSpec(spec: ImplementationSpec): void'
    returns: void
  - name: loadTypeSpecs
    description: Loads all type specifications (entities and value-objects) from types/*.yaml
    signature: 'loadTypeSpecs(): TypeSpec[]'
    returns: TypeSpec[]
    params: []
  - name: dryRunSerializeSpecs
    description: >-
      Re-serializes every currently loaded spec (subsystems, components, interfaces,
      implementations, types, and groups) in memory through the exact writer pipeline the save paths
      use — the same namespace relativization and the same schema parse, never a parallel
      reimplementation — without touching the filesystem. The optional include predicate skips
      out-of-scope specs BEFORE the expensive clone+parse so scoped validation pays scoped cost.
      Returns one ROUNDTRIP_SERIALIZATION issue per refused spec, naming the spec id and offending
      field path; never throws for an unserializable spec. Guarantees validate predicts every
      refusal lock or any save would raise.
    signature: 'dryRunSerializeSpecs(include?: (specId: string) => boolean): ValidationIssue[]'
    returns: ValidationIssue[]
    guarantees:
      - idempotent
  - name: findChainingParent
    description: >-
      Detect whether the CURRENTLY BOUND project root is a chained subproject: walk the filesystem
      upward (bounded) for an ancestor project holding a subsystem spec whose projectPath resolves
      exactly to this root. Returns the parent root and the mounting subsystem id, or null for a
      genuine top root. Pure detection — never rebinds, never mutates.
    signature: 'findChainingParent(): ChainingParentRef | null'
    returns: ChainingParentRef | null
  - name: listChainedRoots
    description: >-
      Every chained subproject root beneath the bound project, as project-relative directories in
      walk order (recursing through nested mounts). The downward companion to findChainingParent,
      and what a whole-tree operation needs to know which trees belong to this project.
    signature: 'listChainedRoots(): string[]'
    returns: string[]
    guarantees:
      - idempotent
  - name: invalidateCache
    description: >-
      Drop the cached spec index, for callers that changed the tree on disk outside the save paths
      (an imported tree swapped into place).
    signature: 'invalidateCache(): void'
    returns: void
    guarantees:
      - idempotent
  - name: resolveSubprojectForNamespace
    description: >-
      Resolve a chained mount's qualified namespace to its project root, or null. Pure 1:1 forward
      to the index read face.
    signature: 'resolveSubprojectForNamespace(namespace: string): string | null'
    returns: string | null
    params:
      - name: namespace
        type: string
status: complete
createdAt: '2026-06-11T14:50:00Z'
updatedAt: '2026-09-12T12:01:02.986Z'
