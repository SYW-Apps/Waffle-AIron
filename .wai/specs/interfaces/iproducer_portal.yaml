id: iproducer_portal
name: Producer Portal Interface
description: Inbound contract for the producers subsystem.
component: producer_portal
methods:
  - name: configure
    description: Persist a producer target's config (e.g. Notion parent page id) for the bound project.
    signature: 'configure(target: string, parentPageId: string): void'
    returns: void
  - name: produce
    description: >-
      Project the bound project's spec tree and push it to the target (with an optional live-canvas
      link), authenticating with the token the caller resolved and hands in: this subsystem never
      asks anyone for a secret by name.
    signature: 'produce(target: string, diagramUrl: string, token: string): void'
    returns: void
    params:
      - name: target
        type: string
      - name: diagramUrl
        type: string
      - name: token
        type: string
        description: The target service's credential, resolved by the caller
  - name: remove
    description: Remove a producer target's config.
    signature: 'remove(target: string): void'
    returns: void
  - name: list
    description: List configured producers for the bound project.
    signature: 'list(): ProducerConfig[]'
    returns: ProducerConfig[]
status: complete
createdAt: '2026-07-04T17:37:31.056Z'
updatedAt: '2026-09-25T22:01:46.523Z'
