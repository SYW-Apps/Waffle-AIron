id: ireference_finder
name: Reference Finder Interface
description: Answer what refers to one element, graded by evidence. Read-only.
component: reference_finder
methods:
  - name: collect
    description: >-
      Resolve the target to one element through the spec search (several equally strong candidates
      answer them as candidates and nothing else). Then gather its references: the design's own (the
      spec index's references to it — dependsOn, owns, call steps, type positions — and the export
      usage of every project in reach that uses it), the code's (calls the code model resolved to
      the element's realizing symbol, with their lines; imports of its realizing file; calls left
      unresolved that name it), the tests that import or name it, and, unless asked not to, text
      mentions. Join each declared edge with the code: confirmed when both have it, declared-only or
      observed-only when one does, unjudged for text or code read below exact grade. Mark a
      reference linked when it names the element's id rather than a bare name. List the waivers that
      cover the element (an unclaimed declaration, a carried finding, a lint.allow), and judge the
      impact as the widest place any reference sits, public when the element is exported beyond the
      project.
    signature: 'collect(target: string, includeText?: bool): LookupReferencesResult'
    returns: LookupReferencesResult
    params:
      - name: target
        type: string
        description: >-
          A spec id, owner.member for a method or field, portal.verb for an endpoint, or a
          project-relative file path; a looser query is searched and answered as candidates
      - name: includeText
        type: bool
        description: Include text mentions; true when omitted
        optional: true
status: complete
