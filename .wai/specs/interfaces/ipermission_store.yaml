id: ipermission_store
name: Permission Store Interface
description: >-
  Private contract for the authoritative in-memory permission-assignment grid, loaded from and
  swapped as one backing file (permissions.json under the hosted data root).
component: permission_store
methods:
  - name: load
    description: >-
      Load the persisted assignment collection from permissions.json under the hosted data root and
      hold it as the authoritative in-memory representation.
    signature: 'load(): list<PermissionAssignment>'
    returns: list<PermissionAssignment>
    params: []
  - name: replaceAll
    description: >-
      Atomically swap the in-memory assignment collection to the supplied complete set after the
      registry has persisted it.
    signature: 'replaceAll(assignments: list<PermissionAssignment>): void'
    returns: void
    params:
      - name: assignments
        type: list<PermissionAssignment>
status: complete
