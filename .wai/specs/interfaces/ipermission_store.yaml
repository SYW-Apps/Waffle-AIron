id: ipermission_store
name: Permission Store Interface
description: >-
  Private contract for the permission-assignment grid: read-through file I/O over permissions.json
  under the hosted data root; every change is an update under the file's write lock.
component: permission_store
methods:
  - name: load
    description: >-
      Read the persisted assignment collection fresh from permissions.json (no in-memory copy); an
      absent or empty file yields an empty collection.
    signature: 'load(): list<PermissionAssignment>'
    returns: list<PermissionAssignment>
    params: []
  - name: update
    description: >-
      Read the assignment collection fresh and persist what the change makes of it, holding the
      file's write lock (file_write_lock) across both, so two parallel grants in different processes
      are both kept; a change that throws writes nothing; a file that exists but cannot be read or
      parsed throws. Answers the collection written.
    signature: >-
      update(change: (assignments: PermissionAssignment[]) => PermissionAssignment[]):
      PermissionAssignment[]
    returns: list<PermissionAssignment>
    effect: write
status: complete
createdAt: '2026-07-15T20:27:47.138Z'
updatedAt: '2026-10-23T22:21:51.773Z'
