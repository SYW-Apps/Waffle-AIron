id: icli_packs_adapter
name: CLI Packs Adapter Interface
description: 'Terminal surface for the `wairon packs` command family: add (vendor + register), list, and remove.'
component: cli_packs_adapter
methods:
  - name: addPack
    description: >-
      Install a pack (`wairon pack add <source> [--global]`, legacy). ZIP-aware: a .wpack/.zip
      source is safely extracted via the SDK into .wai/packs/<name>/ (or the global packs dir) and
      the directory registered; a plain file/dir source is vendored + registered as before. Verifies
      the pack loads before registering anything. For a project it then shows the pack's impact
      BEFORE vendoring and registering the path reference — the probed manifest measured as a
      supplied candidate, since nothing is on disk yet — and asks to apply; declining vendors and
      registers nothing. Under --yes, or with no terminal to ask on, it applies and says so without
      the report. `--global` copies into the machine-wide folder and selects nothing for any
      project, so it shows no report.
    signature: 'addPack(source: string, global: boolean, yes?: boolean): void'
    returns: void
    params:
      - name: source
        type: string
      - name: global
        type: boolean
        optional: true
      - name: 'yes'
        type: boolean
        description: Apply without showing the impact report
        optional: true
  - name: listPacks
    description: List the loaded packs (global + project) with provenance and what each provides.
    signature: 'listPacks(): void'
    returns: void
    params: []
  - name: removePack
    description: Deregister and delete a vendored pack by name.
    signature: 'removePack(name: string, global: boolean): void'
    returns: void
    params:
      - name: name
        type: string
      - name: global
        type: boolean
        optional: true
  - name: initPack
    description: >-
      Scaffold a new pack project (`wairon pack init <name>`) via the SDK portal — declarative or
      code variant (--kind), optional skill stub (--skill) — into a target directory.
    signature: 'initPack(name: string, options: object): void'
    returns: void
    params:
      - name: name
        type: string
      - name: options
        type: object
        description: '{ kind?: ''declarative''|''code''; dir?: string; skill?: boolean }'
  - name: buildPack
    description: >-
      Build an installable .wpack archive from a pack directory (`wairon pack build [source]`) via
      the SDK portal; write it to <name>-<version>.wpack (or --out) and report the path + size.
    signature: 'buildPack(source: string, options: object): void'
    returns: void
    params:
      - name: source
        type: string
      - name: options
        type: object
        description: '{ out?: string }'
  - name: installPack
    description: >-
      `wairon pack install <source>` — install a pack into this wairon install's store from a pack
      DIRECTORY, a local .wpack archive, or an HTTP(S) URL. Applies to nothing: a project opts in
      separately by selecting the pack by name. A URL is fetched to a temporary file and then
      follows the identical archive path (SDK envelope inspection, code-pack refusal, extraction
      limits), so a remote pack is validated exactly like a local one with no second code path to
      diverge. A local-path origin is reported as unfetchable, because CI and a fresh clone could
      not obtain it. One exception to "applies to nothing" is an update in disguise: run inside a
      project whose selection of the same name floats (no version pin), a version that would become
      the latest installed changes that project's doctrine. Then, before the store write, it shows
      that project's impact (the extracted manifest measured as a supplied candidate for the
      floating selection) and asks to install; declining installs nothing. Under --yes, or with no
      terminal, it installs and says the floating selection now resolves to the new version, without
      the report. Other projects on the machine that float on the name are not measured: nothing
      here knows them.
    signature: 'installPack(source: string, yes?: boolean): void'
    returns: void
    params:
      - name: source
        type: string
        description: A pack directory or a .wpack/.zip archive.
      - name: 'yes'
        type: boolean
        description: Install without showing the impact report
        optional: true
  - name: uninstallStorePack
    description: >-
      `wairon pack uninstall <name>[@version]` — remove a pack from the store: the named version, or
      every version. Warns that a project still selecting it will now fail its gate rather than
      quietly losing the doctrine.
    signature: 'uninstallStorePack(spec: string): void'
    returns: void
    params:
      - name: spec
        type: string
        description: A pack name, or name@version.
  - name: whichPack
    description: >-
      `wairon pack which <name>[@version]` — identify exactly which installed pack a selection
      resolves to: version (flagging when it came from latest-by-default), path, content digest, and
      recorded origin. The answer to "which appenser am I actually getting?".
    signature: 'whichPack(spec: string): void'
    returns: void
    params:
      - name: spec
        type: string
        description: A pack name, or name@version.
  - name: usePack
    description: >-
      `wairon pack use <name>[@version]` — SELECT an installed pack for this project, recorded by
      name in .wai/project.yaml. Before anything is written it shows the pack's impact
      (validator_portal.measurePackImpact: what the pack changes against wairon's defaults, which of
      its profiles would govern, and the findings that change on this project) and asks to apply;
      declining writes nothing. Under --yes, or with no terminal to ask on, it applies without
      showing the report and says that it applied and how to see the report (`wairon pack impact`).
      The source is copied from the store's install record so the project self-describes how a fresh
      machine or CI runner obtains the same doctrine; --source overrides it, --pin freezes the
      resolved version and its content digest, and --bundle marks it for committing. Re-selecting a
      pack replaces its existing entry rather than duplicating it (an update: the report then also
      shows the replaced version), and an origin that is not a fetchable URL is reported because CI
      and a fresh clone could not resolve it.
    signature: 'usePack(spec: string, options: object): void'
    returns: void
    params:
      - name: spec
        type: string
        description: A pack name, or name@version.
      - name: options
        type: object
        description: source / pin / bundle / yes (apply without the report).
  - name: unusePack
    description: >-
      `wairon pack unuse <name>` — drop this project's selection of a pack. The pack stays installed
      in the store; only this project stops applying it.
    signature: 'unusePack(name: string): void'
    returns: void
    params:
      - name: name
        type: string
  - name: bundlePack
    description: >-
      `wairon pack bundle [name] [--all]` — commit a copy of a selected pack under
      .wai/packs/<name>/<version>/. A bundled pack resolves BEFORE the store, so a clone and CI
      apply the doctrine with an empty store and no network; this is what makes a repository
      self-sufficient for private packs and air-gapped builds. Bundling also PINS the selection's
      version, because a bundle is a copy of one specific version and a floating selection would let
      the committed bytes and the declared intent drift apart. With no argument it bundles every
      selection already marked for bundling.
    signature: 'bundlePack(name: string, options: object): void'
    returns: void
    params:
      - name: name
        type: string
        description: 'Optional pack name; omitted bundles every selection marked bundle: true.'
        optional: true
      - name: options
        type: object
        description: all — bundle every selection this project declares.
  - name: syncPacks
    description: >-
      `wairon pack sync` — install every declared-but-missing pack from the source its selection
      records. Takes NO arguments, because each selection carries its own source (copied from the
      store's install record when the pack was selected): this is the single command a fresh machine
      or CI runner needs, and the reason a cloned repository can reproduce its own doctrine.
      Already-resolvable selections (installed or bundled) are skipped; a selection with no source,
      an unexpanded {version} placeholder with no pinned version, or a non-URL source is an error
      naming the manual route. A pinned integrity digest is verified at install time rather than
      being discovered later by the gate. Fetching happens ONLY here and in `pack install <url>` —
      never during validation — because the core workflow must work offline.
    signature: 'syncPacks(): void'
    returns: void
    params: []
  - name: impactPack
    description: >-
      `wairon pack impact <name>[@version]` — show, on demand and writing nothing, what the pack
      changes: its doctrine against wairon's defaults, which of its profiles would govern this
      project, and the findings that change on this project. For a pack this project does not apply,
      or applies at another version, it measures applying the requested one (as `pack use` would
      record it); for one it applies exactly as asked, it measures removing it and presents the
      result as what the pack accounts for now. Refuses outside a wairon project, and for a pack not
      installed in the store, with the same messages `pack use` gives.
    signature: 'impactPack(spec: string): void'
    returns: void
    params:
      - name: spec
        type: string
        description: A pack name, or name@version.
status: complete
