id: iapproval_repository
name: Approval Repository Interface
description: Facade contract for durable hosted approval requests and decisions.
component: approval_repository
methods:
  - name: create
    description: Persist a new pending approval request with a redacted payload summary.
    signatureFrom: approval_registry.create
    guarantees:
      - atomic
  - name: decide
    description: >-
      Record an approval or denial decision for a pending approval request. The decision's decidedBy
      MUST differ from the request's requestedBy and the decider must hold an approval-capable
      grant; any self-approval attempt is rejected.
    signatureFrom: approval_registry.decide
    guarantees:
      - atomic
  - name: getById
    description: Return one approval request by id, or null when absent.
    signatureFrom: approval_index.getById
  - name: list
    description: List approval requests filtered by status, project, requester, or action kind.
    signatureFrom: approval_index.list
  - name: markCompleted
    description: >-
      Mark an approved request completed after the privileged workflow has executed successfully,
      recording the workflow's executionSummary on it when one is given (an executed project:init
      states what it applied).
    signatureFrom: approval_registry.markCompleted
    guarantees:
      - atomic
  - name: expirePending
    description: >-
      Expire pending approval requests older than their expiresAt timestamp and return the number
      expired.
    signatureFrom: approval_registry.expirePending
  - name: cancel
    description: >-
      Cancel an approved request whose privileged workflow refused because the request no longer
      describes what would be done (a project:lock whose pinned gate identity moved), recording the
      reason on it as its executionSummary. Only an approved request may be cancelled; a cancelled
      request is never executed.
    signatureFrom: approval_registry.cancel
    guarantees:
      - atomic
status: complete
createdAt: '2026-07-09T07:19:42.563Z'
