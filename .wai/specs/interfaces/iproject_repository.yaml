id: iproject_repository
name: Project Repository Interface
description: >-
  Contract for the hosted-project repository: id-to-root resolution for scoping, the hosted family a
  record belongs to, and project lifecycle persistence — family roots and, since stage 7, member
  records.
component: project_repository
methods:
  - name: resolveRoot
    description: >-
      Resolve the root path of the authorized hosted record — the rootPath projection of
      resolveBinding, kept for read-plane callers that need only the root. A member is its own
      record; a deprecated member-qualified selector resolves for one release to the member's
      record, never wider.
    signature: 'resolveRoot(principal: Principal, selector: string): string'
    returns: string
  - name: create
    description: Allocate an isolated project root, create its directory, and persist the record.
    signature: 'create(id: string): HostedProjectRecord'
    returns: HostedProjectRecord
  - name: list
    description: List all hosted-project records.
    signature: 'list(): HostedProjectRecord[]'
    returns: HostedProjectRecord[]
  - name: remove
    description: >-
      Deregister a project; a family root's isolated tree is removed with it, a member record's
      directory never is. Pure 1:1 forward.
    signature: 'remove(id: string): void'
    returns: void
  - name: resolveBinding
    description: >-
      Resolve the full authorized binding (the bound record's id and root, its family root id, and
      the deprecated qualifier when one resolved it) — the data-plane request seam; see the index's
      authorization matrix. Pure 1:1 forward.
    signature: 'resolveBinding(principal: Principal, selector: string): ProjectBinding | null'
    returns: ProjectBinding | null
  - name: existingRoot
    description: >-
      The root path of the hosted project registered under this id, or null. Pure 1:1 forward to the
      index; unscoped, for callers that authorized the operation it serves.
    signature: 'existingRoot(id: string): string | null'
    returns: string | null
    params:
      - name: id
        type: string
  - name: register
    description: >-
      Upsert a project record at an existing directory instead of allocating one under the data
      root. Pure 1:1 forward to the write registry.
    signature: 'register(id: string, rootPath: string): HostedProjectRecord'
    returns: HostedProjectRecord
    params:
      - name: id
        type: string
      - name: rootPath
        type: string
  - name: family
    description: The hosted family a record belongs to, family root first. Pure 1:1 forward to the index.
    signature: 'family(id: string): HostedProjectRecord[]'
    returns: HostedProjectRecord[]
    params:
      - name: id
        type: string
  - name: declaredMembers
    description: >-
      The members a family root declares on disk, nested included, each as the record it should
      hold. Pure 1:1 forward to the index.
    signature: 'declaredMembers(id: string): PlannedMemberRecord[]'
    returns: PlannedMemberRecord[]
    params:
      - name: id
        type: string
  - name: repositoryScope
    description: The repository root and the pathspecs a record commits through. Pure 1:1 forward to the index.
    signature: 'repositoryScope(id: string): RepositoryScope | null'
    returns: RepositoryScope | null
    params:
      - name: id
        type: string
  - name: registerMember
    description: Upsert a member record. Pure 1:1 forward to the write registry.
    signature: 'registerMember(record: HostedProjectRecord): HostedProjectRecord'
    returns: HostedProjectRecord
    params:
      - name: record
        type: HostedProjectRecord
  - name: setStatus
    description: >-
      Set a record's status, with the reason a disabled record is disabled. Pure 1:1 forward to the
      write registry.
    signature: 'setStatus(id: string, status: string, reason?: string): HostedProjectRecord'
    returns: HostedProjectRecord
    params:
      - name: id
        type: string
      - name: status
        type: string
      - name: reason
        type: string
        optional: true
  - name: isRetiredPart
    description: Whether a member record was retired as a part (stage 8). Pure 1:1 forward to the index.
    signature: 'isRetiredPart(record: HostedProjectRecord): boolean'
    returns: boolean
    params:
      - name: record
        type: HostedProjectRecord
  - name: declaredSubsystems
    description: >-
      The subsystem ids a record's spec tree declares now (a part's included), or null for an id
      with no root. Pure 1:1 forward to the index.
    signature: 'declaredSubsystems(id: string): string[] | null'
    returns: string[] | null
    params:
      - name: id
        type: string
    guarantees:
      - idempotent
  - name: partSubsystems
    description: The subsystem ids a record's part holds now, or null. Pure 1:1 forward to the index.
    signature: 'partSubsystems(id: string, alias: string): string[] | null'
    returns: string[] | null
    params:
      - name: id
        type: string
      - name: alias
        type: string
    guarantees:
      - idempotent
  - name: admitNarrowing
    description: >-
      Validate one projects-narrowing entry at mint time and answer what is stored (forwarded to the
      index): '*' and a record id as they are, a deprecated member-qualified entry mapped to the
      member's record id. An unknown project, an alias that declares no member, an internal
      subsystem, or a member no record holds is refused with guidance, so a broken narrowing is
      never stored.
    signature: 'admitNarrowing(entry: string): string'
    returns: string
    params:
      - name: entry
        type: string
        description: One entry of a mint request's projects narrowing.
    effect: read
status: complete
