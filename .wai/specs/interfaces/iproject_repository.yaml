id: iproject_repository
name: Project Repository Interface
description: >-
  Contract for the hosted-project repository: id-to-root resolution for scoping, plus project
  lifecycle persistence.
component: project_repository
methods:
  - name: resolveRoot
    description: >-
      Resolve the isolated root path of the authorized project (or mounted chained subproject) — the
      rootPath projection of resolveBinding, kept for read-plane callers that need only the root.
      Honors the optional selector only within the principal's authorized set; a
      subproject-qualified selector or narrowing entry ('projectId::subsystemId', nested mounts
      composing) resolves to the CHAINED CHILD's root INSIDE the project's isolated tree; unknown or
      non-chained mounts are rejected, never silently widened to the project root; a qualified
      principal can never bind wider than its qualifier; the selector can never widen scope.
    signature: 'resolveRoot(principal: Principal, selector: string): string'
    returns: string
  - name: create
    description: Allocate an isolated project root, create its directory, and persist the record.
    signature: 'create(id: string): HostedProjectRecord'
    returns: HostedProjectRecord
  - name: list
    description: List all hosted-project records.
    signature: 'list(): HostedProjectRecord[]'
    returns: HostedProjectRecord[]
  - name: remove
    description: Deregister a project and remove its isolated tree.
    signature: 'remove(id: string): void'
    returns: void
  - name: resolveBinding
    description: >-
      Resolve the full authorized binding (root to bind + TOP project id + bound subproject chain) —
      the data-plane request seam; see the index's authorization matrix. Pure 1:1 forward.
    signature: 'resolveBinding(principal: Principal, selector: string): ProjectBinding | null'
    returns: ProjectBinding | null
  - name: existingRoot
    description: >-
      The root path of the hosted project registered under this id, or null. Pure 1:1 forward to the
      index; unscoped, for callers that authorized the operation it serves.
    signature: 'existingRoot(id: string): string | null'
    returns: string | null
    params:
      - name: id
        type: string
  - name: register
    description: >-
      Upsert a project record at an existing directory instead of allocating one under the data
      root. Pure 1:1 forward to the write registry.
    signature: 'register(id: string, rootPath: string): HostedProjectRecord'
    returns: HostedProjectRecord
    params:
      - name: id
        type: string
      - name: rootPath
        type: string
status: complete
