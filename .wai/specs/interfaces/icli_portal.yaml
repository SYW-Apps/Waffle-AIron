    signatureFrom: cli_runner.runMemberDetach
    endpoint:
      transport: CLI
      command: wairon member detach <alias>
  - name: memberAdopt
    description: >-
      `wairon member adopt <alias>`: make an external inside this project a member again (a family
      migration).
    signatureFrom: cli_runner.runMemberAdopt
    endpoint:
      transport: CLI
      command: wairon member adopt <alias>
  - name: memberRenameAlias
    description: '`wairon member rename-alias <old> <new>`: rename one alias family-wide (a family migration).'
    signatureFrom: cli_runner.runMemberRenameAlias
    endpoint:
      transport: CLI
      command: wairon member rename-alias <old> <new>
  - name: memberInternalize
