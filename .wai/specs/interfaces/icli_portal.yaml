  - name: memberPromote
    description: '`wairon member promote <alias>`: make a part an independent project (a family migration).'
    signatureFrom: cli_runner.runMemberPromote
    endpoint:
      transport: CLI
      command: wairon member promote <alias>
  - name: memberDemote
    description: '`wairon member demote <alias>`: make a project member a part (a family migration).'
    signatureFrom: cli_runner.runMemberDemote
    endpoint:
      transport: CLI
      command: wairon member demote <alias>
  - name: projectRename
    description: '`wairon project rename <new-id>`: move a project''s id family-wide (a family migration).'
    signatureFrom: cli_runner.runProjectRename
    endpoint:
      transport: CLI
      command: wairon project rename <new-id>
  - name: subsystemExternalize
    description: >-
      `wairon subsystem externalize <id>`: move an internal subsystem into a part (a family
      migration).
    signatureFrom: cli_runner.runSubsystemExternalize
    endpoint:
      transport: CLI
      command: wairon subsystem externalize <id>
  - name: update
    description: '`wairon update`: check for and install the latest release.'
    signatureFrom: cli_runner.runUpdate
    endpoint:
      transport: CLI
      command: wairon update
  - name: domainsList
    description: '`wairon domains list`: the project''s domains.'
    signatureFrom: cli_runner.runDomainsList
    endpoint:
      transport: CLI
      command: wairon domains list
  - name: domainsScan
    description: '`wairon domains scan`: detect new domain candidates.'
    signatureFrom: cli_runner.runDomainsScan
    endpoint:
      transport: CLI
      command: wairon domains scan
  - name: domainsAdd
    description: '`wairon domains add`: register a domain by hand.'
    signatureFrom: cli_runner.runDomainsAdd
    endpoint:
      transport: CLI
      command: wairon domains add
  - name: domainsRemove
    description: '`wairon domains remove <id>`: remove a free-standing domain.'
    signatureFrom: cli_runner.runDomainsRemove
    endpoint:
      transport: CLI
      command: wairon domains remove <id>
  - name: skillsList
    description: '`wairon skills list`: the workflow skills and their install state.'
    signatureFrom: cli_runner.runSkillsList
    endpoint:
      transport: CLI
      command: wairon skills list
  - name: skillsInstall
    description: '`wairon skills install`: install or sync the workflow skills.'
    signatureFrom: cli_runner.runSkillsInstall
    endpoint:
      transport: CLI
      command: wairon skills install
