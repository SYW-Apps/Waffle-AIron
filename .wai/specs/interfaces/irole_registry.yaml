id: irole_registry
name: Role Registry Interface
description: >-
  Private write-path contract for permission roles. Owns id/timestamp stamping and duplicate-id
  rejection; performs no authorization.
component: role_registry
methods:
  - name: create
    description: >-
      Create one role: stamp id (when absent) and createdAt, reject a duplicate id, persist the full
      role collection durably, and refresh the store.
    signature: 'create(role: Role): Role'
    returns: Role
    params:
      - name: role
        type: Role
    guarantees:
      - atomic
  - name: update
    description: >-
      Update one existing role by id (name, description, permissions), preserving
      createdAt/createdBy; validation error when absent. Persist durably and refresh the store.
    signature: 'update(role: Role): Role'
    returns: Role
    params:
      - name: role
        type: Role
    guarantees:
      - atomic
  - name: delete
    description: >-
      Delete one role by id, persist durably, and refresh the store; deleting an absent role is a
      no-op. Callers are responsible for clearing role bindings that reference it.
    signature: 'delete(roleId: string): void'
    returns: void
    params:
      - name: roleId
        type: string
lint:
  allow: []
status: complete
