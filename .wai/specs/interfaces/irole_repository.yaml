id: irole_repository
name: Role Repository Interface
description: >-
  Facade contract for permission-role definitions — writes forward to the role registry, reads to
  the role index.
component: role_repository
methods:
  - name: create
    description: 'Facade: create one role through the registry.'
    signatureFrom: role_registry.create
    guarantees:
      - atomic
  - name: update
    description: 'Facade: update one role through the registry.'
    signatureFrom: role_registry.update
    guarantees:
      - atomic
  - name: delete
    description: 'Facade: delete one role through the registry.'
    signatureFrom: role_registry.delete
  - name: list
    description: 'Facade: list roles through the index.'
    signatureFrom: role_index.list
  - name: effective
    description: >-
      The effective role set permission rules walk: the intrinsic built-in roles merged over the
      stored admin-defined ones (forwarded to the index). Built-ins are code constants, never stored
      rows, so a binding to one always resolves; a stored row carrying a reserved id never shadows
      the built-in definition.
    signatureFrom: role_index.effective
    effect: read
lint:
  allow: []
status: complete
createdAt: '2026-07-15T20:27:40.646Z'
updatedAt: '2026-10-03T21:10:32.256Z'
