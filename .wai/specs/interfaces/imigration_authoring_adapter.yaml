id: imigration_authoring_adapter
name: Migration Authoring Client Adapter Interface
description: The two gated writes the chaining migration makes, at the project root the caller has bound.
component: migration_authoring_adapter
methods:
  - name: updateSpecGated
    description: >-
      Forward a delta to authoring_portal.updateSpecGated: merged, judged and written, or with
      dryRun judged and not written; answers the change report.
    signature: >-
      updateSpecGated(kind: WritableSpecKind, id: string, delta: SpecDelta, dryRun?: bool):
      SpecChangeReport
    returns: SpecChangeReport
    params:
      - name: kind
        type: WritableSpecKind
        description: The kind of spec the id names
      - name: id
        type: string
        description: The stored spec's id
      - name: delta
        type: SpecDelta
        description: The partial change to merge
      - name: dryRun
        type: bool
        description: Answer what the delta would do and write nothing
        optional: true
  - name: writeSpec
    description: Forward a whole-spec restatement to authoring_portal.writeSpec; answers the write receipt.
    signature: 'writeSpec(restatement: SpecRestatement): SpecWriteReceipt'
    returns: SpecWriteReceipt
    params:
      - name: restatement
        type: SpecRestatement
        description: The spec as the migration states it
status: complete
createdAt: '2026-09-30T20:45:34.881Z'
updatedAt: '2026-10-04T23:37:41.640Z'
