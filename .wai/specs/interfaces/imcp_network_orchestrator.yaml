id: imcp_network_orchestrator
name: MCP Network Orchestrator Interface
description: 'The network tools'' workflows: two reads and the network declaration.'
component: mcp_network_orchestrator
methods:
  - name: flows
    description: >-
      The sdd_get_network_flows workflow: the allowed-flows matrix of the bound project (its family
      at a project that declares members, within the request's reach), optionally filtered to the
      flows into one project, Portal or verb. Read-only.
    signature: 'flows(to: string?): list<NetworkFlow>'
    returns: list<NetworkFlow>
    params:
      - name: to
        type: string?
        description: Keep only the flows into this project, project::portal or project::portal.verb
  - name: explain
    description: 'The sdd_explain_flow workflow: why one party may reach another, from the design. Read-only.'
    signature: 'explain(from: string, to: string): FlowExplanation'
    returns: FlowExplanation
    params:
      - name: from
        type: string
        description: A project, a subsystem, a component, outside or network[:<id>]
      - name: to
        type: string
        description: A project, a subsystem, a portal or a portal.verb
  - name: declare
    description: >-
      The sdd_set_network workflow: declare (with its description) or remove the bound project's
      network in .wai/project.yaml, through the core client adapter, so the assistant can make the
      design-level fact the network rules read without a hand edit. Returns whether it wrote.
    signature: 'declare(declared: bool, description: string?): bool'
    returns: bool
    params:
      - name: declared
        type: bool
        description: true declares the network, false removes the declaration
      - name: description
        type: string?
        description: What the network encloses, in the project's words; only with declared
    guarantees:
      - idempotent
    previousNames:
      - imcp_network_orchestrator.setNetwork
status: complete
