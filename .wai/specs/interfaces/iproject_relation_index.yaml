id: iproject_relation_index
name: Project Relation Index Interface
description: >-
  Private read-path contract over the cross-project relation set, matching the repository facade's
  list filters.
component: project_relation_index
methods:
  - name: list
    description: >-
      List cross-project relations matching every populated filter — source project id, target
      project id, and status — otherwise all relations.
    signature: >-
      list(sourceProjectId: string, targetProjectId: string, status: string):
      ProjectRelationRecord[]
    returns: ProjectRelationRecord[]
    params:
      - name: sourceProjectId
        type: string
        optional: true
      - name: targetProjectId
        type: string
        optional: true
      - name: status
        type: string
        optional: true
status: complete
