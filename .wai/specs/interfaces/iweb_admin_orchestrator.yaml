id: iweb_admin_orchestrator
name: Web Admin Orchestrator Interface
description: >-
  Contract for the web UI's admin control-bridge on the PUBLIC data plane: user,
  identity-provider/SSO, role and permission-assignment administration, plus the user's own
  single-project MCP token self-service. Every method takes the browser sessionId as its credential
  and hands it straight to the control-plane orchestrator that owns the capability, whose scope
  authorization and auditing apply unchanged. The instance-structure surfaces this bridge does not
  forward — organization units, project placements and the secret key names — are the web instance
  admin orchestrator's own contract.
component: web_admin_orchestrator
methods:
  - name: listUsers
    description: >-
      Forward to identity_orchestrator.listUsers with the session as the credential; returns the
      hosted users within the caller's scope, optionally narrowed to one project's grant holders.
    signature: 'listUsers(sessionId: string, project?: string): list<HostedUserRecord>'
    returns: list<HostedUserRecord>
    params:
      - name: sessionId
        type: string
      - name: project
        type: string
        optional: true
  - name: upsertUser
    description: >-
      Forward to identity_orchestrator.upsertUser with the session as the credential; creates or
      updates a hosted user, scope-checked and audited by the identity orchestrator.
    signature: 'upsertUser(sessionId: string, record: HostedUserRecord): HostedUserRecord'
    returns: HostedUserRecord
    params:
      - name: sessionId
        type: string
      - name: record
        type: HostedUserRecord
  - name: setUserStatus
    description: >-
      Forward to identity_orchestrator.setUserStatus with the session as the credential; sets a
      user's lifecycle status (a deactivation revokes the user's tokens and web sessions upstream).
    signature: 'setUserStatus(sessionId: string, userId: string, status: string): HostedUserRecord'
    returns: HostedUserRecord
    params:
      - name: sessionId
        type: string
      - name: userId
        type: string
      - name: status
        type: string
  - name: listIdentityProviders
    description: >-
      Forward to identity_orchestrator.listProviders with the session as the credential; returns the
      configured identity providers (instance-admin only upstream).
    signature: 'listIdentityProviders(sessionId: string): list<IdentityProviderConfig>'
    returns: list<IdentityProviderConfig>
    params:
      - name: sessionId
        type: string
  - name: upsertIdentityProvider
    description: >-
      Forward to identity_orchestrator.upsertProvider with the session as the credential; creates or
      updates one identity-provider (SSO) configuration. The config carries a clientSecretRef, never
      a raw secret.
    signature: >-
      upsertIdentityProvider(sessionId: string, config: IdentityProviderConfig):
      IdentityProviderConfig
    returns: IdentityProviderConfig
    params:
      - name: sessionId
        type: string
      - name: config
        type: IdentityProviderConfig
  - name: removeIdentityProvider
    description: >-
      Forward to identity_orchestrator.removeProvider with the session as the credential; removes
      one identity-provider configuration by id.
    signature: 'removeIdentityProvider(sessionId: string, id: string): void'
    returns: void
    params:
      - name: sessionId
        type: string
      - name: id
        type: string
  - name: mintProjectToken
    description: >-
      Mint a single-project MCP token for an AI agent. Forwards to identity_orchestrator.mintToken
      with the session as the credential and a token request scoped to EXACTLY ONE project
      (mcp:read, plus mcp:write when write is true); mintToken authorizes strictly against the
      caller's own access to that project. Returns the plaintext token once. This is an agent
      credential, entirely separate from the human's web session.
    signature: 'mintProjectToken(sessionId: string, projectId: string, write: bool): string'
    returns: string
    params:
      - name: sessionId
        type: string
      - name: projectId
        type: string
      - name: write
        type: bool
  - name: revokeProjectToken
    description: >-
      Revoke a previously minted MCP token by id. Forwards to identity_orchestrator.revokeToken with
      the session as the credential (which authorizes key management for the token's owner/scope).
    signature: 'revokeProjectToken(sessionId: string, tokenId: string): void'
    returns: void
    params:
      - name: sessionId
        type: string
      - name: tokenId
        type: string
  - name: listMyTokens
    description: >-
      Return the caller's own minted MCP tokens (redacted) by forwarding to
      identity_orchestrator.listSelfTokens with the session as the credential.
    signature: 'listMyTokens(sessionId: string): list<ApiKeyRecord>'
    returns: list<ApiKeyRecord>
    params:
      - name: sessionId
        type: string
  - name: listRoles
    description: >-
      Forward to permission_admin_orchestrator.listRoles with the session as the credential
      (instance-admin only upstream).
    signature: 'listRoles(sessionId: string): list<Role>'
    returns: list<Role>
    params:
      - name: sessionId
        type: string
  - name: createRole
    description: Forward to permission_admin_orchestrator.createRole with the session as the credential.
    signature: 'createRole(sessionId: string, role: Role): Role'
    returns: Role
    params:
      - name: sessionId
        type: string
      - name: role
        type: Role
  - name: updateRole
    description: Forward to permission_admin_orchestrator.updateRole with the session as the credential.
    signature: 'updateRole(sessionId: string, role: Role): Role'
    returns: Role
    params:
      - name: sessionId
        type: string
      - name: role
        type: Role
  - name: deleteRole
    description: Forward to permission_admin_orchestrator.deleteRole with the session as the credential.
    signature: 'deleteRole(sessionId: string, roleId: string): void'
    returns: void
    params:
      - name: sessionId
        type: string
      - name: roleId
        type: string
  - name: listAssignments
    description: >-
      Forward to permission_admin_orchestrator.listAssignments with the session as the credential
      (project:admin over the scope upstream).
    signature: >-
      listAssignments(sessionId: string, scopeKind?: ScopeKind, scopeId?: string, subjectKind?:
      AssignmentSubjectKind, subjectId?: string): list<PermissionAssignment>
    returns: list<PermissionAssignment>
    params:
      - name: sessionId
        type: string
      - name: scopeKind
        type: ScopeKind
        optional: true
      - name: scopeId
        type: string
        optional: true
      - name: subjectKind
        type: AssignmentSubjectKind
        optional: true
      - name: subjectId
        type: string
        optional: true
  - name: setAssignment
    description: Forward to permission_admin_orchestrator.setAssignment with the session as the credential.
    signature: 'setAssignment(sessionId: string, assignment: PermissionAssignment): PermissionAssignment'
    returns: PermissionAssignment
    params:
      - name: sessionId
        type: string
      - name: assignment
        type: PermissionAssignment
  - name: removeAssignment
    description: Forward to permission_admin_orchestrator.removeAssignment with the session as the credential.
    signature: 'removeAssignment(sessionId: string, assignmentId: string): void'
    returns: void
    params:
      - name: sessionId
        type: string
      - name: assignmentId
        type: string
  - name: bindRole
    description: Forward to permission_admin_orchestrator.bindRole with the session as the credential.
    signature: >-
      bindRole(sessionId: string, userId: string, roleId: string, scopeKind?: ScopeKind, scopeId?:
      string): HostedUserRecord
    returns: HostedUserRecord
    params:
      - name: sessionId
        type: string
      - name: userId
        type: string
      - name: roleId
        type: string
      - name: scopeKind
        type: ScopeKind
        optional: true
      - name: scopeId
        type: string
        optional: true
  - name: unbindRole
    description: Forward to permission_admin_orchestrator.unbindRole with the session as the credential.
    signature: >-
      unbindRole(sessionId: string, userId: string, roleId: string, scopeKind?: ScopeKind, scopeId?:
      string): HostedUserRecord
    returns: HostedUserRecord
    params:
      - name: sessionId
        type: string
      - name: userId
        type: string
      - name: roleId
        type: string
      - name: scopeKind
        type: ScopeKind
        optional: true
      - name: scopeId
        type: string
        optional: true
  - name: explainPermission
    description: >-
      Forward to permission_admin_orchestrator.explain with the session as the credential
      (project:admin over the scope upstream): one user's effective permission at a unit, project or
      subsystem scope, with the rung that decided it.
    signature: >-
      explainPermission(sessionId: string, userId: string, capability: string, scopeKind: ScopeKind,
      scopeId: string): EffectivePermission
    returns: EffectivePermission
    params:
      - name: sessionId
        type: string
      - name: userId
        type: string
      - name: capability
        type: string
      - name: scopeKind
        type: ScopeKind
      - name: scopeId
        type: string
status: complete
