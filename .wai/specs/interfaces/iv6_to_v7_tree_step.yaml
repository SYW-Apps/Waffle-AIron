id: iv6_to_v7_tree_step
name: v6 to v7 Tree Step Contract
description: >-
  One step of the chain: v6 lock forms to v7 forms, for one project at a time, planned and written
  onto a rehearsal root the orchestrator binds.
component: v6_to_v7_tree_step
methods:
  - name: familyRoots
    description: >-
      The project roots of the family under a root (its own members, at every depth), the top first,
      read through the core: v6 and v7 spec forms are the same.
    signature: 'familyRoots(root: string): list<string>'
    returns: list<string>
    params:
      - name: root
        type: string
    effect: read
  - name: plan
    description: >-
      What moving the project at the bound root from v6 to v7 rewrites, and what it leaves for an
      author, without writing anything: the lock record's new format and whether its approval is
      carried (and if not, what moved or could not be compared), the inputs lock replacing the
      externals lock with each path pin it drops, and the packs it records. Refused for a tree still
      holding wairon 5 forms, naming `npx wairon@6 upgrade`.
    signature: 'plan(root: string): StepPlan'
    returns: StepPlan
    params:
      - name: root
        type: string
    effect: read
  - name: write
    description: >-
      Write a step plan onto the bound root (a rehearsal copy, never a live tree): the format-4 lock
      record, the inputs lock, and the removal of the v6 externals lock and the dropped path
      snapshots.
    signature: 'write(plan: StepPlan): void'
    returns: void
    params:
      - name: plan
        type: StepPlan
    effect: write
  - name: whatChanged
    description: >-
      The short, user-facing account of what moving to v7 changes for a project: a few lines, most
      important first.
    signature: 'whatChanged(): list<string>'
    returns: list<string>
    params: []
    effect: none
  - name: unfinished
    description: >-
      The roots whose tree still holds a wairon 6 lock form (a lock record before format 4, or a
      .wai/externals.lock.yaml): an upgrade an earlier run committed without finishing, which the
      step runs again.
    signature: 'unfinished(roots: list<string>): list<string>'
    returns: list<string>
    params:
      - name: roots
        type: list<string>
    effect: read
status: complete
createdAt: '2026-11-20T01:24:43.593Z'
updatedAt: '2026-11-20T01:24:45.174Z'
