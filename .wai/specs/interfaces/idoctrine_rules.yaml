id: idoctrine_rules
name: Doctrine Rules Interface
description: >-
  One method per rule, named after it, in run order. Each takes the run's RuleContext, reports
  through its addIssue, and declares the codes it reports as findings. These rules judge the
  architecture standard's stereotype and pattern doctrine.
component: doctrine_rules
methods:
  - name: portalEndpoints
    description: >-
      Rule portal-endpoints. A Portal binds every interface method to a concrete endpoint of its own
      transport, when that transport requires one (transport.requiresEndpoint): every transport but
      InProcess, whose verbs are the contract methods themselves, and Custom, whose address is
      free-form.
    signature: 'portalEndpoints(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: MISSING_ENDPOINT
        severity: error
        summary: Portal method without a wire endpoint binding, on a transport that requires one
      - code: ENDPOINT_TRANSPORT_MISMATCH
        severity: error
        summary: Endpoint transport does not match the Portal's transport
  - name: nonPortalEndpoints
    description: >-
      Rule non-portal-endpoints. Only a Portal may carry endpoints: a method on a non-Portal
      component's interface that declares one is publishing a block that is not the system's
      boundary as if it were.
    signature: 'nonPortalEndpoints(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: ARCHITECTURE_VIOLATION_NON_PORTAL_ENDPOINT
        severity: error
        summary: Non-Portal component method declaring an endpoint
  - name: portalCallAuth
    description: >-
      Rule portal-call-auth. Hardens authenticated cross-service calls. An OUTBOUND narrative `call`
      into ANOTHER component's Portal whose auth is not `none` must (a) be made by an Adapter — the
      only block that does external I/O — and (b) declare the credential source it presents via the
      step's `auth.from`. Absence of a source warns PORTAL_AUTH_UNMET; a non-Adapter presenter warns
      AUTH_PRESENTER_NOT_ADAPTER. The actual secret is never stored in the spec. Dispatch steps (a
      portal's OWN inbound routing) and self-calls are not cross-service calls and are excluded.
    signature: 'portalCallAuth(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: PORTAL_AUTH_UNMET
        severity: warning
        summary: >-
          A narrative call into another component's authed Portal does not declare where its
          credential loads from
      - code: AUTH_PRESENTER_NOT_ADAPTER
        severity: warning
        summary: >-
          A non-Adapter component authenticates an outbound call to a portal (external I/O must go
          through an Adapter)
  - name: authSourceWiring
    description: >-
      Rule auth-source-wiring. Resolves the credential source a narrative call presents to an
      authenticated Portal. When the step's `auth.from` is a modeled reference (`component:<id>`) it
      must name a component that exists (UNKNOWN_AUTH_SOURCE), that can hold or load a secret — an
      Adapter or a Store (AUTH_SOURCE_NOT_PROVIDER) — and that the presenting component depends on
      or owns (AUTH_SOURCE_UNWIRED). Opaque sources (env:/config:/vault:/free note) are design notes
      and are never resolved; a missing source is portal-call-auth's finding.
    signature: 'authSourceWiring(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: UNKNOWN_AUTH_SOURCE
        severity: warning
        summary: 'auth.from references a component: source that does not exist'
      - code: AUTH_SOURCE_NOT_PROVIDER
        severity: warning
        summary: auth.from references a component that is not an Adapter or Store
      - code: AUTH_SOURCE_UNWIRED
        severity: warning
        summary: 'The presenter declares a component: credential source it does not depend on or own'
  - name: subsystemBoundaryDependencies
    description: >-
      Rule subsystem-boundary-dependencies. Judges every dependsOn edge that leaves its own
      subsystem, and every one that resolves nowhere. Across subsystems the shape is client Adapter
      → published remote Portal, OR a direct in-process edge licensed by a trustedLink declared on
      the SOURCE subsystem (the published-Portal target requirement applies either way). A published
      surface may also name the subsystems it serves (a publicInterfaces entry's consumers): a
      component every one of whose entries names consumers may be depended on only from those
      subsystems. An edge into another project is judged on the contract entry it resolves to
      (resolveSurfaceRef: a contained member's live table, a declared external's pin, or a foreign
      snapshot). When that entry is backed by an InProcess Portal the edge is a library call (reach
      library): any component may make it directly, no Adapter is asked for, and library-calls
      judges it instead. Any other entry asks for the same Adapter as a cross-subsystem hop, and
      foreign snapshots of several providers that disagree make it SURFACE_REF_AMBIGUOUS. An edge
      into another project that does not resolve is reported once, by project-boundaries, with its
      resolution; never here, and never as the retired CROSS_TREE_REF_UNRESOLVED warning. A bare id
      that names nothing is INVALID_DEPENDENCY_REFERENCE. Boundary rules are never relaxed by a pack
      profile.
    signature: 'subsystemBoundaryDependencies(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: INVALID_DEPENDENCY_REFERENCE
        severity: error
        summary: dependsOn names a non-existent component
      - code: SURFACE_REF_AMBIGUOUS
        severity: error
        summary: >-
          Cross-tree dependsOn matched by surface snapshots of several providers with different
          contracts
      - code: CROSS_SUBSYSTEM_NON_ADAPTER
        severity: error
        summary: Non-Adapter component crossing a subsystem boundary
      - code: CROSS_SUBSYSTEM_PRIVATE_ACCESS
        severity: error
        summary: Cross-subsystem dependency on an unpublished component
      - code: CROSS_SUBSYSTEM_TARGET_NON_PORTAL
        severity: error
        summary: Cross-subsystem hop entering through a non-Portal
      - code: CROSS_SUBSYSTEM_UNLISTED_CONSUMER
        severity: error
        summary: Cross-subsystem dependency on a surface published only to other subsystems
  - name: logicDependencyClass
    description: >-
      Rule logic-dependency-class. Bounds an Orchestrator's dependencies by the dependencyClass it
      declares: pure logic depends only on pure Orchestrators; read logic also on read
      Orchestrators, Repositories, Indexes and Adapters; an Orchestrator that declares no class is a
      workflow and may depend on anything the rest of the matrix allows. Whether read logic calls a
      WRITE method on one of those is judged only once facade methods carry effect tags.
    signature: 'logicDependencyClass(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: DEPENDENCY_CLASS_VIOLATION
        severity: error
        summary: >-
          Orchestrator depending on a component its dependencyClass does not allow: pure logic
          depends only on pure Orchestrators; read logic also on read Orchestrators, Repositories,
          Indexes and Adapters
  - name: dataBlockDependencies
    description: >-
      Rule data-block-dependencies. Keeps the data layer facing down. A Store may depend only on
      another Store, a backend Adapter or pure logic — Registries and Indexes depend on the Store,
      never the reverse. A Registry is the write path to its Store and may depend on that Store, a
      backend Adapter, or the pure logic that validates the write. An Index is a read projection and
      a Query a computed read, each over its Store through a backend Adapter where one serves it; as
      an exceptional case an Index may project another Index of the same Repository, never in a
      cycle. An Adapter is a sink toward the system: it may use pure logic, but never a Store or any
      other Orchestrator.
    signature: 'dataBlockDependencies(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: ARCHITECTURE_VIOLATION_STORE_DEP
        severity: error
        summary: Store depending on anything but another Store, a backend Adapter or pure logic
      - code: ARCHITECTURE_VIOLATION_REGISTRY_DEP
        severity: warning
        summary: >-
          Registry depending on anything but its Store, a backend Adapter or pure logic (warning
          while new; aligned to the standard §7 validate→write path)
      - code: ARCHITECTURE_VIOLATION_ADAPTER_DEP
        severity: error
        summary: Adapter depending on a Store or on an Orchestrator that is not pure
      - code: ARCHITECTURE_VIOLATION_INDEX_DEP
        severity: error
        summary: >-
          Index depending on anything but its Store, an Adapter, pure logic or another Index of its
          own Repository (never in a cycle)
      - code: ARCHITECTURE_VIOLATION_QUERY_DEP
        severity: error
        summary: Query depending on anything but its Store, a backend Adapter or pure logic
  - name: entrypointDependencies
    description: >-
      Rule entrypoint-dependencies. Judges the edges at the system's entry points and its process
      layer. Portals and Observers are top-level entry points and subscribers, so nothing may depend
      on them — and that is the edge's one finding, which is why no other matrix rule judges it.
      Downward, a Portal dispatches to Orchestrators and may READ through Indexes and Repository
      facades but never reaches Store/Registry/Query or an Adapter, while an Observer forwards to
      one Orchestrator or Supervisor over a message-bus Adapter. A View stays a passive presenter. A
      Supervisor stays out of presentation; what it may do to the data it reaches is judged per call
      (supervisor-shared-data), and what it owns as its supervision state by the ownership rules. A
      component depending on a live Actor reaches it through the Actor's supervision: by depending
      on a Supervisor that supervises it, or on a Registry such a Supervisor maintains (owns, or
      calls with lifecycle-effect methods) — the lookup hop callers really take.
    signature: 'entrypointDependencies(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: ARCHITECTURE_VIOLATION_PORTAL_DEP
        severity: error
        summary: Component depending on a Portal/Observer
      - code: ARCHITECTURE_VIOLATION_PORTAL_FORBIDDEN_DEP
        severity: error
        summary: Portal/Observer reaching the data layer directly
      - code: ARCHITECTURE_VIOLATION_VIEW_DEP
        severity: error
        summary: View depending on persistence layers or on logic that is not pure
      - code: ARCHITECTURE_VIOLATION_SUPERVISOR_DEP
        severity: error
        summary: >-
          Supervisor depending on a presentation block (View, FeatureComponent, RouterComponent) — a
          Supervisor manages live processes; the data it reaches is judged per call by
          supervisor-shared-data
      - code: ACTOR_REACHED_WITHOUT_SUPERVISOR
        severity: error
        summary: >-
          Component depending on a live Actor it does not supervise, reaching it neither through a
          Supervisor that supervises it nor through a Registry such a Supervisor maintains — model
          the real lookup hop
  - name: portalWriteShortcut
    description: >-
      Rule portal-write-shortcut. A Portal narrative call step or dispatch-table binding that
      reaches a write- or lifecycle-effect method on a Repository or Index directly is the write
      shortcut: the Portal→data-facade edge is licensed for reads only, and a mutation — a write, or
      a lifecycle change to what exists — routes through an Orchestrator that owns the workflow. A
      dispatch step reaches its server only through a table binding, so judging every binding judges
      each dispatch step that takes it, once, where the route is declared. Methods that carry no
      effect tag are not judged.
    signature: 'portalWriteShortcut(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: PORTAL_WRITE_SHORTCUT
        severity: error
        summary: >-
          Portal narrative call or dispatch-table binding reaches a write- or lifecycle-effect
          method on a Repository/Index directly — reads may shortcut, mutations route through an
          Orchestrator (judged on effect-tagged facade methods; untagged methods are not yet judged)
  - name: patternMembership
    description: >-
      Rule pattern-membership. Only patterns (Repository/FeatureComponent/RouterComponent) own
      member blocks, and every pattern owns at least one. The one building block that may own is a
      Supervisor, which owns its supervision state and may own nothing at all; what it may own is
      pattern-containment's question. Each claim must name a component that exists and is itself a
      building block — patterns compose at the subsystem (L1) level, never by owning one another —
      and a block has exactly one owner, the first pattern or Supervisor to claim it.
    signature: 'patternMembership(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: EMPTY_PATTERN
        severity: error
        summary: Pattern with no owned member blocks
      - code: BLOCK_OWNS_MEMBERS
        severity: error
        summary: Building block other than a Supervisor using owns
      - code: INVALID_OWNED_MEMBER
        severity: error
        summary: owns names a non-existent component
      - code: PATTERN_OWNS_PATTERN
        severity: error
        summary: Pattern owning another pattern
      - code: SHARED_OWNED_MEMBER
        severity: error
        summary: Block owned by two owners (patterns or Supervisors)
  - name: patternContainment
    description: >-
      Rule pattern-containment. Holds each owner to the containment its definition prescribes. A
      Repository may own only Store, Registry, Index, Query and (optionally) Adapter, judged member
      by member. A Supervisor may own only its supervision state — Stores and Registries that are
      its own, one hop — judged member by member too. A FeatureComponent owns exactly one
      Orchestrator (the logic side) and one or more Views (its faces — list, detail, form — sharing
      the one logic component), and nothing else. A RouterComponent owns exactly one Portal as its
      facade and at least one other child to route to. A counting pattern that still owns a retired
      member is not judged until that member is migrated: its counts change with the migration, and
      STEREOTYPE_RETIRED is the one finding.
    signature: 'patternContainment(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: REPOSITORY_CONTAINMENT
        severity: error
        summary: Repository owning a non Store/Registry/Index/Query/Adapter member
      - code: FEATURE_COMPONENT_CONTAINMENT
        severity: error
        summary: FeatureComponent not owning exactly one Orchestrator + one or more Views
      - code: ROUTER_COMPONENT_CONTAINMENT
        severity: error
        summary: RouterComponent not owning exactly one Portal facade, or owning no children to route to
      - code: SUPERVISOR_CONTAINMENT
        severity: error
        summary: >-
          Supervisor owning anything but a Store or Registry — a Supervisor owns only its
          supervision state
  - name: unownedBlocks
    description: >-
      Rule unowned-blocks. Judges the data blocks no owner (a pattern, or a Supervisor keeping its
      supervision state) owns. A Store may stand alone deliberately — the sanctioned lightweight
      form for genuinely simple state, acknowledged with a lint.allow — while the recommended shape
      stays a Repository; what must never happen is folding the state into a consuming component,
      where no spec, diagram or conformance check can see it again. A Registry standing alone with
      no Store to write to is either mistyped (the "file-backed Registry" idiom, a fused persistent
      store that belongs typed Store) or orphaned. A Query has no standalone form at all: it
      computes reads over its own Repository's Store.
    signature: 'unownedBlocks(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: UNOWNED_STORE
        severity: warning
        summary: >-
          Store not owned by any pattern — recommended shape is a Repository; a deliberate
          standalone Store needs a lint.allow
      - code: REGISTRY_WITHOUT_STORE
        severity: warning
        summary: >-
          Standalone Registry with no Store to write to — either mistyped (a fused file-backed store
          belongs typed Store) or orphaned
      - code: UNOWNED_QUERY
        severity: error
        summary: Query not owned by a Repository — a Query computes reads over its own Repository's Store
  - name: memberVisibility
    description: >-
      Rule member-visibility. A component may depend on a block within its own group (it is the
      owner, or a sibling member of the same owner), on any pattern facade, or on a standalone block
      — never on a block privately owned by ANOTHER pattern, which must be reached through that
      pattern's facade. A Store or Registry a Supervisor owns is that Supervisor's supervision state
      and nobody else depends on it: a component that does is the intruder, and the finding is
      reported on it, naming the Supervisor and the state. A retired depending component is skipped,
      as everywhere in this family.
    signature: 'memberVisibility(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: VISIBILITY_VIOLATION
        severity: error
        summary: Dependency on a block privately owned by another pattern
      - code: SUPERVISION_STATE_INTRUSION
        severity: error
        summary: >-
          Dependency on a Store or Registry a Supervisor owns as its supervision state — reported on
          the intruder, naming the Supervisor and the state
  - name: facadeForwarding
    description: >-
      Rule facade-forwarding. A Repository facade method with an authored narrative must be pure 1:1
      forwarding: exactly one call step, targeting one of the pattern's owned members. Anything else
      is logic living on the facade — move it into a member block, or acknowledge a deliberate
      exception via lint.allow.
    signature: 'facadeForwarding(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: FACADE_FORWARDING
        severity: warning
        summary: Pattern facade narrative is not a single call to an owned member
  - name: projectBoundaries
    description: >-
      Rule project-boundaries. The one judge of every cross-project reference the bound project
      writes (every project is a crate of its own, reached only through its L0 exports and only as a
      dependency it declared). It reads each of the project's own references from the project graph
      — `::` forms and bare names bound through `use` imports alike — takes its resolution from
      resolveCrossProject, decided before any severity from the project's own files alone, and
      reports every outcome but resolved once, carrying the resolution: forbidden is
      EXTERNAL_UNDECLARED (the reference reaches a project the referrer declares neither as a member
      nor as an external, or names a first segment that is none of its subsystems, aliases or
      foreign providers); missing is EXTERNAL_NOT_EXPORTED (the producer's table — a contained
      member's live one, or the external's pin — has no public name covering the referrer, or not
      the used method, or exports the type only inside a signature's closure); an ambiguous import
      is IMPORT_AMBIGUOUS (two imports supply one bare name: two explicit `use` names, or two `*`
      with no explicit one — name it `alias::name` or narrow a `use`); unavailable is
      EXTERNAL_CHECK_UNAVAILABLE (no pin, an unreadable pin, a member absent on disk, or a
      deprecated form naming no alias — never a pass). A bare name no import supplies is not this
      rule's: it is the unresolved-reference finding it always was, with rule_context.importHint
      appended. A trustedLinks entry naming a subsystem of another project (`alias::sub`) is
      TRUSTED_LINK_CROSSES_PROJECT: a sanctioned fast lane stays inside one project. An undeclared,
      unexported or ambiguous reference is an error, since the owner's gate judges it exactly; a
      reference is never left to a parent's verdict.
    signature: 'projectBoundaries(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: EXTERNAL_UNDECLARED
        severity: error
        summary: >-
          A reference reaches another project the referring project declares neither as a member nor
          as an external, or names a first segment that is none of its subsystems, aliases or
          foreign providers
      - code: EXTERNAL_NOT_EXPORTED
        severity: error
        summary: >-
          A reference reaches another project at anything but a public name, or a member of one,
          whose audience covers the referrer
      - code: TRUSTED_LINK_CROSSES_PROJECT
        severity: error
        summary: A trustedLinks entry names a subsystem of another project
      - code: EXTERNAL_CHECK_UNAVAILABLE
        severity: warning
        summary: >-
          A reference into another project has nothing to be judged against: no pin, an unreadable
          pin, a member absent on disk, or a deprecated form naming no alias
      - code: IMPORT_AMBIGUOUS
        severity: error
        summary: >-
          Two `use` imports supply one bare name: two explicit names, or two `*` imports with no
          explicit one
  - name: supervisorSharedData
    description: >-
      Rule supervisor-shared-data. A Supervisor keeps its own supervision state (the Stores and
      Registries it owns) with full read and write, but data it does not own is shared: a Supervisor
      narrative call step that reaches a method of a Store, Registry, Repository, Index or Query the
      Supervisor does not own is legal only when that method declares effect read or lifecycle. A
      write — or a method that declares no effect — goes through a workflow: the Supervisor depends
      on the Orchestrator that does it. A read on behalf of a request still passes; in practice the
      paired write is what forces the workflow out, and the read moves with it.
    signature: 'supervisorSharedData(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: SUPERVISOR_WRITE_SHORTCUT
        severity: error
        summary: >-
          Supervisor narrative call reaches a method of a data component it does not own whose
          declared effect is neither read nor lifecycle — writes to shared data route through an
          Orchestrator
  - name: lifecycleEffectClosure
    description: >-
      Rule lifecycle-effect-closure. A lifecycle-effect method may create, destroy, or (un)register
      an entity's existence or membership, never modify its domain fields — and the effect is closed
      under composition: its narrative may call only read- and lifecycle-effect methods besides its
      construction and local steps. A call step to a write-effect method from a lifecycle-effect
      method is a declaration error: the method is a write, or the write belongs to a workflow
      beside it. Called methods that declare no effect are not judged.
    signature: 'lifecycleEffectClosure(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: LIFECYCLE_CALLS_WRITE
        severity: error
        summary: >-
          Lifecycle-effect method whose narrative calls a write-effect method — the lifecycle effect
          is closed under composition
  - name: libraryCalls
    description: >-
      Rule library-calls. Judges every library call: an edge from any component to an exported
      InProcess Portal of another project (reach library), and each call step, register step or
      declared `calls` entry that reaches one of its verbs. No Adapter is required; two honest
      checks replace it. Purity: a component whose dependencyClass is pure may call only library
      verbs whose effect is none, and one whose class is read only verbs whose effect is none or
      read; a verb whose effect is io, write or lifecycle, or undeclared, is out of their reach (a
      workflow, with no dependencyClass, may call anything). The language bridge: a Portal with no
      abi is a native API in its producer's targetLanguage, so a caller in a project of another
      targetLanguage needs a binding (declare abi on the producer, or put a network Portal in
      front). Within one project nothing changes: a sibling subsystem's InProcess Portal is reached
      through a client Adapter or a trustedLink, as subsystem-boundary-dependencies judges. Wrapping
      a volatile third-party API in an Adapter stays a recommended pattern, never reported.
    signature: 'libraryCalls(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: LIBRARY_CALL_IMPURE
        severity: error
        summary: >-
          Pure or read logic calls a library verb whose declared effect it may not reach (io, write,
          lifecycle, or undeclared)
      - code: LANGUAGE_BRIDGE_MISSING
        severity: error
        summary: A native-ABI InProcess library (no abi) is called from a project of another targetLanguage
status: complete
createdAt: '2026-09-14T06:06:55.453Z'
