id: idoctrine_rules
name: Doctrine Rules Interface
description: >-
  One method per rule, named after it, in run order. Each takes the run's RuleContext, reports
  through its addIssue, and declares the codes it reports as findings. These rules judge the
  architecture standard's stereotype and pattern doctrine.
component: doctrine_rules
methods:
  - name: portalEndpoints
    description: >-
      Rule portal-endpoints. A Portal binds every interface method to a concrete endpoint of the
      transport its portalType expects.
    signature: 'portalEndpoints(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: MISSING_ENDPOINT
        severity: error
        summary: Portal method without a wire endpoint binding
      - code: ENDPOINT_TRANSPORT_MISMATCH
        severity: error
        summary: Endpoint transport does not match the Portal portalType
  - name: nonPortalEndpoints
    description: >-
      Rule non-portal-endpoints. Only a Portal may carry endpoints: a method on a non-Portal
      component's interface that declares one is publishing a block that is not the system's
      boundary as if it were.
    signature: 'nonPortalEndpoints(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: ARCHITECTURE_VIOLATION_NON_PORTAL_ENDPOINT
        severity: error
        summary: Non-Portal component method declaring an endpoint
  - name: portalCallAuth
    description: >-
      Rule portal-call-auth. Hardens authenticated cross-service calls. An OUTBOUND narrative `call`
      into ANOTHER component's Portal whose auth is not `none` must (a) be made by an Adapter — the
      only block that does external I/O — and (b) declare the credential source it presents via the
      step's `auth.from`. Absence of a source warns PORTAL_AUTH_UNMET; a non-Adapter presenter warns
      AUTH_PRESENTER_NOT_ADAPTER. The actual secret is never stored in the spec. Dispatch steps (a
      portal's OWN inbound routing) and self-calls are not cross-service calls and are excluded.
    signature: 'portalCallAuth(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: PORTAL_AUTH_UNMET
        severity: warning
        summary: >-
          A narrative call into another component's authed Portal does not declare where its
          credential loads from
      - code: AUTH_PRESENTER_NOT_ADAPTER
        severity: warning
        summary: >-
          A non-Adapter component authenticates an outbound call to a portal (external I/O must go
          through an Adapter)
  - name: authSourceWiring
    description: >-
      Rule auth-source-wiring. Resolves the credential source a narrative call presents to an
      authenticated Portal. When the step's `auth.from` is a modeled reference (`component:<id>`) it
      must name a component that exists (UNKNOWN_AUTH_SOURCE), that can hold or load a secret — an
      Adapter or a Store (AUTH_SOURCE_NOT_PROVIDER) — and that the presenting component depends on
      or owns (AUTH_SOURCE_UNWIRED). Opaque sources (env:/config:/vault:/free note) are design notes
      and are never resolved; a missing source is portal-call-auth's finding.
    signature: 'authSourceWiring(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: UNKNOWN_AUTH_SOURCE
        severity: warning
        summary: 'auth.from references a component: source that does not exist'
      - code: AUTH_SOURCE_NOT_PROVIDER
        severity: warning
        summary: auth.from references a component that is not an Adapter or Store
      - code: AUTH_SOURCE_UNWIRED
        severity: warning
        summary: 'The presenter declares a component: credential source it does not depend on or own'
  - name: subsystemBoundaryDependencies
    description: >-
      Rule subsystem-boundary-dependencies. Judges every dependsOn edge that leaves its own
      subsystem, and every one that resolves nowhere. Across subsystems the shape is client Adapter
      → published remote Portal, OR a direct in-process edge licensed by a trustedLink declared on
      the SOURCE subsystem (the published-Portal target requirement applies either way). A reference
      that names nothing in this tree is resolved against the stored surface snapshots: a hit is a
      DECLARED remote portal and the same Adapter requirement applies to it, snapshots of several
      providers that disagree make the reference ambiguous, and a reference authored to leave this
      root that no snapshot covers warns instead of erroring. Boundary rules are never relaxed by a
      pack profile.
    signature: 'subsystemBoundaryDependencies(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: INVALID_DEPENDENCY_REFERENCE
        severity: error
        summary: dependsOn names a non-existent component
      - code: CROSS_TREE_REF_UNRESOLVED
        severity: warning
        summary: 'Cross-tree dependsOn (super::/:: form) with no surface snapshot covering it'
      - code: SURFACE_REF_AMBIGUOUS
        severity: error
        summary: >-
          Cross-tree dependsOn matched by surface snapshots of several providers with different
          contracts
      - code: CROSS_SUBSYSTEM_NON_ADAPTER
        severity: error
        summary: Non-Adapter component crossing a subsystem boundary
      - code: CROSS_SUBSYSTEM_PRIVATE_ACCESS
        severity: error
        summary: Cross-subsystem dependency on an unpublished component
      - code: CROSS_SUBSYSTEM_TARGET_NON_PORTAL
        severity: error
        summary: Cross-subsystem hop entering through a non-Portal
  - name: logicDependencyClass
    description: >-
      Rule logic-dependency-class. Bounds an Orchestrator's dependencies by the dependencyClass it
      declares: pure logic depends only on pure Orchestrators; read logic also on read
      Orchestrators, Repositories, Indexes and Adapters; an Orchestrator that declares no class is a
      workflow and may depend on anything the rest of the matrix allows. Whether read logic calls a
      WRITE method on one of those is judged only once facade methods carry effect tags.
    signature: 'logicDependencyClass(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: DEPENDENCY_CLASS_VIOLATION
        severity: error
        summary: >-
          Orchestrator depending on a component its dependencyClass does not allow: pure logic
          depends only on pure Orchestrators; read logic also on read Orchestrators, Repositories,
          Indexes and Adapters
  - name: dataBlockDependencies
    description: >-
      Rule data-block-dependencies. Keeps the data layer facing down. A Store may depend only on
      another Store, a backend Adapter or pure logic — Registries and Indexes depend on the Store,
      never the reverse. A Registry is the write path to its Store and may depend on that Store, a
      backend Adapter, or the pure logic that validates the write. An Index is a read projection and
      a Query a computed read, each over its Store through a backend Adapter where one serves it. An
      Adapter is a sink toward the system: it may use pure logic, but never a Store or any other
      Orchestrator.
    signature: 'dataBlockDependencies(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: ARCHITECTURE_VIOLATION_STORE_DEP
        severity: error
        summary: Store depending on anything but another Store, a backend Adapter or pure logic
      - code: ARCHITECTURE_VIOLATION_REGISTRY_DEP
        severity: warning
        summary: >-
          Registry depending on anything but its Store, a backend Adapter or pure logic (warning
          while new; aligned to the standard §7 validate→write path)
      - code: ARCHITECTURE_VIOLATION_ADAPTER_DEP
        severity: error
        summary: Adapter depending on a Store or on an Orchestrator that is not pure
      - code: ARCHITECTURE_VIOLATION_INDEX_DEP
        severity: error
        summary: Index depending on anything but its Store, an Adapter or pure logic
      - code: ARCHITECTURE_VIOLATION_QUERY_DEP
        severity: error
        summary: Query depending on anything but its Store, a backend Adapter or pure logic
  - name: entrypointDependencies
    description: >-
      Rule entrypoint-dependencies. Judges the edges at the system's entry points and its process
      layer. Portals and Observers are top-level entry points and subscribers, so nothing may depend
      on them — and that is the edge's one finding, which is why no other matrix rule judges it.
      Downward, a Portal dispatches to Orchestrators and may READ through Indexes and Repository
      facades but never reaches Store/Registry/Query or an Adapter, while an Observer forwards to
      one Orchestrator or Supervisor over a message-bus Adapter. A View stays a passive presenter. A
      Supervisor reaches data only through workflows, and a component depending on a live Actor must
      also depend on a Supervisor that supervises it.
    signature: 'entrypointDependencies(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: ARCHITECTURE_VIOLATION_PORTAL_DEP
        severity: error
        summary: Component depending on a Portal/Observer
      - code: ARCHITECTURE_VIOLATION_PORTAL_FORBIDDEN_DEP
        severity: error
        summary: Portal/Observer reaching the data layer directly
      - code: ARCHITECTURE_VIOLATION_VIEW_DEP
        severity: error
        summary: View depending on persistence layers or on logic that is not pure
      - code: ARCHITECTURE_VIOLATION_SUPERVISOR_DEP
        severity: error
        summary: >-
          Supervisor depending on anything but Actors, Orchestrators, Adapters or other Supervisors
          — it reaches data only through workflows
      - code: ACTOR_REACHED_WITHOUT_SUPERVISOR
        severity: error
        summary: >-
          Component depending on a live Actor it does not supervise, without also depending on a
          Supervisor that supervises it — a live Actor is reached by id through its Supervisor
  - name: portalWriteShortcut
    description: >-
      Rule portal-write-shortcut. A Portal narrative call step or dispatch-table binding that
      reaches a write-effect method on a Repository or Index directly is the write shortcut: the
      Portal→data-facade edge is licensed for reads only, and a write routes through an Orchestrator
      that owns the workflow. A dispatch step reaches its server only through a table binding, so
      judging every binding judges each dispatch step that takes it, once, where the route is
      declared. Methods that carry no effect tag are not judged.
    signature: 'portalWriteShortcut(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: PORTAL_WRITE_SHORTCUT
        severity: error
        summary: >-
          Portal narrative call or dispatch-table binding reaches a write-effect method on a
          Repository/Index directly — reads may shortcut, writes route through an Orchestrator
          (judged on effect-tagged facade methods; untagged methods are not yet judged)
  - name: patternMembership
    description: >-
      Rule pattern-membership. Only patterns (Repository/FeatureComponent/RouterComponent) own
      member blocks, and every pattern owns at least one. Each claim must name a component that
      exists and is itself a building block — patterns compose at the subsystem (L1) level, never by
      owning one another — and a block has exactly one owner, the first pattern to claim it.
    signature: 'patternMembership(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: EMPTY_PATTERN
        severity: error
        summary: Pattern with no owned member blocks
      - code: BLOCK_OWNS_MEMBERS
        severity: error
        summary: Building block using owns
      - code: INVALID_OWNED_MEMBER
        severity: error
        summary: owns names a non-existent component
      - code: PATTERN_OWNS_PATTERN
        severity: error
        summary: Pattern owning another pattern
      - code: SHARED_OWNED_MEMBER
        severity: error
        summary: Block owned by two patterns
  - name: patternContainment
    description: >-
      Rule pattern-containment. Holds each pattern to the containment its definition prescribes. A
      Repository may own only Store, Registry, Index, Query and (optionally) Adapter, judged member
      by member. A FeatureComponent owns exactly one Orchestrator (the logic side) and one or more
      Views (its faces — list, detail, form — sharing the one logic component), and nothing else. A
      RouterComponent owns exactly one Portal as its facade and at least one other child to route
      to. A counting pattern that still owns a retired member is not judged until that member is
      migrated: its counts change with the migration, and STEREOTYPE_RETIRED is the one finding.
    signature: 'patternContainment(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: REPOSITORY_CONTAINMENT
        severity: error
        summary: Repository owning a non Store/Registry/Index/Query/Adapter member
      - code: FEATURE_COMPONENT_CONTAINMENT
        severity: error
        summary: FeatureComponent not owning exactly one Orchestrator + one or more Views
      - code: ROUTER_COMPONENT_CONTAINMENT
        severity: error
        summary: RouterComponent not owning exactly one Portal facade, or owning no children to route to
  - name: unownedBlocks
    description: >-
      Rule unowned-blocks. Judges the data blocks no pattern owns. A Store may stand alone
      deliberately — the sanctioned lightweight form for genuinely simple state, acknowledged with a
      lint.allow — while the recommended shape stays a Repository; what must never happen is folding
      the state into a consuming component, where no spec, diagram or conformance check can see it
      again. A Registry standing alone with no Store to write to is either mistyped (the
      "file-backed Registry" idiom, a fused persistent store that belongs typed Store) or orphaned.
      A Query has no standalone form at all: it computes reads over its own Repository's Store.
    signature: 'unownedBlocks(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: UNOWNED_STORE
        severity: warning
        summary: >-
          Store not owned by any pattern — recommended shape is a Repository; a deliberate
          standalone Store needs a lint.allow
      - code: REGISTRY_WITHOUT_STORE
        severity: warning
        summary: >-
          Standalone Registry with no Store to write to — either mistyped (a fused file-backed store
          belongs typed Store) or orphaned
      - code: UNOWNED_QUERY
        severity: error
        summary: Query not owned by a Repository — a Query computes reads over its own Repository's Store
  - name: memberVisibility
    description: >-
      Rule member-visibility. A component may depend on a block within its own group (it is the
      owning pattern, or a sibling member of the same pattern), on any pattern facade, or on a
      standalone block — never on a block privately owned by ANOTHER pattern, which must be reached
      through that pattern's facade. A retired depending component is skipped, as everywhere in this
      family.
    signature: 'memberVisibility(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: VISIBILITY_VIOLATION
        severity: error
        summary: Dependency on a block privately owned by another pattern
  - name: facadeForwarding
    description: >-
      Rule facade-forwarding. A Repository facade method with an authored narrative must be pure 1:1
      forwarding: exactly one call step, targeting one of the pattern's owned members. Anything else
      is logic living on the facade — move it into a member block, or acknowledge a deliberate
      exception via lint.allow.
    signature: 'facadeForwarding(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: FACADE_FORWARDING
        severity: warning
        summary: Pattern facade narrative is not a single call to an owned member
status: complete
