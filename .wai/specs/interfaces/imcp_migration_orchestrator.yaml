id: imcp_migration_orchestrator
name: MCP Migration Orchestrator Interface
description: Plan, then apply or drop.
component: mcp_migration_orchestrator
methods:
  - name: run
    description: >-
      Plan a family migration; with dryRun, answer the plan (applied false) and drop its rehearsal;
      when the plan is refused or empty, answer it likewise; otherwise apply it and answer the
      report — committed with the projects to re-lock, or failed with the family restored (or the
      files `wairon doctor --fix` must restore). Never locks.
    signature: 'run(request: MigrationRequest, dryRun?: bool): FamilyMigrationReport'
    returns: FamilyMigrationReport
    params:
      - name: request
        type: MigrationRequest
        description: The tool's verb and arguments
      - name: dryRun
        type: bool
        description: Answer the plan and write nothing
        optional: true
  - name: pending
    description: >-
      The pending-transaction banner for sdd_get_status and sdd_validate_tree: one notice line per
      unfinished family-migration transaction under the bound root — its id, verb and coordinator
      phase, pointing at `wairon doctor --fix` (a human's repair; no tool recovers). Empty when
      there is none. Writes nothing.
    signature: 'pending(): list<string>'
    returns: list<string>
    params: []
    guarantees:
      - idempotent
  - name: scaffold
    description: >-
      Set a project another tool made up for its own sessions — its guides and root pointer, its
      skills and, when claude is a target, its portable .mcp.json — as a migration that made one
      does. Answers what it wrote, relative to the project's root, or one line naming what to run
      there; never throws, since the change that made the project already stands.
    signature: 'scaffold(root: string): list<string>'
    returns: list<string>
    params:
      - name: root
        type: string
        description: The new project's root
status: complete
