id: iproject_relation_store
name: Project Relation Store Interface
description: >-
  Private contract for the authoritative in-memory cross-project relation set, loaded from and
  swapped as one backing file (relations.json under the hosted data root).
component: project_relation_store
methods:
  - name: load
    description: >-
      Read relations.json fresh (no in-memory copy). A missing file yields an empty set; an
      unreadable file or structurally invalid JSON fails with a storage error naming the path.
    signature: 'load(): list<ProjectRelationRecord>'
    returns: list<ProjectRelationRecord>
    params: []
  - name: update
    description: >-
      Read the relation set fresh and persist what the change makes of it, holding the file's write
      lock (file_write_lock) across both, so a writer in another process that reads and writes the
      same file in between is never lost; a change that throws writes nothing; a file that exists
      but cannot be read or parsed throws. Answers the set written.
    signature: >-
      update(change: (relations: ProjectRelationRecord[]) => ProjectRelationRecord[]):
      ProjectRelationRecord[]
    returns: list<ProjectRelationRecord>
    effect: write
lint:
  allow:
    - code: UNUSED_METHOD
      at: load
      reason: >-
        The read-through store's hydration is called by the repository FACADE, not by a member:
        every exported facade function in src/server/relations.ts constructs the store, calls
        load(), and only then forwards to the registry or index. A Repository facade narrative is
        held to a single call step (FACADE_FORWARDING), so that hydration call has nowhere to live
        in the model and load has no modelled caller. Modelling the hydration as a facade method of
        its own that forwards to the read-back (or letting the facade doctrine carry a
        hydrate-then-forward pair) is the decision owed; declaring a call from the registry or index
        would be declaring one the code does not make.
status: complete
