id: iproject_relation_store
name: Project Relation Store Interface
description: >-
  Private contract for the authoritative in-memory cross-project relation set, loaded from and
  swapped as one backing file (relations.json under the hosted data root).
component: project_relation_store
methods:
  - name: load
    description: >-
      Load the persisted cross-project relation set from the relations.json file under the hosted
      data root and hold it as the authoritative in-memory representation, returning it.
    signature: 'load(): ProjectRelationRecord[]'
    returns: ProjectRelationRecord[]
    params: []
  - name: replaceAll
    description: >-
      Atomically swap the in-memory relation set to the supplied complete set after the registry has
      persisted it.
    signature: 'replaceAll(records: ProjectRelationRecord[]): void'
    returns: void
    params:
      - name: records
        type: ProjectRelationRecord[]
lint:
  allow:
    - code: UNUSED_METHOD
      at: load
      reason: >-
        The read-through store's hydration is called by the repository FACADE, not by a member:
        every exported facade function in src/server/relations.ts constructs the store, calls
        load(), and only then forwards to the registry or index. A Repository facade narrative is
        held to a single call step (FACADE_FORWARDING), so that hydration call has nowhere to live
        in the model and load has no modelled caller. The shape that fixes it already exists in this
        tree — surface_repository.hydrate forwards to surface_registry.hydrateFromFiles — and this
        family predates it. Modelling the hydration that way (or letting the facade doctrine carry a
        hydrate-then-forward pair) is the decision owed; declaring a call from the registry or index
        would be declaring one the code does not make.
status: complete
