id: isdk_orchestrator
name: SDK Orchestrator Interface
description: >-
  The pack-authoring/archive workflows plus the spec-tree archive workflows, delegating format
  decisions to the codecs, template rendering to the scaffold specialist, and all I/O to the archive
  adapter. Stateless.
component: sdk_orchestrator
methods:
  - name: scaffoldPack
    description: >-
      Render the scaffold file map (specialist) and write it under the target directory (adapter);
      return the created file paths.
    signature: 'scaffoldPack(request: PackScaffoldRequest): string[]'
    returns: string[]
    params:
      - name: request
        type: pack_scaffold_request
  - name: buildPack
    description: >-
      Read the source pack directory (adapter), derive + serialize the envelope and verify it
      matches the inner pack manifest (codec), then assemble the files + envelope into a .wpack
      (adapter). Returns the archive bytes + descriptor + suggested file name.
    signature: 'buildPack(sourceDir: string): PackBuildResult'
    returns: PackBuildResult
    params:
      - name: sourceDir
        type: string
  - name: inspectArchive
    description: >-
      Enumerate entries (adapter), parse + version-check the envelope (codec), and return a
      PackArchiveInfo WITHOUT extracting anything. Identity is verified at BUILD time (where the
      author's files are authoritative), not on inspect — inspect deliberately never inflates the
      inner pack manifest.
    signature: 'inspectArchive(archive: bytes): PackArchiveInfo'
    returns: PackArchiveInfo
    params:
      - name: archive
        type: bytes
  - name: extractPack
    description: >-
      Enumerate entries (adapter), compute a safe extraction plan under `limits` (codec — rejecting
      unsafe/oversized archives), inflate the approved entries and write the tree under destDir
      (adapter), and return where it landed + the parsed manifest. Omitted limits fall back to the
      codec default profile.
    signature: >-
      extractPack(archive: bytes, destDir: string, limits?: PackExtractionLimits):
      PackExtractionResult
    returns: PackExtractionResult
    params:
      - name: archive
        type: bytes
      - name: destDir
        type: string
      - name: limits
        type: pack_extraction_limits
        optional: true
  - name: buildTreeArchive
    description: >-
      Read every supplied tree root's .wai directory (adapter), keep only portable design state
      (tree codec), prefix each root's files with its project-relative path, seal the envelope and
      assemble the files into a .waitree (adapter). Returns the archive bytes + sealed manifest +
      suggested file name.
    signature: >-
      buildTreeArchive(roots: TreeRootSource[], projectName: string, stateId?: string,
      includeDerived?: boolean): TreeBuildResult
    returns: TreeBuildResult
    params:
      - name: roots
        type: tree_root_source[]
        description: >-
          Every root to pack, top project first — discovered by the caller, which owns chaining
          knowledge
      - name: projectName
        type: string
      - name: stateId
        type: string
        description: The exporting tree's content state, stamped as provenance
        optional: true
      - name: includeDerived
        type: boolean
        description: Pack regenerable artifacts too (default false)
        optional: true
  - name: inspectTreeArchive
    description: >-
      Enumerate entries (adapter), parse + version-check the wairon-tree.yaml envelope (tree codec),
      and return a TreeArchiveInfo WITHOUT extracting anything — so a caller can show, or refuse,
      what an archive holds before a byte is decompressed.
    signature: 'inspectTreeArchive(archive: bytes): TreeArchiveInfo'
    returns: TreeArchiveInfo
    params:
      - name: archive
        type: bytes
  - name: extractTreeArchive
    description: >-
      Enumerate entries (adapter), compute a safe extraction plan under `limits` (tree codec —
      rejecting unsafe/oversized archives), optionally refuse executable entries, inflate the
      approved entries, verify integrity, and write the tree under destDir (adapter). Omitted limits
      fall back to the codec's tree profile. Writes only; replacing or preserving an existing tree
      is the caller's policy.
    signature: >-
      extractTreeArchive(archive: bytes, destDir: string, limits?: PackExtractionLimits,
      refuseExecutableEntries?: boolean): TreeExtractionResult
    returns: TreeExtractionResult
    params:
      - name: archive
        type: bytes
      - name: destDir
        type: string
      - name: limits
        type: pack_extraction_limits
        optional: true
      - name: refuseExecutableEntries
        type: boolean
        description: Apply the portable-path guard — set by any surface accepting an archive over the wire
        optional: true
status: complete
