id: imcp_portal
name: MCP Portal Interface
description: >-
  Inbound Portal contract for the MCP subsystem: server bootstrap plus the sdd_* tool surface
  exposed over MCP stdio (JSON-RPC).
component: mcp_portal
methods:
  - name: createMcpServer
    description: >-
      Initializes and registers the MCP server (tool registration + stdio transport). Declares its
      MCP capabilities truthfully: resources and prompts advertise listChanged only because the
      long-lived stdio session actually emits list-changed notifications after a successful spec
      write that alters the agent topology or skill set (the stateless hosted transport advertises
      none and stays correct-on-poll).
    signature: 'createMcpServer(): McpServer'
    returns: McpServer
    endpoint:
      transport: Custom
      address: 'stdio json-rpc: server bootstrap (wairon mcp serve)'
  - name: sdd_initialize_system
    description: 'Tool: initialize the L0 system specification'
    signature: 'sdd_initialize_system(spec: SystemSpec): void'
    returns: void
    endpoint:
      transport: Custom
      address: mcp tools/call sdd_initialize_system
  - name: sdd_add_subsystem
    description: 'Tool: add an L1 subsystem under the system boundary'
    signature: 'sdd_add_subsystem(spec: SubsystemSpec): void'
    returns: void
    endpoint:
      transport: Custom
      address: mcp tools/call sdd_add_subsystem
  - name: sdd_add_component
    description: 'Tool: add an L2 component under a subsystem'
    signature: 'sdd_add_component(spec: ComponentSpec): void'
    returns: void
    endpoint:
      transport: Custom
      address: mcp tools/call sdd_add_component
  - name: sdd_define_interface
    description: 'Tool: define an L3 interface contract for a component'
    signature: 'sdd_define_interface(spec: InterfaceSpec): void'
    returns: void
    endpoint:
      transport: Custom
      address: mcp tools/call sdd_define_interface
  - name: sdd_write_narrative
    description: 'Tool: write an L4 implementation spec with L5 method narratives'
    signature: 'sdd_write_narrative(spec: ImplementationSpec): void'
    returns: void
    endpoint:
      transport: Custom
      address: mcp tools/call sdd_write_narrative
  - name: sdd_validate_tree
    description: 'Tool: run the architecture-conformance gate over the spec tree'
    signature: 'sdd_validate_tree(): ValidationResult'
    returns: ValidationResult
    endpoint:
      transport: Custom
      address: mcp tools/call sdd_validate_tree
  - name: sdd_get_status
    description: 'Tool: completeness status dashboard of the spec tree'
    signature: 'sdd_get_status(): string'
    returns: string
    endpoint:
      transport: Custom
      address: mcp tools/call sdd_get_status
  - name: sdd_move_subsystem_project
    description: 'Tool: relocate an external subsystem''s subproject directory and update its projectPath link'
    signature: 'sdd_move_subsystem_project(subsystemId: string, newProjectPath: string): void'
    returns: void
    endpoint:
      transport: Custom
      address: mcp tools/call sdd_move_subsystem_project
  - name: sdd_externalize_subsystem
    description: >-
      Tool: migrate an internal subsystem into a standalone subproject at projectPath (moves specs,
      mounts via projectPath, rewrites references)
    signature: 'sdd_externalize_subsystem(subsystem: string, projectPath: string): void'
    returns: void
    endpoint:
      transport: Custom
      address: mcp tools/call sdd_externalize_subsystem
  - name: sdd_internalize_subsystem
    description: >-
      Tool: migrate an external subsystem's specs back into the parent tree and delete its child
      .wai project
    signature: 'sdd_internalize_subsystem(subsystem: string): void'
    returns: void
    endpoint:
      transport: Custom
      address: mcp tools/call sdd_internalize_subsystem
  - name: listResources
    description: >-
      MCP resource: list everything the server publishes as read-only resources — the built-in SDD
      skills (wairon-skill://) plus one live agent-brief resource per agent in the current topology
      (wairon-agent://).
    signature: 'listResources(): SkillResourceDescriptor[]'
    returns: SkillResourceDescriptor[]
    params: []
    endpoint:
      transport: Custom
      address: mcp resources/list (SDD skills + live agent briefs)
  - name: readResource
    description: >-
      MCP resource: read one published resource by id — a wairon-skill:// id returns the
      (pack-composed) skill markdown, a wairon-agent:// id returns that agent's live brief composed
      from the current spec tree.
    signature: 'readResource(resourceId: string): string'
    returns: string
    params:
      - name: resourceId
        type: string
        description: The MCP resource id — a skill id or wairon-agent:// agent id.
    endpoint:
      transport: Custom
      address: mcp resources/read (SDD skill or agent brief)
  - name: sdd_list_external_interfaces
    description: >-
      List the bound project's consumable external surfaces (parent family, siblings, foreign
      imports) as discovery entries with origin, provenance, and freshness — the tool an agent
      inside a subproject uses to SEE its outward world instead of discovering it by failed
      reference resolution.
    signature: 'sdd_list_external_interfaces(): ExternalSurfaceEntry[]'
    returns: ExternalSurfaceEntry[]
  - name: sdd_get_agent_brief
    description: >-
      Tool: compose the LIVE delegation brief for one resolved agent (rendered instructions +
      ownedPaths/readPaths scope). The dynamic replacement for generated per-component agent files:
      an orchestrating session fetches a brief and spawns a generic subagent with it — always fresh
      after a re-lock, no session restart, identical over stdio and the hosted data plane.
    signature: 'sdd_get_agent_brief(agentId: string): AgentBrief'
    returns: AgentBrief
    params:
      - name: agentId
        type: string
        description: The resolved agent id (list via listAgents or resources/list).
    endpoint:
      transport: Custom
      address: mcp tools/call sdd_get_agent_brief
status: complete
createdAt: '2026-06-19T12:00:00Z'
updatedAt: '2026-08-08T11:14:00.256Z'
