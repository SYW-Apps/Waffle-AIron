id: imcp_portal
name: MCP Portal Interface
description: >-
  Inbound Portal contract for the MCP subsystem: server bootstrap plus the sdd_* tool surface
  exposed over MCP stdio (JSON-RPC).
component: mcp_portal
methods:
  - name: createMcpServer
    description: >-
      Initializes and registers the MCP server (tool registration + stdio transport). Declares its
      MCP capabilities truthfully: resources and prompts advertise listChanged only because the
      long-lived stdio session actually emits list-changed notifications after a successful spec
      write that alters the agent topology or skill set (the stateless hosted transport advertises
      none and stays correct-on-poll). A hosted caller may also ask for the sixteen hosted
      data-plane tools to be advertised in tools/list; they are discovery only, served by the
      hosting request orchestrator before any call reaches this server.
    signature: 'createMcpServer(hostedTools?: boolean): McpServer'
    returns: McpServer
    params:
      - name: hostedTools
        type: boolean
        description: >-
          Advertise the hosted data-plane tools for discovery; false for the stdio server, which
          cannot serve them.
        optional: true
    endpoint:
      transport: Custom
      address: 'stdio json-rpc: server bootstrap (wairon mcp serve)'
  - name: sdd_initialize_system
    description: >-
      Tool: initialize the L0 system specification. The answer carries the write receipt as
      structured content beside the sentence, so a caller learns what was written without parsing
      English; the sentence itself is unchanged, for a client that understands no structured
      content.
    signature: 'sdd_initialize_system(spec: SystemSpec): SpecWriteReceipt'
    returns: SpecWriteReceipt
    endpoint:
      transport: Custom
      address: mcp tools/call sdd_initialize_system
  - name: sdd_add_subsystem
    description: >-
      Tool: add an L1 subsystem under the system boundary. A subsystem is never a mount: a
      `projectPath` in the input is refused, naming sdd_add_member, which declares a member project
      in project.yaml `members`. The input may state the spec's lifecycle status, so a subsystem can
      be authored straight at design or complete instead of being born draft and needing a follow-up
      edit nobody remembers. An unstated status means draft for a new spec and the stored status for
      a re-authoring, and a stated status that would lower the stored one is refused by name —
      reopening a frozen spec is an update, not a restatement. The answer carries the write receipt
      as structured content beside the sentence, so a caller learns the status written and whether a
      spec already held that id without parsing English; the sentence itself is unchanged.
    signature: 'sdd_add_subsystem(spec: SubsystemSpec): SpecWriteReceipt'
    returns: SpecWriteReceipt
    endpoint:
      transport: Custom
      address: mcp tools/call sdd_add_subsystem
  - name: sdd_add_component
    description: >-
      Tool: add an L2 component under a subsystem. The input may state the spec's lifecycle status,
      so a component can be authored straight at design or complete instead of being born draft and
      needing a follow-up edit nobody remembers. An unstated status means draft for a new spec and
      the stored status for a re-authoring, and a stated status that would lower the stored one is
      refused by name — reopening a frozen spec is an update, not a restatement. The answer carries
      the write receipt as structured content beside the sentence, so a caller learns the status
      written and whether a spec already held that id without parsing English; the sentence itself
      is unchanged.
    signature: 'sdd_add_component(spec: ComponentSpec): SpecWriteReceipt'
    returns: SpecWriteReceipt
    endpoint:
      transport: Custom
      address: mcp tools/call sdd_add_component
  - name: sdd_define_interface
    description: >-
      Tool: define an L3 interface contract for a component. The input may state the spec's
      lifecycle status, so a contract can be authored straight at design or complete instead of
      being born draft and needing a follow-up edit nobody remembers. An unstated status means draft
      for a new spec and the stored status for a re-authoring, and a stated status that would lower
      the stored one is refused by name — reopening a frozen spec is an update, not a restatement.
      The answer carries the write receipt as structured content beside the sentence, so a caller
      learns the status written and whether a spec already held that id without parsing English; the
      sentence itself is unchanged.
    signature: 'sdd_define_interface(spec: InterfaceSpec): SpecWriteReceipt'
    returns: SpecWriteReceipt
    endpoint:
      transport: Custom
      address: mcp tools/call sdd_define_interface
  - name: sdd_write_narrative
    description: >-
      Tool: write an L4 implementation spec with L5 method narratives. The input may state the
      spec's lifecycle status, so an implementation can be authored straight at design or complete
      instead of being born draft and needing a follow-up edit nobody remembers. An unstated status
      means draft for a new spec and the stored status for a re-authoring, and a stated status that
      would lower the stored one is refused by name — reopening a frozen spec is an update, not a
      restatement. The answer carries the write receipt as structured content beside the sentence,
      so a caller learns the status written and whether a spec already held that id without parsing
      English; the sentence itself is unchanged.
    signature: 'sdd_write_narrative(spec: ImplementationSpec): SpecWriteReceipt'
    returns: SpecWriteReceipt
    endpoint:
      transport: Custom
      address: mcp tools/call sdd_write_narrative
  - name: sdd_validate_tree
    description: >-
      Tool: validate and answer with every finding, split into errors, warnings and notices (three
      separate lists, in the structured content and the text block alike). Notices never make the
      tree invalid. At a project that declares members it is the family run — every selected
      project's own gate verbatim under its project key, the composition of each project's externals
      against their live producers, and the family checks — unless `recursive` is false, which asks
      for the owner's gate alone; at any other project it is the owner's gate, unless `family` is
      true. The hosted data plane serves this same tool, so a hosted verdict is the same function's:
      a member-qualified credential binds the member root and gets the member's own gate (its family
      run composes only within the credential's reach). Optionally narrowed to one subsystem, or to
      one member by its key.
    signature: 'sdd_validate_tree(subsystem?: string, recursive?: boolean, family?: boolean): ValidationResult'
    returns: ValidationResult
    params:
      - name: subsystem
        type: string
        description: Validate only this subsystem's slice of the tree; omitted validates all of it
        optional: true
      - name: recursive
        type: boolean
        description: >-
          At a project that declares members: false asks for the owner's gate alone instead of the
          family run
        optional: true
      - name: family
        type: boolean
        description: >-
          Ask for the family run at any project; at a member this composes its externals against
          their live producers, within the request's reach
        optional: true
    endpoint:
      transport: Custom
      address: mcp tools/call sdd_validate_tree
  - name: sdd_get_status
    description: >-
      Tool: the spec tree as a structure, with each level's completeness; each member prints as a
      project holding its own subsystems. Optionally narrowed to one subsystem, and optionally
      descending into members. On a stale server the answer LEADS with the staleness — whether the
      build on disk changed and whether spec writes are refused because its schemas changed — so the
      first call of a session surfaces it before anything is written.
    signature: 'sdd_get_status(subsystem?: string, recursive?: boolean): string'
    returns: string
    params:
      - name: subsystem
        type: string
        description: Report only this subsystem's slice of the tree; omitted reports all of it
        optional: true
      - name: recursive
        type: boolean
        description: Descend into the members this project declares
        optional: true
    endpoint:
      transport: Custom
      address: mcp tools/call sdd_get_status
  - name: sdd_externalize_subsystem
    description: >-
      Tool: turn an internal subsystem into a member project at the path — provisions the member,
      moves the subsystem's specs there, declares it in project.yaml `members` under the subsystem
      id, and re-saves every reference across the new boundary as `alias::name`. The exports either
      side now needs are left to `wairon doctor --fix`.
    signature: 'sdd_externalize_subsystem(subsystem: string, path: string): void'
    returns: void
    endpoint:
      transport: Custom
      address: mcp tools/call sdd_externalize_subsystem
  - name: listResources
    description: >-
      MCP resource: list everything the server publishes as read-only resources — the built-in SDD
      skills (wairon-skill://) plus one live agent-brief resource per agent in the current topology
      (wairon-agent://).
    signature: 'listResources(): SkillResourceDescriptor[]'
    returns: SkillResourceDescriptor[]
    params: []
    endpoint:
      transport: Custom
      address: mcp resources/list (SDD skills + live agent briefs)
  - name: readResource
    description: >-
      MCP resource: read one published resource by id — a wairon-skill:// id returns the
      (pack-composed) skill markdown, a wairon-agent:// id returns that agent's live brief composed
      from the current spec tree.
    signature: 'readResource(resourceId: string): string'
    returns: string
    params:
      - name: resourceId
        type: string
        description: The MCP resource id — a skill id or wairon-agent:// agent id.
    endpoint:
      transport: Custom
      address: mcp resources/read (SDD skill or agent brief)
  - name: sdd_get_agent_brief
    description: >-
      Tool: compose the LIVE delegation brief for one resolved agent (rendered instructions +
      ownedPaths/readPaths scope). The dynamic replacement for generated per-component agent files:
      an orchestrating session fetches a brief and spawns a generic subagent with it — always fresh
      after a re-lock, no session restart, identical over stdio and the hosted data plane.
    signature: 'sdd_get_agent_brief(agentId: string): AgentBrief'
    returns: AgentBrief
    params:
      - name: agentId
        type: string
        description: The resolved agent id (list via listAgents or resources/list).
    endpoint:
      transport: Custom
      address: mcp tools/call sdd_get_agent_brief
  - name: sdd_rename_component
    description: >-
      Tool: rename a component and rewrite every reference to it; the interfaces and implementations
      named after it move too. Reports the specs moved and the specs rewritten.
    signature: 'sdd_rename_component(id: string, newId: string): ComponentRename'
    returns: ComponentRename
    params:
      - name: id
        type: string
        description: The component to rename (namespaced if needed)
      - name: newId
        type: string
        description: Its new id
    endpoint:
      transport: Custom
      address: mcp tools/call sdd_rename_component
  - name: sdd_rename_method
    description: >-
      Tool: rename a contract method and retarget every reference to it; the method moves on the
      component's interfaces and their implementations, carrying its narrative and bindings. Reports
      the specs moved, the specs retargeted, and the specs whose prose still names it.
    signature: >-
      sdd_rename_method(id: string, method: string, newName: string, pinSymbol?: boolean):
      MethodRename
    returns: MethodRename
    params:
      - name: id
        type: string
        description: The component whose method is renamed (namespaced if needed)
      - name: method
        type: string
        description: The method name as it stands
      - name: newName
        type: string
        description: Its new name, a camel-case identifier
      - name: pinSymbol
        type: boolean
        description: >-
          Whether an implementation that declares no symbol is pinned to the old name so its
          function still binds; true when omitted
        optional: true
    endpoint:
      transport: Custom
      address: mcp tools/call sdd_rename_method
  - name: sdd_update_spec
    description: >-
      Tool: patch an existing spec with a granular delta. The delta's arrays UPSERT by element
      identity rather than replace, so a delta naming one element leaves the others intact, and it
      is deliberately open below its top level — a key that is not a field at its depth is named
      back under NO EFFECT instead of being silently dropped. The answer carries the change report
      as structured content beside the rendered sentence, from the one report, so the prose can
      never disagree with the data.
    signature: >-
      sdd_update_spec(kind: string, id: string, delta: SpecDelta, dryRun?: boolean):
      SpecChangeReport
    returns: SpecChangeReport
    params:
      - name: kind
        type: string
        description: 'The spec kind to patch: system, subsystem, component, interface, implementation or type'
      - name: id
        type: string
        description: The stored spec's id, namespaced if needed
      - name: delta
        type: SpecDelta
        description: The partial change to merge, carrying the delta's own verbs
      - name: dryRun
        type: boolean
        description: >-
          Ask what the delta would do instead of doing it: the whole write runs, the candidate gate
          included, and not one byte of the stored file moves
        optional: true
    endpoint:
      transport: Custom
      address: mcp tools/call sdd_update_spec
  - name: sdd_set_endpoints
    description: >-
      Tool: bind concrete wire endpoints to existing L3 contract methods — required for every
      Portal, and run after sdd_define_interface. The caller picks a transport and fills that
      transport's address fields; the binding is checked against the endpoint schema before the
      contract is saved.
    signature: 'sdd_set_endpoints(interfaceId: string, endpoints: EndpointBinding[]): SpecChangeReport'
    returns: SpecChangeReport
    params:
      - name: interfaceId
        type: string
        description: The L3 contract to bind, as the tool's interface argument names it
      - name: endpoints
        type: EndpointBinding[]
        description: >-
          One binding per method: the method NAME (not the HTTP verb), the transport, and that
          transport's address fields
    endpoint:
      transport: Custom
      address: mcp tools/call sdd_set_endpoints
  - name: sdd_set_public_interfaces
    description: >-
      Tool: set — replace — an existing subsystem's export table: own items binding a component (and
      optionally the contract) that realizes them, or a type the subsystem owns, and re-exports
      naming another subsystem in `from` with one component, interface narrowing or type, optionally
      renamed with `as` — `from` alone re-exports everything that subsystem exports. `type` and
      `details` are required on an own component item and optional on a re-export, which inherits
      its target's. The tool for backfilling bindings once a subsystem's components exist, because a
      cross-subsystem dependency may only target a published public component.
    signature: >-
      sdd_set_public_interfaces(subsystemId: string, publicInterfaces: PublicInterface[]):
      SpecChangeReport
    returns: SpecChangeReport
    params:
      - name: subsystemId
        type: string
        description: The L1 subsystem to update, as the tool's subsystem argument names it
      - name: publicInterfaces
        type: PublicInterface[]
        description: The full replacement list of published surfaces for this subsystem
    endpoint:
      transport: Custom
      address: mcp tools/call sdd_set_public_interfaces
  - name: sdd_get_spec
    description: >-
      Tool: read the parsed contents of one stored spec, without filesystem path searching. A
      methods filter reads only the named methods of a contract, an implementation or a type — a
      forty-method spec fetched whole to look at one of them is the read side of the same waste a
      restatement is on the write side — and the answer then carries a partial-result marker naming
      what was left out, which must never be re-authored from. For a variant-tagged component the
      answer also carries derived, read-only variant guidance. The structured content keeps both
      derived markers SEPARATE from the stored spec, so nothing derived can be written back by
      accident; the text block folds them in as it always has.
    signature: 'sdd_get_spec(kind: string, id: string, methods?: string[]): SpecReadResult'
    returns: SpecReadResult
    params:
      - name: kind
        type: string
        description: 'The kind of spec to read: system, subsystem, component, interface, implementation or type'
      - name: id
        type: string
        description: >-
          The id to read it by; the L0 system spec is a singleton, named by the system name or
          "system"
      - name: methods
        type: string[]
        description: Return only these methods by name; omit it for the whole spec
        optional: true
    endpoint:
      transport: Custom
      address: mcp tools/call sdd_get_spec
  - name: sdd_add_type
    description: >-
      Tool: define an entity or value-object — the data the components operate on. Entities are
      owned by a subsystem; a shared value object names none and is system-level. Fields are data;
      methods are PURE intrinsic behaviour only, because anything needing a collaborator belongs on
      a component that takes the entity as an argument. A type may also CLAIM code: a sourcePath
      names the file holding its declaration and a symbol binds the code-level name, and the file
      must then resolve with the declaration anchored in it. The answer carries the write receipt as
      structured content beside the sentence.
    signature: 'sdd_add_type(spec: TypeSpec): SpecWriteReceipt'
    returns: SpecWriteReceipt
    params:
      - name: spec
        type: TypeSpec
        description: >-
          The type to define: its kind, id, name, owning subsystem, fields, pure methods,
          invariants, database bindings and code claim
    endpoint:
      transport: Custom
      address: mcp tools/call sdd_add_type
  - name: sdd_move_methods
    description: >-
      Tool: move contract methods from one component to another, carrying each method's narrative,
      calls and bindings, and re-pointing every reference that named the old home. A target without
      a contract receives one, i<target>, and a target contract without an implementation receives
      <target>_impl (inheriting the source implementation's sourcePath) when implementation entries
      travel; the report names what it created. One all-or-nothing gated write: if a rule refuses
      the move, nothing is written and the report names the rule plus where these methods could live
      instead, cheapest legal home first. A dry run runs the whole move, gate included, and reports
      what it would have done.
    signature: >-
      sdd_move_methods(from: string, to: string, methods: string[], dryRun?: boolean):
      MethodMoveReport
    returns: MethodMoveReport
    params:
      - name: from
        type: string
        description: The component the methods belong to (namespaced if needed)
      - name: to
        type: string
        description: The component that should receive them (namespaced if needed)
      - name: methods
        type: string[]
        description: The method names to move; every one must exist on the source contract
      - name: dryRun
        type: boolean
        description: Answer with what the move would do and write nothing
        optional: true
    endpoint:
      transport: Custom
      address: mcp tools/call sdd_move_methods
  - name: sdd_delete_spec
    description: >-
      Tool: delete a specification document from the spec tree and prune the parent directories the
      deletion left empty. Answers whether a document was actually removed — a spec that was not
      there is reported as such rather than as a failure. Deleting a spec other specs still
      reference leaves the tree invalid by design: the validator is what says so, and this tool does
      not refuse on its behalf.
    signature: 'sdd_delete_spec(kind: string, id: string): SpecDeletion'
    returns: SpecDeletion
    params:
      - name: kind
        type: string
        description: 'The kind of spec to delete: subsystem, component, interface, implementation or type'
      - name: id
        type: string
        description: The id of the spec to delete (namespaced if needed)
    endpoint:
      transport: Custom
      address: mcp tools/call sdd_delete_spec
  - name: advertiseHostedTools
    description: >-
      Publish the hosted data plane's tools in this server's tool list without being able to execute
      any of them. Sixteen `sdd_host_*` and `sdd_landscape_*` tools are registered here so an agent
      can DISCOVER them; execution is intercepted upstream by the hosting request orchestrator,
      which owns their contracts, and a handler reached outside a hosted request answers that it is
      unavailable rather than doing anything. Modelled as one method rather than sixteen because
      publishing a discovery list is one job — sixteen portal methods would claim this component
      executes work it never touches, and would duplicate the hosted orchestrator's contract to say
      it.
    signature: 'advertiseHostedTools(): void'
    returns: void
    params: []
  - name: getProjectConfig
    description: >-
      Tool: the bound project's configuration as it was resolved — the rule severities, project type
      and paths a validate or a write will actually use. Answers null when the project has none,
      rather than assuming defaults, so a caller can tell an unconfigured project from a
      default-configured one.
    signature: 'getProjectConfig(): ProjectConfig | null'
    returns: ProjectConfig | null
    params: []
    endpoint:
      transport: Custom
      address: mcp tools/call getProjectConfig
  - name: sdd_pin_externals
    description: >-
      Tool (scope: tree, a write): pin the bound project's declared externals — the named aliases,
      else all — into .wai/externals/<alias>.yaml and .wai/externals.lock.yaml, recording each used
      member's signature digest. Answers one outcome per alias (pinned, unchanged, unresolved,
      unreachable) with its unexported references.
    signature: 'sdd_pin_externals(aliases?: string[]): ExternalPin[]'
    returns: ExternalPin[]
    params:
      - name: aliases
        type: string[]
        description: The aliases to pin; all declared externals when omitted
        optional: true
    endpoint:
      transport: Custom
      address: mcp tools/call sdd_pin_externals
  - name: sdd_get_externals_status
    description: >-
      Tool (scope: tree, a read): each declared external's pin compared with its live producer at
      signature level — unchanged, changed, removed, unlocked — and EXTERNAL_CHECK_UNAVAILABLE for
      anything that cannot be compared, never a pass. Writes nothing.
    signature: 'sdd_get_externals_status(): ExternalStatus[]'
    returns: ExternalStatus[]
    params: []
    endpoint:
      transport: Custom
      address: mcp tools/call sdd_get_externals_status
  - name: sdd_add_member
    description: >-
      Tool: create a member of the bound project — scaffold the member project at the path (its
      project.yaml declaring the alias as its project id, and its L0), each part only when absent,
      and declare it in the bound project's project.yaml `members` with the description. Nothing is
      written into the bound project's spec tree: a member is reached only as `alias::name` through
      its own L0 exports.
    signature: 'sdd_add_member(alias: string, path: string, description?: string): void'
    returns: void
    params:
      - name: alias
        type: string
        description: The member's alias and new project id ([a-z0-9-_]+)
      - name: path
        type: string
        description: The member's root, relative to the bound project
      - name: description
        type: string
        description: What the member is to this project
        optional: true
    endpoint:
      transport: Custom
      address: mcp tools/call sdd_add_member
  - name: sdd_move_member
    description: >-
      Tool: relocate a member's directory on disk and point its `members` entry there (a member
      still declared in the legacy L1 form is moved into `members` first).
    signature: 'sdd_move_member(alias: string, newPath: string): void'
    returns: void
    params:
      - name: alias
        type: string
        description: The member's alias
      - name: newPath
        type: string
        description: The member's new root, relative to the bound project
    endpoint:
      transport: Custom
      address: mcp tools/call sdd_move_member
  - name: sdd_internalize_member
    description: >-
      Tool: take a single-subsystem member back into the bound project — move its specs in, re-save
      every reference across the old boundary as a local id, remove it from `members` and delete its
      .wai project.
    signature: 'sdd_internalize_member(alias: string): void'
    returns: void
    params:
      - name: alias
        type: string
        description: The member's alias
    endpoint:
      transport: Custom
      address: mcp tools/call sdd_internalize_member
status: complete
