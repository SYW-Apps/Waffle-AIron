id: ipolicy_store
name: Policy Store Interface
description: >-
  Private store contract for hosted instance policy: read-through file I/O over three files under
  the data root - the single active pack/profile policy record (pack-policy.json), the
  identity-provider (SSO) configuration collection (identity-providers.json) and the instance
  exposure policy (exposure-policy.json). Every read parses the file fresh; every change is an
  update of ONE of the three files under that file's own write lock.
component: policy_store
methods:
  - name: load
    description: >-
      Read pack-policy.json and identity-providers.json fresh (no in-memory copy), returning the
      pack policy. A missing pack-policy file yields null (no policy ever configured); a missing
      identity-providers file yields an empty collection. An unreadable file or structurally invalid
      JSON fails with a storage error naming the path - the store never silently drops a persisted
      policy or provider configuration.
    signature: 'load(): InstancePackPolicy?'
    returns: InstancePackPolicy?
    params: []
  - name: updatePackPolicy
    description: >-
      Read pack-policy.json fresh (null when absent) and persist what the change makes of it,
      holding that file's write lock (file_write_lock) across both; a change that throws writes
      nothing; a file that exists but cannot be read or parsed throws. Answers the policy written.
    signature: >-
      updatePackPolicy(change: (policy: InstancePackPolicy?) => InstancePackPolicy):
      InstancePackPolicy
    returns: InstancePackPolicy
    effect: write
  - name: updateIdentityProviders
    description: >-
      Read identity-providers.json fresh (empty when absent) and persist what the change makes of
      the collection, holding that file's write lock across both, so two administrators saving
      different providers at once keep both; a change that throws writes nothing. Answers the
      collection written.
    signature: >-
      updateIdentityProviders(change: (providers: IdentityProviderConfig[]) =>
      IdentityProviderConfig[]): IdentityProviderConfig[]
    returns: list<IdentityProviderConfig>
    effect: write
  - name: updateExposurePolicy
    description: >-
      Read exposure-policy.json fresh (null when absent) and persist what the change makes of it,
      holding that file's write lock across both; a change that throws writes nothing. Answers the
      policy written.
    signature: >-
      updateExposurePolicy(change: (policy: HostExposurePolicy?) => HostExposurePolicy):
      HostExposurePolicy
    returns: HostExposurePolicy
    effect: write
status: complete
