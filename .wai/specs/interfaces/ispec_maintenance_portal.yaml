id: ispec_maintenance_portal
name: Spec Maintenance Portal Interface
description: >-
  The mechanical spec writes of sdd_core: renames, subproject relocation, doctor repairs, tree
  import and provisioning.
component: spec_maintenance_portal
methods:
  - name: provisionProject
    description: >-
      Bootstrap a fresh isolated project at the bound root: default project.yaml (declaring the id,
      `name` slugified) plus an L0 system spec named `name`.
    signature: 'provisionProject(name: string): void'
    returns: void
  - name: moveMember
    description: >-
      Published write: relocate a member's directory and point its `members` entry there (a legacy
      mount is moved into `members` first). Routed through the core orchestrator.
    signature: 'moveMember(alias: string, newPath: string): void'
    returns: void
    params:
      - name: alias
        type: string
        description: The member's alias
      - name: newPath
        type: string
        description: The new root, relative to the bound project root
  - name: externalizeSubsystem
    description: >-
      Published write: turn an internal subsystem into a member project declared in `members`.
      Routed through the core orchestrator.
    signature: 'externalizeSubsystem(subsystemId: string, path: string): void'
    returns: void
  - name: internalizeMember
    description: >-
      Published write: take a member back into the bound project whole — every subsystem and
      project-level type — sending its own metadata to the destination's homes and listing what it
      deletes, and remove its declaration. Routed through the core orchestrator. The family
      migration (sdd_migrations) is its caller: it plans the consumers of the member elsewhere in
      the family and runs this inside a staged transaction.
    signature: 'internalizeMember(alias: string, destination: InternalizeDestination): InternalizeResult'
    returns: InternalizeResult
    params:
      - name: alias
        type: string
        description: The member's alias
      - name: destination
        type: InternalizeDestination
        description: Where the member's own metadata goes
  - name: importSpecTree
    description: >-
      Imports a .waitree archive into a project root under an explicit import policy, backing up any
      tree it replaces
    signature: 'importSpecTree(archive: bytes, options: TreeImportOptions): TreeImportResult'
    returns: TreeImportResult
    params:
      - name: archive
        type: bytes
      - name: options
        type: tree_import_options
  - name: ensureProjectInitialized
    description: >-
      Write path for completing a project's bootstrap non-destructively (wairon init, the generate
      cascade): the default configuration and the L0 system spec, each only when absent. A
      configuration it writes declares the given id, else the chosen name slugified.
    signature: 'ensureProjectInitialized(fallbackName: string, id?: string, vision?: string): ProjectBootstrap'
    returns: ProjectBootstrap
    params:
      - name: fallbackName
        type: string
        description: The project name to use when no system spec names one yet
      - name: id
        type: string
        description: >-
          The project id a configuration written here declares — a chained child's mount subsystem
          id; omitted, the chosen name slugified
        optional: true
      - name: vision
        type: string
        description: The vision an L0 written here carries; omitted, a placeholder naming the project
        optional: true
    guarantees:
      - idempotent
  - name: renameComponent
    description: 'Forward to core_orchestrator.renameComponent: rename a component and every reference to it'
    signature: 'renameComponent(componentId: string, newId: string): ComponentRename'
    returns: ComponentRename
    params:
      - name: componentId
        type: string
        description: The component to rename
      - name: newId
        type: string
        description: Its new id
  - name: retireSpecialists
    description: >-
      Forward to core_orchestrator.retireSpecialists: plan, and with apply write, the migration off
      the retired Specialist stereotype
    signature: 'retireSpecialists(apply: boolean): SpecialistRetirement'
    returns: SpecialistRetirement
    params:
      - name: apply
        type: boolean
        description: Write the plan; false plans without writing
  - name: renameMethod
    description: 'Forward to core_orchestrator.renameMethod: rename a contract method and every reference to it'
    signature: >-
      renameMethod(componentId: string, methodName: string, newName: string, pinSymbol?: boolean):
      MethodRename
    returns: MethodRename
    params:
      - name: componentId
        type: string
        description: The component whose contract method is renamed
      - name: methodName
        type: string
        description: The method name as it stands
      - name: newName
        type: string
        description: Its new name, a camel-case identifier
      - name: pinSymbol
        type: boolean
        description: >-
          Whether an implementation that declares no symbol is pinned to the old name; true when
          omitted
        optional: true
  - name: repairForeignStepFields
    description: >-
      Forward to core_orchestrator.repairForeignStepFields: plan, and with apply write, the removal
      of every narrative-step field its own step type cannot have. Without apply nothing is written.
    signature: 'repairForeignStepFields(apply: boolean): ForeignFieldRepair[]'
    returns: ForeignFieldRepair[]
    params:
      - name: apply
        type: boolean
        description: Write the repair; false plans without writing
  - name: findLegacySpecFiles
    description: >-
      Published read: the bound tree's spec files stored under a legacy (undotted) name, each with
      the name the current layout expects — what `wairon doctor` reports and `validate` warns about
      before a migration.
    signature: 'findLegacySpecFiles(): LegacySpecFile[]'
    returns: LegacySpecFile[]
    params: []
  - name: findChainingSubprojectsMissingConfig
    description: >-
      Published read: the chained subproject directories under a root that hold a spec tree but no
      project configuration.
    signature: 'findChainingSubprojectsMissingConfig(projectRoot: string): string[]'
    returns: string[]
    params:
      - name: projectRoot
        type: string
  - name: backfillChainedSubprojectConfigs
    description: >-
      Published repair: write a project configuration for every chained subproject under a root that
      has a spec tree but none, leaving its specs untouched; answers the directories repaired.
    signature: 'backfillChainedSubprojectConfigs(projectRoot: string): string[]'
    returns: string[]
    params:
      - name: projectRoot
        type: string
  - name: moveMountToMembers
    description: >-
      Published write: move one legacy L1 mount of the bound project into its `members` (path and
      description), deleting the L1 document; idempotent. Routed through the core orchestrator.
      Returns whether it wrote.
    signature: 'moveMountToMembers(alias: string): boolean'
    returns: boolean
    params:
      - name: alias
        type: string
        description: The mount subsystem's local id
    guarantees:
      - idempotent
  - name: normalizeReferences
    description: >-
      Published write: re-save one spec with every reference in its canonical stage-3 form, targets
      unchanged; idempotent. Routed through the core orchestrator. Returns whether the stored text
      changed.
    signature: 'normalizeReferences(kind: string, id: string): boolean'
    returns: boolean
    params:
      - name: kind
        type: string
        description: subsystem, component, interface, implementation or type
      - name: id
        type: string
        description: The spec's in-memory key, from the family's top root
    guarantees:
      - idempotent
  - name: createMember
    description: >-
      Published write: create a member of the bound project — scaffold its project (configuration
      with the alias as its id, L0), each part only when absent, and declare it in `members`; a
      newly created configuration also carries the bound project's required packs, once. Answers
      what was scaffolded. Never writes the L1 mount form. Routed through the core orchestrator.
    signature: 'createMember(alias: string, path: string, description?: string): MemberCreation'
    returns: MemberCreation
    params:
      - name: alias
        type: string
        description: The member's alias and new project id
      - name: path
        type: string
        description: The member's root, relative to the bound project root
      - name: description
        type: string
        description: What the member is to this project
        optional: true
  - name: rewriteReferences
    description: >-
      Published write: respell references at parsed positions of one spec of the family, each edit
      replacing exactly its text at exactly its position; refused whole when an edit's text is not
      there. Answers whether the stored text changed. Routed through the core orchestrator.
    signature: 'rewriteReferences(kind: string, id: string, edits: ReferenceEdit[]): boolean'
    returns: boolean
    params:
      - name: kind
        type: string
        description: system, subsystem, component, interface, implementation or type
      - name: id
        type: string
        description: The spec's in-memory key, from the family's top root
      - name: edits
        type: ReferenceEdit[]
        description: The edits for this spec
    guarantees:
      - idempotent
status: complete
