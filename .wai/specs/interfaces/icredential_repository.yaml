id: icredential_repository
name: Credential Repository Interface
description: >-
  Contract for persisting and looking up hashed MCP/API credentials under the data root. Records
  store the hashed token with its role and authorized project fields, and MAY carry owner-subject,
  precise-grant, label, expiry, and revocation metadata populated by the identity mint flow; legacy
  admin-minted keys carry only role and projects.
component: credential_repository
methods:
  - name: findByToken
    description: Look up a credential record by hashed token, or null.
    signature: 'findByToken(tokenHash: string): ApiKeyRecord | null'
    returns: ApiKeyRecord?
  - name: create
    description: >-
      Persist a new MCP/API credential record. The record stores only a hash of the token (never the
      plaintext) alongside its role and authorized project set.
    signature: 'create(record: ApiKeyRecord): void'
    returns: void
    params:
      - name: record
        type: ApiKeyRecord
  - name: revoke
    description: >-
      Delete a credential by id (a revoked credential is removed, never kept in a revoked state; its
      token.revoke audit event is the history). Idempotent for an unknown id.
    signature: 'revoke(id: string): void'
    returns: void
  - name: list
    description: >-
      List credentials whose authorized project set includes the given project (or every record for
      the wildcard).
    signature: 'list(project: string): list<ApiKeyRecord>'
    returns: list<ApiKeyRecord>
    params:
      - name: project
        type: string
  - name: revokeAllForOwner
    description: >-
      Delete every credential whose ownerSubject.userId matches the given owner user id, and return
      the number of records removed. Idempotent — an owner with no credentials returns 0. Backs the
      identity deactivation flow, cutting off all of a user's existing tokens at the credential
      layer so authenticate finds no record for them.
    signature: 'revokeAllForOwner(ownerUserId: string): int'
    returns: int
    params:
      - name: ownerUserId
        type: string
  - name: listByOwner
    description: >-
      List every credential whose ownerSubject.userId matches the given owner user id (a user's own
      minted tokens across all projects), returning stored records with the hashed token only, never
      plaintext. Mirrors revokeAllForOwner's owner matching; no records yields an empty list.
    signature: 'listByOwner(ownerUserId: string): list<ApiKeyRecord>'
    returns: list<ApiKeyRecord>
    params:
      - name: ownerUserId
        type: string
  - name: renarrow
    description: Replace one credential's project narrowing. Pure 1:1 forward to the write registry.
    signatureFrom: credential_write_registry.renarrow
status: complete
