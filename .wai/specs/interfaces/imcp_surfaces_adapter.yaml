id: imcp_surfaces_adapter
name: MCP Surfaces Adapter Interface
description: Contract for the MCP server's surface-exchange reads and the externals pin.
component: mcp_surfaces_adapter
methods:
  - name: listExternalInterfaces
    description: >-
      Forward the scope-aware external-surface discovery (parent family, siblings, foreign imports —
      with origin, provenance, freshness) to the surface portal.
    signature: 'listExternalInterfaces(): ExternalSurfaceEntry[]'
    returns: ExternalSurfaceEntry[]
  - name: pinExternals
    description: Forward the externals pin to the surface portal.
    signature: 'pinExternals(aliases?: string[]): ExternalPin[]'
    returns: ExternalPin[]
    params:
      - name: aliases
        type: string[]
        description: The aliases to pin; all when omitted
        optional: true
  - name: getExternalsStatus
    description: Forward the externals status report to the surface portal.
    signature: 'getExternalsStatus(): ExternalStatus[]'
    returns: ExternalStatus[]
    params: []
status: complete
createdAt: '2026-07-24T18:14:20.548Z'
updatedAt: '2026-09-26T17:49:43.228Z'
