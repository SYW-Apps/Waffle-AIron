id: imcp_surfaces_adapter
name: MCP Surfaces Adapter Interface
description: Contract for the MCP server's surface-exchange reads and the externals pin.
component: mcp_surfaces_adapter
methods:
  - name: pinExternals
    description: Forward the externals pin to the surface portal.
    signature: 'pinExternals(aliases?: list<string>): list<ExternalPin>'
    returns: list<ExternalPin>
    params:
      - name: aliases
        type: list<string>
        description: The aliases to pin; all when omitted
        optional: true
  - name: getExternalsStatus
    description: Forward the externals status report to the surface portal.
    signature: 'getExternalsStatus(): list<ExternalStatus>'
    returns: list<ExternalStatus>
    params: []
  - name: declareExternal
    description: >-
      Forward to surface_portal.declareExternal: declare one external of the bound project
      (sdd_add_external).
    signature: 'declareExternal(request: ExternalRequest): ExternalAddition'
    returns: ExternalAddition
    params:
      - name: request
        type: ExternalRequest
        description: >-
          The alias, the location, and the optional producer id, ref, dir, use, description, pin and
          dryRun
status: complete
createdAt: '2026-07-24T18:14:20.548Z'
updatedAt: '2026-10-06T10:18:14.822Z'
