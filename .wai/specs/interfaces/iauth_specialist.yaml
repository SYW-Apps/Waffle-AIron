id: iauth_specialist
name: Auth Specialist Interface
description: >-
  Contract for credential verification into a Principal. The single authentication authority; it
  resolves the credential's subject, token id, role, authorized project set, and precise grants but
  performs no workflow authorization routing.
component: auth_specialist
methods:
  - name: authenticate
    description: >-
      Verify a data-plane bearer token by constant-time comparison of its hash against stored
      records; resolves the Principal's subject and grants from the credential record when present
      (legacy records fall back to the role/projects projection) and rejects expired (expiresAt) or
      revoked (revokedAt) records, or rejects as unauthenticated when no record matches.
    signature: 'authenticate(token: string): Principal'
    returns: Principal
    params:
      - name: token
        type: string
  - name: authenticateMaster
    description: >-
      Verify the bootstrap/control-plane master credential by constant-time comparison; return an
      administrative Principal (admin role over all projects) or reject.
    signature: 'authenticateMaster(credential: string): Principal'
    returns: Principal
    params:
      - name: credential
        type: string
  - name: signViewToken
    description: >-
      Mint a short-lived HMAC-signed capability token for viewing one project's diagram in a browser
      (no bearer). Encodes project, format, and an expiry.
    signature: 'signViewToken(project: string, format: string): string'
    returns: string
  - name: verifyViewToken
    description: >-
      Verify a view token's signature and expiry (constant-time), returning the ViewGrant or
      rejecting.
    signature: 'verifyViewToken(token: string): ViewGrant'
    returns: ViewGrant
  - name: authenticateCredential
    description: >-
      Verify either the bootstrap/control-plane credential or a stored bearer token by constant-time
      comparison, resolving subject and grants; the single entry point for control-plane surfaces
      that accept both credential kinds.
    signature: 'authenticateCredential(credential: string): Principal'
    returns: Principal
    params:
      - name: credential
        type: string
status: complete
