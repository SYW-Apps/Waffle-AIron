id: iauth_specialist
name: Auth Specialist Interface
description: >-
  Contract for credential verification into a Principal. The single authentication authority;
  performs no routing.
component: auth_specialist
methods:
  - name: authenticate
    description: >-
      Verify a data-plane bearer token by constant-time comparison of its hash against stored
      records; return the resolved Principal or reject as unauthenticated.
    signature: 'authenticate(token: string): Principal'
    returns: Principal
  - name: authenticateMaster
    description: >-
      Verify the control-plane master credential by constant-time comparison; return an admin
      Principal or reject.
    signature: 'authenticateMaster(credential: string): Principal'
    returns: Principal
  - name: signViewToken
    description: >-
      Mint a short-lived HMAC-signed capability token for viewing one project's diagram in a browser
      (no bearer). Encodes project, format, and an expiry.
    signature: 'signViewToken(project: string, format: string): string'
    returns: string
  - name: verifyViewToken
    description: >-
      Verify a view token's signature and expiry (constant-time), returning the ViewGrant or
      rejecting.
    signature: 'verifyViewToken(token: string): ViewGrant'
    returns: ViewGrant
status: complete
createdAt: '2026-07-04T12:49:50.542Z'
updatedAt: '2026-07-04T16:00:15.418Z'
