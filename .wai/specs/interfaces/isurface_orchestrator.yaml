id: isurface_orchestrator
name: Surface Orchestrator Interface
description: Workflow contract behind the surface portal — same five operations, owning the control flow.
component: surface_orchestrator
methods:
  - name: export
    description: >-
      Own-surface projection workflow with optional codec rendering and file output. When format is
      openapi the result carries renderedSet — one OpenAPI 3.1 document per backing portal — and
      `rendered` is set to the single document only when exactly one portal is present. portalId
      selects a single portal's document (rejected when it names no portal). With several portals
      and no portalId, an outPath writes ONE FILE PER PORTAL — the out path's stem suffixed with
      each portalId — rather than silently writing only the first; distinct portals are never merged
      into a combined document.
    signature: >-
      export(maxAudience: string, format: string, outPath?: string, portalId?: string):
      SurfaceSnapshot
    returns: SurfaceSnapshot
    params:
      - name: maxAudience
        type: string
      - name: format
        type: string
      - name: outPath
        type: string
        optional: true
      - name: portalId
        type: string
        optional: true
  - name: import
    description: 'Foreign-document import workflow: read, decode (native or OpenAPI), stamp origin, persist.'
    signature: 'import(sourcePath: string, origin: string): SurfaceSnapshot'
    returns: SurfaceSnapshot
    params:
      - name: sourcePath
        type: string
      - name: origin
        type: string
  - name: listSnapshots
    description: All stored snapshots.
    signature: 'listSnapshots(): SurfaceSnapshot[]'
    returns: list<SurfaceSnapshot>
  - name: getSnapshot
    description: Stored snapshot by producing project name.
    signature: 'getSnapshot(projectName: string): SurfaceSnapshot?'
    returns: SurfaceSnapshot?
    params:
      - name: projectName
        type: string
  - name: removeSnapshot
    description: Remove a stored surface snapshot through the repository.
    signature: 'removeSnapshot(projectName: string): bool'
    returns: bool
    params:
      - name: projectName
        type: string
  - name: pinExternals
    description: >-
      The `wairon externals pin` / sdd_pin_externals workflow. At a project: for each declared
      external and each referenced project member (a `../`, git or hosted source; the named aliases,
      else all): project the producer's resolved project export table at the consumer's audience
      ceiling (project for a family producer, instance for a source.path, git or hosted one) into
      .wai/externals/<alias>.yaml, and record in .wai/externals.lock.yaml the producer id, the
      snapshot path, the snapshot's canonical content digest, the role, the commit, and the `used`
      map — every public name the consumer's references land on or spell, `alias::name` references
      and bare names bound through the alias's `use` import alike, each used member with its
      canonical signature digest (each method of an implemented extension point too) — filled for
      outside producers too since stage 8; a name imported by `use` but referenced nowhere is not
      used. A used member the snapshot no longer carries is named in the outcome's unexported
      references (with the spec that uses it) and its detail, so the CLI line and the MCP answer
      agree; a pin that records no use at all says plainly that no spec references the external yet
      and that it fills on the next pin. A producer whose spec files fail to parse is unreadable,
      naming the file and the error. A git external is pinned at its ref's head, fetched; a git
      member at its declared commit (moving a member's commit is `wairon member update`, never a
      pin). An unchanged snapshot is not rewritten; with no aliases named, lock entries and
      snapshots for aliases no longer declared are removed (the lock file itself with its last
      entry). At a non-contained PART (stage 8): pin its parent instead — the excerpt of the
      parent's specs the part references and the parent's governing configuration, read with the
      parent on disk at PartOf.path, into .wai/externals/<parent id>.yaml and the lock's `parent`
      entry; naming an alias at a part is refused. An alias the project does not declare is refused
      before anything is written; an unresolved or unreachable producer is reported and keeps its
      previous pin. Never locks.
    signature: 'pinExternals(aliases?: list<string>): list<ExternalPin>'
    returns: list<ExternalPin>
    params:
      - name: aliases
        type: list<string>
        description: The aliases to pin; all declared externals when omitted
        optional: true
  - name: getExternalsStatus
    description: >-
      The `wairon externals status` / sdd_get_externals_status report, and the comparison a family
      run composes from. For each declared external and each referenced project member (a `../`, git
      or hosted source): how it resolves, whether it is pinned, and — when the producer is reachable
      — each used member (as locked, and as the consumer's references use it now, bare names bound
      through `use` imports included, each method of an implemented extension point included)
      compared at signature level with the live producer (decision 19) by canonical digest:
      unchanged, changed, renamed (per the producer's rename trace, with the name it went to),
      removed, or unlocked (used now but not in the lock). A reference that binds to no public name
      at all, whose name the live table no longer holds, is a break the live producer proves
      (removed or renamed), pinned or not. Since stage 8 every producer is compared per use — a
      sibling checkout (source.path), a git repository (an external at its ref's head, a referenced
      member at its pinned commit), a hosted record — so a producer outside the family that breaks a
      used method is stale, not merely drifted. Anything it cannot compare — an unreachable or
      unfetchable producer, a producer whose spec files fail to parse (`producer unreadable: <file>:
      <error>`), an unexported reference it still exports — is unavailable with
      EXTERNAL_CHECK_UNAVAILABLE, never a pass; a source.hosted external read outside a hosted
      server says why in its reason: "hosted-only producer `<id>`: available only through the hosted
      server". A producer whose root lies outside the request's reach is marked outOfReach. Writes
      nothing.
    signature: 'getExternalsStatus(offline?: bool): list<ExternalStatus>'
    returns: list<ExternalStatus>
    params:
      - name: offline
        type: bool
        description: >-
          Read no producer over the network (default false): a git external is then reported not
          compared, with the command that compares it. Plain validate and status ask offline
        optional: true
  - name: listExternals
    description: >-
      The `wairon externals list` read: each declared external with how it resolves (family and its
      relation, path, or unresolved with the reason), the audience the consumer sees, and the lock's
      entry when pinned — and each orphaned pin (a lock entry whose alias is no longer declared)
      listed with that problem, never hidden. No live comparison.
    signature: 'listExternals(): list<ExternalListing>'
    returns: list<ExternalListing>
    params: []
  - name: listFamilyPins
    description: >-
      The stage-1 family pins the bound root holds in .wai/surfaces/ — every generated snapshot: the
      family surface (keyed by the parent's system name) and each sibling pin
      (`<system>::<subsystem>`) that `wairon surface pin` wrote. Nothing reads them since stage 3
      (externals and their pins replace them); the chaining migration converts the family pin into
      an external and deletes them all. Foreign imports (exchanged or authored) are never listed.
      Reads only the bound root, and projects nothing.
    signature: 'listFamilyPins(): list<FamilyPin>'
    returns: list<FamilyPin>
    params: []
    guarantees:
      - idempotent
  - name: listPinnedExternals
    description: >-
      The owner's gate read of the bound project's pins: each declared external's alias — and, since
      stage 8, each member declared with a `../`, git or hosted source, which a referenced project
      is judged against exactly as an external (the gate drops the ones the scan found to be parts)
      — with its lock entry and the snapshot that entry names, read from the bound root's own
      .wai/externals.lock.yaml and .wai/externals/ through the externals Repository. It never
      resolves a producer, never reads another root and never climbs: an alias that was never
      pinned, or whose snapshot file is missing or malformed, is answered with its problem instead
      of a snapshot. Writes nothing.
    signature: 'listPinnedExternals(): list<PinnedExternal>'
    returns: list<PinnedExternal>
    params: []
  - name: renamePin
    description: >-
      Carry the bound project's pin of one external over to its new alias or its producer's new id,
      WITHOUT re-pinning: the lock entry moves from `alias` to `newAlias` with its producer id set
      to `project`, its snapshot moves to .wai/externals/<newAlias>.yaml with the provenance's
      producer id set likewise, and the digest and `used` map stay exactly as pinned — a rename is
      not a producer change, and re-pinning would hide one. Answers false, writing nothing, when the
      alias has no pin or already reads that way. The caller must gate on reach itself.
    signature: 'renamePin(alias: string, newAlias: string, project: string): bool'
    returns: bool
    params:
      - name: alias
        type: string
        description: The pinned alias as declared now
      - name: newAlias
        type: string
        description: The alias to keep the pin under (equal to alias when only the producer id changes)
      - name: project
        type: string
        description: The producer id the pin records from now on
    guarantees:
      - idempotent
  - name: unpin
    description: >-
      Remove the bound project's pin of one alias — its lock entry and its snapshot — when the alias
      stops being an external (adopted as a member, or folded into this project). Answers false,
      writing nothing, when there is none. The caller must gate on reach itself.
    signature: 'unpin(alias: string): bool'
    returns: bool
    params:
      - name: alias
        type: string
        description: The alias whose pin goes
    guarantees:
      - idempotent
  - name: pinnedParent
    description: >-
      The owner's gate read of a PART's pinned parent (stage 8): its lock's `parent` entry and the
      excerpt it names, from the bound root's own .wai/externals.lock.yaml and .wai/externals/ —
      never the parent's live tree. Null when the bound root is not a part; a part never pinned, or
      whose excerpt is missing or malformed, is answered with its problem instead of an excerpt.
      Writes nothing.
    signature: 'pinnedParent(): PinnedParent?'
    returns: PinnedParent?
    params: []
    effect: read
  - name: pinParent
    description: >-
      `wairon externals pin` at a PART (stage 8): take the excerpt of the parent the part's files
      reference — read with the parent on disk at PartOf.path — and pin it as the part's
      .wai/externals/<parent id>.yaml and its lock's `parent` entry (role parent, the excerpt's
      digest, the commit), rewriting the excerpt only when its digest moved. A named alias is
      refused before anything is written; a parent the core cannot read, or one that does not claim
      the part, is answered unreachable with the reason and the previous pin stays. Answers one
      outcome, the parent's. Never locks.
    signature: 'pinParent(aliases?: list<string>): list<ExternalPin>'
    returns: list<ExternalPin>
    params:
      - name: aliases
        type: list<string>
        description: 'Must be empty: a part declares no alias to name'
        optional: true
  - name: prune
    description: >-
      Drop every lock entry whose alias is no longer declared, with its snapshot; answers whether
      the lock changed. The prune half of a pin with no aliases named.
    signature: 'prune(lock: ExternalsLock, declared: list<string>): bool'
    returns: bool
    params:
      - name: lock
        type: ExternalsLock
        description: The lock being written, edited in place
      - name: declared
        type: list<string>
        description: Every alias the project declares now (externals and project members by source)
  - name: exportDesign
    description: >-
      Project the bound project's design export and, when an output path is given, write it there as
      JSON. Answers with the export either way.
    signature: 'exportDesign(outPath?: string, approval?: DesignApproval): DesignExport'
    returns: DesignExport
    params:
      - name: outPath
        type: string
        description: Where to write the JSON; nothing is written without it
        optional: true
      - name: approval
        type: DesignApproval
        description: >-
          The lock-check state the caller decided against the gate identity; omitted, the export
          says unjudged
        optional: true
  - name: listConsumers
    description: >-
      The projects that consume the bound project — the family in reach, and with search folders
      every project root in them declaring it as an external by path or git (a sibling checkout) —
      each with the alias and section it declares the bound project under, the public names its
      specs use, and the names it still writes that the bound project no longer exports, so a
      producer sees who breaks before it changes its surface. Read-only.
    signature: 'listConsumers(search?: list<string>): list<ExternalConsumer>'
    returns: list<ExternalConsumer>
    params:
      - name: search
        type: list<string>
        description: Folders to scan for consumers outside the family
        optional: true
  - name: diff
    description: >-
      The bound project's public-surface changelog (`wairon surface diff`, sdd_surface_diff): its
      export table now (the whole table, every audience) against the same table at its last
      committed approval — or at a named git revision, or in a saved native surface snapshot file —
      as names and contract methods added, removed, renamed (traced) and changed in signature
      (surface_snapshot.changesSince). What a producer writes release notes from and weighs a
      breaking change by. Read-only.
    signature: 'diff(against?: string): surface_diff'
    returns: surface_diff
    params:
      - name: against
        type: string
        description: >-
          A git revision or a saved native surface snapshot file; the last committed approval when
          omitted
        optional: true
    previousNames:
      - isurface_orchestrator.diffSurface
  - name: unrecordedUses
    description: >-
      The uses of each PINNED external (and referenced project member) that its pin does not record:
      every public name, and every method of one, the bound project's specs use now through the
      alias — counted offline exactly as a pin counts them (external_producers.resolveDeclared with
      offline set: the family producer's export usage, else the usage by the public name it spells)
      — that the lock entry's `used` map does not hold, keeping only the ones the pinned snapshot
      carries (a use the snapshot does not carry is a design error the gate reports, which no re-pin
      cures). Keyed by alias, each value `<name>` or `<name>.<method>`, sorted; an alias with none
      is left out. What `wairon lock` refuses to approve over and `wairon lock-check` fails on: the
      pin is what a producer's break is judged against, so a use it does not record could not be
      told. No producer is read; writes nothing.
    signature: 'unrecordedUses(): map<string, list<string>>'
    returns: map<string, list<string>>
    params: []
    effect: read
lint:
  allow: []
status: complete
