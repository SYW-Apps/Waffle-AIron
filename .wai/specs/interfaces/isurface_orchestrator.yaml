id: isurface_orchestrator
name: Surface Orchestrator Interface
description: Workflow contract behind the surface portal — same five operations, owning the control flow.
component: surface_orchestrator
methods:
  - name: export
    description: >-
      Own-surface projection workflow with optional codec rendering and file output. When format is
      openapi the result carries renderedSet — one OpenAPI 3.1 document per backing portal — and
      `rendered` is set to the single document only when exactly one portal is present. portalId
      selects a single portal's document (rejected when it names no portal). With several portals
      and no portalId, an outPath writes ONE FILE PER PORTAL — the out path's stem suffixed with
      each portalId — rather than silently writing only the first; distinct portals are never merged
      into a combined document.
    signature: >-
      export(maxAudience: string, format: string, outPath?: string, portalId?: string):
      SurfaceSnapshot
    returns: SurfaceSnapshot
    params:
      - name: maxAudience
        type: string
      - name: format
        type: string
      - name: outPath
        type: string
        optional: true
      - name: portalId
        type: string
        optional: true
  - name: import
    description: 'Foreign-document import workflow: read, decode (native or OpenAPI), stamp origin, persist.'
    signature: 'import(sourcePath: string, origin: string): SurfaceSnapshot'
    returns: SurfaceSnapshot
    params:
      - name: sourcePath
        type: string
      - name: origin
        type: string
  - name: listSnapshots
    description: All stored snapshots.
    signature: 'listSnapshots(): SurfaceSnapshot[]'
    returns: SurfaceSnapshot[]
  - name: getSnapshot
    description: Stored snapshot by producing project name.
    signature: 'getSnapshot(projectName: string): SurfaceSnapshot | null'
    returns: SurfaceSnapshot | null
    params:
      - name: projectName
        type: string
  - name: removeSnapshot
    description: Remove a stored surface snapshot through the repository.
    signature: 'removeSnapshot(projectName: string): boolean'
    returns: boolean
    params:
      - name: projectName
        type: string
  - name: pinExternals
    description: >-
      The `wairon externals pin` / sdd_pin_externals workflow. For each declared external (the named
      aliases, else all): project the producer's resolved project export table at the consumer's
      audience ceiling (project for a family producer, instance for a source.path one) into
      .wai/externals/<alias>.yaml, and record in .wai/externals.lock.yaml the producer id, the
      snapshot path, the snapshot's content digest and the `used` map — every public name the
      consumer's references land on, each used member with its signature digest. An unchanged
      snapshot is not rewritten; with no aliases named, lock entries and snapshots for aliases no
      longer declared are removed. An alias the project does not declare is refused before anything
      is written; an unresolved or unreachable producer is reported and leaves its previous pin in
      place. The caller must gate on reach itself: a producer the request may not read is reported
      unreachable, never read.
    signature: 'pinExternals(aliases?: string[]): ExternalPin[]'
    returns: ExternalPin[]
    params:
      - name: aliases
        type: string[]
        description: The aliases to pin; all declared externals when omitted
        optional: true
  - name: getExternalsStatus
    description: >-
      The `wairon externals status` / sdd_get_externals_status report, and the comparison a family
      run composes from. For each declared external: how it resolves, whether it is pinned, and —
      when the producer is reachable — each used member (as locked, and as the consumer's references
      use it now) compared at signature level with the live producer (decision 19): unchanged,
      changed, removed, or unlocked (used now but not in the lock). Anything it cannot compare — an
      unreachable producer, an unexported reference, a producer outside the family — is unavailable
      with EXTERNAL_CHECK_UNAVAILABLE, never a pass. A producer whose root lies outside the
      request's reach is marked outOfReach and never read, so a caller that narrowed the reach to
      its selection learns which externals it did not select. It only reports: it writes nothing and
      fails nothing.
    signature: 'getExternalsStatus(): ExternalStatus[]'
    returns: ExternalStatus[]
    params: []
  - name: listExternals
    description: >-
      The `wairon externals list` read: each declared external with how it resolves (family and its
      relation, path, or unresolved with the reason), the audience the consumer sees, and the lock's
      entry when pinned. No live comparison.
    signature: 'listExternals(): ExternalListing[]'
    returns: ExternalListing[]
    params: []
  - name: listFamilyPins
    description: >-
      The stage-1 family pins the bound root holds in .wai/surfaces/ — every generated snapshot: the
      family surface (keyed by the parent's system name) and each sibling pin
      (`<system>::<subsystem>`) that `wairon surface pin` wrote. Nothing reads them since stage 3
      (externals and their pins replace them); the chaining migration converts the family pin into
      an external and deletes them all. Foreign imports (exchanged or authored) are never listed.
      Reads only the bound root, and projects nothing.
    signature: 'listFamilyPins(): FamilyPin[]'
    returns: FamilyPin[]
    params: []
    guarantees:
      - idempotent
  - name: listPinnedExternals
    description: >-
      The owner's gate read of the bound project's pins: each declared external's alias with its
      lock entry and the snapshot that entry names, read from the bound root's own
      .wai/externals.lock.yaml and .wai/externals/ through the externals Repository. It never
      resolves a producer, never reads another root and never climbs: an alias that was never
      pinned, or whose snapshot file is missing or malformed, is answered with its problem instead
      of a snapshot. Writes nothing.
    signature: 'listPinnedExternals(): PinnedExternal[]'
    returns: PinnedExternal[]
    params: []
