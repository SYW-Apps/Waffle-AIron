id: isurface_orchestrator
name: Surface Orchestrator Interface
description: Workflow contract behind the surface portal — same five operations, owning the control flow.
component: surface_orchestrator
methods:
  - name: exportSurface
    description: >-
      Own-surface projection workflow with optional codec rendering and file output. When format is
      openapi the result carries renderedSet — one OpenAPI 3.1 document per backing portal — and
      `rendered` is set to the single document only when exactly one portal is present. portalId
      selects a single portal's document (rejected when it names no portal). With several portals
      and no portalId, an outPath writes ONE FILE PER PORTAL — the out path's stem suffixed with
      each portalId — rather than silently writing only the first; distinct portals are never merged
      into a combined document.
    signature: >-
      exportSurface(maxAudience: string, format: string, outPath?: string, portalId?: string):
      SurfaceSnapshot
    returns: SurfaceSnapshot
    params:
      - name: maxAudience
        type: string
      - name: format
        type: string
      - name: outPath
        type: string
        optional: true
      - name: portalId
        type: string
        optional: true
  - name: importSurface
    description: 'Foreign-document import workflow: read, decode (native or OpenAPI), stamp origin, persist.'
    signature: 'importSurface(sourcePath: string, origin: string): SurfaceSnapshot'
    returns: SurfaceSnapshot
    params:
      - name: sourcePath
        type: string
      - name: origin
        type: string
  - name: listSnapshots
    description: All stored snapshots.
    signature: 'listSnapshots(): SurfaceSnapshot[]'
    returns: SurfaceSnapshot[]
  - name: getSnapshot
    description: Stored snapshot by producing project name.
    signature: 'getSnapshot(projectName: string): SurfaceSnapshot | null'
    returns: SurfaceSnapshot | null
    params:
      - name: projectName
        type: string
  - name: removeSnapshot
    description: Remove a stored surface snapshot through the repository.
    signature: 'removeSnapshot(projectName: string): boolean'
    returns: boolean
    params:
      - name: projectName
        type: string
  - name: listExternalInterfaces
    description: >-
      Scope-aware discovery of this project's outward world: enumerate every vendored surface
      snapshot as an ExternalSurfaceEntry — origin, family role (parent | sibling | foreign),
      provenance, exposed interface ids — with a per-entry freshness verdict. Freshness compares the
      vendored StateId against the chaining parent's CURRENT state hash when a chaining parent is
      reachable and the bound request may read above its root (resolveChainingParent +
      computeParentStateId); entries are 'unverifiable' when standalone, when the parent is out of
      the request's reach (a hosted credential narrowed to the child), or when foreign. The read
      behind the sdd_list_external_interfaces MCP tool and the surface externals CLI.
    signature: 'listExternalInterfaces(): ExternalSurfaceEntry[]'
    returns: ExternalSurfaceEntry[]
  - name: listMountSnapshots
    description: >-
      For each chained mount namespace, resolve the mount's project root through the core and read
      the snapshots stored there, keyed by namespace. A mount that does not resolve, or holds no
      snapshots, contributes nothing. Kept apart from the bound root's own snapshots so a contract a
      child imported never decides the parent's own references to the same name.
    signature: 'listMountSnapshots(mounts: string[]): MountSurfaceSnapshots[]'
    returns: MountSurfaceSnapshots[]
    params:
      - name: mounts
        type: string[]
  - name: pinFamilySurfaces
    description: >-
      Pin the outward world of a chained child into its OWN .wai/surfaces/, pulled by the child
      rather than pushed by the parent's lock: resolve the chaining parent, bind the parent root
      read-only, project the family-scoped parent surface and every SIBLING subsystem's published
      surface (all but this child's own mount), and store each into the child, leaving an unchanged
      snapshot untouched. Returns the changed paths, or null when the bound root is not a chained
      subproject. This is what a child cloned WITHOUT its parent validates its cross-tree references
      against — a versioned import its owner commits on their own schedule.
    signature: 'pinFamilySurfaces(): string[] | null'
    returns: string[] | null
    params: []
status: complete
