id: isurface_orchestrator
name: Surface Orchestrator Interface
description: Workflow contract behind the surface portal — same five operations, owning the control flow.
component: surface_orchestrator
methods:
  - name: export
    description: >-
      Own-surface projection workflow with optional codec rendering and file output. When format is
      openapi the result carries renderedSet — one OpenAPI 3.1 document per backing portal — and
      `rendered` is set to the single document only when exactly one portal is present. portalId
      selects a single portal's document (rejected when it names no portal). With several portals
      and no portalId, an outPath writes ONE FILE PER PORTAL — the out path's stem suffixed with
      each portalId — rather than silently writing only the first; distinct portals are never merged
      into a combined document.
    signature: >-
      export(maxAudience: string, format: string, outPath?: string, portalId?: string):
      SurfaceSnapshot
    returns: SurfaceSnapshot
    params:
      - name: maxAudience
        type: string
      - name: format
        type: string
      - name: outPath
        type: string
        optional: true
      - name: portalId
        type: string
        optional: true
  - name: import
    description: 'Foreign-document import workflow: read, decode (native or OpenAPI), stamp origin, persist.'
    signature: 'import(sourcePath: string, origin: string): SurfaceSnapshot'
    returns: SurfaceSnapshot
    params:
      - name: sourcePath
        type: string
      - name: origin
        type: string
  - name: listSnapshots
    description: All stored snapshots.
    signature: 'listSnapshots(): SurfaceSnapshot[]'
    returns: SurfaceSnapshot[]
  - name: getSnapshot
    description: Stored snapshot by producing project name.
    signature: 'getSnapshot(projectName: string): SurfaceSnapshot | null'
    returns: SurfaceSnapshot | null
    params:
      - name: projectName
        type: string
  - name: removeSnapshot
    description: Remove a stored surface snapshot through the repository.
    signature: 'removeSnapshot(projectName: string): boolean'
    returns: boolean
    params:
      - name: projectName
        type: string
  - name: listExternalInterfaces
    description: >-
      Scope-aware discovery of this project's outward world: enumerate every vendored surface
      snapshot as an ExternalSurfaceEntry — origin, family role (parent | sibling | foreign),
      provenance, exposed interface ids — with a per-entry freshness verdict judged on CONTENT. When
      a chaining parent is reachable and the bound request may read above its root
      (resolveChainingParent), the parent's current family surface and each sibling's published
      surface are projected at the parent root, bound read-only, and each generated snapshot is
      'fresh' when its contracts equal that projection and 'stale' otherwise; entries are
      'unverifiable' when standalone, out of reach, or foreign. Re-pinning therefore always repairs
      a stale entry. The read behind the sdd_list_external_interfaces MCP tool and the surface
      externals CLI.
    signature: 'listExternalInterfaces(): ExternalSurfaceEntry[]'
    returns: ExternalSurfaceEntry[]
  - name: listMountSnapshots
    description: >-
      For each chained mount namespace, resolve the mount's project root through the core and read
      the snapshots stored there, keyed by namespace. A mount that does not resolve, or holds no
      snapshots, contributes nothing. Kept apart from the bound root's own snapshots so a contract a
      child imported never decides the parent's own references to the same name.
    signature: 'listMountSnapshots(mounts: string[]): MountSurfaceSnapshots[]'
    returns: MountSurfaceSnapshots[]
    params:
      - name: mounts
        type: string[]
  - name: pinFamilySurfaces
    description: >-
      Pin the outward world of a chained child into its OWN .wai/surfaces/, pulled by the child
      rather than pushed by the parent's lock: resolve the chaining parent, bind the parent root
      read-only, project the family-scoped parent surface and every SIBLING subsystem's published
      surface (all but this child's own mount), and store each into the child, leaving an unchanged
      snapshot untouched. Returns the changed paths, or null when the bound root is not a chained
      subproject. This is what a child cloned WITHOUT its parent validates its cross-tree references
      against — a versioned import its owner commits on their own schedule.
    signature: 'pinFamilySurfaces(): string[] | null'
    returns: string[] | null
    params: []
  - name: pinExternals
    description: >-
      The `wairon externals pin` / sdd_pin_externals workflow. For each declared external (the named
      aliases, else all): project the producer's resolved project export table at the consumer's
      audience ceiling (project for a family producer, instance for a source.path one) into
      .wai/externals/<alias>.yaml, and record in .wai/externals.lock.yaml the producer id, the
      snapshot path, the snapshot's content digest and the `used` map — every public name the
      consumer's references land on, each used member with its signature digest. An unchanged
      snapshot is not rewritten; with no aliases named, lock entries and snapshots for aliases no
      longer declared are removed. An alias the project does not declare is refused before anything
      is written; an unresolved or unreachable producer is reported and leaves its previous pin in
      place. The caller must gate on reach itself: a producer the request may not read is reported
      unreachable, never read.
    signature: 'pinExternals(aliases?: string[]): ExternalPin[]'
    returns: ExternalPin[]
    params:
      - name: aliases
        type: string[]
        description: The aliases to pin; all declared externals when omitted
        optional: true
  - name: getExternalsStatus
    description: >-
      The `wairon externals status` / sdd_get_externals_status report. For each declared external:
      how it resolves, whether it is pinned, and — when the producer is reachable — each used member
      (as locked, and as the consumer's references use it now) compared at signature level with the
      live producer (decision 19): unchanged, changed, removed, or unlocked (used now but not in the
      lock). Anything it cannot compare — an unreachable producer, an unexported reference, a
      producer outside the family — is unavailable with EXTERNAL_CHECK_UNAVAILABLE, never a pass. It
      only reports: it writes nothing and fails nothing.
    signature: 'getExternalsStatus(): ExternalStatus[]'
    returns: ExternalStatus[]
    params: []
  - name: listExternals
    description: >-
      The `wairon externals list` read: each declared external with how it resolves (family and its
      relation, path, or unresolved with the reason), the audience the consumer sees, and the lock's
      entry when pinned. No live comparison.
    signature: 'listExternals(): ExternalListing[]'
    returns: ExternalListing[]
    params: []
