id: isurface_store
name: Surface Store Interface
description: >-
  Read-through state contract for this project's stored surface snapshots: every read is the file
  read, every write the file write.
component: surface_store
methods:
  - name: put
    description: Persist or replace a snapshot keyed by its producing project; answers where it was persisted.
    signature: 'put(snapshot: SurfaceSnapshot): string'
    returns: string
    params:
      - name: snapshot
        type: SurfaceSnapshot
    effect: write
  - name: get
    description: The stored snapshot for a project name, or null.
    signature: 'get(projectName: string): SurfaceSnapshot?'
    returns: SurfaceSnapshot?
    params:
      - name: projectName
        type: string
    effect: read
  - name: list
    description: Every stored snapshot at the bound root.
    signature: 'list(): list<SurfaceSnapshot>'
    returns: list<SurfaceSnapshot>
    params: []
    effect: read
  - name: remove
    description: Remove the stored snapshot for a project; whether one existed.
    signature: 'remove(projectName: string): bool'
    returns: bool
    params:
      - name: projectName
        type: string
    effect: write
status: complete
createdAt: '2026-07-10T23:13:31.819Z'
updatedAt: '2026-10-04T22:34:17.918Z'
