id: ipack_registry
name: Pack Registry Interface
description: >-
  Contract for the hosted extension-pack store: list, install (declarative-only), and remove packs
  at server-global scope and at a bound project's scope, plus a read of a project's declared
  pack/profile references for operational drift checks. Server-global discovery merges two tiers —
  the immutable image-layer directory (WAIRON_IMAGE_PACKS_DIR) and the mutable instance directory
  (WAIRON_PACKS_DIR) — with the instance pack winning on a name collision and the shadowed image
  pack surfaced as drift; install and remove touch only the mutable instance tier. Installs validate
  the content as a declarative pack (profiles + language/platform tables) and refuse
  programmatic/code packs; probing never throws for a bad pack (the error rides on its descriptor).
component: pack_registry
methods:
  - name: listGlobalPacks
    description: >-
      Probe every pack across both server-global tiers — the immutable image-layer directory and the
      mutable instance directory — and return their union as descriptors, each tagged with its tier;
      an image pack shadowed by a same-named instance pack is marked shadowed (the instance copy is
      the effective one), so drift is visible in the listing.
    signature: 'listGlobalPacks(): PackDescriptor[]'
    returns: PackDescriptor[]
    params: []
  - name: installGlobalPack
    description: >-
      Validate the content as a declarative pack and write it as <name>.yaml into the MUTABLE
      instance packs directory (WAIRON_PACKS_DIR); the immutable image-layer directory is never
      written. Reject programmatic/code content. Returns its probe (tier 'instance').
    signature: 'installGlobalPack(name: string, content: string): PackDescriptor'
    returns: PackDescriptor
    params:
      - name: name
        type: string
        description: Pack file name stem (sanitized; [A-Za-z0-9._-])
      - name: content
        type: string
        description: Declarative pack YAML text
  - name: removeGlobalPack
    description: >-
      Delete the named pack from the MUTABLE instance packs directory; image-layer packs are
      immutable and cannot be removed here (removing a pack that exists only in the image tier is an
      error). Removing an instance pack that shadowed a same-named image pack re-exposes the image
      pack. Removal intentionally invalidates projects that still reference the pack.
    signature: 'removeGlobalPack(name: string): void'
    returns: void
    params:
      - name: name
        type: string
  - name: listProjectPacks
    description: Probe the bound project's registered packs (.wai/project.yaml -> extensions.packs).
    signature: 'listProjectPacks(): PackDescriptor[]'
    returns: PackDescriptor[]
    params: []
  - name: installProjectPack
    description: >-
      Validate the content as a declarative pack, vendor it into the bound project's
      .wai/packs/<name>.yaml, and register it in project.yaml; reject programmatic/code content.
      Returns its probe.
    signature: 'installProjectPack(name: string, content: string): PackDescriptor'
    returns: PackDescriptor
    params:
      - name: name
        type: string
        description: Pack file name stem (sanitized)
      - name: content
        type: string
        description: Declarative pack YAML text
  - name: removeProjectPack
    description: >-
      Deregister the named pack from the bound project's project.yaml and delete its vendored
      .wai/packs file.
    signature: 'removeProjectPack(name: string): void'
    returns: void
    params:
      - name: name
        type: string
  - name: readProjectReferences
    description: >-
      Read a given hosted project's declared pack/profile references (its registered extension packs
      unioned with the required/default packs and the profile ids recorded in its profile selection)
      from its .wai/project.yaml, for operational drift checks. Never throws for a missing/empty
      config; returns a ProjectPackReference carrying no filesystem paths.
    signature: 'readProjectReferences(rootPath: string): ProjectPackReference'
    returns: ProjectPackReference
    params:
      - name: rootPath
        type: string
        description: Absolute filesystem root of the project's isolated .wai/ tree.
  - name: storeListGlobalPacks
    description: >-
      List the server-global declarative packs straight from the store layer — the PRE-AUTHORIZED
      read used by internal health and policy flows (no credential: the caller has already enforced
      authorization).
    signature: 'storeListGlobalPacks(): PackDescriptor[]'
    returns: PackDescriptor[]
  - name: executeApprovedListProjectPacks
    description: >-
      Pre-authorized entry for the approval workflow and internal policy flows: list the packs
      vendored into a bound project WITHOUT authentication — the caller has already enforced
      approval-based or resolver authorization. Never exposed on any portal.
    signature: 'executeApprovedListProjectPacks(project: string): PackDescriptor[]'
    returns: PackDescriptor[]
  - name: executeApprovedInstallProjectPack
    description: >-
      Pre-authorized entry for the approval workflow and internal policy flows: vendor and register
      one declarative pack into a bound project WITHOUT authentication — the caller has already
      enforced approval-based or resolver authorization. Never exposed on any portal.
    signature: >-
      executeApprovedInstallProjectPack(project: string, name: string, content: string):
      PackDescriptor
    returns: PackDescriptor
  - name: installGlobalPackArchive
    description: >-
      Install a declarative pack from a .wpack ARCHIVE into the mutable instance packs directory.
      Inspects the envelope and rejects a code pack (declarative-only surface); derives the name
      from the envelope (or the optional override), safely extracts under hosted-strict limits,
      re-checks the extracted pack is declarative, and returns its probe (tier instance). The
      primary hosted install path (the string-content installGlobalPack is retained but deprecated).
    signature: 'installGlobalPackArchive(archive: bytes, name?: string): PackDescriptor'
    returns: PackDescriptor
    params:
      - name: archive
        type: bytes
      - name: name
        type: string
        description: Optional name override; defaults to the envelope's pack name
        optional: true
  - name: installProjectPackArchive
    description: >-
      Archive counterpart of installProjectPack for the bound project: safely extract the
      declarative pack into .wai/packs/<name>/ and register the directory ref in project.yaml;
      rejects code and unsafe/non-declarative archives.
    signature: 'installProjectPackArchive(archive: bytes, name?: string): PackDescriptor'
    returns: PackDescriptor
    params:
      - name: archive
        type: bytes
      - name: name
        type: string
        optional: true
status: complete
