id: isurface_transfer_adapter
name: Surface Transfer Adapter Interface
description: >-
  File exchange with locations OUTSIDE this project's own aggregate: child project deliveries,
  rendered exports, and foreign-document reads.
component: surface_transfer_adapter
methods:
  - name: writeSnapshotTo
    description: >-
      Write a snapshot, or its rendered per-portal documents, to a target output path, returning
      every path written: the snapshot YAML when nothing was rendered, the single document when one
      portal remains, else one file per portal beside the target.
    signature: >-
      writeSnapshotTo(targetPath: string, snapshot: SurfaceSnapshot, renderedSet?:
      list<NamedOpenApiSpec>): list<string>
    returns: list<string>
    params:
      - name: targetPath
        type: string
      - name: snapshot
        type: SurfaceSnapshot
      - name: renderedSet
        type: list<NamedOpenApiSpec>
        description: >-
          The rendered per-portal documents (e.g. OpenAPI) to write instead of native YAML; one file
          per portal when there are several
        optional: true
  - name: readDocument
    description: Read a foreign surface document (native snapshot YAML or OpenAPI JSON/YAML) from a path.
    signature: 'readDocument(sourcePath: string): string'
    returns: string
    params:
      - name: sourcePath
        type: string
  - name: writeDesignTo
    description: Write a design export to a target output path as JSON, returning the path written.
    signature: 'writeDesignTo(targetPath: string, design: DesignExport): string'
    returns: string
    params:
      - name: targetPath
        type: string
      - name: design
        type: DesignExport
status: complete
createdAt: '2026-07-10T23:14:07.216Z'
updatedAt: '2026-10-04T13:54:34.264Z'
