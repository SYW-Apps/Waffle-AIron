id: iproject_status
name: Project Status Interface
description: >-
  One question: how far along is this spec tree? Answered as text, so a terminal, an MCP client and
  a test all read the same account rather than three that can disagree.
component: project_status
methods:
  - name: report
    description: >-
      The completeness report for the tree, or for one subsystem when the options name it, marked up
      however the caller asked. A parse failure is reported rather than thrown — a tree that will
      not load is exactly when somebody is asking after its status, so the report names each file
      and what was wrong with it instead of refusing to answer. There is ONE renderer: the terminal
      and the MCP status tool read the same text, differing only in what they do with the roles it
      hands back.
    signature: 'report(options: StatusOptions, decor?: StatusDecor): string'
    returns: string
    params:
      - name: options
        type: StatusOptions
        description: How much of the tree to cover
      - name: decor
        type: StatusDecor
        description: How to mark up each kind of thing, or nothing for plain text
    guarantees:
      - idempotent
status: complete
createdAt: '2026-09-23T11:46:44.909Z'
