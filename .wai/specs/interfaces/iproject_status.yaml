id: iproject_status
name: Project Status Interface
description: >-
  One question: how far along is this spec tree? Answered as text, so a terminal, an MCP client and
  a test all read the same account rather than three that can disagree.
component: project_status
methods:
  - name: report
    description: >-
      The completeness report for the tree, or for one subsystem when the options name it, marked up
      however the caller asked — and whether it could be produced at all. The bound project's
      subsystems print as subsystems — a part's subsystems among them (stage 8), each marked with
      the part's alias and storage (and a git part's short commit), and a part that could not be
      read printed as unavailable with its reason — and each PROJECT member it reaches prints as a
      project holding its own subsystems, never as a subsystem of its parent; when the options carry
      the pin tree (options.approvals), each project member's line carries its approval state
      (approved | drifted | never) and how its parent pinned it (matches | moved | unpinned), and
      the report ends with the root's own state. At a part's root it prints one line — "part of
      <parent>" with its pin state — above the part's own subsystems. A parse failure is reported
      rather than thrown, because a tree that will not load is exactly when somebody is asking after
      its status; it comes back as text with `failed` set, so a caller decides what to do from the
      fact rather than by recognising a sentence. There is ONE renderer: the terminal and the MCP
      status tool read the same text, differing only in what they do with the roles and the fact it
      hands back.
    signature: 'report(options?: StatusOptions, decor?: StatusDecor): StatusReport'
    returns: StatusReport
    params:
      - name: options
        type: StatusOptions
        description: How much of the tree to cover; omitted covers the whole tree with its members
        optional: true
      - name: decor
        type: StatusDecor
        description: How to mark up each kind of thing; omitted renders plain text
        optional: true
    guarantees:
      - idempotent
status: complete
