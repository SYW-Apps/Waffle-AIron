id: igit_backing_repository
name: Git Backing Repository Interface
description: >-
  Facade contract for container-level backing bindings. Pure 1:1 forwarding: writes to the registry,
  reads to the index.
component: git_backing_repository
methods:
  - name: upsertBinding
    description: 'Facade: create or replace the binding for a scope through the registry.'
    signature: 'upsertBinding(binding: GitBackingBinding): GitBackingBinding'
    returns: GitBackingBinding
    params:
      - name: binding
        type: GitBackingBinding
    guarantees:
      - atomic
  - name: removeBinding
    description: 'Facade: remove one binding by id through the registry.'
    signature: 'removeBinding(bindingId: string): void'
    returns: void
    params:
      - name: bindingId
        type: string
  - name: touchSync
    description: 'Facade: record lastSyncAt through the registry.'
    signature: 'touchSync(bindingId: string, syncedAt: string): void'
    returns: void
    params:
      - name: bindingId
        type: string
      - name: syncedAt
        type: string
  - name: listBindings
    description: 'Facade: list every stored binding through the index.'
    signature: 'listBindings(): GitBackingBinding[]'
    returns: GitBackingBinding[]
    params: []
  - name: getBinding
    description: 'Facade: one binding by id through the index, or null.'
    signature: 'getBinding(bindingId: string): GitBackingBinding | null'
    returns: GitBackingBinding | null
    params:
      - name: bindingId
        type: string
status: draft
createdAt: '2026-07-16T15:39:09.744Z'
updatedAt: '2026-07-16T15:39:09.746Z'
