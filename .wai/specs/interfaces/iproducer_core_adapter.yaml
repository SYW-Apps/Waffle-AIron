id: iproducer_core_adapter
name: Producer Core Client Adapter Interface
description: Contract for loading the spec tree and rendering diagrams, forwarded to the core portal.
component: producer_core_adapter
methods:
  - name: loadSystemSpec
    description: Load the L0 system spec.
    signature: 'loadSystemSpec(): SystemSpec | null'
    returns: SystemSpec?
  - name: loadSubsystemSpecs
    description: Load subsystem specs.
    signature: 'loadSubsystemSpecs(): SubsystemSpec[]'
    returns: list<SubsystemSpec>
  - name: loadComponentSpecs
    description: Load component specs.
    signature: 'loadComponentSpecs(): ComponentSpec[]'
    returns: list<ComponentSpec>
  - name: loadInterfaceSpecs
    description: Load interface specs.
    signature: 'loadInterfaceSpecs(): InterfaceSpec[]'
    returns: list<InterfaceSpec>
  - name: loadImplementationSpecs
    description: Load implementation specs.
    signature: 'loadImplementationSpecs(): ImplementationSpec[]'
    returns: list<ImplementationSpec>
  - name: renderDiagram
    description: Render the project's diagram in the given format.
    signature: 'renderDiagram(format: string): string'
    returns: string
  - name: loadTypeSpecs
    description: Load type specs, each signature type with its params and returns.
    signature: 'loadTypeSpecs(): TypeSpec[]'
    returns: list<TypeSpec>
status: complete
createdAt: '2026-07-04T17:37:41.880Z'
updatedAt: '2026-10-04T10:19:16.877Z'
