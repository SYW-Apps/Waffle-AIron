id: irule_repository
name: Rule Repository Interface
description: >-
  Facade contract for the in-memory SDD rule set: register the built-in and pack rules, then read
  the ordered run sequence and known-code set.
component: rule_repository
methods:
  - name: registerBuiltinRules
    description: Seed the built-in SDD rule set.
    signatureFrom: rule_registry.registerBuiltinRules
  - name: registerPackRules
    description: Register programmatic pack rules after the built-ins.
    signatureFrom: rule_registry.registerPackRules
  - name: ruleSequence
    description: Return the ordered rule run sequence.
    signatureFrom: rule_index.ruleSequence
  - name: knownIssueCodes
    description: Return the aggregate known-issue-code set.
    signatureFrom: rule_index.knownIssueCodes
  - name: specScopedRules
    description: Return the spec-scoped rules in run order, for the write gate.
    signatureFrom: rule_index.specScopedRules
status: complete
createdAt: '2026-07-14T19:17:21.194Z'
updatedAt: '2026-10-03T21:10:34.684Z'
