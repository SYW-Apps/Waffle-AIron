id: isecret_write_registry
name: Secret Write Registry Interface
description: Write-face contract of the secret repository.
component: secret_write_registry
methods:
  - name: write
    description: >-
      Set a secret by key (git-token | notion-token | signing-secret | ...), as one locked
      read-modify-write of the secret map, persisted atomically. Requires the data dir to be
      configured.
    signature: 'write(key: string, value: string): void'
    returns: void
status: complete
