id: iinstructions_specialist
name: Server Instructions Specialist Interface
description: >-
  Composes the MCP `initialize` instructions for the bound project: wairon's own SDD briefing plus
  the profile-scoped, attributed instruction blocks contributed by the loaded extension packs.
component: instructions_specialist
methods:
  - name: buildServerInstructions
    description: >-
      Compose the full instructions text for the bound project: wairon's own SDD briefing (spec-tree
      shape, L0→L5, authoring order, self-describing tool schemas, the governing
      projectType/profile, the loaded packs, and the read-the-skill-first directive with the
      available skill resource URIs), then every governing pack's instruction blocks appended under
      an attributed heading in pack load order. Returns the composed text; never throws — an
      uninitialized project or a failed pack load degrades to wairon's own briefing so a connecting
      agent is always taught something.
    signature: 'buildServerInstructions(): string'
    returns: string
    params: []
status: complete
createdAt: '2026-07-29T10:49:14.890Z'
updatedAt: '2026-07-29T11:56:28.102Z'
