id: ichaining_migration_orchestrator
name: Chaining Migration Orchestrator Interface
description: >-
  Plan first, written on confirmation into a rehearsal, made live by the family transaction. plan()
  writes nothing, ever; write(plan, rehearsal) writes only what the plan names, in a fixed order,
  into the rehearsal's roots, and is idempotent — writing the same plan again, or planning again
  after it is committed, changes nothing. Neither locks: the writes stale the approval of every
  project they touch, and the report names them for their humans to re-lock.
component: chaining_migration_orchestrator
methods:
  - name: plan
    description: >-
      Plan the chaining migration of the bound project's family, from the highest root in reach: (a)
      each defaulted id to declare — a member its alias, the top root its effective id, any project
      the id its own lock approved; (b) each stage-1 family pin: the parent pin converted to an
      externals entry for the parent, every family pin marked superseded for deletion; (c) for every
      cross-project reference that reaches another project at anything but a public name, the
      producer's missing L0 entry (a re-export, or an own `{ typeDef }` for a project-level type,
      with a minimal L0 where the producer has none), the consumer's external, and a pin; (d)
      through the position migration, each legacy mount moved into `members` with what it carries
      and each deprecated reference's rewrite. Computed only from the project graph, the scan's
      bindings, export usage, the export tables and the specs the references name. An ambiguity is
      reported, never guessed. Writes nothing.
    signature: 'plan(): ChainingMigrationPlan'
    returns: ChainingMigrationPlan
    params: []
    guarantees:
      - idempotent
  - name: write
    description: >-
      Write a plan into the rehearsal: each project's writes land in its rehearsal root (the
      rehearsal's image of the plan's `directory`), and the family transaction then swaps the whole
      result in or nothing. Refuses before the first write when the plan is blocked (the family was
      partial, a project it writes or a member it declares is absent, or a mount carries a field it
      cannot move) or when a planned L0 edit fails the gate's dry run. Then writes in order — ids;
      minimal L0s and L0 entries through the gated authoring seam; externals declarations; then,
      through the position migration, the positional imports, the mounts moved into `members`, the
      reference rewrites and the deletion of superseded family pins; and the pins LAST, so every
      snapshot and every lock's `used` map is taken from the final spelling — each under its
      project's binding. Every write is idempotent: a declared id or external equal to the planned
      one, an L0 entry already present, a mount already moved, a spec already canonical and a pin
      already gone change nothing; a declared id or alias that DIFFERS is refused, never
      overwritten. Answers what was written (rehearsal paths reported by their live project) and
      which projects must be re-locked; it locks nothing.
    signature: 'write(plan: ChainingMigrationPlan, rehearsal: Rehearsal): ChainingMigrationReport'
    returns: ChainingMigrationReport
    params:
      - name: plan
        type: ChainingMigrationPlan
        description: The plan the person confirmed, as plan() answered it
      - name: rehearsal
        type: Rehearsal
        description: 'Where to write it: each project''s rehearsal root'
    guarantees:
      - idempotent
status: complete
