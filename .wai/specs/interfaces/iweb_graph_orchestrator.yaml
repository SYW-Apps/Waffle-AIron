id: iweb_graph_orchestrator
name: Web Graph Orchestrator Interface
description: >-
  Contract for the unified web UI's live level-of-detail graph. Authenticates the session to a
  Principal through the single auth authority, then serves either the landscape tier (reshaped from
  the already-scoped landscape orchestrator) or the project tier (one authorized project's spec
  tree, level-filtered, with validator issues overlaid).
component: web_graph_orchestrator
methods:
  - name: getGraph
    description: >-
      Resolve the session to a Principal (rejecting an expired/absent session as unauthenticated).
      For tier 'landscape', delegate to the landscape orchestrator's already permission-filtered
      generation (presenting the session id as the credential per the auth bridge) and reshape the
      LandscapeGraphModel into a level-of-detail WebGraphModel: the WHOLE environment as a
      collapsible containment hierarchy (organization units nested org→dept→team, then their hosted
      projects), filtered to the caller's project:read visible scopes with ancestor-breadcrumb units
      carried through as read-only context (actionable=false) so a single deep-authorized project
      stays reachable without leaking its siblings. For tier 'project', resolve and bind the
      requested project's isolated root within the principal's authorized set through the project
      registry (rejecting cross-project access), project its spec tree at the requested level via
      the host core adapter, overlay validator issues as per-node issue counts, and return it. An
      unknown tier is rejected.
    signature: 'getGraph(sessionId: string, tier: string, projectId: string, level: number): WebGraphModel'
    returns: WebGraphModel
    params:
      - name: sessionId
        type: string
      - name: tier
        type: string
      - name: projectId
        type: string
        optional: true
      - name: level
        type: number
  - name: getProjectCanvas
    description: >-
      Render the interactive architecture canvas (the full renderCanvasHtml canvas — Cytoscape
      layout, edge routing, type-ERD and database views, search, and the resizable details sidebar)
      for ONE authorized project as a self-contained HTML string. Resolve the session to a
      Principal, resolve and bind the requested project's isolated root within the principal's
      authorized set (cross-project access is Forbidden), and render the canvas over the bound spec
      tree via the host core adapter. This is how the web UI reuses the SAME canvas engine as the
      static `wairon diagram --format canvas` export instead of a second renderer.
    signature: 'getProjectCanvas(sessionId: string, projectId: string): string'
    returns: string
    params:
      - name: sessionId
        type: string
      - name: projectId
        type: string
status: complete
