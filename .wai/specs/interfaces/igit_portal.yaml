id: igit_portal
name: Git Portal Interface
description: Inbound contract for the git-backing subsystem.
component: git_portal
methods:
  - name: enable
    description: >-
      Clone the remote into the bound project and set up the isolated working branch; persist the
      config.
    signature: 'enable(remote: string, branch: string): void'
    returns: void
  - name: disable
    description: Clear the project's git-backing config.
    signature: 'disable(): void'
    returns: void
  - name: sync
    description: Fetch and integrate the default branch into the working branch; no-op when not git-backed.
    signature: 'sync(): void'
    returns: void
  - name: publish
    description: >-
      Commit ONLY the scoped subpath of the working tree (default .wai/ — never the whole tree),
      push the working branch, and return the pushed commit + compare URL; no-op (published=false)
      when not git-backed or the scoped path is clean.
    signature: 'publish(message: string, subpath: string): GitPublish'
    returns: GitPublish
    params:
      - name: message
        type: string
      - name: subpath
        type: string
        optional: true
  - name: status
    description: >-
      The bound project's git-backing status (remote/branch, periodic-sync setting, scoped
      dirtiness); enabled:false when not git-backed.
    signature: 'status(): GitBackingStatus'
    returns: GitBackingStatus
    params: []
  - name: configureSync
    description: Persist the project's periodic-sync setting (interval + skip-if-clean).
    signature: 'configureSync(periodicSyncMinutes: number, skipIfClean: boolean): void'
    returns: void
    params:
      - name: periodicSyncMinutes
        type: number
        optional: true
      - name: skipIfClean
        type: boolean
        optional: true
status: complete
