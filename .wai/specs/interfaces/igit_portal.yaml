id: igit_portal
name: Git Portal Interface
description: Inbound contract for the git-backing subsystem.
component: git_portal
methods:
  - name: enable
    description: >-
      Clone the remote into the bound project and set up the isolated working branch; persist the
      config. The clone authenticates with the token the caller resolved and hands in (null for a
      public remote): this subsystem never asks anyone for a secret by name. credentialRef only
      records which of the caller's secrets the connection uses, for its status.
    signature: 'enable(remote: string, branch: string, token: string?, credentialRef?: string): void'
    returns: void
    params:
      - name: remote
        type: string
      - name: branch
        type: string
      - name: token
        type: string?
        description: The resolved credential the clone presents; null for a public remote
      - name: credentialRef
        type: string
        description: >-
          The name of the caller's secret the connection uses, recorded for its status; never
          resolved here
        optional: true
  - name: disable
    description: Clear the project's git-backing config.
    signature: 'disable(): void'
    returns: void
  - name: sync
    description: Fetch and integrate the default branch into the working branch; no-op when not git-backed.
    signature: 'sync(): void'
    returns: void
  - name: publish
    description: >-
      Commit ONLY the scoped pathspecs of the working tree (default ['.wai/'] — never the whole
      tree) in one commit, push the working branch, and return the pushed commit + compare URL;
      no-op (published=false) when not git-backed or every scoped path is clean.
    signature: 'publish(message: string, subpaths?: list<string>): GitPublish'
    returns: GitPublish
    params:
      - name: message
        type: string
      - name: subpaths
        type: list<string>
        optional: true
  - name: status
    description: >-
      The bound project's git-backing status (remote/branch, periodic-sync setting, scoped
      dirtiness); enabled:false when not git-backed.
    signature: 'status(): GitBackingStatus'
    returns: GitBackingStatus
    params: []
  - name: configureSync
    description: Persist the project's periodic-sync setting (interval + skip-if-clean).
    signature: 'configureSync(periodicSyncMinutes?: int, skipIfClean?: bool): void'
    returns: void
    params:
      - name: periodicSyncMinutes
        type: int
        optional: true
      - name: skipIfClean
        type: bool
        optional: true
status: complete
