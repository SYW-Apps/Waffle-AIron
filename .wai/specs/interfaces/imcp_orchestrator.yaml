id: imcp_orchestrator
name: MCP Orchestrator Interface
description: >-
  Workflow contract for the sdd_* tools: each method owns one authoring/validation workflow behind
  the portal.
component: mcp_orchestrator
methods:
  - name: initializeSystem
    description: >-
      Persist the L0 system specification and answer with the receipt for it: which spec was written
      and whether one already held that id.
    signature: 'initializeSystem(spec: SystemSpec): SpecWriteReceipt'
    returns: SpecWriteReceipt
  - name: addSubsystem
    description: >-
      Persist an L1 subsystem specification and answer with the receipt for it: which spec was
      written, at what status, whether one already held that id, and the child project directory a
      chained subsystem scaffolded.
    signature: 'addSubsystem(spec: SubsystemSpec): SpecWriteReceipt'
    returns: SpecWriteReceipt
  - name: addComponent
    description: >-
      Verify the parent subsystem exists, then persist an L2 component specification and answer with
      the receipt for it: which spec was written, at what status, and whether one already held that
      id.
    signature: 'addComponent(spec: ComponentSpec): SpecWriteReceipt'
    returns: SpecWriteReceipt
  - name: defineInterface
    description: >-
      Verify the owning component exists, then persist an L3 interface specification and answer with
      the receipt for it: which spec was written, at what status, and whether one already held that
      id.
    signature: 'defineInterface(spec: InterfaceSpec): SpecWriteReceipt'
    returns: SpecWriteReceipt
  - name: writeNarrative
    description: >-
      Verify the contract interface exists, then persist an L4 implementation specification and
      answer with the receipt for it: which spec was written, at what status, and whether one
      already held that id.
    signature: 'writeNarrative(spec: ImplementationSpec): SpecWriteReceipt'
    returns: SpecWriteReceipt
  - name: validateTree
    description: Run the architecture-conformance gate and return the result
    signature: 'validateTree(): ValidationResult'
    returns: ValidationResult
  - name: getStatus
    description: >-
      Compose the spec-tree completeness dashboard, opened by the project's family context: the
      mount this root is known by in its parent and the parent project's name (only within the
      request's reach), and the chained subprojects this root mounts with their paths.
    signature: 'getStatus(): string'
    returns: string
  - name: moveSubsystemProject
    description: >-
      Relocate an external subsystem: verify it exists, then move its subproject directory and
      update its projectPath link.
    signature: 'moveSubsystemProject(subsystemId: string, newProjectPath: string): void'
    returns: void
  - name: externalizeSubsystem
    description: Verify the subsystem exists and is internal, then externalize it into a standalone subproject.
    signature: 'externalizeSubsystem(subsystemId: string, projectPath: string): void'
    returns: void
  - name: internalizeSubsystem
    description: Verify the subsystem exists and is external, then internalize it back into the parent tree.
    signature: 'internalizeSubsystem(subsystemId: string): void'
    returns: void
  - name: listResources
    description: >-
      List the MCP resources the server publishes: the built-in SDD skills plus one live
      wairon-agent:// brief resource per agent in the CURRENT topology — recomputed per request, so
      a re-lock is visible on the next list.
    signature: 'listResources(): SkillResourceDescriptor[]'
    returns: SkillResourceDescriptor[]
    params: []
  - name: readResource
    description: >-
      Read one published resource by id, routing on the URI scheme: a wairon-skill:// id reads the
      (pack-composed) skill markdown; a wairon-agent:// id composes that agent's live brief.
    signature: 'readResource(resourceId: string): string'
    returns: string
    params:
      - name: resourceId
        type: string
        description: The MCP resource id — a skill id or a wairon-agent:// agent id.
  - name: listExternalInterfaces
    description: >-
      The sdd_list_external_interfaces tool workflow: read the project's consumable external
      surfaces (parent family, siblings, foreign imports) with origin, provenance, and freshness
      verdicts, and shape the tool response.
    signature: 'listExternalInterfaces(): ExternalSurfaceEntry[]'
    returns: ExternalSurfaceEntry[]
  - name: getAgentBrief
    description: >-
      The sdd_get_agent_brief tool workflow: compose the live delegation brief for one resolved
      agent via the core client adapter and shape the tool response — the always-fresh replacement
      for generated per-component agent files.
    signature: 'getAgentBrief(agentId: string): AgentBrief'
    returns: AgentBrief
    params:
      - name: agentId
        type: string
        description: The resolved agent id to brief.
  - name: renameComponent
    description: >-
      Resolve the namespaced component id against the bound tree, then rename it through the core
      adapter
    signature: 'renameComponent(id: string, newId: string): ComponentRename'
    returns: ComponentRename
    params:
      - name: id
        type: string
        description: The component to rename (namespaced if needed)
      - name: newId
        type: string
        description: Its new id
  - name: renameMethod
    description: >-
      Resolve the namespaced component id against the bound tree, then rename its contract method
      through the core adapter
    signature: 'renameMethod(id: string, method: string, newName: string, pinSymbol?: boolean): MethodRename'
    returns: MethodRename
    params:
      - name: id
        type: string
        description: The component whose method is renamed (namespaced if needed)
      - name: method
        type: string
        description: The method name as it stands
      - name: newName
        type: string
        description: Its new name, a camel-case identifier
      - name: pinSymbol
        type: boolean
        description: >-
          Whether an implementation that declares no symbol is pinned to the old name; true when
          omitted
        optional: true
  - name: updateSpec
    description: >-
      The sdd_update_spec workflow: patch a stored spec at any level through the authoring gate, and
      answer with the change report — what changed, every path the delta named that the write did
      not act on, or that nothing changed and nothing was written. A dry run runs the whole write,
      gate included, and writes nothing.
    signature: 'updateSpec(kind: string, id: string, delta: SpecDelta, dryRun?: boolean): SpecChangeReport'
    returns: SpecChangeReport
    params:
      - name: kind
        type: string
        description: 'The spec kind to patch: system, subsystem, component, interface, implementation or type'
      - name: id
        type: string
        description: The stored spec's id, namespaced if needed
      - name: delta
        type: SpecDelta
        description: The partial change to merge, carrying the delta's own verbs
      - name: dryRun
        type: boolean
        description: >-
          Ask what the delta would do instead of doing it; the report comes back marked dryRun with
          written false
        optional: true
  - name: setEndpoints
    description: >-
      The sdd_set_endpoints workflow: verify the L3 contract exists, build one wire endpoint per
      named method from that transport's own address fields and check it against the endpoint
      schema, then persist the contract with the bindings attached. A method the contract does not
      declare, or an endpoint the schema rejects, refuses the whole write before anything is saved.
    signature: 'setEndpoints(interfaceId: string, endpoints: EndpointBinding[]): string'
    returns: string
    params:
      - name: interfaceId
        type: string
        description: The L3 contract to bind, as the tool's interface argument names it
      - name: endpoints
        type: EndpointBinding[]
        description: >-
          One binding per method: the method name, the transport, and that transport's address
          fields
  - name: setPublicInterfaces
    description: >-
      The sdd_set_public_interfaces workflow: verify the subsystem exists, then REPLACE its
      published surface with the list given — each entry bound to the component, and optionally the
      contract, that realizes it — and restamp updatedAt. A replacement, not a merge: an entry left
      out is gone.
    signature: 'setPublicInterfaces(subsystemId: string, publicInterfaces: PublicInterface[]): string'
    returns: string
    params:
      - name: subsystemId
        type: string
        description: The L1 subsystem whose published surface is replaced
      - name: publicInterfaces
        type: PublicInterface[]
        description: >-
          The full replacement list: type, details, and the realizing component and optional
          interface
  - name: setSubsystemProjectPath
    description: >-
      The sdd_set_subsystem_project_path workflow: verify the subsystem exists, then set — or, when
      no path is given, clear — its projectPath chaining link and restamp updatedAt. It rewrites the
      link only; the subproject directory itself is relocated by moveSubsystemProject.
    signature: 'setSubsystemProjectPath(subsystemId: string, projectPath?: string): string'
    returns: string
    params:
      - name: subsystemId
        type: string
        description: The L1 subsystem whose chaining link is rewritten
      - name: projectPath
        type: string
        description: Relative path to the external project root; omitted clears the link
        optional: true
  - name: getSpec
    description: >-
      The sdd_get_spec workflow: read one stored spec by kind and id through the core client
      adapter, optionally narrowed to named methods, and answer with the stored spec plus the
      derived markers a read may attach. A methods filter that names something the spec does not
      declare returns nothing and says what it does declare, so a misspelling never reads as a
      method with no content; a narrowed answer carries the partial-result marker, because the write
      tools REPLACE a method list and re-authoring from a partial read would delete every method
      left out.
    signature: 'getSpec(kind: string, id: string, methods?: string[]): SpecReadResult'
    returns: SpecReadResult
    params:
      - name: kind
        type: string
        description: 'The kind of spec to read: system, subsystem, component, interface, implementation or type'
      - name: id
        type: string
        description: The id to read it by; the L0 system spec is a singleton
      - name: methods
        type: string[]
        description: >-
          Read only these methods by name; every other field comes back unchanged. Only a contract,
          an implementation and a type declare methods
        optional: true
  - name: addType
    description: >-
      The sdd_add_type workflow: define an entity or value-object through the core client adapter
      and answer with the receipt for it. A define is an UPSERT, so re-defining an id REPLACES its
      fields, methods and invariants and restates its code claim — the notices name what was carried
      forward, what a dropped member removed and what an omission cleared. A type carries no
      lifecycle status, so the receipt states none.
    signature: 'addType(spec: TypeSpec): SpecWriteReceipt'
    returns: SpecWriteReceipt
    params:
      - name: spec
        type: TypeSpec
        description: The type as the tool's arguments describe it
  - name: moveMethods
    description: >-
      The sdd_move_methods workflow: verify both components exist, then hand the move to the
      authoring gate, which judges it as a whole and writes all of it or none of it. The
      verification is here rather than in the gate because a mistyped component id should read as a
      mistyped id, not as a rule refusing the design.
    signature: 'moveMethods(from: string, to: string, methods: string[], dryRun?: boolean): MethodMoveReport'
    returns: MethodMoveReport
    params:
      - name: from
        type: string
        description: The component id the methods currently belong to
      - name: to
        type: string
        description: The component id that should receive them
      - name: methods
        type: string[]
        description: The method names to move
      - name: dryRun
        type: boolean
        description: Answer with what the move would do and write nothing
        optional: true
  - name: deleteSpec
    description: >-
      The sdd_delete_spec workflow: choose the delete for the named kind and answer whether a
      document was actually removed. A spec that was not there answers false rather than throwing,
      so a repeated delete is not an error — but the caller is told which of the two happened,
      because "deleted" and "was never there" are different answers to the same request.
    signature: 'deleteSpec(kind: string, id: string): boolean'
    returns: boolean
    params:
      - name: kind
        type: string
        description: subsystem, component, interface, implementation or type
      - name: id
        type: string
        description: The spec's id (namespaced if needed)
  - name: getProjectConfig
    description: >-
      The getProjectConfig workflow: answer with the bound project's resolved configuration, or null
      when it has none. Null is an answer, not a failure — an unconfigured project and a
      default-configured one are different states and the caller is entitled to tell them apart.
    signature: 'getProjectConfig(): ProjectConfig | null'
    returns: ProjectConfig | null
    params: []
status: complete
