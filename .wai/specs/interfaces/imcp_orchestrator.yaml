id: imcp_orchestrator
name: MCP Orchestrator Interface
description: >-
  Workflow contract for the sdd_* tools: each method owns one authoring/validation workflow behind
  the portal.
component: mcp_orchestrator
methods:
  - name: initializeSystem
    description: Persist the L0 system specification
    signature: 'initializeSystem(spec: SystemSpec): void'
    returns: void
  - name: addSubsystem
    description: Persist an L1 subsystem specification
    signature: 'addSubsystem(spec: SubsystemSpec): void'
    returns: void
  - name: addComponent
    description: Verify the parent subsystem exists, then persist an L2 component specification
    signature: 'addComponent(spec: ComponentSpec): void'
    returns: void
  - name: defineInterface
    description: Verify the owning component exists, then persist an L3 interface specification
    signature: 'defineInterface(spec: InterfaceSpec): void'
    returns: void
  - name: writeNarrative
    description: Verify the contract interface exists, then persist an L4 implementation specification
    signature: 'writeNarrative(spec: ImplementationSpec): void'
    returns: void
  - name: validateTree
    description: Run the architecture-conformance gate and return the result
    signature: 'validateTree(): ValidationResult'
    returns: ValidationResult
  - name: getStatus
    description: Compose the spec-tree completeness dashboard
    signature: 'getStatus(): string'
    returns: string
  - name: moveSubsystemProject
    description: >-
      Relocate an external subsystem: verify it exists, then move its subproject directory and
      update its projectPath link.
    signature: 'moveSubsystemProject(subsystemId: string, newProjectPath: string): void'
    returns: void
  - name: externalizeSubsystem
    description: Verify the subsystem exists and is internal, then externalize it into a standalone subproject.
    signature: 'externalizeSubsystem(subsystemId: string, projectPath: string): void'
    returns: void
  - name: internalizeSubsystem
    description: Verify the subsystem exists and is external, then internalize it back into the parent tree.
    signature: 'internalizeSubsystem(subsystemId: string): void'
    returns: void
  - name: listResources
    description: >-
      List the MCP resources the server publishes: the built-in SDD skills plus one live
      wairon-agent:// brief resource per agent in the CURRENT topology — recomputed per request, so
      a re-lock is visible on the next list.
    signature: 'listResources(): SkillResourceDescriptor[]'
    returns: SkillResourceDescriptor[]
    params: []
  - name: readResource
    description: >-
      Read one published resource by id, routing on the URI scheme: a wairon-skill:// id reads the
      (pack-composed) skill markdown; a wairon-agent:// id composes that agent's live brief.
    signature: 'readResource(resourceId: string): string'
    returns: string
    params:
      - name: resourceId
        type: string
        description: The MCP resource id — a skill id or a wairon-agent:// agent id.
  - name: listExternalInterfaces
    description: >-
      The sdd_list_external_interfaces tool workflow: read the project's consumable external
      surfaces (parent family, siblings, foreign imports) with origin, provenance, and freshness
      verdicts, and shape the tool response.
    signature: 'listExternalInterfaces(): ExternalSurfaceEntry[]'
    returns: ExternalSurfaceEntry[]
  - name: getAgentBrief
    description: >-
      The sdd_get_agent_brief tool workflow: compose the live delegation brief for one resolved
      agent via the core client adapter and shape the tool response — the always-fresh replacement
      for generated per-component agent files.
    signature: 'getAgentBrief(agentId: string): AgentBrief'
    returns: AgentBrief
    params:
      - name: agentId
        type: string
        description: The resolved agent id to brief.
status: complete
createdAt: '2026-07-02T00:00:00Z'
updatedAt: '2026-08-08T11:12:49.479Z'
