schemaVersion: "1.0.0"
id: "imcp_orchestrator"
name: "MCP Orchestrator Interface"
description: "Workflow contract for the sdd_* tools: each method owns one authoring/validation workflow behind the portal."
component: "mcp_orchestrator"
methods:
  - name: "initializeSystem"
    description: "Persist the L0 system specification"
    signature: "initializeSystem(spec: SystemSpec): void"
    returns: "void"
  - name: "addSubsystem"
    description: "Persist an L1 subsystem specification"
    signature: "addSubsystem(spec: SubsystemSpec): void"
    returns: "void"
  - name: "addComponent"
    description: "Verify the parent subsystem exists, then persist an L2 component specification"
    signature: "addComponent(spec: ComponentSpec): void"
    returns: "void"
  - name: "defineInterface"
    description: "Verify the owning component exists, then persist an L3 interface specification"
    signature: "defineInterface(spec: InterfaceSpec): void"
    returns: "void"
  - name: "writeNarrative"
    description: "Verify the contract interface exists, then persist an L4 implementation specification"
    signature: "writeNarrative(spec: ImplementationSpec): void"
    returns: "void"
  - name: "validateTree"
    description: "Run the architecture-conformance gate and return the result"
    signature: "validateTree(): ValidationResult"
    returns: "ValidationResult"
  - name: "getStatus"
    description: "Compose the spec-tree completeness dashboard"
    signature: "getStatus(): string"
    returns: "string"
createdAt: "2026-07-02T00:00:00Z"
updatedAt: "2026-07-02T00:00:00Z"
