id: imigration_surfaces_adapter
name: Migration Surfaces Client Adapter Interface
description: >-
  One forward per sdd_surfaces published method the family migrations use, against the bound project
  root.
component: migration_surfaces_adapter
methods:
  - name: pinExternals
    description: >-
      Forward to surface_portal.pinExternals: pin the named externals of the bound project. A
      migration names only git or hosted externals owed a pin (unpinned, or used beyond the pin); a
      path external is read live and never pinned.
    signature: 'pinExternals(aliases?: list<string>): list<ExternalPin>'
    returns: list<ExternalPin>
    params:
      - name: aliases
        type: list<string>
        description: The aliases to pin
        optional: true
  - name: renamePin
    description: >-
      Forward to pin_maintenance_portal.renamePin: carry a pin to a new alias or producer id, digest
      kept.
    signature: 'renamePin(alias: string, newAlias: string, project: string): bool'
    returns: bool
    params:
      - name: alias
        type: string
        description: The pinned alias
      - name: newAlias
        type: string
        description: The alias to keep it under
      - name: project
        type: string
        description: The producer id from now on
  - name: unpin
    description: >-
      Forward to pin_maintenance_portal.unpin: remove a pin — a git or hosted external's, or a
      leftover one of a path producer or member an earlier release took.
    signature: 'unpin(alias: string): bool'
    returns: bool
    params:
      - name: alias
        type: string
        description: The alias
  - name: listExternals
    description: Forward to surface_portal.listExternals.
    signature: 'listExternals(): list<ExternalListing>'
    returns: list<ExternalListing>
    params: []
  - name: getExternalsStatus
    description: >-
      Forward to surface_portal.getExternalsStatus: each declared external of the bound project
      compared at signature level with its live producer — what a boundary verb reads before it
      re-pins a family consumer whose producer's names only moved. Writes nothing.
    signature: 'getExternalsStatus(): list<ExternalStatus>'
    returns: list<ExternalStatus>
    params: []
  - name: listConsumers
    description: >-
      Forward to surface_portal.listConsumers: the projects that consume the bound project — the
      family in reach and a parent composing it as a `../` sibling member — each with the alias and
      section it declares it under. What a project rename reads to name the consumers outside the
      family it plans for. Read-only.
    signature: 'listConsumers(search?: list<string>): list<ExternalConsumer>'
    returns: list<ExternalConsumer>
    params:
      - name: search
        type: list<string>
        description: Folders to scan for consumers outside the family
        optional: true
status: complete
