id: iuser_index
name: User Index Interface
description: Private read-path contract for hosted users and service principals.
component: user_index
methods:
  - name: getById
    description: Return one hosted user by Wairon user id or null when absent.
    signature: 'getById(id: string): HostedUserRecord | null'
    returns: HostedUserRecord | null
    params:
      - name: id
        type: string
  - name: findByExternalSubject
    description: Return one hosted user by issuer and external subject id or null when absent.
    signature: 'findByExternalSubject(issuer: string, externalSubject: string): HostedUserRecord | null'
    returns: HostedUserRecord | null
    params:
      - name: issuer
        type: string
      - name: externalSubject
        type: string
  - name: list
    description: >-
      List hosted users, optionally narrowed by status. There is no project filter: project
      membership is a permission-grid question the identity orchestrator answers.
    signature: 'list(status: string): HostedUserRecord[]'
    returns: HostedUserRecord[]
    params:
      - name: status
        type: string
        optional: true
  - name: findByRecordOrSubjectId
    description: >-
      Resolve one hosted user by record id OR the record's subject userId — an exact record-id match
      wins; null when absent under both.
    signature: 'findByRecordOrSubjectId(id: string): HostedUserRecord | null'
    returns: HostedUserRecord | null
    params:
      - name: id
        type: string
status: complete
