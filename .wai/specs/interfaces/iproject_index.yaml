id: iproject_index
name: Project Index Interface
description: >-
  Read-face contract of the project repository: listings and the authorization-narrowed root
  resolution.
component: project_index
methods:
  - name: resolveRoot
    description: >-
      Resolve the isolated root path of the authorized project, honoring the optional selector only
      within the principal's authorized set; reject cross-project access (null — no existence leak).
      Only an active project resolves.
    signature: 'resolveRoot(principal: Principal, selector: string): string'
    returns: string
  - name: list
    description: Return all hosted-project records registered under the data root.
    signature: 'list(): HostedProjectRecord[]'
    returns: HostedProjectRecord[]
  - name: resolveBinding
    description: >-
      Resolve the FULL binding of an authorized (possibly subproject-qualified) target: the root to
      bind (the mounted chained-child root when qualified — each mount hop looked up on the current
      root's subsystem specs and containment-resolved through the host core adapter; unknown or
      non-chained mounts rejected, never silently the project root), the TOP project id (permission
      + audit anchor), and the bound mount chain. Authorization matrix: an entry covers a target iff
      equal or the target extends it with '::' — a qualified principal can never bind wider than its
      qualifier (not the top project, not a sibling); a plain-project or '*' principal may narrow
      via a qualified selector; a selector can never widen scope. resolveRoot is this binding's
      rootPath projection.
    signature: 'resolveBinding(principal: Principal, selector: string): ProjectBinding | null'
    returns: ProjectBinding | null
status: complete
