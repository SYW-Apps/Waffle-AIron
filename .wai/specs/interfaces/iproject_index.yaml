id: iproject_index
name: Project Index Interface
description: >-
  Read-face contract of the project repository: listings and the authorization-narrowed root
  resolution.
component: project_index
methods:
  - name: resolveRoot
    description: >-
      Resolve the isolated root path of the authorized project, honoring the optional selector only
      within the principal's authorized set; reject cross-project access (null — no existence leak).
      Only an active project resolves.
    signature: 'resolveRoot(principal: Principal, selector: string): string'
    returns: string
  - name: list
    description: Return all hosted-project records registered under the data root.
    signature: 'list(): HostedProjectRecord[]'
    returns: HostedProjectRecord[]
  - name: resolveBinding
    description: >-
      Resolve the FULL binding of an authorized (possibly member-qualified) target: the root to bind
      (the member root when qualified — each hop a member alias looked up on the current root's
      member declarations, `members` entries or, for one release, legacy L1 mounts, and
      containment-resolved through the host core adapter; an alias that declares no member is
      rejected, never silently the project root), the TOP project id (permission + audit anchor),
      and the bound member chain. A qualifier's segments are member aliases — the strings the legacy
      mount ids were, so every existing qualifier binds the same root it bound before stage 3; stage
      7 turns members into project records with ids of their own. Authorization matrix: an entry
      covers a target iff equal or the target extends it with '::' — a qualified principal can never
      bind wider than its qualifier (not the top project, not a sibling); a plain-project or '*'
      principal may narrow via a qualified selector; a selector can never widen scope. resolveRoot
      is this binding's rootPath projection.
    signature: 'resolveBinding(principal: Principal, selector: string): ProjectBinding | null'
    returns: ProjectBinding | null
  - name: existingRoot
    description: >-
      The root path of the hosted project registered under this id, or null when the id is malformed
      or no record holds it. Unscoped by design: an existence lookup for callers that have already
      authorized the operation it serves, never a resolution a request selector reaches.
    signature: 'existingRoot(id: string): string | null'
    returns: string | null
    params:
      - name: id
        type: string
status: complete
