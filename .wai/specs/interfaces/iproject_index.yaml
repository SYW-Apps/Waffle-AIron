id: iproject_index
name: Project Index Interface
description: >-
  Read-face contract of the project repository: listings and the authorization-narrowed root
  resolution.
component: project_index
methods:
  - name: resolveRoot
    description: >-
      Resolve the root path of the authorized hosted record, honoring the optional selector only
      within the principal's authorized set (record ids, '*', or a deprecated member qualifier
      mapped to its member's record); reject cross-project access (null — no existence leak). Only
      an active record resolves.
    signature: 'resolveRoot(principal: Principal, selector: string): string'
    returns: string
  - name: list
    description: >-
      Return all hosted-project records registered under the data root — family roots and member
      records alike, each member with its derived rootPath.
    signature: 'list(): HostedProjectRecord[]'
    returns: HostedProjectRecord[]
  - name: resolveBinding
    description: >-
      Resolve the FULL binding of an authorized target to a hosted RECORD: the bound record's id,
      its root (a member record's derived from its parent's root and memberPath through the host
      core adapter's containment guard) and its family root id. Since stage 7 a member is a record,
      named by its own id. Coverage follows the project chain, as permissions do: an entry covers a
      target iff it is '*', equal to it, or names a project the target descends from through
      parentProjectId (a token for a family root reaches its members). DEPRECATED for one release: a
      member-qualified selector or entry ('projectId::alias', one alias per hop) is first mapped to
      the member's record id by walking the aliases each root declares (project.yaml `members`, or a
      legacy L1 mount) and matching the record whose parentProjectId and memberPath name that
      directory; the binding then carries the qualifier in via. An alias that declares no member, or
      a directory no record holds, resolves to null — never the family root. A member record whose
      memberPath no longer holds a project with the record's id is null (reconcile relocates it).
      Only an active record resolves; anything else is null with no existence leak. resolveRoot is
      this binding's rootPath projection.
    signature: 'resolveBinding(principal: Principal, selector: string): ProjectBinding | null'
    returns: ProjectBinding | null
  - name: existingRoot
    description: >-
      The root path of the hosted record registered under this id — a member record's derived from
      its parent's root and memberPath — or null when the id is malformed or no record holds it.
      Unscoped by design: an existence lookup for callers that have already authorized the operation
      it serves, never a resolution a request selector reaches.
    signature: 'existingRoot(id: string): string | null'
    returns: string | null
    params:
      - name: id
        type: string
  - name: family
    description: >-
      The hosted family a record belongs to: its family root record first, then every member record
      below it, depth-first in declaration order, each with its derived root. A record with no
      members answers just its family root's family. Empty for an unknown id. Records only — it
      reads no project file.
    signature: 'family(id: string): HostedProjectRecord[]'
    returns: HostedProjectRecord[]
    params:
      - name: id
        type: string
        description: Any record of the family
  - name: declaredMembers
    description: >-
      The PROJECT members the family rooted at a record declares ON DISK and CONTAINS, members of
      members included: from the record's root, each project.yaml `members` entry with a contained
      source whose content makes it a project (stage 8: its tree declares an id, holds an L0 or
      carries a lock — every pre-stage-8 member is project-shaped, so an existing family registers
      exactly as before) and, for one release, each legacy L1 mount, followed through the
      containment guard, with the member's own project id read from its project.yaml. Each is
      answered as the record it should hold (id, parentProjectId = the declaring project's id,
      memberPath as declared), with the pre-stage-7 qualifier that bound it and the action against
      the stored records (register, relocate, rename, return — a record disabled as departed or
      retired whose project member is declared again, retire — a record whose member's content is
      now a part). Not answered (stage 8): a PART, which is part of its declaring project's record
      and never a record of its own; and a `hosted:` project member, which is its own top-level
      record, related to the declarer but not contained by it, so it gets no parentProjectId and
      inherits no access through it. Records only, read from disk; nothing written.
    signature: 'declaredMembers(id: string): PlannedMemberRecord[]'
    returns: PlannedMemberRecord[]
    params:
      - name: id
        type: string
        description: A family root record
  - name: repositoryScope
    description: >-
      Where the record commits: its family root's isolated root (the family's one git repository)
      and the pathspec of the record's own .wai/ relative to it ('.wai/' for a family root,
      '<memberPath chain>/.wai/' for a member). Null for an unknown id.
    signature: 'repositoryScope(id: string): RepositoryScope | null'
    returns: RepositoryScope | null
    params:
      - name: id
        type: string
  - name: isRetiredPart
    description: >-
      Whether a member record was retired as a part (stage 8): disabled, and its folder holding no
      project content any more (no id, no L0, no lock) — so its specs are reached, permissioned and
      written through its parent's record. Reads the record's folder; writes nothing.
    signature: 'isRetiredPart(record: HostedProjectRecord): boolean'
    returns: boolean
    params:
      - name: record
        type: HostedProjectRecord
        description: A record of the family
  - name: declaredSubsystems
    description: >-
      The subsystem ids a record's spec tree declares now, each as its local id — a part's
      subsystems included, since they are the record's own — read at the record's root through the
      host core adapter; null for an id with no root on disk. Read from disk; nothing written.
    signature: 'declaredSubsystems(id: string): string[] | null'
    returns: string[] | null
    params:
      - name: id
        type: string
        description: A hosted record id
    guarantees:
      - idempotent
status: complete
