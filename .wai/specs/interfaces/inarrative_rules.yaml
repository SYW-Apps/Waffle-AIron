id: inarrative_rules
name: Narrative Rules Interface
description: >-
  One method per rule, named after it, in run order. Each takes the run's RuleContext, reports
  through its addIssue, and declares the codes it reports as findings. These rules judge whether
  contracts and narratives agree and are sound.
component: narrative_rules
methods:
  - name: contractSymmetry
    description: >-
      Rule contract-symmetry. Implementations mirror their contract method-for-method: every method
      an implementation declares is defined on the contract it realizes, and every contract method
      has an implementation.
    signature: 'contractSymmetry(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: UNEXPECTED_IMPLEMENTATION_METHOD
        severity: error
        summary: Implementation method not present on the contract
      - code: MISSING_IMPLEMENTATION_METHOD
        severity: error
        summary: Contract method missing from the implementation
  - name: narrativeTargetReferences
    description: >-
      Rule narrative-target-references. A narrative call, dispatch or register step must name a
      target component, and a target method unless it dispatches. A target this tree contains must
      be a collaborator the calling component declares, must carry the named method on one of its
      interfaces, and that method must declare every semantic guarantee the step asserts.
    signature: 'narrativeTargetReferences(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: MISSING_TARGET_COMPONENT
        severity: error
        summary: Call/register step missing targetComponent
      - code: MISSING_TARGET_METHOD
        severity: error
        summary: Call/register step missing targetMethod
      - code: UNDECLARED_DEPENDENCY_CALL
        severity: error
        summary: Call step targets a component the caller does not depend on or own
      - code: INVALID_TARGET_METHOD_REFERENCE
        severity: error
        summary: Call step targets a method not on any target interface
      - code: NARRATIVE_SEMANTIC_UNBACKED
        severity: warning
        summary: Narrative asserts a guarantee the called contract does not declare
  - name: crossTreeReferences
    description: >-
      Rule cross-tree-references. A narrative call, dispatch or register target that is not a
      component of this tree must resolve against the stored surface snapshots to exactly one
      declared contract. Snapshots that expose the name with disagreeing contracts leave the
      reference ambiguous; no snapshot at all is a warning for a reference that points outside this
      loading root (only the parent project can verify it) and the error a genuine local typo has
      always got.
    signature: 'crossTreeReferences(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: INVALID_TARGET_COMPONENT_REFERENCE
        severity: error
        summary: Call/register step targets a non-existent component
      - code: CROSS_TREE_REF_UNRESOLVED
        severity: warning
        summary: >-
          Cross-tree reference (super::/:: form) with no surface snapshot covering it — only the
          parent project can verify it
      - code: SURFACE_REF_AMBIGUOUS
        severity: error
        summary: >-
          Cross-tree call/dispatch/register target matched by surface snapshots of several providers
          with different contracts
  - name: surfaceReferenceBacking
    description: >-
      Rule surface-reference-backing. The surface snapshot a cross-tree narrative target resolves to
      must back what the step asks of it: the calling component declares the collaborator, the
      snapshot exposes the called method (or serves the dispatched capability), and it declares
      every semantic guarantee the step asserts. A snapshot is the provider's declared contract, so
      these are contract verdicts rather than resolution failures.
    signature: 'surfaceReferenceBacking(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: SURFACE_REF_NOT_EXPOSED
        severity: error
        summary: >-
          Cross-tree reference resolves to a surface snapshot that does not expose the called
          method/capability
      - code: UNDECLARED_DEPENDENCY_CALL
        severity: error
        summary: Call step targets a component the caller does not depend on or own
      - code: NARRATIVE_SEMANTIC_UNBACKED
        severity: warning
        summary: Narrative asserts a guarantee the called contract does not declare
  - name: guaranteeTokens
    description: >-
      Rule guarantee-tokens. Every semantic-guarantee token an L3 method declares or a narrative
      step asserts must be a builtin guarantee or one a loaded extension pack declares in its
      `guarantees` list. The vocabulary is open for packs, not for typos — an undeclared token is
      matched by nothing and silently escapes the narrative↔contract consistency checks.
    signature: 'guaranteeTokens(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: UNKNOWN_GUARANTEE
        severity: warning
        summary: Guarantee token is neither builtin nor pack-declared
  - name: narrativeStepConfig
    description: >-
      Rule narrative-step-config. The step configuration of L5 narratives: every flow step (branch,
      switch, loop, try, parallel, jump) carries the config its type requires and no simple step
      carries flow config, "detach" (fire-and-forget) is legal on call/dispatch steps only, no step
      carries a field foreign to its type, a parallel body is covered by contiguous, ordered arms
      (>= 2), no two steps share a step number or a label, and every jump field targets an existing
      step number in the same narrative.
    signature: 'narrativeStepConfig(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: MALFORMED_FLOW_STEP
        severity: error
        summary: Flow step missing required config (or flow config on a local/call step)
      - code: INVALID_STEP_JUMP
        severity: error
        summary: Jump field targets a step number that does not exist in the narrative
      - code: DUPLICATE_STEP_LABEL
        severity: error
        summary: Two steps in one narrative share a label — the symbolic anchor later deltas address by
      - code: FOREIGN_STEP_FIELD
        severity: warning
        summary: Step carries a field its own type cannot have — a leftover of an edit, meaning nothing
  - name: narrativeReachability
    description: >-
      Rule narrative-reachability. Every step of an L5 narrative must be reachable from the first
      step following fall-through and jumps, and the loop/try/parallel regions it declares must nest
      or stay disjoint — interleaved regions map onto no structured code. Judged over the step
      graph, and only for a narrative whose step configuration is sound (narrative-step-config
      reports the rest).
    signature: 'narrativeReachability(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: UNREACHABLE_STEP
        severity: warning
        summary: Step not reachable from the first step following fall-through and jumps
      - code: REGION_OVERLAP
        severity: error
        summary: loop/try regions interleave — regions must nest or be disjoint to map onto structured code
  - name: narrativeJumpEdges
    description: >-
      Rule narrative-jump-edges. Where an L5 narrative's jump edges land: a loop/try/parallel region
      is entered through its header, never into the middle of its body; a backward jump is only
      idiomatic as a continue to an enclosing loop header, and otherwise models repetition that
      belongs in a loop step; and a try body must not fall through into its own catch/finally region
      on the success path. Judged only for a narrative whose step configuration is sound
      (narrative-step-config reports the rest).
    signature: 'narrativeJumpEdges(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: JUMP_INTO_REGION
        severity: warning
        summary: >-
          Jump lands in the middle of a loop/try body from outside — regions are entered through
          their header
      - code: BACKWARD_JUMP
        severity: warning
        summary: >-
          Backward jump that is not a continue to an enclosing loop header — model repetition with a
          loop step
      - code: FALLTHROUGH_INTO_HANDLER
        severity: warning
        summary: try body falls through into its own catch/finally region on the success path
  - name: meaninglessBranches
    description: >-
      Rule meaningless-branches. A branch or switch whose arms all target the same step decides
      nothing: the condition is evaluated and flow continues at one place whatever it answers. A
      decision's targets are its explicit ones plus, where it leaves its fall-through field unset,
      the steps the step graph continues it at — so the classic authoring slip of pointing both arms
      at the next step is caught. Structure-only — a warning, lint.allow-suppressible.
    signature: 'meaninglessBranches(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: MEANINGLESS_BRANCH
        severity: warning
        summary: Branch/switch whose arms all target the same step — the decision changes nothing
  - name: inescapableCycles
    description: >-
      Rule inescapable-cycles. A cycle in a narrative's step graph with no exit edge and no return
      or throw member never terminates, by construction: every path that enters it stays inside it
      forever. Read over the step graph closed by a completion step, so falling off the end of the
      narrative counts as leaving. Structure-only — prose conditions are never judged — and reported
      as a warning, lint.allow-suppressible.
    signature: 'inescapableCycles(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: INESCAPABLE_CYCLE
        severity: warning
        summary: Step cycle with no exit edge and no return/throw member — never terminates by construction
  - name: unconditionalCallCycles
    description: >-
      Rule unconditional-call-cycles. A method-level call cycle across components in which every
      call edge is unavoidable on every entry-to-exit path of its narrative is unbounded recursion,
      by construction. Dispatch steps are resolved through their portal's table; register steps are
      never edges (a handoff defers the invocation to the runtime, so it cannot recurse). A cycle
      with even one guarded edge is NOT flagged, since prose conditions are never judged.
      Structure-only — a warning, lint.allow-suppressible, anchored on the member edge that sorts
      first so one allow covers the cycle.
    signature: 'unconditionalCallCycles(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: UNCONDITIONAL_CALL_CYCLE
        severity: warning
        summary: >-
          Cross-component call cycle in which every call edge is unavoidable — unbounded recursion
          by construction
  - name: narrativeDetail
    description: >-
      Rule narrative-detail. The narrative detail dial: each method resolves to full | calls-only |
      intent (method override → spec default → stereotype default). full requires a narrative;
      intent-level methods without a narrative must specify behavior as non-trivial prose (L4 intent
      or L3 description) — dialing detail down never means leaving behavior unspecified. Explicit
      declarations are held to their promise as errors; stereotype-defaulted gaps surface as
      warnings. An honest lint over declarations — it never claims the narrative or the prose is
      CORRECT.
    signature: 'narrativeDetail(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: MISSING_NARRATIVE
        severity: warning
        summary: >-
          Method resolved to detail: full but has no narrative (error when the level was declared
          explicitly)
      - code: INTENT_FLOOR
        severity: warning
        summary: >-
          Intent-level method whose intent/description prose is missing or placeholder-thin (error
          when declared explicitly)
  - name: detailSufficiency
    description: >-
      Rule detail-sufficiency. A method dialed below detail: full with no narrative may not be
      hiding behavior it owes a reader. A method whose realized function — in the method's own
      source file, else the implementation's — measures real branching (cyclomatic complexity above
      rules.complexity.maxUnnarratedComplexity, exact AST grade only) is reported
      (UNNARRATED_COMPLEXITY), and an explicit dial below a full-floor logic stereotype without a
      narrative is a visible, lint.allow-justifiable choice (DETAIL_BELOW_STEREOTYPE) — reported
      only where the measured finding did not already fire, since evidence outranks expectation.
      Both are honest lints over declarations: they never claim a narrative would be correct, only
      that the dial hides something.
    signature: 'detailSufficiency(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: UNNARRATED_COMPLEXITY
        severity: warning
        summary: >-
          Method below detail: full with no narrative whose realized function, in the method's
          source file, has real branching (cyclomatic complexity over the configured threshold,
          exact-grade analysis only)
      - code: DETAIL_BELOW_STEREOTYPE
        severity: warning
        summary: >-
          Method explicitly dialed below the full narrative floor of its logic stereotype, with no
          narrative
status: complete
