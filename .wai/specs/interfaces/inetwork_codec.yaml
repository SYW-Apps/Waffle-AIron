id: inetwork_codec
name: Network Codec Interface
description: The flow matrix encoded as neutral text, or as generated policy.
component: network_codec
methods:
  - name: encodeFlows
    description: 'The matrix as JSON, CSV or Markdown: every fact of every flow, in the matrix''s order. Pure.'
    signature: 'encodeFlows(flows: list<NetworkFlow>, format: NetworkOutputFormat): NetworkDocument'
    returns: NetworkDocument
    params:
      - name: flows
        type: list<NetworkFlow>
      - name: format
        type: NetworkOutputFormat
        description: json, csv or markdown
    guarantees:
      - idempotent
  - name: encodePolicy
    description: >-
      The matrix as generated policy in a target format (kubernetes-network-policy): one ingress
      policy per bound workload, admitting exactly its matrix sources and the bindings' outside
      blocks for an outside-entered gateway, with the port when the binding names one. A design name
      with no binding gets the placeholder label wairon.dev/workload: <name> and is listed as
      unbound. Deterministic. Pure.
    signature: >-
      encodePolicy(flows: list<NetworkFlow>, bindings: NetworkBindings, format:
      NetworkOutputFormat): NetworkDocument
    returns: NetworkDocument
    params:
      - name: flows
        type: list<NetworkFlow>
      - name: bindings
        type: NetworkBindings
      - name: format
        type: NetworkOutputFormat
        description: 'A policy target: kubernetes-network-policy'
    guarantees:
      - idempotent
status: complete
createdAt: '2026-10-06T13:10:53.369Z'
updatedAt: '2026-10-06T13:10:53.994Z'
