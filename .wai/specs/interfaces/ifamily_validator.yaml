id: ifamily_validator
name: Family Validator Interface
description: >-
  The family run: every selected project's own gate verbatim, the composition of each project's
  externals against their live producers, and the family checks over the root's graph. One judge per
  edge: a family run never judges an owner's edge differently from the owner's own gate, it only
  adds findings that need two projects on disk.
component: family_validator
methods:
  - name: run
    description: >-
      Validate the bound project's family: the bound root and its members (all levels, or as many as
      a numeric `recursive` bounds), each by its own gate under its own configuration and prefixed
      with its project key, verbatim; then the composition findings of each project's externals;
      then the family checks; then the governance checks (checkPolicies). A plain run narrows the
      request's reach to the bound root before any read, so an external whose producer lies above
      the family is not composed and is counted in a one-line hint instead; with `family` set the
      reach stays the request's (locally an explicit walk up, hosted the credential's), never
      widened. A requirement placed by a project above the bound root is not in the selection and is
      not judged: governance, like composition, sees only what the run reaches. The result is valid
      when no project's gate and no family or governance finding holds an error, and lists each
      project's totals.
    signature: 'run(options: ValidationOptions): ValidationResult'
    returns: ValidationResult
    params:
      - name: options
        type: ValidationOptions
        description: >-
          The run's switches: family (walk up explicitly), recursive (a number bounds the member
          depth), scopeSubsystem (a member key narrows the run to that member), treatAllAsComplete
          and pre-loaded packs, passed to every project's own gate
  - name: compose
    description: >-
      With one project's root bound: compare each of its externals as its lock records it with the
      producer's live export table (decision 19, signature-level superset, canonical digests). The
      uses compared are every public name the project's references land on — `alias::name`
      references and bare names bound through its `use` imports alike — so a type used only bare is
      covered. A used method or type that changed or vanished is EXTERNAL_INCOMPATIBLE (error); a
      producer whose canonical contract changed while nothing used changed is EXTERNAL_DRIFTED
      (notice; prose never drifts); a use that cannot be compared — unpinned, used but not in the
      lock, an unreachable producer — is EXTERNAL_CHECK_UNAVAILABLE (warning), never a pass. An
      external whose producer is out of reach is not composed; it is returned as not selected,
      beside the findings, for the run's hint. Each finding's severity is the project's own
      rules.sddRuleSeverity override, else the code's default: the verdict on a project's edge is
      tuned by that project, as its gate is.
    signature: 'compose(project: string): ExternalComposition'
    returns: ExternalComposition
    params:
      - name: project
        type: string
        description: >-
          The key of the project whose externals are composed ('' for the family root), stamped on
          each finding
    findings:
      - code: EXTERNAL_INCOMPATIBLE
        severity: error
        summary: >-
          A method or type a project uses from an external changed or vanished in the producer's
          live export table
      - code: EXTERNAL_DRIFTED
        severity: notice
        summary: An external's producer changed since it was pinned, but nothing the project uses changed
      - code: EXTERNAL_CHECK_UNAVAILABLE
        severity: warning
        summary: >-
          A use of an external could not be compared with its producer: unpinned, not in the lock,
          or the producer unreachable
  - name: checkMembers
    description: >-
      The family checks over the root's graph. A declared member with no project on disk is
      MEMBER_NOT_FOUND (error: the family cannot be composed; the owner's gate reports its own
      references into it as unavailable). Two members resolving to one project id are
      PROJECT_ID_COLLISION (error, pointing at consumption: one member, several consumers). A member
      that declares no id is PROJECT_ID_DEFAULTED (notice), naming its alias as the id to declare; a
      member with no usable id is PROJECT_ID_AMBIGUOUS (warning) — the family half of project
      identity, moved here from the project-identity rule, which judges only the bound project's own
      id. Projects of the selection that depend on each other in a loop are PROJECT_DEPENDENCY_CYCLE
      (warning until stage 5), reported once per loop on each project in it with the references that
      close each edge. A present member with no lock is MEMBER_UNAPPROVED, and one whose lock no
      longer matches its own gate identity is MEMBER_DRIFTED (warnings, decision #11: `--ci` at the
      parent fails until the member is locked or its severity is lowered; a parent lock that refuses
      is stage 5). Each finding's severity is the root's rules.sddRuleSeverity override, else the
      default.
    signature: 'checkMembers(family: ProjectFamily): ValidationIssue[]'
    returns: ValidationIssue[]
    params:
      - name: family
        type: ProjectFamily
        description: >-
          The family root's project graph: the selected projects, their directories, the
          cross-project references and the identity and membership problems
    findings:
      - code: MEMBER_NOT_FOUND
        severity: error
        summary: A member the project declares has no project on disk at its path
      - code: PROJECT_ID_COLLISION
        severity: error
        summary: Two members of one family resolve to one project id
      - code: PROJECT_DEPENDENCY_CYCLE
        severity: warning
        summary: Projects of the family depend on each other in a loop
      - code: MEMBER_UNAPPROVED
        severity: warning
        summary: A member of the family has never been locked
      - code: MEMBER_DRIFTED
        severity: warning
        summary: 'A member''s lock no longer matches its own gate identity: it changed since it was approved'
      - code: PROJECT_ID_DEFAULTED
        severity: notice
        summary: A member declares no id; it answers to one derived from its display name
      - code: PROJECT_ID_AMBIGUOUS
        severity: warning
        summary: 'A member has no usable id: its name yields no slug, or its declared id breaks the grammar'
  - name: checkPolicies
    description: >-
      The governance checks over the root's graph (governance stage). Every selected project that
      declares `composition.requirePolicies` requires those packs of every member below it in the
      selection, at every level; the root's own requirements never apply to the root. A requirement
      whose range does not parse is POLICY_REQUIREMENT_INVALID (error) on the requiring project, and
      is not judged further. Each member's adoption of each valid requirement is judged by
      `adoption`. Each finding names the requiring project and its severity is THAT project's
      rules.sddRuleSeverity override, else the default — as the family codes are tuned. Nothing here
      reads the requirements at a member's own gate, so a member's own verdict is the same with and
      without them (member-gate-unchanged-by-requirements); and nothing here compares a pack with
      wairon's defaults, so a pack's loosening is never reported
      (pack-loosening-is-never-a-finding).
    signature: 'checkPolicies(family: ProjectFamily): ValidationIssue[]'
    returns: ValidationIssue[]
    params:
      - name: family
        type: ProjectFamily
        description: >-
          The family root's project graph: the selected projects, their directories and each
          member's parent
    findings:
      - code: POLICY_REQUIREMENT_INVALID
        severity: error
        summary: A project's composition.requirePolicies names a pack range that does not parse
  - name: adoption
    description: >-
      With one member's root bound: judge its adoption of the requirements one requiring project
      places on it. POLICY_NOT_ADOPTED (error) when the member does not select the pack (by
      selection name, or a legacy path reference whose loaded manifest carries the name); when the
      version that governs it — the loaded pack's version, else its selection's pin — is outside the
      range (a floating selection whose pack did not resolve is not judged here: the member's own
      gate already reports it); or when the requirement names a profile and the member's projectType
      is another. The message names the requirement (pack, range, profile, requiring project) and
      the member's selection. POLICY_DEVIATION (notice) for each setting the member changes against
      the adopted pack's settings (extension_pack.settings under the governing profile): a
      rules.sddRuleSeverity entry for a code the pack sets, rules.designDepth or a subsystem's
      designDepth other than the profile's, a subsystem `profile` other than the governing one, and
      a lint.allow on any of the member's specs over a code the pack sets. Each deviation names the
      setting, the pack's value and the member's. `--ci` never fails on a notice; a team raises it
      with the requiring project's sddRuleSeverity. Answered at the default severities, stamped with
      the member's key; checkPolicies applies the requiring project's overrides.
    signature: >-
      adoption(requiring: string, member: string, requirements: PackRequirement[]):
      ValidationIssue[]
    returns: ValidationIssue[]
    params:
      - name: requiring
        type: string
        description: >-
          The key of the requiring project ('' for the family root): named in each message, and the
          project whose sddRuleSeverity tunes each finding
      - name: member
        type: string
        description: The key of the bound member, stamped on each finding as its project
      - name: requirements
        type: PackRequirement[]
        description: The requiring project's valid requirements
    findings:
      - code: POLICY_NOT_ADOPTED
        severity: error
        summary: >-
          A member does not select a pack a project above it requires, selects it outside the
          required range, or is not governed by the required profile
      - code: POLICY_DEVIATION
        severity: notice
        summary: >-
          A member that adopted a required pack changes one of the pack's settings in its own
          configuration or specs
status: complete
