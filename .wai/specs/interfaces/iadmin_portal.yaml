id: iadmin_portal
name: Admin Portal Interface
description: >-
  Control-plane admin API contract: project, API-key (token), pack, producer, secret, git, lock, and
  promote workflows. Every method authenticates a bootstrap/admin (master) credential and rejects
  any non-admin principal before any effect.
component: admin_portal
methods:
  - name: createProject
    description: Provision a new isolated project placed in the REQUIRED owner unit.
    signature: 'createProject(credential: string, id: string, unitId: string): HostedProjectRecord'
    returns: HostedProjectRecord
    endpoint:
      transport: HTTP
      method: POST
      path: /admin/projects
  - name: destroyProject
    description: Tear down a hosted project and its tree.
    signature: 'destroyProject(credential: string, id: string): void'
    returns: void
    endpoint:
      transport: HTTP
      method: DELETE
      path: /admin/projects/{id}
  - name: listProjects
    description: List hosted projects.
    signature: 'listProjects(credential: string): HostedProjectRecord[]'
    returns: HostedProjectRecord[]
    endpoint:
      transport: HTTP
      method: GET
      path: /admin/projects
  - name: mintKey
    description: >-
      Mint an API key bound to a project and role; the plaintext is returned once. Instance-wide
      super-admin requests (role admin or the '*' project wildcard — either would project to a *:*
      grant) are refused by the orchestrator: the built-in admin account is the only super-admin.
    signature: 'mintKey(credential: string, project: string, role: string): string'
    returns: string
    endpoint:
      transport: HTTP
      method: POST
      path: /admin/keys
  - name: revokeKey
    description: Revoke an API key by id.
    signature: 'revokeKey(credential: string, id: string): void'
    returns: void
    endpoint:
      transport: HTTP
      method: DELETE
      path: /admin/keys/{id}
  - name: listKeys
    description: List API keys authorized for a project.
    signature: 'listKeys(credential: string, project: string): ApiKeyRecord[]'
    returns: ApiKeyRecord[]
    endpoint:
      transport: HTTP
      method: GET
      path: /admin/keys
  - name: lockProject
    description: Validate-as-complete then write a StateId-scoped lock record for the project.
    signature: 'lockProject(credential: string, project: string): LockRecord'
    returns: LockRecord
    endpoint:
      transport: HTTP
      method: POST
      path: /admin/projects/{id}/lock
  - name: promoteProject
    description: Promote a locked project after re-checking its StateId; never merges to production itself.
    signature: 'promoteProject(credential: string, project: string): PromoteResult'
    returns: PromoteResult
    endpoint:
      transport: HTTP
      method: POST
      path: /admin/projects/{id}/promote
  - name: generateDiagram
    description: Generate and return a project's diagram artifact.
    signature: 'generateDiagram(credential: string, project: string, format: string): string'
    returns: string
    endpoint:
      transport: HTTP
      method: POST
      path: /admin/projects/{id}/diagram
  - name: downloadDiagram
    description: Return a project's diagram artifact as a download.
    signature: 'downloadDiagram(credential: string, project: string, format: string): string'
    returns: string
    endpoint:
      transport: HTTP
      method: GET
      path: /admin/projects/{id}/diagram/{format}
  - name: diagramViewLink
    description: Mint a short-lived signed canvas view link.
    signature: 'diagramViewLink(credential: string, project: string): string'
    returns: string
    endpoint:
      transport: HTTP
      method: GET
      path: /admin/projects/{id}/canvas-link
  - name: enableGit
    description: Enable git backing for a project (clone the remote).
    signature: >-
      enableGit(credential: string, project: string, remote: string, branch: string):
      HostedProjectRecord
    returns: HostedProjectRecord
    endpoint:
      transport: HTTP
      method: POST
      path: /admin/projects/{id}/git
  - name: disableGit
    description: Disable git backing for a project.
    signature: 'disableGit(credential: string, project: string): void'
    returns: void
    endpoint:
      transport: HTTP
      method: DELETE
      path: /admin/projects/{id}/git
  - name: syncGit
    description: Sync a project's default branch into its working branch.
    signature: 'syncGit(credential: string, project: string): void'
    returns: void
    endpoint:
      transport: HTTP
      method: POST
      path: /admin/projects/{id}/git/sync
  - name: configureProducer
    description: Configure a producer target for a project.
    signature: >-
      configureProducer(credential: string, project: string, target: string, parentPageId: string):
      void
    returns: void
    endpoint:
      transport: HTTP
      method: POST
      path: /admin/projects/{id}/producers/{target}
  - name: produceProducer
    description: Project a project to a producer target.
    signature: 'produceProducer(credential: string, project: string, target: string): void'
    returns: void
    endpoint:
      transport: HTTP
      method: POST
      path: /admin/projects/{id}/producers/{target}/produce
  - name: removeProducer
    description: Remove a producer target.
    signature: 'removeProducer(credential: string, project: string, target: string): void'
    returns: void
    endpoint:
      transport: HTTP
      method: DELETE
      path: /admin/projects/{id}/producers/{target}
  - name: listProducers
    description: List a project's producers.
    signature: 'listProducers(credential: string, project: string): ProducerConfig[]'
    returns: ProducerConfig[]
    endpoint:
      transport: HTTP
      method: GET
      path: /admin/projects/{id}/producers
  - name: setSecret
    description: Set an integration secret at runtime.
    signature: 'setSecret(credential: string, key: string, value: string): void'
    returns: void
    endpoint:
      transport: HTTP
      method: PUT
      path: /admin/secrets/{key}
  - name: listSecrets
    description: List configured secret keys.
    signature: 'listSecrets(credential: string): string[]'
    returns: string[]
    endpoint:
      transport: HTTP
      method: GET
      path: /admin/secrets
  - name: listGlobalPacks
    description: List the server-global installed packs.
    signature: 'listGlobalPacks(credential: string): PackDescriptor[]'
    returns: PackDescriptor[]
    params:
      - name: credential
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /admin/packs
  - name: installGlobalPack
    description: Install a declarative pack server-wide (declarative-only; code packs are refused).
    signature: 'installGlobalPack(credential: string, name: string, content: string): PackDescriptor'
    returns: PackDescriptor
    params:
      - name: credential
        type: string
      - name: name
        type: string
      - name: content
        type: string
    endpoint:
      transport: HTTP
      method: PUT
      path: /admin/packs/{name}
  - name: removeGlobalPack
    description: Remove a server-global pack.
    signature: 'removeGlobalPack(credential: string, name: string): void'
    returns: void
    params:
      - name: credential
        type: string
      - name: name
        type: string
    endpoint:
      transport: HTTP
      method: DELETE
      path: /admin/packs/{name}
  - name: listProjectPacks
    description: List a project's registered packs.
    signature: 'listProjectPacks(credential: string, project: string): PackDescriptor[]'
    returns: PackDescriptor[]
    params:
      - name: credential
        type: string
      - name: project
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /admin/projects/{id}/packs
  - name: installProjectPack
    description: Install a declarative pack into a project (declarative-only; code packs are refused).
    signature: >-
      installProjectPack(credential: string, project: string, name: string, content: string):
      PackDescriptor
    returns: PackDescriptor
    params:
      - name: credential
        type: string
      - name: project
        type: string
      - name: name
        type: string
      - name: content
        type: string
    endpoint:
      transport: HTTP
      method: PUT
      path: /admin/projects/{id}/packs/{name}
  - name: removeProjectPack
    description: Remove one of a project's registered packs.
    signature: 'removeProjectPack(credential: string, project: string, name: string): void'
    returns: void
    params:
      - name: credential
        type: string
      - name: project
        type: string
      - name: name
        type: string
    endpoint:
      transport: HTTP
      method: DELETE
      path: /admin/projects/{id}/packs/{name}
  - name: listApprovals
    description: >-
      List approval requests for the human decision surface, optionally filtered by status and
      project. Human decision surface for the project-lifecycle approval exception until the admin
      UI lands.
    signature: 'listApprovals(credential: string, status: string, project: string): ApprovalRequest[]'
    returns: ApprovalRequest[]
    params:
      - name: credential
        type: string
      - name: status
        type: string
        optional: true
      - name: project
        type: string
        optional: true
    endpoint:
      transport: HTTP
      method: GET
      path: /admin/approvals
  - name: decideApproval
    description: >-
      Approve or deny a pending approval request. Human decision surface for the project-lifecycle
      approval exception until the admin UI lands.
    signature: >-
      decideApproval(credential: string, requestId: string, approved: boolean, reason: string):
      ApprovalRequest
    returns: ApprovalRequest
    params:
      - name: credential
        type: string
      - name: requestId
        type: string
      - name: approved
        type: boolean
      - name: reason
        type: string
        optional: true
    endpoint:
      transport: HTTP
      method: POST
      path: /admin/approvals/{id}/decision
  - name: executeApproval
    description: >-
      Execute an approved request's privileged action. Human decision surface for the
      project-lifecycle approval exception until the admin UI lands.
    signature: 'executeApproval(credential: string, requestId: string): string'
    returns: string
    params:
      - name: credential
        type: string
      - name: requestId
        type: string
    endpoint:
      transport: HTTP
      method: POST
      path: /admin/approvals/{id}/execute
  - name: exportProjectTree
    description: >-
      Return a project's whole spec tree as a .waitree archive download — the operator's migration
      surface, alongside the diagram download.
    signature: 'exportProjectTree(credential: string, project: string): bytes'
    returns: bytes
    params:
      - name: credential
        type: string
      - name: project
        type: string
    endpoint:
      transport: HTTP
      method: GET
      path: /admin/projects/{id}/tree
  - name: importProjectTree
    description: >-
      Replace a project's spec tree from a .waitree archive carried as base64 in the JSON body,
      backing up the previous tree. The admin plane is uniformly JSON; the raw-stream upload path is
      the web portal's /web/projects/tree/import.
    signature: >-
      importProjectTree(credential: string, project: string, archiveBase64: string,
      replaceExisting?: boolean): TreeImportResult
    returns: TreeImportResult
    params:
      - name: credential
        type: string
      - name: project
        type: string
      - name: archiveBase64
        type: string
      - name: replaceExisting
        type: boolean
        optional: true
    endpoint:
      transport: HTTP
      method: POST
      path: /admin/projects/{id}/tree
status: complete
