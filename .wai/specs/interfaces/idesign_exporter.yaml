id: idesign_exporter
name: Design Exporter Interface
description: Projects the bound project's design into the design export.
component: design_exporter
methods:
  - name: exportDesign
    description: >-
      Project the bound project's whole design, resolved, into one DesignExport: the source (project
      id, StateId, and the approval verdict the caller decided), the L0 with its resolved export
      table, the dependencies, and every subsystem, component, interface, implementation and type
      keyed, sorted and resolved. Reads only; deterministic over the tree and the verdict.
    signature: 'exportDesign(approval?: DesignApproval): DesignExport'
    returns: DesignExport
    params:
      - name: approval
        type: DesignApproval
        description: >-
          The lock-check state the caller decided against the gate identity (locked, stale,
          unlocked); omitted, the source says unjudged
        optional: true
    guarantees:
      - idempotent
  - name: dependencies
    description: >-
      The project's dependencies as the design export lists them, sorted by alias: each externals
      binding (alias, project id, role, the public names this project's references use) bound to the
      digest the externals lock pins for it (a lock that is absent or unreadable pins nothing), then
      each direct project member with the public names it publishes. A member project is a
      dependency and never inlined. Read-only; the export's other sections never depend on it.
    signature: 'dependencies(): list<design_dependency>'
    returns: list<design_dependency>
    params: []
    effect: read
status: complete
