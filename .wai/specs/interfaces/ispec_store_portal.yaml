id: ispec_store_portal
name: Spec Store Portal Interface
description: The raw, ungated spec writes of sdd_core, published only to the gated authoring seam.
component: spec_store_portal
methods:
  - name: createChainedSubsystem
    description: >-
      Write path for chained-subsystem creation (wairon subsystem add / init external-subsystem
      branch): wire the parent L1 subsystem with a projectPath and scaffold the child project at
      that path.
    signature: 'createChainedSubsystem(subsystem: SubsystemSpec, projectName: string): void'
    returns: void
  - name: updateSpec
    description: >-
      Published write: apply a partial delta to one stored spec of any level and persist the result,
      answering with exactly what changed and with every path the delta named that changed nothing.
      Refuses a spec that does not exist, a mis-selected kind on the singleton L0, and a delta key
      the level's canonical schema does not know. Compares the result with what is stored and writes
      NOTHING when they match. A dry run runs the whole write and answers with the report it would
      have produced, leaving the stored bytes untouched. The caller's hooks, when given, judge the
      merged spec at the last point before anything reaches disk — which is how the authoring seam
      gates a write from above without the store ever calling the rule engine that reads it. A
      mechanical write passes no hooks and stays ungated. Routed through the core orchestrator.
    signature: >-
      updateSpec(kind: string, id: string, delta: SpecDelta, hooks?: SpecWriteHooks, dryRun?:
      boolean): SpecChangeReport
    returns: SpecChangeReport
    params:
      - name: kind
        type: string
        description: system, subsystem, component, interface, implementation or type
      - name: id
        type: string
        description: The stored spec's id; informational for the singleton L0
      - name: delta
        type: SpecDelta
        description: The partial change to merge, shaped like the spec, carrying the delta's own verbs
      - name: hooks
        type: SpecWriteHooks
        description: >-
          The authoring caller's write-boundary judgement; a mechanical write passes none and stays
          ungated
        optional: true
      - name: dryRun
        type: boolean
        description: Report what the delta would do and write nothing
        optional: true
  - name: moveMethods
    description: >-
      Forward to core_orchestrator.moveMethods: move contract methods to another component, carrying
      their implementations and retargeting every reference to them
    signature: >-
      moveMethods(from: string, to: string, methods: string[], hooks?: SpecWriteHooks, dryRun?:
      boolean): MethodMoveReport
    returns: MethodMoveReport
    params:
      - name: from
        type: string
        description: The component id the methods currently belong to
      - name: to
        type: string
        description: The component id that should receive them
      - name: methods
        type: string[]
        description: The method names to move
      - name: hooks
        type: SpecWriteHooks
        description: The judgement to run on the resulting components at the write boundary
        optional: true
      - name: dryRun
        type: boolean
        description: Report what the move would do and write nothing
        optional: true
  - name: saveSpec
    description: >-
      Persist one spec of the named kind, answering with the store's placement notices. Ungated: the
      authoring seam judges before it calls this, and a mechanical write calls it without judgement.
      Routed through the core orchestrator.
    signature: >-
      saveSpec(kind: string, spec: SystemSpec | SubsystemSpec | ComponentSpec | InterfaceSpec |
      ImplementationSpec | TypeSpec): string[]
    returns: string[]
    params:
      - name: kind
        type: string
        description: system, subsystem, component, interface, implementation or type
      - name: spec
        type: SystemSpec | SubsystemSpec | ComponentSpec | InterfaceSpec | ImplementationSpec | TypeSpec
        description: The spec to persist, of that kind
  - name: deleteSpec
    description: >-
      Delete one spec document of the named kind. False when it was not there; the L0 cannot be
      deleted. Routed through the core orchestrator.
    signature: 'deleteSpec(kind: string, id: string): boolean'
    returns: boolean
    params:
      - name: kind
        type: string
        description: subsystem, component, interface, implementation or type
      - name: id
        type: string
        description: The spec id (namespaced if needed)
status: complete
