id: ispec_store_portal
name: Spec Store Portal Interface
description: The raw, ungated spec writes of sdd_core, published only to the gated authoring seam.
component: spec_store_portal
methods:
  - name: updateSpec
    description: >-
      Published write: apply a partial delta to one stored spec of any level and persist the result,
      answering with exactly what changed and with every path the delta named that changed nothing.
      Refuses a spec that does not exist, a mis-selected kind on the singleton L0, and a delta key
      the level's canonical schema does not know. Compares the result with what is stored and writes
      NOTHING when they match. The report also names every key the stored FILE carries that the
      level's schema does not know (strippedKeys, read from the raw document) — the write
      re-serializes through the schema and drops them, so they are named rather than silently lost;
      a dry run names them too. A dry run runs the whole write and answers with the report it would
      have produced, leaving the stored bytes untouched. The caller's hooks, when given, judge the
      merged spec at the last point before anything reaches disk — which is how the authoring seam
      gates a write from above without the store ever calling the rule engine that reads it. A
      mechanical write passes no hooks and stays ungated. Routed through the core orchestrator.
    signature: >-
      updateSpec(kind: WritableSpecKind, id: string, delta: SpecDelta, hooks?: SpecWriteHooks,
      dryRun?: bool): SpecChangeReport
    returns: SpecChangeReport
    params:
      - name: kind
        type: WritableSpecKind
        description: The kind of spec the id names
      - name: id
        type: string
        description: The stored spec's id; informational for the singleton L0
      - name: delta
        type: SpecDelta
        description: The partial change to merge, shaped like the spec, carrying the delta's own verbs
      - name: hooks
        type: SpecWriteHooks
        description: >-
          The authoring caller's write-boundary judgement; a mechanical write passes none and stays
          ungated
        optional: true
      - name: dryRun
        type: bool
        description: Report what the delta would do and write nothing
        optional: true
  - name: moveMethods
    description: >-
      Forward to core_orchestrator.moveMethods: move contract methods to another component, carrying
      their implementations and retargeting every reference to them
    signature: >-
      moveMethods(from: string, to: string, methods: list<string>, hooks?: SpecWriteHooks, dryRun?:
      bool): MethodMoveReport
    returns: MethodMoveReport
    params:
      - name: from
        type: string
        description: The component id the methods currently belong to
      - name: to
        type: string
        description: The component id that should receive them
      - name: methods
        type: list<string>
        description: The method names to move
      - name: hooks
        type: SpecWriteHooks
        description: The judgement to run on the resulting components at the write boundary
        optional: true
      - name: dryRun
        type: bool
        description: Report what the move would do and write nothing
        optional: true
  - name: saveSpec
    description: >-
      Persist one spec of the named kind, answering with the store's placement notices. Ungated: the
      authoring seam judges before it calls this, and a mechanical write calls it without judgement.
      Routed through the core orchestrator.
    signature: >-
      saveSpec(kind: WritableSpecKind, spec: SystemSpec | SubsystemSpec | ComponentSpec |
      InterfaceSpec | ImplementationSpec | TypeSpec): list<string>
    returns: list<string>
    params:
      - name: kind
        type: WritableSpecKind
        description: The kind of spec the id names
      - name: spec
        type: SystemSpec | SubsystemSpec | ComponentSpec | InterfaceSpec | ImplementationSpec | TypeSpec
        description: The spec to persist, of that kind
  - name: deleteSpec
    description: >-
      Delete one spec document of the named kind. False when it was not there; the L0 cannot be
      deleted. Routed through the core orchestrator.
    signature: 'deleteSpec(kind: WritableSpecKind, id: string): bool'
    returns: bool
    params:
      - name: kind
        type: WritableSpecKind
        description: 'The kind of spec the id names (never system: the L0 is not deleted)'
      - name: id
        type: string
        description: The spec id (namespaced if needed)
  - name: moveSpec
    description: >-
      Forward to core_orchestrator.moveSpec: move a component, a type or a type group to another
      subsystem with everything that follows it (a group also under another `parent` group)
    signature: >-
      moveSpec(kind: WritableSpecKind, id: string, subsystem?: string, dryRun?: bool, parent?:
      string): SpecMove
    returns: SpecMove
    params:
      - name: kind
        type: WritableSpecKind
        description: component or type
      - name: id
        type: string
        description: The spec to move
      - name: subsystem
        type: string
        description: The subsystem it moves to
        optional: true
      - name: dryRun
        type: bool
        description: Answer the plan and write nothing
        optional: true
      - name: parent
        type: string
        description: >-
          kind group only: the parent group the moved group goes under; omitted, top-level in the
          destination home
        optional: true
  - name: rehearsalCopy
    description: >-
      Forward to core_orchestrator.rehearsalCopy: a private copy of the bound project's tree to
      rehearse a write on
    signature: 'rehearsalCopy(): string'
    returns: string
    params: []
  - name: discardRehearsal
    description: 'Forward to core_orchestrator.discardRehearsal: remove a rehearsal copy'
    signature: 'discardRehearsal(directory: string): void'
    returns: void
    params:
      - name: directory
        type: string
        description: The copy's root
status: complete
