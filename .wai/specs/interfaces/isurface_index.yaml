id: isurface_index
name: Surface Index Interface
description: Read-path lookups over the surface store.
component: surface_index
methods:
  - name: byProject
    description: Snapshot produced by the named project, or null.
    signature: 'byProject(projectName: string): SurfaceSnapshot | null'
    returns: SurfaceSnapshot | null
    params:
      - name: projectName
        type: string
  - name: all
    description: >-
      Every snapshot held at a project root — the bound root when omitted, or a chained mount's own
      root when validation reads the surfaces that mount holds.
    signature: 'all(rootDir?: string): SurfaceSnapshot[]'
    returns: SurfaceSnapshot[]
    params:
      - name: rootDir
        type: string
        optional: true
status: complete
