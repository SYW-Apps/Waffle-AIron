id: iweb_orchestrator
name: Web Orchestrator Interface
description: >-
  Contract for the unified web UI's server-side shell: SSO sign-in (unauthenticated start/complete,
  trust anchored by the signed SSO state and the provider code exchange), browser-session lifecycle,
  the session-principal context projection, and the live graph entry point. Creating and resolving
  sessions is the auth bridge that lets the served client app reuse every existing scoped endpoint
  with the session cookie as its credential.
component: web_orchestrator
methods:
  - name: startSignIn
    description: >-
      Begin a browser SSO sign-in: resolve the enabled identity-provider configuration through the
      policy repository, generate a nonce, sign an SSO state binding providerId, nonce, and
      redirectUri via the single signing authority, build the provider authorization URL through the
      identity provider adapter, append a best-effort web.signin.start (info) audit event, and
      return the authorization URL. Unauthenticated by nature; no caller credential is required or
      accepted.
    signature: 'startSignIn(providerId: string, redirectUri: string): string'
    returns: string
    params:
      - name: providerId
        type: string
      - name: redirectUri
        type: string
  - name: completeSignIn
    description: >-
      Complete a browser SSO sign-in: verify the signed SSO state via the single signing authority
      (a tampered/expired state is rejected), resolve the bound identity-provider configuration,
      exchange the authorization code and resolve the external subject through the provider adapter,
      and read the verified id_token's groups claim through the adapter (resolveGroups — meaningful
      only after resolveSubject verified the same summary). ADMIN GROUPS: when the groups intersect
      the provider's adminGroupClaims, the hosted user is provisioned/refreshed with the enumerated
      instance-wide SSO-admin bundle {projectId '*', permissions ['user:admin', 'project:create',
      'audit:read']} — deliberately NOT *:* (which is env-reserved to the built-in admin account and
      can never appear on a user record); a later login after dropping out of the group removes the
      bundle again. Look up the hosted user by issuer + external subject, provision a first-login
      active user when absent (the bundle when in the admin group, otherwise empty grants), reject
      re-login for an existing deactivated user, then create a browser session bound to the resolved
      subject and the user's CURRENT grants — with any reserved instance-wide super-admin (*:*)
      grant filtered out, so no SSO path can ever yield a *:* session. Append a best-effort
      web.signin (security) audit event and return the new session id (which the portal sets as the
      session cookie). Unauthenticated by nature.
    signature: 'completeSignIn(state: string, code: string): string'
    returns: string
    params:
      - name: state
        type: string
      - name: code
        type: string
  - name: signOut
    description: >-
      End a browser session: remove it through the web session repository and append a best-effort
      web.signout (info) audit event.
    signature: 'signOut(sessionId: string): void'
    returns: void
    params:
      - name: sessionId
        type: string
  - name: getCurrentContext
    description: >-
      Resolve the session to a Principal via the single auth authority, then return the principal's
      subject, grants, and derived capability flags (isAdmin from an instance-wide grant,
      canWriteProjects from any write permission, and the project/unit ids named in the grants) so
      the client renders role-appropriately. Reads only; not audited.
    signature: 'getCurrentContext(sessionId: string): WebContext'
    returns: WebContext
    params:
      - name: sessionId
        type: string
  - name: getGraph
    description: >-
      Return the live level-of-detail graph for the requested tier (landscape or project) and detail
      level by delegating to the web graph orchestrator, which authenticates the session and scopes
      the result.
    signature: 'getGraph(sessionId: string, tier: string, projectId: string, level: number): WebGraphModel'
    returns: WebGraphModel
    params:
      - name: sessionId
        type: string
      - name: tier
        type: string
      - name: projectId
        type: string
        optional: true
      - name: level
        type: number
  - name: signOutEverywhere
    description: >-
      Revoke every browser session belonging to the caller's principal (sign out on all
      devices/tabs): resolve the presented session to a Principal, then remove all of that subject's
      sessions. Idempotent; audited at security level.
    signature: 'signOutEverywhere(sessionId: string): void'
    returns: void
    params:
      - name: sessionId
        type: string
  - name: startDevSession
    description: >-
      Mint (or reuse) the local-developer session for the single-project dev server and return its
      id. REFUSED unless the server is in local developer mode (cfg.devMode) — this is the only
      unauthenticated session-minting path and it exists solely for `wairon dev` (loopback, auth
      off). The session is bound to a synthetic local-developer subject with a grant on the one
      local project (never an instance-wide grant), so a leaked dev session is scoped to that one
      local project.
    signature: 'startDevSession(): string'
    returns: string
    params: []
  - name: getProjectCanvas
    description: >-
      Return the interactive architecture canvas HTML for the requested project by delegating to the
      web graph orchestrator, which authenticates the session and scopes the result to the
      principal's authorized projects.
    signature: 'getProjectCanvas(sessionId: string, projectId: string): string'
    returns: string
    params:
      - name: sessionId
        type: string
      - name: projectId
        type: string
  - name: signInWithPassword
    description: >-
      Sign the built-in super-admin in with the env-configured username + password. Consult a
      MINIMAL in-memory failed-attempt throttle first (module-level, transient — never persisted: ~5
      consecutive failures lock the username out for a short window, and attempts during the lockout
      are rejected outright — anti-bruteforce only). Verify BOTH values via the auth specialist's
      constant-time verifyBuiltinAdmin (unset env = password login disabled, always fails). On
      failure, record the attempt in the throttle and reject as unauthenticated. On success, clear
      the username's throttle entry and create a browser session bound to the stable built-in
      super-admin subject carrying the single instance-wide super-admin grant ({projectId '*',
      permissions ['*']}) — the ONLY *:* in the system: this env-anchored login is the sole path to
      a *:* session, because the identity orchestrator hard-reserves that grant away from user
      records and minted tokens. Append a best-effort web.signin.password (security) audit event and
      return the new session id (the portal sets it as the session cookie).
    signature: 'signInWithPassword(user: string, password: string): string'
    returns: string
    params:
      - name: user
        type: string
      - name: password
        type: string
status: complete
