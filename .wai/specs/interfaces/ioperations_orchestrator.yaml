id: ioperations_orchestrator
name: Operations Orchestrator Interface
description: >-
  Contract for hosted read-only operational insight: instance health, resource usage, and advisory
  quota evaluation. All methods authenticate the caller and authorize operations read; none perform
  writes.
component: operations_orchestrator
methods:
  - name: getHealthReport
    description: >-
      Authenticate the caller, authorize operations read, list hosted projects, and assemble a
      redacted instance health report (diagnostic checks plus usage snapshots) via the diagnostics
      specialist. Read-only; performs no writes and no audit.
    signature: 'getHealthReport(credential: string, scope: string): InstanceHealthReport'
    returns: InstanceHealthReport
    params:
      - name: credential
        type: string
      - name: scope
        type: string
        optional: true
  - name: getUsage
    description: >-
      Authenticate the caller, authorize operations read, and return redacted resource usage
      snapshots derived from the hosted project records. Read-only.
    signature: 'getUsage(credential: string, scope: string): ResourceUsageSnapshot[]'
    returns: ResourceUsageSnapshot[]
    params:
      - name: credential
        type: string
      - name: scope
        type: string
        optional: true
  - name: evaluateQuota
    description: >-
      Authenticate the caller, authorize operations read, collect usage snapshots, and evaluate them
      against the advisory ResourceQuotaPolicy (resolved from host config, secure default when
      unset), returning snapshots annotated with observe/warn advisory quota messages. Advisory only
      — never blocks or throttles.
    signature: 'evaluateQuota(credential: string, scope: string): ResourceUsageSnapshot[]'
    returns: ResourceUsageSnapshot[]
    params:
      - name: credential
        type: string
      - name: scope
        type: string
        optional: true
status: complete
