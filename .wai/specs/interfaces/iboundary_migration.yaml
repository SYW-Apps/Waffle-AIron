id: iboundary_migration
name: Boundary Migration Interface
description: >-
  Plan an internalize or externalize from a family graph (writing nothing), and write a confirmed
  plan into the roots a rehearsal maps. The core's own refusals surface when the plan is rehearsed
  and become the plan's refusals.
component: boundary_migration
methods:
  - name: planInternalize
    description: >-
      Plan folding the member under request.alias into the bound project with request.destination.
      Refusals: no such member (not-a-member) or its directory absent (member-absent); a family
      consumer of the member out of reach (family-partial); a public name of the member that a
      consumer uses colliding with one the bound project exports for another target
      (name-collision). Edits: the core's internalize with the destination — its `exports` completed
      with every public name of the member another family project uses, so each consumer keeps
      resolving; for every other family project consuming the member (its own members included,
      which become the bound project's): when it already declares an alias for the bound project,
      each `member::name` reference respelled to that alias at its position, the member alias's
      `use` merged into it, the member external and its pin removed; otherwise its external
      repointed at the bound project's id (source path re-expressed when it had one) and re-pinned,
      since the producer changed (the plan notes the pin will read drifted); the member's externals
      the bound project now declares, pinned in the bound project. Re-lock: the bound project and
      every consumer written; the member's lock ends with it (listed as deleted).
    signature: >-
      planInternalize(family: ProjectFamily, bound: string, request: MigrationRequest):
      MigrationPlan
    returns: MigrationPlan
    params:
      - name: family
        type: ProjectFamily
        description: The graph of the highest root in reach
      - name: bound
        type: string
        description: The bound project's key in that graph
      - name: request
        type: MigrationRequest
        description: verb internalize, alias, destination
    guarantees:
      - idempotent
  - name: planExternalize
    description: >-
      Plan turning the bound project's subsystem request.subsystem into a member at request.path.
      Refusals: no such subsystem, or it is already a member (externalize-refused); the path not
      strictly within the bound project, or already holding a project (not-contained); the subsystem
      id already an alias or a family project's id (alias-taken, id-collision); a reference from the
      moved subtree back into the bound project at a component its subsystem does not publish
      (externalize-refused: publishing it is a design decision to make first, never a move's side
      effect). Edits: the core's externalize (the move, the member declared, the sibling subsystems'
      references respelled `alias::name`, the crossing exports and imports declared, the bound
      project's L0 re-exports re-pointed at the member); the new member's external for the bound
      project pinned in the member. Every other family project consuming the bound project is
      checked, not written: each name it uses stays a public name of the bound project through the
      re-pointed re-exports (externalize-updates-siblings); one that would not is
      externalize-refused. Re-lock: the bound project; the new member has no lock.
    signature: >-
      planExternalize(family: ProjectFamily, bound: string, request: MigrationRequest):
      MigrationPlan
    returns: MigrationPlan
    params:
      - name: family
        type: ProjectFamily
        description: The graph of the highest root in reach
      - name: bound
        type: string
        description: The bound project's key in that graph
      - name: request
        type: MigrationRequest
        description: verb externalize, subsystem, path
    guarantees:
      - idempotent
  - name: write
    description: >-
      Write a confirmed internalize or externalize plan into the roots the rehearsal maps, restoring
      the caller's binding on every path. Internalize: consumers' reference edits first from the
      rehearsal's top root (while the member's keys exist), then the core's internalize under the
      bound project's binding, then the consumers' alias tables, then the pins. Externalize: the
      core's externalize under the bound project's binding, then the new member's pin under its
      binding. A core refusal propagates to the caller, which reports it as the plan's refusal.
    signature: 'write(plan: MigrationPlan, rehearsal: Rehearsal): void'
    returns: void
    params:
      - name: plan
        type: MigrationPlan
        description: The plan
      - name: rehearsal
        type: Rehearsal
        description: Where to write it
    guarantees:
      - idempotent
status: complete
