id: iadmin_ui_orchestrator
name: Admin UI Orchestrator Interface
description: Draft contract for browser-based hosted administration workflows and SSO session handling.
component: admin_ui_orchestrator
methods:
  - name: startSignIn
    description: Resolve the identity provider and return the authorization URL for browser sign-in.
    signature: 'startSignIn(providerId: string, redirectUri: string): string'
    returns: string
    params:
      - name: providerId
        type: string
      - name: redirectUri
        type: string
  - name: completeSignIn
    description: >-
      Verify the provider callback, resolve or create the hosted user, derive grants, create a web
      session, and audit the sign-in.
    signature: >-
      completeSignIn(providerId: string, code: string, state: string, redirectUri: string):
      WebSession
    returns: WebSession
    params:
      - name: providerId
        type: string
      - name: code
        type: string
      - name: state
        type: string
      - name: redirectUri
        type: string
  - name: resolveSession
    description: Resolve an existing web session to the current Principal and grants.
    signature: 'resolveSession(sessionId: string): Principal'
    returns: Principal
    params:
      - name: sessionId
        type: string
  - name: getDashboard
    description: >-
      Return a redacted admin/project dashboard payload serialized for the UI according to the
      session principal's grants.
    signature: 'getDashboard(sessionId: string): string'
    returns: string
    params:
      - name: sessionId
        type: string
  - name: signOut
    description: Expire one web session and audit the sign-out.
    signature: 'signOut(sessionId: string): void'
    returns: void
    params:
      - name: sessionId
        type: string
status: draft
