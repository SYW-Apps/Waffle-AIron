id: igit_adapter
name: Git Client Adapter Interface
description: >-
  Contract for git I/O against the bound project's checkout. Staging is always SCOPED to an explicit
  pathspec — there is deliberately no stage-everything operation, so a repository shared with the
  project's own codebase can never have foreign files committed by wairon.
component: git_adapter
methods:
  - name: clone
    description: Clone the remote (at branch) into the bound project directory.
    signature: 'clone(remote: string, branch: string): void'
    returns: void
  - name: fetch
    description: Fetch updates from the remote.
    signature: 'fetch(): void'
    returns: void
  - name: ensureWorkingBranch
    description: Create/checkout the isolated working branch.
    signature: 'ensureWorkingBranch(name: string): void'
    returns: void
  - name: integrateDefault
    description: Integrate the default branch into the current working branch.
    signature: 'integrateDefault(defaultBranch: string): void'
    returns: void
  - name: push
    description: Push the given branch to the remote.
    signature: 'push(branch: string): void'
    returns: void
  - name: compareUrl
    description: Build the host-agnostic compare/PR URL for workingBranch -> defaultBranch.
    signature: 'compareUrl(remote: string, defaultBranch: string, workingBranch: string): string'
    returns: string
  - name: commitScoped
    description: >-
      Stage ONLY the given subpath (pathspec-confined — never the whole tree) and commit; returns
      the new commit SHA, or null when nothing under the subpath changed (a clean scope never
      produces an empty commit).
    signature: 'commitScoped(subpath: string, message: string): string | null'
    returns: string | null
    params:
      - name: subpath
        type: string
        description: Pathspec relative to the repo root, e.g. .wai/ or .wai/specs/<subsystem>/.
      - name: message
        type: string
  - name: isClean
    description: >-
      True when the given subpath holds no uncommitted changes (scoped `status --porcelain --
      <subpath>`), backing the periodic sweep's skip-if-clean check.
    signature: 'isClean(subpath: string): boolean'
    returns: boolean
    params:
      - name: subpath
        type: string
  - name: excludeLocalFiles
    description: >-
      Keep this container's local-only state out of commits without touching the shared .gitignore:
      add `.wai/git.json` — the per-container connection config — to `.git/info/exclude`.
      `.wai/lock.json` is deliberately NOT excluded, because approvals live there and a hosted
      project's approval must reach the remote to mean anything outside this container; an exclusion
      an earlier wairon version wrote is actively removed, with a warning, so an upgraded container
      stops silently hiding an approval that should ship. Idempotent.
    signature: 'excludeLocalFiles(): void'
    returns: void
    params: []
status: complete
