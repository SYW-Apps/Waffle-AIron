id: ifamily_transaction
name: Family Transaction Interface
description: >-
  Rehearse, diff, commit or discard; restore and recover. After commit the family is either exactly
  the rehearsal's result or byte-identical to before, and a crash at any point leaves journals that
  recover resolves the same way.
component: family_transaction
methods:
  - name: rehearse
    description: >-
      Open a rehearsal for a scope: a private copy of every scoped owner's areas (each project's
      .wai tree by default; the host store files when the hosted member upgrade or a hosted detach
      scopes the data directory) and of every owner named whole (all its files — a relocated
      member's directory), laid out as the owners are, with the digest of every live file copied.
      Writes nothing live. PRECONDITION (accepted with the rehearsal design, to be confirmed by the
      implementation and pinned by a test): no writer run on the copy reads anything outside the
      scoped areas and whole owners — a family verb's writers read no source code, and the hosted
      writers read only the host stores they scoped. A writer found to read outside them is either
      given what it reads explicitly or taken off the rehearsal path, never run on the copy
      silently.
    signature: 'rehearse(scope: TransactionScope): Rehearsal'
    returns: Rehearsal
    params:
      - name: scope
        type: TransactionScope
        description: The family root and the projects the migration reads or writes
  - name: diff
    description: >-
      The rehearsal's difference from the live family after a verb wrote into it: the plan's file
      changes. Writes nothing.
    signature: 'diff(rehearsal: Rehearsal): list<FileChange>'
    returns: list<FileChange>
    params:
      - name: rehearsal
        type: Rehearsal
        description: The rehearsal
    guarantees:
      - idempotent
  - name: commit
    description: >-
      Make the changes live, all or nothing: stage every new file and back up every replaced one
      inside its owner's .wai/transactions/<id>/, refuse when a live file no longer matches its base
      digest, then swap under the journals and mark the coordinator committed. On any failure before
      the commit point, restore every backup and answer what failed and whether everything was
      restored. The rehearsal is dropped either way.
    signature: 'commit(rehearsal: Rehearsal, changes: list<FileChange>, verb: string): TransactionOutcome'
    returns: TransactionOutcome
    params:
      - name: rehearsal
        type: Rehearsal
        description: The rehearsal the changes were computed on
      - name: changes
        type: list<FileChange>
        description: The confirmed plan's file changes
      - name: verb
        type: string
        description: The migration verb, recorded in each journal
    guarantees:
      - atomic
  - name: discard
    description: >-
      Drop a rehearsal without touching the family: the end of a dry run, a refusal or a declined
      confirmation.
    signature: 'discard(rehearsal: Rehearsal): void'
    returns: void
    params:
      - name: rehearsal
        type: Rehearsal
        description: The rehearsal
    guarantees:
      - idempotent
  - name: restore
    description: >-
      Put every owner of a transaction back as its backups say: recreate removed directories, place
      each backed-up file, remove each created one, prune created directories, verify each restored
      file's digest against its base, and record each owner's journal rolled-back — or leave it
      naming the files that could not be restored. Answers those files; empty means the family is
      byte-identical to before. Safe to repeat: every step is keyed on the journal, not on how far a
      swap got.
    signature: 'restore(journals: list<TransactionJournal>): list<string>'
    returns: list<string>
    params:
      - name: journals
        type: list<TransactionJournal>
        description: Every owner's journal of one transaction
    guarantees:
      - idempotent
  - name: recover
    description: >-
      Find the unfinished transactions under a project root and, with fix, resolve each from its
      coordinator's phase: committed → remove the transaction directories; anything else → restore
      every owner, then remove them. A coordinator or owner out of reach, or a missing backup,
      refuses that transaction and names it. Without fix, only reports.
    signature: 'recover(root: string, fix: bool): list<RecoveredTransaction>'
    returns: list<RecoveredTransaction>
    params:
      - name: root
        type: string
        description: The project root doctor runs at
      - name: fix
        type: bool
        description: Resolve (true) or only report (false)
    guarantees:
      - idempotent
  - name: stage
    description: >-
      Stage a transaction without touching a live file: per owner, a journal in phase staging, then
      every new file in its staged area and every replaced file in its backup area (synced), after
      re-checking each live file against its base digest and each staged file's volume against its
      target's; each journal then reads staged. Throws StagingError naming the file when a live file
      moved since the rehearsal or a swap would cross volumes. Answers the journals, the
      coordinator's (the family root's) first.
    signature: 'stage(rehearsal: Rehearsal, changes: list<FileChange>, verb: string): list<TransactionJournal>'
    returns: list<TransactionJournal>
    params:
      - name: rehearsal
        type: Rehearsal
        description: The rehearsal the changes were computed on
      - name: changes
        type: list<FileChange>
        description: The file changes
      - name: verb
        type: string
        description: The migration verb, recorded in each journal
  - name: swap
    description: >-
      Swap staged journals in: the coordinator's journal first reads swapping, then each owner's
      entries are applied in order — parents made for creates, staged files renamed over live paths,
      deleted files removed and emptied directories pruned — and each owner's journal records the
      directories it created and removed. Throws SwapError naming the file and operation on the
      first failure; the caller restores.
    signature: 'swap(journals: list<TransactionJournal>): void'
    returns: void
    params:
      - name: journals
        type: list<TransactionJournal>
        description: The staged journals, the coordinator's first
status: complete
