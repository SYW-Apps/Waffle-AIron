id: isurface_repository
name: Surface Repository Interface
description: >-
  Facade contract for the stored surface-snapshot aggregate; consumers never touch the owned store
  or fs adapter directly.
component: surface_repository
methods:
  - name: saveSnapshot
    description: Upsert a snapshot, persisted to .wai/surfaces/.
    signatureFrom: surface_store.put
  - name: getSnapshot
    description: Snapshot by producing project name, or null.
    signatureFrom: surface_store.get
  - name: listSnapshots
    description: All stored snapshots at the bound root.
    signatureFrom: surface_store.list
  - name: removeSnapshot
    description: Delete the named project's snapshot.
    signatureFrom: surface_store.remove
status: complete
createdAt: '2026-07-10T23:13:27.580Z'
updatedAt: '2026-10-04T22:34:14.785Z'
