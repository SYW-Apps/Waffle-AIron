id: isurface_repository
name: Surface Repository Interface
description: >-
  Facade contract for the stored surface-snapshot aggregate; consumers never touch the owned
  store/registry/index directly.
component: surface_repository
methods:
  - name: saveSnapshot
    description: Upsert a snapshot (persisted to .wai/surfaces/ and reflected in the projection).
    signature: 'saveSnapshot(snapshot: SurfaceSnapshot): void'
    returns: void
    params:
      - name: snapshot
        type: SurfaceSnapshot
  - name: getSnapshot
    description: Snapshot by producing project name, or null.
    signature: 'getSnapshot(projectName: string): SurfaceSnapshot | null'
    returns: SurfaceSnapshot | null
    params:
      - name: projectName
        type: string
  - name: listSnapshots
    description: All stored snapshots.
    signature: 'listSnapshots(): SurfaceSnapshot[]'
    returns: SurfaceSnapshot[]
  - name: removeSnapshot
    description: Delete the named project's snapshot (file and projection).
    signature: 'removeSnapshot(projectName: string): boolean'
    returns: boolean
    params:
      - name: projectName
        type: string
  - name: hydrate
    description: >-
      Rebuild the in-memory projection from the persisted snapshot files (the subsystem's init
      lifecycle flow).
    signature: 'hydrate(): void'
    returns: void
status: complete
createdAt: '2026-07-10T23:13:27.580Z'
updatedAt: '2026-07-11T09:04:02.688Z'
