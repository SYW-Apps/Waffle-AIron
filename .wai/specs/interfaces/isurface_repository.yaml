id: isurface_repository
name: Surface Repository Interface
description: >-
  Facade contract for the stored surface-snapshot aggregate; consumers never touch the owned
  store/registry/index directly.
component: surface_repository
methods:
  - name: saveSnapshot
    description: Upsert a snapshot (persisted to .wai/surfaces/ and reflected in the projection).
    signature: 'saveSnapshot(snapshot: SurfaceSnapshot): void'
    returns: void
    params:
      - name: snapshot
        type: SurfaceSnapshot
  - name: getSnapshot
    description: Snapshot by producing project name, or null.
    signature: 'getSnapshot(projectName: string): SurfaceSnapshot | null'
    returns: SurfaceSnapshot | null
    params:
      - name: projectName
        type: string
  - name: listSnapshots
    description: All stored snapshots at a project root — the bound root when omitted.
    signature: 'listSnapshots(rootDir?: string): SurfaceSnapshot[]'
    returns: SurfaceSnapshot[]
    params:
      - name: rootDir
        type: string
        optional: true
  - name: removeSnapshot
    description: Delete the named project's snapshot (file and projection).
    signature: 'removeSnapshot(projectName: string): boolean'
    returns: boolean
    params:
      - name: projectName
        type: string
  - name: hydrate
    description: >-
      Rebuild the in-memory projection from the persisted snapshot files (the subsystem's init
      lifecycle flow).
    signature: 'hydrate(): void'
    returns: void
  - name: readExternalsLock
    description: The externals lock at the bound root, or null when none was written.
    signature: 'readExternalsLock(): ExternalsLock | null'
    returns: ExternalsLock | null
    params: []
  - name: saveExternalsLock
    description: Replace the externals lock at the bound root.
    signature: 'saveExternalsLock(lock: ExternalsLock): void'
    returns: void
    params:
      - name: lock
        type: ExternalsLock
  - name: readExternalSnapshot
    description: The pinned snapshot for an alias, or null.
    signature: 'readExternalSnapshot(alias: string): SurfaceSnapshot | null'
    returns: SurfaceSnapshot | null
    params:
      - name: alias
        type: string
  - name: saveExternalSnapshot
    description: Replace the pinned snapshot for an alias.
    signature: 'saveExternalSnapshot(alias: string, snapshot: SurfaceSnapshot): void'
    returns: void
    params:
      - name: alias
        type: string
      - name: snapshot
        type: SurfaceSnapshot
  - name: removeExternalSnapshot
    description: Remove the pinned snapshot for an alias; whether one existed.
    signature: 'removeExternalSnapshot(alias: string): boolean'
    returns: boolean
    params:
      - name: alias
        type: string
status: complete
