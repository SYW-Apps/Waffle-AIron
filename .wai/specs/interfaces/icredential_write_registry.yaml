id: icredential_write_registry
name: Credential Write Registry Interface
description: >-
  Write-face contract of the credential repository: create credential records and delete them
  (revocation is deletion). Records carry hashed tokens only.
component: credential_write_registry
methods:
  - name: create
    description: Persist one new credential record (hashed token, owner subject, project narrowing, label).
    signature: 'create(record: ApiKeyRecord): void'
    returns: void
  - name: revoke
    description: Delete one credential by id (idempotent for an unknown id).
    signature: 'revoke(id: string): void'
    returns: void
  - name: revokeAllForOwner
    description: >-
      Delete every credential owned by the given user id (correlated revocation on deactivation);
      returns the count removed.
    signature: 'revokeAllForOwner(ownerUserId: string): int'
    returns: int
  - name: renarrow
    description: >-
      Replace one credential's project narrowing with the given entries (the member upgrade's token
      rewrite); the hash, owner, label and expiry are untouched. Refuses an unknown id and an empty
      list.
    signature: 'renarrow(id: string, projects: list<string>): ApiKeyRecord'
    returns: ApiKeyRecord
    params:
      - name: id
        type: string
      - name: projects
        type: list<string>
        description: Record ids or '*'
status: complete
createdAt: '2026-07-19T08:58:23.971Z'
updatedAt: '2026-10-23T22:12:25.964Z'
