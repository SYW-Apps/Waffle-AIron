id: icredential_write_registry
name: Credential Write Registry Interface
description: >-
  Write-face contract of the credential repository: create and revoke credential records. Records
  carry hashed tokens only.
component: credential_write_registry
methods:
  - name: create
    description: Persist one new credential record (hashed token, owner subject, project narrowing, label).
    signature: 'create(record: ApiKeyRecord): void'
    returns: void
  - name: revoke
    description: Mark one credential revoked by id (idempotent for an already-revoked id).
    signature: 'revoke(id: string): void'
    returns: void
  - name: revokeAllForOwner
    description: >-
      Revoke every active credential owned by the given user id (correlated revocation on
      deactivation); returns the count revoked.
    signature: 'revokeAllForOwner(ownerUserId: string): number'
    returns: number
status: complete
