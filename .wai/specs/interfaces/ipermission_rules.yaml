id: ipermission_rules
name: Permission Rules Interface
description: >-
  Pure hierarchical permission-resolution contract. Given a resolved subject and the gathered world
  (assignments, roles, org tree, placements, project parent links), it computes effective
  permissions, visibility and the subsystem rungs a subject meets in a project by the
  nearest-ancestor walk (subsystem -> project -> parent projects -> units -> instance). It performs
  no I/O and never authenticates — the caller has authenticated the principal and gathered the
  world. No widening, by construction: a subsystem rung is visited only for a subsystem target and
  only for project:write, so every unit and project resolution is exactly what it is without the
  rung, and a subsystem with no setting of its own resolves exactly as its project.
component: permission_rules
methods:
  - name: resolvePermission
    description: >-
      Pure: compute the subject's effective permission for a capability at a target scope (unit,
      project or subsystem). An instance-admin subject resolves to yes (source instance-admin),
      bypassing the walk. Otherwise build the target's ancestor chain leaf->root and stop at the
      nearest scope with a definitive value. A subsystem target (`<projectId>/<subsystemId>`) starts
      with its own subsystem rung when the capability is project:write — the one capability a
      subsystem carries — and with nothing for any other capability, then continues exactly as its
      project's chain; an id without the separator names no scope and resolves at the instance root
      alone. A project's chain is: its own project scope; for a member, each parent project scope in
      turn up to its family root (the world's parent links — projects nest like units, so a parent's
      grant reaches every member transitively); then the FAMILY ROOT's placement unit and that
      unit's ancestors (a member's units come through its family root — a placement of a member
      itself is not a rung); then the instance root. At each scope, precedence is: a definitive
      direct-user assignment scoped here; else the most-permissive GRANTING value among the
      subject's roles ANCHORED here (an unscoped/instance-wide binding anchors at the instance root,
      so a broadly-bound role can never defeat a nearer per-scope deny; roles grant only — a role
      'no'/'inherit' is non-deciding); else the everyone-default here; else 'inherit' (continue
      upward). At a subsystem rung only yes and no decide (a role's approval there is non-deciding),
      since a subsystem is a yes/no setting. So an explicit no on a member's own record beats any
      yes inherited from its parent, an explicit no on a subsystem beats the project's yes, and an
      explicit yes there works without one. Reaching the root with nothing definitive yields the
      instance default 'no'. A parent-link cycle is never followed twice. Returns the value plus the
      deciding source and scope.
    signature: >-
      resolvePermission(subject: PermissionSubject, capability: string, targetScopeKind: string,
      targetScopeId: string, world: PermissionWorld): EffectivePermission
    returns: EffectivePermission
    params:
      - name: subject
        type: PermissionSubject
      - name: capability
        type: string
      - name: targetScopeKind
        type: string
      - name: targetScopeId
        type: string
      - name: world
        type: PermissionWorld
    guarantees:
      - idempotent
  - name: resolveVisibleScopes
    description: >-
      Pure: compute the scopes on which the subject's effective permission for the GIVEN capability
      is yes or approval (each marked actionable), plus their ancestor units (marked context-only
      breadcrumb). The scopes judged are every unit, every placed project AND every member project
      (from the parent links), each through its own chain; for project:write also every subsystem
      scope a setting in the world names (a subsystem assignment, or one of the subject's subsystem
      role bindings), whose context breadcrumb is its project and that project's units. A member's
      context breadcrumb is its family root's units. An instance-admin sees every unit and project
      scope as actionable. Never includes an ancestor's other (non-actionable) children; the
      returned view is deduplicated by scope with actionable winning over context.
    signature: >-
      resolveVisibleScopes(subject: PermissionSubject, capability: string, world: PermissionWorld):
      VisibleScope[]
    returns: VisibleScope[]
    params:
      - name: subject
        type: PermissionSubject
      - name: capability
        type: string
      - name: world
        type: PermissionWorld
    guarantees:
      - idempotent
  - name: resolveSubsystemReach
    description: >-
      Pure: the subsystem rungs the subject meets in one project — every subsystem scope of the
      project carrying a setting that applies to the subject (a direct-user assignment keyed by the
      subject or one of its aliases, an everyone-default, or one of the subject's role bindings
      anchored there), each with project:write resolved at it through resolvePermission's walk (so a
      subsystem whose settings do not decide reports the project chain's decision). Every subsystem
      not listed resolves exactly as the project. An instance-admin meets none: the bypass decides
      every scope, so nothing is listed. The data plane uses it to know which subsystems decide
      differently from the project without reading the spec tree.
    signature: >-
      resolveSubsystemReach(subject: PermissionSubject, projectId: string, world: PermissionWorld):
      SubsystemReach[]
    returns: SubsystemReach[]
    params:
      - name: subject
        type: PermissionSubject
      - name: projectId
        type: string
        description: The hosted record whose subsystems are judged
      - name: world
        type: PermissionWorld
    guarantees:
      - idempotent
status: complete
