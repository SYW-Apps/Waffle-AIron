id: ipermission_rules
name: Permission Rules Interface
description: >-
  Pure hierarchical permission-resolution contract. Given a resolved subject and the gathered world
  (assignments, roles, org tree, placements, project parent links), it computes effective
  permissions and visibility by the nearest-ancestor walk. It performs no I/O and never
  authenticates — the caller has authenticated the principal and gathered the world.
component: permission_rules
methods:
  - name: resolvePermission
    description: >-
      Pure: compute the subject's effective permission for a capability at a target scope (unit or
      project). An instance-admin subject resolves to yes (source instance-admin), bypassing the
      walk. Otherwise build the target's ancestor chain leaf->root and stop at the nearest scope
      with a definitive value. A project's chain is: its own project scope; for a member, each
      parent project scope in turn up to its family root (the world's parent links — projects nest
      like units, so a parent's grant reaches every member transitively); then the FAMILY ROOT's
      placement unit and that unit's ancestors (a member's units come through its family root — a
      placement of a member itself is not a rung); then the instance root. At each scope, precedence
      is: a definitive direct-user assignment scoped here; else the most-permissive GRANTING value
      among the subject's roles ANCHORED here (an unscoped/instance-wide binding anchors at the
      instance root, so a broadly-bound role can never defeat a nearer per-scope deny; roles grant
      only — a role 'no'/'inherit' is non-deciding); else the everyone-default here; else 'inherit'
      (continue upward). So an explicit no on a member's own record beats any yes inherited from its
      parent, and an explicit yes there works without one. Reaching the root with nothing definitive
      yields the instance default 'no'. A parent-link cycle is never followed twice. Returns the
      value plus the deciding source and scope.
    signature: >-
      resolvePermission(subject: PermissionSubject, capability: string, targetScopeKind: string,
      targetScopeId: string, world: PermissionWorld): EffectivePermission
    returns: EffectivePermission
    params:
      - name: subject
        type: PermissionSubject
      - name: capability
        type: string
      - name: targetScopeKind
        type: string
      - name: targetScopeId
        type: string
      - name: world
        type: PermissionWorld
    guarantees:
      - idempotent
  - name: resolveVisibleScopes
    description: >-
      Pure: compute the scopes on which the subject's effective permission for the GIVEN capability
      is yes or approval (each marked actionable), plus their ancestor units (marked context-only
      breadcrumb). The scopes judged are every unit, every placed project AND every member project
      (from the parent links), each through its own chain; a member's context breadcrumb is its
      family root's units. An instance-admin sees every scope as actionable. Never includes an
      ancestor's other (non-actionable) children; the returned view is deduplicated by scope with
      actionable winning over context.
    signature: >-
      resolveVisibleScopes(subject: PermissionSubject, capability: string, world: PermissionWorld):
      VisibleScope[]
    returns: VisibleScope[]
    params:
      - name: subject
        type: PermissionSubject
      - name: capability
        type: string
      - name: world
        type: PermissionWorld
    guarantees:
      - idempotent
status: complete
