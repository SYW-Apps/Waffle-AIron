id: ipack_orchestrator
name: Pack Orchestrator Interface
description: >-
  Contract for the control-plane pack-management workflows: authenticate the caller credential and
  authorize through the permission resolver — server-global pack management requires instance-level
  project:admin; per-project install/remove require project:admin over the project, the per-project
  listing project:read over it — then list/install/remove packs at server-global or project scope.
  Installs are declarative-only (profiles + language/platform tables); code packs are refused on
  this surface.
component: pack_orchestrator
methods:
  - name: listGlobalPacks
    description: >-
      Authenticate, require instance-level project:admin, and list the server-global installed
      packs.
    signature: 'listGlobalPacks(credential: string): PackDescriptor[]'
    returns: PackDescriptor[]
    params:
      - name: credential
        type: string
  - name: installGlobalPack
    description: >-
      Authenticate, require instance-level project:admin, and install a declarative pack server-wide
      (rejecting code packs).
    signature: 'installGlobalPack(credential: string, name: string, content: string): PackDescriptor'
    returns: PackDescriptor
    params:
      - name: credential
        type: string
      - name: name
        type: string
      - name: content
        type: string
  - name: removeGlobalPack
    description: Authenticate, require instance-level project:admin, and remove a server-global pack.
    signature: 'removeGlobalPack(credential: string, name: string): void'
    returns: void
    params:
      - name: credential
        type: string
      - name: name
        type: string
  - name: listProjectPacks
    description: >-
      Authenticate, require project:read over the project, bind its scope, and list its registered
      packs.
    signature: 'listProjectPacks(credential: string, project: string): PackDescriptor[]'
    returns: PackDescriptor[]
    params:
      - name: credential
        type: string
      - name: project
        type: string
  - name: installProjectPack
    description: >-
      Authenticate, require project:admin over the project, bind its scope, and install a
      declarative pack into it (rejecting code packs).
    signature: >-
      installProjectPack(credential: string, project: string, name: string, content: string):
      PackDescriptor
    returns: PackDescriptor
    params:
      - name: credential
        type: string
      - name: project
        type: string
      - name: name
        type: string
      - name: content
        type: string
  - name: removeProjectPack
    description: >-
      Authenticate, require project:admin over the project, bind its scope, and remove one of its
      registered packs.
    signature: 'removeProjectPack(credential: string, project: string, name: string): void'
    returns: void
    params:
      - name: credential
        type: string
      - name: project
        type: string
      - name: name
        type: string
  - name: installGlobalPackArchive
    description: >-
      Authenticate, require instance-level project:admin, and install a declarative pack from a
      .wpack archive server-wide (rejecting code packs). ZIP-primary counterpart of
      installGlobalPack.
    signature: 'installGlobalPackArchive(credential: string, archive: bytes, name?: string): PackDescriptor'
    returns: PackDescriptor
    params:
      - name: credential
        type: string
      - name: archive
        type: bytes
      - name: name
        type: string
        optional: true
  - name: installProjectPackArchive
    description: >-
      Authenticate, require project:admin over the project, bind its scope, and install a
      declarative pack from a .wpack archive into it (rejecting code packs). ZIP-primary counterpart
      of installProjectPack.
    signature: >-
      installProjectPackArchive(credential: string, project: string, archive: bytes, name?: string):
      PackDescriptor
    returns: PackDescriptor
    params:
      - name: credential
        type: string
      - name: project
        type: string
      - name: archive
        type: bytes
      - name: name
        type: string
        optional: true
  - name: listAvailableProfiles
    description: >-
      Authenticate the caller credential (any authenticated principal may read the catalog — the
      policy UI and agents both need to see what profiles are selectable) and return the profiles
      available for selection: the wairon built-in profiles plus every profile contributed by the
      server-global packs, each tagged with its source ("builtin" or the providing pack's name) so a
      UI can present them grouped by source.
    signature: 'listAvailableProfiles(credential: string): AvailableProfile[]'
    returns: AvailableProfile[]
    params:
      - name: credential
        type: string
  - name: adoptProjectPack
    description: >-
      Authenticate, require project:admin over the project, bind its scope, and install a
      server-global declarative pack into it BY NAME — resolving the pack's declarative content from
      the server-global set (across both tiers, file- or directory-form) rather than uploading an
      archive, and rejecting a name the server-global set cannot resolve. The catalog counterpart of
      installProjectPack/installProjectPackArchive: adopt an already-available instance pack without
      re-uploading it.
    signature: 'adoptProjectPack(credential: string, project: string, name: string): PackDescriptor'
    returns: PackDescriptor
    params:
      - name: credential
        type: string
      - name: project
        type: string
      - name: name
        type: string
  - name: listAdoptableProjectPacks
    description: >-
      Authenticate, require project:read over the project, and list the server-global packs
      available for the project to adopt (the instance catalog, each descriptor carrying its
      contents) so a project admin can pick from available packs instead of uploading an archive.
      The already-installed ones are marked by the caller against listProjectPacks.
    signature: 'listAdoptableProjectPacks(credential: string, project: string): PackDescriptor[]'
    returns: PackDescriptor[]
    params:
      - name: credential
        type: string
      - name: project
        type: string
  - name: listProjectProfiles
    description: >-
      Authenticate the caller credential and resolve project:read over the target project through
      the authorization seam (mirroring listProjectPacks / listAdoptableProjectPacks), then return
      the PROJECT-SCOPED profile catalog from the pre-authorized store read: built-ins plus the
      profiles contributed by the project's own registered packs (installed) plus the profiles
      contributed by the server-global packs (adoptable on selection). This is the catalog a
      project-type picker must use — the instance-wide listAvailableProfiles cannot see a project's
      own packs and cannot say which profiles would need adopting.
    signature: 'listProjectProfiles(credential: string, project: string): AvailableProfile[]'
    returns: AvailableProfile[]
    params:
      - name: credential
        type: string
      - name: project
        type: string
status: complete
