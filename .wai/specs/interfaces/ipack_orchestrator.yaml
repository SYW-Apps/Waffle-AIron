id: ipack_orchestrator
name: Pack Orchestrator Interface
description: >-
  Contract for the control-plane pack-management workflows: authenticate the caller credential and
  authorize through the permission resolver — server-global pack management requires instance-level
  project:admin; per-project install/remove require project:admin over the project, the per-project
  listing project:read over it — then list/install/remove packs at server-global or project scope.
  Installs are declarative-only (profiles + language/platform tables); code packs are refused on
  this surface.
component: pack_orchestrator
methods:
  - name: listGlobalPacks
    description: >-
      Authenticate, require instance-level project:admin, and list the server-global installed
      packs.
    signature: 'listGlobalPacks(credential: string): PackDescriptor[]'
    returns: PackDescriptor[]
    params:
      - name: credential
        type: string
  - name: installGlobalPack
    description: >-
      Authenticate, require instance-level project:admin, and install a declarative pack server-wide
      (rejecting code packs).
    signature: 'installGlobalPack(credential: string, name: string, content: string): PackDescriptor'
    returns: PackDescriptor
    params:
      - name: credential
        type: string
      - name: name
        type: string
      - name: content
        type: string
  - name: removeGlobalPack
    description: Authenticate, require instance-level project:admin, and remove a server-global pack.
    signature: 'removeGlobalPack(credential: string, name: string): void'
    returns: void
    params:
      - name: credential
        type: string
      - name: name
        type: string
  - name: listProjectPacks
    description: >-
      Authenticate, require project:read over the project, bind its scope, and list its registered
      packs.
    signature: 'listProjectPacks(credential: string, project: string): PackDescriptor[]'
    returns: PackDescriptor[]
    params:
      - name: credential
        type: string
      - name: project
        type: string
  - name: installProjectPack
    description: >-
      Authenticate, require project:admin over the project, bind its scope, and install a
      declarative pack into it (rejecting code packs).
    signature: >-
      installProjectPack(credential: string, project: string, name: string, content: string):
      PackDescriptor
    returns: PackDescriptor
    params:
      - name: credential
        type: string
      - name: project
        type: string
      - name: name
        type: string
      - name: content
        type: string
  - name: removeProjectPack
    description: >-
      Authenticate, require project:admin over the project, bind its scope, and remove one of its
      registered packs.
    signature: 'removeProjectPack(credential: string, project: string, name: string): void'
    returns: void
    params:
      - name: credential
        type: string
      - name: project
        type: string
      - name: name
        type: string
status: complete
