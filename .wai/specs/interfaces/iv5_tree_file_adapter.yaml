id: iv5_tree_file_adapter
name: v5 Tree File Adapter Contract
description: Raw file reads and moves over a v5 project tree.
component: v5_tree_file_adapter
methods:
  - name: familyRoots
    description: >-
      The project roots of the family under a root as v5 declared it: its project.yaml members
      (short and long form) and every L1 subsystem file carrying projectPath, followed recursively,
      the top first, each once. A path that does not exist is left out.
    signature: 'familyRoots(root: string): list<string>'
    returns: list<string>
    params:
      - name: root
        type: string
    effect: io
  - name: moveLegacyFolder
    description: Move the root's .wairon folder to .wai; a root holding a .wai folder already is left as it is.
    signature: 'moveLegacyFolder(root: string): void'
    returns: void
    params:
      - name: root
        type: string
    effect: io
  - name: renameSpecFile
    description: Rename one spec file to the name the current layout expects.
    signature: 'renameSpecFile(from: string, to: string): void'
    returns: void
    params:
      - name: from
        type: string
      - name: to
        type: string
    effect: io
  - name: holdsLegacyFolder
    description: Whether the root holds a .wairon folder and no .wai folder.
    signature: 'holdsLegacyFolder(root: string): bool'
    returns: bool
    params:
      - name: root
        type: string
    effect: io
  - name: keepStaleRecord
    description: >-
      A lock record of an older format that nothing proves unchanged, kept on record in the current
      format: who approved it, when, and the identity it certified are unchanged, so it reads stale;
      its per-spec digests, of another reading, are dropped; reexpressed says what it was. Null when
      the root holds no record, or one already in the current format.
    signature: 'keepStaleRecord(root: string): LockRecord?'
    returns: LockRecord?
    params:
      - name: root
        type: string
    effect: io
  - name: v5FormsLeft
    description: >-
      The spec files under a root's specs folder that still hold a wairon 5 form, read raw (the
      running release refuses them): the system file, and each subsystem, component and contract,
      told apart the way the loader tells them.
    signature: 'v5FormsLeft(root: string): list<V5FormsLeft>'
    returns: list<V5FormsLeft>
    params:
      - name: root
        type: string
    effect: read
status: draft
