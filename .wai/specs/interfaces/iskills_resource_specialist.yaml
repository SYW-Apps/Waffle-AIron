id: iskills_resource_specialist
name: Skills Resource Specialist Interface
description: >-
  Resolves the built-in SDD skill documents for MCP publication: lists MCP-safe descriptors and
  reads each skill's markdown content from Wairon's packaged skill templates.
component: skills_resource_specialist
methods:
  - name: listSkillResources
    description: >-
      List the built-in SDD skill resources as MCP-safe descriptors, one per packaged skill
      template.
    signature: 'listSkillResources(): SkillResourceDescriptor[]'
    returns: SkillResourceDescriptor[]
    params: []
  - name: readSkillResource
    description: >-
      Read one built-in skill's markdown content from the packaged skill templates, addressed by its
      resource id.
    signature: 'readSkillResource(resourceId: string): string'
    returns: string
    params:
      - name: resourceId
        type: string
        description: The skill resource id, e.g. "sdd-architect".
status: complete
createdAt: '2026-07-08T22:01:40.898Z'
updatedAt: '2026-07-10T12:20:51.081Z'
