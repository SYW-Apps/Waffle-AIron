id: ipublic_surface_store
name: Public Surface Store Interface
description: >-
  Private contract for the authoritative in-memory set of redacted public-surface snapshots (one per
  project), loaded from and swapped as one backing file (public-surfaces.json under the hosted data
  root).
component: public_surface_store
methods:
  - name: load
    description: >-
      Read public-surfaces.json fresh (no in-memory copy). A missing file yields an empty set; an
      unreadable file or structurally invalid JSON fails with a storage error naming the path.
    signature: 'load(): list<ProjectPublicSurfaceSnapshot>'
    returns: list<ProjectPublicSurfaceSnapshot>
    params: []
  - name: update
    description: >-
      Read the snapshot set fresh and persist what the change makes of it, holding the file's write
      lock (file_write_lock) across both, so a writer in another process that reads and writes the
      same file in between is never lost; a change that throws writes nothing; a file that exists
      but cannot be read or parsed throws. Answers the set written.
    signature: >-
      update(change: (snapshots: ProjectPublicSurfaceSnapshot[]) => ProjectPublicSurfaceSnapshot[]):
      ProjectPublicSurfaceSnapshot[]
    returns: list<ProjectPublicSurfaceSnapshot>
    effect: write
lint:
  allow:
    - code: UNUSED_METHOD
      at: load
      reason: >-
        The read-through store's hydration is called by the repository FACADE, not by a member:
        every exported facade function in src/server/surfaces.ts constructs the store, calls load(),
        and only then forwards to the registry or index. A Repository facade narrative is held to a
        single call step (FACADE_FORWARDING), so that hydration call has nowhere to live in the
        model and load has no modelled caller. The shape that fixes it already exists in this tree —
        surface_repository.hydrate forwards to surface_registry.hydrateFromFiles — and this family
        predates it. Modelling the hydration that way (or letting the facade doctrine carry a
        hydrate-then-forward pair) is the decision owed; declaring a call from the registry or index
        would be declaring one the code does not make.
status: complete
