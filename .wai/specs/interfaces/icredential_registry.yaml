id: icredential_registry
name: Credential Registry Interface
description: Contract for persisting and looking up hashed API-key credentials under the data root.
component: credential_registry
methods:
  - name: findByToken
    description: Look up a credential record by hashed token, or null.
    signature: 'findByToken(tokenHash: string): ApiKeyRecord | null'
    returns: ApiKeyRecord | null
  - name: create
    description: Persist a new API-key record.
    signature: 'create(record: ApiKeyRecord): void'
    returns: void
  - name: revoke
    description: Remove a credential by id.
    signature: 'revoke(id: string): void'
    returns: void
  - name: list
    description: List credentials authorized for a project.
    signature: 'list(project: string): ApiKeyRecord[]'
    returns: ApiKeyRecord[]
status: complete
