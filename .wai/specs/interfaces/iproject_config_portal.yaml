id: iproject_config_portal
name: Project Config Portal Interface
description: Published reads and writes of the bound project's configuration.
component: project_config_portal
methods:
  - name: loadProjectConfig
    description: >-
      Published read: the bound project's configuration, or null when it has none — straight through
      the project config Repository.
    signature: 'loadProjectConfig(): ProjectConfig | null'
    returns: ProjectConfig | null
    params: []
    guarantees:
      - idempotent
  - name: projectConfigExists
    description: 'Published read: whether the bound project has a configuration file.'
    signature: 'projectConfigExists(): boolean'
    returns: boolean
    params: []
    guarantees:
      - idempotent
  - name: declaresGlobalPacks
    description: >-
      Published read: whether the bound project's configuration sets `extensions.useGlobalPacks`
      explicitly.
    signature: 'declaresGlobalPacks(): boolean'
    returns: boolean
    params: []
    guarantees:
      - idempotent
  - name: createProjectConfig
    description: >-
      Published write: write a fresh configuration for a project that has none. Routed through the
      core orchestrator.
    signature: 'createProjectConfig(config: ProjectConfig): void'
    returns: void
    params:
      - name: config
        type: ProjectConfig
  - name: upsertPackSelection
    description: >-
      Published write: select a pack by name, moving a re-selected pack last; returns whether an
      earlier selection was replaced. Routed through the core orchestrator.
    signature: 'upsertPackSelection(selection: PackSelection): boolean'
    returns: boolean
    params:
      - name: selection
        type: PackSelection
    guarantees:
      - idempotent
  - name: removePackSelection
    description: >-
      Published write: deselect a pack by name, leaving path references alone; returns whether
      anything was dropped. Routed through the core orchestrator.
    signature: 'removePackSelection(packName: string): boolean'
    returns: boolean
    params:
      - name: packName
        type: string
    guarantees:
      - idempotent
  - name: setProjectType
    description: 'Published write: set the governing `projectType`. Routed through the core orchestrator.'
    signature: 'setProjectType(projectType: string): void'
    returns: void
    params:
      - name: projectType
        type: string
    guarantees:
      - idempotent
  - name: recordProfileSelection
    description: >-
      Published write: record the profile selection hosted policy applied. Routed through the core
      orchestrator.
    signature: 'recordProfileSelection(selection: ProjectProfileSelection): void'
    returns: void
    params:
      - name: selection
        type: ProjectProfileSelection
    guarantees:
      - idempotent
  - name: setExecutionTier
    description: 'Published write: set `execution.tier`. Routed through the core orchestrator.'
    signature: 'setExecutionTier(tier: string): void'
    returns: void
    params:
      - name: tier
        type: string
    guarantees:
      - idempotent
  - name: registerPackRef
    description: >-
      Published write: register a legacy pack path reference when it is absent; returns whether it
      was added. Routed through the core orchestrator.
    signature: 'registerPackRef(ref: string): boolean'
    returns: boolean
    params:
      - name: ref
        type: string
    guarantees:
      - idempotent
  - name: deregisterPackRef
    description: >-
      Published write: drop a legacy pack path reference that matches exactly; returns whether
      anything was dropped. Routed through the core orchestrator.
    signature: 'deregisterPackRef(ref: string): boolean'
    returns: boolean
    params:
      - name: ref
        type: string
    guarantees:
      - idempotent
  - name: markSelectionsBundled
    description: >-
      Published write: record bundled packs on their selections in place, in one write. Routed
      through the core orchestrator.
    signature: 'markSelectionsBundled(bundled: PackSelection[]): void'
    returns: void
    params:
      - name: bundled
        type: PackSelection[]
    guarantees:
      - idempotent
  - name: setId
    description: >-
      Published write: declare the bound project's id; refused for a malformed id or when a
      different id is already declared, a no-op when the same one is. Returns whether it wrote.
      Routed through the core orchestrator.
    signature: 'setId(id: string): boolean'
    returns: boolean
    params:
      - name: id
        type: string
        description: The project id to declare
    guarantees:
      - idempotent
  - name: declareExternal
    description: >-
      Published write: declare one external of the bound project under an alias; refused for a
      malformed alias or producer id, or when the alias holds a different declaration, a no-op when
      it holds the same one. Returns whether it wrote. Routed through the core orchestrator.
    signature: 'declareExternal(alias: string, declaration: ExternalDeclaration): boolean'
    returns: boolean
    params:
      - name: alias
        type: string
        description: The alias key
      - name: declaration
        type: ExternalDeclaration
        description: The value under the alias
    guarantees:
      - idempotent
  - name: importNames
    description: >-
      Published write: add public names to the `use` of the bound project's external or member under
      an alias; refused for a malformed name or an undeclared alias, a no-op for names already
      imported. Returns whether it wrote. Routed through the core orchestrator.
    signature: 'importNames(alias: string, names: string[]): boolean'
    returns: boolean
    params:
      - name: alias
        type: string
        description: The external or member alias
      - name: names
        type: string[]
        description: The public names to import, or `*`
    guarantees:
      - idempotent
status: complete
