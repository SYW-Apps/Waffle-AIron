id: iproject_config_portal
name: Project Config Portal Interface
description: Published reads and writes of the bound project's configuration.
component: project_config_portal
methods:
  - name: loadProjectConfig
    description: >-
      Published read: the bound project's configuration, or null when it has none — straight through
      the project config Repository.
    signature: 'loadProjectConfig(): ProjectConfig | null'
    returns: ProjectConfig | null
    params: []
    guarantees:
      - idempotent
  - name: projectConfigExists
    description: 'Published read: whether the bound project has a configuration file.'
    signature: 'projectConfigExists(): boolean'
    returns: boolean
    params: []
    guarantees:
      - idempotent
  - name: declaresGlobalPacks
    description: >-
      Published read: whether the bound project's configuration sets `extensions.useGlobalPacks`
      explicitly.
    signature: 'declaresGlobalPacks(): boolean'
    returns: boolean
    params: []
    guarantees:
      - idempotent
  - name: createProjectConfig
    description: >-
      Published write: write a fresh configuration for a project that has none. Routed through the
      core orchestrator.
    signature: 'createProjectConfig(config: ProjectConfig): void'
    returns: void
    params:
      - name: config
        type: ProjectConfig
  - name: upsertPackSelection
    description: >-
      Published write: select a pack by name, moving a re-selected pack last; returns whether an
      earlier selection was replaced. Routed through the core orchestrator.
    signature: 'upsertPackSelection(selection: PackSelection): boolean'
    returns: boolean
    params:
      - name: selection
        type: PackSelection
    guarantees:
      - idempotent
  - name: removePackSelection
    description: >-
      Published write: deselect a pack by name, leaving path references alone; returns whether
      anything was dropped. Routed through the core orchestrator.
    signature: 'removePackSelection(packName: string): boolean'
    returns: boolean
    params:
      - name: packName
        type: string
    guarantees:
      - idempotent
  - name: setProjectType
    description: 'Published write: set the governing `projectType`. Routed through the core orchestrator.'
    signature: 'setProjectType(projectType: string): void'
    returns: void
    params:
      - name: projectType
        type: string
    guarantees:
      - idempotent
  - name: recordProfileSelection
    description: >-
      Published write: record the profile selection hosted policy applied. Routed through the core
      orchestrator.
    signature: 'recordProfileSelection(selection: ProjectProfileSelection): void'
    returns: void
    params:
      - name: selection
        type: ProjectProfileSelection
    guarantees:
      - idempotent
  - name: setExecutionTier
    description: 'Published write: set `execution.tier`. Routed through the core orchestrator.'
    signature: 'setExecutionTier(tier: string): void'
    returns: void
    params:
      - name: tier
        type: string
    guarantees:
      - idempotent
  - name: registerPackRef
    description: >-
      Published write: register a legacy pack path reference when it is absent; returns whether it
      was added. Routed through the core orchestrator.
    signature: 'registerPackRef(ref: string): boolean'
    returns: boolean
    params:
      - name: ref
        type: string
    guarantees:
      - idempotent
  - name: deregisterPackRef
    description: >-
      Published write: drop a legacy pack path reference that matches exactly; returns whether
      anything was dropped. Routed through the core orchestrator.
    signature: 'deregisterPackRef(ref: string): boolean'
    returns: boolean
    params:
      - name: ref
        type: string
    guarantees:
      - idempotent
  - name: markSelectionsBundled
    description: >-
      Published write: record bundled packs on their selections in place, in one write. Routed
      through the core orchestrator.
    signature: 'markSelectionsBundled(bundled: PackSelection[]): void'
    returns: void
    params:
      - name: bundled
        type: PackSelection[]
    guarantees:
      - idempotent
  - name: setId
    description: >-
      Published write: declare the bound project's id; refused for a malformed id or when a
      different id is already declared, a no-op when the same one is. Returns whether it wrote.
      Routed through the core orchestrator.
    signature: 'setId(id: string): boolean'
    returns: boolean
    params:
      - name: id
        type: string
        description: The project id to declare
    guarantees:
      - idempotent
  - name: declareExternal
    description: >-
      Published write: declare one external of the bound project under an alias; refused for a
      malformed alias or producer id, or when the alias holds a different declaration, a no-op when
      it holds the same one. Returns whether it wrote. Routed through the core orchestrator.
    signature: 'declareExternal(alias: string, declaration: ExternalDeclaration): boolean'
    returns: boolean
    params:
      - name: alias
        type: string
        description: The alias key
      - name: declaration
        type: ExternalDeclaration
        description: The value under the alias
    guarantees:
      - idempotent
  - name: importNames
    description: >-
      Published write: add public names to the `use` of the bound project's external or member under
      an alias; refused for a malformed name or an undeclared alias, a no-op for names already
      imported. Returns whether it wrote. Routed through the core orchestrator.
    signature: 'importNames(alias: string, names: string[]): boolean'
    returns: boolean
    params:
      - name: alias
        type: string
        description: The external or member alias
      - name: names
        type: string[]
        description: The public names to import, or `*`
    guarantees:
      - idempotent
  - name: renameId
    description: >-
      Published write: move the bound project's id, keeping the old one in previousIds; refused for
      a malformed new id or when the project no longer answers to the old one, a no-op once done.
      Returns whether it wrote. Routed through the core orchestrator.
    signature: 'renameId(from: string, to: string): boolean'
    returns: boolean
    params:
      - name: from
        type: string
        description: The id the project answers to now
      - name: to
        type: string
        description: The new id
    guarantees:
      - idempotent
  - name: renameAlias
    description: >-
      Published write: rekey one member or external alias of the bound project, keeping its value
      and place. Returns whether it wrote. Routed through the core orchestrator.
    signature: 'renameAlias(from: string, to: string): boolean'
    returns: boolean
    params:
      - name: from
        type: string
        description: The alias as declared now
      - name: to
        type: string
        description: The new alias
    guarantees:
      - idempotent
  - name: repointExternal
    description: >-
      Published write: revise one external's producer id and explicit source, keeping its `use` and
      description. Returns whether it wrote. Routed through the core orchestrator.
    signature: 'repointExternal(alias: string, project: string | null, source: ExternalSource | null): boolean'
    returns: boolean
    params:
      - name: alias
        type: string
        description: The external's alias
      - name: project
        type: string | null
        description: The producer id, or null when the alias is the id
      - name: source
        type: ExternalSource | null
        description: The explicit place, or null to find it through the family
    guarantees:
      - idempotent
  - name: removeExternal
    description: >-
      Published write: remove one external declaration of the bound project. Returns whether it
      wrote. Routed through the core orchestrator.
    signature: 'removeExternal(alias: string): boolean'
    returns: boolean
    params:
      - name: alias
        type: string
        description: The external's alias
    guarantees:
      - idempotent
  - name: declareMember
    description: >-
      Published write: declare an existing project as a member of the bound project, under the
      containment guard; scaffolds nothing. Returns whether it wrote. Routed through the core
      orchestrator.
    signature: 'declareMember(alias: string, declaration: MemberDeclaration): boolean'
    returns: boolean
    params:
      - name: alias
        type: string
        description: The member's alias
      - name: declaration
        type: MemberDeclaration
        description: Its path, and its description and `use` when it has them
    guarantees:
      - idempotent
  - name: removeMember
    description: >-
      Published write: remove one member declaration of the bound project, leaving the member's
      directory as it is. Returns whether it wrote. Routed through the core orchestrator.
    signature: 'removeMember(alias: string): boolean'
    returns: boolean
    params:
      - name: alias
        type: string
        description: The member's alias
    guarantees:
      - idempotent
status: complete
