id: imcp_authoring_adapter
name: MCP Authoring Client Adapter Interface
description: >-
  Client adapter contract for the MCP subsystem's hop into sdd_authoring: every spec write an MCP
  tool makes on an author's behalf, reached through the authoring portal instead of the spec store
  (in-process today; swappable for a remote transport).
component: mcp_authoring_adapter
methods:
  - name: updateSpecGated
    description: >-
      Forward the sdd_update_spec patch to the authoring portal's gate: the intrinsic rules judge
      the merged candidate and refuse it before anything reaches disk, and a dry run runs that whole
      write and answers with the report it would have produced without touching a file.
    signature: >-
      updateSpecGated(kind: string, id: string, delta: SpecDelta, dryRun?: boolean):
      SpecChangeReport
    returns: SpecChangeReport
    params:
      - name: kind
        type: string
        description: system, subsystem, component, interface, implementation or type
      - name: id
        type: string
        description: The stored spec's id
      - name: delta
        type: SpecDelta
        description: The partial change to merge, carrying the delta's own verbs
      - name: dryRun
        type: boolean
        description: Answer with what the delta would do and write nothing
        optional: true
  - name: moveMethods
    description: >-
      Forward the sdd_move_methods request to the authoring portal's gate: the move is judged as a
      whole and refused before anything reaches disk, and a dry run runs that same move and answers
      with the report it would have produced without writing.
    signature: 'moveMethods(from: string, to: string, methods: string[], dryRun?: boolean): MethodMoveReport'
    returns: MethodMoveReport
    params:
      - name: from
        type: string
        description: The component id the methods currently belong to
      - name: to
        type: string
        description: The component id that should receive them
      - name: methods
        type: string[]
        description: The method names to move
      - name: dryRun
        type: boolean
        description: Answer with what the move would do and write nothing
        optional: true
  - name: writeSpec
    description: >-
      Forward a create tool's whole-spec restatement to the authoring portal: the seam applies it to
      the stored spec, judges it and writes it, and answers with the write receipt.
    signature: 'writeSpec(restatement: SpecRestatement): SpecWriteReceipt'
    returns: SpecWriteReceipt
    params:
      - name: restatement
        type: SpecRestatement
        description: The spec as the tool's arguments state it, with the fields the tool's input can express
  - name: deleteSpec
    description: >-
      Forward the sdd_delete_spec request to the authoring portal, which deletes the spec and
      reports the tests a removed method invalidated.
    signature: 'deleteSpec(kind: string, id: string): SpecDeletion'
    returns: SpecDeletion
    params:
      - name: kind
        type: string
        description: subsystem, component, interface, implementation or type
      - name: id
        type: string
        description: The spec id
status: complete
