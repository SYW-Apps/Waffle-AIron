id: imcp_authoring_adapter
name: MCP Authoring Client Adapter Interface
description: >-
  Client adapter contract for the MCP subsystem's hop into sdd_authoring: the gated component write,
  reached through the authoring portal instead of the spec store (in-process today; swappable for a
  remote transport).
component: mcp_authoring_adapter
methods:
  - name: addComponent
    description: >-
      Forward the sdd_add_component write to the authoring portal's gate: the intrinsic rules judge
      the candidate and refuse a misplaced field before anything reaches disk, and the write is
      performed only if it passes.
    signature: 'addComponent(candidate: ComponentSpec): string[]'
    returns: string[]
    params:
      - name: candidate
        type: ComponentSpec
        description: The component as the tool's arguments describe it
  - name: updateSpecGated
    description: >-
      Forward the sdd_update_spec patch to the authoring portal's gate: the intrinsic rules judge
      the merged candidate and refuse it before anything reaches disk, and a dry run runs that whole
      write and answers with the report it would have produced without touching a file.
    signature: >-
      updateSpecGated(kind: string, id: string, delta: SpecDelta, dryRun?: boolean):
      SpecChangeReport
    returns: SpecChangeReport
    params:
      - name: kind
        type: string
        description: system, subsystem, component, interface, implementation or type
      - name: id
        type: string
        description: The stored spec's id
      - name: delta
        type: SpecDelta
        description: The partial change to merge, carrying the delta's own verbs
      - name: dryRun
        type: boolean
        description: Answer with what the delta would do and write nothing
        optional: true
status: complete
createdAt: '2026-09-18T21:42:03.998Z'
updatedAt: '2026-09-19T22:56:26.373Z'
