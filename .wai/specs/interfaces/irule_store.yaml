id: irule_store
name: Rule Store Interface
description: >-
  Raw accessors over the in-memory rule set, in registration order. Written by the rule registry,
  read by the rule index.
component: rule_store
methods:
  - name: addRule
    description: Append a rule to the held set (registration order preserved).
    signature: 'addRule(rule: SddRule): void'
    returns: void
    params:
      - name: rule
        type: SddRule
  - name: listRules
    description: Return every held rule in registration order.
    signature: 'listRules(): SddRule[]'
    returns: SddRule[]
    params: []
  - name: clear
    description: Empty the held set, so a new validation run seeds its rules from nothing.
    signature: 'clear(): void'
    returns: void
    params: []
    effect: write
lint:
  allow:
    - code: METHOD_REPEATS_COMPONENT
      reason: D2b renames addRule and listRules to drop the component's own concept.
status: complete
createdAt: '2026-07-14T19:17:10.227Z'
updatedAt: '2026-09-17T17:52:32.158Z'
