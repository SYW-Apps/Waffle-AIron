id: ivalidator_surfaces_adapter
name: Validator Surfaces Adapter Interface
description: >-
  The validator's hop into sdd_surfaces: the bound root's own foreign surface snapshots and its
  pinned externals for the owner's gate, and the externals status a family run composes from.
component: validator_surfaces_adapter
methods:
  - name: listSnapshots
    description: All surface snapshots available to this project, via the surface portal.
    signature: 'listSnapshots(): SurfaceSnapshot[]'
    returns: list<SurfaceSnapshot>
  - name: listPinnedExternals
    description: >-
      The bound project's declared externals with their lock entries and pinned snapshots, via the
      surface portal — the owner's gate judges references into other projects against these alone.
    signature: 'listPinnedExternals(): list<PinnedExternal>'
    returns: list<PinnedExternal>
    params: []
  - name: getExternalsStatus
    description: >-
      Each declared external of the bound project compared at signature level with its live
      producer, via the surface portal — what a family run turns into EXTERNAL_INCOMPATIBLE,
      EXTERNAL_DRIFTED and EXTERNAL_CHECK_UNAVAILABLE, and the advisory pass
      (family_validator.advise) into EXTERNAL_LIVE_INCOMPATIBLE, EXTERNAL_DRIFTED and
      EXTERNAL_LIVE_UNCOMPARED. The caller must gate on reach itself: a producer outside the
      request's reach comes back outOfReach, unread.
    signature: 'getExternalsStatus(offline?: bool): list<ExternalStatus>'
    returns: list<ExternalStatus>
    params:
      - name: offline
        type: bool
        description: Read no producer over the network (the advisory pass asks offline)
        optional: true
  - name: pinnedParent
    description: >-
      A part's pinned parent, via the surface portal — what the owner's gate opened at a part judges
      it against alone (stage 8); null at a project.
    signature: 'pinnedParent(): PinnedParent?'
    returns: PinnedParent?
    params: []
  - name: unrecordedUses
    description: >-
      The uses of each pinned external of the bound project its pin does not record, keyed by alias,
      via the surface portal — what a project's approval owes before it can be re-approved
      (family_validator.approvals, unrecorded).
    signature: 'unrecordedUses(): map<string, list<string>>'
    returns: map<string, list<string>>
    params: []
    effect: read
  - name: memberApprovedSurfaces
    description: >-
      Each live member of the bound project projected at the approval it is judged against, keyed by
      alias, via the surface portal — what binding conformance names a name a member dropped since
      its approval against.
    signature: 'memberApprovedSurfaces(): map<string, SurfaceSnapshot>'
    returns: map<string, SurfaceSnapshot>
    params: []
    effect: io
  - name: memberStatuses
    description: >-
      Each live member of the bound project compared with the approval it is judged against, via the
      surface portal — what a member's relation health reads beyond the gate's resolution failures.
    signature: 'memberStatuses(): list<ExternalStatus>'
    returns: list<ExternalStatus>
    params: []
    effect: io
status: complete
createdAt: '2026-07-10T23:14:09.299Z'
updatedAt: '2026-10-09T11:38:46.576Z'
