id: ivalidator_surfaces_adapter
name: Validator Surfaces Adapter Interface
description: Surface-snapshot loading for validation-time resolution of cross-tree and remote references.
component: validator_surfaces_adapter
methods:
  - name: listSnapshots
    description: All surface snapshots available to this project, via the surface portal.
    signature: 'listSnapshots(): SurfaceSnapshot[]'
    returns: SurfaceSnapshot[]
  - name: listMountSnapshots
    description: >-
      The surface snapshots held inside each chained mount, keyed by mount namespace, via the
      surface portal — so a reference made FROM inside a mount resolves against the contracts that
      mount imported, and only such a reference.
    signature: 'listMountSnapshots(mounts: string[]): MountSurfaceSnapshots[]'
    returns: MountSurfaceSnapshots[]
    params:
      - name: mounts
        type: string[]
status: complete
