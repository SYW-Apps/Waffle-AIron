id: ivalidator_surfaces_adapter
name: Validator Surfaces Adapter Interface
description: >-
  The validator's hop into sdd_surfaces: the bound root's own foreign surface snapshots and its
  pinned externals for the owner's gate, and the externals status a family run composes from.
component: validator_surfaces_adapter
methods:
  - name: listSnapshots
    description: All surface snapshots available to this project, via the surface portal.
    signature: 'listSnapshots(): SurfaceSnapshot[]'
    returns: list<SurfaceSnapshot>
  - name: listPinnedExternals
    description: >-
      The bound project's declared externals with their lock entries and pinned snapshots, via the
      surface portal — the owner's gate judges references into other projects against these alone.
    signature: 'listPinnedExternals(): list<PinnedExternal>'
    returns: list<PinnedExternal>
    params: []
  - name: getExternalsStatus
    description: >-
      Each declared external of the bound project compared at signature level with its live
      producer, via the surface portal — what a family run turns into EXTERNAL_INCOMPATIBLE,
      EXTERNAL_DRIFTED and EXTERNAL_CHECK_UNAVAILABLE. The caller must gate on reach itself: a
      producer outside the request's reach comes back outOfReach, unread.
    signature: 'getExternalsStatus(): list<ExternalStatus>'
    returns: list<ExternalStatus>
    params: []
  - name: pinnedParent
    description: >-
      A part's pinned parent, via the surface portal — what the owner's gate opened at a part judges
      it against alone (stage 8); null at a project.
    signature: 'pinnedParent(): PinnedParent?'
    returns: PinnedParent?
    params: []
status: complete
createdAt: '2026-07-10T23:14:09.299Z'
updatedAt: '2026-10-04T10:19:46.518Z'
