id: ibackup_repository
name: Backup Repository Interface
description: >-
  Facade contract for backup metadata and archive operations. Callers interact with this contract
  instead of private backup storage blocks or archive targets.
component: backup_repository
methods:
  - name: createBackup
    description: >-
      Create a backup record, write the archive through the owned archive adapter, verify it
      according to policy, update the backup record, and return the final metadata.
    signature: 'createBackup(scope: string, policy: BackupPolicy, actor: PrincipalSubject): BackupRecord'
    returns: BackupRecord
    params:
      - name: scope
        type: string
      - name: policy
        type: BackupPolicy
      - name: actor
        type: PrincipalSubject
  - name: listBackups
    description: List backup records visible for a scope, optionally filtered by status.
    signature: 'listBackups(scope: string, status: string): BackupRecord[]'
    returns: BackupRecord[]
    params:
      - name: scope
        type: string
        optional: true
      - name: status
        type: string
        optional: true
  - name: getBackup
    description: Return one backup record by id, or null when absent.
    signature: 'getBackup(id: string): BackupRecord | null'
    returns: BackupRecord | null
    params:
      - name: id
        type: string
  - name: validateRestore
    description: >-
      Validate that a restore request references an available verified backup and is feasible for
      the selected scope; does not write data.
    signature: 'validateRestore(request: RestoreRequest): DiagnosticCheckResult[]'
    returns: DiagnosticCheckResult[]
    params:
      - name: request
        type: RestoreRequest
  - name: restoreBackup
    description: >-
      Restore a verified backup after approval, either in place or as a copy depending on
      RestoreRequest. Returns redacted restore summary.
    signature: 'restoreBackup(request: RestoreRequest): string'
    returns: string
    params:
      - name: request
        type: RestoreRequest
  - name: pruneBackups
    description: Apply retention policy to backup records and archives, returning the number pruned.
    signature: 'pruneBackups(policy: BackupPolicy): number'
    returns: number
    params:
      - name: policy
        type: BackupPolicy
status: draft
createdAt: '2026-07-09T09:09:47.183Z'
updatedAt: '2026-07-09T09:09:47.185Z'
