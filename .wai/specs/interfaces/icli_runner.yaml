id: icli_runner
name: CLI Runner Interface
description: Interface contract for handling command line inputs and executing CLI actions.
component: cli_runner
methods:
  - name: runInit
    description: >-
      Initializes a new wairon workspace and exports static skills. Writes NO agent files:
      component-implementer generation (generateComponentImplementers) and owner-file
      materialization (materializeAgentFiles) both default OFF — per-subsystem agents are served as
      live MCP briefs, and the injected guides + skills are the only per-tool artifacts.
    signature: 'runInit(options: { yes?: boolean }): Promise<void>'
    returns: Promise<void>
  - name: runGenerate
    description: >-
      Reconciles the generated outputs to the configured state. Agent-file materialization is OPT-IN
      via rules.materializeAgentFiles (default off): when ON, generates per-subsystem
      owner/architect files rendered through the SAME live brief composition (so file, tool, and
      resource surfaces are one text) and prunes stale managed files against the FULL resolved
      topology; when OFF (the default), the desired state is ZERO agent files — any leftover
      wairon:managed agent files are removed once, and only guides and skills are (re)injected.
      Hand-authored files and .wai/agents/ guidance files are never touched either way.
    signature: >-
      runGenerate(options: { target?: string; domain?: string; domains?: string; root?: boolean;
      dryRun?: boolean }): Promise<void>
    returns: Promise<void>
  - name: runValidate
    description: Runs architectural validations on project configs and spec trees
    signature: 'runValidate(options: { ci?: boolean }): Promise<void>'
    returns: Promise<void>
  - name: runList
    description: Lists all dynamically resolved agents
    signature: 'runList(): Promise<void>'
    returns: Promise<void>
  - name: runShow
    description: Shows details for a single dynamically resolved agent
    signature: 'runShow(id: string): Promise<void>'
    returns: Promise<void>
  - name: runUpdate
    description: Checks for updates or performs self-updates
    signature: 'runUpdate(options: { check?: boolean; channel?: string }): Promise<void>'
    returns: Promise<void>
  - name: runHostProject
    description: >-
      Admin project lifecycle against the hosting control plane (create | list | destroy), reading
      the master credential from the environment.
    signature: 'runHostProject(action: string, options: object): Promise<void>'
    returns: Promise<void>
  - name: runHostKey
    description: Admin API-key lifecycle against the hosting control plane (mint | revoke | list).
    signature: 'runHostKey(action: string, options: object): Promise<void>'
    returns: Promise<void>
  - name: runHostLock
    description: Validate-as-complete and write the commit-scoped lock record for a hosted project.
    signature: 'runHostLock(options: { project?: string }): Promise<void>'
    returns: Promise<void>
  - name: runHostPromote
    description: Promote a locked project after re-checking that its current StateId still matches the lock.
    signature: 'runHostPromote(options: { project?: string }): Promise<void>'
    returns: Promise<void>
  - name: runProduce
    description: >-
      Project the local project's specs to a producer target (e.g. notion), resolving the credential
      from flag, env, or an interactive prompt.
    signature: 'runProduce(target: string, options: { page?: string; token?: string }): Promise<void>'
    returns: Promise<void>
  - name: runSubsystemAdd
    description: >-
      Add an L1 subsystem to the current project. With --project-path it creates an external
      (chained) subproject: wires the parent subsystem spec and scaffolds an isolated child wairon
      project at that path.
    signature: >-
      runSubsystemAdd(id: string, options: { projectPath?: string; name?: string; yes?: boolean }):
      Promise<void>
    returns: Promise<void>
  - name: runSubsystemMove
    description: >-
      Relocate an external subsystem to a new directory: moves the subproject folder and updates its
      projectPath link in one step (wairon subsystem move).
    signature: 'runSubsystemMove(id: string, options: { projectPath?: string }): Promise<void>'
    returns: Promise<void>
  - name: runSubsystemExternalize
    description: >-
      Migrate an internal subsystem out into a standalone subproject at --project-path (moves specs,
      mounts via projectPath, rewrites references). Source code is moved by the user.
    signature: 'runSubsystemExternalize(id: string, options: { projectPath?: string }): Promise<void>'
    returns: Promise<void>
  - name: runSubsystemInternalize
    description: >-
      Migrate an external subsystem's specs back into the parent tree and delete its child .wai
      project.
    signature: 'runSubsystemInternalize(id: string): Promise<void>'
    returns: Promise<void>
  - name: runSurface
    description: >-
      Surface exchange commands: export (own surface, optionally as OpenAPI), import
      (exchanged/authored foreign surface), list (stored snapshots), generate-children (write parent
      snapshots into chained children). For an OpenAPI export of a multi-portal project, `--portal
      <id>` selects one API; without it `--out` writes one file per portal and stdout lists the
      available portals instead of printing nothing.
    signature: >-
      runSurface(action: string, options: { audience?: string; format?: string; out?: string;
      source?: string; origin?: string; portal?: string }): Promise<void>
    returns: Promise<void>
  - name: runPacks
    description: >-
      Deprecated alias of `wairon pack` for the add | list | remove subset — forwards to the packs
      adapter. Kept for back-compat; new usage should prefer `wairon pack`.
    signature: 'runPacks(action: string): void'
    returns: void
    params:
      - name: action
        type: string
  - name: runRules
    description: Handle `wairon rules list`, printing the active conformance rule set.
    signature: 'runRules(): void'
    returns: void
    params: []
  - name: runPatterns
    description: Handle `wairon patterns list`, printing the pack-declared reusable pattern definitions.
    signature: 'runPatterns(): void'
    returns: void
    params: []
  - name: runVariants
    description: >-
      Handle `wairon variants list`, printing the component variants declared in the registry
      (global + project).
    signature: 'runVariants(): void'
    returns: void
    params: []
  - name: runPack
    description: >-
      Handle the unified `wairon pack <action>` (init | build | add | list | remove), dispatching to
      the packs adapter. The primary pack UX; `wairon packs` remains as a deprecated alias
      (runPacks).
    signature: 'runPack(action: string): void'
    returns: void
    params:
      - name: action
        type: string
  - name: runLock
    description: >-
      The local `wairon lock` workflow: gate on the as-complete dry-run validation (refusing to
      freeze an invalid tree), lock the tree through the lock adapter, regenerate the family and
      sibling surface snapshots into every chained child when the tree mounts any, and refresh the
      generated agent/skill outputs. Post-lock guidance points sessions at the live MCP briefs
      (sdd_get_agent_brief) — it no longer instructs a session restart, because brief content is
      composed per call and is already current.
    signature: 'runLock(options: LockOptions): void'
    returns: void
    params:
      - name: options
        type: LockOptions
        description: 'CLI flags: --yes (skip confirmation), --subsystem (scope narrowing), --recursive.'
  - name: runAgent
    description: >-
      Handle `wairon agent <action> <id>`: `brief` prints the agent's LIVE delegation brief
      (composed from the current tree — the CLI window into what sdd_get_agent_brief serves);
      `customize` scaffolds the user-owned project guidance file .wai/agents/<id>.md from the
      current brief (a header explaining that spec facts are inferred live plus the subsystem
      description as a starting point) and REFUSES when the file already exists — it is user-owned,
      never regenerated, never pruned.
    signature: 'runAgent(action: string, id: string): Promise<void>'
    returns: Promise<void>
    params:
      - name: action
        type: string
        description: brief | customize
      - name: id
        type: string
        description: The resolved agent id.
status: complete
