id: ihosted_spec_upgrade
name: Hosted Spec Upgrade Interface
description: >-
  Plan, and with apply write, the spec-tree rollout migrations of every hosted project. The data
  root and audit policy are wiring supplied ahead of the contract's parameters.
component: hosted_spec_upgrade
methods:
  - name: migrateReachability
    description: >-
      At every hosted project record that holds its own tree (a part retired into its parent is its
      parent's), plan the migration onto the reachability model; with apply, write it and audit each
      project it rewrote as migration.reachability. A project whose migration fails is answered with
      why and the next one continues. Without apply nothing is written; applying twice finds nothing
      the second time.
    signature: 'migrateReachability(apply: bool): list<HostedReachMigration>'
    returns: list<HostedReachMigration>
    params:
      - name: apply
        type: bool
    guarantees:
      - idempotent
status: complete
createdAt: '2026-10-06T19:54:26.539Z'
updatedAt: '2026-10-06T19:54:27.183Z'
