id: icore_portal
name: Core Portal Interface
description: Inbound Portal contract for the core subsystem, exposing services to client adapters.
component: core_portal
methods:
  - name: loadSystemSpec
    description: Loads the system spec
    signature: 'loadSystemSpec(): SystemSpec | null'
    returns: SystemSpec | null
  - name: loadSubsystemSpecs
    description: Loads subsystem specs
    signature: 'loadSubsystemSpecs(): SubsystemSpec[]'
    returns: SubsystemSpec[]
  - name: loadComponentSpecs
    description: Loads component specs
    signature: 'loadComponentSpecs(): ComponentSpec[]'
    returns: ComponentSpec[]
  - name: loadInterfaceSpecs
    description: Loads interface specs
    signature: 'loadInterfaceSpecs(): InterfaceSpec[]'
    returns: InterfaceSpec[]
  - name: loadImplementationSpecs
    description: Loads implementation specs
    signature: 'loadImplementationSpecs(): ImplementationSpec[]'
    returns: ImplementationSpec[]
  - name: resolveAgentTopology
    description: Resolves dynamic agent topology
    signature: 'resolveAgentTopology(): AgentRecord[]'
    returns: AgentRecord[]
  - name: loadSubsystemSpec
    description: Loads a single subsystem spec by id
    signature: 'loadSubsystemSpec(id: string): SubsystemSpec | null'
    returns: SubsystemSpec | null
  - name: loadComponentSpec
    description: Loads a single component spec by id
    signature: 'loadComponentSpec(id: string): ComponentSpec | null'
    returns: ComponentSpec | null
  - name: loadInterfaceSpec
    description: Loads a single interface spec by id
    signature: 'loadInterfaceSpec(id: string): InterfaceSpec | null'
    returns: InterfaceSpec | null
  - name: loadImplementationSpec
    description: Loads a single implementation spec by id
    signature: 'loadImplementationSpec(id: string): ImplementationSpec | null'
    returns: ImplementationSpec | null
  - name: saveSystemSpec
    description: Persists the L0 system spec (sdd_initialize_system write path)
    signature: 'saveSystemSpec(spec: SystemSpec): void'
    returns: void
  - name: saveSubsystemSpec
    description: Persists an L1 subsystem spec (sdd_add_subsystem write path)
    signature: 'saveSubsystemSpec(spec: SubsystemSpec): void'
    returns: void
  - name: saveComponentSpec
    description: Persists an L2 component spec (sdd_add_component write path)
    signature: 'saveComponentSpec(spec: ComponentSpec): void'
    returns: void
  - name: saveInterfaceSpec
    description: Persists an L3 interface spec (sdd_define_interface / sdd_set_endpoints write path)
    signature: 'saveInterfaceSpec(spec: InterfaceSpec): void'
    returns: void
  - name: saveImplementationSpec
    description: Persists an L4 implementation spec (sdd_write_narrative write path)
    signature: 'saveImplementationSpec(spec: ImplementationSpec): void'
    returns: void
  - name: provisionProject
    description: >-
      Bootstrap a fresh isolated project at the bound root: default project.yaml plus an L0 system
      spec named `name`.
    signature: 'provisionProject(name: string): void'
    returns: void
  - name: computeStateId
    description: Compute the deterministic content hash (StateId) of the current spec tree.
    signature: 'computeStateId(): StateId'
    returns: StateId
  - name: readLockRecord
    description: Read the current commit-scoped lock record, or null if the project is unlocked.
    signature: 'readLockRecord(): LockRecord | null'
    returns: LockRecord | null
  - name: writeLockRecord
    description: Persist a commit-scoped lock record.
    signature: 'writeLockRecord(record: LockRecord): void'
    returns: void
  - name: renderDiagram
    description: >-
      Render the current project's spec tree into the requested diagram format and return the
      artifact string.
    signature: 'renderDiagram(format: string): string'
    returns: string
  - name: createChainedSubsystem
    description: >-
      Write path for chained-subsystem creation (wairon subsystem add / init external-subsystem
      branch): wire the parent L1 subsystem with a projectPath and scaffold the child project at
      that path.
    signature: 'createChainedSubsystem(subsystem: SubsystemSpec, projectName: string): void'
    returns: void
  - name: moveSubsystemProject
    description: >-
      Write path for relocating an external subsystem (wairon subsystem move /
      sdd_move_subsystem_project): move the subproject directory and update its projectPath link.
    signature: 'moveSubsystemProject(subsystemId: string, newProjectPath: string): void'
    returns: void
  - name: externalizeSubsystem
    description: >-
      Write path for externalizing an internal subsystem into a standalone subproject (wairon
      subsystem externalize / sdd_externalize_subsystem): move its spec subtree out, mount it via
      projectPath, and rewrite cross-subsystem references.
    signature: 'externalizeSubsystem(subsystemId: string, projectPath: string): void'
    returns: void
  - name: internalizeSubsystem
    description: >-
      Write path for internalizing an external subsystem back into the parent tree (wairon subsystem
      internalize / sdd_internalize_subsystem): move its spec subtree back, drop projectPath, delete
      the child project, and rewrite references.
    signature: 'internalizeSubsystem(subsystemId: string): void'
    returns: void
  - name: loadTypeSpecs
    description: Loads type specs
    signature: 'loadTypeSpecs(): TypeSpec[]'
    returns: TypeSpec[]
  - name: dryRunSerializeSpecs
    description: >-
      Re-serialize every loaded spec in memory through the exact save-path pipeline (relativization
      + writer schema, no I/O) and return the refusal issues (ROUNDTRIP_SERIALIZATION). Accepts an
      optional scope predicate so scoped validation skips out-of-scope specs before serializing.
    signature: 'dryRunSerializeSpecs(include?: (specId: string) => boolean): ValidationIssue[]'
    returns: ValidationIssue[]
  - name: buildProjectGraph
    description: >-
      Project the current project's spec tree into a level-filtered WebGraphModel and return it (the
      live JSON graph the hosting server serves to the web UI).
    signature: 'buildProjectGraph(level: number): WebGraphModel'
    returns: WebGraphModel
    params:
      - name: level
        type: number
  - name: loadProjectExtensions
    description: >-
      Load and merge the extension packs governing the current project (global then project scope)
      into a single LoadedExtensions — the published surface other subsystems (validator, skills,
      CLI) consume for pack rules, profiles, languages, skills, and pattern definitions.
    signature: 'loadProjectExtensions(): LoadedExtensions'
    returns: LoadedExtensions
    params: []
  - name: resolveChainingParent
    description: >-
      Report the chaining-mount context of the bound root (parent root + mounting subsystem id), or
      null — including when the bound request may not read above its root. Pure 1:1 forward.
    signature: 'resolveChainingParent(): ChainingParentRef | null'
    returns: ChainingParentRef | null
  - name: computeStateIdAt
    description: >-
      Compute the current state hash of the project at the given root (read-only bind). Pure 1:1
      forward.
    signature: 'computeStateIdAt(root: string): string | null'
    returns: string | null
    params:
      - name: root
        type: string
  - name: readLockState
    description: >-
      Forward to core_orchestrator.readLockState: resolve the lock against the gate identity the
      caller computed now
    signature: 'readLockState(current: StateId): LockStatus'
    returns: LockStatus
    params:
      - name: current
        type: StateId
        description: The gate identity as it stands now
  - name: composeAgentBrief
    description: >-
      Compose the live delegation brief for one resolved agent (rendered instructions + scope
      fields). Pure 1:1 forward.
    signature: 'composeAgentBrief(agentId: string): AgentBrief'
    returns: AgentBrief
    params:
      - name: agentId
        type: string
  - name: exportSpecTree
    description: >-
      Packs the bound project's whole spec tree (its own .wai plus every chained subproject) into a
      .waitree archive with provenance
    signature: 'exportSpecTree(includeDerived?: boolean): TreeExportResult'
    returns: TreeExportResult
    params:
      - name: includeDerived
        type: boolean
        optional: true
  - name: importSpecTree
    description: >-
      Imports a .waitree archive into a project root under an explicit import policy, backing up any
      tree it replaces
    signature: 'importSpecTree(archive: bytes, options: TreeImportOptions): TreeImportResult'
    returns: TreeImportResult
    params:
      - name: archive
        type: bytes
      - name: options
        type: tree_import_options
  - name: currentChildPins
    description: >-
      The approved StateId of every chained child mounted under this root, keyed by mount id — what
      an approval records so a later check can tell whether a child moved. A child with no approval
      of its own contributes no entry.
    signature: 'currentChildPins(mounts: SubsystemSpec[], root?: string): Record<string, string>'
    returns: Record<string, string>
    params:
      - name: mounts
        type: SubsystemSpec[]
        description: The subsystem specs whose projectPath mounts a chained child
      - name: root
        type: string
        description: The parent project root; the bound project when omitted
        optional: true
  - name: captureApprovedSpecs
    description: >-
      Capture the CURRENT spec tree as approved: one content digest per spec file, keyed by path
      relative to the project root. A chained child's own specs are excluded — the trees are
      approved separately, and the parent pins the child's StateId instead. An optional scope
      narrows the capture to one subsystem, leaving everything outside with whatever approval it
      already had. Records a decision; the caller gates it, and the caller persists it on the lock
      record.
    signature: 'captureApprovedSpecs(root?: string, scope?: ApprovalScope): Record<string, string>'
    returns: Record<string, string>
    params:
      - name: root
        type: string
        optional: true
      - name: scope
        type: ApprovalScope
        optional: true
  - name: localApprover
    description: >-
      Who to record as having approved a lock taken on THIS machine, where wairon has no account of
      its own. Prefers the git author identity (`user.name <user.email>`) — the one identity the
      repository already attributes work to, so a reviewer can match it against the author of the
      commit carrying the lock — and falls back to user@hostname. Never throws and never prompts: a
      lock must not fail because a name could not be resolved.
    signature: 'localApprover(): ApproverIdentity'
    returns: ApproverIdentity
    params: []
  - name: resolveSubprojectForNamespace
    description: Resolve a chained mount's namespace to its project root, or null. Pure 1:1 forward.
    signature: 'resolveSubprojectForNamespace(namespace: string): string | null'
    returns: string | null
    params:
      - name: namespace
        type: string
  - name: loadProjectConfig
    description: >-
      Published read: the bound project's configuration, or null when it has none — straight through
      the project config Repository.
    signature: 'loadProjectConfig(): ProjectConfig | null'
    returns: ProjectConfig | null
    params: []
    guarantees:
      - idempotent
  - name: projectConfigExists
    description: 'Published read: whether the bound project has a configuration file.'
    signature: 'projectConfigExists(): boolean'
    returns: boolean
    params: []
    guarantees:
      - idempotent
  - name: declaresGlobalPacks
    description: >-
      Published read: whether the bound project's configuration sets `extensions.useGlobalPacks`
      explicitly.
    signature: 'declaresGlobalPacks(): boolean'
    returns: boolean
    params: []
    guarantees:
      - idempotent
  - name: createProjectConfig
    description: >-
      Published write: write a fresh configuration for a project that has none. Routed through the
      core orchestrator.
    signature: 'createProjectConfig(config: ProjectConfig): void'
    returns: void
    params:
      - name: config
        type: ProjectConfig
  - name: upsertPackSelection
    description: >-
      Published write: select a pack by name, moving a re-selected pack last; returns whether an
      earlier selection was replaced. Routed through the core orchestrator.
    signature: 'upsertPackSelection(selection: PackSelection): boolean'
    returns: boolean
    params:
      - name: selection
        type: PackSelection
    guarantees:
      - idempotent
  - name: removePackSelection
    description: >-
      Published write: deselect a pack by name, leaving path references alone; returns whether
      anything was dropped. Routed through the core orchestrator.
    signature: 'removePackSelection(packName: string): boolean'
    returns: boolean
    params:
      - name: packName
        type: string
    guarantees:
      - idempotent
  - name: setProjectType
    description: 'Published write: set the governing `projectType`. Routed through the core orchestrator.'
    signature: 'setProjectType(projectType: string): void'
    returns: void
    params:
      - name: projectType
        type: string
    guarantees:
      - idempotent
  - name: recordProfileSelection
    description: >-
      Published write: record the profile selection hosted policy applied. Routed through the core
      orchestrator.
    signature: 'recordProfileSelection(selection: ProjectProfileSelection): void'
    returns: void
    params:
      - name: selection
        type: ProjectProfileSelection
    guarantees:
      - idempotent
  - name: setExecutionTier
    description: 'Published write: set `execution.tier`. Routed through the core orchestrator.'
    signature: 'setExecutionTier(tier: string): void'
    returns: void
    params:
      - name: tier
        type: string
    guarantees:
      - idempotent
  - name: registerPackRef
    description: >-
      Published write: register a legacy pack path reference when it is absent; returns whether it
      was added. Routed through the core orchestrator.
    signature: 'registerPackRef(ref: string): boolean'
    returns: boolean
    params:
      - name: ref
        type: string
    guarantees:
      - idempotent
  - name: deregisterPackRef
    description: >-
      Published write: drop a legacy pack path reference that matches exactly; returns whether
      anything was dropped. Routed through the core orchestrator.
    signature: 'deregisterPackRef(ref: string): boolean'
    returns: boolean
    params:
      - name: ref
        type: string
    guarantees:
      - idempotent
  - name: markSelectionsBundled
    description: >-
      Published write: record bundled packs on their selections in place, in one write. Routed
      through the core orchestrator.
    signature: 'markSelectionsBundled(bundled: PackSelection[]): void'
    returns: void
    params:
      - name: bundled
        type: PackSelection[]
    guarantees:
      - idempotent
  - name: ensureProjectInitialized
    description: >-
      Write path for completing a project's bootstrap non-destructively (wairon init, the generate
      cascade): the default configuration and the L0 system spec, each only when absent.
    signature: 'ensureProjectInitialized(fallbackName: string): ProjectBootstrap'
    returns: ProjectBootstrap
    params:
      - name: fallbackName
        type: string
        description: The project name to use when no system spec names one yet
    guarantees:
      - idempotent
  - name: listDirectChainedSubprojects
    description: 'Published read: the direct chained subprojects of a project root, one level deep.'
    signature: 'listDirectChainedSubprojects(projectRoot: string): ChainedSubprojectDir[]'
    returns: ChainedSubprojectDir[]
    params:
      - name: projectRoot
        type: string
        description: The project whose own spec tree declares the mounts
    guarantees:
      - idempotent
  - name: defaultPackSelections
    description: >-
      Published read: the store packs that apply by default, as selections for a new project's
      configuration.
    signature: 'defaultPackSelections(): PackSelection[]'
    returns: PackSelection[]
    params: []
    guarantees:
      - idempotent
  - name: consumedContractInputs
    description: >-
      Forward to core_orchestrator.consumedContractInputs: the consumed contract inputs a verdict
      can consult
    signature: 'consumedContractInputs(): string[]'
    returns: string[]
    params: []
  - name: renameComponent
    description: 'Forward to core_orchestrator.renameComponent: rename a component and every reference to it'
    signature: 'renameComponent(componentId: string, newId: string): ComponentRename'
    returns: ComponentRename
    params:
      - name: componentId
        type: string
        description: The component to rename
      - name: newId
        type: string
        description: Its new id
  - name: retireSpecialists
    description: >-
      Forward to core_orchestrator.retireSpecialists: plan, and with apply write, the migration off
      the retired Specialist stereotype
    signature: 'retireSpecialists(apply: boolean): SpecialistRetirement'
    returns: SpecialistRetirement
    params:
      - name: apply
        type: boolean
        description: Write the plan; false plans without writing
  - name: renameMethod
    description: 'Forward to core_orchestrator.renameMethod: rename a contract method and every reference to it'
    signature: >-
      renameMethod(componentId: string, methodName: string, newName: string, pinSymbol?: boolean):
      MethodRename
    returns: MethodRename
    params:
      - name: componentId
        type: string
        description: The component whose contract method is renamed
      - name: methodName
        type: string
        description: The method name as it stands
      - name: newName
        type: string
        description: Its new name, a camel-case identifier
      - name: pinSymbol
        type: boolean
        description: >-
          Whether an implementation that declares no symbol is pinned to the old name; true when
          omitted
        optional: true
  - name: updateSpec
    description: >-
      Published write: apply a partial delta to one stored spec of any level and persist the result,
      answering with exactly what changed and with every path the delta named that changed nothing.
      Refuses a spec that does not exist, a mis-selected kind on the singleton L0, and a delta key
      the level's canonical schema does not know. Compares the result with what is stored and writes
      NOTHING when they match. A dry run runs the whole write and answers with the report it would
      have produced, leaving the stored bytes untouched. The caller's hooks, when given, judge the
      merged spec at the last point before anything reaches disk — which is how the authoring seam
      gates a write from above without the store ever calling the rule engine that reads it. A
      mechanical write passes no hooks and stays ungated. Routed through the core orchestrator.
    signature: >-
      updateSpec(kind: string, id: string, delta: SpecDelta, hooks?: SpecWriteHooks, dryRun?:
      boolean): SpecChangeReport
    returns: SpecChangeReport
    params:
      - name: kind
        type: string
        description: system, subsystem, component, interface, implementation or type
      - name: id
        type: string
        description: The stored spec's id; informational for the singleton L0
      - name: delta
        type: SpecDelta
        description: The partial change to merge, shaped like the spec, carrying the delta's own verbs
      - name: hooks
        type: SpecWriteHooks
        description: >-
          The authoring caller's write-boundary judgement; a mechanical write passes none and stays
          ungated
        optional: true
      - name: dryRun
        type: boolean
        description: Report what the delta would do and write nothing
        optional: true
  - name: repairForeignStepFields
    description: >-
      Forward to core_orchestrator.repairForeignStepFields: plan, and with apply write, the removal
      of every narrative-step field its own step type cannot have. Without apply nothing is written.
    signature: 'repairForeignStepFields(apply: boolean): ForeignFieldRepair[]'
    returns: ForeignFieldRepair[]
    params:
      - name: apply
        type: boolean
        description: Write the repair; false plans without writing
  - name: loadTypeSpec
    description: Read one type specification by id.
    signature: 'loadTypeSpec(id: string): TypeSpec | null'
    returns: TypeSpec | null
    params:
      - name: id
        type: string
        description: The type's id
  - name: saveTypeSpec
    description: Persist a type specification, answering with the placement notices the write owes.
    signature: 'saveTypeSpec(spec: TypeSpec): string[]'
    returns: string[]
    params:
      - name: spec
        type: TypeSpec
        description: The type to persist
  - name: moveMethods
    description: >-
      Forward to core_orchestrator.moveMethods: move contract methods to another component, carrying
      their implementations and retargeting every reference to them
    signature: >-
      moveMethods(from: string, to: string, methods: string[], hooks?: SpecWriteHooks, dryRun?:
      boolean): MethodMoveReport
    returns: MethodMoveReport
    params:
      - name: from
        type: string
        description: The component id the methods currently belong to
      - name: to
        type: string
        description: The component id that should receive them
      - name: methods
        type: string[]
        description: The method names to move
      - name: hooks
        type: SpecWriteHooks
        description: The judgement to run on the resulting components at the write boundary
        optional: true
      - name: dryRun
        type: boolean
        description: Report what the move would do and write nothing
        optional: true
  - name: deleteSubsystemSpec
    description: 'Forward to the spec loader: delete a subsystem''s spec document. False when it was not there.'
    signature: 'deleteSubsystemSpec(id: string): boolean'
    returns: boolean
    params:
      - name: id
        type: string
        description: The subsystem id
  - name: deleteComponentSpec
    description: 'Forward to the spec loader: delete a component''s spec document. False when it was not there.'
    signature: 'deleteComponentSpec(id: string): boolean'
    returns: boolean
    params:
      - name: id
        type: string
        description: The component id
  - name: deleteInterfaceSpec
    description: 'Forward to the spec loader: delete an interface''s spec document. False when it was not there.'
    signature: 'deleteInterfaceSpec(id: string): boolean'
    returns: boolean
    params:
      - name: id
        type: string
        description: The interface id
  - name: deleteImplementationSpec
    description: >-
      Forward to the spec loader: delete an implementation's spec document. False when it was not
      there.
    signature: 'deleteImplementationSpec(id: string): boolean'
    returns: boolean
    params:
      - name: id
        type: string
        description: The implementation id
  - name: deleteTypeSpec
    description: 'Forward to the spec loader: delete a type''s spec document. False when it was not there.'
    signature: 'deleteTypeSpec(id: string): boolean'
    returns: boolean
    params:
      - name: id
        type: string
        description: The type id
  - name: diffAgainstApproval
    description: >-
      What differs between this tree and the approval on record: which specs were added, changed or
      removed, and which are untouched. Null when the project was never approved — a different
      answer from approved and drifted.
    signature: 'diffAgainstApproval(root?: string): ApprovalDiff | null'
    returns: ApprovalDiff | null
    params:
      - name: root
        type: string
        description: The project root; the bound project when omitted
        optional: true
  - name: approvalRecord
    description: The approval record this project carries, or null when it has none.
    signature: 'approvalRecord(root?: string): LockRecord | null'
    returns: LockRecord | null
    params:
      - name: root
        type: string
        description: The project root; the bound project when omitted
        optional: true
  - name: movedChildren
    description: >-
      Which chained children sit at a different pin than the approval recorded, each with the pin it
      was approved at and the pin it is at now — null when the child no longer has an approval of
      its own. Published here for the same reason the rest of the approval surface is: the local
      lock and the hosted admin plane both approve through this Portal, and a caller reaching past
      it into the approval module crosses a subsystem boundary the architecture does not allow.
    signature: 'movedChildren(mounts: SubsystemSpec[], root?: string): ChildPinDrift[]'
    returns: ChildPinDrift[]
    params:
      - name: root
        type: string
        description: The parent project root; the bound project when omitted
        optional: true
      - name: mounts
        type: SubsystemSpec[]
        description: The subsystem specs whose projectPath mounts a chained child
  - name: settledSpecPaths
    description: >-
      The spec paths the approval on record covers, as a set for membership tests; null when there
      is no record. Published here because the validator needs it to tell an approved spec from an
      unapproved one, and the validator reaching into the approval module directly would cross a
      subsystem boundary the Portal exists to be.
    signature: 'settledSpecPaths(root?: string): Set<string> | null'
    returns: Set<string> | null
    params:
      - name: root
        type: string
        description: The project root; the bound project when omitted
        optional: true
  - name: generateAll
    description: >-
      Write every agent's file for every target the project configures, answering one summary per
      agent. Published here because `wairon generate` is an sdd_cli command and the generator is an
      sdd_core component — the CLI importing the exporters module directly is the crossing this
      Portal exists to prevent.
    signature: >-
      generateAll(agents: AgentRecord[], config: ProjectConfig, options?: GenerateOptions):
      GenerateSummary[]
    returns: GenerateSummary[]
    params:
      - name: agents
        type: AgentRecord[]
        description: Every agent to write
      - name: config
        type: ProjectConfig
        description: The project's configuration, which names the targets
      - name: options
        type: GenerateOptions
        description: What this run may vary
        optional: true
  - name: resolveExpectedOutputPaths
    description: >-
      Every path a generate run would write for these agents and targets, without rendering or
      writing any of them — how the command knows which files are wairon's own before it prunes or
      reports.
    signature: 'resolveExpectedOutputPaths(agents: AgentRecord[], config: ProjectConfig): Set<string>'
    returns: Set<string>
    params:
      - name: agents
        type: AgentRecord[]
        description: The agents whose outputs to enumerate
      - name: config
        type: ProjectConfig
        description: The project's configuration
  - name: loadRegistry
    description: >-
      The derived agent topology in the Registry shape older callers expect. There is no registry
      file — this wraps the resolver — and it is published here because the MCP server's topology
      tools need the whole shape, not just the records: one of them hands it to the registry
      validator.
    signature: 'loadRegistry(): Registry'
    returns: Registry
    params: []
  - name: resolveDomains
    description: Every domain this project has, derived from subsystems and registered free-standing alike.
    signature: 'resolveDomains(): Domain[]'
    returns: Domain[]
    params: []
  - name: addDomain
    description: >-
      Register a domain the spec tree does not imply, and persist it. Refuses an id that already
      exists in either kind.
    signature: 'addDomain(domain: Domain): void'
    returns: void
    params:
      - name: domain
        type: Domain
        description: The domain to register
  - name: removeDomain
    description: Unregister a free-standing domain. A derived one is removed by removing its subsystem.
    signature: 'removeDomain(id: string): void'
    returns: void
    params:
      - name: id
        type: string
        description: The domain id to unregister
  - name: detectDomainCandidates
    description: >-
      Which directories look like domains nobody has registered yet. Proposals only — nothing here
      writes.
    signature: >-
      detectDomainCandidates(projectRoot: string, trackedPaths?: Set<string>, trackedIds?:
      Set<string>): DetectedDomainCandidate[]
    returns: DetectedDomainCandidate[]
    params:
      - name: projectRoot
        type: string
        description: The repository root to scan
      - name: trackedPaths
        type: Set<string>
        description: Paths already claimed by a registered domain
        optional: true
      - name: trackedIds
        type: Set<string>
        description: Domain ids already in use
        optional: true
  - name: deriveExecutionProfile
    description: >-
      Published read: what an agent's work is like, derived from its topology alone. Forwarded to
      the execution profiler.
    signature: 'deriveExecutionProfile(agent: AgentRecord): ExecutionProfile'
    returns: ExecutionProfile
    params:
      - name: agent
        type: AgentRecord
        description: The resolved agent whose work shape is wanted
    guarantees:
      - idempotent
