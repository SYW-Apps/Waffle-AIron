id: iuser_registry
name: User Registry Interface
description: Private write-path contract for hosted user and service-principal records.
component: user_registry
methods:
  - name: upsert
    description: >-
      Create or update a hosted user record and persist the complete user set atomically for the
      registry's storage backend.
    signature: 'upsert(record: HostedUserRecord): HostedUserRecord'
    returns: HostedUserRecord
    params:
      - name: record
        type: HostedUserRecord
    guarantees:
      - atomic
  - name: setStatus
    description: Set a user's lifecycle status while preserving its identity and grant history fields.
    signature: 'setStatus(id: string, status: string): HostedUserRecord'
    returns: HostedUserRecord
    params:
      - name: id
        type: string
      - name: status
        type: string
    guarantees:
      - atomic
  - name: remapUnitReferences
    description: >-
      Rewrite every user's home unitId and role-binding scopeIds per the remap (a unit rename/move),
      and clear any home unitId or role-binding scoped to a removedScopeId (a cascade-deleted
      subtree). Persist durably and refresh the store.
    signature: 'remapUnitReferences(remap: UnitIdRemap[], removedScopeIds: string[]): void'
    returns: void
    params:
      - name: remap
        type: UnitIdRemap[]
      - name: removedScopeIds
        type: string[]
    guarantees:
      - atomic
status: complete
createdAt: '2026-07-08T20:16:18.364Z'
updatedAt: '2026-07-15T22:49:38.436Z'
