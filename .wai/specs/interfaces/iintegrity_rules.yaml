id: iintegrity_rules
name: Integrity Rules Interface
description: >-
  One method per rule, named after it, in run order. Each takes the run's RuleContext, reports
  through its addIssue, and declares the codes it reports as findings. These rules judge whether the
  spec tree holds together: references, the namespace grammar, the project's identity, the writer
  round-trip, published surfaces and lint allows.
component: integrity_rules
methods:
  - name: hierarchyIntegrity
    description: >-
      Rule hierarchy-integrity. Every subsystem references the system, every component an existing
      subsystem, every interface an existing component, and every implementation an existing
      interface contract. Draft/design specs are reported informationally.
    signature: 'hierarchyIntegrity(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: DRAFT_SUBSYSTEM_WARNING
        severity: warning
        summary: Subsystem is in draft/design status
      - code: DRAFT_COMPONENT_WARNING
        severity: warning
        summary: Component is in draft/design status
      - code: ORPHANED_SUBSYSTEM
        severity: warning
        summary: Subsystem does not reference the L0 system
      - code: INVALID_SUBSYSTEM_REFERENCE
        severity: error
        summary: Reference to a non-existent subsystem
      - code: INVALID_COMPONENT_REFERENCE
        severity: error
        summary: Interface references a non-existent component
      - code: INVALID_INTERFACE_REFERENCE
        severity: error
        summary: Implementation references a non-existent interface contract
  - name: reservedIdSegments
    description: >-
      Rule reserved-id-segments. No segment of a spec id may be the reserved namespace keyword
      "super" — the :: grammar consumes it as a namespace hop, so a stored reference to such an id
      resolves to a different spec.
    signature: 'reservedIdSegments(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: RESERVED_ID_SEGMENT
        severity: error
        summary: Id uses the reserved namespace keyword "super"
  - name: namespaceShadowing
    description: >-
      Rule namespace-shadowing. A subproject-local name must not shadow a root-level subsystem id —
      inside its subproject a bare reference to the shadowed name anchors to the ROOT subsystem, so
      the local spec cannot be addressed reliably.
    signature: 'namespaceShadowing(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: NAMESPACE_SHADOWING
        severity: error
        summary: Subproject-local id shadows a root subsystem id (bare references anchor to the root)
  - name: roundtripSerialization
    description: >-
      Rule roundtrip-serialization. Every loaded spec must re-serialize through the exact writer
      pipeline (same relativization, same schema, no I/O) — validate must predict every refusal that
      lock's status promotion or any later save would otherwise raise mid-write.
    signature: 'roundtripSerialization(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: ROUNDTRIP_SERIALIZATION
        severity: error
        summary: Spec cannot be re-serialized through the writer schema (any save or lock would refuse it)
  - name: typeDeclarations
    description: >-
      Rule type-declarations. A type owned by a subsystem must reference an existing one, and a type
      declaring neither fields nor methods is a placeholder that can inform neither implementers nor
      the ERD.
    signature: 'typeDeclarations(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: INVALID_SUBSYSTEM_REFERENCE
        severity: error
        summary: Type references a non-existent owning subsystem
      - code: HOLLOW_TYPE
        severity: warning
        summary: >-
          Type declares no fields and no methods — a placeholder that informs neither implementers
          nor the ERD
  - name: fieldTypeReferences
    description: >-
      Rule field-type-references. Every type identifier a type field's declared type names must
      resolve to a builtin or a defined entity/value-object type — the type's own generic parameters
      are not field references.
    signature: 'fieldTypeReferences(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: UNDEFINED_TYPE_REFERENCE
        severity: error
        summary: Reference to a type that is not defined anywhere
  - name: signatureTypeReferences
    description: >-
      Rule signature-type-references. Every type identifier an interface method signature names must
      resolve to a builtin, a generic parameter in scope on the interface or the method, or a
      defined entity/value-object type.
    signature: 'signatureTypeReferences(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: UNDEFINED_TYPE_REFERENCE
        severity: error
        summary: Reference to a type that is not defined anywhere
  - name: publicSurfaceBinding
    description: >-
      Rule public-surface-binding. Every declared publicInterface names a backing component, that
      component exists, and the subsystem owns it — a subsystem may only publish its own components.
    signature: 'publicSurfaceBinding(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: PUBLIC_INTERFACE_UNBOUND
        severity: error
        summary: Public interface with no backing component
      - code: PUBLIC_INTERFACE_INVALID_COMPONENT
        severity: error
        summary: Public interface references a non-existent component
      - code: PUBLIC_INTERFACE_FOREIGN_COMPONENT
        severity: error
        summary: Subsystem publishing a component it does not own
  - name: publicSurfaceDeclaredType
    description: >-
      Rule public-surface-declared-type. A publicInterface entry's declared type must be realizable
      by the stereotype of its backing component; Custom entries whose prose implies eventing must
      be backed by an event-capable component.
    signature: 'publicSurfaceDeclaredType(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: PUBLIC_INTERFACE_TYPE_MISMATCH
        severity: error
        summary: Backing component cannot realize the declared interface type
      - code: PUBLIC_INTERFACE_EVENT_MISTYPED
        severity: warning
        summary: Custom interface describing eventing backed by a non-event component
  - name: publicSurfaceBoundContract
    description: >-
      Rule public-surface-bound-contract. A publicInterface entry that binds an L3 interface must
      bind one that exists and that belongs to the component the entry publishes.
    signature: 'publicSurfaceBoundContract(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: PUBLIC_INTERFACE_INVALID_INTERFACE
        severity: error
        summary: Bound L3 interface missing or belonging to another component
  - name: lintAllows
    description: >-
      Rule lint-allows. Per-spec lint suppressions (lint.allow) must name real issue codes and
      actually suppress a finding — unknown codes and stale allows are flagged. An allow covers
      exactly the occurrence it names: a finding that reports a site is silenced only by an allow
      whose `at` is that site, a finding that reports none only by an allow that names none, and an
      aggregating finding only by an allow whose `covers` lists every unit it reports — a unit
      nobody listed is named back as new instead of inheriting a decision taken about its
      neighbours. So a coarse allow left on a rule that names sites, and an allow whose site the run
      no longer reports, are both UNUSED_LINT_ALLOW, and the finding names the sites that did fire.
      Allows silence warnings and notices; errors always surface.
    signature: 'lintAllows(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: UNKNOWN_LINT_ALLOW_CODE
        severity: warning
        summary: lint.allow names an issue code no registered rule emits
      - code: UNUSED_LINT_ALLOW
        severity: warning
        summary: >-
          lint.allow entry matched no finding this run — the code never fired, or it fired at sites
          this allow does not name
  - name: publicSurfaceConsumers
    description: >-
      Rule public-surface-consumers. Every subsystem a published surface names as its consumer must
      exist in the tree. A consumers list restricts who may depend on the surface, so an id that
      names nothing locks the surface against a caller nobody can be — and a typo there silently
      locks out the caller that was meant, which the boundary rule would then report against the
      wrong party.
    signature: 'publicSurfaceConsumers(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: PUBLIC_INTERFACE_UNKNOWN_CONSUMER
        severity: error
        summary: A published surface names as its consumer a subsystem the tree does not have
  - name: projectIdentity
    description: >-
      Rule project-identity. A project is keyed on its id, so the id must be declared, well-formed
      and stable: a project that declares none answers to one derived from its display name until it
      writes one (PROJECT_ID_DEFAULTED), a project whose name yields no id or whose declared id
      breaks the grammar has nothing reliable to key on (PROJECT_ID_AMBIGUOUS), and an id that
      differs from the one the lock approved has moved under everything that keyed on it
      (PROJECT_ID_CHANGED).
    signature: 'projectIdentity(ctx: RuleContext): void'
    returns: void
    params:
      - name: ctx
        type: RuleContext
        description: The validation run's shared read model and issue sink
    findings:
      - code: PROJECT_ID_AMBIGUOUS
        severity: warning
        summary: 'Project has no usable id: its name yields no slug, or its declared id breaks the grammar'
      - code: PROJECT_ID_CHANGED
        severity: error
        summary: Project id differs from the id the lock approved
      - code: PROJECT_ID_DEFAULTED
        severity: notice
        summary: Project declares no id; it answers to one derived from its display name
status: complete
