id: isurface_portal
name: Surface Portal Interface
description: >-
  Front-door contract of the surface-exchange subsystem: export, import, query, and child-generation
  operations.
component: surface_portal
methods:
  - name: exportSurface
    description: >-
      Project the own tree's L0 gateway surface (entries at or below the audience ceiling) into a
      contract-grade snapshot; optionally render it through a codec format (native | openapi) and
      write it to an output path. OpenAPI rendering produces one document per backing public portal
      (renderedSet); a project with a single gateway portal yields a single document (also surfaced
      as `rendered`).
    signature: >-
      exportSurface(maxAudience: string, format: string, outPath?: string, portalId?: string):
      SurfaceSnapshot
    returns: SurfaceSnapshot
    params:
      - name: maxAudience
        type: string
        description: 'Audience ceiling: project | department | instance | partner | external'
      - name: format
        type: string
        description: native | openapi
      - name: outPath
        type: string
        optional: true
      - name: portalId
        type: string
        description: >-
          For an openapi export, narrow it to this one portal's document; a portalId naming no
          portal is rejected
        optional: true
  - name: importSurface
    description: >-
      Import a foreign surface document (native snapshot YAML or OpenAPI) and store it with the
      given origin (exchanged | authored).
    signature: 'importSurface(sourcePath: string, origin: string): SurfaceSnapshot'
    returns: SurfaceSnapshot
    params:
      - name: sourcePath
        type: string
      - name: origin
        type: string
        description: exchanged | authored
  - name: listSnapshots
    description: >-
      All stored surface snapshots available to this project (imported plus received
      parent-generated).
    signature: 'listSnapshots(): SurfaceSnapshot[]'
    returns: list<SurfaceSnapshot>
  - name: getSnapshot
    description: The stored snapshot produced by the named project, or null.
    signature: 'getSnapshot(projectName: string): SurfaceSnapshot?'
    returns: SurfaceSnapshot?
    params:
      - name: projectName
        type: string
  - name: removeSnapshot
    description: Remove a stored surface snapshot (file and projection).
    signature: 'removeSnapshot(projectName: string): bool'
    returns: bool
    params:
      - name: projectName
        type: string
  - name: pinExternals
    description: >-
      Pin the bound project's declared externals (the named aliases, else all): snapshots under
      .wai/externals/ and the lock at .wai/externals.lock.yaml. The caller must gate on reach
      itself.
    signature: 'pinExternals(aliases?: list<string>): list<ExternalPin>'
    returns: list<ExternalPin>
    params:
      - name: aliases
        type: list<string>
        description: The aliases to pin; all declared externals when omitted
        optional: true
  - name: getExternalsStatus
    description: >-
      Report each declared external's pin against its live producer at signature level; what cannot
      be compared is EXTERNAL_CHECK_UNAVAILABLE. Writes nothing.
    signature: 'getExternalsStatus(): list<ExternalStatus>'
    returns: list<ExternalStatus>
    params: []
  - name: listExternals
    description: List the bound project's declared externals, how each resolves and what is pinned for it.
    signature: 'listExternals(): list<ExternalListing>'
    returns: list<ExternalListing>
    params: []
  - name: listFamilyPins
    description: >-
      The stage-1 family pins (generated family and sibling snapshots) the bound root still holds,
      for the chaining migration to convert and delete. Pure 1:1 forward to the orchestrator.
    signature: 'listFamilyPins(): list<FamilyPin>'
    returns: list<FamilyPin>
    params: []
    guarantees:
      - idempotent
  - name: listPinnedExternals
    description: >-
      The bound project's declared externals, each with its lock entry and pinned snapshot, read
      from its own .wai/externals files only — what the owner's gate judges a reference into another
      project against. Pure 1:1 forward.
    signature: 'listPinnedExternals(): list<PinnedExternal>'
    returns: list<PinnedExternal>
    params: []
  - name: renamePin
    description: >-
      Carry the bound project's pin of one external to its new alias or producer id without
      re-pinning (digest and used map unchanged). The caller must gate on reach itself.
    signature: 'renamePin(alias: string, newAlias: string, project: string): bool'
    returns: bool
    params:
      - name: alias
        type: string
        description: The pinned alias as declared now
      - name: newAlias
        type: string
        description: The alias to keep the pin under
      - name: project
        type: string
        description: The producer id the pin records from now on
    guarantees:
      - idempotent
  - name: unpin
    description: >-
      Remove the bound project's pin of one alias — lock entry and snapshot. The caller must gate on
      reach itself.
    signature: 'unpin(alias: string): bool'
    returns: bool
    params:
      - name: alias
        type: string
        description: The alias whose pin goes
    guarantees:
      - idempotent
  - name: pinnedParent
    description: >-
      A part's pinned parent — its lock's parent entry and the excerpt it names, read from its own
      .wai/externals files only — what the owner's gate opened at a part judges against (stage 8);
      null at a project. Pure 1:1 forward.
    signature: 'pinnedParent(): PinnedParent?'
    returns: PinnedParent?
    params: []
status: complete
