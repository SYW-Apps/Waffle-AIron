id: iskills_orchestrator
name: Skills Orchestrator Interface
description: Orchestrator contract for exporting local filesystem skills.
component: skills_orchestrator
methods:
  - name: export
    description: >-
      Export the built-in SDD skills via the exporter, for the passed target types or the project's
      enabled targets, returning what was written.
    signature: 'export(targetTypes?: string[]): SkillsExportResult'
    returns: SkillsExportResult
    params:
      - name: targetTypes
        type: string[]
        description: The target types to export into; omitted means the project's enabled targets
        optional: true
  - name: listNames
    description: The names of the built-in SDD skills, forwarded to the exporter.
    signature: 'listNames(): string[]'
    returns: string[]
    params: []
  - name: checkFreshness
    description: >-
      How a target's installed skills compare with what an export would write now, forwarded to the
      exporter.
    signature: 'checkFreshness(type: string): SkillFreshness'
    returns: SkillFreshness
    params:
      - name: type
        type: string
status: complete
createdAt: '2026-06-19T12:00:00Z'
updatedAt: '2026-09-25T21:33:51.181Z'
