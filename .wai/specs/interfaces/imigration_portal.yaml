id: imigration_portal
name: Migration Portal Interface
description: >-
  Plan, apply, discard, recover — every door's entry to a family migration. A plan writes nothing
  into the family; an apply makes the whole plan live or none of it; nothing is ever locked.
component: migration_portal
methods:
  - name: plan
    description: >-
      Plan a family migration from the bound project (routed to the family migration workflow).
      Writes nothing into the family.
    signature: 'plan(request: MigrationRequest): MigrationPlan'
    returns: MigrationPlan
    params:
      - name: request
        type: MigrationRequest
        description: The verb and its arguments
  - name: apply
    description: Apply a confirmed plan all or nothing (routed to the family migration workflow).
    signature: 'apply(plan: MigrationPlan): FamilyMigrationReport'
    returns: FamilyMigrationReport
    params:
      - name: plan
        type: MigrationPlan
        description: The plan as plan() answered it
  - name: discard
    description: Drop a plan without applying it (routed to the family migration workflow).
    signature: 'discard(plan: MigrationPlan): void'
    returns: void
    params:
      - name: plan
        type: MigrationPlan
        description: The plan
  - name: recover
    description: >-
      Report or resolve the unfinished transactions under a project root — doctor's entry (routed to
      the family migration workflow).
    signature: 'recover(root: string, fix: bool): list<RecoveredTransaction>'
    returns: list<RecoveredTransaction>
    params:
      - name: root
        type: string
        description: The project root
      - name: fix
        type: bool
        description: Resolve, or only report
  - name: matchPositions
    description: >-
      The positional match (routed to position_reader.match): for each unresolved reference, the
      explicit form that replaces the retired position-based reading — the same answer the chaining
      migration's positional step writes from, so the upgrade report (verdict_changes) explains
      exactly what `doctor --fix` would write. Pure; writes nothing.
    signature: >-
      matchPositions(unresolved: list<AuthoredReference>, family: ProjectFamily, tables:
      list<ResolvedExportTable>, types: list<TypeSpec>): list<PositionalMatch>
    returns: list<PositionalMatch>
    params:
      - name: unresolved
        type: list<AuthoredReference>
        description: The references to read, from the family top's scan
      - name: family
        type: ProjectFamily
        description: The family top's graph
      - name: tables
        type: list<ResolvedExportTable>
        description: Every project's resolved L0 export table
      - name: types
        type: list<TypeSpec>
        description: Every type the family top's scan loaded
  - name: rehearse
    description: >-
      Route to the family transaction: open a rehearsal over a scope. Published for the hosted
      member upgrade, which scopes the host data directory and its store files instead of a family's
      .wai trees, runs its repository writers against the copy, and commits the difference through
      the same transaction. The caller must gate on reach itself.
    signature: 'rehearse(scope: TransactionScope): Rehearsal'
    returns: Rehearsal
    params:
      - name: scope
        type: TransactionScope
        description: The coordinator root, the owner roots and the areas to copy
  - name: diff
    description: >-
      Route to the family transaction: the rehearsal's difference from the live owners. Writes
      nothing.
    signature: 'diff(rehearsal: Rehearsal): list<FileChange>'
    returns: list<FileChange>
    params:
      - name: rehearsal
        type: Rehearsal
    guarantees:
      - idempotent
  - name: commit
    description: >-
      Route to the family transaction: make the changes live all or nothing — staged, backed up,
      journaled under each owner's .wai/transactions/<id>/, swapped, the coordinator marked
      committed; any failure before the commit point restores every backup, and a crash leaves a
      journal recover rolls back. The rehearsal is dropped either way.
    signature: 'commit(rehearsal: Rehearsal, changes: list<FileChange>, verb: string): TransactionOutcome'
    returns: TransactionOutcome
    params:
      - name: rehearsal
        type: Rehearsal
      - name: changes
        type: list<FileChange>
      - name: verb
        type: string
        description: The journal's verb, e.g. member-upgrade
    guarantees:
      - atomic
  - name: drop
    description: >-
      Route to the family transaction: discard a rehearsal without committing it (a dry run, or a
      refused plan). Writes nothing live.
    signature: 'drop(rehearsal: Rehearsal): void'
    returns: void
    params:
      - name: rehearsal
        type: Rehearsal
    guarantees:
      - idempotent
status: complete
