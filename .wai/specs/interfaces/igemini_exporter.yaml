id: igemini_exporter
name: Gemini Agent File Exporter Interface
description: The Exporter shape, bound to the format Gemini's CLI reads.
component: gemini_exporter
methods:
  - name: export
    description: >-
      Write the agent's file in Gemini's format, carrying the wairon-managed banner so the file is
      recognisable as generated. Answers `unchanged` without touching the file when it already holds
      exactly this.
    signature: 'export(ctx: ExportContext): ExportResult'
    returns: ExportResult
    params:
      - name: ctx
        type: ExportContext
        description: The agent, its rendered instructions, and the target this write is for
  - name: outputPath
    description: Where this write would land, without rendering or writing anything.
    signature: 'outputPath(ctx: ExportContext): string'
    returns: string
    params:
      - name: ctx
        type: ExportContext
        description: The agent and target, less the rendered instructions
    guarantees:
      - idempotent
status: complete
createdAt: '2026-09-20T19:45:38.860Z'
updatedAt: '2026-09-20T19:45:38.872Z'
