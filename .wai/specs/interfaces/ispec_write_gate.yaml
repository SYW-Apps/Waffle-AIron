id: ispec_write_gate
name: Spec Write Gate Interface
description: >-
  The gated spec writes every access path shares. A write that violates an intrinsic rule throws
  with the rule codes and nothing reaches disk, so the remedy is to fix the arguments and call again
  rather than to repair a saved spec. A write that changes nothing writes nothing and reports that
  it did not.
component: spec_write_gate
methods:
  - name: addComponent
    description: >-
      Author a NEW L2 component: judge the candidate against the intrinsic rules with the project's
      own severities, refuse it on an error before anything touches disk, and otherwise persist it.
      Returns the candidate's warnings as notices, followed by the store's placement notices.
    signature: 'addComponent(candidate: ComponentSpec): string[]'
    returns: string[]
    params:
      - name: candidate
        type: ComponentSpec
        description: The component as the caller authored it
    invokedBy:
      kind: sibling-subsystem
      caller: >-
        The sdd_add_component MCP tool in sdd_mcp calls this directly rather than through the core
        portal, because the gate deliberately sits above the portal's ungated store writes; a
        cross-subsystem dependsOn may only enter through a published Portal, so that edge cannot be
        drawn in the model.
  - name: updateSpecGated
    description: >-
      Patch an existing spec of any level through the same gate, by injecting the component
      candidate judgement into the store's delta update as a write hook. An update can introduce a
      misplaced field as easily as a create can, and unlike a create it can change the componentType
      out from under fields that were legal before. Answers with the change report: exactly what
      changed, or that nothing did and nothing was written.
    signature: 'updateSpecGated(kind: string, id: string, delta: object): SpecChangeReport'
    returns: SpecChangeReport
    params:
      - name: kind
        type: string
        description: system, subsystem, component, interface, implementation or type
      - name: id
        type: string
        description: The stored spec's id
      - name: delta
        type: object
        description: The partial change to merge, shaped like the spec, carrying the delta's own verbs
    invokedBy:
      kind: sibling-subsystem
      caller: >-
        The sdd_update_spec MCP tool in sdd_mcp calls this directly, for the same reason as
        addComponent: the gate sits above sdd_core's published portal, which serves the ungated
        mechanical writes.
status: complete
