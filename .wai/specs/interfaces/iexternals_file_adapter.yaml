id: iexternals_file_adapter
name: Externals File Adapter Interface
description: >-
  File I/O for the inputs aggregate at the bound root: .wai/inputs.lock.yaml and the snapshots under
  .wai/externals/<alias>.yaml.
component: externals_file_adapter
methods:
  - name: readLock
    description: >-
      Parse .wai/inputs.lock.yaml at the bound root; null when absent. A malformed lock is refused
      with a clear error, never read as empty: an empty lock would silently unpin everything. A
      leftover .wai/externals.lock.yaml (the v6 file) is refused with "run `wairon upgrade`",
      whether or not the new file exists.
    signature: 'readLock(): InputsLock?'
    returns: InputsLock?
    params: []
  - name: writeLock
    description: >-
      Write .wai/inputs.lock.yaml, aliases and pack names sorted, overwriting it atomically. A lock
      with no entry left (no external, no parent, no pack) deletes the file instead, as the
      externals directory goes with its last snapshot.
    signature: 'writeLock(lock: InputsLock): void'
    returns: void
    params:
      - name: lock
        type: InputsLock
  - name: readSnapshot
    description: Parse .wai/externals/<alias>.yaml; null when absent or malformed.
    signature: 'readSnapshot(alias: string): SurfaceSnapshot?'
    returns: SurfaceSnapshot?
    params:
      - name: alias
        type: string
  - name: writeSnapshot
    description: >-
      Write .wai/externals/<alias>.yaml, creating the directory when missing and overwriting
      atomically.
    signature: 'writeSnapshot(alias: string, snapshot: SurfaceSnapshot): void'
    returns: void
    params:
      - name: alias
        type: string
      - name: snapshot
        type: SurfaceSnapshot
  - name: deleteSnapshot
    description: Remove .wai/externals/<alias>.yaml and report whether a file existed.
    signature: 'deleteSnapshot(alias: string): bool'
    returns: bool
    params:
      - name: alias
        type: string
  - name: readExcerpt
    description: >-
      Read .wai/externals/<parent id>.yaml as a part's pinned parent excerpt (stage 8); null when
      absent or malformed.
    signature: 'readExcerpt(project: string): ParentExcerpt?'
    returns: ParentExcerpt?
    params:
      - name: project
        type: string
        description: The parent's project id
  - name: writeExcerpt
    description: >-
      Write a part's parent excerpt to .wai/externals/<parent id>.yaml, creating the directory when
      missing and overwriting atomically.
    signature: 'writeExcerpt(excerpt: ParentExcerpt): void'
    returns: void
    params:
      - name: excerpt
        type: ParentExcerpt
        description: The excerpt, named by its project
status: complete
