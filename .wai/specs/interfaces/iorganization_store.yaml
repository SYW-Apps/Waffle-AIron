id: iorganization_store
name: Organization Store Interface
description: >-
  Private contract for the authoritative in-memory hosted organization state — units and placements
  — loaded from and swapped as two collections held in one backing file (organization.json under the
  hosted data root).
component: organization_store
methods:
  - name: load
    description: >-
      Load both persisted collections (organization units and project placements) from the
      organization.json file under the hosted data root and hold them as the authoritative in-memory
      representation, returning them together.
    signature: 'load(): OrganizationState'
    returns: OrganizationState
    params: []
  - name: replaceAll
    description: >-
      Atomically swap both in-memory collections to the supplied complete unit and placement sets
      after the registry has persisted them.
    signature: 'replaceAll(units: OrganizationUnitRecord[], placements: ProjectPlacement[]): void'
    returns: void
    params:
      - name: units
        type: OrganizationUnitRecord[]
      - name: placements
        type: ProjectPlacement[]
lint:
  allow:
    - code: UNUSED_METHOD
      at: load
      reason: >-
        The read-through store's hydration is called by the repository FACADE, not by a member:
        every exported facade function in src/server/organization.ts constructs the store, calls
        load(), and only then forwards to the registry or index. A Repository facade narrative is
        held to a single call step (FACADE_FORWARDING), so that hydration call has nowhere to live
        in the model and load has no modelled caller. The shape that fixes it already exists in this
        tree — surface_repository.hydrate forwards to surface_registry.hydrateFromFiles — and this
        family predates it. Modelling the hydration that way (or letting the facade doctrine carry a
        hydrate-then-forward pair) is the decision owed; declaring a call from the registry or index
        would be declaring one the code does not make.
status: complete
