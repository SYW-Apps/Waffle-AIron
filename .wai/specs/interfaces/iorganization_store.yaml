id: iorganization_store
name: Organization Store Interface
description: >-
  Private contract for the authoritative in-memory hosted organization state — units and placements
  — loaded from and swapped as two collections held in one backing file (organization.json under the
  hosted data root).
component: organization_store
methods:
  - name: load
    description: >-
      Read organization.json fresh (units and placements; no in-memory copy). A missing file yields
      the empty state; an unreadable file or structurally invalid JSON fails with a storage error
      naming the path.
    signature: 'load(): OrganizationState'
    returns: OrganizationState
    params: []
  - name: update
    description: >-
      Read the organization state fresh and persist what the change makes of it (units and
      placements are one file, so one update changes both), holding the file's write lock
      (file_write_lock) across both, so a writer in another process that reads and writes the same
      file in between is never lost; a change that throws writes nothing; a file that exists but
      cannot be read or parsed throws. Answers the state written.
    signature: 'update(change: (state: OrganizationState) => OrganizationState): OrganizationState'
    returns: OrganizationState
    effect: write
lint:
  allow:
    - code: UNUSED_METHOD
      at: load
      reason: >-
        The read-through store's hydration is called by the repository FACADE, not by a member:
        every exported facade function in src/server/organization.ts constructs the store, calls
        load(), and only then forwards to the registry or index. A Repository facade narrative is
        held to a single call step (FACADE_FORWARDING), so that hydration call has nowhere to live
        in the model and load has no modelled caller. Modelling the hydration as a facade method of
        its own that forwards to the read-back (or letting the facade doctrine carry a
        hydrate-then-forward pair) is the decision owed; declaring a call from the registry or index
        would be declaring one the code does not make.
status: complete
