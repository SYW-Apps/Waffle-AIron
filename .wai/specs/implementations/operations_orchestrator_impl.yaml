id: operations_orchestrator_impl
name: Operations Orchestrator Implementation
description: >-
  Read-only hosted operational insight workflows: authenticate the caller, gather organization data
  and resolve operations:read scope, narrow the hosted project records to the caller's scope, then
  assemble instance health reports, resource usage snapshots, and advisory quota observations.
  Performs no writes and no audit.
contract: ioperations_orchestrator
sourcePath: src/server/operations.ts
methods:
  - name: getHealthReport
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential (bootstrap or user-bound token)
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Compute the caller's project-read visible scopes over the organization tree
        type: call
        targetComponent: authorization_specialist
        targetMethod: visibleScopes
      - stepNumber: 3
        description: If the caller has no actionable project scope, deny
        type: branch
        condition: the caller has no actionable project scope in the visible set
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the health read
        type: throw
        error: Forbidden — operations read access required
      - stepNumber: 5
        description: List all hosted project records
        type: call
        targetComponent: project_registry
        targetMethod: list
      - stepNumber: 6
        description: >-
          Narrow the hosted project records to those actionable in the visible set (an
          instance-admin keeps every project)
        type: local
      - stepNumber: 7
        description: >-
          List the server-global packs across both tiers (image and instance), tier-tagged and
          shadow-marked
        type: call
        targetComponent: pack_registry
        targetMethod: listGlobalPacks
      - stepNumber: 8
        description: >-
          Derive the image-tier and instance-tier pack name listings from the tier-tagged global
          pack descriptors
        type: local
      - stepNumber: 9
        description: For each in-scope hosted project record, read its declared pack/profile references
        type: loop
        loopKind: forEach
        over: the in-scope hosted project records
        endStep: 10
      - stepNumber: 10
        description: Read the project's pack/profile references from its isolated root
        type: call
        targetComponent: pack_registry
        targetMethod: readProjectReferences
      - stepNumber: 11
        description: Gather the cross-project relations sourced from in-scope projects (relation-health inputs)
        type: call
        targetComponent: project_relation_repository
        targetMethod: list
      - stepNumber: 12
        description: For each distinct relation target project
        type: loop
        loopKind: forEach
        over: the distinct relation target projects
        endStep: 13
      - stepNumber: 13
        description: >-
          Fetch the target's stored public-surface snapshot for interface-drift checking (a missing
          snapshot is itself a finding)
        type: call
        targetComponent: public_surface_repository
        targetMethod: getSnapshot
      - stepNumber: 14
        description: >-
          Derive redacted diagnostic checks from the in-scope project records, the two pack-tier
          name listings, the per-project references, and the relation-health inputs
        type: call
        targetComponent: diagnostics_specialist
        targetMethod: runChecks
      - stepNumber: 15
        description: Derive usage snapshots for the requested scope from the in-scope project records
        type: call
        targetComponent: diagnostics_specialist
        targetMethod: collectUsage
      - stepNumber: 16
        description: Assemble the aggregated instance health report from the checks and usage
        type: call
        targetComponent: diagnostics_specialist
        targetMethod: buildHealthReport
      - stepNumber: 17
        description: Return the redacted health report scoped to the caller
        type: return
        outcome: redacted health report
    detail: full
  - name: getUsage
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Compute the caller's project-read visible scopes over the organization tree
        type: call
        targetComponent: authorization_specialist
        targetMethod: visibleScopes
      - stepNumber: 3
        description: If the caller has no actionable project scope, deny
        type: branch
        condition: the caller has no actionable project scope in the visible set
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the usage read
        type: throw
        error: Forbidden — operations read access required
      - stepNumber: 5
        description: List all hosted project records
        type: call
        targetComponent: project_registry
        targetMethod: list
      - stepNumber: 6
        description: >-
          Narrow the hosted project records to those actionable in the visible set (instance-admin
          keeps all)
        type: local
      - stepNumber: 7
        description: Derive usage snapshots for the requested scope from the in-scope project records
        type: call
        targetComponent: diagnostics_specialist
        targetMethod: collectUsage
      - stepNumber: 8
        description: Return the redacted usage snapshots scoped to the caller
        type: return
        outcome: redacted usage snapshots
    detail: full
  - name: evaluateQuota
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Compute the caller's project-read visible scopes over the organization tree
        type: call
        targetComponent: authorization_specialist
        targetMethod: visibleScopes
      - stepNumber: 3
        description: If the caller has no actionable project scope, deny
        type: branch
        condition: the caller has no actionable project scope in the visible set
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the quota read
        type: throw
        error: Forbidden — operations read access required
      - stepNumber: 5
        description: List all hosted project records
        type: call
        targetComponent: project_registry
        targetMethod: list
      - stepNumber: 6
        description: >-
          Narrow the hosted project records to those actionable in the visible set (instance-admin
          keeps all)
        type: local
      - stepNumber: 7
        description: Derive usage snapshots for the requested scope from the in-scope project records
        type: call
        targetComponent: diagnostics_specialist
        targetMethod: collectUsage
      - stepNumber: 8
        description: >-
          Resolve the advisory ResourceQuotaPolicy from the host config, using the secure default
          policy when unset
        type: local
      - stepNumber: 9
        description: >-
          Evaluate the usage snapshots against the advisory quota policy, annotating observe/warn
          messages
        type: call
        targetComponent: quota_specialist
        targetMethod: evaluateUsage
      - stepNumber: 10
        description: Return the advisory quota-annotated usage snapshots scoped to the caller
        type: return
        outcome: advisory quota-annotated usage snapshots
    detail: full
  - name: getExposurePolicy
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: >-
          Resolve the caller's project:admin permission at instance scope (the exposure posture
          gates the whole web surface)
        type: call
        targetComponent: authorization_specialist
        targetMethod: authorize
      - stepNumber: 3
        description: If the effective value is not yes, deny
        type: branch
        condition: the effective project:admin value is not yes
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the exposure read
        type: throw
        error: Forbidden — exposure administration requires instance-level project:admin
      - stepNumber: 5
        description: Read the persisted exposure policy through the policy repository
        type: call
        targetComponent: policy_repository
        targetMethod: getExposurePolicy
      - stepNumber: 6
        description: Substitute the safe default (web UI off, TLS required) when none has been configured
        type: local
      - stepNumber: 7
        description: Return the exposure policy
        type: return
        outcome: exposure policy
  - name: setExposurePolicy
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Resolve the caller's project:admin permission at instance scope
        type: call
        targetComponent: authorization_specialist
        targetMethod: authorize
      - stepNumber: 3
        description: If the effective value is not yes, deny
        type: branch
        condition: the effective project:admin value is not yes
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the exposure change
        type: throw
        error: Forbidden — exposure administration requires instance-level project:admin
      - stepNumber: 5
        description: Replace the exposure policy wholesale through the policy repository
        type: call
        targetComponent: policy_repository
        targetMethod: setExposurePolicy
      - stepNumber: 6
        description: Append a redacted audit event without letting a failure fail the change
        type: try
        endStep: 8
        catches:
          - error: audit append failure
            step: 9
      - stepNumber: 7
        description: >-
          Append the redacted exposure.set audit event (security level) under the active retention
          policy
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 8
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 10
      - stepNumber: 9
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 10
        description: Return the stored exposure policy
        type: return
        outcome: stored exposure policy
lint:
  allow: []
status: complete
