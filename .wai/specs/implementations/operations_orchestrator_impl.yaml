id: operations_orchestrator_impl
name: Operations Orchestrator Implementation
description: >-
  Read-only hosted operational insight workflows: authenticate the caller, gather organization data
  and resolve operations:read scope, narrow the hosted project records to the caller's scope, then
  assemble instance health reports, resource usage snapshots, and advisory quota observations.
  Performs no writes and no audit.
contract: ioperations_orchestrator
sourcePath: src/server/operations.ts
methods:
  - name: getHealthReport
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential (bootstrap or user-bound token)
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Gather all organization units to resolve the caller's operations-read scope
        type: call
        targetComponent: organization_repository
        targetMethod: listUnits
      - stepNumber: 3
        description: Gather all project placements
        type: call
        targetComponent: organization_repository
        targetMethod: listPlacements
      - stepNumber: 4
        description: Resolve the caller's operations:read scope over the organization tree
        type: call
        targetComponent: scope_specialist
        targetMethod: resolveScope
      - stepNumber: 5
        description: >-
          If the caller has no operations-read scope (scope.all is false and the scope is empty — no
          in-scope projects and no in-scope units), deny
        type: branch
        condition: scope.all is false and the scope is empty (no in-scope projects and no in-scope units)
        onTrueStep: 6
        onFalseStep: 7
      - stepNumber: 6
        description: Reject the health read
        type: throw
        error: Forbidden — operations read access required
      - stepNumber: 7
        description: List all hosted project records
        type: call
        targetComponent: project_registry
        targetMethod: list
      - stepNumber: 8
        description: >-
          When scope.all is false, narrow the hosted project records to those whose id is in
          scope.projectIds; when scope.all is true, keep every project (instance-wide operations
          read)
        type: local
      - stepNumber: 9
        description: >-
          List the server-global packs across both tiers (image and instance), tier-tagged and
          shadow-marked
        type: call
        targetComponent: pack_registry
        targetMethod: listGlobalPacks
      - stepNumber: 10
        description: >-
          Derive the image-tier and instance-tier pack name listings from the tier-tagged global
          pack descriptors
        type: local
      - stepNumber: 11
        description: >-
          For each in-scope hosted project record, read its declared pack/profile references,
          accumulating a ProjectPackReference per project
        type: loop
        loopKind: forEach
        over: the in-scope hosted project records
        endStep: 12
      - stepNumber: 12
        description: Read the project's pack/profile references from its isolated root
        type: call
        targetComponent: pack_registry
        targetMethod: readProjectReferences
      - stepNumber: 13
        description: >-
          Derive redacted diagnostic checks from the in-scope project records, the two pack-tier
          name listings, and the per-project references
        type: call
        targetComponent: diagnostics_specialist
        targetMethod: runChecks
      - stepNumber: 14
        description: Derive usage snapshots for the requested scope from the in-scope project records
        type: call
        targetComponent: diagnostics_specialist
        targetMethod: collectUsage
      - stepNumber: 15
        description: Assemble the aggregated instance health report from the checks and usage
        type: call
        targetComponent: diagnostics_specialist
        targetMethod: buildHealthReport
      - stepNumber: 16
        description: Return the redacted health report scoped to the caller
        type: return
        outcome: redacted health report
  - name: getUsage
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Gather all organization units to resolve the caller's operations-read scope
        type: call
        targetComponent: organization_repository
        targetMethod: listUnits
      - stepNumber: 3
        description: Gather all project placements
        type: call
        targetComponent: organization_repository
        targetMethod: listPlacements
      - stepNumber: 4
        description: Resolve the caller's operations:read scope over the organization tree
        type: call
        targetComponent: scope_specialist
        targetMethod: resolveScope
      - stepNumber: 5
        description: >-
          If the caller has no operations-read scope (scope.all is false and the scope is empty),
          deny
        type: branch
        condition: scope.all is false and the scope is empty (no in-scope projects and no in-scope units)
        onTrueStep: 6
        onFalseStep: 7
      - stepNumber: 6
        description: Reject the usage read
        type: throw
        error: Forbidden — operations read access required
      - stepNumber: 7
        description: List all hosted project records
        type: call
        targetComponent: project_registry
        targetMethod: list
      - stepNumber: 8
        description: >-
          When scope.all is false, narrow the hosted project records to those whose id is in
          scope.projectIds; when scope.all is true, keep every project
        type: local
      - stepNumber: 9
        description: Derive usage snapshots for the requested scope from the in-scope project records
        type: call
        targetComponent: diagnostics_specialist
        targetMethod: collectUsage
      - stepNumber: 10
        description: Return the redacted usage snapshots scoped to the caller
        type: return
        outcome: redacted usage snapshots
  - name: evaluateQuota
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Gather all organization units to resolve the caller's operations-read scope
        type: call
        targetComponent: organization_repository
        targetMethod: listUnits
      - stepNumber: 3
        description: Gather all project placements
        type: call
        targetComponent: organization_repository
        targetMethod: listPlacements
      - stepNumber: 4
        description: Resolve the caller's operations:read scope over the organization tree
        type: call
        targetComponent: scope_specialist
        targetMethod: resolveScope
      - stepNumber: 5
        description: >-
          If the caller has no operations-read scope (scope.all is false and the scope is empty),
          deny
        type: branch
        condition: scope.all is false and the scope is empty (no in-scope projects and no in-scope units)
        onTrueStep: 6
        onFalseStep: 7
      - stepNumber: 6
        description: Reject the quota read
        type: throw
        error: Forbidden — operations read access required
      - stepNumber: 7
        description: List all hosted project records
        type: call
        targetComponent: project_registry
        targetMethod: list
      - stepNumber: 8
        description: >-
          When scope.all is false, narrow the hosted project records to those whose id is in
          scope.projectIds; when scope.all is true, keep every project
        type: local
      - stepNumber: 9
        description: Derive usage snapshots for the requested scope from the in-scope project records
        type: call
        targetComponent: diagnostics_specialist
        targetMethod: collectUsage
      - stepNumber: 10
        description: >-
          Resolve the advisory ResourceQuotaPolicy from the host config, using the secure default
          policy when unset
        type: local
      - stepNumber: 11
        description: >-
          Evaluate the usage snapshots against the advisory quota policy, annotating observe/warn
          messages
        type: call
        targetComponent: quota_specialist
        targetMethod: evaluateUsage
      - stepNumber: 12
        description: Return the advisory quota-annotated usage snapshots scoped to the caller
        type: return
        outcome: advisory quota-annotated usage snapshots
status: complete
