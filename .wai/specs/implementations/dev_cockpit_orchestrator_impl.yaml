id: dev_cockpit_orchestrator_impl
name: Dev Cockpit Orchestrator Implementation
description: >-
  src/server/dev-commands.ts: the dev page's reviews and commands, over the core adapter and the
  commands the CLI handed the server in its configuration.
contract: idev_cockpit_orchestrator
sourcePath: src/server/dev-commands.ts
injectedParams:
  - cfg
methods:
  - name: reviews
    narrative:
      - stepNumber: 1
        description: Refuse outside the local development server
        type: branch
        condition: the server is not the local development server
        onFalseStep: 3
      - stepNumber: 2
        description: 'Refuse: reviews are a local development server''s'
        type: throw
        error: not the local development server
      - stepNumber: 3
        description: Authenticate the session
        type: call
        targetComponent: authentication
        targetMethod: authenticateSession
      - stepNumber: 4
        description: Resolve the served project's root, which the requests are read under
        type: call
        targetComponent: project_repository
        targetMethod: existingRoot
      - stepNumber: 5
        description: Read the pending review requests
        type: call
        targetComponent: host_core_adapter
        targetMethod: pendingReviews
      - stepNumber: 6
        description: >-
          Name the direct member projects, each judged at its own root (parts are approved with this
          project and ask here)
        type: call
        targetComponent: host_validator_adapter
        targetMethod: familyApprovals
      - stepNumber: 7
        description: For each direct member project
        type: loop
        loopKind: forEach
        over: the direct member projects
        endStep: 9
      - stepNumber: 8
        description: Bind the member's root, its folder from the served project's member declarations
        type: local
      - stepNumber: 9
        description: Read its pending requests, tagged with its alias
        type: call
        targetComponent: host_core_adapter
        targetMethod: pendingReviews
      - stepNumber: 10
        description: Return them all, the served project's own first
        type: return
        outcome: the pending requests
  - name: decide
    narrative:
      - stepNumber: 1
        description: Refuse outside the local development server, or without the commands the CLI hands it
        type: branch
        condition: the server is not the local development server or has no dev commands
        onFalseStep: 3
      - stepNumber: 2
        description: 'Refuse: deciding is a local development server''s'
        type: throw
        error: not the local development server
      - stepNumber: 3
        description: Authenticate the session
        type: call
        targetComponent: authentication
        targetMethod: authenticateSession
      - stepNumber: 4
        description: Resolve the served project's root, which the request is read and decided under
        type: call
        targetComponent: project_repository
        targetMethod: existingRoot
      - stepNumber: 5
        description: Was the request made in a member project?
        type: branch
        condition: a member alias is named
        onFalseStep: 10
      - stepNumber: 6
        description: Name the direct member projects
        type: call
        targetComponent: host_validator_adapter
        targetMethod: familyApprovals
      - stepNumber: 7
        description: Does the alias name one of them?
        type: branch
        condition: the alias names no direct member project
        onFalseStep: 9
      - stepNumber: 8
        description: Refuse an alias that names no direct member project
        type: throw
        error: no member project of that alias
      - stepNumber: 9
        label: memberRoot
        description: >-
          Bind the member's root, its folder from the served project's member declarations: the
          request is read, decided and, for a lock, locked there
        type: local
      - stepNumber: 10
        label: read
        description: Read the request brought up to date, for its kind and subsystem
        type: call
        targetComponent: host_core_adapter
        targetMethod: reviewStatus
      - stepNumber: 11
        description: Is the decision to lock?
        type: branch
        condition: the outcome is locked
        onFalseStep: 15
      - stepNumber: 12
        description: >-
          Run the CLI's lock at the bound root (of the request's subsystem when it names one),
          capturing what it prints
        type: local
      - stepNumber: 13
        description: 'A failed lock leaves the request pending: answer it with the lock''s output'
        type: branch
        condition: the lock failed
        onFalseStep: 15
      - stepNumber: 14
        description: Answer the pending request and the failed lock
        type: return
        outcome: not locked
      - stepNumber: 15
        label: record
        description: Record the decision with the comment and the notes
        type: call
        targetComponent: host_core_adapter
        targetMethod: decideReview
      - stepNumber: 16
        description: Answer the decided request and, for a lock, its output
        type: return
        outcome: the decision
  - name: run
    narrative:
      - stepNumber: 1
        description: >-
          Refuse outside the local development server, a command it was not handed, or while another
          command runs
        type: branch
        condition: >-
          the server has no dev commands, the command is not lock, generate or doctor, or a command
          is already running
        onFalseStep: 3
      - stepNumber: 2
        description: Refuse, naming the reason
        type: throw
        error: the command cannot run
      - stepNumber: 3
        description: Authenticate the session
        type: call
        targetComponent: authentication
        targetMethod: authenticateSession
      - stepNumber: 4
        description: Is a member project named?
        type: branch
        condition: a member alias is named
        onFalseStep: 9
      - stepNumber: 5
        description: Name the direct member projects
        type: call
        targetComponent: host_validator_adapter
        targetMethod: familyApprovals
      - stepNumber: 6
        description: Is it a lock of one of them?
        type: branch
        condition: >-
          the command is not lock, or the alias names no direct member project (a part is approved
          with the served project)
        onFalseStep: 8
      - stepNumber: 7
        description: 'Refuse: only a direct member project''s lock runs at another root'
        type: throw
        error: only a direct member project can be locked from here
      - stepNumber: 8
        label: memberRoot
        description: >-
          Resolve the member's folder from the served project's member declarations: the lock runs
          there, as `wairon lock` in that folder would
        type: local
      - stepNumber: 9
        label: runIt
        description: >-
          Run the command the CLI handed over, at the member's folder when one is named, capturing
          every line it prints with colour codes removed
        type: local
      - stepNumber: 10
        description: Answer whether it succeeded and its output
        type: return
        outcome: the command's result
  - name: approval
    narrative:
      - stepNumber: 1
        description: Refuse outside the local development server
        type: branch
        condition: the server is not the local development server
        onFalseStep: 3
      - stepNumber: 2
        description: 'Refuse: the approval state is a local development server''s'
        type: throw
        error: not the local development server
      - stepNumber: 3
        description: Authenticate the session
        type: call
        targetComponent: authentication
        targetMethod: authenticateSession
      - stepNumber: 4
        description: Resolve the served project's root, which the approval is read under
        type: call
        targetComponent: project_repository
        targetMethod: existingRoot
      - stepNumber: 5
        description: Read the lock record, for who locked and when
        type: call
        targetComponent: host_core_adapter
        targetMethod: approvalRecord
      - stepNumber: 6
        description: 'Read what the lock says about the tree now: drifted and the moved specs'
        type: call
        targetComponent: host_core_adapter
        targetMethod: approvalVerdict
      - stepNumber: 7
        description: Read the branch the served checkout has now
        type: call
        targetComponent: git_head_adapter
        targetMethod: head
      - stepNumber: 8
        description: Read the served project's system spec, for the name the page heads itself with
        type: call
        targetComponent: host_core_adapter
        targetMethod: loadSystemSpec
      - stepNumber: 9
        description: >-
          Read each direct member project's own approval at its own root, so the page can offer its
          lock and name the reason a member is drifted
        type: call
        targetComponent: host_validator_adapter
        targetMethod: familyApprovals
      - stepNumber: 10
        description: >-
          Read the subsystems the served tree loads and keep its own (a part's included, never a
          member project's): the scopes the lock-scope list offers
        type: call
        targetComponent: host_core_adapter
        targetMethod: loadSubsystemSpecs
      - stepNumber: 11
        description: >-
          Answer the approval state with the branch, the project's name, its member projects' own
          approvals and the lock scopes
        type: return
        outcome: the approval state
  - name: family
    narrative:
      - stepNumber: 1
        description: >-
          Refuse outside the local development server, without the commands the CLI hands it, or
          while another command runs
        type: branch
        condition: the server has no dev commands or a command is already running
        onFalseStep: 3
      - stepNumber: 2
        description: Refuse, naming the reason
        type: throw
        error: the command cannot run
      - stepNumber: 3
        description: Authenticate the session
        type: call
        targetComponent: authentication
        targetMethod: authenticateSession
      - stepNumber: 4
        description: >-
          Check the command against its action's shape: the number of positional arguments, the
          options the action takes, and that no argument or option value starts with `-`
        type: local
      - stepNumber: 5
        description: Is the command malformed?
        type: branch
        condition: the check found a problem
        onFalseStep: 7
      - stepNumber: 6
        description: Refuse, naming the problem
        type: throw
        error: the family command is malformed
      - stepNumber: 7
        description: >-
          Run the family command the CLI handed over (one at a time, shared with run), capturing
          every line it prints with colour codes removed; a thrown error is a failed result
        type: local
      - stepNumber: 8
        description: Answer whether it succeeded and its output
        type: return
        outcome: the command's result
  - name: producers
    narrative:
      - stepNumber: 1
        description: Read the served project's configuration (bound to the root)
        type: call
        targetComponent: host_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 2
        description: No configuration, or one that cannot be read?
        type: branch
        condition: there is no configuration
        onFalseStep: 4
      - stepNumber: 3
        description: Answer none
        type: return
        outcome: no producers
      - stepNumber: 4
        description: >-
          Collect every member whose location is a folder, resolved against the root, as a member
          producer
        type: local
      - stepNumber: 5
        description: >-
          Collect every external whose source is a folder, resolved against the root, as an external
          producer; git and hosted sources are skipped
        type: local
      - stepNumber: 6
        description: Keep only producers whose .wai/ folder exists
        type: local
      - stepNumber: 7
        description: Answer them
        type: return
        outcome: the producers
  - name: upgradeNeed
    narrative:
      - stepNumber: 1
        description: Refuse outside the local development server
        type: branch
        condition: the host is not the local development server
        onFalseStep: 3
      - stepNumber: 2
        description: Refuse
        type: throw
        error: not the local development server
      - stepNumber: 3
        description: Authenticate the session
        type: call
        targetComponent: authentication
        targetMethod: authenticateSession
      - stepNumber: 4
        description: Read the served project's registered root
        type: call
        targetComponent: project_repository
        targetMethod: existingRoot
      - stepNumber: 5
        description: Read the served trees an older major wrote
        type: call
        targetComponent: instance_upgrade
        targetMethod: behind
      - stepNumber: 6
        description: Every served tree on the running major?
        type: branch
        condition: no tree is behind
        onFalseStep: 8
      - stepNumber: 7
        description: 'Answer none: the page shows no popup'
        type: return
        outcome: none
      - stepNumber: 8
        description: >-
          Ask git whether the served checkout has uncommitted changes (`git status --porcelain -- .`
          at the served root, no shell), so the popup warns that the rewrite would land in the same
          diff; git missing, no checkout or any failure reads as none
        type: call
        targetComponent: process_adapter
        targetMethod: run
      - stepNumber: 9
        description: >-
          Answer the trees, the running major, the uncommitted flag and the terminal command
          (`wairon upgrade`, as this install spells it, at the served root)
        type: return
        outcome: DevUpgradeNeed
  - name: upgrade
    narrative:
      - stepNumber: 1
        description: >-
          Refuse outside the local development server, without the handed commands, or while another
          command runs
        type: branch
        condition: >-
          the host is not the local development server, it was handed no commands, or a command is
          running
        onFalseStep: 3
      - stepNumber: 2
        description: Refuse, naming the reason
        type: throw
        error: the command cannot run
      - stepNumber: 3
        description: Authenticate the session
        type: call
        targetComponent: authentication
        targetMethod: authenticateSession
      - stepNumber: 4
        description: Read the served project's registered root
        type: call
        targetComponent: project_repository
        targetMethod: existingRoot
      - stepNumber: 5
        description: Read the served trees an older major wrote
        type: call
        targetComponent: instance_upgrade
        targetMethod: behind
      - stepNumber: 6
        description: Nothing to upgrade?
        type: branch
        condition: no tree is behind
        onFalseStep: 8
      - stepNumber: 7
        description: 'Refuse: there is nothing to upgrade'
        type: throw
        error: every served tree is on the running major
      - stepNumber: 8
        description: >-
          Run the upgrade the CLI handed over at the served root, one command at a time: the report
          when asked, otherwise applied unattended (the page's button is the confirmation),
          capturing every line it prints with colour codes removed; a thrown error is a failed
          result
        type: local
      - stepNumber: 9
        description: Was it applied and did it succeed?
        type: branch
        condition: it was not a report and it succeeded
        onFalseStep: 11
      - stepNumber: 10
        description: >-
          Register the served family again from the upgraded declarations (idempotent), so the page
          reloads onto the upgraded tree without a restart
        type: call
        targetComponent: local_dev_registration
        targetMethod: register
      - stepNumber: 11
        description: Answer whether it succeeded and its output
        type: return
        outcome: the command's result
  - name: openSource
    narrative:
      - stepNumber: 1
        description: Refuse outside the local development server
        type: branch
        condition: the host is not the local development server
        onFalseStep: 3
      - stepNumber: 2
        description: Refuse
        type: throw
        error: not the local development server
      - stepNumber: 3
        description: Authenticate the session
        type: call
        targetComponent: authentication
        targetMethod: authenticateSession
      - stepNumber: 4
        description: Read the served project's registered root
        type: call
        targetComponent: project_repository
        targetMethod: existingRoot
      - stepNumber: 5
        description: >-
          Resolve the file against the served root: refused when it is absolute, escapes the root
          once resolved (symbolic links followed), or is not a file on disk
        type: local
      - stepNumber: 6
        description: Refused?
        type: branch
        condition: the file was refused
        onFalseStep: 8
      - stepNumber: 7
        description: Answer opened false with the reason
        type: return
        outcome: not opened
      - stepNumber: 8
        description: >-
          Choose the editor: the command WAIRON_EDITOR names (its words split, the file and line
          appended as `<file>:<line>`), else `code -g <file>:<line>`; the file passed as one
          argument, never through a shell
        type: local
      - stepNumber: 9
        description: >-
          Start the editor and leave it running; a start that fails (the command is not found) is
          caught
        type: call
        targetComponent: process_adapter
        targetMethod: start
      - stepNumber: 10
        description: >-
          Answer opened true with the editor, or opened false with the reason naming WAIRON_EDITOR
          when no editor could be started
        type: return
        outcome: DevOpenResult
lint:
  allow:
    - code: HIDDEN_STATE
      reason: >-
        The one-command-at-a-time guard: a process-local in-flight flag set and cleared around one
        command run, never read after it ends, and meaningless across processes. No domain state:
        nothing to store, list or recover.
status: complete
