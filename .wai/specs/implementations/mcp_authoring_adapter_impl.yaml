id: mcp_authoring_adapter_impl
name: MCP Authoring Adapter Implementation
description: >-
  Pure 1:1 forwarding into sdd_authoring's front door. An in-process import seam inside
  src/mcp/server.ts — the one import that made the seam's inbound edge real instead of a sentence on
  its contract; swappable for a remote transport without changing the tool handler that calls it.
contract: imcp_authoring_adapter
sourcePath: src/mcp/server.ts
methods:
  - name: updateSpecGated
    narrative:
      - stepNumber: 1
        description: >-
          Call updateSpecGated on the authoring portal: the gate judges the merged candidate and
          refuses it before anything reaches disk, and a dry run runs that same write and answers
          with the report it would have produced
        type: call
        targetComponent: authoring_portal
        targetMethod: updateSpecGated
  - name: moveMethods
    narrative:
      - stepNumber: 1
        description: Forward the sdd_move_methods request to the authoring portal's gate
        type: call
        targetComponent: authoring_portal
        targetMethod: moveMethods
  - name: writeSpec
    narrative:
      - stepNumber: 1
        description: >-
          Call writeSpec on the authoring portal: the seam applies the restatement, judges it and
          writes it, or refuses before anything reaches disk
        type: call
        targetComponent: authoring_portal
        targetMethod: writeSpec
  - name: deleteSpec
    narrative:
      - stepNumber: 1
        description: Call deleteSpec on the authoring portal
        type: call
        targetComponent: authoring_portal
        targetMethod: deleteSpec
status: complete
createdAt: '2026-09-18T21:43:42.731Z'
updatedAt: '2026-09-24T22:22:02.388Z'
