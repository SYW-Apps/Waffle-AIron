id: credential_repository_impl
name: Credential Repository Facade Implementation
description: >-
  Pure 1:1 forwarding facade over the owned credential store, write registry, and index. Reads
  (findByToken, list, listByOwner) go to the index; writes (create, revoke, revokeAllForOwner) to
  the write registry. The facade adds no logic; hashed tokens only, plaintext never stored or
  logged.
contract: icredential_repository
sourcePath: src/server/credentials.ts
injectedParams:
  - dataDir
methods:
  - name: findByToken
    narrative:
      - stepNumber: 1
        description: Forward to the credential index (timing-safe token-hash lookup)
        type: call
        targetComponent: credential_index
        targetMethod: findByToken
    symbol: findByTokenHash
  - name: create
    narrative:
      - stepNumber: 1
        description: Forward to the credential write registry
        type: call
        targetComponent: credential_write_registry
        targetMethod: create
    symbol: createCredential
  - name: revoke
    narrative:
      - stepNumber: 1
        description: Forward to the credential write registry
        type: call
        targetComponent: credential_write_registry
        targetMethod: revoke
    symbol: revokeCredential
  - name: list
    narrative:
      - stepNumber: 1
        description: Forward to the credential index (project-scoped listing)
        type: call
        targetComponent: credential_index
        targetMethod: list
    symbol: listCredentials
  - name: revokeAllForOwner
    narrative:
      - stepNumber: 1
        description: Forward to the credential write registry (per-owner bulk revoke)
        type: call
        targetComponent: credential_write_registry
        targetMethod: revokeAllForOwner
    symbol: revokeAllForOwner
  - name: listByOwner
    narrative:
      - stepNumber: 1
        description: Forward to the credential index (owner-scoped listing)
        type: call
        targetComponent: credential_index
        targetMethod: listByOwner
    symbol: listByOwner
detail: calls-only
status: complete
createdAt: '2026-07-04T12:53:31.855Z'
updatedAt: '2026-09-23T21:19:40.033Z'
