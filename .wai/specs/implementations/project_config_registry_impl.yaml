id: project_config_registry_impl
name: Project Config Registry Implementation
description: >-
  The write path for `.wai/project.yaml`: one intent-level change per method, read and written back
  through the store. Every save goes through one local save step that backfills a defaulted identity
  first: a configuration with no `id` gets project_config.effectiveId() written beside its change
  (none when the name yields no slug).
contract: iproject_config_registry
sourcePath: src/config/project-config.ts
methods:
  - name: create
    narrative: []
    intent: >-
      Refuses with an error naming the project root when a configuration already exists; otherwise
      backfills a missing `id` with the configuration's effective id, validates the configuration
      against the schema and writes it through the store. It never overwrites an existing
      configuration.
    calls:
      - project_config_store.exists
      - project_config_store.write
  - name: upsertPackSelection
    narrative: []
    intent: >-
      Reads the configuration through the store, drops every `extensions.packs` selection naming the
      same pack (path references stay), appends the new selection last, records `useGlobalPacks` at
      its effective value, backfills a defaulted id, and writes it back through the store, where
      unknown keys survive. Returns whether a selection was dropped. Refuses when the project has no
      configuration.
    calls:
      - project_config_store.read
      - project_config_store.write
  - name: removePackSelection
    narrative: []
    intent: >-
      Reads the configuration and drops every selection naming the pack (path references stay). When
      something was dropped, it records `useGlobalPacks` at its effective value, backfills a
      defaulted id and writes the configuration back; otherwise it writes nothing. Returns whether
      anything was dropped. Refuses when the project has no configuration.
    calls:
      - project_config_store.read
      - project_config_store.write
  - name: setProjectType
    narrative: []
    intent: >-
      Reads the configuration, sets `projectType`, backfills a defaulted id, and writes it back
      through the store, leaving every other field and key untouched. Refuses when the project has
      no configuration.
    calls:
      - project_config_store.read
      - project_config_store.write
  - name: recordProfileSelection
    narrative: []
    intent: >-
      Reads the configuration, replaces `profileSelection` with the given selection, backfills a
      defaulted id, and writes it back through the store. Refuses when the project has no
      configuration.
    calls:
      - project_config_store.read
      - project_config_store.write
  - name: setExecutionTier
    narrative: []
    intent: >-
      Reads the configuration, sets `execution.tier` (creating `execution` when absent, keeping its
      overrides), backfills a defaulted id, and writes it back through the store. Refuses when the
      project has no configuration.
    calls:
      - project_config_store.read
      - project_config_store.write
  - name: registerPackRef
    narrative: []
    intent: >-
      Reads the configuration. When no entry equals the reference, it appends the reference, records
      `useGlobalPacks` at its effective value, backfills a defaulted id, and writes the
      configuration back; otherwise it writes nothing. Returns whether the reference was appended.
      Refuses when the project has no configuration.
    calls:
      - project_config_store.read
      - project_config_store.write
  - name: deregisterPackRef
    narrative: []
    intent: >-
      Reads the configuration and drops the path references equal to the given one (selections
      stay). When something was dropped, it records `useGlobalPacks` at its effective value,
      backfills a defaulted id and writes the configuration back; otherwise it writes nothing.
      Returns whether anything was dropped. Refuses when the project has no configuration.
    calls:
      - project_config_store.read
      - project_config_store.write
  - name: markSelectionsBundled
    narrative: []
    intent: >-
      Reads the configuration. For each given pack, every selection of that pack gets the given
      version and `bundle: true` in place, so no entry moves; a pack the project does not select is
      skipped. Records `useGlobalPacks` at its effective value, backfills a defaulted id and writes
      once. Refuses when the project has no configuration.
    calls:
      - project_config_store.read
      - project_config_store.write
  - name: pinGlobalPacksAsSelections
    narrative: []
    intent: >-
      Reads the configuration, appends the given selections after the existing entries, sets
      `useGlobalPacks` to false, backfills a defaulted id, and writes once. Refuses when the project
      has no configuration.
    calls:
      - project_config_store.read
      - project_config_store.write
  - name: rekeyCarried
    narrative:
      - stepNumber: 1
        description: >-
          Read the raw `rules.conformance.carried` — the register as it is WRITTEN, before schema
          defaults, so every index below is the index of the text the store edits
        type: call
        targetComponent: project_config_store
        targetMethod: readField
      - stepNumber: 2
        description: Decide whether there is a register to rekey
        type: branch
        condition: the register is not a list
        onFalseStep: 4
      - stepNumber: 3
        description: 'Answer empty: a project that carries no debt has nothing a move could leave behind'
        type: return
        outcome: no edits
      - stepNumber: 4
        description: Rekey every carried finding
        type: loop
        loopKind: forEach
        over: each finding, of each carried group, that names a spec
        endStep: 5
      - stepNumber: 5
        description: >-
          Rekey its spec, site and covered units with identity_rename.rekeyAnchor; for every key
          that changed, record a scalar edit at its path
          (rules.conformance.carried.<group>.findings.<finding>.spec | at | covers.<unit>) holding
          the old value and the new, and a carried rekey naming the finding by its code, spec and
          site as they stood
        type: local
      - stepNumber: 6
        description: >-
          Hand every edit to the store's comment-preserving rewrite — as a dry run when asked, so a
          caller can prove the edit before its first write. A register the store cannot edit
          precisely raises its refusal here, and nothing is written; no edits writes nothing
        type: call
        targetComponent: project_config_store
        targetMethod: rewriteScalars
      - stepNumber: 7
        description: Answer the carried rekeys, in register order
        type: return
        outcome: rekeyed
    detail: full
detail: intent
status: complete
