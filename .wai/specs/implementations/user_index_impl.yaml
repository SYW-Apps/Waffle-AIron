id: user_index_impl
name: User Index Implementation
description: >-
  Read-path projection over the user store's authoritative record set. Shares the store's
  references, never mutates, never goes stale.
contract: iuser_index
sourcePath: src/server/users.ts
methods:
  - name: getById
    narrative: []
    intent: >-
      Return the store's record whose id matches exactly, or null when absent. Read-only over the
      store's current references; never fails on lookups — absence is a null result, not an error.
    symbol: indexGetById
  - name: findByExternalSubject
    narrative: []
    intent: >-
      Return the single record whose identity binding matches both the issuer and the external
      subject id exactly, or null when no user is bound to that provider identity. Comparison is
      exact and case-sensitive because provider subjects are opaque identifiers.
    symbol: indexFindByExternalSubject
  - name: list
    narrative: []
    intent: >-
      Return the user records filtered by the optional lifecycle status, sorted by id for stable
      pagination. An empty result is a normal outcome, never an error. There is NO project filter
      here: a user record carries no project reference of its own — project membership is a
      permission-grid question the identity orchestrator answers by intersecting this listing with
      the grid's direct assignments.
    symbol: indexList
detail: intent
status: complete
