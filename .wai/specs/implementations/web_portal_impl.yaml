id: web_portal_impl
name: Web Portal Implementation
description: >-
  Browser-facing HTTP boundary for the unified web UI: serves the client app shell/static assets at
  the root, forwards the thin session/SSO/context routes to the web session orchestrator, and the
  graph/canvas routes to the web graph orchestrator that owns them. Session-cookie authenticated;
  the served app reuses every existing scoped endpoint with the session as its credential, so there
  are no per-page server endpoints here.
contract: iweb_portal
sourcePath: src/server/web.ts
injectedParams:
  - cfg
methods:
  - name: serveApp
    narrative:
      - stepNumber: 1
        description: >-
          Return the bundled unified web UI client app shell / static asset for the requested path;
          the app then drives every feature by calling existing endpoints with the session cookie
        type: local
  - name: startSignIn
    narrative:
      - stepNumber: 1
        description: Forward to the web orchestrator
        type: call
        targetComponent: web_session_orchestrator
        targetMethod: startSignIn
  - name: completeSignIn
    narrative:
      - stepNumber: 1
        description: >-
          Forward to the web orchestrator to create the session; the portal then sets the session
          cookie from the returned session id
        type: call
        targetComponent: web_session_orchestrator
        targetMethod: completeSignIn
  - name: signOut
    narrative:
      - stepNumber: 1
        description: Forward to the web orchestrator; the portal then clears the session cookie
        type: call
        targetComponent: web_session_orchestrator
        targetMethod: signOut
  - name: getContext
    narrative:
      - stepNumber: 1
        description: Forward to the web orchestrator's getCurrentContext
        type: call
        targetComponent: web_session_orchestrator
        targetMethod: getCurrentContext
    symbol: getCurrentContext
  - name: getGraph
    narrative:
      - stepNumber: 1
        description: >-
          Forward to the web graph orchestrator, which authenticates the session and returns the
          scoped level-of-detail graph
        type: call
        targetComponent: web_graph_orchestrator
        targetMethod: get
  - name: signOutEverywhere
    narrative:
      - stepNumber: 1
        description: >-
          Forward the session and the arguments the router decoded from the request to
          web_session_orchestrator.signOutEverywhere, and hand back its result for the router to
          encode
        type: call
        targetComponent: web_session_orchestrator
        targetMethod: signOutEverywhere
  - name: devLogin
    narrative:
      - stepNumber: 1
        description: >-
          Forward to the web orchestrator to mint or reuse the local-developer session; the portal
          then sets the session cookie from the returned id and redirects to the app root
        type: call
        targetComponent: web_session_orchestrator
        targetMethod: startDevSession
    symbol: startDevSession
  - name: serveProjectCanvas
    narrative:
      - stepNumber: 1
        description: >-
          Forward the session and the arguments the router decoded from the request to
          web_graph_orchestrator.getProjectCanvas, and hand back its result for the router to encode
        type: call
        targetComponent: web_graph_orchestrator
        targetMethod: getProjectCanvas
    symbol: getProjectCanvas
  - name: adminListUsers
