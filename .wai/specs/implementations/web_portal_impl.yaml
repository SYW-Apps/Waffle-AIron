id: web_portal_impl
name: Web Portal Implementation
description: >-
  Browser-facing HTTP boundary for the unified web UI: serves the client app shell/static assets at
  the root and forwards the thin session/SSO/context/graph routes to the web orchestrator.
  Session-cookie authenticated; the served app reuses every existing scoped endpoint with the
  session as its credential, so there are no per-page server endpoints here.
contract: iweb_portal
sourcePath: src/server/web.ts
methods:
  - name: serveApp
    narrative:
      - stepNumber: 1
        description: >-
          Return the bundled unified web UI client app shell / static asset for the requested path;
          the app then drives every feature by calling existing endpoints with the session cookie
        type: local
  - name: startSignIn
    narrative:
      - stepNumber: 1
        description: Forward to the web orchestrator
        type: call
        targetComponent: web_orchestrator
        targetMethod: startSignIn
  - name: completeSignIn
    narrative:
      - stepNumber: 1
        description: >-
          Forward to the web orchestrator to create the session; the portal then sets the session
          cookie from the returned session id
        type: call
        targetComponent: web_orchestrator
        targetMethod: completeSignIn
  - name: signOut
    narrative:
      - stepNumber: 1
        description: Forward to the web orchestrator; the portal then clears the session cookie
        type: call
        targetComponent: web_orchestrator
        targetMethod: signOut
  - name: getContext
    narrative:
      - stepNumber: 1
        description: Forward to the web orchestrator's getCurrentContext
        type: call
        targetComponent: web_orchestrator
        targetMethod: getCurrentContext
    symbol: getCurrentContext
  - name: getGraph
    narrative:
      - stepNumber: 1
        description: Forward to the web orchestrator's getGraph
        type: call
        targetComponent: web_orchestrator
        targetMethod: getGraph
  - name: signOutEverywhere
    narrative:
      - stepNumber: 1
        description: >-
          Forward to the web orchestrator to revoke all of the caller's sessions, then clear the
          current session cookie in the response.
        type: call
        targetComponent: web_orchestrator
        targetMethod: signOutEverywhere
  - name: devLogin
    narrative:
      - stepNumber: 1
        description: >-
          Forward to the web orchestrator to mint or reuse the local-developer session; the portal
          then sets the session cookie from the returned id and redirects to the app root
        type: call
        targetComponent: web_orchestrator
        targetMethod: startDevSession
    symbol: startDevSession
  - name: serveProjectCanvas
    narrative:
      - stepNumber: 1
        description: >-
          Forward to the web orchestrator's getProjectCanvas and return the canvas HTML with an HTML
          content type
        type: call
        targetComponent: web_orchestrator
        targetMethod: getProjectCanvas
    symbol: getProjectCanvas
  - name: adminListUsers
    narrative:
      - stepNumber: 1
        description: Resolve the session cookie to a sessionId and forward to the web admin orchestrator
        type: call
        targetComponent: web_admin_orchestrator
        targetMethod: listUsers
    detail: calls-only
  - name: adminUpsertUser
    narrative:
      - stepNumber: 1
        description: >-
          Parse the user record from the body, resolve the session cookie, and forward to the web
          admin orchestrator
        type: call
        targetComponent: web_admin_orchestrator
        targetMethod: upsertUser
    detail: calls-only
  - name: adminSetUserStatus
    narrative:
      - stepNumber: 1
        description: >-
          Parse userId + status from the body, resolve the session cookie, and forward to the web
          admin orchestrator
        type: call
        targetComponent: web_admin_orchestrator
        targetMethod: setUserStatus
    detail: calls-only
  - name: adminListProviders
    narrative:
      - stepNumber: 1
        description: Resolve the session cookie and forward to the web admin orchestrator
        type: call
        targetComponent: web_admin_orchestrator
        targetMethod: listIdentityProviders
    detail: calls-only
  - name: adminUpsertProvider
    narrative:
      - stepNumber: 1
        description: >-
          Parse the identity-provider config from the body, resolve the session cookie, and forward
          to the web admin orchestrator
        type: call
        targetComponent: web_admin_orchestrator
        targetMethod: upsertIdentityProvider
    detail: calls-only
  - name: adminRemoveProvider
    narrative:
      - stepNumber: 1
        description: >-
          Parse the provider id from the body, resolve the session cookie, and forward to the web
          admin orchestrator
        type: call
        targetComponent: web_admin_orchestrator
        targetMethod: removeIdentityProvider
    detail: calls-only
  - name: adminListOrgUnits
    narrative:
      - stepNumber: 1
        description: Resolve the session cookie and forward to the web admin orchestrator
        type: call
        targetComponent: web_admin_orchestrator
        targetMethod: listOrganizationUnits
    detail: calls-only
  - name: adminUpsertOrgUnit
    narrative:
      - stepNumber: 1
        description: >-
          Parse the organization-unit record from the body, resolve the session cookie, and forward
          to the web admin orchestrator
        type: call
        targetComponent: web_admin_orchestrator
        targetMethod: upsertOrganizationUnit
    detail: calls-only
  - name: adminPlaceProject
    narrative:
      - stepNumber: 1
        description: >-
          Parse projectId + unitId from the body, resolve the session cookie, and forward to the web
          admin orchestrator
        type: call
        targetComponent: web_admin_orchestrator
        targetMethod: placeProject
    detail: calls-only
  - name: mintAgentToken
    narrative:
      - stepNumber: 1
        description: >-
          Parse projectId + write from the body, resolve the session cookie, and forward to the web
          admin orchestrator
        type: call
        targetComponent: web_admin_orchestrator
        targetMethod: mintProjectToken
    detail: calls-only
  - name: revokeAgentToken
    narrative:
      - stepNumber: 1
        description: >-
          Parse the token id from the body, resolve the session cookie, and forward to the web admin
          orchestrator
        type: call
        targetComponent: web_admin_orchestrator
        targetMethod: revokeProjectToken
    detail: calls-only
  - name: listAgentTokens
    narrative:
      - stepNumber: 1
        description: Resolve the session cookie and forward to the web admin orchestrator
        type: call
        targetComponent: web_admin_orchestrator
        targetMethod: listMyTokens
    detail: calls-only
  - name: projectList
    narrative:
      - stepNumber: 1
        description: Resolve the session cookie and forward to the web project orchestrator
        type: call
        targetComponent: web_project_orchestrator
        targetMethod: listProjects
    detail: calls-only
  - name: projectCreate
    narrative:
      - stepNumber: 1
        description: >-
          Parse id + optional unitId from the body, resolve the session cookie, and forward to the
          web project orchestrator
        type: call
        targetComponent: web_project_orchestrator
        targetMethod: createProject
    detail: calls-only
  - name: projectLock
    narrative:
      - stepNumber: 1
        description: >-
          Parse projectId from the body, resolve the session cookie, and forward to the web project
          orchestrator
        type: call
        targetComponent: web_project_orchestrator
        targetMethod: lockProject
    detail: calls-only
  - name: projectPromote
    narrative:
      - stepNumber: 1
        description: >-
          Parse projectId from the body, resolve the session cookie, and forward to the web project
          orchestrator
        type: call
        targetComponent: web_project_orchestrator
        targetMethod: promoteProject
    detail: calls-only
  - name: projectDestroy
    narrative:
      - stepNumber: 1
        description: >-
          Parse id from the body, resolve the session cookie, and forward to the web project
          orchestrator
        type: call
        targetComponent: web_project_orchestrator
        targetMethod: destroyProject
    detail: calls-only
  - name: loginWithPassword
    narrative:
      - stepNumber: 1
        description: >-
          Parse user + password from the JSON body and forward to the web orchestrator; on success
          set the session cookie exactly like the SSO callback (HttpOnly, SameSite=Lax, Secure per
          requireTls) and answer ok. Establishes a session (no prior cookie), so the route is NOT in
          the cookie-mutation CSRF set.
        type: call
        targetComponent: web_orchestrator
        targetMethod: signInWithPassword
    detail: calls-only
  - name: adminListSecretRefs
    narrative:
      - stepNumber: 1
        description: Resolve the session cookie and forward to the web admin orchestrator
        type: call
        targetComponent: web_admin_orchestrator
        targetMethod: listSecretRefs
    detail: calls-only
  - name: getLoginOptions
    narrative:
      - stepNumber: 1
        description: >-
          Forward to the web orchestrator's getLoginOptions and return the JSON payload (an
          unauthenticated pre-auth read — no session and no CSRF gate; 404-gated with every /web
          route on exposure.webUiEnabled)
        type: call
        targetComponent: web_orchestrator
        targetMethod: getLoginOptions
  - name: adminRemoveUnit
    narrative:
      - stepNumber: 1
        description: >-
          Parse unitId + disposition from the body, resolve the session cookie, and forward to the
          web admin orchestrator
        type: call
        targetComponent: web_admin_orchestrator
        targetMethod: removeUnit
    detail: calls-only
  - name: adminListRoles
    narrative:
      - stepNumber: 1
        description: Resolve the session cookie and forward to the web admin orchestrator
        type: call
        targetComponent: web_admin_orchestrator
        targetMethod: listRoles
    detail: calls-only
  - name: adminCreateRole
    narrative:
      - stepNumber: 1
        description: >-
          Parse the role from the body, resolve the session cookie, and forward to the web admin
          orchestrator
        type: call
        targetComponent: web_admin_orchestrator
        targetMethod: createRole
    detail: calls-only
  - name: adminUpdateRole
    narrative:
      - stepNumber: 1
        description: Parse the role from the body, resolve the session cookie, and forward
        type: call
        targetComponent: web_admin_orchestrator
        targetMethod: updateRole
    detail: calls-only
  - name: adminDeleteRole
    narrative:
      - stepNumber: 1
        description: Parse the roleId from the body, resolve the session cookie, and forward
        type: call
        targetComponent: web_admin_orchestrator
        targetMethod: deleteRole
    detail: calls-only
  - name: adminListAssignments
    narrative:
      - stepNumber: 1
        description: Read the scope/subject filters from the query, resolve the session cookie, and forward
        type: call
        targetComponent: web_admin_orchestrator
        targetMethod: listAssignments
    detail: calls-only
  - name: adminSetAssignment
    narrative:
      - stepNumber: 1
        description: Parse the assignment from the body, resolve the session cookie, and forward
        type: call
        targetComponent: web_admin_orchestrator
        targetMethod: setAssignment
    detail: calls-only
  - name: adminRemoveAssignment
    narrative:
      - stepNumber: 1
        description: Parse the assignmentId from the body, resolve the session cookie, and forward
        type: call
        targetComponent: web_admin_orchestrator
        targetMethod: removeAssignment
    detail: calls-only
  - name: adminBindRole
    narrative:
      - stepNumber: 1
        description: Parse the user/role/scope from the body, resolve the session cookie, and forward
        type: call
        targetComponent: web_admin_orchestrator
        targetMethod: bindRole
    detail: calls-only
  - name: adminUnbindRole
    narrative:
      - stepNumber: 1
        description: Parse the user/role/scope from the body, resolve the session cookie, and forward
        type: call
        targetComponent: web_admin_orchestrator
        targetMethod: unbindRole
    detail: calls-only
  - name: adminListGlobalPacks
    narrative:
      - stepNumber: 1
        description: Resolve the session credential and forward to the project ops orchestrator
        type: call
        targetComponent: project_ops_orchestrator
        targetMethod: listGlobalPacks
    detail: calls-only
    symbol: opsListGlobalPacks
  - name: adminInstallGlobalPack
    narrative:
      - stepNumber: 1
        description: Parse { name, content } and forward with the session as the credential
        type: call
        targetComponent: project_ops_orchestrator
        targetMethod: installGlobalPack
    detail: calls-only
    symbol: opsInstallGlobalPack
  - name: adminRemoveGlobalPack
    narrative:
      - stepNumber: 1
        description: Parse { name } and forward with the session as the credential
        type: call
        targetComponent: project_ops_orchestrator
        targetMethod: removeGlobalPack
    detail: calls-only
    symbol: opsRemoveGlobalPack
  - name: projectPacksList
    narrative:
      - stepNumber: 1
        description: Read projectId from the query and forward with the session as the credential
        type: call
        targetComponent: project_ops_orchestrator
        targetMethod: listProjectPacks
    detail: calls-only
    symbol: opsListProjectPacks
  - name: projectPackInstall
    narrative:
      - stepNumber: 1
        description: Parse { projectId, name, content } and forward with the session as the credential
        type: call
        targetComponent: project_ops_orchestrator
        targetMethod: installProjectPack
    detail: calls-only
    symbol: opsInstallProjectPack
  - name: projectPackRemove
    narrative:
      - stepNumber: 1
        description: Parse { projectId, name } and forward with the session as the credential
        type: call
        targetComponent: project_ops_orchestrator
        targetMethod: removeProjectPack
    detail: calls-only
    symbol: opsRemoveProjectPack
  - name: adminGetPackPolicy
    narrative:
      - stepNumber: 1
        description: Forward with the session as the credential
        type: call
        targetComponent: project_ops_orchestrator
        targetMethod: getPackPolicy
    detail: calls-only
    symbol: opsGetPackPolicy
  - name: adminSetPackPolicy
    narrative:
      - stepNumber: 1
        description: Parse the InstancePackPolicy body and forward with the session as the credential
        type: call
        targetComponent: project_ops_orchestrator
        targetMethod: setPackPolicy
    detail: calls-only
    symbol: opsSetPackPolicy
  - name: projectPolicyEvaluate
    narrative:
      - stepNumber: 1
        description: Read projectId from the query and forward with the session as the credential
        type: call
        targetComponent: project_ops_orchestrator
        targetMethod: evaluateProjectPolicy
    detail: calls-only
    symbol: opsPolicyEvaluate
  - name: projectPolicyReconcile
    narrative:
      - stepNumber: 1
        description: Parse { projectId } and forward with the session as the credential
        type: call
        targetComponent: project_ops_orchestrator
        targetMethod: reconcileProjectPolicy
    detail: calls-only
    symbol: opsPolicyReconcile
  - name: projectProducersList
    narrative:
      - stepNumber: 1
        description: Read projectId from the query and forward with the session as the credential
        type: call
        targetComponent: project_ops_orchestrator
        targetMethod: listProducers
    detail: calls-only
    symbol: opsListProducers
  - name: projectProducerConfigure
    narrative:
      - stepNumber: 1
        description: Parse { projectId, target, parentPageId } and forward with the session as the credential
        type: call
        targetComponent: project_ops_orchestrator
        targetMethod: configureProducer
    detail: calls-only
    symbol: opsConfigureProducer
  - name: projectProducerRemove
    narrative:
      - stepNumber: 1
        description: Parse { projectId, target } and forward with the session as the credential
        type: call
        targetComponent: project_ops_orchestrator
        targetMethod: removeProducer
    detail: calls-only
    symbol: opsRemoveProducer
  - name: projectProducerRun
    narrative:
      - stepNumber: 1
        description: Parse { projectId, target } and forward with the session as the credential
        type: call
        targetComponent: project_ops_orchestrator
        targetMethod: produceProducer
    detail: calls-only
    symbol: opsRunProducer
  - name: projectGitStatus
    narrative:
      - stepNumber: 1
        description: Read projectId from the query and forward with the session as the credential
        type: call
        targetComponent: project_ops_orchestrator
        targetMethod: getGitBinding
    detail: calls-only
    symbol: opsGitStatus
  - name: projectGitBind
    narrative:
      - stepNumber: 1
        description: Parse { projectId, remote, branch } and forward with the session as the credential
        type: call
        targetComponent: project_ops_orchestrator
        targetMethod: enableGit
    detail: calls-only
    symbol: opsGitBind
  - name: projectGitUnbind
    narrative:
      - stepNumber: 1
        description: Parse { projectId } and forward with the session as the credential
