        targetComponent: project_ops_orchestrator
        targetMethod: syncGit
    detail: calls-only
    symbol: opsGitSync
  - name: projectGitCommit
    narrative:
      - stepNumber: 1
        description: Parse { projectId, subsystem?, message? } and forward with the session as the credential
        type: call
        targetComponent: project_ops_orchestrator
        targetMethod: commitProject
    detail: calls-only
    symbol: opsGitCommit
  - name: projectGitSyncConfig
    narrative:
      - stepNumber: 1
        description: >-
          Parse { projectId, periodicSyncMinutes?, skipIfClean? } and forward with the session as
          the credential
        type: call
        targetComponent: project_ops_orchestrator
        targetMethod: configureGitSync
    detail: calls-only
    symbol: opsGitSyncConfig
  - name: adminAuditQuery
    narrative:
      - stepNumber: 1
        description: >-
          Build the AuditQuery from the query params (projectId/category/action/limit/offset) and
          forward with the session as the credential
        type: call
        targetComponent: project_ops_orchestrator
        targetMethod: queryAuditEvents
    detail: calls-only
    symbol: opsAuditQuery
  - name: adminAuditCount
    narrative:
      - stepNumber: 1
        description: Build the AuditQuery from the query params and forward with the session as the credential
        type: call
        targetComponent: project_ops_orchestrator
        targetMethod: countAuditEvents
    detail: calls-only
    symbol: opsAuditCount
  - name: adminGetExposure
    narrative:
      - stepNumber: 1
        description: Forward with the session as the credential
