id: signature_resolver_impl
name: Signature Resolver Implementation
description: >-
  Pure resolution over the specs handed in: a component-and-contract lookup built once, each sourced
  method bound and filled, then every params-bearing method's text derived.
contract: isignature_resolver
sourcePath: src/core/signature-sources.ts
methods:
  - name: resolveTree
    narrative:
      - stepNumber: 1
        description: >-
          Copy the interfaces and types handed in, so nothing the caller holds is mutated, and index
          the copies: each component key to the methods its contracts declare, and the signature
          types by qualified id
        type: local
      - stepNumber: 2
        description: Walk every contract method that names a signatureFrom
        type: loop
        loopKind: forEach
        over: each method of each interface naming a signatureFrom
        endStep: 12
      - stepNumber: 3
        description: >-
          Read the value both ways: as a method source — split at the last dot, the head a component
          key in the owning interface's namespace (local first, or an `alias::` key the scan already
          bound) and the tail a method on any of its contracts — and as a type reference matched
          against the types as every type reference is matched (type_spec.matchesRef), only a type
          of kind signature counting
        type: local
      - stepNumber: 4
        description: Does exactly one reading resolve?
        type: branch
        condition: exactly one of the two readings finds its target
        onFalseStep: 9
      - stepNumber: 5
        description: Does the source take its own signature from a source?
        type: branch
        condition: the bound method names no signatureFrom of its own (a signature type never does)
        onFalseStep: 11
      - stepNumber: 6
        description: >-
          Record a restated fact when the stored method also states params or returns, with whether
          they differ from the source's (compared by name, type, optional marker and order, and
          returns)
        type: local
      - stepNumber: 7
        description: >-
          Put the source's params and returns on the method — the source's are in force whatever the
          method stated — and record a resolved fact naming the bound target
        type: local
      - stepNumber: 8
        description: Done with this method
        type: jump
        toStep: 12
      - stepNumber: 9
        label: unresolved
        description: >-
          Record the fact: ambiguous when both readings resolved, naming the method and the
          signature type as candidates; unresolved when neither did, naming the kind of the type
          found when the value named an entity or value-object. Either way leave the method without
          params, its returns `unknown`
        type: local
      - stepNumber: 10
        description: Done with this method
        type: jump
        toStep: 12
      - stepNumber: 11
        label: chained
        description: >-
          Record a chained fact naming the source's own source, and leave the method without params,
          its returns `unknown`: a chain is never followed
        type: local
      - stepNumber: 12
        label: next
        description: Move on to the next sourced method
        type: local
      - stepNumber: 13
        description: >-
          Derive the text of every contract method and type method with params through
          method_signature.derivedSignature(), recording a stale text where the stored text differs,
          and of every signature type through type_spec.derivedSignature()
        type: local
      - stepNumber: 14
        description: Answer the resolved interfaces and types with the facts
        type: return
        outcome: SignatureResolution
    detail: full
status: design
