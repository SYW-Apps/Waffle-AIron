id: flow_matrix_projector_impl
name: Flow Matrix Projector Implementation
description: The matrix derivation and the flow explanation, pure.
contract: iflow_matrix_projector
sourcePath: src/network/flow-matrix.ts
methods:
  - name: project
    narrative:
      - stepNumber: 1
        label: verbs
        description: For each verb of model.verbs whose transport.kind() is network
        type: loop
        loopKind: forEach
        over: the network-transport verbs of model.verbs
        endStep: 6
      - stepNumber: 2
        description: >-
          callers = model.callersOf(verb.portal, verb.verb); add one flow per caller: from its
          project and component, to the verb, with the transport, the binding, the networks of
          model.enclosing(verb.network) the caller is not inside (outermost first), the gateway
          entered when one is crossed, and the call's evidence
        type: local
      - stepNumber: 3
        description: Does the verb have an entry of its own?
        type: branch
        condition: verb.entry is present with kind entry
        onFalseStep: 1
      - stepNumber: 4
        description: >-
          An outside entry is a flow from outside the verb's innermost network: from the next
          network out when that network is nested (scope network, naming the parent; scopes are
          relative), else from outside everything; crossing only that innermost network, via the
          verb's Portal when it is a gateway, with the entry's caller prose as evidence
        type: branch
        condition: the entry's scope is network
        onTrueStep: 5
        onFalseStep: 6
      - stepNumber: 5
        description: >-
          A network entry is a flow from the whole network, unless the model is family-scoped and
          callers is non-empty: then the modelled callers' flows already stand for it, and no
          blanket flow is added (least privilege)
        type: local
      - stepNumber: 6
        label: verbsEnd
        description: Add the outside flow when the entry's scope is outside
        type: local
      - stepNumber: 7
        description: >-
          Mark each flow with the model's findings that sit on it, each as `CODE: message`: a
          finding sited at a verb (its Portal and the verb) sits on that verb's entry flows, one
          sited at a call (its calling component and the call's evidence) on the flow that evidence
          gives; an error joins refusedBy, a warning or notice flaggedBy
        type: local
      - stepNumber: 8
        description: 'Answer the flows in a stable order: by callee, then caller'
        type: return
        outcome: list<NetworkFlow>
    detail: full
  - name: explain
    narrative:
      - stepNumber: 1
        description: >-
          Parse both parties: a project, a subsystem, a component (or portal, or portal.verb),
          outside, or network[:<id>]
        type: local
      - stepNumber: 2
        description: >-
          Is either name unknown to the model: no placement's project, subsystem or component, no
          verb, and neither outside nor a network names it?
        type: branch
        condition: a party name denotes nothing in the model
        onFalseStep: 4
      - stepNumber: 3
        description: >-
          Answer not allowed with the unknown names: a typo, not a refusal — the chain says so and
          how a party is named
        type: return
        outcome: unknown party
      - stepNumber: 4
        description: >-
          Select the flows whose caller lies within the first party and whose callee lies within the
          second
        type: local
      - stepNumber: 5
        description: 'Set the flows the gate refuses (refusedBy) apart: they allow nothing'
        type: local
      - stepNumber: 6
        description: Nothing allows it
        type: branch
        condition: no flow the gate admits is selected
        onFalseStep: 8
      - stepNumber: 7
        description: >-
          Answer not allowed: when a refused flow joins the pair, naming its findings (the design
          has it, the gate refuses it); else, when no network-transport verb lies within the callee,
          as in-process (a direct call inside one process, never a network flow); else naming the
          nearest admitted flows to the callee so the asker sees what is allowed instead
        type: return
        outcome: not allowed
      - stepNumber: 8
        description: >-
          Build each flow's chain as lines: the entry with its caller prose or the modelled call's
          evidence, each network crossed with the gateway entered, the verb with its binding, and
          each warning that marks it
        type: local
      - stepNumber: 9
        description: Answer allowed with the flows and their chains
        type: return
        outcome: allowed
    detail: full
status: complete
