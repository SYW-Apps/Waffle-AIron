id: cli_lock_adapter_impl
name: CLI Lock Adapter Implementation
description: >-
  Forwards the lock mechanics to the published portals: the tree's gate identity from the validator
  portal, and the commit-scoped lock record write to the core portal. Realized by the existing
  runLock command module.
contract: icli_lock_adapter
sourcePath: src/commands/lock.ts
methods:
  - name: lockTree
    narrative:
      - stepNumber: 1
        description: >-
          Assemble the lock scope (optional subsystem narrowing), then obtain the record identity
          from the tree's current gate identity through the validator portal: spec content,
          governing doctrine and consumed contract inputs, so the lock records which gate validated
          it
        type: call
        targetComponent: validator_portal
        targetMethod: computeGateStateId
      - stepNumber: 2
        description: Persist the commit-scoped lock record
        type: call
        targetComponent: core_portal
        targetMethod: writeLockRecord
      - stepNumber: 3
        description: Return the written lock record
        type: return
        outcome: LockRecord
    symbol: runLock
status: complete
createdAt: '2026-07-24T18:05:34.695Z'
updatedAt: '2026-09-15T17:56:08.160Z'
