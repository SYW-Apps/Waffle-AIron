id: cli_lock_adapter_impl
name: CLI Lock Adapter Implementation
description: >-
  Forwards the lock mechanics to the published portals: the tree's gate identity and the members'
  approval states from the validator portal, the approval arithmetic and the commit-scoped lock
  record write to the approval portal, the configuration from the project config portal, and the
  read-only approval verdict that compares the record with the identity. Realized by the existing
  lock command module. Writes one file — this project's .wai/lock.json — and nothing below the
  project.
contract: icli_lock_adapter
sourcePath: src/commands/lock.ts
methods:
  - name: lockTree
    narrative:
      - stepNumber: 1
        description: >-
          Compare this project's own specs against the approval on record, to summarize what changed
          since the last approval (a first approval, or a format-1 record without per-spec digests,
          says so instead of inventing a diff)
        type: call
        targetComponent: approval_portal
        targetMethod: diffAgainstApproval
      - stepNumber: 2
        description: >-
          A scoped lock (--subsystem): read the spec paths in that scope through the core portal, to
          tell a spec inside the scope from one outside it
        type: call
        targetComponent: spec_tree_portal
        targetMethod: specPathsInScope
      - stepNumber: 3
        label: scope-check
        description: >-
          A --subsystem lock narrows a RE-approval and never a first one: the gate identity a record
          certifies is the whole design's, so a record listing one subsystem while its identity
          covers the whole tree would pass lock-check over specs nobody reviewed. Is it a scoped
          lock that cannot be approved alone — no approval on record with per-spec digests (a first
          approval covers the whole tree), a record without gate parts that break down its identity
          (it cannot show the rest unmoved), a spec OUTSIDE the scope that changed, was added or was
          removed since the approval, or an input the identity covers besides the design (rule
          tuning, packs, network, composition, a pin, a member's approval, the release) that moved?
        type: branch
        condition: '--subsystem was given and the scope cannot be approved alone'
        onFalseStep: 5
      - stepNumber: 4
        description: >-
          Refuse, writing nothing, saying why in one sentence: a first approval covers the whole
          tree (`wairon lock` without --subsystem), or what moved outside the scope is named and the
          whole project must be re-approved together. A scoped lock that passes re-approves its
          scope and carries the rest forward exactly as previously approved — nothing outside it
          moved — so the record, its identity, status and lock-check agree
        type: throw
        error: a --subsystem lock that cannot be approved alone
      - stepNumber: 5
        description: >-
          Read each DIRECT member's approval state, subject and pin, each project member computed at
          its own root (depth 1) — and each part, answered as a part with its content digest and the
          commit it was read at (stage 8)
        type: call
        targetComponent: validator_portal
        targetMethod: familyApprovals
      - stepNumber: 6
        label: release-carry
        description: >-
          Refresh the record's release stamp when the own approval carried a change of the release
          over (cli_lock_adapter.restampRelease) — no review is asked for
        type: call
        targetComponent: cli_lock_adapter
        targetMethod: restampRelease
      - stepNumber: 7
        description: Was the release stamp refreshed?
        type: branch
        condition: restampRelease answered a record
        onFalseStep: 9
      - stepNumber: 8
        description: >-
          Return the refreshed record (the generated outputs are refreshed by the caller as after
          any lock)
        type: return
        outcome: restamped
      - stepNumber: 9
        description: >-
          Read the approval on record: when no own spec moved, the summary must still say what did —
          the captured gate identity differing from the recorded one is an input the identity covers
          (the doctrine, a declared network, an external's pin, `composition`), and the record's
          projectId differing from the configured effective id is the project id — so a lock never
          answers "nothing has changed" while it clears a change
        type: call
        targetComponent: approval_portal
        targetMethod: readLockRecord
      - stepNumber: 10
        description: >-
          Read the specs of every kind — this component read and its siblings for subsystems,
          contracts, implementations and types — to say plainly how many of each are still draft or
          design: status is readiness, not approval, so the lock approves a draft design as it
          stands — and says that is what it is doing
        type: call
        targetComponent: spec_tree_portal
        targetMethod: loadComponentSpecs
      - stepNumber: 11
        description: >-
          Print the summary: the own specs changed, added and removed — a part's specs among them,
          under `members/<alias>/…`, since a part is this project's own content; a spec whose
          storage moved with its content unchanged is a move (ApprovalDiff.moved), counted apart and
          never as a change; past a dozen paths per kind the list is summarized (the first few, then
          a count of the rest and `--all`, which lists every one); when no own spec moved, either
          "nothing has changed" — the approval on record stays as it is, its lockedAt and
          .wai/lock.json untouched, unless another approver is locking (then their approval is
          recorded anew, said so) — or, when the identity or the project id moved, "no spec changed,
          but what the design is approved under did", naming it (a record without gate parts says it
          cannot tell which input moved and that this re-approval records them); when any spec of
          any kind is still draft or design, how many of how many, counted per kind (subsystems,
          components, contracts, implementations, types), and that the approval covers them as they
          stand; the code results of the gate on a line of their own ("code: N errors, M warnings
          recorded beside the claim — CI enforces them, not the lock"); then each direct project
          member with its state (approved | drifted | never) and, where its pin moved, the subject
          this approval recorded and the one it carries now — a project member's own edits never
          appear in this project's spec diff; what the parent reviews is the member's approval
          moving; then each part stored outside the project with the commit being approved
        type: local
      - stepNumber: 12
        description: >-
          Refuse, writing nothing, what no lock may approve (cli_lock_adapter.assertApprovable): a
          project that requires approved members with a member project not approved, an external
          never pinned, or a use its pin does not record
        type: call
        targetComponent: cli_lock_adapter
        targetMethod: assertApprovable
      - stepNumber: 13
        description: >-
          Confirm with the human (skipped under --yes; a non-interactive shell without --yes
          refuses)
        type: branch
        condition: the human declined the confirmation
        onTrueStep: 14
        onFalseStep: 15
      - stepNumber: 14
        description: 'Declined: nothing was written'
        type: return
        outcome: null (declined)
      - stepNumber: 15
        description: >-
          Capture the approval: one digest per OWN spec file — the project's own and its parts'
          (stage 8), a part's keyed `members/<alias>/<path inside the part>` so moving its storage
          changes no key. A scoped lock that passed the scope check captures the same: nothing
          outside its scope moved, so the rest is carried forward as previously approved and the
          record agrees with the whole-tree identity it certifies
        type: call
        targetComponent: approval_portal
        targetMethod: captureApprovedSpecs
      - stepNumber: 16
        description: 'Resolve who is approving: the git author identity, else user@hostname'
        type: call
        targetComponent: approval_portal
        targetMethod: localApprover
      - stepNumber: 17
        label: confirm
        description: Recompute the gate identity immediately before writing
        type: call
        targetComponent: validator_portal
        targetMethod: computeGateStateId
      - stepNumber: 18
        description: >-
          Did any input move while the lock ran — between the capture before validation and now, the
          confirmation prompt included?
        type: branch
        condition: the recomputed identity differs from the captured one
        onTrueStep: 19
        onFalseStep: 20
      - stepNumber: 19
        description: >-
          Refuse, writing nothing: a spec, the doctrine, an input, the composition block or a
          member's approval changed while the lock ran, so the validation the human saw does not
          describe what would be recorded. Run the lock again
        type: throw
        error: the lock's inputs changed while it ran
      - stepNumber: 20
        description: >-
          Nothing below is scoped: a scoped lock that passed the scope check records the whole
          tree's digests and identity, exactly what an unscoped lock of the same tree records
        type: local
      - stepNumber: 21
        description: >-
          Assemble a format-3 LockRecord: stateId = the captured identity (design gate algorithm),
          gateParts = the captured identity's parts (each input digested on its own, so a later
          check names the input that moved and judges a change of the release alone by
          re-validation), lockedAt, lockedBy, validatorVersion, validationResult = the design half's
          counts (gate.designOnly()), status ready, projectId when there is one, specs = the
          design-reading digests with specsReading `design`, `members` = each direct member's alias
          → a project member's {as: project, project, subject, state, commit when referenced} or a
          part's {as: part, contentDigest, commit when known, state approved}, and `code` =
          gate.analysis without its codes list. No `children`, no `reexpressed`, no `restamped` (a
          human approved this one)
        type: local
      - stepNumber: 22
        description: >-
          Is the assembled record the same APPROVAL as the record on file — the same identity, specs
          and reading, format, members, project id and approver? The evidence recorded beside it
          (lockedAt, validatorVersion, gateParts, validationResult, code, a `restamped` trace) is
          not the approval: when the approval is the same, nothing was approved anew
        type: branch
        condition: a record is on file and is the same approval as the assembled one
        onFalseStep: 24
      - stepNumber: 23
        description: >-
          Keep the record on file — its lockedAt, release stamp and `restamped` trace included — and
          write nothing, and return it, so the generated outputs are still refreshed and
          `.wai/lock.json` is left untouched as the summary said. Only when its gateParts are
          missing or do not break down the identity it still matches are they rewritten from the
          identity, every other field kept, and said so
        type: return
        outcome: LockRecord
      - stepNumber: 24
        description: Persist the commit-scoped lock record — the only file this lock writes
        type: call
        targetComponent: approval_portal
        targetMethod: writeLockRecord
      - stepNumber: 25
        description: Return the written lock record
        type: return
        outcome: LockRecord
    symbol: runLock
  - name: checkApproval
    narrative:
      - stepNumber: 1
        label: tree-verdict
        description: >-
          Ask this adapter's tree verdict first: no L0 means no tree to approve (said so, approved
          unless strict) — or, when spec files remain below a deleted L0, a tree whose root is gone,
          refused at every strictness. A repository with no tree must be TOLD so rather than judged
          "unapproved", and a deleted L0 must never read as no tree
        type: call
        targetComponent: cli_lock_adapter
        targetMethod: treeVerdict
      - stepNumber: 2
        label: tree-present
        description: Did the tree's presence decide the verdict?
        type: branch
        condition: treeVerdict answered a verdict
        onTrueStep: 3
        onFalseStep: 4
      - stepNumber: 3
        label: verdict-tree
        description: Return the tree verdict as it was answered
        type: return
        outcome: no-tree or root missing
      - stepNumber: 4
        label: gate-identity
        description: >-
          Obtain the tree's gate identity as it stands NOW from the validator portal — own content,
          design doctrine, declared inputs, composition and direct members' subjects, which is what
          "has the approved design or anything it was approved under changed" means. The per-spec
          content digests are not the gate: they would move on a whitespace-only edit.
        type: call
        targetComponent: validator_portal
        targetMethod: computeGateStateId
      - stepNumber: 5
        label: resolve-lock
        description: >-
          Resolve the committed record against that identity through the core portal, the one
          authority on the question: unlocked, locked or stale.
        type: call
        targetComponent: approval_portal
        targetMethod: readLockState
      - stepNumber: 6
        label: members
        description: >-
          Read the root's own approval entry and every member PROJECT's approval at its own root, at
          every depth, with how its declaring project pinned it (parts are left out: a part has no
          approval of its own, its declaring project's is its approval). The gate identity reads
          each member's RECORDED approval, never its tree, so without this read a member's
          unapproved edits are invisible here. Each entry is the one `wairon status` and
          sdd_get_status print (family_validator.approvals): drifted when its identity moved OR its
          approval still owes something (`owed`: a moved id, an external never pinned or used beyond
          its pin), so this gate and status read one verdict
        type: call
        targetComponent: validator_portal
        targetMethod: familyApprovals
      - stepNumber: 7
        label: member-drift
        description: Does a member project carry spec changes nobody approved at its own root?
        type: branch
        condition: a member project is drifted
        onTrueStep: 8
        onFalseStep: 10
      - stepNumber: 8
        label: member-folders
        description: >-
          Read the project graph for where each member project lives, so the verdict can name the
          folder to lock in
        type: call
        targetComponent: spec_tree_portal
        targetMethod: projectFamily
      - stepNumber: 9
        label: verdict-member-drifted
        description: >-
          Refuse at every strictness: the merge gate is never green while a member's approval does
          not cover it. Name each drifted member with its folder, what it owes — its `owed` sentence
          when it carries one (a moved id, an external to pin), else that its design changed since
          its own approval — and the remedy: `wairon lock` at that member's own root, then commit
          its .wai/lock.json; and say whether this project's own approval needs one too.
        type: return
        outcome: member drifted
      - stepNumber: 10
        label: coverage
        description: >-
          Ask what the approval on record owes beside its gate identity, or what a change of the
          release found in it (cli_lock_adapter.coverageVerdict): a moved project id, an external
          never pinned or used beyond its pin, or a release whose re-validation found issues in the
          approved design
        type: call
        targetComponent: cli_lock_adapter
        targetMethod: coverageVerdict
      - stepNumber: 11
        description: Did it answer a refusal?
        type: branch
        condition: coverageVerdict answered a verdict
        onFalseStep: 13
      - stepNumber: 12
        label: verdict-coverage
        description: Return that refusal as it was answered
        type: return
        outcome: stale (id, external pin or release findings)
      - stepNumber: 13
        label: dispatch-state
        description: >-
          Turn this project's own lock state into the decision: locked also when the root's own
          entry carries a release verdict that carried the approval over (re-validated clean under
          this release), whose verdict says so in one line
        type: switch
        'on': the resolved lock state
        cases:
          - value: locked
            step: 14
          - value: stale
            step: 17
        defaultStep: 23
      - stepNumber: 14
        label: member-never
        description: Was --strict asked for while a member project was never approved at its own root?
        type: branch
        condition: strict was asked for and a member project has no approval of its own
        onTrueStep: 15
        onFalseStep: 16
      - stepNumber: 15
        label: verdict-member-never
        description: >-
          Refuse: --strict asks for an approved family, and these members were never approved by
          anyone. Name each with its folder and the remedy (`wairon lock` at its own root).
        type: return
        outcome: member never approved
      - stepNumber: 16
        label: verdict-locked
        description: >-
          The approval still covers this design: pass, naming who approved it and when
          (lock_record.approvalStamp — never `undefined by unknown`) so the log carries the
          evidence, and — when it carried over a release change — `approved under <old>,
          re-validated under <new>: still approved` (`wairon lock` refreshes the record's release
          stamp without a re-approval); and how many member projects are approved at their own
          roots. A member that was never approved is named as NOT gated (only --strict fails it), so
          the verdict never calls the family approved while one of its projects was never approved.
          When the record's gateParts do not break down its identity (the own entry's partsIgnored),
          one notice says they are ignored and that `wairon lock` rewrites them — the identity alone
          decided the pass.
        type: return
        outcome: locked
      - stepNumber: 17
        label: stale-own-diff
        description: >-
          Compare the own spec files with the approval's per-spec digests, so the verdict can say
          whether — and how many — own spec files moved since the approval
        type: call
        targetComponent: approval_portal
        targetMethod: diffAgainstApproval
      - stepNumber: 18
        label: upgrade-only
        description: >-
          Is the staleness only the gate-identity upgrade of wairon 6.0.0 (LockStatus.upgraded: the
          record's algorithm is an earlier gate marker)?
        type: branch
        condition: the lock status is upgraded
        onTrueStep: 19
        onFalseStep: 20
      - stepNumber: 19
        label: verdict-upgraded
        description: >-
          Refuse (the old identity cannot be recomputed, so nothing proves the design unchanged),
          saying it plainly: "the approval on record was taken under an earlier gate identity —
          since wairon 6.0.0 the gate identity also covers each direct member's composition subject
          and `composition`, and code conformance is recorded beside the claim", whether any own
          spec file changed since, and the remedy: re-lock once and commit .wai/lock.json.
        type: return
        outcome: stale (identity upgraded)
      - stepNumber: 20
        label: repin-only
        description: >-
          Did only member approvals move — no own spec file changed, no direct member added or
          removed, and every direct member whose pin moved is approved at its own root?
        type: branch
        condition: the only movement is direct members re-approved at their own roots
        onTrueStep: 21
        onFalseStep: 22
      - stepNumber: 21
        label: verdict-repin
        description: >-
          Refuse, saying exactly what is needed and why it is not alarming. A member's own approval
          moving is expected — its own approver signed its new design off at its own root, so the
          member is not in question. What this project's lock pins is the member approval it was
          taken against, and the root is judged by whether that pin is still the member's approved
          one: it is not, so this project's approval names an earlier member design than the one
          about to merge. Name each such member, say that nothing of this project's own specs moved,
          and give the one remedy — `wairon lock` here, which records the members' new approvals
          (and anything else the gate identity covers that moved alongside).
        type: return
        outcome: stale (member re-approved)
      - stepNumber: 22
        label: verdict-stale
        description: >-
          The design, or something it was approved under, moved past the approval: refuse at every
          strictness, naming what moved — the count of own spec files changed, each direct member
          whose pin moved or that is no longer approved, each member added or removed since the
          approval — and a member whose alias was renamed (a current alias the record does not hold,
          carrying the project id, or a former id, of an alias the record holds that is gone) named
          as renamed from its old alias, never as one added and one removed — and, when none of
          those moved, the input that did: named exactly from the own entry's inputsMoved when the
          record carries gate parts (the network declaration after `wairon network declare`, the
          rule tuning, the extension packs, a consumed contract's pin, `composition`), and only for
          a record from before gate parts the candidate list in the very words `wairon lock` prints
          for it; and the remedy: re-run the lock and commit the updated record.
        type: return
        outcome: stale
      - stepNumber: 23
        label: unlocked-subsystems
        description: >-
          Never approved: read the subsystems, to tell a tree with a design to approve from one that
          holds the L0 and nothing below it
        type: call
        targetComponent: spec_tree_portal
        targetMethod: loadSubsystemSpecs
      - stepNumber: 24
        label: verdict-unlocked
        description: >-
          Never approved: the opt-in seam. A tree holding the L0 and nothing below it (no subsystem,
          no member project) has nothing designed to approve, said as `wairon lock` says it — which
          writes no record there — with the remedy: add a subsystem, then `wairon lock`. Any other
          tree: plain lock-check fails only a committed approval that no longer matches, so a
          project with no .wai/lock.json (never locked, or the record deleted) is not gated, which
          is why CI runs `wairon lock-check --strict`. Without strict, pass with that notice; with
          strict, refuse — there is no approved design.
        type: return
        outcome: unlocked
  - name: reexpressApproval
    narrative:
      - stepNumber: 1
        description: >-
          Compute the gate identity as it stands, carrying asRecorded when the record on disk is a
          format-2 one
        type: call
        targetComponent: validator_portal
        targetMethod: computeGateStateId
      - stepNumber: 2
        description: >-
          Ask for the record carried into the design reading — null unless the record's own
          identity, recomputed, still holds
        type: call
        targetComponent: approval_portal
        targetMethod: reexpress
      - stepNumber: 3
        description: Is there a carried record to write?
        type: branch
        condition: a carried record came back
        onFalseStep: 6
      - stepNumber: 4
        description: >-
          Persist the carried record — this project's .wai/lock.json only; the approval stays the
          human's and the record says it was re-expressed
        type: call
        targetComponent: approval_portal
        targetMethod: writeLockRecord
      - stepNumber: 5
        description: Return the written record
        type: return
        outcome: re-expressed
      - stepNumber: 6
        label: nothing
        description: >-
          Return null: nothing to carry, or nothing proves the design unchanged — the caller points
          at one `wairon lock`
        type: return
        outcome: not re-expressed
    symbol: reexpressLock
  - name: holdsNoDesign
    narrative:
      - stepNumber: 1
        description: Read the subsystems the tree holds
        type: call
        targetComponent: spec_tree_portal
        targetMethod: loadSubsystemSpecs
      - stepNumber: 2
        description: >-
          Read the direct members (depth 1): a project that declares members has their pins to
          approve even with no subsystem of its own
        type: call
        targetComponent: validator_portal
        targetMethod: familyApprovals
      - stepNumber: 3
        description: >-
          Read the approval on record: a tree emptied after an approval still has that change to
          approve, so only a never-approved tree can hold nothing to approve
        type: call
        targetComponent: approval_portal
        targetMethod: readLockRecord
      - stepNumber: 4
        description: >-
          Answer true when no subsystem is loaded, no direct member is declared and no approval is
          on record — the tree holds the L0 and nothing below it, the state `validate` calls
          "nothing to check yet"
        type: return
        outcome: whether there is nothing to approve
  - name: treeVerdict
    narrative:
      - stepNumber: 1
        label: load-system
        description: Ask the core portal for the L0 system spec
        type: call
        targetComponent: spec_tree_portal
        targetMethod: loadSystemSpec
      - stepNumber: 2
        description: Is the L0 there?
        type: branch
        condition: the system spec loaded
        onTrueStep: 7
        onFalseStep: 3
      - stepNumber: 3
        label: orphaned-files
        description: >-
          No L0: ask the spec maintenance portal which spec files are left standing below the specs
          folder. A tree whose root was deleted still holds a design
        type: call
        targetComponent: spec_maintenance_portal
        targetMethod: findOrphanedSpecFiles
      - stepNumber: 4
        description: >-
          Do spec files remain below the missing or unreadable L0, or is the L0 file there but
          unreadable?
        type: branch
        condition: spec files remain
        onTrueStep: 5
        onFalseStep: 6
      - stepNumber: 5
        label: verdict-root-missing
        description: >-
          Refuse at every strictness: the L0 System spec (.wai/specs/.index.yaml) is missing — or is
          there but cannot be read (empty, null, not YAML, failing its schema; said apart, with
          `wairon validate` naming why) — while spec files remain below it (the count and the first
          few named), so the design is still there, cannot be judged and is not approved — with the
          fix: restore it from version control. An L0 that cannot be read is refused even with
          nothing below it: a broken root is never no tree
        type: return
        outcome: unlocked (root missing)
      - stepNumber: 6
        label: verdict-no-tree
        description: >-
          No tree: report that this repository carries no spec tree, approved unless strict was
          asked for
        type: return
        outcome: no-tree
      - stepNumber: 7
        label: has-tree
        description: 'The L0 is there: no verdict from the tree''s presence'
        type: return
        outcome: none
  - name: coverageVerdict
    narrative:
      - stepNumber: 1
        description: >-
          Read the project configuration, to judge its id against the one the approval recorded. The
          gate identity does not cover the id, so without this read a hand-edited id that `validate`
          reports and `lock` refuses would pass the merge gate
        type: call
        targetComponent: project_config_portal
        targetMethod: loadProjectConfig
      - stepNumber: 2
        description: >-
          Resolve the configured identity against the recorded projectId —
          project_config.identity(record.projectId), the very resolution the project-identity rule
          judges PROJECT_ID_CHANGED and PROJECT_ID_RENAMED by. No record, or a configuration that
          does not load, names no problem here
        type: local
      - stepNumber: 3
        description: >-
          Did the id move since the approval (changed by hand, or renamed with its re-lock not yet
          taken)?
        type: branch
        condition: the identity names a changed or renamed id
        onFalseStep: 5
      - stepNumber: 4
        description: >-
          Refuse at every strictness, naming the approved id and the configured one: changed by hand
          — restore it, then rename deliberately with `wairon project rename <id>` and re-lock;
          renamed — `wairon lock` re-approves the design under the new id
        type: return
        outcome: stale (project id)
      - stepNumber: 5
        description: >-
          Does the root's own entry owe an external — one declared but never pinned, or used beyond
          what its pin records?
        type: branch
        condition: the own entry carries owed
        onFalseStep: 7
      - stepNumber: 6
        description: >-
          Refuse, quoting what is owed and the fix in the order the lock takes it — pin first
          (`wairon externals pin <alias>`), then `wairon lock`
        type: return
        outcome: stale (external pin)
      - stepNumber: 7
        description: >-
          Does the root's own entry carry a release verdict that did NOT carry the approval over
          (family_validator.releaseVerdict: the approved design re-validated under this release
          finds issues, or the record cannot prove its own inputs unchanged — no gate parts, parts
          that do not break down its identity, a newer or invalid stamp)?
        type: branch
        condition: the own entry's release verdict is not carried
        onFalseStep: 9
      - stepNumber: 8
        description: >-
          Refuse at every strictness, naming the cause exactly (release_verdict.staleSentence): its
          reason when it has one — `approved under <old> before wairon recorded its inputs
          separately — re-lock once to record them; later upgrades then carry over`, `written by a
          newer wairon`, a stamp that is no version — else approved under <old release>, and the new
          release finds N issue(s) in the approved design, the first few named `CODE [spec]
          message`, with the remedy: resolve them, `wairon lock`, commit. Never the generic list of
          candidate inputs, and never the claim that every input the project decides is as approved
          unless its parts prove it
        type: return
        outcome: stale (release findings)
      - stepNumber: 9
        description: 'Nothing owed: no verdict'
        type: return
        outcome: none
  - name: restampRelease
    narrative:
      - stepNumber: 1
        description: >-
          Did the own approval carry a change of the release over (its entry's release verdict is
          carried: the approved design unchanged and re-validated clean under this release), the
          lock unscoped?
        type: branch
        condition: the own entry carries a carried release verdict and no --subsystem was given
        onFalseStep: 6
      - stepNumber: 2
        description: Read the record on file
        type: call
        targetComponent: approval_portal
        targetMethod: readLockRecord
      - stepNumber: 3
        description: >-
          Refresh its release stamp WITHOUT a re-approval: stateId = the captured identity,
          gateParts = its parts, validatorVersion = this release and `restamped: {at, fromVersion,
          toVersion, by: wairon lock, subject}`, where subject is the approval subject the record
          had (lock_record.approvalSubject: an earlier restamp's subject, else its stateId) — what a
          parent keeps pinning, so the restamp never reads as a re-approval one level up; lockedAt,
          lockedBy, specs, members and results kept — the approval stays the approver's
        type: local
      - stepNumber: 4
        description: Persist the refreshed record — the only file this writes — and say so in one line
        type: call
        targetComponent: approval_portal
        targetMethod: writeLockRecord
      - stepNumber: 5
        description: Answer the refreshed record
        type: return
        outcome: LockRecord
      - stepNumber: 6
        description: Nothing to refresh
        type: return
        outcome: none
  - name: assertApprovable
    narrative:
      - stepNumber: 1
        description: 'Read the project configuration: its composition block (requireApprovedMembers)'
        type: call
        targetComponent: project_config_portal
        targetMethod: loadProjectConfig
      - stepNumber: 2
        description: >-
          Does the project require approved members, and is a PROJECT member not approved? (A part
          has no approval of its own: this lock is its approval)
        type: branch
        condition: composition.requireApprovedMembers and a direct project member is not approved
        onFalseStep: 4
      - stepNumber: 3
        description: >-
          Refuse, writing nothing, naming each drifted or never-approved direct member with its
          state and the remedy: lock each at its own root first. A parent never approves below
          itself
        type: throw
        error: composition.requireApprovedMembers
      - stepNumber: 4
        description: Read the declared externals this project never pinned
        type: call
        targetComponent: validator_portal
        targetMethod: unpinnedExternals
      - stepNumber: 5
        description: Read the uses of the pinned externals that their pins do not record
        type: call
        targetComponent: validator_portal
        targetMethod: unrecordedExternalUses
      - stepNumber: 6
        description: >-
          Is an external never pinned, or used beyond its pin? Neither is approved: nothing records
          what the design is judged against
        type: branch
        condition: an external is unpinned or used beyond its pin
        onFalseStep: 8
      - stepNumber: 7
        description: >-
          Refuse, writing nothing, naming each unpinned alias (pin first, then lock) or each alias
          with the uses its pin does not record (re-pin first)
        type: throw
        error: external not pinned
      - stepNumber: 8
        description: Approvable
        type: return
        outcome: ok
status: complete
