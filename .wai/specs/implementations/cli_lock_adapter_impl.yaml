id: cli_lock_adapter_impl
name: CLI Lock Adapter Implementation
description: >-
  Forwards the lock mechanics to the published portals: the owed inputs refreshed through the
  surfaces portal, the tree's approval identity and the members' approval states from the validator
  portal, the approval arithmetic and the commit-scoped lock record write to the approval portal,
  the configuration from the project config portal, and the read-only verdict that compares the
  record with the identity and reads the inputs. Realized by the existing lock command module.
  Writes this project's .wai/lock.json and .wai/inputs.lock.yaml, and nothing below the project.
contract: icli_lock_adapter
sourcePath: src/commands/lock.ts
methods:
  - name: lockTree
    narrative:
      - stepNumber: 1
        description: >-
          Compare this project's own specs against the approval on record, to summarize what changed
          since the last approval (a first approval says so instead of inventing a diff)
        type: call
        targetComponent: approval_portal
        targetMethod: diffAgainstApproval
      - stepNumber: 2
        description: >-
          A scoped lock (--subsystem): read the spec paths in that scope through the core portal, to
          tell a spec inside the scope from one outside it
        type: call
        targetComponent: spec_tree_portal
        targetMethod: specPathsInScope
      - stepNumber: 3
        label: scope-check
        description: >-
          A --subsystem lock narrows a RE-approval and never a first one: the approval identity a
          record certifies is the whole design's and policy's, so a record listing one subsystem
          while its identity covers the whole tree would pass lock-check over specs nobody reviewed.
          Is it a scoped lock that cannot be approved here: a subsystem of a member PROJECT
          (`<member>::<subsystem>`: approved at the member's own root, never by a parent, which
          never writes below itself), no approval on record (a first approval covers the whole
          tree), a spec OUTSIDE the scope that changed, was added or was removed since the approval,
          or an approval part besides the design that moved (rules, composition, network or
          selections: LockRecord.movedParts against the captured identity)?
        type: branch
        condition: '--subsystem was given and the scope cannot be approved alone'
        onFalseStep: 5
      - stepNumber: 4
        description: >-
          Refuse, writing nothing, saying why in one sentence: a member's subsystem is locked at the
          member's root (`wairon lock --subsystem <subsystem>` in its folder, named), a first
          approval covers the whole tree (`wairon lock` without --subsystem), or what moved outside
          the scope is named and the whole project must be re-approved together. A scoped lock that
          passes re-approves its scope and carries the rest forward exactly as previously approved,
          so the record, its identity, status and lock-check agree; a refused scope never reaches
          the "nothing has changed" summary or a success line
        type: throw
        error: a --subsystem lock that cannot be approved alone
      - stepNumber: 5
        label: members
        description: >-
          Read each DIRECT member's own approval state, each project member computed at its own root
          (depth 1), and each part with its content digest and the commit it was read at. Read for
          the summary and requireApprovedMembers only: this lock records no member
        type: call
        targetComponent: validator_portal
        targetMethod: familyApprovals
      - stepNumber: 6
        description: >-
          Read the approval on record: when no own spec moved, the summary must still say what did
          (an approval part such as the rule tuning, the network, `composition` or the pack
          selections, by LockRecord.movedParts; or the project id against the record's projectId),
          so a lock never answers "nothing has changed" while it clears a change
        type: call
        targetComponent: approval_portal
        targetMethod: readLockRecord
      - stepNumber: 7
        description: >-
          Read the specs of every kind (this component read and its siblings for subsystems,
          contracts, implementations and types) to say plainly how many of each are still draft or
          design: status is readiness, not approval, so the lock approves a draft design as it
          stands and says that is what it is doing
        type: call
        targetComponent: spec_tree_portal
        targetMethod: loadComponentSpecs
      - stepNumber: 8
        description: >-
          Print the summary: the own specs changed, added and removed (a part's specs among them,
          under `members/<alias>/…`, since a part is this project's own content; a spec whose
          storage moved with its content unchanged is a move, ApprovalDiff.moved, counted apart and
          never as a change; past a dozen paths per kind the first few, then a count of the rest and
          `--all`, which lists every one). When no own spec moved: either "nothing has changed" (the
          approval on record stays, its lockedAt kept, and .wai/lock.json left untouched by this run
          unless evidence beside the approval is refreshed: the code results, the design counts, or
          the parts, each named), unless another approver is locking (then their approval is
          recorded anew, said so); or, when an approval part or the project id moved, "no spec
          changed, but the policy it is approved under did", naming each part that moved. Whenever
          this lock records the policy for the first time or a policy part moved, the policy as it
          stands: projectType, each design rule severity override, the selected packs with their
          declared versions, a declared network, `composition`, so the human sees the tuning they
          approve. When any spec is still draft or design, how many of how many per kind, and that
          the approval covers them as they stand. The code results on a line of their own ("code: N
          errors, M warnings recorded beside the claim — CI enforces them, not the lock"). Then each
          direct project member with its own state (approved | drifted | never); when one is drifted
          at its own root, a warning that the right order is bottom-up: lock that member at its own
          root (its folder named), since lock-check refuses a family member whose own approval does
          not cover it. A member's approval is never recorded here and a member's re-lock never
          moves this approval. Then each part stored outside the project with the commit being
          approved. Then what `wairon validate --ci` would say of this project: the findings that
          fail it (every error, every warning not waived as draft-related, code findings included)
          with the draft-related warnings it waives, counted from the ordinary run while any spec is
          still draft or design and from the as-complete gate otherwise, or that it would pass:
          approval is not status, so a design that fails CI may still be locked, and the human is
          told what CI will do with it
        type: local
      - stepNumber: 9
        description: >-
          Refuse, writing nothing, what no lock may approve (cli_lock_adapter.assertApprovable,
          given the members and --force): a project that requires approved members with a member
          project not approved, or, without --force, a pending lock request made on another branch
          than the checkout has now
        type: call
        targetComponent: cli_lock_adapter
        targetMethod: assertApprovable
      - stepNumber: 10
        description: >-
          Confirm with the human (skipped under --yes; a non-interactive shell without --yes
          refuses)
        type: branch
        condition: the human declined the confirmation
        onFalseStep: 12
      - stepNumber: 11
        description: 'Declined: nothing was written to .wai/lock.json'
        type: return
        outcome: null (declined)
      - stepNumber: 12
        label: capture-specs
        description: >-
          Capture the approval: one design digest per OWN spec file, the project's own and its
          parts' (stage 8), a part's keyed `members/<alias>/<path inside the part>` so moving its
          storage changes no key. A scoped lock that passed the scope check captures the same:
          nothing outside its scope moved
        type: call
        targetComponent: approval_portal
        targetMethod: captureApprovedSpecs
      - stepNumber: 13
        description: 'Resolve who is approving: the git author identity, else user@hostname'
        type: call
        targetComponent: approval_portal
        targetMethod: localApprover
      - stepNumber: 14
        label: confirm
        description: Recompute the approval identity immediately before writing
        type: call
        targetComponent: validator_portal
        targetMethod: computeApprovalId
      - stepNumber: 15
        description: >-
          Did the design or its policy move while the lock ran, between the capture before
          validation and now, the confirmation prompt included?
        type: branch
        condition: the recomputed identity differs from the captured one
        onFalseStep: 17
      - stepNumber: 16
        description: >-
          Refuse, writing nothing: a spec or the policy changed while the lock ran, so the
          validation the human saw does not describe what would be recorded. Run the lock again
        type: throw
        error: the design changed while the lock ran
      - stepNumber: 17
        label: assemble
        description: >-
          Assemble a format-4 LockRecord: stateId = the captured identity (sha256+design+policy),
          parts = the captured identity's five parts (design, rules, composition, network,
          selections, each digested on its own so a later check names the part that moved),
          lockedAt, lockedBy, validatorVersion (provenance only), validationResult = the design
          half's counts (gate.designOnly()), status ready, projectId when there is one, specs = the
          per-spec design digests, and `code` = gate.analysis without its codes list. No members
          (each member's own lock is its approval) and no `upgraded` (only `wairon upgrade` writes
          that). A scoped lock that passed the scope check records the whole tree's digests and
          identity, exactly what an unscoped lock of the same tree records
        type: local
      - stepNumber: 18
        description: >-
          Is the assembled record the same APPROVAL as the record on file: the same identity, specs,
          format, project id and approver? The evidence recorded beside it (lockedAt,
          validatorVersion, parts, validationResult, code, an `upgraded` trace) is not the approval:
          when the approval is the same, nothing was approved anew
        type: branch
        condition: a record is on file and is the same approval as the assembled one
        onFalseStep: 20
      - stepNumber: 19
        description: >-
          Keep the record on file, its lockedAt and `upgraded` trace included, and return it, so the
          generated outputs are still refreshed. Write nothing unless evidence recorded beside the
          approval moved: the code results, the design counts, or parts that do not break down the
          identity it still matches (rewritten from the identity), each said, every other field
          kept; with none, `.wai/lock.json` is left untouched by this run, as the summary said
        type: return
        outcome: LockRecord
      - stepNumber: 20
        label: write
        description: Persist the commit-scoped lock record
        type: call
        targetComponent: approval_portal
        targetMethod: writeLockRecord
      - stepNumber: 21
        description: Return the written lock record
        type: return
        outcome: LockRecord
    symbol: runLock
  - name: checkApproval
    narrative:
      - stepNumber: 1
        label: tree-verdict
        description: >-
          Ask this adapter's tree verdict first: no L0 means no tree to approve (said so, approved
          unless strict), or, when spec files remain below a deleted L0, a tree whose root is gone,
          refused at every strictness. A repository with no tree must be TOLD so rather than judged
          "unapproved", and a deleted L0 must never read as no tree
        type: call
        targetComponent: cli_lock_adapter
        targetMethod: treeVerdict
      - stepNumber: 2
        description: Did the tree's presence decide the verdict?
        type: branch
        condition: treeVerdict answered a verdict
        onFalseStep: 4
      - stepNumber: 3
        description: Return the tree verdict as it was answered
        type: return
        outcome: no-tree or root missing
      - stepNumber: 4
        label: approval-identity
        description: >-
          Obtain the approval identity as it stands NOW from the validator portal: the own design
          and the own policy, which is what "has the approved design or the policy it was approved
          under changed" means. The per-spec digests are not the gate: they would move on a
          whitespace-only edit
        type: call
        targetComponent: validator_portal
        targetMethod: computeApprovalId
      - stepNumber: 5
        description: >-
          Resolve the committed record against that identity through the core portal, the one
          authority on the question: unlocked, locked or stale
        type: call
        targetComponent: approval_portal
        targetMethod: readLockState
      - stepNumber: 6
        description: >-
          Did the lock store refuse the record as written by an older wairon major (a format before
          4)?
        type: branch
        condition: the record on file is a format the lock store refuses
        onFalseStep: 8
      - stepNumber: 7
        description: >-
          Refuse at every strictness: the approval on record was written by an older wairon major
          and this release reads only format 4. The remedy: run `wairon upgrade` (it carries the
          approval over when the design is unchanged) and commit .wai/lock.json
        type: return
        outcome: older record
      - stepNumber: 8
        label: members
        description: >-
          Read the root's own approval entry and every member PROJECT's own approval at its own
          root, at every depth (parts are left out: a part has no approval of its own, its declaring
          project's is its approval). Each entry is the one `wairon status` and sdd_get_status print
          (family_validator.approvals), so this gate and status read one verdict. The root's own
          approval never records a member, so a member's state is read here, never from the root's
          record
        type: call
        targetComponent: validator_portal
        targetMethod: familyApprovals
      - stepNumber: 9
        description: Does a member project's own approval not cover it at its own root?
        type: branch
        condition: a member project is drifted
        onFalseStep: 12
      - stepNumber: 10
        description: >-
          Read the project graph for where each member project lives, so the verdict can name the
          folder to lock in
        type: call
        targetComponent: spec_tree_portal
        targetMethod: projectFamily
      - stepNumber: 11
        description: >-
          Refuse at every strictness: the family's merge gate is never green while a member's own
          approval does not cover it. Name each drifted member with its folder and its real state,
          in the member's own terms: its `owed` sentence (a moved project id), the approval parts
          that moved (partsMoved), else that its design changed since its own approval ("spec
          changes nobody approved" only when its specs did move); the remedy: `wairon lock` at that
          member's own root, then commit its .wai/lock.json. This project's own approval is not
          touched by it: a member's re-lock never re-opens it
        type: return
        outcome: member drifted
      - stepNumber: 12
        label: coverage
        description: >-
          Ask what the approval on record owes beside its identity and what the build owes
          (cli_lock_adapter.coverageVerdict): the configuration gone, a moved project id, or input
          debts
        type: call
        targetComponent: cli_lock_adapter
        targetMethod: coverageVerdict
      - stepNumber: 13
        description: Did it answer a refusal?
        type: branch
        condition: coverageVerdict answered a verdict
        onFalseStep: 15
      - stepNumber: 14
        description: Return that refusal as it was answered
        type: return
        outcome: stale (configuration or project id) or inputs owed
      - stepNumber: 15
        label: dispatch-state
        description: Turn this project's own lock state into the decision
        type: switch
        'on': the resolved lock state
        cases:
          - value: locked
            step: 16
          - value: stale
            step: 19
        defaultStep: 21
      - stepNumber: 16
        label: member-never
        description: Was --strict asked for while a member project was never approved at its own root?
        type: branch
        condition: strict was asked for and a member project has no approval of its own
        onFalseStep: 18
      - stepNumber: 17
        description: >-
          Refuse: --strict asks for an approved family, and these members were never approved by
          anyone. Name each with its folder and the remedy (`wairon lock` at its own root)
        type: return
        outcome: member never approved
      - stepNumber: 18
        label: verdict-locked
        description: >-
          The approval still covers this design and its policy, and the build owes nothing: pass,
          naming who approved it and when (lock_record.approvalStamp, never `undefined by unknown`)
          so the log carries the evidence, and how many member projects are approved at their own
          roots. A member that was never approved is named as NOT gated (only --strict fails it), so
          the verdict never calls the family approved while one of its projects was never approved.
          When the record's parts do not break down its identity (the own entry's partsIgnored), one
          notice says they are ignored and that `wairon lock` rewrites them: the identity alone
          decided the pass
        type: return
        outcome: locked
      - stepNumber: 19
        label: stale-own-diff
        description: >-
          Compare the own spec files with the approval's per-spec digests, so the verdict can say
          whether, and how many, own spec files moved since the approval
        type: call
        targetComponent: approval_portal
        targetMethod: diffAgainstApproval
      - stepNumber: 20
        description: >-
          The design, or the policy it was approved under, moved past the approval: refuse at every
          strictness, naming what moved: the count of own spec files changed, and each approval part
          that moved by name from the own entry's partsMoved (the rule tuning, `composition`, the
          network declaration after `wairon network declare`, the pack selections); and the remedy:
          re-run the lock and commit the updated record. Never a pin, a member or the wairon
          release: none of them is part of the approval
        type: return
        outcome: stale
      - stepNumber: 21
        label: unlocked
        description: >-
          Never approved: ask the shared predicate whether the tree holds design, to tell a tree
          with a design to approve (types and the export table included) from one that holds the L0
          and nothing below it
        type: call
        targetComponent: spec_tree_portal
        targetMethod: holdsDesign
      - stepNumber: 22
        description: >-
          Never approved: the opt-in seam. A tree holding the L0 and nothing below it has nothing
          approvable yet, said as `wairon lock` says it (which writes no record there); it never
          prescribes adding a subsystem. Any other tree: plain lock-check fails only a committed
          approval that no longer matches, so a project with no .wai/lock.json is not gated, which
          is why CI runs `wairon lock-check --strict`. Without strict, pass with that notice; with
          strict, refuse: there is no approved design
        type: return
        outcome: unlocked
  - name: holdsNoDesign
    narrative:
      - stepNumber: 1
        description: >-
          Ask the shared predicate whether the tree holds design: a subsystem, a type anywhere
          (root-level, in a type group, in a subsystem), an L0 export entry or a direct member
          project. Types and the export table ARE design: a types-only project is lockable.
        type: call
        targetComponent: spec_tree_portal
        targetMethod: holdsDesign
      - stepNumber: 2
        description: >-
          Read the approval on record: a tree emptied after an approval still has that change to
          approve, so only a never-approved tree can hold nothing to approve
        type: call
        targetComponent: approval_portal
        targetMethod: readLockRecord
      - stepNumber: 3
        description: >-
          Answer true when the tree holds no design and no approval is on record — an L0 with
          nothing below it: no subsystem, no type, no export entry, no member project. `validate`
          and `status` word the same verdict (nothing approvable yet) from the same predicate.
        type: return
        outcome: whether there is nothing approvable
  - name: treeVerdict
    narrative:
      - stepNumber: 1
        label: load-system
        description: Ask the core portal for the L0 system spec
        type: call
        targetComponent: spec_tree_portal
        targetMethod: loadSystemSpec
      - stepNumber: 2
        description: Is the L0 there?
        type: branch
        condition: the system spec loaded
        onTrueStep: 10
        onFalseStep: 3
      - stepNumber: 3
        label: orphaned-files
        description: >-
          No L0: ask the spec maintenance portal which spec files are left standing below the specs
          folder. A tree whose root was deleted still holds a design
        type: call
        targetComponent: spec_maintenance_portal
        targetMethod: findOrphanedSpecFiles
      - stepNumber: 4
        description: >-
          Do spec files remain below the missing or unreadable L0, or is the L0 file there but
          unreadable?
        type: branch
        condition: spec files remain
        onTrueStep: 5
        onFalseStep: 6
      - stepNumber: 5
        label: verdict-root-missing
        description: >-
          Refuse at every strictness: the L0 System spec (.wai/specs/.index.yaml) is missing — or is
          there but cannot be read (empty, null, not YAML, failing its schema; said apart, with
          `wairon validate` naming why) — while spec files remain below it (the count and the first
          few named), so the design is still there, cannot be judged and is not approved — with the
          fix: restore it from version control. An L0 that cannot be read is refused even with
          nothing below it: a broken root is never no tree
        type: return
        outcome: unlocked (root missing)
      - stepNumber: 6
        label: record-on-file
        description: >-
          No L0 and no spec file: read the approval on record. A project with an approval on record
          opted in, so the tree it approved being gone is a deleted design, never no tree
        type: call
        targetComponent: approval_portal
        targetMethod: readLockRecord
      - stepNumber: 7
        description: Does the record approve spec files (lock_record.missingTreeSentence)?
        type: branch
        condition: the record approved spec files
        onTrueStep: 8
        onFalseStep: 9
      - stepNumber: 8
        label: verdict-tree-missing
        description: >-
          Refuse at every strictness with lock_record.missingTreeSentence: the approval records N
          spec files and the tree is gone, so the design it approved cannot be judged — restore it
          from version control, or, to retire the design, delete .wai/lock.json in the same change
        type: return
        outcome: unlocked (tree missing)
      - stepNumber: 9
        label: verdict-no-tree
        description: >-
          No tree: report that this repository carries no spec tree, approved unless strict was
          asked for
        type: return
        outcome: no-tree
      - stepNumber: 10
        label: has-tree
        description: 'The L0 is there: no verdict from the tree''s presence'
        type: return
        outcome: none
  - name: coverageVerdict
    narrative:
      - stepNumber: 1
        description: >-
          Read the project configuration, to judge its id against the one the approval recorded. The
          approval identity does not cover the id, so without this read a hand-edited id that
          `validate` reports and `lock` refuses would pass the merge gate
        type: call
        targetComponent: project_config_portal
        targetMethod: loadProjectConfig
      - stepNumber: 2
        description: >-
          Is the configuration the approval was taken under gone? A lock record certifies a design
          under the policy .wai/project.yaml declares (rule tuning, projectType, pack selections,
          network, composition) and under its project id
        type: branch
        condition: no configuration loads and no .wai/project.yaml is on disk
        onTrueStep: 3
        onFalseStep: 4
      - stepNumber: 3
        description: >-
          Refuse at every strictness, naming the missing .wai/project.yaml — never blaming the
          inputs it held (the network, the rule tuning) as if they had been edited — and the fix:
          restore it from version control
        type: return
        outcome: stale (configuration missing)
      - stepNumber: 4
        description: >-
          Resolve the configured identity against the recorded projectId —
          project_config.identity(record.projectId), the very resolution the project-identity rule
          judges PROJECT_ID_CHANGED and PROJECT_ID_RENAMED by. No record, or a configuration that
          does not load, names no problem here
        type: local
      - stepNumber: 5
        description: >-
          Did the id move since the approval (changed by hand, or renamed with its re-lock not yet
          taken)?
        type: branch
        condition: the identity names a changed or renamed id
        onFalseStep: 7
      - stepNumber: 6
        description: >-
          Refuse at every strictness, naming the approved id and the configured one: changed by hand
          — restore it, then rename deliberately with `wairon project rename <id>` and re-lock;
          renamed — `wairon lock` re-approves the design under the new id
        type: return
        outcome: stale (project id)
      - stepNumber: 7
        description: >-
          Does the root's own entry carry input debts (ProjectApproval.inputs): an external never
          pinned or used beyond its pin, a selected pack not recorded, changed since it was recorded
          or unable to load, or, under requireApprovedMembers, a direct member not approved at its
          own root?
        type: branch
        condition: the own entry's inputs are not empty
        onFalseStep: 9
      - stepNumber: 8
        description: >-
          Refuse, saying the design is approved and its build owes inputs, then each debt's sentence
          with its fix (InputDebt.sentence): `wairon externals pin <alias>` for an external, `wairon
          pack sync` for a pack (or make it load: install or vendor it, or drop the selection), and
          `wairon lock` at the member's own root for a member. A re-lock of this project is never
          the remedy: inputs are not the approval
        type: return
        outcome: inputs owed
      - stepNumber: 9
        label: none
        description: 'Nothing owed: no verdict'
        type: return
        outcome: none
  - name: assertApprovable
    narrative:
      - stepNumber: 1
        description: 'Read the project configuration: its composition block (requireApprovedMembers)'
        type: call
        targetComponent: project_config_portal
        targetMethod: loadProjectConfig
      - stepNumber: 2
        description: >-
          Does the project require approved members, and is a PROJECT member not approved? (A part
          has no approval of its own: this lock is its approval)
        type: branch
        condition: composition.requireApprovedMembers and a direct project member is not approved
        onFalseStep: 4
      - stepNumber: 3
        description: >-
          Refuse, writing nothing, naming each drifted or never-approved direct member with its
          state and the remedy: lock each at its own root first. A parent never approves below
          itself
        type: throw
        error: composition.requireApprovedMembers
      - stepNumber: 4
        description: Read the newest pending lock request made on another branch than the checkout has now
        type: call
        targetComponent: approval_portal
        targetMethod: reviewBranchConflict
      - stepNumber: 5
        description: >-
          Would this lock approve another branch's design than the one an agent asked to have
          approved, and was --force not given?
        type: branch
        condition: a conflict was answered and force is not set
        onFalseStep: 7
      - stepNumber: 6
        description: >-
          Refuse, writing nothing, naming the request, the branch it was made on and the branch
          checked out: switch back to that branch to approve what was asked, or pass --force to
          approve this checkout's design anyway
        type: throw
        error: the pending lock request was made on another branch
      - stepNumber: 7
        description: Approvable
        type: return
        outcome: ok
  - name: refreshInputs
    narrative:
      - stepNumber: 1
        description: Read the declared hosted and git externals the inputs lock holds no entry for
        type: call
        targetComponent: validator_portal
        targetMethod: unpinnedExternals
      - stepNumber: 2
        description: Read the uses of the pinned externals their pins do not record
        type: call
        targetComponent: validator_portal
        targetMethod: unrecordedExternalUses
      - stepNumber: 3
        description: Is any external owed?
        type: branch
        condition: an alias is unpinned or used beyond its pin
        onFalseStep: 5
      - stepNumber: 4
        description: >-
          Pin exactly those aliases, each from its producer's approved state; every other pin stays
          as it is. A refused pin (a producer with no approved design, a used member renamed or
          removed) keeps its previous pin and is kept as an outcome to report
        type: call
        targetComponent: surface_portal
        targetMethod: pinExternals
      - stepNumber: 5
        label: packs
        description: >-
          Resolve the selected packs as they load now: declared and resolved versions, source and
          doctrine digest
        type: call
        targetComponent: validator_portal
        targetMethod: resolvedPacks
      - stepNumber: 6
        description: Record them in the inputs lock's packs section (a no-op when it already says exactly this)
        type: call
        targetComponent: surface_portal
        targetMethod: recordPacks
      - stepNumber: 7
