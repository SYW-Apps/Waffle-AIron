id: project_config_fs_adapter_impl
name: Project Config FS Adapter Implementation
description: >-
  File I/O for `.wai/project.yaml` at the bound project root: raw documents in, and every document
  write an edit of the file's YAML node tree that keeps its comments.
contract: iproject_config_fs_adapter
sourcePath: src/config/project-config.ts
methods:
  - name: readDocument
    narrative: []
    intent: >-
      Reads `project.yaml` from the bound project's `.wai` directory (or legacy `.wairon`) as raw
      YAML and returns the parsed document, or null when the file is absent. A malformed document
      raises the YAML error with the file path; nothing is defaulted or validated here.
  - name: writeDocument
    narrative: []
    intent: >-
      With no project.yaml yet, serializes the document and writes it fresh, creating the `.wai`
      directory when missing. Otherwise reads the file's text and parses it into a
      comment-preserving YAML document (the node tree, not a plain object — the js-yaml parser used
      for reads drops comments, so this needs a YAML library whose document model keeps them), then
      reconciles the tree to the given document recursively: a mapping key present on both sides
      recurses into its value and keeps its node, comments and position; a scalar whose value
      changed is replaced in place, keeping its node's comments; a key the document no longer holds
      is deleted; a key it newly holds is appended after the existing keys of its mapping; a
      sequence is reconciled by position — equal items keep their nodes, changed items are
      reconciled in place, surplus items are deleted, new items appended. The tree is serialized,
      the result parsed again and compared with the given document: a difference is refused with an
      error naming the project root and nothing is written. Otherwise the text replaces the file,
      keeping the file's line endings. A plain replacement, not an atomic rename, like every write
      of this adapter.
  - name: documentExists
    narrative: []
    intent: >-
      Reports whether the bound project's `project.yaml` exists; an unreadable directory counts as
      absent.
  - name: readText
    narrative: []
    intent: >-
      Reads `project.yaml` from the bound project's `.wai` directory (or legacy `.wairon`) as text,
      byte for byte — comments, quoting and line endings included — or null when the file is absent.
      Nothing is parsed here.
  - name: writeText
    narrative: []
    intent: >-
      Writes the given text to `project.yaml` in the bound project's `.wai` directory verbatim,
      replacing the file. A plain replacement, as every write of this adapter is.
detail: intent
status: complete
