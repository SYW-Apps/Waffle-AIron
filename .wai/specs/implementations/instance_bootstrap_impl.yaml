id: instance_bootstrap_impl
name: Instance Bootstrap Implementation
description: >-
  One-time boot initialization of a hosted instance, run before its listeners bind: seeds or loads
  the persisted instance identity and, under devMode, creates the synthetic local development unit
  when it is missing.
contract: iinstance_bootstrap
sourcePath: src/server/instance-bootstrap.ts
methods:
  - name: seed
    narrative:
      - stepNumber: 1
        description: >-
          Seed-or-load the boot-reserved built-in subject UUIDs (first boot generates and persists
          them to instance.json; later boots return the record unchanged)
        type: call
        targetComponent: instance_identity_repository
        targetMethod: ensureSeeded
        assertsGuarantees:
          - idempotent
      - stepNumber: 2
        description: If devMode is not enabled, skip the synthetic local development unit
        type: branch
        condition: config.devMode is enabled
        onTrueStep: 3
        onFalseStep: 6
      - stepNumber: 3
        description: Look up the synthetic local development unit
        type: call
        targetComponent: organization_repository
        targetMethod: getUnit
      - stepNumber: 4
        description: If the synthetic local development unit already exists, skip creation
        type: branch
        condition: the synthetic local development unit already exists
        onTrueStep: 6
        onFalseStep: 5
      - stepNumber: 5
        description: >-
          Create the synthetic local development unit so dev projects can always be placed (unitId
          is required at creation)
        type: call
        targetComponent: organization_repository
        targetMethod: createUnit
      - stepNumber: 6
        description: Return once the instance is seeded
        type: return
        outcome: seeded
    symbol: bootstrapInstance
detail: full
status: draft
