id: instance_bootstrap_impl
name: Instance Bootstrap Implementation
description: >-
  One-time boot initialization of a hosted instance, run before its listeners bind: seeds or loads
  the persisted instance identity and, under devMode, creates the synthetic local development unit
  when it is missing and places every unplaced project into it.
contract: iinstance_bootstrap
sourcePath: src/server/instance-bootstrap.ts
methods:
  - name: seed
    narrative:
      - stepNumber: 1
        description: 'Read whether the instance was ever seeded: none means this boot creates the data directory'
        type: call
        targetComponent: instance_identity_repository
        targetMethod: get
      - stepNumber: 2
        description: >-
          Seed-or-load the boot-reserved built-in subject UUIDs (first boot generates and persists
          them to instance.json; later boots return the record unchanged)
        type: call
        targetComponent: instance_identity_repository
        targetMethod: ensureSeeded
        assertsGuarantees:
          - idempotent
      - stepNumber: 3
        description: Is this the first boot?
        type: branch
        condition: the instance was seeded before this boot
        onTrueStep: 5
        onFalseStep: 4
      - stepNumber: 4
        description: >-
          Record the running major: a data directory this release creates is current, so its first
          start takes no backup and runs no upgrade step
        type: call
        targetComponent: instance_version_store
        targetMethod: write
      - stepNumber: 5
        description: If devMode is not enabled, skip the synthetic local development unit
        type: branch
        condition: config.devMode is enabled
        onTrueStep: 6
        onFalseStep: 13
      - stepNumber: 6
        description: Look up the synthetic local development unit
        type: call
        targetComponent: organization_repository
        targetMethod: getUnit
      - stepNumber: 7
        description: If the synthetic local development unit already exists, skip creation
        type: branch
        condition: the synthetic local development unit already exists
        onTrueStep: 9
        onFalseStep: 8
      - stepNumber: 8
        description: >-
          Create the synthetic local development unit so dev projects can always be placed (unitId
          is required at creation)
        type: call
        targetComponent: organization_repository
        targetMethod: createUnit
      - stepNumber: 9
        label: records
        description: >-
          List the project records the dev data dir holds (the one `wairon dev` registered at the
          working directory)
        type: call
        targetComponent: project_repository
        targetMethod: list
      - stepNumber: 10
        description: List the placements already recorded, so a placed project is never placed twice
        type: call
        targetComponent: organization_repository
        targetMethod: listPlacements
      - stepNumber: 11
        description: For each record no placement holds
        type: loop
        loopKind: forEach
        over: the records no placement holds
        endStep: 12
      - stepNumber: 12
        label: place
        description: >-
          Place it in the synthetic local development unit as its owner — so the dev server's own
          data dir never reads as unmigrated at its next boot
        type: call
        targetComponent: organization_repository
        targetMethod: placeProject
      - stepNumber: 13
        label: seeded
        description: Return once the instance is seeded
        type: return
        outcome: seeded
    symbol: bootstrapInstance
detail: full
status: complete
