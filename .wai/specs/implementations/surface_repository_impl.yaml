id: surface_repository_impl
name: Surface Repository Implementation
description: 'src/core/surfaces.ts: facade forwarding, each method one call to the Surface Store.'
contract: isurface_repository
sourcePath: src/core/surfaces.ts
methods:
  - name: saveSnapshot
    narrative:
      - stepNumber: 1
        description: Write through the surface store
        type: call
        targetComponent: surface_store
        targetMethod: put
    exportedVia: surfaceRepository
  - name: getSnapshot
    narrative:
      - stepNumber: 1
        description: Read through the surface store
        type: call
        targetComponent: surface_store
        targetMethod: get
    exportedVia: surfaceRepository
  - name: listSnapshots
    narrative:
      - stepNumber: 1
        description: Read through the surface store
        type: call
        targetComponent: surface_store
        targetMethod: list
    exportedVia: surfaceRepository
  - name: removeSnapshot
    narrative:
      - stepNumber: 1
        description: Remove through the surface store
        type: call
        targetComponent: surface_store
        targetMethod: remove
    exportedVia: surfaceRepository
status: complete
