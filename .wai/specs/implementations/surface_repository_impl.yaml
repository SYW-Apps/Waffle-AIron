id: surface_repository_impl
name: Surface Repository Implementation
description: 'Facade forwarding: writes through the registry, reads through the index.'
contract: isurface_repository
sourcePath: src/core/surfaces.ts
methods:
  - name: saveSnapshot
    narrative:
      - stepNumber: 1
        description: Forward to the registry write path
        type: call
        targetComponent: surface_registry
        targetMethod: upsertSnapshot
  - name: getSnapshot
    narrative:
      - stepNumber: 1
        description: Read through the index
        type: call
        targetComponent: surface_index
        targetMethod: byProject
  - name: listSnapshots
    narrative:
      - stepNumber: 1
        description: Read through the index at the given project root
        type: call
        targetComponent: surface_index
        targetMethod: all
  - name: removeSnapshot
    narrative:
      - stepNumber: 1
        description: Forward to the registry write path
        type: call
        targetComponent: surface_registry
        targetMethod: deleteSnapshot
  - name: hydrate
    narrative:
      - stepNumber: 1
        description: Forward to the registry's file read-back
        type: call
        targetComponent: surface_registry
        targetMethod: hydrateFromFiles
    symbol: loadSurfaceSnapshots
  - name: readExternalsLock
    narrative:
      - stepNumber: 1
        description: Read through the externals lock store
        type: call
        targetComponent: externals_lock_store
        targetMethod: read
  - name: saveExternalsLock
    narrative:
      - stepNumber: 1
        description: Write through the externals lock store
        type: call
        targetComponent: externals_lock_store
        targetMethod: write
  - name: readExternalSnapshot
    narrative:
      - stepNumber: 1
        description: Read through the externals lock store
        type: call
        targetComponent: externals_lock_store
        targetMethod: readSnapshot
  - name: saveExternalSnapshot
    narrative:
      - stepNumber: 1
        description: Write through the externals lock store
        type: call
        targetComponent: externals_lock_store
        targetMethod: writeSnapshot
  - name: removeExternalSnapshot
    narrative:
      - stepNumber: 1
        description: Remove through the externals lock store
        type: call
        targetComponent: externals_lock_store
        targetMethod: removeSnapshot
status: complete
