id: cli_validator_adapter_impl
name: CLI Validator Adapter Implementation
description: Concrete implementation forwarding validation requests to the validator portal.
contract: icli_validator_adapter
sourcePath: src/commands/validate.ts
methods:
  - name: validateProject
    narrative:
      - stepNumber: 1
        description: Call validateProject on the validator portal
        type: call
        targetComponent: validator_portal
        targetMethod: validateProject
  - name: validateRegistry
    narrative:
      - stepNumber: 1
        description: Call validateRegistry on the validator portal
        type: call
        targetComponent: validator_portal
        targetMethod: validateRegistry
  - name: validateProjectConfig
    narrative:
      - stepNumber: 1
        description: Call validateProjectConfig on the validator portal
        type: call
        targetComponent: validator_portal
        targetMethod: validateProjectConfig
  - name: validateAsComplete
    narrative:
      - stepNumber: 1
        description: Forward the as-complete conformance gate to the validator portal
        type: call
        targetComponent: validator_portal
        targetMethod: validateAsComplete
  - name: runValidation
    narrative:
      - stepNumber: 1
        description: >-
          Read the project configuration through the core portal: its rules and projectType govern
          the tree check, and the configuration itself is checked below.
        type: call
        targetComponent: project_config_portal
        targetMethod: loadProjectConfig
      - stepNumber: 2
        description: >-
          Resolve the agent registry through the core portal, scoped to a subsystem when one was
          named.
        type: call
        targetComponent: agent_context_portal
        targetMethod: loadRegistry
      - stepNumber: 3
        description: >-
          List the spec files still stored under a legacy name through the core portal, and warn
          that `wairon doctor --fix` migrates them.
        type: call
        targetComponent: spec_maintenance_portal
        targetMethod: findLegacySpecFiles
      - stepNumber: 4
        description: Check the registry's topology rules.
        type: call
        targetComponent: cli_validator_adapter
        targetMethod: validateRegistry
      - stepNumber: 5
        description: Check the project configuration.
        type: call
        targetComponent: cli_validator_adapter
        targetMethod: validateProjectConfig
      - stepNumber: 6
        label: orphaned
        description: >-
          When the specs folder holds no L0 (and the project is no part), ask the core portal which
          spec files are left standing below it: any is reported as an error naming the missing
          .wai/specs/.index.yaml, how many files it leaves unjudged and the fix (restore it from
          version control) — never as "nothing to check yet: the spec tree is empty", which turned a
          deleted L0 into a green `validate --ci`
        type: call
        targetComponent: spec_maintenance_portal
        targetMethod: findOrphanedSpecFiles
      - stepNumber: 7
        description: >-
          When the specs folder holds no L0 and no spec file below it: read the approval on record.
          A record that approved spec files (lock_record.missingTreeSentence) makes the absent tree
          a deleted design — reported as an error with that sentence, so `validate` fails closed as
          `lock-check` and `status` do — never "nothing to check yet", which is said only of a
          project that never approved a design
        type: call
        targetComponent: approval_portal
        targetMethod: readLockRecord
      - stepNumber: 8
        description: >-
          Which spec-tree check? validation_options.selectsFamily(the configuration declares
          members): the family run at a parent or with --family, the owner's gate otherwise
        type: branch
        condition: the options select the family run
        onFalseStep: 11
      - stepNumber: 9
        description: >-
          Run the family run: every selected project's own gate, the composition findings and the
          family checks
        type: call
        targetComponent: cli_validator_adapter
        targetMethod: validateFamily
      - stepNumber: 10
        description: 'The family run already holds the owner''s gate of every selected project: go render'
        type: jump
        toStep: 12
      - stepNumber: 11
        label: ownerGate
        description: >-
          Run the owner's gate over the bound project alone (skipped when the family run ran — the
          family run already includes it)
        type: call
        targetComponent: cli_validator_adapter
        targetMethod: validateProject
      - stepNumber: 12
        label: advise
        description: >-
          Compare, offline and advisory, every external the run did not compose with its live
          producer (passing the aliases a family run composed in reach): what moved, who uses it,
          the fix
        type: call
        targetComponent: cli_validator_adapter
        targetMethod: adviseExternals
      - stepNumber: 13
        description: >-
          The approval line: read the bound project's own approval entry (depth 0). When its
          approval was taken under another wairon release, say so in one line beside the findings —
          carried: `approved under <old>, re-validated under <new>: still approved`; not carried:
          `the new release finds N issue(s) in the approved design`, naming them — the very verdict
          `lock-check` exits on. Informational: it is never part of the failure decision
        type: call
        targetComponent: cli_validator_adapter
        targetMethod: familyApprovals
      - stepNumber: 14
        label: render
        description: >-
          Render every finding — errors, warnings and notices each as their own kind, with a count
          of the notices; in a family run each project's findings under its project key, the
          composition and family findings after them — then the advisory findings in their own
          section, "Externals, compared live (advisory: the pin gates)", each naming the moved
          member, the specs that use it and the fix (adapt, then `wairon externals pin <alias>`),
          and the not-compared ones with the command that compares them; say out loud how much
          conformance debt the project's register carries, and exit non-zero when errors were
          reported — or, under --ci, when warnings were. Notices and advisory findings never fail
          the run, under --ci or without it.
        type: local
    symbol: runValidate
  - name: computeGateStateId
    narrative:
      - stepNumber: 1
        description: Call computeGateStateId on the validator portal
        type: call
        targetComponent: validator_portal
        targetMethod: computeGateStateId
  - name: validateFamily
    narrative:
      - stepNumber: 1
        description: Call validateFamily on the validator portal
        type: call
        targetComponent: validator_portal
        targetMethod: validateFamily
  - name: familyApprovals
    narrative:
      - stepNumber: 1
        description: Forward to the validator portal's pin tree
        type: call
        targetComponent: validator_portal
        targetMethod: familyApprovals
  - name: familyRelations
    narrative:
      - stepNumber: 1
        description: Forward to the validator portal's relation health
        type: call
        targetComponent: validator_portal
        targetMethod: familyRelations
  - name: adviseExternals
    narrative:
      - stepNumber: 1
        description: Forward to the validator portal's advisory live comparison
        type: call
        targetComponent: validator_portal
        targetMethod: adviseExternals
status: complete
createdAt: '2026-06-19T12:00:00Z'
updatedAt: '2026-10-09T00:18:36.183Z'
