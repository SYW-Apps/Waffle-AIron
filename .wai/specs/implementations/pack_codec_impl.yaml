id: pack_codec_impl
name: Pack Codec Implementation
description: >-
  sdk/src/codec.ts — pure format + safety logic. planExtraction is the single safety chokepoint;
  sealIntegrity/verifyIntegrity are the produce/verify pair; no I/O.
contract: ipack_codec
sourcePath: sdk/src/codec.ts
methods:
  - name: parseManifest
    narrative:
      - stepNumber: 1
        description: >-
          Parse the envelope YAML text (fail with PackArchiveError ENVELOPE_INVALID on malformed
          YAML or a non-mapping).
        type: local
      - stepNumber: 2
        description: >-
          Validate the required fields (formatVersion, name, version, kind, entry) are present and
          well-typed; fail with PackArchiveError ENVELOPE_INVALID naming the field on any
          missing/invalid.
        type: local
      - stepNumber: 3
        description: Is the format major newer than this wairon supports?
        type: branch
        condition: manifest.formatVersion major exceeds the supported version
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Fail loudly on a newer format rather than silently mis-read it.
        type: throw
        error: PackArchiveError FORMAT_VERSION_UNSUPPORTED
      - stepNumber: 5
        description: Return the parsed PackArchiveManifest.
        type: return
        outcome: success
  - name: serializeManifest
    narrative:
      - stepNumber: 1
        description: Drop undefined optional fields for a clean, canonical envelope.
        type: local
      - stepNumber: 2
        description: Return the wairon-pack.yaml text.
        type: return
        outcome: success
  - name: defaultLimits
    narrative:
      - stepNumber: 1
        description: >-
          Return the default caps profile: 4096 entries, 32 MiB total inflated, 8 MiB per entry,
          100:1 compression ratio, depth 16.
        type: return
        outcome: success
  - name: planExtraction
    narrative:
      - stepNumber: 1
        description: 'Resolve effective caps: each field of `limits` over the default profile.'
        type: local
      - stepNumber: 2
        description: Initialize an empty approved-path list and a running total of 0.
        type: local
      - stepNumber: 3
        description: Vet each enumerated entry.
        type: loop
        loopKind: forEach
        over: entries
        endStep: 8
      - stepNumber: 4
        description: >-
          Reject symlinks, unknown non-file kinds, and structurally unsafe paths. (Directory entries
          carry no bytes and are skipped — writeTree recreates directories from the written file
          paths.)
        type: branch
        condition: >-
          entry.kind is a symlink or an unknown non-file kind, or path is absolute / contains '..' /
          uses a backslash or drive letter
        onTrueStep: 10
        onFalseStep: 5
      - stepNumber: 5
        description: Normalize the entry path to a destination-relative POSIX path.
        type: local
      - stepNumber: 6
        description: Reject zip-slip paths.
        type: branch
        condition: the normalized path escapes the destination (zip-slip)
        onTrueStep: 10
        onFalseStep: 7
      - stepNumber: 7
        description: Reject over-deep paths, oversized entries and zip bombs.
        type: branch
        condition: >-
          the path's depth exceeds maxDepth, uncompressedSize exceeds maxEntryBytes, or
          uncompressedSize/compressedSize exceeds maxCompressionRatio
        onTrueStep: 11
        onFalseStep: 8
      - stepNumber: 8
        label: vetEnd
        description: >-
          Accept: append the normalized path of this regular file to approved; add its
          uncompressedSize to the total.
        type: local
      - stepNumber: 9
        description: Reject archives exceeding the aggregate caps.
        type: branch
        condition: approved length exceeds maxEntries, or total exceeds maxTotalUncompressedBytes
        onTrueStep: 11
        onFalseStep: 12
      - stepNumber: 10
        label: unsafe
        description: >-
          Reject an unsafe entry: a symlink or non-file kind, or an unsafe or escaping path, naming
          the entry.
        type: throw
        error: PackArchiveError UNSAFE_PATH
      - stepNumber: 11
        label: limit
        description: Reject an entry or an archive over a cap, naming the cap and the entry when there is one.
        type: throw
        error: PackArchiveError LIMIT_EXCEEDED
      - stepNumber: 12
        description: Return the PackExtractionPlan (approved paths + total).
        type: return
        outcome: success
  - name: verifyIdentity
    narrative:
      - stepNumber: 1
        description: Do envelope name/version differ from the inner pack manifest?
        type: branch
        condition: manifest.name != packName or manifest.version != packVersion
        onTrueStep: 2
        onFalseStep: 3
      - stepNumber: 2
        description: Reject a tampered/mis-assembled archive.
        type: throw
        error: PackArchiveError IDENTITY_MISMATCH
      - stepNumber: 3
        description: Identity verified.
        type: return
        outcome: success
  - name: verifyIntegrity
    narrative:
      - stepNumber: 1
        description: Did the envelope carry no integrity data?
        type: branch
        condition: manifest has no entryDigests
        onTrueStep: 2
        onFalseStep: 3
      - stepNumber: 2
        description: No integrity data present — return false.
        type: return
        outcome: no integrity data
      - stepNumber: 3
        description: >-
          Does entryDigests name a file the archive does not hold, or does the envelope's overall
          digest differ from the one recomputed over its sorted entryDigests (when it carries one)?
        type: branch
        condition: >-
          an entryDigests key names no file among the files, or manifest.digest is set and differs
          from sha256 over the canonical sorted entryDigests
        onTrueStep: 8
        onFalseStep: 4
      - stepNumber: 4
        description: >-
          Check each PAYLOAD file's digest (the wairon-pack.yaml envelope is skipped — it carries
          the digests, so it can never digest itself).
        type: loop
        loopKind: forEach
        over: files
        endStep: 6
      - stepNumber: 5
        description: >-
          Does the recomputed sha256 of this payload file differ from the recorded
          entryDigests[file.path]?
        type: branch
        condition: sha256(file.contents) != entryDigests[file.path]
        onTrueStep: 8
        onFalseStep: 6
      - stepNumber: 6
        label: checkEnd
        description: This file's digest matches.
        type: local
      - stepNumber: 7
        description: All digests matched — return true.
        type: return
        outcome: verified
      - stepNumber: 8
        label: mismatch
        description: A digest mismatch means tampering.
        type: throw
        error: PackArchiveError DIGEST_MISMATCH
  - name: sealIntegrity
    narrative:
      - stepNumber: 1
        description: Initialize an empty entryDigests map.
        type: local
      - stepNumber: 2
        description: >-
          Hash each PAYLOAD file (the wairon-pack.yaml envelope is excluded — it is the digest
          carrier and is re-sealed after).
        type: loop
        loopKind: forEach
        over: files
        endStep: 3
      - stepNumber: 3
        label: hashEnd
        description: >-
          Compute sha256(file.contents) and record it under file.path (skipping the envelope
          itself).
        type: local
      - stepNumber: 4
        description: Compute an overall manifest digest over the sorted entryDigests.
        type: local
      - stepNumber: 5
        description: >-
          Set manifest.entryDigests, manifest.digest, manifest.generatedBy, and
          manifest.generatedAt.
        type: local
      - stepNumber: 6
        description: Return the sealed manifest.
        type: return
        outcome: success
  - name: checkCompatibility
    narrative:
      - stepNumber: 1
        description: Is the archive format unsupported?
        type: branch
        condition: manifest.formatVersion is unsupported
        onTrueStep: 4
        onFalseStep: 2
      - stepNumber: 2
        description: >-
          Is the running wairon below the pack's minimum? Versions compare on their release core
          (major.minor.patch): a pre-release of a version counts as that version, so a dev build of
          6.7.4 satisfies a minimum of 6.7.4.
        type: branch
        condition: minWaironVersion is set and the running wairon is below it
        onTrueStep: 4
        onFalseStep: 3
      - stepNumber: 3
        description: Compatible.
        type: return
        outcome: compatible
      - stepNumber: 4
        label: incompatible
        description: Incompatible.
        type: return
        outcome: incompatible
  - name: contentDigest
    narrative:
      - stepNumber: 1
        description: >-
          Normalize each path to forward slashes and drop the files the digest skips (.install.yaml,
          anything under .git or node_modules, .DS_Store)
        type: local
      - stepNumber: 2
        description: Sort the remaining files by path, ordinal
        type: local
      - stepNumber: 3
        description: 'Fold each file into one sha256: its path, a NUL byte, its bytes, a NUL byte'
        type: local
      - stepNumber: 4
        description: Return the digest as sha256-<lowercase hex>
        type: return
        outcome: the content integrity
  - name: parseInnerManifest
    sourcePath: sdk/src/codec.ts
    narrative:
      - stepNumber: 1
        description: >-
          Pick the inner manifest's path: package.json for a code pack, the envelope's entry
          (pack.yaml) for a declarative pack
        type: local
      - stepNumber: 2
        description: Is it missing among the files?
        type: branch
        condition: no file has that path
        onTrueStep: 5
        onFalseStep: 3
      - stepNumber: 3
        description: 'Parse it: JSON for package.json, YAML for pack.yaml'
        type: local
      - stepNumber: 4
        description: Unparseable or not a mapping?
        type: branch
        condition: the text does not parse, or parses to something other than a mapping
        onTrueStep: 5
        onFalseStep: 6
      - stepNumber: 5
        description: Refuse, naming the path
        type: throw
        error: PackArchiveError PACK_MANIFEST_INVALID
      - stepNumber: 6
        description: Return the mapping as authored
        type: return
        outcome: the inner pack manifest
status: complete
