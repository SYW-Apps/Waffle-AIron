id: rule_store_impl
name: Rule Store Implementation
description: >-
  In-memory rule set held in src/core/rules/index.ts. Authoritative for one validation run; rebuilt
  on the next.
contract: irule_store
sourcePath: src/core/rules/index.ts
methods:
  - name: addRule
    narrative: []
    intent: >-
      Append the given rule to the in-memory rule set, preserving registration order. A pure
      in-memory mutation; the set is authoritative for this validation run and rebuilt on the next.
  - name: listRules
    narrative: []
    intent: >-
      Return the current rule set by shared reference, in registration order. Read-only; an empty
      set before seeding is normal, never an error.
detail: intent
status: complete
