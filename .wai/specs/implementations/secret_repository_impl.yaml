id: secret_repository_impl
name: Secret Repository Facade Implementation
description: >-
  Pure 1:1 forwarding facade over the owned secret store, write registry, and index. The facade adds
  no logic. Values never leave the boundary: resolve answers only the host's own workflows, which
  hand the value to the one call they authorize as an argument.
contract: isecret_repository
sourcePath: src/utils/secrets.ts
methods:
  - name: write
    narrative:
      - stepNumber: 1
        description: Forward to the secret write registry
        type: call
        targetComponent: secret_write_registry
        targetMethod: write
    symbol: setSecret
  - name: list
    narrative:
      - stepNumber: 1
        description: Forward to the secret index (key names only)
        type: call
        targetComponent: secret_index
        targetMethod: list
    symbol: listSecretKeys
  - name: resolve
    narrative:
      - stepNumber: 1
        description: Forward to the secret index
        type: call
        targetComponent: secret_index
        targetMethod: resolve
    symbol: resolveSecret
  - name: resolveGit
    narrative:
      - stepNumber: 1
        description: Forward to the secret index
        type: call
        targetComponent: secret_index
        targetMethod: resolveGit
    symbol: resolveGitToken
detail: calls-only
status: complete
