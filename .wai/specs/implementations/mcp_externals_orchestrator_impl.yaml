id: mcp_externals_orchestrator_impl
name: MCP Externals Orchestrator Implementation
description: >-
  The external-surface tool workflows in src/mcp/server.ts: each reads or pins through the surfaces
  adapter and shapes the tool response.
contract: imcp_externals_orchestrator
sourcePath: src/mcp/server.ts
methods:
  - name: pin
    narrative:
      - stepNumber: 1
        description: >-
          Pin the declared externals through the surfaces adapter and shape the tool response: the
          outcomes as structured content, with a one-line summary per alias
        type: call
        targetComponent: mcp_surfaces_adapter
        targetMethod: pinExternals
    symbol: pinExternals
  - name: status
    narrative:
      - stepNumber: 1
        description: >-
          Read the externals status through the surfaces adapter and shape the tool response: the
          statuses as structured content, with a one-line summary per alias
        type: call
        targetComponent: mcp_surfaces_adapter
        targetMethod: getExternalsStatus
    symbol: getExternalsStatus
  - name: declare
    narrative:
      - stepNumber: 1
        description: >-
          Declare the external through the surfaces adapter and shape the tool response: the
          addition as structured content, with a one-line summary — what was declared and pinned,
          the one-sentence refusal, or that the producer could not be read and the external is
          declared but unpinned
        type: call
        targetComponent: mcp_surfaces_adapter
        targetMethod: declareExternal
    symbol: addExternal
  - name: remove
    narrative:
      - stepNumber: 1
        description: >-
          Remove the external through the surfaces adapter and shape the tool response: the removal
          as structured content, with a one-line summary — what was removed (the declaration, the
          pin) or the one-sentence refusal
        type: call
        targetComponent: mcp_surfaces_adapter
        targetMethod: removeExternal
    symbol: dropExternal
  - name: updateUse
    narrative:
      - stepNumber: 1
        description: >-
          Change the external's `use` through the surfaces adapter and shape the tool response: the
          change as structured content, with a one-line summary — the resulting list and what moved,
          or the one-sentence refusal
        type: call
        targetComponent: mcp_surfaces_adapter
        targetMethod: updateExternalUse
    symbol: changeExternalUse
  - name: consumers
    narrative:
      - stepNumber: 1
        description: >-
          List the consumers through the surfaces adapter, the searched folders resolved against the
          bound root, and shape the tool response: one line per consumer (its alias, section, the
          names it uses and the ones it still writes but no longer finds exported), or the hint to
          search the folder holding sibling checkouts
        type: call
        targetComponent: mcp_surfaces_adapter
        targetMethod: listConsumers
    symbol: externalConsumers
  - name: diff
    narrative:
      - stepNumber: 1
        description: >-
          Compare through the surfaces adapter and shape the tool response: what it was compared
          with, then one line per change
        type: call
        targetComponent: mcp_surfaces_adapter
        targetMethod: diffSurface
    symbol: surfaceDiff
status: complete
createdAt: '2026-09-26T17:50:42.456Z'
updatedAt: '2026-10-07T11:00:31.493Z'
