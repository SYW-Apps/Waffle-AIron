id: approval_comparison_impl
name: Approval Comparison Implementation
description: >-
  The approval arithmetic in src/core/approval.ts: free functions over a project root, holding
  nothing between calls. Each read defaults its root to the bound project, which is why callers that
  have one tree pass nothing. Digests normalize CRLF to LF before hashing, so the same commit
  checked out on Windows and Linux compares equal — the same reason the gate identity had to be made
  reproducible.
contract: iapproval_comparison
sourcePath: src/core/approval.ts
methods:
  - name: captureApprovedSpecs
    narrative:
      - stepNumber: 1
        description: Read the bytes of every spec file of the tree through the spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: snapshot
      - stepNumber: 2
        description: >-
          Digest each file's raw text, normalizing CRLF to LF first and keying by the path relative
          to the project root, so the same tree digests the same on every platform
        type: local
      - stepNumber: 3
        description: >-
          Read the record already on file, so a scoped approval carries forward the digests it is
          not re-capturing rather than dropping them
        type: call
        targetComponent: lock_store
        targetMethod: read
      - stepNumber: 4
        description: Answer with the digest map to write into the record
        type: return
        outcome: captured
  - name: diffAgainstApproval
    narrative:
      - stepNumber: 1
        description: Read the approval record under the given root
        type: call
        targetComponent: lock_store
        targetMethod: readAt
      - stepNumber: 2
        description: Decide whether there is anything to compare against
        type: branch
        condition: the project carries no record
        onTrueStep: 3
        onFalseStep: 4
      - stepNumber: 3
        description: >-
          Answer null — never approved is a different answer from approved and drifted, and a caller
          has to tell them apart
        type: return
        outcome: unapproved
      - stepNumber: 4
        description: >-
          Digest the tree as it stands and compare it against the digests the record carries: a path
          the record does not cover is added, one whose digest differs is changed, one the record
          covers that is gone is removed, and the rest are unchanged
        type: local
      - stepNumber: 5
        description: Answer with the four lists
        type: return
        outcome: compared
  - name: approvalRecord
    narrative:
      - stepNumber: 1
        description: >-
          Read the approval record under the given root, answering null when the project carries
          none
        type: call
        targetComponent: lock_store
        targetMethod: readAt
  - name: settledSpecPaths
    narrative:
      - stepNumber: 1
        description: Read the approval record under the given root
        type: call
        targetComponent: lock_store
        targetMethod: readAt
      - stepNumber: 2
        description: >-
          Answer the record's covered paths as a set for membership tests, or null when there is no
          record
        type: return
        outcome: settled
  - name: verdict
    narrative:
      - stepNumber: 1
        description: Read the approval on record
        type: call
        targetComponent: approval_comparison
        targetMethod: approvalRecord
      - stepNumber: 2
        description: Decide whether this project has ever been approved
        type: branch
        condition: there is no approval record
        onTrueStep: 3
        onFalseStep: 4
      - stepNumber: 3
        description: >-
          Answer silence, not drift. A tree still being designed has no approval by definition, and
          saying so on every status would be noise standing where news should be
        type: return
        outcome: never approved
      - stepNumber: 4
        description: >-
          Name who approved it, in the form a reviewer can match against the commit that carries the
          lock. A projection over the identity's own fields, so it needs nothing beyond the record
          already in hand
        type: local
      - stepNumber: 5
        description: >-
          From the approvals the caller passed, when it passed any: take the root's own entry, and
          note when it is upgraded — the lock was taken under an earlier gate identity, so say "the
          gate identity gained inputs in stage 5 (members' composition subjects, `composition`; code
          conformance moved beside the claim) — re-lock once" rather than implying the design moved;
          then take the direct members (parent = the root) whose pin moved, and those drifted or
          never approved. A moved pin is a change this project must re-approve even when none of its
          OWN specs shifted; a drifted or never-approved member is the member's to lock, named so
          the parent knows before it locks
        type: local
      - stepNumber: 6
        description: Compare the tree against what was approved
        type: call
        targetComponent: approval_comparison
        targetMethod: diffAgainstApproval
      - stepNumber: 7
        description: Decide whether that comparison can be made at all
        type: branch
        condition: the record predates per-spec approval
        onTrueStep: 8
        onFalseStep: 9
      - stepNumber: 8
        description: >-
          Say exactly that: the lock proves the tree validated, not which specs still match it, and
          re-locking is what records the difference — with the member and upgrade notes appended.
          Drift when a member's pin moved or the identity was upgraded
        type: return
        outcome: coarse lock
      - stepNumber: 9
        description: >-
          Answer the verdict, naming the specs that actually moved rather than a count — a number
          tells somebody that something changed, a list tells them what to look at: the text names
          the first few and counts the rest, and `moved` carries every one (`~` changed, `+` added,
          `-` removed) for a caller that wants the whole account — with the member and upgrade notes
          appended, and report drift when the specs moved, a member's pin moved, or the identity was
          upgraded. A member that is merely drifted or never approved is named but is not this
          project's drift
        type: return
        outcome: verdict
    symbol: approvalVerdict
status: complete
createdAt: '2026-09-20T15:19:32.451Z'
updatedAt: '2026-10-05T23:53:26.941Z'
