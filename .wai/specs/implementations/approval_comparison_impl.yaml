id: approval_comparison_impl
name: Approval Comparison Implementation
description: >-
  The approval arithmetic in src/core/approval.ts: free functions over a project root, holding
  nothing between calls. Each read defaults its root to the bound project, which is why callers that
  have one tree pass nothing. Digests normalize CRLF to LF before hashing, so the same commit
  checked out on Windows and Linux compares equal — the same reason the gate identity had to be made
  reproducible.
contract: iapproval_comparison
sourcePath: src/core/approval.ts
methods:
  - name: captureApprovedSpecs
    narrative:
      - stepNumber: 1
        description: List every spec file under the tree's specs directory
        type: call
        targetComponent: spec_loader
        targetMethod: loadComponentSpecs
      - stepNumber: 2
        description: >-
          Read each file, normalize CRLF to LF and hash the content, keying by the path relative to
          the project root so the same commit digests equally on any platform — the same reason the
          gate identity had to be made reproducible. An approval records exactly what a later check
          recomputes, so capture and compare run the same arithmetic
        type: local
      - stepNumber: 3
        description: Answer with the digest map to write into the record
        type: return
        outcome: captured
  - name: diffAgainstApproval
    narrative:
      - stepNumber: 1
        description: Read the approval record this project carries
        type: call
        targetComponent: lock_store
        targetMethod: read
      - stepNumber: 2
        description: Decide whether there is anything to compare against
        type: branch
        condition: the project carries no record
        onTrueStep: 3
        onFalseStep: 4
      - stepNumber: 3
        description: >-
          Answer null — never approved is a different answer from approved and drifted, and a caller
          has to tell them apart
        type: return
        outcome: unapproved
      - stepNumber: 4
        description: >-
          Digest the tree as it stands and compare it against the digests the record carries: a path
          the record does not cover is added, one whose digest differs is changed, one the record
          covers that is gone is removed, and the rest are unchanged
        type: local
      - stepNumber: 5
        description: Answer with the four lists
        type: return
        outcome: compared
  - name: approvalRecord
    narrative:
      - stepNumber: 1
        description: Read the approval record, answering null when the project carries none
        type: call
        targetComponent: lock_store
        targetMethod: read
  - name: settledSpecPaths
    narrative:
      - stepNumber: 1
        description: Read the approval record
        type: call
        targetComponent: lock_store
        targetMethod: read
      - stepNumber: 2
        description: >-
          Answer the record's covered paths as a set for membership tests, or null when there is no
          record
        type: return
        outcome: settled
  - name: currentChildPins
    narrative:
      - stepNumber: 1
        description: Find the chained subprojects mounted under this tree
        type: call
        targetComponent: spec_loader
        targetMethod: listChainedRoots
      - stepNumber: 2
        description: Pin each child at its current gate state id, keyed by the subsystem id it mounts as
        type: local
      - stepNumber: 3
        description: Answer with the pin map
        type: return
        outcome: pinned
  - name: movedChildren
    narrative:
      - stepNumber: 1
        description: Read the approval record for the pins it covers
        type: call
        targetComponent: lock_store
        targetMethod: read
      - stepNumber: 2
        description: >-
          Compare each child's current pin against the recorded one, and answer the subsystem ids
          that differ — a parent's approval covers the children it mounted, so a moved child is
          drift even when no spec file of the parent changed
        type: return
        outcome: moved
status: complete
createdAt: '2026-09-20T15:19:32.451Z'
updatedAt: '2026-09-20T15:22:52.957Z'
