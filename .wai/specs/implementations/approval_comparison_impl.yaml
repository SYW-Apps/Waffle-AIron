id: approval_comparison_impl
name: Approval Comparison Implementation
description: >-
  The approval arithmetic in src/core/approval.ts: free functions over a project root, holding
  nothing between calls. Each read defaults its root to the bound project, which is why callers that
  have one tree pass nothing. A spec's approved digest is its DESIGN digest — the parsed spec's
  design view in canonical form — so code linkage, readiness, whitespace and timestamps never move
  it.
contract: iapproval_comparison
sourcePath: src/core/approval.ts
methods:
  - name: captureApprovedSpecs
    narrative:
      - stepNumber: 1
        description: Read the bytes of every spec file of the tree through the spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: snapshot
      - stepNumber: 2
        description: >-
          Parse each file's spec, keep only the keys its kind's schema reads — a key the loader
          drops (UNKNOWN_SPEC_KEY) is no design, and the gate identity, which digests the loaded
          specs, never sees it either, so the per-spec digests and the gate cannot disagree over one
          — and project it to its design view — implementation_spec.designView,
          type_spec.designView, component_spec.designView, subsystem_spec.designView or
          interface_spec.designView for those kinds (a contract's implements read in its one
          canonical form: a one-entry list as its plain string, an empty list as absent), every
          other kind with createdAt and updatedAt dropped — then canonicalize it (stable key order)
          and digest it, keying by the path relative to the project root (a part's file under
          `members/<alias>/…`). A file that does not parse is digested in the content reading
          instead, so it is still recorded and any edit to it still shows
        type: local
      - stepNumber: 3
        description: >-
          When the re-lock is scoped to named files, read the project graph through the spec loader
          for the root project's parts, so a part's file is approved under its storage-independent
          key rather than its path
        type: call
        targetComponent: spec_loader
        targetMethod: graph
      - stepNumber: 4
        description: >-
          Read the record already on file, so a scoped approval carries forward the digests it is
          not re-capturing rather than dropping them
        type: call
        targetComponent: lock_store
        targetMethod: read
      - stepNumber: 5
        description: Answer with the digest map to write into the record
        type: return
        outcome: captured
  - name: diffAgainstApproval
    narrative:
      - stepNumber: 1
        description: Read the approval record under the given root
        type: call
        targetComponent: lock_store
        targetMethod: readAt
      - stepNumber: 2
        description: Decide whether there is anything to compare against
        type: branch
        condition: the project carries no record
        onTrueStep: 3
        onFalseStep: 4
      - stepNumber: 3
        description: >-
          Answer null — never approved is a different answer from approved and drifted, and a caller
          has to tell them apart
        type: return
        outcome: unapproved
      - stepNumber: 4
        description: >-
          Digest the tree as it stands as design digests (schema-read keys only) and compare against
          the digests the record carries: a path the record does not cover is added, one whose
          digest differs is changed, one the record covers that is gone is removed, and the rest are
          unchanged; then pair each added path with a removed one of the same digest (in path order,
          each used once) as a move — storage moved, content did not — taking both out of added and
          removed and counting the new path as unchanged
        type: local
      - stepNumber: 5
        description: 'Answer with the lists: added, changed, removed, unchanged and moved'
        type: return
        outcome: compared
  - name: approvalRecord
    narrative:
      - stepNumber: 1
        description: >-
          Read the approval record under the given root, answering null when the project carries
          none
        type: call
        targetComponent: lock_store
        targetMethod: readAt
  - name: settledSpecPaths
    narrative:
      - stepNumber: 1
        description: Read the approval record under the given root
        type: call
        targetComponent: lock_store
        targetMethod: readAt
      - stepNumber: 2
        description: >-
          Answer the record's covered paths as a set for membership tests, or null when there is no
          record
        type: return
        outcome: settled
  - name: verdict
    narrative:
      - stepNumber: 1
        description: Read the approval on record
        type: call
        targetComponent: approval_comparison
        targetMethod: approvalRecord
      - stepNumber: 2
        description: Decide whether this project has ever been approved
        type: branch
        condition: there is no approval record
        onTrueStep: 3
        onFalseStep: 4
      - stepNumber: 3
        description: >-
          Answer silence, not drift. A tree still being designed has no approval by definition, and
          saying so on every status would be noise standing where news should be
        type: return
        outcome: never approved
      - stepNumber: 4
        description: >-
          Name who approved it and when, in the form a reviewer can match against the commit that
          carries the lock (lock_record.approvalStamp: `<lockedAt> by <approver>`, `at an unrecorded
          time` / `an unrecorded approver` for a record that carries neither — never `undefined by
          unknown`). A projection over the record's own fields, so it needs nothing beyond the
          record already in hand
        type: local
      - stepNumber: 5
        description: >-
          From the approvals the caller passed, when it passed any, take the root's own entry: its
          state, partsMoved, partsIgnored, owed and inputs. When the entry carries partsIgnored, one
          notice says the record's parts are ignored and `wairon lock` rewrites them. When the
          record carries `upgraded`, one line says what `wairon upgrade` did with the approval from
          the earlier major: carried it over without a review, or could not carry it, so it reads
          stale until one `wairon lock`. Then take the direct members (parent = the root) that are
          drifted or never approved: each is the member's to lock, named so the parent knows, never
          this project's drift
        type: local
      - stepNumber: 6
        description: Compare the tree against what was approved
        type: call
        targetComponent: approval_comparison
        targetMethod: diffAgainstApproval
      - stepNumber: 7
        description: Decide whether that comparison can be made at all
        type: branch
        condition: the record predates per-spec approval
        onTrueStep: 8
        onFalseStep: 9
      - stepNumber: 8
        description: >-
          Say exactly that: the lock proves the tree validated, not which specs still match it, and
          re-locking is what records the difference — with the member notes appended. Drift when the
          root's own entry is drifted
        type: return
        outcome: coarse lock
      - stepNumber: 9
        description: >-
          Answer the verdict, naming the specs that actually moved rather than a count: the text
          names every one up to forty, and past forty the first forty, the count of the rest and the
          command that lists them all (`wairon status --all`) — never a cut list that reads as the
          whole account — and `moved` carries every one (`~` changed, `+` added, `-` removed) for a
          caller that wants it as data. Report drift when the specs moved or the root's own entry is
          drifted. When no own spec moved but the entry is drifted, "no spec has changed since"
          never stands alone: it names the policy parts that moved (partsMoved: the rule tuning,
          `composition`, the network declaration, the pack selections), else the entry's `owed`
          sentence (a moved project id), and that one `wairon lock` re-approves — so status never
          reads approved while `lock-check` refuses on the approval. When the entry's `inputs` is
          not empty, one more line says the approval holds and what the inputs owe, each debt's
          sentence with the command that clears it (`wairon externals pin <alias>`, `wairon packs
          sync`, a member's own lock) — never drift, and never phrased as a change of the design.
          Members that are merely drifted or never approved are named but are not this project's
          drift.
        type: return
        outcome: verdict
    symbol: approvalVerdict
status: complete
