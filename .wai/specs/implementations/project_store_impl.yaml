id: project_store_impl
name: Project Record Store Implementation
description: >-
  Read-through file I/O over the data-dir project registry file, in a module of its own so every
  repository, index and registry hop into it is a real import edge: load reads the set fresh per
  call, and update holds the file's write lock across a fresh read and the replacement, written
  through a temporary sibling of its own and a rename.
contract: iproject_store
sourcePath: src/server/project-store.ts
methods:
  - name: read
    narrative: []
    intent: >-
      Reads and parses the project registry file fresh from disk; an absent or malformed file yields
      the empty set.
    symbol: load
  - name: update
    narrative: []
    intent: >-
      Takes the project registry file's write lock (a lock file created exclusively, naming this
      process, the time and the host; one whose holder on this host is gone, or older than any write
      could take, is taken over; after a bounded wait it throws), reads the set fresh (an absent
      file is the empty set; a file that exists but cannot be read or parsed throws, so a change is
      never applied to a set read as empty), applies the change, replaces the file with the result
      atomically (a temporary sibling named for this writer, then renamed over the file) and
      releases the lock while it is still its own (a lock taken over as stale is the new holder's),
      also when the change throws, which writes nothing.
    symbol: update
status: complete
createdAt: '2026-07-19T09:00:07.147Z'
updatedAt: '2026-10-22T19:48:26.193Z'
