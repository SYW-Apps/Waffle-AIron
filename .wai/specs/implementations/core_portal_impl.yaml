    narrative:
      - stepNumber: 1
        description: >-
          Re-export the child-pin read — this Portal method and the comparison component's function
          are the same function, so the call resolves by identity
        type: call
        targetComponent: approval_comparison
        targetMethod: currentChildPins
  - name: captureApprovedSpecs
    narrative:
      - stepNumber: 1
        description: >-
          Capture the tree's per-spec digests for an approval record. Published here by re-export
          rather than by wrapping, so this Portal method and the comparison component's function are
          the same function — the call resolves by identity
        type: call
        targetComponent: approval_comparison
        targetMethod: captureApprovedSpecs
  - name: localApprover
    sourcePath: src/core/approver.ts
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the approving identity from the local environment: prefer the git author identity,
          fall back to user@hostname, and never throw or prompt — a lock must not fail because a
          name could not be resolved. Re-exported through this Portal rather than living in it,
          which is why the method names its own file
        type: local
    symbol: localApprover
  - name: resolveSubprojectForNamespace
    narrative:
