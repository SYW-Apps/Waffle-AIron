id: skills_resource_orchestrator_impl
name: Skills Resource Orchestrator Implementation
description: >-
  The MCP-facing guidance workflow for the built-in SDD skills: lists them as MCP resource
  descriptors, reads one skill's content (rejecting unknown resource ids) through the Skills
  Resource Specialist, and composes the server initialize instructions through the Server
  Instructions Specialist.
contract: iskills_resource_orchestrator
sourcePath: src/core/skills.ts
methods:
  - name: listResources
    narrative:
      - stepNumber: 1
        description: Resolve the built-in skill descriptors from the specialist.
        type: call
        targetComponent: skills_resource_specialist
        targetMethod: listSkillResources
      - stepNumber: 2
        description: Return the descriptors shaped as MCP resources.
        type: return
        outcome: resource descriptors
    detail: full
  - name: readResource
    narrative:
      - stepNumber: 1
        description: List the available skill resources to validate the requested id.
        type: call
        targetComponent: skills_resource_specialist
        targetMethod: listSkillResources
      - stepNumber: 2
        description: Reject an unknown resource id; otherwise resolve its content.
        type: branch
        condition: no listed descriptor's id matches the requested resourceId
        onTrueStep: 3
        onFalseStep: 4
      - stepNumber: 3
        description: Fail the read for an unknown skill resource id.
        type: throw
        error: SkillResourceNotFoundError
      - stepNumber: 4
        description: Read the resolved skill's markdown content from the specialist.
        type: call
        targetComponent: skills_resource_specialist
        targetMethod: readSkillResource
      - stepNumber: 5
        description: Return the skill content for the MCP resource read.
        type: return
        outcome: skill markdown content
    detail: full
  - name: buildServerInstructions
    narrative:
      - stepNumber: 1
        description: Compose the instructions text through the Server Instructions Specialist.
        type: call
        targetComponent: instructions_specialist
        targetMethod: buildServerInstructions
      - stepNumber: 2
        description: Return the composed instructions for the MCP initialize handshake.
        type: return
        outcome: the composed instructions
    detail: full
status: complete
createdAt: '2026-07-10T12:21:20.703Z'
updatedAt: '2026-07-29T10:53:16.279Z'
