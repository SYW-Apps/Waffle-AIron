id: openapi_codec_impl
name: OpenAPI Codec Implementation
description: Snapshot ↔ OpenAPI 3.1 conversion.
contract: iopenapi_codec
sourcePath: src/core/openapi.ts
methods:
  - name: fromOpenApi
    narrative:
      - stepNumber: 1
        description: Parse and structurally validate the OpenAPI document
        type: local
      - stepNumber: 2
        description: Document is not valid OpenAPI
        type: branch
        condition: parse or structural validation failed
        onFalseStep: 4
      - stepNumber: 3
        description: Reject the import with the parse errors
        type: throw
        error: InvalidSurfaceDocumentError
      - stepNumber: 4
        description: >-
          Map operations to contract methods: parameters/requestBody to structured params (a body
          x-wairon-body-param names, or one that is a $ref to a component, read back as that one
          param — named as the extension says, else after its type — and an object body's properties
          as one param each), the first 2xx response in code order to returns (no JSON body, as a
          204, reads void) — and a `default`, 4XX or 5XX response with a JSON body makes it
          `result<T, E>` with E that body's type — method+path to endpoints — a document's
          x-wairon-base-path taken back off each path and set as the entry's basePath, and the
          parameter an operation's x-wairon-credential-param names put back first among its params —
          each schema read back into its canonical type expression's text (an inline anonymous enum
          as string, its values listed in the description)
        type: local
      - stepNumber: 5
        description: >-
          Derive the type closure from component schemas: a component carrying x-wairon-signature
          decodes back into a signature type with its params and returns (each type as written when
          the extension carries it, else read from its schema), a string component carrying `enum`
          into an enum type with those values, a component whose schema is one primitive's (a
          string, integer, number or boolean type with no properties) into a named scalar holding
          that primitive, any other into a data type whose field types are read back canonical
        type: local
      - stepNumber: 6
        description: >-
          Read components.securitySchemes back into the entry's auth, symmetric with the x-wairon-*
          handling: map the document's declared security scheme to a PortalAuth on the entry (scheme
          kind, in/name, bearerFormat, oauth2 authorizationUrl/tokenUrl/refreshUrl/scopes/flow,
          openIdConnectUrl; an http scheme `custom` a custom auth) so an OpenAPI-format exchange
          round-trips auth; a document with no security yields no auth.
        type: local
      - stepNumber: 7
        description: >-
          Assemble the snapshot with origin authored, external audience, and version from the info
          block
        type: local
      - stepNumber: 8
        description: Return the authored snapshot
        type: return
        outcome: SurfaceSnapshot
  - name: toOpenApiSet
    narrative:
      - stepNumber: 1
        description: Select the snapshot's HTTP-transport entries (REST endpoints).
        type: local
      - stepNumber: 2
        description: >-
          Partition the HTTP entries by backing portal — group them by each entry's `component` (the
          backing Portal id).
        type: local
      - stepNumber: 3
        description: For each portal partition
        type: loop
        loopKind: forEach
        over: portal partitions
        endStep: 7
      - stepNumber: 4
        description: >-
          For each HTTP operation of the partition, its document path: the Portal's basePath joined
          in, every `:name` placeholder respelled `{name}`
        type: call
        targetComponent: openapi_codec
        targetMethod: openApiPath
      - stepNumber: 5
        description: >-
          For each operation, the parameter that is the credential the Portal's auth scheme binds —
          left out of the parameters and the body
        type: call
        targetComponent: openapi_codec
        targetMethod: credentialParam
      - stepNumber: 6
        description: >-
          Render this partition as a standalone OpenAPI 3.1 document over only its own entries: map
          each contract method to an operation at openApiPath(the Portal's basePath, the endpoint
          path) — basePath joined in, `:name` placeholders as `{name}` — refusing with
          OpenApiRouteCollisionError, naming both operations, the verb and the path, an operation
          whose verb and path (placeholders compared by position) an earlier operation of the
          partition already holds; leave out the parameter credentialParam names (the security
          scheme carries the credential) and name it under x-wairon-credential-param; each param
          named by a path placeholder a parameter in: path, required, and the rest parameters in:
          query on a verb without a body, or the JSON body on POST/PUT/PATCH — the one object-typed
          param left (a named data type, never a scalar, list, map or enum) AS the body, named under
          x-wairon-body-param so a reader puts it back, and several params as the properties of a
          body object; the success response under its code — 204 with no content for a method
          returning nothing; 201 Created for a POST that creates: a method whose effect is
          `lifecycle` (it brings an entity into existence), or one whose effect is undeclared,
          `write` or `io` and whose name says it creates (create, add, new, register, sign up,
          place, open, insert, submit, upload, start, issue, book); else 200 and, for a `result<T,
          E>` returns, a `default` response whose body is E's schema; guarantees and effect noted as
          extensions; each param and return type parsed (type_expression.parse) and rendered from
          its canonical expression; render the embedded type closure as JSON-Schema components, then
          every pinned external type a schema reached (`alias::name`, from the context's pinned
          snapshot, as `<alias>.<id>`, resolving the names it uses inside that producer's own
          closure) until none is left unrendered; derive components.securitySchemes from the
          entries' projected auth (deduplicating identical schemes, attaching each requirement —
          with oauth2 scopes — to its operations; a custom scheme an apiKey only where auth.name
          names its header or parameter, else an http scheme `custom`); name the basePath once as
          x-wairon-base-path and declare no servers; and set the info block from the portal's name,
          the context's declared version (else the snapshot's, else 0.0.0), the StateId and
          generatedAt.
        type: local
      - stepNumber: 7
        description: >-
          Wrap the rendered document as a NamedOpenApiSpec { portalId = the backing Portal id, name
          = the portal's surface name, document }.
        type: local
      - stepNumber: 8
        description: >-
          Return the named set — one spec per portal; distinct portals are never merged into a
          combined document.
        type: return
        outcome: NamedOpenApiSpec[]
  - name: recognizes
    narrative:
      - stepNumber: 1
        description: Parse the body as YAML (a superset of JSON); a body that does not parse is not a document
        type: local
      - stepNumber: 2
        description: Return whether the parsed value is an object carrying a string openapi version
        type: return
        outcome: whether the body is an OpenAPI document
    symbol: isOpenApiDocument
  - name: openApiPath
    narrative:
      - stepNumber: 1
        description: Take the basePath as nothing when it is absent, empty or `/`
        type: local
      - stepNumber: 2
        description: >-
          Join it before the endpoint path with exactly one `/` between them, and root the result at
          `/`
        type: local
      - stepNumber: 3
        description: >-
          Answer the path with every `/:name` segment placeholder respelled `/{name}` — the Express
          idiom and OpenAPI's form are one placeholder
        type: return
        outcome: the OpenAPI path
    detail: full
  - name: credentialParam
    narrative:
      - stepNumber: 1
        description: Does the Portal authenticate at all?
        type: branch
        condition: auth is absent or its scheme is none
        onTrueStep: 2
        onFalseStep: 3
      - stepNumber: 2
        label: none
        description: 'No auth binds a credential: no parameter is one'
        type: return
        outcome: none
      - stepNumber: 3
        label: names
        description: >-
          The credential names of the scheme — a token for bearer, oauth2 and openIdConnect; the
          credentials for basic; the key for apiKey and custom, and the scheme's own key name — each
          compared lower-cased with everything but letters and digits removed
        type: local
      - stepNumber: 4
        description: >-
          Answer the first parameter typed string whose name is one of them, or equals or ends the
          scheme's key name of at least three characters; none when no parameter is
        type: return
        outcome: the credential parameter, or none
    detail: full
status: complete
