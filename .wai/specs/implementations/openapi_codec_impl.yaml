id: openapi_codec_impl
name: OpenAPI Codec Implementation
description: Snapshot ↔ OpenAPI 3.1 conversion.
contract: iopenapi_codec
sourcePath: src/core/openapi.ts
methods:
  - name: toOpenApi
    narrative:
      - stepNumber: 1
        description: Select the snapshot's HTTP-transport entries (REST endpoints)
        type: local
      - stepNumber: 2
        description: >-
          Map each contract method to an OpenAPI operation: endpoint method+path, params to
          parameters/requestBody, returns to responses, guarantees and effect noted as extensions;
          each param and return type is parsed (type_expression.parse) and rendered from its
          canonical expression — `async T` as T, `T?` admitting null, collections, primitives and
          formats as the contract lists them
        type: local
      - stepNumber: 3
        description: >-
          Render the embedded type closure as JSON-Schema component schemas, each field's schema
          from its parsed canonical expression; an enum becomes a string component with its values
          as `enum`; a named scalar becomes the schema of the primitive it holds, titled with the
          type's name and carrying no properties; a signature type becomes a component with no type
          constraint, a description saying it is a function type with no JSON form, and an
          x-wairon-signature extension holding its params (name, the type as written and as a $ref
          or schema, optional) and returns
        type: local
      - stepNumber: 4
        description: >-
          Derive security from the entries' projected auth: for each entry whose auth.scheme is a
          real scheme (apiKey | bearer | basic | oauth2 | openIdConnect | custom), add a
          components.securitySchemes entry — deduplicating structurally identical schemes under a
          shared scheme name — and attach the matching security requirement (including oauth2 scopes
          when present) to that entry's operations; entries with no auth or scheme 'none' emit
          neither a scheme nor operation-level security.
        type: local
      - stepNumber: 5
        description: Emit the info block with project identity, version or StateId, and generatedAt
        type: local
      - stepNumber: 6
        description: Return the serialized OpenAPI 3.1 document
        type: return
        outcome: OpenAPI document
  - name: fromOpenApi
    narrative:
      - stepNumber: 1
        description: Parse and structurally validate the OpenAPI document
        type: local
      - stepNumber: 2
        description: Document is not valid OpenAPI
        type: branch
        condition: parse or structural validation failed
        onFalseStep: 4
      - stepNumber: 3
        description: Reject the import with the parse errors
        type: throw
        error: InvalidSurfaceDocumentError
      - stepNumber: 4
        description: >-
          Map operations to contract methods: parameters/requestBody to structured params, responses
          to returns, method+path to endpoints — each schema read back into its canonical type
          expression's text (an inline anonymous enum as string, its values listed in the
          description)
        type: local
      - stepNumber: 5
        description: >-
          Derive the type closure from component schemas: a component carrying x-wairon-signature
          decodes back into a signature type with its params and returns (each type as written when
          the extension carries it, else read from its schema), a string component carrying `enum`
          into an enum type with those values, a component whose schema is one primitive's (a
          string, integer, number or boolean type with no properties) into a named scalar holding
          that primitive, any other into a data type whose field types are read back canonical
        type: local
      - stepNumber: 6
        description: >-
          Read components.securitySchemes back into the entry's auth, symmetric with the x-wairon-*
          handling: map the document's declared security scheme to a PortalAuth on the entry (scheme
          kind, in/name, bearerFormat, oauth2 authorizationUrl/tokenUrl/refreshUrl/scopes/flow,
          openIdConnectUrl) so an OpenAPI-format exchange round-trips auth; a document with no
          security yields no auth.
        type: local
      - stepNumber: 7
        description: >-
          Assemble the snapshot with origin authored, external audience, and version from the info
          block
        type: local
      - stepNumber: 8
        description: Return the authored snapshot
        type: return
        outcome: SurfaceSnapshot
  - name: toOpenApiSet
    narrative:
      - stepNumber: 1
        description: Select the snapshot's HTTP-transport entries (same selection rule as toOpenApi).
        type: local
      - stepNumber: 2
        description: >-
          Partition the HTTP entries by backing portal — group them by each entry's `component` (the
          backing Portal id).
        type: local
      - stepNumber: 3
        description: For each portal partition
        type: loop
        loopKind: forEach
        over: portal partitions
        endStep: 5
      - stepNumber: 4
        description: >-
          Render this partition as a standalone OpenAPI 3.1 document: reuse the operation-mapping
          and JSON-Schema type-closure logic over only this partition's entries, set `servers` from
          the partition's basePath, and emit only this partition's components.securitySchemes with
          the matching per-operation security.
        type: local
      - stepNumber: 5
        description: >-
          Wrap the rendered document as a NamedOpenApiSpec { portalId = the backing Portal id, name
          = the portal's surface name, document }.
        type: local
      - stepNumber: 6
        description: >-
          Return the named set — one spec per portal; distinct portals are never merged into a
          combined document.
        type: return
        outcome: NamedOpenApiSpec[]
  - name: recognizes
    narrative:
      - stepNumber: 1
        description: Parse the body as YAML (a superset of JSON); a body that does not parse is not a document
        type: local
      - stepNumber: 2
        description: Return whether the parsed value is an object carrying a string openapi version
        type: return
        outcome: whether the body is an OpenAPI document
    symbol: isOpenApiDocument
status: complete
