id: git_backing_registry_impl
name: Git Backing Registry Implementation
description: >-
  Write path for container-level backing bindings: stamping, scope-shape validation,
  one-binding-per-scope replacement, and lastSyncAt touching. No authorization here. Every operation
  is ONE store update on the collection read fresh under git-backing.json's write lock - a
  lastSyncAt touch can never erase a binding another process just bound.
contract: igit_backing_registry
sourcePath: src/server/gitbacking.ts
methods:
  - name: upsertBinding
    narrative: []
    intent: >-
      Validate the scope shape (a 'unit' binding must name a scopeId, an 'instance' binding must
      not), then in one store update stamp a random id and createdAt on create, replace any existing
      binding covering the SAME scope in the collection read under the lock (at most one per scope -
      a re-bind is a replacement, never a duplicate), and return the stored binding.
    calls:
      - git_backing_store.update
  - name: removeBinding
    narrative: []
    intent: >-
      In one store update: filter the binding with the given id out of the collection read under the
      lock (an absent id is a no-op). The backing repository itself is untouched.
    calls:
      - git_backing_store.update
  - name: touchSync
    narrative: []
    intent: >-
      In one store update: set lastSyncAt on the binding with the given id in the collection read
      under the lock (an absent id is a no-op).
    calls:
      - git_backing_store.update
detail: intent
status: complete
