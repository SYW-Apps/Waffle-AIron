id: integrity_rules_impl
name: Integrity Rules Implementation
description: The integrity rule family's methods, one per rule file under src/core/rules/integrity/.
contract: iintegrity_rules
simPath: tests/core/validation.test.ts
methods:
  - name: hierarchyIntegrity
    sourcePath: src/core/rules/integrity/hierarchy-integrity.ts
    narrative:
      - stepNumber: 1
        label: l1Start
        description: For each loaded subsystem, check whether it is in draft or design status (informational).
        type: loop
        loopKind: forEach
        over: ctx.subsystems
        endStep: 4
      - stepNumber: 2
        description: 'Branch: is the subsystem''s status draft or design?'
        type: branch
        condition: sub.isDraft()
        onFalseStep: 4
      - stepNumber: 3
        description: >-
          Report DRAFT_SUBSYSTEM_WARNING (warning; draft context true) naming the subsystem as being
          in draft/design status.
        type: local
      - stepNumber: 4
        label: l1End
        description: Continue with the next subsystem.
        type: local
      - stepNumber: 5
        label: l2Start
        description: For each loaded component, check whether it (or an ancestor) is in draft or design status.
        type: loop
        loopKind: forEach
        over: ctx.components
        endStep: 8
      - stepNumber: 6
        description: 'Branch: does ctx.isComponentDraft report the component as draft?'
        type: branch
        condition: ctx.isComponentDraft(comp.id) is true
        onFalseStep: 8
      - stepNumber: 7
        description: >-
          Report DRAFT_COMPONENT_WARNING (warning; draft context true) naming the component as being
          in draft/design status.
        type: local
      - stepNumber: 8
        label: l2End
        description: Continue with the next component.
        type: local
      - stepNumber: 9
        label: l3Start
        description: For each loaded subsystem, check that it references the L0 system.
        type: loop
        loopKind: forEach
        over: ctx.subsystems
        endStep: 12
      - stepNumber: 10
        description: 'Branch: is the subsystem orphaned from the L0 system?'
        type: branch
        condition: >-
          sub.parentSystem is missing, or it is set but does not equal the system name while the
          subsystem id carries no "::" namespace hop (a root-level subsystem)
        onFalseStep: 12
      - stepNumber: 11
        description: >-
          Report ORPHANED_SUBSYSTEM (warning; draft context from sub.isDraft()) naming the subsystem
          and the system it fails to reference.
        type: local
      - stepNumber: 12
        label: l3End
        description: Continue with the next subsystem.
        type: local
      - stepNumber: 13
        label: l4Start
        description: For each loaded component, check that its declared subsystem exists.
        type: loop
        loopKind: forEach
        over: ctx.components
        endStep: 16
      - stepNumber: 14
        description: 'Branch: does comp.subsystem reference a non-existent subsystem?'
        type: branch
        condition: ctx.subsystemIds does not contain comp.subsystem
        onFalseStep: 16
      - stepNumber: 15
        description: >-
          Report INVALID_SUBSYSTEM_REFERENCE (error; draft context from
          ctx.isComponentDraft(comp.id)) naming the component and the non-existent subsystem it
          references.
        type: local
      - stepNumber: 16
        label: l4End
        description: Continue with the next component.
        type: local
      - stepNumber: 17
        label: l5Start
        description: For each loaded interface, check that its owning component exists.
        type: loop
        loopKind: forEach
        over: ctx.interfaces
        endStep: 20
      - stepNumber: 18
        description: 'Branch: does intf.component reference a non-existent component?'
        type: branch
        condition: ctx.componentIds does not contain intf.component
        onFalseStep: 20
      - stepNumber: 19
        description: >-
          Report INVALID_COMPONENT_REFERENCE (error; draft context from
          ctx.isComponentDraft(intf.component) or the interface's own draft/design status) naming
          the interface and the non-existent component it references.
        type: local
      - stepNumber: 20
        label: l5End
        description: Continue with the next interface.
        type: local
      - stepNumber: 21
        label: l6Start
        description: For each loaded implementation, check that its contract interface exists.
        type: loop
        loopKind: forEach
        over: ctx.implementations
        endStep: 24
      - stepNumber: 22
        description: 'Branch: does impl.contract reference a non-existent interface?'
        type: branch
        condition: ctx.interfaceIds does not contain impl.contract
        onFalseStep: 24
      - stepNumber: 23
        description: >-
          Report INVALID_INTERFACE_REFERENCE (error; draft context ctx.isImplementationDraft(impl),
          which here is the implementation's own draft/design status since its contract does not
          resolve) naming the implementation and the non-existent interface contract it references.
        type: local
      - stepNumber: 24
        label: l6End
        description: Continue with the next implementation.
        type: local
    symbol: check
    exportedVia: hierarchyRule
  - name: roundtripSerialization
    sourcePath: src/core/rules/integrity/roundtrip-serialization.ts
    narrative:
      - stepNumber: 1
        label: rtStart
        description: For each writer dry-run finding gathered by the validator before rules run (no I/O here).
        type: loop
        loopKind: forEach
        over: ctx.roundTripIssues
        endStep: 2
      - stepNumber: 2
        label: rtEnd
        description: Report ROUNDTRIP_SERIALIZATION (error) using the issue's own message and specId verbatim.
        type: local
    symbol: check
    exportedVia: roundtripRule
  - name: lintAllows
    sourcePath: src/core/rules/integrity/lint-allows.ts
    narrative:
      - stepNumber: 1
        label: laStart
        description: For each per-spec lint.allow entry gathered by the validator.
        type: loop
        loopKind: forEach
        over: ctx.lintAllows
        endStep: 15
      - stepNumber: 2
        description: 'Branch: does no registered rule emit a.code?'
        type: branch
        condition: ctx.knownIssueCodes does not contain a.code
        onFalseStep: 5
      - stepNumber: 3
        description: Report UNKNOWN_LINT_ALLOW_CODE (warning) naming the spec and the unknown allowed code.
        type: local
      - stepNumber: 4
        description: Continue with the next lint allow (mirrors the source's continue).
        type: jump
        toStep: 15
      - stepNumber: 5
        label: laKnownCode
        description: 'Branch: did the allow match no finding this run?'
        type: branch
        condition: a.used is false
        onFalseStep: 15
      - stepNumber: 6
        description: >-
          Ask ctx.sitesReported for what this run DID report of that code on that spec: the sites
          its findings named, and whether any of them named none.
        type: local
      - stepNumber: 7
        label: laSiteCheck
        description: 'Branch: does the allow name a site for a code whose findings carry none?'
        type: branch
        condition: a.at is set and the run named no site, only unsited findings
        onFalseStep: 10
      - stepNumber: 8
        description: Explain it as an allow that must not name a site at all — drop the `at`.
        type: local
      - stepNumber: 9
        description: Go to the report with that explanation.
        type: jump
        toStep: 14
      - stepNumber: 10
        label: laSites
        description: 'Branch: did that code fire at sites this allow does not name?'
        type: branch
        condition: the run named one or more sites
        onFalseStep: 13
      - stepNumber: 11
        description: >-
          Explain it as the wrong occurrence, listing the sites that did fire: retarget an allow
          that names one, or give an `at` to an allow that names none — one per site, each with its
          own reason.
        type: local
      - stepNumber: 12
        description: Go to the report with that explanation.
        type: jump
        toStep: 14
      - stepNumber: 13
        label: laGone
        description: >-
          Explain it as a finding that did not fire at all this run — the stale allow, and the only
          shape this audit used to know.
        type: local
      - stepNumber: 14
        label: laReport
        description: >-
          Report UNUSED_LINT_ALLOW (warning) naming the spec, the allowed code, the site it names if
          it names one, its stated reason, and that explanation.
        type: local
      - stepNumber: 15
        label: laEnd
        description: Continue with the next lint allow.
        type: local
    symbol: check
    exportedVia: lintAllowsRule
  - name: typeDeclarations
    sourcePath: src/core/rules/integrity/type-declarations.ts
    narrative:
      - stepNumber: 1
        label: types
        description: >-
          For each loaded type, check what it declares about itself: its owning subsystem and
          whether it models anything at all.
        type: loop
        loopKind: forEach
        over: ctx.types
        endStep: 6
      - stepNumber: 2
        description: >-
          Find sub = ctx.subsystems matching t.subsystem by id, and compute isDraftCtx as true when
          sub exists and its status is "draft" or "design", else false.
        type: local
      - stepNumber: 3
        description: 'Branch: does the type declare a subsystem that ctx.subsystemIds does not contain?'
        type: branch
        condition: t.subsystem is set and ctx.subsystemIds does not contain it
        onFalseStep: 5
      - stepNumber: 4
        description: >-
          Report INVALID_SUBSYSTEM_REFERENCE (error; isDraftCtx) naming the type and the
          non-existent subsystem it references.
        type: local
      - stepNumber: 5
        label: checkHollow
        description: 'Branch: does the type declare neither fields nor methods?'
        type: branch
        condition: the type has no fields (or an empty fields list) and no methods (or an empty methods list)
        onFalseStep: 1
      - stepNumber: 6
        label: typesEnd
        description: >-
          Report HOLLOW_TYPE (warning; isDraftCtx) naming the type and its kind as a placeholder
          with nothing to inform implementers or the ERD.
        type: local
    symbol: check
    exportedVia: typeDeclarationsRule
  - name: fieldTypeReferences
    sourcePath: src/core/rules/integrity/field-type-references.ts
    narrative:
      - stepNumber: 1
        label: types
        description: For each loaded type, resolve the type identifiers its fields name.
        type: loop
        loopKind: forEach
        over: ctx.types
        endStep: 8
      - stepNumber: 2
        description: >-
          Find sub = ctx.subsystems matching t.subsystem by id, and compute isDraftCtx as true when
          sub exists and its status is "draft" or "design", else false.
        type: local
      - stepNumber: 3
        description: 'Branch: does the type declare a fields list at all?'
        type: branch
        condition: t.fields is set
        onFalseStep: 1
      - stepNumber: 4
        label: fields
        description: For each field declared on the type.
        type: loop
        loopKind: forEach
        over: t.fields
        endStep: 8
      - stepNumber: 5
        description: >-
          refs = t.fieldTypeRefs(field.type) — the type identifiers the field's type names, with the
          type's own generic parameters already left out.
        type: local
      - stepNumber: 6
        label: refs
        description: For each type identifier the field's type names.
        type: loop
        loopKind: forEach
        over: refs
        endStep: 8
      - stepNumber: 7
        description: 'Branch: does the reference fail to resolve?'
        type: branch
        condition: >-
          ctx.isTypeResolved(ref, no generics) is false (the reference resolves to neither a builtin
          nor a defined type; t.fieldTypeRefs already left the type's own generic parameters out)
        onFalseStep: 6
      - stepNumber: 8
        label: refsEnd
        description: >-
          Report UNDEFINED_TYPE_REFERENCE (error; isDraftCtx) naming the type, the field, and the
          undefined reference.
        type: local
    symbol: check
    exportedVia: fieldTypeReferencesRule
  - name: signatureTypeReferences
    sourcePath: src/core/rules/integrity/signature-type-references.ts
    narrative:
      - stepNumber: 1
        label: interfaces
        description: For each loaded interface, check every method signature's type references.
        type: loop
        loopKind: forEach
        over: ctx.interfaces
        endStep: 7
      - stepNumber: 2
        description: >-
          Compute isDraftCtx as ctx.isComponentDraft(intf.component) or the interface's own status
          being "draft"/"design"; interfaceGenerics = intf.genericParameters().
        type: local
      - stepNumber: 3
        label: methods
        description: For each method on the interface.
        type: loop
        loopKind: forEach
        over: intf.methods
        endStep: 7
      - stepNumber: 4
        description: >-
          methodGenerics = m.genericParameters(); allGenerics = the union of interfaceGenerics and
          methodGenerics; refs = m.typeRefs().
        type: local
      - stepNumber: 5
        label: refs
        description: For each type identifier the method's signature names.
        type: loop
        loopKind: forEach
        over: refs
        endStep: 7
      - stepNumber: 6
        description: 'Branch: does the reference fail to resolve?'
        type: branch
        condition: >-
          ctx.isTypeResolved(ref, allGenerics) is false (the reference does not resolve to a
          builtin, an in-scope generic, or a defined type)
        onFalseStep: 5
      - stepNumber: 7
        label: refsEnd
        description: >-
          Report UNDEFINED_TYPE_REFERENCE (error; isDraftCtx) naming the method, the interface, and
          the undefined reference.
        type: local
    symbol: check
    exportedVia: signatureTypeReferencesRule
  - name: reservedIdSegments
    sourcePath: src/core/rules/integrity/reserved-id-segments.ts
    narrative:
      - stepNumber: 1
        label: ridStart
        description: >-
          For each spec id in the tree, with the kind label its findings name it by (ctx.specIds():
          the subsystem, component, interface, implementation and type ids, in that order).
        type: loop
        loopKind: forEach
        over: ctx.specIds()
        endStep: 3
      - stepNumber: 2
        description: 'Branch: is the id in scope and does it spend a segment on the reserved keyword?'
        type: branch
        condition: >-
          the id is in scope (ctx.isSpecInScope) and its "::" segments include the reserved keyword
          "super"
        onFalseStep: 1
      - stepNumber: 3
        label: ridReport
        description: >-
          Report RESERVED_ID_SEGMENT (error) naming the id and its kind label, and warning that a
          stored reference to it would be consumed as a namespace hop and resolve to a different
          spec.
        type: local
    symbol: check
    exportedVia: reservedIdSegmentsRule
  - name: namespaceShadowing
    sourcePath: src/core/rules/integrity/namespace-shadowing.ts
    narrative:
      - stepNumber: 1
        description: >-
          Compute rootSubs — the set of root-level subsystem ids: every id in ctx.subsystems with no
          "::" segment.
        type: local
      - stepNumber: 2
        label: shadowStart
        description: For each spec id in the tree, with the kind label its findings name it by (ctx.specIds()).
        type: loop
        loopKind: forEach
        over: ctx.specIds()
        endStep: 4
      - stepNumber: 3
        description: 'Branch: is the id in scope, namespaced, and does its local name shadow a root subsystem?'
        type: branch
        condition: >-
          the id is in scope (ctx.isSpecInScope), has more than one "::" segment, and its last
          segment matches a root-level subsystem id in rootSubs
        onFalseStep: 2
      - stepNumber: 4
        label: shadowReport
        description: >-
          Report NAMESPACE_SHADOWING (error) naming the id and its kind label, the root subsystem it
          shadows, and that a bare reference inside its subproject would anchor to the ROOT
          subsystem, making the local spec unaddressable — rename one of them.
        type: local
    symbol: check
    exportedVia: namespaceShadowingRule
  - name: publicSurfaceBinding
    sourcePath: src/core/rules/integrity/public-surface-binding.ts
    narrative:
      - stepNumber: 1
        label: psbSubStart
        description: For each loaded subsystem, check what backs every declared public interface entry.
        type: loop
        loopKind: forEach
        over: ctx.subsystems
        endStep: 12
      - stepNumber: 2
        description: isDraftCtx = sub.isDraft().
        type: local
      - stepNumber: 3
        label: psbPiStart
        description: >-
          For each OWN component entry declared on the subsystem — an entry with neither `from` nor
          `typeDef`; a re-export or a type export is the export-tables rule's to judge.
        type: loop
        loopKind: forEach
        over: the subsystem's own component entries (sub.publicInterfaces without from or typeDef)
        endStep: 12
      - stepNumber: 4
        description: 'Branch: is pi.component unset?'
        type: branch
        condition: the entry declares no backing component (pi.component is unset)
        onFalseStep: 7
      - stepNumber: 5
        description: >-
          Report PUBLIC_INTERFACE_UNBOUND (error; isDraftCtx) naming the subsystem and the entry's
          declared type, with no backing component bound.
        type: local
      - stepNumber: 6
        description: >-
          Skip the rest of this entry's checks and continue with the next public interface (mirrors
          the source's continue).
        type: jump
        toStep: 3
      - stepNumber: 7
        label: psbHasComponent
        description: backing = ctx.componentMap.get(pi.component).
        type: local
      - stepNumber: 8
        description: 'Branch: does pi.component resolve to no existing component?'
        type: branch
        condition: no component matches pi.component in ctx.componentMap (backing is undefined)
        onFalseStep: 11
      - stepNumber: 9
        description: >-
          Report PUBLIC_INTERFACE_INVALID_COMPONENT (error; isDraftCtx) naming the subsystem and the
          non-existent component pi.component references.
        type: local
      - stepNumber: 10
        description: >-
          Skip the rest of this entry's checks and continue with the next public interface (mirrors
          the source's continue).
        type: jump
        toStep: 3
      - stepNumber: 11
        label: psbOwnership
        description: >-
          Branch: does the subsystem own the backing component — is backing.subsystem equal to
          sub.id, or does it start with sub.id + "::"?
        type: branch
        condition: the subsystem does not own the backing component (isSubsystemOwner is false)
        onFalseStep: 3
      - stepNumber: 12
        label: psbForeignReport
        description: >-
          Report PUBLIC_INTERFACE_FOREIGN_COMPONENT (error; isDraftCtx) naming the subsystem, the
          component, and the subsystem it actually belongs to — a subsystem may only publish its own
          components.
        type: local
    symbol: check
    exportedVia: publicSurfaceBindingRule
  - name: publicSurfaceDeclaredType
    sourcePath: src/core/rules/integrity/public-surface-declared-type.ts
    narrative:
      - stepNumber: 1
        label: psdSubStart
        description: >-
          For each loaded subsystem, check what every declared public interface entry's type asks of
          its backing component.
        type: loop
        loopKind: forEach
        over: ctx.subsystems
        endStep: 11
      - stepNumber: 2
        description: isDraftCtx = sub.isDraft().
        type: local
      - stepNumber: 3
        label: psdPiStart
        description: >-
          For each OWN component entry declared on the subsystem — an entry with neither `from` nor
          `typeDef`; a re-export inherits its target's type and a type export has none.
        type: loop
        loopKind: forEach
        over: the subsystem's own component entries (sub.publicInterfaces without from or typeDef)
        endStep: 11
      - stepNumber: 4
        description: backing = ctx.componentMap.get(pi.component) when the entry names a component.
        type: local
      - stepNumber: 5
        description: >-
          Branch: public-surface-binding's preconditions, restated — does the entry name a component
          that resolves? An unbound or unresolvable entry is that rule's finding and has no
          stereotype to judge: continue with the next entry.
        type: branch
        condition: >-
          the entry names a backing component and it resolves in ctx.componentMap (backing is
          defined)
        onFalseStep: 3
      - stepNumber: 6
        description: 'Branch: does the private pubTypeMatches report a mismatch?'
        type: branch
        condition: >-
          the entry's declared type cannot be realized by the backing component's stereotype
          (pubTypeMatches(pi.type, backing.componentType, backing.portalType) is false)
        onFalseStep: 8
      - stepNumber: 7
        description: >-
          Report PUBLIC_INTERFACE_TYPE_MISMATCH (error; isDraftCtx) naming the subsystem, the
          component and its stereotype/portalType, and the expected shape for pi.type (the private
          expectedFor).
        type: local
      - stepNumber: 8
        label: psdCustomEscape
        description: >-
          Branch: is pi.type "Custom" and does the private EVENT_VOCAB match pi.details — the
          escape-to-Custom hole, where an unrealized event boundary hides behind the one type that
          carries no backing obligation?
        type: branch
        condition: >-
          the entry is typed Custom and its details prose matches the event/async vocabulary
          (EVENT_VOCAB)
        onFalseStep: 3
      - stepNumber: 9
        description: >-
          eventCapable = backing.componentType is "Observer", or backing.componentType is "Portal"
          with portalType "MessageBus".
        type: local
      - stepNumber: 10
        description: 'Branch: is eventCapable false?'
        type: branch
        condition: the backing component cannot realize eventing (eventCapable is false)
        onFalseStep: 3
      - stepNumber: 11
        label: psdEventReport
        description: >-
          Report PUBLIC_INTERFACE_EVENT_MISTYPED (warning; isDraftCtx) naming the subsystem, the
          Custom entry's description, and the backing component's stereotype/portalType,
          recommending it be retyped MessageBus and backed by an Observer or MessageBus Portal, or
          reworded.
        type: local
    symbol: check
    exportedVia: publicSurfaceDeclaredTypeRule
  - name: publicSurfaceBoundContract
    sourcePath: src/core/rules/integrity/public-surface-bound-contract.ts
    narrative:
      - stepNumber: 1
        label: pscSubStart
        description: >-
          For each loaded subsystem, check the L3 interface every declared public interface entry
          binds.
        type: loop
        loopKind: forEach
        over: ctx.subsystems
        endStep: 11
      - stepNumber: 2
        description: isDraftCtx = sub.isDraft().
        type: local
      - stepNumber: 3
        label: pscPiStart
        description: >-
          For each OWN component entry declared on the subsystem — an entry with neither `from` nor
          `typeDef`; a re-export's narrowing is the export-tables rule's to judge.
        type: loop
        loopKind: forEach
        over: the subsystem's own component entries (sub.publicInterfaces without from or typeDef)
        endStep: 11
      - stepNumber: 4
        description: 'Branch: does the entry bind an L3 interface at all?'
        type: branch
        condition: the entry names a bound L3 interface (pi.interface is set)
        onFalseStep: 3
      - stepNumber: 5
        description: >-
          Branch: public-surface-binding's preconditions, restated — does the entry name a component
          that resolves? Against an entry that names nothing real the ownership comparison is
          trivially true for every interface, so it can only misfire: continue with the next entry.
        type: branch
        condition: the entry names a backing component and ctx.componentMap has it
        onFalseStep: 3
      - stepNumber: 6
        description: intf = ctx.interfaceMap.get(pi.interface).
        type: local
      - stepNumber: 7
        description: 'Branch: does pi.interface resolve to no existing interface?'
        type: branch
        condition: no interface matches pi.interface in ctx.interfaceMap (intf is undefined)
        onTrueStep: 8
        onFalseStep: 10
      - stepNumber: 8
        label: pscMissingInterface
        description: >-
          Report PUBLIC_INTERFACE_INVALID_INTERFACE (error; isDraftCtx) naming the subsystem and the
          non-existent interface pi.interface references.
        type: local
      - stepNumber: 9
        description: Continue with the next public interface entry (already resolved as missing).
        type: jump
        toStep: 3
      - stepNumber: 10
        label: pscInterfaceOwner
        description: >-
          Branch: does the resolved interface belong to a different component than the one the entry
          publishes?
        type: branch
        condition: >-
          the resolved interface belongs to a different component than pi.component (intf.component
          !== pi.component)
        onFalseStep: 3
      - stepNumber: 11
        label: pscForeignInterface
        description: >-
          Report PUBLIC_INTERFACE_INVALID_INTERFACE (error; isDraftCtx) naming the subsystem, the
          interface pi.interface, the component it is bound to (pi.component), and the component it
          actually belongs to (intf.component).
        type: local
    symbol: check
    exportedVia: publicSurfaceBoundContractRule
  - name: publicSurfaceConsumers
    sourcePath: src/core/rules/integrity/public-surface-consumers.ts
    narrative:
      - stepNumber: 1
        label: entry
        description: >-
          For each loaded subsystem, each of its publicInterfaces entries, and each subsystem id
          that entry's consumers names
        type: loop
        loopKind: forEach
        over: every consumers id of every publicInterfaces entry of every subsystem in ctx.subsystems
        endStep: 3
      - stepNumber: 2
        description: Does the id name a subsystem of this tree?
        type: branch
        condition: no subsystem in ctx.subsystems has that id
        onFalseStep: 1
      - stepNumber: 3
        label: unknown
        description: >-
          Report PUBLIC_INTERFACE_UNKNOWN_CONSUMER (error, on the declaring subsystem's id; draft
          context when that subsystem is draft) naming the entry's component and the consumer id
          that resolves to no subsystem
        type: local
      - stepNumber: 4
        description: 'Done: every consumers id resolved or reported'
        type: return
        outcome: judged
    symbol: check
    exportedVia: publicSurfaceConsumersRule
  - name: projectIdentity
    sourcePath: src/core/rules/integrity/project-identity.ts
    narrative:
      - stepNumber: 1
        description: >-
          Read the project identity the validator resolved into the rule context
          (ctx.projectIdentity)
        type: local
      - stepNumber: 2
        description: Is there an identity to judge?
        type: branch
        condition: >-
          the context carries no project identity (no readable configuration, or the parent's
          verdict on a chained child)
        onFalseStep: 4
      - stepNumber: 3
        description: 'No identity of the root''s own to judge: go on to the family''s'
        type: jump
        toStep: 10
      - stepNumber: 4
        label: defaulted
        description: Does the identity carry a defaulted problem?
        type: branch
        condition: the identity's problems include one of kind defaulted
        onFalseStep: 6
      - stepNumber: 5
        description: >-
          Report PROJECT_ID_DEFAULTED (notice), naming the display name and the id derived from it,
          that no save writes it into project.yaml for the project, that stage 3 requires an
          explicit id, and how to declare one
        type: local
      - stepNumber: 6
        label: ambiguous
        description: Does the identity carry an ambiguous problem?
        type: branch
        condition: the identity's problems include one of kind ambiguous
        onFalseStep: 8
      - stepNumber: 7
        description: >-
          Report PROJECT_ID_AMBIGUOUS (warning) with the problem's detail: the display name that
          yields no slug, or the declared id and the grammar it breaks
        type: local
      - stepNumber: 8
        label: changed
        description: Does the identity carry a changed problem?
        type: branch
        condition: the identity's problems include one of kind changed
        onFalseStep: 10
      - stepNumber: 9
        description: >-
          Report PROJECT_ID_CHANGED (error), naming the id the lock approved and the id project.yaml
          resolves to now, and the two ways out: restore the approved id, or rename deliberately and
          re-lock
        type: local
      - stepNumber: 10
        label: family
        description: >-
          Read the family's identity problems from the project graph in the rule context
          (ctx.projectFamily); a candidate run carries none
        type: local
      - stepNumber: 11
        description: For each family identity problem
        type: loop
        loopKind: forEach
        over: the graph's id-collision, no-id and defaulted problems
        endStep: 12
      - stepNumber: 12
        label: family-reported
        description: >-
          Report by the problem's kind: a defaulted member is PROJECT_ID_DEFAULTED (notice), naming
          the member, the name slug it answers to now, and its mount's subsystem id as the id to
          declare in its .wai/project.yaml (2c's doctor --fix writes it); an id-collision is
          PROJECT_ID_AMBIGUOUS (warning) naming the id and each project resolving to it with where
          its id came from (declared or name) — every declaration and reference keyed on that id
          could mean either; a member with no id at all is PROJECT_ID_AMBIGUOUS (warning). The bound
          root's own defaulted and no-id cases are left to the steps above, so each is reported once
        type: local
      - stepNumber: 13
        label: judged
        description: The identity is judged
        type: return
        outcome: judged
    symbol: check
    exportedVia: projectIdentityRule
  - name: exportTables
    sourcePath: src/core/rules/integrity/export-tables.ts
    narrative:
      - stepNumber: 1
        description: Read the export tables the validator resolved into the rule context (ctx.exportTables)
        type: local
      - stepNumber: 2
        description: Are there tables to judge?
        type: branch
        condition: the context carries no export tables (a candidate run)
        onFalseStep: 4
      - stepNumber: 3
        description: 'Nothing to judge: report nothing'
        type: return
        outcome: no tables
      - stepNumber: 4
        label: each-problem
        description: For each problem of each table
        type: loop
        loopKind: forEach
        over: the problems every table records
        endStep: 17
      - stepNumber: 5
        description: >-
          Report by the problem's kind, anchored to the table's owner (a subsystem, or the L0 system
          spec), in the owner's draft context
        type: switch
        'on': the problem's kind
        cases:
          - value: duplicate
            step: 6
          - value: named-cycle
            step: 8
          - value: wildcard-cycle
            step: 10
          - value: invalid
            step: 12
          - value: unconsumable
            step: 14
          - value: widens
            step: 16
        defaultStep: 17
      - stepNumber: 6
        label: duplicate
        description: >-
          Report EXPORT_ID_DUPLICATE (error), naming the public name and the targets competing for
          it, and that the name is left out of the table until one wildcard is narrowed or an
          explicit entry picks the target
        type: local
      - stepNumber: 7
        description: Next problem
        type: jump
        toStep: 17
      - stepNumber: 8
        label: named-cycle
        description: >-
          Report EXPORT_CYCLE (error), naming the public name and the levels on the loop: the chain
          never reaches a component or type
        type: local
      - stepNumber: 9
        description: Next problem
        type: jump
        toStep: 17
      - stepNumber: 10
        label: wildcard-cycle
        description: >-
          Report EXPORT_CYCLE (warning), naming the levels that re-export each other through
          wildcards: the tables resolved to their union, but the levels form one circular module
          surface
        type: local
      - stepNumber: 11
        description: Next problem
        type: jump
        toStep: 17
      - stepNumber: 12
        label: invalid
        description: >-
          Report EXPORT_INVALID (notice) with the problem's detail: the missing source or item, the
          item the source does not export, the own item the level does not own, or the public name
          that breaks [a-z0-9-_]+
        type: local
      - stepNumber: 13
        description: Next problem
        type: jump
        toStep: 17
      - stepNumber: 14
        label: unconsumable
        description: >-
          Report EXPORT_UNCONSUMABLE (notice), naming the public name and the target's stereotype:
          only a Portal (a gateway is a Portal variant) or an Observer can serve a caller across the
          boundary
        type: local
      - stepNumber: 15
        description: Next problem
        type: jump
        toStep: 17
      - stepNumber: 16
        label: widens
        description: >-
          Report EXPORT_WIDENS_AUDIENCE (error), naming the public name, the audience the L0 entry
          declares and the narrower audience of the member's or external's export it re-exports: a
          re-export can narrow reach, never widen it, as `pub use` of a `pub(crate)` item does not
          compile
        type: local
      - stepNumber: 17
        label: reported
        description: The problem is reported
        type: local
      - stepNumber: 18
        description: Every problem is judged
        type: return
        outcome: judged
    symbol: check
    exportedVia: exportTablesRule
  - name: referenceForms
    sourcePath: src/core/rules/integrity/reference-forms.ts
    narrative:
      - stepNumber: 1
        description: Read the project graph from the rule context (ctx.projectFamily)
        type: local
      - stepNumber: 2
        description: Is there a graph to read?
        type: branch
        condition: the context carries no project graph (a candidate run)
        onFalseStep: 4
      - stepNumber: 3
        description: 'Nothing to judge: report nothing'
        type: return
        outcome: no graph
      - stepNumber: 4
        label: each-reference
        description: For each reference an author wrote with a leading `::`
        type: loop
        loopKind: forEach
        over: the graph's authored references
        endStep: 5
      - stepNumber: 5
        label: reported
        description: >-
          Report DEPRECATED_REFERENCE_FORM (notice) on the referring spec, in its draft context,
          naming the position, the form as written and the absolute id it resolved to, which is the
          form to write instead
        type: local
      - stepNumber: 6
        description: Every authored reference is reported
        type: return
        outcome: judged
    detail: full
    symbol: check
    exportedVia: referenceFormsRule
  - name: externalDeclarations
    sourcePath: src/core/rules/integrity/external-declarations.ts
    narrative:
      - stepNumber: 1
        description: Read the project graph from the rule context (ctx.projectFamily)
        type: local
      - stepNumber: 2
        description: Is there a graph to read?
        type: branch
        condition: the context carries no project graph (a candidate run)
        onFalseStep: 4
      - stepNumber: 3
        description: 'Nothing to judge: report nothing'
        type: return
        outcome: no graph
      - stepNumber: 4
        label: each-external
        description: For each external every project of the family declares
        type: loop
        loopKind: forEach
        over: every node's bound externals
        endStep: 7
      - stepNumber: 5
        description: Is it unresolved?
        type: branch
        condition: the external's sourceKind is unresolved
        onFalseStep: 7
      - stepNumber: 6
        description: >-
          Report EXTERNAL_UNRESOLVED (notice), naming the declaring project, the alias, the producer
          id and the external's problem (a malformed alias or id, no family project and no
          source.path, two family projects answering to the id, or a family project at source.path
          answering to another id), and how to fix it in .wai/project.yaml
        type: local
      - stepNumber: 7
        label: checked
        description: The external is checked
        type: local
      - stepNumber: 8
        description: Every declaration is judged
        type: return
        outcome: judged
    detail: full
    symbol: check
    exportedVia: externalDeclarationsRule
