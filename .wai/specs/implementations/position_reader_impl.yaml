id: position_reader_impl
name: Position Reader Implementation
description: 'The positional match, pure. Planned home: src/commands/position-reader.ts (not written yet).'
contract: iposition_reader
methods:
  - name: match
    narrative:
      - stepNumber: 1
        description: >-
          Index the family once by nameKey: every public name of every project's table, and every
          type each project owns, each with its project key and canonical target
        type: local
      - stepNumber: 2
        description: For each unresolved reference
        type: loop
        loopKind: forEach
        over: the unresolved references, in scan order
        endStep: 8
      - stepNumber: 3
        description: Is its first segment (before `::` or `.`) the referring project's own id?
        type: branch
        condition: the reference is prefixed with the referring project's own id
        onFalseStep: 6
      - stepNumber: 4
        description: Answer self-prefix targeting the bare local id when the project holds that spec, else none
        type: local
      - stepNumber: 5
        description: Next reference
        type: jump
        toStep: 8
      - stepNumber: 6
        label: bare
        description: >-
          Look the name's key up among the OTHER projects' public names; with no hit, among the
          types they own that no table exports
        type: local
      - stepNumber: 7
        description: >-
          Classify: one project is import with reason only-match (producer, canonical target,
          existing public name if any); several are narrowed first to the projects the referring
          project already declares as a member or an external — one left is import with reason
          declared-producer — then, among those left (all of them when none is declared), to the
          ones that already export the name — one left is import with reason already-exported;
          otherwise ambiguous, with every candidate and what each rule left; none is none
        type: local
      - stepNumber: 8
        label: matched
        description: The reference is matched
        type: local
      - stepNumber: 9
        description: Answer the matches in scan order
        type: return
        outcome: PositionalMatch[]
status: design
