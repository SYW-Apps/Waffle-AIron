id: lock_store_impl
name: Lock Store Implementation
description: File-backed I/O for the commit-scoped lock record (.wai/lock.json).
contract: ilock_store
sourcePath: src/core/lockfile.ts
methods:
  - name: read
    narrative: []
    intent: >-
      Reads .wai/lock.json for the bound project and returns the parsed LockRecord, or null ONLY
      when the file is absent. A record that exists but cannot be read as one — empty (an editor's
      BOM alone included), not JSON, JSON that names one key twice in one object (what a careless
      conflict resolution leaves: which of the two a reader keeps is the parser's accident, never
      the approver's decision), JSON that is not a lock record object, no gate identity (stateId
      {algorithm, digest}), a specs field that is no digest map, or a format newer than this release
      reads — fails closed with LockRecordUnreadableError naming the file, what is wrong (a
      duplicated key by its path) and the two ways out (restore it from version control, or delete
      it and lock afresh): an approval that cannot be read is never read as no approval. A BOM
      before a valid record is tolerated.
    symbol: readLockRecord
  - name: write
    narrative:
      - stepNumber: 1
        description: Make the .wai folder
        type: call
        targetComponent: files_adapter
        targetMethod: ensureDir
      - stepNumber: 2
        description: >-
          Sample the start of the existing lock.json, so the record keeps the line endings it is
          checked out with
        type: call
        targetComponent: files_adapter
        targetMethod: readDescriptorHead
      - stepNumber: 3
        description: >-
          Serialize the LockRecord and write it to a temporary sibling of .wai/lock.json for the
          bound project
        type: call
        targetComponent: files_adapter
        targetMethod: writeText
        assertsInvariants:
          - lock_record.single-record-per-project
      - stepNumber: 4
        description: >-
          Rename the temporary file over .wai/lock.json, replacing any prior record wholesale — the
          single lock file is the only lock location, so no stale record can survive a write
        type: call
        targetComponent: files_adapter
        targetMethod: rename
    intent: >-
      Serializes the LockRecord and writes it atomically to .wai/lock.json for the bound project,
      overwriting any prior record.
    symbol: writeLockRecord
  - name: readAt
    narrative:
      - stepNumber: 1
        description: >-
          Read and parse the lock record under the given root, answering null only when the file is
          absent — a missing approval is an answer, not a failure — and failing closed with
          LockRecordUnreadableError on one that exists but cannot be read as a lock record, exactly
          as read does: a parent never reads a member's unreadable approval as none
        type: local
    symbol: readLockRecordAt
status: complete
