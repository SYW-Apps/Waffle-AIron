id: lock_store_impl
name: Lock Store Implementation
description: File-backed I/O for the commit-scoped lock record (.wai/lock.json).
contract: ilock_store
sourcePath: src/core/lockfile.ts
methods:
  - name: read
    narrative: []
    intent: >-
      Reads .wai/lock.json for the bound project and returns the parsed LockRecord, or null when the
      file is absent or unreadable.
    symbol: readLockRecord
  - name: write
    narrative:
      - stepNumber: 1
        description: >-
          Serialize the LockRecord and write it atomically to .wai/lock.json for the bound project,
          replacing any prior record wholesale — the single lock file is the only lock location, so
          no stale record can survive a write.
        type: local
        assertsInvariants:
          - lock_record.single-record-per-project
    intent: >-
      Serializes the LockRecord and writes it atomically to .wai/lock.json for the bound project,
      overwriting any prior record.
    symbol: writeLockRecord
  - name: readAt
    narrative:
      - stepNumber: 1
        description: >-
          Read and parse the lock record under the given root, answering null when the file is
          absent or unreadable — a missing approval is an answer, not a failure
        type: local
    symbol: readLockRecordAt
status: complete
