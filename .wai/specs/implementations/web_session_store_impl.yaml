id: web_session_store_impl
name: Web Session Store Implementation
description: >-
  Read-through file I/O over the browser-session set at web-sessions.json under the server data
  root: load parses the file fresh; update holds the file's write lock across a fresh read and the
  replacement.
contract: iweb_session_store
sourcePath: src/server/websessions.ts
methods:
  - name: load
    narrative: []
    intent: >-
      Read web-sessions.json fresh (no in-memory copy), returning the sessions. A missing file
      yields an empty set (first boot is not an error); an unreadable file or structurally invalid
      JSON fails with a storage error naming the offending path so the operator can repair or remove
      it - the store never silently discards persisted sessions.
  - name: update
    narrative: []
    intent: >-
      Under web-sessions.json's write lock (file_write_lock.run), read the set fresh - absent is
      empty, a file that exists but cannot be read or parsed throws and nothing is written - apply
      the change, replace the file atomically via write-temp-then-rename and release the lock, also
      when the change throws. Answers the set written.
    calls:
      - file_write_lock.run
      - files_adapter.ensureDir
detail: intent
status: complete
