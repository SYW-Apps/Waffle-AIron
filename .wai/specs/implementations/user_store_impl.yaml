id: user_store_impl
name: User Store Implementation
description: >-
  Read-through file I/O over the hosted-user set at users.json under the server data root: load
  parses the file fresh; update holds the file's write lock across a fresh read and the replacement.
contract: iuser_store
sourcePath: src/server/users.ts
injectedParams:
  - dataDir
methods:
  - name: load
    narrative: []
    intent: >-
      Read users.json fresh (no in-memory copy), returning the records. A missing file yields an
      empty set; an unreadable file or structurally invalid JSON fails with a storage error naming
      the path.
    symbol: loadStore
  - name: update
    narrative: []
    intent: >-
      Under users.json's write lock (file_write_lock.run), read the set fresh - absent is empty, a
      file that exists but cannot be read or parsed throws and nothing is written - apply the
      change, replace the file atomically via write-temp-then-rename and release the lock, also when
      the change throws. Answers the set written.
    calls:
      - file_write_lock.run
detail: intent
status: complete
createdAt: '2026-07-09T17:29:51.432Z'
updatedAt: '2026-10-23T22:24:17.669Z'
