id: state_hash_impl
name: State Hash Implementation
description: Deterministic content hash of the spec tree.
contract: istate_hash
sourcePath: src/core/statehash.ts
methods:
  - name: compute
    narrative:
      - stepNumber: 1
        description: Load the system spec
        type: call
        targetComponent: spec_loader
        targetMethod: loadSystemSpec
      - stepNumber: 2
        description: Load subsystem specs
        type: call
        targetComponent: spec_loader
        targetMethod: loadSubsystemSpecs
      - stepNumber: 3
        description: Load component specs
        type: call
        targetComponent: spec_loader
        targetMethod: loadComponentSpecs
      - stepNumber: 4
        description: Load interface specs
        type: call
        targetComponent: spec_loader
        targetMethod: loadInterfaceSpecs
      - stepNumber: 5
        description: Load implementation specs
        type: call
        targetComponent: spec_loader
        targetMethod: loadImplementationSpecs
      - stepNumber: 6
        description: Load type specs
        type: call
        targetComponent: spec_loader
        targetMethod: loadTypeSpecs
      - stepNumber: 7
        description: >-
          Put each loaded kind into identity order: by spec id, and for the duplicate-id case by
          canonical content, compared by codepoint rather than by a locale-aware collation. The
          loaders hand back whatever order the filesystem walked the spec files in, and that order
          differs between platforms, so without this the same tree digests differently on each and a
          lock taken on one machine reads stale on another. Only WHOLE specs are reordered: the
          arrays inside a spec (narrative steps, params) are ordered by meaning, and sorting those
          would hide a real design change from the digest.
        type: local
      - stepNumber: 8
        description: Canonicalize the ordered specs (stable key ordering, normalized serialization)
        type: local
      - stepNumber: 9
        description: Digest the canonical form into a StateId (algorithm and hex digest)
        type: local
      - stepNumber: 10
        description: Return the StateId
        type: return
        outcome: StateId
    symbol: computeStateId
status: complete
createdAt: '2026-07-04T12:54:31.981Z'
updatedAt: '2026-09-19T13:14:26.172Z'
