id: surface_orchestrator_impl
name: Surface Orchestrator Implementation
description: >-
  Surface-exchange workflows: projection, codec rendering, import, child delivery, and consumer
  queries.
contract: isurface_orchestrator
sourcePath: src/core/surfaces.ts
methods:
  - name: exportSurface
    narrative:
      - stepNumber: 1
        description: Project the own gateway surface at the requested audience ceiling
        type: call
        targetComponent: surface_projector
        targetMethod: projectOwnSurface
      - stepNumber: 2
        description: OpenAPI rendering requested
        type: branch
        condition: format is openapi
        onFalseStep: 5
      - stepNumber: 3
        description: >-
          Render the snapshot's HTTP entries as one OpenAPI 3.1 document per backing portal into
          renderedSet
        type: call
        targetComponent: openapi_codec
        targetMethod: toOpenApiSet
      - stepNumber: 4
        description: >-
          Populate the result's renderedSet with the per-portal documents; set `rendered` to that
          single document only when there is exactly one portal (one entry in the set), leaving
          `rendered` unset when multiple portals produced multiple documents. When portalId names a
          portal, narrow the set to that one document; a portalId naming no portal is rejected
          rather than silently ignored.
        type: local
      - stepNumber: 5
        description: An output path was given
        type: branch
        condition: outPath provided
        onFalseStep: 7
      - stepNumber: 6
        description: >-
          Write the output path: the snapshot for native format; for openapi, the single document
          when one portal remains (either the project has one, or portalId selected one), and
          otherwise ONE FILE PER PORTAL — the out path's stem suffixed with each portalId — never
          only the first document.
        type: call
        targetComponent: surface_transfer_adapter
        targetMethod: writeSnapshotTo
      - stepNumber: 7
        description: Return the projected snapshot
        type: return
        outcome: SurfaceSnapshot
  - name: importSurface
    narrative:
      - stepNumber: 1
        description: Read the foreign document from the source path
        type: call
        targetComponent: surface_transfer_adapter
        targetMethod: readDocument
      - stepNumber: 2
        description: The document is an OpenAPI spec
        type: branch
        condition: document parses as OpenAPI
        onFalseStep: 5
      - stepNumber: 3
        description: Decode the OpenAPI document into an authored snapshot
        type: call
        targetComponent: openapi_codec
        targetMethod: fromOpenApi
      - stepNumber: 4
        description: Continue at persistence
        type: jump
        toStep: 6
      - stepNumber: 5
        description: Parse the native surface-snapshot YAML and stamp the requested origin
        type: local
      - stepNumber: 6
        description: Persist the imported snapshot into the repository
        type: call
        targetComponent: surface_repository
        targetMethod: saveSnapshot
      - stepNumber: 7
        description: Return the imported snapshot
        type: return
        outcome: SurfaceSnapshot
  - name: listSnapshots
    narrative:
      - stepNumber: 1
        description: Read all stored snapshots from the repository
        type: call
        targetComponent: surface_repository
        targetMethod: listSnapshots
  - name: getSnapshot
    narrative:
      - stepNumber: 1
        description: Read the named snapshot from the repository
        type: call
        targetComponent: surface_repository
        targetMethod: getSnapshot
  - name: generateChildSnapshots
    narrative:
      - stepNumber: 1
        description: Load the subsystem specs to find chained children
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: loadSubsystemSpecs
      - stepNumber: 2
        description: For each subsystem with a projectPath (chained child)
        type: loop
        loopKind: forEach
        over: chained child subsystems
        endStep: 7
      - stepNumber: 3
        description: Project the family-scoped parent surface for this child
        type: call
        targetComponent: surface_projector
        targetMethod: projectChildSurface
      - stepNumber: 4
        description: Write the family snapshot into the child project's .wai/surfaces/
        type: call
        targetComponent: surface_transfer_adapter
        targetMethod: writeSnapshotTo
      - stepNumber: 5
        description: For each SIBLING subsystem (every subsystem except this child's own mount)
        type: loop
        loopKind: forEach
        over: sibling subsystems of this child
        endStep: 7
      - stepNumber: 6
        description: Project the sibling subsystem's published surface at the family ceiling
        type: call
        targetComponent: surface_projector
        targetMethod: projectSubsystemSurface
      - stepNumber: 7
        description: Write the sibling snapshot into the same child's .wai/surfaces/
        type: call
        targetComponent: surface_transfer_adapter
        targetMethod: writeSnapshotTo
      - stepNumber: 8
        description: Return the written snapshot paths (family + siblings, per child)
        type: return
        outcome: written paths
  - name: removeSnapshot
    narrative:
      - stepNumber: 1
        description: Remove the snapshot through the repository
        type: call
        targetComponent: surface_repository
        targetMethod: removeSnapshot
  - name: listExternalInterfaces
    narrative:
      - stepNumber: 1
        description: Read all vendored surface snapshots from the repository
        type: call
        targetComponent: surface_repository
        targetMethod: listSnapshots
      - stepNumber: 2
        description: Detect the chaining-mount context of the current root
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: resolveChainingParent
      - stepNumber: 3
        description: A chaining parent was resolved
        type: branch
        condition: a chaining parent was resolved
        onFalseStep: 5
      - stepNumber: 4
        description: Compute the parent tree's CURRENT state hash as the freshness comparison source
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: computeParentStateId
      - stepNumber: 5
        description: For each stored snapshot
        type: loop
        loopKind: forEach
        over: stored snapshots
        endStep: 6
      - stepNumber: 6
        description: >-
          Build the ExternalSurfaceEntry: classify sourceKind (parent = the generated family surface
          keyed by the parent system name; sibling = a generated '<systemName>::<subsystemId>' key;
          foreign = exchanged/authored imports), carry origin, generatedAt, stateId/version
          provenance and the exposed interface ids, and compute freshness — 'fresh' when a generated
          snapshot's vendored StateId equals the parent's current hash, 'stale' when it differs,
          'unverifiable' when no parent hash is available or the snapshot is foreign
        type: local
      - stepNumber: 7
        description: Return the discovery entries
        type: return
        outcome: ExternalSurfaceEntry[]
lint:
  allow:
    - code: CALL_STEP_UNREALIZED
      reason: >-
        Child snapshot write-out is realized through the fs adapter's saveSnapshot in the same flow;
        the transfer adapter's writeSnapshotTo names the cross-project export edge — reconcile the
        naming when the surfaces subsystem takes its final lock.
status: complete
