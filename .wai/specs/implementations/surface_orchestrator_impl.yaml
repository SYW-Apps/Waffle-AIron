id: surface_orchestrator_impl
name: Surface Orchestrator Implementation
description: >-
  Surface-exchange workflows: projection, codec rendering, import, child-pulled pins, per-mount
  snapshot reads, and consumer queries.
contract: isurface_orchestrator
sourcePath: src/core/surfaces.ts
methods:
  - name: export
    narrative:
      - stepNumber: 1
        description: Project the own gateway surface at the requested audience ceiling
        type: call
        targetComponent: surface_projector
        targetMethod: projectOwnSurface
      - stepNumber: 2
        description: OpenAPI rendering requested
        type: branch
        condition: format is openapi
        onFalseStep: 5
      - stepNumber: 3
        description: >-
          Render the snapshot's HTTP entries as one OpenAPI 3.1 document per backing portal into
          renderedSet
        type: call
        targetComponent: openapi_codec
        targetMethod: toOpenApiSet
      - stepNumber: 4
        description: >-
          Populate the result's renderedSet with the per-portal documents; set `rendered` to that
          single document only when there is exactly one portal (one entry in the set), leaving
          `rendered` unset when multiple portals produced multiple documents. When portalId names a
          portal, narrow the set to that one document; a portalId naming no portal is rejected
          rather than silently ignored.
        type: local
      - stepNumber: 5
        description: An output path was given
        type: branch
        condition: outPath provided
        onFalseStep: 7
      - stepNumber: 6
        description: >-
          Write the output path: the snapshot for native format; for openapi, the single document
          when one portal remains (either the project has one, or portalId selected one), and
          otherwise ONE FILE PER PORTAL — the out path's stem suffixed with each portalId — never
          only the first document.
        type: call
        targetComponent: surface_transfer_adapter
        targetMethod: writeSnapshotTo
      - stepNumber: 7
        description: Return the projected snapshot
        type: return
        outcome: SurfaceSnapshot
    symbol: exportSurface
  - name: import
    narrative:
      - stepNumber: 1
        description: Read the foreign document from the source path
        type: call
        targetComponent: surface_transfer_adapter
        targetMethod: readDocument
      - stepNumber: 2
        description: The document is an OpenAPI spec
        type: branch
        condition: document parses as OpenAPI
        onFalseStep: 5
      - stepNumber: 3
        description: Decode the OpenAPI document into an authored snapshot
        type: call
        targetComponent: openapi_codec
        targetMethod: fromOpenApi
      - stepNumber: 4
        description: Continue at persistence
        type: jump
        toStep: 6
      - stepNumber: 5
        description: Parse the native surface-snapshot YAML and stamp the requested origin
        type: local
      - stepNumber: 6
        description: Persist the imported snapshot into the repository
        type: call
        targetComponent: surface_repository
        targetMethod: saveSnapshot
      - stepNumber: 7
        description: Return the imported snapshot
        type: return
        outcome: SurfaceSnapshot
    symbol: importSurface
  - name: listSnapshots
    narrative:
      - stepNumber: 1
        description: Read all stored snapshots from the repository
        type: call
        targetComponent: surface_repository
        targetMethod: listSnapshots
  - name: getSnapshot
    narrative:
      - stepNumber: 1
        description: Read the named snapshot from the repository
        type: call
        targetComponent: surface_repository
        targetMethod: getSnapshot
  - name: removeSnapshot
    narrative:
      - stepNumber: 1
        description: Remove the snapshot through the repository
        type: call
        targetComponent: surface_repository
        targetMethod: removeSnapshot
  - name: pinExternals
    sourcePath: src/core/surfaces.ts
    narrative:
      - stepNumber: 1
        description: Read the bound root's configuration through the core
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 2
        description: >-
          Is the bound root a part (stage 8)? A part declares no externals: what it pins is its
          parent
        type: branch
        condition: the configuration is a part's (ProjectConfig.isPart)
        onFalseStep: 5
      - stepNumber: 3
        description: 'Pin the part''s parent instead: its excerpt, into the part''s lock `parent` entry'
        type: call
        targetComponent: surface_orchestrator
        targetMethod: pinParent
      - stepNumber: 4
        description: Answer the parent's outcome
        type: return
        outcome: ExternalPin[]
      - stepNumber: 5
        label: externals
        description: >-
          Resolve the bound project's declared externals and its referenced project members (a
          `../`, git or hosted source) through the core: each bound to its producer (family,
          source.path, git at its ref's head or a member's pinned commit, hosted), with the
          consumer's references into each by public name
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: resolveExternals
      - stepNumber: 6
        description: Keep the aliases asked for, or every declared external when none are named
        type: local
      - stepNumber: 7
        description: Is an alias named that the project does not declare?
        type: branch
        condition: a named alias is not among the declared externals
        onFalseStep: 9
      - stepNumber: 8
        description: Refuse before anything is written, naming the alias and the declared ones
        type: throw
        error: UnknownExternalAliasError
      - stepNumber: 9
        label: read-lock
        description: Read the current externals lock (none yet reads as empty)
        type: call
        targetComponent: externals_repository
        targetMethod: readLock
      - stepNumber: 10
        description: For each external to pin
        type: loop
        loopKind: forEach
        over: the kept bindings
        endStep: 21
      - stepNumber: 11
        description: Is its producer resolved?
        type: branch
        condition: the binding's sourceKind is unresolved
        onTrueStep: 20
        onFalseStep: 12
      - stepNumber: 12
        description: >-
          Bind the producer's root read-only — for a git producer the cache directory of the bound
          commit — restoring the consumer's binding afterwards. The caller must gate on reach
          itself: a producer root outside the request's reach, missing, unfetchable or holding no
          project is recorded as unreachable with the reason, and its previous pin stays
        type: local
      - stepNumber: 13
        description: >-
          Project the producer's resolved project export table at the external's audience ceiling
          (project for a family producer, instance for a source.path, git or hosted one), each entry
          with its stereotype, narrowed interface and full contract, plus the exported types and the
          type closure of every signature
        type: call
        targetComponent: surface_projector
        targetMethod: projectOwnSurface
      - stepNumber: 14
        description: >-
          Restore the consumer's binding and stamp the snapshot with the audience it was filtered
          to; take its content digest (SurfaceSnapshot.contentDigest)
        type: local
      - stepNumber: 15
        description: Read the snapshot pinned for the alias now
        type: call
        targetComponent: externals_repository
        targetMethod: readSnapshot
      - stepNumber: 16
        description: Is the pinned snapshot's content the same?
        type: branch
        condition: a snapshot is pinned and its content digest equals the new one
        onTrueStep: 18
        onFalseStep: 17
      - stepNumber: 17
        description: Write the new snapshot to .wai/externals/<alias>.yaml
        type: call
        targetComponent: externals_repository
        targetMethod: saveSnapshot
      - stepNumber: 18
        label: used
        description: >-
          Compute the lock entry: the producer id, the snapshot path, the content digest, the role
          (external, or member for a referenced project member), the commit (the fetched commit of a
          git producer, else the head of the work tree holding the producer when it is in one), and
          `used` — each public name of the binding's usage mapped to each of its members'
          SurfaceSnapshot.memberDigest (an empty map for a name only depended on; a member the
          snapshot does not carry is reported missing and not pinned). Usage exists for every
          producer since stage 8, so an outside producer's `used` is filled too
        type: local
      - stepNumber: 19
        description: Next external
        type: jump
        toStep: 21
      - stepNumber: 20
        label: unresolved-pin
        description: >-
          Record the outcome as unresolved with the external's problem — for a source.hosted
          external pinned outside a hosted server, "hosted-only producer `<id>`: available only
          through the hosted server" — and its previous pin stays
        type: local
      - stepNumber: 21
        label: next
        description: The external is handled
        type: local
      - stepNumber: 22
        description: >-
          With no aliases named, prune every lock entry whose alias is no longer declared, with its
          snapshot
        type: call
        targetComponent: surface_orchestrator
        targetMethod: prune
      - stepNumber: 23
        description: Did the lock change?
        type: branch
        condition: any lock entry was added, changed or pruned
        onFalseStep: 25
      - stepNumber: 24
        description: Write the lock
        type: call
        targetComponent: externals_repository
        targetMethod: saveLock
      - stepNumber: 25
        label: answer
        description: Answer one outcome per external handled, in declaration order
        type: return
        outcome: ExternalPin[]
    detail: full
  - name: getExternalsStatus
    sourcePath: src/core/surfaces.ts
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the bound project's declared externals and its referenced project members (a
          `../`, git or hosted source) through the core, with the consumer's references as they are
          now — counted by public name for every producer, the outside ones included
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: resolveExternals
      - stepNumber: 2
        description: Read the externals lock
        type: call
        targetComponent: externals_repository
        targetMethod: readLock
      - stepNumber: 3
        description: For each declared external
        type: loop
        loopKind: forEach
        over: the bindings
        endStep: 11
      - stepNumber: 4
        description: Read its pinned snapshot, if any
        type: call
        targetComponent: externals_repository
        targetMethod: readSnapshot
      - stepNumber: 5
        description: Can the live producer be read?
        type: branch
        condition: >-
          the producer is resolved, its root is in the request's reach (a git producer — a fetched
          commit — and a referenced member — a root its declarer names explicitly — are never a root
          above the family, so no ceiling applies to them) and holds a project
        onFalseStep: 10
      - stepNumber: 6
        description: >-
          Bind the producer's root read-only (the caller must gate on reach itself), restoring the
          consumer's binding afterwards
        type: local
      - stepNumber: 7
        description: Project the producer's live export table at the external's audience ceiling
        type: call
        targetComponent: surface_projector
        targetMethod: projectOwnSurface
      - stepNumber: 8
        description: >-
          Restore the consumer's binding. Compare every used member — the lock's and the one the
          references use now — at signature level, for every producer alike (family, path, git,
          hosted, a referenced project): a live SurfaceSnapshot.memberDigest equal to the locked one
          is unchanged, a different one changed, none removed, and a member used now but not in the
          lock unlocked; an unexported reference of a family producer is unavailable. Stale when a
          used member changed or went away; drifted when the live content digest differs from the
          pinned one
        type: local
      - stepNumber: 9
        description: Next external
        type: jump
        toStep: 11
      - stepNumber: 10
        label: unavailable
        description: >-
          Report every locked used member — or, when none is locked, the external itself — as
          unavailable with EXTERNAL_CHECK_UNAVAILABLE and the reason: unresolved (the external's
          problem), unreachable (why its root could not be read), a git producer that could not be
          fetched or resolved (offline, refused, unknown ref), or a source.hosted producer read
          outside a hosted server or out of the request's reach (outOfReach). Never a pass
        type: local
      - stepNumber: 11
        label: reported
        description: The external's status is recorded
        type: local
      - stepNumber: 12
        description: Answer one status per declared external, in declaration order
        type: return
        outcome: ExternalStatus[]
    detail: full
  - name: listExternals
    sourcePath: src/core/surfaces.ts
    narrative:
      - stepNumber: 1
        description: Resolve the bound project's declared externals through the core
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: resolveExternals
      - stepNumber: 2
        description: Read the externals lock
        type: call
        targetComponent: externals_repository
        targetMethod: readLock
      - stepNumber: 3
        description: >-
          One row per declared external: alias, producer id, source kind, relation, directory,
          audience, problem, and the lock's entry when pinned
        type: local
      - stepNumber: 4
        description: Answer the rows in declaration order
        type: return
        outcome: ExternalListing[]
    detail: full
  - name: listFamilyPins
    narrative:
      - stepNumber: 1
        description: Read the snapshots the bound root holds through the repository
        type: call
        targetComponent: surface_repository
        targetMethod: listSnapshots
      - stepNumber: 2
        description: >-
          Keep the generated ones — foreign imports (exchanged, authored) are never family pins —
          and classify each by its key: `<system>::<subsystem>` is a sibling pin, any other
          generated key the parent's family pin
        type: local
      - stepNumber: 3
        description: Answer the family pins in key order
        type: return
        outcome: FamilyPin[]
  - name: listPinnedExternals
    sourcePath: src/core/surfaces.ts
    narrative:
      - stepNumber: 1
        description: >-
          Read the bound project's declared externals from its configuration through the core — the
          aliases and producer ids only; no producer is bound and nothing is climbed
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 2
        description: Read the externals lock
        type: call
        targetComponent: externals_repository
        targetMethod: readLock
      - stepNumber: 3
        description: For each declared alias
        type: loop
        loopKind: forEach
        over: the declared aliases, in declaration order
        endStep: 5
      - stepNumber: 4
        description: Read its pinned snapshot, if the lock holds an entry for it
        type: call
        targetComponent: externals_repository
        targetMethod: readSnapshot
      - stepNumber: 5
        description: >-
          Record the alias with its producer id, the lock entry and the snapshot — or the problem:
          never pinned, the snapshot file missing, or the snapshot unreadable
        type: local
      - stepNumber: 6
        description: Answer the pins in declaration order
        type: return
        outcome: PinnedExternal[]
  - name: renamePin
    sourcePath: src/core/externals.ts
    narrative:
      - stepNumber: 1
        description: Read the current externals lock (none yet reads as empty)
        type: call
        targetComponent: externals_repository
        targetMethod: readLock
      - stepNumber: 2
        description: Is there a pin to carry?
        type: branch
        condition: >-
          the lock has no entry for the alias, or already holds the entry under newAlias with that
          producer id
        onFalseStep: 4
      - stepNumber: 3
        description: 'Nothing to carry: nothing is written'
        type: return
        outcome: 'false'
      - stepNumber: 4
        label: read-snapshot
        description: Read the alias's pinned snapshot
        type: call
        targetComponent: externals_repository
        targetMethod: readSnapshot
      - stepNumber: 5
        description: >-
          Set the snapshot provenance's producer id to the new one, leaving its content — and so its
          digest — untouched
        type: local
      - stepNumber: 6
        description: Save the snapshot under the new alias
        type: call
        targetComponent: externals_repository
        targetMethod: saveSnapshot
      - stepNumber: 7
        description: >-
          Move the lock entry to the new alias with the new producer id and snapshot path, its
          digest and used map as pinned, and save the lock
        type: call
        targetComponent: externals_repository
        targetMethod: saveLock
      - stepNumber: 8
        description: Did the alias change?
        type: branch
        condition: newAlias differs from alias
        onFalseStep: 10
      - stepNumber: 9
        description: Remove the snapshot kept under the old alias
        type: call
        targetComponent: externals_repository
        targetMethod: removeSnapshot
      - stepNumber: 10
        label: carried
        description: The pin now answers to the new alias and producer id
        type: return
        outcome: 'true'
  - name: unpin
    sourcePath: src/core/externals.ts
    narrative:
      - stepNumber: 1
        description: Read the current externals lock
        type: call
        targetComponent: externals_repository
        targetMethod: readLock
      - stepNumber: 2
        description: Is the alias pinned?
        type: branch
        condition: the lock has no entry for the alias
        onFalseStep: 4
      - stepNumber: 3
        description: 'Nothing pinned: nothing is written'
        type: return
        outcome: 'false'
      - stepNumber: 4
        label: drop
        description: Drop the entry and save the lock
        type: call
        targetComponent: externals_repository
        targetMethod: saveLock
      - stepNumber: 5
        description: Remove the alias's snapshot
        type: call
        targetComponent: externals_repository
        targetMethod: removeSnapshot
      - stepNumber: 6
        description: The pin is gone
        type: return
        outcome: 'true'
  - name: pinnedParent
    narrative:
      - stepNumber: 1
        description: Read the bound root's configuration through the core; nothing is bound or climbed
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 2
        description: Is the bound root a part?
        type: branch
        condition: the configuration is a part's
        onFalseStep: 6
      - stepNumber: 3
        description: Read the part's externals lock and take its parent entry
        type: call
        targetComponent: externals_repository
        targetMethod: readLock
      - stepNumber: 4
        description: Read the excerpt the entry names, when there is an entry
        type: call
        targetComponent: externals_repository
        targetMethod: readExcerpt
      - stepNumber: 5
        description: >-
          Answer the parent's id with the entry and the excerpt — or the problem: never pinned, the
          excerpt missing or unreadable, or an excerpt of another project than PartOf names
        type: return
        outcome: PinnedParent
      - stepNumber: 6
        label: none
        description: 'Not a part: answer null'
        type: return
        outcome: 'null'
    detail: full
  - name: pinParent
    narrative:
      - stepNumber: 1
        description: A part has no alias to name
        type: branch
        condition: an alias is named
        onFalseStep: 3
      - stepNumber: 2
        description: >-
          Refuse before anything is written: a part declares no externals; what it pins is its
          parent
        type: throw
        error: UnknownExternalAlias
      - stepNumber: 3
        description: >-
          Take the excerpt of the parent the part's files reference, read with the parent on disk at
          PartOf.path; a parent the core cannot read or that does not claim the part is answered
          unreachable with the reason, and the previous pin stays
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: excerptParent
      - stepNumber: 4
        description: Read the part's externals lock (none yet reads as empty)
        type: call
        targetComponent: externals_repository
        targetMethod: readLock
      - stepNumber: 5
        description: >-
          Write the excerpt to .wai/externals/<parent id>.yaml when its digest differs from the
          lock's parent entry
        type: call
        targetComponent: externals_repository
        targetMethod: saveExcerpt
      - stepNumber: 6
        description: >-
          Record the lock's parent entry — the parent's id, the excerpt's path and digest, the
          commit, role parent, an empty used map — when it changed
        type: call
        targetComponent: externals_repository
        targetMethod: saveLock
      - stepNumber: 7
        description: 'Answer one outcome, the parent''s: pinned, unchanged or unreachable'
        type: return
        outcome: ExternalPin[]
    detail: full
  - name: prune
    narrative:
      - stepNumber: 1
        description: Drop every lock entry whose alias the project no longer declares
        type: local
      - stepNumber: 2
        description: For each pruned alias
        type: loop
        loopKind: forEach
        over: the dropped aliases
        endStep: 3
      - stepNumber: 3
        description: Remove its snapshot
        type: call
        targetComponent: externals_repository
        targetMethod: removeSnapshot
      - stepNumber: 4
        description: Answer whether any entry was dropped
        type: return
        outcome: whether the lock changed
    detail: full
lint:
  allow:
    - code: UNDECLARED_COLOCATED_CALL
      at: listFamilyPins
      covers:
        - surface_store.list
      reason: >-
        The narrative's surface_repository.listSnapshots read and surface_store.list are one
        function in src/core/surfaces.ts (listSnapshots): the facade has no body of its own apart
        from the store, so the call the narrative names is the call the code makes. The same shape
        its siblings getSnapshot and listMountSnapshots carry in the debt register; listFamilyPins
        replaced listExternalInterfaces, whose entry for it was retired with it.
status: complete
