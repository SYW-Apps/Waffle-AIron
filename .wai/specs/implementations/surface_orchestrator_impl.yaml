id: surface_orchestrator_impl
name: Surface Orchestrator Implementation
description: >-
  Surface-exchange workflows: projection, codec rendering, import, child-pulled pins, per-mount
  snapshot reads, and consumer queries.
contract: isurface_orchestrator
sourcePath: src/core/surfaces.ts
methods:
  - name: export
    narrative:
      - stepNumber: 1
        description: Project the own gateway surface at the requested audience ceiling
        type: call
        targetComponent: surface_projector
        targetMethod: projectOwnSurface
      - stepNumber: 2
        description: OpenAPI rendering requested
        type: branch
        condition: format is openapi
        onFalseStep: 5
      - stepNumber: 3
        description: >-
          Render the snapshot's HTTP entries as one OpenAPI 3.1 document per backing portal into
          renderedSet
        type: call
        targetComponent: openapi_codec
        targetMethod: toOpenApiSet
      - stepNumber: 4
        description: >-
          Populate the result's renderedSet with the per-portal documents; set `rendered` to that
          single document only when there is exactly one portal (one entry in the set), leaving
          `rendered` unset when multiple portals produced multiple documents. When portalId names a
          portal, narrow the set to that one document; a portalId naming no portal is rejected
          rather than silently ignored.
        type: local
      - stepNumber: 5
        description: An output path was given
        type: branch
        condition: outPath provided
        onFalseStep: 7
      - stepNumber: 6
        description: >-
          Write the output path: the snapshot for native format; for openapi, the single document
          when one portal remains (either the project has one, or portalId selected one), and
          otherwise ONE FILE PER PORTAL — the out path's stem suffixed with each portalId — never
          only the first document.
        type: call
        targetComponent: surface_transfer_adapter
        targetMethod: writeSnapshotTo
      - stepNumber: 7
        description: Return the projected snapshot
        type: return
        outcome: SurfaceSnapshot
    symbol: exportSurface
  - name: import
    narrative:
      - stepNumber: 1
        description: Read the foreign document from the source path
        type: call
        targetComponent: surface_transfer_adapter
        targetMethod: readDocument
      - stepNumber: 2
        description: The document is an OpenAPI spec
        type: branch
        condition: document parses as OpenAPI
        onFalseStep: 5
      - stepNumber: 3
        description: Decode the OpenAPI document into an authored snapshot
        type: call
        targetComponent: openapi_codec
        targetMethod: fromOpenApi
      - stepNumber: 4
        description: Continue at persistence
        type: jump
        toStep: 6
      - stepNumber: 5
        description: Parse the native surface-snapshot YAML and stamp the requested origin
        type: local
      - stepNumber: 6
        description: Persist the imported snapshot into the repository
        type: call
        targetComponent: surface_repository
        targetMethod: saveSnapshot
      - stepNumber: 7
        description: Return the imported snapshot
        type: return
        outcome: SurfaceSnapshot
    symbol: importSurface
  - name: listSnapshots
    narrative:
      - stepNumber: 1
        description: Read all stored snapshots from the repository
        type: call
        targetComponent: surface_repository
        targetMethod: listSnapshots
  - name: getSnapshot
    narrative:
      - stepNumber: 1
        description: Read the named snapshot from the repository
        type: call
        targetComponent: surface_repository
        targetMethod: getSnapshot
  - name: removeSnapshot
    narrative:
      - stepNumber: 1
        description: Remove the snapshot through the repository
        type: call
        targetComponent: surface_repository
        targetMethod: removeSnapshot
  - name: listExternalInterfaces
    narrative:
      - stepNumber: 1
        description: Read all vendored surface snapshots from the repository
        type: call
        targetComponent: surface_repository
        targetMethod: listSnapshots
      - stepNumber: 2
        description: >-
          Detect the chaining-mount context of the current root — null when the bound request may
          not read above its root
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: resolveChainingParent
      - stepNumber: 3
        description: A chaining parent was resolved
        type: branch
        condition: a chaining parent was resolved
        onFalseStep: 5
      - stepNumber: 4
        description: >-
          Bind the parent root read-only and project what it publishes NOW — its family surface and
          each sibling's published surface, exactly as pinFamilySurfaces would store them — as the
          content every generated snapshot is compared with
        type: call
        targetComponent: surface_projector
        targetMethod: projectChildSurface
      - stepNumber: 5
        description: For each stored snapshot
        type: loop
        loopKind: forEach
        over: stored snapshots
        endStep: 6
      - stepNumber: 6
        description: >-
          Build the ExternalSurfaceEntry: classify sourceKind (parent = the generated family surface
          keyed by the parent system name; sibling = a generated '<systemName>::<subsystemId>' key;
          foreign = exchanged/authored imports), carry origin, generatedAt, stateId/version
          provenance and the exposed interface ids, and compute freshness on content — 'fresh' when
          a generated snapshot's contracts equal the current projection for its key, 'stale' when
          they differ or the key is no longer projected, 'unverifiable' when no projection is
          available or the snapshot is foreign
        type: local
      - stepNumber: 7
        description: Return the discovery entries
        type: return
        outcome: ExternalSurfaceEntry[]
  - name: listMountSnapshots
    narrative:
      - stepNumber: 1
        description: For each chained mount namespace
        type: loop
        loopKind: forEach
        over: mount namespaces
        endStep: 4
      - stepNumber: 2
        description: >-
          Resolve the mount's namespace to its project root through the core; a mount that does not
          resolve (missing, or escaping the project root) contributes nothing
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: resolveSubprojectForNamespace
      - stepNumber: 3
        description: Read every snapshot stored at that mount's root
        type: call
        targetComponent: surface_repository
        targetMethod: listSnapshots
      - stepNumber: 4
        description: Record the mount's snapshots under its namespace, skipping a mount that holds none
        type: local
      - stepNumber: 5
        description: Return the per-mount snapshots
        type: return
        outcome: MountSurfaceSnapshots[]
  - name: pinFamilySurfaces
    narrative:
      - stepNumber: 1
        description: Detect the chaining-mount context of the current (child) root
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: resolveChainingParent
      - stepNumber: 2
        description: Only a chained subproject has a family to pin
        type: branch
        condition: no chaining parent — the bound root is a top root
        onTrueStep: 3
        onFalseStep: 4
      - stepNumber: 3
        description: Nothing to pin
        type: return
        outcome: 'null'
      - stepNumber: 4
        description: >-
          Bind the parent root read-only for the projection, restoring the child's binding
          afterwards
        type: local
      - stepNumber: 5
        description: Load the parent's top-level subsystems
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: loadSubsystemSpecs
      - stepNumber: 6
        description: Project the family-scoped parent surface this child may consume
        type: call
        targetComponent: surface_projector
        targetMethod: projectChildSurface
      - stepNumber: 7
        description: For each SIBLING subsystem
        type: loop
        loopKind: forEach
        over: every top-level parent subsystem except this child's own mount
        endStep: 8
      - stepNumber: 8
        description: Project the sibling's published surface at the family ceiling
        type: call
        targetComponent: surface_projector
        targetMethod: projectSubsystemSurface
      - stepNumber: 9
        description: For each projected snapshot
        type: loop
        loopKind: forEach
        over: the projected family and sibling snapshots
        endStep: 10
      - stepNumber: 10
        description: Store it in the CHILD's .wai/surfaces/, leaving an unchanged snapshot untouched
        type: call
        targetComponent: surface_repository
        targetMethod: saveSnapshot
      - stepNumber: 11
        description: Return the paths that changed
        type: return
        outcome: the changed snapshot paths
  - name: pinExternals
    sourcePath: src/core/surfaces.ts
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the bound project's declared externals through the core: each bound to its
          producer, with the consumer's references into each family producer mapped onto its public
          names
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: resolveExternals
      - stepNumber: 2
        description: Keep the aliases asked for, or every declared external when none are named
        type: local
      - stepNumber: 3
        description: Is an alias named that the project does not declare?
        type: branch
        condition: a named alias is not among the declared externals
        onFalseStep: 5
      - stepNumber: 4
        description: Refuse before anything is written, naming the alias and the declared ones
        type: throw
        error: UnknownExternalAliasError
      - stepNumber: 5
        label: read-lock
        description: Read the current externals lock (none yet reads as empty)
        type: call
        targetComponent: surface_repository
        targetMethod: readExternalsLock
      - stepNumber: 6
        description: For each external to pin
        type: loop
        loopKind: forEach
        over: the kept bindings
        endStep: 17
      - stepNumber: 7
        description: Is its producer resolved?
        type: branch
        condition: the binding's sourceKind is unresolved
        onTrueStep: 16
        onFalseStep: 8
      - stepNumber: 8
        description: >-
          Bind the producer's root read-only, restoring the consumer's binding afterwards. The
          caller must gate on reach itself: a producer root outside the request's reach, missing, or
          holding no project is recorded as unreachable with the reason, and its previous pin stays
        type: local
      - stepNumber: 9
        description: >-
          Project the producer's resolved project export table at the external's audience ceiling
          (project for a family producer, instance for a source.path one), each entry with its
          stereotype, narrowed interface and full contract, plus the exported types and the type
          closure
        type: call
        targetComponent: surface_projector
        targetMethod: projectOwnSurface
      - stepNumber: 10
        description: >-
          Restore the consumer's binding and stamp the snapshot with the audience it was filtered
          to; take its content digest (SurfaceSnapshot.contentDigest)
        type: local
      - stepNumber: 11
        description: Read the snapshot pinned for the alias now
        type: call
        targetComponent: surface_repository
        targetMethod: readExternalSnapshot
      - stepNumber: 12
        description: Is the pinned snapshot's content the same?
        type: branch
        condition: a snapshot is pinned and its content digest equals the new one
        onTrueStep: 14
        onFalseStep: 13
      - stepNumber: 13
        description: Write the new snapshot to .wai/externals/<alias>.yaml
        type: call
        targetComponent: surface_repository
        targetMethod: saveExternalSnapshot
      - stepNumber: 14
        label: used
        description: >-
          Compute the lock entry: the producer id, the snapshot path, the content digest, and `used`
          — each public name of the binding's usage mapped to each of its members'
          SurfaceSnapshot.memberDigest (an empty map for a name only depended on; a member the
          snapshot does not carry cannot be pinned and is reported); record the outcome as pinned
          when the snapshot or the entry changed, else unchanged, with the usage's unexported
          references
        type: local
      - stepNumber: 15
        description: Next external
        type: jump
        toStep: 17
      - stepNumber: 16
        label: unresolved-pin
        description: Record the outcome as unresolved with the external's problem; its previous pin stays
        type: local
      - stepNumber: 17
        label: next
        description: The external is handled
        type: local
      - stepNumber: 18
        description: >-
          With no aliases named, prune: every lock entry whose alias is no longer declared is
          dropped
        type: local
      - stepNumber: 19
        description: For each pruned alias
        type: loop
        loopKind: forEach
        over: the pruned aliases
        endStep: 20
      - stepNumber: 20
        label: pruned
        description: Remove its snapshot
        type: call
        targetComponent: surface_repository
        targetMethod: removeExternalSnapshot
      - stepNumber: 21
        description: Did the lock change?
        type: branch
        condition: any lock entry was added, changed or pruned
        onFalseStep: 23
      - stepNumber: 22
        description: Write the lock
        type: call
        targetComponent: surface_repository
        targetMethod: saveExternalsLock
      - stepNumber: 23
        label: answer
        description: Answer one outcome per external handled, in declaration order
        type: return
        outcome: ExternalPin[]
    detail: full
  - name: getExternalsStatus
    sourcePath: src/core/surfaces.ts
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the bound project's declared externals through the core, with the consumer's
          references as they are now
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: resolveExternals
      - stepNumber: 2
        description: Read the externals lock
        type: call
        targetComponent: surface_repository
        targetMethod: readExternalsLock
      - stepNumber: 3
        description: For each declared external
        type: loop
        loopKind: forEach
        over: the bindings
        endStep: 11
      - stepNumber: 4
        description: Read its pinned snapshot, if any
        type: call
        targetComponent: surface_repository
        targetMethod: readExternalSnapshot
      - stepNumber: 5
        description: Can the live producer be read?
        type: branch
        condition: the producer is resolved, its root is in the request's reach and holds a project
        onFalseStep: 10
      - stepNumber: 6
        description: >-
          Bind the producer's root read-only (the caller must gate on reach itself), restoring the
          consumer's binding afterwards
        type: local
      - stepNumber: 7
        description: Project the producer's live export table at the external's audience ceiling
        type: call
        targetComponent: surface_projector
        targetMethod: projectOwnSurface
      - stepNumber: 8
        description: >-
          Restore the consumer's binding. Compare every used member — the lock's and the one the
          references use now — at signature level: a live SurfaceSnapshot.memberDigest equal to the
          locked one is unchanged, a different one changed, none removed, and a member used now but
          absent from the lock is unlocked; an unexported reference is unavailable
          (EXTERNAL_CHECK_UNAVAILABLE). Stale when any is changed or removed; drifted when the live
          content digest differs from the pinned one
        type: local
      - stepNumber: 9
        description: Next external
        type: jump
        toStep: 11
      - stepNumber: 10
        label: unavailable
        description: >-
          Report every locked used member as unavailable with EXTERNAL_CHECK_UNAVAILABLE and the
          reason (unresolved, unreachable, or — for a producer outside the family — that no stage-2
          reference reaches it), never as a pass
        type: local
      - stepNumber: 11
        label: reported
        description: The external's status is recorded
        type: local
      - stepNumber: 12
        description: Answer one status per declared external, in declaration order
        type: return
        outcome: ExternalStatus[]
    detail: full
  - name: listExternals
    sourcePath: src/core/surfaces.ts
    narrative:
      - stepNumber: 1
        description: Resolve the bound project's declared externals through the core
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: resolveExternals
      - stepNumber: 2
        description: Read the externals lock
        type: call
        targetComponent: surface_repository
        targetMethod: readExternalsLock
      - stepNumber: 3
        description: >-
          One row per declared external: alias, producer id, source kind, relation, directory,
          audience, problem, and the lock's entry when pinned
        type: local
      - stepNumber: 4
        description: Answer the rows in declaration order
        type: return
        outcome: ExternalListing[]
    detail: full
lint:
  allow: []
status: complete
