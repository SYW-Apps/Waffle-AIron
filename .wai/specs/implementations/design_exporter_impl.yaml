id: design_exporter_impl
name: Design Exporter Implementation
description: >-
  The design export projector in src/core/design-export.ts, beside the surface projector it borrows
  from: the export resolver's tables, the type-expression reading the snapshot's canonicalTypeRef
  uses, and the StateId. The approval verdict is never decided here: the caller hands in the
  lock-check state, decided against the gate identity. A reference into another project is written
  as the stable `alias::publicName` a consumer resolves, read back from that member's L0 export
  table, never as the loader's in-memory key; each dependency carries its pinned digest from the
  externals lock when it has one. The zod schema of the format lives in src/models/design-export.ts,
  and the JSON Schema shipped in the package (schemas/design-export-1.json) is generated from it at
  build time with the zod-to-json-schema devDependency (zod is 3.23), a test failing when the two
  drift.
contract: idesign_exporter
sourcePath: src/core/design-export.ts
methods:
  - name: exportDesign
    narrative:
      - stepNumber: 1
        description: >-
          Load the L0 system spec: the project's name, vision, boundaries, global requirements and
          target language
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: loadSystemSpec
      - stepNumber: 2
        description: 'Guard: a tree without an L0 has no project to export'
        type: branch
        condition: the system spec is absent
        onFalseStep: 4
      - stepNumber: 3
        description: Refuse, naming the missing L0
        type: throw
        error: 'no-system: the tree has no L0 system spec to export'
      - stepNumber: 4
        description: 'Load every subsystem (a part''s included: a part is storage, not a boundary)'
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: loadSubsystemSpecs
      - stepNumber: 5
        description: Load every component
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: loadComponentSpecs
      - stepNumber: 6
        description: >-
          Load every interface, as the loader resolved it: a sourced method already carries its
          source's params and returns, every type position its canonical text
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: loadInterfaceSpecs
      - stepNumber: 7
        description: Load every implementation with its narratives
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: loadImplementationSpecs
      - stepNumber: 8
        description: Load every type
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: loadTypeSpecs
      - stepNumber: 9
        description: >-
          Read the resolved project export table: each public name bound to its canonical target,
          with audience, version and stability
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: resolveProjectExports
      - stepNumber: 10
        description: For each subsystem, its own export table
        type: loop
        loopKind: forEach
        over: the loaded subsystems
        endStep: 11
      - stepNumber: 11
        description: Read the subsystem's resolved L1 export table
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: resolveSubsystemExports
      - stepNumber: 12
        description: Read the project configuration for the project's effective id
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 13
        description: >-
          Read the project's externals, each bound to its producer, with the public names this
          project's references use
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: resolveExternals
      - stepNumber: 14
        description: >-
          Read the project graph: the bound project's direct project members, each node whose parent
          is the bound root, with its alias and its id — an in-tree subdirectory member and a legacy
          mount included. A part is not among them: its subsystems are this project's own
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: projectFamily
      - stepNumber: 15
        description: For each direct member, the names it publishes
        type: loop
        loopKind: forEach
        over: the direct project members
        endStep: 16
      - stepNumber: 16
        description: >-
          Read that member's resolved L0 export table by its namespace: each bound key of an item it
          exports (the component, the interface it narrows to, the type) maps to `<alias>::<public
          name>`, the stable name a consumer resolves; and take from the graph's cross-project
          references every public name of that member the bound project's references reach, in every
          position — the member dependency's `uses` is those names together with the ones the
          projection wrote, never only the latter
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: resolveProjectExports
      - stepNumber: 17
        description: >-
          Read the externals lock for each dependency's pinned digest; a lock that is absent or
          cannot be read pins nothing, and the digest is then left out (the field is optional)
        type: call
        targetComponent: externals_repository
        targetMethod: readLock
      - stepNumber: 18
        description: Compute the tree's StateId, the source's content identity
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: computeStateId
      - stepNumber: 19
        description: >-
          Build the source: the project id, the StateId as `sha256:<digest>`, approval = the
          lock-check state the caller handed in (unjudged when none), and approved = that state is
          locked — the same verdict lock-check and status give, never recomputed here from per-spec
          digests
        type: local
      - stepNumber: 20
        description: >-
          Key every element — a subsystem, component, interface and implementation by its id, a type
          by `subsystem::id` when a subsystem owns it and by its bare id otherwise, a contract
          method by `<interface key>.<name>` and a type method by `<type key>.<name>`; a reference
          into another project as `alias::publicName` through the member tables (one that binds no
          exported name stays as the loader bound it, which the gate reports) — and project each
          type position as a DesignTypeRef: its parse (type_expression.parse) with each named
          member's name replaced by the key of the type it resolves to (same subsystem first, then
          system-level), and the canonical text of that resolved parse; a position the grammar
          cannot read keeps its text and no expression
        type: local
      - stepNumber: 21
        description: >-
          Project the L0 into DesignProject (boundaries and requirements as text, the resolved
          project export table as DesignExportEntry rows with each entry's derived export kind and
          role), each subsystem (lifecycle roots, its resolved L1 table, trusted links) and each
          component (stereotype, variant, dependency class, durability, a Portal's transport, abi
          and Portal-level invokedBy entry, owns and dependsOn, topics, a Portal's auth, base path
          and dispatch table, its patterns and external links, previousIds as formerly), every
          reference as a key
        type: local
      - stepNumber: 22
        description: >-
          Project each interface (methods with params and returns as DesignTypeRefs, the derived
          signature, signatureType when it names a signature type, effect, guarantees, invokedBy,
          the endpoint as declared, previousNames as formerly), each implementation (technologies by
          name, sourcePath, per method its effective detail, intent, calls and narrative steps with
          targets and credential sources as keys) and each type (fields, pure methods, a signature's
          params and returns, enum values in order, holds, invariants, componentClass, persistence
          mapping, previousIds as formerly)
        type: local
      - stepNumber: 23
        description: >-
          List the dependencies: each externals binding (alias, project id, role, the used public
          names sorted), then each direct member not already listed (role member, the public names
          this projection's references reached in it), each with the digest its lock entry pins when
          it has one
        type: local
      - stepNumber: 24
        description: >-
          Leave out what is not this project's design: a member project's specs (ids carrying its
          namespace; the member is a dependency, never inlined), lint allows, conformance tiers,
          symbol, exportedVia and router, simPath, finding declarations, createdAt and updatedAt.
          Keep ext untouched under each pack's key. Then sort every element list and the
          dependencies by key, keep inner lists in declared order, and stamp format `wairon-design`,
          the formatVersion (2.0: the reachability model's MAJOR, which removed the listener mounts
          and portalType and narrowed invokedBy to entry and runtime) and the generating wairon
          version
        type: local
      - stepNumber: 25
        description: Return the design export
        type: return
        outcome: DesignExport
status: complete
