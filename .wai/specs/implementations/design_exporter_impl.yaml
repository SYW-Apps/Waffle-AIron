id: design_exporter_impl
name: Design Exporter Implementation
description: >-
  The design export projector in src/core/design-export.ts, beside the surface projector it borrows
  from: the export resolver's tables, the type-expression reading the snapshot's canonicalTypeRef
  uses, and the StateId. The approval verdict is never decided here: the caller hands in the
  lock-check state, decided against the gate identity. The zod schema of the format lives in
  src/models/design-export.ts, and the JSON Schema shipped in the package
  (schemas/design-export-1.json) is generated from it at build time with the zod-to-json-schema
  devDependency (zod is 3.23), a test failing when the two drift.
contract: idesign_exporter
sourcePath: src/core/design-export.ts
methods:
  - name: exportDesign
    narrative:
      - stepNumber: 1
        description: >-
          Load the L0 system spec: the project's name, vision, boundaries, global requirements and
          target language
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: loadSystemSpec
      - stepNumber: 2
        description: 'Guard: a tree without an L0 has no project to export'
        type: branch
        condition: the system spec is absent
        onFalseStep: 4
      - stepNumber: 3
        description: Refuse, naming the missing L0
        type: throw
        error: 'no-system: the tree has no L0 system spec to export'
      - stepNumber: 4
        description: 'Load every subsystem (a part''s included: a part is storage, not a boundary)'
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: loadSubsystemSpecs
      - stepNumber: 5
        description: Load every component
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: loadComponentSpecs
      - stepNumber: 6
        description: >-
          Load every interface, as the loader resolved it: a sourced method already carries its
          source's params and returns, every type position its canonical text
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: loadInterfaceSpecs
      - stepNumber: 7
        description: Load every implementation with its narratives
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: loadImplementationSpecs
      - stepNumber: 8
        description: Load every type
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: loadTypeSpecs
      - stepNumber: 9
        description: >-
          Read the resolved project export table: each public name bound to its canonical target,
          with audience, version and stability, and the subsystem tables it was resolved from
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: resolveProjectExports
      - stepNumber: 10
        description: Read the project configuration for the project's effective id
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 11
        description: >-
          Read the project's externals and referenced project members, each bound to its producer,
          with the public names this project's references use
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: resolveExternals
      - stepNumber: 12
        description: Compute the tree's StateId, the source's content identity
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: computeStateId
      - stepNumber: 13
        description: >-
          Build the source: the project id, the StateId as `sha256:<digest>`, approval = the
          lock-check state the caller handed in (unjudged when none), and approved = that state is
          locked — the same verdict lock-check and status give, never recomputed here from per-spec
          digests
        type: local
      - stepNumber: 14
        description: >-
          Key every element: a subsystem, component, interface and implementation by its id, a type
          by `subsystem::id` when a subsystem owns it and by its bare id otherwise, a contract
          method by `<interface key>.<name>` and a type method by `<type key>.<name>`; anything in
          another project stays `alias::publicName`
        type: local
      - stepNumber: 15
        description: >-
          Project each type position as a DesignTypeRef: its canonical text, and its parse
          (type_expression.parse) with each named member's name replaced by the key of the type it
          resolves to; a position the grammar cannot read keeps its text and no expression
        type: local
      - stepNumber: 16
        description: >-
          Project the L0 into DesignProject (boundaries and requirements as text) with the resolved
          project export table as DesignExportEntry rows (target as a key), and each externals
          binding into a DesignDependency (alias, project id, member or external, pinned digest when
          pinned, used public names sorted)
        type: local
      - stepNumber: 17
        description: >-
          Project each subsystem: its lifecycle roots with component keys, its resolved L1 export
          table, its trusted links as keys
        type: local
      - stepNumber: 18
        description: >-
          Project each component: stereotype, variant, dependency class, durability, portal type,
          owns and dependsOn as keys, emitted and subscribed topics, a Portal's auth, base path and
          dispatch table with targets as keys, its previousIds as formerly
        type: local
      - stepNumber: 19
        description: >-
          Project each interface and its methods: params and returns as DesignTypeRefs, the derived
          signature text, signatureType when the method names a signature type (a method source is
          inlined, never named), effect, guarantees, invokedBy, the endpoint as declared,
          previousNames and previousIds as formerly
        type: local
      - stepNumber: 20
        description: >-
          Project each implementation: contract and component keys, technologies by name,
          sourcePath, and per method its detail (after the stereotype default), intent, declared
          calls as keys and its narrative steps as stored with call, register and dispatch targets
          resolved to keys
        type: local
      - stepNumber: 21
        description: >-
          Project each type: kind, fields, pure methods, a signature's params and returns, an enum's
          values in order, a named scalar's holds, invariants, componentClass as a key, its
          persistence mapping, previousIds as formerly
        type: local
      - stepNumber: 22
        description: >-
          Leave out what is not design: lint allows, conformance tiers, symbol and exportedVia
          bindings, simPath, finding declarations, createdAt and updatedAt; keep ext untouched under
          each pack's key
        type: local
      - stepNumber: 23
        description: >-
          Sort every element list and the dependencies by key, keep every inner list in declared
          order, and stamp format `wairon-design`, the current formatVersion and the generating
          wairon version
        type: local
      - stepNumber: 24
        description: Return the design export
        type: return
        outcome: DesignExport
status: design
