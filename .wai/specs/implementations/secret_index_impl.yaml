id: secret_index_impl
name: Secret Index Implementation
description: 'Read path over the secret store''s backing file: key names for listings, one value by key.'
contract: isecret_index
sourcePath: src/utils/secrets.ts
methods:
  - name: list
    narrative: []
    intent: Reads the persisted map and returns its key names — never the values.
    calls:
      - secret_store.read
    symbol: listSecretKeys
  - name: resolve
    narrative: []
    intent: >-
      Reads the persisted map and answers the value under the key; when none is stored, answers the
      first of the key's environment fallbacks that is set (WAIRON_GIT_TOKEN for git-token, and so
      on), else null. An unreadable or absent store reads as empty, so a local install with no data
      dir resolves from the environment alone.
    calls:
      - secret_store.read
    symbol: resolveSecret
status: complete
