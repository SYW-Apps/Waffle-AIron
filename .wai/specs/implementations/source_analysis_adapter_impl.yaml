id: source_analysis_adapter_impl
name: Source Analysis Adapter Implementation
description: >-
  Tiered source-file analysis with zero mandatory parser dependencies. The TypeScript compiler is
  this component's bound technology, but the binding is opportunistic: dynamically resolved from the
  analyzed project's node_modules first, wairon's own installation second, and simply absent
  otherwise — pattern-table and generic-scan tiers keep conformance functional (at a recorded lower
  grade) on hosted checkouts without node_modules and on any language.
contract: isource_analysis_adapter
sourcePath: src/core/source-analysis.ts
technologies:
  - typescript-compiler
methods:
  - name: buildCodeModel
    narrative:
      - stepNumber: 1
        description: >-
          Walk the declared source roots for the files no spec need name: resolve each root within
          the project root (an absolute or parent-escaping root is refused by containment and never
          walked), take a file root as itself and descend a directory root recursively without
          entering a directory named node_modules or one whose name begins with a dot, and keep each
          file, once and as a canonical project-relative key, whose extension names a language the
          analyzer knows and that is not at, or under, an exclude entry. Declaring no root finds
          nothing, which is what keeps the unclaimed-source check opt-in
        type: local
      - stepNumber: 2
        description: >-
          Deduplicate the distinct source paths the specs name — each implementation's sourcePath,
          each method's own sourcePath and each simPath, then each type's sourcePath and each type
          method's own sourcePath — append the walked rootFiles, and resolve each against the
          project root, classifying absolute or parent-escaping paths as escaped (containment,
          mirroring the projectPath rule) and nonexistent files as missing
        type: local
      - stepNumber: 3
        description: Read each remaining file as text, classifying binary or unreadable content as unreadable
        type: local
      - stepNumber: 4
        description: >-
          Select the analyzer per file: exact AST when the TypeScript compiler module resolves
          dynamically for ts/js (analyzed project's node_modules first, wairon's own installation
          second, never bundled); else the file language's declarative pattern table (built-in
          tables merged under extension-pack registrations); else the generic word-boundary scan
        type: local
      - stepNumber: 5
        description: >-
          Extract per-file facts: declaration-tier names (named declarations at any nesting depth,
          destructuring bindings, object-literal keys, import bindings, export specifiers), weak
          anchors (exact string literals and property-access references), exported names, import
          module specifiers, and — at exact grade — the runtime import BINDINGS by local name (which
          module each came from, which were bound as a whole namespace, which the import renamed),
          the runtime RE-EXPORT bindings name by name (a named export-from with both sides of its
          rename, a star with * on both sides), which is what lets a reader follow a republished
          name — aliased or not — to the module that wrote it, the module each TYPE-ONLY binding
          came from, kept apart because a type binding can never be a call origin though it is what
          a declared type resolves through, the type names each instance FIELD is declared with from
          class property declarations and constructor parameter properties, the type names each
          locally BOUND name is declared with from parameters and annotated variable declarations,
          both recording nothing where the declaration names no type outright, since an inferred
          type is not a declared one and a destructured binding binds the type's properties rather
          than the type, the call SITES of each named function-like with the shape each call was
          written in — a bare name, a plain-identifier receiver, the this.<field> receiver whose
          declared type can be followed, or the new Class(...) receiver whose class name can be —
          and, before any republication is folded in, whether the file declared nothing of its own
          and only re-exported, which is what makes it a pure re-export barrel
        type: local
      - stepNumber: 6
        label: chaseReexports
        description: >-
          Chase the re-export barrels through their relative specifiers with a visited set: merge
          every export-* target's exported names into the declaration tier, and carry the measured
          BODY — complexity and call sites — of every name a barrel republishes, named re-export and
          star alike, since the two spellings republish the same way. A carried site keeps the file
          it was READ in, so its bare names and receivers resolve in the real module's scope and
          never in the barrel's
        type: local
      - stepNumber: 7
        description: >-
          Degrade any file whose exact analysis throws to the generic scan, recording the grade per
          file — a single file never aborts the run
        type: local
      - stepNumber: 8
        description: >-
          Return the assembled CodeModel: per-file facts, the resolved project root, and the walked
          root-file list the unclaimed-source rule judges
        type: return
        outcome: CodeModel
  - name: findTestsReferencing
    narrative:
      - stepNumber: 1
        description: >-
          Resolve each declared test root within the project root and refuse an absolute or
          parent-escaping one rather than walking it, on the same containment terms as the source
          walk; declaring none answers empty without reading a file
        type: local
      - stepNumber: 2
        description: >-
          Walk those roots for test files, skipping node_modules and dot-directories, and read each
          one: its named-import names (both sides of a rename), its import bindings with the module
          each came from (static imports that open a statement, so a fixture's quoted source is not
          read as the test's own import, and destructured dynamic imports), and its words
        type: local
      - stepNumber: 3
        description: >-
          For each method take the name to search for — its `symbol` when it declares one, otherwise
          its own name — and the file realizing it when it carries a sourcePath; a method given more
          than once becomes one search over every file it names
        type: local
      - stepNumber: 4
        description: >-
          Collect the test files that IMPORT it and, separately, those that only mention it. With no
          realizing file, an import is any binding of the name and a mention any word, as before.
          With one, an import counts only when the binding's module IS that file under the symbol,
          or re-exports it from there — named, aliased or not, or through a star, followed through
          every chain of re-exports (a module that cannot be read re-exports nothing) — or is a
          namespace import of such a module in a file naming the symbol. A file that binds the name
          to another module is neither: the name in it is that module's function, and counting it is
          how removing an adapter named like its provider once listed every test of the provider. A
          file that names the symbol and binds it nowhere is a mention — how a test driving the
          method through a portal shows up
        type: local
      - stepNumber: 5
        description: Decide whether the bare name discriminates
        type: branch
        condition: the mention count exceeds a tenth of the walked test files
        onTrueStep: 6
        onFalseStep: 7
      - stepNumber: 6
        description: >-
          Withhold the mention list and mark it indiscriminate: a name like `project` or `status`
          matches most of the suite, and a list that long is not an answer
        type: local
      - stepNumber: 7
        description: >-
          Answer with one entry per method that any test names, carrying the imported and mentioned
          lists and why a list was withheld. A method nothing references contributes no entry — an
          entry whose every list is empty is not an answer, and the report field it feeds promises
          to be empty when nothing references them. A withheld mention list still counts as naming,
          because saying the name is too common IS the answer
        type: return
        outcome: found
status: complete
