id: mcp_portal_impl
name: MCP Portal Implementation
description: >-
  Dispatches sdd_* tool calls to the MCP orchestrator; server bootstrap is forwarded to the MCP
  server supervisor. Realized today inside src/mcp/server.ts (the portal role is folded into the
  server module pending the code-side split).
contract: imcp_portal
sourcePath: src/mcp/server.ts
methods:
  - name: createMcpServer
    narrative:
      - stepNumber: 1
        description: Forward createMcpServer call to the MCP server supervisor
        type: call
        targetComponent: mcp_server
        targetMethod: create
  - name: sdd_initialize_system
    narrative:
      - stepNumber: 1
        description: Dispatch to the initializeSystem workflow
        type: call
        targetComponent: mcp_orchestrator
        targetMethod: initializeSystem
  - name: sdd_add_subsystem
    narrative:
      - stepNumber: 1
        description: Dispatch to the addSubsystem workflow
        type: call
        targetComponent: mcp_orchestrator
        targetMethod: addSubsystem
  - name: sdd_add_component
    narrative:
      - stepNumber: 1
        description: Dispatch to the addComponent workflow
        type: call
        targetComponent: mcp_orchestrator
        targetMethod: addComponent
  - name: sdd_define_interface
    narrative:
      - stepNumber: 1
        description: Dispatch to the defineInterface workflow
        type: call
        targetComponent: mcp_orchestrator
        targetMethod: defineInterface
  - name: sdd_write_narrative
    narrative:
      - stepNumber: 1
        description: Dispatch to the writeNarrative workflow
        type: call
        targetComponent: mcp_orchestrator
        targetMethod: writeNarrative
  - name: sdd_validate_tree
    narrative:
      - stepNumber: 1
        description: Dispatch to the validateTree workflow
        type: call
        targetComponent: mcp_orchestrator
        targetMethod: validateTree
  - name: sdd_get_status
    narrative:
      - stepNumber: 1
        description: Dispatch to the getStatus workflow
        type: call
        targetComponent: mcp_orchestrator
        targetMethod: getStatus
  - name: sdd_externalize_subsystem
    narrative:
      - stepNumber: 1
        description: Build the externalize request and dispatch it to the migration workflow with dryRun
        type: call
        targetComponent: mcp_migration_orchestrator
        targetMethod: run
  - name: listResources
    narrative:
      - stepNumber: 1
        description: Dispatch the MCP resources/list request to the resource workflow.
        type: call
        targetComponent: mcp_orchestrator
        targetMethod: listResources
    symbol: registerSkillResources
  - name: readResource
    narrative:
      - stepNumber: 1
        description: Dispatch the MCP resources/read request to the resource workflow.
        type: call
        targetComponent: mcp_orchestrator
        targetMethod: readResource
    symbol: registerSkillResources
  - name: sdd_get_agent_brief
    narrative:
      - stepNumber: 1
        description: Dispatch the tool call to the agent-brief workflow
        type: call
        targetComponent: mcp_orchestrator
        targetMethod: getAgentBrief
  - name: sdd_rename_component
    narrative:
      - stepNumber: 1
        description: Dispatch to the renameComponent workflow
        type: call
        targetComponent: mcp_orchestrator
        targetMethod: renameComponent
  - name: sdd_rename_method
    narrative:
      - stepNumber: 1
        description: Dispatch to the renameMethod workflow
        type: call
        targetComponent: mcp_orchestrator
        targetMethod: renameMethod
  - name: sdd_update_spec
    narrative:
      - stepNumber: 1
        description: Dispatch to the updateSpec workflow
        type: call
        targetComponent: mcp_orchestrator
        targetMethod: updateSpec
  - name: sdd_set_endpoints
    narrative:
      - stepNumber: 1
        description: Dispatch to the setEndpoints workflow
        type: call
        targetComponent: mcp_orchestrator
        targetMethod: setEndpoints
  - name: sdd_set_public_interfaces
    narrative:
      - stepNumber: 1
        description: Dispatch to the setPublicInterfaces workflow
        type: call
        targetComponent: mcp_orchestrator
        targetMethod: setPublicInterfaces
  - name: sdd_get_spec
    narrative:
      - stepNumber: 1
        description: Dispatch to the getSpec workflow
        type: call
        targetComponent: mcp_orchestrator
        targetMethod: getSpec
  - name: sdd_add_type
    narrative:
      - stepNumber: 1
        description: Dispatch to the addType workflow
        type: call
        targetComponent: mcp_orchestrator
        targetMethod: addType
  - name: sdd_move_methods
    narrative:
      - stepNumber: 1
        description: Dispatch the tool call to the move workflow
        type: call
        targetComponent: mcp_orchestrator
        targetMethod: moveMethods
  - name: sdd_delete_spec
    narrative:
      - stepNumber: 1
        description: Dispatch the tool call to the delete workflow
        type: call
        targetComponent: mcp_orchestrator
        targetMethod: deleteSpec
  - name: advertiseHostedTools
    narrative:
      - stepNumber: 1
        description: >-
          Decide whether this server advertises the hosted surface at all — the local stdio server
          started without it publishes none of these
        type: branch
        condition: the server was created with hosted tools enabled
        onTrueStep: 2
        onFalseStep: 3
      - stepNumber: 2
        description: >-
          Register each hosted and landscape tool as a discovery entry bound to a handler that
          answers 'dispatched by the hosting data plane before reaching this server, unavailable
          outside a hosted request' — the entry exists so the tool can be FOUND, and the hosting
          request orchestrator is what executes it
        type: local
      - stepNumber: 3
        description: Done; the tool list now carries what this server can advertise
        type: return
        outcome: advertised
  - name: getProjectConfig
    narrative:
      - stepNumber: 1
        description: >-
          Read the bound project's resolved configuration through the config repository, answering
          null when it has none
        type: call
        targetComponent: mcp_orchestrator
        targetMethod: getProjectConfig
  - name: sdd_pin_externals
    narrative:
      - stepNumber: 1
        description: Dispatch to the externals pin workflow
        type: call
        targetComponent: mcp_externals_orchestrator
        targetMethod: pin
  - name: sdd_get_externals_status
    narrative:
      - stepNumber: 1
        description: Dispatch to the externals status workflow
        type: call
        targetComponent: mcp_externals_orchestrator
        targetMethod: status
  - name: sdd_add_member
    narrative:
      - stepNumber: 1
        description: Dispatch to the addMember workflow
        type: call
        targetComponent: mcp_orchestrator
        targetMethod: addMember
  - name: sdd_move_member
    narrative:
      - stepNumber: 1
        description: Dispatch to the moveMember workflow
        type: call
        targetComponent: mcp_orchestrator
        targetMethod: moveMember
  - name: sdd_internalize_member
    narrative:
      - stepNumber: 1
        description: >-
          Build the internalize request, its destination from into, packs and exports, and dispatch
          it to the migration workflow with dryRun
        type: call
        targetComponent: mcp_migration_orchestrator
        targetMethod: run
  - name: sdd_pack_impact
    narrative:
      - stepNumber: 1
        description: Dispatch to the packImpact workflow
        type: call
        targetComponent: mcp_orchestrator
        targetMethod: packImpact
  - name: sdd_attach_member
    narrative:
      - stepNumber: 1
        description: Build the attach request and dispatch it to the migration workflow with dryRun
        type: call
        targetComponent: mcp_migration_orchestrator
        targetMethod: run
  - name: sdd_rename_project
    narrative:
      - stepNumber: 1
        description: Build the rename request and dispatch it to the migration workflow with dryRun
        type: call
        targetComponent: mcp_migration_orchestrator
        targetMethod: run
  - name: sdd_rename_member_alias
    narrative:
      - stepNumber: 1
        description: Build the rename-alias request and dispatch it to the migration workflow with dryRun
        type: call
        targetComponent: mcp_migration_orchestrator
        targetMethod: run
  - name: sdd_detach_member
    narrative:
      - stepNumber: 1
        description: Build the detach request and dispatch it to the migration workflow with dryRun
        type: call
        targetComponent: mcp_migration_orchestrator
        targetMethod: run
  - name: sdd_adopt_member
    narrative:
      - stepNumber: 1
        description: Build the adopt request and dispatch it to the migration workflow with dryRun
        type: call
        targetComponent: mcp_migration_orchestrator
        targetMethod: run
status: complete
createdAt: '2026-06-19T12:00:00Z'
