    symbol: sdd_remove_external
  - name: updateExternal
    narrative:
      - stepNumber: 1
        description: >-
          Gather the tool's arguments into an ExternalUseRequest and dispatch to the update-external
          workflow
        type: call
        targetComponent: mcp_externals_orchestrator
        targetMethod: updateUse
    symbol: sdd_update_external
  - name: renameField
    narrative:
      - stepNumber: 1
        description: Dispatch to the renameField workflow
        type: call
        targetComponent: mcp_orchestrator
        targetMethod: renameField
    symbol: sdd_rename_field
status: complete
