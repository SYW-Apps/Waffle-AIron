id: surfaces_core_adapter_impl
name: Surfaces Core Adapter Implementation
description: >-
  sdd_surfaces' client hop into sdd_core, in a module of its own: identity re-exports of the core
  portals. The surface workflows import this module, so their calls into core land here.
contract: isurfaces_core_adapter
sourcePath: src/core/adapters/surfaces-core.ts
methods:
  - name: loadSystemSpec
    narrative:
      - stepNumber: 1
        description: Call loadSystemSpec on core portal
        type: call
        targetComponent: spec_tree_portal
        targetMethod: loadSystemSpec
  - name: loadComponentSpecs
    narrative:
      - stepNumber: 1
        description: Call loadComponentSpecs on core portal
        type: call
        targetComponent: spec_tree_portal
        targetMethod: loadComponentSpecs
  - name: loadInterfaceSpecs
    narrative:
      - stepNumber: 1
        description: Call loadInterfaceSpecs on core portal
        type: call
        targetComponent: spec_tree_portal
        targetMethod: loadInterfaceSpecs
  - name: loadTypeSpecs
    narrative:
      - stepNumber: 1
        description: Call loadTypeSpecs on core portal
        type: call
        targetComponent: spec_tree_portal
        targetMethod: loadTypeSpecs
  - name: computeStateId
    narrative:
      - stepNumber: 1
        description: Call computeStateId on the approval portal
        type: call
        targetComponent: approval_portal
        targetMethod: computeStateId
  - name: resolveProjectExports
    narrative:
      - stepNumber: 1
        description: Call resolveProjectExports on the core portal
        type: call
        targetComponent: spec_tree_portal
        targetMethod: resolveProjectExports
  - name: loadProjectConfig
    narrative:
      - stepNumber: 1
        description: Call loadProjectConfig on the project config portal
        type: call
        targetComponent: project_config_portal
        targetMethod: loadProjectConfig
  - name: resolveExternals
    narrative:
      - stepNumber: 1
        description: Forward the externals resolution, with `offline`, to the core subsystem's published portal
        type: call
        targetComponent: spec_tree_portal
        targetMethod: resolveExternals
  - name: excerptParent
    narrative:
      - stepNumber: 1
        description: Forward the part's parent excerpt to the core subsystem's published portal
        type: call
        targetComponent: spec_tree_portal
        targetMethod: excerptParent
  - name: loadSubsystemSpecs
    narrative:
      - stepNumber: 1
        description: Call loadSubsystemSpecs on core portal
        type: call
        targetComponent: spec_tree_portal
        targetMethod: loadSubsystemSpecs
  - name: loadImplementationSpecs
    narrative:
      - stepNumber: 1
        description: Call loadImplementationSpecs on core portal
        type: call
        targetComponent: spec_tree_portal
        targetMethod: loadImplementationSpecs
  - name: resolveSubsystemExports
    narrative:
      - stepNumber: 1
        description: Call resolveSubsystemExports on core portal
        type: call
        targetComponent: spec_tree_portal
        targetMethod: resolveSubsystemExports
  - name: projectFamily
    narrative:
      - stepNumber: 1
        description: Forward the project graph read to the core subsystem's published portal
        type: call
        targetComponent: spec_tree_portal
        targetMethod: projectFamily
  - name: declareExternal
    narrative:
      - stepNumber: 1
        description: >-
          Forward the declaration write to the core subsystem's published configuration portal,
          which routes it through the core orchestrator
        type: call
        targetComponent: project_config_portal
        targetMethod: declareExternal
  - name: removeExternal
    narrative:
      - stepNumber: 1
        description: >-
          Forward the removal to the core subsystem's published configuration portal, which routes
          it through the core orchestrator
        type: call
        targetComponent: project_config_portal
        targetMethod: removeExternal
status: complete
