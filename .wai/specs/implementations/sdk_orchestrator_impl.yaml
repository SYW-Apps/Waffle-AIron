id: sdk_orchestrator_impl
name: SDK Orchestrator Implementation
description: >-
  sdk/src/orchestrator.ts — the four pack workflows, delegating format/safety decisions to the
  codec, template rendering to the scaffold specialist, and all zip+fs I/O to the archive adapter.
  Holds no state.
contract: isdk_orchestrator
sourcePath: sdk/src/orchestrator.ts
methods:
  - name: scaffoldPack
    narrative:
      - stepNumber: 1
        description: Render the scaffold file map for the requested pack.
        type: call
        targetComponent: pack_scaffold_specialist
        targetMethod: render
      - stepNumber: 2
        description: Write the rendered files as a directory tree under the request's targetDir.
        type: call
        targetComponent: pack_archive_adapter
        targetMethod: writeTree
      - stepNumber: 3
        description: Return the created file paths (targetDir-joined).
        type: return
        outcome: success
  - name: buildPack
    narrative:
      - stepNumber: 1
        description: Read the source pack directory into a file map.
        type: call
        targetComponent: pack_archive_adapter
        targetMethod: readPackDir
      - stepNumber: 2
        description: 'Require an envelope: is there no wairon-pack.yaml among the files?'
        type: branch
        condition: files has no 'wairon-pack.yaml'
        onTrueStep: 3
        onFalseStep: 4
      - stepNumber: 3
        description: Reject a pack directory with no envelope.
        type: throw
        error: pack build requires a wairon-pack.yaml envelope (run `wairon pack init` to scaffold one)
      - stepNumber: 4
        label: parse
        description: Parse + validate the envelope text (also version-gates the format).
        type: call
        targetComponent: pack_codec
        targetMethod: parseManifest
      - stepNumber: 5
        description: >-
          Read the inner pack identity: name/version from the declarative pack.yaml, or from
          package.json for a code pack.
        type: local
      - stepNumber: 6
        description: Assert the envelope's name/version match the inner pack manifest.
        type: call
        targetComponent: pack_codec
        targetMethod: verifyIdentity
      - stepNumber: 7
        description: >-
          Seal integrity: fill entryDigests + digest and stamp generatedBy '@wairon/sdk@<version>'
          and the current generatedAt ISO time.
        type: call
        targetComponent: pack_codec
        targetMethod: sealIntegrity
      - stepNumber: 8
        description: Serialize the sealed manifest back to canonical envelope text.
        type: call
        targetComponent: pack_codec
        targetMethod: serializeManifest
      - stepNumber: 9
        description: Upsert wairon-pack.yaml (sealed envelope text) into the file map.
        type: local
      - stepNumber: 10
        description: Deflate the files + envelope into .wpack archive bytes.
        type: call
        targetComponent: pack_archive_adapter
        targetMethod: assembleArchive
      - stepNumber: 11
        description: >-
          Assemble PackArchiveInfo (identity + entryCount + totalUncompressedBytes +
          compatible=true) and suggestedFileName `${name}-${version}.wpack`.
        type: local
      - stepNumber: 12
        description: Return the PackBuildResult (archive bytes + info + suggested file name).
        type: return
        outcome: success
  - name: inspectArchive
    narrative:
      - stepNumber: 1
        description: Enumerate archive entries without inflating.
        type: call
        targetComponent: pack_archive_adapter
        targetMethod: listEntries
      - stepNumber: 2
        description: Is there no wairon-pack.yaml entry?
        type: branch
        condition: entries has no 'wairon-pack.yaml'
        onTrueStep: 3
        onFalseStep: 4
      - stepNumber: 3
        description: Reject a non-.wpack archive.
        type: throw
        error: not a .wpack archive (missing wairon-pack.yaml envelope)
      - stepNumber: 4
        label: readEnv
        description: Inflate just the envelope entry.
        type: call
        targetComponent: pack_archive_adapter
        targetMethod: inflateEntry
      - stepNumber: 5
        description: Parse + version-check the envelope text.
        type: call
        targetComponent: pack_codec
        targetMethod: parseManifest
      - stepNumber: 6
        description: Compute compatibility against the running wairon version.
        type: call
        targetComponent: pack_codec
        targetMethod: checkCompatibility
      - stepNumber: 7
        description: >-
          Assemble PackArchiveInfo from the manifest identity + entryCount + summed
          totalUncompressedBytes + the compatibility verdict.
        type: local
      - stepNumber: 8
        description: Return the PackArchiveInfo (no extraction performed).
        type: return
        outcome: success
  - name: extractPack
    narrative:
      - stepNumber: 1
        description: Did the caller omit limits?
        type: branch
        condition: limits argument omitted
        onTrueStep: 2
        onFalseStep: 3
      - stepNumber: 2
        description: Fall back to the codec's default limit profile.
        type: call
        targetComponent: pack_codec
        targetMethod: defaultLimits
      - stepNumber: 3
        label: list
        description: Enumerate archive entries without inflating (so caps run pre-decompress).
        type: call
        targetComponent: pack_archive_adapter
        targetMethod: listEntries
      - stepNumber: 4
        description: >-
          Compute the safe extraction plan under the effective limits (throws on any zip-slip /
          oversized / unsafe entry).
        type: call
        targetComponent: pack_codec
        targetMethod: planExtraction
      - stepNumber: 5
        description: Initialize an empty file list.
        type: local
      - stepNumber: 6
        description: Inflate each approved path from the plan.
        type: loop
        loopKind: forEach
        over: plan.paths
        endStep: 7
      - stepNumber: 7
        description: Inflate one approved entry.
        type: call
        targetComponent: pack_archive_adapter
        targetMethod: inflateEntry
      - stepNumber: 8
        label: inflateEnd
        description: Append { path, contents } to the file list.
        type: local
      - stepNumber: 9
        description: Read the wairon-pack.yaml text from the inflated files.
        type: local
      - stepNumber: 10
        description: Parse the envelope into the result manifest.
        type: call
        targetComponent: pack_codec
        targetMethod: parseManifest
      - stepNumber: 11
        description: >-
          Enforce integrity BEFORE writing: verify each inflated file against the envelope digests
          (throws on mismatch; no-op when the pack carries none).
        type: call
        targetComponent: pack_codec
        targetMethod: verifyIntegrity
      - stepNumber: 12
        description: Write the approved, integrity-checked files as a directory tree under destDir.
        type: call
        targetComponent: pack_archive_adapter
        targetMethod: writeTree
      - stepNumber: 13
        description: >-
          Assemble PackExtractionResult (directory=destDir, entryPath=manifest.entry, name, kind,
          entryCount=files.length).
        type: local
      - stepNumber: 14
        description: Return where the pack landed + its parsed manifest.
        type: return
        outcome: success
  - name: buildTreeArchive
    narrative:
      - stepNumber: 1
        description: Initialize an empty archive file map and an empty packed-roots list.
        type: local
      - stepNumber: 2
        description: Pack each supplied root.
        type: loop
        loopKind: forEach
        over: roots
        endStep: 5
      - stepNumber: 3
        description: Read this root's .wai directory recursively into a file map.
        type: call
        targetComponent: pack_archive_adapter
        targetMethod: readPackDir
      - stepNumber: 4
        description: >-
          Keep only portable design state, dropping regenerable artifacts unless includeDerived was
          set.
        type: call
        targetComponent: tree_codec
        targetMethod: selectTreeFiles
      - stepNumber: 5
        label: packEnd
        description: >-
          Prefix every kept file with this root's project-relative path plus '.wai/' and append it
          to the archive file map; record the root's relativePath.
        type: local
      - stepNumber: 6
        description: Did the roots yield no files at all?
        type: branch
        condition: the archive file map is empty
        onTrueStep: 7
        onFalseStep: 8
      - stepNumber: 7
        description: >-
          Refuse to produce an empty archive — an export that silently carries nothing is worse than
          a failure.
        type: throw
        error: tree export found no spec-tree files under the supplied roots
      - stepNumber: 8
        description: >-
          Build the unsealed envelope: formatVersion, projectName, the packed roots in order, the
          supplied stateId, the running wairon version and the includesDerived flag.
        type: local
      - stepNumber: 9
        description: >-
          Seal integrity (entryDigests + digest + generatedBy/generatedAt, the timestamp read here
          and passed in).
        type: call
        targetComponent: tree_codec
        targetMethod: sealTreeIntegrity
      - stepNumber: 10
        description: Serialize the sealed manifest to canonical envelope text.
        type: call
        targetComponent: tree_codec
        targetMethod: serializeTreeManifest
      - stepNumber: 11
        description: Upsert wairon-tree.yaml (the sealed envelope text) into the archive file map.
        type: local
      - stepNumber: 12
        description: Deflate the files + envelope into .waitree archive bytes.
        type: call
        targetComponent: pack_archive_adapter
        targetMethod: assembleArchive
      - stepNumber: 13
        description: Derive the suggested file name from the project name.
        type: local
      - stepNumber: 14
        description: Return the TreeBuildResult (bytes + sealed manifest + suggested name + file count).
        type: return
        outcome: success
  - name: inspectTreeArchive
    narrative:
      - stepNumber: 1
        description: Enumerate archive entries without inflating.
        type: call
        targetComponent: pack_archive_adapter
        targetMethod: listEntries
      - stepNumber: 2
        description: Is there no wairon-tree.yaml entry?
        type: branch
        condition: no entry named wairon-tree.yaml
        onTrueStep: 3
        onFalseStep: 4
      - stepNumber: 3
        description: Reject a non-.waitree archive.
        type: throw
        error: not a .waitree archive (missing wairon-tree.yaml envelope)
      - stepNumber: 4
        label: readEnv
        description: Inflate just the envelope entry.
        type: call
        targetComponent: pack_archive_adapter
        targetMethod: inflateEntry
      - stepNumber: 5
        description: Parse + version-check the envelope text.
        type: call
        targetComponent: tree_codec
        targetMethod: parseTreeManifest
      - stepNumber: 6
        description: Compute compatibility against the running wairon version.
        type: call
        targetComponent: tree_codec
        targetMethod: checkTreeCompatibility
      - stepNumber: 7
        description: >-
          Assemble TreeArchiveInfo from the manifest plus the enumerated entry count and total
          inflated size.
        type: local
      - stepNumber: 8
        description: Return the TreeArchiveInfo (no extraction performed).
        type: return
        outcome: success
  - name: extractTreeArchive
    narrative:
      - stepNumber: 1
        description: Did the caller omit limits?
        type: branch
        condition: limits is undefined
        onTrueStep: 2
        onFalseStep: 3
      - stepNumber: 2
        description: Fall back to the codec's tree limit profile.
        type: call
        targetComponent: tree_codec
        targetMethod: defaultTreeLimits
      - stepNumber: 3
        label: list
        description: Enumerate archive entries without inflating (caps run pre-decompress).
        type: call
        targetComponent: pack_archive_adapter
        targetMethod: listEntries
      - stepNumber: 4
        description: Compute the safe extraction plan (throws on any unsafe/oversized entry).
        type: call
        targetComponent: tree_codec
        targetMethod: planTreeExtraction
      - stepNumber: 5
        description: Did the caller ask for the over-the-wire portability guard?
        type: branch
        condition: refuseExecutableEntries is true
        onTrueStep: 6
        onFalseStep: 7
      - stepNumber: 6
        description: Refuse executable or non-spec-tree entries before anything is inflated.
        type: call
        targetComponent: tree_codec
        targetMethod: assertPortableTreePaths
      - stepNumber: 7
        label: inflate
        description: Initialize an empty file list.
        type: local
      - stepNumber: 8
        description: Inflate each approved path from the plan.
        type: loop
        loopKind: forEach
        over: plan.paths
        endStep: 10
      - stepNumber: 9
        description: Inflate one approved entry.
        type: call
        targetComponent: pack_archive_adapter
        targetMethod: inflateEntry
      - stepNumber: 10
        label: inflateEnd
        description: Append { path, contents } to the file list.
        type: local
      - stepNumber: 11
        description: Is the wairon-tree.yaml envelope missing from the inflated files?
        type: branch
        condition: no inflated file is named wairon-tree.yaml
        onTrueStep: 12
        onFalseStep: 13
      - stepNumber: 12
        description: Reject a non-.waitree archive.
        type: throw
        error: not a .waitree archive (missing wairon-tree.yaml envelope)
      - stepNumber: 13
        label: parse
        description: Parse the envelope into the result manifest.
        type: call
        targetComponent: tree_codec
        targetMethod: parseTreeManifest
      - stepNumber: 14
        description: >-
          Enforce integrity BEFORE writing (throws on mismatch; no-op when the archive carried
          none).
        type: call
        targetComponent: tree_codec
        targetMethod: verifyTreeIntegrity
      - stepNumber: 15
        description: >-
          Write the approved, integrity-checked files as a directory tree under the destination
          project root.
        type: call
        targetComponent: pack_archive_adapter
        targetMethod: writeTree
      - stepNumber: 16
        description: Assemble TreeExtractionResult (destination, manifest, recreated roots, written paths).
        type: local
      - stepNumber: 17
        description: Return where the tree landed + its parsed manifest.
        type: return
        outcome: success
status: complete
