id: secret_write_registry_impl
name: Secret Write Registry Implementation
description: 'Write path over the secret store''s backing file: one store update per write.'
contract: isecret_write_registry
sourcePath: src/utils/secrets.ts
methods:
  - name: write
    narrative: []
    intent: >-
      Requires the data dir (throws when unset), then in one store update sets the key in the map
      read fresh under the secret file's write lock; the full map is replaced atomically through a
      temporary sibling named for this writer (never a fixed name two writers would share). A
      corrupt secret file makes the update throw and leaves the file as it was.
    calls:
      - secret_store.update
    symbol: registryWriteSecret
status: complete
