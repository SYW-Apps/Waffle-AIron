id: spec_validator_impl
name: Spec Validator Implementation
description: >-
  The validation workflow in src/core/validation.ts; its write-gate half,
  validateComponentCandidate, lives in src/core/rules/candidate.ts.
contract: ispec_validator
sourcePath: src/core/validation.ts
simPath: tests/core/validation.test.ts
methods:
  - name: validateSddTree
    narrative:
      - stepNumber: 1
        description: Set the loader's recursion depth for the run's reads, through the core adapter
        type: call
        targetComponent: validator_core_adapter
        targetMethod: scanAllSpecs
      - stepNumber: 2
        description: >-
          Clear the loader's diagnostics and cached index through the core adapter, so the run reads
          the tree from disk
        type: call
        targetComponent: validator_core_adapter
        targetMethod: clearLoaderIssues
      - stepNumber: 3
        description: Load system spec
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadSystemSpec
      - stepNumber: 4
        description: Load subsystem specs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadSubsystemSpecs
      - stepNumber: 5
        description: Load component specs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadComponentSpecs
      - stepNumber: 6
        description: Load interface specs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadInterfaceSpecs
      - stepNumber: 7
        description: Load implementation specs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadImplementationSpecs
      - stepNumber: 8
        description: Load type specs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadTypeSpecs
      - stepNumber: 9
        description: >-
          Load the available surface snapshots via the surfaces adapter — unresolved cross-tree and
          remote adapter references resolve against them, matched by provider: a reference that
          names its producer (super::billing::invoice_portal) consults only that producer's
          snapshots, and a reference that names no producer resolves only when every snapshot
          exposing the name carries the same contract, and is SURFACE_REF_AMBIGUOUS otherwise
          (CROSS_TREE_REF_UNRESOLVED remains only for references no snapshot covers)
        type: call
        targetComponent: validator_surfaces_adapter
        targetMethod: listSnapshots
      - stepNumber: 10
        description: >-
          Load the surface snapshots each chained mount holds, keyed by mount namespace. A reference
          made from INSIDE a mount in a super::/:: form collapses to a bare id at this root, and
          resolves against the contracts that mount imported; a reference no surface covers stays
          the error it was, and the bound root's own references never consult a mount's surfaces
        type: call
        targetComponent: validator_surfaces_adapter
        targetMethod: listMountSnapshots
      - stepNumber: 11
        description: >-
          Build the source code model via the source analysis adapter — every distinct source path
          (each implementation's sourcePath, each method's own sourcePath, each simPath) resolved
          and containment-checked within the project root, analyzed at the best available grade
          (exact | pattern | generic); the Level 1 conformance rules consume it purely from the rule
          context (the surface-snapshots injection pattern)
        type: call
        targetComponent: source_analysis_adapter
        targetMethod: buildCodeModel
      - stepNumber: 12
        description: >-
          Read, through the core adapter, the spec files unchanged since the approval — the specs
          the rules are shown as complete (none when the tree was never approved, and an unreadable
          approval never breaks validation)
        type: call
        targetComponent: validator_core_adapter
        targetMethod: settledSpecPaths
      - stepNumber: 13
        description: Relate each settled file to the spec stored in it through the core adapter's spec index
        type: call
        targetComponent: validator_core_adapter
        targetMethod: scanAllSpecs
      - stepNumber: 14
        description: Integrate the loader's schema and parse diagnostics, read through the core adapter
        type: call
        targetComponent: validator_core_adapter
        targetMethod: getLoaderIssues
      - stepNumber: 15
        description: >-
          Reject a --subsystem scope that names no loaded subsystem (SUBSYSTEM_NOT_FOUND, listing
          the known subsystems) and return early
        type: local
      - stepNumber: 16
        description: >-
          Load the governing extension packs (LoadedExtensions) — pack rules, profiles, languages,
          and pattern definitions — to populate the rule context's ext for this run
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadProjectExtensions
      - stepNumber: 17
        description: >-
          Gather the round-trip findings: dry-run every in-scope spec through the writer's
          relativization and schema pipeline via the core adapter (no I/O) and keep the findings for
          the rule context, where the roundtrip-serialization rule reports them, so validate
          predicts every refusal a save or lock would raise
        type: call
        targetComponent: validator_core_adapter
        targetMethod: dryRunSerializeSpecs
      - stepNumber: 18
        description: Seed the built-in SDD conformance rule set into the in-memory rule set
        type: call
        targetComponent: rule_repository
        targetMethod: registerBuiltinRules
      - stepNumber: 19
        description: >-
          Register the loaded programmatic pack rules after the built-ins (project pack order is
          precedence)
        type: call
        targetComponent: rule_repository
        targetMethod: registerPackRules
      - stepNumber: 20
        description: Read the composed, ordered rule run sequence to execute
        type: call
        targetComponent: rule_repository
        targetMethod: ruleSequence
      - stepNumber: 21
        description: >-
          Gather the known issue codes of every registered rule and declarative assertion for the
          rule context, so the lint-allows rule validates lint.allow references against every code
          the active rules can report (UNKNOWN_LINT_ALLOW_CODE), and keep the subset the rules
          declare CARRYABLE as the closed set the conformance debt register's entries are checked
          against (UNCARRYABLE_FINDING)
        type: call
        targetComponent: rule_repository
        targetMethod: knownIssueCodes
      - stepNumber: 22
        description: >-
          Read the bound project's configuration through the core adapter for its by-name pack
          selections, which the pack-reproducibility rule checks from the rule context (legacy path
          refs pin nothing and are excluded; a project with no readable configuration selects
          nothing). The project's own rule severities and projectType are not read here: the caller
          that invokes validation supplies them.
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 23
        description: >-
          Load the component-variant registry through the core adapter, for the variant rules in the
          rule context
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadProjectVariants
      - stepNumber: 24
        description: >-
          Build the rule context from the gathered inputs: the loaded specs and their lookup maps,
          the surface snapshots, the code model, the round-trip findings, the known issue codes, the
          pack data and the lint-allow bookkeeping. Its addIssue applies the designDepth gate, then
          severity resolution (the project's sddRuleSeverity, else the governing pack profile's,
          else the draft-context downgrade, which is min(rule default, warning) and so never raises
          a notice, else the rule default), and lets a matching lint allow silence a warning or a
          notice and the conformance debt register carry one; an error is never silenced or carried
        type: local
      - stepNumber: 25
        description: For each rule in the run sequence
        type: loop
        loopKind: forEach
        over: the rule run sequence read in step 17 (built-ins, then pack rules, lint-allows last)
        endStep: 26
      - stepNumber: 26
        label: run-rule
        description: >-
          Run the rule's check against the rule context; the rule reports its findings through
          ctx.addIssue
        type: local
      - stepNumber: 27
        description: >-
          When this root still holds a reference-resolution failure no surface snapshot covers,
          detect the parent through the core adapter's reach-gated resolveChainingParent, so a
          request whose credential is narrowed to the child reads nothing above its root, not even
          to discover the parent
        type: call
        targetComponent: validator_core_adapter
        targetMethod: resolveChainingParent
      - stepNumber: 28
        description: >-
          Resolve a chained subproject's verdict through its parent. When this root still holds a
          reference-resolution failure no surface snapshot covers — an unresolved cross-tree
          reference, or a dependency, call-target, type, subsystem or trusted-link reference that
          does not resolve in this tree — detect the parent through the reach-gated
          resolveChainingParent, so a request whose credential is narrowed to the child reads
          nothing above its root, not even to discover the parent, and resolve this tree's verdict
          through it. A verdict on an edge this root can already see — a boundary crossing between
          its own subsystems, an undeclared dependency call — never triggers the walk.
        type: call
        targetComponent: spec_validator
        targetMethod: resolveThroughParent
      - stepNumber: 29
        description: >-
          Merge what the parent judged with this run's own findings: a child finding gives way only
          where the parent reported the same code on the same spec at least as severely, or where it
          is a resolution failure the parent's run did not repeat (the reference resolved from the
          parent); every other child finding stands, and a parent finding that a stricter child
          finding already covers is dropped — so the child is never judged more leniently than alone
          or than its parent. Known limitation until composed validation replaces this step: once
          the walk runs, the parent's verdicts are merged in for edges a pin also covered, so which
          evidence judges a pinned edge depends on whether some resolution failure triggered the
          walk. The result records the root and scope it was resolved through.
        type: local
      - stepNumber: 30
        description: Return the aggregated validation result
        type: return
        outcome: ValidationResult
  - name: validateRegistry
    narrative:
      - stepNumber: 1
        description: Validate agent ID uniqueness
        type: local
      - stepNumber: 2
        description: Validate per-agent properties like owned paths
        type: local
      - stepNumber: 3
        description: Check for overlapping workspace file ownerships
        type: local
  - name: validateProjectConfig
    narrative:
      - stepNumber: 1
        description: Ensure at least one output target is configured in project.yaml
        type: local
      - stepNumber: 2
        description: Verify that configured targets are enabled
        type: local
  - name: validateAsComplete
    narrative:
      - stepNumber: 1
        description: Clear loader issues
        type: local
      - stepNumber: 2
        description: Load system spec
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadSystemSpec
      - stepNumber: 3
        description: Load subsystem specs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadSubsystemSpecs
      - stepNumber: 4
        description: Load component specs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadComponentSpecs
      - stepNumber: 5
        description: Load interface specs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadInterfaceSpecs
      - stepNumber: 6
        description: Load implementation specs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadImplementationSpecs
      - stepNumber: 7
        description: Load type specs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadTypeSpecs
      - stepNumber: 8
        description: >-
          Load the available surface snapshots via the surfaces adapter, identical to
          validateSddTree
        type: call
        targetComponent: validator_surfaces_adapter
        targetMethod: listSnapshots
      - stepNumber: 9
        description: Load the surface snapshots each chained mount holds, identical to validateSddTree
        type: call
        targetComponent: validator_surfaces_adapter
        targetMethod: listMountSnapshots
      - stepNumber: 10
        description: Build the source code model via the source analysis adapter, identical to validateSddTree
        type: call
        targetComponent: source_analysis_adapter
        targetMethod: buildCodeModel
      - stepNumber: 11
        description: Gather the round-trip findings for the rule context, identical to validateSddTree
        type: call
        targetComponent: validator_core_adapter
        targetMethod: dryRunSerializeSpecs
      - stepNumber: 12
        description: Treat every spec as complete (suppress the draft severity relaxation), mutating nothing
        type: local
      - stepNumber: 13
        description: >-
          Read the bound project's configuration through the core adapter for its by-name pack
          selections, identical to validateSddTree
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 14
        description: >-
          Build the rule context and run the same rule sequence as validateSddTree at full
          strictness
        type: local
      - stepNumber: 15
        description: Return the as-complete validation result
        type: return
        outcome: as-complete ValidationResult
  - name: listRules
    narrative:
      - stepNumber: 1
        description: Load the governing extension packs so pack rules are available.
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadProjectExtensions
      - stepNumber: 2
        description: Seed the built-in SDD rule set.
        type: call
        targetComponent: rule_repository
        targetMethod: registerBuiltinRules
      - stepNumber: 3
        description: Register the loaded pack rules after the built-ins.
        type: call
        targetComponent: rule_repository
        targetMethod: registerPackRules
      - stepNumber: 4
        description: Read and return the composed, ordered rule sequence.
        type: call
        targetComponent: rule_repository
        targetMethod: ruleSequence
      - stepNumber: 5
        description: Return the active rule set.
        type: return
        outcome: rule set
    detail: calls-only
  - name: validateComponentCandidate
    sourcePath: src/core/rules/candidate.ts
    narrative:
      - stepNumber: 1
        description: Seed the built-in rules
        type: call
        targetComponent: rule_repository
        targetMethod: registerBuiltinRules
      - stepNumber: 2
        description: Do the loaded packs carry programmatic rules?
        type: branch
        condition: the loaded packs carry programmatic rules
        onFalseStep: 4
      - stepNumber: 3
        description: >-
          Register the pack rules after the built-ins, so pack-registered spec-scoped rules gate
          writes too
        type: call
        targetComponent: rule_repository
        targetMethod: registerPackRules
      - stepNumber: 4
        label: gather-codes
        description: >-
          Gather the known issue codes of the registered rules and the loaded declarative
          assertions, as validateSddTree does, so any rule reading them sees the same set
        type: call
        targetComponent: rule_repository
        targetMethod: knownIssueCodes
      - stepNumber: 5
        description: >-
          Build a rule context holding only the candidate: a stub system spec (only its
          targetLanguage is ever read, and a candidate carries none), no other specs, no round-trip
          findings, the known codes, the project's rules config and project type, and the loaded
          packs
        type: local
      - stepNumber: 6
        description: Read the spec-scoped rules in run order
        type: call
        targetComponent: rule_repository
        targetMethod: specScopedRules
      - stepNumber: 7
        description: For each spec-scoped rule
        type: loop
        loopKind: forEach
        over: the spec-scoped rules
        endStep: 8
      - stepNumber: 8
        label: run-check
        description: Run the rule's check against the candidate context
        type: local
      - stepNumber: 9
        description: >-
          Keep only findings about the candidate (no spec id, or the candidate's id), so a rule that
          misdeclares its scope cannot smuggle in a finding about another spec
        type: local
      - stepNumber: 10
        description: >-
          Return the verdict split by severity: errors refuse the write, warnings and notices ride
          along as the write's notices, each list kept apart
        type: return
        outcome: CandidateVerdict
  - name: computeGateStateId
    narrative:
      - stepNumber: 1
        description: Compute the spec tree's content identity through the core adapter
        type: call
        targetComponent: validator_core_adapter
        targetMethod: computeStateId
      - stepNumber: 2
        description: >-
          Load the governing extension packs (LoadedExtensions) — pack rules, profiles, languages,
          and pattern definitions — the doctrine the gate identity covers
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadProjectExtensions
      - stepNumber: 3
        description: >-
          Read the bound project's configuration through the core adapter for its projectType and
          rule tuning, both of which decide verdicts
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 4
        description: >-
          Take the gate config from the configuration's projectType and rules, empty when the
          project has no configuration or its configuration fails its schema: the tree identity
          still stands on its own
        type: local
      - stepNumber: 5
        description: >-
          Read the consumed contract inputs through the core adapter: this root's stored surface
          snapshots and every chained mount's, as canonical content keys
        type: call
        targetComponent: validator_core_adapter
        targetMethod: consumedContractInputs
      - stepNumber: 6
        description: Seed the built-in SDD conformance rule set into the in-memory rule set
        type: call
        targetComponent: rule_repository
        targetMethod: registerBuiltinRules
      - stepNumber: 7
        description: >-
          Read the rule sequence: the built-in rules. No pack rule is registered yet; pack rules
          enter the identity through the extensions
        type: call
        targetComponent: rule_repository
        targetMethod: ruleSequence
      - stepNumber: 8
        description: >-
          Compute the gate identity from the content identity, the extensions, the built-in rules,
          the consumed contract inputs and the gate config
        type: call
        targetComponent: gate_identity
        targetMethod: compute
      - stepNumber: 9
        description: Return the gate identity
        type: return
        outcome: StateId (the gate identity)
  - name: resolveThroughParent
    narrative:
      - stepNumber: 1
        description: >-
          Refuse to walk when the bound request's reach forbids reading above its root; otherwise
          walk up to the TOP root collecting the mount chain, one hop at a time through the core
          adapter's findChainingParent with the request's top project root as the ceiling (the walk
          itself is not reach-gated, which is why the gate comes first). With no hop reachable there
          is nothing to resolve through.
        type: call
        targetComponent: validator_core_adapter
        targetMethod: findChainingParent
      - stepNumber: 2
        description: >-
          When the walk reached a top root: with that root bound — the call runs as the parent
          project, so it returns the parent's configuration rather than this project's — read the
          parent's rule severities and projectType, whose doctrine and profile decide what is
          judged. A parent with no readable configuration judges at the defaults, tightened by this
          project's severities.
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 3
        description: >-
          Validate the top root scoped to that chain with the parent's own doctrine, for each rule
          the stricter of the parent's and this project's severity, the same as-complete strictness,
          and without resolving again. The parent's findings are renamed into the child's ids (the
          mount prefix stripped from spec ids and messages). Code↔spec conformance findings keep
          full strength: a chained child's source paths are relative to its own root. When no usable
          parent is reachable (its L0 missing, the mount unknown, or reach denied), every reference
          keeps its raw verdict — a cross-tree form stays an unwaived CROSS_TREE_REF_UNRESOLVED
          warning and a typo stays an error — so a child that cannot be judged through its parent
          pins its family surfaces or fails its gate; nothing is rewritten and no notice is
          prepended
        type: local
      - stepNumber: 4
        description: >-
          Return the top root, the mount chain it was scoped to and the renamed findings — or
          nothing when no usable parent was reachable
        type: return
        outcome: ParentResolution
  - name: findTestsReferencing
    narrative:
      - stepNumber: 1
        description: >-
          Hand the methods and the declared test roots to the source analyzer, which walks them
          under the same containment rules as the source walk
        type: call
        targetComponent: source_analysis_adapter
        targetMethod: findTestsReferencing
  - name: builtinProfileIds
    narrative:
      - stepNumber: 1
        description: Return a copy of the rule set's built-in profile ids
        type: return
        outcome: success
  - name: builtinProjectKinds
    narrative:
      - stepNumber: 1
        description: Return a copy of the rule set's built-in project kinds
        type: return
        outcome: success
lint:
  allow:
    - code: EXCESSIVE_NARRATIVE_STEPS
      reason: >-
        validateSddTree gathers every input the rule context needs before it runs a single rule, and
        since its core reads became calls on the validator's own client adapter (a module of its
        own) each one is a narrated call rather than an unnamed local: the recursion depth, the
        loader reset, six spec reads, two surface reads, the code model, the approval's settled
        files and their index, the loader diagnostics, the packs, the round-trip findings, four
        rule-repository reads, the configuration and the variant registry — 23 of its 30 steps are
        one call each, and the remaining seven are the scope refusal, the context build, the rule
        loop and the parent resolution. Folding calls into prose would hide exactly the
        cross-subsystem hops this adapter exists to make visible; the count tracks how many inputs a
        validation run has.
status: complete
