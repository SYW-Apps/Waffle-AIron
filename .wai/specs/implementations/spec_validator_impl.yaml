id: spec_validator_impl
name: Spec Validator Implementation
description: Concrete implementation of the Spec Validator Interface containing validation logic and rules.
contract: ispec_validator
sourcePath: src/core/validation.ts
methods:
  - name: validateSddTree
    narrative:
      - stepNumber: 1
        description: Clear loader issues
        type: local
      - stepNumber: 2
        description: Load system spec
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadSystemSpec
      - stepNumber: 3
        description: Load subsystem specs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadSubsystemSpecs
      - stepNumber: 4
        description: Load component specs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadComponentSpecs
      - stepNumber: 5
        description: Load interface specs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadInterfaceSpecs
      - stepNumber: 6
        description: Load implementation specs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadImplementationSpecs
      - stepNumber: 7
        description: Load type specs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadTypeSpecs
      - stepNumber: 8
        description: >-
          Load the available surface snapshots via the surfaces adapter — unresolved cross-tree and
          remote adapter references resolve against them (SURFACE_STALE warning on StateId mismatch;
          CROSS_TREE_REF_UNRESOLVED remains only for references no snapshot covers)
        type: call
        targetComponent: validator_surfaces_adapter
        targetMethod: loadSurfaceSnapshots
      - stepNumber: 9
        description: >-
          Build the source code model via the source analysis adapter — every distinct L4 sourcePath
          resolved and containment-checked within the project root, analyzed at the best available
          grade (exact | pattern | generic); the structural-conformance rules consume it purely from
          the rule context (the surface-snapshots injection pattern)
        type: call
        targetComponent: source_analysis_adapter
        targetMethod: buildCodeModel
      - stepNumber: 10
        description: Integrate Zod schema loader errors
        type: local
      - stepNumber: 11
        description: >-
          Round-trip serializability: the registered roundtrip-serialization rule dry-runs every
          in-scope spec through the writer relativization + schema pipeline via the core adapter (no
          I/O), reporting ROUNDTRIP_SERIALIZATION errors so validate predicts every write lock would
          refuse
        type: call
        targetComponent: validator_core_adapter
        targetMethod: dryRunSerializeSpecs
      - stepNumber: 12
        description: >-
          Reject a --subsystem scope that names no loaded subsystem (SUBSYSTEM_NOT_FOUND, listing
          the known subsystems) and return early; otherwise load project extensions and compose the
          active validation rule sequence
        type: local
      - stepNumber: 13
        description: >-
          Run hierarchy, namespace-hygiene, round-trip, type-reference, contract (incl. cross-tree
          ref recognition), narrative, boundary, graph, naming, documentation, complexity,
          semantic-edge rules (dispatch-table capability contracts and guarantee backing, dispatch-
          and lifecycle-rooted reachability, durability round-trip hydration with a non-flooded boot
          graph, untyped cross-subsystem seams with dispatch-table exemption, prose-claim
          realization), structural-conformance rules (sourcePaths resolve within the project root to
          real files; every contract method is realized in its file at the implementation's
          conformance tier — declared | anchored | off — honoring per-method symbol overrides, with
          analysis grade carried on findings), and dependency-conformance rules (runtime imports
          between component-mapped files must be justified by declared dependsOn/owns edges — or,
          across subsystems, by a declared edge to the target subsystem's published surface —
          UNDECLARED_DEPENDENCY; declared collaborator edges with no realizing import between
          exactly-analyzed files surface as UNREALIZED_DEPENDENCY)
        type: local
      - stepNumber: 14
        description: >-
          Chained-subproject leniency: when this root is a chained subproject of a discoverable
          parent (detected via the loader's findChainingParent), downgrade the root-dependent
          cross-tree and code↔spec resolution errors (undefined-type, invalid
          dependency/subsystem/target-component references, missing-source-file, unrealized-method,
          undeclared-dependency, and cross-tree refs) to warnings, mark them crossTreeContext, and
          prepend one CHAINED_SUBPROJECT_CONTEXT notice — full cross-tree verification runs from the
          parent root
        type: local
      - stepNumber: 15
        description: Return the aggregated validation result
        type: return
        outcome: ValidationResult
  - name: validateRegistry
    narrative:
      - stepNumber: 1
        description: Validate agent ID uniqueness
        type: local
      - stepNumber: 2
        description: Validate per-agent properties like owned paths
        type: local
      - stepNumber: 3
        description: Check for overlapping workspace file ownerships
        type: local
  - name: validateProjectConfig
    narrative:
      - stepNumber: 1
        description: Ensure at least one output target is configured in project.yaml
        type: local
      - stepNumber: 2
        description: Verify that configured targets are enabled
        type: local
  - name: validateAsComplete
    narrative:
      - stepNumber: 1
        description: Clear loader issues
        type: local
      - stepNumber: 2
        description: Load system spec
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadSystemSpec
      - stepNumber: 3
        description: Load subsystem specs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadSubsystemSpecs
      - stepNumber: 4
        description: Load component specs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadComponentSpecs
      - stepNumber: 5
        description: Load interface specs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadInterfaceSpecs
      - stepNumber: 6
        description: Load implementation specs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadImplementationSpecs
      - stepNumber: 7
        description: Load type specs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadTypeSpecs
      - stepNumber: 8
        description: >-
          Load the available surface snapshots via the surfaces adapter, identical to
          validateSddTree
        type: call
        targetComponent: validator_surfaces_adapter
        targetMethod: loadSurfaceSnapshots
      - stepNumber: 9
        description: Build the source code model via the source analysis adapter, identical to validateSddTree
        type: call
        targetComponent: source_analysis_adapter
        targetMethod: buildCodeModel
      - stepNumber: 10
        description: >-
          Round-trip serializability: the registered roundtrip-serialization rule dry-runs every
          in-scope spec through the writer pipeline via the core adapter, identical to
          validateSddTree
        type: call
        targetComponent: validator_core_adapter
        targetMethod: dryRunSerializeSpecs
      - stepNumber: 11
        description: Treat every spec as complete (suppress the draft severity relaxation), mutating nothing
        type: local
      - stepNumber: 12
        description: >-
          Run the same active rule sequence as validateSddTree at full strictness, including
          namespace-hygiene, round-trip, naming, documentation, complexity, and the semantic-edge
          rules
        type: local
      - stepNumber: 13
        description: Return the as-complete validation result
        type: return
        outcome: as-complete ValidationResult
status: complete
createdAt: '2026-06-11T14:50:00Z'
