id: spec_validator_impl
name: Spec Validator Implementation
description: >-
  The validation workflow in src/core/validation.ts; its write-gate half,
  validateComponentCandidate, lives in src/core/rules/candidate.ts.
contract: ispec_validator
sourcePath: src/core/validation.ts
simPath: tests/core/validation.test.ts
methods:
  - name: validateRegistry
    narrative:
      - stepNumber: 1
        description: Validate agent ID uniqueness
        type: local
      - stepNumber: 2
        description: Validate per-agent properties like owned paths
        type: local
      - stepNumber: 3
        description: Check for overlapping workspace file ownerships
        type: local
  - name: validateProjectConfig
    narrative:
      - stepNumber: 1
        description: Ensure at least one output target is configured in project.yaml
        type: local
      - stepNumber: 2
        description: Verify that configured targets are enabled
        type: local
  - name: validateAsComplete
    narrative:
      - stepNumber: 1
        description: Clear loader issues
        type: local
      - stepNumber: 2
        description: Load system spec
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadSystemSpec
      - stepNumber: 3
        description: Load subsystem specs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadSubsystemSpecs
      - stepNumber: 4
        description: Load component specs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadComponentSpecs
      - stepNumber: 5
        description: Load interface specs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadInterfaceSpecs
      - stepNumber: 6
        description: Load implementation specs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadImplementationSpecs
      - stepNumber: 7
        description: Load type specs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadTypeSpecs
      - stepNumber: 8
        description: >-
          Load the bound root's own foreign surface snapshots via the surfaces adapter, identical to
          validateProject
        type: call
        targetComponent: validator_surfaces_adapter
        targetMethod: listSnapshots
      - stepNumber: 9
        description: >-
          Read the bound project's pinned externals via the surfaces adapter, identical to
          validateProject — the lock gate judges cross-project references against the pins alone,
          never an ancestor
        type: call
        targetComponent: validator_surfaces_adapter
        targetMethod: listPinnedExternals
      - stepNumber: 10
        description: Build the source code model via the source analysis adapter, identical to validateProject
        type: call
        targetComponent: source_analysis_adapter
        targetMethod: buildCodeModel
      - stepNumber: 11
        description: Gather the round-trip findings for the rule context, identical to validateProject
        type: call
        targetComponent: validator_core_adapter
        targetMethod: dryRunSerializeSpecs
      - stepNumber: 12
        description: Treat every spec as complete (suppress the draft severity relaxation), mutating nothing
        type: local
      - stepNumber: 13
        description: >-
          Read the bound project's configuration through the core adapter for its by-name pack
          selections, identical to validateProject
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 14
        description: >-
          Build the rule context and run the same rule sequence as validateProject at full
          strictness — the owner's gate alone: a contained member's specs are its own lock's, never
          this one's
        type: local
      - stepNumber: 15
        description: >-
          Digest the code analyzer's doctrine: the rules of the sequence that judge code and the
          project's rules.conformance tuning
        type: call
        targetComponent: gate_identity
        targetMethod: analyzer
      - stepNumber: 16
        description: >-
          Summarize the code half into the result's `analysis`: the codes declared by the rules that
          judge code, the counts per severity among the issues carrying them, and the analyzer
          identity — the wairon version, the doctrine digest just computed, and the weakest analysis
          grade the code model applied to any file it analyzed (none when it analyzed none). Nothing
          is removed from the issues: callers other than the lock see the run unchanged, and the
          lock partitions it with ValidationResult.designOnly
        type: local
      - stepNumber: 17
        description: Return the as-complete validation result
        type: return
        outcome: as-complete ValidationResult
  - name: listRules
    narrative:
      - stepNumber: 1
        description: Load the governing extension packs so pack rules are available.
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadProjectExtensions
      - stepNumber: 2
        description: Seed the built-in SDD rule set.
        type: call
        targetComponent: rule_repository
        targetMethod: registerBuiltinRules
      - stepNumber: 3
        description: Register the loaded pack rules after the built-ins.
        type: call
        targetComponent: rule_repository
        targetMethod: registerPackRules
      - stepNumber: 4
        description: Read and return the composed, ordered rule sequence.
        type: call
        targetComponent: rule_repository
        targetMethod: ruleSequence
      - stepNumber: 5
        description: Return the active rule set.
        type: return
        outcome: rule set
    detail: calls-only
  - name: validateComponentCandidate
    sourcePath: src/core/rules/candidate.ts
    narrative:
      - stepNumber: 1
        description: Seed the built-in rules
        type: call
        targetComponent: rule_repository
        targetMethod: registerBuiltinRules
      - stepNumber: 2
        description: Do the loaded packs carry programmatic rules?
        type: branch
        condition: the loaded packs carry programmatic rules
        onFalseStep: 4
      - stepNumber: 3
        description: >-
          Register the pack rules after the built-ins, so pack-registered spec-scoped rules gate
          writes too
        type: call
        targetComponent: rule_repository
        targetMethod: registerPackRules
      - stepNumber: 4
        label: gather-codes
        description: >-
          Gather the known issue codes of the registered rules and the loaded declarative
          assertions, as validateSddTree does, so any rule reading them sees the same set
        type: call
        targetComponent: rule_repository
        targetMethod: knownIssueCodes
      - stepNumber: 5
        description: >-
          Build a rule context holding only the candidate: a stub system spec (only its
          targetLanguage is ever read, and a candidate carries none), no other specs, no round-trip
          findings, the known codes, the project's rules config and project type, and the loaded
          packs
        type: local
      - stepNumber: 6
        description: Read the spec-scoped rules in run order
        type: call
        targetComponent: rule_repository
        targetMethod: specScopedRules
      - stepNumber: 7
        description: For each spec-scoped rule
        type: loop
        loopKind: forEach
        over: the spec-scoped rules
        endStep: 8
      - stepNumber: 8
        label: run-check
        description: Run the rule's check against the candidate context
        type: local
      - stepNumber: 9
        description: >-
          Keep only findings about the candidate (no spec id, or the candidate's id), so a rule that
          misdeclares its scope cannot smuggle in a finding about another spec
        type: local
      - stepNumber: 10
        description: >-
          Return the verdict split by severity: errors refuse the write, warnings and notices ride
          along as the write's notices, each list kept apart
        type: return
        outcome: CandidateVerdict
  - name: computeGateStateId
    narrative:
      - stepNumber: 1
        description: >-
          Compute the DESIGN identity of the bound project's OWN specs through the core adapter —
          code linkage and timestamps left out, its parts' specs included (stage 8: a part is the
          project's own subsystems, wherever stored), never a project member's, whose subject stands
          for it below
        type: call
        targetComponent: validator_core_adapter
        targetMethod: computeOwnDesignId
      - stepNumber: 2
        description: >-
          Load the governing extension packs (LoadedExtensions) — pack rules, profiles, languages,
          and pattern definitions — the doctrine the gate identity covers
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadProjectExtensions
      - stepNumber: 3
        description: >-
          Read the bound project's configuration through the core adapter for its projectType, rule
          tuning and composition block
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 4
        description: >-
          Take the gate config from the configuration's projectType, rules, composition and network
          declaration, empty when the project has no configuration or its configuration fails its
          schema: the tree identity still stands on its own
        type: local
      - stepNumber: 5
        description: >-
          Read the bound root's own consumed contract inputs through the core adapter: its stored
          surface snapshots, pinned external snapshots and externals lock, as canonical content keys
          — never a member's, never an ancestor's
        type: call
        targetComponent: validator_core_adapter
        targetMethod: consumedContractInputs
      - stepNumber: 6
        description: >-
          Read the project graph for the PROJECT members the bound root declares DIRECTLY —
          contained ones, referenced `../` and git ones (opened at their sibling checkout or the
          fetch cache at the pinned commit) and, for one release, legacy mounts — each with its
          alias and directory. A referenced `hosted:` member is not read here: only the hosting
          server can resolve it, so it would make the identity differ locally and hosted; it is
          covered through its pin in the bound project's externals lock, which is a consumed
          contract input of the identity, never its live subject. Parts are not read here: their
          content is already in the own identity. Deeper members are not read: they reach this
          identity through each direct member's subject
        type: call
        targetComponent: validator_core_adapter
        targetMethod: projectFamily
      - stepNumber: 7
        description: For each direct member
        type: loop
        loopKind: forEach
        over: the bound root's direct members
        endStep: 9
      - stepNumber: 8
        description: >-
          Read the member's own lock record from its directory — one small file, no scan, no
          validation
        type: call
        targetComponent: validator_core_adapter
        targetMethod: approvalRecord
      - stepNumber: 9
        description: >-
          Its composition subject is that record's stateId, rendered `<algorithm>:<digest>` — the
          member's gate identity at ITS lock time, the decision its owner made; `never` when the
          member carries no record or has no project on disk. Recorded, not recomputed: the member's
          live edits are the member's to re-approve, and recomputing here would load the member's
          tree into every parent identity
        type: local
      - stepNumber: 10
        description: Seed the built-in SDD rule set into the in-memory rule set
        type: call
        targetComponent: rule_repository
        targetMethod: registerBuiltinRules
      - stepNumber: 11
        description: >-
          Read the rule sequence: the built-in rules (gate_identity.compute keeps only those that
          judge design). No pack rule is registered yet; pack rules enter the identity through the
          extensions
        type: call
        targetComponent: rule_repository
        targetMethod: ruleSequence
      - stepNumber: 12
        description: >-
          Compute the gate identity from the own content identity, the extensions, the built-in
          rules, the own consumed contract inputs, the gate config and the members' subjects
        type: call
        targetComponent: gate_identity
        targetMethod: compute
      - stepNumber: 13
        label: readOwnRecord
        description: Read the bound project's own lock record, to know which gate algorithm it was taken under
        type: call
        targetComponent: validator_core_adapter
        targetMethod: approvalRecord
      - stepNumber: 14
        description: >-
          Was it taken under the previous, full-content gate algorithm
          (`sha256+content+doctrine+inputs+members`, a format-2 record)? Then it must be judged as
          it was taken, never forced into a re-lock of an unchanged design
        type: branch
        condition: the record exists and its stateId.algorithm is the full-content gate algorithm
        onFalseStep: 17
      - stepNumber: 15
        description: >-
          Compute the full-content identity of the own specs (code linkage included), the content
          reading that record was taken in
        type: call
        targetComponent: validator_core_adapter
        targetMethod: computeOwnStateId
      - stepNumber: 16
        description: >-
          Recompute the gate identity from that full-content identity and the SAME doctrine, inputs,
          gate config and members' subjects — gate_identity.compute marks it with the previous
          algorithm because its content is a full-content identity — and carry it as the answer's
          asRecorded
        type: call
        targetComponent: gate_identity
        targetMethod: compute
      - stepNumber: 17
        label: answer
        description: Return the gate identity, with asRecorded when the record on disk is a format-2 one
        type: return
        outcome: StateId (the gate identity)
  - name: findTestsReferencing
    narrative:
      - stepNumber: 1
        description: >-
          Hand the methods and the declared test roots to the source analyzer, which walks them
          under the same containment rules as the source walk
        type: call
        targetComponent: source_analysis_adapter
        targetMethod: findTestsReferencing
  - name: builtinProfileIds
    narrative:
      - stepNumber: 1
        description: Return a copy of the rule set's built-in profile ids
        type: return
        outcome: success
  - name: builtinProjectKinds
    narrative:
      - stepNumber: 1
        description: Return a copy of the rule set's built-in project kinds
        type: return
        outcome: success
  - name: validateProject
    narrative:
      - stepNumber: 1
        description: >-
          Set the loader's recursion depth through the core adapter: the scan reads the bound
          project and the members it contains, because the project's own references into a contained
          member are judged against that member's L0 table. Nothing above the bound root is read
        type: call
        targetComponent: validator_core_adapter
        targetMethod: scanAllSpecs
      - stepNumber: 2
        description: >-
          Clear the loader's diagnostics and cached index through the core adapter, so the run reads
          the tree from disk
        type: call
        targetComponent: validator_core_adapter
        targetMethod: clearLoaderIssues
      - stepNumber: 3
        description: >-
          Read the bound root's configuration through the core adapter, to know whether it is a
          project or a part (stage 8)
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 4
        description: >-
          Is the bound root a non-contained part opened alone? (A contained part has no
          configuration; opening its directory resolves to the parent's root)
        type: branch
        condition: the configuration is a part's (ProjectConfig.isPart)
        onFalseStep: 14
      - stepNumber: 5
        description: >-
          Read the part's pinned parent — its lock's parent entry and the excerpt it names — from
          the part's own files; the parent's live tree is never read, so the verdict is the same
          with or without the parent on disk
        type: call
        targetComponent: validator_surfaces_adapter
        targetMethod: pinnedParent
      - stepNumber: 6
        description: Is there a pinned parent to judge against?
        type: branch
        condition: an excerpt is pinned and readable
        onFalseStep: 12
      - stepNumber: 7
        label: part-signature-facts
        description: >-
          Read what the part's own scan's signature resolution recorded through the core adapter:
          the restatements and stale texts only the stored form shows, which are the part's own
        type: call
        targetComponent: validator_core_adapter
        targetMethod: signatureFacts
      - stepNumber: 8
        label: part-type-spellings
        description: >-
          Read what the part's own scan's type canonicalisation recorded through the core adapter:
          the part's own stored aliases and non-canonical positions (the excerpt's are the parent's,
          judged by the parent's gate)
        type: call
        targetComponent: validator_core_adapter
        targetMethod: typeSpellingFacts
      - stepNumber: 9
        label: part-signatures
        description: >-
          Resolve the signatures of the part's own specs together with the excerpt's through the
          core adapter: the excerpt's documents are stored forms whose sourced methods carry no
          params of their own, and a part's own method may take its signature from a parent's, which
          the part's scan alone could not bind. The resolved specs are the ones the rules read; the
          run's signature facts are this resolution's source facts on the part's own methods (other
          than the restatements, which the stored form alone shows) together with the part's own
          restated facts and stale texts read in the step before
        type: call
        targetComponent: validator_core_adapter
        targetMethod: resolveSignatures
      - stepNumber: 10
        label: alone
        description: >-
          Judge the part alone against the pin: its own specs are the specs judged; the excerpt's
          specs join the rule context as read-only context (findings on them are dropped — they are
          the parent's to judge); the governing configuration is the excerpt's projectType, rules
          and pack selections, each pack loaded at its pinned version and digest (one that cannot be
          is EXTERNAL_CHECK_UNAVAILABLE, never judged by whatever version the machine holds). The
          rules run exactly as below, except those flagged needsWholeTree (SddRule.needsWholeTree:
          their verdict needs specs the excerpt does not carry), which are skipped and named; a
          reference into the parent the excerpt does not carry is EXTERNAL_CHECK_UNAVAILABLE (used
          since the pin: re-pin), never a pass. Add PART_JUDGED_ALONE (notice) naming the parent,
          the pin's digest and the skipped rules: the full verdict is always the parent's
        type: local
      - stepNumber: 11
        description: Return the part's verdict — the same with or without its parent on disk
        type: return
        outcome: the part's verdict against its pin
      - stepNumber: 12
        label: unpinned
        description: >-
          Nothing to judge against: report PART_UNPINNED (warning) "part of <parent>; validate from
          the parent" — with the hint that `wairon externals pin` here, with the parent on disk,
          pins it — and judge nothing else: a part's specs are its parent's subsystems, and they
          mean nothing without it
        type: local
      - stepNumber: 13
        description: Return the one finding
        type: return
        outcome: PART_UNPINNED only
      - stepNumber: 14
        label: project
        description: Load system spec
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadSystemSpec
      - stepNumber: 15
        description: Load subsystem specs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadSubsystemSpecs
      - stepNumber: 16
        description: Load component specs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadComponentSpecs
      - stepNumber: 17
        description: Load interface specs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadInterfaceSpecs
      - stepNumber: 18
        description: Load implementation specs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadImplementationSpecs
      - stepNumber: 19
        description: Load type specs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadTypeSpecs
      - stepNumber: 20
        description: >-
          Load the bound root's own foreign surface snapshots (exchanged or authored imports) via
          the surfaces adapter — what a reference into a foreign provider is checked against. No
          member's snapshots are read: the mount-pool lookup is retired with resolve-through-parent
        type: call
        targetComponent: validator_surfaces_adapter
        targetMethod: listSnapshots
      - stepNumber: 21
        label: pins
        description: >-
          Read the bound project's pinned externals via the surfaces adapter — each declared alias
          with its lock entry and the snapshot it names, from the project's own
          .wai/externals.lock.yaml and .wai/externals/ only. A reference into a project outside the
          scan is judged against these and nothing else: the producer is never read here, so the
          verdict is the same with or without the family on disk
        type: call
        targetComponent: validator_surfaces_adapter
        targetMethod: listPinnedExternals
      - stepNumber: 22
        description: >-
          Build the source code model via the source analysis adapter — every distinct source path
          of the bound project's own implementations (a contained member's paths are relative to its
          root and are its own gate's) resolved and containment-checked within the project root,
          analyzed at the best available grade
        type: call
        targetComponent: source_analysis_adapter
        targetMethod: buildCodeModel
      - stepNumber: 23
        description: >-
          Read, through the core adapter, the spec files unchanged since the approval — the specs
          the rules are shown as complete (none when the tree was never approved, and an unreadable
          approval never breaks validation)
        type: call
        targetComponent: validator_core_adapter
        targetMethod: settledSpecPaths
      - stepNumber: 24
        description: Relate each settled file to the spec stored in it through the core adapter's spec index
        type: call
        targetComponent: validator_core_adapter
        targetMethod: scanAllSpecs
      - stepNumber: 25
        description: >-
          Integrate the loader's schema and parse diagnostics, read through the core adapter — only
          those on the bound project's own files: a diagnostic on a contained member's file is that
          member's gate's
        type: call
        targetComponent: validator_core_adapter
        targetMethod: getLoaderIssues
      - stepNumber: 26
        description: >-
          Reject a --subsystem scope that names no loaded subsystem (SUBSYSTEM_NOT_FOUND, listing
          the known subsystems) and return early
        type: local
      - stepNumber: 27
        description: >-
          Load the governing extension packs (LoadedExtensions) — pack rules, profiles, languages,
          and pattern definitions — to populate the rule context's ext for this run
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadProjectExtensions
      - stepNumber: 28
        description: >-
          Gather the round-trip findings: dry-run every in-scope spec through the writer's
          relativization and schema pipeline via the core adapter (no I/O) and keep the findings for
          the rule context, where the roundtrip-serialization rule reports them
        type: call
        targetComponent: validator_core_adapter
        targetMethod: dryRunSerializeSpecs
      - stepNumber: 29
        description: Seed the built-in SDD conformance rule set into the in-memory rule set
        type: call
        targetComponent: rule_repository
        targetMethod: registerBuiltinRules
      - stepNumber: 30
        description: >-
          Register the loaded programmatic pack rules after the built-ins (project pack order is
          precedence)
        type: call
        targetComponent: rule_repository
        targetMethod: registerPackRules
      - stepNumber: 31
        description: Read the composed, ordered rule run sequence to execute
        type: call
        targetComponent: rule_repository
        targetMethod: ruleSequence
      - stepNumber: 32
        description: >-
          Gather the known issue codes of every registered rule and declarative assertion for the
          lint-allows audit, with each code's default severity (so the audit can tell an allow
          naming an error from a stale one), and the subset the rules declare CARRYABLE for the
          conformance debt register
        type: call
        targetComponent: rule_repository
        targetMethod: knownIssueCodes
      - stepNumber: 33
        description: >-
          Read the bound project's configuration through the core adapter for its by-name pack
          selections and its identity; its rule severities and projectType are supplied by the
          caller
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 34
        description: >-
          Read the bound root's lock record through the core adapter for the project id it recorded;
          an unlocked root, or a record written before project ids existed, records none
        type: call
        targetComponent: validator_core_adapter
        targetMethod: readLockRecord
      - stepNumber: 35
        description: >-
          Resolve the project's identity with project_config.identity(the lock's projectId) — the
          effective id, where it came from, and its problems (defaulted, ambiguous, changed) — for
          the project-identity rule. A root with no readable configuration carries no identity
        type: local
      - stepNumber: 36
        description: >-
          Load the component-variant registry through the core adapter, for the variant rules in the
          rule context
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadProjectVariants
      - stepNumber: 37
        description: For each loaded subsystem
        type: loop
        loopKind: forEach
        over: the loaded subsystems
        endStep: 38
      - stepNumber: 38
        label: subsystem-exports
        description: >-
          Read the subsystem's resolved export table through the core adapter — the resolver's
          problems are the export-tables rule's facts
        type: call
        targetComponent: validator_core_adapter
        targetMethod: resolveSubsystemExports
      - stepNumber: 39
        description: Read the project's resolved L0 export table through the core adapter
        type: call
        targetComponent: validator_core_adapter
        targetMethod: resolveProjectExports
      - stepNumber: 40
        label: project-family
        description: >-
          Read the project graph of this scan through the core adapter: the bound project and the
          members it contains, the owner of every spec, the cross-project references with how the
          scan bound each (local, exported, unexported, undeclared, outside, unresolved), and the
          identity problems. It is the bound project's own graph from every root: nothing above the
          bound root is in it
        type: call
        targetComponent: validator_core_adapter
        targetMethod: projectFamily
      - stepNumber: 41
        description: For each contained member
        type: loop
        loopKind: forEach
        over: the graph's nodes other than the bound root
        endStep: 42
      - stepNumber: 42
        label: member-exports
        description: >-
          Read the member's resolved L0 export table through the core adapter: its public names are
          what the bound project's references into it land on (a widening re-export among its
          problems is the export-tables rule's fact)
        type: call
        targetComponent: validator_core_adapter
        targetMethod: resolveProjectExports
      - stepNumber: 43
        description: >-
          For each pair of projects the graph's cross-project references connect whose consumer is
          the bound project
        type: loop
        loopKind: forEach
        over: the distinct (bound project, producer) pairs of the graph's cross-project references
        endStep: 44
      - stepNumber: 44
        label: pair-usage
        description: >-
          Map the bound project's references into the producer onto the producer's public names
          through the core adapter — the unexported ones resolve as missing
        type: call
        targetComponent: validator_core_adapter
        targetMethod: exportUsage
      - stepNumber: 45
        label: signature-facts
        description: >-
          Read what the scan's signature resolution recorded through the core adapter: the sources
          it met and the stored texts their params contradict — the loaded specs are already
          resolved, so the stored form is visible only here
        type: call
        targetComponent: validator_core_adapter
        targetMethod: signatureFacts
      - stepNumber: 46
        label: type-spelling-facts
        description: >-
          Read what the scan's type canonicalisation recorded through the core adapter: the stored
          positions that are aliases and the ones that are not canonical — the loaded specs already
          hold canonical text, so the stored spellings are visible only here
        type: call
        targetComponent: validator_core_adapter
        targetMethod: typeSpellingFacts
      - stepNumber: 47
        description: >-
          Build the rule context from the gathered inputs: the loaded specs and their lookup maps,
          the signature facts, the type-spelling facts, the foreign surface snapshots, the pinned
          externals, the code model, the round-trip findings, the known issue codes, the pack data
          (the by-name pack selections from the options when a dry run supplies them, else the
          stored configuration's; and the bound project's OWN composition.requirePolicies, for the
          pack-requirements rule to check their syntax), the project identity, the export tables,
          the project graph and the export usages, and the lint-allow bookkeeping. Its
          resolveCrossProject decides every cross-project reference's outcome before any severity;
          its addIssue drops a finding on a spec a contained member owns, then applies the
          designDepth gate, severity resolution (the project's sddRuleSeverity, else the governing
          pack profile's, else the draft-context downgrade, else the rule default), a matching lint
          allow or debt-register entry (an error is never silenced or carried), and attaches the
          reference resolution a cross-project finding carries. A parent's composition block is
          never read here: a parent's requirements do not reach any member's own gate, and whether
          members adopt this project's requirements is the family run's question
        type: local
      - stepNumber: 48
        description: For each rule in the run sequence
        type: loop
        loopKind: forEach
        over: the rule run sequence read in step 20 (built-ins, then pack rules, lint-allows last)
        endStep: 49
      - stepNumber: 49
        label: run-rule
        description: >-
          Run the rule's check against the rule context; the rule reports its findings through
          ctx.addIssue
        type: local
      - stepNumber: 50
        label: hint
        description: Does the project declare externals?
        type: branch
        condition: the pinned externals read in step 10 are not empty
        onFalseStep: 52
      - stepNumber: 51
        description: >-
          Add the one-line hint to the result: its externals were judged against their pins alone,
          and `validate --family` composes them against their live producers. A hint, not a finding:
          it never changes the verdict
        type: local
      - stepNumber: 52
        label: done
        description: Return the project's verdict — the same from every root
        type: return
        outcome: ValidationResult
  - name: reachModel
    narrative:
      - stepNumber: 1
        description: 'Read the bound project''s configuration: its network declaration, when it makes one'
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 2
        description: >-
          Build the rule context exactly as validateProject builds it (the same loads, scope and
          scan), running no rule
        type: local
      - stepNumber: 3
        description: Project the project's own reach model from it
        type: call
        targetComponent: reach_model_projector
        targetMethod: project
      - stepNumber: 4
        description: Answer it
        type: return
        outcome: the project's own reach model
lint:
  allow:
    - code: EXCESSIVE_NARRATIVE_STEPS
      reason: >-
        validateProject gathers every input the rule context needs before it runs a single rule, and
        each core or surfaces read is a narrated call on the validator's own client adapters rather
        than an unnamed local: the recursion depth, the loader reset, six spec reads, the foreign
        snapshots and the pins, the code model, the approval's settled files and their index, the
        loader diagnostics, the packs, the round-trip findings, four rule-repository reads, the
        configuration, the lock record, the variant registry, the export tables, the project graph
        and the export usages. Folding calls into prose would hide exactly the cross-subsystem hops
        those adapters exist to make visible; the count tracks how many inputs a project's own gate
        has, and stage 4 removed the parent walk rather than adding to it.
