id: spec_validator_impl
name: Spec Validator Implementation
description: Concrete implementation of the Spec Validator Interface containing validation logic and rules.
contract: ispec_validator
sourcePath: src/core/validation.ts
simPath: tests/core/validation.test.ts
methods:
  - name: validateSddTree
    narrative:
      - stepNumber: 1
        description: Clear loader issues
        type: local
      - stepNumber: 2
        description: Load system spec
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadSystemSpec
      - stepNumber: 3
        description: Load subsystem specs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadSubsystemSpecs
      - stepNumber: 4
        description: Load component specs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadComponentSpecs
      - stepNumber: 5
        description: Load interface specs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadInterfaceSpecs
      - stepNumber: 6
        description: Load implementation specs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadImplementationSpecs
      - stepNumber: 7
        description: Load type specs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadTypeSpecs
      - stepNumber: 8
        description: >-
          Load the available surface snapshots via the surfaces adapter — unresolved cross-tree and
          remote adapter references resolve against them (SURFACE_STALE warning on StateId mismatch;
          CROSS_TREE_REF_UNRESOLVED remains only for references no snapshot covers)
        type: call
        targetComponent: validator_surfaces_adapter
        targetMethod: loadSurfaceSnapshots
      - stepNumber: 9
        description: >-
          Load the surface snapshots each chained mount holds, keyed by mount namespace. A reference
          made from INSIDE a mount in a super::/:: form collapses to a bare id at this root, and
          resolves against the contracts that mount imported; a reference no surface covers stays
          the error it was, and the bound root's own references never consult a mount's surfaces
        type: call
        targetComponent: validator_surfaces_adapter
        targetMethod: loadMountSurfaceSnapshots
      - stepNumber: 10
        description: >-
          Build the source code model via the source analysis adapter — every distinct L4 sourcePath
          resolved and containment-checked within the project root, analyzed at the best available
          grade (exact | pattern | generic); the structural-conformance rules consume it purely from
          the rule context (the surface-snapshots injection pattern)
        type: call
        targetComponent: source_analysis_adapter
        targetMethod: buildCodeModel
      - stepNumber: 11
        description: Integrate Zod schema loader errors
        type: local
      - stepNumber: 12
        description: >-
          Round-trip serializability: the registered roundtrip-serialization rule dry-runs every
          in-scope spec through the writer relativization + schema pipeline via the core adapter (no
          I/O), reporting ROUNDTRIP_SERIALIZATION errors so validate predicts every write lock would
          refuse
        type: call
        targetComponent: validator_core_adapter
        targetMethod: dryRunSerializeSpecs
      - stepNumber: 13
        description: >-
          Reject a --subsystem scope that names no loaded subsystem (SUBSYSTEM_NOT_FOUND, listing
          the known subsystems) and return early
        type: local
      - stepNumber: 14
        description: >-
          Load the governing extension packs (LoadedExtensions) — pack rules, profiles, languages,
          and pattern definitions — to populate the rule context's ext for this run
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadProjectExtensions
      - stepNumber: 15
        description: Seed the built-in SDD conformance rule set into the in-memory rule set
        type: call
        targetComponent: rule_repository
        targetMethod: registerBuiltinRules
      - stepNumber: 16
        description: >-
          Register the loaded programmatic pack rules after the built-ins (project pack order is
          precedence)
        type: call
        targetComponent: rule_repository
        targetMethod: registerPackRules
      - stepNumber: 17
        description: Read the composed, ordered rule run sequence to execute
        type: call
        targetComponent: rule_repository
        targetMethod: ruleSequence
      - stepNumber: 18
        description: >-
          Read the aggregate known-issue-code set into the rule context, so lint.allow references
          are validated against every code the active rules can emit (UNKNOWN_LINT_ALLOW_CODE)
        type: call
        targetComponent: rule_repository
        targetMethod: knownIssueCodes
      - stepNumber: 19
        description: >-
          Run hierarchy, namespace-hygiene, round-trip, type-reference, contract (incl. cross-tree
          ref recognition), narrative, boundary, graph, naming, documentation, complexity,
          semantic-edge rules (dispatch-table capability contracts and guarantee backing, dispatch-,
          lifecycle-, and declared-invocation-rooted reachability — lifecycle roots spanning
          init/shutdown plus the cyclic/interrupt/scheduled execution models, invokedBy-declared L3
          methods seeded as entrypoints with mandatory caller prose (INVOKED_BY_UNDESCRIBED when
          missing) and flagged stale when the internal walk reaches them anyway
          (INVOKED_BY_REDUNDANT — remove the declaration, the edge is modeled now), and register
          steps traversed as deferred-invocation handoff edges so a registered callback method is
          reached wherever its registering narrative is — durability round-trip hydration with a
          non-flooded boot graph and the four-mode durability axis required on every Store, untyped
          cross-subsystem seams with dispatch-table exemption, prose-claim realization), invariant
          backing (a declared entity invariant — type.invariants, anchored via componentClass — must
          be asserted by a narrative step on every write-effect method of the owning component:
          UNASSERTED_INVARIANT / INVARIANT_UNANCHORED warnings, declarations checked while
          enforcement is never proven; dangling assertsInvariants references are
          UNKNOWN_INVARIANT_REF errors), event topology (declared emits/subscribesTo bindings plus
          MessageBus endpoint directions must pair by topic — every emitted topic has a subscriber
          and every subscription a source: UNCONSUMED_TOPIC / UNSOURCED_SUBSCRIPTION warnings,
          silent on trees declaring no event edges), narrative antipatterns (a step-graph cycle with
          no exit edge and no return/throw member is a provable non-terminating loop —
          INESCAPABLE_CYCLE; a branch or switch whose arms all target the same step decides nothing
          — MEANINGLESS_BRANCH; a method-level call cycle across components in which every call edge
          is unavoidable on all entry-to-exit paths of its narrative is provable unbounded recursion
          — UNCONDITIONAL_CALL_CYCLE, dispatch steps resolved through their portal tables; prose
          loop conditions are never judged — only structural inescapability is claimed), facade
          forwarding (a Repository/Gateway facade method whose authored narrative is anything other
          than exactly one call step targeting an owned member contains logic that belongs inside a
          member block — FACADE_FORWARDING warning, the standard's mechanically-enforced 1:1 facade
          rule), narrative detail-sufficiency (a method whose realized function's measured
          cyclomatic complexity exceeds the configured threshold while its spec sits below detail:
          full with no narrative — UNNARRATED_COMPLEXITY, emitted from exact-grade analysis only so
          weaker grades never guess; an explicit detail declaration below a full-floor logic
          stereotype with no narrative — DETAIL_BELOW_STEREOTYPE; both honest lints about UNDECLARED
          behavior, not proofs, and both lint.allow-suppressible), structural-conformance rules
          (sourcePaths resolve within the project root to real files; every contract method is
          realized in its file at the implementation's conformance tier — declared | anchored | off
          — honoring per-method symbol overrides, with analysis grade carried on findings),
          call-step realization (Level 3 opener: each narrative call step of an exactly-analyzed,
          non-off method must appear as a callee of the realized function — set membership over
          direct callees closed transitively through same-file named helpers, honoring the target
          method's symbol override and N:1 identity forwarding; CALL_STEP_UNREALIZED warning, order
          and arguments deliberately unverified; register handoff steps exempt, since a registration
          references the callback rather than invoking it), dependency-conformance rules (runtime
          imports between component-mapped files must be justified by declared dependsOn/owns edges
          — or, across subsystems, by a declared edge to the target subsystem's published surface —
          UNDECLARED_DEPENDENCY; declared collaborator edges with no realizing import between
          exactly-analyzed files surface as UNREALIZED_DEPENDENCY), integration-conformance rules (a
          committed L4 simPath harness must exist inside the project root — SIM_FILE_MISSING — and
          its exact-grade import graph must reach the component's own sourcePath module and each
          direct dependency's module, any module of the target subsystem for cross-subsystem edges,
          technology-boundary fakes sanctioned — UNWIRED_INTEGRATION_SIM; declaring the first
          simPath in a subsystem activates MISSING_INTEGRATION_SIM for its other complete non-leaf
          implementations; wiring proven, execution stays CI's job; a harness may additionally claim
          per-component path coverage via sim:<component>.<method>[:<label>] string anchors — once
          opted in, every narrated method's happy anchor and every labeled throw path's anchor are
          expected: SIM_PATH_UNCOVERED), the declarative-assertion rule (pack-instantiated instances
          of the closed assertion kinds — forbid-edge, require-field over top-level and ext.*
          fields, endpoint-shape transport and address patterns — evaluated with the pack's
          namespaced <PACK>_<CODE> finding codes, declared severities, and stated reasons: the
          hosted-safe doctrine channel), the pattern-reference rule (a component's patterns[] must
          each resolve to a loaded pack PatternDef — UNKNOWN_PATTERN_REF — with a version-mismatch
          warning), and the guarantee-token rule (the guarantee vocabulary is open: every token an
          L3 method declares or a narrative step asserts must be a builtin guarantee or one a loaded
          pack declares in its guarantees list — UNKNOWN_GUARANTEE warning, because a token nobody
          declares can never be backed by the consistency checks), every finding first passing the
          designDepth gate (expectation codes below the subsystem's or project's declared design
          depth are skipped; soundness of authored content always applies) and severity resolution
          (explicit project sddRuleSeverity, else the governing pack profile's, else draft-context
          downgrade, else the rule default), each rule's check running against the shared rule
          context
        type: local
      - stepNumber: 20
        description: >-
          Chained-subproject reference honesty: when this root is a chained subproject of a
          discoverable parent (detected via the loader's findChainingParent), cross-tree references
          COVERED by a vendored surface snapshot validate at FULL strength — contract mismatches and
          boundary violations stay errors, because a snapshot IS the verifiable contract — while
          each cross-tree reference NO snapshot covers is reported as ONE precise
          UNVERIFIED_EXTERNAL_REF warning replacing the former blanket downgrade of the
          reference-resolution family (undefined-type, invalid dependency/subsystem/target-component
          references, undeclared-dependency-call, unresolved cross-tree refs), marked
          crossTreeContext (--ci waives it) and naming the unverifiable reference plus the remedy
          (re-lock the parent so fresh family/sibling snapshots ship, or inspect via
          list-external-interfaces). The code↔spec conformance family (missing-source-file,
          unrealized-method, undeclared-dependency and kin) KEEPS the crossTreeContext downgrade —
          source paths stored relative to the parent root genuinely cannot resolve standalone. One
          CHAINED_SUBPROJECT_CONTEXT notice is prepended, counting the unverified references — full
          cross-tree verification runs from the parent root
        type: local
      - stepNumber: 21
        description: Return the aggregated validation result
        type: return
        outcome: ValidationResult
  - name: validateRegistry
    narrative:
      - stepNumber: 1
        description: Validate agent ID uniqueness
        type: local
      - stepNumber: 2
        description: Validate per-agent properties like owned paths
        type: local
      - stepNumber: 3
        description: Check for overlapping workspace file ownerships
        type: local
  - name: validateProjectConfig
    narrative:
      - stepNumber: 1
        description: Ensure at least one output target is configured in project.yaml
        type: local
      - stepNumber: 2
        description: Verify that configured targets are enabled
        type: local
  - name: validateAsComplete
    narrative:
      - stepNumber: 1
        description: Clear loader issues
        type: local
      - stepNumber: 2
        description: Load system spec
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadSystemSpec
      - stepNumber: 3
        description: Load subsystem specs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadSubsystemSpecs
      - stepNumber: 4
        description: Load component specs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadComponentSpecs
      - stepNumber: 5
        description: Load interface specs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadInterfaceSpecs
      - stepNumber: 6
        description: Load implementation specs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadImplementationSpecs
      - stepNumber: 7
        description: Load type specs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadTypeSpecs
      - stepNumber: 8
        description: >-
          Load the available surface snapshots via the surfaces adapter, identical to
          validateSddTree
        type: call
        targetComponent: validator_surfaces_adapter
        targetMethod: loadSurfaceSnapshots
      - stepNumber: 9
        description: Load the surface snapshots each chained mount holds, identical to validateSddTree
        type: call
        targetComponent: validator_surfaces_adapter
        targetMethod: loadMountSurfaceSnapshots
      - stepNumber: 10
        description: Build the source code model via the source analysis adapter, identical to validateSddTree
        type: call
        targetComponent: source_analysis_adapter
        targetMethod: buildCodeModel
      - stepNumber: 11
        description: >-
          Round-trip serializability: the registered roundtrip-serialization rule dry-runs every
          in-scope spec through the writer pipeline via the core adapter, identical to
          validateSddTree
        type: call
        targetComponent: validator_core_adapter
        targetMethod: dryRunSerializeSpecs
      - stepNumber: 12
        description: Treat every spec as complete (suppress the draft severity relaxation), mutating nothing
        type: local
      - stepNumber: 13
        description: >-
          Run the same active rule sequence as validateSddTree at full strictness, including
          namespace-hygiene, round-trip, naming, documentation, complexity, and the semantic-edge
          rules
        type: local
      - stepNumber: 14
        description: Return the as-complete validation result
        type: return
        outcome: as-complete ValidationResult
  - name: listRules
    narrative:
      - stepNumber: 1
        description: Load the governing extension packs so pack rules are available.
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadProjectExtensions
      - stepNumber: 2
        description: Seed the built-in SDD rule set.
        type: call
        targetComponent: rule_repository
        targetMethod: registerBuiltinRules
      - stepNumber: 3
        description: Register the loaded pack rules after the built-ins.
        type: call
        targetComponent: rule_repository
        targetMethod: registerPackRules
      - stepNumber: 4
        description: Read and return the composed, ordered rule sequence.
        type: call
        targetComponent: rule_repository
        targetMethod: ruleSequence
      - stepNumber: 5
        description: Return the active rule set.
        type: return
        outcome: rule set
    detail: calls-only
lint:
  allow:
    - code: CALL_STEP_UNREALIZED
      reason: >-
        The dry-run serialization and the known-issue-code set are executed through the REGISTERED
        RULE SEQUENCE (the roundtrip rule and rule-context construction), not as direct calls from
        the validate functions — the narrative names the semantic edges the run performs. Revisit
        when Level 3 models call indirection.
status: complete
createdAt: '2026-06-11T14:50:00Z'
updatedAt: '2026-09-12T12:00:20.531Z'
