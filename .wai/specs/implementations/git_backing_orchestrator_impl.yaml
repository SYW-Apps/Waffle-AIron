id: git_backing_orchestrator_impl
name: Git Backing Orchestrator Implementation
description: >-
  Container-level backup workflows: resolver-gated bind/unbind/sync of unit container repos and the
  instance-structure backup repo, plus the pre-authorized periodic sweep. Mirror syncs never touch
  the secret store.
contract: igit_backing_orchestrator
sourcePath: src/server/gitbacking.ts
methods:
  - name: listBackingBindings
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: List every stored binding through the repository
        type: call
        targetComponent: git_backing_repository
        targetMethod: listBindings
      - stepNumber: 3
        description: Compute the caller's project:admin visible scopes over the organization tree
        type: call
        targetComponent: authorization_specialist
        targetMethod: visibleScopes
      - stepNumber: 4
        description: >-
          Filter to bindings whose scope the caller administers (an instance admin keeps all; a unit
          binding requires its unit among the actionable units; the instance binding requires
          instance-level project:admin)
        type: local
      - stepNumber: 5
        description: Return the caller's bindings
        type: return
        outcome: scoped bindings
  - name: bindScope
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: >-
          Resolve the caller's project:admin permission over the binding's scope (the named unit, or
          instance scope for an 'instance' binding)
        type: call
        targetComponent: authorization_specialist
        targetMethod: authorize
      - stepNumber: 3
        description: If the effective value is not yes, deny
        type: branch
        condition: the effective project:admin value is not yes
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the backing bind
        type: throw
        error: Forbidden — binding a backup repository requires project:admin over its scope
      - stepNumber: 5
        description: For a 'unit' binding, verify the scoped unit exists
        type: call
        targetComponent: organization_repository
        targetMethod: getUnit
      - stepNumber: 6
        description: If a 'unit' binding names an unknown unit, reject
        type: branch
        condition: the binding is unit-scoped and its unit does not resolve
        onTrueStep: 7
        onFalseStep: 8
      - stepNumber: 7
        description: Reject the unknown unit
        type: throw
        error: Unknown organization unit
      - stepNumber: 8
        description: Upsert the binding through the repository (one binding per scope — a re-bind replaces)
        type: call
        targetComponent: git_backing_repository
        targetMethod: upsertBinding
        assertsGuarantees:
          - atomic
      - stepNumber: 9
        description: Append a redacted audit event without letting a failure fail the bind
        type: try
        endStep: 11
        catches:
          - error: audit append failure
            step: 12
      - stepNumber: 10
        description: Append the redacted git.backing.bind audit event (security level)
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 11
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 13
      - stepNumber: 12
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 13
        description: Return the stored binding
        type: return
        outcome: stored binding
  - name: unbindScope
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Look up the binding by id to read its own scope
        type: call
        targetComponent: git_backing_repository
        targetMethod: getBinding
      - stepNumber: 3
        description: If no binding matches, reject as not found
        type: branch
        condition: no binding matches the id
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject as not found
        type: throw
        error: not found
      - stepNumber: 5
        description: >-
          Resolve the caller's project:admin permission over the binding's OWN scope (never a
          caller-supplied one)
        type: call
        targetComponent: authorization_specialist
        targetMethod: authorize
      - stepNumber: 6
        description: If the effective value is not yes, deny
        type: branch
        condition: the effective project:admin value is not yes
        onTrueStep: 7
        onFalseStep: 8
      - stepNumber: 7
        description: Reject the backing unbind
        type: throw
        error: Forbidden — unbinding a backup repository requires project:admin over its scope
      - stepNumber: 8
        description: Remove the binding through the repository (the backing repository itself is untouched)
        type: call
        targetComponent: git_backing_repository
        targetMethod: removeBinding
      - stepNumber: 9
        description: Append a redacted audit event without letting a failure fail the unbind
        type: try
        endStep: 11
        catches:
          - error: audit append failure
            step: 12
      - stepNumber: 10
        description: Append the redacted git.backing.unbind audit event (security level)
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 11
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 13
      - stepNumber: 12
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 13
        description: Return once removed
        type: return
        outcome: binding removed
  - name: syncBackingScope
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Look up the binding by id to read its own scope
        type: call
        targetComponent: git_backing_repository
        targetMethod: getBinding
      - stepNumber: 3
        description: If no binding matches, reject as not found
        type: branch
        condition: no binding matches the id
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject as not found
        type: throw
        error: not found
      - stepNumber: 5
        description: Resolve the caller's project:admin permission over the binding's OWN scope
        type: call
        targetComponent: authorization_specialist
        targetMethod: authorize
      - stepNumber: 6
        description: If the effective value is not yes, deny
        type: branch
        condition: the effective project:admin value is not yes
        onTrueStep: 7
        onFalseStep: 8
      - stepNumber: 7
        description: Reject the backing sync
        type: throw
        error: Forbidden — syncing a backup repository requires project:admin over its scope
      - stepNumber: 8
        description: Clone-or-open the backing repo's working copy under <dataDir>/git-backing/<bindingId>/
        type: call
        targetComponent: git_backing_adapter
        targetMethod: cloneOrOpen
      - stepNumber: 9
        description: >-
          Resolve the mirror sources: for a 'unit' binding, the unit's subtree placements through
          the organization repository resolve every placed project; for an 'instance' binding, the
          instance-structure JSON collections (organization, users, permissions, roles, instance
          identity, project registry, relations, policies, approvals) — NEVER the secret store,
          credentials only as hashed records
        type: call
        targetComponent: organization_repository
        targetMethod: listPlacements
      - stepNumber: 10
        description: >-
          For each mirror source (a subtree project's .wai/ tree, or one instance-structure
          collection)
        type: loop
        loopKind: forEach
        over: the resolved mirror sources
        endStep: 11
      - stepNumber: 11
        description: Mirror-export the source into the working copy (projects/<projectId>/.wai/ or instance/)
        type: call
        targetComponent: git_backing_adapter
        targetMethod: mirrorTree
      - stepNumber: 12
        description: Commit and push the mirrored content (skip-if-clean — returns false when nothing changed)
        type: call
        targetComponent: git_backing_adapter
        targetMethod: commitAndPush
      - stepNumber: 13
        description: If nothing was published, skip the lastSyncAt touch
        type: branch
        condition: the commit was skipped (clean mirror)
        onTrueStep: 15
        onFalseStep: 14
      - stepNumber: 14
        description: Record lastSyncAt on the binding
        type: call
        targetComponent: git_backing_repository
        targetMethod: touchSync
      - stepNumber: 15
        description: Append a redacted audit event without letting a failure fail the sync
        type: try
        endStep: 17
        catches:
          - error: audit append failure
            step: 18
      - stepNumber: 16
        description: Append the redacted git.backing.sync audit event (info level)
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 17
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 19
      - stepNumber: 18
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 19
        description: Return whether anything was published
        type: return
        outcome: published flag
  - name: runPeriodicBackingSync
    narrative:
      - stepNumber: 1
        description: >-
          List every stored binding through the repository (pre-authorized internal sweep — the host
          supervisor's timer is the only caller)
        type: call
        targetComponent: git_backing_repository
        targetMethod: listBindings
      - stepNumber: 2
        description: For each binding whose periodicSyncMinutes has elapsed since lastSyncAt
        type: loop
        loopKind: forEach
        over: the due bindings
        endStep: 6
      - stepNumber: 3
        description: Clone-or-open the backing repo's working copy
        type: call
        targetComponent: git_backing_adapter
        targetMethod: cloneOrOpen
      - stepNumber: 4
        description: >-
          Mirror-export the binding's sources (unit subtree projects, or the instance-structure
          collections — never the secret store)
        type: call
        targetComponent: git_backing_adapter
        targetMethod: mirrorTree
      - stepNumber: 5
        description: >-
          Commit and push skip-if-clean; on a published sync record lastSyncAt through the
          repository
        type: call
        targetComponent: git_backing_adapter
        targetMethod: commitAndPush
      - stepNumber: 6
        description: >-
          Record any per-binding failure as a server diagnostic and continue — one binding's failure
          never aborts the sweep
        type: local
      - stepNumber: 7
        description: Return once the sweep completes
        type: return
        outcome: sweep completed
detail: full
status: complete
