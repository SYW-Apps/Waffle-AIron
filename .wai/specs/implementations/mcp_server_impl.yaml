id: mcp_server_impl
name: MCP Server Implementation
description: Concrete implementation of the MCP Server Interface using the @modelcontextprotocol/sdk.
contract: imcp_server
sourcePath: src/mcp/server.ts
methods:
  - name: create
    narrative:
      - stepNumber: 1
        description: >-
          Compose the server instructions for the bound project through the skills client adapter —
          the MCP protocol's own channel for "how to use this server", which clients inject into the
          agent's system prompt. Composed BEFORE instantiation because instructions are constructor
          options, and resolved per construction so the hosted per-request scoped server reports its
          own bound project's profile and packs.
        type: call
        targetComponent: mcp_skills_adapter
        targetMethod: buildServerInstructions
      - stepNumber: 2
        description: Instantiate McpServer with name 'wairon', the version, and the composed instructions
        type: local
      - stepNumber: 3
        description: Register tool 'listAgents' which resolves dynamic agent topology using agent_resolver
        type: call
        targetComponent: mcp_core_adapter
        targetMethod: resolveAgentTopology
      - stepNumber: 4
        description: Register tool 'getAgent' which retrieves a single resolved agent's details
        type: call
        targetComponent: mcp_core_adapter
        targetMethod: resolveAgentTopology
      - stepNumber: 5
        description: Register validation tools executing validateSddTree
        type: call
        targetComponent: mcp_validator_adapter
        targetMethod: validateSddTree
      - stepNumber: 6
        description: Register loader tools to fetch system, subsystem, and component specs from spec_loader
        type: call
        targetComponent: mcp_core_adapter
        targetMethod: loadSystemSpec
      - stepNumber: 7
        description: >-
          Register the PROMPTS capability over the same skill set the resources publish. Resources
          are pull-only — a client must already know to fetch wairon-skill://… — so prompts are what
          makes a skill discoverable to a human driving an agent, as a slash command or attachable
          context. Mirrored from the same descriptor list, so one skill set is served two ways and
          the surfaces cannot drift.
        type: local
      - stepNumber: 8
        description: >-
          Register MCP resource endpoints (resources/list and resources/read) on the SDK server so
          the MCP server now publishes the four built-in SDD skills (sdd-architect, sdd-auditor,
          sdd-implement, sdd-narrative) as read-only MCP resources for cloud-only agents that cannot
          receive filesystem-exported skills. Because both the stdio server and the hosted
          per-project scoped server reuse this same factory (host_mcp_adapter forwards to
          mcp_portal.createMcpServer), both transports publish the resources automatically; inbound
          resource reads dispatch through the MCP portal to the resource workflow.
        type: local
      - stepNumber: 9
        description: >-
          Resolve the bound root's chaining context through the core adapter; when the root is a
          chained subproject, announce the parent project, the mounting subsystem id, and the
          vendored external-surface count on the startup log — an agent bound inside a subproject
          KNOWS its world is a subtree from the first line, instead of learning it incidentally from
          validate warnings
        type: call
        targetComponent: mcp_core_adapter
        targetMethod: resolveChainingParent
      - stepNumber: 10
        description: >-
          When the caller asked for them, register the sixteen hosted data-plane tools — the four
          execute-primary project-lifecycle tools, the four landscape discovery tools, the six
          project-ops tools and the two tree-transfer tools — as ADVERTISEMENTS: name, description
          and input schema so tools/list can show them, over one shared handler that only says the
          tool is dispatched by the hosting data plane and is unavailable here. Nothing in this
          subsystem implements them; the hosting request orchestrator serves every one of them
          before a call reaches this server, which is why the handler fires only outside a hosted
          request and is a refusal when it does
        type: local
      - stepNumber: 11
        description: Return configured McpServer instance
        type: local
    symbol: createMcpServer
status: complete
createdAt: '2026-06-11T14:50:00Z'
updatedAt: '2026-09-19T23:12:59.119Z'
