id: audit_registry_impl
name: Audit Registry Implementation
description: >-
  Write path for the durable audit log: policy-filtered append and retention pruning. Owns redaction
  enforcement - no event carrying raw secrets ever reaches disk. Append and prune are each ONE store
  update, so an event appended in another process is never lost to a concurrent prune or append;
  every capture filter and the redaction guard run before the update, so the lock is held only for
  the read-append-write.
contract: iaudit_registry
sourcePath: src/server/audit.ts
methods:
  - name: append
    narrative:
      - stepNumber: 1
        description: >-
          Capture filter: a disabled policy drops the event silently (successful no-op, disk
          untouched)
        type: branch
        condition: the audit policy is disabled
        onTrueStep: 2
        onFalseStep: 3
      - stepNumber: 2
        description: Drop the event — capture disabled
        type: return
        outcome: silent no-op
      - stepNumber: 3
        description: 'Capture filter: the event level must reach the policy''s minimum'
        type: branch
        condition: the event level ranks below the policy minimum
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Drop the event — below the capture level
        type: return
        outcome: silent no-op
      - stepNumber: 5
        description: 'Capture filter: read events are dropped unless the policy includes them'
        type: branch
        condition: read events are excluded by policy and the event is a read event
        onTrueStep: 6
        onFalseStep: 7
      - stepNumber: 6
        description: Drop the read event
        type: return
        outcome: silent no-op
      - stepNumber: 7
        description: >-
          Redaction guard: check the ORIGINAL target and metadata for raw-credential patterns,
          before any transformation
        type: local
      - stepNumber: 8
        description: Anything that still smells like a raw secret is rejected, never persisted
        type: branch
        condition: the target or metadata looks like a raw credential
        onTrueStep: 9
        onFalseStep: 10
      - stepNumber: 9
        description: Reject the event — redact secrets before auditing
        type: throw
        error: audit event contains what looks like a raw credential
      - stepNumber: 10
        description: >-
          Apply the metadata mode: 'none' drops metadata entirely; any other mode truncates it to
          the size cap
        type: local
      - stepNumber: 11
        description: Stamp a fresh id and timestamp when the event carries none
        type: local
      - stepNumber: 12
        description: >-
          Stamp-complete event in hand, append it to the event set the store hands over (fresh,
          under the file's write lock) as the change of the ONE store update below (a persistence
          failure surfaces as a storage error)
        type: local
      - stepNumber: 13
        description: 'Persist: the store writes the appended set under the lock it still holds'
        type: call
        targetComponent: audit_store
        targetMethod: update
      - stepNumber: 14
        description: Return — the event is durably appended
        type: return
        outcome: appended
    intent: >-
      Apply the retention policy's capture filter first - events whose level or category the policy
      excludes are dropped without touching disk (a silent, successful no-op). Validate the
      surviving event is redacted: reject with a validation error any event whose metadata or target
      smells like a raw bearer token, secret value, or full spec body, and truncate oversize
      metadata to the policy's size cap. Then stamp the event id and timestamp if absent and, in one
      store update, append it to the event set read under the lock. Persistence failures surface as
      storage errors to the caller - hot-path callers are responsible for treating append failure as
      non-blocking per the repository's contract (the lock wait is bounded, so a stuck writer cannot
      block a caller forever).
  - name: prune
    narrative: []
    intent: >-
      In one store update: select the events in the set read under the lock whose age at the
      supplied now-timestamp exceeds the retention window their level and category map to under the
      policy, drop them, and return the removed count. A policy with no matching windows prunes
      nothing and returns zero; a failure leaves the previous set intact.
    calls:
      - audit_store.update
detail: intent
status: complete
