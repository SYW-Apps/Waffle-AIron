id: variant_registry_adapter_impl
name: Variant Registry Adapter Implementation
description: >-
  Filesystem loader and merge for the component-variant registry (built-in, global, project), and
  the project variant rewrite, in src/core/variants.ts.
contract: ivariant_registry_adapter
sourcePath: src/core/variants.ts
methods:
  - name: loadProjectVariants
    narrative: []
    intent: >-
      Reads variant definitions in three layers: wairon's built-in variants shipped in its templates
      (arbiter, projector, composer and codec on Orchestrator; gateway on Portal), then the global
      variants directory (WAIRON_VARIANTS_DIR, else ~/.wairon/variants), then the project's
      .wai/variants/. Each *.yaml holds one variant or a list, parsed against the VariantDef schema,
      and a later layer wins on an id collision. A missing or unreadable directory is an empty set;
      a single malformed file is skipped with a diagnostic, never fatal.
  - name: resolveVariantGuidance
    narrative: []
    intent: >-
      Returns null when the component declares no variant, or declares one the loaded registry does
      not contain (an unresolvable variant is reported by the conformance gate, not silently
      invented here). Otherwise returns the variant id, the base stereotype it specializes, its
      guidance, any target/profile scope the variant declares, and the ids of every other component
      sharing the variant — pure resolution over the arguments, touching no filesystem.
  - name: composeVariantGuidance
    narrative: []
    intent: >-
      Resolves each of the given components in turn and renders the surviving ones as a markdown
      block headed "Component variants — reuse the shared approach", one line per component naming
      its variant, base, guidance, and same-variant siblings. Returns the empty string when nothing
      resolves, so an agent with no variant-tagged components carries no block at all.
  - name: listProjectVariants
    narrative: []
    intent: >-
      Reads only the project's .wai/variants/ files, parsed as loadProjectVariants parses them, and
      returns their variants; a missing directory is an empty list.
  - name: rebaseProjectVariants
    narrative: []
    intent: >-
      For each project variant file, rewrites the base of every variant whose base is fromBase to
      toBase and writes the file back with its other variants and fields unchanged; a file with no
      such variant is not rewritten. Returns the ids rebased. A malformed file is skipped with a
      diagnostic, as the loader skips it.
detail: intent
status: complete
