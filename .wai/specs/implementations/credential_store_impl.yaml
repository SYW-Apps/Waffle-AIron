id: credential_store_impl
name: Credential Store Implementation
description: >-
  Read-through file I/O over the data-dir credential file: load reads the persisted set fresh per
  call, save persists the full set with owner-only permissions.
contract: icredential_store
sourcePath: src/server/credentials.ts
methods:
  - name: read
    narrative: []
    intent: >-
      Reads and parses the credential file fresh from disk; an absent or malformed file yields the
      empty set.
    symbol: load
  - name: write
    narrative: []
    intent: >-
      Serializes the full record set and writes it to the credential file with owner-only (0600)
      permissions.
    symbol: save
status: complete
