id: credential_store_impl
name: Credential Store Implementation
description: >-
  Read-through file I/O over the data-dir credential file, in a module of its own so every
  repository, index and registry hop into it is a real import edge: load reads the persisted set
  fresh per call, and update holds the file's write lock across a fresh read and the replacement,
  written with owner-only permissions through a temporary sibling of its own and a rename.
contract: icredential_store
sourcePath: src/server/credential-store.ts
methods:
  - name: read
    narrative: []
    intent: >-
      Reads and parses the credential file fresh from disk; an absent or malformed file yields the
      empty set. A record carrying a legacy revokedAt (written by an older release, which stamped
      instead of deleting) is left out as absent.
    symbol: load
  - name: update
    narrative: []
    intent: >-
      Takes the credential file's write lock (the shared file-lock primitive), reads the set fresh
      (an absent file is the empty set; a file that exists but cannot be read or parsed throws, so a
      change is never applied to a set read as empty), drops every record carrying a legacy
      revokedAt, applies the change, replaces the file with the result atomically (a temporary
      sibling named for this writer, written with owner-only (0600) permissions, then renamed over
      the file) and releases the lock while it is still its own, also when the change throws, which
      writes nothing.
    calls:
      - file_write_lock.run
    symbol: update
status: complete
