id: externals_lock_store_impl
name: Externals Lock Store Implementation
description: >-
  src/core/externals.ts. A read-through Store: each method is one file operation through the surface
  file adapter.
contract: iexternals_lock_store
sourcePath: src/core/externals.ts
methods:
  - name: read
    narrative: []
    detail: intent
    intent: >-
      Reads the lock through the file adapter on every call and returns it, or null when no lock
      file exists; a malformed lock propagates the adapter's error.
    calls:
      - surface_fs_adapter.readExternalsLock
  - name: write
    narrative: []
    detail: intent
    intent: Writes the lock through the file adapter; a write failure propagates.
    calls:
      - surface_fs_adapter.writeExternalsLock
  - name: readSnapshot
    narrative: []
    detail: intent
    intent: >-
      Reads the alias's snapshot through the file adapter on every call, or null when none is
      stored.
    calls:
      - surface_fs_adapter.readExternalSnapshot
  - name: writeSnapshot
    narrative: []
    detail: intent
    intent: Writes the alias's snapshot through the file adapter; a write failure propagates.
    calls:
      - surface_fs_adapter.writeExternalSnapshot
  - name: removeSnapshot
    narrative: []
    detail: intent
    intent: Removes the alias's snapshot through the file adapter and reports whether one existed.
    calls:
      - surface_fs_adapter.deleteExternalSnapshot
status: design
createdAt: '2026-09-26T17:47:54.596Z'
updatedAt: '2026-09-26T17:51:01.584Z'
