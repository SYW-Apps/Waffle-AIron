id: credential_index_impl
name: Credential Index Implementation
description: >-
  Read path over the credential store's backing file: timing-safe token-hash lookup and
  project/owner listings, redacted.
contract: icredential_index
sourcePath: src/server/credentials.ts
methods:
  - name: findByToken
    narrative: []
    intent: >-
      Loads the persisted set and returns the first record whose key hash matches under a
      timing-safe digest comparison, or null. A revoked credential is deleted, so there is no
      revoked state to skip.
    calls:
      - credential_store.read
    symbol: findByTokenHash
  - name: list
    narrative: []
    intent: >-
      Loads the persisted set and returns the records whose project narrowing covers the given
      project.
    calls:
      - credential_store.read
    symbol: listCredentials
  - name: listByOwner
    narrative: []
    intent: Loads the persisted set and returns the records owned by the given user id.
    calls:
      - credential_store.read
    symbol: listByOwner
status: complete
createdAt: '2026-07-19T08:58:39.779Z'
updatedAt: '2026-10-23T22:12:32.352Z'
