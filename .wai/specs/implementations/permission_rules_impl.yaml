id: permission_rules_impl
name: Permission Rules Implementation
description: >-
  Pure hierarchical permission resolution: the nearest-ancestor walk for effective permission, and
  the actionable-plus-breadcrumb visibility view. No I/O; deterministic over its inputs.
contract: ipermission_rules
sourcePath: src/server/permission-rules.ts
methods:
  - name: resolvePermission
    narrative:
      - stepNumber: 1
        description: An instance-admin subject is authorized everywhere
        type: branch
        condition: the subject is an instance admin
        onFalseStep: 3
      - stepNumber: 2
        description: Bypass the walk
        type: return
        outcome: yes (instance-admin)
      - stepNumber: 3
        description: >-
          Build the target's ancestor chain leaf->root: for a subsystem
          (`<projectId>/<subsystemId>`), its own subsystem rung when the capability is project:write
          (none for any other capability), then its project's chain; for a project, its own scope,
          then — following the world's parent links, each visited once — every parent project scope
          up to its family root, then the family root's placement unit and that unit's ancestors;
          for a unit, the unit and its ancestors; ending at the instance root. A subsystem id
          without the separator names no scope: its chain is the instance root alone
        type: local
      - stepNumber: 4
        description: Walk the ancestor chain, stopping at the nearest scope with a definitive value
        type: loop
        loopKind: forEach
        over: each scope in the ancestor chain, leaf->root
        endStep: 9
      - stepNumber: 5
        description: >-
          Gather the subject's settings that apply AT THIS SCOPE for the capability: the direct-user
          assignment scoped here; the values from the subject's roles whose binding is ANCHORED here
          (an instance-wide/unscoped role binding anchors at the instance root, a unit/project
          binding at that scope), read from each role's permissions and combined most-permissively;
          and the everyone-default scoped here. Roles are NOT re-pulled at every scope — anchoring
          them makes the leaf->root walk realize subtree inheritance correctly, so a nearer
          direct-user or scope-default deny outranks a broadly-bound role.
        type: local
      - stepNumber: 6
        description: >-
          Resolve this scope's value by precedence: a definitive direct-user value wins; else the
          most-permissive GRANTING role value among roles anchored here (yes > approval; a role
          never denies — a role 'no'/'inherit' is non-deciding); else the everyone-default; else
          'inherit' (continue upward). At a subsystem rung only yes and no decide — a subsystem is a
          yes/no setting, so a role's approval there is non-deciding and an approval value anywhere
          there defers to the project.
        type: local
      - stepNumber: 7
        description: If this scope produced a definitive value, it decides
        type: branch
        condition: this scope produced a definitive value (not inherit)
        onFalseStep: 9
      - stepNumber: 8
        description: Return the deciding value
        type: return
        outcome: the definitive value with its source and deciding scope
      - stepNumber: 9
        description: No definitive value here — continue to the next ancestor
        type: local
      - stepNumber: 10
        description: The walk reached the root with nothing definitive
        type: return
        outcome: no (instance default)
    detail: full
  - name: resolveVisibleScopes
    narrative:
      - stepNumber: 1
        description: An instance-admin sees every scope as actionable
        type: branch
        condition: the subject is an instance admin
        onFalseStep: 3
      - stepNumber: 2
        description: Return all scopes actionable
        type: return
        outcome: every unit and placed project marked actionable
      - stepNumber: 3
        description: Prepare the visibility accumulator (actionable set and context set)
        type: local
      - stepNumber: 4
        description: Determine the subject's view of every scope
        type: loop
        loopKind: forEach
        over: >-
          each unit, each placed project and each member project (from the parent links) in the
          world, and — for project:write — each subsystem scope a setting in the world names (a
          subsystem assignment, or one of the subject's subsystem role bindings)
        endStep: 8
      - stepNumber: 5
        description: >-
          Resolve this scope's effective permission for the GIVEN capability via the
          nearest-ancestor walk (the same anchored role logic as resolvePermission)
        type: local
      - stepNumber: 6
        description: A yes/approval scope is actionable
        type: branch
        condition: the effective value is yes or approval
        onFalseStep: 8
      - stepNumber: 7
        description: >-
          Record the scope as actionable; add its ancestors to the context set only when they are
          not themselves actionable (actionable always wins over context): a subsystem's project and
          that project's units, a member's family root's units, a unit's ancestor units.
        type: local
      - stepNumber: 8
        description: Advance to the next scope
        type: local
      - stepNumber: 9
        description: Return the visibility view, deduplicated by scope with actionable winning over context
        type: return
        outcome: actionable scopes plus their context-only ancestor breadcrumb
    detail: full
  - name: resolveSubsystemReach
    narrative:
      - stepNumber: 1
        description: 'An instance-admin meets no subsystem rung: the bypass decides every scope'
        type: branch
        condition: the subject is an instance admin
        onFalseStep: 3
      - stepNumber: 2
        description: Nothing differs from the project
        type: return
        outcome: no subsystem rungs
      - stepNumber: 3
        label: collect
        description: >-
          Collect the subsystem scopes of the project that carry a setting applying to the subject:
          a direct-user assignment at `<projectId>/<subsystemId>` keyed by the subject's id or one
          of its aliases, an everyone-default there, or one of the subject's role bindings anchored
          there — each subsystem once
        type: local
      - stepNumber: 4
        description: Judge each collected subsystem
        type: loop
        loopKind: forEach
        over: each collected subsystem scope
        endStep: 6
      - stepNumber: 5
        description: >-
          Resolve project:write at the subsystem scope through the same walk resolvePermission takes
          (its own rung, then the project's chain), so a subsystem whose settings do not decide
          reports the project chain's decision
        type: call
        targetComponent: permission_rules
        targetMethod: resolvePermission
      - stepNumber: 6
        label: next
        description: Record the subsystem with its effective permission and the rung that decided it
        type: local
      - stepNumber: 7
        description: Return the subsystem rungs; every subsystem not listed resolves exactly as the project
        type: return
        outcome: SubsystemReach[]
    detail: full
detail: full
status: complete
