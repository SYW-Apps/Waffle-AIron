id: mcp_orchestrator_impl
name: MCP Orchestrator Implementation
description: >-
  The sdd_* tool workflows: turning each tool's arguments into the write the authoring seam
  performs, reads through the core client adapter, and conformance runs via the validator client
  adapter. A tool knows its own input schema, so it states which fields that input can express; what
  a write does with that knowledge — status, carry, clear, removal, the gate, the tests it
  invalidates — is decided by the seam, identically for every door. Realized today inside
  src/mcp/server.ts tool handlers (pending the code-side split).
contract: imcp_orchestrator
sourcePath: src/mcp/server.ts
methods:
  - name: initializeSystem
    narrative:
      - stepNumber: 1
        description: >-
          State the restatement: the L0 as the tool's arguments give it, and the fields this tool's
          input can express
        type: local
      - stepNumber: 2
        description: >-
          Write it through the authoring client adapter, which re-authors an existing L0 in place
          and carries what this input cannot express (databases, the project gateway
          publicInterfaces, diagram defaults)
        type: call
        targetComponent: mcp_authoring_adapter
        targetMethod: writeSpec
      - stepNumber: 3
        description: >-
          Answer with the receipt: the sentence and its notices as text, the receipt itself as
          structured content
        type: return
        outcome: written
    symbol: sdd_initialize_system
  - name: addComponent
    narrative:
      - stepNumber: 1
        description: >-
          State the restatement: the component as the tool's arguments give it, the fields this
          tool's input can express, and the status stated, if any
        type: local
      - stepNumber: 2
        description: >-
          Write it through the authoring client adapter, which requires the subsystem and judges the
          candidate against the intrinsic rules before anything reaches disk
        type: call
        targetComponent: mcp_authoring_adapter
        targetMethod: writeSpec
      - stepNumber: 3
        description: Answer with the receipt
        type: return
        outcome: written
    symbol: sdd_add_component
  - name: defineInterface
    narrative:
      - stepNumber: 1
        description: >-
          State the restatement: the contract as the tool's arguments give it, the spec-level and
          per-method fields this tool's input can express, and the status stated, if any
        type: local
      - stepNumber: 2
        description: >-
          Write it through the authoring client adapter, which requires the component, carries each
          method's endpoint binding, names every method a restatement removed, and reports the tests
          a changed or removed method invalidated
        type: call
        targetComponent: mcp_authoring_adapter
        targetMethod: writeSpec
      - stepNumber: 3
        description: Answer with the receipt
        type: return
        outcome: written
    symbol: sdd_define_interface
  - name: writeNarrative
    narrative:
      - stepNumber: 1
        description: >-
          State the restatement: the implementation as the tool's arguments give it, each step
          numbered by its position where the input left the number out, with the spec-level and
          per-method fields this tool's input can express, and the status stated, if any
        type: local
      - stepNumber: 2
        description: >-
          Write it through the authoring client adapter, which requires the contract, resolves every
          *Label reference (an unresolved one refuses the whole write), names every method a
          restatement removed, and reports the tests a changed or removed method invalidated
        type: call
        targetComponent: mcp_authoring_adapter
        targetMethod: writeSpec
      - stepNumber: 3
        description: Answer with the receipt
        type: return
        outcome: written
    symbol: sdd_write_narrative
  - name: addSubsystem
    narrative:
      - stepNumber: 1
        description: >-
          State the restatement: the subsystem as the tool's arguments give it, the fields this
          tool's input can express, and the status stated, if any
        type: local
      - stepNumber: 2
        description: >-
          Write it through the authoring client adapter, which requires the L0, derives parentSystem
          from it, and refuses a projectPath (the legacy mount form)
        type: call
        targetComponent: mcp_authoring_adapter
        targetMethod: writeSpec
      - stepNumber: 3
        description: Answer with the receipt
        type: return
        outcome: written
    symbol: sdd_add_subsystem
  - name: moveMember
    narrative:
      - stepNumber: 1
        description: Relocate the member's directory and point its `members` entry there via core
        type: call
        targetComponent: mcp_core_adapter
        targetMethod: moveMember
    symbol: sdd_move_member
  - name: listResources
    narrative:
      - stepNumber: 1
        description: List the built-in SDD skill resources via the skills client adapter.
        type: call
        targetComponent: mcp_skills_adapter
        targetMethod: listResources
      - stepNumber: 2
        description: >-
          Resolve the current agent topology via the core client adapter and append one
          wairon-agent:// brief descriptor per record — recomputed per request so a re-lock is
          visible on the next list.
        type: call
        targetComponent: mcp_core_adapter
        targetMethod: resolveAgentTopology
    symbol: listPublishedResources
  - name: readResource
    narrative:
      - stepNumber: 1
        description: Route on the resource URI scheme
        type: branch
        condition: resourceId is a wairon-agent:// agent-brief id
        onTrueStep: 2
        onFalseStep: 4
      - stepNumber: 2
        description: Compose that agent's live brief via the core client adapter
        type: call
        targetComponent: mcp_core_adapter
        targetMethod: composeAgentBrief
      - stepNumber: 3
        description: Render the brief as the resource's markdown content
        type: return
        outcome: agent brief rendered
      - stepNumber: 4
        description: Read one built-in SDD skill resource via the skills client adapter.
        type: call
        targetComponent: mcp_skills_adapter
        targetMethod: readResource
    symbol: readPublishedResource
  - name: getAgentBrief
    narrative:
      - stepNumber: 1
        description: >-
          Compose the agent's live delegation brief via the core client adapter and shape the tool
          response
        type: call
        targetComponent: mcp_core_adapter
        targetMethod: composeAgentBrief
    symbol: sdd_get_agent_brief
  - name: renameComponent
    narrative:
      - stepNumber: 1
        description: >-
          Read the bound tree's components through the core client adapter, and resolve the tool's
          id, namespaced if needed, to the qualified component id among them, so core can refuse a
          component inside a chained subproject
        type: call
        targetComponent: mcp_core_adapter
        targetMethod: loadComponentSpecs
      - stepNumber: 2
        description: Rename the component and rewrite every reference to it via the core client adapter
        type: call
        targetComponent: mcp_core_adapter
        targetMethod: renameComponent
      - stepNumber: 3
        description: >-
          Shape the tool response from the report: each spec moved with its old and new id, and the
          specs whose references were rewritten
        type: return
        outcome: ComponentRename
  - name: renameMethod
    narrative:
      - stepNumber: 1
        description: >-
          Read the bound tree's components through the core client adapter, and resolve the tool's
          id, namespaced if needed, to the qualified component id among them, so core can refuse a
          component inside a chained subproject
        type: call
        targetComponent: mcp_core_adapter
        targetMethod: loadComponentSpecs
      - stepNumber: 2
        description: Rename the contract method and retarget every reference to it via the core client adapter
        type: call
        targetComponent: mcp_core_adapter
        targetMethod: renameMethod
      - stepNumber: 3
        description: >-
          Shape the tool response from the report: the specs the method moved in, the specs whose
          references were retargeted, the specs whose prose still names it, and the pinned symbol
          when one was set
        type: return
        outcome: MethodRename
  - name: updateSpec
    narrative:
      - stepNumber: 1
        description: >-
          Patch the stored spec through the authoring client adapter, so the same gate that judges a
          create judges the merged candidate — an update can introduce a misplaced field as easily
          as a create can
        type: call
        targetComponent: mcp_authoring_adapter
        targetMethod: updateSpecGated
      - stepNumber: 2
        description: >-
          Render the change report as the text answer and carry that same report as the structured
          twin, so the sentence and the data are two renderings of one object and can never disagree
        type: local
    symbol: sdd_update_spec
  - name: setEndpoints
    narrative:
      - stepNumber: 1
        description: >-
          Read the L3 contract the bindings attach to; an id no contract holds is refused, and so is
          a binding to a method it does not declare — a delta would otherwise add a bare method
          under that name
        type: call
        targetComponent: mcp_core_adapter
        targetMethod: loadInterfaceSpec
      - stepNumber: 2
        description: >-
          Read the component the contract belongs to through the core client adapter, for the
          transport its portalType implies
        type: call
        targetComponent: mcp_core_adapter
        targetMethod: loadComponentSpec
      - stepNumber: 3
        description: >-
          For each binding, normalize the transport to the endpoint vocabulary (a portalType
          spelling maps explicitly: HTTP_API is HTTP), refuse a transport the Portal's portalType
          does not carry — naming the one it implies — then build the raw endpoint from that
          transport's own address fields and parse it against the endpoint schema; a binding the
          schema rejects refuses the whole write with the offending field named, so a half-bound
          contract is never saved
        type: local
      - stepNumber: 4
        description: >-
          Bind them through the authoring client adapter as one delta naming each method with its
          endpoint, so the write is judged and reported like any other
        type: call
        targetComponent: mcp_authoring_adapter
        targetMethod: updateSpecGated
      - stepNumber: 5
        description: >-
          Answer with the change report: every binding the write set or changed, and that nothing
          changed when every binding already held
        type: return
        outcome: reported
    symbol: sdd_set_endpoints
  - name: setPublicInterfaces
    narrative:
      - stepNumber: 1
        description: >-
          Read the L1 subsystem whose published surface is being set; an id no subsystem holds is
          refused
        type: call
        targetComponent: mcp_core_adapter
        targetMethod: loadSubsystemSpec
      - stepNumber: 2
        description: >-
          Express the replacement as one delta: a delete for every stored entry the list does not
          restate (an entry is its component and interface), then the list itself — so the write
          stays a single judged write and an entry left out is gone, which is what this tool
          promises
        type: local
      - stepNumber: 3
        description: Apply it through the authoring client adapter
        type: call
        targetComponent: mcp_authoring_adapter
        targetMethod: updateSpecGated
      - stepNumber: 4
        description: 'Answer with the change report: every entry added, changed or removed'
        type: return
        outcome: reported
    symbol: sdd_set_public_interfaces
  - name: getSpec
    narrative:
      - stepNumber: 1
        description: Was a kind asked for?
        type: branch
        condition: the read names a kind
        onTrueStep: 5
        onFalseStep: 2
      - stepNumber: 2
        description: >-
          Infer the kind from the id: read it through each level's loader on the core client adapter
          (the L0 by its name or "system") and keep the levels that hold it
        type: local
      - stepNumber: 3
        description: Does exactly one level hold the id?
        type: branch
        condition: exactly one kind holds the id
        onTrueStep: 5
        onFalseStep: 4
      - stepNumber: 4
        description: >-
          Refuse, naming the candidate kinds when several levels hold the id (pass kind to choose
          one) or saying that no level holds it
        type: return
        outcome: kind not inferable
      - stepNumber: 5
        description: >-
          Route the read on the kind asked for: each level has its own loader on the core client
          adapter
        type: switch
        'on': the kind of spec to read
        cases:
          - value: system
            step: 6
          - value: subsystem
            step: 8
          - value: component
            step: 10
          - value: interface
            step: 12
          - value: implementation
            step: 14
          - value: type
            step: 16
        defaultStep: 18
      - stepNumber: 6
        description: Read the L0 system spec, the singleton whose load ignores the id
        type: call
        targetComponent: mcp_core_adapter
        targetMethod: loadSystemSpec
      - stepNumber: 7
        description: Join the shared answer path
        type: jump
        toStep: 17
      - stepNumber: 8
        description: Read the L1 subsystem spec by id
        type: call
        targetComponent: mcp_core_adapter
        targetMethod: loadSubsystemSpec
      - stepNumber: 9
        description: Join the shared answer path
        type: jump
        toStep: 17
      - stepNumber: 10
        description: Read the L2 component spec by id
        type: call
        targetComponent: mcp_core_adapter
        targetMethod: loadComponentSpec
      - stepNumber: 11
        description: Join the shared answer path
        type: jump
        toStep: 17
      - stepNumber: 12
        description: Read the L3 interface spec by id
        type: call
        targetComponent: mcp_core_adapter
        targetMethod: loadInterfaceSpec
      - stepNumber: 13
        description: Join the shared answer path
        type: jump
        toStep: 17
      - stepNumber: 14
        description: Read the L4 implementation spec by id
        type: call
        targetComponent: mcp_core_adapter
        targetMethod: loadImplementationSpec
      - stepNumber: 15
        description: Join the shared answer path
        type: jump
        toStep: 17
      - stepNumber: 16
        description: Read the type spec by id
        type: call
        targetComponent: mcp_core_adapter
        targetMethod: loadTypeSpec
      - stepNumber: 17
        label: found-check
        description: Decide whether a spec of that kind holds that id
        type: branch
        condition: the load found nothing
        onFalseStep: 19
      - stepNumber: 18
        label: not-found
        description: Refuse a read of a spec that does not exist, naming the kind and the id asked for
        type: return
        outcome: no such spec
      - stepNumber: 19
        description: Decide whether the read was narrowed to named methods
        type: branch
        condition: the read named methods to filter by
        onFalseStep: 21
      - stepNumber: 20
        description: >-
          Refuse the filter outright when the spec declares no methods at all, or when a name it
          does not declare is asked for — naming the ones it does, and returning nothing, so a
          misspelling never reads as a method with no content. Otherwise keep the named methods and
          attach the partial-result marker: what is shown, how many are omitted, and the warning
          that a write REPLACES the method list, so re-authoring from this answer would remove every
          method left out
        type: local
      - stepNumber: 21
        description: Decide whether the spec read carries variant guidance
        type: branch
        condition: the spec is a component that declares a variant
        onFalseStep: 25
      - stepNumber: 22
        description: Load the variant registry through the core client adapter
        type: call
        targetComponent: mcp_core_adapter
        targetMethod: loadProjectVariants
      - stepNumber: 23
        description: Read every component, for the same-variant siblings
        type: call
        targetComponent: mcp_core_adapter
        targetMethod: loadComponentSpecs
      - stepNumber: 24
        description: >-
          Resolve the component's variant guidance — the variant's base, its implementation
          guidance, and the same-variant sibling components — through the core client adapter, and
          attach it as clearly derived and read-only
        type: call
        targetComponent: mcp_core_adapter
        targetMethod: resolveVariantGuidance
      - stepNumber: 25
        description: >-
          Answer with the STORED spec and the derived markers beside it, so nothing derived can be
          mistaken for something stored and written back; the text rendering folds them in, as it
          always has
        type: return
        outcome: SpecReadResult
    symbol: sdd_get_spec
  - name: addType
    narrative:
      - stepNumber: 1
        description: >-
          State the restatement: the type as the tool's arguments give it, each field's optional
          flag defaulted to false, and the fields this tool's input can express
        type: local
      - stepNumber: 2
        description: >-
          Write it through the authoring client adapter, which names every field or method a
          restatement removed; a type carries no lifecycle status, so the receipt states none
        type: call
        targetComponent: mcp_authoring_adapter
        targetMethod: writeSpec
      - stepNumber: 3
        description: Answer with the receipt
        type: return
        outcome: written
    symbol: sdd_add_type
  - name: moveMethods
    narrative:
      - stepNumber: 1
        description: >-
          Verify the source component exists, so a mistyped id reads as a mistyped id rather than as
          a rule refusing the design
        type: call
        targetComponent: mcp_core_adapter
        targetMethod: loadComponentSpec
      - stepNumber: 2
        description: Verify the target component exists the same way
        type: call
        targetComponent: mcp_core_adapter
        targetMethod: loadComponentSpec
      - stepNumber: 3
        description: >-
          Hand the move to the authoring client adapter, which reaches the gate: the move is judged
          as a whole and refused before anything reaches disk
        type: call
        targetComponent: mcp_authoring_adapter
        targetMethod: moveMethods
    symbol: sdd_move_methods
  - name: deleteSpec
    narrative:
      - stepNumber: 1
        description: >-
          Delete the spec through the authoring client adapter, which reports the tests a removed
          method invalidated
        type: call
        targetComponent: mcp_authoring_adapter
        targetMethod: deleteSpec
      - stepNumber: 2
        description: >-
          Answer with the deletion: false says the spec was not there, which is not a failure but is
          not a deletion either
        type: return
        outcome: answered
    symbol: sdd_delete_spec
  - name: getProjectConfig
    narrative:
      - stepNumber: 1
        description: >-
          Read the bound project's configuration through the core client adapter; a project with
          none answers null rather than throwing
        type: call
        targetComponent: mcp_core_adapter
        targetMethod: loadProjectConfig
    symbol: getProjectConfig
  - name: getStatus
    narrative:
      - stepNumber: 1
        description: >-
          Ask the validator for the pin tree: this project's own approval state and each member's,
          every one computed at that project's OWN root, so the states printed here are the ones
          status prints from the member's root (status-agrees). The hosted data plane has already
          bound a root within the credential's reach
        type: call
        targetComponent: mcp_validator_adapter
        targetMethod: familyApprovals
      - stepNumber: 2
        description: >-
          Ask core for the completeness report through the adapter, handing it the pin tree so each
          [Project] line carries its member's approval state and pin. Statically bound, never a lazy
          require: this server is bundled, and a runtime require of a command file resolves against
          the bundle's own directory — which worked from the CLI, whose bundle happened to contain
          that file, and answered "Cannot find module" on the hosted data plane instead of the
          report
        type: call
        targetComponent: mcp_core_adapter
        targetMethod: getStatusReport
      - stepNumber: 3
        description: >-
          Read the members the bound root declares — its project.yaml `members` entries and, for one
          release, its legacy L1 mounts, each with its alias, path and form — so the context line
          can name which projects this answer spans; a report that silently covered three projects
          would read exactly like one that covered this one
        type: call
        targetComponent: mcp_core_adapter
        targetMethod: listDirectChainedSubprojects
      - stepNumber: 4
        description: >-
          Ask what the lock says about the tree as it stands, passing the pin tree so the verdict
          names members whose pin moved and the stage-5 upgrade. An agent reading this tool is
          deciding whether it may write code against these specs, so a tree that has drifted from
          its approval is the single most important thing this answer can carry — and silence would
          read exactly like being current
        type: call
        targetComponent: mcp_core_adapter
        targetMethod: approvalVerdict
      - stepNumber: 5
        description: >-
          Compare this project's externals with their live producers, offline and advisory, via the
          validator client adapter — so an agent deciding whether to write code against these specs
          also sees a dependency that broke since it was pinned
        type: call
        targetComponent: mcp_validator_adapter
        targetMethod: adviseExternals
      - stepNumber: 6
        description: >-
          Answer it behind the tool-family context line, so a client reading one tool's output knows
          which family of tools it belongs to — with an Externals section when any external moved
          live, drifted or could not be compared (what moved, who uses it, the fix; the pin still
          gates)
        type: return
        outcome: status
    symbol: sdd_get_status
  - name: addMember
    narrative:
      - stepNumber: 1
        description: >-
          Scaffold the member project and declare it in `members` via core; the answer states the
          required packs the new member was given and the requirements nothing installed satisfies
        type: call
        targetComponent: mcp_core_adapter
        targetMethod: createMember
    symbol: sdd_add_member
  - name: validateTree
    narrative:
      - stepNumber: 1
        description: >-
          Read the bound project's configuration through the core adapter: its rule severities and
          projectType govern the gate, and whether it declares members decides the default run
        type: call
        targetComponent: mcp_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 2
        description: >-
          Which run? validation_options.selectsFamily(the configuration declares members) over the
          tool's `family` and `recursive` flags — the same reading `wairon validate` makes
        type: branch
        condition: the options select the family run
        onFalseStep: 5
      - stepNumber: 3
        description: >-
          Run the family run via the validator client adapter — within the request's reach, which
          the run narrows and never widens
        type: call
        targetComponent: mcp_validator_adapter
        targetMethod: validateFamily
      - stepNumber: 4
        description: >-
          The family verdict holds every selected project's gate: go add the advisory live
          comparison
        type: jump
        toStep: 6
      - stepNumber: 5
        label: ownerGate
        description: Run the owner's gate via the validator client adapter
        type: call
        targetComponent: mcp_validator_adapter
        targetMethod: validateProject
      - stepNumber: 6
        label: advise
        description: >-
          Compare, offline and advisory, every external the run did not compose with its live
          producer (the aliases a family run composed in reach are passed so they get no second
          word) via the validator client adapter
        type: call
        targetComponent: mcp_validator_adapter
        targetMethod: adviseExternals
      - stepNumber: 7
        description: >-
          Answer the verdict — the family run's (each finding under its project) or the owner's
          gate's — split into errors, warnings and notices, the advisory findings among them marked
          advisory (EXTERNAL_LIVE_INCOMPATIBLE, EXTERNAL_DRIFTED, EXTERNAL_LIVE_UNCOMPARED: what
          moved live, who uses it, the fix), which never make the tree invalid
        type: return
        outcome: ValidationResult
    symbol: sdd_validate_tree
  - name: packImpact
    narrative:
      - stepNumber: 1
        description: >-
          Read the bound project's configuration through the core adapter: does it apply the pack
          exactly as asked?
        type: call
        targetComponent: mcp_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 2
        description: >-
          Build the candidate: the stored entry with `remove` when the pack is applied exactly as
          asked, else the by-name selection (with the version when one was given)
        type: local
      - stepNumber: 3
        description: >-
          Measure it through the validator client adapter, writing nothing; a pack that does not
          resolve answers the resolver's reason as the tool error
        type: call
        targetComponent: mcp_validator_adapter
        targetMethod: measurePackImpact
      - stepNumber: 4
        description: >-
          Answer the impact as structured content, with a text rendering grouped by doctrine change,
          governing profile and finding change
        type: return
        outcome: PackImpact
    symbol: sdd_pack_impact
  - name: renameType
    narrative:
      - stepNumber: 1
        description: >-
          Read the type through the core client adapter, resolving the tool's id — qualified by its
          owning subsystem when two subsystems own that id — to the type it names, so core receives
          an unambiguous id
        type: call
        targetComponent: mcp_core_adapter
        targetMethod: loadTypeSpec
      - stepNumber: 2
        description: Rename the type and rewrite every reference to it via the core client adapter
        type: call
        targetComponent: mcp_core_adapter
        targetMethod: renameType
      - stepNumber: 3
        description: >-
          Shape the tool response from the report: from and to, the specs rewritten, the public
          names kept, the register edits
        type: return
        outcome: TypeRename
conformance: anchored
status: complete
createdAt: '2026-07-02T00:00:00Z'
updatedAt: '2026-10-06T13:15:18.913Z'
