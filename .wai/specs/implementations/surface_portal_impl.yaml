        targetComponent: surface_orchestrator
        targetMethod: getExternalsStatus
  - name: listExternals
    narrative:
      - stepNumber: 1
        description: Forward listExternals to the surface orchestrator
        type: call
        targetComponent: surface_orchestrator
        targetMethod: listExternals
  - name: listPinnedExternals
    narrative:
      - stepNumber: 1
        description: Forward listPinnedExternals to the surface orchestrator
        type: call
        targetComponent: surface_orchestrator
        targetMethod: listPinnedExternals
  - name: pinnedParent
    narrative:
      - stepNumber: 1
        description: Forward pinnedParent to the surface orchestrator
        type: call
        targetComponent: surface_orchestrator
        targetMethod: pinnedParent
  - name: exportDesign
    narrative:
      - stepNumber: 1
        description: Forward exportDesign to the surface orchestrator
        type: call
        targetComponent: surface_orchestrator
        targetMethod: exportDesign
  - name: declareExternal
    narrative:
      - stepNumber: 1
        description: Dispatch the declaration to the external-declarations workflow
        type: call
        targetComponent: external_declarations
        targetMethod: declare
  - name: removeExternal
    narrative:
      - stepNumber: 1
        description: Dispatch the removal to the external-declarations workflow
        type: call
        targetComponent: external_declarations
        targetMethod: remove
  - name: updateExternalUse
    narrative:
      - stepNumber: 1
        description: Dispatch the `use` change to the external-declarations workflow
        type: call
        targetComponent: external_declarations
        targetMethod: updateUse
  - name: listConsumers
    narrative:
      - stepNumber: 1
        description: Forward to the surface orchestrator
        type: call
        targetComponent: surface_orchestrator
        targetMethod: listConsumers
  - name: diffSurface
    narrative:
      - stepNumber: 1
        description: Forward to the surface orchestrator
        type: call
        targetComponent: surface_orchestrator
        targetMethod: diff
  - name: unrecordedUses
