id: surface_portal_impl
name: Surface Portal Implementation
description: >-
  Pure 1:1 forwarding of surface operations to the orchestrator, in a module of its own so the
  portal-to-orchestrator hop is a real import edge; client adapters import the portal from here.
contract: isurface_portal
sourcePath: src/core/surface-portal.ts
methods:
  - name: exportSurface
    narrative:
      - stepNumber: 1
        description: Forward exportSurface to the surface orchestrator
        type: call
        targetComponent: surface_orchestrator
        targetMethod: export
  - name: importSurface
    narrative:
      - stepNumber: 1
        description: Forward importSurface to the surface orchestrator
        type: call
        targetComponent: surface_orchestrator
        targetMethod: import
  - name: listSnapshots
    narrative:
      - stepNumber: 1
        description: Forward listSnapshots to the surface orchestrator
        type: call
        targetComponent: surface_orchestrator
        targetMethod: listSnapshots
  - name: getSnapshot
    narrative:
      - stepNumber: 1
        description: Forward getSnapshot to the surface orchestrator
        type: call
        targetComponent: surface_orchestrator
        targetMethod: getSnapshot
  - name: removeSnapshot
    narrative:
      - stepNumber: 1
        description: Forward removeSnapshot to the surface orchestrator
        type: call
        targetComponent: surface_orchestrator
        targetMethod: removeSnapshot
  - name: pinExternals
    narrative:
      - stepNumber: 1
        description: Forward pinExternals to the surface orchestrator
