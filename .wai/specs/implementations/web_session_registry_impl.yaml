id: web_session_registry_impl
name: Web Session Registry Implementation
description: >-
  Write path for browser sessions. Every operation is ONE store update: the session set is read
  fresh under web-sessions.json's write lock, the change is applied to it and the replacement is
  written before the lock is released - a sign-in in one process is never erased by another
  process's touch or prune. Never touches the index.
contract: iweb_session_registry
sourcePath: src/server/websessions.ts
methods:
  - name: create
    narrative: []
    intent: >-
      In one store update: stamp the new session's id (when absent), createdAt, expiresAt, and
      initial lastSeenAt, and insert it into the session set read under the lock; return the stored
      session. When persistence fails, nothing changes and the storage error propagates.
    calls:
      - web_session_store.update
  - name: touch
    narrative: []
    intent: >-
      In one store update: locate the session by id in the set read under the lock - a missing id is
      a silent no-op - and update only its lastSeenAt to the supplied timestamp while preserving
      every other field.
    calls:
      - web_session_store.update
  - name: remove
    narrative: []
    intent: >-
      In one store update: drop the session with the given id from the set read under the lock - a
      missing id is a silent no-op. Used on sign-out and for correlated revocation.
    calls:
      - web_session_store.update
  - name: pruneExpired
    narrative: []
    intent: >-
      In one store update: remove every session in the set read under the lock whose expiresAt is at
      or before the supplied instant, and return the number removed. A no-op returns zero.
    calls:
      - web_session_store.update
  - name: removeAllForSubject
    narrative: []
    intent: >-
      In one store update: remove every session in the set read under the lock whose subject user id
      matches the given userId - correlated revocation used when a user is deactivated so no live
      browser session outlives the deactivation - and return the number removed. A user with no
      sessions is a no-op returning zero.
    calls:
      - web_session_store.update
detail: intent
status: complete
