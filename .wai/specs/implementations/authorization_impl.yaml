id: authorization_impl
name: Authorization Implementation
description: >-
  Gathers the permission world once and delegates to the pure permission rules. Reads repositories;
  holds no state.
contract: iauthorization
sourcePath: src/server/authorization.ts
injectedParams:
  - dataDir
methods:
  - name: authorize
    narrative:
      - stepNumber: 1
        description: Gather all organization units
        type: call
        targetComponent: organization_repository
        targetMethod: listUnits
      - stepNumber: 2
        description: Gather all project placements
        type: call
        targetComponent: organization_repository
        targetMethod: listPlacements
      - stepNumber: 3
        description: >-
          Gather the hosted records and project the member records' parent links (projects nest like
          units: a member's chain climbs through its parents to its family root's units)
        type: call
        targetComponent: project_repository
        targetMethod: list
      - stepNumber: 4
        description: Gather the relevant permission assignments
        type: call
        targetComponent: permission_repository
        targetMethod: listAssignments
      - stepNumber: 5
        description: 'Gather the effective role set: the built-in roles merged over the stored ones'
        type: call
        targetComponent: role_repository
        targetMethod: effective
      - stepNumber: 6
        description: >-
          Assemble the PermissionWorld from the gathered assignments, units, and placements, and a
          role set that MERGES the stored (admin-defined) roles with the intrinsic built-in reserved
          roles (e.g. 'sso-admin' → project:admin + project:create @ instance). Built-in roles are
          code constants always present in every world, so a binding to a built-in role ALWAYS
          resolves without any seed row in the role store — there is no seeding step to forget and
          no silent admin lockout.
        type: local
      - stepNumber: 7
        description: Resolve the principal's effective permission for the capability at the target scope
        type: call
        targetComponent: permission_rules
        targetMethod: resolvePermission
      - stepNumber: 8
        description: Return the effective permission
        type: return
        outcome: the effective permission
  - name: visibleScopes
    narrative:
      - stepNumber: 1
        description: Gather all organization units
        type: call
        targetComponent: organization_repository
        targetMethod: listUnits
      - stepNumber: 2
        description: Gather all project placements
        type: call
        targetComponent: organization_repository
        targetMethod: listPlacements
      - stepNumber: 3
        description: >-
          Gather the hosted records and project the member records' parent links, so member projects
          are judged through their chains too
        type: call
        targetComponent: project_repository
        targetMethod: list
      - stepNumber: 4
        description: Gather the relevant permission assignments
        type: call
        targetComponent: permission_repository
        targetMethod: listAssignments
      - stepNumber: 5
        description: 'Gather the effective role set: the built-in roles merged over the stored ones'
        type: call
        targetComponent: role_repository
        targetMethod: effective
      - stepNumber: 6
        description: >-
          Assemble the PermissionWorld (stored roles MERGED with the intrinsic built-in reserved
          roles such as 'sso-admin', which are always present without a seed row).
        type: local
      - stepNumber: 7
        description: Compute the scopes actionable for the capability plus their ancestor breadcrumb
        type: call
        targetComponent: permission_rules
        targetMethod: resolveVisibleScopes
      - stepNumber: 8
        description: Return the visible scopes
        type: return
        outcome: the visible scopes
  - name: world
    narrative:
      - stepNumber: 1
        description: Gather all organization units
        type: call
        targetComponent: organization_repository
        targetMethod: listUnits
      - stepNumber: 2
        description: Gather all project placements
        type: call
        targetComponent: organization_repository
        targetMethod: listPlacements
      - stepNumber: 3
        description: Gather the hosted records and project the member records' parent links
        type: call
        targetComponent: project_repository
        targetMethod: list
      - stepNumber: 4
        description: Gather every permission assignment
        type: call
        targetComponent: permission_repository
        targetMethod: listAssignments
      - stepNumber: 5
        description: 'Gather the effective role set: the built-in roles merged over the stored ones'
        type: call
        targetComponent: role_repository
        targetMethod: effective
      - stepNumber: 6
        description: >-
          Assemble and return the PermissionWorld over that effective role set, exactly as authorize
          assembles it
        type: return
        outcome: PermissionWorld
    detail: full
    symbol: gatherPermissionWorld
  - name: reach
    narrative:
      - stepNumber: 1
        description: Gather the permission world once, as world does
        type: call
        targetComponent: authorization
        targetMethod: world
      - stepNumber: 2
        description: For every given record id
        type: loop
        loopKind: forEach
        over: projectIds
        endStep: 5
      - stepNumber: 3
        description: Resolve the principal's project:read over the record's OWN project scope
        type: call
        targetComponent: permission_rules
        targetMethod: resolvePermission
      - stepNumber: 4
        description: Resolve its project:write over the same scope, collecting each record whose value is yes
        type: call
        targetComponent: permission_rules
        targetMethod: resolvePermission
      - stepNumber: 5
        description: >-
          Resolve the subsystem rungs the principal meets in the record — every subsystem carrying a
          setting that applies to the principal, with project:write resolved at it
        type: call
        targetComponent: permission_rules
        targetMethod: resolveSubsystemReach
      - stepNumber: 6
        description: Return the readable and writable record ids and the subsystem rungs met in them
        type: return
        outcome: FamilyReach
    detail: full
    symbol: resolveFamilyReach
  - name: explain
    narrative:
      - stepNumber: 1
        description: Gather the permission world once, as world does
        type: call
        targetComponent: authorization
        targetMethod: world
      - stepNumber: 2
        description: Resolve the given subject's effective permission for the capability at the target scope
        type: call
        targetComponent: permission_rules
        targetMethod: resolvePermission
      - stepNumber: 3
        description: Return it with its source and deciding rung
        type: return
        outcome: EffectivePermission
    detail: full
  - name: actionableProjects
    narrative:
      - stepNumber: 1
        description: Keep the visible scopes that are projects and not breadcrumb context, and answer their ids
        type: local
    symbol: actionableProjectIds
  - name: actionableUnits
    narrative:
      - stepNumber: 1
        description: Keep the visible scopes that are units and not breadcrumb context, and answer their ids
        type: local
    symbol: actionableUnitIds
detail: full
status: complete
