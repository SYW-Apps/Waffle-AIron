id: project_index_impl
name: Project Index Implementation
description: >-
  Read path over the project store's backing file: listings and the authorization-narrowed root
  resolution.
contract: iproject_index
sourcePath: src/server/projects.ts
injectedParams:
  - dataDir
methods:
  - name: resolveRoot
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the authorized binding for the selector — the same narrowing rules: a selector
          never widens scope, a wildcard or multi-project caller must name a project, and an
          unknown, inactive or out-of-scope project resolves to nothing
        type: call
        targetComponent: project_index
        targetMethod: resolveBinding
      - stepNumber: 2
        description: Return the binding's root path, or null when nothing resolved (no existence leak)
        type: return
        outcome: root path or null
    intent: >-
      Given an authenticated principal and an optional selector, returns the isolated root path of
      the target project: the sole authorized project when the token scopes exactly one, or the
      selector only when it lies within the principal's authorized set. Returns null for any project
      outside that set — the selector can never widen scope.
    symbol: indexResolveRoot
  - name: list
    narrative: []
    intent: >-
      Loads the persisted set and returns every hosted-project record, each member record carrying
      its derived rootPath (its family root's root joined with the memberPath chain).
    calls:
      - project_store.read
    symbol: listProjectRecords
  - name: existingRoot
    narrative: []
    intent: >-
      Refuses a malformed id with null, then loads the persisted set and returns the record's root:
      a family root's persisted rootPath, or for a member record its family root's rootPath joined
      with each memberPath down the parent chain (null when the chain is broken); null when no
      record holds the id.
    calls:
      - project_store.read
    symbol: existingProjectRoot
  - name: resolveBinding
    narrative:
      - stepNumber: 1
        description: >-
          Fix the target: the explicit selector, or the principal's single narrowing entry when it
          holds exactly one non-wildcard entry; a wildcard or multi-entry principal naming no
          selector gets null
        type: local
      - stepNumber: 2
        description: Is the target a deprecated member-qualified form ('projectId::alias', one alias per hop)?
        type: branch
        condition: the target contains '::'
        onFalseStep: 7
      - stepNumber: 3
        description: >-
          DEPRECATED for one release: parse the first segment as the family root id and the rest as
          the alias chain; a malformed qualifier, or a family root no active record holds, is null
        type: local
      - stepNumber: 4
        description: Walk the alias chain hop by hop from the family root's root
        type: loop
        loopKind: forEach
        over: aliases in the qualifier chain
        endStep: 5
      - stepNumber: 5
        label: hop
        description: >-
          Look the alias up among the current root's member declarations (project.yaml `members`, or
          a legacy L1 mount) and resolve its directory within the current root through the
          containment guard; an alias that declares no member is null — never the family root, never
          an internal subsystem
        type: call
        targetComponent: host_core_adapter
        targetMethod: resolveContainedProjectPath
      - stepNumber: 6
        description: >-
          Map the reached directory to the member record whose parentProjectId and memberPath name
          it, and keep the qualifier as via; a directory no record holds (an un-upgraded data dir)
          is null
        type: local
      - stepNumber: 7
        label: authorize
        description: >-
          Authorize by the project chain: the target record is covered iff the principal holds '*',
          an entry equal to its id, or an entry naming a record the target descends from through
          parentProjectId (an entry that is itself a deprecated qualifier is mapped to its record
          the same way first) — a token for a project reaches its members, as a grant does.
          Uncovered is null with no existence leak
        type: local
      - stepNumber: 8
        description: Load the target record; a missing or inactive record is null
        type: local
      - stepNumber: 9
        description: Is the target a member record?
        type: branch
        condition: the record carries parentProjectId
        onFalseStep: 12
      - stepNumber: 10
        description: >-
          Derive the member's root: walk parentProjectId up to the family root (which persists its
          root), then join each memberPath back down through the containment guard, and check the
          directory still holds a project whose id is the record's (a moved member answers null
          until reconcile relocates its record); a broken chain (a parent record gone) is null
        type: call
        targetComponent: host_core_adapter
        targetMethod: resolveContainedProjectPath
      - stepNumber: 11
        description: >-
          Read the project configuration at the derived root and require its id to be the record's;
          a mismatch (the member moved, or another project sits there) is null
        type: call
        targetComponent: host_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 12
        label: bind
        description: >-
          Return the binding: the bound root, the record's own id, its family root id, and via when
          a deprecated qualifier resolved it
        type: return
        outcome: ProjectBinding or null
    detail: full
    symbol: indexResolveBinding
  - name: family
    narrative: []
    intent: >-
      Loads the persisted set, climbs parentProjectId from the given record to its family root, then
      collects the family root followed by every record whose parent chain reaches it, depth-first
      in the order the parents declare them, each member with its derived rootPath. Returns [] for
      an unknown id. Reads no project file.
    calls:
      - project_store.read
    symbol: listFamilyRecords
  - name: declaredMembers
    narrative: []
    intent: >-
      Loads the persisted set and the family root record, then walks the family on disk from its
      root: for each root, reads its project configuration and follows every `members` entry with a
      contained source (and, for one release, a legacy L1 mount) through the containment guard,
      reads the member's own project id from its project.yaml, and recurses into it. Stage 8: a
      `hosted:` member is its own top-level record and is not followed; a `../` or git source is
      never read on a hosted instance and is answered unreadable with that reason; a member whose
      content is a PART (no id, no L0, no lock) gets no record — a record it held as a project is
      answered `retire` ("part of <parent>"), and the walk does not recurse into it. Each project
      member is answered as the record it should hold — id, parentProjectId the declaring project's
      id, memberPath as declared — with the qualifier that bound it before stage 7 and its action
      against the stored records: register when no record holds the id, relocate when one does with
      another parent or path, rename when a record of another id holds this parent and path, return
      when the record agreeing with it is disabled (it left the family, or was retired as a part,
      and is declared again as a project), unchanged when it agrees and is active, unreadable when
      its declaration, directory or project.yaml cannot be followed or read (never skipped), with
      the reason: the declaration's own problem, a path escaping its parent, a missing directory, a
      project.yaml that cannot be read or fails its schema, or no valid project id. Writes nothing.
    calls:
      - project_store.read
      - host_core_adapter.loadProjectConfig
      - host_core_adapter.resolveContainedProjectPath
    symbol: planMemberRecords
  - name: repositoryScope
    narrative: []
    intent: >-
      Loads the persisted set, climbs from the record to its family root and answers the family
      root's id and root as the repository, with the record's own pathspec: '.wai/' for a family
      root, the memberPath chain joined with forward slashes plus '/.wai/' for a member. Null for an
      unknown id or a broken parent chain.
    calls:
      - project_store.read
    symbol: projectRepositoryScope
  - name: isRetiredPart
    narrative: []
    detail: intent
    intent: >-
      True when the record is disabled, names a parent, and its folder exists and holds no project
      content (no `.wai/specs/.index.yaml`, no `.wai/lock.json`, no id in its `.wai/project.yaml`):
      a member retired as a part by a demote (stage 8). Any other record — active, top-level, or one
      whose folder still holds a project — is false. Reads the folder; writes nothing.
  - name: declaredSubsystems
    narrative: []
    intent: >-
      Loads the persisted set and derives the record's root (null when the id holds no record or its
      root is missing on disk), then reads the subsystem specs of the tree at that root, bound for
      the read, through the host core adapter — a part's subsystems are read as the root's own — and
      answers each subsystem's local id (a key's namespace stripped). Writes nothing.
    calls:
      - project_store.read
      - host_core_adapter.loadSubsystemSpecs
    symbol: declaredSubsystemIds
  - name: partSubsystems
    narrative: []
    intent: >-
      Loads the persisted set and derives the record's root (null when it holds no record or its
      root is missing), reads the member declarations in its project.yaml and finds the contained
      member declared under the alias (null when none), resolves the part's folder through the
      containment guard, and reads the subsystem specs in that folder, bound for the read, through
      the host core adapter, answering each one's local id. Writes nothing.
    calls:
      - project_store.read
      - host_core_adapter.resolveContainedProjectPath
      - host_core_adapter.loadSubsystemSpecs
    symbol: partSubsystemIds
  - name: admitNarrowing
    narrative: []
    intent: >-
      Answers '*' as it is; parses the entry as a project id, optionally member-qualified, refusing
      one that is neither; maps a deprecated member-qualified entry to the member's record id by
      walking the aliases each root declares, refusing an alias no record holds; otherwise loads the
      persisted set and refuses a project id no record has. Answers the record id to store.
    calls:
      - project_store.read
    symbol: assertMintableNarrowingEntry
status: complete
