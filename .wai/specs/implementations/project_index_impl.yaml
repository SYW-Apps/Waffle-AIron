id: project_index_impl
name: Project Index Implementation
description: >-
  Read path over the project store's backing file: listings and the authorization-narrowed root
  resolution.
contract: iproject_index
sourcePath: src/server/projects.ts
injectedParams:
  - dataDir
methods:
  - name: resolveRoot
    narrative:
      - stepNumber: 1
        description: >-
          Derive the authorized project set and the wildcard flag from the principal's project
          narrowing
        type: local
      - stepNumber: 2
        description: Is a project selector named?
        type: branch
        condition: a selector is named
        onTrueStep: 3
        onFalseStep: 5
      - stepNumber: 3
        description: A selector can never widen scope past a non-wildcard narrowing
        type: branch
        condition: the caller is not wildcard and the selector is outside the authorized set
        onTrueStep: 4
        onFalseStep: 6
      - stepNumber: 4
        description: 'Refuse: the selector is out of scope'
        type: return
        outcome: null — selector cannot widen scope
      - stepNumber: 5
        description: Without a selector, only a single-project non-wildcard caller has an implicit target
        type: branch
        condition: no wildcard and exactly one authorized project
        onTrueStep: 6
        onFalseStep: 8
      - stepNumber: 6
        description: Fix the target project id (the named selector, or the single authorized project)
        type: local
      - stepNumber: 7
        description: Continue with the fixed target, skipping the no-implicit-target refusal
        type: jump
        toStep: 9
      - stepNumber: 8
        description: 'Refuse: a wildcard or multi-project caller must name a project'
        type: return
        outcome: null — no implicit target
      - stepNumber: 9
        description: Reject a syntactically invalid project id
        type: branch
        condition: the target id is not a valid project id
        onTrueStep: 10
        onFalseStep: 11
      - stepNumber: 10
        description: 'Refuse: invalid project id'
        type: return
        outcome: null — invalid id
      - stepNumber: 11
        description: Load the project records and look up the target record
        type: local
      - stepNumber: 12
        description: Only an existing ACTIVE project resolves
        type: branch
        condition: the record is missing or not active
        onTrueStep: 13
        onFalseStep: 14
      - stepNumber: 13
        description: 'Refuse: unknown or inactive project (no existence leak)'
        type: return
        outcome: null — unknown or inactive
      - stepNumber: 14
        description: Return the project's isolated root path
        type: return
        outcome: the isolated root path
    intent: >-
      Given an authenticated principal and an optional selector, returns the isolated root path of
      the target project: the sole authorized project when the token scopes exactly one, or the
      selector only when it lies within the principal's authorized set. Returns null for any project
      outside that set — the selector can never widen scope.
    symbol: resolveProjectRoot
  - name: list
    narrative: []
    intent: >-
      Loads the persisted set and returns every hosted-project record, each member record carrying
      its derived rootPath (its family root's root joined with the memberPath chain).
    calls:
      - project_store.read
    symbol: listProjectRecords
  - name: existingRoot
    narrative: []
    intent: >-
      Refuses a malformed id with null, then loads the persisted set and returns the record's root:
      a family root's persisted rootPath, or for a member record its family root's rootPath joined
      with each memberPath down the parent chain (null when the chain is broken); null when no
      record holds the id.
    calls:
      - project_store.read
    symbol: existingProjectRoot
  - name: resolveBinding
    narrative:
      - stepNumber: 1
        description: >-
          Fix the target: the explicit selector, or the principal's single narrowing entry when it
          holds exactly one non-wildcard entry; a wildcard or multi-entry principal naming no
          selector gets null
        type: local
      - stepNumber: 2
        description: Is the target a deprecated member-qualified form ('projectId::alias', one alias per hop)?
        type: branch
        condition: the target contains '::'
        onFalseStep: 7
      - stepNumber: 3
        description: >-
          DEPRECATED for one release: parse the first segment as the family root id and the rest as
          the alias chain; a malformed qualifier, or a family root no active record holds, is null
        type: local
      - stepNumber: 4
        description: Walk the alias chain hop by hop from the family root's root
        type: loop
        loopKind: forEach
        over: aliases in the qualifier chain
        endStep: 5
      - stepNumber: 5
        label: hop
        description: >-
          Look the alias up among the current root's member declarations (project.yaml `members`, or
          a legacy L1 mount) and resolve its directory within the current root through the
          containment guard; an alias that declares no member is null — never the family root, never
          an internal subsystem
        type: call
        targetComponent: host_core_adapter
        targetMethod: resolveContainedProjectPath
      - stepNumber: 6
        description: >-
          Map the reached directory to the member record whose parentProjectId and memberPath name
          it, and keep the qualifier as via; a directory no record holds (an un-upgraded data dir)
          is null
        type: local
      - stepNumber: 7
        label: authorize
        description: >-
          Authorize by the project chain: the target record is covered iff the principal holds '*',
          an entry equal to its id, or an entry naming a record the target descends from through
          parentProjectId (an entry that is itself a deprecated qualifier is mapped to its record
          the same way first) — a token for a project reaches its members, as a grant does.
          Uncovered is null with no existence leak
        type: local
      - stepNumber: 8
        description: Load the target record; a missing or inactive record is null
        type: local
      - stepNumber: 9
        description: Is the target a member record?
        type: branch
        condition: the record carries parentProjectId
        onFalseStep: 12
      - stepNumber: 10
        description: >-
          Derive the member's root: walk parentProjectId up to the family root (which persists its
          root), then join each memberPath back down through the containment guard, and check the
          directory still holds a project whose id is the record's (a moved member answers null
          until reconcile relocates its record); a broken chain (a parent record gone) is null
        type: call
        targetComponent: host_core_adapter
        targetMethod: resolveContainedProjectPath
      - stepNumber: 11
        description: >-
          Read the project configuration at the derived root and require its id to be the record's;
          a mismatch (the member moved, or another project sits there) is null
        type: call
        targetComponent: host_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 12
        label: bind
        description: >-
          Return the binding: the bound root, the record's own id, its family root id, and via when
          a deprecated qualifier resolved it
        type: return
        outcome: ProjectBinding or null
    detail: full
    symbol: resolveProjectBinding
  - name: family
    narrative: []
    intent: >-
      Loads the persisted set, climbs parentProjectId from the given record to its family root, then
      collects the family root followed by every record whose parent chain reaches it, depth-first
      in the order the parents declare them, each member with its derived rootPath. Returns [] for
      an unknown id. Reads no project file.
    calls:
      - project_store.read
    symbol: listFamilyRecords
  - name: declaredMembers
    narrative: []
    intent: >-
      Loads the persisted set and the family root record, then walks the family on disk from its
      root: for each root, reads its project configuration and follows every `members` entry (and,
      for one release, a legacy L1 mount) through the containment guard, reads the member's own
      project id from its project.yaml, and recurses into it. Each member is answered as the record
      it should hold — id, parentProjectId the declaring project's id, memberPath as declared — with
      the qualifier that bound it before stage 7 and its action against the stored records: register
      when no record holds the id, relocate when one does with another parent or path, unchanged
      when it agrees, unreadable when its directory or project.yaml cannot be read (never skipped).
      Writes nothing.
    calls:
      - project_store.read
      - host_core_adapter.loadProjectConfig
      - host_core_adapter.resolveContainedProjectPath
    symbol: planMemberRecords
  - name: repositoryScope
    narrative: []
    intent: >-
      Loads the persisted set, climbs from the record to its family root and answers the family
      root's id and root as the repository, with the record's own pathspec: '.wai/' for a family
      root, the memberPath chain joined with forward slashes plus '/.wai/' for a member. Null for an
      unknown id or a broken parent chain.
    calls:
      - project_store.read
    symbol: projectRepositoryScope
status: complete
createdAt: '2026-07-19T09:00:19.960Z'
