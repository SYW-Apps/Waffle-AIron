id: surface_projector_impl
name: Surface Projector Implementation
description: >-
  Contract-grade projection over the resolved export table, with audience filtering and type-closure
  computation.
contract: isurface_projector
sourcePath: src/core/surfaces.ts
methods:
  - name: projectOwnSurface
    narrative:
      - stepNumber: 1
        description: Load the L0 system spec (its name keys the snapshot)
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: loadSystemSpec
      - stepNumber: 2
        description: >-
          Read the project's resolved export table — every public name bound to its canonical
          target, with its audience — instead of the raw L0 entries
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: resolveProjectExports
      - stepNumber: 3
        description: Load component specs (the canonical targets, their stereotypes and dispatch tables)
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: loadComponentSpecs
      - stepNumber: 4
        description: Load interface specs (the full L3 contracts)
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: loadInterfaceSpecs
      - stepNumber: 5
        description: Load type specs (closure source and exported types)
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: loadTypeSpecs
      - stepNumber: 6
        description: Filter the resolved entries to those at or below the audience ceiling
        type: local
      - stepNumber: 7
        description: >-
          For each component entry, copy the full contract of its canonical target under the entry's
          public name — methods with params, returns, guarantees, effect, endpoints, narrowed to the
          entry's interface when it narrows — plus the component's dispatch table, recording the
          target's componentType and the narrowed interface
        type: local
      - stepNumber: 8
        description: >-
          Copy the backing Portal's authentication requirement and basePath onto each surface
          contract entry: set the entry's `auth` to the portal's projected PortalAuth (its security
          scheme, or none) and the entry's `basePath` to the portal's basePath, so the codec can
          emit per-portal OpenAPI servers and securitySchemes.
        type: local
      - stepNumber: 9
        description: >-
          List each type entry as an exported type under its public name, and compute the transitive
          type closure of every exported signature and every exported type, gathered by qualified id
          so two subsystems' types of one name both arrive
        type: local
      - stepNumber: 10
        description: >-
          Read the project's configuration through the core adapter for its effective id
          (project_config.effectiveId), which the snapshot records beside its name
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 11
        description: Read the spec tree's current StateId through the core adapter
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: computeStateId
      - stepNumber: 12
        description: >-
          Stamp identity (the system name and, when the project has a configuration, its effective
          id), origin generated, the current StateId, and generatedAt
        type: local
      - stepNumber: 13
        description: Return the self-contained snapshot
        type: return
        outcome: SurfaceSnapshot
  - name: projectChildSurface
    narrative:
      - stepNumber: 1
        description: >-
          Derive the family ceiling: a chained child is part of the system family, so
          project-audience entries are included
        type: local
      - stepNumber: 2
        description: Project the own surface at the family ceiling
        type: call
        targetComponent: surface_projector
        targetMethod: projectOwnSurface
      - stepNumber: 3
        description: Re-stamp the snapshot as scoped to the receiving child (provenance note)
        type: local
      - stepNumber: 4
        description: Return the child-scoped snapshot
        type: return
        outcome: SurfaceSnapshot
  - name: projectSubsystemSurface
    narrative:
      - stepNumber: 1
        description: Load the L0 system spec (the system name keys the sibling snapshot)
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: loadSystemSpec
      - stepNumber: 2
        description: >-
          Load subsystem specs and resolve the target subsystem's L1 publicInterfaces (its published
          surface)
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: loadSubsystemSpecs
      - stepNumber: 3
        description: Load component specs (the subsystem's inbound Portal and its dispatch table)
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: loadComponentSpecs
      - stepNumber: 4
        description: Load interface specs (the full L3 contracts)
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: loadInterfaceSpecs
      - stepNumber: 5
        description: Load type specs (closure source)
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: loadTypeSpecs
      - stepNumber: 6
        description: >-
          Resolve the target subsystem's published entries to the components that can legally serve
          a cross-boundary caller — a Portal, or an Observer for an event surface: the Portal the
          boundary rules sanction as a cross-subsystem dependency target, plus the Observer that may
          back a MessageBus public interface — and copy the full contracts at the family ('project')
          ceiling: methods with params, returns, guarantees, effect, endpoints, the dispatch table,
          and the backing component's projected auth and basePath. Siblings expose exactly what they
          publish, nothing wider; a published entry whose backing component can never be a
          cross-boundary target is collected as unprojectable rather than exported.
        type: local
      - stepNumber: 7
        description: >-
          Report each unprojectable published entry as a non-fatal diagnostic naming the subsystem,
          the entry's backing component and its stereotype (the same skipped-what-and-why shape the
          variant loader uses), so a gap in a child's sibling surface is explained at the moment the
          surfaces are generated instead of being discovered later as unexplained missing contracts.
          Unbound entries and entries naming a component that does not exist are NOT reported here —
          the validator already raises those as errors.
        type: local
      - stepNumber: 8
        description: Compute the transitive type closure of every exported signature and embed the definitions
        type: local
      - stepNumber: 9
        description: Read the spec tree's current StateId through the core adapter
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: computeStateId
      - stepNumber: 10
        description: >-
          Stamp projectName '<systemName>::<subsystemId>', origin generated, the current StateId,
          and generatedAt
        type: local
      - stepNumber: 11
        description: Return the self-contained sibling snapshot
        type: return
        outcome: SurfaceSnapshot
status: complete
