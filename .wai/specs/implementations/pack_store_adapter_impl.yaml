id: pack_store_adapter_impl
name: Pack Store Adapter Implementation
description: >-
  Filesystem management of the installed-pack store, in src/core/packstore.ts. Versioned layout
  (<name>/<version>/) with a sibling install record per pack, plus content digesting and
  latest-version resolution. Backwards compatible with the pre-versioned flat store so an existing
  install keeps working while projects migrate to explicit selection.
contract: ipack_store_adapter
sourcePath: src/core/packstore.ts
methods:
  - name: packStoreDir
    narrative: []
    intent: >-
      Returns WAIRON_PACKS_DIR when set, else ~/.wairon/packs — the same directory the pack source
      adapter has always treated as the global pool, so an existing install needs no move.
  - name: listInstalledPacks
    narrative: []
    intent: >-
      Scans the store one level for pack names, then a second level for version directories, reading
      each pack's install record for its digest, origin, and provenance (recomputing the digest when
      the record is missing or unreadable). A scoped name (`@scope/pack`) is stored nested, so a
      top-level folder starting with `@` is a scope: its subfolders are the pack names, each read
      like a top-level one under the name `@scope/<folder>`. Entries are grouped by name and ordered
      newest version first. A legacy flat entry — a bare *.yaml/*.cjs pack file, or a pack directory
      holding an entry file directly rather than version subdirectories — is reported at version
      "0.0.0-unversioned". A missing or unreadable store is an empty list, never an error: having no
      packs installed is a normal state.
  - name: resolveInstalledPack
    narrative: []
    intent: >-
      Filters the installed set to the requested name; with a version pin, returns that exact
      version or null; without one, returns the highest version by semver-lite comparison (stable
      outranks a pre-release at the same base). Null is a normal answer meaning "declared but not
      installed", which the caller reports rather than silently continuing with less doctrine.
  - name: installPackFromDirectory
    narrative: []
    intent: >-
      Reads the pack's manifest to learn its declared name and version (defaulting the version to
      "0.0.0-unversioned"), then, holding the store folder's install lock (the lock file the pack
      source names for every installer of a machine-wide packs folder, held with the shared
      generation lock primitive, so a hosted server installing into the same folder takes turns with
      it), refuses a pack another entry of the folder already declares (a file or folder of another
      name, found through the pack source; the source itself counts when it is an entry of the
      folder, since it stays there beside the copy), naming it, and copies the directory to
      <store>/<name>/<version>/ — replacing that exact version if it already exists so a reinstall
      is idempotent — computes the content digest of the copied files and writes the install record
      alongside it with the origin, digest, wairon version, and timestamp, all still under the lock
      so the digest and the record describe the files this install wrote. A source directory with no
      pack entry file is refused before anything is written. An installed version being replaced is
      first copied aside, nested in a fresh temporary folder so no packs folder lists it; a failure
      to copy it aside stops before anything is removed. A copy, digest or record that fails removes
      the version folder this install wrote and puts the earlier version back, so the store never
      lists a partial pack; when that removal fails the error says so and names the folder, and when
      putting the earlier version back fails, what the restore wrote is removed and the copy aside
      is kept and named in the error. The copy aside is dropped otherwise.
  - name: uninstallPack
    narrative: []
    intent: >-
      Removes <store>/<name>/<version>/ for a named version, or the whole <store>/<name>/ tree when
      no version is given, and prunes the now-empty name directory. Legacy flat entries are removed
      by their file path. Returns whether anything existed to remove; removing nothing is not an
      error.
  - name: computePackDigest
    narrative: []
    intent: >-
      Walks the pack directory for regular files, skipping the install record itself (it contains
      the digest, so including it would be self-referential) and version-control noise, then folds
      each file's forward-slash-normalized relative path and its bytes into one sha256 in sorted
      path order. Sorting and path normalization are what make the digest reproducible across
      platforms and independent of how the pack arrived.
detail: intent
lint:
  allow:
    - code: UNDECLARED_DEPENDENCY
      at: src/core/packstore.ts -> src/utils/file-lock.ts
      reason: >-
        The pack store's install takes the same generation lock primitive the hosted stores, the
        spec tree and the hosted pack installs take (src/utils/file-lock.ts, file_write_lock), on
        the install-lock file the pack source names for the folder: one safety-critical protocol
        every holder must follow. Like src/utils/fs.ts it is shared infrastructure below the
        subsystems; a second copy would be two implementations of one protocol that can drift apart,
        and routing a lock through sdd_host's portal would make core depend on the hosted server.
    - code: IMPORT_BYPASSES_PORTAL
      at: src/core/packstore.ts -> src/utils/file-lock.ts
      reason: >-
        Same import as the UNDECLARED_DEPENDENCY allow: the pack store uses the shared generation
        lock primitive directly, which no sdd_host portal publishes because it is not a capability
        of the hosted server.
status: complete
