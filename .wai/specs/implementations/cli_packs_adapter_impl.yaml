  - name: publishPack
    narrative:
      - stepNumber: 1
        description: >-
          Read the registry token from WAIRON_REGISTRY_TOKEN; without one, refuse, naming the
          registry's account page where a token is created
        type: local
      - stepNumber: 2
        description: Does the source (the current directory when absent) exist?
        type: call
        targetComponent: files_adapter
        targetMethod: exists
      - stepNumber: 3
        description: Is it a directory?
        type: call
        targetComponent: files_adapter
        targetMethod: stat
