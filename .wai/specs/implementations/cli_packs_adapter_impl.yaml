lint:
  allow:
    - code: UNDECLARED_DEPENDENCY
      at: src/commands/packs.ts -> src/utils/file-lock.ts
      reason: >-
        pack add holds a packs folder's install lock with the same generation lock primitive the
        hosted pack installs, the hosted stores and the spec tree take (src/utils/file-lock.ts,
        file_write_lock): one safety-critical protocol every holder must follow. Like
        src/utils/fs.ts it is shared infrastructure below the subsystems; a second copy in sdd_cli
        would be two implementations of one protocol that can drift apart, and routing a lock
        through sdd_host's portal would make the CLI depend on the hosted server.
    - code: IMPORT_BYPASSES_PORTAL
      at: src/commands/packs.ts -> src/utils/file-lock.ts
      reason: >-
        Same import as the UNDECLARED_DEPENDENCY allow: pack add uses the shared generation lock
        primitive directly, which no sdd_host portal publishes because it is not a capability of the
        hosted server.
