        type: call
        targetComponent: pack_registry_adapter
        targetMethod: publish
      - stepNumber: 9
        description: >-
          Report the result: published, with the version's page; already published, saying whether
          the stored integrity equals this archive's content or differs (a version is never reused,
          and a rebuilt archive differs by its build time); refused, with the registry's reason and
          each finding, and a non-zero exit
        type: local
    detail: calls-only
