        targetComponent: project_config_portal
        targetMethod: loadProjectConfig
      - stepNumber: 10
        description: >-
          Build the candidate: when the pack is applied exactly as asked, its stored entry with
          `remove` (the report then reads as what the pack accounts for now); otherwise the
          selection `pack use` would record for the request
        type: local
      - stepNumber: 11
        description: Measure it, writing nothing
        type: call
        targetComponent: validator_portal
        targetMethod: measurePackImpact
      - stepNumber: 12
        description: >-
          Print the report: the doctrine changes grouped by profile, the profiles that govern here,
