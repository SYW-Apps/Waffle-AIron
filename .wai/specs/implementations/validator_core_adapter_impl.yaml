id: validator_core_adapter_impl
name: Validator Core Adapter Implementation
description: >-
  sdd_validator's client hop into sdd_core, in a module of its own: identity re-exports of the core
  portals. The validator imports this module, so its calls into core land here — before, the
  forwards were local wrappers inside the validator's own file and the calls resolved straight into
  core's modules.
contract: ivalidator_core_adapter
sourcePath: src/core/adapters/validator-core.ts
simPath: tests/core/validation.test.ts
methods:
  - name: loadSystemSpec
    narrative:
      - stepNumber: 1
        description: Call loadSystemSpec on core portal
        type: call
        targetComponent: spec_tree_portal
        targetMethod: loadSystemSpec
  - name: loadSubsystemSpecs
    narrative:
      - stepNumber: 1
        description: Call loadSubsystemSpecs on core portal
        type: call
        targetComponent: spec_tree_portal
        targetMethod: loadSubsystemSpecs
  - name: loadComponentSpecs
    narrative:
      - stepNumber: 1
        description: Call loadComponentSpecs on core portal
        type: call
        targetComponent: spec_tree_portal
        targetMethod: loadComponentSpecs
  - name: loadInterfaceSpecs
    narrative:
      - stepNumber: 1
        description: Call loadInterfaceSpecs on core portal
        type: call
        targetComponent: spec_tree_portal
        targetMethod: loadInterfaceSpecs
  - name: loadImplementationSpecs
    narrative:
      - stepNumber: 1
        description: Call loadImplementationSpecs on core portal
        type: call
        targetComponent: spec_tree_portal
        targetMethod: loadImplementationSpecs
  - name: loadTypeSpecs
    narrative:
      - stepNumber: 1
        description: Call loadTypeSpecs on core portal
        type: call
        targetComponent: spec_tree_portal
        targetMethod: loadTypeSpecs
  - name: dryRunSerializeSpecs
    narrative:
      - stepNumber: 1
        description: Call dryRunSerializeSpecs on core portal
        type: call
        targetComponent: spec_tree_portal
        targetMethod: dryRunSerializeSpecs
    conformance: 'off'
  - name: loadProjectExtensions
    narrative:
      - stepNumber: 1
        description: Forward to the core portal to load and merge the governing extension packs.
        type: call
        targetComponent: extension_portal
        targetMethod: loadProjectExtensions
    detail: calls-only
  - name: loadProjectConfig
    narrative:
      - stepNumber: 1
        description: Forward to the core portal
        type: call
        targetComponent: project_config_portal
        targetMethod: loadProjectConfig
  - name: computeStateId
    narrative:
      - stepNumber: 1
        description: Call computeStateId on core portal
        type: call
        targetComponent: approval_portal
        targetMethod: computeStateId
  - name: consumedContractInputs
    narrative:
      - stepNumber: 1
        description: Call consumedContractInputs on core portal
        type: call
        targetComponent: spec_tree_portal
        targetMethod: consumedContractInputs
status: complete
