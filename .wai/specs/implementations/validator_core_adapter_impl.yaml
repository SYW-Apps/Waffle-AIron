id: validator_core_adapter_impl
name: Validator Core Adapter Implementation
description: >-
  sdd_validator's client hop into sdd_core, in a module of its own: identity re-exports of the core
  portals. The validator imports this module, so its calls into core land here — before, the
  forwards were local wrappers inside the validator's own file and the calls resolved straight into
  core's modules.
contract: ivalidator_core_adapter
sourcePath: src/core/adapters/validator-core.ts
simPath: tests/core/validation.test.ts
methods:
  - name: loadSystemSpec
    narrative:
      - stepNumber: 1
        description: Call loadSystemSpec on core portal
        type: call
        targetComponent: spec_tree_portal
        targetMethod: loadSystemSpec
  - name: loadSubsystemSpecs
    narrative:
      - stepNumber: 1
