id: upgrade_core_adapter_impl
name: Upgrade Core Adapter Implementation
description: >-
  src/upgrade/adapters/core.ts: in-process imports of the sdd_core, sdd_validator and approval
  barrels, each bound to the root the caller bound.
contract: iupgrade_core_adapter
sourcePath: src/upgrade/adapters/core.ts
methods:
  - name: findLegacySpecFiles
    narrative:
      - stepNumber: 1
        description: Forward to the spec maintenance portal
        type: call
        targetComponent: spec_maintenance_portal
        targetMethod: findLegacySpecFiles
  - name: writeLockRecord
    narrative:
      - stepNumber: 1
        description: Forward to the approval portal
        type: call
        targetComponent: approval_portal
        targetMethod: writeLockRecord
  - name: computeApprovalId
    narrative:
      - stepNumber: 1
        description: Forward to the validator portal
        type: call
        targetComponent: validator_portal
        targetMethod: computeApprovalId
    symbol: computeApprovalId
  - name: projectFamily
    narrative:
      - stepNumber: 1
        description: Forward to the core portal
        type: call
        targetComponent: spec_tree_portal
        targetMethod: projectFamily
  - name: getLoaderIssues
    narrative:
      - stepNumber: 1
        description: >-
          Scan the bound tree first: a rehearsal copy nothing has loaded yet records no diagnostics,
          so reading them before a scan would report none
        type: call
        targetComponent: spec_tree_portal
        targetMethod: scanAllSpecs
      - stepNumber: 2
        description: Forward to the core portal
        type: call
        targetComponent: spec_tree_portal
        targetMethod: getLoaderIssues
  - name: captureApprovedSpecs
    narrative:
      - stepNumber: 1
        description: Forward to the approval portal
        type: call
        targetComponent: approval_portal
        targetMethod: captureApprovedSpecs
  - name: resolvedPacks
    narrative:
      - stepNumber: 1
        description: Forward to the validator portal
        type: call
        targetComponent: validator_portal
        targetMethod: resolvedPacks
  - name: loadProjectConfig
    narrative:
      - stepNumber: 1
        description: Forward to the project config portal
        type: call
        targetComponent: project_config_portal
        targetMethod: loadProjectConfig
  - name: validateProject
    narrative:
      - stepNumber: 1
        description: Forward to the validator portal
        type: call
        targetComponent: validator_portal
        targetMethod: validateProject
  - name: listRules
    narrative:
      - stepNumber: 1
        description: Forward to the validator portal
        type: call
        targetComponent: validator_portal
        targetMethod: listRules
  - name: resolveExternals
    narrative:
      - stepNumber: 1
        description: Forward to the spec tree portal
        type: call
        targetComponent: spec_tree_portal
        targetMethod: resolveExternals
  - name: removeExternal
    narrative:
      - stepNumber: 1
        description: Forward to the project configuration portal
        type: call
        targetComponent: project_config_portal
        targetMethod: removeExternal
  - name: declareExternal
    narrative:
      - stepNumber: 1
        description: Forward to the project configuration portal
        type: call
        targetComponent: project_config_portal
        targetMethod: declareExternal
status: draft
createdAt: '2026-10-18T14:14:23.627Z'
updatedAt: '2026-11-27T22:43:54.248Z'
