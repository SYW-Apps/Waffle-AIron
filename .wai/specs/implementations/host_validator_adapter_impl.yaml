id: host_validator_adapter_impl
name: Host Validator Client Adapter Implementation
description: >-
  Forwards the as-complete conformance run and the gate identity computation to the validator
  portal.
contract: ihost_validator_adapter
sourcePath: src/server/adapters.ts
methods:
  - name: validateAsComplete
    narrative:
      - stepNumber: 1
        description: >-
          Read the bound project's configuration through the host core adapter: its rule severities
          and projectType govern the as-complete gate
        type: call
        targetComponent: host_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 2
        description: Forward the as-complete validation to the validator portal
        type: call
        targetComponent: validator_portal
        targetMethod: validateAsComplete
    symbol: validateProjectAsComplete
  - name: computeGateStateId
    narrative:
      - stepNumber: 1
        description: Forward the gate identity computation to the validator portal
        type: call
        targetComponent: validator_portal
        targetMethod: computeGateStateId
