id: host_validator_adapter_impl
name: Host Validator Client Adapter Implementation
description: >-
  Forwards the as-complete conformance run and the gate identity computation to the validator
  portal.
contract: ihost_validator_adapter
sourcePath: src/server/adapters/validator.ts
methods:
  - name: validateAsComplete
    narrative:
      - stepNumber: 1
        description: >-
          Read the bound project's configuration through the host core adapter: its rule severities
          and projectType govern the as-complete gate
        type: call
        targetComponent: host_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 2
        description: Forward the as-complete validation to the validator portal
        type: call
        targetComponent: validator_portal
        targetMethod: validateAsComplete
  - name: computeGateStateId
    narrative:
      - stepNumber: 1
        description: Forward the gate identity computation to the validator portal
        type: call
        targetComponent: validator_portal
        targetMethod: computeGateStateId
  - name: builtinProfileIds
    narrative:
      - stepNumber: 1
        description: Forward to the validator portal
        type: call
        targetComponent: validator_portal
        targetMethod: builtinProfileIds
    detail: calls-only
  - name: builtinProjectKinds
    narrative:
      - stepNumber: 1
        description: Forward to the validator portal
        type: call
        targetComponent: validator_portal
        targetMethod: builtinProjectKinds
    detail: calls-only
  - name: measurePackImpact
    narrative:
      - stepNumber: 1
        description: Forward the measurement to the validator portal, under the project root the caller bound
        type: call
        targetComponent: validator_portal
        targetMethod: measurePackImpact
  - name: measurePackDoctrine
    narrative:
      - stepNumber: 1
        description: Forward the doctrine measurement to the validator portal
        type: call
        targetComponent: validator_portal
        targetMethod: measurePackDoctrine
  - name: familyApprovals
    narrative:
      - stepNumber: 1
        description: Forward to the validator portal's pin tree
        type: call
        targetComponent: validator_portal
        targetMethod: familyApprovals
  - name: familyRelations
    narrative:
      - stepNumber: 1
        description: Forward to the validator portal's relation health
        type: call
        targetComponent: validator_portal
        targetMethod: familyRelations
status: complete
createdAt: '2026-07-04T12:53:08.409Z'
updatedAt: '2026-10-03T12:15:32.493Z'
