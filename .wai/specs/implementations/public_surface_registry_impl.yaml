id: public_surface_registry_impl
name: Public Surface Registry Implementation
description: >-
  Write path for redacted public-surface snapshots: server-side timestamp stamping and durable
  single-per-project replacement, as ONE store update on the set read fresh under
  public-surfaces.json's write lock. Preserves the orchestrator-redacted interfaces verbatim;
  performs no redaction or authorization.
contract: ipublic_surface_registry
sourcePath: src/server/surfaces.ts
methods:
  - name: replaceSnapshot
    narrative: []
    intent: >-
      In one store update: replace the snapshot for its projectId in the set read under the lock
      (one snapshot per project), stamping exportedAt to the current server time while preserving
      the orchestrator-supplied redacted interfaces, systemName, stateId, and exportedBy verbatim;
      return the stored snapshot. A failure leaves the previous set intact. Redaction and
      authorization are enforced by the orchestrator, not here.
    calls:
      - public_surface_store.update
detail: intent
status: complete
