  - name: at
    narrative:
      - stepNumber: 1
        description: >-
          Bind the file adapter to the root and compose the facade over it: reads forward to the
          index, writes to the registry, both over that root
        type: local
    symbol: projectConfigRepositoryAt
lint:
  allow:
    - code: FACADE_FORWARDING
      at: at
      reason: >-
        The facade's `at` method binds the Repository itself to a root, not a read or write to
        forward: it composes the owned members (the file adapter, store, registry and index) over
        rootDir and answers the facade over them. There is no member method it could forward 1:1 to,
        because what it returns IS the Repository; every other method of this facade forwards 1:1,
        and this allow is held to `at` alone.
