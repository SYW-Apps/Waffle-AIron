id: pack_orchestrator_impl
name: Pack Orchestrator Implementation
description: >-
  Control-plane pack-management workflows: master-credential auth, then delegate to the pack
  registry at global scope, or bind the project's isolated root first for project scope. Installs
  are declarative-only; the registry enforces the schema and rejects code packs.
contract: ipack_orchestrator
sourcePath: src/server/packs.ts
methods:
  - name: listGlobalPacks
    narrative:
      - stepNumber: 1
        description: Authenticate the master credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateMaster
      - stepNumber: 2
        description: If not an admin principal, reject
        type: branch
        condition: not an admin principal
        onFalseStep: 4
      - stepNumber: 3
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 4
        description: List the server-global packs
        type: call
        targetComponent: pack_registry
        targetMethod: listGlobalPacks
      - stepNumber: 5
        description: Return the global pack descriptors
        type: return
        outcome: global pack list
  - name: installGlobalPack
    narrative:
      - stepNumber: 1
        description: Authenticate the master credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateMaster
      - stepNumber: 2
        description: If not an admin principal, reject
        type: branch
        condition: not an admin principal
        onFalseStep: 4
      - stepNumber: 3
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 4
        description: Install the declarative pack server-wide (the registry rejects code packs)
        type: call
        targetComponent: pack_registry
        targetMethod: installGlobalPack
      - stepNumber: 5
        description: Return the installed pack descriptor
        type: return
        outcome: installed pack descriptor
  - name: removeGlobalPack
    narrative:
      - stepNumber: 1
        description: Authenticate the master credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateMaster
      - stepNumber: 2
        description: If not an admin principal, reject
        type: branch
        condition: not an admin principal
        onFalseStep: 4
      - stepNumber: 3
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 4
        description: Remove the server-global pack
        type: call
        targetComponent: pack_registry
        targetMethod: removeGlobalPack
      - stepNumber: 5
        description: Return once removed
        type: return
        outcome: removed
  - name: listProjectPacks
    narrative:
      - stepNumber: 1
        description: Authenticate the master credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateMaster
      - stepNumber: 2
        description: If not an admin principal, reject
        type: branch
        condition: not an admin principal
        onFalseStep: 4
      - stepNumber: 3
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 4
        description: Bind the project's isolated root
        type: local
      - stepNumber: 5
        description: List the project's registered packs
        type: call
        targetComponent: pack_registry
        targetMethod: listProjectPacks
      - stepNumber: 6
        description: Return the project pack descriptors
        type: return
        outcome: project pack list
  - name: installProjectPack
    narrative:
      - stepNumber: 1
        description: Authenticate the master credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateMaster
      - stepNumber: 2
        description: If not an admin principal, reject
        type: branch
        condition: not an admin principal
        onFalseStep: 4
      - stepNumber: 3
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 4
        description: Bind the project's isolated root
        type: local
      - stepNumber: 5
        description: Install the declarative pack into the project (the registry rejects code packs)
        type: call
        targetComponent: pack_registry
        targetMethod: installProjectPack
      - stepNumber: 6
        description: Return the installed pack descriptor
        type: return
        outcome: installed pack descriptor
  - name: removeProjectPack
    narrative:
      - stepNumber: 1
        description: Authenticate the master credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateMaster
      - stepNumber: 2
        description: If not an admin principal, reject
        type: branch
        condition: not an admin principal
        onFalseStep: 4
      - stepNumber: 3
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 4
        description: Bind the project's isolated root
        type: local
      - stepNumber: 5
        description: Remove one of the project's registered packs
        type: call
        targetComponent: pack_registry
        targetMethod: removeProjectPack
      - stepNumber: 6
        description: Return once removed
        type: return
        outcome: removed
status: complete
createdAt: '2026-07-04T18:47:13.157Z'
updatedAt: '2026-07-04T18:48:00.822Z'
