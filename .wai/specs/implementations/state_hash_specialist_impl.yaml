id: state_hash_specialist_impl
name: State Hash Specialist Implementation
description: >-
  Deterministic content hash of the spec tree, and of the gate (tree + governing doctrine) that
  validated it.
contract: istate_hash_specialist
sourcePath: src/core/statehash.ts
methods:
  - name: hashSpecTree
    narrative:
      - stepNumber: 1
        description: Load the system spec
        type: call
        targetComponent: spec_loader
        targetMethod: loadSystemSpec
      - stepNumber: 2
        description: Load subsystem specs
        type: call
        targetComponent: spec_loader
        targetMethod: loadSubsystemSpecs
      - stepNumber: 3
        description: Load component specs
        type: call
        targetComponent: spec_loader
        targetMethod: loadComponentSpecs
      - stepNumber: 4
        description: Load interface specs
        type: call
        targetComponent: spec_loader
        targetMethod: loadInterfaceSpecs
      - stepNumber: 5
        description: Load implementation specs
        type: call
        targetComponent: spec_loader
        targetMethod: loadImplementationSpecs
      - stepNumber: 6
        description: Canonicalize the loaded specs (stable key ordering, normalized serialization)
        type: local
      - stepNumber: 7
        description: Digest the canonical form into a StateId (algorithm and hex digest)
        type: local
      - stepNumber: 8
        description: Return the StateId
        type: return
        outcome: StateId
    symbol: computeStateId
  - name: hashGateState
    narrative:
      - stepNumber: 1
        description: >-
          Load the spec tree through the loader — the same content hashSpecTree digests, so a gate
          StateId and a content StateId always agree about the specs.
        type: call
        targetComponent: spec_loader
        targetMethod: loadSystemSpec
      - stepNumber: 2
        description: >-
          Project the supplied doctrine onto its identity-bearing surface: pack
          names/versions/scopes, the merged profile and language tables, pattern ids, guarantee
          tokens, assertions, and programmatic rule names with their codes. Programmatic rules
          cannot be digested directly (they are functions), so their name+codes stand as their
          identity.
        type: local
      - stepNumber: 3
        description: >-
          Deliberately EXCLUDE pack skills and instruction blocks from the projection: neither can
          change a conformance verdict, and including them would invalidate every lock on a cosmetic
          documentation edit.
        type: local
      - stepNumber: 4
        description: >-
          Canonicalize the tree, the doctrine projection and the consumed contract inputs together
          (stable key ordering, volatile timestamps and snapshot provenance stripped, snapshots
          ordered by key) and digest them into one identity.
        type: local
      - stepNumber: 5
        description: >-
          Mark the algorithm as covering doctrine and inputs (sha256+doctrine+inputs) so a
          content-only StateId, or a gate StateId taken before inputs were covered, can never
          compare equal — every earlier lock record reads as STALE rather than as silently valid.
        type: local
      - stepNumber: 6
        description: Return the gate StateId.
        type: return
        outcome: gate StateId
    detail: full
lint:
  allow:
    - code: UNDECLARED_DEPENDENCY
      reason: >-
        statehash.ts reads the validator's built-in rule list to hash the doctrine a lock covers
        (doctrineIdentity.builtinRules). The edge predates the rule model PR; importing through the
        unmapped rules/index.ts barrel hid it. How sdd_core obtains the built-in rule identity
        (through sdd_validator's published surface, or passed in by the lock workflow) is an open
        decision recorded in .wai/phased_design.md under the doctrine PR; this allow is removed when
        that is decided.
status: complete
createdAt: '2026-07-04T12:54:31.981Z'
updatedAt: '2026-09-15T00:53:50.361Z'
