id: project_policy_orchestrator_impl
name: Project Policy Orchestrator Implementation
description: >-
  Profile-aware project initialization and pack/profile policy enforcement. Credential-bearing
  methods authenticate the caller and resolve their permissions through the authorization seam; two
  pre-authorized entries (executeApprovedInit, evaluateInitRequest) perform no authentication
  because the project-lifecycle chain has already authorized them and are never portal-exposed. A
  null active policy resolves to the documented permissive default (empty pack lists,
  requireProfileSelection false, enforcementMode 'warn'). Audit appends are best-effort and never
  fail the primary action.
contract: iproject_policy_orchestrator
sourcePath: src/server/policy.ts
methods:
  - name: initializeProjectWithProfile
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential (bootstrap or user-bound token)
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: >-
          Resolve the caller's project:create permission over the request's required owner unit
          through the authorization seam
        type: call
        targetComponent: authorization_specialist
        targetMethod: authorize
      - stepNumber: 3
        description: >-
          If the effective value is not yes, deny (an approval-valued caller must use the
          execute-primary project-lifecycle path)
        type: branch
        condition: the effective value is not yes
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the initialization
        type: throw
        error: Forbidden — creating a project requires project:create authority over the target unit
      - stepNumber: 5
        description: Read the active instance pack/profile policy (or null when none has ever been configured)
        type: call
        targetComponent: policy_repository
        targetMethod: getPackPolicy
      - stepNumber: 6
        description: >-
          When no policy has been configured (null), substitute the documented permissive default
          (empty requiredGlobalPacks/defaultProjectPacks, requireProfileSelection false,
          enforcementMode 'warn') as the effective policy
        type: local
      - stepNumber: 7
        description: >-
          Evaluate the request against the effective policy: detect a missing required profile
          selection, requested blocked packs, and unknown profile ids, collecting any violations
        type: local
      - stepNumber: 8
        description: >-
          If the effective policy enforces (enforcementMode 'block') and the evaluation found
          violations, reject
        type: branch
        condition: >-
          the effective policy enforces (enforcementMode 'block') and the evaluation found
          violations
        onFalseStep: 10
      - stepNumber: 9
        description: Reject the non-compliant initialization
        type: throw
        error: policy violation — project initialization rejected under the active pack policy
      - stepNumber: 10
        description: >-
          Create the hosted project via the admin plane's pre-authorized create entry, passing the
          request's required ownerUnitId so the project is placed at creation
        type: call
        targetComponent: admin_orchestrator
        targetMethod: executeApprovedCreate
      - stepNumber: 11
        description: Bind the created project's isolated root for pack application
        type: local
      - stepNumber: 12
        description: >-
          Resolve the policy's required/default declarative pack name set (requiredGlobalPacks then
          defaultProjectPacks) to their content via the pack registry — across both server-global
          tiers and both file- and directory-form packs — yielding the resolved packs (canonical
          name + content) and any names the instance cannot resolve.
        type: call
        targetComponent: pack_registry
        targetMethod: executeApprovedResolveGlobalPacks
      - stepNumber: 13
        description: For each RESOLVED required/default declarative pack
        type: loop
        loopKind: forEach
        over: the resolution's resolved packs (each carrying canonical name + content)
        endStep: 14
      - stepNumber: 14
        description: >-
          Vendor and register each resolved declarative pack into the new project by its canonical
          name via the pre-authorized entry.
        type: call
        targetComponent: pack_registry
        targetMethod: executeApprovedInstallProjectPack
      - stepNumber: 15
        description: >-
          Record the resolved ProjectProfileSelection (the request's selected profile ids plus the
          policy's required profile ids and required/default pack names, stamped selectedBy from the
          caller and selectedAt) into the project's config
        type: local
      - stepNumber: 16
        description: Append a redacted audit event without letting a failure fail the initialization
        type: try
        endStep: 18
        catches:
          - error: audit append failure
            step: 19
      - stepNumber: 17
        description: >-
          Append the redacted project.init.policy audit event (noting any required/default packs the
          instance could not resolve) under the active retention policy.
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 18
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 20
      - stepNumber: 19
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 20
        description: Return the created hosted project record
        type: return
        outcome: created hosted project record
  - name: executeApprovedInit
    narrative:
      - stepNumber: 1
        description: >-
          Read the active instance pack/profile policy (or null when none has ever been configured);
          this entry performs no authentication — the project-lifecycle chain has already authorized
          it
        type: call
        targetComponent: policy_repository
        targetMethod: getPackPolicy
      - stepNumber: 2
        description: >-
          When no policy has been configured (null), substitute the documented permissive default
          (empty pack lists, requireProfileSelection false, enforcementMode 'warn') as the effective
          policy
        type: local
      - stepNumber: 3
        description: >-
          Evaluate the request against the effective policy: detect a missing required profile
          selection, requested blocked packs, and unknown profile ids, collecting any violations
        type: local
      - stepNumber: 4
        description: >-
          If the effective policy enforces (enforcementMode 'block') and the evaluation found
          violations, reject
        type: branch
        condition: >-
          the effective policy enforces (enforcementMode 'block') and the evaluation found
          violations
        onFalseStep: 6
      - stepNumber: 5
        description: Reject the non-compliant initialization
        type: throw
        error: policy violation — project initialization rejected under the active pack policy
      - stepNumber: 6
        description: >-
          Create the hosted project via the admin plane's pre-authorized create entry, passing the
          request's required ownerUnitId so the project is placed at creation
        type: call
        targetComponent: admin_orchestrator
        targetMethod: executeApprovedCreate
      - stepNumber: 7
        description: Bind the created project's isolated root for pack application
        type: local
      - stepNumber: 8
        description: >-
          Resolve the policy's required/default declarative pack name set (requiredGlobalPacks then
          defaultProjectPacks) to their content via the pack registry — across both server-global
          tiers and both file- and directory-form packs — yielding the resolved packs (canonical
          name + content) and any names the instance cannot resolve.
        type: call
        targetComponent: pack_registry
        targetMethod: executeApprovedResolveGlobalPacks
      - stepNumber: 9
        description: For each RESOLVED required/default declarative pack
        type: loop
        loopKind: forEach
        over: the resolution's resolved packs (each carrying canonical name + content)
        endStep: 10
      - stepNumber: 10
        description: >-
          Vendor and register each resolved declarative pack into the new project by its canonical
          name via the pre-authorized entry.
        type: call
        targetComponent: pack_registry
        targetMethod: executeApprovedInstallProjectPack
      - stepNumber: 11
        description: >-
          Record the resolved ProjectProfileSelection (the request's selected profile ids plus the
          policy's required profile ids and required/default pack names, stamped selectedBy from the
          request and selectedAt) into the project's config
        type: local
      - stepNumber: 12
        description: Append a redacted audit event without letting a failure fail the initialization
        type: try
        endStep: 14
        catches:
          - error: audit append failure
            step: 15
      - stepNumber: 13
        description: >-
          Append the redacted project.init.policy audit event (noting any required/default packs the
          instance could not resolve) under the active retention policy.
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 14
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 16
      - stepNumber: 15
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 16
        description: Return the created hosted project record
        type: return
        outcome: created hosted project record
  - name: evaluateInitRequest
    narrative:
      - stepNumber: 1
        description: >-
          Read the active instance pack/profile policy (or null when none has ever been configured);
          this entry performs no authentication — the caller authenticated upstream
        type: call
        targetComponent: policy_repository
        targetMethod: getPackPolicy
      - stepNumber: 2
        description: >-
          When no policy has been configured (null), substitute the documented permissive default
          (empty pack lists, requireProfileSelection false, enforcementMode 'warn') as the effective
          policy
        type: local
      - stepNumber: 3
        description: >-
          Evaluate the ProjectInitRequest against the effective policy: flag a missing required
          profile selection (when requireProfileSelection is set and the request omits it),
          requested blocked packs, and profile ids not permitted by allowedProfileIds; build a
          PolicyEvaluationResult with the compliance flag, missing/blocked lists, an empty
          unresolvedPacks list (request-time evaluation does not probe instance-side pack
          availability), and human-readable messages. No side effects.
        type: local
      - stepNumber: 4
        description: Return the policy evaluation result
        type: return
        outcome: policy evaluation result
  - name: evaluateProjectPolicy
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: >-
          Resolve the caller's project:write permission over the target project (an instance-admin
          bypasses to yes)
        type: call
        targetComponent: authorization_specialist
        targetMethod: authorize
      - stepNumber: 3
        description: If the caller's project:write is not yes, deny
        type: branch
        condition: the effective project:write value is not yes
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the evaluation
        type: throw
        error: Forbidden — evaluating a project's policy requires project:write over the project
      - stepNumber: 5
        description: >-
          Resolve and bind the target project's isolated root within the principal's authorized set
          (rejects cross-project access)
        type: call
        targetComponent: project_registry
        targetMethod: resolveRoot
      - stepNumber: 6
        description: Read the active instance pack/profile policy (or null when none has ever been configured)
        type: call
        targetComponent: policy_repository
        targetMethod: getPackPolicy
      - stepNumber: 7
        description: >-
          When no policy has been configured (null), substitute the documented permissive default as
          the effective policy
        type: local
      - stepNumber: 8
        description: >-
          List the project's installed packs via the pre-authorized entry (the caller's mcp:write
          was already resolved)
        type: call
        targetComponent: pack_registry
        targetMethod: executeApprovedListProjectPacks
      - stepNumber: 9
        description: >-
          Resolve the policy's required/default pack name set (requiredGlobalPacks then
          defaultProjectPacks) via the pack registry, to obtain each resolvable pack's canonical
          name and the names the instance cannot resolve at all.
        type: call
        targetComponent: pack_registry
        targetMethod: executeApprovedResolveGlobalPacks
      - stepNumber: 10
        description: >-
          Evaluate the project's active packs and recorded profile selection against the effective
          policy USING THE RESOLUTION: compute missingPackNames (resolved required/default packs
          whose canonical name is absent from the project's installed packs), unresolvedPacks (the
          resolution's unresolved names — required/default packs with no server-global pack in
          either tier), blocked packs present, missing required profile ids, and human-readable
          messages. No side effects.
        type: local
      - stepNumber: 11
        description: Return the policy evaluation result
        type: return
        outcome: policy evaluation result
  - name: reconcileProjectPolicy
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: >-
          Resolve the caller's project:write permission over the target project (an instance-admin
          bypasses to yes)
        type: call
        targetComponent: authorization_specialist
        targetMethod: authorize
      - stepNumber: 3
        description: If the caller's project:write is not yes, deny
        type: branch
        condition: the effective project:write value is not yes
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the reconciliation
        type: throw
        error: Forbidden — reconciling a project's policy requires project:write over the project
      - stepNumber: 5
        description: >-
          Resolve and bind the target project's isolated root within the principal's authorized set
          (rejects cross-project access)
        type: call
        targetComponent: project_registry
        targetMethod: resolveRoot
      - stepNumber: 6
        description: Read the active instance pack/profile policy (or null when none has ever been configured)
        type: call
        targetComponent: policy_repository
        targetMethod: getPackPolicy
      - stepNumber: 7
        description: >-
          When no policy has been configured (null), substitute the documented permissive default as
          the effective policy
        type: local
      - stepNumber: 8
        description: >-
          List the project's installed packs via the pre-authorized entry (the caller's mcp:write
          was already resolved)
        type: call
        targetComponent: pack_registry
        targetMethod: executeApprovedListProjectPacks
      - stepNumber: 9
        description: >-
          Assemble the policy's required/default declarative pack name set (requiredGlobalPacks then
          defaultProjectPacks).
        type: local
      - stepNumber: 10
        description: >-
          Resolve the assembled required/default pack name set via the pack registry — across both
          server-global tiers and both file- and directory-form packs — yielding the resolved packs
          (canonical name + content) and the unresolved names the instance cannot satisfy.
        type: call
        targetComponent: pack_registry
        targetMethod: executeApprovedResolveGlobalPacks
      - stepNumber: 11
        description: >-
          If any resolved required/default pack is not yet installed in the project, apply the
          resolvable missing packs — regardless of enforcementMode, since this explicit
          reconciliation applies only the instance policy's own required/default packs; otherwise
          skip to building the result.
        type: branch
        condition: any resolved required/default pack is not yet installed in the project
        onFalseStep: 15
      - stepNumber: 12
        description: >-
          Select the resolved packs whose canonical name is not already installed in the project;
          their declarative content is already carried in the resolution.
        type: local
      - stepNumber: 13
        description: For each resolved pack to apply
        type: loop
        loopKind: forEach
        over: the resolved packs not already installed (canonical name + content)
        endStep: 14
      - stepNumber: 14
        description: >-
          Vendor and register each resolved pack into the project by its canonical name via the
          pre-authorized entry.
        type: call
        targetComponent: pack_registry
        targetMethod: executeApprovedInstallProjectPack
      - stepNumber: 15
        description: >-
          Re-list the project's installed packs and build the PolicyEvaluationResult reflecting
          post-reconciliation state: remaining missingPackNames, unresolvedPacks (the resolution's
          unresolved names), blocked packs present, missing required profile ids, and human-readable
          messages.
        type: local
      - stepNumber: 16
        description: Append a redacted audit event without letting a failure fail the reconciliation
        type: try
        endStep: 18
        catches:
          - error: audit append failure
            step: 19
      - stepNumber: 17
        description: >-
          Append the redacted policy.reconcile audit event (noting the packs applied and any
          required/default packs the instance could not resolve) under the active retention policy.
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 18
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 20
      - stepNumber: 19
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 20
        description: Return the policy evaluation result
        type: return
        outcome: policy evaluation result
  - name: getPackPolicy
    narrative:
      - stepNumber: 1
        description: >-
          Authenticate the caller credential — any authenticated principal may read the policy so
          agents can see what initialization requires
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Read the active instance pack/profile policy (or null when none has ever been configured)
        type: call
        targetComponent: policy_repository
        targetMethod: getPackPolicy
      - stepNumber: 3
        description: >-
          If no policy has ever been configured (the repository returned null), substitute the
          documented permissive default; otherwise return the stored policy
        type: branch
        condition: no policy has ever been configured (the repository returned null)
        onFalseStep: 5
      - stepNumber: 4
        description: >-
          Substitute the documented permissive default policy (empty
          requiredGlobalPacks/defaultProjectPacks, requireProfileSelection false, enforcementMode
          'warn')
        type: local
      - stepNumber: 5
        description: Return the active instance pack/profile policy
        type: return
        outcome: the active instance pack/profile policy
  - name: setPackPolicy
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: >-
          Resolve the caller's project:admin permission at instance scope (the pack policy governs
          every project's initialization)
        type: call
        targetComponent: authorization_specialist
        targetMethod: authorize
      - stepNumber: 3
        description: If the effective value is not yes, deny
        type: branch
        condition: the effective project:admin value is not yes
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the policy administration
        type: throw
        error: Forbidden — policy administration requires instance-level project:admin
      - stepNumber: 5
        label: modecheck
        description: >-
          If the supplied policy's enforcementMode is not one of the closed set {warn, block,
          auto_reconcile}, reject the administration.
        type: branch
        condition: the supplied enforcementMode is not a recognized mode (warn, block, auto_reconcile)
        onTrueStep: 6
        onFalseStep: 7
      - stepNumber: 6
        label: badmode
        description: Reject the policy administration — unknown enforcementMode.
        type: throw
        error: invalid enforcementMode — must be one of warn, block, auto_reconcile
      - stepNumber: 7
        label: stampupdatedby
        description: >-
          Stamp updatedBy on the supplied policy from the authenticated caller's principal subject
          (the registry stamps updatedAt)
        type: local
      - stepNumber: 8
        description: Persist the replacement active pack/profile policy wholesale through the repository
        type: call
        targetComponent: policy_repository
        targetMethod: setPackPolicy
      - stepNumber: 9
        description: Append a redacted audit event without letting a failure fail the policy change
        type: try
        endStep: 11
        catches:
          - error: audit append failure
            step: 12
      - stepNumber: 10
        description: >-
          Append the redacted policy.set audit event at security level under the active retention
          policy
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 11
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 13
      - stepNumber: 12
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 13
        description: Return the stored policy
        type: return
        outcome: the stored policy
