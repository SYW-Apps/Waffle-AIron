id: mcp_core_adapter_impl
name: MCP Core Adapter Implementation
description: >-
  sdd_mcp's client hop into sdd_core, in a module of its own: identity re-exports of the core
  portals, under their contract names. The MCP server imports this module, so its calls into core
  land here — before, the server reached core through destructures of whole-module namespaces the
  analysis could not follow.
contract: imcp_core_adapter
sourcePath: src/mcp/adapters/core.ts
methods:
