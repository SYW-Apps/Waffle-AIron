  - name: runAliasesList
    sourcePath: src/commands/aliases.ts
    narrative:
      - stepNumber: 1
        description: Ask which short names this person has opted out of
        type: call
        targetComponent: user_config_store
        targetMethod: disabledAliases
      - stepNumber: 2
        description: >-
          Find where the binaries live. A packaged binary already knows — it is the directory the
          running executable sits in — so nothing is looked up and nothing can be stale
        type: local
      - stepNumber: 3
        description: >-
          For each supported alias, report which of five states it is in: registered by npm and
          unchangeable from here, opted out, shadowed by a different program already on PATH,
          present, or missing with the command that would create it
        type: local
      - stepNumber: 4
        description: >-
          Close with the install directory when there is one to name, and say plainly when there is
          not — an npm install has no directory of ours to manage
        type: local
      - stepNumber: 5
        description: Done
        type: return
        outcome: listed
    symbol: runAliasesList
  - name: runAliasesEnable
    sourcePath: src/commands/aliases.ts
    narrative:
      - stepNumber: 1
        description: Decide whether this is a name we support
        type: branch
        condition: the name is one of the supported aliases
        onTrueStep: 3
        onFalseStep: 2
      - stepNumber: 2
        description: Refuse by name, listing every supported alias, and exit non-zero
        type: return
        outcome: refused
      - stepNumber: 3
        description: Read the opted-out list
        type: call
        targetComponent: user_config_store
        targetMethod: disabledAliases
      - stepNumber: 4
        description: >-
          Drop this name from it and record that, whichever kind of install this is — so that
          enabling an alias here is not quietly undone by the next install reading a stale opt-out
        type: call
        targetComponent: user_config_store
        targetMethod: setDisabledAliases
      - stepNumber: 5
        description: Decide whether there is anything to create on disk
        type: branch
        condition: this is a packaged binary
        onTrueStep: 6
        onFalseStep: 7
      - stepNumber: 6
        description: >-
          Create the alias beside the binary — a symlink on Unix, a .cmd wrapper on Windows — and
          report it enabled
        type: return
        outcome: enabled
      - stepNumber: 7
        description: Report that npm's own bin entries already register it, so nothing on disk changed
        type: return
        outcome: already registered
    symbol: runAliasesEnable
  - name: runAliasesDisable
    sourcePath: src/commands/aliases.ts
    narrative:
      - stepNumber: 1
        description: Decide whether this is a name we support
        type: branch
        condition: the name is one of the supported aliases
        onTrueStep: 3
        onFalseStep: 2
      - stepNumber: 2
        description: Refuse by name, listing every supported alias, and exit non-zero
        type: return
        outcome: refused
      - stepNumber: 3
        description: Read the opted-out list
        type: call
        targetComponent: user_config_store
        targetMethod: disabledAliases
      - stepNumber: 4
        description: >-
          Add this name to it and record that. The opt-out is what stops a later install recreating
          the alias — removing the file alone would not survive one
        type: call
        targetComponent: user_config_store
        targetMethod: setDisabledAliases
      - stepNumber: 5
        description: Decide whether there is anything to remove from disk
        type: branch
        condition: this is a packaged binary
        onTrueStep: 6
        onFalseStep: 7
      - stepNumber: 6
        description: Remove the symlink or wrapper beside the binary and report it disabled
        type: return
        outcome: disabled
      - stepNumber: 7
        description: >-
          Report that npm's bin entries cannot be changed from here, and what would have to happen
          instead
        type: return
        outcome: npm managed
    symbol: runAliasesDisable
  - name: localStatus
    sourcePath: src/commands/status.ts
    narrative:
      - stepNumber: 1
        description: >-
          Refuse outside a wairon project, naming `wairon init` — a dashboard of nothing would read
          like an empty tree rather than like the wrong directory
        type: local
      - stepNumber: 2
        description: >-
          Ask the core adapter for the completeness report, handing it the terminal's colours as
          roles: structure for the tree's scaffolding, layer for each label, score for a percentage,
          draft for anything not yet complete, and present or missing for a source file
        type: call
        targetComponent: cli_core_adapter
        targetMethod: getStatusReport
      - stepNumber: 3
        description: Decide whether the tree could be reported on at all
        type: branch
        condition: the report came back failed
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: >-
          Print the explanation as an error and exit non-zero, naming `wairon init` when there is no
          system specification. A script running this over a tree that will not parse must not read
          it as healthy, and the exit code is the only part of that a script sees
        type: return
        outcome: unreadable
      - stepNumber: 5
        description: Print a heading and the report beneath it
        type: local
      - stepNumber: 6
        description: Ask what the lock says about this tree
        type: call
        targetComponent: cli_core_adapter
        targetMethod: approvalVerdict
      - stepNumber: 7
        description: >-
          Print the verdict, choosing severity from whether it reports drift rather than by matching
          its wording — which is why the verdict answers a fact beside the sentence
        type: local
      - stepNumber: 8
        description: Done
        type: return
        outcome: printed
    symbol: runStatus
