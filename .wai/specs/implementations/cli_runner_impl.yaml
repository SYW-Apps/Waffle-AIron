  - name: runHostDoctor
    sourcePath: src/commands/host.ts
    narrative:
      - stepNumber: 1
        description: Resolve the host configuration
        type: local
      - stepNumber: 2
        description: Run the permission-model migration via the host adapter, applying it only with --fix
        type: call
        targetComponent: cli_host_adapter
        targetMethod: migratePermissionModel
      - stepNumber: 3
        description: Nothing to migrate?
        type: branch
        condition: the report has no findings
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        label: clean
        description: Report the data as migrated
        type: return
        outcome: nothing to migrate
      - stepNumber: 5
        label: report
        description: Print every finding, warning when it was a dry run
        type: local
      - stepNumber: 6
        description: Return after the report
        type: return
        outcome: reported
    detail: full
  - name: runExternals
    narrative:
      - stepNumber: 1
        description: Route on the externals action
        type: switch
        'on': action
        cases:
          - value: pin
            step: 2
          - value: status
            step: 4
          - value: list
            step: 6
        defaultStep: 8
      - stepNumber: 2
        label: pin
        description: Pin the named aliases, else every declared external
        type: call
        targetComponent: cli_surfaces_client_adapter
        targetMethod: pinExternals
      - stepNumber: 3
        description: >-
          Print one line per alias — pinned, unchanged, unresolved or unreachable, with the
          used-name count and each unexported reference (export it from the producer's L0 to pin it)
          — or the JSON answer
        type: return
        outcome: pinned
      - stepNumber: 4
        label: status
        description: Read each external's status against its live producer
        type: call
        targetComponent: cli_surfaces_client_adapter
        targetMethod: getExternalsStatus
      - stepNumber: 5
        description: >-
          Print the status table — per alias: source, pinned, reachable, stale, drifted, then each
          used member's state, with EXTERNAL_CHECK_UNAVAILABLE and its reason on what could not be
          compared — or the JSON answer; staleness never fails the command
        type: return
        outcome: status reported
      - stepNumber: 6
        label: list
        description: List the declared externals
        type: call
        targetComponent: cli_surfaces_client_adapter
        targetMethod: listExternals
      - stepNumber: 7
        description: >-
          Print the table — alias, producer id, source kind and relation, audience, pinned digest or
          the problem — or the JSON answer
        type: return
        outcome: listed
      - stepNumber: 8
        label: unknown
        description: Unknown externals action
        type: throw
        error: UnknownExternalsActionError
    detail: full
lint:
  allow:
    - code: EXCESSIVE_NARRATIVE_STEPS
      reason: >-
        runPack is the `wairon pack` family's action dispatcher: a flat twelve-arm if-chain in
        src/cli/index.ts, one adapter call per subcommand, cognitive score 1. Its 26 steps are two
        per subcommand (the call and its return) plus the switch and the unknown-action refusal, so
        the count tracks how many subcommands `pack` has, not what the method does — the same shape
        sits at every size in this runner: runPacks (8), runAgent (9), runSurface (12), runRemote
        (14). There is no seam to split on: all twelve arms call one module (src/commands/packs.ts),
        and every `pack` subcommand's action calls runPack directly, so scope-based sub-dispatchers
        would be invented here rather than named in the code. Adding a pack subcommand adds two
        steps, which is the point.
