id: cli_runner_impl
name: CLI Runner Implementation
description: >-
  Concrete implementation of the CLI Runner Interface mapping commander subcommands to core engine
  logic.
contract: icli_runner
sourcePath: src/cli/index.ts
methods:
  - name: runValidate
    narrative:
      - stepNumber: 1
        description: >-
          Is this checkout ATTACHED to a hosted project? An attached checkout has no local tree, so
          validating locally would report a vacuous pass.
        type: call
        targetComponent: remote_orchestrator
        targetMethod: resolveTarget
      - stepNumber: 2
        description: Attached?
        type: branch
        condition: a hosted target resolved
        onTrueStep: 3
        onFalseStep: 5
      - stepNumber: 3
        description: Validate the ATTACHED project's tree on the instance instead.
        type: call
        targetComponent: remote_orchestrator
        targetMethod: validateAttached
      - stepNumber: 4
        description: >-
          Print the hosted findings and exit non-zero when it reported errors, exactly as a local
          run would.
        type: return
        outcome: validated remotely
      - stepNumber: 5
        description: Load project configuration file
        type: local
      - stepNumber: 6
        description: >-
          Not attached: run the whole local validation workflow — registry, project config and spec
          tree — through the validator adapter.
        type: call
        targetComponent: cli_validator_adapter
        targetMethod: runValidation
      - stepNumber: 7
        description: Print validation errors/warnings and exit process if invalid
        type: local
    symbol: validateCommand
  - name: runGenerate
    narrative:
      - stepNumber: 1
        description: Load spec system
        type: call
        targetComponent: cli_core_adapter
        targetMethod: loadSystemSpec
      - stepNumber: 2
        description: >-
          Generate Dynamic Agent outputs matching configured target engines, then prune stale
          managed agent files against the FULL resolved topology (also under a domain scope),
          re-export skills, and re-inject the local guides
        type: local
  - name: runList
    narrative:
      - stepNumber: 1
        description: Load specs using spec loader
        type: call
        targetComponent: cli_core_adapter
        targetMethod: loadSystemSpec
      - stepNumber: 2
        description: Format and print resolved dynamic agent list to stdout
        type: local
  - name: runShow
    narrative:
      - stepNumber: 1
        description: Load spec system
        type: call
        targetComponent: cli_core_adapter
        targetMethod: loadSystemSpec
      - stepNumber: 2
        description: Format and display details for specified dynamic agent
        type: local
  - name: runUpdate
    narrative:
      - stepNumber: 1
        description: Check remote github release page for new releases
        type: local
      - stepNumber: 2
        description: If new release is found and not in check-only mode, pull and apply updates
        type: local
  - name: runHostProject
    narrative:
      - stepNumber: 1
        description: Read the master credential from the environment
        type: local
      - stepNumber: 2
        description: Dispatch on the action
        type: switch
        'on': action
        cases:
          - value: create
            step: 3
          - value: list
            step: 5
          - value: destroy
            step: 7
        defaultStep: 9
      - stepNumber: 3
        description: Create the project via the host adapter
        type: call
        targetComponent: cli_host_adapter
        targetMethod: createProject
      - stepNumber: 4
        description: Return after create
        type: return
        outcome: created
      - stepNumber: 5
        description: List projects via the host adapter
        type: call
        targetComponent: cli_host_adapter
        targetMethod: listProjects
      - stepNumber: 6
        description: Return after list
        type: return
        outcome: listed
      - stepNumber: 7
        description: Destroy the project via the host adapter
        type: call
        targetComponent: cli_host_adapter
        targetMethod: destroyProject
      - stepNumber: 8
        description: Return after destroy
        type: return
        outcome: destroyed
      - stepNumber: 9
        description: Return on unknown action
        type: return
        outcome: unknown action
  - name: runHostKey
    narrative:
      - stepNumber: 1
        description: Read the master credential from the environment
        type: local
      - stepNumber: 2
        description: Dispatch on the action
        type: switch
        'on': action
        cases:
          - value: mint
            step: 3
          - value: revoke
            step: 5
          - value: list
            step: 7
        defaultStep: 9
      - stepNumber: 3
        description: Mint a key via the host adapter
        type: call
        targetComponent: cli_host_adapter
        targetMethod: mintKey
      - stepNumber: 4
        description: Return after mint
        type: return
        outcome: minted
      - stepNumber: 5
        description: Revoke a key via the host adapter
        type: call
        targetComponent: cli_host_adapter
        targetMethod: revokeKey
      - stepNumber: 6
        description: Return after revoke
        type: return
        outcome: revoked
      - stepNumber: 7
        description: List keys via the host adapter
        type: call
        targetComponent: cli_host_adapter
        targetMethod: listKeys
      - stepNumber: 8
        description: Return after list
        type: return
        outcome: listed
      - stepNumber: 9
        description: Return on unknown action
        type: return
        outcome: unknown action
  - name: runHostLock
    narrative:
      - stepNumber: 1
        description: Read the master credential from the environment
        type: local
      - stepNumber: 2
        description: Lock the project via the host adapter
        type: call
        targetComponent: cli_host_adapter
        targetMethod: lockProject
      - stepNumber: 3
        description: Print the lock record (stateId and status)
        type: local
      - stepNumber: 4
        description: Return after lock
        type: return
        outcome: locked
  - name: runProduce
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the target credential (--token, else env, else interactive prompt) and set it for
          the operation
        type: local
      - stepNumber: 2
        description: Configure the target for the local project (parent page from --page)
        type: call
        targetComponent: cli_producer_adapter
        targetMethod: configure
      - stepNumber: 3
        description: Project the local project's specs to the target
        type: call
        targetComponent: cli_producer_adapter
        targetMethod: produce
      - stepNumber: 4
        description: Return once produced
        type: return
        outcome: produced
  - name: runSubsystemAdd
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the parent project root by walking up from cwd; error if cwd is not inside an
          initialized wairon project
        type: local
      - stepNumber: 2
        description: Require an explicit projectPath for an external (chained) subsystem
        type: branch
        condition: options.projectPath is not provided
        onFalseStep: 4
      - stepNumber: 3
        description: >-
          Reject: plain in-tree subsystems are authored via the SDD tools; this command creates
          external subsystems
        type: throw
        error: '--project-path is required (use the sdd_add_subsystem tool for in-tree subsystems)'
      - stepNumber: 4
        description: >-
          Compose the SubsystemSpec (id, display name from --name or id, description placeholder,
          projectPath from options)
        type: local
      - stepNumber: 5
        description: >-
          Create the chained subsystem: wire the parent subsystem spec and scaffold the child
          project
        type: call
        targetComponent: cli_core_adapter
        targetMethod: createChainedSubsystem
      - stepNumber: 6
        description: Print confirmation (parent subsystem id + child project path) and next steps
        type: local
  - name: runInit
    narrative:
      - stepNumber: 1
        description: Resolve the nearest ancestor wairon project root by walking up from cwd
        type: local
      - stepNumber: 2
        description: Detect whether cwd is itself an already-initialized wairon project root
        type: branch
        condition: the resolved root equals cwd (already initialized here)
        onFalseStep: 4
      - stepNumber: 3
        description: Report that the workspace is already initialized and stop
        type: return
        outcome: already initialized
      - stepNumber: 4
        description: Detect whether cwd sits inside a parent wairon project (subdirectory case)
        type: branch
        condition: a parent project root was found above cwd (root differs from cwd)
        onTrueStep: 5
        onFalseStep: 11
      - stepNumber: 5
        description: >-
          Prompt the user to create this subdirectory as an external subsystem of the detected
          parent project
        type: local
      - stepNumber: 6
        description: Honor the user's choice
        type: branch
        condition: the user declined the prompt
        onFalseStep: 8
      - stepNumber: 7
        description: Print guidance and stop without changes
        type: return
        outcome: declined
      - stepNumber: 8
        description: >-
          Compose the SubsystemSpec (id from --name or directory name, projectPath = relative path
          from the parent root to cwd)
        type: local
      - stepNumber: 9
        description: Wire the parent subsystem and scaffold this directory's child project
        type: call
        targetComponent: cli_core_adapter
        targetMethod: createChainedSubsystem
      - stepNumber: 10
        description: Report the external subsystem was created and stop
        type: return
        outcome: external subsystem created
      - stepNumber: 11
        description: Bootstrap the standard .wai directory structure
        type: local
      - stepNumber: 12
        description: Export SDD skills templates
        type: call
        targetComponent: cli_skills_adapter
        targetMethod: exportSddSkills
      - stepNumber: 13
        description: Generate default L0/L1/L2 spec files if empty
        type: local
  - name: runSubsystemMove
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the parent project root by walking up from cwd; error if cwd is not inside an
          initialized wairon project
        type: local
      - stepNumber: 2
        description: Require the new location
        type: branch
        condition: options.projectPath is not provided
        onFalseStep: 4
      - stepNumber: 3
        description: 'Reject: the new location is required'
        type: throw
        error: '--project-path (the new location) is required'
      - stepNumber: 4
        description: Move the subproject directory and update its projectPath link
        type: call
        targetComponent: cli_core_adapter
        targetMethod: moveSubsystemProject
      - stepNumber: 5
        description: Print confirmation (old path to new path)
        type: local
  - name: runSubsystemExternalize
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the parent project root by walking up from cwd; error if cwd is not inside an
          initialized wairon project
        type: local
      - stepNumber: 2
        description: Require the destination path
        type: branch
        condition: options.projectPath is not provided
        onFalseStep: 4
      - stepNumber: 3
        description: 'Reject: the destination is required'
        type: throw
        error: '--project-path (the subproject destination) is required'
      - stepNumber: 4
        description: Externalize the subsystem into a standalone subproject
        type: call
        targetComponent: cli_core_adapter
        targetMethod: externalizeSubsystem
      - stepNumber: 5
        description: >-
          Print confirmation, the new subproject path, and a reminder to move the source code and
          re-validate
        type: local
  - name: runSubsystemInternalize
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the parent project root by walking up from cwd; error if cwd is not inside an
          initialized wairon project
        type: local
      - stepNumber: 2
        description: Internalize the external subsystem back into the parent tree
        type: call
        targetComponent: cli_core_adapter
        targetMethod: internalizeSubsystem
      - stepNumber: 3
        description: Print confirmation and a reminder to re-validate
        type: local
  - name: runSurface
    narrative:
      - stepNumber: 1
        description: Route on the surface action
        type: switch
        'on': action
        cases:
          - value: export
            step: 2
          - value: import
            step: 4
          - value: list
            step: 6
          - value: externals
            step: 8
          - value: pin
            step: 10
        defaultStep: 12
      - stepNumber: 2
        description: Export the own surface (audience/format/out/portal from options)
        type: call
        targetComponent: cli_surfaces_client_adapter
        targetMethod: exportSurface
      - stepNumber: 3
        description: >-
          Report the export result: every written path — with several portals and no --portal, one
          file per portal is written and each path is listed. Without an out path, print the single
          document when one portal remains, else list the available portals (portalId + name) so the
          caller can pick with --portal, rather than printing nothing.
        type: return
        outcome: exported
      - stepNumber: 4
        description: Import the foreign surface (source/origin from options)
        type: call
        targetComponent: cli_surfaces_client_adapter
        targetMethod: importSurface
      - stepNumber: 5
        description: Print the imported snapshot summary
        type: return
        outcome: imported
      - stepNumber: 6
        description: List the stored snapshots
        type: call
        targetComponent: cli_surfaces_client_adapter
        targetMethod: listSnapshots
      - stepNumber: 7
        description: Print the snapshot table
        type: return
        outcome: listed
      - stepNumber: 8
        description: >-
          List the project's external surfaces (parent family, siblings, foreign imports) with
          origin and freshness
        type: call
        targetComponent: cli_surfaces_client_adapter
        targetMethod: listExternalInterfaces
      - stepNumber: 9
        description: >-
          Print the externals table: one row per entry — sourceKind, key, origin, freshness,
          interface ids
        type: return
        outcome: externals listed
      - stepNumber: 10
        description: Pin the chaining parent's family and sibling surfaces into this chained child
        type: call
        targetComponent: cli_surfaces_client_adapter
        targetMethod: pinFamilySurfaces
      - stepNumber: 11
        description: >-
          Print the changed pinned paths — or that they were already up to date, or that a top root
          has no family to pin
        type: return
        outcome: pinned
      - stepNumber: 12
        description: Unknown surface action
        type: throw
        error: UnknownSurfaceActionError
  - name: runPacks
    narrative:
      - stepNumber: 1
        description: Dispatch on the action
        type: switch
        'on': action
        cases:
          - value: add
            step: 2
          - value: list
            step: 4
          - value: remove
            step: 6
        defaultStep: 8
      - stepNumber: 2
        description: Vendor and register a pack via the packs adapter
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: addPack
      - stepNumber: 3
        description: Return after add
        type: return
        outcome: added
      - stepNumber: 4
        description: List the loaded packs via the packs adapter
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: listPacks
      - stepNumber: 5
        description: Return after list
        type: return
        outcome: listed
      - stepNumber: 6
        description: Remove a vendored pack via the packs adapter
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: removePack
      - stepNumber: 7
        description: Return after remove
        type: return
        outcome: removed
      - stepNumber: 8
        description: Return on unknown action
        type: return
        outcome: unknown action
  - name: runRules
    narrative:
      - stepNumber: 1
        description: List the active conformance rules via the rules adapter
        type: call
        targetComponent: cli_rules_adapter
        targetMethod: listRules
      - stepNumber: 2
        description: Return after list
        type: return
        outcome: listed
  - name: runPatterns
    narrative:
      - stepNumber: 1
        description: List the pack-declared reusable patterns via the patterns adapter
        type: call
        targetComponent: cli_patterns_adapter
        targetMethod: listPatterns
      - stepNumber: 2
        description: Return after list
        type: return
        outcome: listed
  - name: runVariants
    narrative:
      - stepNumber: 1
        description: List the component variants via the variants adapter
        type: call
        targetComponent: cli_variants_adapter
        targetMethod: listVariants
      - stepNumber: 2
        description: Return after list
        type: return
        outcome: listed
  - name: runPack
    narrative:
      - stepNumber: 1
        description: Dispatch on the pack action.
        type: switch
        'on': action
        cases:
          - value: init
            step: 2
          - value: build
            step: 4
          - value: add
            step: 6
          - value: list
            step: 8
          - value: remove
            step: 10
          - value: install
            step: 13
          - value: uninstall
            step: 15
          - value: which
            step: 17
          - value: use
            step: 19
          - value: unuse
            step: 21
          - value: bundle
            step: 23
          - value: sync
            step: 25
        defaultStep: 12
      - stepNumber: 2
        label: doInit
        description: Scaffold a new pack project.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: initPack
      - stepNumber: 3
        description: Done.
        type: return
        outcome: init done
      - stepNumber: 4
        label: doBuild
        description: Build a .wpack archive.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: buildPack
      - stepNumber: 5
        description: Done.
        type: return
        outcome: build done
      - stepNumber: 6
        label: doAdd
        description: Install a pack (ZIP-aware).
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: addPack
      - stepNumber: 7
        description: Done.
        type: return
        outcome: add done
      - stepNumber: 8
        label: doList
        description: List packs.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: listPacks
      - stepNumber: 9
        description: Done.
        type: return
        outcome: list done
      - stepNumber: 10
        label: doRemove
        description: Remove a pack.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: removePack
      - stepNumber: 11
        description: Done.
        type: return
        outcome: remove done
      - stepNumber: 12
        label: unknown
        description: Unknown action.
        type: throw
        error: >-
          unknown pack action (expected init | build | install | uninstall | which | use | unuse |
          bundle | sync | add | list | remove)
      - stepNumber: 13
        label: doInstall
        description: >-
          Install a pack into this wairon install's store (applies to nothing until a project
          selects it).
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: installPack
      - stepNumber: 14
        description: Done.
        type: return
        outcome: install done
      - stepNumber: 15
        label: doUninstall
        description: Remove a pack from the store.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: uninstallStorePack
      - stepNumber: 16
        description: Done.
        type: return
        outcome: uninstall done
      - stepNumber: 17
        label: doWhich
        description: Identify which installed pack a name resolves to.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: whichPack
      - stepNumber: 18
        description: Done.
        type: return
        outcome: which done
      - stepNumber: 19
        label: doUse
        description: Select an installed pack for this project.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: usePack
      - stepNumber: 20
        description: Done.
        type: return
        outcome: use done
      - stepNumber: 21
        label: doUnuse
        description: Deselect a pack for this project.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: unusePack
      - stepNumber: 22
        description: Done.
        type: return
        outcome: unuse done
      - stepNumber: 23
        label: doBundle
        description: Commit a copy of a selected pack under .wai/packs/.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: bundlePack
      - stepNumber: 24
        description: Done.
        type: return
        outcome: bundle done
      - stepNumber: 25
        label: doSync
        description: Install every declared-but-missing pack from its recorded source.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: syncPacks
      - stepNumber: 26
        description: Done.
        type: return
        outcome: sync done
  - name: runLock
    narrative:
      - stepNumber: 1
        description: >-
          Is this checkout ATTACHED to a hosted project? A hosted lock is the instance's
          execute-primary workflow, not a local freeze.
        type: call
        targetComponent: remote_orchestrator
        targetMethod: resolveTarget
      - stepNumber: 2
        description: Attached?
        type: branch
        condition: a hosted target resolved
        onTrueStep: 3
        onFalseStep: 5
      - stepNumber: 3
        description: Lock the ATTACHED project on the instance.
        type: call
        targetComponent: remote_orchestrator
        targetMethod: lockAttached
      - stepNumber: 4
        description: >-
          Report the outcome verbatim — an approval-gated instance answers that a REQUEST was
          created, which must never be printed as a completed lock.
        type: return
        outcome: locked or requested
      - stepNumber: 5
        description: Run the as-complete dry-run gate over the tree
        type: call
        targetComponent: cli_validator_adapter
        targetMethod: validateAsComplete
      - stepNumber: 6
        description: The gate found errors (an invalid tree is never frozen)
        type: branch
        condition: as-complete validation reported errors
        onFalseStep: 8
      - stepNumber: 7
        description: Refuse the lock, printing the blocking findings
        type: return
        outcome: refused
      - stepNumber: 8
        description: >-
          Confirm with the human (skipped under --yes), then freeze the tree through the lock
          adapter
        type: call
        targetComponent: cli_lock_adapter
        targetMethod: lockTree
      - stepNumber: 9
        description: >-
          Refresh the generated outputs (runGenerate): re-render owner/architect files, prune stale
          managed agents against the full topology, re-export skills, re-inject guides
        type: local
      - stepNumber: 10
        description: Print the lock record and return
        type: return
        outcome: locked
    symbol: lockCommand
  - name: runAgent
    narrative:
      - stepNumber: 1
        description: Dispatch on the agent action
        type: switch
        'on': action
        cases:
          - value: brief
            step: 2
          - value: customize
            step: 4
        defaultStep: 9
      - stepNumber: 2
        description: Compose the agent's live brief via the core client adapter
        type: call
        targetComponent: cli_core_adapter
        targetMethod: composeAgentBrief
      - stepNumber: 3
        description: Print the rendered brief (instructions + ownedPaths/readPaths scope)
        type: return
        outcome: brief printed
      - stepNumber: 4
        description: Compose the agent's live brief via the core client adapter to seed the scaffold
        type: call
        targetComponent: cli_core_adapter
        targetMethod: composeAgentBrief
      - stepNumber: 5
        description: Refuse to clobber a user-owned file
        type: branch
        condition: .wai/agents/<id>.md already exists
        onTrueStep: 6
        onFalseStep: 7
      - stepNumber: 6
        description: The guidance file is user-owned — point at it for direct editing instead of overwriting
        type: throw
        error: GuidanceFileExistsError
      - stepNumber: 7
        description: >-
          Write the scaffold: a header explaining that spec-derived facts are inferred live (do not
          duplicate them), then the subsystem description as the starting content
        type: local
      - stepNumber: 8
        description: Report the created path and how it is used (folded into every future brief)
        type: return
        outcome: scaffolded
      - stepNumber: 9
        description: Unknown agent action
        type: throw
        error: unknown agent action (expected brief | customize)
  - name: runRemote
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the instance URL, project selector and bearer credential for this command:
          explicit flags, then the environment, then this checkout's recorded binding, then the
          agent's own MCP configuration. Refuse with actionable guidance when nothing resolves.
        type: local
      - stepNumber: 2
        description: Route on the remote action
        type: switch
        'on': action
        cases:
          - value: push
            step: 3
          - value: pull
            step: 5
          - value: attach
            step: 7
          - value: detach
            step: 9
          - value: status
            step: 11
        defaultStep: 13
      - stepNumber: 3
        description: >-
          Migrate the local spec tree into the hosted project (creating it first when --unit was
          given).
        type: call
        targetComponent: remote_orchestrator
        targetMethod: pushTree
      - stepNumber: 4
        description: Report what was pushed
        type: jump
        toStep: 14
      - stepNumber: 5
        description: Migrate the hosted spec tree into this checkout.
        type: call
        targetComponent: remote_orchestrator
        targetMethod: pullTree
      - stepNumber: 6
        description: Report what was pulled
        type: jump
        toStep: 14
      - stepNumber: 7
        description: >-
          Record a standing binding for this checkout, after verifying it resolves against the
          instance.
        type: call
        targetComponent: remote_orchestrator
        targetMethod: attach
        error: 'Unknown remote action (supported: push, pull)'
      - stepNumber: 8
        label: attachReported
        description: Report what is now attached
        type: jump
        toStep: 14
      - stepNumber: 9
        description: Remove the binding, returning the checkout to purely local operation.
        type: call
        targetComponent: remote_orchestrator
        targetMethod: detach
      - stepNumber: 10
        description: Report the detachment
        type: jump
        toStep: 14
      - stepNumber: 11
        description: >-
          Describe what this checkout is attached to and how it resolved — never printing the
          credential.
        type: call
        targetComponent: remote_orchestrator
        targetMethod: describeAttachment
      - stepNumber: 12
        description: Report the attachment
        type: jump
        toStep: 14
      - stepNumber: 13
        description: Reject an unknown remote action, naming the supported ones.
        type: throw
        targetComponent: remote_orchestrator
        targetMethod: describeAttachment
        error: 'Unknown remote action (supported: push, pull, attach, detach, status)'
      - stepNumber: 14
        label: outcome
        description: >-
          Print the outcome: for a migration, direction, instance and project, roots and file count,
          whether the project was created, and any backup path the destination reported — a replaced
          tree must always name what it can be undone from; for attach/detach/status, what this
          checkout now addresses and where that answer came from.
        type: local
  - name: runLogin
    narrative:
      - stepNumber: 1
        description: >-
          Take the token from --token or prompt for it without echoing, and normalize the instance
          URL.
        type: local
      - stepNumber: 2
        description: >-
          Verify the credential against the instance and store it for this machine — not for this
          project: a login serves every checkout, while binding a project is what `wairon remote
          attach` is for.
        type: call
        targetComponent: remote_orchestrator
        targetMethod: storeCredential
      - stepNumber: 3
        description: >-
          Confirm which instance is now reachable, and point at `wairon remote attach` as the next
          step. Never echo the credential.
        type: local
        targetComponent: remote_orchestrator
        targetMethod: attach
      - stepNumber: 4
        description: Confirm which instance is now reachable, without echoing the credential.
        type: local
  - name: runLogout
    narrative:
      - stepNumber: 1
        description: Was an instance named?
        type: branch
        condition: a url argument was supplied
        onTrueStep: 2
        onFalseStep: 4
      - stepNumber: 2
        description: Forget the stored credential for that instance.
        type: call
        targetComponent: remote_orchestrator
        targetMethod: forgetCredential
      - stepNumber: 3
        description: >-
          State plainly that this forgot the credential LOCALLY and did NOT revoke it on the
          instance — revocation lives in the hosted UI under Tokens. Then finish.
        type: return
        outcome: forgotten
      - stepNumber: 4
        label: listStored
        description: List the instances this machine holds a credential for, printing URLs only.
        type: call
        targetComponent: remote_orchestrator
        targetMethod: listStoredInstances
  - name: runStatus
    narrative:
      - stepNumber: 1
        description: Is this checkout ATTACHED to a hosted project?
        type: call
        targetComponent: remote_orchestrator
        targetMethod: resolveTarget
      - stepNumber: 2
        description: Attached?
        type: branch
        condition: a hosted target resolved
        onTrueStep: 3
        onFalseStep: 5
      - stepNumber: 3
        description: Read the ATTACHED project's completeness dashboard from the instance.
        type: call
        targetComponent: remote_orchestrator
        targetMethod: statusAttached
      - stepNumber: 4
        description: >-
          Print the hosted dashboard, naming the instance and project so it is never mistaken for a
          local tree.
        type: return
        outcome: reported remotely
      - stepNumber: 5
        description: >-
          Not attached: read and print the LOCAL spec tree's completeness dashboard, scoped to a
          subsystem when one was named.
        type: local
    symbol: statusCommand
  - name: runMcpServe
    narrative:
      - stepNumber: 1
        description: Run the stdio MCP server against the resolved project root.
        type: call
        targetComponent: cli_mcp_adapter
        targetMethod: serveMcpStdio
  - name: runMcpInstall
    narrative:
      - stepNumber: 1
        description: >-
          For a HOSTED registration, resolve the bearer to embed: the explicit flag, else the
          credential stored for that instance — done HERE because the config adapter may not read
          the credential store.
        type: call
        targetComponent: remote_orchestrator
        targetMethod: storedCredentialFor
      - stepNumber: 2
        description: >-
          Register (or self-heal) the wairon entry in the configured AI tools' MCP configuration —
          local stdio, or hosted http when an instance was named.
        type: call
        targetComponent: cli_mcp_adapter
        targetMethod: installMcpServer
  - name: runMcpStatus
    narrative:
      - stepNumber: 1
        description: Report where a wairon MCP server is registered and what it points at.
        type: call
        targetComponent: cli_mcp_adapter
        targetMethod: reportMcpStatus
status: complete
