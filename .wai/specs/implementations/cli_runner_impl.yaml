  - name: runHostPermission
    sourcePath: src/commands/host.ts
    narrative:
      - stepNumber: 1
        description: Read the master credential from the environment
        type: local
      - stepNumber: 2
        description: Dispatch on the action
        type: switch
        'on': action
        cases:
          - value: set
            step: 3
          - value: list
            step: 8
          - value: remove
            step: 10
        defaultStep: 12
      - stepNumber: 3
        label: set
        description: >-
          Validate the capability and value, and resolve the scope from the flags: --project with
          --subsystem is the subsystem scope `<project>/<subsystem>` (--subsystem without --project
          is refused), else --project, --unit or the instance
        type: local
      - stepNumber: 4
        description: Store the assignment via the host adapter
        type: call
        targetComponent: cli_host_adapter
        targetMethod: setAssignment
      - stepNumber: 5
        description: Does the assignment grant project:write (yes or approval)?
        type: branch
        condition: the capability is project:write and the value grants it
        onTrueStep: 6
        onFalseStep: 7
      - stepNumber: 6
        description: >-
          Explain the user's project:read at the same scope via the host adapter and warn when it is
          not yes: read and write are separate capabilities, so a subject granted write without read
          cannot open the project its write covers — the warning names the grant that would fix it.
          A user with no record, or an explanation that fails, warns nothing
        type: call
        targetComponent: cli_host_adapter
        targetMethod: explain
      - stepNumber: 7
        description: Return after set
        type: return
        outcome: assigned
      - stepNumber: 8
        label: list
        description: >-
          List the assignments narrowed by scope (a subsystem scope included) and user via the host
          adapter
        type: call
        targetComponent: cli_host_adapter
        targetMethod: listAssignments
      - stepNumber: 9
        description: Return after list
        type: return
        outcome: listed
      - stepNumber: 10
        label: remove
        description: Remove the assignment via the host adapter
        type: call
        targetComponent: cli_host_adapter
        targetMethod: removeAssignment
      - stepNumber: 11
        description: Return after remove
        type: return
        outcome: removed
      - stepNumber: 12
        label: unknown
        description: Refuse an unknown action
        type: throw
        error: WaironError
