id: cli_runner_impl
name: CLI Runner Implementation
description: >-
  Concrete implementation of the CLI Runner Interface mapping commander subcommands to core engine
  logic.
contract: icli_runner
sourcePath: src/cli/index.ts
methods:
  - name: runValidate
    narrative:
      - stepNumber: 1
        description: >-
          Is this checkout ATTACHED to a hosted project? An attached checkout has no local tree, so
          validating locally would report a vacuous pass.
        type: call
        targetComponent: remote_orchestrator
        targetMethod: resolveTarget
      - stepNumber: 2
        description: Attached?
        type: branch
        condition: a hosted target resolved
        onTrueStep: 3
        onFalseStep: 5
      - stepNumber: 3
        description: Validate the ATTACHED project's tree on the instance instead.
        type: call
        targetComponent: remote_orchestrator
        targetMethod: validateAttached
      - stepNumber: 4
        description: >-
          Print the hosted findings — errors, warnings and notices, each as its own kind — and exit
          non-zero when it reported errors, or warnings under --ci, exactly as a local run would;
          notices never fail it.
        type: return
        outcome: validated remotely
      - stepNumber: 5
        description: >-
          Not attached: run the whole local validation workflow — registry, project config and spec
          tree — through the validator adapter.
        type: call
        targetComponent: cli_validator_adapter
        targetMethod: runValidation
      - stepNumber: 6
        description: Print validation errors, warnings and notices, and exit process if invalid
        type: local
    symbol: validateCommand
  - name: runGenerate
    sourcePath: src/commands/generate.ts
    narrative:
      - stepNumber: 1
        description: >-
          Read the project configuration: the configured targets and whether agent files are
          materialized (rules.materializeAgentFiles).
        type: call
        targetComponent: cli_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 2
        description: Resolve the agent topology from the spec tree through the core adapter
        type: call
        targetComponent: cli_core_adapter
        targetMethod: resolveAgentTopology
      - stepNumber: 3
        description: Did the spec tree resolve any agent?
        type: branch
        condition: at least one agent resolved from the spec tree
        onFalseStep: 11
      - stepNumber: 4
        description: >-
          Generate the agent outputs for the configured target engines when agent files are
          materialized
        type: call
        targetComponent: cli_core_adapter
        targetMethod: generateAll
      - stepNumber: 5
        description: >-
          Ask which files a generate run owns, so stale managed agent files can be pruned against
          the full resolved topology (also under a domain scope) without deleting something wairon
          never wrote
        type: call
        targetComponent: cli_core_adapter
        targetMethod: resolveExpectedOutputPaths
      - stepNumber: 6
        description: Re-export the SDD skills when the spec tree exists
        type: call
        targetComponent: cli_skills_adapter
        targetMethod: exportSddSkills
      - stepNumber: 7
        description: >-
          Ask whether this project has a human-written project document, since the derived guide
          folds it in when there is one
        type: call
        targetComponent: cli_core_adapter
        targetMethod: hasContext
      - stepNumber: 8
        description: >-
          Rebuild the derived context documents through the core adapter, each written only if it
          changed — so a regenerate with no design change behind it leaves no diff
        type: call
        targetComponent: cli_core_adapter
        targetMethod: syncContextFiles
      - stepNumber: 9
        description: >-
          Re-inject the local AI guides for the configuration's active targets through the core
          adapter, so a guide never outlives the tree it claims to describe
        type: call
        targetComponent: cli_core_adapter
        targetMethod: reinjectLocalGuides
      - stepNumber: 10
        description: Continue with the cascade
        type: jump
        toStep: 12
      - stepNumber: 11
        description: 'Warn that no agent resolved from the spec tree: define subsystems and components first'
        type: local
      - stepNumber: 12
        description: Is the cascade off for this run?
        type: branch
        condition: the run is scoped to a domain or root, a dry run, or --no-recurse
        onFalseStep: 14
      - stepNumber: 13
        description: Stop after this layer
        type: return
        outcome: this layer generated
      - stepNumber: 14
        description: List this project's direct chained subprojects
        type: call
        targetComponent: cli_core_adapter
        targetMethod: listDirectChainedSubprojects
      - stepNumber: 15
        description: Generate each subproject's layer in its own root
        type: loop
        loopKind: forEach
        over: each direct chained subproject
        endStep: 17
      - stepNumber: 16
        description: >-
          Complete the subproject's bootstrap without overwriting it; a configuration written here
          declares the mount's subsystem id as the subproject's project id
        type: call
        targetComponent: cli_core_adapter
        targetMethod: ensureProjectInitialized
      - stepNumber: 17
        description: >-
          Generate the subproject's layer and its own subprojects by running this command bound to
          the subproject root
        type: local
      - stepNumber: 18
        description: Every layer is generated
        type: return
        outcome: every layer generated
  - name: runList
    sourcePath: src/commands/list.ts
    narrative:
      - stepNumber: 1
        description: Resolve the agent topology from the spec tree through the core adapter
        type: call
        targetComponent: cli_core_adapter
        targetMethod: resolveAgentTopology
      - stepNumber: 2
        description: Format and print resolved dynamic agent list to stdout
        type: local
  - name: runShow
    sourcePath: src/commands/show.ts
    narrative:
      - stepNumber: 1
        description: Resolve the agent topology from the spec tree through the core adapter
        type: call
        targetComponent: cli_core_adapter
        targetMethod: resolveAgentTopology
      - stepNumber: 2
        description: Format and display details for specified dynamic agent
        type: local
  - name: runUpdate
    sourcePath: src/commands/update.ts
    narrative:
      - stepNumber: 1
        description: Decide whether this run names a channel on the command line
        type: branch
        condition: a --channel was given
        onTrueStep: 2
        onFalseStep: 6
      - stepNumber: 2
        description: Decide whether it is a channel this build knows
        type: branch
        condition: the named channel is recognized
        onTrueStep: 3
        onFalseStep: 5
      - stepNumber: 3
        description: >-
          Record it for this machine, so choosing a channel outlives the run that chose it —
          `--channel` is a setting, not a per-invocation flag
        type: call
        targetComponent: user_config_store
        targetMethod: setChannel
      - stepNumber: 4
        description: Use the channel just named
        type: jump
        toStep: 7
      - stepNumber: 5
        description: Refuse by name, listing every valid channel, and exit non-zero without checking anything
        type: return
        outcome: unknown channel
      - stepNumber: 6
        description: Use the channel recorded for this machine
        type: call
        targetComponent: user_config_store
        targetMethod: channel
      - stepNumber: 7
        description: >-
          Ask GitHub for the release list. A failure here reports the network problem and stops,
          rather than reporting no update available — which would be indistinguishable from being
          current
        type: local
      - stepNumber: 8
        description: >-
          Keep only the releases eligible for that channel and take the newest, then say so when the
          running build is itself off-channel
        type: local
      - stepNumber: 9
        description: Decide whether anything newer is on offer
        type: branch
        condition: no eligible release is newer than the running build
        onTrueStep: 10
        onFalseStep: 11
      - stepNumber: 10
        description: >-
          Report already up to date, and mention a newer build waiting on a wider channel if one
          exists — so that being current on `stable` never silently hides a `beta` release
        type: return
        outcome: up to date
      - stepNumber: 11
        description: >-
          Report the new version and the first lines of its release notes, pointing at the full
          notes when they are longer
        type: local
      - stepNumber: 12
        description: Decide whether this run was only asking
        type: branch
        condition: check-only mode
        onTrueStep: 13
        onFalseStep: 14
      - stepNumber: 13
        description: >-
          Exit non-zero to signal that an update is available, having changed nothing — the non-zero
          status is the answer, for scripts that poll
        type: return
        outcome: update available
      - stepNumber: 14
        description: >-
          Download the asset for this platform and swap the running binary, keeping the previous one
          beside it so a bad release can be stepped back from
        type: local
      - stepNumber: 15
        description: Done
        type: return
        outcome: updated
    symbol: runUpdate
  - name: runHostProject
    sourcePath: src/commands/host.ts
    narrative:
      - stepNumber: 1
        description: Read the master credential from the environment
        type: local
      - stepNumber: 2
        description: Dispatch on the action
        type: switch
        'on': action
        cases:
          - value: create
            step: 3
          - value: list
            step: 5
          - value: destroy
            step: 7
        defaultStep: 9
      - stepNumber: 3
        description: Create the project via the host adapter
        type: call
        targetComponent: cli_host_adapter
        targetMethod: createProject
      - stepNumber: 4
        description: Return after create
        type: return
        outcome: created
      - stepNumber: 5
        description: List projects via the host adapter
        type: call
        targetComponent: cli_host_adapter
        targetMethod: listProjects
      - stepNumber: 6
        description: Return after list
        type: return
        outcome: listed
      - stepNumber: 7
        description: Destroy the project via the host adapter
        type: call
        targetComponent: cli_host_adapter
        targetMethod: destroyProject
      - stepNumber: 8
        description: Return after destroy
        type: return
        outcome: destroyed
      - stepNumber: 9
        description: Return on unknown action
        type: return
        outcome: unknown action
  - name: runHostLock
    sourcePath: src/commands/host.ts
    narrative:
      - stepNumber: 1
        description: Read the master credential from the environment
        type: local
      - stepNumber: 2
        description: Lock the project via the host adapter
        type: call
        targetComponent: cli_host_adapter
        targetMethod: lockProject
      - stepNumber: 3
        description: Print the lock record (stateId and status)
        type: local
      - stepNumber: 4
        description: Return after lock
        type: return
        outcome: locked
  - name: runProduce
    sourcePath: src/commands/produce.ts
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the target credential (--token, else env, else interactive prompt) and set it for
          the operation
        type: local
      - stepNumber: 2
        description: Configure the target for the local project (parent page from --page)
        type: call
        targetComponent: cli_producer_adapter
        targetMethod: configure
      - stepNumber: 3
        description: Project the local project's specs to the target
        type: call
        targetComponent: cli_producer_adapter
        targetMethod: produce
      - stepNumber: 4
        description: Return once produced
        type: return
        outcome: produced
  - name: runSubsystemAdd
    sourcePath: src/commands/subsystem.ts
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the parent project root by walking up from cwd and confirm through the core
          adapter that it holds an initialized wairon project; error if it does not (naming `wairon
          init`)
        type: call
        targetComponent: cli_core_adapter
        targetMethod: projectConfigExists
      - stepNumber: 2
        description: Require an explicit projectPath for an external (chained) subsystem
        type: branch
        condition: options.projectPath is not provided
        onFalseStep: 4
      - stepNumber: 3
        description: >-
          Reject: plain in-tree subsystems are authored via the SDD tools; this command creates
          external subsystems
        type: throw
        error: '--project-path is required (use the sdd_add_subsystem tool for in-tree subsystems)'
      - stepNumber: 4
        description: >-
          Read the subsystem already stored under that id, if any, through the core adapter — a
          re-run must not overwrite what the author set since
        type: call
        targetComponent: cli_core_adapter
        targetMethod: loadSubsystemSpec
      - stepNumber: 5
        description: >-
          State the restatement with only what this command owns — the id, the projectPath, and the
          display name when --name is given — plus, for a subsystem not yet stored, the name (--name
          or the id) and the placeholder description a new subsystem requires. A re-run therefore
          carries the stored description, published surface and trusted links instead of overwriting
          them
        type: local
      - stepNumber: 6
        description: >-
          Write it through the authoring client adapter, which requires the L0, derives parentSystem
          from it, and scaffolds the child project
        type: call
        targetComponent: cli_authoring_adapter
        targetMethod: writeSpec
      - stepNumber: 7
        description: Print confirmation (parent subsystem id + child project path) and next steps
        type: local
  - name: runInit
    sourcePath: src/commands/init.ts
    narrative:
      - stepNumber: 1
        description: Resolve the nearest ancestor wairon project root by walking up from cwd
        type: local
      - stepNumber: 2
        description: Detect whether cwd is itself an already-initialized wairon project root
        type: branch
        condition: the resolved root equals cwd (already initialized here)
        onFalseStep: 4
      - stepNumber: 3
        description: Report that the workspace is already initialized and stop
        type: return
        outcome: already initialized
      - stepNumber: 4
        description: Detect whether cwd sits inside a parent wairon project (subdirectory case)
        type: branch
        condition: a parent project root was found above cwd (root differs from cwd)
        onTrueStep: 5
        onFalseStep: 13
      - stepNumber: 5
        description: >-
          Prompt the user to create this subdirectory as an external subsystem of the detected
          parent project
        type: local
      - stepNumber: 6
        description: Honor the user's choice
        type: branch
        condition: the user declined the prompt
        onFalseStep: 8
      - stepNumber: 7
        description: Print guidance and stop without changes
        type: return
        outcome: declined
      - stepNumber: 8
        description: >-
          Read the parent project's system spec through the core adapter; a parent without one is
          refused
        type: call
        targetComponent: cli_core_adapter
        targetMethod: loadSystemSpec
      - stepNumber: 9
        description: >-
          Read the subsystem the parent project already stores under that id, if any, through the
          core adapter
        type: call
        targetComponent: cli_core_adapter
        targetMethod: loadSubsystemSpec
      - stepNumber: 10
        description: >-
          State the restatement with only what this command owns — the id (from --name or the
          directory name) and the projectPath (the relative path from the parent root to cwd) —
          plus, for a subsystem the parent does not store yet, the name and the placeholder
          description a new subsystem requires
        type: local
      - stepNumber: 11
        description: >-
          Write it into the parent project through the authoring client adapter, which wires the
          parent subsystem and scaffolds this directory's child project
        type: call
        targetComponent: cli_authoring_adapter
        targetMethod: writeSpec
      - stepNumber: 12
        description: Report the external subsystem was created and stop
        type: return
        outcome: external subsystem created
      - stepNumber: 13
        description: Bootstrap the standard .wai directory structure
        type: local
      - stepNumber: 14
        description: Does this folder already hold a project configuration (a half-finished init)?
        type: call
        targetComponent: cli_core_adapter
        targetMethod: projectConfigExists
      - stepNumber: 15
        description: >-
          Complete only what is missing: a folder that already holds a configuration keeps it as it
          is
        type: branch
        condition: the folder has no project configuration yet
        onFalseStep: 18
      - stepNumber: 16
        description: >-
          Read the store packs that apply by default, to seed as the new configuration's pack
          selections
        type: call
        targetComponent: cli_core_adapter
        targetMethod: defaultPackSelections
      - stepNumber: 17
        description: >-
          Compose the new project's configuration — its id (the project name slugified; none when
          the name yields no slug), the chosen targets and projectType, execution budgets off,
          component-implementer and agent-file generation off, the store packs declaring
          applyByDefault seeded as selections, and machine-wide packs recorded as off — and create
          it through the core adapter.
        type: call
        targetComponent: cli_core_adapter
        targetMethod: createProjectConfig
      - stepNumber: 18
        label: bootstrap_l0
        description: >-
          Bootstrap the L0 system spec through core, completing only what is missing (the same
          bootstrap every chained subproject gets)
        type: call
        targetComponent: cli_core_adapter
        targetMethod: ensureProjectInitialized
      - stepNumber: 19
        label: export_skills
        description: Export SDD skills templates
        type: call
        targetComponent: cli_skills_adapter
        targetMethod: exportSddSkills
      - stepNumber: 20
        description: >-
          For each tool the person chose to install machine-wide, find its global configuration file
          through the core adapter
        type: call
        targetComponent: cli_core_adapter
        targetMethod: globalGuideFilePath
      - stepNumber: 21
        description: Find each tool's in-project configuration file as well
        type: call
        targetComponent: cli_core_adapter
        targetMethod: localGuideFilePath
      - stepNumber: 22
        description: >-
          Write the guide into each one the plan asked for — the machine-wide guide into the global
          file, the in-project one into the local file. They say different things on purpose: the
          global guide must stay inert in projects that have no spec tree
        type: call
        targetComponent: cli_core_adapter
        targetMethod: injectGuide
      - stepNumber: 23
        description: >-
          Write the repository-root pointer for every target that got a local guide, and for the
          targets that want only a root file. A pointer rather than a copy, so there is one document
          to keep current instead of two that can disagree
        type: call
        targetComponent: cli_core_adapter
        targetMethod: writeRootGuideDelegator
      - stepNumber: 24
        description: Report what was created and where, and name the next command to run
        type: return
        outcome: initialized
  - name: runSubsystemMove
    sourcePath: src/commands/subsystem.ts
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the parent project root by walking up from cwd and confirm through the core
          adapter that it holds an initialized wairon project; error if it does not
        type: call
        targetComponent: cli_core_adapter
        targetMethod: projectConfigExists
      - stepNumber: 2
        description: Require the new location
        type: branch
        condition: options.projectPath is not provided
        onFalseStep: 4
      - stepNumber: 3
        description: 'Reject: the new location is required'
        type: throw
        error: '--project-path (the new location) is required'
      - stepNumber: 4
        description: Move the subproject directory and update its projectPath link
        type: call
        targetComponent: cli_core_adapter
        targetMethod: moveSubsystemProject
      - stepNumber: 5
        description: Print confirmation (old path to new path)
        type: local
  - name: runSubsystemExternalize
    sourcePath: src/commands/subsystem.ts
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the parent project root by walking up from cwd and confirm through the core
          adapter that it holds an initialized wairon project; error if it does not
        type: call
        targetComponent: cli_core_adapter
        targetMethod: projectConfigExists
      - stepNumber: 2
        description: Require the destination path
        type: branch
        condition: options.projectPath is not provided
        onFalseStep: 4
      - stepNumber: 3
        description: 'Reject: the destination is required'
        type: throw
        error: '--project-path (the subproject destination) is required'
      - stepNumber: 4
        description: Externalize the subsystem into a standalone subproject
        type: call
        targetComponent: cli_core_adapter
        targetMethod: externalizeSubsystem
      - stepNumber: 5
        description: >-
          Print confirmation, the new subproject path, and a reminder to move the source code and
          re-validate
        type: local
  - name: runSubsystemInternalize
    sourcePath: src/commands/subsystem.ts
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the parent project root by walking up from cwd and confirm through the core
          adapter that it holds an initialized wairon project; error if it does not
        type: call
        targetComponent: cli_core_adapter
        targetMethod: projectConfigExists
      - stepNumber: 2
        description: Internalize the external subsystem back into the parent tree
        type: call
        targetComponent: cli_core_adapter
        targetMethod: internalizeSubsystem
      - stepNumber: 3
        description: Print confirmation and a reminder to re-validate
        type: local
  - name: runSurface
    sourcePath: src/commands/surface.ts
    narrative:
      - stepNumber: 1
        description: Route on the surface action
        type: switch
        'on': action
        cases:
          - value: export
            step: 2
          - value: import
            step: 4
          - value: list
            step: 6
          - value: externals
            step: 8
          - value: pin
            step: 10
        defaultStep: 12
      - stepNumber: 2
        description: Export the own surface (audience/format/out/portal from options)
        type: call
        targetComponent: cli_surfaces_client_adapter
        targetMethod: exportSurface
      - stepNumber: 3
        description: >-
          Report the export result: every written path — with several portals and no --portal, one
          file per portal is written and each path is listed. Without an out path, print the single
          document when one portal remains, else list the available portals (portalId + name) so the
          caller can pick with --portal, rather than printing nothing.
        type: return
        outcome: exported
      - stepNumber: 4
        description: Import the foreign surface (source/origin from options)
        type: call
        targetComponent: cli_surfaces_client_adapter
        targetMethod: importSurface
      - stepNumber: 5
        description: Print the imported snapshot summary
        type: return
        outcome: imported
      - stepNumber: 6
        description: List the stored snapshots
        type: call
        targetComponent: cli_surfaces_client_adapter
        targetMethod: listSnapshots
      - stepNumber: 7
        description: Print the snapshot table
        type: return
        outcome: listed
      - stepNumber: 8
        description: >-
          Print a deprecation line (`wairon surface externals` is deprecated; use `wairon externals
          list` and `wairon externals status`), then list the project's external surfaces (parent
          family, siblings, foreign imports) with origin and freshness
        type: call
        targetComponent: cli_surfaces_client_adapter
        targetMethod: listExternalInterfaces
      - stepNumber: 9
        description: >-
          Print the externals table: one row per entry — sourceKind, key, origin, freshness,
          interface ids
        type: return
        outcome: externals listed
      - stepNumber: 10
        description: >-
          Print a deprecation line (`wairon surface pin` is deprecated; declare the parent or
          sibling under `externals` in .wai/project.yaml and use `wairon externals pin`), then pin
          the chaining parent's family and sibling surfaces into this chained child
        type: call
        targetComponent: cli_surfaces_client_adapter
        targetMethod: pinFamilySurfaces
      - stepNumber: 11
        description: >-
          Print the changed pinned paths — or that they were already up to date, or that a top root
          has no family to pin
        type: return
        outcome: pinned
      - stepNumber: 12
        description: Unknown surface action
        type: throw
        error: UnknownSurfaceActionError
  - name: runPacks
    narrative:
      - stepNumber: 1
        description: Dispatch on the action
        type: switch
        'on': action
        cases:
          - value: add
            step: 2
          - value: list
            step: 4
          - value: remove
            step: 6
        defaultStep: 8
      - stepNumber: 2
        description: Vendor and register a pack via the packs adapter
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: addPack
      - stepNumber: 3
        description: Return after add
        type: return
        outcome: added
      - stepNumber: 4
        description: List the loaded packs via the packs adapter
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: listPacks
      - stepNumber: 5
        description: Return after list
        type: return
        outcome: listed
      - stepNumber: 6
        description: Remove a vendored pack via the packs adapter
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: removePack
      - stepNumber: 7
        description: Return after remove
        type: return
        outcome: removed
      - stepNumber: 8
        description: Return on unknown action
        type: return
        outcome: unknown action
  - name: runRules
    narrative:
      - stepNumber: 1
        description: List the active conformance rules via the rules adapter
        type: call
        targetComponent: cli_rules_adapter
        targetMethod: listRules
      - stepNumber: 2
        description: Return after list
        type: return
        outcome: listed
  - name: runPatterns
    narrative:
      - stepNumber: 1
        description: List the pack-declared reusable patterns via the patterns adapter
        type: call
        targetComponent: cli_patterns_adapter
        targetMethod: listPatterns
      - stepNumber: 2
        description: Return after list
        type: return
        outcome: listed
  - name: runVariants
    narrative:
      - stepNumber: 1
        description: List the component variants via the variants adapter
        type: call
        targetComponent: cli_variants_adapter
        targetMethod: listVariants
      - stepNumber: 2
        description: Return after list
        type: return
        outcome: listed
  - name: runPack
    narrative:
      - stepNumber: 1
        description: Dispatch on the pack action.
        type: switch
        'on': action
        cases:
          - value: init
            step: 2
          - value: build
            step: 4
          - value: add
            step: 6
          - value: list
            step: 8
          - value: remove
            step: 10
          - value: install
            step: 13
          - value: uninstall
            step: 15
          - value: which
            step: 17
          - value: use
            step: 19
          - value: unuse
            step: 21
          - value: bundle
            step: 23
          - value: sync
            step: 25
        defaultStep: 12
      - stepNumber: 2
        label: doInit
        description: Scaffold a new pack project.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: initPack
      - stepNumber: 3
        description: Done.
        type: return
        outcome: init done
      - stepNumber: 4
        label: doBuild
        description: Build a .wpack archive.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: buildPack
      - stepNumber: 5
        description: Done.
        type: return
        outcome: build done
      - stepNumber: 6
        label: doAdd
        description: Install a pack (ZIP-aware).
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: addPack
      - stepNumber: 7
        description: Done.
        type: return
        outcome: add done
      - stepNumber: 8
        label: doList
        description: List packs.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: listPacks
      - stepNumber: 9
        description: Done.
        type: return
        outcome: list done
      - stepNumber: 10
        label: doRemove
        description: Remove a pack.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: removePack
      - stepNumber: 11
        description: Done.
        type: return
        outcome: remove done
      - stepNumber: 12
        label: unknown
        description: Unknown action.
        type: throw
        error: >-
          unknown pack action (expected init | build | install | uninstall | which | use | unuse |
          bundle | sync | add | list | remove)
      - stepNumber: 13
        label: doInstall
        description: >-
          Install a pack into this wairon install's store (applies to nothing until a project
          selects it).
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: installPack
      - stepNumber: 14
        description: Done.
        type: return
        outcome: install done
      - stepNumber: 15
        label: doUninstall
        description: Remove a pack from the store.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: uninstallStorePack
      - stepNumber: 16
        description: Done.
        type: return
        outcome: uninstall done
      - stepNumber: 17
        label: doWhich
        description: Identify which installed pack a name resolves to.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: whichPack
      - stepNumber: 18
        description: Done.
        type: return
        outcome: which done
      - stepNumber: 19
        label: doUse
        description: Select an installed pack for this project.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: usePack
      - stepNumber: 20
        description: Done.
        type: return
        outcome: use done
      - stepNumber: 21
        label: doUnuse
        description: Deselect a pack for this project.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: unusePack
      - stepNumber: 22
        description: Done.
        type: return
        outcome: unuse done
      - stepNumber: 23
        label: doBundle
        description: Commit a copy of a selected pack under .wai/packs/.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: bundlePack
      - stepNumber: 24
        description: Done.
        type: return
        outcome: bundle done
      - stepNumber: 25
        label: doSync
        description: Install every declared-but-missing pack from its recorded source.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: syncPacks
      - stepNumber: 26
        description: Done.
        type: return
        outcome: sync done
  - name: runLock
    narrative:
      - stepNumber: 1
        description: >-
          Is this checkout ATTACHED to a hosted project? A hosted lock is the instance's
          execute-primary workflow, not a local freeze.
        type: call
        targetComponent: remote_orchestrator
        targetMethod: resolveTarget
      - stepNumber: 2
        description: Attached?
        type: branch
        condition: a hosted target resolved
        onTrueStep: 3
        onFalseStep: 5
      - stepNumber: 3
        description: Lock the ATTACHED project on the instance.
        type: call
        targetComponent: remote_orchestrator
        targetMethod: lockAttached
      - stepNumber: 4
        description: >-
          Report the outcome verbatim — an approval-gated instance answers that a REQUEST was
          created, which must never be printed as a completed lock.
        type: return
        outcome: locked or requested
      - stepNumber: 5
        description: >-
          Not attached: read the project configuration — its rule severities and projectType govern
          the as-complete gate.
        type: call
        targetComponent: cli_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 6
        description: Run the as-complete dry-run gate over the tree
        type: call
        targetComponent: cli_validator_adapter
        targetMethod: validateAsComplete
      - stepNumber: 7
        description: The gate found errors (an invalid tree is never frozen)
        type: branch
        condition: as-complete validation reported errors
        onFalseStep: 9
      - stepNumber: 8
        description: Refuse the lock, printing the blocking findings
        type: return
        outcome: refused
      - stepNumber: 9
        description: >-
          Confirm with the human (skipped under --yes), then freeze the tree through the lock
          adapter
        type: call
        targetComponent: cli_lock_adapter
        targetMethod: lockTree
      - stepNumber: 10
        description: >-
          Refresh the generated outputs (runGenerate): re-render owner/architect files, prune stale
          managed agents against the full topology, re-export skills, re-inject guides
        type: local
      - stepNumber: 11
        description: Print the lock record and return
        type: return
        outcome: locked
    symbol: lockCommand
  - name: runAgent
    narrative:
      - stepNumber: 1
        description: Dispatch on the agent action
        type: switch
        'on': action
        cases:
          - value: brief
            step: 2
          - value: customize
            step: 4
        defaultStep: 9
      - stepNumber: 2
        description: Compose the agent's live brief via the core client adapter
        type: call
        targetComponent: cli_core_adapter
        targetMethod: composeAgentBrief
      - stepNumber: 3
        description: Print the rendered brief (instructions + ownedPaths/readPaths scope)
        type: return
        outcome: brief printed
      - stepNumber: 4
        description: Compose the agent's live brief via the core client adapter to seed the scaffold
        type: call
        targetComponent: cli_core_adapter
        targetMethod: composeAgentBrief
      - stepNumber: 5
        description: Refuse to clobber a user-owned file
        type: branch
        condition: .wai/agents/<id>.md already exists
        onTrueStep: 6
        onFalseStep: 7
      - stepNumber: 6
        description: The guidance file is user-owned — point at it for direct editing instead of overwriting
        type: throw
        error: GuidanceFileExistsError
      - stepNumber: 7
        description: >-
          Write the scaffold: a header explaining that spec-derived facts are inferred live (do not
          duplicate them), then the subsystem description as the starting content
        type: local
      - stepNumber: 8
        description: Report the created path and how it is used (folded into every future brief)
        type: return
        outcome: scaffolded
      - stepNumber: 9
        description: Unknown agent action
        type: throw
        error: unknown agent action (expected brief | customize)
  - name: runRemote
    sourcePath: src/commands/remote.ts
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the instance URL, project selector and bearer credential for this command:
          explicit flags, then the environment, then this checkout's recorded binding, then the
          agent's own MCP configuration. Refuse with actionable guidance when nothing resolves.
        type: local
      - stepNumber: 2
        description: Route on the remote action
        type: switch
        'on': action
        cases:
          - value: push
            step: 3
          - value: pull
            step: 5
          - value: attach
            step: 7
          - value: detach
            step: 9
          - value: status
            step: 11
        defaultStep: 13
      - stepNumber: 3
        description: >-
          Migrate the local spec tree into the hosted project (creating it first when --unit was
          given).
        type: call
        targetComponent: remote_orchestrator
        targetMethod: pushTree
      - stepNumber: 4
        description: Report what was pushed
        type: jump
        toStep: 14
      - stepNumber: 5
        description: Migrate the hosted spec tree into this checkout.
        type: call
        targetComponent: remote_orchestrator
        targetMethod: pullTree
      - stepNumber: 6
        description: Report what was pulled
        type: jump
        toStep: 14
      - stepNumber: 7
        description: >-
          Record a standing binding for this checkout, after verifying it resolves against the
          instance.
        type: call
        targetComponent: remote_orchestrator
        targetMethod: attach
      - stepNumber: 8
        label: attachReported
        description: Report what is now attached
        type: jump
        toStep: 14
      - stepNumber: 9
        description: Remove the binding, returning the checkout to purely local operation.
        type: call
        targetComponent: remote_orchestrator
        targetMethod: detach
      - stepNumber: 10
        description: Report the detachment
        type: jump
        toStep: 14
      - stepNumber: 11
        description: >-
          Describe what this checkout is attached to and how it resolved — never printing the
          credential.
        type: call
        targetComponent: remote_orchestrator
        targetMethod: describeAttachment
      - stepNumber: 12
        description: Report the attachment
        type: jump
        toStep: 14
      - stepNumber: 13
        description: Reject an unknown remote action, naming the supported ones.
        type: throw
        error: 'Unknown remote action (supported: push, pull, attach, detach, status)'
      - stepNumber: 14
        label: outcome
        description: >-
          Print the outcome: for a migration, direction, instance and project, roots and file count,
          whether the project was created, and any backup path the destination reported — a replaced
          tree must always name what it can be undone from; for attach/detach/status, what this
          checkout now addresses and where that answer came from.
        type: local
  - name: runLogin
    sourcePath: src/commands/remote.ts
    narrative:
      - stepNumber: 1
        description: >-
          Take the token from --token or prompt for it without echoing, and normalize the instance
          URL.
        type: local
      - stepNumber: 2
        description: >-
          Verify the credential against the instance and store it for this machine — not for this
          project: a login serves every checkout, while binding a project is what `wairon remote
          attach` is for.
        type: call
        targetComponent: remote_orchestrator
        targetMethod: storeCredential
      - stepNumber: 3
        description: >-
          Confirm which instance is now reachable, and point at `wairon remote attach` as the next
          step. Never echo the credential.
        type: local
      - stepNumber: 4
        description: Confirm which instance is now reachable, without echoing the credential.
        type: local
  - name: runLogout
    sourcePath: src/commands/remote.ts
    narrative:
      - stepNumber: 1
        description: Was an instance named?
        type: branch
        condition: a url argument was supplied
        onTrueStep: 2
        onFalseStep: 4
      - stepNumber: 2
        description: Forget the stored credential for that instance.
        type: call
        targetComponent: remote_orchestrator
        targetMethod: forgetCredential
      - stepNumber: 3
        description: >-
          State plainly that this forgot the credential LOCALLY and did NOT revoke it on the
          instance — revocation lives in the hosted UI under Tokens. Then finish.
        type: return
        outcome: forgotten
      - stepNumber: 4
        label: listStored
        description: List the instances this machine holds a credential for, printing URLs only.
        type: call
        targetComponent: remote_orchestrator
        targetMethod: listStoredInstances
  - name: runStatus
    narrative:
      - stepNumber: 1
        description: Is this checkout ATTACHED to a hosted project?
        type: call
        targetComponent: remote_orchestrator
        targetMethod: resolveTarget
      - stepNumber: 2
        description: Attached?
        type: branch
        condition: a hosted target resolved
        onTrueStep: 3
        onFalseStep: 5
      - stepNumber: 3
        description: Read the ATTACHED project's completeness dashboard from the instance.
        type: call
        targetComponent: remote_orchestrator
        targetMethod: statusAttached
      - stepNumber: 4
        description: >-
          Print the hosted dashboard, naming the instance and project so it is never mistaken for a
          local tree.
        type: return
        outcome: reported remotely
      - stepNumber: 5
        description: 'Not attached: print the LOCAL spec tree''s completeness dashboard'
        type: call
        targetComponent: cli_runner
        targetMethod: localStatus
    symbol: statusCommand
  - name: runMcpServe
    sourcePath: src/commands/mcp.ts
    narrative:
      - stepNumber: 1
        description: Run the stdio MCP server against the resolved project root.
        type: call
        targetComponent: cli_mcp_adapter
        targetMethod: serveMcpStdio
  - name: runMcpInstall
    sourcePath: src/cli/index.ts
    narrative:
      - stepNumber: 1
        description: >-
          For a HOSTED registration, resolve the bearer to embed: the explicit flag, else the
          credential stored for that instance — done HERE because the config adapter may not read
          the credential store.
        type: call
        targetComponent: remote_orchestrator
        targetMethod: storedCredentialFor
      - stepNumber: 2
        description: >-
          Register (or self-heal) the wairon entry in the configured AI tools' MCP configuration —
          local stdio, or hosted http when an instance was named.
        type: call
        targetComponent: cli_mcp_adapter
        targetMethod: installMcpServer
    symbol: mcpInstallCommand
  - name: runMcpStatus
    sourcePath: src/commands/mcp.ts
    narrative:
      - stepNumber: 1
        description: Report where a wairon MCP server is registered and what it points at.
        type: call
        targetComponent: cli_mcp_adapter
        targetMethod: reportMcpStatus
  - name: runExecutionShow
    sourcePath: src/commands/execution.ts
    narrative:
      - stepNumber: 1
        description: Is this an initialized wairon project?
        type: call
        targetComponent: cli_core_adapter
        targetMethod: projectConfigExists
      - stepNumber: 2
        description: Budgets belong to a project.
        type: branch
        condition: the project has no configuration (not an initialized wairon project)
        onTrueStep: 3
        onFalseStep: 4
      - stepNumber: 3
        description: Refuse, naming `wairon init`.
        type: throw
        error: Not a wairon project — run `wairon init` first.
      - stepNumber: 4
        description: 'Read the project configuration: the execution tier and the per-agent overrides.'
        type: call
        targetComponent: cli_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 5
        description: Print the tier and the one-line description of what that tier means.
        type: local
      - stepNumber: 6
        description: Tier off derives nothing.
        type: branch
        condition: the tier is off
        onTrueStep: 7
        onFalseStep: 8
      - stepNumber: 7
        description: >-
          Print that no budgets are derived — briefs and generated agent files carry what they
          carried before budgets existed — and how to enable them (`wairon execution set-tier
          default`).
        type: return
        outcome: tier off, nothing derived
      - stepNumber: 8
        description: Ask the core adapter for the current agent topology, resolved from the live spec tree
        type: call
        targetComponent: cli_core_adapter
        targetMethod: resolveAgentTopology
      - stepNumber: 9
        description: An empty topology has nothing to budget.
        type: branch
        condition: the topology has no agents
        onTrueStep: 10
        onFalseStep: 11
      - stepNumber: 10
        description: Warn that there are no agents in the topology yet, so nothing is budgeted.
        type: return
        outcome: no agents
      - stepNumber: 11
        description: List every agent's allowance.
        type: loop
        loopKind: forEach
        over: the resolved agents
        endStep: 12
      - stepNumber: 12
        description: Ask the adapter what this agent's work is like
        type: call
        targetComponent: cli_core_adapter
        targetMethod: deriveExecutionProfile
      - stepNumber: 13
        description: >-
          Ask the adapter what that work earns under the project's dial, and print the row:
          capability tier, tool grant, turn ceiling, MCP reach, and the rationale underneath
        type: call
        targetComponent: cli_core_adapter
        targetMethod: resolveBudget
      - stepNumber: 14
        description: When the configuration declares per-agent overrides, print how many.
        type: local
      - stepNumber: 15
        description: >-
          When any agent is pinned to the frontier tier — only an override can do that — warn that
          frontier is a sparring partner for questions the specs do not settle rather than an owner
          tier, and that an owner needing it usually points at a component doing too much.
        type: local
      - stepNumber: 16
        description: Done.
        type: return
        outcome: allowances listed
    conformance: 'off'
    symbol: showExecution
  - name: runExecutionSetTier
    sourcePath: src/commands/execution.ts
    narrative:
      - stepNumber: 1
        description: Is this an initialized wairon project?
        type: call
        targetComponent: cli_core_adapter
        targetMethod: projectConfigExists
      - stepNumber: 2
        description: The dial belongs to a project.
        type: branch
        condition: the project has no configuration (not an initialized wairon project)
        onTrueStep: 3
        onFalseStep: 4
      - stepNumber: 3
        description: Refuse, naming `wairon init`.
        type: throw
        error: Not a wairon project — run `wairon init` first.
      - stepNumber: 4
        description: Only a known tier can be set.
        type: branch
        condition: the requested tier is not one of off | free | default | trade | aggressive
        onTrueStep: 5
        onFalseStep: 6
      - stepNumber: 5
        description: Refuse, listing the valid tiers.
        type: throw
        error: 'Unknown tier — expected one of: off, free, default, trade, aggressive.'
      - stepNumber: 6
        description: Read the project configuration for the current tier.
        type: call
        targetComponent: cli_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 7
        description: Setting the current tier again changes nothing.
        type: branch
        condition: the requested tier is already the current tier
        onTrueStep: 8
        onFalseStep: 9
      - stepNumber: 8
        description: Report that the tier is already set, writing nothing.
        type: return
        outcome: unchanged
      - stepNumber: 9
        description: Write execution.tier through the core adapter; per-agent overrides are kept.
        type: call
        targetComponent: cli_core_adapter
        targetMethod: setExecutionTier
      - stepNumber: 10
        description: >-
          Report the move (previous → new tier) and what the new tier costs — its description — then
          point at `wairon execution show` for the resulting allowances and at `wairon generate` to
          write them into materialized agent files.
        type: local
      - stepNumber: 11
        description: The cost-trading tiers get a warning.
        type: branch
        condition: the new tier is trade or aggressive
        onTrueStep: 12
        onFalseStep: 13
      - stepNumber: 12
        description: >-
          Warn that this tier trades quality for cost, and that a cheaper delegation needing a
          second round trip is not cheaper — measure it on real work before keeping it.
        type: local
      - stepNumber: 13
        description: Done.
        type: return
        outcome: tier set
    conformance: 'off'
    symbol: setExecutionTier
  - name: runDoctor
    sourcePath: src/commands/doctor.ts
    narrative:
      - stepNumber: 1
        description: With --fix, apply the repairs before the report, so the report shows the repaired state
        type: branch
        condition: '--fix was given'
        onFalseStep: 14
      - stepNumber: 2
        description: 'Read the configuration: the fixes need an initialized project whose configuration is valid'
        type: call
        targetComponent: cli_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 3
        description: Skip the fixes otherwise, warning when the configuration is invalid; the report flags both
        type: branch
        condition: the project is initialized and its configuration is valid
        onFalseStep: 14
      - stepNumber: 4
        description: >-
          Rebuild the derived context documents through the core adapter, each written only if it
          changed
        type: call
        targetComponent: cli_core_adapter
        targetMethod: syncContextFiles
      - stepNumber: 5
        description: Re-export the SDD skills for the active targets
        type: call
        targetComponent: cli_skills_adapter
        targetMethod: exportSddSkills
      - stepNumber: 6
        description: >-
          Re-inject the local AI guides for the active targets through the core adapter, recording
          which files were written so the report can name them
        type: call
        targetComponent: cli_core_adapter
        targetMethod: reinjectLocalGuides
      - stepNumber: 7
        description: >-
          Pin the installed-but-unapplied packs as explicit selections for a project that never
          declared a position on machine-wide packs, and print the names recorded
        type: call
        targetComponent: cli_core_adapter
        targetMethod: pinInstalledPacksAsSelections
      - stepNumber: 8
        description: >-
          List the spec files stored under a legacy name and rename each to the name the current
          layout expects
        type: call
        targetComponent: cli_core_adapter
        targetMethod: findLegacySpecFiles
      - stepNumber: 9
        description: >-
          Write a project configuration for each chained subproject with specs but none, and print
          the directories repaired
        type: call
        targetComponent: cli_core_adapter
        targetMethod: backfillChainedSubprojectConfigs
      - stepNumber: 10
        description: >-
          Retire the Specialists with apply true: each becomes an Orchestrator with the
          dependencyClass its dependencies decide, and each Specialist-based variant rebases onto
          Orchestrator; print what was retyped. Runs after the filename migration, so the retyped
          specs save under current names
        type: call
        targetComponent: cli_core_adapter
        targetMethod: retireSpecialists
      - stepNumber: 11
        description: >-
          Repair the narrative steps carrying a field their own type cannot have, with apply true:
          each foreign field is dropped and nothing else about the step changes; print what was
          repaired. A mechanical spec repair, like the filename migration above
        type: call
        targetComponent: cli_core_adapter
        targetMethod: repairForeignStepFields
      - stepNumber: 12
        description: Register or repair the MCP server for each active backend
        type: call
        targetComponent: cli_mcp_adapter
        targetMethod: installMcpServer
      - stepNumber: 13
        description: >-
          For a Gemini or Antigravity target, remove the legacy global Antigravity plugin whose name
          collides with the MCP server
        type: local
      - stepNumber: 14
        label: report
        description: 'Project: is this an initialized wairon project?'
        type: call
        targetComponent: cli_core_adapter
        targetMethod: projectConfigExists
      - stepNumber: 15
        description: Stop at a folder that is not a wairon project
        type: branch
        condition: the project is not initialized
        onFalseStep: 17
      - stepNumber: 16
        description: Report it, naming `wairon init`, print the summary and exit non-zero
        type: return
        outcome: not a wairon project
      - stepNumber: 17
        description: Report whether the configuration is valid, and read its active targets
        type: call
        targetComponent: cli_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 18
        description: 'Spec filenames: list the spec files still stored under a legacy name'
        type: call
        targetComponent: cli_core_adapter
        targetMethod: findLegacySpecFiles
      - stepNumber: 19
        description: 'Chained subprojects: list the ones with specs but no project.yaml'
        type: call
        targetComponent: cli_core_adapter
        targetMethod: findChainingSubprojectsMissingConfig
      - stepNumber: 20
        description: >-
          Report whether the system spec is present, whether the spec filenames are current, and any
          chained subproject with specs but no project.yaml
        type: local
      - stepNumber: 21
        description: >-
          Spec tree: with a system spec and a valid configuration, run the conformance gate and
          report its error, warning and notice counts; notices alone leave the check passing
        type: call
        targetComponent: cli_validator_adapter
        targetMethod: validateSddTree
      - stepNumber: 22
        description: >-
          Stereotypes: plan the Specialist retirement with apply false and report each Specialist
          with the dependencyClass it would take as an Orchestrator, and each variant to rebase,
          pointing at `wairon doctor --fix`; silent when no Specialist remains
        type: call
        targetComponent: cli_core_adapter
        targetMethod: retireSpecialists
      - stepNumber: 23
        description: >-
          Narrative steps: plan the foreign-field repair with apply false and report each step
          carrying a field its own type cannot have — the implementation, the method, the step and
          the fields — pointing at `wairon doctor --fix`; silent when every step is clean
        type: call
        targetComponent: cli_core_adapter
        targetMethod: repairForeignStepFields
      - stepNumber: 24
        description: >-
          Ask where the derived context documents live, so the staleness check reports on the
          generated pair and never on the two a person wrote
        type: call
        targetComponent: cli_core_adapter
        targetMethod: derivedDocPaths
      - stepNumber: 25
        description: >-
          Generated files and skills: read the version each one was stamped with and compare it
          against the running build, so a file written by an older wairon is reported as stale
          rather than assumed current
        type: call
        targetComponent: cli_core_adapter
        targetMethod: readStampVersion
      - stepNumber: 26
        description: >-
          Skills: for each active target, compare the installed SDD skills with what an export would
          write now, reporting the missing and stale ones
        type: call
        targetComponent: cli_skills_adapter
        targetMethod: checkSkillFreshness
      - stepNumber: 27
        description: 'Lock: compute the gate identity as it stands now'
        type: call
        targetComponent: cli_validator_adapter
        targetMethod: computeGateStateId
      - stepNumber: 28
        description: >-
          Resolve the lock against that identity: a locked lock reports when and by whom it was
          frozen, warning when it predates per-spec approval; a stale one warns to re-lock; a
          project never locked reports nothing. A failure here never breaks the report
        type: call
        targetComponent: cli_core_adapter
        targetMethod: readLockState
      - stepNumber: 29
        description: >-
          Extension packs: diagnose the project's pack situation — unresolved selections, installed
          packs not applied, packs applied from the machine-wide store
        type: call
        targetComponent: cli_core_adapter
        targetMethod: diagnoseProjectPacks
      - stepNumber: 30
        description: >-
          Report leftover approval baselines outside the project, never deleting them, and the
          extension packs: those unresolved, those installed but not applied, and those applied from
          the machine-wide store
        type: local
      - stepNumber: 31
        description: >-
          MCP server: check that each active backend's registration points at a launchable server,
          and flag a legacy global Antigravity plugin
        type: local
      - stepNumber: 32
        description: Print the summary, exiting non-zero when any check reported an error
        type: return
        outcome: reported
    detail: calls-only
  - name: runLockCheck
    narrative:
      - stepNumber: 1
        label: ask-adapter
        description: >-
          Ask the lock adapter for the approval verdict, passing --strict through. No
          project-initialization assertion first: a repository with no .wai/ at all must be told so,
          not met with an error about an uninitialized project.
        type: call
        targetComponent: cli_lock_adapter
        targetMethod: checkApproval
      - stepNumber: 2
        label: print-verdict
        description: >-
          Print the verdict line — a success as an ordinary line, a refusal as an error, so the CI
          log reads correctly at a glance.
        type: local
      - stepNumber: 3
        label: decide
        description: Did the verdict approve the tree?
        type: branch
        condition: the verdict approved
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        label: pass
        description: 'Return normally, exiting zero: the merged design is the approved design.'
        type: return
        outcome: approved
      - stepNumber: 5
        label: refuse
        description: >-
          Exit non-zero so the job fails. The workflow fails the job; whether that BLOCKS the merge
          is a branch-protection setting on the repository, which no workflow can declare for
          itself.
        type: return
        outcome: refused
    symbol: lockCheckCommand
  - name: runDiagram
    sourcePath: src/commands/diagram.ts
    narrative:
      - stepNumber: 1
        description: >-
          Render the requested format through the core client adapter, which crosses into sdd_core
          the way every other command does
        type: call
        targetComponent: cli_core_adapter
        targetMethod: renderDiagram
      - stepNumber: 2
        description: Write the artifact to the requested path and report where it landed
        type: return
        outcome: written
    symbol: runDiagram
