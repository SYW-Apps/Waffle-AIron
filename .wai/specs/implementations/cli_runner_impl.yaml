  - name: runExternals
    sourcePath: src/commands/externals.ts
    narrative:
      - stepNumber: 1
        description: Route on the externals action
        type: switch
        'on': action
        cases:
          - value: add
            step: 2
          - value: pin
            step: 4
          - value: status
            step: 6
          - value: list
            step: 8
          - value: remove
            step: 10
          - value: use
            step: 12
          - value: consumers
            step: 14
        defaultStep: 16
      - stepNumber: 2
        label: add
        description: >-
          Declare the external: the first argument is the alias, the second (when given) the source
          in the one location grammar; --project, --ref, --dir, --use, --description, --no-pin and
          --dry-run fill the rest of the request
        type: call
        targetComponent: cli_surfaces_client_adapter
        targetMethod: declareExternal
      - stepNumber: 3
        description: >-
          Print what was declared (the normalized declaration, the producer id it answers to, the
          pin) or what a dry run would declare — the producer checked in both; on a refusal print
          its one sentence naming the accepted form (or the audience that keeps a name from this
          project) and exit 1; when the producer could not be read print that it is declared but
          unpinned and why, and exit 2 (nothing was pinned — never a success a script reads as done)
          — or the JSON answer
        type: return
        outcome: added
      - stepNumber: 4
        label: pin
        description: Pin the named aliases, else every declared external
        type: call
        targetComponent: cli_surfaces_client_adapter
        targetMethod: pinExternals
      - stepNumber: 5
        description: >-
          Print one line per alias — pinned, unchanged, unresolved or unreachable, with the
          used-name count and each unexported reference (export it from the producer's L0 to pin
          it); a source.hosted external prints "hosted-only producer `<id>`: available only through
          the hosted server" instead of a bare unresolved — or the JSON answer; exit 1 when any
          alias could not be pinned (its previous pin stays)
        type: return
        outcome: pinned
      - stepNumber: 6
        label: status
        description: >-
          Read each external's status against its live producer, fetching git producers (not
          offline: this is the command that compares them)
        type: call
        targetComponent: cli_surfaces_client_adapter
        targetMethod: getExternalsStatus
      - stepNumber: 7
        description: >-
          Print the status table — per alias: source, pinned, reachable, then its health
          (incompatible | not compared | drifted | ok — never `current` beside `unreachable`), the
          carried facts a stale snapshot no longer matches (re-pin to refresh them), then each used
          member's state, a renamed one with the name it was renamed to, with
          EXTERNAL_CHECK_UNAVAILABLE and its reason on what could not be compared — then one legend
          defining every word it used and which fix each asks for (incompatible: adapt the uses,
          then re-pin; drifted: re-pin when convenient; not compared: make the producer reachable) —
          or the JSON answer. Exit with the worst health: 1 when any external is incompatible, 2
          when nothing is incompatible but something could not be compared (never a pass), 0
          otherwise
        type: return
        outcome: status reported
      - stepNumber: 8
        label: list
        description: List the declared externals
        type: call
        targetComponent: cli_surfaces_client_adapter
        targetMethod: listExternals
      - stepNumber: 9
        description: >-
          Print the table — alias, producer id, source kind and relation, audience, pinned digest or
          the problem (a malformed declaration is listed with its problem, never hidden) — or the
          JSON answer
        type: return
        outcome: listed
      - stepNumber: 10
        label: remove
        description: >-
          Remove the external named by the first argument — its declaration and its pin together
          (--dry-run writes nothing)
        type: call
        targetComponent: cli_surfaces_client_adapter
        targetMethod: removeExternal
      - stepNumber: 11
        description: >-
          Print what was removed (the declaration, the pin) or the one-sentence refusal, exiting 1 —
          or the JSON answer
        type: return
        outcome: removed
      - stepNumber: 12
        label: use
        description: >-
          Change the `use` imports of the external named by the first argument: --add and --remove
          (comma-separated), --dry-run writes nothing
        type: call
        targetComponent: cli_surfaces_client_adapter
        targetMethod: updateExternalUse
      - stepNumber: 13
        description: >-
          Print the resulting `use` list and what moved, or the one-sentence refusal, exiting 1 — or
          the JSON answer
        type: return
        outcome: use changed
      - stepNumber: 14
        label: consumers
        description: >-
          List the projects that consume this project: the family in reach, and with --search the
          project roots in the named folders that declare it by path or git
        type: call
        targetComponent: cli_surfaces_client_adapter
        targetMethod: listConsumers
      - stepNumber: 15
        description: >-
          Print one line per consumer — its project, the alias and section it declares this project
          under, the root of one found by the search, the names it uses and the names it still
          writes that are no longer exported — and under it the methods its specs call on each
          contract it uses (`<name>.<method>`), so a producer about to rename a method reads who
          calls it; then where else a consumer can be (a sibling checkout is found with --search; a
          hosted one declares its dependency on its own side); or the JSON answer, `uses` included
        type: return
        outcome: consumers listed
      - stepNumber: 16
        label: unknown
        description: 'Unknown externals action (supported: add, pin, status, list, remove, use, consumers)'
        type: throw
        error: UnknownExternalsActionError
    detail: full
  - name: runMigration
    sourcePath: src/commands/subsystem.ts
    narrative:
      - stepNumber: 1
        description: >-
          Plan the request from the current project, asking it to announce the findings its result
          will have (announce: true) — printed among the plan's notes before anything is confirmed
        type: call
        targetComponent: cli_migration_adapter
        targetMethod: plan
      - stepNumber: 2
        description: >-
          Print the plan: the verb, the family root (and that it is not the whole family, when so),
          each owner's edits, every refusal, every notes line, the file changes per owner (one line
          each, a count past a screenful), and the projects to re-lock
        type: local
      - stepNumber: 3
        description: Report only, refused or empty?
        type: branch
        condition: '--report was given, or the plan is blocked, or it has no file change'
        onFalseStep: 6
      - stepNumber: 4
        description: Drop the plan's rehearsal; nothing was written
        type: call
        targetComponent: cli_migration_adapter
        targetMethod: discard
      - stepNumber: 5
        description: >-
          Stop: exit non-zero for a refused plan, zero for a report or an empty plan ("nothing to
          migrate")
        type: return
        outcome: reported
      - stepNumber: 6
        label: confirm
        description: >-
          Ask to apply it: --yes answers; a non-interactive shell without --yes is answered no with
          a message naming --yes, and the command exits non-zero — not applied and declined by
          nobody, so a script never reads success
        type: local
      - stepNumber: 7
        description: Confirmed?
        type: branch
        condition: the person declined
        onFalseStep: 10
      - stepNumber: 8
        description: Drop the plan's rehearsal
        type: call
        targetComponent: cli_migration_adapter
        targetMethod: discard
      - stepNumber: 9
        description: >-
          Stop, having written nothing (non-zero when no terminal could confirm; zero when the
          person declined)
        type: return
        outcome: declined
      - stepNumber: 10
        label: apply
        description: Apply the confirmed plan, all or nothing
        type: call
        targetComponent: cli_migration_adapter
        targetMethod: apply
      - stepNumber: 11
        label: outcome
        description: >-
          Print the outcome: committed with each project to re-lock ("run `wairon lock` there");
          failed with what failed and that the family is unchanged; or failed with the files `wairon
          doctor --fix` must restore
        type: local
      - stepNumber: 12
        label: made-projects
        description: >-
          Did the applied migration make a new project (a promote, or an externalize --as project)?
          A project made for a team must be usable by that team's session in its own folder
        type: branch
        condition: the migration applied and made a new project
        onTrueStep: 13
        onFalseStep: 16
      - stepNumber: 13
        description: For each project the migration made
        type: loop
        loopKind: forEach
        over: each project the migration made, at its own root
        endStep: 15
      - stepNumber: 14
        description: >-
          Bound at that project's root, give it what `wairon init` gives a project: its guide and
          root pointer, its skills and its context, for its configured targets (generate's own layer
          — no agent files unless it opts in)
        type: call
        targetComponent: cli_runner
        targetMethod: runGenerate
      - stepNumber: 15
        description: >-
          Register its portable project MCP entry (.mcp.json) when claude is a configured target,
          and print one line naming the folder a teammate opens a session in
        type: call
        targetComponent: cli_mcp_adapter
        targetMethod: installMcpServer
      - stepNumber: 16
        label: demoted-scaffold
        description: >-
          After an applied demote the member's folder is a part, no project root: remove the session
          scaffold a promote gave it — the wairon entry of its .mcp.json, the wairon guide and
          skills under .claude/ and the wairon block of its CLAUDE.md root pointer — deleting a file
          only when nothing but wairon's own content is left in it, and print each file removed and
          each kept with why (someone else's content is in it)
        type: local
      - stepNumber: 17
        description: Done, exiting non-zero when the migration failed
        type: return
        outcome: applied or failed
