          Run the stage-7 member upgrade via the host adapter — a dry-run plan, applied all or
          nothing only with --fix
        type: call
        targetComponent: cli_host_adapter
        targetMethod: upgradeMembers
      - stepNumber: 7
        description: Nothing to upgrade?
        type: branch
        condition: >-
          no unfinished transaction was found, and the plan has no member to register or relocate,
          no key to rewrite and no refusal
        onFalseStep: 9
      - stepNumber: 8
        description: Report the members as registered
        type: return
        outcome: nothing to upgrade
      - stepNumber: 9
        label: members
        description: >-
          Print each unfinished transaction found under the data directory (rolled back or cleaned
          with --fix, pending without it), then the plan once per family: each member with its
          parent and path, the reach proof as one line per member (rows compared, all equal —
          nobody's reach changes), each rewritten key entry with its widening, and every refusal (an
          unreadable member named with why); warn when it was a dry run (re-run with --fix) or a
          blocked plan (nothing written), and say what was restored when the apply failed
        type: local
      - stepNumber: 10
        description: Return after the report
        type: return
        outcome: reported
