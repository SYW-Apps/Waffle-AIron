id: cli_runner_impl
name: CLI Runner Implementation
description: >-
  Concrete implementation of the CLI Runner Interface mapping commander subcommands to core engine
  logic.
contract: icli_runner
sourcePath: src/cli/index.ts
methods:
  - name: runValidate
    narrative:
      - stepNumber: 1
        description: Load project configuration file
        type: local
      - stepNumber: 2
        description: Validate registry rules
        type: call
        targetComponent: cli_validator_adapter
        targetMethod: validateRegistry
      - stepNumber: 3
        description: Validate project configuration
        type: call
        targetComponent: cli_validator_adapter
        targetMethod: validateProjectConfig
      - stepNumber: 4
        description: Validate SDD specification tree
        type: call
        targetComponent: cli_validator_adapter
        targetMethod: validateSddTree
      - stepNumber: 5
        description: Print validation errors/warnings and exit process if invalid
        type: local
  - name: runGenerate
    narrative:
      - stepNumber: 1
        description: Load spec system
        type: call
        targetComponent: cli_core_adapter
        targetMethod: loadSystemSpec
      - stepNumber: 2
        description: Generate Dynamic Agent outputs matching configured target engines
        type: local
  - name: runList
    narrative:
      - stepNumber: 1
        description: Load specs using spec loader
        type: call
        targetComponent: cli_core_adapter
        targetMethod: loadSystemSpec
      - stepNumber: 2
        description: Format and print resolved dynamic agent list to stdout
        type: local
  - name: runShow
    narrative:
      - stepNumber: 1
        description: Load spec system
        type: call
        targetComponent: cli_core_adapter
        targetMethod: loadSystemSpec
      - stepNumber: 2
        description: Format and display details for specified dynamic agent
        type: local
  - name: runUpdate
    narrative:
      - stepNumber: 1
        description: Check remote github release page for new releases
        type: local
      - stepNumber: 2
        description: If new release is found and not in check-only mode, pull and apply updates
        type: local
  - name: runHostProject
    narrative:
      - stepNumber: 1
        description: Read the master credential from the environment
        type: local
      - stepNumber: 2
        description: Dispatch on the action
        type: switch
        'on': action
        cases:
          - value: create
            step: 3
          - value: list
            step: 5
          - value: destroy
            step: 7
        defaultStep: 9
      - stepNumber: 3
        description: Create the project via the host adapter
        type: call
        targetComponent: cli_host_adapter
        targetMethod: createProject
      - stepNumber: 4
        description: Return after create
        type: return
        outcome: created
      - stepNumber: 5
        description: List projects via the host adapter
        type: call
        targetComponent: cli_host_adapter
        targetMethod: listProjects
      - stepNumber: 6
        description: Return after list
        type: return
        outcome: listed
      - stepNumber: 7
        description: Destroy the project via the host adapter
        type: call
        targetComponent: cli_host_adapter
        targetMethod: destroyProject
      - stepNumber: 8
        description: Return after destroy
        type: return
        outcome: destroyed
      - stepNumber: 9
        description: Return on unknown action
        type: return
        outcome: unknown action
  - name: runHostKey
    narrative:
      - stepNumber: 1
        description: Read the master credential from the environment
        type: local
      - stepNumber: 2
        description: Dispatch on the action
        type: switch
        'on': action
        cases:
          - value: mint
            step: 3
          - value: revoke
            step: 5
          - value: list
            step: 7
        defaultStep: 9
      - stepNumber: 3
        description: Mint a key via the host adapter
        type: call
        targetComponent: cli_host_adapter
        targetMethod: mintKey
      - stepNumber: 4
        description: Return after mint
        type: return
        outcome: minted
      - stepNumber: 5
        description: Revoke a key via the host adapter
        type: call
        targetComponent: cli_host_adapter
        targetMethod: revokeKey
      - stepNumber: 6
        description: Return after revoke
        type: return
        outcome: revoked
      - stepNumber: 7
        description: List keys via the host adapter
        type: call
        targetComponent: cli_host_adapter
        targetMethod: listKeys
      - stepNumber: 8
        description: Return after list
        type: return
        outcome: listed
      - stepNumber: 9
        description: Return on unknown action
        type: return
        outcome: unknown action
  - name: runHostLock
    narrative:
      - stepNumber: 1
        description: Read the master credential from the environment
        type: local
      - stepNumber: 2
        description: Lock the project via the host adapter
        type: call
        targetComponent: cli_host_adapter
        targetMethod: lockProject
      - stepNumber: 3
        description: Print the lock record (stateId and status)
        type: local
      - stepNumber: 4
        description: Return after lock
        type: return
        outcome: locked
  - name: runHostPromote
    narrative:
      - stepNumber: 1
        description: Read the master credential from the environment
        type: local
      - stepNumber: 2
        description: Promote the project via the host adapter
        type: call
        targetComponent: cli_host_adapter
        targetMethod: promoteProject
      - stepNumber: 3
        description: Print the promote result
        type: local
      - stepNumber: 4
        description: Return after promote
        type: return
        outcome: promoted
  - name: runProduce
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the target credential (--token, else env, else interactive prompt) and set it for
          the operation
        type: local
      - stepNumber: 2
        description: Configure the target for the local project (parent page from --page)
        type: call
        targetComponent: cli_producer_adapter
        targetMethod: configure
      - stepNumber: 3
        description: Project the local project's specs to the target
        type: call
        targetComponent: cli_producer_adapter
        targetMethod: produce
      - stepNumber: 4
        description: Return once produced
        type: return
        outcome: produced
  - name: runSubsystemAdd
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the parent project root by walking up from cwd; error if cwd is not inside an
          initialized wairon project
        type: local
      - stepNumber: 2
        description: Require an explicit projectPath for an external (chained) subsystem
        type: branch
        condition: options.projectPath is not provided
        onFalseStep: 4
      - stepNumber: 3
        description: >-
          Reject: plain in-tree subsystems are authored via the SDD tools; this command creates
          external subsystems
        type: throw
        error: '--project-path is required (use the sdd_add_subsystem tool for in-tree subsystems)'
      - stepNumber: 4
        description: >-
          Compose the SubsystemSpec (id, display name from --name or id, description placeholder,
          projectPath from options)
        type: local
      - stepNumber: 5
        description: >-
          Create the chained subsystem: wire the parent subsystem spec and scaffold the child
          project
        type: call
        targetComponent: cli_core_adapter
        targetMethod: createChainedSubsystem
      - stepNumber: 6
        description: Print confirmation (parent subsystem id + child project path) and next steps
        type: local
  - name: runInit
    narrative:
      - stepNumber: 1
        description: Resolve the nearest ancestor wairon project root by walking up from cwd
        type: local
      - stepNumber: 2
        description: Detect whether cwd is itself an already-initialized wairon project root
        type: branch
        condition: the resolved root equals cwd (already initialized here)
        onFalseStep: 4
      - stepNumber: 3
        description: Report that the workspace is already initialized and stop
        type: return
        outcome: already initialized
      - stepNumber: 4
        description: Detect whether cwd sits inside a parent wairon project (subdirectory case)
        type: branch
        condition: a parent project root was found above cwd (root differs from cwd)
        onTrueStep: 5
        onFalseStep: 11
      - stepNumber: 5
        description: >-
          Prompt the user to create this subdirectory as an external subsystem of the detected
          parent project
        type: local
      - stepNumber: 6
        description: Honor the user's choice
        type: branch
        condition: the user declined the prompt
        onFalseStep: 8
      - stepNumber: 7
        description: Print guidance and stop without changes
        type: return
        outcome: declined
      - stepNumber: 8
        description: >-
          Compose the SubsystemSpec (id from --name or directory name, projectPath = relative path
          from the parent root to cwd)
        type: local
      - stepNumber: 9
        description: Wire the parent subsystem and scaffold this directory's child project
        type: call
        targetComponent: cli_core_adapter
        targetMethod: createChainedSubsystem
      - stepNumber: 10
        description: Report the external subsystem was created and stop
        type: return
        outcome: external subsystem created
      - stepNumber: 11
        description: Bootstrap the standard .wai directory structure
        type: local
      - stepNumber: 12
        description: Export SDD skills templates
        type: call
        targetComponent: cli_skills_adapter
        targetMethod: exportSddSkills
      - stepNumber: 13
        description: Generate default L0/L1/L2 spec files if empty
        type: local
  - name: runSubsystemMove
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the parent project root by walking up from cwd; error if cwd is not inside an
          initialized wairon project
        type: local
      - stepNumber: 2
        description: Require the new location
        type: branch
        condition: options.projectPath is not provided
        onFalseStep: 4
      - stepNumber: 3
        description: 'Reject: the new location is required'
        type: throw
        error: '--project-path (the new location) is required'
      - stepNumber: 4
        description: Move the subproject directory and update its projectPath link
        type: call
        targetComponent: cli_core_adapter
        targetMethod: moveSubsystemProject
      - stepNumber: 5
        description: Print confirmation (old path to new path)
        type: local
  - name: runSubsystemExternalize
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the parent project root by walking up from cwd; error if cwd is not inside an
          initialized wairon project
        type: local
      - stepNumber: 2
        description: Require the destination path
        type: branch
        condition: options.projectPath is not provided
        onFalseStep: 4
      - stepNumber: 3
        description: 'Reject: the destination is required'
        type: throw
        error: '--project-path (the subproject destination) is required'
      - stepNumber: 4
        description: Externalize the subsystem into a standalone subproject
        type: call
        targetComponent: cli_core_adapter
        targetMethod: externalizeSubsystem
      - stepNumber: 5
        description: >-
          Print confirmation, the new subproject path, and a reminder to move the source code and
          re-validate
        type: local
  - name: runSubsystemInternalize
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the parent project root by walking up from cwd; error if cwd is not inside an
          initialized wairon project
        type: local
      - stepNumber: 2
        description: Internalize the external subsystem back into the parent tree
        type: call
        targetComponent: cli_core_adapter
        targetMethod: internalizeSubsystem
      - stepNumber: 3
        description: Print confirmation and a reminder to re-validate
        type: local
  - name: runSurface
    narrative:
      - stepNumber: 1
        description: Route on the surface action
        type: switch
        'on': action
        cases:
          - value: export
            step: 2
          - value: import
            step: 4
          - value: list
            step: 6
          - value: generate-children
            step: 8
        defaultStep: 10
      - stepNumber: 2
        description: Export the own surface (audience/format/out from options)
        type: call
        targetComponent: cli_surfaces_client_adapter
        targetMethod: exportSurface
      - stepNumber: 3
        description: Print the export result
        type: return
        outcome: exported
      - stepNumber: 4
        description: Import the foreign surface (source/origin from options)
        type: call
        targetComponent: cli_surfaces_client_adapter
        targetMethod: importSurface
      - stepNumber: 5
        description: Print the imported snapshot summary
        type: return
        outcome: imported
      - stepNumber: 6
        description: List the stored snapshots
        type: call
        targetComponent: cli_surfaces_client_adapter
        targetMethod: listSnapshots
      - stepNumber: 7
        description: Print the snapshot table
        type: return
        outcome: listed
      - stepNumber: 8
        description: Generate parent snapshots into the chained children
        type: call
        targetComponent: cli_surfaces_client_adapter
        targetMethod: generateChildSnapshots
      - stepNumber: 9
        description: Print the written child paths
        type: return
        outcome: generated
      - stepNumber: 10
        description: Unknown surface action
        type: throw
        error: UnknownSurfaceActionError
  - name: runPacks
    narrative:
      - stepNumber: 1
        description: Dispatch on the action
        type: switch
        'on': action
        cases:
          - value: add
            step: 2
          - value: list
            step: 4
          - value: remove
            step: 6
        defaultStep: 8
      - stepNumber: 2
        description: Vendor and register a pack via the packs adapter
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: addPack
      - stepNumber: 3
        description: Return after add
        type: return
        outcome: added
      - stepNumber: 4
        description: List the loaded packs via the packs adapter
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: listPacks
      - stepNumber: 5
        description: Return after list
        type: return
        outcome: listed
      - stepNumber: 6
        description: Remove a vendored pack via the packs adapter
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: removePack
      - stepNumber: 7
        description: Return after remove
        type: return
        outcome: removed
      - stepNumber: 8
        description: Return on unknown action
        type: return
        outcome: unknown action
  - name: runRules
    narrative:
      - stepNumber: 1
        description: List the active conformance rules via the rules adapter
        type: call
        targetComponent: cli_rules_adapter
        targetMethod: listRules
      - stepNumber: 2
        description: Return after list
        type: return
        outcome: listed
  - name: runPatterns
    narrative:
      - stepNumber: 1
        description: List the pack-declared reusable patterns via the patterns adapter
        type: call
        targetComponent: cli_patterns_adapter
        targetMethod: listPatterns
      - stepNumber: 2
        description: Return after list
        type: return
        outcome: listed
  - name: runVariants
    narrative:
      - stepNumber: 1
        description: List the component variants via the variants adapter
        type: call
        targetComponent: cli_variants_adapter
        targetMethod: listVariants
      - stepNumber: 2
        description: Return after list
        type: return
        outcome: listed
  - name: runPack
    narrative:
      - stepNumber: 1
        description: Dispatch on the pack action.
        type: switch
        'on': action
        cases:
          - value: init
            step: 2
          - value: build
            step: 4
          - value: add
            step: 6
          - value: list
            step: 8
          - value: remove
            step: 10
        defaultStep: 12
      - stepNumber: 2
        label: doInit
        description: Scaffold a new pack project.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: initPack
      - stepNumber: 3
        description: Done.
        type: return
        outcome: init done
      - stepNumber: 4
        label: doBuild
        description: Build a .wpack archive.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: buildPack
      - stepNumber: 5
        description: Done.
        type: return
        outcome: build done
      - stepNumber: 6
        label: doAdd
        description: Install a pack (ZIP-aware).
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: addPack
      - stepNumber: 7
        description: Done.
        type: return
        outcome: add done
      - stepNumber: 8
        label: doList
        description: List packs.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: listPacks
      - stepNumber: 9
        description: Done.
        type: return
        outcome: list done
      - stepNumber: 10
        label: doRemove
        description: Remove a pack.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: removePack
      - stepNumber: 11
        description: Done.
        type: return
        outcome: remove done
      - stepNumber: 12
        label: unknown
        description: Unknown action.
        type: throw
        error: unknown pack action (expected init | build | add | list | remove)
status: complete
createdAt: '2026-06-11T14:50:00Z'
updatedAt: '2026-07-21T18:45:25.104Z'
