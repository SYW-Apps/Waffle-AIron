id: cli_runner_impl
name: CLI Runner Implementation
description: >-
  Concrete implementation of the CLI Runner Interface: the workflows cli_portal (src/cli/index.ts)
  dispatches each command to — those with no command module of their own in src/cli/runner.ts, the
  rest in the src/commands/ module named per method — mapping each parsed command onto the core
  engine.
contract: icli_runner
sourcePath: src/cli/runner.ts
methods:
  - name: runValidate
    narrative:
      - stepNumber: 1
        description: >-
          Is this checkout ATTACHED to a hosted project? An attached checkout has no local tree, so
          validating locally would report a vacuous pass.
        type: call
        targetComponent: remote_orchestrator
        targetMethod: resolveTarget
      - stepNumber: 2
        description: Attached?
        type: branch
        condition: a hosted target resolved
        onTrueStep: 3
        onFalseStep: 5
      - stepNumber: 3
        description: >-
          Validate the ATTACHED project's tree on the instance instead, forwarding --family: the
          instance runs the family run within the credential's reach and never beyond it.
        type: call
        targetComponent: remote_orchestrator
        targetMethod: validateAttached
      - stepNumber: 4
        description: >-
          Print the hosted findings — errors, warnings and notices, each as its own kind — and exit
          non-zero when it reported errors, or warnings under --ci, exactly as a local run would;
          notices never fail it.
        type: return
        outcome: validated remotely
      - stepNumber: 5
        description: >-
          Pending transaction banner, before the tree is read (a crash mid-swap may leave it
          unreadable): ask the migration portal (recover with fix false) for unfinished
          family-migration transactions under this root; each becomes a notice-level line in the
          output naming its id, verb and coordinator phase and pointing at `wairon doctor --fix` —
          never an error, so --ci is unaffected
        type: call
        targetComponent: cli_migration_adapter
        targetMethod: recover
      - stepNumber: 6
        description: >-
          Not attached: run the whole local validation workflow — registry, project config and spec
          tree — through the validator adapter.
        type: call
        targetComponent: cli_validator_adapter
        targetMethod: runValidation
      - stepNumber: 7
        description: >-
          Print validation errors, warnings and notices, the run's hint and its code-reading line
          (the grade the code was read at and, at exact grade, the compiler and whose copy it is),
          and exit process if invalid
        type: local
    symbol: validateCommand
  - name: runGenerate
    sourcePath: src/commands/generate.ts
    narrative:
      - stepNumber: 1
        description: >-
          Read the project configuration: the configured targets and whether agent files are
          materialized (rules.materializeAgentFiles).
        type: call
        targetComponent: cli_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 2
        description: Resolve the agent topology from the spec tree through the core adapter
        type: call
        targetComponent: cli_core_adapter
        targetMethod: resolveAgentTopology
      - stepNumber: 3
        description: Did the spec tree resolve any agent?
        type: branch
        condition: at least one agent resolved from the spec tree
        onFalseStep: 13
      - stepNumber: 4
        label: outside-targets
        description: >-
          Find the configured targets whose agent-file directory resolves outside the project root.
          Without --global, name each one and say it is skipped — it is left out of both the write
          and the prune, and nothing outside the project is touched. With --global it is written,
          and every file there the run replaces or prunes is first copied beside itself as
          <file>.wairon-backup-<timestamp>, whose path is printed
        type: local
      - stepNumber: 5
        description: >-
          Generate the agent outputs for the configured target engines when agent files are
          materialized — every target whose files land inside the project root, and an outside one
          only under --global
        type: call
        targetComponent: cli_core_adapter
        targetMethod: generateAll
      - stepNumber: 6
        description: >-
          Ask which files a generate run owns, so stale managed agent files can be pruned against
          the full resolved topology (also under a domain scope) without deleting something wairon
          never wrote; a directory outside the project root is pruned only under --global, each
          pruned file first backed up beside itself
        type: call
        targetComponent: cli_core_adapter
        targetMethod: resolveExpectedOutputPaths
      - stepNumber: 7
        description: Re-export the SDD skills when the spec tree exists
        type: call
        targetComponent: cli_skills_adapter
        targetMethod: exportSddSkills
      - stepNumber: 8
        description: >-
          Ask whether this project keeps a context directory — the derived documents are owed
          whenever it does, whether or not a person ever wrote the project document, so generate and
          doctor --fix keep the same documents current
        type: call
        targetComponent: cli_core_adapter
        targetMethod: hasContext
      - stepNumber: 9
        label: context-kept
        description: >-
          Owe the derived context documents only to a project that keeps a context directory; one
          without it goes straight on to the guides, as before
        type: branch
        condition: the project keeps a context directory
        onFalseStep: 11
      - stepNumber: 10
        description: >-
          Rebuild the derived context documents through the core adapter, each written only if it
          changed — so a regenerate with no design change behind it leaves no diff
        type: call
        targetComponent: cli_core_adapter
        targetMethod: syncContextFiles
      - stepNumber: 11
        label: reinject-guides
        description: >-
          Re-inject the local AI guides for the configuration's active targets through the core
          adapter, so a guide never outlives the tree it claims to describe
        type: call
        targetComponent: cli_core_adapter
        targetMethod: reinjectLocalGuides
      - stepNumber: 12
        description: Continue to the member walk decision
        type: jump
        toStep: 14
      - stepNumber: 13
        description: 'Warn that no agent resolved from the spec tree: define subsystems and components first'
        type: local
      - stepNumber: 14
        description: Was the member walk asked for?
        type: branch
        condition: '--family was given, and the run is neither scoped to a domain or root nor a dry run'
        onTrueStep: 16
        onFalseStep: 15
      - stepNumber: 15
        description: >-
          Stop after this project's own outputs — the default since stage 5: generate never
          cascades, so nothing below the project is written unless the family walk is asked for
        type: return
        outcome: this project's outputs generated
      - stepNumber: 16
        description: >-
          --family: list this project's direct members (declared in `members`, or for one release
          legacy mounts)
        type: call
        targetComponent: cli_core_adapter
        targetMethod: listDirectChainedSubprojects
      - stepNumber: 17
        description: Generate each member's layer in its own root
        type: loop
        loopKind: forEach
        over: each direct member
        endStep: 19
      - stepNumber: 18
        description: >-
          Complete the member's bootstrap without overwriting it — an explicitly asked-for write; a
          configuration written here declares the alias as the member's project id
        type: call
        targetComponent: cli_core_adapter
        targetMethod: ensureProjectInitialized
      - stepNumber: 19
        description: >-
          Generate the member's own outputs and, since --family carries down, its own members' — by
          running this command bound to the member's root
        type: local
      - stepNumber: 20
        description: Every member's layer is generated
        type: return
        outcome: the family's outputs generated
  - name: runList
    sourcePath: src/commands/list.ts
    narrative:
      - stepNumber: 1
        description: Resolve the agent topology from the spec tree through the core adapter
        type: call
        targetComponent: cli_core_adapter
        targetMethod: resolveAgentTopology
      - stepNumber: 2
        description: Format and print resolved dynamic agent list to stdout
        type: local
  - name: runShow
    sourcePath: src/commands/show.ts
    narrative:
      - stepNumber: 1
        description: Resolve the agent topology from the spec tree through the core adapter
        type: call
        targetComponent: cli_core_adapter
        targetMethod: resolveAgentTopology
      - stepNumber: 2
        description: Format and display details for specified dynamic agent
        type: local
  - name: runUpdate
    sourcePath: src/commands/update.ts
    narrative:
      - stepNumber: 1
        description: Decide whether this run names a channel on the command line
        type: branch
        condition: a --channel was given
        onTrueStep: 2
        onFalseStep: 6
      - stepNumber: 2
        description: Decide whether it is a channel this build knows
        type: branch
        condition: the named channel is recognized
        onTrueStep: 3
        onFalseStep: 5
      - stepNumber: 3
        description: >-
          Record it for this machine, so choosing a channel outlives the run that chose it —
          `--channel` is a setting, not a per-invocation flag
        type: call
        targetComponent: user_config_store
        targetMethod: setChannel
      - stepNumber: 4
        description: Use the channel just named
        type: jump
        toStep: 7
      - stepNumber: 5
        description: Refuse by name, listing every valid channel, and exit non-zero without checking anything
        type: return
        outcome: unknown channel
      - stepNumber: 6
        description: Use the channel recorded for this machine
        type: call
        targetComponent: user_config_store
        targetMethod: channel
      - stepNumber: 7
        description: >-
          Ask GitHub for the release list. A failure here reports the network problem and stops,
          rather than reporting no update available — which would be indistinguishable from being
          current
        type: local
      - stepNumber: 8
        description: >-
          Keep only the releases eligible for that channel and take the newest, then say so when the
          running build is itself off-channel
        type: local
      - stepNumber: 9
        description: Decide whether anything newer is on offer
        type: branch
        condition: no eligible release is newer than the running build
        onTrueStep: 10
        onFalseStep: 11
      - stepNumber: 10
        description: >-
          Report already up to date, and mention a newer build waiting on a wider channel if one
          exists — so that being current on `stable` never silently hides a `beta` release
        type: return
        outcome: up to date
      - stepNumber: 11
        description: >-
          Report the new version and the first lines of its release notes, pointing at the full
          notes when they are longer
        type: local
      - stepNumber: 12
        description: Decide whether this run was only asking
        type: branch
        condition: check-only mode
        onTrueStep: 13
        onFalseStep: 14
      - stepNumber: 13
        description: >-
          Exit non-zero to signal that an update is available, having changed nothing — the non-zero
          status is the answer, for scripts that poll
        type: return
        outcome: update available
      - stepNumber: 14
        description: >-
          Download the asset for this platform and swap the running binary, keeping the previous one
          beside it so a bad release can be stepped back from
        type: local
      - stepNumber: 15
        description: Done
        type: return
        outcome: updated
    symbol: runUpdate
  - name: runHostProject
    sourcePath: src/commands/host.ts
    narrative:
      - stepNumber: 1
        description: Read the master credential from the environment
        type: local
      - stepNumber: 2
        description: Dispatch on the action
        type: switch
        'on': action
        cases:
          - value: create
            step: 3
          - value: list
            step: 5
          - value: destroy
            step: 7
        defaultStep: 9
      - stepNumber: 3
        description: Create the project via the host adapter
        type: call
        targetComponent: cli_host_adapter
        targetMethod: createProject
      - stepNumber: 4
        description: Return after create
        type: return
        outcome: created
      - stepNumber: 5
        description: List projects via the host adapter
        type: call
        targetComponent: cli_host_adapter
        targetMethod: listProjects
      - stepNumber: 6
        description: Return after list
        type: return
        outcome: listed
      - stepNumber: 7
        description: Destroy the project via the host adapter
        type: call
        targetComponent: cli_host_adapter
        targetMethod: destroyProject
      - stepNumber: 8
        description: Return after destroy
        type: return
        outcome: destroyed
      - stepNumber: 9
        description: Return on unknown action
        type: return
        outcome: unknown action
  - name: runHostLock
    sourcePath: src/commands/host.ts
    narrative:
      - stepNumber: 1
        description: Read the master credential from the environment
        type: local
      - stepNumber: 2
        description: Lock the project via the host adapter
        type: call
        targetComponent: cli_host_adapter
        targetMethod: lockProject
      - stepNumber: 3
        description: Print the lock record (stateId and status)
        type: local
      - stepNumber: 4
        description: Return after lock
        type: return
        outcome: locked
  - name: runProduce
    sourcePath: src/commands/produce.ts
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the target credential (--token, else env, else interactive prompt) and set it for
          the operation
        type: local
      - stepNumber: 2
        description: Configure the target for the local project (parent page from --page)
        type: call
        targetComponent: cli_producer_adapter
        targetMethod: configure
      - stepNumber: 3
        description: Project the local project's specs to the target
        type: call
        targetComponent: cli_producer_adapter
        targetMethod: produce
      - stepNumber: 4
        description: Return once produced
        type: return
        outcome: produced
  - name: runMemberAdd
    sourcePath: src/commands/subsystem.ts
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the parent project root by walking up from cwd and confirm through the core
          adapter that it holds an initialized wairon project; error if it does not (naming `wairon
          init`)
        type: call
        targetComponent: cli_core_adapter
        targetMethod: projectConfigExists
      - stepNumber: 2
        description: Require the member's source (`wairon member add <alias> <source>`)
        type: branch
        condition: no path was given
        onFalseStep: 4
      - stepNumber: 3
        description: 'Reject: a member needs a source — a contained path, a `../` sibling path, or a git URL'
        type: throw
        error: 'a source is required: wairon member add <alias> <path | ../path | git-url[#commit]>'
      - stepNumber: 4
        description: >-
          Create the member through the core adapter at the source — a part by default, a project
          with --project (its project content created) — each piece only when absent, and declare it
          in this project's `members` by the shorthand, with --description when given; idempotent,
          so a re-run completes a partial scaffold
        type: call
        targetComponent: cli_core_adapter
        targetMethod: createMember
      - stepNumber: 5
        description: >-
          Print confirmation: the alias, part or project, where it lives (and a git member's pinned
          commit); for a project whose configuration was created, the required packs it applied
          (name and pinned version), the projectType it set, and each requirement nothing installed
          satisfies. For a part, one line on the growth path: its subsystems are this project's own;
          `wairon member promote` makes it a project when it needs its own team, release, approval
          or public surface
        type: local
  - name: runInit
    sourcePath: src/commands/init.ts
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the project binding of cwd by the binding rule (WaiPaths): the nearest folder with
          an L0 walking up, never past the repository root unless an ancestor declares the crossing
          as a member
        type: local
      - stepNumber: 2
        description: Detect whether cwd is itself an already-initialized wairon project root
        type: branch
        condition: the bound root equals cwd (already initialized here)
        onTrueStep: 3
        onFalseStep: 4
      - stepNumber: 3
        description: Report that the workspace is already initialized and stop
        type: return
        outcome: already initialized
      - stepNumber: 4
        description: Would a parent project bind this folder (the binding resolved to a root above cwd)?
        type: branch
        condition: a parent project binds cwd (bound root differs from cwd)
        onTrueStep: 5
        onFalseStep: 15
      - stepNumber: 5
        description: >-
          Was the question answered in advance (--yes)? A folder a parent binds is never turned into
          that parent's member unasked
        type: branch
        condition: '--yes was given'
        onTrueStep: 6
        onFalseStep: 7
      - stepNumber: 6
        description: >-
          Refuse, writing nothing: name the project and root that bind this folder, and the exact
          commands — `cd <parent root> && wairon member add <alias> <relative path> --project` to
          make it a member project of that parent, or turn this folder into its own repository (`git
          init`) and re-run `wairon init` for an independent project. A project.yaml outside this
          folder is never edited without a question
        type: throw
        error: WaironError
      - stepNumber: 7
        description: >-
          Ask on the terminal whether to create this folder as a member project of the parent,
          saying that yes edits the parent's .wai/project.yaml (outside this folder)
        type: local
      - stepNumber: 8
        description: Honor the answer
        type: branch
        condition: the user declined
        onTrueStep: 9
        onFalseStep: 10
      - stepNumber: 9
        description: Print the same two commands as the refusal and stop without changes
        type: return
        outcome: declined
      - stepNumber: 10
        description: >-
          Read the parent project's system spec through the core adapter; a parent without one is
          refused
        type: call
        targetComponent: cli_core_adapter
        targetMethod: loadSystemSpec
      - stepNumber: 11
        description: >-
          Read the parent project's configuration through the core adapter, for the members it
          already declares
        type: call
        targetComponent: cli_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 12
        description: >-
          Compose the member: the alias (asked, defaulting to the directory name, slugified to
          [a-z0-9-_]+; the alias the parent already declares for this path wins) and the path (the
          relative path from the parent root to cwd); an alias the parent already declares for
          another path is refused by the write below
        type: local
      - stepNumber: 13
        description: >-
          Create the member from the parent's root: scaffold this directory's project (configuration
          declaring the alias as its id, L0) and declare it in the parent's project.yaml `members` —
          no L1 spec is written into the parent
        type: call
        targetComponent: cli_core_adapter
        targetMethod: createMember
      - stepNumber: 14
        description: >-
          Report the member was created and stop; when its configuration was created, state the
          parent's required packs it applied (name and pinned version), the projectType it set, and
          each requirement nothing installed satisfies, exactly as `wairon member add` does —
          scaffolding is an unattended pack write, so it shows no impact report
        type: return
        outcome: member created
      - stepNumber: 15
        description: Bootstrap the standard .wai directory structure
        type: local
      - stepNumber: 16
        description: Does this folder already hold a project configuration (a half-finished init)?
        type: call
        targetComponent: cli_core_adapter
        targetMethod: projectConfigExists
      - stepNumber: 17
        description: >-
          Complete only what is missing: a folder that already holds a configuration keeps it as it
          is
        type: branch
        condition: the folder has no project configuration yet
        onTrueStep: 18
        onFalseStep: 21
      - stepNumber: 18
        description: >-
          Read the store packs that apply by default, to seed as the new configuration's pack
          selections
        type: call
        targetComponent: cli_core_adapter
        targetMethod: defaultPackSelections
      - stepNumber: 19
        description: >-
          Compose the new project's configuration — its id (the project name slugified; when the
          slug is one the id grammar refuses — a device name such as con, the reserved `super`, or
          nothing at all — the slug with `-project` appended, `project` for an empty one, and a line
          saying why the folder name was not usable as it is, so a new project never starts without
          an id), the chosen targets (with --yes: claude only — a tool nobody chose gets no files)
          and projectType, execution budgets off, component-implementer and agent-file generation
          off, the store packs declaring applyByDefault seeded as selections, and machine-wide packs
          recorded as off — and create it through the core adapter.
        type: call
        targetComponent: cli_core_adapter
        targetMethod: createProjectConfig
      - stepNumber: 20
        description: >-
          Seed the context directory (.wai/context/) with its generated files through the core
          adapter
        type: call
        targetComponent: cli_core_adapter
        targetMethod: syncContextFiles
      - stepNumber: 21
        label: bootstrap_l0
        description: >-
          Bootstrap the L0 system spec through core, completing only what is missing (the same
          bootstrap every chained subproject gets)
        type: call
        targetComponent: cli_core_adapter
        targetMethod: ensureProjectInitialized
      - stepNumber: 22
        label: export_skills
        description: Export SDD skills templates for the configured targets only
        type: call
        targetComponent: cli_skills_adapter
        targetMethod: exportSddSkills
      - stepNumber: 23
        description: >-
          For each tool the person chose to install machine-wide, find its global configuration file
          through the core adapter
        type: call
        targetComponent: cli_core_adapter
        targetMethod: globalGuideFilePath
      - stepNumber: 24
        description: >-
          Find the in-project configuration file of each configured target as well — a target nobody
          chose gets none
        type: call
        targetComponent: cli_core_adapter
        targetMethod: localGuideFilePath
      - stepNumber: 25
        description: >-
          Write the guide into each one the plan asked for — the machine-wide guide into the global
          file, the in-project one into the local file. They say different things on purpose: the
          global guide must stay inert in projects that have no spec tree
        type: call
        targetComponent: cli_core_adapter
        targetMethod: injectGuide
      - stepNumber: 26
        description: >-
          Write wairon's block of the repository-root pointer for every target that got a local
          guide, and for the targets that want only a root file. A pointer rather than a copy, so
          there is one document to keep current instead of two that can disagree; and a block
          between markers, because the root file is usually the user's own: every byte of it outside
          the markers is kept, and the report says the block was written into an existing file
          rather than that a file was created
        type: call
        targetComponent: cli_core_adapter
        targetMethod: writeRootGuideDelegator
      - stepNumber: 27
        description: Report what was created and where, and name the next command to run
        type: return
        outcome: initialized
  - name: runMemberMove
    sourcePath: src/commands/subsystem.ts
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the parent project root by walking up from cwd and confirm through the core
          adapter that it holds an initialized wairon project; error if it does not
        type: call
        targetComponent: cli_core_adapter
        targetMethod: projectConfigExists
      - stepNumber: 2
        description: Require the new location
        type: branch
        condition: no new path was given
        onFalseStep: 4
      - stepNumber: 3
        description: 'Reject: the new location is required'
        type: throw
        error: 'a new path is required: wairon member move <alias> <path>'
      - stepNumber: 4
        description: Move the member's directory and point its `members` entry there
        type: call
        targetComponent: cli_core_adapter
        targetMethod: moveMember
      - stepNumber: 5
        description: Print confirmation (alias, old path to new path)
        type: local
  - name: runSubsystemExternalize
    sourcePath: src/commands/subsystem.ts
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the current project root and confirm it is an initialized wairon project; error if
          not
        type: call
        targetComponent: cli_core_adapter
        targetMethod: projectConfigExists
      - stepNumber: 2
        description: Require the destination path
        type: branch
        condition: options.path is not provided
        onFalseStep: 4
      - stepNumber: 3
        description: 'Reject: the destination is required'
        type: throw
        error: '--path (the member''s destination) is required'
      - stepNumber: 4
        label: request
        description: >-
          Build the externalize request, with --as (part, the default — a storage move into a part;
          project — the move composed with a promote)
        type: local
      - stepNumber: 5
        description: Run it through the shared migration flow; remind that source code is moved by the user
        type: call
        targetComponent: cli_runner
        targetMethod: runMigration
  - name: runMemberInternalize
    sourcePath: src/commands/subsystem.ts
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the current project root and confirm it is an initialized wairon project; error if
          not
        type: call
        targetComponent: cli_core_adapter
        targetMethod: projectConfigExists
      - stepNumber: 2
        description: Build the internalize request, its destination from --into, --packs and --export
        type: local
      - stepNumber: 3
        description: Run it through the shared migration flow
        type: call
        targetComponent: cli_runner
        targetMethod: runMigration
  - name: runSurface
    sourcePath: src/commands/surface.ts
    narrative:
      - stepNumber: 1
        description: Route on the surface action
        type: switch
        'on': action
        cases:
          - value: export
            step: 2
          - value: import
            step: 5
          - value: list
            step: 7
          - value: diff
            step: 9
        defaultStep: 11
      - stepNumber: 2
        description: >-
          Export the own surface (format/out/portal from options; the audience from --audience, else
          `project` for --format openapi — the project's own service document, every HTTP Portal it
          has, exported or not — and `instance` for the native snapshot)
        type: call
        targetComponent: cli_surfaces_client_adapter
        targetMethod: exportSurface
      - stepNumber: 3
        description: >-
          Judge the bound project with the owner's gate, so an export of a design the gate refuses
          never reads as a success
        type: call
        targetComponent: cli_validator_adapter
        targetMethod: validateProject
      - stepNumber: 4
        description: >-
          Report the export result. The status line (what was projected) goes to stderr, so a
          document printed to stdout is the document and nothing else; it is a warning, never a
          success mark, when the projection holds no interface and no type (naming that the export
          table publishes nothing at that audience) or when the gate found errors (their count and
          codes, and `wairon validate` to see them). An OpenAPI document with a type it could not
          resolve (the result's unresolvedTypes) is a warning too, naming each type and how to
          resolve it by what its alias names in this project's configuration: an external is pinned
          (`wairon externals pin <alias>`), or the type exported from its L0; a member — never
          pinned — must export the type from its L0, or the reference names a public name the member
          retired, to follow at the project that writes it; this project's own id names its own
          export table; an alias nothing declares is said so — never "pin" for a member or for the
          project itself, gate errors or not. Every written path is listed — with several portals
          and no --portal, one file per portal is written and each path is listed. Without an out
          path, print the single document when one portal remains, else list the available portals
          (portalId + name) so the caller can pick with --portal, rather than printing nothing. An
          OpenAPI export with no HTTP Portal (an in-process library) is refused naming why, never
          answered with the native entries, and one whose operations collide on a path and verb is
          refused naming both (nothing written).
        type: return
        outcome: exported
      - stepNumber: 5
        description: Import the foreign surface (source/origin from options)
        type: call
        targetComponent: cli_surfaces_client_adapter
        targetMethod: importSurface
      - stepNumber: 6
        description: Print the imported snapshot summary
        type: return
        outcome: imported
      - stepNumber: 7
        description: List the stored snapshots
        type: call
        targetComponent: cli_surfaces_client_adapter
        targetMethod: listSnapshots
      - stepNumber: 8
        description: Print the snapshot table
        type: return
        outcome: listed
      - stepNumber: 9
        description: >-
          Compare the public surface with the last committed approval, or with --against (a git
          revision or a saved native snapshot). A comparison that cannot be made — the project is in
          no git work tree, the revision names no commit, or no approval of it was ever committed —
          is refused as one line naming why and what to do (lock and commit, or `--against
          <ref|file>`), exit 1, never an uncaught stack trace
        type: call
        targetComponent: cli_surfaces_client_adapter
        targetMethod: diffSurface
      - stepNumber: 10
        description: >-
          Print what it was compared with, then one line per change grouped removed, renamed,
          changed, added, and how many a consumer may have to follow; or the JSON answer under
          --json
        type: return
        outcome: changelog printed
      - stepNumber: 11
        description: >-
          Unknown surface action — for `externals` and `pin`, which stage 3 removed, the error names
          `wairon externals list|status|pin` instead
        type: throw
        error: UnknownSurfaceActionError
  - name: runPacks
    narrative:
      - stepNumber: 1
        description: Dispatch on the action
        type: switch
        'on': action
        cases:
          - value: add
            step: 2
          - value: list
            step: 4
          - value: remove
            step: 6
