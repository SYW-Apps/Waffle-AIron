  - name: runHostDoctor
    sourcePath: src/commands/host.ts
    narrative:
      - stepNumber: 1
        description: Resolve the host configuration
        type: local
      - stepNumber: 2
        description: Run the permission-model migration via the host adapter, applying it only with --fix
