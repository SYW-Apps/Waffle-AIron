      - stepNumber: 4
        description: List the loaded packs via the packs adapter
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: listPacks
      - stepNumber: 5
        description: Return after list
        type: return
        outcome: listed
      - stepNumber: 6
        description: Remove a vendored pack via the packs adapter
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: removePack
      - stepNumber: 7
        description: Return after remove
        type: return
        outcome: removed
      - stepNumber: 8
        description: Return on unknown action
        type: return
        outcome: unknown action
  - name: runRules
    narrative:
      - stepNumber: 1
        description: List the active conformance rules via the rules adapter
        type: call
        targetComponent: cli_rules_adapter
        targetMethod: listRules
      - stepNumber: 2
        description: Return after list
        type: return
        outcome: listed
  - name: runPatterns
    narrative:
      - stepNumber: 1
        description: List the pack-declared reusable patterns via the patterns adapter
        type: call
        targetComponent: cli_patterns_adapter
        targetMethod: listPatterns
      - stepNumber: 2
        description: Return after list
        type: return
        outcome: listed
  - name: runVariants
    narrative:
      - stepNumber: 1
        description: List the component variants via the variants adapter
        type: call
        targetComponent: cli_variants_adapter
        targetMethod: listVariants
      - stepNumber: 2
        description: Return after list
        type: return
        outcome: listed
  - name: runPack
    narrative:
      - stepNumber: 1
        description: Dispatch on the pack action.
        type: switch
        'on': action
        cases:
          - value: init
            step: 2
          - value: build
            step: 4
          - value: add
            step: 6
          - value: list
            step: 8
          - value: remove
            step: 10
          - value: install
            step: 13
          - value: uninstall
            step: 15
          - value: which
            step: 17
          - value: use
            step: 19
          - value: unuse
            step: 21
          - value: bundle
            step: 23
          - value: sync
            step: 25
          - value: impact
            step: 27
        defaultStep: 12
      - stepNumber: 2
        label: doInit
        description: Scaffold a new pack project.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: initPack
      - stepNumber: 3
        description: Done.
        type: return
        outcome: init done
      - stepNumber: 4
        label: doBuild
        description: Build a .wpack archive.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: buildPack
      - stepNumber: 5
        description: Done.
        type: return
        outcome: build done
      - stepNumber: 6
        label: doAdd
        description: Install a pack (ZIP-aware).
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: addPack
      - stepNumber: 7
        description: Done.
        type: return
        outcome: add done
      - stepNumber: 8
        label: doList
        description: List packs.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: listPacks
      - stepNumber: 9
        description: Done.
        type: return
        outcome: list done
      - stepNumber: 10
        label: doRemove
        description: Remove a pack.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: removePack
      - stepNumber: 11
        description: Done.
        type: return
        outcome: remove done
      - stepNumber: 12
        label: unknown
        description: Unknown action.
        type: throw
        error: >-
          unknown pack action (expected init | build | install | uninstall | which | use | unuse |
          impact | bundle | sync | add | list | remove)
      - stepNumber: 13
        label: doInstall
        description: >-
          Install a pack into this wairon install's store (applies to nothing until a project
          selects it).
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: installPack
      - stepNumber: 14
        description: Done.
        type: return
        outcome: install done
      - stepNumber: 15
        label: doUninstall
        description: Remove a pack from the store.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: uninstallStorePack
      - stepNumber: 16
        description: Done.
        type: return
        outcome: uninstall done
      - stepNumber: 17
        label: doWhich
        description: Identify which installed pack a name resolves to.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: whichPack
      - stepNumber: 18
        description: Done.
        type: return
        outcome: which done
      - stepNumber: 19
        label: doUse
        description: Select an installed pack for this project.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: usePack
      - stepNumber: 20
        description: Done.
        type: return
        outcome: use done
      - stepNumber: 21
        label: doUnuse
        description: Deselect a pack for this project.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: unusePack
      - stepNumber: 22
        description: Done.
        type: return
        outcome: unuse done
      - stepNumber: 23
        label: doBundle
        description: Commit a copy of a selected pack under .wai/packs/.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: bundlePack
      - stepNumber: 24
        description: Done.
        type: return
        outcome: bundle done
      - stepNumber: 25
        label: doSync
        description: Install every declared-but-missing pack from its recorded source.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: syncPacks
      - stepNumber: 26
        description: Done.
        type: return
        outcome: sync done
      - stepNumber: 27
        label: doImpact
        description: Show what a pack would change on this project, writing nothing.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: impactPack
      - stepNumber: 28
        description: Done.
        type: return
        outcome: impact done
  - name: runLock
    narrative:
      - stepNumber: 1
        description: >-
          Is this checkout ATTACHED to a hosted project? A hosted lock is the instance's
          execute-primary workflow, not a local freeze.
        type: call
        targetComponent: remote_orchestrator
        targetMethod: resolveTarget
      - stepNumber: 2
        description: Attached?
        type: branch
        condition: a hosted target resolved
        onTrueStep: 3
        onFalseStep: 5
      - stepNumber: 3
        description: Lock the ATTACHED project on the instance.
        type: call
        targetComponent: remote_orchestrator
        targetMethod: lockAttached
      - stepNumber: 4
        description: >-
          Report the outcome verbatim — an approval-gated instance answers that a REQUEST was
          created, which must never be printed as a completed lock.
        type: return
        outcome: locked or requested
      - stepNumber: 5
        description: >-
          Not attached: read the project configuration — its rule severities and projectType govern
          the as-complete gate.
        type: call
        targetComponent: cli_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 6
        label: empty-design
        description: >-
          Ask whether there is anything to approve: a tree that holds the L0 and nothing below it,
          and was never approved, has no design yet
        type: call
        targetComponent: cli_lock_adapter
        targetMethod: holdsNoDesign
      - stepNumber: 7
        description: Nothing to approve?
        type: branch
        condition: the tree holds no design and no approval is on record
        onTrueStep: 8
        onFalseStep: 9
      - stepNumber: 8
        label: nothing-to-approve
        description: >-
          Say there is nothing designed to approve yet — the tree holds the L0 and nothing below it,
          which `validate` calls nothing to check yet — and to add a subsystem first, then lock.
          Write no record (approving an empty design approves nothing) and exit 0: it is not a
          failure
        type: return
        outcome: nothing to approve
      - stepNumber: 9
        label: capture
        description: >-
          CAPTURE the gate identity before anything is judged — the identity the record will
          certify. The lock adapter re-confirms it immediately before writing, so a lock never
          certifies inputs that moved while it ran (the validation and the confirmation prompt
          included)
        type: call
        targetComponent: cli_validator_adapter
        targetMethod: computeGateStateId
      - stepNumber: 10
        description: >-
          Run the as-complete dry-run gate over the tree; the result carries its code half
          summarized with the analyzer identity
        type: call
        targetComponent: cli_validator_adapter
        targetMethod: validateAsComplete
      - stepNumber: 11
        description: >-
          Take the design half (ValidationResult.designOnly): what the approval certifies and the
          only findings that may refuse it. Code-conformance findings are recorded beside the
          approval and never refuse it, so a design can be approved before its code exists — CI
          enforces code conformance (`wairon validate --ci`), not the lock
        type: local
      - stepNumber: 12
        description: The design half found errors (an invalid design is never frozen)
        type: branch
        condition: the design half reported errors
        onTrueStep: 13
        onFalseStep: 14
      - stepNumber: 13
        description: Refuse the lock, printing the blocking findings; nothing was changed
        type: return
        outcome: refused
      - stepNumber: 14
        description: >-
          Summarize, apply requireApprovedMembers, confirm with the human (skipped under --yes),
          re-confirm the captured identity and write the record through the lock adapter
        type: call
        targetComponent: cli_lock_adapter
        targetMethod: lockTree
      - stepNumber: 15
        description: Did the human decline?
        type: branch
        condition: the lock adapter answered no record
        onTrueStep: 16
        onFalseStep: 17
      - stepNumber: 16
        description: 'Cancelled: nothing was changed'
        type: return
        outcome: cancelled
      - stepNumber: 17
        description: >-
          Refresh THIS project's generated outputs only — never --family: a parent lock writes
          nothing below itself, generated outputs included
        type: call
        targetComponent: cli_runner
        targetMethod: runGenerate
      - stepNumber: 18
        description: >-
          Print the lock record — written, or, when this run re-recorded nothing (the same approval
          on file, no evidence beside it to refresh), that this run left .wai/lock.json untouched,
          as the summary promised: a difference from the committed record, if there is one, was
          written by an earlier run — each direct member's state, and the code results plainly on
          their own line — "code: N errors, M warnings recorded beside the claim (analyzer
          <version>, grade <grade>)" — so an approval taken over failing code is never mistaken for
          clean code; then return
        type: return
        outcome: locked
    symbol: lockCommand
  - name: runAgent
    narrative:
      - stepNumber: 1
        description: Dispatch on the agent action
        type: switch
        'on': action
        cases:
          - value: brief
            step: 2
          - value: customize
            step: 4
        defaultStep: 9
      - stepNumber: 2
        description: Compose the agent's live brief via the core client adapter
        type: call
        targetComponent: cli_core_adapter
        targetMethod: composeAgentBrief
      - stepNumber: 3
        description: Print the rendered brief (instructions + ownedPaths/readPaths scope)
        type: return
        outcome: brief printed
      - stepNumber: 4
        description: Compose the agent's live brief via the core client adapter to seed the scaffold
        type: call
        targetComponent: cli_core_adapter
        targetMethod: composeAgentBrief
      - stepNumber: 5
        description: Refuse to clobber a user-owned file
        type: branch
        condition: .wai/agents/<id>.md already exists
        onTrueStep: 6
        onFalseStep: 7
      - stepNumber: 6
        description: The guidance file is user-owned — point at it for direct editing instead of overwriting
        type: throw
        error: GuidanceFileExistsError
      - stepNumber: 7
        description: >-
          Write the scaffold: a header explaining that spec-derived facts are inferred live (do not
          duplicate them), then the subsystem description as the starting content
        type: local
      - stepNumber: 8
        description: Report the created path and how it is used (folded into every future brief)
        type: return
        outcome: scaffolded
      - stepNumber: 9
        description: Unknown agent action
        type: throw
        error: unknown agent action (expected brief | customize)
  - name: runRemote
    sourcePath: src/commands/remote.ts
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the instance URL, project selector and bearer credential for this command:
          explicit flags, then the environment, then this checkout's recorded binding, then the
          agent's own MCP configuration. Refuse with actionable guidance when nothing resolves.
        type: call
        targetComponent: remote_orchestrator
        targetMethod: resolveTarget
      - stepNumber: 2
        description: Route on the remote action
        type: switch
        'on': action
        cases:
          - value: push
            step: 3
          - value: pull
            step: 5
          - value: attach
            step: 7
          - value: detach
            step: 9
          - value: status
            step: 11
        defaultStep: 14
      - stepNumber: 3
        description: >-
          Migrate the local spec tree into the hosted project (creating it first when --unit was
          given).
        type: call
        targetComponent: remote_orchestrator
        targetMethod: pushTree
      - stepNumber: 4
        description: Report what was pushed
        type: jump
        toStep: 15
      - stepNumber: 5
        description: Migrate the hosted spec tree into this checkout.
        type: call
        targetComponent: remote_orchestrator
        targetMethod: pullTree
      - stepNumber: 6
        description: Report what was pulled
        type: jump
        toStep: 15
      - stepNumber: 7
        description: >-
          Record a standing binding for this checkout, after verifying it resolves against the
          instance.
        type: call
        targetComponent: remote_orchestrator
        targetMethod: attach
      - stepNumber: 8
        label: attachReported
        description: Report what is now attached
        type: jump
        toStep: 15
      - stepNumber: 9
        description: Remove the binding, returning the checkout to purely local operation.
        type: call
        targetComponent: remote_orchestrator
        targetMethod: detach
      - stepNumber: 10
        description: Report the detachment
        type: jump
        toStep: 15
      - stepNumber: 11
        description: >-
          Describe what this checkout is attached to and how it resolved — never printing the
          credential.
        type: call
        targetComponent: remote_orchestrator
        targetMethod: describeAttachment
      - stepNumber: 12
        description: >-
          When the checkout is not attached, list the instances this machine holds a credential for
          — URLs only, never tokens.
        type: call
        targetComponent: remote_orchestrator
        targetMethod: listStoredInstances
      - stepNumber: 13
        description: Report the attachment
        type: jump
        toStep: 15
      - stepNumber: 14
        description: Reject an unknown remote action, naming the supported ones.
        type: throw
        error: 'Unknown remote action (supported: push, pull, attach, detach, status)'
      - stepNumber: 15
        label: outcome
        description: >-
          Print the outcome: for a migration, direction, instance and project, roots and file count,
          whether the project was created, and any backup path the destination reported — a replaced
          tree must always name what it can be undone from; for attach/detach/status, what this
          checkout now addresses and where that answer came from.
        type: local
  - name: runLogin
    sourcePath: src/commands/remote.ts
    narrative:
      - stepNumber: 1
        description: >-
          Take the token from --token or prompt for it without echoing, and normalize the instance
          URL.
        type: local
      - stepNumber: 2
        description: >-
          Verify the credential against the instance and store it for this machine — not for this
          project: a login serves every checkout, while binding a project is what `wairon remote
          attach` is for.
        type: call
        targetComponent: remote_orchestrator
        targetMethod: storeCredential
      - stepNumber: 3
        description: >-
          Confirm which instance is now reachable, and point at `wairon remote attach` as the next
          step. Never echo the credential.
        type: local
      - stepNumber: 4
        description: Confirm which instance is now reachable, without echoing the credential.
        type: local
  - name: runLogout
    sourcePath: src/commands/remote.ts
    narrative:
      - stepNumber: 1
        description: Was an instance named?
        type: branch
        condition: a url argument was supplied
        onTrueStep: 2
        onFalseStep: 4
      - stepNumber: 2
        description: Forget the stored credential for that instance.
        type: call
        targetComponent: remote_orchestrator
        targetMethod: forgetCredential
      - stepNumber: 3
        description: >-
          State plainly that this forgot the credential LOCALLY and did NOT revoke it on the
          instance — revocation lives in the hosted UI under Tokens. Then finish.
        type: return
        outcome: forgotten
      - stepNumber: 4
        label: listStored
        description: List the instances this machine holds a credential for, printing URLs only.
        type: call
        targetComponent: remote_orchestrator
        targetMethod: listStoredInstances
  - name: runStatus
    narrative:
      - stepNumber: 1
        description: Is this checkout ATTACHED to a hosted project?
        type: call
        targetComponent: remote_orchestrator
        targetMethod: resolveTarget
      - stepNumber: 2
        description: Attached?
        type: branch
        condition: a hosted target resolved
        onTrueStep: 3
        onFalseStep: 5
      - stepNumber: 3
        description: Read the ATTACHED project's completeness dashboard from the instance.
        type: call
        targetComponent: remote_orchestrator
        targetMethod: statusAttached
      - stepNumber: 4
        description: >-
          Print the hosted dashboard, naming the instance and project so it is never mistaken for a
          local tree.
        type: return
        outcome: reported remotely
      - stepNumber: 5
        description: 'Not attached: print the LOCAL spec tree''s completeness dashboard'
        type: call
        targetComponent: cli_runner
        targetMethod: localStatus
    symbol: statusCommand
  - name: runMcpServe
    sourcePath: src/commands/mcp.ts
    narrative:
      - stepNumber: 1
        description: Run the stdio MCP server against the resolved project root.
        type: call
        targetComponent: cli_mcp_adapter
        targetMethod: serveMcpStdio
  - name: runMcpInstall
    sourcePath: src/cli/runner.ts
    narrative:
      - stepNumber: 1
        description: >-
          For a HOSTED registration, resolve the bearer to embed: the explicit flag, else the
          credential stored for that instance — done HERE because the config adapter may not read
          the credential store.
        type: call
        targetComponent: remote_orchestrator
        targetMethod: storedCredentialFor
      - stepNumber: 2
        description: >-
          Register (or self-heal) the wairon entry in the configured AI tools' MCP configuration —
          local stdio, or hosted http when an instance was named.
        type: call
        targetComponent: cli_mcp_adapter
        targetMethod: installMcpServer
    symbol: mcpInstallCommand
  - name: runMcpStatus
    sourcePath: src/commands/mcp.ts
    narrative:
      - stepNumber: 1
        description: Report where a wairon MCP server is registered and what it points at.
        type: call
        targetComponent: cli_mcp_adapter
        targetMethod: reportMcpStatus
  - name: runExecutionShow
    sourcePath: src/commands/execution.ts
    narrative:
      - stepNumber: 1
        description: Is this an initialized wairon project?
        type: call
        targetComponent: cli_core_adapter
        targetMethod: projectConfigExists
      - stepNumber: 2
        description: Budgets belong to a project.
        type: branch
        condition: the project has no configuration (not an initialized wairon project)
        onTrueStep: 3
        onFalseStep: 4
      - stepNumber: 3
        description: Refuse, naming `wairon init`.
        type: throw
        error: Not a wairon project — run `wairon init` first.
      - stepNumber: 4
        description: 'Read the project configuration: the execution tier and the per-agent overrides.'
        type: call
        targetComponent: cli_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 5
        description: Print the tier and the one-line description of what that tier means.
        type: local
      - stepNumber: 6
        description: Tier off derives nothing.
        type: branch
        condition: the tier is off
        onTrueStep: 7
        onFalseStep: 8
      - stepNumber: 7
        description: >-
          Print that no budgets are derived — briefs and generated agent files carry what they
          carried before budgets existed — and how to enable them (`wairon execution set-tier
          default`).
        type: return
        outcome: tier off, nothing derived
      - stepNumber: 8
        description: Ask the core adapter for the current agent topology, resolved from the live spec tree
        type: call
        targetComponent: cli_core_adapter
        targetMethod: resolveAgentTopology
      - stepNumber: 9
        description: An empty topology has nothing to budget.
        type: branch
        condition: the topology has no agents
        onTrueStep: 10
        onFalseStep: 11
      - stepNumber: 10
        description: Warn that there are no agents in the topology yet, so nothing is budgeted.
        type: return
        outcome: no agents
      - stepNumber: 11
        description: List every agent's allowance.
        type: loop
        loopKind: forEach
        over: the resolved agents
        endStep: 12
      - stepNumber: 12
        description: Ask the adapter what this agent's work is like
        type: call
        targetComponent: cli_core_adapter
        targetMethod: deriveExecutionProfile
      - stepNumber: 13
        description: >-
          Ask the adapter what that work earns under the project's dial, and print the row:
          capability tier, tool grant, turn ceiling, MCP reach, and the rationale underneath
        type: call
        targetComponent: cli_core_adapter
        targetMethod: resolveBudget
      - stepNumber: 14
        description: When the configuration declares per-agent overrides, print how many.
        type: local
      - stepNumber: 15
        description: >-
          When any agent is pinned to the frontier tier — only an override can do that — warn that
          frontier is a sparring partner for questions the specs do not settle rather than an owner
          tier, and that an owner needing it usually points at a component doing too much.
        type: local
      - stepNumber: 16
        description: Done.
        type: return
        outcome: allowances listed
    symbol: showExecution
  - name: runExecutionSetTier
    sourcePath: src/commands/execution.ts
    narrative:
      - stepNumber: 1
        description: Is this an initialized wairon project?
        type: call
        targetComponent: cli_core_adapter
        targetMethod: projectConfigExists
      - stepNumber: 2
        description: The dial belongs to a project.
        type: branch
        condition: the project has no configuration (not an initialized wairon project)
        onTrueStep: 3
        onFalseStep: 4
      - stepNumber: 3
        description: Refuse, naming `wairon init`.
        type: throw
        error: Not a wairon project — run `wairon init` first.
      - stepNumber: 4
        description: Only a known tier can be set.
        type: branch
        condition: the requested tier is not one of off | free | default | trade | aggressive
        onTrueStep: 5
        onFalseStep: 6
      - stepNumber: 5
        description: Refuse, listing the valid tiers.
        type: throw
        error: 'Unknown tier — expected one of: off, free, default, trade, aggressive.'
      - stepNumber: 6
        description: Read the project configuration for the current tier.
        type: call
        targetComponent: cli_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 7
        description: Setting the current tier again changes nothing.
        type: branch
        condition: the requested tier is already the current tier
        onTrueStep: 8
        onFalseStep: 9
      - stepNumber: 8
        description: Report that the tier is already set, writing nothing.
        type: return
        outcome: unchanged
      - stepNumber: 9
        description: Write execution.tier through the core adapter; per-agent overrides are kept.
        type: call
        targetComponent: cli_core_adapter
        targetMethod: setExecutionTier
      - stepNumber: 10
        description: >-
          Report the move (previous → new tier) and what the new tier costs — its description — then
          point at `wairon execution show` for the resulting allowances and at `wairon generate` to
          write them into materialized agent files.
        type: local
      - stepNumber: 11
        description: The cost-trading tiers get a warning.
        type: branch
        condition: the new tier is trade or aggressive
        onTrueStep: 12
        onFalseStep: 13
      - stepNumber: 12
        description: >-
          Warn that this tier trades quality for cost, and that a cheaper delegation needing a
          second round trip is not cheaper — measure it on real work before keeping it.
        type: local
      - stepNumber: 13
        description: Done.
        type: return
        outcome: tier set
    symbol: setExecutionTier
  - name: runDoctor
    sourcePath: src/commands/doctor.ts
    narrative:
      - stepNumber: 1
        label: report-only
        description: With --report, print one section's plan and nothing else
        type: branch
        condition: '--report was given'
        onFalseStep: 11
      - stepNumber: 2
        description: >-
          Only a lone `--report <section>` is a report, and the sections are `chaining`,
          `composed-validation` and `reachability`
        type: branch
        condition: >-
          --fix was given too, or the section is none of `chaining`, `composed-validation` and
          `reachability`
        onFalseStep: 4
      - stepNumber: 3
        description: >-
          Refuse the flags, naming them: --report prints and writes nothing, so it never combines
          with --fix, and the known sections are chaining, composed-validation and reachability
        type: throw
        error: DoctorOptionsError
      - stepNumber: 4
        label: report-section
        description: Which section?
        type: switch
        'on': the section
        cases:
          - value: composed-validation
            step: 5
          - value: chaining
            step: 7
          - value: reachability
            step: 9
        defaultStep: 7
      - stepNumber: 5
        description: >-
          Explain what composed validation changed in each project's verdict: today's as-complete
          owner's gates against the totals and validator version their locks recorded, and every new
          finding with its reason (escalated, pinned, positional — the last with what the family's
          top matched and the rewrite)
        type: call
        targetComponent: verdict_changes
        targetMethod: explain
      - stepNumber: 6
        description: >-
          Print it per project — the lock's totals beside today's when the lock predates composed
          validation, then the entries grouped by code with their reasons and rewrites, then how
          many findings it could not attribute and, after that count, every positional candidate no
          tie-break rule decides (ambiguous, with each candidate, or matching nothing) — and say
          plainly that the lock records totals only, so this is not a per-code diff. Nothing is
          written
        type: return
        outcome: composed-validation report printed
      - stepNumber: 7
        label: report-chaining
        description: >-
          Plan the chaining migration of the family through the migration portal (verb chaining,
          without a rehearsal: the report prints the plan and writes nothing, so there is nothing to
          discard)
        type: call
        targetComponent: cli_migration_adapter
        targetMethod: plan
      - stepNumber: 8
        description: >-
          Print the plan per project, each item once, OPENING with the new dependencies it
          introduces (one prominent line per consumer → producer edge no external or pin had before,
          with its reference count — "app_core now depends on app_ui (96 references)"; listed, never
          blocking): the id to declare, the minimal L0 to create, the L0 entries to add with the
          consumers each serves (own `{ typeDef }` entries, mount-carried and positional entries
          marked), every key the first L0 write will drop from the stored file (droppedKeys, e.g.
          `status: draft`) under a line saying they will be removed, the externals to declare, the
          `use` imports to add with the reason each producer was chosen (only-match,
          declared-producer, already-exported), the aliases to pin, the legacy mounts moved into
          `members` with every field they carry or retire, and the superseded family pins as ONE
          line per project with their count; then every reference rewrite (from → to, grouped per
          project and spec), every finding once (positional-ambiguous with each candidate,
          import-shadowed, import-collision among them), and the totals. The plan is computed
          without projecting any sibling surface, so no projector message reaches it. Nothing is
          written
        type: return
        outcome: chaining plan reported
      - stepNumber: 9
        label: report-reachability
        description: >-
          Plan the bound project's reachability migration with apply false: the same plan --fix
          writes, rehearsed without a write
        type: call
        targetComponent: cli_core_adapter
        targetMethod: migrateReachability
      - stepNumber: 10
        description: >-
          Print each rewrite grouped by its retired form (portalType, listener mounts, invokedBy
          kinds, export types, in-process endpoints, retired allows), then what it will NOT fix and
          why (an endpoint outside every old prefix, a sibling-subsystem caller to model, a
          disagreeing export type, a router already set), then the counts and the one re-lock an
          applied plan implies. Nothing is written
        type: return
        outcome: reachability report printed
      - stepNumber: 11
        label: fix
        description: With --fix, apply the repairs before the report, so the report shows the repaired state
        type: branch
        condition: '--fix was given'
        onFalseStep: 50
      - stepNumber: 12
        description: >-
          First, resolve any family migration a crash left unfinished under this root — roll back
          each transaction whose coordinator never committed, clean up each that did — before any
          other repair reads a file that transaction may have half-swapped; a transaction whose
          coordinator or an owner is out of reach is reported, not guessed
        type: call
        targetComponent: cli_migration_adapter
        targetMethod: recover
      - stepNumber: 13
        description: 'Read the configuration: the fixes need an initialized project whose configuration is valid'
        type: call
        targetComponent: cli_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 14
        description: Skip the fixes otherwise, warning when the configuration is invalid; the report flags both
        type: branch
        condition: the project is initialized and its configuration is valid
        onFalseStep: 50
      - stepNumber: 15
        description: >-
          Carry an earlier approval into the current reading BEFORE any repair or migration touches
          a spec, so the tree it is compared with is the tree it approved: when its own identity,
          recomputed, still matches, the whole record (no review, the approval stays the approver's,
          the record says it was re-expressed); when only the gate it was judged under moved but no
          spec file did, its reading alone, leaving the lock stale for that stated cause until one
          `wairon lock`; otherwise nothing, and the report names the cause
        type: call
        targetComponent: cli_lock_adapter
        targetMethod: reexpressApproval
      - stepNumber: 16
        description: >-
          Rebuild the derived context documents through the core adapter, each written only if it
          changed
        type: call
        targetComponent: cli_core_adapter
        targetMethod: syncContextFiles
      - stepNumber: 17
        description: Re-export the SDD skills for the active targets
        type: call
        targetComponent: cli_skills_adapter
        targetMethod: exportSddSkills
      - stepNumber: 18
        description: >-
          Re-inject the local AI guides for the active targets through the core adapter, recording
          which files were written so the report can name them
        type: call
        targetComponent: cli_core_adapter
        targetMethod: reinjectLocalGuides
      - stepNumber: 19
        description: >-
          List the spec files stored under a legacy name and rename each to the name the current
          layout expects
        type: call
        targetComponent: cli_core_adapter
        targetMethod: findLegacySpecFiles
      - stepNumber: 20
        description: >-
          Write a project configuration for each chained subproject with specs but none, and print
          the directories repaired
        type: call
        targetComponent: cli_core_adapter
        targetMethod: backfillChainedSubprojectConfigs
      - stepNumber: 21
        description: >-
          Retire the Specialists with apply true: each becomes an Orchestrator with the
          dependencyClass its dependencies decide, and each Specialist-based variant rebases onto
          Orchestrator; print what was retyped. Runs after the filename migration, so the retyped
          specs save under current names
        type: call
        targetComponent: cli_core_adapter
        targetMethod: retireSpecialists
      - stepNumber: 22
        description: >-
          Repair the narrative steps carrying a field their own type cannot have, with apply true:
          each foreign field is dropped and nothing else about the step changes; print what was
          repaired. A mechanical spec repair, like the filename migration above
        type: call
        targetComponent: cli_core_adapter
        targetMethod: repairForeignStepFields
      - stepNumber: 23
        description: >-
          Regenerate the stored signatures with apply true: every stored text its params contradict
          is rewritten derived, and every restatement equal to its method's signature source is
          dropped; print what was rewritten. A mechanical spec repair like the ones above — one
          project, idempotent, outside the family transaction
        type: call
        targetComponent: cli_core_adapter
        targetMethod: repairSignatures
      - stepNumber: 24
        description: >-
          Rewrite the stored type spellings with apply true: every type position that is an alias is
          re-saved in its canonical spelling, and the derived signature texts follow; print what was
          rewritten, then the int proposals and the positions needing an author, none of which is
          written. A mechanical spec repair like the ones above — one project, idempotent, outside
          the family transaction
        type: call
        targetComponent: cli_core_adapter
        targetMethod: repairTypeSpellings
      - stepNumber: 25
        description: >-
          Migrate onto the reachability model with apply true: portalType becomes transport,
          listener mounts become Portal-level entries on the listener and the Portals it mounted
          with each via moved to the Portal implementation's router, retired invokedBy kinds and
          authored export types are rewritten, in-process Custom endpoints become InProcess, and
          allows of retired codes go; print each rewrite, then what it reports instead of writing
          (an endpoint outside every old prefix, a sibling-subsystem caller to model, a disagreeing
          export type), then that the design changed and needs one `wairon lock`. A mechanical spec
          repair like the ones above: one project, idempotent, outside the family transaction, and
          it never invents an entry
        type: call
        targetComponent: cli_core_adapter
        targetMethod: migrateReachability
      - stepNumber: 26
        label: chaining
        description: >-
          Plan the chaining migration through the migration portal (verb chaining, without a
          rehearsal: what is printed and confirmed is the chaining plan, as before; apply rehearses
          it) — the last spec-touching fix: after the configuration backfill, so every chained child
          has a project.yaml to declare its id in, and after the filename migration and the spec
          repairs, so its gated L0 writes save specs under current names into a repaired tree. It is
          the one fix that writes several projects at once, so it alone runs through the family
          transaction; every fix above writes one project, regenerates derived output or restates
          what is there, is idempotent, and stays outside it — a failure there leaves a state its
          own re-run completes. The transaction recovery at the top of --fix runs before all of them
        type: call
        targetComponent: cli_migration_adapter
        targetMethod: plan
      - stepNumber: 27
        description: 'Nothing to migrate: go on without asking'
        type: branch
        condition: the plan has something to write
        onFalseStep: 31
      - stepNumber: 28
        description: >-
          Print the plan per project as --report chaining does — a project outside this project's
          root (the family above it, which a chained member's migration also writes) marked as such
          — then ask to apply it. --yes answers yes; a run with no terminal to ask and no --yes, or
          a no, skips the migration and writes none of it — every other fix above has already run,
          as it always has. The family's writes are covered by this plan, its confirmation and the
          family transaction's all-or-nothing restore
        type: local
      - stepNumber: 29
        description: Only a confirmed plan is applied
        type: branch
        condition: the person confirmed, or --yes was given
        onFalseStep: 31
      - stepNumber: 30
        description: >-
          Apply the confirmed plan through the migration portal — rehearsed, staged and swapped
          all-or-nothing — and print each file written; then name every project whose lock the
          writes staled, pointing at `wairon lock` — re-locking is the human's, and nothing locks
          here. A refused or failed plan is printed with its findings (and, for a failed swap,
          whether the family was restored) and counts as an error in the summary; nothing was
          written
        type: call
        targetComponent: cli_migration_adapter
        targetMethod: apply
      - stepNumber: 31
        label: members-fix
        description: >-
          Members: read the project graph the bound root's tree forms now — after the chaining
          migration, so a legacy mount it moved into `members` is a member here — and take every
          member project below the bound root with its directory. The per-project repairs above
          wrote the bound project only; a family is upgraded only once every member is
        type: call
        targetComponent: cli_core_adapter
        targetMethod: projectFamily
      - stepNumber: 32
        description: For each member project below the bound root
        type: loop
        loopKind: forEach
        over: the member projects below the bound root, nearest first
        endStep: 41
      - stepNumber: 33
        description: Does the member lie inside the bound root?
        type: branch
        condition: the member's directory lies inside the bound root
        onFalseStep: 40
      - stepNumber: 34
        description: >-
          Bound to the member's root, retire its Specialists with apply true, printed under the
          member's alias as step 19 prints the bound project's
        type: call
        targetComponent: cli_core_adapter
        targetMethod: retireSpecialists
      - stepNumber: 35
        description: Bound to the member's root, drop the foreign narrative-step fields of its own specs
        type: call
        targetComponent: cli_core_adapter
        targetMethod: repairForeignStepFields
      - stepNumber: 36
        description: Bound to the member's root, regenerate its stored signatures
        type: call
        targetComponent: cli_core_adapter
        targetMethod: repairSignatures
      - stepNumber: 37
        description: >-
          Bound to the member's root, rewrite its stored type spellings, printing its int and enum
          proposals and the positions needing an author, none of which is written
        type: call
        targetComponent: cli_core_adapter
        targetMethod: repairTypeSpellings
      - stepNumber: 38
        description: >-
          Bound to the member's root, migrate it onto the reachability model, printed under the
          member's alias as the step above prints the project's
        type: call
        targetComponent: cli_core_adapter
        targetMethod: migrateReachability
      - stepNumber: 39
        description: Done with this member
        type: jump
        toStep: 41
      - stepNumber: 40
        label: member-fix-outside
        description: >-
          A member outside the bound root (a sibling checkout) is not written from here: name it
          with the command to run in its own directory — `wairon doctor --fix` there
        type: local
      - stepNumber: 41
        label: member-fix-next
        description: On to the next member
        type: local
      - stepNumber: 42
        label: mcp
        description: >-
          Plan the MCP registration for each active backend without writing anything — Claude in the
          project's .mcp.json; Gemini in the project's settings, or, for an Antigravity target, the
          GLOBAL mcp_config.json it alone reads — each write marked inside or outside the project
          root, with the entry the file holds now and the one it would get
        type: call
        targetComponent: cli_mcp_adapter
        targetMethod: planInstall
      - stepNumber: 43
        description: >-
          Register or repair every backend whose planned writes stay inside the project root (or are
          already up to date); a write inside the project needs no further consent, as before
        type: call
        targetComponent: cli_mcp_adapter
        targetMethod: installMcpServer
      - stepNumber: 44
        description: >-
          For a Gemini or Antigravity target, look for the legacy global Antigravity plugin, whose
          name collides with the MCP server
        type: call
        targetComponent: cli_mcp_adapter
        targetMethod: findLegacyPlugin
      - stepNumber: 45
        label: outside-writes
        description: Anything to write outside the project root?
        type: branch
        condition: a planned MCP write outside the project root is pending, or the legacy plugin is present
        onFalseStep: 50
      - stepNumber: 46
        description: >-
          Print every write outside the project root as its own plan — for each MCP configuration
          the file, the wairon entry it holds and the one it would get (a large entry summarised, a
          bearer credential never printed), and the legacy plugin directory to move aside — then ask
          for ITS OWN confirmation: --yes answers it only together with --global; a terminal asks; a
          run with neither skips every one of these writes and says so, naming `wairon doctor --fix
          --yes --global`. Nothing outside the project has been touched up to here
        type: local
      - stepNumber: 47
        description: Only confirmed writes outside the project root are made
        type: branch
        condition: '--yes was given together with --global, or the person said yes at the terminal'
        onFalseStep: 50
      - stepNumber: 48
        description: >-
          Apply each confirmed MCP registration outside the project root through the install, which
          first copies the file it replaces beside itself as <file>.wairon-backup-<timestamp> and
          prints where
        type: call
        targetComponent: cli_mcp_adapter
        targetMethod: installMcpServer
      - stepNumber: 49
        description: Move a present legacy plugin aside instead of deleting it, and print where it went
        type: call
        targetComponent: cli_mcp_adapter
        targetMethod: retireLegacyPlugin
      - stepNumber: 50
        label: report
        description: 'Project: is this an initialized wairon project?'
        type: call
        targetComponent: cli_core_adapter
        targetMethod: projectConfigExists
      - stepNumber: 51
        description: Stop at a folder that is not a wairon project
        type: branch
        condition: the project is not initialized
        onFalseStep: 53
      - stepNumber: 52
        description: Report it, naming `wairon init`, print the summary and exit non-zero
        type: return
        outcome: not a wairon project
      - stepNumber: 53
        label: config
        description: Report whether the configuration is valid, and read its active targets
        type: call
        targetComponent: cli_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 54
        description: >-
          Transactions: report each unfinished family migration under this root — its verb, its
          owners and its coordinator's phase — as an error pointing at `wairon doctor --fix`; silent
          when there is none
        type: call
        targetComponent: cli_migration_adapter
        targetMethod: recover
      - stepNumber: 55
        description: 'Spec filenames: list the spec files still stored under a legacy name'
        type: call
        targetComponent: cli_core_adapter
        targetMethod: findLegacySpecFiles
      - stepNumber: 56
        description: 'Chained subprojects: list the ones with specs but no project.yaml'
        type: call
        targetComponent: cli_core_adapter
        targetMethod: findChainingSubprojectsMissingConfig
      - stepNumber: 57
        description: >-
          Report whether the system spec is present, whether the spec filenames are current, and any
          chained subproject with specs but no project.yaml
        type: local
      - stepNumber: 58
        description: >-
          Spec tree: with a system spec and a valid configuration, run the family gate — the bound
          project's own gate and every member's — and report its error, warning and notice counts,
          then one line per member with findings naming the member and its own counts, so a clean
          top never reads as a clean family; notices alone leave the check passing
        type: call
        targetComponent: cli_validator_adapter
        targetMethod: validateFamily
      - stepNumber: 59
        description: >-
          Stereotypes: plan the Specialist retirement with apply false and report each Specialist
          with the dependencyClass it would take as an Orchestrator, and each variant to rebase,
          pointing at `wairon doctor --fix`; silent when no Specialist remains
        type: call
        targetComponent: cli_core_adapter
        targetMethod: retireSpecialists
      - stepNumber: 60
        description: >-
          Narrative steps: plan the foreign-field repair with apply false and report each step
          carrying a field its own type cannot have — the implementation, the method, the step and
          the fields — pointing at `wairon doctor --fix`; silent when every step is clean
        type: call
        targetComponent: cli_core_adapter
        targetMethod: repairForeignStepFields
      - stepNumber: 61
        description: >-
          Signatures: plan the signature repair with apply false and report each interface or type
          whose stored signature text its params contradict, and each method restating its source's
          signature, pointing at `wairon doctor --fix`; silent when every stored signature is
          already in its stored form
        type: call
        targetComponent: cli_core_adapter
        targetMethod: repairSignatures
      - stepNumber: 62
        description: >-
          Type spellings: plan the type-spelling repair with apply false and report each interface
          or type holding a type position that is an alias of its canonical spelling, pointing at
          `wairon doctor --fix`; then list, apart, each number position with int proposed (an author
          confirms by writing int, or writes float), each string-literal union with an enum proposed
          (an author defines the enum and writes its id), and each position only an author can
          settle, with its replacement; silent when every stored type position is canonical
        type: call
        targetComponent: cli_core_adapter
        targetMethod: repairTypeSpellings
      - stepNumber: 63
        description: >-
          Reachability: plan the reachability migration with apply false and report each rewrite it
          would make and each form it would only report, with the one re-lock it implies
        type: call
        targetComponent: cli_core_adapter
        targetMethod: migrateReachability
      - stepNumber: 64
        description: >-
          Members: for each member project below the bound root, bound to its root, plan the same
          repairs with apply false (as steps 60-65 do here) and report one line per member with
          something pending — its alias, its directory and the counts of Specialists, foreign step
          fields, signatures, type positions to respell, proposals, positions needing an author, and
          reachability rewrites and reports — pointing at `wairon doctor --fix` here, which cascades
          into every member inside this root, or in the member's own directory for one outside it;
          silent when no member has anything pending
        type: local
      - stepNumber: 65
        description: >-
          Chaining: plan the migration through the migration portal without a rehearsal and report
          how much is pending — ids, L0s, entries, externals, pins, mounts to move, references to
          rewrite, family pins to delete and findings — pointing at `wairon doctor --report
          chaining` and `--fix`; silent when nothing is planned or reported. After an applied --fix
          this plan is empty, which is the run's own idempotence check
        type: call
        targetComponent: cli_migration_adapter
        targetMethod: plan
      - stepNumber: 66
        description: >-
          Ask where the derived context documents live, so the staleness check reports on the
          generated pair and never on the two a person wrote
        type: call
        targetComponent: cli_core_adapter
        targetMethod: derivedDocPaths
      - stepNumber: 67
        description: >-
          Generated files and skills: read the version each one was stamped with and compare it
          against the running build, so a file written by an older wairon is reported as stale
          rather than assumed current
        type: call
        targetComponent: cli_core_adapter
        targetMethod: readStampVersion
      - stepNumber: 68
        description: >-
          Ask which derived context documents a regenerate would change in CONTENT (the project
          context they embed, the domain map): each is reported `stale — its content differs from
          what wairon generate writes now`, never current, so a file stamped by this release is
          never called current while `doctor --fix` would rewrite it
        type: call
        targetComponent: cli_core_adapter
        targetMethod: staleDerivedDocs
      - stepNumber: 69
        description: >-
          Skills: for each active target, compare the installed SDD skills with what an export would
          write now, reporting the missing and stale ones
        type: call
        targetComponent: cli_skills_adapter
        targetMethod: checkSkillFreshness
      - stepNumber: 70
        description: 'Lock: compute the gate identity as it stands now'
        type: call
        targetComponent: cli_validator_adapter
        targetMethod: computeGateStateId
      - stepNumber: 71
        description: >-
          Resolve the lock against that identity: a locked lock reports when and by whom it was
          approved (lock_record.approvalStamp), warning when it predates per-spec approval; a stale
          one reports lock-check's own verdict — an approval a release change carried reads
          approved, `re-validated under <release>`, and one the new release finds issues in names
          them; a project never locked reports nothing; a lock record that cannot be read as an
          approval (corrupt JSON, no gate identity) is reported as an error naming the file and why,
          never read as "never locked". Any other failure here never breaks the report
        type: call
        targetComponent: cli_core_adapter
        targetMethod: readLockState
      - stepNumber: 72
        description: >-
          Extension packs: diagnose the project's pack situation — unresolved selections, installed
          packs not applied, packs applied from the machine-wide store
        type: call
        targetComponent: cli_core_adapter
        targetMethod: diagnoseProjectPacks
      - stepNumber: 73
        description: >-
          Report leftover approval baselines outside the project, never deleting them, and the
          extension packs: those unresolved, those installed on this machine but not applied (only
          REPORTED, with `wairon pack use <name>` for one the project wants: what happens to be in a
          developer's home store is never doctrine, so --fix never selects it into a project), and
          those applied from the machine-wide store
        type: local
      - stepNumber: 74
        description: >-
          MCP server: check that each active backend's registration points at a launchable server,
          and flag a legacy global Antigravity plugin
        type: local
      - stepNumber: 75
        description: Print the summary, exiting non-zero when any check reported an error
        type: return
        outcome: reported
    detail: calls-only
  - name: runLockCheck
    narrative:
      - stepNumber: 1
        label: ask-adapter
        description: >-
          Ask the lock adapter for the approval verdict, passing --strict through. No
          project-initialization assertion first: a repository with no .wai/ at all must be told so,
          not met with an error about an uninitialized project.
        type: call
        targetComponent: cli_lock_adapter
        targetMethod: checkApproval
      - stepNumber: 2
        label: print-verdict
        description: >-
          Print the verdict line — a success as an ordinary line, a refusal as an error, so the CI
          log reads correctly at a glance.
        type: local
      - stepNumber: 3
        label: decide
        description: Did the verdict approve the tree?
        type: branch
        condition: the verdict approved
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        label: pass
        description: 'Return normally, exiting zero: the merged design is the approved design.'
        type: return
        outcome: approved
      - stepNumber: 5
        label: refuse
        description: >-
          Exit non-zero so the job fails. The workflow fails the job; whether that BLOCKS the merge
          is a branch-protection setting on the repository, which no workflow can declare for
          itself.
        type: return
        outcome: refused
    symbol: lockCheckCommand
  - name: runDiagram
    sourcePath: src/commands/diagram.ts
    narrative:
      - stepNumber: 1
        description: >-
          Refuse a --depth that is not a whole number of at least 1 ("-1", "abc") and a --subsystem
          the tree does not hold, naming what is accepted, before anything is rendered: a sequence
          diagram of depth nothing, or a component diagram of an unknown subsystem, would be written
          as if it were the answer
        type: local
      - stepNumber: 2
        description: Should the canvas carry relation health?
        type: branch
        condition: the canvas is drawn (alone or in --all) and --no-health was not given
        onFalseStep: 4
      - stepNumber: 3
        description: >-
          Compare the family's relations with their live producers through the validator adapter:
          each project's externals status at its own root, read within the explicit local reach
          `validate --family` reads within (no narrower binding is granted, so a `../` producer the
          family declares is read rather than left out of reach), what cannot be compared
          unavailable. Producers on disk cost one export-table projection each; a git external asks
          its remote for its ref's head once, and an unreachable remote is unavailable, never a pass
        type: call
        targetComponent: cli_validator_adapter
        targetMethod: familyRelations
      - stepNumber: 4
        label: render
        description: >-
          Render the requested format through the core client adapter, which crosses into sdd_core
          the way every other command does, handing it the relations when they were read
        type: call
        targetComponent: cli_core_adapter
        targetMethod: renderDiagram
      - stepNumber: 5
        description: Write the artifact to the requested path and report where it landed
        type: return
        outcome: written
    symbol: runDiagram
  - name: runDomainsList
    sourcePath: src/commands/domains.ts
    narrative:
      - stepNumber: 1
        description: Ask the core adapter for every domain, derived and registered alike
        type: call
        targetComponent: cli_core_adapter
        targetMethod: resolveDomains
      - stepNumber: 2
        description: >-
          Print them, marking which came from a subsystem and which was registered by hand — the
          difference decides whether a reader can remove one
        type: return
        outcome: listed
    symbol: runDomainsList
  - name: runDomainsScan
    sourcePath: src/commands/domains.ts
    narrative:
      - stepNumber: 1
        description: Read the domains already registered, so the scan knows what is taken
        type: call
        targetComponent: cli_core_adapter
        targetMethod: resolveDomains
      - stepNumber: 2
        description: Ask the detector which directories look like domains, handing it the tracked paths and ids
        type: call
        targetComponent: cli_core_adapter
        targetMethod: detectDomainCandidates
      - stepNumber: 3
        description: Decide what the caller asked for
        type: branch
        condition: the run was asked to register the candidates
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Register each untracked candidate
        type: call
        targetComponent: cli_core_adapter
        targetMethod: addDomain
      - stepNumber: 5
        description: Print the candidates, showing the already-covered ones too rather than omitting them
        type: return
        outcome: scanned
    symbol: runDomainsScan
  - name: runDomainsAdd
    sourcePath: src/commands/domains.ts
    narrative:
