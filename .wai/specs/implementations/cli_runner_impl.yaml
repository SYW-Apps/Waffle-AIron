id: cli_runner_impl
name: CLI Runner Implementation
description: >-
  Concrete implementation of the CLI Runner Interface mapping commander subcommands to core engine
  logic.
contract: icli_runner
sourcePath: src/cli/index.ts
methods:
  - name: runValidate
    narrative:
      - stepNumber: 1
        description: Load project configuration file
        type: local
      - stepNumber: 2
        description: Validate registry rules
        type: call
        targetComponent: cli_validator_adapter
        targetMethod: validateRegistry
      - stepNumber: 3
        description: Validate project configuration
        type: call
        targetComponent: cli_validator_adapter
        targetMethod: validateProjectConfig
      - stepNumber: 4
        description: Validate SDD specification tree
        type: call
        targetComponent: cli_validator_adapter
        targetMethod: validateSddTree
      - stepNumber: 5
        description: Print validation errors/warnings and exit process if invalid
        type: local
  - name: runGenerate
    narrative:
      - stepNumber: 1
        description: Load spec system
        type: call
        targetComponent: cli_core_adapter
        targetMethod: loadSystemSpec
      - stepNumber: 2
        description: >-
          Generate Dynamic Agent outputs matching configured target engines, then prune stale
          managed agent files against the FULL resolved topology (also under a domain scope),
          re-export skills, and re-inject the local guides
        type: local
  - name: runList
    narrative:
      - stepNumber: 1
        description: Load specs using spec loader
        type: call
        targetComponent: cli_core_adapter
        targetMethod: loadSystemSpec
      - stepNumber: 2
        description: Format and print resolved dynamic agent list to stdout
        type: local
  - name: runShow
    narrative:
      - stepNumber: 1
        description: Load spec system
        type: call
        targetComponent: cli_core_adapter
        targetMethod: loadSystemSpec
      - stepNumber: 2
        description: Format and display details for specified dynamic agent
        type: local
  - name: runUpdate
    narrative:
      - stepNumber: 1
        description: Check remote github release page for new releases
        type: local
      - stepNumber: 2
        description: If new release is found and not in check-only mode, pull and apply updates
        type: local
  - name: runHostProject
    narrative:
      - stepNumber: 1
        description: Read the master credential from the environment
        type: local
      - stepNumber: 2
        description: Dispatch on the action
        type: switch
        'on': action
        cases:
          - value: create
            step: 3
          - value: list
            step: 5
          - value: destroy
            step: 7
        defaultStep: 9
      - stepNumber: 3
        description: Create the project via the host adapter
        type: call
        targetComponent: cli_host_adapter
        targetMethod: createProject
      - stepNumber: 4
        description: Return after create
        type: return
        outcome: created
      - stepNumber: 5
        description: List projects via the host adapter
        type: call
        targetComponent: cli_host_adapter
        targetMethod: listProjects
      - stepNumber: 6
        description: Return after list
        type: return
        outcome: listed
      - stepNumber: 7
        description: Destroy the project via the host adapter
        type: call
        targetComponent: cli_host_adapter
        targetMethod: destroyProject
      - stepNumber: 8
        description: Return after destroy
        type: return
        outcome: destroyed
      - stepNumber: 9
        description: Return on unknown action
        type: return
        outcome: unknown action
  - name: runHostKey
    narrative:
      - stepNumber: 1
        description: Read the master credential from the environment
        type: local
      - stepNumber: 2
        description: Dispatch on the action
        type: switch
        'on': action
        cases:
          - value: mint
            step: 3
          - value: revoke
            step: 5
          - value: list
            step: 7
        defaultStep: 9
      - stepNumber: 3
        description: Mint a key via the host adapter
        type: call
        targetComponent: cli_host_adapter
        targetMethod: mintKey
      - stepNumber: 4
        description: Return after mint
        type: return
        outcome: minted
      - stepNumber: 5
        description: Revoke a key via the host adapter
        type: call
        targetComponent: cli_host_adapter
        targetMethod: revokeKey
      - stepNumber: 6
        description: Return after revoke
        type: return
        outcome: revoked
      - stepNumber: 7
        description: List keys via the host adapter
        type: call
        targetComponent: cli_host_adapter
        targetMethod: listKeys
      - stepNumber: 8
        description: Return after list
        type: return
        outcome: listed
      - stepNumber: 9
        description: Return on unknown action
        type: return
        outcome: unknown action
  - name: runHostLock
    narrative:
      - stepNumber: 1
        description: Read the master credential from the environment
        type: local
      - stepNumber: 2
        description: Lock the project via the host adapter
        type: call
        targetComponent: cli_host_adapter
        targetMethod: lockProject
      - stepNumber: 3
        description: Print the lock record (stateId and status)
        type: local
      - stepNumber: 4
        description: Return after lock
        type: return
        outcome: locked
  - name: runHostPromote
    narrative:
      - stepNumber: 1
        description: Read the master credential from the environment
        type: local
      - stepNumber: 2
        description: Promote the project via the host adapter
        type: call
        targetComponent: cli_host_adapter
        targetMethod: promoteProject
      - stepNumber: 3
        description: Print the promote result
        type: local
      - stepNumber: 4
        description: Return after promote
        type: return
        outcome: promoted
  - name: runProduce
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the target credential (--token, else env, else interactive prompt) and set it for
          the operation
        type: local
      - stepNumber: 2
        description: Configure the target for the local project (parent page from --page)
        type: call
        targetComponent: cli_producer_adapter
        targetMethod: configure
      - stepNumber: 3
        description: Project the local project's specs to the target
        type: call
        targetComponent: cli_producer_adapter
        targetMethod: produce
      - stepNumber: 4
        description: Return once produced
        type: return
        outcome: produced
  - name: runSubsystemAdd
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the parent project root by walking up from cwd; error if cwd is not inside an
          initialized wairon project
        type: local
      - stepNumber: 2
        description: Require an explicit projectPath for an external (chained) subsystem
        type: branch
        condition: options.projectPath is not provided
        onFalseStep: 4
      - stepNumber: 3
        description: >-
          Reject: plain in-tree subsystems are authored via the SDD tools; this command creates
          external subsystems
        type: throw
        error: '--project-path is required (use the sdd_add_subsystem tool for in-tree subsystems)'
      - stepNumber: 4
        description: >-
          Compose the SubsystemSpec (id, display name from --name or id, description placeholder,
          projectPath from options)
        type: local
      - stepNumber: 5
        description: >-
          Create the chained subsystem: wire the parent subsystem spec and scaffold the child
          project
        type: call
        targetComponent: cli_core_adapter
        targetMethod: createChainedSubsystem
      - stepNumber: 6
        description: Print confirmation (parent subsystem id + child project path) and next steps
        type: local
  - name: runInit
    narrative:
      - stepNumber: 1
        description: Resolve the nearest ancestor wairon project root by walking up from cwd
        type: local
      - stepNumber: 2
        description: Detect whether cwd is itself an already-initialized wairon project root
        type: branch
        condition: the resolved root equals cwd (already initialized here)
        onFalseStep: 4
      - stepNumber: 3
        description: Report that the workspace is already initialized and stop
        type: return
        outcome: already initialized
      - stepNumber: 4
        description: Detect whether cwd sits inside a parent wairon project (subdirectory case)
        type: branch
        condition: a parent project root was found above cwd (root differs from cwd)
        onTrueStep: 5
        onFalseStep: 11
      - stepNumber: 5
        description: >-
          Prompt the user to create this subdirectory as an external subsystem of the detected
          parent project
        type: local
      - stepNumber: 6
        description: Honor the user's choice
        type: branch
        condition: the user declined the prompt
        onFalseStep: 8
      - stepNumber: 7
        description: Print guidance and stop without changes
        type: return
        outcome: declined
      - stepNumber: 8
        description: >-
          Compose the SubsystemSpec (id from --name or directory name, projectPath = relative path
          from the parent root to cwd)
        type: local
      - stepNumber: 9
        description: Wire the parent subsystem and scaffold this directory's child project
        type: call
        targetComponent: cli_core_adapter
        targetMethod: createChainedSubsystem
      - stepNumber: 10
        description: Report the external subsystem was created and stop
        type: return
        outcome: external subsystem created
      - stepNumber: 11
        description: Bootstrap the standard .wai directory structure
        type: local
      - stepNumber: 12
        description: Export SDD skills templates
        type: call
        targetComponent: cli_skills_adapter
        targetMethod: exportSddSkills
      - stepNumber: 13
        description: Generate default L0/L1/L2 spec files if empty
        type: local
  - name: runSubsystemMove
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the parent project root by walking up from cwd; error if cwd is not inside an
          initialized wairon project
        type: local
      - stepNumber: 2
        description: Require the new location
        type: branch
        condition: options.projectPath is not provided
        onFalseStep: 4
      - stepNumber: 3
        description: 'Reject: the new location is required'
        type: throw
        error: '--project-path (the new location) is required'
      - stepNumber: 4
        description: Move the subproject directory and update its projectPath link
        type: call
        targetComponent: cli_core_adapter
        targetMethod: moveSubsystemProject
      - stepNumber: 5
        description: Print confirmation (old path to new path)
        type: local
  - name: runSubsystemExternalize
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the parent project root by walking up from cwd; error if cwd is not inside an
          initialized wairon project
        type: local
      - stepNumber: 2
        description: Require the destination path
        type: branch
        condition: options.projectPath is not provided
        onFalseStep: 4
      - stepNumber: 3
        description: 'Reject: the destination is required'
        type: throw
        error: '--project-path (the subproject destination) is required'
      - stepNumber: 4
        description: Externalize the subsystem into a standalone subproject
        type: call
        targetComponent: cli_core_adapter
        targetMethod: externalizeSubsystem
      - stepNumber: 5
        description: >-
          Print confirmation, the new subproject path, and a reminder to move the source code and
          re-validate
        type: local
  - name: runSubsystemInternalize
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the parent project root by walking up from cwd; error if cwd is not inside an
          initialized wairon project
        type: local
      - stepNumber: 2
        description: Internalize the external subsystem back into the parent tree
        type: call
        targetComponent: cli_core_adapter
        targetMethod: internalizeSubsystem
      - stepNumber: 3
        description: Print confirmation and a reminder to re-validate
        type: local
  - name: runSurface
    narrative:
      - stepNumber: 1
        description: Route on the surface action
        type: switch
        'on': action
        cases:
          - value: export
            step: 2
          - value: import
            step: 4
          - value: list
            step: 6
          - value: generate-children
            step: 8
          - value: externals
            step: 10
        defaultStep: 12
      - stepNumber: 2
        description: Export the own surface (audience/format/out/portal from options)
        type: call
        targetComponent: cli_surfaces_client_adapter
        targetMethod: exportSurface
      - stepNumber: 3
        description: >-
          Report the export result: every written path — with several portals and no --portal, one
          file per portal is written and each path is listed. Without an out path, print the single
          document when one portal remains, else list the available portals (portalId + name) so the
          caller can pick with --portal, rather than printing nothing.
        type: return
        outcome: exported
      - stepNumber: 4
        description: Import the foreign surface (source/origin from options)
        type: call
        targetComponent: cli_surfaces_client_adapter
        targetMethod: importSurface
      - stepNumber: 5
        description: Print the imported snapshot summary
        type: return
        outcome: imported
      - stepNumber: 6
        description: List the stored snapshots
        type: call
        targetComponent: cli_surfaces_client_adapter
        targetMethod: listSnapshots
      - stepNumber: 7
        description: Print the snapshot table
        type: return
        outcome: listed
      - stepNumber: 8
        description: Generate parent snapshots into the chained children
        type: call
        targetComponent: cli_surfaces_client_adapter
        targetMethod: generateChildSnapshots
      - stepNumber: 9
        description: Print the written child paths
        type: return
        outcome: generated
      - stepNumber: 10
        description: >-
          List the project's external surfaces (parent family, siblings, foreign imports) with
          origin and freshness
        type: call
        targetComponent: cli_surfaces_client_adapter
        targetMethod: listExternalInterfaces
      - stepNumber: 11
        description: >-
          Print the externals table: one row per entry — sourceKind, key, origin, freshness,
          interface ids
        type: return
        outcome: externals listed
      - stepNumber: 12
        description: Unknown surface action
        type: throw
        error: UnknownSurfaceActionError
  - name: runPacks
    narrative:
      - stepNumber: 1
        description: Dispatch on the action
        type: switch
        'on': action
        cases:
          - value: add
            step: 2
          - value: list
            step: 4
          - value: remove
            step: 6
        defaultStep: 8
      - stepNumber: 2
        description: Vendor and register a pack via the packs adapter
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: addPack
      - stepNumber: 3
        description: Return after add
        type: return
        outcome: added
      - stepNumber: 4
        description: List the loaded packs via the packs adapter
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: listPacks
      - stepNumber: 5
        description: Return after list
        type: return
        outcome: listed
      - stepNumber: 6
        description: Remove a vendored pack via the packs adapter
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: removePack
      - stepNumber: 7
        description: Return after remove
        type: return
        outcome: removed
      - stepNumber: 8
        description: Return on unknown action
        type: return
        outcome: unknown action
  - name: runRules
    narrative:
      - stepNumber: 1
        description: List the active conformance rules via the rules adapter
        type: call
        targetComponent: cli_rules_adapter
        targetMethod: listRules
      - stepNumber: 2
        description: Return after list
        type: return
        outcome: listed
  - name: runPatterns
    narrative:
      - stepNumber: 1
        description: List the pack-declared reusable patterns via the patterns adapter
        type: call
        targetComponent: cli_patterns_adapter
        targetMethod: listPatterns
      - stepNumber: 2
        description: Return after list
        type: return
        outcome: listed
  - name: runVariants
    narrative:
      - stepNumber: 1
        description: List the component variants via the variants adapter
        type: call
        targetComponent: cli_variants_adapter
        targetMethod: listVariants
      - stepNumber: 2
        description: Return after list
        type: return
        outcome: listed
  - name: runPack
    narrative:
      - stepNumber: 1
        description: Dispatch on the pack action.
        type: switch
        'on': action
        cases:
          - value: init
            step: 2
          - value: build
            step: 4
          - value: add
            step: 6
          - value: list
            step: 8
          - value: remove
            step: 10
          - value: install
            step: 13
          - value: uninstall
            step: 15
          - value: which
            step: 17
          - value: use
            step: 19
          - value: unuse
            step: 21
          - value: bundle
            step: 23
          - value: sync
            step: 25
        defaultStep: 12
      - stepNumber: 2
        label: doInit
        description: Scaffold a new pack project.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: initPack
      - stepNumber: 3
        description: Done.
        type: return
        outcome: init done
      - stepNumber: 4
        label: doBuild
        description: Build a .wpack archive.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: buildPack
      - stepNumber: 5
        description: Done.
        type: return
        outcome: build done
      - stepNumber: 6
        label: doAdd
        description: Install a pack (ZIP-aware).
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: addPack
      - stepNumber: 7
        description: Done.
        type: return
        outcome: add done
      - stepNumber: 8
        label: doList
        description: List packs.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: listPacks
      - stepNumber: 9
        description: Done.
        type: return
        outcome: list done
      - stepNumber: 10
        label: doRemove
        description: Remove a pack.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: removePack
      - stepNumber: 11
        description: Done.
        type: return
        outcome: remove done
      - stepNumber: 12
        label: unknown
        description: Unknown action.
        type: throw
        error: >-
          unknown pack action (expected init | build | install | uninstall | which | use | unuse |
          bundle | sync | add | list | remove)
      - stepNumber: 13
        label: doInstall
        description: >-
          Install a pack into this wairon install's store (applies to nothing until a project
          selects it).
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: installPack
      - stepNumber: 14
        description: Done.
        type: return
        outcome: install done
      - stepNumber: 15
        label: doUninstall
        description: Remove a pack from the store.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: uninstallStorePack
      - stepNumber: 16
        description: Done.
        type: return
        outcome: uninstall done
      - stepNumber: 17
        label: doWhich
        description: Identify which installed pack a name resolves to.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: whichPack
      - stepNumber: 18
        description: Done.
        type: return
        outcome: which done
      - stepNumber: 19
        label: doUse
        description: Select an installed pack for this project.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: usePack
      - stepNumber: 20
        description: Done.
        type: return
        outcome: use done
      - stepNumber: 21
        label: doUnuse
        description: Deselect a pack for this project.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: unusePack
      - stepNumber: 22
        description: Done.
        type: return
        outcome: unuse done
      - stepNumber: 23
        label: doBundle
        description: Commit a copy of a selected pack under .wai/packs/.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: bundlePack
      - stepNumber: 24
        description: Done.
        type: return
        outcome: bundle done
      - stepNumber: 25
        label: doSync
        description: Install every declared-but-missing pack from its recorded source.
        type: call
        targetComponent: cli_packs_adapter
        targetMethod: syncPacks
      - stepNumber: 26
        description: Done.
        type: return
        outcome: sync done
  - name: runLock
    narrative:
      - stepNumber: 1
        description: Run the as-complete dry-run gate over the tree
        type: call
        targetComponent: cli_validator_adapter
        targetMethod: validateAsComplete
      - stepNumber: 2
        description: The gate found errors (an invalid tree is never frozen)
        type: branch
        condition: as-complete validation reported errors
        onFalseStep: 4
      - stepNumber: 3
        description: Refuse the lock, printing the blocking findings
        type: return
        outcome: refused
      - stepNumber: 4
        description: >-
          Confirm with the human (skipped under --yes), then freeze the tree through the lock
          adapter
        type: call
        targetComponent: cli_lock_adapter
        targetMethod: lockTree
      - stepNumber: 5
        description: The tree mounts chained children
        type: branch
        condition: at least one subsystem carries a projectPath
        onFalseStep: 7
      - stepNumber: 6
        description: >-
          Regenerate the family and sibling surface snapshots into every chained child — a locked
          parent ships fresh surfaces
        type: call
        targetComponent: cli_surfaces_client_adapter
        targetMethod: generateChildSnapshots
      - stepNumber: 7
        description: >-
          Refresh the generated outputs (runGenerate): re-render owner/architect files, prune stale
          managed agents against the full topology, re-export skills, re-inject guides
        type: local
      - stepNumber: 8
        description: Print the lock record and return
        type: return
        outcome: locked
status: complete
