  - name: announceBinding
    narrative:
      - stepNumber: 1
        description: >-
          Does the command act on a project? init, the hosted and identity commands (host, remote,
          login, logout, serve), `mcp serve` and `dev` (which announce their own binding), and
          help/version do not
        type: branch
        condition: the command acts on no project
        onTrueStep: 2
        onFalseStep: 3
      - stepNumber: 2
        description: Say nothing
