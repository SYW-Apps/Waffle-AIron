  - name: runHostKey
    sourcePath: src/commands/host.ts
    narrative:
      - stepNumber: 1
        description: Read the master credential from the environment
        type: local
      - stepNumber: 2
        description: Dispatch on the action
        type: switch
        'on': action
        cases:
          - value: mint
            step: 3
          - value: revoke
            step: 9
          - value: list
            step: 11
        defaultStep: 13
      - stepNumber: 3
        label: mint
        description: Is an owner named?
        type: branch
        condition: '--owner is given'
        onTrueStep: 4
        onFalseStep: 7
      - stepNumber: 4
        label: mint_owned
        description: >-
          Mint an owner-bound token via the host adapter, and print it once together with each
          deprecated member-qualified entry and the member record id it was stored as
        type: call
        targetComponent: cli_host_adapter
        targetMethod: mintToken
      - stepNumber: 5
        description: >-
          For a token narrowed to one project, explain the owner's project:read there via the host
          adapter and warn when it is not yes — the token acts as its owner's live permission, so an
          owner who cannot read the project mints a token that cannot read it either; seeding the
          owner's authority with `host permission set` fixes it. An owner with no user record, or an
          explanation that fails, warns nothing
        type: call
        targetComponent: cli_host_adapter
        targetMethod: explain
      - stepNumber: 6
        description: Return after mint
        type: return
        outcome: minted
      - stepNumber: 7
        label: mint_ownerless
        description: Mint an ownerless key via the host adapter, warning that it resolves to no permissions
        type: call
        targetComponent: cli_host_adapter
        targetMethod: mintKey
      - stepNumber: 8
        description: Return after mint
        type: return
        outcome: minted
      - stepNumber: 9
        label: revoke
        description: Revoke a key via the host adapter
        type: call
        targetComponent: cli_host_adapter
        targetMethod: revokeKey
      - stepNumber: 10
        description: Return after revoke
        type: return
        outcome: revoked
      - stepNumber: 11
        label: list
        description: List keys via the host adapter
        type: call
        targetComponent: cli_host_adapter
        targetMethod: listKeys
      - stepNumber: 12
        description: Return after list
        type: return
        outcome: listed
      - stepNumber: 13
        label: unknown
        description: Refuse an unknown action
        type: throw
        error: WaironError
    detail: full
