      - stepNumber: 3
        description: >-
          Print it or write it to --out, then each note (a bindings key resolved through a renamed
          project's former name, a workload whose verbs differ in reach on one port), each unbound
          design name with the placeholder label it was given, and each gate finding. Exit non-zero
          when the gate refused a flow (it was left out), and when any name is unbound: an applied
          policy over an unbound workload selects nothing it should and denies its ingress by
          default, so the run says so instead of passing
        type: return
        outcome: policy written
      - stepNumber: 4
        description: >-
          Refuse, naming --bindings and that the bindings file lives outside .wai/: specs hold no
          deployment facts
        type: throw
        error: NetworkOptionsError
  - name: runNetworkDiagram
    narrative:
      - stepNumber: 1
        description: Draw the network picture as Mermaid
        type: call
        targetComponent: cli_network_adapter
        targetMethod: diagram
      - stepNumber: 2
        description: Print it, or write it to --out
        type: local
  - name: runNetworkCheck
    narrative:
      - stepNumber: 1
        description: A check needs an observed-flow export
        type: branch
        condition: '--observed is given'
        onFalseStep: 5
      - stepNumber: 2
        description: Judge the observed flows against the matrix
        type: call
        targetComponent: cli_network_adapter
        targetMethod: check
      - stepNumber: 3
        description: >-
          Print the gate findings when there are any, each former-name note, then the unexpected
          flows, the disallowed flows (a declared verb, not allowed from that source), the unknown
          verbs, then the unexercised flows, each with its count
        type: local
      - stepNumber: 4
        description: >-
          Exit non-zero when anything unexpected, disallowed or unknown was seen, zero otherwise: an
          unexercised flow is a review item, not a failure
        type: return
        outcome: check reported
      - stepNumber: 5
        description: Refuse, naming --observed
        type: throw
        error: NetworkOptionsError
  - name: runNetworkWhy
    narrative:
      - stepNumber: 1
        description: Explain the pair
        type: call
        targetComponent: cli_network_adapter
        targetMethod: why
      - stepNumber: 2
        description: >-
          Print each allowing flow with its chain; or say plainly why not: an unknown party name, a
          flow the gate refuses (with its findings), a collaborator reached in-process (never a
          network flow — exit zero), or that nothing allows it with the nearest allowed flows; exit
          non-zero for every answer but allowed and in-process
        type: local
  - name: runNetworkDeclare
    narrative:
      - stepNumber: 1
        description: >-
          Read the project's configuration: a declaration it already holds keeps its description
          when --description is not given
        type: call
        targetComponent: cli_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 2
        description: Declare the network, with --description when given, through the core adapter
        type: call
        targetComponent: cli_core_adapter
        targetMethod: setNetwork
      - stepNumber: 3
        description: >-
          Say what was written (or that it already was), that the network rules now judge the
          design, and to re-lock
        type: local
  - name: runNetworkUndeclare
    narrative:
      - stepNumber: 1
        description: Remove the declaration through the core adapter
        type: call
        targetComponent: cli_core_adapter
        targetMethod: setNetwork
      - stepNumber: 2
        description: Say what was removed (or that none was declared), and to re-lock
        type: local
  - name: runTypeRenameField
    sourcePath: src/commands/type.ts
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the current project root and confirm it is an initialized wairon project; error if
          not
        type: call
        targetComponent: cli_core_adapter
        targetMethod: projectConfigExists
      - stepNumber: 2
        description: >-
          Read the projects that consume this project — the family in reach, members included, and
          the consumer checkouts in the --search folders — before anything moves, each with the
          names and members its specs use
        type: call
        targetComponent: cli_surfaces_client_adapter
        targetMethod: listConsumers
      - stepNumber: 3
        description: >-
          Rename the field through the core adapter — or, with --dry-run, ask what the rename would
          do, refused exactly as the real rename would be and writing nothing
        type: call
        targetComponent: cli_core_adapter
        targetMethod: renameField
      - stepNumber: 4
        description: >-
          Keep the consumers whose specs reach a member of a public name the report says carries the
          field (external_consumer.reaches): the projects whose code reading the old name breaks
        type: local
      - stepNumber: 5
        description: >-
          Print the move (or what would move), the specs rewritten, the public names carrying the
          field and each consumer it breaks with its section and alias — or that none in reach uses
          it, naming --search; a dry run ends with "Nothing was written", a real one with the
          re-lock the rename owes
        type: return
  - name: runMethodRenameParam
    sourcePath: src/commands/method.ts
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the current project root and confirm it is an initialized wairon project; error if
          not
        type: call
        targetComponent: cli_core_adapter
        targetMethod: projectConfigExists
      - stepNumber: 2
        description: >-
          Read the projects that consume this project — the family in reach, members included, and
          the consumer checkouts in the --search folders — before anything moves, each with the
          names and methods its specs use
        type: call
        targetComponent: cli_surfaces_client_adapter
        targetMethod: listConsumers
      - stepNumber: 3
        description: >-
          Rename the parameter through the core adapter — or, with --dry-run, ask what the rename
          would do, refused exactly as the real rename would be and writing nothing
        type: call
        targetComponent: cli_core_adapter
        targetMethod: renameParam
      - stepNumber: 4
        description: >-
          Keep the consumers the report's published list reaches — each public name publishing the
          method or a follower's verb, a call by a former method name and a broken former public
          name included (external_consumer.narrowedToUses): the projects that must follow the rename
        type: local
      - stepNumber: 5
        description: >-
          Print the move (or what would move) — saying when the request named a Portal verb and the
          rename was made on the source its signature comes from — the interfaces it moved in, the
          placeholders respelled (followers' included), the export entries publishing the method and
          each consumer that calls it — or that none in reach calls it, naming --search; a dry run
          ends with "Nothing was written", a real one with the re-lock the rename owes
        type: return
  - name: runMethodRename
    sourcePath: src/commands/method.ts
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the current project root and confirm it is an initialized wairon project; error if
          not
        type: call
        targetComponent: cli_core_adapter
        targetMethod: projectConfigExists
      - stepNumber: 2
        description: >-
          Read the projects that consume this project — the family in reach, and the consumer
          checkouts in the --search folders — before anything moves, each with the names and methods
          its specs use
        type: call
        targetComponent: cli_surfaces_client_adapter
        targetMethod: listConsumers
      - stepNumber: 3
        description: >-
          Rename the method through the core adapter — or, with --dry-run, ask what the rename would
          do, refused exactly as the real rename would be and writing nothing
        type: call
        targetComponent: cli_core_adapter
        targetMethod: renameMethod
      - stepNumber: 4
        description: >-
          Keep the consumers whose specs reach the old method on a public name the report says
          publishes it, a contract they depend on as a whole included
          (external_consumer.narrowedToUses): the projects the rename breaks
        type: local
      - stepNumber: 5
        description: >-
          Print what moved (or would move) and was retargeted, the prose left alone, the pinned
          symbol, the export entries publishing it, and each consumer it breaks with its folder and
          alias — or that none in reach calls it, naming --search for checkouts outside the family;
          a dry run ends with "Nothing was written", a real one with the re-lock the rename owes
        type: return
        outcome: renamed
lint:
  allow:
    - code: EXCESSIVE_NARRATIVE_STEPS
      reason: >-
        runPack is the `wairon pack` family's action dispatcher: a flat twelve-arm if-chain in
        src/cli/runner.ts, one adapter call per subcommand, cognitive score 1. Its 26 steps are two
        per subcommand (the call and its return) plus the switch and the unknown-action refusal, so
        the count tracks how many subcommands `pack` has, not what the method does — the same shape
        sits at every size in this runner: runPacks (8), runAgent (9), runSurface (12), runRemote
        (14). There is no seam to split on: all twelve arms call one module (src/commands/packs.ts),
        and every `pack` subcommand's endpoint dispatches to runPack directly, so scope-based
        sub-dispatchers would be invented here rather than named in the code. Adding a pack
        subcommand adds two steps, which is the point.
    - code: PARAM_TYPE_MISMATCH
      at: runMcpInstall
      covers:
        - options
      reason: >-
        The CLI runner is handed its flags, not the record: commander gives mcpInstallCommand the
        options object it parsed (--hosted, --project, --token, keyed by flag), and the handler maps
        them one-to-one onto mcp_install_options (hostedUrl, hostedProject, hostedToken) before the
        command adapter runs — the CLI counterpart of a router unpacking a request, with the flag
        names as the wire names.
