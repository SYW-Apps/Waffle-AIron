    symbol: runDomainsRemove
  - name: runAliasesList
    sourcePath: src/commands/aliases.ts
    narrative:
      - stepNumber: 1
        description: Ask which short names this person has opted out of
        type: call
        targetComponent: user_config_store
        targetMethod: disabledAliases
      - stepNumber: 2
        description: >-
          Find where the binaries live. A packaged binary already knows — it is the directory the
          running executable sits in — so nothing is looked up and nothing can be stale
        type: local
      - stepNumber: 3
        description: >-
          For each supported alias, report which of five states it is in: registered by npm and
          unchangeable from here, opted out, shadowed by a different program already on PATH,
          present, or missing with the command that would create it
        type: local
      - stepNumber: 4
        description: >-
          Close with the install directory when there is one to name, and say plainly when there is
          not — an npm install has no directory of ours to manage
        type: local
      - stepNumber: 5
        description: Done
        type: return
        outcome: listed
    symbol: runAliasesList
  - name: runAliasesEnable
    sourcePath: src/commands/aliases.ts
    narrative:
      - stepNumber: 1
        description: Decide whether this is a name we support
        type: branch
        condition: the name is one of the supported aliases
        onTrueStep: 3
        onFalseStep: 2
      - stepNumber: 2
        description: Refuse by name, listing every supported alias, and exit non-zero
        type: return
        outcome: refused
      - stepNumber: 3
        description: Read the opted-out list
        type: call
        targetComponent: user_config_store
        targetMethod: disabledAliases
      - stepNumber: 4
        description: >-
          Drop this name from it and record that, whichever kind of install this is — so that
          enabling an alias here is not quietly undone by the next install reading a stale opt-out
        type: call
        targetComponent: user_config_store
        targetMethod: setDisabledAliases
      - stepNumber: 5
        description: Decide whether there is anything to create on disk
        type: branch
        condition: this is a packaged binary
        onTrueStep: 6
        onFalseStep: 7
      - stepNumber: 6
        description: >-
          Create the alias beside the binary — a symlink on Unix, a .cmd wrapper on Windows — and
          report it enabled
        type: return
        outcome: enabled
      - stepNumber: 7
        description: Report that npm's own bin entries already register it, so nothing on disk changed
        type: return
        outcome: already registered
    symbol: runAliasesEnable
  - name: runAliasesDisable
    sourcePath: src/commands/aliases.ts
    narrative:
      - stepNumber: 1
        description: Decide whether this is a name we support
        type: branch
        condition: the name is one of the supported aliases
        onTrueStep: 3
        onFalseStep: 2
      - stepNumber: 2
        description: Refuse by name, listing every supported alias, and exit non-zero
        type: return
        outcome: refused
      - stepNumber: 3
        description: Read the opted-out list
        type: call
        targetComponent: user_config_store
        targetMethod: disabledAliases
      - stepNumber: 4
        description: >-
          Add this name to it and record that. The opt-out is what stops a later install recreating
          the alias — removing the file alone would not survive one
        type: call
        targetComponent: user_config_store
        targetMethod: setDisabledAliases
      - stepNumber: 5
        description: Decide whether there is anything to remove from disk
        type: branch
        condition: this is a packaged binary
        onTrueStep: 6
        onFalseStep: 7
      - stepNumber: 6
        description: Remove the symlink or wrapper beside the binary and report it disabled
        type: return
        outcome: disabled
      - stepNumber: 7
        description: >-
          Report that npm's bin entries cannot be changed from here, and what would have to happen
          instead
        type: return
        outcome: npm managed
    symbol: runAliasesDisable
  - name: localStatus
    sourcePath: src/commands/status.ts
    narrative:
      - stepNumber: 1
        description: >-
          Refuse outside a wairon project, naming `wairon init` — a dashboard of nothing would read
          like an empty tree rather than like the wrong directory — and refuse a --subsystem the
          tree does not hold, naming the subsystems it does: an empty dashboard for a typo would
          read like a subsystem with nothing in it
        type: local
      - stepNumber: 2
        description: >-
          Pending transaction banner, FIRST — a crash mid-swap is exactly when the tree below may
          not read: ask the migration portal (recover with fix false — a report, nothing written)
          for unfinished family-migration transactions under this root, and print one notice line
          per transaction naming its id, its verb and its coordinator's phase and pointing at
          `wairon doctor --fix`; silent when there is none. A notice never changes the exit code
        type: call
        targetComponent: cli_migration_adapter
        targetMethod: recover
      - stepNumber: 3
        description: >-
          Ask the validator for the pin tree: this project's approval state and each member's, every
          one computed at that project's own root — so the state printed for a member here is the
          state that member's own status prints (status-agrees)
        type: call
        targetComponent: cli_validator_adapter
        targetMethod: familyApprovals
      - stepNumber: 4
        description: >-
          Ask the core adapter for the completeness report with the pin tree, handing it the
          terminal's colours as roles: structure for the tree's scaffolding, layer for each label,
          score for a percentage, draft for anything not yet complete, and present or missing for a
          source file
        type: call
        targetComponent: cli_core_adapter
        targetMethod: getStatusReport
      - stepNumber: 5
        description: Decide whether the tree could be reported on at all
        type: branch
        condition: the report came back failed
        onTrueStep: 6
        onFalseStep: 7
      - stepNumber: 6
        description: >-
          Print the explanation as an error and exit non-zero, naming `wairon init` when there is no
          system specification. A script running this over a tree that will not parse must not read
          it as healthy, and the exit code is the only part of that a script sees
        type: return
        outcome: unreadable
      - stepNumber: 7
        description: Print a heading and the report beneath it
        type: local
      - stepNumber: 8
        description: >-
          Ask what the lock says about this tree, passing the pin tree so the verdict names members
          whose pin moved, members not approved, and a stage-5 identity upgrade
        type: call
        targetComponent: cli_core_adapter
        targetMethod: approvalVerdict
      - stepNumber: 9
        description: >-
          Print the verdict, choosing severity from whether it reports drift rather than by matching
          its wording — which is why the verdict answers a fact beside the sentence; with --all,
          every spec that moved since the approval (the verdict's full list) instead of the first
          few. Then, always, one line saying what the percentages measure — authoring progress: 80%
          once a component's component, contract and implementation specs are written, 100% once its
          implementation names source files that exist, capped at 50% while any is draft or design —
          and that approval is the lock record, not a percentage. A project never approved says so
          in the report (Approval: never approved).
        type: local
      - stepNumber: 10
        description: >-
          Compare this project's externals with their live producers, offline and advisory — the
          same pass plain `validate` appends
        type: call
        targetComponent: cli_validator_adapter
        targetMethod: adviseExternals
      - stepNumber: 11
        description: >-
          When any came back, print an Externals section under the verdict: one line per external
          that broke live (what moved — changed, renamed to <name>, or gone — who uses it, and
          "adapt, then `wairon externals pin <alias>`"), one per drifted producer (re-pin when
          convenient) and one per producer not compared (why, and that `wairon externals status`
          compares it), noting that the pin still gates. Nothing is printed for externals that are
          current, and the exit code is unchanged
        type: local
      - stepNumber: 12
        description: Done
        type: return
        outcome: printed
    symbol: runStatus
  - name: runSkillsList
    sourcePath: src/commands/skills.ts
    narrative:
      - stepNumber: 1
