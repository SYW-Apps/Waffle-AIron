        type: local
      - stepNumber: 4
        description: Is a project bound?
        type: branch
        condition: no project binds the folder
        onTrueStep: 5
        onFalseStep: 6
      - stepNumber: 5
        description: 'Say nothing: the command reports the missing project in its own words'
        type: return
        outcome: no project
      - stepNumber: 6
        description: >-
          Read the bound project's configuration for its effective id (a configuration that fails
          its schema names the folder instead; the command reports that in its own words)
        type: call
        targetComponent: cli_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 7
        description: >-
          Does the configuration file not parse as YAML (a duplicated key, a bad indent) while the
          command is not doctor, which diagnoses it in its own words?
        type: branch
        condition: project.yaml does not parse and the command is not doctor
        onTrueStep: 8
        onFalseStep: 9
      - stepNumber: 8
        description: >-
          Refuse the command with the parse error as one line naming the file, the line and the key:
          no command runs on a configuration it cannot read, and every one says so alike
        type: throw
        error: YamlSyntaxError
      - stepNumber: 9
        description: >-
          Write `project <id> at <root>` to stderr, the root as an absolute path — nothing under
          --silent
        type: local
      - stepNumber: 10
        description: Done
        type: return
        outcome: announced
