id: host_request_orchestrator_impl
name: Host Request Orchestrator Implementation
description: >-
  Per-request data-plane workflow: authenticate, resolve and bind the authorized project scope, then
  dispatch the sdd_* call — routing the execute-primary project-lifecycle tools
  (sdd_host_initialize_project, sdd_host_lock_project, sdd_host_promote_project,
  sdd_host_get_approval_status, sdd_host_await_approval) to the project lifecycle orchestrator, the
  hosted landscape discovery tools to the surface exchange orchestrator (currentProjectId = the
  bound project), and every other tool to the scoped MCP server after enforcing the granular
  data-plane permission through the authorization specialist (project:read for reads, project:write
  for writes — unknown tools fail closed as writes) over the bound project.
contract: ihost_request_orchestrator
sourcePath: src/server/request.ts
methods:
  - name: viewDiagram
    narrative:
      - stepNumber: 1
        description: Extract the signed view token from the request query
        type: local
      - stepNumber: 2
        description: Verify the token (signature + expiry); rejects if invalid
        type: call
        targetComponent: auth_specialist
        targetMethod: verifyViewToken
      - stepNumber: 3
        description: Resolve the granted project's isolated root and bind it
        type: local
      - stepNumber: 4
        description: Render the canvas in scope
        type: call
        targetComponent: host_core_adapter
        targetMethod: renderDiagram
      - stepNumber: 5
        description: Wrap the canvas HTML in a text/html response
        type: local
      - stepNumber: 6
        description: Return the canvas HTML response
        type: return
        outcome: canvas html response
    symbol: handleViewDiagram
  - name: handleRequest
    narrative:
      - stepNumber: 1
        description: Extract the bearer token from the request Authorization header
        type: local
      - stepNumber: 2
        description: >-
          Authenticate the token to a principal (resolving its subject, projects narrowing, and
          permissionSubject)
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticate
      - stepNumber: 3
        description: If the principal is unauthenticated, reject
        type: branch
        condition: principal is unauthenticated
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Return 401 Unauthorized
        type: return
        outcome: 401 Unauthorized
      - stepNumber: 5
        description: Read the optional project selector from the request
        type: local
      - stepNumber: 6
        description: >-
          Resolve the full authorized binding through the project repository — the root to bind (the
          mounted chained-child root for a subproject-qualified narrowing/selector), the TOP project
          id (permission + audit anchor), and the bound mount chain; cross-project access rejected
        type: call
        targetComponent: project_registry
        targetMethod: resolveBinding
      - stepNumber: 7
        description: If no authorized root resolved, reject cross-project access
        type: branch
        condition: resolved root is empty (project not authorized)
        onTrueStep: 8
        onFalseStep: 9
      - stepNumber: 8
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 9
        description: Bind the request-scoped project root
        type: local
      - stepNumber: 10
        description: >-
          Confine a subproject-qualified credential. These tools act on the project RECORD or its
          repository, never on the bound tree, so serving them would let a token scoped to one
          chained child reach the whole parent — the qualifier would narrow nothing. The two
          TREE-scoped lifecycle tools (lock, promote) are excluded: they are confined instead by
          forwarding the qualifier.
        type: branch
        condition: >-
          the resolved binding carries a subproject qualifier AND the called tool acts on the hosted
          project RECORD (initialize, approval status, await approval, or any of the six project-ops
          tools: pack list/install, policy evaluate/reconcile, produce, commit)
        onFalseStep: 12
      - stepNumber: 11
        description: >-
          Refuse as an isError tool result (HTTP still 200, and the refusal still flows through the
          SAME best-effort audit path) naming the tool and the bound qualifier, and stating that it
          acts on the whole project so an unqualified credential is required. Never a silent success
          and never a partial action.
        type: return
        outcome: refused record-level tool on a subproject-qualified binding
      - stepNumber: 12
        description: >-
          If the called tool is an execute-primary project-lifecycle tool, a hosted landscape tool,
          or a hosted project-ops tool (packs/policy/producer/commit), dispatch it to the matching
          orchestrator instead of the scoped MCP server
        type: branch
        condition: >-
          the called tool is one of the sdd_host_* project-lifecycle or project-ops tools or the
          hosted landscape tools
        onTrueStep: 13
        onFalseStep: 46
      - stepNumber: 13
        description: Dispatch by tool name to the matching orchestrator method
        type: switch
        'on': the called tool name
        cases:
          - value: sdd_host_initialize_project
            step: 14
          - value: sdd_host_lock_project
            step: 16
          - value: sdd_host_promote_project
            step: 18
          - value: sdd_host_get_approval_status
            step: 20
          - value: sdd_host_await_approval
            step: 22
          - value: sdd_landscape_list_reachable_projects
            step: 24
          - value: sdd_landscape_list_reachable_project_interfaces
            step: 26
          - value: sdd_landscape_list_visible_surfaces
            step: 28
          - value: sdd_landscape_get_project_surface
            step: 30
          - value: sdd_host_pack_list
            step: 32
          - value: sdd_host_pack_install
            step: 34
          - value: sdd_host_policy_evaluate
            step: 36
          - value: sdd_host_policy_reconcile
            step: 38
          - value: sdd_host_produce
            step: 40
          - value: sdd_host_commit_project
            step: 42
        defaultStep: 14
      - stepNumber: 14
        description: >-
          Execute-or-request project initialization, passing the credential and decoded tool
          arguments; returns a ProjectActionOutcome
        type: call
        targetComponent: project_lifecycle_orchestrator
        targetMethod: initializeProject
      - stepNumber: 15
        description: Continue to shape the response
        type: jump
        toStep: 44
      - stepNumber: 16
        description: >-
          Execute-or-request a project lock, passing the credential, the TOP project id, AND the
          bound subproject qualifier when the binding carries one — so a qualified credential
          freezes exactly the child tree it is scoped to, while permission resolution and audit stay
          anchored at the top project.
        type: call
        targetComponent: project_lifecycle_orchestrator
        targetMethod: lockProject
      - stepNumber: 17
        description: Continue to shape the response
        type: jump
        toStep: 44
      - stepNumber: 18
        description: >-
          Execute-or-request a project promotion, passing the credential, the TOP project id, AND
          the bound subproject qualifier when the binding carries one — the lock/StateId re-check
          then concerns that child tree, with permission and audit still anchored at the top
          project.
        type: call
        targetComponent: project_lifecycle_orchestrator
        targetMethod: promoteProject
      - stepNumber: 19
        description: Continue to shape the response
        type: jump
        toStep: 44
      - stepNumber: 20
        description: Get the approval-request status, passing the credential and request id
        type: call
        targetComponent: project_lifecycle_orchestrator
        targetMethod: getApprovalStatus
      - stepNumber: 21
        description: Continue to shape the response
        type: jump
        toStep: 44
      - stepNumber: 22
        description: >-
          Long-poll for a decision on the caller's approval request, passing the credential, request
          id, and timeout
        type: call
        targetComponent: project_lifecycle_orchestrator
        targetMethod: awaitApproval
      - stepNumber: 23
        description: Continue to shape the response
        type: jump
        toStep: 44
      - stepNumber: 24
        description: Dispatch the reachable-projects discovery with currentProjectId = the bound project
        type: call
        targetComponent: surface_exchange_orchestrator
        targetMethod: listReachableProjectsForMcp
      - stepNumber: 25
        description: Continue to shape the response
        type: jump
        toStep: 44
      - stepNumber: 26
        description: >-
          Dispatch the reachable-target interface discovery (currentProjectId = bound project,
          target from arguments)
        type: call
        targetComponent: surface_exchange_orchestrator
        targetMethod: listReachableProjectInterfacesForMcp
      - stepNumber: 27
        description: Continue to shape the response (reachable-interfaces path)
        type: jump
        toStep: 44
      - stepNumber: 28
        description: >-
          Dispatch the visibility-resolved discovery catalog (currentProjectId = the BOUND project;
          never from arguments)
        type: call
        targetComponent: surface_exchange_orchestrator
        targetMethod: listVisibleSurfaces
      - stepNumber: 29
        description: Continue to shape the response
        type: jump
        toStep: 44
      - stepNumber: 30
        description: >-
          Dispatch the contract-grade surface fetch (currentProjectId = the BOUND project;
          targetProjectId from arguments)
        type: call
        targetComponent: surface_exchange_orchestrator
        targetMethod: getProjectSurfaceForMcp
      - stepNumber: 31
        description: Continue to shape the response
        type: jump
        toStep: 44
      - stepNumber: 32
        description: >-
          Dispatch the per-project pack listing (project = the BOUND project) — project:read gated
          upstream
        type: call
        targetComponent: project_ops_orchestrator
        targetMethod: listProjectPacks
      - stepNumber: 33
        description: Continue to shape the response
        type: jump
        toStep: 44
      - stepNumber: 34
        description: >-
          Dispatch the per-project declarative pack install (project = the BOUND project,
          name/content from arguments) — project:admin gated upstream
        type: call
        targetComponent: project_ops_orchestrator
        targetMethod: installProjectPack
      - stepNumber: 35
        description: Continue to shape the response
        type: jump
        toStep: 44
      - stepNumber: 36
        description: >-
          Dispatch the pack/profile compliance evaluation (projectId = the BOUND project) —
          project:write gated upstream
        type: call
        targetComponent: project_ops_orchestrator
        targetMethod: evaluateProjectPolicy
      - stepNumber: 37
        description: Continue to shape the response
        type: jump
        toStep: 44
      - stepNumber: 38
        description: >-
          Dispatch the pack/profile policy reconciliation (projectId = the BOUND project) —
          project:write gated upstream
        type: call
        targetComponent: project_ops_orchestrator
        targetMethod: reconcileProjectPolicy
      - stepNumber: 39
        description: Continue to shape the response
        type: jump
        toStep: 44
      - stepNumber: 40
        description: >-
          Dispatch the producer projection run (project = the BOUND project, target from arguments)
          — project:admin gated upstream
        type: call
        targetComponent: project_ops_orchestrator
        targetMethod: produceProducer
      - stepNumber: 41
        description: Continue to shape the response
        type: jump
        toStep: 44
      - stepNumber: 42
        description: >-
          Dispatch the deliberate .wai/-scoped commit+push (project = the BOUND project — the data
          plane binds ONE project so no project argument exists; optional subsystem + message from
          arguments) — project:write gated upstream
        type: call
        targetComponent: project_ops_orchestrator
        targetMethod: commitProject
      - stepNumber: 43
        description: Continue to shape the response
        type: jump
        toStep: 44
      - stepNumber: 44
        description: Shape the project-lifecycle or landscape result into the JSON-RPC tool response envelope
        type: local
      - stepNumber: 45
        description: >-
          Continue to the shared audit-event build step, skipping the ordinary permission gate and
          scoped MCP server dispatch
        type: jump
        toStep: 52
      - stepNumber: 46
        description: >-
          Classify the called sdd_* tool: a read ONLY when its name starts with sdd_get_ or
          sdd_validate_ (required capability project:read); ANY other tool — the explicit write
          prefixes
          (sdd_add_/sdd_update_/sdd_delete_/sdd_write_/sdd_define_/sdd_set_/sdd_initialize_/sdd_externalize_/sdd_internalize_/sdd_move_)
          AND any unrecognized or newly added name — is treated as a write requiring project:write
          (fail closed: an unknown tool never falls through to read-level gating)
        type: local
      - stepNumber: 47
        description: >-
          Resolve the caller's required capability (project:read or project:write) over the bound
          project through the authorization specialist
        type: call
        targetComponent: authorization_specialist
        targetMethod: authorize
      - stepNumber: 48
        description: >-
          If the effective value is not yes, reject with a clear MCP error that the required
          data-plane permission is missing for the bound project
        type: branch
        condition: the effective value is not yes
        onTrueStep: 49
        onFalseStep: 50
      - stepNumber: 49
        description: >-
          Reject with a clear MCP error that the required data-plane permission is missing for the
          bound project
        type: throw
        error: >-
          Forbidden — the caller lacks the required data-plane permission (project:read or
          project:write) for this project
      - stepNumber: 50
        description: Instantiate the scoped sdd_* MCP server
        type: call
        targetComponent: host_mcp_adapter
        targetMethod: createScopedServer
      - stepNumber: 51
        description: Connect the scoped server to the request transport and process the JSON-RPC message
        type: local
      - stepNumber: 52
        description: >-
          Build the redacted AuditEvent (action mcp.tool.call, actor and tokenId from the principal,
          project id, tool name as target, outcome)
        type: local
      - stepNumber: 53
        description: Append the audit event without letting a failure fail the request
        type: try
        endStep: 55
        catches:
          - error: audit append failure
            step: 56
      - stepNumber: 54
        description: Append the redacted mcp.tool.call audit event under the active retention policy
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 55
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 57
      - stepNumber: 56
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 57
        description: Return the MCP response
        type: return
        outcome: MCP response
    symbol: handleMcpRequest
status: complete
createdAt: '2026-07-04T12:54:20.000Z'
updatedAt: '2026-07-25T16:37:12.221Z'
