id: host_request_orchestrator_impl
name: Host Request Orchestrator Implementation
description: >-
  Per-request data-plane workflow: authenticate, resolve and bind the authorized project scope, then
  dispatch the sdd_* call — routing the approval-backed self-service tools to the self-service
  orchestrator, the hosted landscape discovery tools to the landscape orchestrator (currentProjectId
  = the bound project), and every other tool to the scoped MCP server after enforcing the granular
  data-plane permission (mcp:read for reads, mcp:write for writes) from the principal's grant for
  the bound project.
contract: ihost_request_orchestrator
sourcePath: src/server/request.ts
methods:
  - name: handleRequest
    narrative:
      - stepNumber: 1
        description: Extract the bearer token from the request Authorization header
        type: local
      - stepNumber: 2
        description: Authenticate the token to a principal (resolving its precise grants)
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticate
      - stepNumber: 3
        description: If the principal is unauthenticated, reject
        type: branch
        condition: principal is unauthenticated
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Return 401 Unauthorized
        type: return
        outcome: 401 Unauthorized
      - stepNumber: 5
        description: Read the optional project selector from the request
        type: local
      - stepNumber: 6
        description: Resolve the authorized project's isolated root
        type: call
        targetComponent: project_registry
        targetMethod: resolveRoot
      - stepNumber: 7
        description: If no authorized root resolved, reject cross-project access
        type: branch
        condition: resolved root is empty (project not authorized)
        onTrueStep: 8
        onFalseStep: 9
      - stepNumber: 8
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 9
        description: Bind the request-scoped project root
        type: local
      - stepNumber: 10
        description: >-
          If the called tool is one of the approval-backed self-service tools
          (sdd_host_request_project_initialization, sdd_host_request_project_lock,
          sdd_host_request_project_promotion, sdd_host_get_approval_status) or one of the hosted
          landscape tools (sdd_landscape_list_reachable_projects,
          sdd_landscape_list_reachable_project_interfaces, sdd_landscape_list_visible_surfaces,
          sdd_landscape_get_project_surface), dispatch it to the matching orchestrator instead of
          the scoped MCP server
        type: branch
        condition: the called tool is one of the sdd_host_* self-service tools or the hosted landscape tools
        onTrueStep: 11
        onFalseStep: 30
      - stepNumber: 11
        description: Dispatch by tool name to the matching orchestrator method
        type: switch
        'on': the called tool name
        cases:
          - value: sdd_host_request_project_initialization
            step: 12
          - value: sdd_host_request_project_lock
            step: 14
          - value: sdd_host_request_project_promotion
            step: 16
          - value: sdd_host_get_approval_status
            step: 18
          - value: sdd_landscape_list_reachable_projects
            step: 20
          - value: sdd_landscape_list_reachable_project_interfaces
            step: 22
          - value: sdd_landscape_list_visible_surfaces
            step: 24
          - value: sdd_landscape_get_project_surface
            step: 26
        defaultStep: 12
      - stepNumber: 12
        description: >-
          Request project initialization, passing the authenticated credential and decoded tool
          arguments
        type: call
        targetComponent: self_service_orchestrator
        targetMethod: requestProjectInitialization
      - stepNumber: 13
        description: Continue to shape the response
        type: jump
        toStep: 28
      - stepNumber: 14
        description: Request a project lock, passing the authenticated credential and project id
        type: call
        targetComponent: self_service_orchestrator
        targetMethod: requestProjectLock
      - stepNumber: 15
        description: Continue to shape the response
        type: jump
        toStep: 28
      - stepNumber: 16
        description: Request a project promotion, passing the authenticated credential and project id
        type: call
        targetComponent: self_service_orchestrator
        targetMethod: requestProjectPromotion
      - stepNumber: 17
        description: Continue to shape the response
        type: jump
        toStep: 28
      - stepNumber: 18
        description: Get the approval-request status, passing the authenticated credential and request id
        type: call
        targetComponent: self_service_orchestrator
        targetMethod: getRequestStatus
      - stepNumber: 19
        description: Continue to shape the response
        type: jump
        toStep: 28
      - stepNumber: 20
        description: >-
          List reachable projects, passing the authenticated credential and currentProjectId = the
          bound project
        type: call
        targetComponent: landscape_orchestrator
        targetMethod: listReachableProjectsForMcp
      - stepNumber: 21
        description: Continue to shape the response
        type: jump
        toStep: 28
      - stepNumber: 22
        description: >-
          List reachable project interfaces, passing the authenticated credential, currentProjectId
          = the bound project, and the decoded targetProjectId
        type: call
        targetComponent: landscape_orchestrator
        targetMethod: listReachableProjectInterfacesForMcp
      - stepNumber: 23
        description: Continue to shape the response (reachable-interfaces path)
        type: jump
        toStep: 28
      - stepNumber: 24
        description: >-
          Dispatch the visibility-resolved discovery catalog (currentProjectId = the BOUND project;
          never from arguments)
        type: call
        targetComponent: landscape_orchestrator
        targetMethod: listVisibleSurfaces
      - stepNumber: 25
        description: Continue to shape the response
        type: jump
        toStep: 28
      - stepNumber: 26
        description: >-
          Dispatch the contract-grade surface fetch (currentProjectId = the BOUND project;
          targetProjectId from arguments)
        type: call
        targetComponent: landscape_orchestrator
        targetMethod: getProjectSurfaceForMcp
      - stepNumber: 27
        description: Continue to shape the response
        type: jump
        toStep: 28
      - stepNumber: 28
        description: Shape the self-service or landscape result into the JSON-RPC tool response envelope
        type: local
      - stepNumber: 29
        description: >-
          Continue to the shared audit-event build step, skipping the ordinary permission gate and
          scoped MCP server dispatch
        type: jump
        toStep: 35
      - stepNumber: 30
        description: >-
          Classify the called sdd_* tool as a write or a read: write tools have names starting with
          sdd_add_, sdd_update_, sdd_delete_, sdd_write_, sdd_define_, sdd_set_, sdd_initialize_,
          sdd_externalize_, sdd_internalize_, or sdd_move_; read tools have names starting with
          sdd_get_ or sdd_validate_ (sdd_get_status is a read). The required data-plane permission
          is mcp:write for a write tool and mcp:read for a read tool.
        type: local
      - stepNumber: 31
        description: >-
          If the authenticated principal's grant covering the bound project does not carry the
          matching data-plane permission — consulting principal.grants for the bound project, NOT
          the coarse role/projects projection; mcp:write for writes, mcp:read for reads, where a '*'
          permission or an instance-wide '*' project grant covers both — reject
        type: branch
        condition: >-
          the principal's grant for the bound project lacks the required data-plane permission
          (mcp:read for a read tool, mcp:write for a write tool)
        onTrueStep: 32
        onFalseStep: 33
      - stepNumber: 32
        description: >-
          Reject with a clear MCP error that the required data-plane permission (mcp:read or
          mcp:write) is missing for the bound project
        type: throw
        error: >-
          Forbidden — the token's grant for this project lacks the required data-plane permission
          (mcp:read or mcp:write)
      - stepNumber: 33
        description: Instantiate the scoped sdd_* MCP server
        type: call
        targetComponent: host_mcp_adapter
        targetMethod: createScopedServer
      - stepNumber: 34
        description: Connect the scoped server to the request transport and process the JSON-RPC message
        type: local
      - stepNumber: 35
        description: >-
          Build the redacted AuditEvent (action mcp.tool.call, actor and tokenId from the principal,
          project id, tool name as target, outcome)
        type: local
      - stepNumber: 36
        description: Append the audit event without letting a failure fail the request
        type: try
        endStep: 38
        catches:
          - error: audit append failure
            step: 39
      - stepNumber: 37
        description: Append the redacted mcp.tool.call audit event under the active retention policy
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 38
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 40
      - stepNumber: 39
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 40
        description: Return the MCP response
        type: return
        outcome: MCP response
  - name: viewDiagram
    narrative:
      - stepNumber: 1
        description: Extract the signed view token from the request query
        type: local
      - stepNumber: 2
        description: Verify the token (signature + expiry); rejects if invalid
        type: call
        targetComponent: auth_specialist
        targetMethod: verifyViewToken
      - stepNumber: 3
        description: Resolve the granted project's isolated root and bind it
        type: local
      - stepNumber: 4
        description: Render the canvas in scope
        type: call
        targetComponent: host_core_adapter
        targetMethod: renderDiagram
      - stepNumber: 5
        description: Wrap the canvas HTML in a text/html response
        type: local
      - stepNumber: 6
        description: Return the canvas HTML response
        type: return
        outcome: canvas html response
status: complete
