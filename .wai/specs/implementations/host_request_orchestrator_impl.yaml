id: host_request_orchestrator_impl
name: Host Request Orchestrator Implementation
description: >-
  Per-request data-plane workflow: authenticate, resolve and bind the authorized hosted record (a
  member is a record of its own since stage 7), resolve the request's reach into the record's family
  per record, then dispatch the sdd_* call — routing the execute-primary project-lifecycle tools to
  the project lifecycle orchestrator, the hosted landscape discovery tools to the surface exchange
  orchestrator (currentProjectId = the bound record), and every other tool to the scoped MCP server
  after enforcing the granular data-plane permission through the authorization component
  (project:read for reads, project:write for writes — unknown tools fail closed as writes) over the
  bound record; after an applied family-shape tool succeeds, the family's member records are
  reconciled.
contract: ihost_request_orchestrator
sourcePath: src/server/request.ts
methods:
  - name: viewDiagram
    narrative:
      - stepNumber: 1
        description: Extract the signed view token from the request query
        type: local
      - stepNumber: 2
        description: Verify the token (signature + expiry); rejects if invalid
        type: call
        targetComponent: authentication
        targetMethod: verifyViewToken
      - stepNumber: 3
        description: Resolve the granted project's isolated root and bind it
        type: local
      - stepNumber: 4
        description: Render the canvas in scope
        type: call
        targetComponent: host_core_adapter
        targetMethod: renderDiagram
      - stepNumber: 5
        description: Wrap the canvas HTML in a text/html response
        type: local
      - stepNumber: 6
        description: Return the canvas HTML response
        type: return
        outcome: canvas html response
    symbol: handleViewDiagram
  - name: dispatchProjectLifecycleTool
    narrative:
      - stepNumber: 1
        description: >-
          Read the single JSON-RPC message from the request body, together with the called tool
          name, its decoded arguments, and the request id the response must echo
        type: local
      - stepNumber: 2
        description: >-
          Only the execute-primary project-lifecycle tools, the hosted landscape tools and the
          hosted project-ops tools (packs/policy/producer/commit) are served here; every other tool
          belongs to the scoped MCP server
        type: branch
        condition: >-
          the message is not a tools/call, or the called tool is not one of the sdd_host_*
          project-lifecycle or project-ops tools or the hosted landscape tools
        onTrueStep: 3
        onFalseStep: 4
      - stepNumber: 3
        description: Answer with nothing, so the caller falls through to the scoped sdd_* MCP server
        type: return
        outcome: not a tool this dispatch serves
      - stepNumber: 4
        description: Dispatch by tool name to the matching orchestrator method
        type: switch
        'on': the called tool name
        cases:
          - value: sdd_host_initialize_project
            step: 5
          - value: sdd_host_lock_project
            step: 7
          - value: sdd_host_get_approval_status
            step: 9
          - value: sdd_host_await_approval
            step: 11
          - value: sdd_landscape_list_reachable_projects
            step: 13
          - value: sdd_landscape_list_reachable_project_interfaces
            step: 15
          - value: sdd_landscape_list_visible_surfaces
            step: 17
          - value: sdd_landscape_get_project_surface
            step: 19
          - value: sdd_host_pack_list
            step: 21
          - value: sdd_host_pack_install
            step: 23
          - value: sdd_host_policy_evaluate
            step: 25
          - value: sdd_host_policy_reconcile
            step: 27
          - value: sdd_host_produce
            step: 29
          - value: sdd_host_commit_project
            step: 31
          - value: sdd_host_export_tree
            step: 33
          - value: sdd_host_import_tree
            step: 35
          - value: sdd_host_pack_impact
            step: 37
        defaultStep: 5
      - stepNumber: 5
        description: >-
          Execute-or-request project initialization, passing the credential and decoded tool
          arguments; returns a ProjectActionOutcome
        type: call
        targetComponent: project_lifecycle_orchestrator
        targetMethod: initializeProject
      - stepNumber: 6
        description: Continue to shape the response
        type: jump
        toStep: 39
      - stepNumber: 7
        description: >-
          Execute-or-request a project lock on the BOUND record — a member's own record when a
          member is bound, so its lock request, approval page and status are its own; the qualifier
          argument is no longer passed (a member is never reached through its parent)
        type: call
        targetComponent: project_lifecycle_orchestrator
        targetMethod: lockProject
      - stepNumber: 8
        description: Continue to shape the response
        type: jump
        toStep: 39
      - stepNumber: 9
        description: Get the approval-request status, passing the credential and request id
        type: call
        targetComponent: project_lifecycle_orchestrator
        targetMethod: getApprovalStatus
      - stepNumber: 10
        description: Continue to shape the response
        type: jump
        toStep: 39
      - stepNumber: 11
        description: >-
          Long-poll for a decision on the caller's approval request, passing the credential, request
          id, and timeout
        type: call
        targetComponent: project_lifecycle_orchestrator
        targetMethod: awaitApproval
      - stepNumber: 12
        description: Continue to shape the response
        type: jump
        toStep: 39
      - stepNumber: 13
        description: Dispatch the reachable-projects discovery with currentProjectId = the bound project
        type: call
        targetComponent: surface_exchange_orchestrator
        targetMethod: listReachableProjectsForMcp
      - stepNumber: 14
        description: Continue to shape the response
        type: jump
        toStep: 39
      - stepNumber: 15
        description: >-
          Dispatch the reachable-target interface discovery (currentProjectId = bound project,
          target from arguments)
        type: call
        targetComponent: surface_exchange_orchestrator
        targetMethod: listReachableProjectInterfacesForMcp
      - stepNumber: 16
        description: Continue to shape the response (reachable-interfaces path)
        type: jump
        toStep: 39
      - stepNumber: 17
        description: >-
          Dispatch the visibility-resolved discovery catalog (currentProjectId = the BOUND project;
          never from arguments)
        type: call
        targetComponent: surface_exchange_orchestrator
        targetMethod: listVisibleSurfaces
      - stepNumber: 18
        description: Continue to shape the response
        type: jump
        toStep: 39
      - stepNumber: 19
        description: >-
          Dispatch the contract-grade surface fetch (currentProjectId = the BOUND project;
          targetProjectId from arguments)
        type: call
        targetComponent: surface_exchange_orchestrator
        targetMethod: getProjectSurfaceForMcp
      - stepNumber: 20
        description: Continue to shape the response
        type: jump
        toStep: 39
      - stepNumber: 21
        description: >-
          Dispatch the per-project pack listing (project = the BOUND project) — project:read gated
          upstream
        type: call
        targetComponent: project_ops_orchestrator
        targetMethod: listProjectPacks
      - stepNumber: 22
        description: Continue to shape the response
        type: jump
        toStep: 39
      - stepNumber: 23
        description: >-
          Dispatch the per-project declarative pack install (project = the BOUND project,
          name/content from arguments) — project:admin gated upstream
        type: call
        targetComponent: project_ops_orchestrator
        targetMethod: installProjectPack
      - stepNumber: 24
        description: Continue to shape the response
        type: jump
        toStep: 39
      - stepNumber: 25
        description: >-
          Dispatch the pack/profile compliance evaluation (projectId = the BOUND project) —
          project:write gated upstream
        type: call
        targetComponent: project_ops_orchestrator
        targetMethod: evaluateProjectPolicy
      - stepNumber: 26
        description: Continue to shape the response
        type: jump
        toStep: 39
      - stepNumber: 27
        description: >-
          Dispatch the pack/profile policy reconciliation (projectId = the BOUND project) —
          project:write gated upstream
        type: call
        targetComponent: project_ops_orchestrator
        targetMethod: reconcileProjectPolicy
      - stepNumber: 28
        description: Continue to shape the response
        type: jump
        toStep: 39
      - stepNumber: 29
        description: >-
          Dispatch the producer projection run (project = the BOUND project, target from arguments)
          — project:admin gated upstream
        type: call
        targetComponent: project_ops_orchestrator
        targetMethod: produceProducer
      - stepNumber: 30
        description: Continue to shape the response
        type: jump
        toStep: 39
      - stepNumber: 31
        description: >-
          Dispatch the deliberate .wai/-scoped commit+push (project = the BOUND project — the data
          plane binds ONE project so no project argument exists; optional subsystem + message from
          arguments) — project:write gated upstream
        type: call
        targetComponent: project_ops_orchestrator
        targetMethod: commitProject
      - stepNumber: 32
        description: Continue to shape the response
        type: jump
        toStep: 39
      - stepNumber: 33
        description: >-
          Export the BOUND record's tree as a .waitree archive — a member's own tree when a member
          is bound — project:read gated upstream. The bytes are base64-encoded into the tool result,
          bounded by the same body cap every data-plane response is.
        type: call
        targetComponent: project_ops_orchestrator
        targetMethod: exportProjectTree
      - stepNumber: 34
        description: Continue to shape the response
        type: jump
        toStep: 39
      - stepNumber: 35
        description: >-
          Import a base64-decoded .waitree archive into the BOUND record's tree — project:admin
          gated upstream, executable entries always refused, and the replaced tree backed up.
        type: call
        targetComponent: project_ops_orchestrator
        targetMethod: importProjectTree
      - stepNumber: 36
        description: Continue to shape the response
        type: jump
        toStep: 39
      - stepNumber: 37
        label: pack_impact
        description: >-
          Dispatch the per-project pack impact preview (project = the BOUND project; name, and the
          declarative content when installing, from arguments) — writes nothing; project:read gated
          upstream. sdd_host_pack_install itself stays an unattended write whose answer says it
          applied, without the report
        type: call
        targetComponent: project_ops_orchestrator
        targetMethod: previewProjectPack
      - stepNumber: 38
        description: Continue to shape the response
        type: jump
        toStep: 39
      - stepNumber: 39
        description: Shape the project-lifecycle or landscape result into the JSON-RPC tool response envelope
        type: local
      - stepNumber: 40
        description: Return the JSON-RPC tool response envelope the caller sends
        type: return
        outcome: the JSON-RPC tool response envelope
    symbol: dispatchProjectLifecycleTool
  - name: auditToolCall
    narrative:
      - stepNumber: 1
        description: >-
          Build the redacted AuditEvent (action mcp.tool.call, actor and tokenId from the principal,
          the bound record's id as projectId — the member's own id when a member was bound — the
          family root a deprecated qualifier named as composition, tool name as target, outcome)
        type: local
      - stepNumber: 2
        description: Append the audit event without letting a failure fail the request
        type: try
        endStep: 3
        catches:
          - error: audit append failure
            step: 5
      - stepNumber: 3
        description: Append the redacted mcp.tool.call audit event under the active retention policy
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 4
        description: On a successful append, return without entering the audit-failure handler below
        type: return
        outcome: audit event appended
      - stepNumber: 5
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 6
        description: The append failure was recorded as a server diagnostic; the request is unaffected
        type: return
        outcome: audit append failure recorded, request unaffected
    symbol: auditToolCall
  - name: handle
    narrative:
      - stepNumber: 1
        description: Extract the bearer token from the request Authorization header
        type: local
      - stepNumber: 2
        description: >-
          Authenticate the token to a principal (resolving its subject, projects narrowing, and
          permissionSubject)
        type: call
        targetComponent: authentication
        targetMethod: authenticate
      - stepNumber: 3
        description: If the principal is unauthenticated, reject
        type: branch
        condition: principal is unauthenticated
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Return 401 Unauthorized
        type: return
        outcome: 401 Unauthorized
      - stepNumber: 5
        description: Read the optional project selector from the request
        type: local
      - stepNumber: 6
        description: >-
          Resolve the authorized binding through the project repository: the bound hosted RECORD (a
          member is a record of its own, bound by its own id), its root, its family root id, and —
          for one release — the deprecated member qualifier that resolved it; a narrowing entry
          naming a project covers its members (projects nest like units); cross-project access
          rejected
        type: call
        targetComponent: project_repository
        targetMethod: resolveBinding
      - stepNumber: 7
        description: If no authorized root resolved, reject cross-project access
        type: branch
        condition: resolved root is empty (project not authorized)
        onTrueStep: 8
        onFalseStep: 9
      - stepNumber: 8
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 9
        description: >-
          Read the bound project's hosted family: its family root and every member record, with
          their roots
        type: call
        targetComponent: project_repository
        targetMethod: family
      - stepNumber: 10
        description: >-
          Resolve the request's REACH into that family per record, each through its own chain (its
          own scope, its parents', the family root's units): which family projects the principal may
          read and which it may write
        type: call
        targetComponent: authorization
        targetMethod: reach
      - stepNumber: 11
        description: >-
          Bind the request-scoped project root together with the request's reach: the family root's
          root and the readable and writable family roots. The reach never changes any project's own
          verdict — validation's owner gate reads only the bound project's own files and pins (stage
          4) — it bounds what a family run may compose, what a reach-gated read (externals status,
          pinning) may open, and which members a family migration may write: a migration that would
          have to write a project outside the writable set refuses family-partial, naming it. The
          caller must gate on reach itself.
        type: local
      - stepNumber: 12
        label: recover-migrations
        description: >-
          Family upkeep before the tool: roll back any family migration a crash left unfinished
          under the bound family's roots, and audit each rollback — owned by member registration,
          which also reconciles after the tool. Housekeeping that runs whatever the credential's
          permission; a failure is logged and never fails the request
        type: call
        targetComponent: member_registration
        targetMethod: recover
      - stepNumber: 13
        label: dispatch
        description: >-
          Offer the call to the project-lifecycle, landscape and project-ops dispatch, which serves
          it from the matching orchestrator instead of the scoped MCP server
        type: call
        targetComponent: host_request_orchestrator
        targetMethod: dispatchProjectLifecycleTool
      - stepNumber: 14
        description: >-
          A tool the dispatch serves answers with a response envelope: continue to the shared
          audit-event step, skipping the ordinary permission gate and scoped MCP server dispatch. A
          tool it does not serve answers with nothing and falls through to both.
        type: branch
        condition: the dispatch answered with a response envelope
        onTrueStep: 34
        onFalseStep: 15
      - stepNumber: 15
        description: >-
          Classify the called tool: a read when its name starts with sdd_get_ or sdd_validate_
          (sdd_get_externals_status among them), or when it is one of the explicitly listed read
          tools — the topology reads listAgents, getAgent, listDomains, validateTopology and
          getProjectConfig — requiring project:read; ANY other tool — the explicit write prefixes
          (sdd_add_/sdd_update_/sdd_delete_/sdd_write_/sdd_define_/sdd_set_/sdd_initialize_/sdd_externalize_/sdd_internalize_/sdd_move_/sdd_rename_/sdd_pin_/sdd_attach_/sdd_detach_/sdd_adopt_),
          AND any unrecognized or newly added name — is treated as a write requiring project:write
          (fail closed: an unknown tool never falls through to read-level gating, and a tool added
          later is a write by its prefix rather than by a hand-kept list — sdd_add_member,
          sdd_move_member, sdd_internalize_member and the stage-6 family-migration tools among them,
          a dryRun call included, since the tool's class is its name's and never its arguments').
          Every explicit read and every explicit write prefix declares scope tree, so
          sdd_pin_externals, sdd_get_externals_status and the family-migration tools act on the
          bound (possibly narrowed) tree
        type: local
      - stepNumber: 16
        description: >-
          Resolve the caller's required capability (project:read or project:write) over the bound
          project through the authorization component
        type: call
        targetComponent: authorization
        targetMethod: authorize
      - stepNumber: 17
        description: >-
          If the effective value is not yes, reject with a clear MCP error that the required
          data-plane permission is missing for the bound project
        type: branch
        condition: the effective value is not yes
        onTrueStep: 18
        onFalseStep: 19
      - stepNumber: 18
        description: >-
          Reject with a clear MCP error that the required data-plane permission is missing for the
          bound project
        type: throw
        error: >-
          Forbidden — the caller lacks the required data-plane permission (project:read or
          project:write) for this project
      - stepNumber: 19
        description: >-
          Is the call membership-changing — sdd_attach_member, sdd_adopt_member, sdd_detach_member,
          sdd_rename_project, or stage 8's sdd_promote_member and sdd_demote_member (and
          sdd_add_member with a source), dry run or applied? On hosted, membership decides reach (a
          member inherits its parent's access; a part is reached through its parent's record), and a
          detach or an adopt must move storage between isolated roots, so these are handled first
        type: branch
        condition: >-
          the called tool is sdd_attach_member, sdd_adopt_member, sdd_detach_member,
          sdd_rename_project, sdd_promote_member, sdd_demote_member, or sdd_add_member with a source
        onFalseStep: 30
      - stepNumber: 20
        description: Is it a detach?
        type: branch
        condition: the called tool is sdd_detach_member
        onFalseStep: 23
      - stepNumber: 21
        description: >-
          Serve the hosted detach whole through member registration — it relocates the member into
          an isolated root of its own in one transaction with the family edits and host stores, and
          answers the plan (dry run) or the applied detachment with the principals who lose access,
          as the tool result; the scoped server never runs it on hosted
        type: call
        targetComponent: member_registration
        targetMethod: detach
      - stepNumber: 22
        description: Continue to the shared audit step
        type: jump
        toStep: 34
      - stepNumber: 23
        description: Is it an adopt?
        type: branch
        condition: the called tool is sdd_adopt_member
        onFalseStep: 26
      - stepNumber: 24
        description: >-
          Serve the hosted adopt whole through member registration — detach's inverse: it relocates
          the source.hosted project back into the bound project's tree at the member path in one
          transaction, converts its record into a member, removes its own placements, and answers
          the plan (dry run) or the applied adoption with every reach change, as the tool result
        type: call
        targetComponent: member_registration
        targetMethod: adopt
      - stepNumber: 25
        description: Continue to the shared audit step
        type: jump
        toStep: 34
      - stepNumber: 26
        label: screen
        description: >-
          Screen it: for attach and promote, list every principal who gains access through the new
          parent; for demote, every principal a member-own setting denied who now reaches the part
          through the parent's record and every token narrowed to the member alone that loses its
          reach; for a project rename, decide whether the hosted model refuses it (a family root's
          rename); a member declared with a source.path or source.git is refused on hosted (isolated
          roots reach each other only by source.hosted)
        type: call
        targetComponent: member_registration
        targetMethod: screen
      - stepNumber: 27
        description: Does the hosted model refuse it?
        type: branch
        condition: the screen carries a refusal
        onFalseStep: 30
      - stepNumber: 28
        description: >-
          Answer an isError tool result (HTTP still 200) with the refusal — "renaming a hosted
          family root's id is not supported; a member can be renamed, or the root recreated";
          nothing is dispatched
        type: local
      - stepNumber: 29
        description: Continue to the shared audit step
        type: jump
        toStep: 34
      - stepNumber: 30
        label: serve
        description: Instantiate the scoped sdd_* MCP server
        type: call
        targetComponent: host_mcp_adapter
        targetMethod: createScopedServer
      - stepNumber: 31
        description: >-
          Connect the scoped server to the request transport and process the JSON-RPC message; a
          screened DRY-RUN result carries the screen's reach changes beside the plan (who gains or
          loses access), so a human approves the membership change with its access consequences in
          view
        type: local
      - stepNumber: 32
        description: >-
          Did an APPLIED family-shape tool succeed — sdd_add_member, sdd_move_member, or a stage-6
          family migration the scoped server ran (attach, adopt, rename project, rename alias,
          internalize, externalize; a hosted detach is served by member registration above) called
          without dryRun? Those change which projects the family holds or where, so the hosted
          records must follow
        type: branch
        condition: the call was an applied family-shape tool and its outcome is success
        onFalseStep: 34
      - stepNumber: 33
        description: >-
          Reconcile the family's member records with the family on disk — register new members
          (placed like their family root, no grants), relocate moved ones, disable departed ones —
          audit every touched project naming it with the bound project as composition, and publish
          one commit covering every touched project's .wai/ when the family is git-backed (touched =
          the owners the tool's report names as written). A reconciliation failure is logged and
          audited, never turns the tool's success into a failure
        type: call
        targetComponent: member_registration
        targetMethod: reconcile
      - stepNumber: 34
        label: audit
        description: Audit the handled data-plane tool call on the shared best-effort path
        type: call
        targetComponent: host_request_orchestrator
        targetMethod: auditToolCall
      - stepNumber: 35
        description: Return the MCP response
        type: return
        outcome: MCP response
    symbol: handleMcpRequest
lint:
  allow:
    - code: EXCESSIVE_NARRATIVE_STEPS
      reason: >-
        dispatchProjectLifecycleTool lists 38 steps because it IS the hosted data plane's tool
        table: one guard, one switch, and sixteen arms of two steps each — a call to the
        orchestrator that owns the tool, then the jump back to the one envelope-shaping step. Its
        cognitive score is 18 and every arm is flat. The count is the length of a closed list of
        tool names, not the size of a job: splitting it by owning orchestrator would invent three
        sub-dispatchers where src/server/request.ts has one switch, and would have to invent a
        default arm for each of them — today the single default IS sdd_host_get_approval_status, so
        two of the three new defaults would be unreachable code deciding what an impossible tool
        name does. Same shape and same reasoning as cli_runner.runPack and
        rule_registry.registerBuiltinRules.
status: complete
