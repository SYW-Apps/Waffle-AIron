id: host_request_orchestrator_impl
name: Host Request Orchestrator Implementation
description: >-
  Per-request data-plane workflow: authenticate, resolve and bind the authorized project scope, then
  dispatch the sdd_* call — routing the execute-primary self-service tools
  (sdd_host_initialize_project, sdd_host_lock_project, sdd_host_promote_project,
  sdd_host_get_approval_status, sdd_host_await_approval) to the self-service orchestrator, the
  hosted landscape discovery tools to the surface exchange orchestrator (currentProjectId = the
  bound project), and every other tool to the scoped MCP server after enforcing the granular
  data-plane permission (mcp:read for reads, mcp:write for writes) from the principal's grant for
  the bound project.
contract: ihost_request_orchestrator
sourcePath: src/server/request.ts
methods:
  - name: viewDiagram
    narrative:
      - stepNumber: 1
        description: Extract the signed view token from the request query
        type: local
      - stepNumber: 2
        description: Verify the token (signature + expiry); rejects if invalid
        type: call
        targetComponent: auth_specialist
        targetMethod: verifyViewToken
      - stepNumber: 3
        description: Resolve the granted project's isolated root and bind it
        type: local
      - stepNumber: 4
        description: Render the canvas in scope
        type: call
        targetComponent: host_core_adapter
        targetMethod: renderDiagram
      - stepNumber: 5
        description: Wrap the canvas HTML in a text/html response
        type: local
      - stepNumber: 6
        description: Return the canvas HTML response
        type: return
        outcome: canvas html response
    symbol: handleViewDiagram
  - name: handleRequest
    narrative:
      - stepNumber: 1
        description: Extract the bearer token from the request Authorization header
        type: local
      - stepNumber: 2
        description: >-
          Authenticate the token to a principal (resolving its subject, projects narrowing, and
          permissionSubject)
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticate
      - stepNumber: 3
        description: If the principal is unauthenticated, reject
        type: branch
        condition: principal is unauthenticated
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Return 401 Unauthorized
        type: return
        outcome: 401 Unauthorized
      - stepNumber: 5
        description: Read the optional project selector from the request
        type: local
      - stepNumber: 6
        description: >-
          Resolve the authorized project's isolated root (honoring the selector only within the
          token's projects narrowing)
        type: call
        targetComponent: project_registry
        targetMethod: resolveRoot
      - stepNumber: 7
        description: If no authorized root resolved, reject cross-project access
        type: branch
        condition: resolved root is empty (project not authorized)
        onTrueStep: 8
        onFalseStep: 9
      - stepNumber: 8
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 9
        description: Bind the request-scoped project root
        type: local
      - stepNumber: 10
        description: >-
          If the called tool is an execute-primary self-service tool or a hosted landscape tool,
          dispatch it to the matching orchestrator instead of the scoped MCP server
        type: branch
        condition: the called tool is one of the sdd_host_* self-service tools or the hosted landscape tools
        onTrueStep: 11
        onFalseStep: 32
      - stepNumber: 11
        description: Dispatch by tool name to the matching orchestrator method
        type: switch
        'on': the called tool name
        cases:
          - value: sdd_host_initialize_project
            step: 12
          - value: sdd_host_lock_project
            step: 14
          - value: sdd_host_promote_project
            step: 16
          - value: sdd_host_get_approval_status
            step: 18
          - value: sdd_host_await_approval
            step: 20
          - value: sdd_landscape_list_reachable_projects
            step: 22
          - value: sdd_landscape_list_reachable_project_interfaces
            step: 24
          - value: sdd_landscape_list_visible_surfaces
            step: 26
          - value: sdd_landscape_get_project_surface
            step: 28
        defaultStep: 12
      - stepNumber: 12
        description: >-
          Execute-or-request project initialization, passing the credential and decoded tool
          arguments; returns a SelfServiceOutcome
        type: call
        targetComponent: self_service_orchestrator
        targetMethod: requestProjectInitialization
      - stepNumber: 13
        description: Continue to shape the response
        type: jump
        toStep: 30
      - stepNumber: 14
        description: Execute-or-request a project lock, passing the credential and project id
        type: call
        targetComponent: self_service_orchestrator
        targetMethod: requestProjectLock
      - stepNumber: 15
        description: Continue to shape the response
        type: jump
        toStep: 30
      - stepNumber: 16
        description: Execute-or-request a project promotion, passing the credential and project id
        type: call
        targetComponent: self_service_orchestrator
        targetMethod: requestProjectPromotion
      - stepNumber: 17
        description: Continue to shape the response
        type: jump
        toStep: 30
      - stepNumber: 18
        description: Get the approval-request status, passing the credential and request id
        type: call
        targetComponent: self_service_orchestrator
        targetMethod: getRequestStatus
      - stepNumber: 19
        description: Continue to shape the response
        type: jump
        toStep: 30
      - stepNumber: 20
        description: >-
          Long-poll for a decision on the caller's approval request, passing the credential, request
          id, and timeout
        type: call
        targetComponent: self_service_orchestrator
        targetMethod: awaitApproval
      - stepNumber: 21
        description: Continue to shape the response
        type: jump
        toStep: 30
      - stepNumber: 22
        description: Dispatch the reachable-projects discovery with currentProjectId = the bound project
        type: call
        targetComponent: surface_exchange_orchestrator
        targetMethod: listReachableProjectsForMcp
      - stepNumber: 23
        description: Continue to shape the response
        type: jump
        toStep: 30
      - stepNumber: 24
        description: >-
          Dispatch the reachable-target interface discovery (currentProjectId = bound project,
          target from arguments)
        type: call
        targetComponent: surface_exchange_orchestrator
        targetMethod: listReachableProjectInterfacesForMcp
      - stepNumber: 25
        description: Continue to shape the response (reachable-interfaces path)
        type: jump
        toStep: 30
      - stepNumber: 26
        description: >-
          Dispatch the visibility-resolved discovery catalog (currentProjectId = the BOUND project;
          never from arguments)
        type: call
        targetComponent: surface_exchange_orchestrator
        targetMethod: listVisibleSurfaces
      - stepNumber: 27
        description: Continue to shape the response
        type: jump
        toStep: 30
      - stepNumber: 28
        description: >-
          Dispatch the contract-grade surface fetch (currentProjectId = the BOUND project;
          targetProjectId from arguments)
        type: call
        targetComponent: surface_exchange_orchestrator
        targetMethod: getProjectSurfaceForMcp
      - stepNumber: 29
        description: Continue to shape the response
        type: jump
        toStep: 30
      - stepNumber: 30
        description: Shape the self-service or landscape result into the JSON-RPC tool response envelope
        type: local
      - stepNumber: 31
        description: >-
          Continue to the shared audit-event build step, skipping the ordinary permission gate and
          scoped MCP server dispatch
        type: jump
        toStep: 38
      - stepNumber: 32
        description: >-
          Classify the called sdd_* tool as a write
          (sdd_add_/sdd_update_/sdd_delete_/sdd_write_/sdd_define_/sdd_set_/sdd_initialize_/sdd_externalize_/sdd_internalize_/sdd_move_)
          or a read (sdd_get_/sdd_validate_); the required capability is project:write for a write
          tool and project:read for a read tool
        type: local
      - stepNumber: 33
        description: >-
          Resolve the caller's required capability (project:read or project:write) over the bound
          project through the authorization specialist
        type: call
        targetComponent: authorization_specialist
        targetMethod: authorize
      - stepNumber: 34
        description: >-
          If the effective value is not yes, reject with a clear MCP error that the required
          data-plane permission is missing for the bound project
        type: branch
        condition: the effective value is not yes
        onTrueStep: 35
        onFalseStep: 36
      - stepNumber: 35
        description: >-
          Reject with a clear MCP error that the required data-plane permission is missing for the
          bound project
        type: throw
        error: >-
          Forbidden — the caller lacks the required data-plane permission (project:read or
          project:write) for this project
      - stepNumber: 36
        description: Instantiate the scoped sdd_* MCP server
        type: call
        targetComponent: host_mcp_adapter
        targetMethod: createScopedServer
      - stepNumber: 37
        description: Connect the scoped server to the request transport and process the JSON-RPC message
        type: local
      - stepNumber: 38
        description: >-
          Build the redacted AuditEvent (action mcp.tool.call, actor and tokenId from the principal,
          project id, tool name as target, outcome)
        type: local
      - stepNumber: 39
        description: Append the audit event without letting a failure fail the request
        type: try
        endStep: 41
        catches:
          - error: audit append failure
            step: 42
      - stepNumber: 40
        description: Append the redacted mcp.tool.call audit event under the active retention policy
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 41
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 43
      - stepNumber: 42
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 43
        description: Return the MCP response
        type: return
        outcome: MCP response
    symbol: handleMcpRequest
status: complete
