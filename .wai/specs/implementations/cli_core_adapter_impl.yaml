id: cli_core_adapter_impl
name: CLI Core Adapter Implementation
description: Concrete implementation forwarding spec loading requests to the core portal.
contract: icli_core_adapter
sourcePath: src/commands/subsystem.ts
methods:
  - name: loadSystemSpec
    narrative:
      - stepNumber: 1
        description: Call loadSystemSpec on the core portal
        type: call
        targetComponent: core_portal
        targetMethod: loadSystemSpec
  - name: createChainedSubsystem
    narrative:
      - stepNumber: 1
        description: Forward chained-subsystem creation to the core portal
        type: call
        targetComponent: core_portal
        targetMethod: createChainedSubsystem
  - name: moveSubsystemProject
    narrative:
      - stepNumber: 1
        description: Forward subproject relocation to the core portal
        type: call
        targetComponent: core_portal
        targetMethod: moveSubsystemProject
  - name: externalizeSubsystem
    narrative:
      - stepNumber: 1
        description: Forward subsystem externalization to the core portal
        type: call
        targetComponent: core_portal
        targetMethod: externalizeSubsystem
  - name: internalizeSubsystem
    narrative:
      - stepNumber: 1
        description: Forward subsystem internalization to the core portal
        type: call
        targetComponent: core_portal
        targetMethod: internalizeSubsystem
  - name: composeAgentBrief
    narrative:
      - stepNumber: 1
        description: Forward the brief composition to the core portal
        type: call
        targetComponent: core_portal
        targetMethod: composeAgentBrief
  - name: exportSpecTree
    narrative:
      - stepNumber: 1
        description: Forward the spec-tree export to the core portal.
        type: call
        targetComponent: core_portal
        targetMethod: exportSpecTree
  - name: importSpecTree
    narrative:
      - stepNumber: 1
        description: >-
          Forward the spec-tree import to the core portal, passing the caller's policy through
          unchanged — notably WITHOUT the executable-entry guard, which is the over-the-wire tier's
          rule, not the trusted filesystem's.
        type: call
        targetComponent: core_portal
        targetMethod: importSpecTree
  - name: loadProjectConfig
    narrative:
      - stepNumber: 1
        description: Forward to the core portal
        type: call
        targetComponent: core_portal
        targetMethod: loadProjectConfig
  - name: createProjectConfig
    narrative:
      - stepNumber: 1
        description: Forward to the core portal
        type: call
        targetComponent: core_portal
        targetMethod: createProjectConfig
  - name: setExecutionTier
    narrative:
      - stepNumber: 1
        description: Forward to the core portal
        type: call
        targetComponent: core_portal
        targetMethod: setExecutionTier
  - name: projectConfigExists
    narrative:
      - stepNumber: 1
        description: Forward to the core portal
        type: call
        targetComponent: core_portal
        targetMethod: projectConfigExists
  - name: resolveAgentTopology
    narrative:
      - stepNumber: 1
        description: Forward to the core portal
        type: call
        targetComponent: core_portal
        targetMethod: resolveAgentTopology
  - name: ensureProjectInitialized
    narrative:
      - stepNumber: 1
        description: Forward to the core portal
        type: call
        targetComponent: core_portal
        targetMethod: ensureProjectInitialized
  - name: listDirectChainedSubprojects
    narrative:
      - stepNumber: 1
        description: Forward to the core portal
        type: call
        targetComponent: core_portal
        targetMethod: listDirectChainedSubprojects
  - name: defaultPackSelections
    narrative:
      - stepNumber: 1
        description: Forward to the core portal
        type: call
        targetComponent: core_portal
        targetMethod: defaultPackSelections
  - name: readLockState
    narrative:
      - stepNumber: 1
        description: Forward the lock-state read, with the caller's gate identity, to the core portal
        type: call
        targetComponent: core_portal
        targetMethod: readLockState
  - name: retireSpecialists
    narrative:
      - stepNumber: 1
        description: Forward the Specialist retirement, planned or applied, to the core portal
        type: call
        targetComponent: core_portal
        targetMethod: retireSpecialists
status: complete
