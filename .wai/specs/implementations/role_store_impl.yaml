id: role_store_impl
name: Role Store Implementation
description: >-
  Authoritative in-memory role collection loaded from and swapped as roles.json under the hosted
  data root.
contract: irole_store
sourcePath: src/server/roles.ts
methods:
  - name: load
    narrative: []
    intent: >-
      Read the persisted role collection from roles.json under the hosted data root — an absent or
      empty file yields an empty collection — and hold it as the authoritative in-memory
      representation.
  - name: replaceAll
    narrative: []
    intent: >-
      Swap the in-memory role collection to the supplied complete set; the registry has already
      persisted it durably.
detail: intent
status: complete
