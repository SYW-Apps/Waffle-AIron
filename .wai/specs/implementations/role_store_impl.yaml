id: role_store_impl
name: Role Store Implementation
description: >-
  Read-through file I/O over the role collection at roles.json under the hosted data root: load
  parses the file fresh; update holds the file's write lock across a fresh read and the replacement.
contract: irole_store
sourcePath: src/server/roles.ts
injectedParams:
  - dataDir
methods:
  - name: load
    narrative: []
    intent: >-
      Read the persisted role collection fresh from roles.json under the hosted data root (no
      in-memory copy) - an absent or empty file yields an empty collection.
  - name: update
    narrative: []
    intent: >-
      Under roles.json's write lock (file_write_lock.run), read the collection fresh - absent is
      empty, a file that exists but cannot be read or parsed throws and nothing is written - apply
      the change, replace the file atomically via write-temp-then-rename and release the lock, also
      when the change throws. Answers the collection written.
    calls:
      - file_write_lock.run
detail: intent
status: complete
createdAt: '2026-07-15T20:28:35.375Z'
updatedAt: '2026-10-23T22:24:00.671Z'
