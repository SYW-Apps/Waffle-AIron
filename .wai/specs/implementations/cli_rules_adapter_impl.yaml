id: cli_rules_adapter_impl
name: CLI Rules Adapter Implementation
description: >-
  The `wairon rules list` command in src/commands/rules.ts. Reads the active rule set via the
  validator portal.
contract: icli_rules_adapter
sourcePath: src/commands/rules.ts
methods:
  - name: listRules
    narrative:
      - stepNumber: 1
        description: >-
          Is this inside an initialized wairon project? Outside one, no configuration is read and
          only the default severities show.
        type: call
        targetComponent: core_portal
        targetMethod: projectConfigExists
      - stepNumber: 2
        description: >-
          Inside a project, read its configuration through the core portal for the rule severity
          overrides (rules.sddRuleSeverity); a configuration that cannot be read shows the defaults
          only.
        type: call
        targetComponent: core_portal
        targetMethod: loadProjectConfig
      - stepNumber: 3
        description: Fetch the active conformance rule set via the validator portal.
        type: call
        targetComponent: validator_portal
        targetMethod: listRules
      - stepNumber: 4
        description: Print each rule's name, description, emitted codes, and source pack.
        type: local
detail: calls-only
status: complete
createdAt: '2026-07-14T20:10:06.420Z'
updatedAt: '2026-09-13T12:28:30.656Z'
