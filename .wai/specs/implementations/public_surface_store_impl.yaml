id: public_surface_store_impl
name: Public Surface Store Implementation
description: >-
  Read-through file I/O over the redacted public-surface snapshot set (one per project) at
  public-surfaces.json under the server data root: load parses the file fresh; update holds the
  file's write lock across a fresh read and the replacement.
contract: ipublic_surface_store
sourcePath: src/server/surfaces.ts
methods:
  - name: load
    narrative: []
    intent: >-
      Read public-surfaces.json fresh (no in-memory copy), returning the set keyed by project id. A
      missing file yields an empty set; an unreadable file or structurally invalid JSON fails with a
      storage error naming the path.
  - name: update
    narrative: []
    intent: >-
      Under public-surfaces.json's write lock (file_write_lock.run), read the set fresh - absent is
      empty, a file that exists but cannot be read or parsed throws and nothing is written - apply
      the change, replace the file atomically via write-temp-then-rename and release the lock, also
      when the change throws. Answers the set written.
    calls:
      - file_write_lock.run
      - files_adapter.ensureDir
detail: intent
status: complete
