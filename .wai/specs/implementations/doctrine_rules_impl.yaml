id: doctrine_rules_impl
name: Doctrine Rules Implementation
description: >-
  The doctrine rule family in src/core/rules/doctrine/, one file per rule whose exported rule
  object's check realizes the contract method named after that rule. The stereotype vocabulary the
  five dependency rules report with — which Orchestrators are pure or read logic, how a finding
  names a component's stereotype, and the resolution a refused Store link is given — lives beside
  them in stereotype-terms.ts, so a split family keeps saying the same words.
contract: idoctrine_rules
simPath: tests/core/validation.test.ts
methods:
  - name: facadeForwarding
    sourcePath: src/core/rules/doctrine/facade-forwarding.ts
    narrative:
      - stepNumber: 1
        label: impl
        description: For each implementation in ctx.implementations
        type: loop
        loopKind: forEach
        over: ctx.implementations
        endStep: 7
      - stepNumber: 2
        description: >-
          Does the implementation realize a Repository facade? The Repository is the backend pattern
          whose facade semantics the architecture standard defines
        type: branch
        condition: >-
          ctx.interfaceMap resolves impl.contract, ctx.componentMap resolves its component comp, and
          comp is a Repository
        onFalseStep: 1
      - stepNumber: 3
        description: owned = comp.owns as a set; isDraftCtx = ctx.isImplementationDraft(impl)
        type: local
      - stepNumber: 4
        label: method
        description: For each method of the facade implementation
        type: loop
        loopKind: forEach
        over: impl.methods
        endStep: 7
      - stepNumber: 5
        description: >-
          Classify the method's narrative steps: an empty narrative is not judged (how much is
          narrated is the detail dial's business); otherwise problem = 'has N steps (their types)'
          when there is not exactly one step, else 'is a single <type> step, not a call' when that
          step is not a call, else 'forwards outside the pattern' naming the target when the call's
          targetComponent is set and not in owned; a single call to an owned member has no problem
        type: local
      - stepNumber: 6
        description: Is the facade method anything but pure 1:1 forwarding?
        type: branch
        condition: the narrative is non-empty and has a problem
        onFalseStep: 4
      - stepNumber: 7
        label: facadeReport
        description: >-
          Report FACADE_FORWARDING (warning, on impl.id; draft context isDraftCtx) naming the
          method, comp's componentType and id, the implementation, the owned members (comp.owns
          joined, or none declared) and the problem: move the logic into a member block, or
          lint.allow a deliberate exception
        type: local
    symbol: check
    exportedVia: facadeForwardingRule
  - name: subsystemBoundaryDependencies
    sourcePath: src/core/rules/doctrine/subsystem-boundary-dependencies.ts
    narrative:
      - stepNumber: 1
        label: edge
        description: >-
          For each dependency edge of ctx.dependencyEdges().all — every dependsOn id in the tree,
          resolved once: what declares it, what it reached, where that lands, whether either end is
          retired, and the draft context a finding on it takes
        type: loop
        loopKind: forEach
        over: ctx.dependencyEdges().all
        endStep: 20
      - stepNumber: 2
        label: liveEdge
        description: >-
          Are both ends of the edge live stereotypes? An edge with a retired end (a Specialist or
          Gateway) is judged by no boundary rule, because retired-stereotypes reports the retired
          component once: continue with the next edge. A reference that resolved nothing is never
          marked retired, so it is still judged below
        type: branch
        condition: not edge.retired
        onFalseStep: 1
      - stepNumber: 3
        label: reach
        description: >-
          Where does the edge land? An edge that resolved inside its own subsystem is the stereotype
          matrix's business, not this rule's: continue with the next edge
        type: switch
        'on': edge.reach
        cases:
          - value: missing
            step: 4
          - value: unpinned
            step: 6
          - value: ambiguous
            step: 8
          - value: surface
            step: 10
          - value: cross-subsystem
            step: 13
        defaultStep: 1
      - stepNumber: 4
        label: invalidReference
        description: >-
          Report INVALID_DEPENDENCY_REFERENCE (error, on edge.from.id; draft context
          edge.draftContext) naming the component and the dependency id that does not exist
        type: local
      - stepNumber: 5
        description: Continue with the next edge
        type: jump
        toStep: 1
      - stepNumber: 6
        label: unpinnedCrossTree
        description: >-
          Report CROSS_TREE_REF_UNRESOLVED (warning, on edge.from.id; draft context
          edge.draftContext) naming the component and edge.ref: validate from the parent project,
          pin the family surfaces (wairon surface pin), or import the producing project's surface
        type: local
      - stepNumber: 7
        description: Continue with the next edge
        type: jump
        toStep: 1
      - stepNumber: 8
        label: ambiguousSurface
        description: >-
          Report SURFACE_REF_AMBIGUOUS (error, on edge.from.id; draft context edge.draftContext)
          with the message edge.surface.ambiguityMessage('Component "<edge.from.id>" depends on',
          edge.ref): snapshots of several providers expose the name with different contracts, so
          none of them can judge the edge
        type: local
      - stepNumber: 9
        description: Continue with the next edge
        type: jump
        toStep: 1
      - stepNumber: 10
        label: surfaceCrosser
        description: >-
          A snapshot declares the remote surface: is the depending component something other than an
          Adapter?
        type: branch
        condition: edge.from.componentType is not Adapter
        onFalseStep: 1
      - stepNumber: 11
        description: >-
          Report CROSS_SUBSYSTEM_NON_ADAPTER (error, on edge.from.id; draft context
          edge.draftContext; surfaceResolved true, so it keeps full strength in a chained
          subproject) naming the component, its componentType, edge.ref and the snapshot's
          projectName: only a local client Adapter may cross a project boundary
        type: local
      - stepNumber: 12
        description: Continue with the next edge
        type: jump
        toStep: 1
      - stepNumber: 13
        label: crossSubsystemCrosser
        description: >-
          The edge crosses into a peer subsystem, where only the boundary rules judge it: does a
          non-Adapter cross without a trustedLink license from its own subsystem?
        type: branch
        condition: >-
          edge.from.componentType is not Adapter and the edge is not licensed: the subsystem in
          ctx.subsystems whose id is edge.from.subsystem declares no trustedLink whose subsystem is
          edge.to.subsystem
        onFalseStep: 15
      - stepNumber: 14
        description: >-
          Report CROSS_SUBSYSTEM_NON_ADAPTER (error, on edge.from.id; draft context
          edge.draftContext) naming both components and their subsystems: route the hop through a
          client Adapter that calls the peer's public interface, or declare a trustedLink on
          edge.from.subsystem with the reason
        type: local
      - stepNumber: 15
        label: publicTarget
        description: Is the target outside the peer subsystem's published public surface?
        type: branch
        condition: ctx.publicSet for edge.to.subsystem does not contain edge.to.id
        onFalseStep: 17
      - stepNumber: 16
        description: >-
          Report CROSS_SUBSYSTEM_PRIVATE_ACCESS (error, on edge.from.id; draft context
          edge.draftContext) naming the component, the target and its subsystem: depend on one of
          its publicInterfaces components instead
        type: local
      - stepNumber: 17
        label: portalTarget
        description: >-
          Is the target published, but entered through something other than the peer's inbound
          Portal? Across subsystems only a Portal is a front door
        type: branch
        condition: >-
          ctx.publicSet for edge.to.subsystem contains edge.to.id and edge.to.componentType is not
          Portal
        onFalseStep: 19
      - stepNumber: 18
        label: targetNonPortal
        description: >-
          Report CROSS_SUBSYSTEM_TARGET_NON_PORTAL (error, on edge.from.id; draft context
          edge.draftContext) naming the component as what it is (client Adapter when it is an
          Adapter, otherwise its componentType, whether a trustedLink licenses the edge or not), the
          target subsystem and the target with its componentType: a cross-subsystem hop must target
          the remote subsystem's Portal, which dispatches inward, and a published non-Portal of any
          stereotype leaks the boundary, so expose a Portal and point the component at it
        type: local
      - stepNumber: 19
        label: consumerCheck
        description: >-
          Is the target published to a named set of consumers that leaves this subsystem out? A
          component is restricted when EVERY publicInterfaces entry of edge.to.subsystem that
          publishes it declares consumers, and the union of those lists is who may depend on it; one
          entry without the field publishes it to anyone. A restricted surface exists so that a door
          that must not reach it cannot — the raw spec writes, which only the gated authoring seam
          may call
        type: branch
        condition: >-
          every publicInterfaces entry of the subsystem in ctx.subsystems whose id is
          edge.to.subsystem that names edge.to.id declares consumers, and none of those lists
          contains edge.from.subsystem
        onFalseStep: 1
      - stepNumber: 20
        label: unlistedConsumer
        description: >-
          Report CROSS_SUBSYSTEM_UNLISTED_CONSUMER (error, on edge.from.id; draft context
          edge.draftContext) naming the component, its subsystem, the target and the subsystems the
          target is published to: depend on a surface published to this subsystem instead, or — when
          this subsystem really is a caller the provider meant to serve — add it to the entry's
          consumers
        type: local
    symbol: check
    exportedVia: subsystemBoundaryDepsRule
  - name: logicDependencyClass
    sourcePath: src/core/rules/doctrine/logic-dependency-class.ts
    narrative:
      - stepNumber: 1
        label: edge
        description: >-
          For each edge of ctx.dependencyEdges().matrix — the edges the intra-subsystem stereotype
          matrix judges: resolved inside one subsystem, both ends live, and not licensed by the
          governing pack profile's allowedEdges. The dependency-edge index applied all three once,
          for every matrix rule
        type: loop
        loopKind: forEach
        over: ctx.dependencyEdges().matrix
        endStep: 7
      - stepNumber: 2
        label: entrypointTarget
        description: >-
          Does the edge target a Portal or an Observer? That is entrypoint-dependencies' one finding
          on the edge (ARCHITECTURE_VIOLATION_PORTAL_DEP), and no consumer-side matrix check reports
          the same edge again: continue with the next edge
        type: branch
        condition: edge.to.componentType is neither Portal nor Observer
        onFalseStep: 1
      - stepNumber: 3
        label: classTerms
        description: >-
          depPure = edge.to is pure logic, an Orchestrator whose dependencyClass is pure; storeHint
          = storeResolutionHint(edge.from.componentType, edge.to.id) when edge.to is a Store, else
          empty — the family's shared helper, ending in its NEVER_INLINE_STATE sentence: a logic
          consumer is told to wrap the Store in a Repository and depend on that facade, any other
          consumer to reach it through an Orchestrator on that facade, and both never to merge the
          state into the consumer
        type: local
      - stepNumber: 4
        label: pureClass
        description: Does pure logic depend on anything but pure logic?
        type: branch
        condition: edge.from is an Orchestrator whose dependencyClass is pure, and not depPure
        onFalseStep: 6
      - stepNumber: 5
        description: >-
          Report DEPENDENCY_CLASS_VIOLATION (error, on edge.from.id; draft context
          edge.draftContext) naming edge.from as an Orchestrator of class pure and edge.to with its
          componentType and its dependencyClass when it has one: pure logic depends only on pure
          Orchestrators, so move that dependency to the workflow that calls it, or declare it read
          when it reads through read logic, a Repository, an Index or an Adapter. The message ends
          with storeHint
        type: local
      - stepNumber: 6
        label: readClass
        description: >-
          Does read logic depend on anything but pure or read logic, a Repository, an Index or an
          Adapter? Only the dependency's stereotype and class are judged here: whether read logic
          calls a write method on a Repository, Index or Adapter is judged only once facade methods
          carry effect tags
        type: branch
        condition: >-
          edge.from is an Orchestrator whose dependencyClass is read, and edge.to is not depPure,
          not read logic, and not a Repository, an Index or an Adapter
        onFalseStep: 1
      - stepNumber: 7
        label: readViolation
        description: >-
          Report DEPENDENCY_CLASS_VIOLATION (error, on edge.from.id; draft context
          edge.draftContext) naming edge.from as an Orchestrator of class read and edge.to with its
          componentType and its dependencyClass when it has one: read logic depends only on pure or
          read Orchestrators, Repositories, Indexes and Adapters, so move that dependency to the
          workflow that calls it, or unset its dependencyClass when it is itself a workflow. The
          message ends with storeHint
        type: local
    symbol: check
    exportedVia: logicDependencyClassRule
  - name: dataBlockDependencies
    sourcePath: src/core/rules/doctrine/data-block-dependencies.ts
    narrative:
      - stepNumber: 1
        label: edge
        description: >-
          For each edge of ctx.dependencyEdges().matrix — the edges the intra-subsystem stereotype
          matrix judges: resolved inside one subsystem, both ends live, and not licensed by the
          governing pack profile's allowedEdges
        type: loop
        loopKind: forEach
        over: ctx.dependencyEdges().matrix
        endStep: 13
      - stepNumber: 2
        label: entrypointTarget
        description: >-
          Does the edge target a Portal or an Observer? That is entrypoint-dependencies' one finding
          on the edge (ARCHITECTURE_VIOLATION_PORTAL_DEP), and no consumer-side matrix check reports
          the same edge again: continue with the next edge
        type: branch
        condition: edge.to.componentType is neither Portal nor Observer
        onFalseStep: 1
      - stepNumber: 3
        label: dataTerms
        description: >-
          depPure = edge.to is pure logic, an Orchestrator whose dependencyClass is pure;
          ownStoreOnly = edge.to is neither a Store nor an Adapter and is not depPure — the one
          allowance the Store, Registry, Index and Query checks share, stated once because it is
          character-identical in all four
        type: local
      - stepNumber: 4
        label: storeDep
        description: Does a Store depend on anything but another Store, a backend Adapter or pure logic?
        type: branch
        condition: edge.from is a Store and ownStoreOnly
        onFalseStep: 6
      - stepNumber: 5
        description: >-
          Report ARCHITECTURE_VIOLATION_STORE_DEP (error, on edge.from.id; draft context
          edge.draftContext) naming both components: a Store may depend only on other Stores, a
          backend Adapter or pure logic, and Registries and Indexes depend on the Store, never the
          reverse
        type: local
      - stepNumber: 6
        label: registryDep
        description: Does a Registry depend on anything but its Store, a backend Adapter or pure logic?
        type: branch
        condition: edge.from is a Registry and ownStoreOnly
        onFalseStep: 8
      - stepNumber: 7
        description: >-
          Report ARCHITECTURE_VIOLATION_REGISTRY_DEP (warning, on edge.from.id; draft context
          edge.draftContext) naming both components: a Registry is the write path to its Store,
          validating through pure logic, and never updates Indexes or drives workflow
        type: local
      - stepNumber: 8
        label: adapterDep
        description: >-
          Does an Adapter, a sink toward the system, depend on a Store or on an Orchestrator that is
          not pure logic?
        type: branch
        condition: edge.from is an Adapter and edge.to is a Store, or an Orchestrator that is not depPure
        onFalseStep: 10
      - stepNumber: 9
        description: >-
          Report ARCHITECTURE_VIOLATION_ADAPTER_DEP (error, on edge.from.id; draft context
          edge.draftContext) naming both components: an Adapter may use pure logic, but never a
          Store or any other Orchestrator
        type: local
      - stepNumber: 10
        label: indexDep
        description: >-
          Does an Index, a read projection, depend on anything but its Store, a backend Adapter,
          pure logic — or, the exceptional derived-Index case, another Index owned by the same
          Repository that does not reach back to it through Index edges (no Index cycle)?
        type: branch
        condition: >-
          edge.from is an Index, ownStoreOnly, and the edge is not a derived-Index edge (edge.to is
          an Index owned by the same Repository as edge.from, and edge.to does not reach edge.from
          through Index-to-Index edges)
        onFalseStep: 12
      - stepNumber: 11
        description: >-
          Report ARCHITECTURE_VIOLATION_INDEX_DEP (error, on edge.from.id; draft context
          edge.draftContext) naming both components: an Index may depend only on its Store, a
          backend Adapter or pure logic — or, as an exceptional case, on another Index of the same
          Repository, never in a cycle; the message says which of the two guardrails an
          Index-to-Index edge broke
        type: local
      - stepNumber: 12
        label: queryDep
        description: >-
          Does a Query, a computed read over its Repository's Store, depend on anything but a Store,
          a backend Adapter or pure logic?
        type: branch
        condition: edge.from is a Query and ownStoreOnly
        onFalseStep: 1
      - stepNumber: 13
        label: queryViolation
        description: >-
          Report ARCHITECTURE_VIOLATION_QUERY_DEP (error, on edge.from.id; draft context
          edge.draftContext) naming edge.from as a Query and edge.to with its componentType and its
          dependencyClass when it has one: a Query computes reads over its Store, through a backend
          Adapter where one serves it, with pure logic, so move any other dependency to the workflow
          that calls the Repository facade
        type: local
    symbol: check
    exportedVia: dataBlockDepsRule
  - name: entrypointDependencies
    sourcePath: src/core/rules/doctrine/entrypoint-dependencies.ts
    narrative:
      - stepNumber: 1
        label: edge
        description: >-
          For each edge of ctx.dependencyEdges().matrix — the edges the intra-subsystem stereotype
          matrix judges: resolved inside one subsystem, both ends live, and not licensed by the
          governing pack profile's allowedEdges
        type: loop
        loopKind: forEach
        over: ctx.dependencyEdges().matrix
        endStep: 13
      - stepNumber: 2
        label: entrypointTerms
        description: >-
          storeHint = storeResolutionHint(edge.from.componentType, edge.to.id) when edge.to is a
          Store, else empty — the family's shared helper, ending in its NEVER_INLINE_STATE sentence:
          a logic consumer is told to wrap the Store in a Repository and depend on that facade, any
          other consumer to reach it through an Orchestrator on that facade, and both never to merge
          the state into the consumer
        type: local
      - stepNumber: 3
        label: portalDep
        description: Does the edge target a Portal or an Observer?
        type: branch
        condition: edge.to.componentType is Portal or Observer
        onFalseStep: 6
      - stepNumber: 4
        description: >-
          Report ARCHITECTURE_VIOLATION_PORTAL_DEP (error, on edge.from.id; draft context
          edge.draftContext) naming both components: Portals and Observers are top-level entry
          points and subscribers, never dependencies
        type: local
      - stepNumber: 5
        description: >-
          A Portal or Observer target is this edge's one finding: continue with the next edge, so
          neither the checks below nor the other matrix rules report the same edge
        type: jump
        toStep: 1
      - stepNumber: 6
        label: portalForbidden
        description: Does a Portal or Observer reach the data layer directly?
        type: branch
        condition: >-
          edge.from is a Portal and edge.to is a Store, Registry, Adapter or Query, or edge.from is
          an Observer and edge.to is a Store, Registry, Repository, Index or Query
        onFalseStep: 8
      - stepNumber: 7
        description: >-
          Report ARCHITECTURE_VIOLATION_PORTAL_FORBIDDEN_DEP (error, on edge.from.id; draft context
          edge.draftContext) naming both components and stereotypes: they coordinate through
          Orchestrators and Supervisors, and do not reach the data layer directly. The message ends
          with storeHint
        type: local
      - stepNumber: 8
        label: viewDep
        description: >-
          Does a View, a passive presenter, depend on a persistence or boundary block, or on logic
          that is not pure?
        type: branch
        condition: >-
          edge.from is a View and edge.to is a Store, Registry, Index, Query, Adapter or Repository,
          or an Orchestrator that is not pure logic
        onFalseStep: 10
      - stepNumber: 9
        description: >-
          Report ARCHITECTURE_VIOLATION_VIEW_DEP (error, on edge.from.id; draft context
          edge.draftContext) naming both components: Views stay passive UI blocks that use pure
          logic at most. The message ends with storeHint
        type: local
      - stepNumber: 10
        label: supervisorDep
        description: >-
          Does a Supervisor reach data or presentation directly instead of through workflows? It may
          depend on Actors, Orchestrators, Adapters and other Supervisors; a Portal or Observer
          target was reported above, once
        type: branch
        condition: >-
          edge.from is a Supervisor and edge.to is a Store, Registry, Repository, Index, Query,
          View, FeatureComponent or RouterComponent
        onFalseStep: 12
      - stepNumber: 11
        description: >-
          Report ARCHITECTURE_VIOLATION_SUPERVISOR_DEP (error, on edge.from.id; draft context
          edge.draftContext) naming edge.from as a Supervisor and edge.to with its componentType and
          its dependencyClass when it has one: a Supervisor reaches data only through workflows, so
          depend on the Orchestrator, Actor or Adapter that does that work instead. The message ends
          with storeHint
        type: local
      - stepNumber: 12
        label: actorCheck
        description: >-
          Is a live Actor reached by a component that does not supervise it and depends on no
          Supervisor that does? A Supervisor depending on the Actor supervises it
        type: branch
        condition: >-
          edge.to is an Actor, edge.from is not a Supervisor, and no id in edge.from.dependsOn
          resolves through ctx.componentMap to a Supervisor whose dependsOn includes edge.to.id
        onFalseStep: 1
      - stepNumber: 13
        label: actorReport
        description: >-
          Report ACTOR_REACHED_WITHOUT_SUPERVISOR (error, on edge.from.id; draft context
          edge.draftContext) naming edge.from with its componentType and its dependencyClass when it
          has one, the Actor edge.to, and the Supervisors in ctx.components whose dependsOn includes
          edge.to.id, or that none does: a live Actor is reached by id through a Supervisor that
          supervises it, so also depend on one of those Supervisors, or give the Actor a Supervisor
          that depends on it
        type: local
    symbol: check
    exportedVia: entrypointDepsRule
  - name: portalWriteShortcut
    sourcePath: src/core/rules/doctrine/portal-write-shortcut.ts
    narrative:
      - stepNumber: 1
        label: portalStep
        description: >-
          Portal narrative pass: for each narrative step of each method of each implementation in
          ctx.implementations
        type: loop
        loopKind: forEach
        over: each narrative step of each method of each implementation in ctx.implementations
        endStep: 4
      - stepNumber: 2
        label: portalImpl
        description: >-
          Does the implementation realize a Portal's contract? (component = that Portal; isDraftCtx
          = ctx.isImplementationDraft(impl))
        type: branch
        condition: >-
          ctx.interfaceMap resolves impl.contract, ctx.componentMap resolves its component, and that
          component is a Portal
        onFalseStep: 1
      - stepNumber: 3
        label: writeCall
        description: >-
          Does the step call a write-effect method on a Repository or Index directly? Methods
          without an effect tag are not judged
        type: branch
        condition: >-
          step.type is call with targetComponent and targetMethod set, ctx.componentMap resolves the
          target to a Repository or an Index, and the method named step.targetMethod among
          ctx.interfaceMethodsOf(target.id) declares effect write
        onFalseStep: 1
      - stepNumber: 4
        label: writeShortcut
        description: >-
          Report PORTAL_WRITE_SHORTCUT (error, on impl.id; draft context isDraftCtx ||
          ctx.isComponentDraft(target.id)) naming the Portal, the step number, the method, the
          called target.id and targetMethod, and the target's componentType: the shortcut is
          licensed for reads only, so route the write through an Orchestrator
        type: local
      - stepNumber: 5
        label: binding
        description: >-
          Portal dispatch-table pass: for each binding of the dispatch table of each component in
          ctx.components. A dispatch step reaches its server only through a table binding, so
          judging every binding judges each dispatch step that takes it, once, where the route is
          declared
        type: loop
        loopKind: forEach
        over: each binding of the dispatch table of each component in ctx.components
        endStep: 8
      - stepNumber: 6
        label: portalTable
        description: Is the component a Portal? (isDraftCtx = ctx.isComponentDraft(comp.id))
        type: branch
        condition: comp.componentType is Portal
        onFalseStep: 5
      - stepNumber: 7
        label: writeRoute
        description: >-
          Does the binding route its capability to a write-effect method on a Repository or Index
          directly? Methods without an effect tag are not judged
        type: branch
        condition: >-
          ctx.componentMap resolves binding.component to a target that is a Repository or an Index,
          and the method named binding.method among ctx.interfaceMethodsOf(target.id) declares
          effect write
        onFalseStep: 5
      - stepNumber: 8
        label: tableWriteShortcut
        description: >-
          Report PORTAL_WRITE_SHORTCUT (error, on comp.id; draft context isDraftCtx ||
          ctx.isComponentDraft(target.id)) naming the Portal, the binding's capability, target.id
          and binding.method, and the target's componentType: the shortcut is licensed for reads
          only, so route the write through an Orchestrator
        type: local
    symbol: check
    exportedVia: portalWriteShortcutRule
  - name: patternMembership
    sourcePath: src/core/rules/doctrine/pattern-membership.ts
    narrative:
      - stepNumber: 1
        label: component
        description: >-
          Owns-shape pass: for each component of ctx.components that is not retired. A retired
          component (a Specialist or Gateway) is skipped by both passes: it records no ownership and
          gets no membership finding, retired-stereotypes reports it once, and its migration decides
          what its owns becomes
        type: loop
        loopKind: forEach
        over: the components of ctx.components that are not retired (comp.isRetired() is false)
        endStep: 6
      - stepNumber: 2
        label: shapeTerms
        description: >-
          isDraftCtx = ctx.isComponentDraft(comp.id); isPattern = comp.isPattern() (the models'
          pattern stereotypes: Repository, FeatureComponent, RouterComponent)
        type: local
      - stepNumber: 3
        label: emptyPattern
        description: Is it a pattern with no members?
        type: branch
        condition: isPattern and comp.owns is empty
        onFalseStep: 5
      - stepNumber: 4
        description: >-
          Report EMPTY_PATTERN (error, on comp.id; draft context isDraftCtx) naming the pattern and
          its componentType: it must own member blocks via owns
        type: local
      - stepNumber: 5
        label: blockOwns
        description: Is it a building block that owns members?
        type: branch
        condition: not isPattern and comp.owns is non-empty
        onFalseStep: 1
      - stepNumber: 6
        description: >-
          Report BLOCK_OWNS_MEMBERS (error, on comp.id; draft context isDraftCtx) naming the block
          and its componentType, and listing the pattern stereotypes (Repository, FeatureComponent,
          RouterComponent) joined by / as the only ones that use owns
        type: local
      - stepNumber: 7
        label: ownershipReading
        description: >-
          ownership = ctx.ownershipIndex(): which pattern privately owns each member block, derived
          once per run and shared with every rule that needs it. Its skips are the semantics this
          pass reports on — a retired or building-block claimant records nothing, so do an
          unresolved member and an inner pattern, and where two patterns claim one block the first
          claimant stays the owner
        type: local
      - stepNumber: 8
        label: claim
        description: >-
          Claim pass: for each owned member id memberId in comp.owns of each component comp of
          ctx.components that is not retired
        type: loop
        loopKind: forEach
        over: >-
          each member id memberId in comp.owns of each component comp of ctx.components that is not
          retired
        endStep: 17
      - stepNumber: 9
        label: resolvedMember
        description: Does the member fail to resolve? (member = ctx.componentMap.get(memberId))
        type: branch
        condition: ctx.componentMap has no component memberId
        onFalseStep: 12
      - stepNumber: 10
        description: >-
          Report INVALID_OWNED_MEMBER (error, on comp.id; draft context
          ctx.isComponentDraft(comp.id)) naming the component and the member id that does not exist
        type: local
      - stepNumber: 11
        description: Continue with the next member, recording no owner for this one
        type: jump
        toStep: 8
      - stepNumber: 12
        label: patternOwner
        description: >-
          Is the claimant a pattern? A building block's owns is wholly the BLOCK_OWNS_MEMBERS
          finding above: the block records no owner, so a Store or Registry it claims stays
          standalone and its dependants are judged as if the claim were absent. Otherwise continue
          with the next member
        type: branch
        condition: comp.isPattern()
        onFalseStep: 8
      - stepNumber: 13
        label: patternMember
        description: Is the member itself a pattern?
        type: branch
        condition: member.isPattern()
        onFalseStep: 16
      - stepNumber: 14
        description: >-
          Report PATTERN_OWNS_PATTERN (error, on comp.id; draft context
          ctx.isComponentDraft(comp.id)) naming the owning pattern and the member: patterns own only
          building blocks and are composed at the subsystem level
        type: local
      - stepNumber: 15
        description: >-
          Record no owner for the inner pattern, so its dependants get no VISIBILITY_VIOLATION:
          continue with the next member
        type: jump
        toStep: 8
      - stepNumber: 16
        label: sharedMember
        description: Has another pattern already claimed this member?
        type: branch
        condition: 'ownership.ownerOf(memberId) is a component other than comp.id: the member''s first owner'
        onFalseStep: 8
      - stepNumber: 17
        label: sharedReport
        description: >-
          Report SHARED_OWNED_MEMBER (error, on comp.id; draft context
          ctx.isComponentDraft(comp.id)) naming the member, its first owner and comp.id: a block has
          exactly one owner
        type: local
    symbol: check
    exportedVia: patternMembershipRule
  - name: patternContainment
    sourcePath: src/core/rules/doctrine/pattern-containment.ts
    narrative:
      - stepNumber: 1
        label: repositoryClaim
        description: >-
          Repository pass: for each owned member id memberId in comp.owns of each Repository comp of
          ctx.components that is not retired. A Repository is judged member by member, because each
          member answers for itself
        type: loop
        loopKind: forEach
        over: >-
          each member id memberId in comp.owns of each Repository comp of ctx.components that is not
          retired
        endStep: 3
      - stepNumber: 2
        label: repositoryMember
        description: >-
          Does the Repository own a member type it may not? A retired member is skipped, its
          STEREOTYPE_RETIRED being its one finding, while a live member's mistake still reports
        type: branch
        condition: >-
          ctx.componentMap resolves the member, the member is not retired (isRetired() is false),
          and its componentType is not in REPOSITORY_MEMBERS, a private constant of this file
          holding Store, Registry, Index, Query and Adapter
        onFalseStep: 1
      - stepNumber: 3
        label: repositoryViolation
        description: >-
          Report REPOSITORY_CONTAINMENT (error, on comp.id; draft context
          ctx.isComponentDraft(comp.id)) naming the Repository, the member and its type: a
          Repository may own only Store, Registry, Index, Query and optionally Adapter
        type: local
      - stepNumber: 4
        label: countingPattern
        description: >-
          Counting pass: for each FeatureComponent and RouterComponent of ctx.components that is not
          retired and owns no retired member. A counting pattern owning a retired member is not
          judged for containment until that member is migrated: its member counts would change with
          the migration, and the member's STEREOTYPE_RETIRED is the one finding
        type: loop
        loopKind: forEach
        over: >-
          the FeatureComponents and RouterComponents of ctx.components that are not retired and
          whose owns names no member that resolves through ctx.componentMap to a retired component
        endStep: 10
      - stepNumber: 5
        label: featureShape
        description: >-
          Is the feature slice shaped other than one Orchestrator with one or more Views? Count the
          FeatureComponent's members by the componentType ctx.componentMap resolves — orchestrators,
          views and others, a member that does not resolve counting as none
        type: branch
        condition: >-
          comp is a FeatureComponent and orchestrators is not exactly 1, or views is below 1, or
          others is above 0
        onFalseStep: 7
      - stepNumber: 6
        description: >-
          Report FEATURE_COMPONENT_CONTAINMENT (error, on comp.id; draft context
          ctx.isComponentDraft(comp.id)) naming the FeatureComponent: it must own exactly one
          Orchestrator and one or more Views, and no other member types
        type: local
      - stepNumber: 7
        label: routerFacade
        description: >-
          Does a RouterComponent own no Portal facade, or more than one? portals = the number of its
          members that resolve through ctx.componentMap to a Portal
        type: branch
        condition: comp is a RouterComponent and portals is not exactly 1
        onFalseStep: 9
      - stepNumber: 8
        description: >-
          Report ROUTER_COMPONENT_CONTAINMENT (error, on comp.id; draft context
          ctx.isComponentDraft(comp.id)) naming the RouterComponent: it must own exactly one Portal
          to act as its facade
        type: local
      - stepNumber: 9
        label: routerChildrenCheck
        description: >-
          Does the RouterComponent lack children to route to? hasChildren = some member resolves to
          any other type
        type: branch
        condition: comp is a RouterComponent and not hasChildren
        onFalseStep: 4
      - stepNumber: 10
        label: routerChildren
        description: >-
          Report ROUTER_COMPONENT_CONTAINMENT (error, on comp.id; draft context
          ctx.isComponentDraft(comp.id)) naming the RouterComponent: it must own at least one child
          component or View to route to
        type: local
    symbol: check
    exportedVia: patternContainmentRule
  - name: unownedBlocks
    sourcePath: src/core/rules/doctrine/unowned-blocks.ts
    narrative:
      - stepNumber: 1
        label: ownershipReading
        description: >-
          ownership = ctx.ownershipIndex(): which pattern privately owns each member block, and
          therefore which blocks stand alone. A retired component is never a Store, Registry or
          Query, so this pass needs no retirement skip
        type: local
      - stepNumber: 2
        label: standalone
        description: For each component of ctx.components that no pattern owns
        type: loop
        loopKind: forEach
        over: the components of ctx.components whose id ownership.ownedMembers lacks
        endStep: 9
      - stepNumber: 3
        label: draft
        description: isDraftCtx = ctx.isComponentDraft(comp.id)
        type: local
      - stepNumber: 4
        label: unownedStore
        description: Is it a Store?
        type: branch
        condition: comp.componentType is Store
        onFalseStep: 6
      - stepNumber: 5
        description: >-
          Report UNOWNED_STORE (warning, on comp.id; draft context isDraftCtx) naming the Store: the
          recommended shape is a Repository owning it with its Registry and Index; a deliberate
          standalone Store stays visible, is reached from the workflow layer and carries a
          lint.allow reason; never merge the state into a consuming component
        type: local
      - stepNumber: 6
        label: standaloneRegistry
        description: >-
          Is it a Registry with no Store to write to? A Repository-owned Registry reaches its Store
          as a sibling member and never arrives here
        type: branch
        condition: >-
          comp.componentType is Registry and no id in comp.dependsOn resolves through
          ctx.componentMap to a Store
        onFalseStep: 8
      - stepNumber: 7
        description: >-
          Report REGISTRY_WITHOUT_STORE (warning, on comp.id; draft context isDraftCtx) naming the
          Registry: if it holds the record state itself, retype it as a Store with honest
          durability; otherwise wire its Store, or lint.allow with a reason
        type: local
      - stepNumber: 8
        label: unownedQuery
        description: >-
          Is it a Query? A Query that a non-Repository pattern owns is that pattern's containment
          finding, not this one
        type: branch
        condition: comp.componentType is Query
        onFalseStep: 2
      - stepNumber: 9
        label: unownedQueryReport
        description: >-
          Report UNOWNED_QUERY (error, on comp.id; draft context isDraftCtx) naming the Query: a
          Query computes reads over its own Repository's Store, so make it a member of the
          Repository whose Store it reads
        type: local
    symbol: check
    exportedVia: unownedBlocksRule
  - name: memberVisibility
    sourcePath: src/core/rules/doctrine/member-visibility.ts
    narrative:
      - stepNumber: 1
        label: ownershipReading
        description: >-
          ownership = ctx.ownershipIndex(): which pattern privately owns each member block. This
          rule judges the dependency id as AUTHORED — an id no pattern owns is nobody's private
          member, whether it names a facade, a standalone block or nothing at all — so it reads
          dependsOn directly rather than the resolved dependency edges
        type: local
      - stepNumber: 2
        label: dependency
        description: >-
          For each dependency id depId of each component comp of ctx.components that is not retired.
          A retired depending component is skipped, as everywhere in this family
        type: loop
        loopKind: forEach
        over: each dependency id depId of each component comp of ctx.components that is not retired
        endStep: 4
      - stepNumber: 3
        label: privateMember
        description: >-
          Is the dependency a block privately owned by another group? A facade or standalone block,
          the owner's own member, and a sibling member of the same owner are all fine
        type: branch
        condition: >-
          owner = ownership.ownerOf(depId) is set, owner is not comp.id, and
          ownership.ownerOf(comp.id) is not owner
        onFalseStep: 2
      - stepNumber: 4
        label: visibilityReport
        description: >-
          Report VISIBILITY_VIOLATION (error, on comp.id; draft context
          ctx.isComponentDraft(comp.id) || ctx.isComponentDraft(depId)) naming the component, depId
          and its owner: depend on the facade instead
        type: local
    symbol: check
    exportedVia: memberVisibilityRule
  - name: portalEndpoints
    sourcePath: src/core/rules/doctrine/portal-endpoints.ts
    narrative:
      - stepNumber: 1
        label: component
        description: For each component in ctx.components
        type: loop
        loopKind: forEach
        over: ctx.components
        endStep: 9
      - stepNumber: 2
        description: >-
          Is this a Portal with a transport its methods must bind? expected =
          PORTAL_TRANSPORT[comp.portalType], a private constant of this file (HTTP_API to HTTP,
          gRPC, GraphQL, MessageBus, NamedPipe, IPC, CLI; Custom to none). A Portal without a
          portalType (the portal-fields rule reports that) or a Custom one carries no endpoint
          obligation, and a component that is not a Portal is non-portal-endpoints' subject
        type: branch
        condition: >-
          comp.componentType is Portal, comp.portalType is set, and PORTAL_TRANSPORT maps it to a
          transport
        onFalseStep: 1
      - stepNumber: 3
        description: isDraftCtx = ctx.isComponentDraft(comp.id)
        type: local
      - stepNumber: 4
        label: portalMethod
        description: >-
          For each method of each of the Portal's interfaces (the ctx.interfaces whose component is
          comp.id), with isIntfDraft = intf.status is draft or design
        type: loop
        loopKind: forEach
        over: each method m of each interface intf whose component is comp.id
        endStep: 9
      - stepNumber: 5
        description: Does the method lack an endpoint binding?
        type: branch
        condition: m.endpoint is not set
        onFalseStep: 8
      - stepNumber: 6
        description: >-
          Report MISSING_ENDPOINT (error, on intf.id; draft context isDraftCtx || isIntfDraft)
          naming the method, the interface and the Portal's portalType, and telling the author to
          bind it with sdd_set_endpoints under the expected transport
        type: local
      - stepNumber: 7
        description: Continue with the next method
        type: jump
        toStep: 4
      - stepNumber: 8
        label: mismatchCheck
        description: Does the bound endpoint use another transport than the Portal's portalType expects?
        type: branch
        condition: m.endpoint.transport differs from expected
        onFalseStep: 4
      - stepNumber: 9
        label: mismatch
        description: >-
          Report ENDPOINT_TRANSPORT_MISMATCH (error, on intf.id; draft context isDraftCtx ||
          isIntfDraft) naming the method, the interface, its declared transport, the Portal with its
          portalType, and the expected transport
        type: local
    symbol: check
    exportedVia: portalsRule
  - name: nonPortalEndpoints
    sourcePath: src/core/rules/doctrine/non-portal-endpoints.ts
    narrative:
      - stepNumber: 1
        label: component
        description: For each component in ctx.components
        type: loop
        loopKind: forEach
        over: ctx.components
        endStep: 6
      - stepNumber: 2
        description: A Portal's own endpoint bindings are portal-endpoints' question
        type: branch
        condition: comp.componentType is not Portal
        onFalseStep: 1
      - stepNumber: 3
        description: isDraftCtx = ctx.isComponentDraft(comp.id)
        type: local
      - stepNumber: 4
        label: nonPortalMethod
        description: >-
          For each method of each of the component's interfaces (the ctx.interfaces whose component
          is comp.id), with isIntfDraft = intf.status is draft or design
        type: loop
        loopKind: forEach
        over: each method m of each interface intf whose component is comp.id
        endStep: 6
      - stepNumber: 5
        description: Does the method declare an endpoint?
        type: branch
        condition: m.endpoint is set
        onFalseStep: 4
      - stepNumber: 6
        label: nonPortalReport
        description: >-
          Report ARCHITECTURE_VIOLATION_NON_PORTAL_ENDPOINT (error, on intf.id as the Portal-side
          codes report, where the fix is made; draft context isDraftCtx || isIntfDraft) naming the
          component, its componentType, the method and the interface: only Portal components may
          carry endpoints
        type: local
    symbol: check
    exportedVia: nonPortalEndpointsRule
  - name: portalCallAuth
    sourcePath: src/core/rules/doctrine/portal-call-auth.ts
    narrative:
      - stepNumber: 1
        label: impl
        description: For each implementation in ctx.implementations
        type: loop
        loopKind: forEach
        over: ctx.implementations
        endStep: 8
      - stepNumber: 2
        description: >-
          ownComponent = the component of ctx.interfaceMap.get(impl.contract); presenter =
          ctx.componentMap.get(ownComponent) when there is one, the component making the calls;
          draft = ctx.isImplementationDraft(impl)
        type: local
      - stepNumber: 3
        label: step
        description: For each narrative step of each of the implementation's methods
        type: loop
        loopKind: forEach
        over: each narrative step of each method of impl
        endStep: 8
      - stepNumber: 4
        description: >-
          Is the step an outbound call into another component's authenticated Portal? Dispatch steps
          (a portal's own inbound routing), self-calls, unresolved or non-Portal targets, and
          Portals without auth or with scheme none are skipped
        type: branch
        condition: >-
          step.type is call, step.targetComponent is set and is not ownComponent, ctx.componentMap
          resolves it to a Portal, and that Portal's auth is set with a scheme other than none
        onFalseStep: 3
      - stepNumber: 5
        description: Is the credential presenter something other than an Adapter?
        type: branch
        condition: presenter is resolved and presenter.componentType is not Adapter
        onFalseStep: 7
      - stepNumber: 6
        description: >-
          Report AUTH_PRESENTER_NOT_ADAPTER (warning, on impl.id; draft context draft) naming the
          step number, the method, the presenter with its componentType and the target Portal: an
          authenticated cross-service call is external I/O, so route it through a client Adapter
        type: local
      - stepNumber: 7
        label: source
        description: >-
          Does the step leave out where its credential loads from? What a source it does name
          denotes is auth-source-wiring's question
        type: branch
        condition: step.auth.from is not set
        onFalseStep: 3
      - stepNumber: 8
        label: unmet
        description: >-
          Report PORTAL_AUTH_UNMET (warning, on impl.id; draft context draft) naming the step
          number, the method, the target Portal and its auth scheme: add the step's auth.from (a
          secret-store component, env var, config key or vault ref), or drop the Portal's auth if it
          needs none
        type: local
    symbol: check
    exportedVia: portalCallAuthRule
  - name: authSourceWiring
    sourcePath: src/core/rules/doctrine/auth-source-wiring.ts
    narrative:
      - stepNumber: 1
        label: impl
        description: For each implementation in ctx.implementations
        type: loop
        loopKind: forEach
        over: ctx.implementations
        endStep: 11
      - stepNumber: 2
        description: >-
          ownComponent = the component of ctx.interfaceMap.get(impl.contract); presenter =
          ctx.componentMap.get(ownComponent) when there is one, the component making the calls;
          draft = ctx.isImplementationDraft(impl)
        type: local
      - stepNumber: 3
        label: step
        description: For each narrative step of each of the implementation's methods
        type: loop
        loopKind: forEach
        over: each narrative step of each method of impl
        endStep: 11
      - stepNumber: 4
        description: >-
          Is a MODELED credential source presented on an outbound call into another component's
          authenticated Portal? A dispatch step is the portal's own inbound routing and a component
          never calls its own portal, so neither is a cross-service call; a step with no source is
          portal-call-auth's finding, and an opaque one (env:, config:, vault:, a free note) stays a
          design note. COMPONENT_REF_PREFIX is a private constant of this file
        type: branch
        condition: >-
          step.type is call, step.targetComponent is set and is not ownComponent, ctx.componentMap
          resolves it to a Portal whose auth is set with a scheme other than none, and
          step.auth.from is set and starts with COMPONENT_REF_PREFIX (component:)
        onFalseStep: 3
      - stepNumber: 5
        description: >-
          Does the referenced source exist? srcId = from without the component: prefix; src =
          ctx.componentMap.get(srcId)
        type: branch
        condition: ctx.componentMap has no component srcId
        onFalseStep: 8
      - stepNumber: 6
        description: >-
          Report UNKNOWN_AUTH_SOURCE (warning, on impl.id; draft context draft) naming the step
          number, the method and srcId, which does not exist
        type: local
      - stepNumber: 7
        description: 'Nothing resolved to judge: continue with the next step'
        type: jump
        toStep: 3
      - stepNumber: 8
        label: provider
        description: Is the source something other than a credential provider?
        type: branch
        condition: src.componentType is neither Adapter nor Store
        onFalseStep: 10
      - stepNumber: 9
        description: >-
          Report AUTH_SOURCE_NOT_PROVIDER (warning, on impl.id; draft context draft) naming the step
          number, the method, srcId and its componentType: a credential source must be an Adapter
          (loads the secret) or a Store (holds it)
        type: local
      - stepNumber: 10
        label: wiredCheck
        description: Is the presenter not wired to its credential source?
        type: branch
        condition: presenter is resolved and neither presenter.dependsOn nor presenter.owns includes srcId
        onFalseStep: 3
      - stepNumber: 11
        label: unwired
        description: >-
          Report AUTH_SOURCE_UNWIRED (warning, on impl.id; draft context draft) naming the step
          number, the method, the presenter and srcId: declare the dependsOn edge so the credential
          wiring is real
        type: local
    symbol: check
    exportedVia: authSourceWiringRule
  - name: projectBoundaries
    narrative:
      - stepNumber: 1
        description: >-
          Read the project graph and the export usages from the rule context (ctx.projectFamily,
          ctx.exportUsages)
        type: local
      - stepNumber: 2
        description: Is there a graph to read?
        type: branch
        condition: the context carries no project graph (a candidate run)
        onFalseStep: 4
      - stepNumber: 3
        description: 'Nothing to judge: report nothing'
        type: return
        outcome: no graph
      - stepNumber: 4
        label: references
        description: For each cross-project reference
        type: loop
        loopKind: forEach
        over: the graph's cross-project references
        endStep: 7
      - stepNumber: 5
        description: Does the consumer declare the producer?
        type: branch
        condition: >-
          ProjectFamily.declares(consumer, producer) — the producer is a direct member, or one of
          the consumer's externals resolves to it
        onTrueStep: 7
        onFalseStep: 6
      - stepNumber: 6
        description: >-
          Report EXTERNAL_UNDECLARED (notice) on the referring spec, in its draft context, naming
          the position, the target, the producer's id and namespace, and the `externals` entry that
          would declare it (a member needs none; a parent or sibling does)
        type: local
      - stepNumber: 7
        label: declared
        description: The reference's declaration is judged
        type: local
      - stepNumber: 8
        description: For each unexported reference of every usage
        type: loop
        loopKind: forEach
        over: the unexported references of the context's export usages
        endStep: 9
      - stepNumber: 9
        label: exported
        description: >-
          Report EXTERNAL_NOT_EXPORTED (notice) on the referring spec, in its draft context, naming
          the target and the producer, and that another project may reach it only through an L0
          export whose audience covers the referrer — export it from the producer's L0 (audience
          project reaches the family) and reach it there
        type: local
      - stepNumber: 10
        description: For each subsystem's trustedLinks entries
        type: loop
        loopKind: forEach
        over: every loaded subsystem's trustedLinks entries
        endStep: 14
      - stepNumber: 11
        description: >-
          Find the project the link lands in: ProjectFamily.producerOf(the link as written, from the
          declaring subsystem's project) — the loader leaves trustedLinks raw, so it is qualified
          here the way the loader qualifies a reference
        type: local
      - stepNumber: 12
        description: Does the link stay inside its project?
        type: branch
        condition: the producer is unknown, or is the project that owns the declaring subsystem
        onTrueStep: 14
        onFalseStep: 13
      - stepNumber: 13
        description: >-
          Report TRUSTED_LINK_CROSSES_PROJECT (notice) on the declaring subsystem, in its draft
          context, naming the linked subsystem and its project: a trusted link waives the
          client-Adapter shim inside one project and cannot pierce a project boundary; reach the
          other project through its exports
        type: local
      - stepNumber: 14
        label: linked
        description: The link is judged
        type: local
      - stepNumber: 15
        description: Every boundary is judged
        type: return
        outcome: judged
    detail: full
    symbol: check
status: complete
