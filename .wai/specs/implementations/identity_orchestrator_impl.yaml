id: identity_orchestrator_impl
name: Identity Orchestrator Implementation
description: >-
  Hosted identity control-plane workflows: authenticate the caller credential, gather organization
  data and resolve authorization scope (instance-wide or unit-scoped), then manage user-bound
  MCP/API tokens, user grants, identity-provider (SSO) configuration, and admin-only audit access;
  plus the unauthenticated headless SSO login pair. Audit appends are best-effort and never fail the
  primary action.
contract: iidentity_orchestrator
sourcePath: src/server/identity.ts
methods:
  - name: mintToken
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential (bootstrap or user-bound token)
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: >-
          HARD RESERVATION: if any requested grant is the reserved instance-wide super-admin shape
          (projectId '*' with no orgUnitId and permissions including '*'), reject before any
          authorization — the check is unconditional and cannot be overridden by any caller
          authority
        type: branch
        condition: >-
          any requested grant is the reserved instance-wide super-admin shape (projectId '*' with no
          orgUnitId and permissions including '*')
        onTrueStep: 3
        onFalseStep: 4
      - stepNumber: 3
        description: >-
          Reject the reserved grant unconditionally — even a super-admin or master caller may not
          mint a *:* token (the built-in admin session and the master principal are not minted
          records and are unaffected)
        type: throw
        error: Forbidden — instance-wide super-admin (*:*) is reserved to the built-in admin account
      - stepNumber: 4
        description: Gather all organization units to expand any unit-scoped delegation authority
        type: call
        targetComponent: organization_repository
        targetMethod: listUnits
      - stepNumber: 5
        description: Gather all project placements to map in-scope units to their hosted projects
        type: call
        targetComponent: organization_repository
        targetMethod: listPlacements
      - stepNumber: 6
        description: >-
          Deny the delegation unless the caller may delegate every requested grant (an
          instance-admin may delegate any enumerated grant; a scoped caller only within their
          authorized subtree). Holding key:manage alone never suffices.
        type: branch
        condition: >-
          the caller is not an instance admin and, for some requested (target, permission) in
          request.grants, the caller's resolved authorization for that permission does not cover the
          requested target project or unit
        onTrueStep: 7
        onFalseStep: 8
      - stepNumber: 7
        description: Reject the delegation
        type: throw
        error: Forbidden — caller may not delegate the requested grants
      - stepNumber: 8
        description: List hosted projects to validate the request
        type: call
        targetComponent: project_registry
        targetMethod: list
      - stepNumber: 9
        description: >-
          Verify that every specific projectId referenced in request.grants exists among the known
          projects and every orgUnitId referenced exists among the gathered units
        type: local
      - stepNumber: 10
        description: If any requested project id or org unit id is unknown, reject
        type: branch
        condition: a requested project id or org unit id is unknown
        onTrueStep: 11
        onFalseStep: 12
      - stepNumber: 11
        description: Reject the unknown project or unit
        type: throw
        error: unknown project or organization unit
      - stepNumber: 12
        description: Generate a cryptographically random token and compute its salted hash
        type: local
      - stepNumber: 13
        description: >-
          Build the ApiKeyRecord (hashed token, ownerSubject from the request, createdBySubject from
          the actor principal, grants, label, expiresAt, plus the role/projects compatibility
          projection derived from the grants)
        type: local
      - stepNumber: 14
        description: Persist the credential record
        type: call
        targetComponent: credential_registry
        targetMethod: create
      - stepNumber: 15
        description: Append a redacted audit event without letting a failure fail the mint
        type: try
        endStep: 17
        catches:
          - error: audit append failure
            step: 18
      - stepNumber: 16
        description: Append the redacted token.mint audit event under the active retention policy
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 17
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 19
      - stepNumber: 18
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 19
        description: Return the plaintext token (shown exactly once)
        type: return
        outcome: plaintext token returned once
  - name: revokeToken
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: >-
          If the caller's grants cover neither key:manage for the token's scope nor an instance-wide
          admin grant, deny
        type: branch
        condition: >-
          the caller's grants cover neither key:manage for the token's scope nor an instance-wide
          admin grant
        onFalseStep: 4
      - stepNumber: 3
        description: Reject the revocation
        type: throw
        error: Forbidden — caller may not manage this token
      - stepNumber: 4
        description: Revoke the credential record by token id
        type: call
        targetComponent: credential_registry
        targetMethod: revoke
      - stepNumber: 5
        description: Append a redacted audit event without letting a failure fail the revoke
        type: try
        endStep: 7
        catches:
          - error: audit append failure
            step: 8
      - stepNumber: 6
        description: Append the redacted token.revoke audit event under the active retention policy
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 7
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 9
      - stepNumber: 8
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 9
        description: Return once revoked
        type: return
        outcome: revoked
  - name: pruneAuditEvents
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: If the caller lacks an instance-wide admin grant, deny
        type: branch
        condition: the caller lacks an instance-wide admin grant
        onFalseStep: 4
      - stepNumber: 3
        description: Reject the audit administration
        type: throw
        error: Forbidden — audit administration requires an instance-wide admin grant
      - stepNumber: 4
        description: >-
          Resolve the active AuditRetentionPolicy from the host config, using the secure default
          policy when unset
        type: local
      - stepNumber: 5
        description: Apply the retention policy and delete expired audit events
        type: call
        targetComponent: audit_repository
        targetMethod: prune
      - stepNumber: 6
        description: Append a redacted audit event without letting a failure fail the prune
        type: try
        endStep: 8
        catches:
          - error: audit append failure
            step: 9
      - stepNumber: 7
        description: Append the redacted audit.prune audit event under the active retention policy
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 8
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 10
      - stepNumber: 9
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 10
        description: Return the number of events removed
        type: return
        outcome: removed count
  - name: startSsoLogin
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the configured identity providers through the policy repository (no caller
          credential — starting a login is unauthenticated by nature)
        type: call
        targetComponent: policy_repository
        targetMethod: listIdentityProviders
      - stepNumber: 2
        description: >-
          Select the identity-provider configuration whose id is providerId from the listed
          providers
        type: local
      - stepNumber: 3
        description: If the selected provider is unknown or not enabled, reject
        type: branch
        condition: the selected provider is unknown or not enabled
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the login start for an unknown or disabled provider
        type: throw
        error: unknown or disabled identity provider
      - stepNumber: 5
        description: Generate a cryptographically random nonce for this login attempt
        type: local
      - stepNumber: 6
        description: >-
          Sign an SSO state binding providerId, the nonce, and redirectUri via the single signing
          authority
        type: call
        targetComponent: auth_specialist
        targetMethod: signSsoState
      - stepNumber: 7
        description: >-
          Resolve the provider's concrete OIDC endpoints through the identity provider adapter
          (explicit overrides -> OIDC discovery -> providerType template)
        type: call
        targetComponent: identity_provider_adapter
        targetMethod: resolveEndpoints
      - stepNumber: 8
        description: Build the provider authorization URL from the config, the signed state, and redirectUri
        type: call
        targetComponent: identity_provider_adapter
        targetMethod: buildAuthorizationUrl
      - stepNumber: 9
        description: Append a redacted audit event without letting a failure fail the login start
        type: try
        endStep: 11
        catches:
          - error: audit append failure
            step: 12
      - stepNumber: 10
        description: Append the redacted sso.start audit event (info level) under the active retention policy
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 11
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 13
      - stepNumber: 12
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 13
        description: Return the provider authorization URL
        type: return
        outcome: authorization URL
  - name: completeSsoLogin
    narrative:
      - stepNumber: 1
        description: >-
          Verify the signed SSO state via the single signing authority — a tampered or expired state
          is rejected; the original payload is returned (no caller credential — trust derives from
          the signed state and the code exchange)
        type: call
        targetComponent: auth_specialist
        targetMethod: verifySsoState
      - stepNumber: 2
        description: Parse the verified state payload into providerId, nonce, and redirectUri
        type: local
      - stepNumber: 3
        description: Resolve the configured identity providers through the policy repository
        type: call
        targetComponent: policy_repository
        targetMethod: listIdentityProviders
      - stepNumber: 4
        description: Select the identity-provider configuration whose id is the state's providerId
        type: local
      - stepNumber: 5
        description: If the selected provider is unknown or not enabled, reject
        type: branch
        condition: the selected provider is unknown or not enabled
        onFalseStep: 7
      - stepNumber: 6
        description: Reject the callback for an unknown or disabled provider
        type: throw
        error: unknown or disabled identity provider
      - stepNumber: 7
        description: >-
          Resolve the provider's concrete OIDC endpoints through the identity provider adapter
          (front-channel authorize plus back-channel token/jwks, honoring any split-horizon
          overrides)
        type: call
        targetComponent: identity_provider_adapter
        targetMethod: resolveEndpoints
      - stepNumber: 8
        description: >-
          Exchange the authorization code for provider tokens using the config and the state's
          redirectUri, receiving a redacted provider response summary
        type: call
        targetComponent: identity_provider_adapter
        targetMethod: exchangeCode
      - stepNumber: 9
        description: >-
          Verify the provider metadata and resolve it to a Wairon PrincipalSubject (issuer +
          external subject), without leaking raw provider tokens
        type: call
        targetComponent: identity_provider_adapter
        targetMethod: resolveSubject
      - stepNumber: 10
        description: >-
          Read the verified id_token's groups claim from the redacted provider summary (meaningful
          only now — after resolveSubject verified the same summary)
        type: call
        targetComponent: identity_provider_adapter
        targetMethod: resolveGroups
      - stepNumber: 11
        description: >-
          Decide the SSO-admin membership: in the admin group exactly when the verified groups
          intersect the provider's configured adminGroupClaims (an unset or empty adminGroupClaims
          never matches)
        type: local
      - stepNumber: 12
        description: Look up the hosted user by the resolved subject's issuer and external subject id
        type: call
        targetComponent: user_repository
        targetMethod: findByExternalSubject
      - stepNumber: 13
        description: >-
          If no hosted user matched the resolved external subject, provision one; otherwise skip to
          minting
        type: branch
        condition: no hosted user matched the resolved external subject
        onFalseStep: 16
      - stepNumber: 14
        description: >-
          Build a new active HostedUserRecord for the resolved subject — first-login provisioning:
          status active, createdAt now, grants = the enumerated instance-wide SSO-admin bundle
          ({projectId '*', permissions ['user:admin', 'project:create', 'audit:read']} —
          deliberately NOT *:*) when in the admin group, otherwise empty (an admin assigns grants
          afterwards)
        type: local
      - stepNumber: 15
        description: Persist the newly provisioned first-login user record through the user repository
        type: call
        targetComponent: user_repository
        targetMethod: upsert
      - stepNumber: 16
        description: >-
          Reject re-login for a deactivated user before minting: if the hosted user resolved for
          this login is not 'active', deny (a freshly provisioned first-login record is always
          active, so only an existing deactivated user is rejected here)
        type: branch
        condition: the resolved hosted user's status is not 'active'
        onFalseStep: 18
      - stepNumber: 17
        description: Reject the re-login of a deactivated user
        type: throw
        error: deactivated user may not re-login
      - stepNumber: 18
        description: >-
          If the user's stored grants disagree with the SSO-admin membership (in the admin group but
          missing the enumerated bundle, or out of the group but still carrying it), refresh them;
          otherwise skip the refresh
        type: branch
        condition: >-
          the user's stored grants disagree with the SSO-admin membership decided from the verified
          groups claim
        onTrueStep: 19
        onFalseStep: 20
      - stepNumber: 19
        description: >-
          Persist the refreshed grants through the user repository: append the enumerated SSO-admin
          bundle on entry into the admin group, drop it on exit (server-driven; the bundle is
          enumerated — never *:* — so the hard reservation is preserved)
        type: call
        targetComponent: user_repository
        targetMethod: replaceGrants
      - stepNumber: 20
        description: >-
          Resolve the effective user record (the freshly provisioned record on first login,
          otherwise the existing match, with the grants refresh applied) and mint a user-bound
          token: generate a cryptographically random token, compute its salted hash, and build the
          ApiKeyRecord (keyHash, ownerSubject = the resolved user's subject, createdBySubject = the
          resolved user's subject, grants = the resolved user's CURRENT grants with any reserved
          instance-wide super-admin (*:*) grant filtered out — *:* is reserved to the built-in admin
          account, so no SSO login can ever mint a credential carrying it — createdAt now, plus the
          role/projects compatibility projection derived from the filtered grants)
        type: local
      - stepNumber: 21
        description: Persist only the hashed credential record
        type: call
        targetComponent: credential_registry
        targetMethod: create
      - stepNumber: 22
        description: Append a redacted audit event without letting a failure fail the login
        type: try
        endStep: 24
        catches:
          - error: audit append failure
            step: 25
      - stepNumber: 23
        description: >-
          Append the redacted sso.login audit event (security level) under the active retention
          policy
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 24
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 26
      - stepNumber: 25
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 26
        description: Return the plaintext user-bound token (shown exactly once)
        type: return
        outcome: plaintext token returned once
  - name: listIdentityProviders
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: If the caller lacks an instance-wide admin grant, deny
        type: branch
        condition: the caller lacks an instance-wide admin grant
        onFalseStep: 4
      - stepNumber: 3
        description: Reject the identity-provider administration
        type: throw
        error: Forbidden — identity-provider administration requires an instance-wide admin grant
      - stepNumber: 4
        description: List the configured identity providers through the policy repository
        type: call
        targetComponent: policy_repository
        targetMethod: listIdentityProviders
      - stepNumber: 5
        description: Return the identity-provider configurations
        type: return
        outcome: identity-provider configurations
  - name: upsertIdentityProvider
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: If the caller lacks an instance-wide admin grant, deny
        type: branch
        condition: the caller lacks an instance-wide admin grant
        onFalseStep: 4
      - stepNumber: 3
        description: Reject the identity-provider administration
        type: throw
        error: Forbidden — identity-provider administration requires an instance-wide admin grant
      - stepNumber: 4
        description: >-
          Create or update the identity-provider configuration through the policy repository (the
          config carries a clientSecretRef, never a raw secret)
        type: call
        targetComponent: policy_repository
        targetMethod: upsertIdentityProvider
      - stepNumber: 5
        description: Append a redacted audit event without letting a failure fail the upsert
        type: try
        endStep: 7
        catches:
          - error: audit append failure
            step: 8
      - stepNumber: 6
        description: >-
          Append the redacted idp.upsert audit event (security level) under the active retention
          policy
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 7
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 9
      - stepNumber: 8
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 9
        description: Return the stored identity-provider configuration
        type: return
        outcome: stored identity-provider configuration
  - name: removeIdentityProvider
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: If the caller lacks an instance-wide admin grant, deny
        type: branch
        condition: the caller lacks an instance-wide admin grant
        onFalseStep: 4
      - stepNumber: 3
        description: Reject the identity-provider administration
        type: throw
        error: Forbidden — identity-provider administration requires an instance-wide admin grant
      - stepNumber: 4
        description: >-
          Remove the identity-provider configuration by id through the policy repository (an unknown
          id is rejected)
        type: call
        targetComponent: policy_repository
        targetMethod: removeIdentityProvider
      - stepNumber: 5
        description: Append a redacted audit event without letting a failure fail the removal
        type: try
        endStep: 7
        catches:
          - error: audit append failure
            step: 8
      - stepNumber: 6
        description: >-
          Append the redacted idp.remove audit event (security level) under the active retention
          policy
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 7
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 9
      - stepNumber: 8
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 9
        description: Return once the identity-provider configuration has been removed
        type: return
        outcome: identity provider removed
  - name: mintSelfToken
    narrative: []
    detail: intent
    intent: >-
      Authenticate the caller credential (ws_ session or token) to the calling principal via the
      auth specialist. Verify the principal's own grants already cover mcp:read on projectId (and
      mcp:write when write is true), rejecting Forbidden otherwise; because the minted token is no
      broader than the caller's own authority this is self-scoped, so key:manage is neither required
      nor consulted. Generate a random token and salted hash and build an ApiKeyRecord OWNED by the
      caller (ownerSubject and createdBySubject = the principal's subject) with exactly one grant on
      projectId carrying mcp:read (and mcp:write when write) plus the role/projects compatibility
      projection, persist only the hashed record through the credential registry, append a
      best-effort redacted token.mint.self (security) audit event, and return the plaintext exactly
      once. Because the token is owned by the caller, a later deactivation of that user revokes it
      via revokeAllForOwner.
  - name: listSelfTokens
    narrative: []
    detail: intent
    intent: >-
      Authenticate the caller credential to the calling principal, list the principal's own
      credential records through the credential registry (listByOwner on the principal's subject
      user id), and return them redacted: each carries the hashed token (never plaintext) with its
      id, authorized project, label, createdAt and revokedAt, so the client can show a user their
      agent tokens and offer revoke. A read; not audited.
  - name: revokeSelfToken
    narrative: []
    detail: intent
    intent: >-
      Authenticate the caller credential to the calling principal, fetch the principal's own tokens
      (listByOwner) and confirm tokenId is among them (a token the caller does not own is rejected
      as not found, so there is no cross-user revocation and no key:manage escalation), then revoke
      it through the credential registry and append a best-effort redacted token.revoke.self
      (security) audit event.
  - name: listUsers
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: >-
          Compute the caller's project:admin visible scopes over the organization tree (the units
          they may administer)
        type: call
        targetComponent: authorization_specialist
        targetMethod: visibleScopes
      - stepNumber: 3
        description: If the caller has no actionable unit scope, deny
        type: branch
        condition: the caller has no actionable unit scope in the visible set
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the listing
        type: throw
        error: Forbidden — user administration required
      - stepNumber: 5
        description: List hosted users, optionally narrowed to one project's grant holders
        type: call
        targetComponent: user_repository
        targetMethod: list
      - stepNumber: 6
        description: >-
          Filter the returned users to those whose home unit is an actionable unit in the visible
          set (an instance-admin keeps every user); honor any optional project narrowing already
          applied
        type: local
      - stepNumber: 7
        description: Return the hosted user records filtered to the caller's scope
        type: return
        outcome: scoped hosted user records
    detail: full
  - name: upsertUser
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: >-
          HARD RESERVATION: if the incoming record carries a grant of the reserved instance-wide
          super-admin shape (projectId '*' with no orgUnitId and permissions including '*'), reject
          before any authorization — unconditional
        type: branch
        condition: the incoming record carries a grant of the reserved instance-wide super-admin shape
        onTrueStep: 3
        onFalseStep: 4
      - stepNumber: 3
        description: Reject the reserved grant unconditionally
        type: throw
        error: Forbidden — instance-wide super-admin (*:*) is reserved to the built-in admin account
      - stepNumber: 4
        description: >-
          Look up any existing user record by id to distinguish creation from update and to read its
          current home unit
        type: call
        targetComponent: user_repository
        targetMethod: getById
      - stepNumber: 5
        description: >-
          Resolve the caller's project:admin permission over the target user's home unit (the
          incoming record's, or the existing record's on update)
        type: call
        targetComponent: authorization_specialist
        targetMethod: authorize
      - stepNumber: 6
        description: If the effective project:admin value is not yes, deny
        type: branch
        condition: the effective project:admin value is not yes
        onTrueStep: 7
        onFalseStep: 8
      - stepNumber: 7
        description: Reject the user administration
        type: throw
        error: Forbidden — user administration requires project:admin over the target user's home unit
      - stepNumber: 8
        description: >-
          Build the redacted audit event with action user.create when no record existed, or
          user.update otherwise
        type: local
      - stepNumber: 9
        description: Create or update the hosted user through the repository
        type: call
        targetComponent: user_repository
        targetMethod: upsert
      - stepNumber: 10
        description: Append the audit event without letting a failure fail the upsert
        type: try
        endStep: 12
        catches:
          - error: audit append failure
            step: 13
      - stepNumber: 11
        description: >-
          Append the redacted user.create or user.update audit event under the active retention
          policy
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 12
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 14
      - stepNumber: 13
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 14
        description: Return the stored user record
        type: return
        outcome: stored user record
    detail: full
  - name: setUserStatus
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Look up the target user by id to read its home unit and existence
        type: call
        targetComponent: user_repository
        targetMethod: getById
      - stepNumber: 3
        description: If no user matches userId, reject as not found
        type: branch
        condition: no user matches userId
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject as not found
        type: throw
        error: not found
      - stepNumber: 5
        description: Resolve the caller's project:admin permission over the target user's home unit
        type: call
        targetComponent: authorization_specialist
        targetMethod: authorize
      - stepNumber: 6
        description: If the effective project:admin value is not yes, deny
        type: branch
        condition: the effective project:admin value is not yes
        onTrueStep: 7
        onFalseStep: 8
      - stepNumber: 7
        description: Reject the user administration
        type: throw
        error: Forbidden — user administration requires project:admin over the target user's home unit
      - stepNumber: 8
        description: Set the user's lifecycle status through the repository
        type: call
        targetComponent: user_repository
        targetMethod: setStatus
      - stepNumber: 9
        description: >-
          If the new status is not 'active' (a deactivation), revoke the user's credentials and
          sessions; an active status skips to the audit
        type: branch
        condition: the new status is not 'active'
        onTrueStep: 10
        onFalseStep: 12
      - stepNumber: 10
        description: >-
          Revoke every non-revoked credential owned by the user so existing tokens can no longer
          authenticate, capturing the revoked count
        type: call
        targetComponent: credential_registry
        targetMethod: revokeAllForOwner
      - stepNumber: 11
        description: >-
          Revoke every one of the user's browser sessions too, so a deactivation invalidates live
          web sessions, capturing the revoked-session count
        type: call
        targetComponent: web_session_repository
        targetMethod: removeAllForSubject
      - stepNumber: 12
        description: Append the audit event without letting a failure fail the status change
        type: try
        endStep: 14
        catches:
          - error: audit append failure
            step: 15
      - stepNumber: 13
        description: >-
          Append the redacted user.deactivate (security, with revoked counts) or user.status.set
          (info) audit event under the active retention policy
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 14
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 16
      - stepNumber: 15
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 16
        description: Return the updated user record
        type: return
        outcome: updated user record
    detail: full
  - name: replaceUserGrants
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: >-
          HARD RESERVATION: if any incoming grant is the reserved instance-wide super-admin shape,
          reject before any authorization — unconditional
        type: branch
        condition: >-
          any incoming grant is the reserved instance-wide super-admin shape (projectId '*' with no
          orgUnitId and permissions including '*')
        onTrueStep: 3
        onFalseStep: 4
      - stepNumber: 3
        description: Reject the reserved grant unconditionally
        type: throw
        error: Forbidden — instance-wide super-admin (*:*) is reserved to the built-in admin account
      - stepNumber: 4
        description: Look up the existing user record by id to read its current home unit
        type: call
        targetComponent: user_repository
        targetMethod: getById
      - stepNumber: 5
        description: If no user matches userId, reject as not found
        type: branch
        condition: no user matches userId
        onTrueStep: 6
        onFalseStep: 7
      - stepNumber: 6
        description: Reject as not found
        type: throw
        error: not found
      - stepNumber: 7
        description: >-
          Resolve the caller's project:admin permission over the target user's home unit (Phase 4
          replaces grant management with assignment CRUD carrying its own escalation guard)
        type: call
        targetComponent: authorization_specialist
        targetMethod: authorize
      - stepNumber: 8
        description: If the effective project:admin value is not yes, deny
        type: branch
        condition: the effective project:admin value is not yes
        onTrueStep: 9
        onFalseStep: 10
      - stepNumber: 9
        description: Reject the grant administration
        type: throw
        error: Forbidden — grant administration requires project:admin over the target user's home unit
      - stepNumber: 10
        description: Replace the user's grants wholesale through the repository
        type: call
        targetComponent: user_repository
        targetMethod: replaceGrants
      - stepNumber: 11
        description: Append a redacted audit event without letting a failure fail the grant replacement
        type: try
        endStep: 13
        catches:
          - error: audit append failure
            step: 14
      - stepNumber: 12
        description: Append the redacted user.grants.replace audit event under the active retention policy
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 13
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 15
      - stepNumber: 14
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 15
        description: Return the updated user record
        type: return
        outcome: updated user record
    detail: full
