id: identity_orchestrator_impl
name: Identity Orchestrator Implementation
description: >-
  Hosted identity control-plane workflows: authenticate the caller credential, then manage
  user-bound MCP/API tokens, hosted user records + their role bindings, identity-provider (SSO)
  configuration, and admin-only audit access; plus the unauthenticated headless SSO login pair.
  Authorization resolves through the permission resolver (project:admin over the relevant scope, or
  the env-anchored instance-admin bypass) — never stored grants. Audit appends are best-effort and
  never fail the primary action.
contract: iidentity_orchestrator
sourcePath: src/server/identity.ts
methods:
  - name: revokeToken
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential to the calling principal
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: >-
          If the caller is not an instance admin (permissionSubject.instanceAdmin is false), deny —
          cross-user token revocation is an instance-admin operation; a user revokes their own
          tokens through revokeSelfToken (ownership-checked), so key:manage/grant scope is neither
          required nor consulted
        type: branch
        condition: the caller is not an instance admin (permissionSubject.instanceAdmin is false)
        onTrueStep: 3
        onFalseStep: 4
      - stepNumber: 3
        description: Reject the cross-user revocation
        type: throw
        error: Forbidden — revoking another user's token requires instance-admin
      - stepNumber: 4
        description: Revoke the credential record by token id
        type: call
        targetComponent: credential_registry
        targetMethod: revoke
      - stepNumber: 5
        description: Append a redacted audit event without letting a failure fail the revoke
        type: try
        endStep: 7
        catches:
          - error: audit append failure
            step: 8
      - stepNumber: 6
        description: Append the redacted token.revoke audit event under the active retention policy
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 7
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 9
      - stepNumber: 8
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 9
        description: Return once revoked
        type: return
        outcome: revoked
    detail: full
  - name: startSsoLogin
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the configured identity providers through the policy repository (no caller
          credential — starting a login is unauthenticated by nature)
        type: call
        targetComponent: policy_repository
        targetMethod: listIdentityProviders
      - stepNumber: 2
        description: >-
          Select the identity-provider configuration whose id is providerId from the listed
          providers
        type: local
      - stepNumber: 3
        description: If the selected provider is unknown or not enabled, reject
        type: branch
        condition: the selected provider is unknown or not enabled
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the login start for an unknown or disabled provider
        type: throw
        error: unknown or disabled identity provider
      - stepNumber: 5
        description: Generate a cryptographically random nonce for this login attempt
        type: local
      - stepNumber: 6
        description: >-
          Sign an SSO state binding providerId, the nonce, and redirectUri via the single signing
          authority
        type: call
        targetComponent: auth_specialist
        targetMethod: signSsoState
      - stepNumber: 7
        description: >-
          Resolve the provider's concrete OIDC endpoints through the identity provider adapter
          (explicit overrides -> OIDC discovery -> providerType template)
        type: call
        targetComponent: identity_provider_adapter
        targetMethod: resolveEndpoints
      - stepNumber: 8
        description: Build the provider authorization URL from the config, the signed state, and redirectUri
        type: call
        targetComponent: identity_provider_adapter
        targetMethod: buildAuthorizationUrl
      - stepNumber: 9
        description: Append a redacted audit event without letting a failure fail the login start
        type: try
        endStep: 11
        catches:
          - error: audit append failure
            step: 12
      - stepNumber: 10
        description: Append the redacted sso.start audit event (info level) under the active retention policy
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 11
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 13
      - stepNumber: 12
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 13
        description: Return the provider authorization URL
        type: return
        outcome: authorization URL
  - name: completeSsoLogin
    narrative:
      - stepNumber: 1
        description: >-
          Verify the signed SSO state via the single signing authority — a tampered or expired state
          is rejected; the original payload is returned (no caller credential — trust derives from
          the signed state and the code exchange)
        type: call
        targetComponent: auth_specialist
        targetMethod: verifySsoState
      - stepNumber: 2
        description: Parse the verified state payload into providerId, nonce, and redirectUri
        type: local
      - stepNumber: 3
        description: Resolve the configured identity providers through the policy repository
        type: call
        targetComponent: policy_repository
        targetMethod: listIdentityProviders
      - stepNumber: 4
        description: Select the identity-provider configuration whose id is the state's providerId
        type: local
      - stepNumber: 5
        description: If the selected provider is unknown or not enabled, reject
        type: branch
        condition: the selected provider is unknown or not enabled
        onFalseStep: 7
      - stepNumber: 6
        description: Reject the callback for an unknown or disabled provider
        type: throw
        error: unknown or disabled identity provider
      - stepNumber: 7
        description: >-
          Resolve the provider's concrete OIDC endpoints through the identity provider adapter
          (front-channel authorize plus back-channel token/jwks, honoring any split-horizon
          overrides)
        type: call
        targetComponent: identity_provider_adapter
        targetMethod: resolveEndpoints
      - stepNumber: 8
        description: >-
          Exchange the authorization code for provider tokens using the config and the state's
          redirectUri, receiving a redacted provider response summary
        type: call
        targetComponent: identity_provider_adapter
        targetMethod: exchangeCode
      - stepNumber: 9
        description: >-
          Verify the provider metadata and resolve it to a Wairon PrincipalSubject (issuer +
          external subject), without leaking raw provider tokens
        type: call
        targetComponent: identity_provider_adapter
        targetMethod: resolveSubject
      - stepNumber: 10
        description: >-
          Read the verified id_token's groups claim from the redacted provider summary (meaningful
          only now — after resolveSubject verified the same summary)
        type: call
        targetComponent: identity_provider_adapter
        targetMethod: resolveGroups
      - stepNumber: 11
        description: >-
          Decide the SSO-admin membership: in the admin group exactly when the verified groups
          intersect the provider's configured adminGroupClaims (an unset or empty adminGroupClaims
          never matches)
        type: local
      - stepNumber: 12
        description: Look up the hosted user by the resolved subject's issuer and external subject id
        type: call
        targetComponent: user_repository
        targetMethod: findByExternalSubject
      - stepNumber: 13
        description: >-
          If no hosted user matched the resolved external subject, provision one; otherwise skip to
          minting
        type: branch
        condition: no hosted user matched the resolved external subject
        onFalseStep: 16
      - stepNumber: 14
        description: >-
          Build a new active HostedUserRecord for the resolved subject — first-login provisioning:
          status active, createdAt now, displayName + email read from the verified id_token claims
          (name/preferred_username and email, when present), roleBindings = a binding to the
          built-in 'sso-admin' role at instance scope when in the admin group, otherwise empty (an
          admin assigns roles/permissions afterwards). The sso-admin role grants project:admin +
          project:create instance-wide, never *:*.
        type: local
      - stepNumber: 15
        description: Persist the newly provisioned first-login user record through the user repository
        type: call
        targetComponent: user_repository
        targetMethod: upsert
      - stepNumber: 16
        description: >-
          Reject re-login for a deactivated user before minting: if the hosted user resolved for
          this login is not 'active', deny (a freshly provisioned first-login record is always
          active, so only an existing deactivated user is rejected here)
        type: branch
        condition: the resolved hosted user's status is not 'active'
        onFalseStep: 18
      - stepNumber: 17
        description: Reject the re-login of a deactivated user
        type: throw
        error: deactivated user may not re-login
      - stepNumber: 18
        description: >-
          If the user's stored profile or bindings are stale, refresh them; otherwise skip the
          refresh. Stale when the roleBindings disagree with the SSO-admin membership decided from
          the verified groups claim (in the admin group but missing the sso-admin binding, or out of
          the group but still carrying it), OR the verified id_token now reports a different
          displayName/email than the stored record.
        type: branch
        condition: >-
          the user's stored profile or bindings are stale (roleBindings disagree with the SSO-admin
          membership, or the verified displayName/email differ from the stored record)
        onTrueStep: 19
        onFalseStep: 20
      - stepNumber: 19
        description: >-
          Persist the refreshed record through the user repository: add the built-in sso-admin role
          binding on entry into the admin group and drop it on exit, and update displayName/email to
          the latest verified claims (server-driven; sso-admin grants project:admin + project:create
          instance-wide, never *:* — the reservation is preserved).
        type: call
        targetComponent: user_repository
        targetMethod: upsert
      - stepNumber: 20
        description: >-
          Resolve the effective user record (the freshly provisioned record on first login,
          otherwise the existing match with the binding refresh applied) and mint a user-bound
          token: generate a cryptographically random token, compute its salted hash, and build the
          ApiKeyRecord (keyHash, ownerSubject = the resolved user's subject, createdBySubject = the
          resolved user's subject, projects = '*' so the token acts as the user across their
          accessible projects with the resolver gating per project, createdAt now); the token
          carries NO grants — the auth specialist resolves the owner's permissionSubject live from
          roleBindings + assignments.
        type: local
      - stepNumber: 21
        description: Persist only the hashed credential record
        type: call
        targetComponent: credential_registry
        targetMethod: create
      - stepNumber: 22
        description: Append a redacted audit event without letting a failure fail the login
        type: try
        endStep: 24
        catches:
          - error: audit append failure
            step: 25
      - stepNumber: 23
        description: >-
          Append the redacted sso.login audit event (security level) under the active retention
          policy
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 24
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 26
      - stepNumber: 25
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 26
        description: Return the plaintext user-bound token (shown exactly once)
        type: return
        outcome: plaintext token returned once
  - name: mintSelfToken
    narrative: []
    detail: intent
    intent: >-
      Authenticate the caller (ws_ session or token) to the calling principal via the auth
      specialist. Mint a token OWNED BY the caller (ownerSubject and createdBySubject = the
      principal's subject) narrowed to exactly one project (projects = [projectId]); the token
      carries NO grants — it acts as the caller's OWN live permission on that project, so the
      resolver gates read vs write at use time and the token can never exceed the caller's access
      (self-scoped, so key:manage is neither required nor consulted). The write flag is advisory
      (token label only). Persist only the hashed record through the credential registry, append a
      best-effort redacted token.mint.self (security) audit event, and return the plaintext exactly
      once. Because the token is owned by the caller, a later deactivation of that user revokes it
      via revokeAllForOwner.
  - name: listSelfTokens
    narrative: []
    detail: intent
    intent: >-
      Authenticate the caller credential to the calling principal, list the principal's own
      credential records through the credential registry (listByOwner on the principal's subject
      user id), and return them redacted: each carries the hashed token (never plaintext) with its
      id, authorized project, label, createdAt and revokedAt, so the client can show a user their
      agent tokens and offer revoke. A read; not audited.
  - name: revokeSelfToken
    narrative: []
    detail: intent
    intent: >-
      Authenticate the caller credential to the calling principal, fetch the principal's own tokens
      (listByOwner) and confirm tokenId is among them (a token the caller does not own is rejected
      as not found, so there is no cross-user revocation and no key:manage escalation), then revoke
      it through the credential registry and append a best-effort redacted token.revoke.self
      (security) audit event.
  - name: listUsers
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: >-
          Compute the caller's project:admin visible scopes over the organization tree (the units
          they may administer)
        type: call
        targetComponent: authorization_specialist
        targetMethod: visibleScopes
      - stepNumber: 3
        description: If the caller has no actionable unit scope, deny
        type: branch
        condition: the caller has no actionable unit scope in the visible set
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the listing
        type: throw
        error: Forbidden — user administration required
      - stepNumber: 5
        description: >-
          List hosted users through the repository, optionally narrowed by status (the user store
          owns NO project filter — membership is a grid question)
        type: call
        targetComponent: user_repository
        targetMethod: list
      - stepNumber: 6
        description: >-
          If a caller-supplied project filter is present, resolve its holders from the permission
          grid; otherwise skip to the scope filter
        type: branch
        condition: a caller-supplied project filter is present
        onFalseStep: 8
      - stepNumber: 7
        description: >-
          List the DIRECT user assignments at that project scope through the permission repository
          and narrow the listing to those subject ids (user records carry no project reference of
          their own)
        type: call
        targetComponent: permission_repository
        targetMethod: listAssignments
      - stepNumber: 8
        description: >-
          Filter the returned users to those whose home unit is an actionable unit in the visible
          set (an instance-admin keeps every user), intersected with the grid-resolved project
          holders when a project filter was supplied
        type: local
      - stepNumber: 9
        description: Return the hosted user records filtered to the caller's scope
        type: return
        outcome: scoped hosted user records
    detail: full
  - name: setUserStatus
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Look up the target user by id to read its home unit and existence
        type: call
        targetComponent: user_repository
        targetMethod: getById
      - stepNumber: 3
        description: If no user matches userId, reject as not found
        type: branch
        condition: no user matches userId
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject as not found
        type: throw
        error: not found
      - stepNumber: 5
        description: Resolve the caller's project:admin permission over the target user's home unit
        type: call
        targetComponent: authorization_specialist
        targetMethod: authorize
      - stepNumber: 6
        description: If the effective project:admin value is not yes, deny
        type: branch
        condition: the effective project:admin value is not yes
        onTrueStep: 7
        onFalseStep: 8
      - stepNumber: 7
        description: Reject the user administration
        type: throw
        error: Forbidden — user administration requires project:admin over the target user's home unit
      - stepNumber: 8
        description: Set the user's lifecycle status through the repository
        type: call
        targetComponent: user_repository
        targetMethod: setStatus
      - stepNumber: 9
        description: >-
          If the new status is not 'active' (a deactivation), revoke the user's credentials and
          sessions; an active status skips to the audit
        type: branch
        condition: the new status is not 'active'
        onTrueStep: 10
        onFalseStep: 12
      - stepNumber: 10
        description: >-
          Revoke every non-revoked credential owned by the user so existing tokens can no longer
          authenticate, capturing the revoked count
        type: call
        targetComponent: credential_registry
        targetMethod: revokeAllForOwner
      - stepNumber: 11
        description: >-
          Revoke every one of the user's browser sessions too, so a deactivation invalidates live
          web sessions, capturing the revoked-session count
        type: call
        targetComponent: web_session_repository
        targetMethod: removeAllForSubject
      - stepNumber: 12
        description: Append the audit event without letting a failure fail the status change
        type: try
        endStep: 14
        catches:
          - error: audit append failure
            step: 15
      - stepNumber: 13
        description: >-
          Append the redacted user.deactivate (security, with revoked counts) or user.status.set
          (info) audit event under the active retention policy
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 14
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 16
      - stepNumber: 15
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 16
        description: Return the updated user record
        type: return
        outcome: updated user record
    detail: full
  - name: queryAuditEvents
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Compute the caller's project:admin visible scopes over the organization tree
        type: call
        targetComponent: authorization_specialist
        targetMethod: visibleScopes
      - stepNumber: 3
        description: If the caller has no actionable project scope, deny
        type: branch
        condition: the caller has no actionable project scope in the visible set
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the audit read
        type: throw
        error: Forbidden — audit read access required
      - stepNumber: 5
        description: >-
          Constrain the audit query to the caller's actionable project scopes (an instance-admin
          leaves it unconstrained — instance-wide audit read)
        type: local
      - stepNumber: 6
        description: Return redacted audit events matching the scoped query
        type: call
        targetComponent: audit_repository
        targetMethod: query
      - stepNumber: 7
        description: Return the redacted audit events scoped to the caller
        type: return
        outcome: redacted audit events
    detail: full
  - name: countAuditEvents
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Compute the caller's project:admin visible scopes over the organization tree
        type: call
        targetComponent: authorization_specialist
        targetMethod: visibleScopes
      - stepNumber: 3
        description: If the caller has no actionable project scope, deny
        type: branch
        condition: the caller has no actionable project scope in the visible set
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the audit read
        type: throw
        error: Forbidden — audit read access required
      - stepNumber: 5
        description: >-
          Constrain the audit query to the caller's actionable project scopes (an instance-admin
          leaves it unconstrained)
        type: local
      - stepNumber: 6
        description: Count redacted audit events matching the scoped query through the audit repository
        type: call
        targetComponent: audit_repository
        targetMethod: count
      - stepNumber: 7
        description: Return the audit event count scoped to the caller
        type: return
        outcome: audit event count
    detail: full
  - name: upsertUser
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: >-
          Look up any existing user record by id to distinguish creation from update and to read its
          current home unit
        type: call
        targetComponent: user_repository
        targetMethod: getById
      - stepNumber: 3
        description: >-
          Resolve the caller's project:admin permission over the target user's home unit (the
          incoming record's, or the existing record's on update)
        type: call
        targetComponent: authorization_specialist
        targetMethod: authorize
      - stepNumber: 4
        description: If the effective project:admin value is not yes, deny
        type: branch
        condition: the effective project:admin value is not yes
        onTrueStep: 5
        onFalseStep: 6
      - stepNumber: 5
        description: Reject the user administration
        type: throw
        error: Forbidden — user administration requires project:admin over the target user's home unit
      - stepNumber: 6
        description: >-
          Check the target record's subject id against the reserved built-in subject ids (the
          persisted boot-reserved UUIDs and the legacy 'builtin:*' literals)
        type: call
        targetComponent: auth_specialist
        targetMethod: isReservedSubject
      - stepNumber: 7
        description: If the target subject id is reserved, reject
        type: branch
        condition: the target record's subject id is reserved
        onTrueStep: 8
        onFalseStep: 9
      - stepNumber: 8
        description: Reject the reserved subject id
        type: throw
        error: >-
          Forbidden — the built-in subject ids are reserved and can never be claimed by a user
          record
      - stepNumber: 9
        description: >-
          Build the redacted audit event with action user.create when no record existed, or
          user.update otherwise
        type: local
      - stepNumber: 10
        description: >-
          Create or update the hosted user (subject, status, home unit, roleBindings) through the
          repository
        type: call
        targetComponent: user_repository
        targetMethod: upsert
      - stepNumber: 11
        description: Append the audit event without letting a failure fail the upsert
        type: try
        endStep: 13
        catches:
          - error: audit append failure
            step: 14
      - stepNumber: 12
        description: >-
          Append the redacted user.create or user.update audit event under the active retention
          policy
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 13
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 15
      - stepNumber: 14
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 15
        description: Return the stored user record
        type: return
        outcome: stored user record
    detail: full
  - name: mintToken
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential to the calling principal
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Look up the token's owner user by request.ownerUserId to confirm existence and read status
        type: call
        targetComponent: user_repository
        targetMethod: getById
      - stepNumber: 3
        description: If no user matches request.ownerUserId, reject as not found
        type: branch
        condition: no user matches request.ownerUserId
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject minting for an unknown owner
        type: throw
        error: unknown owner user
      - stepNumber: 5
        description: >-
          If the owner user's status is not 'active', reject — a fresh token must never revive a
          deactivated user whose credentials were revoked at deactivation
        type: branch
        condition: the owner user's status is not 'active'
        onTrueStep: 6
        onFalseStep: 7
      - stepNumber: 6
        description: Reject minting a token for a deactivated user
        type: throw
        error: cannot mint a token for a deactivated user
      - stepNumber: 7
        description: >-
          If the caller is not an instance admin (permissionSubject.instanceAdmin is false), deny —
          the minted token acts as the OWNER's live permission, which may exceed a non-super-admin
          minter's own authority (confused deputy); only the env-anchored instance-admin dominates
          every owner
        type: branch
        condition: the caller is not an instance admin (permissionSubject.instanceAdmin is false)
        onTrueStep: 8
        onFalseStep: 9
      - stepNumber: 8
        description: Reject minting a token on behalf of another user without instance-admin
        type: throw
        error: >-
          Forbidden — minting a token for another user requires instance-admin; delegated minting
          bounded by the minter's own scope is a future enhancement, and a user mints their own
          single-project tokens via mintSelfToken
      - stepNumber: 9
        description: >-
          Generate a cryptographically random token, compute its salted hash, and build the
          ApiKeyRecord (keyHash, ownerSubject = the owner user's subject, createdBySubject = the
          caller's subject, projects = request.projects narrowing, createdAt now, optional
          expiresAt); the token carries NO grants — within its narrowing it acts as the owner's live
          permission and the resolver gates per project
        type: local
      - stepNumber: 10
        description: Persist only the hashed credential record
        type: call
        targetComponent: credential_registry
        targetMethod: create
      - stepNumber: 11
        description: Append a redacted audit event without letting a failure fail the mint
        type: try
        endStep: 13
        catches:
          - error: audit append failure
            step: 14
      - stepNumber: 12
        description: >-
          Append the redacted token.mint audit event (security level) under the active retention
          policy
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 13
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 15
      - stepNumber: 14
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 15
        description: Return the plaintext token (shown exactly once)
        type: return
        outcome: plaintext token returned once
    detail: full
  - name: pruneAuditEvents
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: >-
          Resolve the caller's project:admin permission over instance scope (the env-anchored
          instance-admin passes via bypass; a delegated project:admin@instance also passes)
        type: call
        targetComponent: authorization_specialist
        targetMethod: authorize
      - stepNumber: 3
        description: If the effective project:admin value is not yes, deny
        type: branch
        condition: the effective project:admin value is not yes
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the audit administration
        type: throw
        error: Forbidden — audit administration requires instance-wide project:admin
      - stepNumber: 5
        description: >-
          Resolve the active AuditRetentionPolicy from the host config, using the secure default
          policy when unset
        type: local
      - stepNumber: 6
        description: Apply the retention policy and delete expired audit events
        type: call
        targetComponent: audit_repository
        targetMethod: prune
      - stepNumber: 7
