id: identity_orchestrator_impl
name: Identity Orchestrator Implementation
description: >-
  Hosted identity control-plane workflows: authenticate the caller credential, gather organization
  data and resolve authorization scope (instance-wide or unit-scoped), then manage user-bound
  MCP/API tokens, user grants, identity-provider (SSO) configuration, and admin-only audit access;
  plus the unauthenticated headless SSO login pair. Audit appends are best-effort and never fail the
  primary action.
contract: iidentity_orchestrator
sourcePath: src/server/identity.ts
methods:
  - name: mintToken
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential (bootstrap or user-bound token)
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Gather all organization units to expand any unit-scoped delegation authority
        type: call
        targetComponent: organization_repository
        targetMethod: listUnits
      - stepNumber: 3
        description: Gather all project placements to map in-scope units to their hosted projects
        type: call
        targetComponent: organization_repository
        targetMethod: listPlacements
      - stepNumber: 4
        description: >-
          Deny the delegation unless the caller may delegate every requested grant: the caller lacks
          an instance-wide admin grant AND, for some requested grant in request.grants and some
          permission it carries, the caller's authorization scope for that permission — resolved via
          scope_specialist.resolveScope(principal.grants, that permission, the gathered units, the
          gathered placements), which expands the caller's unit-scoped grants across each unit's
          recursive subtree — does not cover the requested grant's target: a requested specific
          projectId must appear in that scope's projectIds and a requested orgUnitId must appear in
          that scope's unitIds. Holding key:manage alone never suffices to delegate arbitrary
          permissions.
        type: branch
        condition: >-
          the caller lacks an instance-wide admin grant and, for some requested (target, permission)
          in request.grants, the caller's resolved scope for that permission does not cover the
          requested target project or unit
        onTrueStep: 5
        onFalseStep: 6
      - stepNumber: 5
        description: Reject the delegation
        type: throw
        error: Forbidden — caller may not delegate the requested grants
      - stepNumber: 6
        description: List hosted projects to validate the request
        type: call
        targetComponent: project_registry
        targetMethod: list
      - stepNumber: 7
        description: >-
          Verify that every specific projectId referenced in request.grants exists among the known
          projects and every orgUnitId referenced exists among the gathered units
        type: local
      - stepNumber: 8
        description: If any requested project id or org unit id is unknown, reject
        type: branch
        condition: a requested project id or org unit id is unknown
        onTrueStep: 9
        onFalseStep: 10
      - stepNumber: 9
        description: Reject the unknown project or unit
        type: throw
        error: unknown project or organization unit
      - stepNumber: 10
        description: Generate a cryptographically random token and compute its salted hash
        type: local
      - stepNumber: 11
        description: >-
          Build the ApiKeyRecord (hashed token, ownerSubject from the request, createdBySubject from
          the actor principal, grants, label, expiresAt, plus the role/projects compatibility
          projection derived from the grants)
        type: local
      - stepNumber: 12
        description: Persist the credential record
        type: call
        targetComponent: credential_registry
        targetMethod: create
      - stepNumber: 13
        description: Append a redacted audit event without letting a failure fail the mint
        type: try
        endStep: 15
        catches:
          - error: audit append failure
            step: 16
      - stepNumber: 14
        description: Append the redacted token.mint audit event under the active retention policy
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 15
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 17
      - stepNumber: 16
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 17
        description: Return the plaintext token (shown exactly once)
        type: return
        outcome: plaintext token returned once
  - name: replaceUserGrants
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Gather all organization units to resolve the caller's user-administration scope
        type: call
        targetComponent: organization_repository
        targetMethod: listUnits
      - stepNumber: 3
        description: Gather all project placements
        type: call
        targetComponent: organization_repository
        targetMethod: listPlacements
      - stepNumber: 4
        description: Resolve the caller's user:admin scope over the organization tree
        type: call
        targetComponent: scope_specialist
        targetMethod: resolveScope
      - stepNumber: 5
        description: Look up the existing user record by id to determine its current home unit
        type: call
        targetComponent: user_repository
        targetMethod: getById
      - stepNumber: 6
        description: If no user matches userId, reject as not found
        type: branch
        condition: no user matches userId
        onTrueStep: 7
        onFalseStep: 8
      - stepNumber: 7
        description: Reject as not found
        type: throw
        error: not found
      - stepNumber: 8
        description: >-
          Deny unless the caller's scope permits this grant replacement: scope.all is false AND
          either (a) the target user's home unitId is missing or not in scope.unitIds, or (b) the
          incoming grants would exceed the caller's own authority — they include an instance-wide
          '*' grant, or any project/unit outside the caller's scope for the permissions being
          granted (privilege-escalation guard). A super-admin (scope.all) bypasses both checks.
        type: branch
        condition: >-
          scope.all is false and (the target user's home unit is outside scope.unitIds, or the
          incoming grants exceed the caller's own scoped authority)
        onTrueStep: 9
        onFalseStep: 10
      - stepNumber: 9
        description: Reject the grant administration
        type: throw
        error: >-
          Forbidden — grant administration requires scope over the target user's home unit and may
          not exceed the caller's own authority
      - stepNumber: 10
        description: Replace the user's grants wholesale through the repository
        type: call
        targetComponent: user_repository
        targetMethod: replaceGrants
      - stepNumber: 11
        description: Append a redacted audit event without letting a failure fail the grant replacement
        type: try
        endStep: 13
        catches:
          - error: audit append failure
            step: 14
      - stepNumber: 12
        description: Append the redacted user.grants.replace audit event under the active retention policy
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 13
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 15
      - stepNumber: 14
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 15
        description: Return the updated user record
        type: return
        outcome: updated user record
  - name: listUsers
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Gather all organization units to resolve the caller's user-administration scope
        type: call
        targetComponent: organization_repository
        targetMethod: listUnits
      - stepNumber: 3
        description: Gather all project placements
        type: call
        targetComponent: organization_repository
        targetMethod: listPlacements
      - stepNumber: 4
        description: Resolve the caller's user:admin scope over the organization tree
        type: call
        targetComponent: scope_specialist
        targetMethod: resolveScope
      - stepNumber: 5
        description: >-
          If the caller has no user-administration scope (scope.all is false and the scope is empty
          — no in-scope units and no in-scope projects), deny
        type: branch
        condition: scope.all is false and the scope is empty (no in-scope units and no in-scope projects)
        onTrueStep: 6
        onFalseStep: 7
      - stepNumber: 6
        description: Reject the listing
        type: throw
        error: Forbidden — user administration required
      - stepNumber: 7
        description: List hosted users, optionally narrowed to one project's grant holders
        type: call
        targetComponent: user_repository
        targetMethod: list
      - stepNumber: 8
        description: >-
          When scope.all is false, filter the returned users to those whose home unitId is in the
          caller's in-scope units (scope.unitIds); when scope.all is true, keep every user. Honor
          any optional project narrowing already applied.
        type: local
      - stepNumber: 9
        description: Return the hosted user records filtered to the caller's scope
        type: return
        outcome: scoped hosted user records
  - name: queryAuditEvents
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Gather all organization units to resolve the caller's audit-read scope
        type: call
        targetComponent: organization_repository
        targetMethod: listUnits
      - stepNumber: 3
        description: Gather all project placements
        type: call
        targetComponent: organization_repository
        targetMethod: listPlacements
      - stepNumber: 4
        description: Resolve the caller's audit:read scope over the organization tree
        type: call
        targetComponent: scope_specialist
        targetMethod: resolveScope
      - stepNumber: 5
        description: >-
          If the caller has no audit-read scope (scope.all is false and the scope is empty — no
          in-scope projects and no in-scope units), deny
        type: branch
        condition: scope.all is false and the scope is empty (no in-scope projects and no in-scope units)
        onTrueStep: 6
        onFalseStep: 7
      - stepNumber: 6
        description: Reject the audit read
        type: throw
        error: Forbidden — audit read access required
      - stepNumber: 7
        description: >-
          When scope.all is false, constrain the audit query to the caller's in-scope projects
          (scope.projectIds); when scope.all is true, leave the query unconstrained (instance-wide
          audit read)
        type: local
      - stepNumber: 8
        description: Return redacted audit events matching the scoped query
        type: call
        targetComponent: audit_repository
        targetMethod: query
      - stepNumber: 9
        description: Return the redacted audit events scoped to the caller
        type: return
        outcome: redacted audit events
  - name: countAuditEvents
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Gather all organization units to resolve the caller's audit-read scope
        type: call
        targetComponent: organization_repository
        targetMethod: listUnits
      - stepNumber: 3
        description: Gather all project placements
        type: call
        targetComponent: organization_repository
        targetMethod: listPlacements
      - stepNumber: 4
        description: Resolve the caller's audit:read scope over the organization tree
        type: call
        targetComponent: scope_specialist
        targetMethod: resolveScope
      - stepNumber: 5
        description: If the caller has no audit-read scope (scope.all is false and the scope is empty), deny
        type: branch
        condition: scope.all is false and the scope is empty (no in-scope projects and no in-scope units)
        onTrueStep: 6
        onFalseStep: 7
      - stepNumber: 6
        description: Reject the audit read
        type: throw
        error: Forbidden — audit read access required
      - stepNumber: 7
        description: >-
          When scope.all is false, constrain the audit query to the caller's in-scope projects
          (scope.projectIds); when scope.all is true, leave the query unconstrained
        type: local
      - stepNumber: 8
        description: Count redacted audit events matching the scoped query through the audit repository
        type: call
        targetComponent: audit_repository
        targetMethod: count
      - stepNumber: 9
        description: Return the audit event count scoped to the caller
        type: return
        outcome: audit event count
  - name: upsertUser
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Gather all organization units to resolve the caller's user-administration scope
        type: call
        targetComponent: organization_repository
        targetMethod: listUnits
      - stepNumber: 3
        description: Gather all project placements
        type: call
        targetComponent: organization_repository
        targetMethod: listPlacements
      - stepNumber: 4
        description: Resolve the caller's user:admin scope over the organization tree
        type: call
        targetComponent: scope_specialist
        targetMethod: resolveScope
      - stepNumber: 5
        description: >-
          Look up any existing user record by id to distinguish creation from update and to read its
          current home unit
        type: call
        targetComponent: user_repository
        targetMethod: getById
      - stepNumber: 6
        description: >-
          Deny unless the caller's scope permits the target user's home unit: scope.all is false AND
          either the incoming record's home unitId is missing or not in scope.unitIds, or (when
          updating an existing user) the existing user's home unitId is not in scope.unitIds. A
          super-admin (scope.all) bypasses the check.
        type: branch
        condition: >-
          scope.all is false and the target user's home unit (incoming record, or existing record on
          update) is missing or outside scope.unitIds
        onTrueStep: 7
        onFalseStep: 8
      - stepNumber: 7
        description: Reject the user administration
        type: throw
        error: Forbidden — user administration requires scope over the target user's home unit
      - stepNumber: 8
        description: >-
          Build the redacted audit event with action user.create when no record existed, or
          user.update otherwise
        type: local
      - stepNumber: 9
        description: Create or update the hosted user through the repository
        type: call
        targetComponent: user_repository
        targetMethod: upsert
      - stepNumber: 10
        description: Append the audit event without letting a failure fail the upsert
        type: try
        endStep: 12
        catches:
          - error: audit append failure
            step: 13
      - stepNumber: 11
        description: >-
          Append the redacted user.create or user.update audit event under the active retention
          policy
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 12
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 14
      - stepNumber: 13
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 14
        description: Return the stored user record
        type: return
        outcome: stored user record
  - name: setUserStatus
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Gather all organization units to resolve the caller's user-administration scope
        type: call
        targetComponent: organization_repository
        targetMethod: listUnits
      - stepNumber: 3
        description: Gather all project placements
        type: call
        targetComponent: organization_repository
        targetMethod: listPlacements
      - stepNumber: 4
        description: Resolve the caller's user:admin scope over the organization tree
        type: call
        targetComponent: scope_specialist
        targetMethod: resolveScope
      - stepNumber: 5
        description: Look up the target user by id to read its home unit
        type: call
        targetComponent: user_repository
        targetMethod: getById
      - stepNumber: 6
        description: If no user matches userId, reject as not found
        type: branch
        condition: no user matches userId
        onTrueStep: 7
        onFalseStep: 8
      - stepNumber: 7
        description: Reject as not found
        type: throw
        error: not found
      - stepNumber: 8
        description: >-
          Deny unless the caller's scope permits the target user's home unit: scope.all is false and
          the user's home unitId is missing or not in scope.unitIds. A super-admin (scope.all)
          bypasses the check.
        type: branch
        condition: scope.all is false and the target user's home unit is missing or outside scope.unitIds
        onTrueStep: 9
        onFalseStep: 10
      - stepNumber: 9
        description: Reject the user administration
        type: throw
        error: Forbidden — user administration requires scope over the target user's home unit
      - stepNumber: 10
        description: Set the user's lifecycle status through the repository
        type: call
        targetComponent: user_repository
        targetMethod: setStatus
      - stepNumber: 11
        description: >-
          If the new status is not 'active' (a deactivation), revoke all of the user's credentials
          before auditing; an active status skips straight to the audit append
        type: branch
        condition: the new status is not 'active'
        onTrueStep: 12
        onFalseStep: 13
      - stepNumber: 12
        description: >-
          Revoke every non-revoked credential owned by the user so existing tokens can no longer
          authenticate, capturing the revoked count for the audit event
        type: call
        targetComponent: credential_registry
        targetMethod: revokeAllForOwner
      - stepNumber: 13
        description: Append the audit event without letting a failure fail the status change
        type: try
        endStep: 15
        catches:
          - error: audit append failure
            step: 16
      - stepNumber: 14
        description: >-
          Append the redacted audit event under the active retention policy — action
          'user.deactivate' at security level (including the revoked-token count) when the status
          change deactivated the user, otherwise 'user.status.set' at info level
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 15
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 17
      - stepNumber: 16
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 17
        description: Return the updated user record
        type: return
        outcome: updated user record
  - name: revokeToken
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: >-
          If the caller's grants cover neither key:manage for the token's scope nor an instance-wide
          admin grant, deny
        type: branch
        condition: >-
          the caller's grants cover neither key:manage for the token's scope nor an instance-wide
          admin grant
        onFalseStep: 4
      - stepNumber: 3
        description: Reject the revocation
        type: throw
        error: Forbidden — caller may not manage this token
      - stepNumber: 4
        description: Revoke the credential record by token id
        type: call
        targetComponent: credential_registry
        targetMethod: revoke
      - stepNumber: 5
        description: Append a redacted audit event without letting a failure fail the revoke
        type: try
        endStep: 7
        catches:
          - error: audit append failure
            step: 8
      - stepNumber: 6
        description: Append the redacted token.revoke audit event under the active retention policy
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 7
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 9
      - stepNumber: 8
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 9
        description: Return once revoked
        type: return
        outcome: revoked
  - name: pruneAuditEvents
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: If the caller lacks an instance-wide admin grant, deny
        type: branch
        condition: the caller lacks an instance-wide admin grant
        onFalseStep: 4
      - stepNumber: 3
        description: Reject the audit administration
        type: throw
        error: Forbidden — audit administration requires an instance-wide admin grant
      - stepNumber: 4
        description: >-
          Resolve the active AuditRetentionPolicy from the host config, using the secure default
          policy when unset
        type: local
      - stepNumber: 5
        description: Apply the retention policy and delete expired audit events
        type: call
        targetComponent: audit_repository
        targetMethod: prune
      - stepNumber: 6
        description: Append a redacted audit event without letting a failure fail the prune
        type: try
        endStep: 8
        catches:
          - error: audit append failure
            step: 9
      - stepNumber: 7
        description: Append the redacted audit.prune audit event under the active retention policy
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 8
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 10
      - stepNumber: 9
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 10
        description: Return the number of events removed
        type: return
        outcome: removed count
  - name: startSsoLogin
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the configured identity providers through the policy repository (no caller
          credential — starting a login is unauthenticated by nature)
        type: call
        targetComponent: policy_repository
        targetMethod: listIdentityProviders
      - stepNumber: 2
        description: >-
          Select the identity-provider configuration whose id is providerId from the listed
          providers
        type: local
      - stepNumber: 3
        description: If the selected provider is unknown or not enabled, reject
        type: branch
        condition: the selected provider is unknown or not enabled
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the login start for an unknown or disabled provider
        type: throw
        error: unknown or disabled identity provider
      - stepNumber: 5
        description: Generate a cryptographically random nonce for this login attempt
        type: local
      - stepNumber: 6
        description: >-
          Sign an SSO state binding providerId, the nonce, and redirectUri via the single signing
          authority
        type: call
        targetComponent: auth_specialist
        targetMethod: signSsoState
      - stepNumber: 7
        description: Build the provider authorization URL from the config, the signed state, and redirectUri
        type: call
        targetComponent: identity_provider_adapter
        targetMethod: buildAuthorizationUrl
      - stepNumber: 8
        description: Append a redacted audit event without letting a failure fail the login start
        type: try
        endStep: 10
        catches:
          - error: audit append failure
            step: 11
      - stepNumber: 9
        description: Append the redacted sso.start audit event (info level) under the active retention policy
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 10
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 12
      - stepNumber: 11
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 12
        description: Return the provider authorization URL
        type: return
        outcome: authorization URL
  - name: completeSsoLogin
    narrative:
      - stepNumber: 1
        description: >-
          Verify the signed SSO state via the single signing authority — a tampered or expired state
          is rejected; the original payload is returned (no caller credential — trust derives from
          the signed state and the code exchange)
        type: call
        targetComponent: auth_specialist
        targetMethod: verifySsoState
      - stepNumber: 2
        description: Parse the verified state payload into providerId, nonce, and redirectUri
        type: local
      - stepNumber: 3
        description: Resolve the configured identity providers through the policy repository
        type: call
        targetComponent: policy_repository
        targetMethod: listIdentityProviders
      - stepNumber: 4
        description: Select the identity-provider configuration whose id is the state's providerId
        type: local
      - stepNumber: 5
        description: If the selected provider is unknown or not enabled, reject
        type: branch
        condition: the selected provider is unknown or not enabled
        onFalseStep: 7
      - stepNumber: 6
        description: Reject the callback for an unknown or disabled provider
        type: throw
        error: unknown or disabled identity provider
      - stepNumber: 7
        description: >-
          Exchange the authorization code for provider tokens using the config and the state's
          redirectUri, receiving a redacted provider response summary
        type: call
        targetComponent: identity_provider_adapter
        targetMethod: exchangeCode
      - stepNumber: 8
        description: >-
          Verify the provider metadata and resolve it to a Wairon PrincipalSubject (issuer +
          external subject), without leaking raw provider tokens
        type: call
        targetComponent: identity_provider_adapter
        targetMethod: resolveSubject
      - stepNumber: 9
        description: Look up the hosted user by the resolved subject's issuer and external subject id
        type: call
        targetComponent: user_repository
        targetMethod: findByExternalSubject
      - stepNumber: 10
        description: >-
          If no hosted user matched the resolved external subject, provision one; otherwise skip to
          minting
        type: branch
        condition: no hosted user matched the resolved external subject
        onFalseStep: 13
      - stepNumber: 11
        description: >-
          Build a new active HostedUserRecord for the resolved subject — first-login provisioning:
          status active, empty grants (an admin assigns grants afterwards), createdAt now
        type: local
      - stepNumber: 12
        description: Persist the newly provisioned first-login user record through the user repository
        type: call
        targetComponent: user_repository
        targetMethod: upsert
      - stepNumber: 13
        description: >-
          Reject re-login for a deactivated user before minting: if the hosted user resolved for
          this login is not 'active', deny (a freshly provisioned first-login record is always
          active, so only an existing deactivated user is rejected here)
        type: branch
        condition: the resolved hosted user's status is not 'active'
        onFalseStep: 15
      - stepNumber: 14
        description: Reject the re-login of a deactivated user
        type: throw
        error: deactivated user may not re-login
      - stepNumber: 15
        description: >-
          Resolve the effective user record (the freshly provisioned record on first login,
          otherwise the existing match) and mint a user-bound token: generate a cryptographically
          random token, compute its salted hash, and build the ApiKeyRecord (keyHash, ownerSubject =
          the resolved user's subject, createdBySubject = the resolved user's subject, grants = the
          resolved user's current grants, createdAt now, plus the role/projects compatibility
          projection derived from the grants)
        type: local
      - stepNumber: 16
        description: Persist only the hashed credential record
        type: call
        targetComponent: credential_registry
        targetMethod: create
      - stepNumber: 17
        description: Append a redacted audit event without letting a failure fail the login
        type: try
        endStep: 19
        catches:
          - error: audit append failure
            step: 20
      - stepNumber: 18
        description: >-
          Append the redacted sso.login audit event (security level) under the active retention
          policy
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 19
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 21
      - stepNumber: 20
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 21
        description: Return the plaintext user-bound token (shown exactly once)
        type: return
        outcome: plaintext token returned once
  - name: listIdentityProviders
    narrative:
      - stepNumber: 1
