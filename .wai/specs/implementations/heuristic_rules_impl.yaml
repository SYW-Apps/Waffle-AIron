id: heuristic_rules_impl
name: Heuristic Rules Implementation
description: >-
  The heuristic rule family - coupling health, target language, technology boundaries, naming
  conventions, and complexity/metadata - implemented under src/core/rules/heuristic/.
contract: iheuristic_rules
simPath: tests/core/validation.test.ts
methods:
  - name: couplingHealth
    sourcePath: src/core/rules/heuristic/coupling-health.ts
    narrative:
      - stepNumber: 1
        description: >-
          Initialize subsystemDeps (Map<subsystemId, Set<peerSubsystemId>>) and exampleEdge
          (Map<'from->to', 'compId → depId'>) to build the cross-subsystem dependency graph from
          component-level dependsOn edges.
        type: local
      - stepNumber: 2
        label: compLoop
        description: For each component, fold its dependsOn edges into the subsystem-level dependency graph.
        type: loop
        loopKind: forEach
        over: ctx.components
        endStep: 3
      - stepNumber: 3
        label: buildEdge
        description: >-
          For each depId in comp.dependsOn: resolve dep = ctx.componentMap.get(depId); when dep
          exists and dep.subsystem differs from comp.subsystem, add dep.subsystem to
          subsystemDeps.get(comp.subsystem) and, when the exampleEdge entry for
          'comp.subsystem->dep.subsystem' is not yet set, record it as 'comp.id → dep.id' (skip a
          missing dep or a same-subsystem dependency).
        type: local
      - stepNumber: 4
        description: >-
          Initialize sanctionedPairs (a Set of unordered subsystem-pair keys via pairKey(a,b) =
          [a,b].sort().join('<->')) and declaredPeers (Map<subsystemId, Set<peerId>>) for the
          trustedLinks index.
        type: local
      - stepNumber: 5
        label: subLoop
        description: For each subsystem, validate every trustedLinks entry it declares.
        type: loop
        loopKind: forEach
        over: ctx.subsystems
        endStep: 12
      - stepNumber: 6
        label: linkLoop
        description: >-
          For each declared trusted link, resolve its peer and cross-check it against the dependency
          graph.
        type: loop
        loopKind: forEach
        over: sub.trustedLinks ?? []
        endStep: 12
      - stepNumber: 7
        description: >-
          Compute isDraftCtx = sub.status is 'draft' or 'design'; resolve peer by matching
          link.subsystem, or - when sub.id carries a namespace prefix via splitNamespace - its
          prefix-qualified form, against ctx.subsystems.
        type: local
      - stepNumber: 8
        label: peerGuard
        description: Branch on whether the trusted link's peer subsystem actually exists.
        type: branch
        condition: No subsystem in ctx.subsystems matches a candidate peer id (the peer is not found)
        onFalseStep: 11
      - stepNumber: 9
        description: >-
          Report INVALID_TRUSTED_LINK (error; draft context isDraftCtx) naming sub.id and the
          missing link.subsystem.
        type: local
      - stepNumber: 10
        description: Continue to the next trusted link - the invalid link cannot be cross-checked further.
        type: jump
        toStep: 6
      - stepNumber: 11
        label: recordSanctioned
        description: >-
          Add pairKey(sub.id, peer.id) to sanctionedPairs and peer.id to declaredPeers.get(sub.id);
          compute outbound = subsystemDeps.get(sub.id)?.has(peer.id) and inbound =
          subsystemDeps.get(peer.id)?.has(sub.id).
        type: local
      - stepNumber: 12
        label: unusedCheck
        description: >-
          When neither outbound nor inbound holds (no component dependency actually crosses between
          sub and peer), report UNUSED_TRUSTED_LINK (warning; draft context isDraftCtx) naming
          sub.id, peer.id and the link's reason.
        type: local
      - stepNumber: 13
        description: >-
          Initialize reported (a Set of pairKey strings) to dedupe mutual pairs already handled this
          run.
        type: local
      - stepNumber: 14
        label: fromLoop
        description: >-
          For each subsystem's outbound peer set, check every peer for a reciprocal (mutual)
          dependency.
        type: loop
        loopKind: forEach
        over: subsystemDeps entries, as [from, tos]
        endStep: 17
      - stepNumber: 15
        label: toLoop
        description: >-
          For each peer subsystem 'to' that 'from' depends on, determine whether the dependency is
          mutual and unacknowledged.
        type: loop
        loopKind: forEach
        over: tos
        endStep: 17
      - stepNumber: 16
        description: >-
          Skip this (from, to) pair unless it is mutual (subsystemDeps.get(to) also contains from);
          compute key = pairKey(from, to) and skip if key is already in reported (the mirrored (to,
          from) pair was already handled this run), otherwise mark reported.add(key); skip if key is
          already in sanctionedPairs (acknowledged via trustedLinks).
        type: local
      - stepNumber: 17
        label: reportMutual
        description: >-
          When none of the above skip conditions applied, compute isDraftCtx as both the 'from'
          subsystem and the 'to' subsystem (looked up in ctx.subsystems) being 'draft' or 'design'
          (AND, not OR), and report MUTUAL_SUBSYSTEM_DEPENDENCY (warning; draft context isDraftCtx)
          naming from, to, and the recorded example edges in both directions from exampleEdge.
        type: local
      - stepNumber: 18
        description: >-
          Define threshold(comp) = ctx.complexityConfigFor(comp.subsystem)?.maxComponentDependencies
          — the project's complexity config overlaid with the subsystem profile pack's, the value
          EXCESSIVE_DEPENDENCIES reads — defaulting to DEFAULT_GOD_COMPONENT_THRESHOLD (8) when
          unset.
        type: local
      - stepNumber: 19
        label: godLoop
        description: For each component, check its dependency fan-out against the threshold.
        type: loop
        loopKind: forEach
        over: ctx.components
        endStep: 20
      - stepNumber: 20
        label: reportGod
        description: >-
          When comp.dependsOn.length exceeds threshold(comp), report GOD_COMPONENT (warning; draft
          context ctx.isComponentDraft(comp.id)) naming comp.id, its dependency count and
          threshold(comp).
        type: local
    symbol: check
  - name: targetLanguage
    sourcePath: src/core/rules/heuristic/target-language.ts
    narrative:
      - stepNumber: 1
        description: >-
          Define markersFor(family): LANGUAGE_MARKERS[family] merged with
          ctx.ext.languages[family]?.foreignBuiltins (lowercased) when present; families = the union
          of LANGUAGE_MARKERS's keys and ctx.ext.languages's keys.
        type: local
      - stepNumber: 2
        label: intfLoop
        description: >-
          For each interface, check its methods' type references against the target language's
          builtin vocabulary.
        type: loop
        loopKind: forEach
        over: ctx.interfaces
        endStep: 16
      - stepNumber: 3
        description: >-
          Resolve comp = ctx.componentMap.get(intf.component) and lang =
          ctx.targetLanguageFor(comp?.subsystem), already normalized to the language-table key; when
          lang is defined, ownMarkers = markersFor(lang).
        type: local
      - stepNumber: 4
        label: intfGuard
        description: Branch on whether this interface's subsystem has a checkable target language.
        type: branch
        condition: >-
          lang is undefined, or ownMarkers is undefined or empty (no target language declared, or
          the language has no builtin vocabulary of its own to check against)
        onFalseStep: 6
      - stepNumber: 5
        description: Continue to the next interface - nothing to check without a target language.
        type: jump
        toStep: 2
      - stepNumber: 6
        label: computeIntfDraft
        description: >-
          Compute isDraftCtx = ctx.isComponentDraft(intf.component), or intf.status being 'draft' or
          'design'.
        type: local
      - stepNumber: 7
        label: methodLoop
        description: For each method on the interface, scan its type references.
        type: loop
        loopKind: forEach
        over: intf.methods
        endStep: 16
      - stepNumber: 8
        label: refLoop
        description: >-
          For each type reference the method's signature uses, check whether it belongs to a foreign
          language family.
        type: loop
        loopKind: forEach
        over: m.typeRefs()
        endStep: 16
      - stepNumber: 9
        description: refLower = ref.toLowerCase().
        type: local
      - stepNumber: 10
        label: refGuard
        description: Branch on whether the reference already belongs to the target language's own vocabulary.
        type: branch
        condition: ownMarkers has refLower (the reference is native to this target language)
        onFalseStep: 12
      - stepNumber: 11
        description: Continue to the next reference - it's already native.
        type: jump
        toStep: 8
      - stepNumber: 12
        label: familyLoopStart
        description: >-
          For each other known language family, check whether this reference is one of its
          unambiguous builtins.
        type: loop
        loopKind: forEach
        over: families
        endStep: 16
      - stepNumber: 13
        label: familyGuard
        description: Branch on whether this family is a genuine foreign match for the reference.
        type: branch
        condition: family equals lang, or markersFor(family) lacks refLower
        onFalseStep: 15
      - stepNumber: 14
        description: Continue to the next family - no match here.
        type: jump
        toStep: 12
      - stepNumber: 15
        label: reportBuiltin
        description: >-
          Report LANGUAGE_FOREIGN_BUILTIN (warning; draft context isDraftCtx) naming m.name,
          intf.id, ref, the matched family and lang.
        type: local
      - stepNumber: 16
        label: breakFamily
        description: >-
          Stop checking further families for this reference (break) and continue to the next type
          reference.
        type: jump
        toStep: 8
      - stepNumber: 17
        label: implLoop
        description: >-
          For each implementation, check its narrative flow steps against the target language's
          construct gaps.
        type: loop
        loopKind: forEach
        over: ctx.implementations
        endStep: 28
      - stepNumber: 18
        description: >-
          Resolve contract = ctx.interfaceMap.get(impl.contract); when present, comp =
          ctx.componentMap.get(contract.component) and lang =
          ctx.targetLanguageFor(comp?.subsystem), already normalized; when lang is defined, gaps =
          gapsFor(lang).
        type: local
      - stepNumber: 19
        label: implGuard
        description: Branch on whether this implementation has anything checkable.
        type: branch
        condition: >-
          contract is undefined, or lang is undefined, or gaps has no keys (dangling contract, no
          target language, or the language documents no flow gaps)
        onFalseStep: 21
      - stepNumber: 20
        description: Continue to the next implementation - nothing to check.
        type: jump
        toStep: 17
      - stepNumber: 21
        label: computeImplDraft
        description: Compute isDraftCtx = ctx.isImplementationDraft(impl).
        type: local
      - stepNumber: 22
        label: implMethodLoop
        description: For each implementation method, scan its narrative steps.
        type: loop
        loopKind: forEach
        over: impl.methods
        endStep: 28
      - stepNumber: 23
        label: stepLoop
        description: >-
          For each narrative step, derive the flow constructs it uses and check them against the
          language's gaps.
        type: loop
        loopKind: forEach
        over: implMethod.narrative
        endStep: 28
      - stepNumber: 24
        description: >-
          Derive the construct keyspace for this step: a loop step maps to its loopKind (default
          'forEach' when 'over' is set, else 'while'); every other step type maps to its own type
          name; a detach:true call/dispatch step additionally adds 'detach' to the set.
        type: local
      - stepNumber: 25
        label: constructLoop
        description: >-
          For each construct this step uses, check whether the target language documents a gap for
          it.
        type: loop
        loopKind: forEach
        over: constructs
        endStep: 28
      - stepNumber: 26
        label: constructGuard
        description: Branch on whether this construct is a documented gap for the language.
        type: branch
        condition: gaps[construct] is undefined (the language documents no gap for this construct)
        onFalseStep: 28
      - stepNumber: 27
        description: Continue to the next construct - nothing to report.
        type: jump
        toStep: 25
      - stepNumber: 28
        label: reportFlow
        description: >-
          Compute the human label for the construct (e.g. 'a do-while loop', 'a detached
          (fire-and-forget) call', or 'a <construct> step'), then report LANGUAGE_FOREIGN_FLOW
          (warning; draft context isDraftCtx) naming step.stepNumber, implMethod.name, impl.id, the
          construct label, lang and the gap guidance.
        type: local
    symbol: check
  - name: technologyBoundaries
    sourcePath: src/core/rules/heuristic/technology-boundaries.ts
    narrative:
      - stepNumber: 1
        description: >-
          Define ownerOf (a Map from an owned component id to its owning component id, built from
          every component's owns list), ownershipRoot(id) (walk ownerOf to the top of the chain,
          cycle-safe), and ownsClosure(rootId) (BFS over owns to collect the root and every
          transitive member).
        type: local
      - stepNumber: 2
        description: >-
          Initialize homes (a Map from a normalized technology key to {label, match,
          ownerComponents, scope}) to collect technology declarations.
        type: local
      - stepNumber: 3
        label: implLoop1
        description: For each implementation, collect any technology it declares into the homes index.
        type: loop
        loopKind: forEach
        over: ctx.implementations
        endStep: 12
      - stepNumber: 4
        label: techsGuard
        description: Branch on whether this implementation declares any technology at all.
        type: branch
        condition: impl.technologies is empty or unset
        onFalseStep: 6
      - stepNumber: 5
        description: Continue to the next implementation - nothing declared.
        type: jump
        toStep: 3
      - stepNumber: 6
        label: resolveOwner
        description: >-
          Resolve intf = ctx.interfaceMap.get(impl.contract); comp = intf ?
          ctx.componentMap.get(intf.component) : undefined.
        type: local
      - stepNumber: 7
        label: compGuard
        description: Branch on whether the declaring component actually resolves.
        type: branch
        condition: >-
          comp is undefined (a dangling contract reference, reported elsewhere by the hierarchy
          rule)
        onFalseStep: 9
      - stepNumber: 8
        description: Continue to the next implementation - nothing to attribute this technology to.
        type: jump
        toStep: 3
      - stepNumber: 9
        label: checkDataLayer
        description: >-
          When comp.componentType is not one of the data-layer stereotypes (Adapter, Store,
          Registry, Index), report TECH_ON_LOGIC_COMPONENT (warning; draft context
          ctx.isImplementationDraft(impl)) naming impl.id, impl.technologies, comp.id and
          comp.componentType.
        type: local
      - stepNumber: 10
        description: >-
          Compute the owning scope: compSet = ownsClosure(ownershipRoot(comp.id)); scope = compSet
          plus every interface whose component is in compSet, every implementation whose contract's
          component is in compSet, and every ancestor subsystem (by id or namespace prefix) housing
          a component in compSet.
        type: local
      - stepNumber: 11
        label: techLoop
        description: For each declared technology token, register it in the homes index.
        type: loop
        loopKind: forEach
        over: impl.technologies
        endStep: 12
      - stepNumber: 12
        label: recordHome
        description: >-
          match = makeMatcher(tech); when match is non-null (the token normalizes to 3+ significant
          characters and is policeable), key = its normalized fused form; fetch or create
          homes.get(key) as {label: tech, match, ownerComponents: [], scope: []}, add comp.id to its
          ownerComponents and merge scope into its scope, and homes.set(key, home).
        type: local
      - stepNumber: 13
        label: homesEmptyGuard
        description: Branch on whether there is anything to police at all.
        type: branch
        condition: homes is empty (no implementation declared a policeable technology)
        onFalseStep: 15
      - stepNumber: 14
        description: >-
          Return early: no implementation declared a policeable technology, so there is nothing
          further to check.
        type: return
        outcome: no technologies declared - nothing to police
      - stepNumber: 15
        label: defineOwnersDesc
        description: 'Define ownersDesc(home): the quoted, comma-joined list of home.ownerComponents.'
        type: local
      - stepNumber: 16
        label: homeLoop
        description: >-
          For each registered technology home, scan the whole spec tree for contract exposure and
          boundary leakage.
        type: loop
        loopKind: forEach
        over: homes.values()
        endStep: 28
      - stepNumber: 17
        label: vendorIntfLoop
        description: For every interface, check whether its contract identifiers name this technology.
        type: loop
        loopKind: forEach
        over: ctx.interfaces
        endStep: 18
      - stepNumber: 18
        label: vendorCheck
        description: >-
          offending = the names of intf.methods whose contract identifiers (name, signature,
          returns, each param's name/type, and any endpoint values) match home; when offending is
          non-empty, report VENDOR_NAME_IN_CONTRACT (warning; draft context
          ctx.isComponentDraft(intf.component) or intf.status being 'draft' or 'design') naming
          intf.id, home.label, offending and ownersDesc(home).
        type: local
      - stepNumber: 19
        label: leakCompLoop
        description: For every component outside the owning scope, scan its surfaces for the technology's name.
        type: loop
        loopKind: forEach
        over: ctx.components
        endStep: 20
      - stepNumber: 20
        label: compLeakCheck
        description: >-
          When comp.id is outside home.scope, check its surfaces (id/name, description, dependsOn,
          owns, basePath) for a match against home; when any surface matches, report TECH_LEAKAGE
          (warning; draft context ctx.isComponentDraft(comp.id)) naming comp.id, home.label, the
          matched surfaces and ownersDesc(home).
        type: local
      - stepNumber: 21
        label: leakSubLoop
        description: For every subsystem outside the owning scope, scan its identity and description.
        type: loop
        loopKind: forEach
        over: ctx.subsystems
        endStep: 22
      - stepNumber: 22
        label: subLeakCheck
        description: >-
          When sub.id is outside home.scope and home matches '${sub.id} ${sub.name}
          ${sub.description}', report TECH_LEAKAGE (warning; draft context sub.status being 'draft'
          or 'design') naming sub.id, home.label and ownersDesc(home).
        type: local
      - stepNumber: 23
        label: leakIntfLoop
        description: For every interface outside the owning scope, scan its prose descriptions.
        type: loop
        loopKind: forEach
        over: ctx.interfaces
        endStep: 24
      - stepNumber: 24
        label: intfLeakCheck
        description: >-
          When intf.id is outside home.scope and home matches the joined prose of intf.description
          and every method's description, report TECH_LEAKAGE (warning; draft context
          ctx.isComponentDraft(intf.component) or intf.status being 'draft' or 'design') naming
          intf.id, home.label and ownersDesc(home).
        type: local
      - stepNumber: 25
        label: leakImplLoop
        description: >-
          For every implementation outside the owning scope, scan its description, source files and
          narrative.
        type: loop
        loopKind: forEach
        over: ctx.implementations
        endStep: 26
      - stepNumber: 26
        label: implLeakCheck
        description: >-
          When this implementation's id is outside home.scope, gather parts = its description and
          its sourceFiles(), plus for every method its intent and, for every narrative step, its
          description/targetComponent/targetMethod/condition/over/on/outcome/error and every case
          value / catch error; when home matches the joined parts, report TECH_LEAKAGE (warning;
          draft context ctx.isImplementationDraft(impl)) naming the implementation's id, home.label
          and ownersDesc(home).
        type: local
      - stepNumber: 27
        label: leakTypeLoop
        description: >-
          For every type - no owning exemption applies to shared type space - scan its shape for the
          technology's name.
        type: loop
        loopKind: forEach
        over: ctx.types
        endStep: 28
      - stepNumber: 28
        label: typeLeakCheck
        description: >-
          Gather parts = t.id, t.name, t.description, every field's name/type, every method's
          name/signature/returns; when home matches the joined parts, report TECH_LEAKAGE (warning)
          naming t.id, home.label and ownersDesc(home).
        type: local
    symbol: check
  - name: namingConventions
    sourcePath: src/core/rules/heuristic/naming-conventions.ts
    narrative:
      - stepNumber: 1
        label: subLoop
        description: For each subsystem, check its id and name against the configured naming convention.
        type: loop
        loopKind: forEach
        over: ctx.subsystems
        endStep: 2
      - stepNumber: 2
        label: subCheck
        description: >-
          Resolve namingConfig = ctx.namingConfigFor(sub.id) and isDraft = sub.status being 'draft'
          or 'design'; when namingConfig.subsystems is set, check the last '::' segment of sub.id
          and sub.name against it - a casing/regex mismatch reports NAMING_CONVENTION_VIOLATION
          (warning), and a configured pattern that is neither a known casing style nor a valid regex
          reports INVALID_NAMING_PATTERN (error) instead - both against sub.id, draft context
          isDraft.
        type: local
      - stepNumber: 3
        label: compLoop
        description: For each component, check its id/name and its stereotype-specific naming rules.
        type: loop
        loopKind: forEach
        over: ctx.components
        endStep: 11
      - stepNumber: 4
        description: >-
          Resolve namingConfig = ctx.namingConfigFor(comp.subsystem); isDraft =
          ctx.isComponentDraft(comp.id); when namingConfig.components is set, check the last segment
          of comp.id and comp.name against it (NAMING_CONVENTION_VIOLATION or
          INVALID_NAMING_PATTERN, against comp.id, draft context isDraft).
        type: local
      - stepNumber: 5
        description: Resolve stereotypesConfig = namingConfig?.stereotypes?.[comp.componentType].
        type: local
      - stepNumber: 6
        label: stereotypeGuard
        description: Branch on whether this component's stereotype has configured naming rules.
        type: branch
        condition: stereotypesConfig is not set (no stereotype naming rule configured for this componentType)
        onFalseStep: 8
      - stepNumber: 7
        description: Continue to the next component - nothing configured.
        type: jump
        toStep: 3
      - stepNumber: 8
        label: buildTargets
        description: >-
          Determine matchMode (default 'both'), prefix, suffix and regexStr from stereotypesConfig;
          baseId = the last segment of comp.id; build allToTest = baseId (when matchMode is 'id' or
          'both') and comp.name (when 'name' or 'both').
        type: local
      - stepNumber: 9
        label: valLoop
        description: >-
          For each value under test (id and/or name), check it against the configured prefix, suffix
          and regex.
        type: loop
        loopKind: forEach
        over: allToTest
        endStep: 11
      - stepNumber: 10
        description: >-
          When prefix is set and val doesn't start with it, report STEREOTYPE_NAMING_VIOLATION
          (warning; draft context isDraft) naming comp.id, comp.componentType, val and the required
          prefix; likewise, when suffix is set and val doesn't end with it, report
          STEREOTYPE_NAMING_VIOLATION the same way for the suffix.
        type: local
      - stepNumber: 11
        label: stereotypeCheck
        description: >-
          When regexStr is set: an uncompilable pattern reports INVALID_NAMING_PATTERN (error; draft
          context isDraft) naming the stereotype regex and comp.componentType, against comp.id; a
          compiled pattern that doesn't match val reports STEREOTYPE_NAMING_VIOLATION (warning;
          draft context isDraft) naming comp.id, comp.componentType, val and regexStr.
        type: local
      - stepNumber: 12
        label: intfLoop
        description: For each interface, check its own naming plus every method's name and parameter names.
        type: loop
        loopKind: forEach
        over: ctx.interfaces
        endStep: 16
      - stepNumber: 13
        description: >-
          Resolve comp = ctx.componentMap.get(intf.component); namingConfig =
          ctx.namingConfigFor(comp?.subsystem); isDraft = ctx.isComponentDraft(intf.component) or
          intf.status being 'draft' or 'design'; when namingConfig.interfaces is set, check the last
          segment of intf.id (with a leading 'i' stripped) and intf.name against it
          (NAMING_CONVENTION_VIOLATION or INVALID_NAMING_PATTERN, against intf.id, draft context
          isDraft).
        type: local
      - stepNumber: 14
        label: methodLoop
        description: For each method on the interface, check its name and its parameters' names.
        type: loop
        loopKind: forEach
        over: intf.methods
        endStep: 16
      - stepNumber: 15
        description: >-
          When namingConfig.methods is set, check m.name against it (NAMING_CONVENTION_VIOLATION or
          INVALID_NAMING_PATTERN, against intf.id, draft context isDraft).
        type: local
      - stepNumber: 16
        label: paramCheck
        description: >-
          When namingConfig.variables is set, check every parameter name in (m.params ?? []) against
          it (NAMING_CONVENTION_VIOLATION or INVALID_NAMING_PATTERN per parameter, against intf.id,
          draft context isDraft).
        type: local
      - stepNumber: 17
        label: implLoop
        description: For each implementation, check its methods' names against the naming convention.
        type: loop
        loopKind: forEach
        over: ctx.implementations
        endStep: 18
      - stepNumber: 18
        label: implCheck
        description: >-
          Resolve intf = ctx.interfaceMap.get(impl.contract); comp = intf ?
          ctx.componentMap.get(intf.component) : undefined; namingConfig =
          ctx.namingConfigFor(comp?.subsystem); isDraft = ctx.isImplementationDraft(impl); when
          namingConfig.methods is set, check every method in impl.methods by name against it
          (NAMING_CONVENTION_VIOLATION or INVALID_NAMING_PATTERN, against impl.id, draft context
          isDraft).
        type: local
      - stepNumber: 19
        label: typeLoop
        description: For each type, check its own naming, its fields/constants, and its methods.
        type: loop
        loopKind: forEach
        over: ctx.types
        endStep: 23
      - stepNumber: 20
        description: >-
          Resolve namingConfig = ctx.namingConfigFor(t.subsystem); typePattern =
          namingConfig?.entities when t.kind is 'entity', namingConfig?.valueObjects when
          'value-object', else namingConfig?.types; when typePattern is set, check the last segment
          of t.id and t.name against it (generics such as '<T>' are stripped before testing)
          (NAMING_CONVENTION_VIOLATION or INVALID_NAMING_PATTERN, against t.id).
        type: local
      - stepNumber: 21
        label: fieldLoop
        description: For each field, decide whether it's a constant and check it against the matching pattern.
        type: loop
        loopKind: forEach
        over: t.fields
        endStep: 22
      - stepNumber: 22
        label: fieldCheck
        description: >-
          isConst = f.name is entirely uppercase/digits/underscore; fieldPattern =
          namingConfig?.constants when isConst, else namingConfig?.fields; when fieldPattern is set,
          check f.name against it (NAMING_CONVENTION_VIOLATION or INVALID_NAMING_PATTERN, against
          t.id, labeled 'Constant' or 'Field').
        type: local
      - stepNumber: 23
        label: typeMethodCheck
        description: >-
          When namingConfig.methods is set, check every method in t.methods by name against it
          (NAMING_CONVENTION_VIOLATION or INVALID_NAMING_PATTERN, against t.id).
        type: local
    symbol: check
  - name: complexityAndMetadata
    sourcePath: src/core/rules/heuristic/complexity-and-metadata.ts
    narrative:
      - stepNumber: 1
        label: subLoop
        description: For each subsystem, check its description and its direct component count.
        type: loop
        loopKind: forEach
        over: ctx.subsystems
        endStep: 3
      - stepNumber: 2
        description: >-
          Resolve docConfig = the effective documentation config for sub.id and isSubDraft =
          sub.status being 'draft' or 'design'; when docConfig.requireDescriptions and
          sub.description is missing or empty, report MISSING_DESCRIPTION (warning; draft context
          isSubDraft) naming sub.id; otherwise, when docConfig.minDescriptionLength is set and
          sub.description is shorter than it, report DESCRIPTION_TOO_SHORT (warning; draft context
          isSubDraft) naming sub.id, its length and the minimum.
        type: local
      - stepNumber: 3
        label: subComplexityCheck
        description: >-
          Resolve complexityConfig = the effective complexity config for sub.id; directComponents =
          the count of ctx.components whose subsystem is sub.id; when
          complexityConfig.maxSubsystemComponents is set and directComponents exceeds it, report
          EXCESSIVE_SUBSYSTEM_COMPONENTS (warning; draft context isSubDraft) naming sub.id,
          directComponents and the limit.
        type: local
      - stepNumber: 4
        label: compLoop
        description: For each component, check its description and its dependency count.
        type: loop
        loopKind: forEach
        over: ctx.components
        endStep: 6
      - stepNumber: 5
        description: >-
          Resolve docConfig = the effective documentation config for comp.subsystem;
          complexityConfig = the effective complexity config for comp.subsystem; isDraft =
          ctx.isComponentDraft(comp.id); when docConfig.requireDescriptions and comp.description is
          missing or empty, report MISSING_DESCRIPTION (warning; draft context isDraft) naming
          comp.id; otherwise, when docConfig.minDescriptionLength is set and comp.description is
          shorter, report DESCRIPTION_TOO_SHORT (warning; draft context isDraft) naming comp.id, its
          length and the minimum.
        type: local
      - stepNumber: 6
        label: compComplexityCheck
        description: >-
          When complexityConfig.maxComponentDependencies is set and comp.dependsOn.length exceeds
          it, report EXCESSIVE_DEPENDENCIES (warning; draft context isDraft) naming comp.id, its
          dependency count and the limit.
        type: local
      - stepNumber: 7
        label: intfLoop
        description: >-
          For each interface, check its description, its method count, and every method's
          description and parameter count.
        type: loop
        loopKind: forEach
        over: ctx.interfaces
        endStep: 12
      - stepNumber: 8
        description: >-
          Resolve comp = ctx.componentMap.get(intf.component); docConfig = the effective
          documentation config for comp?.subsystem; complexityConfig = the effective complexity
          config for comp?.subsystem; isDraft = ctx.isComponentDraft(intf.component) or intf.status
          being 'draft' or 'design'; when docConfig.requireDescriptions and intf.description is
          missing or empty, report MISSING_DESCRIPTION (warning; draft context isDraft) naming
          intf.id; otherwise, when docConfig.minDescriptionLength is set and intf.description is
          shorter, report DESCRIPTION_TOO_SHORT (warning; draft context isDraft) naming intf.id, its
          length and the minimum.
        type: local
      - stepNumber: 9
        description: >-
          When complexityConfig.maxInterfaceMethods is set and intf.methods.length exceeds it,
          report EXCESSIVE_METHODS (warning; draft context isDraft) naming intf.id, the method count
          and the limit.
        type: local
      - stepNumber: 10
        label: methodLoop
        description: For each method, check its description and its parameter count.
        type: loop
        loopKind: forEach
        over: intf.methods
        endStep: 12
      - stepNumber: 11
        description: >-
          When docConfig.requireMethodDescriptions and m.description is missing or empty, report
          MISSING_DESCRIPTION (warning; draft context isDraft) naming '<intf.id>.<m.name>';
          otherwise, when docConfig.minDescriptionLength is set and m.description is shorter, report
          DESCRIPTION_TOO_SHORT (warning; draft context isDraft) the same way.
        type: local
      - stepNumber: 12
        label: paramLimitCheck
        description: >-
          When complexityConfig.maxMethodParams is set and (m.params ?? []).length exceeds it,
          report EXCESSIVE_METHOD_PARAMS (warning; draft context isDraft) naming m.name, intf.id,
          the parameter count and the limit.
        type: local
      - stepNumber: 13
        label: implLoop
        description: For each implementation, check every method's narrative length.
        type: loop
        loopKind: forEach
        over: ctx.implementations
        endStep: 14
      - stepNumber: 14
        label: narrativeStepCheck
        description: >-
          Resolve intf = ctx.interfaceMap.get(impl.contract); comp = intf ?
          ctx.componentMap.get(intf.component) : undefined; complexityConfig = the effective
          complexity config for comp?.subsystem; isDraft = ctx.isImplementationDraft(impl); when
          complexityConfig.maxNarrativeSteps is set, for every method in impl.methods whose
          narrative.length exceeds it, report EXCESSIVE_NARRATIVE_STEPS (warning; draft context
          isDraft) naming the method's name, impl.id, its step count and the limit.
        type: local
      - stepNumber: 15
        label: typeLoop
        description: >-
          For each type, check its own description, every field's description, and every method's
          description.
        type: loop
        loopKind: forEach
        over: ctx.types
        endStep: 20
      - stepNumber: 16
        description: >-
          Resolve docConfig = the effective documentation config for t.subsystem; when
          docConfig.requireDescriptions and t.description is missing or empty, report
          MISSING_DESCRIPTION (warning) naming t.id; otherwise, when docConfig.minDescriptionLength
          is set and t.description is shorter, report DESCRIPTION_TOO_SHORT (warning) naming t.id,
          its length and the minimum.
        type: local
      - stepNumber: 17
        label: fieldLoop
        description: For each field, check its description.
        type: loop
        loopKind: forEach
        over: t.fields
        endStep: 18
      - stepNumber: 18
        label: fieldDocCheck
        description: >-
          When docConfig.requireFieldDescriptions and f.description is missing or empty, report
          MISSING_DESCRIPTION (warning) naming '<t.id>.<f.name>'; otherwise, when
          docConfig.minDescriptionLength is set and f.description is shorter, report
          DESCRIPTION_TOO_SHORT (warning) the same way.
        type: local
      - stepNumber: 19
        label: typeMethodLoop
        description: For each method, check its description.
        type: loop
        loopKind: forEach
        over: t.methods
        endStep: 20
      - stepNumber: 20
        label: typeMethodDocCheck
        description: >-
          When docConfig.requireMethodDescriptions and m.description is missing or empty, report
          MISSING_DESCRIPTION (warning) naming '<t.id>.<m.name>'; otherwise, when
          docConfig.minDescriptionLength is set and m.description is shorter, report
          DESCRIPTION_TOO_SHORT (warning) the same way.
        type: local
    symbol: check
  - name: narrativeComplexity
    sourcePath: src/core/rules/heuristic/narrative-complexity.ts
    narrative:
      - stepNumber: 1
        description: >-
          Build entries: for each implementation in ctx.implementations, resolve its contract's
          component through ctx.componentMap; skip the implementation when the component does not
          resolve, and otherwise pair every method that has a narrative with its implementation,
          component and subsystem.
        type: local
      - stepNumber: 2
        description: >-
          Define the band order linear < simple < moderate < complex < severe, and bandIndex(band)
          returning its position; a band is above another when its index is greater.
        type: local
      - stepNumber: 3
        label: entryLoop
        description: For each entry, judge its narrative on both axes.
        type: loop
        loopKind: forEach
        over: entries
        endStep: 12
      - stepNumber: 4
        description: >-
          Read cfg = ctx.complexityConfigFor(entry.subsystem), isDraft =
          ctx.isComponentDraft(entry.component.id), steps = entry.method.narrative.length, score =
          entry.method.cognitiveScore() and band = entry.method.complexityLevel().
        type: local
      - stepNumber: 5
        description: Is the narrative's band above the band configured to warn?
        type: branch
        condition: bandIndex(band) > bandIndex(cfg?.cognitiveWarnAbove ?? 'moderate')
        onTrueStep: 6
        onFalseStep: 7
      - stepNumber: 6
        description: >-
          ctx.addIssue('warning', 'NARRATIVE_COMPLEXITY', naming the implementation, the method, its
          band and score, and the band configured to warn above, with the advice to split the
          narrative into steps that call smaller methods), anchored on the implementation id and
          carrying isDraft.
        type: local
      - stepNumber: 7
        description: Is a maximum band configured, and is this narrative above it?
        type: branch
        condition: cfg?.maxCognitiveLevel is set and bandIndex(band) > bandIndex(cfg.maxCognitiveLevel)
        onTrueStep: 8
        onFalseStep: 9
      - stepNumber: 8
        description: >-
          ctx.addIssue('error', 'NARRATIVE_COMPLEXITY_OVER_MAX', naming the band, the score and the
          configured maximum), anchored on the implementation id and carrying isDraft.
        type: local
      - stepNumber: 9
        description: Does the narrative list more steps than the configured limit, defaulting to 25?
        type: branch
        condition: steps > (cfg?.maxNarrativeSteps ?? 25)
        onTrueStep: 10
        onFalseStep: 11
      - stepNumber: 10
        description: >-
          ctx.addIssue('warning', 'EXCESSIVE_NARRATIVE_STEPS', naming the method, its step count and
          the limit in force), anchored on the implementation id and carrying isDraft.
        type: local
      - stepNumber: 11
        description: >-
          Is a hard step maximum configured, and is this narrative above it? When not, continue with
          the next entry.
        type: branch
        condition: cfg?.narrativeStepsHardMax is set and steps > cfg.narrativeStepsHardMax
        onTrueStep: 12
        onFalseStep: 3
      - stepNumber: 12
        description: >-
          ctx.addIssue('error', 'NARRATIVE_STEPS_OVER_MAX', naming the step count and the configured
          hard maximum), anchored on the implementation id and carrying isDraft.
        type: local
  - name: namingDiscipline
    sourcePath: src/core/rules/heuristic/naming-discipline.ts
    narrative:
      - stepNumber: 1
        description: >-
          Define BLOCK_WORDS, mapping portal, orchestrator, supervisor, actor, store, index, query,
          registry, adapter, observer, repository and view to the componentType each names, and
          GENERIC_WORDS: manager, helper, helpers, util, utils, handler, service, processor,
          coordinator, engine, wrapper, common, misc, data, info.
        type: local
      - stepNumber: 2
        label: compLoop
        description: For each component, judge the name it carries.
        type: loop
        loopKind: forEach
        over: ctx.components
        endStep: 8
      - stepNumber: 3
        description: >-
          Read head = component.headNoun(), isDraft = ctx.isComponentDraft(component.id), and
          idWords = the component's id and name split on underscores, hyphens and camel-case
          boundaries.
        type: local
      - stepNumber: 4
        description: Does the head noun name a building block that this component is not?
        type: branch
        condition: BLOCK_WORDS holds head and BLOCK_WORDS[head] !== component.componentType
        onTrueStep: 5
        onFalseStep: 6
      - stepNumber: 5
        description: >-
          ctx.addIssue('warning', 'MISLEADING_BLOCK_WORD', naming the head noun, the block it claims
          and the component's actual type, with the advice to rename the component for what it is),
          anchored on the component id and carrying isDraft.
        type: local
      - stepNumber: 6
        description: Does the name lean on a generic role word?
        type: branch
        condition: any word of idWords is in GENERIC_WORDS
        onTrueStep: 7
        onFalseStep: 8
      - stepNumber: 7
        description: >-
          ctx.addIssue('warning', 'GENERIC_COMPONENT_NAME', naming the generic words found and
          asking for a name that states the component's responsibility), anchored on the component
          id and carrying isDraft.
        type: local
      - stepNumber: 8
        description: >-
          When the component is not an Adapter and ctx.interfaceMethodsOf(component.id) holds
          exactly one method whose camel-case words include the head noun in singular or plural,
          ctx.addIssue('warning', 'COMPONENT_IS_ITS_ONLY_METHOD', naming the method and asking
          either to fold it into its caller or to name the component for its responsibility),
          anchored on the component id and carrying isDraft.
        type: local
      - stepNumber: 9
        description: >-
          Build methodPairs from ctx.interfaces: resolve each interface's component, keep those
          whose component is neither an Adapter nor a Portal (a forwarder's method mirrors the
          command or route it exposes) and whose component.conceptNoun() is at least four
          characters, and pair the interface, the component and each of the interface's methods.
        type: local
      - stepNumber: 10
        label: stutterLoop
        description: For each contract method, judge whether its name repeats what its component is about.
        type: loop
        loopKind: forEach
        over: methodPairs
        endStep: 12
      - stepNumber: 11
        description: >-
          Does the method repeat its component's concept right after the verb? A qualified compound
          such as getPackPolicy on policy_repository does not, because the concept is qualified
          rather than repeated.
        type: branch
        condition: >-
          the method name's camel-case words hold component.conceptNoun(), singular or plural,
          directly after the leading verb
        onTrueStep: 12
        onFalseStep: 10
      - stepNumber: 12
        description: >-
          ctx.addIssue('warning', 'METHOD_REPEATS_COMPONENT', naming the method, the concept it
          repeats and the shorter name that remains once the concept is dropped), anchored on the
          interface that declares the method, as UNUSED_METHOD is, and carrying the component's
          draft state.
        type: local
  - name: methodCohesion
    sourcePath: src/core/rules/heuristic/method-cohesion.ts
    narrative:
      - stepNumber: 1
        description: >-
          For each implementation whose contract's component is an Orchestrator, build calledBy: a
          map from method name to the set of components its narrative reaches through call and
          dispatch steps that name a targetComponent; keep only methods that reach at least one
          component.
        type: local
      - stepNumber: 2
        label: implLoop
        description: For each Orchestrator, judge whether its methods share collaborators.
        type: loop
        loopKind: forEach
        over: those implementations
        endStep: 6
      - stepNumber: 3
        description: >-
          Skip the implementation when calledBy holds fewer than two methods; otherwise union every
          pair of methods that share at least one called component, and read off the groups.
        type: local
      - stepNumber: 4
        description: >-
          Keep groups holding two or more methods, so one specialized method beside a cohesive set
          is not a finding.
        type: local
      - stepNumber: 5
        description: >-
          Do the methods fall into two or more groups that share no collaborator? When not, continue
          with the next Orchestrator.
        type: branch
        condition: two or more groups remain
        onTrueStep: 6
        onFalseStep: 2
      - stepNumber: 6
        description: >-
          ctx.addIssue('warning', 'INCOHESIVE_METHODS', naming each group's methods and the
          components each group calls, with the advice to split the component along those groups or
          to acknowledge a deliberate facade with a reasoned lint.allow), anchored on the component
          id and carrying ctx.isComponentDraft(component.id).
        type: local
status: draft
