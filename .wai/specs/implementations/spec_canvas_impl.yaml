id: spec_canvas_impl
name: Spec Canvas Implementation
description: >-
  src/core/canvas.ts. Two exported functions over ~4,600 lines: the model projection is the first
  few hundred, and the rest is the engine the rendered page embeds. scripts/gen-canvas-engine.mjs
  reads that same text to emit web/src/canvas/*, so the React app and the exported page share one
  implementation by construction rather than by discipline.
contract: ispec_canvas
sourcePath: src/core/canvas.ts
methods:
  - name: build
    narrative:
      - stepNumber: 1
        description: Load the system spec of the bound tree
        type: call
        targetComponent: spec_loader
        targetMethod: loadSystemSpec
      - stepNumber: 2
        description: Load the subsystems of the bound tree
        type: call
        targetComponent: spec_loader
        targetMethod: loadSubsystemSpecs
      - stepNumber: 3
        description: Load the components of the bound tree
        type: call
        targetComponent: spec_loader
        targetMethod: loadComponentSpecs
      - stepNumber: 4
        description: Load the interface contracts of the bound tree
        type: call
        targetComponent: spec_loader
        targetMethod: loadInterfaceSpecs
      - stepNumber: 5
        description: >-
          Load the implementations of the bound tree, whose narratives and technologies the canvas
          carries
        type: call
        targetComponent: spec_loader
        targetMethod: loadImplementationSpecs
      - stepNumber: 6
        description: Load the types of the bound tree, which the data model is drawn from
        type: call
        targetComponent: spec_loader
        targetMethod: loadTypeSpecs
      - stepNumber: 7
        description: >-
          Load the type groups of the bound tree: the group tree the types view folds by. Each type
          gets `group` and `groupPath` (group_spec.chain under the loaded groups; a broken or cyclic
          chain is cut where it breaks, the type-groups rule reports it), and the model gets
          `typeGroups`, parents before children, with the types each group holds counted directly
          and through its descendants
        type: call
        targetComponent: spec_loader
        targetMethod: loadGroupSpecs
      - stepNumber: 8
        description: >-
          Read the project's resolved export table, so a portal's "View OpenAPI" deep-links to the
          section tagged with the public name its canonical target is exported under — the
          resolver's name, not the raw L0 entry's
        type: call
        targetComponent: spec_loader
        targetMethod: resolveProjectExports
      - stepNumber: 9
        description: >-
          Read the project graph: one project node per PROJECT member — contained, or referenced (a
          `../`, git or hosted source, drawn from its pin when its root is not on hand) — with its
          alias, display name and the description its parent gives it, drawn through its exports (a
          member's internals hang under its node, and an edge from another project lands on the
          member's exported name); one EXTERNAL project node per external the bound project declares
          that is not a project of its family, with its storage; and each PART with its storage
          (stage 8), whose subsystems are this project's own
        type: call
        targetComponent: spec_loader
        targetMethod: graph
      - stepNumber: 10
        description: >-
          Emit a node per spec with its level and containment — a project member's specs under its
          project node; a part's subsystems as this project's own subsystems, each carrying the
          part's alias and a storage badge (contained, sibling path, git with its short commit),
          never a node of their own: composition decides what is drawn, storage only how it is
          labelled — and an edge per dependency and ownership between the nodes emitted, consumption
          edges between projects included. Ids stay honest; only the displayed label collapses a
          subsystem whose key repeats its member's alias
        type: local
      - stepNumber: 11
        description: >-
          Draw the data model: an edge from each type to each type a field's parsed expression
          references (type_expression.namedRefs, plus a foreign key's `references`), labelled with
          its multiplicity read from the expression and never by pattern — `*` when it holds many
          (type_expression.isMany), `0..1` when the field is optional or its type is `T?`, else `1`;
          no edge to an enum or a named scalar, each a value domain rather than an entity relation.
          An enum node lists its values in place of fields; a signature type node shows its derived
          text; a named scalar node is drawn compactly, its name with the primitive it holds and no
          field rows. Groups add containers, never edges: when the types in scope exceed the cluster
          threshold (400) the client clusters them by TIER — first one cluster per subsystem (shared
          types under their own), and opening a cluster shows that home's top-level groups as
          clusters and its ungrouped types as nodes, a group opening into its child groups and its
          own types the same way — so no view ever draws more than the threshold; cross-cluster
          edges are aggregated between the clusters shown, as they are between subsystem clusters
          today. Below the threshold the groups draw as collapsible containers around their types
        type: local
      - stepNumber: 12
        description: >-
          Mark each node the passed-in findings name, keeping each finding's severity, so the canvas
          shows a judgement it did not make — and can draw a node holding only notices apart from
          one holding errors or warnings
        type: local
      - stepNumber: 13
        description: >-
          Draw the passed-in relation health, without judging it: when relations were passed, turn
          each consumer-to-producer pair the consumption edges connect (the edge's ends lie in
          different projects, by the graph's spec owners, or it lands on a referenced or external
          project node) into one CanvasRelation — the consumer's status for the producer's alias (a
          contained member by the alias its parent declares it under or, through a family external,
          by its project id), its health from ExternalStatus.health(), the uses that are not
          unchanged with their state and reason, how many compared unchanged, the pin's digest and
          commit, and the time it was compared — and have each consumption edge name it; a pair the
          relations do not answer (the consumer's statuses could not be read, or name no such alias)
          becomes an unavailable relation with the reason, never ok. When none were passed, emit no
          relations at all, so the page says health was not checked rather than drawing anything as
          good
        type: local
      - stepNumber: 14
        description: Answer with the model
        type: return
        outcome: built
    symbol: buildCanvasModel
  - name: render
    narrative:
      - stepNumber: 1
        description: Serialize the model into the page as data
        type: local
      - stepNumber: 2
        description: >-
          Embed the styles, the markup skeleton and the interaction engine alongside it, so the page
          needs no server and no network to open — the same text scripts/gen-canvas-engine.mjs
          extracts for the React app. The engine draws relation health by glyph and line as well as
          colour, folds edges at a collapsed level to their worst health, shows a relation on hover
          and in the details panel, adds the one legend row when a consumption edge exists, draws an
          external project node dashed, and offers a project's own page only through a host's
          open-project hook. It also lists every finding of the model in a Findings panel (a finding
          that names a drawn spec focuses its node on click; one that names none is listed as the
          project's), takes the issues overlay's first-visit default from the host's showIssues
          option, and draws a partial model as it is
        type: local
      - stepNumber: 3
        description: >-
          Embed the codec's two encoders by SERIALIZING THEIR SOURCE into the page rather than
          calling them: the download buttons run them in the browser, against a layout the reader
          has rearranged, long after this process has exited. The dependency on diagram_codec is
          real and the encoders are genuinely used — just by a different runtime, which is why no
          call step can name it
        type: local
      - stepNumber: 4
        description: Answer with the complete page
        type: return
        outcome: rendered
    symbol: renderCanvasHtml
status: complete
