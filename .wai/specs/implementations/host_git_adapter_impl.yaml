id: host_git_adapter_impl
name: Host Git Client Adapter Implementation
description: >-
  Forwards the hosting server's git-backing calls to the git portal, bound to the current project
  root. publish forwards the SCOPED subpath (default .wai/) so staging never touches a shared
  repository's own code.
contract: ihost_git_adapter
sourcePath: src/server/adapters.ts
methods:
  - name: enable
    narrative:
      - stepNumber: 1
        description: Forward to the git portal
        type: call
        targetComponent: git_portal
        targetMethod: enable
  - name: disable
    narrative:
      - stepNumber: 1
        description: Forward to the git portal
        type: call
        targetComponent: git_portal
        targetMethod: disable
  - name: sync
    narrative:
      - stepNumber: 1
        description: Forward to the git portal
        type: call
        targetComponent: git_portal
        targetMethod: sync
  - name: publish
    narrative:
      - stepNumber: 1
        description: Forward to the git portal
        type: call
        targetComponent: git_portal
        targetMethod: publish
  - name: status
    narrative:
      - stepNumber: 1
        description: Forward to the git portal
        type: call
        targetComponent: git_portal
        targetMethod: status
  - name: configureSync
    narrative:
      - stepNumber: 1
        description: Forward to the git portal
        type: call
        targetComponent: git_portal
        targetMethod: configureSync
status: complete
