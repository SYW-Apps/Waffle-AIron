id: authorization_specialist_impl
name: Authorization Specialist Implementation
description: >-
  Gathers the permission world once and delegates to the pure permission resolver. Reads
  repositories; holds no state.
contract: iauthorization_specialist
sourcePath: src/server/authorization.ts
methods:
  - name: authorize
    narrative:
      - stepNumber: 1
        description: Gather all organization units
        type: call
        targetComponent: organization_repository
        targetMethod: listUnits
      - stepNumber: 2
        description: Gather all project placements
        type: call
        targetComponent: organization_repository
        targetMethod: listPlacements
      - stepNumber: 3
        description: Gather the relevant permission assignments
        type: call
        targetComponent: permission_repository
        targetMethod: listAssignments
      - stepNumber: 4
        description: Gather the role definitions the principal's bindings reference
        type: call
        targetComponent: role_repository
        targetMethod: listRoles
      - stepNumber: 5
        description: Assemble the PermissionWorld from the gathered assignments, roles, units, and placements
        type: local
      - stepNumber: 6
        description: Resolve the principal's effective permission for the capability at the target scope
        type: call
        targetComponent: permission_resolver
        targetMethod: resolvePermission
      - stepNumber: 7
        description: Return the effective permission
        type: return
        outcome: the effective permission
  - name: visibleScopes
    narrative:
      - stepNumber: 1
        description: Gather all organization units
        type: call
        targetComponent: organization_repository
        targetMethod: listUnits
      - stepNumber: 2
        description: Gather all project placements
        type: call
        targetComponent: organization_repository
        targetMethod: listPlacements
      - stepNumber: 3
        description: Gather the relevant permission assignments
        type: call
        targetComponent: permission_repository
        targetMethod: listAssignments
      - stepNumber: 4
        description: Gather the role definitions
        type: call
        targetComponent: role_repository
        targetMethod: listRoles
      - stepNumber: 5
        description: Assemble the PermissionWorld
        type: local
      - stepNumber: 6
        description: Compute the scopes actionable for the capability plus their ancestor breadcrumb
        type: call
        targetComponent: permission_resolver
        targetMethod: resolveVisibleScopes
      - stepNumber: 7
        description: Return the visible scopes
        type: return
        outcome: the visible scopes
detail: full
status: complete
createdAt: '2026-07-15T21:32:08.971Z'
updatedAt: '2026-07-15T22:22:07.647Z'
