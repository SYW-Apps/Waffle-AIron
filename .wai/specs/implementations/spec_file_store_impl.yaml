id: spec_file_store_impl
name: Spec File Store Implementation
description: >-
  The spec tree's file face, in a module that is only that: src/core/spec-files.ts holds
  readSpecFile, writeSpecFile and listSpecFiles, and the `.yaml` storage format is decided there
  once. It delegates to the project's general-purpose YAML and directory helpers, but those are NOT
  the store — src/utils/yaml.ts and src/utils/fs.ts are shared infrastructure that project config,
  pack manifests, templates, variants, surface snapshots and the registry all read through, so
  naming them here claimed two utility modules whole and made nineteen unrelated importers read as
  consumers of a Repository-private Store. findChainingParent is the one method written in the
  workspace module itself (src/core/specs.ts), where the validator can reach it without reaching
  into this Store.
contract: ispec_file_store
sourcePath: src/core/spec-files.ts
methods:
  - name: read
    sourcePath: src/core/spec-files.ts
    narrative: []
    detail: intent
    intent: >-
      Reads the spec document at the given path (resolved by the caller) and parses it; returns null
      when the file is absent or empty, and propagates a parse error for malformed content. The
      storage format — YAML — is decided here, not by the caller.
    symbol: readSpecFile
  - name: write
    sourcePath: src/core/spec-files.ts
    narrative: []
    detail: intent
    intent: >-
      Serializes the given document in the spec storage format and writes it to the given path,
      creating parent directories as needed; filesystem failures propagate to the caller. The file
      keeps its line endings: a document already on disk is rewritten with the ones it holds (CRLF
      stays CRLF), and a new one takes the project's convention — an `eol` the nearest
      .gitattributes sets for it, else the endings most files beside it (or in the folders above it,
      up to the project) already use, else LF — so a re-save, a doctor repair or a migration never
      turns a file into a whole-file diff. The shared file helper every .wai writer goes through
      does the same. The path is the caller's — the registry resolves a spec's home, a part's folder
      included, and never hands it a path inside the git fetch cache, which is read-only.
    symbol: writeSpecFile
  - name: listTree
    sourcePath: src/core/spec-files.ts
    narrative: []
    detail: intent
    intent: >-
      Recursively lists the spec documents under the given directory, matching them by the storage
      format's extension; returns an empty list when the root is absent rather than failing.
    symbol: listSpecFiles
  - name: findChainingParent
    sourcePath: src/core/specs.ts
    narrative:
      - stepNumber: 1
        description: Resolve the bound project root and set the bounded ancestor hop budget
        type: local
      - stepNumber: 2
        description: Walk upward while no declaring parent is found and ancestors remain within the hop budget
        type: loop
        condition: no declaring parent recorded and an ancestor remains within the hop budget
        loopKind: while
        endStep: 4
      - stepNumber: 3
        description: >-
          Ascend one directory level (reaching the filesystem root ends the walk); unreadable
          directories are skipped soft, never thrown
        type: local
      - stepNumber: 4
        description: >-
          At an ancestor holding a wairon project, read its member declarations — its
          configuration's `members` (through that ancestor's per-root binding) and, for one release,
          its subsystem specs carrying projectPath — and record the first whose path resolves
          EXACTLY to the bound root and stays within the ancestor's own root (parent root, alias,
          form; a `members` entry wins over a legacy mount under the same alias), skipping malformed
          files soft
        type: local
      - stepNumber: 5
        description: A declaring parent was recorded
        type: branch
        condition: a declaring parent was recorded
        onFalseStep: 7
      - stepNumber: 6
        description: Return the chaining-parent reference
        type: return
        outcome: ChainingParentRef
      - stepNumber: 7
        description: Return null — the tree is a genuine top root
        type: return
        outcome: 'null'
    detail: full
    intent: ''
  - name: remove
    narrative:
      - stepNumber: 1
        description: >-
          Answer false when nothing is at the path — a delete of what was never there is not an
          error, and the caller is entitled to tell the two apart
        type: local
      - stepNumber: 2
        description: >-
          Unlink the document, then prune each parent directory the deletion left empty, stopping
          before the specs root the caller passed so the root survives an emptied tree
        type: local
      - stepNumber: 3
        description: Answer that a document was removed
        type: return
        outcome: removed
    symbol: removeSpecFile
status: complete
createdAt: '2026-07-18T22:57:53.471Z'
updatedAt: '2026-10-05T06:49:47.366Z'
