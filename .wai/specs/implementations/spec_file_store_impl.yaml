id: spec_file_store_impl
name: Spec File Store Implementation
description: >-
  Raw YAML file I/O over the shared yaml/fs utilities (readYamlFile, writeYamlFile, listFiles,
  listFilesRecursive) as imported and used by the spec workspace.
contract: ispec_file_store
sourcePath: src/core/specs.ts
methods:
  - name: read
    narrative: []
    detail: intent
    intent: >-
      Reads the YAML document at the given project-relative spec path and parses it into a plain
      object; returns null when the file is absent or empty, and propagates a parse error for
      malformed YAML.
    symbol: readYamlFile
  - name: write
    narrative: []
    detail: intent
    intent: >-
      Serializes the given document as YAML and writes it to the spec path, creating parent
      directories as needed; filesystem failures propagate to the caller.
    symbol: writeYamlFile
  - name: listTree
    narrative: []
    detail: intent
    intent: >-
      Recursively lists YAML spec files under the given directory tree; returns an empty list when
      the root is absent rather than failing.
    symbol: listFilesRecursive
  - name: findChainingParent
    narrative:
      - stepNumber: 1
        description: Resolve the bound project root and set the bounded ancestor hop budget
        type: local
      - stepNumber: 2
        description: Walk upward while no mount is found and ancestors remain within the hop budget
        type: loop
        condition: no mounting subsystem recorded and an ancestor remains within the hop budget
        loopKind: while
        endStep: 4
      - stepNumber: 3
        description: >-
          Ascend one directory level (reaching the filesystem root ends the walk); unreadable
          directories are skipped soft, never thrown
        type: local
      - stepNumber: 4
        description: >-
          Scan the ancestor's spec directory (when present) for a subsystem spec whose projectPath
          resolves EXACTLY to the bound root, skipping malformed specs soft; record the first match
          (parent root + subsystem id)
        type: local
      - stepNumber: 5
        description: A mounting subsystem was recorded
        type: branch
        condition: a mounting subsystem was recorded
        onFalseStep: 7
      - stepNumber: 6
        description: Return the chaining-parent reference
        type: return
        outcome: ChainingParentRef
      - stepNumber: 7
        description: Return null — the tree is a genuine top root
        type: return
        outcome: 'null'
    detail: full
    intent: ''
status: complete
