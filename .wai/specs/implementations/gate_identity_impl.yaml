id: gate_identity_impl
name: Gate Identity Implementation
description: >-
  The pure gate identity computation in src/core/rules/gate-identity.ts: it projects the governing
  DESIGN doctrine onto its identity-bearing surface and digests it together with the project's own
  content identity, its own consumed contract inputs, its composition block and its direct members'
  composition subjects; and it projects the code analyzer's doctrine — the half the gate identity
  leaves out — onto a digest of its own. It reads nothing; the spec validator gathers every input.
contract: igate_identity
sourcePath: src/core/rules/gate-identity.ts
methods:
  - name: compute
    narrative:
      - stepNumber: 1
        description: >-
          Project the built-in DESIGN rules onto their identity: every rule whose `judges` is not
          code, by name with its codes, each code with its default severity, the codes sorted by
          code and the rules sorted by name. A rule that judges code is left out: the approval
          certifies the design, and a code analyzer that gains a code or a stricter check must never
          stale it (analyzer-upgrade-keeps-approval) — its doctrine is digested apart (analyzer).
          Every sort in this projection — here and in the steps below — compares by CODEPOINT, never
          by a locale-aware collation: collation is a property of the machine's ICU build, and it
          already ordered a real pair of shipped codes the other way round (EXCESSIVE_METHOD_PARAMS
          before EXCESSIVE_METHODS). A rule is a function and cannot be digested, so its name and
          codes stand for it. The wairon version is left out: a release that changes no design rule
          keeps every lock valid. Accepted gap: a rule whose check grows stricter without a name,
          code or severity change is not caught.
        type: local
      - stepNumber: 2
        description: >-
          Take the project type, the rule config WITHOUT its code-conformance tuning
          (rules.conformance, which only tunes findings the approval does not certify), and the
          composition block from the gate config, each null when absent. All three decide what this
          project's approval means: a project type switch changes the doctrine family, the rule
          config carries severity overrides, complexity caps and design depth, and composition
          (requirePolicies, requireApprovedMembers) is what the project requires of the projects it
          contains — a changed requirement stales the requiring project's lock.
        type: local
      - stepNumber: 3
        description: >-
          Project the packs by name, version (null when absent) and scope, sorted by name, version
          and scope — the adopted packs.
        type: local
      - stepNumber: 4
        description: >-
          Take the merged profile and language records as they are, since they already encode pack
          precedence (a load-order change that flips a collision winner shows here), and project the
          patterns by pack, id and version, sorted by pack, id and version.
        type: local
      - stepNumber: 5
        description: >-
          Sort the guarantee tokens, the assertions by fullCode, and the pack rules by name, each
          pack rule with its codes sorted.
        type: local
      - stepNumber: 6
        description: >-
          Leave out of the identity the skills and instructions (agent-facing prose that cannot
          change a verdict), the load errors (transient, and a failed pack load already blocks the
          lock through EXTENSION_LOAD_ERROR) and the pack names (redundant with the packs).
        type: local
      - stepNumber: 7
        description: >-
          Sort the consumed contract inputs — the project's own, never a member's — so the identity
          does not depend on the order the caller gathered them in.
        type: local
      - stepNumber: 8
        description: >-
          Order the members by alias, codepoint-sorted, each alias with its subject (or `never`).
          The subject is the member's recorded gate identity, which already covers ITS direct
          members' subjects, so a re-approval two levels down reaches this identity through the
          chain once the level between re-approves (pin-chain); a member's live, unapproved edits
          never move it.
        type: local
      - stepNumber: 9
        description: >-
          Digest with sha256, in hex, the canonical form of {content: the own content identity's
          digest, doctrine: the projected design doctrine with the composition block, inputs: the
          sorted own inputs, members: the ordered subjects}: object keys sorted recursively and the
          volatile createdAt and updatedAt stripped, serialized as JSON.
        type: local
      - stepNumber: 10
        description: >-
          Return the gate identity {algorithm: 'sha256+content+doctrine+inputs+members', digest}.
          The marker changes from sha256+content+doctrine+inputs because the composition changed
          (members' subjects and composition in, member content and member inputs out, code-judging
          rules out), so a record written under the old marker never matches: every existing lock
          reads stale once, and LockStatus.upgraded names that as the reason. A content identity
          (sha256) never compares equal to a gate identity.
        type: return
        outcome: StateId (the gate identity)
    symbol: computeGateIdentity
  - name: analyzer
    narrative:
      - stepNumber: 1
        description: >-
          Project the built-in rules whose `judges` is code onto their identity — name, codes with
          default severities — with the same codepoint sorts compute uses
        type: local
      - stepNumber: 2
        description: Take the project's code-conformance tuning (gate.rules.conformance), null when absent
        type: local
      - stepNumber: 3
        description: >-
          Digest with sha256, in hex, the canonical form of {rules: the projected code rules,
          conformance: the tuning}, and return it
        type: return
        outcome: doctrine digest (hex)
    symbol: analyzerDigest
detail: full
status: complete
