id: gate_identity_impl
name: Gate Identity Implementation
description: >-
  The pure gate identity computation in src/core/rules/gate-identity.ts: it projects the governing
  DESIGN doctrine onto its identity-bearing surface and digests it together with the project's own
  content identity, its own consumed contract inputs, its composition block and its direct members'
  composition subjects; and it projects the code analyzer's doctrine — the half the gate identity
  leaves out — onto a digest of its own. It reads nothing; the spec validator gathers every input.
contract: igate_identity
sourcePath: src/core/rules/gate-identity.ts
methods:
  - name: compute
    narrative:
      - stepNumber: 1
        description: >-
          Project the built-in DESIGN rules onto their identity: every rule whose `judges` is not
          code, by name with its codes, each code with its default severity, the codes sorted by
          code and the rules sorted by name. A rule that judges code is left out: the approval
          certifies the design, and a code analyzer that gains a code or a stricter check must never
          stale it (analyzer-upgrade-keeps-approval) — its doctrine is digested apart (analyzer).
          Every sort in this projection — here and in the steps below — compares by CODEPOINT, never
          by a locale-aware collation: collation is a property of the machine's ICU build, and it
          already ordered a real pair of shipped codes the other way round (EXCESSIVE_METHOD_PARAMS
          before EXCESSIVE_METHODS). A rule is a function and cannot be digested, so its name and
          codes stand for it. The wairon version is left out: a release that changes no design rule
          keeps every lock valid. Accepted gap: a rule whose check grows stricter without a name,
          code or severity change is not caught.
        type: local
      - stepNumber: 2
        description: >-
          Take the project type, the rule config WITHOUT its code-conformance tuning, the
          composition block and the network declaration from the gate config, each null when absent.
          The code-conformance tuning is rules.conformance together with every rules.sddRuleSeverity
          override of a code that a code-judging rule declares: both only tune findings the approval
          does not certify, so changing them never stales an approval, and both enter the analyzer's
          digest instead. What stays decides what this project's approval means. A project type
          switch changes the doctrine family. The rule config carries the design severity overrides,
          complexity caps and design depth. Composition (requirePolicies, requireApprovedMembers) is
          what the project requires of the projects it contains: a changed requirement stales the
          requiring project's lock. The network declaration changes the network verdicts of the
          family run, so declaring, removing or redescribing one stales the declaring project's
          lock.
        type: local
      - stepNumber: 3
        description: >-
          Project the packs by name, version (null when absent) and scope, sorted by name, version
          and scope — the adopted packs.
        type: local
      - stepNumber: 4
        description: >-
          Take the merged profile and language records as they are, since they already encode pack
          precedence (a load-order change that flips a collision winner shows here), and project the
          patterns by pack, id and version, sorted by pack, id and version.
        type: local
      - stepNumber: 5
        description: >-
          Sort the guarantee tokens, the assertions by fullCode, and the pack rules by name, each
          pack rule with its codes sorted.
        type: local
      - stepNumber: 6
        description: >-
          Leave out of the identity the skills and instructions (agent-facing prose that cannot
          change a verdict), the technology packages (they feed only TECH_LEAKAGE_IN_CODE, a code
          finding, which never gates an approval), the load errors (transient, and a failed pack
          load already blocks the lock through EXTENSION_LOAD_ERROR) and the pack names (redundant
          with the packs).
        type: local
      - stepNumber: 7
        description: >-
          Sort the consumed contract inputs — the project's own, never a member's — so the identity
          does not depend on the order the caller gathered them in.
        type: local
      - stepNumber: 8
        description: >-
          Order the members by alias, codepoint-sorted, each alias with its subject (or `never`).
          The subject is the member's RECORDED gate identity, which already covers ITS direct
          members' subjects. So a change two levels down reaches this identity only once the member
          between re-locks (pin-chain): the grandchild's re-approval moves the member's gate
          identity, the member reads drifted from here until it re-locks, and its re-lock moves its
          subject and so this identity. A member's live, unapproved edits never move it.
        type: local
      - stepNumber: 9
        description: >-
          Digest with sha256, in hex, the canonical form of {content: the own content identity's
          digest, doctrine: the projected design doctrine with the composition block, and the
          network declaration when the project declares one, inputs: the sorted own inputs, members:
          the ordered subjects}: object keys sorted recursively and the volatile createdAt and
          updatedAt stripped, serialized as JSON. The network key is LEFT OUT when the project
          declares no network, never written as null, so every lock taken before networks existed
          keeps its identity.
        type: local
      - stepNumber: 10
        description: >-
          Return the gate identity {algorithm: 'sha256+content+doctrine+inputs+members', digest}.
          The marker changes from sha256+content+doctrine+inputs because the composition changed
          (members' subjects and composition in, member content and member inputs out, code-judging
          rules out), so a record written under the old marker never matches: every existing lock
          reads stale once, and LockStatus.upgraded names that as the reason. A content identity
          (sha256) never compares equal to a gate identity.
        type: return
        outcome: StateId (the gate identity)
    symbol: computeGateIdentity
  - name: analyzer
    narrative:
      - stepNumber: 1
        description: >-
          Project the built-in rules whose `judges` is code onto their identity — name, codes with
          default severities — with the same codepoint sorts compute uses
        type: local
      - stepNumber: 2
        description: >-
          Take the project's code-conformance tuning: gate.rules.conformance, and the
          rules.sddRuleSeverity overrides of the codes the code-judging rules declare (sorted by
          code); each null or empty when absent
        type: local
      - stepNumber: 3
        description: >-
          Digest with sha256, in hex, the canonical form of {rules: the projected code rules,
          conformance: the conformance tuning, severities: the code-judging severity overrides}, and
          return it
        type: return
        outcome: doctrine digest (hex)
    symbol: analyzerDigest
  - name: parts
    narrative:
      - stepNumber: 1
        description: >-
          Project the doctrine as compute does, and split the payload compute digests into its
          inputs: the own content digest; the built-in design rules' identity; the project type with
          the design rule config; the extensions' doctrine (packs, profiles, languages, patterns,
          guarantees, assertions, pack rules); the network declaration when one is declared; the
          composition block; the sorted consumed contract inputs; the members' subjects by alias
        type: local
      - stepNumber: 2
        description: 'Digest each input on its own: sha256 over its canonical form, in hex'
        type: local
      - stepNumber: 3
        description: >-
          Answer the digests keyed design, release, rules, packs, network (only when declared),
          composition, contracts and members
        type: return
        outcome: map<string, string>
    symbol: gateParts
detail: full
status: complete
