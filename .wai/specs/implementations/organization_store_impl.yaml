id: organization_store_impl
name: Organization Store Implementation
description: >-
  Read-through file I/O over organization units and project placements, one file
  (organization.json): load parses it fresh; update holds the file's write lock across a fresh read
  of BOTH collections and the replacement of both.
contract: iorganization_store
sourcePath: src/server/organization.ts
methods:
  - name: load
    narrative: []
    intent: >-
      Read organization.json fresh (no in-memory copy), returning the units and placements. A
      missing file yields the empty state; an unreadable file or structurally invalid JSON fails
      with a storage error naming the path.
  - name: update
    narrative: []
    intent: >-
      Under organization.json's write lock (file_write_lock.run), read the state fresh - absent is
      the empty state, a file that exists but cannot be read or parsed throws and nothing is written
      - apply the change (units and placements together), replace the file atomically via
      write-temp-then-rename and release the lock, also when the change throws. Answers the state
      written.
    calls:
      - file_write_lock.run
detail: intent
status: complete
