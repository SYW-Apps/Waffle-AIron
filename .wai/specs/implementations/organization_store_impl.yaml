id: organization_store_impl
name: Organization Store Implementation
description: >-
  Authoritative in-memory holder of the hosted organization units and project placements,
  file-backed as two collections under one file in the server data root (organization.json).
contract: iorganization_store
sourcePath: src/server/organization.ts
methods:
  - name: load
    narrative: []
    intent: >-
      Read both persisted collections — organization units and project placements — from the
      organization.json file under the hosted data root and hold them as the authoritative in-memory
      representation, returning them together as an OrganizationState. A missing file yields two
      empty collections; an unreadable file or structurally invalid JSON fails with a storage error
      naming the path, so a lost placement never silently detaches a project from its organization
      unit and a lost unit never silently orphans its children.
  - name: replaceAll
    narrative: []
    intent: >-
      Swap both authoritative in-memory collections to the supplied complete unit and placement sets
      in one assignment, only ever called by the owned registry after durable persistence has
      succeeded. Never partially applies, so concurrent hierarchy and membership queries through the
      index always observe a consistent pair of collections.
detail: intent
status: complete
