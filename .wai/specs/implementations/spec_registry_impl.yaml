id: spec_registry_impl
name: Spec Registry Implementation
description: >-
  Validated write pipeline of the spec workspace: the inverse of the scan's binding (every reference
  written relative to the project owning the spec — bare local ids, authored text carried back byte
  for byte, `alias::publicName` for anything else in another project), updatedAt stamping (skipped
  on a MECHANICAL re-save that changes no authored content — the lock's status promotion — so a
  freeze never reads as an edit), writer-schema re-parse, and persistence through the file store;
  the dry run exercises the identical pipeline in memory.
contract: ispec_registry
sourcePath: src/core/specs.ts
methods:
  - name: saveSystemSpec
    narrative:
      - stepNumber: 1
        description: >-
          Stamp updatedAt (unless the caller asked to preserve it for a mechanical re-save) and
          re-parse the system spec through the writer schema — a refusal aborts the save
        type: local
      - stepNumber: 2
        description: Persist the serialized document to the system spec path through the file store
        type: call
        targetComponent: spec_file_store
        targetMethod: write
  - name: saveComponentSpec
    narrative:
      - stepNumber: 1
        description: >-
          Key the spec's own id, write every reference back relative to the project that owns it
          (the scan's inverse), keep the stored status when the spec arrives at draft or without one
          unless the caller states the demotion, stamp updatedAt (unless preserved for a mechanical
          re-save), re-parse through the writer schema, and collect placement notices for layout
          decisions the caller should see
        type: local
      - stepNumber: 2
        description: Persist the serialized document to its component spec path through the file store
        type: call
        targetComponent: spec_file_store
        targetMethod: write
  - name: saveInterfaceSpec
    narrative:
      - stepNumber: 1
        description: >-
          Key the spec's own id, write every reference back relative to the project that owns it
          (the scan's inverse), keep the stored status when the spec arrives at draft or without one
          unless the caller states the demotion, stamp updatedAt (unless preserved for a mechanical
          re-save), re-parse through the writer schema, and collect placement notices
        type: local
      - stepNumber: 2
        description: Persist the serialized document to its interface spec path through the file store
        type: call
        targetComponent: spec_file_store
        targetMethod: write
  - name: saveImplementationSpec
    narrative:
      - stepNumber: 1
        description: >-
          Key the spec's own id, write every reference back relative to the project that owns it
          (the scan's inverse), keep the stored status when the spec arrives at draft or without one
          unless the caller states the demotion, stamp updatedAt (unless preserved for a mechanical
          re-save), re-parse through the writer schema, and collect placement notices. A member's
          implementation keeps its file paths (sourcePath, each method's sourcePath, simPath)
          relative to that member's root: a path written relative to this root that lands inside the
          member is re-expressed against the member root, and any other path is taken as already
          member-relative and kept verbatim, so load → save stays a fixpoint
        type: local
      - stepNumber: 2
        description: Persist the serialized document to its implementation spec path through the file store
        type: call
        targetComponent: spec_file_store
        targetMethod: write
  - name: dryRunSerializeSpecs
    narrative: []
    detail: intent
    intent: >-
      Re-serializes every currently loaded spec — subsystems, components, interfaces,
      implementations, types, AND groups — in memory through the exact writer pipeline the save
      paths use: the same owning-project derivation, the same inverse of the scan's binding, and the
      same schema parse, shared code with the real save path so the check can never drift from what
      a write would actually do, without touching the filesystem. An optional include predicate
      skips out-of-scope specs before the expensive clone and parse, so scoped validation pays
      scoped cost. For each spec whose serialized form the writer schema refuses, collects a
      ROUNDTRIP_SERIALIZATION issue naming the spec id and the offending field path (rendered by the
      same formatter as the save-time refusal, so the two outputs correlate); an unserializable spec
      never throws, it only surfaces issues. Returns the collected issues so validate reports at
      validate time every refusal that lock's status promotion or any later save would otherwise
      raise mid-write.
  - name: invalidateCache
    narrative:
      - stepNumber: 1
        description: >-
          Invalidate every registered workspace's cached index IN PLACE, never evicting the
          workspace itself — a caller holding a workspace reference (tests, the hosted server's
          per-project scopes) must keep receiving invalidations
        type: local
    symbol: invalidateSpecCache
  - name: save
    narrative:
      - stepNumber: 1
        description: >-
          Turn the kind into this registry's typed writer of that kind, whose pipeline keys the id
          and writes references back relative to the owning project, keeps the stored status on a
          draft or status-less save, stamps updatedAt, re-parses through the writer schema and
          collects placement notices
        type: local
      - stepNumber: 2
        description: The typed writer persists the serialized document through the file store
        type: call
        targetComponent: spec_file_store
        targetMethod: write
      - stepNumber: 3
        description: Answer with the writer's placement notices; none for the L0 and a subsystem
        type: return
        outcome: saved
  - name: delete
    narrative:
      - stepNumber: 1
        description: >-
          Refuse a kind of system — the L0 cannot be deleted — and otherwise turn the kind into this
          registry's typed delete of that kind, which qualifies the id and resolves the document
          path
        type: local
      - stepNumber: 2
        description: The typed delete removes the document through the file store
        type: call
        targetComponent: spec_file_store
        targetMethod: remove
      - stepNumber: 3
        description: Invalidate the index cache when something was removed, and answer whether it was
        type: return
        outcome: removed
  - name: deleteMount
    narrative: []
    detail: intent
    intent: >-
      Finds the bound project's own subsystem document for the alias among the files the scan read
      and deletes it only when it carries projectPath — a legacy mount; a subsystem without
      projectPath is refused by name (it is content, not a mount), and no document answers false
      without writing. Drops the index cache after removing it, so the next read sees the member
      only through `members`.
    calls:
      - spec_file_store.remove
    symbol: removeLegacyMount
  - name: normalizeReferences
    narrative: []
    detail: intent
    intent: >-
      Loads the spec by its key as the scan bound it and runs the typed writer of its kind with the
      authored-text carry turned off, so every reference the loader binds is written in its
      canonical form relative to the project owning the spec: bare when it lands there,
      `alias::publicName` when it lands in another project the scan read. A component's `dependsOn`
      and `owns` are sets: where two authored texts bound one target (e.g. a member path and a
      leading `::` form), the canonical write keeps that target once, in first-written position. The
      positions the loader leaves raw — a trusted link's subsystem, a declared `calls` entry, a
      `component:` credential source, and each qualified name inside a type string (a field, a
      parameter, a return, and the display signature beside them) — are rewritten to the rewrite the
      scan recorded for them, token by token, so a deprecated form leaves those positions too; a raw
      one with no canonical text is left as written. Refuses before writing, naming the position and
      the text, when a bound reference carries a deprecated form (leading `::`, `super::`, member
      path) and bound outside or unresolved, since no canonical text exists for it. Compares the
      serialized document with the stored one and writes through the file store only when they
      differ, answering whether it wrote; the lock is never touched.
    calls:
      - spec_file_store.read
      - spec_file_store.write
    symbol: writeCanonicalReferences
  - name: rewriteReferences
    narrative: []
    detail: intent
    intent: >-
      Reads the stored document of the spec through the file store, as authored text (never the
      bound in-memory value, whose keys are the scan's). Walks the positions the loader parses — the
      same position vocabulary AuthoredReference records, an L0 export entry's `from` included — and
      for each edit finds its position: a whole-value position must hold exactly `from`; a type
      position must hold `from` as one qualified token of the type string, and the display signature
      beside a param or return is rewritten token for token with it. An edit whose `to` already
      stands at its position (and `from` no longer does) was applied before and is a no-op, which is
      what makes the write idempotent. When any other edit's `from` is absent from its position,
      refuses before writing, naming the spec, the position and both texts. Otherwise replaces each,
      serializes, and writes through the file store only when the text changed, answering whether it
      wrote.
    calls:
      - spec_file_store.read
      - spec_file_store.write
    symbol: respellReferences
lint:
  allow:
    - code: UNNARRATED_COMPLEXITY
      reason: >-
        dryRunSerializeSpecs is a uniform per-spec loop over the writer relativization + schema
        pipeline; its branching is per-kind dispatch and per-spec error collection — the semantics
        live in the writer pipeline it exercises, and ROUNDTRIP_SERIALIZATION findings carry the
        behavior contract.
status: complete
