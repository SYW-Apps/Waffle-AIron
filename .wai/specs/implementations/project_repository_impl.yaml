id: project_repository_impl
name: Project Repository Facade Implementation
description: >-
  Pure 1:1 forwarding facade over the owned project record store, write registry, and index. The
  facade adds no logic.
contract: iproject_repository
sourcePath: src/server/projects.ts
injectedParams:
  - dataDir
methods:
  - name: resolveRoot
    narrative:
      - stepNumber: 1
        description: >-
          Forward to the project index (authorization-narrowed resolution — a selector never widens
          scope)
        type: call
        targetComponent: project_index
        targetMethod: resolveRoot
    symbol: resolveProjectRoot
  - name: create
    narrative:
      - stepNumber: 1
        description: Forward to the project write registry (root allocation + record create)
        type: call
        targetComponent: project_write_registry
        targetMethod: create
    symbol: createProjectRecord
  - name: list
    narrative:
      - stepNumber: 1
        description: Forward to the project index
        type: call
        targetComponent: project_index
        targetMethod: list
    symbol: listProjectRecords
  - name: remove
    narrative:
      - stepNumber: 1
        description: Forward to the project write registry
        type: call
        targetComponent: project_write_registry
        targetMethod: remove
    symbol: removeProjectRecord
  - name: resolveBinding
    narrative:
      - stepNumber: 1
        description: >-
          Forward to the project index (full authorized binding — root, top project id, bound mount
          chain)
        type: call
        targetComponent: project_index
        targetMethod: resolveBinding
    symbol: resolveProjectBinding
  - name: existingRoot
    narrative:
      - stepNumber: 1
        description: Forward to the project index
        type: call
        targetComponent: project_index
        targetMethod: existingRoot
    symbol: existingProjectRoot
  - name: register
    narrative:
      - stepNumber: 1
        description: Forward to the project write registry
        type: call
        targetComponent: project_write_registry
        targetMethod: register
    symbol: registerProjectRecord
detail: calls-only
status: complete
createdAt: '2026-07-04T12:53:36.287Z'
updatedAt: '2026-09-25T22:45:11.427Z'
