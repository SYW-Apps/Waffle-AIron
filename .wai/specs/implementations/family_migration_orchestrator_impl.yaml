id: family_migration_orchestrator_impl
name: Family Migration Orchestrator Implementation
description: >-
  src/migrations/orchestrator.ts. The climb is the chaining migration's: one hop at a time through
  resolveChainingParent, which answers null where the request may not read above its root.
contract: ifamily_migration_orchestrator
sourcePath: src/migrations/orchestrator.ts
methods:
  - name: plan
    narrative:
      - stepNumber: 1
        label: climb
        description: >-
          Remember the bound root and the caller's binding — every path below restores it — and
          climb the membership chain one hop at a time
        type: loop
        condition: the last hop found a parent in reach
        loopKind: doWhile
        endStep: 3
      - stepNumber: 2
        description: >-
          Detect the current root's chaining parent: null for a top root, and null when the request
          may not read above its root — the caller must gate on reach itself, and this is where it
          does
        type: call
        targetComponent: migration_core_adapter
        targetMethod: resolveChainingParent
      - stepNumber: 3
        label: climbed
        description: >-
          When a parent was found, bind its root and continue from there; when none was found for a
          root that is itself a member, record the family as not whole
        type: local
      - stepNumber: 4
        description: Read the project graph of the highest root reached, and find the bound project's key in it
        type: call
        targetComponent: migration_core_adapter
        targetMethod: projectFamily
      - stepNumber: 5
        description: Look for unfinished transactions under the family root and the bound root, writing nothing
        type: call
        targetComponent: family_transaction
        targetMethod: recover
      - stepNumber: 6
        description: Is an earlier migration unfinished?
        type: branch
        condition: a transaction is pending
        onFalseStep: 8
      - stepNumber: 7
        description: 'Refuse: transaction-pending, naming `wairon doctor --fix`; restore the caller''s binding'
        type: return
        outcome: refused plan
      - stepNumber: 8
        label: route
        description: Route the request to its verb's planner
        type: switch
        'on': request.verb
        cases:
          - value: attach
            step: 9
          - value: detach
            step: 11
          - value: adopt
            step: 13
          - value: rename
            step: 15
          - value: rename-alias
            step: 17
          - value: internalize
            step: 19
          - value: externalize
            step: 19
          - value: chaining
            step: 21
          - value: promote
            step: 19
          - value: demote
            step: 19
      - stepNumber: 9
        label: attach
        description: Plan the attach
        type: call
        targetComponent: membership_migration
        targetMethod: planAttach
      - stepNumber: 10
        description: Planned
        type: jump
        toStep: 22
      - stepNumber: 11
        label: detach
        description: Plan the detach
        type: call
        targetComponent: membership_migration
        targetMethod: planDetach
      - stepNumber: 12
        description: Planned
        type: jump
        toStep: 22
      - stepNumber: 13
        label: adopt
        description: Plan the adopt
        type: call
        targetComponent: membership_migration
        targetMethod: planAdopt
      - stepNumber: 14
        description: Planned
        type: jump
        toStep: 22
      - stepNumber: 15
        label: rename
        description: Plan the project rename
        type: call
        targetComponent: identity_migration
        targetMethod: planRename
      - stepNumber: 16
        description: Planned
        type: jump
        toStep: 22
      - stepNumber: 17
        label: rename-alias
        description: Plan the alias rename
        type: call
        targetComponent: identity_migration
        targetMethod: planAliasRename
      - stepNumber: 18
        description: Planned
        type: jump
        toStep: 22
      - stepNumber: 19
        label: boundary
        description: >-
          Plan a boundary or storage verb — internalize, externalize, promote or demote — through
          the boundary migration's one entry
        type: call
        targetComponent: boundary_migration
        targetMethod: plan
      - stepNumber: 20
        description: Planned
        type: jump
        toStep: 22
      - stepNumber: 21
        label: chaining
        description: >-
          Plan the chaining migration with its own climb, and carry it as the plan's `chaining`
          part: its blocking findings become refusals, its projects and rewrites become edits
        type: call
        targetComponent: chaining_migration_orchestrator
        targetMethod: plan
      - stepNumber: 22
        label: planned
        description: >-
          Restore the caller's binding, then rehearse the plan (an already-refused plan comes back
          unchanged)
        type: call
        targetComponent: family_migration_orchestrator
        targetMethod: rehearse
      - stepNumber: 23
        description: Answer the plan
        type: return
        outcome: MigrationPlan
  - name: rehearse
    narrative:
      - stepNumber: 1
        description: Is the plan refused?
        type: branch
        condition: the plan is blocked, or its request asks for no rehearsal (doctor's summary)
        onFalseStep: 3
      - stepNumber: 2
        description: 'Answer it unchanged: nothing is rehearsed for a refused plan or a counts-only one'
        type: return
        outcome: refused plan
      - stepNumber: 3
        label: scope
        description: >-
          Read the project graph at the family root, under that root's binding: its nodes are the
          projects the rehearsal copies (the plan carries its family root, not the graph)
        type: call
        targetComponent: migration_core_adapter
        targetMethod: projectFamily
      - stepNumber: 4
        label: copy
        description: >-
          Copy every family project's .wai tree, the project the verb brings in (attach, adopt), and
          every project a family project names as an external by a path inside the family root, into
          a private rehearsal — so a pin taken on the copy reads the same producer the live pin
          would. A request carrying a relocation (hosted detach and adopt) is rehearsed with the
          relocation's coordinator (the host data directory) as the coordinator and an owner
          contributing its store files as areas, and with the project's old directory and its new
          root named whole (a family project inside them is copied once, by them); its writers run
          with the hosted record lookup answering the relocated project at its new place in the copy
        type: call
        targetComponent: family_transaction
        targetMethod: rehearse
      - stepNumber: 5
        description: Run the verb's own writes on the copy; a core writer's refusal ends the region
        type: try
        endStep: 14
        catches:
          - error: a core writer's refusal
            step: 18
      - stepNumber: 6
        description: Which writer?
        type: switch
        'on': plan.request.verb
        cases:
          - value: attach
            step: 7
          - value: detach
            step: 7
          - value: adopt
            step: 7
          - value: rename
            step: 9
          - value: rename-alias
            step: 9
          - value: internalize
            step: 11
          - value: externalize
            step: 11
          - value: chaining
            step: 13
      - stepNumber: 7
        label: membership
        description: Write the attach, detach or adopt into the rehearsal roots
        type: call
        targetComponent: membership_migration
        targetMethod: write
      - stepNumber: 8
        description: Written
        type: jump
        toStep: 14
      - stepNumber: 9
        label: identity
        description: Write the rename or alias rename into the rehearsal roots
        type: call
        targetComponent: identity_migration
        targetMethod: write
      - stepNumber: 10
        description: Written
        type: jump
        toStep: 14
      - stepNumber: 11
        label: boundary
        description: Write the internalize or externalize into the rehearsal roots
        type: call
        targetComponent: boundary_migration
        targetMethod: write
      - stepNumber: 12
        description: Written
        type: jump
        toStep: 14
      - stepNumber: 13
        label: chaining
        description: >-
          Write the chaining migration into the rehearsal roots: ids, exports, externals, the
          position migration's imports, moves, rewrites and pin deletions, and pins LAST — its order
          unchanged
        type: call
        targetComponent: chaining_migration_orchestrator
        targetMethod: write
      - stepNumber: 14
        label: written
        description: The verb's writes are on the copy
        type: local
      - stepNumber: 15
        description: 'Diff the copy against the live family: the plan''s file changes'
        type: call
        targetComponent: family_transaction
        targetMethod: diff
      - stepNumber: 16
        description: >-
          Read each changed owner's lock record; an owner that carries one is a project to re-lock.
          A rename lists every owner it writes, lock or none, the renamed project first: the id is
          part of what any approval of them names
        type: call
        targetComponent: migration_core_adapter
        targetMethod: approvalRecord
      - stepNumber: 17
        description: Answer the plan with its rehearsal, file changes and re-lock list
        type: return
        outcome: rehearsed plan
      - stepNumber: 18
        label: refused-on-copy
        description: Drop the rehearsal
        type: call
        targetComponent: family_transaction
        targetMethod: discard
      - stepNumber: 19
        description: >-
          Answer the plan with the writer's refusal (internalize-refused, externalize-refused) and
          its message
        type: return
        outcome: refused plan
  - name: apply
    narrative:
      - stepNumber: 1
        description: Is the plan refused?
        type: branch
        condition: the plan is blocked
        onFalseStep: 4
      - stepNumber: 2
        description: Drop any rehearsal it holds
        type: call
        targetComponent: family_transaction
        targetMethod: discard
      - stepNumber: 3
        description: 'Answer not applied: refused, nothing written'
        type: return
        outcome: not applied
      - stepNumber: 4
        label: rehearsed
        description: >-
          Was it planned without a rehearsal (doctor's chaining plan, confirmed as the chaining plan
          it printed)?
        type: branch
        condition: the plan carries no rehearsal
        onFalseStep: 6
      - stepNumber: 5
        description: >-
          Rehearse it now, with its request's rehearse flag set true so rehearse does not skip it
          again; a refusal met on the copy comes back as the plan's refusal
        type: call
        targetComponent: family_migration_orchestrator
        targetMethod: rehearse
      - stepNumber: 6
        label: anything
        description: Is there anything to apply?
        type: branch
        condition: the plan is blocked (refused on the copy) or has no file change
        onFalseStep: 9
      - stepNumber: 7
        description: Drop any rehearsal it holds
        type: call
        targetComponent: family_transaction
        targetMethod: discard
      - stepNumber: 8
        description: >-
          Answer not applied: refused on the copy, or nothing to do (a completed migration re-plans
          empty)
        type: return
        outcome: not applied
      - stepNumber: 9
        label: commit
        description: Commit the rehearsal's file changes all or nothing
        type: call
        targetComponent: family_transaction
        targetMethod: commit
      - stepNumber: 10
        description: >-
          The next read sees the new files without a cache dropped by hand (no contract into
          sdd_core offers one): the core's spec workspace re-verifies its file signature on the
          first read of every new root binding, and at most 2 s later otherwise, and every swapped
          file carries a new mtime
        type: local
      - stepNumber: 11
        description: >-
          Answer the report: applied with the re-lock list when committed; otherwise the failure and
          whether the family was restored
        type: return
        outcome: FamilyMigrationReport
  - name: discard
    narrative:
      - stepNumber: 1
        description: Drop the plan's rehearsal, if it holds one
        type: call
        targetComponent: family_transaction
        targetMethod: discard
  - name: recover
    narrative:
      - stepNumber: 1
        description: Report or resolve the unfinished transactions under the root
        type: call
        targetComponent: family_transaction
        targetMethod: recover
status: complete
