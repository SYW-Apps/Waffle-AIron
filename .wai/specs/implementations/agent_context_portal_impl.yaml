id: agent_context_portal_impl
name: Agent Context Portal Implementation
description: >-
  Realized by src/core/index.ts, the module that republishes core's portals, alongside core's other
  portals (N:1). Each method is an identity re-export or a one-call forward to the component that
  holds the topology, generation, domain or context logic.
contract: iagent_context_portal
sourcePath: src/core/index.ts
methods:
  - name: resolveAgentTopology
    narrative:
      - stepNumber: 1
        description: Forward resolveAgentTopology call to agent resolver
        type: call
        targetComponent: agent_resolver
        targetMethod: resolveAgentTopology
  - name: composeAgentBrief
    narrative:
      - stepNumber: 1
        description: Forward to the agent resolver's live brief composition
        type: call
        targetComponent: agent_resolver
        targetMethod: composeAgentBrief
  - name: generateAll
    narrative:
      - stepNumber: 1
        description: Forward to the agent file generator
        type: call
        targetComponent: agent_file_generator
        targetMethod: generateAll
  - name: resolveExpectedOutputPaths
    narrative:
      - stepNumber: 1
        description: Forward to the agent file generator's path enumeration, which writes nothing
        type: call
        targetComponent: agent_file_generator
        targetMethod: resolveExpectedOutputPaths
  - name: loadRegistry
    narrative:
      - stepNumber: 1
        description: >-
          Re-export the derived registry — the same function published under this surface, so the
          call resolves by identity
        type: call
        targetComponent: agent_resolver
        targetMethod: loadRegistry
  - name: resolveDomains
    narrative:
      - stepNumber: 1
        description: >-
          Forward to the domain projector, which answers across the spec tree and the configuration
          alike
        type: call
        targetComponent: domain_projector
        targetMethod: resolve
  - name: addDomain
    narrative:
      - stepNumber: 1
        description: >-
          Forward to the domain curator, which decides whether the id is free before anything is
          persisted
        type: call
        targetComponent: domain_curator
        targetMethod: register
  - name: removeDomain
    narrative:
      - stepNumber: 1
        description: Forward to the domain curator — the portal does not reach the repository's writes directly
        type: call
        targetComponent: domain_curator
        targetMethod: unregister
  - name: detectDomainCandidates
    narrative:
      - stepNumber: 1
        description: Forward to the domain detector, which proposes and never registers
        type: call
        targetComponent: domain_detector
        targetMethod: detectCandidates
  - name: deriveExecutionProfile
    narrative:
      - stepNumber: 1
        description: Forward to the execution profiler
        type: call
        targetComponent: execution_profiler
        targetMethod: derive
  - name: resolveBudget
    narrative:
      - stepNumber: 1
        description: Forward to the budget policy
        type: call
        targetComponent: budget_policy
        targetMethod: resolve
  - name: globalGuideFilePath
    narrative:
      - stepNumber: 1
        description: Forward 1:1 to the tool guide
        type: call
        targetComponent: ai_tool_guide
        targetMethod: globalPath
  - name: localGuideFilePath
    narrative:
      - stepNumber: 1
        description: Forward 1:1 to the tool guide
        type: call
        targetComponent: ai_tool_guide
        targetMethod: localPath
  - name: injectGuide
    narrative:
      - stepNumber: 1
        description: Forward 1:1 to the tool guide
        type: call
        targetComponent: ai_tool_guide
        targetMethod: inject
  - name: writeRootGuideDelegator
    narrative:
      - stepNumber: 1
        description: Forward 1:1 to the tool guide
        type: call
        targetComponent: ai_tool_guide
        targetMethod: writeDelegator
  - name: reinjectLocalGuides
    narrative:
      - stepNumber: 1
        description: Forward 1:1 to the tool guide
        type: call
        targetComponent: ai_tool_guide
        targetMethod: refreshLocal
  - name: readStampVersion
    narrative:
      - stepNumber: 1
        description: Forward 1:1 to the version stamp
        type: call
        targetComponent: version_stamp
        targetMethod: parse
  - name: syncContextFiles
    narrative:
      - stepNumber: 1
        description: Forward 1:1 to the context composer
        type: call
        targetComponent: context_composer
        targetMethod: refresh
  - name: hasContext
    narrative:
      - stepNumber: 1
        description: Forward 1:1 to the context composer
        type: call
        targetComponent: context_composer
        targetMethod: hasNotes
  - name: derivedDocPaths
    narrative:
      - stepNumber: 1
        description: Forward 1:1 to the context composer
        type: call
        targetComponent: context_composer
        targetMethod: derivedPaths
status: complete
createdAt: '2026-09-25T17:33:15.144Z'
updatedAt: '2026-09-25T17:33:38.008Z'
