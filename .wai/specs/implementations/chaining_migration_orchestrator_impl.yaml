id: chaining_migration_orchestrator_impl
name: Chaining Migration Orchestrator Implementation
description: >-
  Plans a family's chaining migration from the graph, the scan's bindings and export usage — merging
  the position migration's plan and stage 4's positional step (position_reader) — and applies a
  confirmed plan ids first, then exports, externals, imports and the position migration's moves and
  rewrites, and pins last, binding each project's root for its writes and restoring the caller's
  binding on every path.
contract: ichaining_migration_orchestrator
sourcePath: src/commands/chaining-migration.ts
methods:
  - name: plan
    narrative:
      - stepNumber: 1
        label: climb
        description: >-
          Remember the bound root and the caller's binding — every path below restores the binding —
          and climb the membership chain one hop at a time
        type: loop
        condition: the last hop found a parent in reach
        loopKind: doWhile
        endStep: 3
      - stepNumber: 2
        description: >-
          Detect the current root's chaining parent: null for a top root, and null when the request
          may not read above its root — the caller must gate on reach itself, and this is where it
          does
        type: call
        targetComponent: cli_core_adapter
        targetMethod: resolveChainingParent
      - stepNumber: 3
        label: climbed
        description: >-
          When a parent was found, bind its root and continue from there; when none was found for a
          root that is itself chained, the next hop is out of reach — record the family as partial
          (a family-partial finding, blocking)
        type: local
      - stepNumber: 4
        label: graph
        description: >-
          Read the project graph of the highest root reached: its nodes (id and where it came from,
          parent, mount alias, directory, members, declared externals bound to their producers), its
          owners, its cross-project references and its identity problems
        type: call
        targetComponent: cli_core_adapter
        targetMethod: projectFamily
      - stepNumber: 5
        label: ids
        description: Decide an id for each project
        type: loop
        loopKind: forEach
        over: the graph's nodes
        endStep: 7
      - stepNumber: 6
        description: >-
          Read the lock record the node's own root carries, for the project id it approved (none for
          a root never locked, or locked before project ids existed)
        type: call
        targetComponent: cli_core_adapter
        targetMethod: approvalRecord
      - stepNumber: 7
        label: decide-id
        description: >-
          Decide the node's id. A node with no readable configuration is reported absent
          (project-absent, blocking only if the plan must write it) — doctor --fix's configuration
          backfill runs earlier and writes one for a chained child. A declared id stays and nothing
          is written. Otherwise, in order: the id the node's lock approved, when there is one — the
          approved id is the stable one, and writing any other would raise PROJECT_ID_CHANGED, which
          also blocks the re-lock (a member whose approved id differs from its mount's subsystem id
          is reported id-locked, and keeps the approved id); else, for a member, its mount's
          subsystem id — the id its PROJECT_ID_DEFAULTED names; else, for the top root, its
          effective id (the name slug). A top root whose name yields no id is reported id-ambiguous
          and given none
        type: local
      - stepNumber: 8
        description: >-
          Check the planned ids across the family: a planned id outside the project-id grammar, or
          equal to another project's declared or planned id, is reported id-ambiguous for every
          project involved and none of them is written — never guessed. An external some project
          already declares that finds its producer by the id that producer is about to leave is
          reported declaration-orphaned: after apply it would stop resolving, and only its author
          can re-point it
        type: local
      - stepNumber: 9
        label: pairs
        description: Plan the exports, externals and pins each crossing needs
        type: loop
        loopKind: forEach
        over: each (consumer, producer) pair among the graph's cross-project references
        endStep: 17
      - stepNumber: 10
        description: >-
          Map the consumer's references into the producer onto the producer's public names; what
          lands on none is unexported
        type: call
        targetComponent: cli_core_adapter
        targetMethod: exportUsage
      - stepNumber: 11
        description: >-
          Read the producer's current project table, so a planned public name can be checked against
          every name it already binds
        type: call
        targetComponent: cli_core_adapter
        targetMethod: resolveProjectExports
      - stepNumber: 12
        label: unexported
        description: Plan an entry for each reference that lands on no public name
        type: loop
        loopKind: forEach
        over: the usage's unexported references
        endStep: 15
      - stepNumber: 13
        description: >-
          Read the spec the reference targets — a component, a subsystem-owned type, a project-level
          type (a type of the producer with no subsystem), or (for an L1 re-export) a whole
          subsystem — for the subsystem that owns it: the entry's source; a project-level type has
          none
        type: call
        targetComponent: cli_core_adapter
        targetMethod: loadSpec
      - stepNumber: 14
        description: >-
          Read the source subsystem's L1 table: an L0 re-export can only follow what the subsystem
          already publishes to its own project
        type: call
        targetComponent: cli_core_adapter
        targetMethod: resolveSubsystemExports
      - stepNumber: 15
        label: plan-entry
        description: >-
          Plan the producer's entry — for a subsystem-owned item, one per source subsystem and item,
          `from: <subsystem>` with the component or the typeDef; for a project-level type, the own
          `{ typeDef }` entry with no `from` (the crate-root `pub struct`), needing no L1
          publication; audience project, no `as`, reason reference — or merge the consumer and the
          member it reaches into the entry already planned. A producer that gains an entry and has
          no L0 is marked to get a minimal one (createsSystem). Report instead, leaving the
          reference as it is: a reference that names nothing the producer declares (target-missing,
          naming what was looked for — never 'does not hold' for a project-level type, which is now
          exported); a whole-subsystem target (subsystem-reference); a subsystem-owned item its
          subsystem does not publish (target-unpublished: publish it at L1 first, or the reference
          is wrong); an item exported already but under a narrowing that does not declare the member
          reached (narrowed); an item whose default public name already binds another target in the
          producer's table (name-taken)
        type: local
      - stepNumber: 16
        description: >-
          Unless the consumer already declares the producer (ProjectFamily.declares: a direct member
          needs no declaration — its `members` key or mount is its alias — and an external that
          already resolves to the producer is one), plan the consumer's external: the alias is the
          producer's planned id and the declaration `{}`, since the alias defaults the producer id —
          the same alias the scan's rewrites name. Report instead when there is no planned id, when
          the id does not fit the alias grammar [a-z0-9-_]+ (alias-invalid: a dotted id needs an
          alias a person chooses), or when the alias is already taken in the consumer by another
          declaration or a member (alias-taken)
        type: local
      - stepNumber: 17
        label: pin
        description: >-
          Plan a pin of the consumer's alias for the producer whenever an entry or a declaration was
          planned for the pair, so its snapshot carries the new entries and its lock's used map
          covers the references
        type: local
      - stepNumber: 18
        label: legacy
        description: Convert each member's stage-1 pins
        type: loop
        loopKind: forEach
        over: each node with a parent (a chained member)
        endStep: 20
      - stepNumber: 19
        description: >-
          Under the member's binding, list its stage-1 family pins: the generated family and sibling
          snapshots in its .wai/surfaces
        type: call
        targetComponent: cli_surfaces_client_adapter
        targetMethod: listFamilyPins
      - stepNumber: 20
        label: convert
        description: >-
          A parent pin converts: plan an external for the parent under its planned id, and a pin,
          unless the member already declares the parent or a crossing above planned it. Every family
          pin — the parent pin and each sibling pin — is recorded as superseded, for the position
          migration to delete once the externals are pinned: nothing reads them since stage 3. Bind
          back to the top root
        type: local
      - stepNumber: 21
        label: position
        description: >-
          Plan the retirement of position from the same graph — the legacy mounts to move with what
          they carry, the deprecated references to rewrite (stage 4's self-prefixed ones among
          them), stage 4's positional imports with the reason each producer was chosen, the absent
          members — and merge it: each planned member into its parent's entry, its carried entries
          into the member's exports (a member with no L0 marked createsSystem), each positional
          import into its consumer's imports with the export it needs merged into the producer's
          exports (reason positional, checked exactly as step 15 checks an entry) and, when the
          consumer does not declare the producer, an external planned exactly as step 16 plans one
          (reason positional) with a pin, the rewrites into the plan (a rewrite into a producer its
          referrer does not declare yet spelled with the alias this plan declares for it), its
          findings after these. Then list every consumer → producer edge the plan introduces that no
          external and no pin of the consumer had before, with its reference count, as the plan's
          newDependencies — listed, never blocking, no layering guessed
        type: call
        targetComponent: position_migration_orchestrator
        targetMethod: plan
      - stepNumber: 22
        label: dropped
        description: Find what the L0 writes would drop
        type: loop
        loopKind: forEach
        over: each project that gains L0 entries and already has an L0
        endStep: 23
      - stepNumber: 23
        label: dry-run-l0
        description: >-
          Under the project's binding, run its one L0 delta through the gated seam as a dry run —
          nothing is written — and record the report's strippedKeys (keys the stored L0 file carries
          that the schema does not know, e.g. `status: draft`) as the project's droppedKeys, to
          print and confirm with the rest of the plan
        type: call
        targetComponent: cli_authoring_adapter
        targetMethod: updateSpecGated
      - stepNumber: 24
        description: >-
          Restore the caller's binding; drop the projects with nothing to write, and order the rest
          top root first, then members in the graph's walk order
        type: local
      - stepNumber: 25
        description: Answer the plan with every finding
        type: return
        outcome: ChainingMigrationPlan
  - name: apply
    narrative:
      - stepNumber: 1
        description: Is there anything to write?
        type: branch
        condition: the plan is empty (ChainingMigrationPlan.isEmpty)
        onFalseStep: 3
      - stepNumber: 2
        description: Answer applied false with nothing written and nothing to re-lock
        type: return
        outcome: nothing to migrate
      - stepNumber: 3
        label: blocked
        description: Does a finding refuse apply?
        type: branch
        condition: >-
          the plan is blocked (ChainingMigrationPlan.blocked): the family was partial, a project it
          writes or a member the family declares was absent, or a legacy mount carries a field it
          cannot move
        onFalseStep: 5
      - stepNumber: 4
        description: Refuse before the first write, naming each blocking finding
        type: throw
        error: ChainingMigrationRefusedError
      - stepNumber: 5
        label: preflight
        description: Check every project the plan writes before writing any
        type: loop
        loopKind: forEach
        over: the plan's projects
        endStep: 10
      - stepNumber: 6
        description: Bind the project's root
        type: local
      - stepNumber: 7
        description: Is the project still there, with a configuration?
        type: call
        targetComponent: cli_core_adapter
        targetMethod: projectConfigExists
      - stepNumber: 8
        description: A project that disappeared since the plan was made
        type: branch
        condition: the project has no configuration
        onFalseStep: 10
      - stepNumber: 9
        description: >-
          Restore the caller's binding and refuse before the first write, naming the project: a
          project it must write is absent
        type: throw
        error: ChainingMigrationRefusedError
      - stepNumber: 10
        label: dry-run
        description: >-
          When the project gains L0 entries and already has an L0, run their one delta on its system
          spec through the gated authoring seam as a dry run: the whole write, gate included, with
          nothing written — a refusal raises here, before anything reached disk. A project marked
          createsSystem has no L0 to merge into yet; its minimal L0 is judged by the gate when it is
          written
        type: call
        targetComponent: cli_authoring_adapter
        targetMethod: updateSpecGated
      - stepNumber: 11
        label: ids
        description: 'Declare the ids first: every external resolves its producer by id'
        type: loop
        loopKind: forEach
        over: the projects with an id to write
        endStep: 13
      - stepNumber: 12
        description: Bind the project's root
        type: local
      - stepNumber: 13
        label: set-id
        description: >-
          Declare the planned id in its project.yaml — an edit that keeps every comment; the same id
          declared already writes nothing, a different one is refused and never overwritten
        type: call
        targetComponent: cli_core_adapter
        targetMethod: setProjectId
      - stepNumber: 14
        label: exports
        description: Then the producers' exports, so every pin below projects them
        type: loop
        loopKind: forEach
        over: the projects with export entries to add
        endStep: 16
      - stepNumber: 15
        label: create-system
        description: >-
          Under the producer's binding, when it is marked createsSystem, write its minimal L0
          through the gated seam first — new content: its display name (read from its
          configuration), as vision the description its legacy mount carries into the member entry
          (else one line naming it an exporting project), nothing else; an L0 that appeared since
          the plan is kept and nothing is written
        type: call
        targetComponent: cli_authoring_adapter
        targetMethod: writeSpec
      - stepNumber: 16
        label: add-entries
        description: >-
          Add the planned entries to its L0 publicInterfaces in one gated delta on its system spec —
          re-exports, own `{ typeDef }` entries and entries carried from its mount alike; a carried
          entry marked publishAtL1 is first published as an own item of its member subsystem, in one
          gated delta on that subsystem's spec. Entries upsert by from + item + interface + as (an
          L1 own item by component + interface), so an entry already present changes nothing and a
          second apply writes nothing
        type: call
        targetComponent: cli_authoring_adapter
        targetMethod: updateSpecGated
      - stepNumber: 17
        label: externals
        description: Then the consumers' externals
        type: loop
        loopKind: forEach
        over: each planned external of each project
        endStep: 19
      - stepNumber: 18
        description: Bind the consumer's root
        type: local
      - stepNumber: 19
        label: declare
        description: >-
          Declare the external in its project.yaml — the same declaration under the alias writes
          nothing, a different one is refused and never overwritten
        type: call
        targetComponent: cli_core_adapter
        targetMethod: declareExternal
      - stepNumber: 20
        label: position
        description: >-
          Then retire position, once every id, export and declaration it relies on is written: add
          each positional import to its consumer's `use`, move each planned mount into its parent's
          `members`, rewrite each planned reference from the family's top root (deprecated forms,
          and stage 4's self-prefixed ones to their bare local id), and delete the superseded
          stage-1 family pins, which nothing reads — BEFORE any pin, so every snapshot is projected
          from the final spelling (a rewrite inside a producer after its consumers pinned it moved
          their digests before digests were canonical)
        type: call
        targetComponent: position_migration_orchestrator
        targetMethod: apply
      - stepNumber: 21
        label: pins
        description: Pin LAST, once every id, export, declaration, import and rewrite is written
        type: loop
        loopKind: forEach
        over: the projects with aliases to pin
        endStep: 23
      - stepNumber: 22
        description: Bind the consumer's root
        type: local
      - stepNumber: 23
        label: pin
        description: >-
          Pin the planned aliases: each snapshot projects the producer's new entries and each lock's
          used map covers the migrated references; an unchanged snapshot is not rewritten. The
          caller must gate on reach itself — a producer out of reach is reported unreachable and
          keeps its previous pin
        type: call
        targetComponent: cli_surfaces_client_adapter
        targetMethod: pinExternals
      - stepNumber: 24
        description: >-
          Restore the caller's binding. Collect every file that changed, in write order — its own
          and the position migration's — and every project whose approval the writes staled: a
          producer whose L0 was created or changed (its spec digests moved), a consumer whose
          externals or pins changed (gate inputs), and each project the position migration names.
          Nothing is locked here — re-locking is each project's human
        type: local
      - stepNumber: 25
        description: 'Answer the report: the plan, applied true, the files written and the projects to re-lock'
        type: return
        outcome: ChainingMigrationReport
