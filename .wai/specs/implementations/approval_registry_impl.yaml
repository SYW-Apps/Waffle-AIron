id: approval_registry_impl
name: Approval Registry Implementation
description: >-
  Write path for hosted approval requests: create pending, record decisions, mark completed, cancel,
  and expire overdue. Owns the pending-and-unexpired state invariants and the decision stamping;
  performs no authorization. Every operation is ONE store update: the request set is read fresh
  under approvals.json's write lock, the change is applied to that set, and the replacement is
  written before the lock is released, so concurrent writers in other processes are never lost.
contract: iapproval_registry
sourcePath: src/server/approvals.ts
methods:
  - name: create
    narrative: []
    intent: >-
      In one store update: stamp the new request's id, createdAt, and status pending - preserving
      the caller-supplied redacted summary and payload, and rejecting (before the update) a payload
      that smells like a raw secret or bearer token - and append it to the set read under the lock;
      return the stored request. A failure leaves the previous set intact and surfaces as a storage
      error.
    calls:
      - approval_store.update
  - name: decide
    narrative: []
    intent: >-
      In one store update: locate the request by the decision's requestId - failing with a not-found
      error when absent - and reject with a validation error any request that is not currently
      pending or whose expiresAt has already passed. Stamp decidedBy, decidedAt, and decisionReason
      from the decision and set status to approved or denied accordingly. Authorization - including
      the self-approval check that decidedBy differ from requestedBy - is enforced by the
      orchestrator, not here; the registry owns only the pending-and-unexpired state invariant and
      the decision stamping. The state check runs on the set read under the lock, so two concurrent
      decisions cannot both succeed.
    calls:
      - approval_store.update
  - name: markCompleted
    narrative: []
    intent: >-
      In one store update: locate the request by id - failing with a not-found error when absent -
      and transition it to completed only from an approved status (any other status is a validation
      error), setting the supplied executionSummary on it when one is given. Records that the
      approved privileged action has executed exactly once.
    calls:
      - approval_store.update
  - name: expirePending
    narrative: []
    intent: >-
      In one store update: flip every pending request whose expiresAt is at or before the supplied
      now-timestamp to expired, and return the count flipped. A set with no overdue pending requests
      changes nothing and returns zero; a failure leaves the previous set intact.
    calls:
      - approval_store.update
  - name: cancel
    narrative: []
    intent: >-
      In one store update: locate the request by id - failing with a not-found error when absent -
      and transition it to cancelled only from an approved status (any other status is a validation
      error), recording the supplied reason as its executionSummary. A cancelled request is final
      and is never executed.
    calls:
      - approval_store.update
detail: intent
status: complete
