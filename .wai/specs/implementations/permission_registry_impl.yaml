id: permission_registry_impl
name: Permission Registry Implementation
description: >-
  Write path for the permission-assignment grid: keyed upsert, removal, and unit-move scope remap.
  No authorization. Every operation is ONE store update: the grid is read fresh under
  permissions.json's write lock, the change is applied to that grid and the replacement is written
  before the lock is released, so two parallel grants in different processes are both kept.
contract: ipermission_registry
sourcePath: src/server/permissions.ts
injectedParams:
  - dataDir
methods:
  - name: setAssignment
    narrative:
      - stepNumber: 1
        description: >-
          Everything below is the change of the ONE store update: it works on the assignment grid
          the update hands over (fresh, under the file's write lock)
        type: local
      - stepNumber: 2
        description: >-
          Find the stored assignment with the same natural key (subject kind and id, scope kind and
          id, capability), if any
        type: local
      - stepNumber: 3
        description: An 'inherit' value clears the override instead of storing it
        type: branch
        condition: assignment.value is 'inherit'
        onTrueStep: 4
        onFalseStep: 7
      - stepNumber: 4
        description: Only a stored override has anything to clear
        type: branch
        condition: an assignment with that key is stored
        onTrueStep: 5
        onFalseStep: 6
      - stepNumber: 5
        description: 'Drop the matched assignment: the store persists the reduced grid atomically under the lock'
        type: call
        targetComponent: permission_store
        targetMethod: update
      - stepNumber: 6
        description: >-
          Return the clearance, carrying the matched assignment's id and createdAt, or fresh ones
          when nothing was stored
        type: return
        outcome: cleared
      - stepNumber: 7
        description: >-
          Build the stored assignment: a fresh id and createdAt on create, the matched one's on
          replace; append it, or replace the match in place
        type: local
      - stepNumber: 8
        description: 'Persist the grid atomically: the store writes the change''s result under the lock'
        type: call
        targetComponent: permission_store
        targetMethod: update
      - stepNumber: 9
        description: Return the stored assignment
        type: return
        outcome: success
    detail: full
    intent: >-
      In one store update: find any existing assignment with the same (subjectKind, subjectId,
      scopeKind, scopeId, capability) key in the grid read under the lock; when value is 'inherit',
      remove that override, otherwise upsert - replacing the existing value in place or stamping
      id/createdAt on a new one. Return the stored assignment. A failure leaves the previous grid
      intact.
    calls: []
    symbol: registrySet
  - name: removeAssignment
    narrative: []
    intent: >-
      In one store update: remove the assignment with the given id from the grid read under the
      lock; an absent assignment is a no-op.
    calls:
      - permission_store.update
    symbol: registryRemove
  - name: remapScope
    narrative: []
    intent: >-
      In one store update: for every assignment whose scopeId matches an old id in the remap,
      rewrite it to the corresponding new id (a unit rename/move). Assignments outside the remap are
      untouched.
    calls:
      - permission_store.update
    symbol: registryRemapScope
  - name: removeAssignmentsForScopes
    narrative: []
    detail: intent
    intent: >-
      In one store update: drop every assignment whose scopeId appears in the supplied set (a
      cascade-deleted subtree). Assignments outside the set are untouched; an empty set is a no-op.
    calls:
      - permission_store.update
    symbol: registryRemoveForScopes
detail: intent
status: complete
createdAt: '2026-07-15T20:29:02.068Z'
