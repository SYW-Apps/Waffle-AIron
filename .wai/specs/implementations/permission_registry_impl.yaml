id: permission_registry_impl
name: Permission Registry Implementation
description: >-
  Write path for the permission-assignment grid: keyed upsert, removal, and unit-move scope remap,
  with durable persistence and store refresh. No authorization.
contract: ipermission_registry
sourcePath: src/server/permissions.ts
injectedParams:
  - dataDir
methods:
  - name: setAssignment
    narrative:
      - stepNumber: 1
        description: Load the current assignment grid
        type: call
        targetComponent: permission_store
        targetMethod: load
      - stepNumber: 2
        description: >-
          Find the stored assignment with the same natural key (subject kind and id, scope kind and
          id, capability), if any
        type: local
      - stepNumber: 3
        description: An 'inherit' value clears the override instead of storing it
        type: branch
        condition: assignment.value is 'inherit'
        onTrueStep: 4
        onFalseStep: 7
      - stepNumber: 4
        description: Only a stored override has anything to clear
        type: branch
        condition: an assignment with that key is stored
        onTrueStep: 5
        onFalseStep: 6
      - stepNumber: 5
        description: Drop the matched assignment and persist the grid atomically
        type: call
        targetComponent: permission_store
        targetMethod: replaceAll
      - stepNumber: 6
        description: >-
          Return the clearance, carrying the matched assignment's id and createdAt, or fresh ones
          when nothing was stored
        type: return
        outcome: cleared
      - stepNumber: 7
        description: >-
          Build the stored assignment: a fresh id and createdAt on create, the matched one's on
          replace; append it, or replace the match in place
        type: local
      - stepNumber: 8
        description: Persist the grid atomically
        type: call
        targetComponent: permission_store
        targetMethod: replaceAll
      - stepNumber: 9
        description: Return the stored assignment
        type: return
        outcome: success
    detail: full
    intent: >-
      Find any existing assignment with the same (subjectKind, subjectId, scopeKind, scopeId,
      capability) key; when value is 'inherit', remove that override, otherwise upsert — replacing
      the existing value in place or stamping id/createdAt on a new one. Rewrite the persisted
      collection via write-temp-then-rename, refresh the store with replaceAll, and return the
      stored assignment. Persistence failures leave the previous collection intact.
    calls: []
    symbol: registrySet
  - name: removeAssignment
    narrative: []
    intent: >-
      Remove the assignment with the given id from the collection, rewrite via
      write-temp-then-rename, and refresh the store; an absent assignment is a no-op.
    calls:
      - permission_store.load
      - permission_store.replaceAll
    symbol: registryRemove
  - name: remapScope
    narrative: []
    intent: >-
      For every assignment whose scopeId matches an old id in the remap, rewrite it to the
      corresponding new id (a unit rename/move), then rewrite the persisted collection via
      write-temp-then-rename and refresh the store. Assignments outside the remap are untouched.
    calls:
      - permission_store.load
      - permission_store.replaceAll
    symbol: registryRemapScope
  - name: removeAssignmentsForScopes
    narrative: []
    detail: intent
    intent: >-
      Drop every assignment whose scopeId appears in the supplied set (a cascade-deleted subtree),
      rewrite the persisted collection via write-temp-then-rename, and refresh the store.
      Assignments outside the set are untouched; an empty set is a no-op.
    calls:
      - permission_store.load
      - permission_store.replaceAll
    symbol: registryRemoveForScopes
detail: intent
status: complete
createdAt: '2026-07-15T20:29:02.068Z'
updatedAt: '2026-10-04T19:41:46.780Z'
