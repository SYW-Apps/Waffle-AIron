id: surface_transfer_adapter_impl
name: Surface Transfer Adapter Implementation
description: Cross-location surface file exchange.
contract: isurface_transfer_adapter
sourcePath: src/core/surfaces.ts
methods:
  - name: writeSnapshotTo
    narrative: []
    detail: intent
    intent: >-
      Writes the export to the target path, creating missing directories: with no rendered documents
      it writes the snapshot as native YAML; with exactly one it writes that document at the target;
      with several it writes one file per portal beside the target (<stem>.<portalId><ext>, the
      portal id sanitized so it cannot escape the output directory), never only the first. Returns
      every path written.
    symbol: writeSurfaceFile
  - name: readDocument
    narrative: []
    detail: intent
    intent: >-
      Reads the foreign surface document at the source path as UTF-8 text without interpreting it
      (decoding is the codec's or orchestrator's concern); fails with a clear not-found error naming
      the path.
    symbol: readSurfaceDocument
  - name: writeDesignTo
    narrative: []
    detail: intent
    intent: >-
      Writes the design export to the target path as UTF-8 JSON, creating missing directories: its
      deterministic serialization (sorted object keys, two-space indent, one trailing newline), so
      the same design writes the same bytes. Overwrites an existing file; fails with a clear error
      naming the path when it cannot be written. Returns the path written.
status: complete
