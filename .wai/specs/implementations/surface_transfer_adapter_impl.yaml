id: surface_transfer_adapter_impl
name: Surface Transfer Adapter Implementation
description: Cross-location surface file exchange.
contract: isurface_transfer_adapter
sourcePath: src/core/surfaces.ts
methods:
  - name: writeSnapshotTo
    narrative: []
    detail: intent
    intent: >-
      Writes the snapshot to the target location: given a directory (e.g. a chained child's project
      root), writes <dir>/.wai/surfaces/<producingProject>.yaml; given a file path, writes exactly
      there; when a pre-rendered document body is supplied (e.g. OpenAPI), writes that body instead
      of native YAML. Creates missing directories, overwrites atomically, and returns the written
      path. Refuses path traversal outside the workspace family.
    symbol: exportSurface
  - name: readDocument
    narrative: []
    detail: intent
    intent: >-
      Reads the foreign surface document at the source path as UTF-8 text without interpreting it
      (decoding is the codec's or orchestrator's concern); fails with a clear not-found error naming
      the path.
    symbol: importSurface
status: complete
createdAt: '2026-07-10T23:15:58.334Z'
updatedAt: '2026-07-11T19:14:23.211Z'
