id: admin_orchestrator_impl
name: Admin Orchestrator Implementation
description: >-
  Control-plane workflows: master-credential auth then project/key lifecycle, git-aware
  lock/promote, diagrams, and git backing.
contract: iadmin_orchestrator
sourcePath: src/server/admin.ts
methods:
  - name: createProject
    narrative:
      - stepNumber: 1
        description: Authenticate the master credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateMaster
      - stepNumber: 2
        description: If not an admin principal, reject
        type: branch
        condition: not an admin principal
        onFalseStep: 4
      - stepNumber: 3
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 4
        description: Allocate and register the project
        type: call
        targetComponent: project_registry
        targetMethod: create
      - stepNumber: 5
        description: Bind the new project's isolated root
        type: local
      - stepNumber: 6
        description: Bootstrap the isolated spec tree
        type: call
        targetComponent: host_core_adapter
        targetMethod: provisionProject
      - stepNumber: 7
        description: Return the created project record
        type: return
        outcome: created project record
  - name: destroyProject
    narrative:
      - stepNumber: 1
        description: Authenticate the master credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateMaster
      - stepNumber: 2
        description: If not an admin principal, reject
        type: branch
        condition: not an admin principal
        onFalseStep: 4
      - stepNumber: 3
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 4
        description: Deregister the project and remove its tree
        type: call
        targetComponent: project_registry
        targetMethod: remove
      - stepNumber: 5
        description: Return once destroyed
        type: return
        outcome: destroyed
  - name: listProjects
    narrative:
      - stepNumber: 1
        description: Authenticate the master credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateMaster
      - stepNumber: 2
        description: If not an admin principal, reject
        type: branch
        condition: not an admin principal
        onFalseStep: 4
      - stepNumber: 3
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 4
        description: List hosted projects
        type: call
        targetComponent: project_registry
        targetMethod: list
      - stepNumber: 5
        description: Return the project list
        type: return
        outcome: project list
  - name: mintKey
    narrative:
      - stepNumber: 1
        description: Authenticate the master credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateMaster
      - stepNumber: 2
        description: If not an admin principal, reject
        type: branch
        condition: not an admin principal
        onFalseStep: 4
      - stepNumber: 3
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 4
        description: >-
          Generate a random API key and its salted hash; assemble an ApiKeyRecord bound to the
          project and role
        type: local
      - stepNumber: 5
        description: Persist the credential
        type: call
        targetComponent: credential_registry
        targetMethod: create
      - stepNumber: 6
        description: Return the plaintext key (shown once)
        type: return
        outcome: plaintext key
  - name: revokeKey
    narrative:
      - stepNumber: 1
        description: Authenticate the master credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateMaster
      - stepNumber: 2
        description: If not an admin principal, reject
        type: branch
        condition: not an admin principal
        onFalseStep: 4
      - stepNumber: 3
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 4
        description: Revoke the credential by id
        type: call
        targetComponent: credential_registry
        targetMethod: revoke
      - stepNumber: 5
        description: Return once revoked
        type: return
        outcome: revoked
  - name: listKeys
    narrative:
      - stepNumber: 1
        description: Authenticate the master credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateMaster
      - stepNumber: 2
        description: If not an admin principal, reject
        type: branch
        condition: not an admin principal
        onFalseStep: 4
      - stepNumber: 3
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 4
        description: List the project's credentials
        type: call
        targetComponent: credential_registry
        targetMethod: list
      - stepNumber: 5
        description: Return the key list
        type: return
        outcome: key list
  - name: lockProject
    narrative:
      - stepNumber: 1
        description: Authenticate the master credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateMaster
      - stepNumber: 2
        description: If not an admin principal, reject
        type: branch
        condition: not an admin principal
        onFalseStep: 4
      - stepNumber: 3
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 4
        description: Bind the project's isolated root
        type: local
      - stepNumber: 5
        description: Sync the default branch into the working branch (no-op for native projects)
        type: call
        targetComponent: host_git_adapter
        targetMethod: sync
      - stepNumber: 6
        description: Validate the tree as-complete
        type: call
        targetComponent: host_validator_adapter
        targetMethod: validateAsComplete
      - stepNumber: 7
        description: If validation reports errors, refuse to lock
        type: branch
        condition: result reports errors
        onFalseStep: 9
      - stepNumber: 8
        description: Return cannot-lock with the validation errors
        type: return
        outcome: cannot lock — validation failed
      - stepNumber: 9
        description: Promote every spec to complete
        type: call
        targetComponent: host_core_adapter
        targetMethod: promoteAllComplete
      - stepNumber: 10
        description: Compute the validated StateId
        type: call
        targetComponent: host_core_adapter
        targetMethod: computeStateId
      - stepNumber: 11
        description: >-
          Publish to git: commit the promoted working tree and push, returning the commit + compare
          URL (no-op for native projects)
        type: call
        targetComponent: host_git_adapter
        targetMethod: publish
      - stepNumber: 12
        description: >-
          Assemble a LockRecord (stateId, lockedAt, lockedBy, validatorVersion, validationResult,
          status ready, plus commitSha/compareUrl when git-backed)
        type: local
      - stepNumber: 13
        description: Persist the lock record
        type: call
        targetComponent: host_core_adapter
        targetMethod: writeLockRecord
      - stepNumber: 14
        description: Return the lock record (with the compare URL to open the PR when git-backed)
        type: return
        outcome: lock record
  - name: promoteProject
    narrative:
      - stepNumber: 1
        description: Authenticate the master credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateMaster
      - stepNumber: 2
        description: If not an admin principal, reject
        type: branch
        condition: not an admin principal
        onFalseStep: 4
      - stepNumber: 3
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 4
        description: Bind the project's isolated root
        type: local
      - stepNumber: 5
        description: Read the current lock record
        type: call
        targetComponent: host_core_adapter
        targetMethod: readLockRecord
      - stepNumber: 6
        description: If no lock record exists, refuse
        type: branch
        condition: no lock record exists
        onFalseStep: 8
      - stepNumber: 7
        description: Return not-locked
        type: return
        outcome: not locked — lock first
      - stepNumber: 8
        description: Recompute the current StateId
        type: call
        targetComponent: host_core_adapter
        targetMethod: computeStateId
      - stepNumber: 9
        description: If the current StateId differs from the lock's StateId, refuse as stale
        type: branch
        condition: current StateId differs from the lock's StateId
        onFalseStep: 11
      - stepNumber: 10
        description: Return stale-lock
        type: return
        outcome: stale lock — re-lock required
      - stepNumber: 11
        description: >-
          Mark the change-set ready for promotion (the human merges the PR when git-backed); never
          merge here
        type: local
      - stepNumber: 12
        description: Return the promote result
        type: return
        outcome: promote result
  - name: generateDiagram
    narrative:
      - stepNumber: 1
        description: Authenticate the master credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateMaster
      - stepNumber: 2
        description: If not an admin principal, reject
        type: branch
        condition: not an admin principal
        onFalseStep: 4
      - stepNumber: 3
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 4
        description: Bind the project's isolated root
        type: local
      - stepNumber: 5
        description: Render the diagram in scope
        type: call
        targetComponent: host_core_adapter
        targetMethod: renderDiagram
      - stepNumber: 6
        description: Return the diagram artifact
        type: return
        outcome: diagram artifact
  - name: downloadDiagram
    narrative:
      - stepNumber: 1
        description: Authenticate the master credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateMaster
      - stepNumber: 2
        description: If not an admin principal, reject
        type: branch
        condition: not an admin principal
        onFalseStep: 4
      - stepNumber: 3
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 4
        description: Bind the project's isolated root
        type: local
      - stepNumber: 5
        description: Render the diagram in scope
        type: call
        targetComponent: host_core_adapter
        targetMethod: renderDiagram
      - stepNumber: 6
        description: Return the diagram artifact as an attachment
        type: return
        outcome: diagram artifact
  - name: diagramViewLink
    narrative:
      - stepNumber: 1
        description: Authenticate the master credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateMaster
      - stepNumber: 2
        description: If not an admin principal, reject
        type: branch
        condition: not an admin principal
        onFalseStep: 4
      - stepNumber: 3
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 4
        description: Mint a signed view token for the project's canvas
        type: call
        targetComponent: auth_specialist
        targetMethod: signViewToken
      - stepNumber: 5
        description: Compose the /view/diagram URL carrying the token
        type: local
      - stepNumber: 6
        description: Return the signed view link
        type: return
        outcome: signed view link
  - name: enableGit
    narrative:
      - stepNumber: 1
        description: Authenticate the master credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateMaster
      - stepNumber: 2
        description: If not an admin principal, reject
        type: branch
        condition: not an admin principal
        onFalseStep: 4
      - stepNumber: 3
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 4
        description: >-
          Ensure the project record and an empty directory exist (no native provisioning) and bind
          the root
        type: local
      - stepNumber: 5
        description: Enable git backing (clone the remote onto the working branch)
        type: call
        targetComponent: host_git_adapter
        targetMethod: enable
      - stepNumber: 6
        description: Return the project record
        type: return
        outcome: project record
  - name: disableGit
    narrative:
      - stepNumber: 1
        description: Authenticate the master credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateMaster
      - stepNumber: 2
        description: If not an admin principal, reject
        type: branch
        condition: not an admin principal
        onFalseStep: 4
      - stepNumber: 3
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 4
        description: Bind the project's isolated root
        type: local
      - stepNumber: 5
        description: Disable git backing
        type: call
        targetComponent: host_git_adapter
        targetMethod: disable
      - stepNumber: 6
        description: Return once disabled
        type: return
        outcome: disabled
  - name: syncGit
    narrative:
      - stepNumber: 1
        description: Authenticate the master credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateMaster
      - stepNumber: 2
        description: If not an admin principal, reject
        type: branch
        condition: not an admin principal
        onFalseStep: 4
      - stepNumber: 3
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 4
        description: Bind the project's isolated root
        type: local
      - stepNumber: 5
        description: Sync the default branch into the working branch
        type: call
        targetComponent: host_git_adapter
        targetMethod: sync
      - stepNumber: 6
        description: Return once synced
        type: return
        outcome: synced
  - name: configureProducer
    narrative:
      - stepNumber: 1
        description: Authenticate the master credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateMaster
      - stepNumber: 2
        description: If not an admin principal, reject
        type: branch
        condition: not an admin principal
        onFalseStep: 4
      - stepNumber: 3
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 4
        description: Bind the project's isolated root
        type: local
      - stepNumber: 5
        description: Configure the producer target
        type: call
        targetComponent: host_producer_adapter
        targetMethod: configure
      - stepNumber: 6
        description: Return once configured
        type: return
        outcome: configured
  - name: produceProducer
    narrative:
      - stepNumber: 1
        description: Authenticate the master credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateMaster
      - stepNumber: 2
        description: If not an admin principal, reject
        type: branch
        condition: not an admin principal
        onFalseStep: 4
      - stepNumber: 3
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 4
        description: Bind the project's isolated root
        type: local
      - stepNumber: 5
        description: Mint a signed view token for the project's canvas
        type: call
        targetComponent: auth_specialist
        targetMethod: signViewToken
      - stepNumber: 6
        description: Compose the canvas link from the public base URL and token
        type: local
      - stepNumber: 7
        description: Project and push the project to the target
        type: call
        targetComponent: host_producer_adapter
        targetMethod: produce
      - stepNumber: 8
        description: Return once produced
        type: return
        outcome: produced
  - name: removeProducer
    narrative:
      - stepNumber: 1
        description: Authenticate the master credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateMaster
      - stepNumber: 2
        description: If not an admin principal, reject
