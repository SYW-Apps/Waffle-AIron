id: admin_orchestrator_impl
name: Admin Orchestrator Implementation
description: >-
  Control-plane workflows: credential auth then project/key lifecycle, git-aware lock, diagrams, and
  git backing. Project create/destroy/lock are scope-aware (a super-admin via the master credential
  or an instance-wide grant, or a unit-scoped admin holding the matching capability for an
  organization unit); the remaining key/git/producer/secret/diagram workflows stay
  master-credential-only.
contract: iadmin_orchestrator
sourcePath: src/server/admin.ts
injectedParams:
  - cfg
methods:
  - name: listProjects
    narrative:
      - stepNumber: 1
        description: Authenticate the master credential
        type: call
        targetComponent: authentication
        targetMethod: authenticateMaster
      - stepNumber: 2
        description: If not an admin principal, reject
        type: branch
        condition: not an admin principal
        onFalseStep: 4
      - stepNumber: 3
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 4
        description: List hosted projects
        type: call
        targetComponent: project_repository
        targetMethod: list
      - stepNumber: 5
        description: Return the project list
        type: return
        outcome: project list
  - name: mintKey
    narrative:
      - stepNumber: 1
        description: Authenticate the master credential
        type: call
        targetComponent: authentication
        targetMethod: authenticateMaster
      - stepNumber: 2
        description: If not an admin principal, reject
        type: branch
        condition: not an admin principal
        onFalseStep: 4
      - stepNumber: 3
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 4
        description: >-
          If the requested role is admin or the project is the '*' wildcard — either would project
          to an instance-wide *:* super-admin grant — reject the mint
        type: branch
        condition: role is admin or project is '*' (would project to instance-wide *:*)
        onFalseStep: 6
      - stepNumber: 5
        description: >-
          Refuse: instance-wide super-admin (*:*) keys cannot be minted — the env-anchored built-in
          admin account (WAIRON_ADMIN_TOKEN / WAIRON_ADMIN_USER) is the only super-admin; only
          project-scoped keys are mintable
        type: return
        outcome: rejected — *:* keys are not mintable
      - stepNumber: 6
        description: >-
          Generate a random API key and its salted hash; assemble an ApiKeyRecord bound to the
          project and role
        type: local
      - stepNumber: 7
        description: Persist the credential
        type: call
        targetComponent: credential_repository
        targetMethod: create
      - stepNumber: 8
        description: Return the plaintext key (shown once)
        type: return
        outcome: plaintext key
  - name: revokeKey
    narrative:
      - stepNumber: 1
        description: Authenticate the master credential
        type: call
        targetComponent: authentication
        targetMethod: authenticateMaster
      - stepNumber: 2
        description: If not an admin principal, reject
        type: branch
        condition: not an admin principal
        onFalseStep: 4
      - stepNumber: 3
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 4
        description: Revoke the credential by id
        type: call
        targetComponent: credential_repository
        targetMethod: revoke
      - stepNumber: 5
        description: Return once revoked
        type: return
        outcome: revoked
  - name: listKeys
    narrative:
      - stepNumber: 1
        description: Authenticate the master credential
        type: call
        targetComponent: authentication
        targetMethod: authenticateMaster
      - stepNumber: 2
        description: If not an admin principal, reject
        type: branch
        condition: not an admin principal
        onFalseStep: 4
      - stepNumber: 3
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 4
        description: List the project's credentials
        type: call
        targetComponent: credential_repository
        targetMethod: list
      - stepNumber: 5
        description: Return the key list
        type: return
        outcome: key list
  - name: generateDiagram
    narrative:
      - stepNumber: 1
        description: Authenticate the master credential
        type: call
        targetComponent: authentication
        targetMethod: authenticateMaster
      - stepNumber: 2
        description: If not an admin principal, reject
        type: branch
        condition: not an admin principal
        onFalseStep: 4
      - stepNumber: 3
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 4
        description: Bind the project's isolated root
        type: local
      - stepNumber: 5
        description: Render the diagram in scope
        type: call
        targetComponent: host_core_adapter
        targetMethod: renderDiagram
      - stepNumber: 6
        description: Return the diagram artifact
        type: return
        outcome: diagram artifact
  - name: downloadDiagram
    narrative:
      - stepNumber: 1
        description: Authenticate the master credential
        type: call
        targetComponent: authentication
        targetMethod: authenticateMaster
      - stepNumber: 2
        description: If not an admin principal, reject
        type: branch
        condition: not an admin principal
        onFalseStep: 4
      - stepNumber: 3
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 4
        description: Bind the project's isolated root
        type: local
      - stepNumber: 5
        description: Render the diagram in scope
        type: call
        targetComponent: host_core_adapter
        targetMethod: renderDiagram
      - stepNumber: 6
        description: Return the diagram artifact as an attachment
        type: return
        outcome: diagram artifact
  - name: diagramViewLink
    narrative:
      - stepNumber: 1
        description: Authenticate the master credential
        type: call
        targetComponent: authentication
        targetMethod: authenticateMaster
      - stepNumber: 2
        description: If not an admin principal, reject
        type: branch
        condition: not an admin principal
        onFalseStep: 4
      - stepNumber: 3
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 4
        description: Mint a signed view token for the project's canvas
        type: call
        targetComponent: authentication
        targetMethod: signViewToken
      - stepNumber: 5
        description: Compose the /view/diagram URL carrying the token
        type: local
      - stepNumber: 6
        description: Return the signed view link
        type: return
        outcome: signed view link
  - name: setSecret
    narrative:
      - stepNumber: 1
        description: Authenticate the master credential
        type: call
        targetComponent: authentication
        targetMethod: authenticateMaster
      - stepNumber: 2
        description: If not an admin principal, reject
        type: branch
        condition: not an admin principal
        onFalseStep: 4
      - stepNumber: 3
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 4
        description: Store the secret at runtime
        type: call
        targetComponent: secret_repository
        targetMethod: write
      - stepNumber: 5
        description: Return once set
        type: return
        outcome: secret set
  - name: listSecrets
    narrative:
      - stepNumber: 1
        description: Authenticate the master credential
        type: call
        targetComponent: authentication
        targetMethod: authenticateMaster
      - stepNumber: 2
        description: If not an admin principal, reject
        type: branch
        condition: not an admin principal
        onFalseStep: 4
      - stepNumber: 3
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 4
        description: List configured secret keys (names only)
        type: call
        targetComponent: secret_repository
        targetMethod: list
      - stepNumber: 5
        description: Return the secret key names
        type: return
        outcome: secret keys
  - name: executeApprovedCreate
    narrative:
      - stepNumber: 1
        description: Allocate and register the project
        type: call
        targetComponent: project_repository
        targetMethod: create
      - stepNumber: 2
        description: Bind the new project's isolated root
        type: local
      - stepNumber: 3
        description: Bootstrap the isolated spec tree
        type: call
        targetComponent: host_core_adapter
        targetMethod: provisionProject
      - stepNumber: 4
        description: >-
          Place the new project in the required owner organization unit (from the request's
          ownerUnitId)
        type: call
        targetComponent: organization_repository
        targetMethod: placeProject
      - stepNumber: 5
        description: Return the created project record
        type: return
        outcome: created project record
  - name: executeApprovedLock
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the project's repository scope — its family root's isolated root (the family's one
          git binding) and its own .wai/ pathspec — and bind the project's own root (a member
          record's derived from its parent's root and memberPath; no qualifier exists any more).
          Every step below validates and writes the bound tree only; nothing below it is ever
          written
        type: call
        targetComponent: project_repository
        targetMethod: repositoryScope
      - stepNumber: 2
        description: >-
          Sync the default branch into the working branch at the family repository root so the lock
          is based on the latest (a no-op for a native family).
        type: call
        targetComponent: host_git_adapter
        targetMethod: sync
      - stepNumber: 3
        label: capture
        description: >-
          CAPTURE the gate identity before anything is judged: own content, design doctrine, own
          inputs, composition, and each direct member's recorded subject. This is the identity the
          record will certify (inputs-captured-before-validation).
        type: call
        targetComponent: host_validator_adapter
        targetMethod: computeGateStateId
      - stepNumber: 4
        description: Was this lock requested about a particular design?
        type: branch
        condition: >-
          an expected identity was passed (the request's gateStateId) and the captured identity
          differs from it
        onTrueStep: 5
        onFalseStep: 6
      - stepNumber: 5
        description: >-
          Refuse, writing nothing: the design changed after the lock was requested, so approving now
          would certify a design nobody asked to have approved. The requester asks again.
        type: throw
        error: the design changed since the lock was requested
      - stepNumber: 6
        description: >-
          Validate the tree as-complete; the result carries the code half summarized with its
          analyzer
        type: call
        targetComponent: host_validator_adapter
        targetMethod: validateAsComplete
      - stepNumber: 7
        description: >-
          Take the design half of the result (ValidationResult.designOnly): what the approval
          certifies and what may refuse it. Code-conformance findings are recorded beside the claim
          (`code`, reported in the outcome as "code: N errors recorded beside the claim") and never
          refuse the lock — CI enforces code conformance, not the lock
        type: local
      - stepNumber: 8
        description: If the design half reports errors, refuse to lock
        type: branch
        condition: the design half reports errors
        onTrueStep: 9
        onFalseStep: 10
      - stepNumber: 9
        description: Return cannot-lock with the design errors, having written nothing
        type: return
        outcome: cannot lock — validation failed
      - stepNumber: 10
        description: >-
          Read the direct members' approval states, each computed at the member's own root, with
          their subjects (depth 1)
        type: call
        targetComponent: host_validator_adapter
        targetMethod: familyApprovals
      - stepNumber: 11
        description: >-
          Read the bound tree's project configuration: its composition block
          (requireApprovedMembers) and its effective id (project_config.effectiveId(), a defaulted
          one included), recorded as projectId so validate can later report PROJECT_ID_CHANGED
        type: call
        targetComponent: host_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 12
        description: Does the project require approved members, and is one not approved?
        type: branch
        condition: >-
          composition.requireApprovedMembers is true and a direct member is drifted or never
          approved
        onTrueStep: 13
        onFalseStep: 14
      - stepNumber: 13
        description: >-
          Refuse, writing nothing, naming each drifted or never-approved direct member with its
          state (and, for an upgrade-only drift, that it needs a re-lock once): each member locks at
          its own root first — a parent never approves below itself (require-refuses)
        type: throw
        error: 'composition.requireApprovedMembers: direct members not approved'
      - stepNumber: 14
        description: >-
          Capture the approved tree as one content digest per OWN spec file (a member's files are
          its own lock's). Nothing is written into the spec files
        type: call
        targetComponent: host_core_adapter
        targetMethod: captureApprovedSpecs
      - stepNumber: 15
        label: confirm
        description: Recompute the gate identity immediately before writing
        type: call
        targetComponent: host_validator_adapter
        targetMethod: computeGateStateId
      - stepNumber: 16
        description: Did any input move while the lock ran?
        type: branch
        condition: the recomputed identity differs from the captured one
        onTrueStep: 17
        onFalseStep: 18
      - stepNumber: 17
        description: >-
          Refuse, writing nothing: a spec, the doctrine, an input, the composition block or a
          member's approval changed while this lock ran, so the validation just performed does not
          describe what would be recorded. Run the lock again
        type: throw
        error: the lock's inputs changed while it ran
      - stepNumber: 18
        description: >-
          Assemble a format-2 LockRecord: stateId = the captured identity, lockedAt, the
          AUTHENTICATED approver the caller resolved from the credential, validatorVersion,
          validationResult = the design half's counts, status ready, the effective id as projectId,
          the captured specs, `members` = each direct member's alias → {project, subject, state},
          and `code` = the result's analysis without its codes list. No `children` is written
        type: local
      - stepNumber: 19
        description: >-
          Persist the record BEFORE publishing, so the commit that ships the specs also contains the
          approval that certifies them
        type: call
        targetComponent: host_core_adapter
        targetMethod: writeLockRecord
      - stepNumber: 20
        description: >-
          Commit ONLY the project's own .wai/ pathspec at the family repository root and push,
          returning the commit and compare URL a human opens the PR from. A no-op for a native
          family
        type: call
        targetComponent: host_git_adapter
        targetMethod: publish
      - stepNumber: 21
        description: Only a real publish has a commit to record.
        type: branch
        condition: nothing was published (native family, or a clean pathspec)
        onTrueStep: 22
        onFalseStep: 23
      - stepNumber: 22
        description: Return the persisted record unchanged.
        type: return
        outcome: lock record
      - stepNumber: 23
        description: >-
          Extend the record with commitSha and compareUrl — known only AFTER the commit, so these
          two fields are re-written into a record the commit already carries.
        type: local
      - stepNumber: 24
        description: Persist the two published fields.
        type: call
        targetComponent: host_core_adapter
        targetMethod: writeLockRecord
      - stepNumber: 25
        description: Return the published record.
        type: return
        outcome: lock record with the compare URL to open the PR
  - name: createProject
    narrative:
      - stepNumber: 1
        description: >-
          Authenticate the caller credential (bootstrap master resolves to an instance-admin, or a
          user-bound token)
        type: call
        targetComponent: authentication
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: >-
          Validate the REQUIRED target unitId (reject when missing or not an existing organization
          unit) and resolve the target scope for authorization (kind 'unit')
        type: local
      - stepNumber: 3
        description: >-
          Resolve the caller's project:create permission over the target scope (an instance-admin
          bypasses to yes)
        type: call
        targetComponent: authorization
        targetMethod: authorize
      - stepNumber: 4
        description: >-
          If the effective value is not yes, deny (an approval-valued caller must use the
          execute-primary project-lifecycle path)
        type: branch
        condition: the effective value is not yes
        onTrueStep: 5
        onFalseStep: 6
      - stepNumber: 5
        description: Reject the project creation
        type: throw
        error: Forbidden — creating a project requires project:create authority for the target
      - stepNumber: 6
        description: Allocate and register the project
        type: call
        targetComponent: project_repository
        targetMethod: create
      - stepNumber: 7
        description: Bind the new project's isolated root
        type: local
      - stepNumber: 8
        description: Bootstrap the isolated spec tree
        type: call
        targetComponent: host_core_adapter
        targetMethod: provisionProject
      - stepNumber: 9
        description: Place the newly created project in the required target organization unit
        type: call
        targetComponent: organization_repository
        targetMethod: placeProject
      - stepNumber: 10
        description: Return the created project record
        type: return
        outcome: created project record
    detail: full
  - name: destroyProject
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential (bootstrap master or a user-bound token)
        type: call
        targetComponent: authentication
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Resolve the caller's project:admin permission over the target project
        type: call
        targetComponent: authorization
        targetMethod: authorize
      - stepNumber: 3
        description: If the effective value is not yes, deny
        type: branch
        condition: the effective value is not yes
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the project destruction
        type: throw
        error: Forbidden — destroying a project requires project:admin over it
      - stepNumber: 5
        description: Deregister the project and remove its tree
        type: call
        targetComponent: project_repository
        targetMethod: remove
      - stepNumber: 6
        description: Return once destroyed
        type: return
        outcome: destroyed
    detail: full
  - name: lockProject
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential (bootstrap master or a user-bound token)
        type: call
        targetComponent: authentication
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Resolve the caller's project:write permission over the target project
        type: call
        targetComponent: authorization
        targetMethod: authorize
      - stepNumber: 3
        description: If the effective value is not yes, deny
        type: branch
        condition: the effective value is not yes
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the lock
        type: throw
        error: Forbidden — locking a project requires project:write over it
      - stepNumber: 5
        description: >-
          Lock through the pre-authorized entry with the authenticated caller as approver: the same
          workflow an approved request runs, so capture-before-validation, the design-only gate, the
          member states and requireApprovedMembers hold identically on both paths
        type: call
        targetComponent: admin_orchestrator
        targetMethod: executeApprovedLock
      - stepNumber: 6
        description: Return the lock record
        type: return
        outcome: lock record
    detail: full
  - name: enableGit
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: authentication
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: >-
          Resolve the caller's project:admin permission over the target project (binding a
          repository is project administration)
        type: call
        targetComponent: authorization
        targetMethod: authorize
      - stepNumber: 3
        description: If the effective value is not yes, deny
        type: branch
        condition: the effective project:admin value is not yes
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the git binding
        type: throw
        error: Forbidden — binding a repository requires project:admin over the project
      - stepNumber: 5
        description: >-
          Ensure the project record and an empty directory exist (no native provisioning) and bind
          the root
        type: local
      - stepNumber: 6
        description: >-
          Resolve the clone's token from the host's own secret repository: the connection's own
          credential ref first, when it has one, so each connection can carry a distinct PAT
        type: call
        targetComponent: secret_repository
        targetMethod: resolve
      - stepNumber: 7
        description: Otherwise fall back to the shared git-token (none at all for a public remote)
        type: call
        targetComponent: secret_repository
        targetMethod: resolve
      - stepNumber: 8
        description: >-
          Bind the project to its REAL repository (clone the remote onto the isolated working
          branch), handing the git plane the resolved token as an argument; wairon will commit ONLY
          .wai/ inside it
        type: call
        targetComponent: host_git_adapter
        targetMethod: enable
      - stepNumber: 9
        description: Return the project record
        type: return
        outcome: project record
  - name: disableGit
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: authentication
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Resolve the caller's project:admin permission over the target project
        type: call
        targetComponent: authorization
        targetMethod: authorize
      - stepNumber: 3
        description: If the effective value is not yes, deny
        type: branch
        condition: the effective project:admin value is not yes
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the git unbinding
        type: throw
        error: Forbidden — unbinding a repository requires project:admin over the project
      - stepNumber: 5
        description: Bind the project's isolated root
        type: local
      - stepNumber: 6
        description: Disable git backing (clear the binding; the working tree is untouched)
        type: call
        targetComponent: host_git_adapter
        targetMethod: disable
      - stepNumber: 7
        description: Return once disabled
        type: return
        outcome: disabled
  - name: syncGit
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: authentication
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Resolve the caller's project:write permission over the target project
        type: call
        targetComponent: authorization
        targetMethod: authorize
      - stepNumber: 3
        description: If the effective value is not yes, deny
        type: branch
        condition: the effective project:write value is not yes
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the git sync
        type: throw
        error: Forbidden — syncing a project's repository requires project:write over it
      - stepNumber: 5
        description: Bind the project's isolated root
        type: local
      - stepNumber: 6
        description: Sync the default branch into the working branch
        type: call
        targetComponent: host_git_adapter
        targetMethod: sync
      - stepNumber: 7
        description: Return once synced
        type: return
        outcome: synced
  - name: commitProject
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: authentication
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: >-
          Resolve the caller's project:write permission over the target project (a commit is a spec
          write's save, not administration)
        type: call
        targetComponent: authorization
        targetMethod: authorize
      - stepNumber: 3
        description: If the effective value is not yes, deny
        type: branch
        condition: the effective project:write value is not yes
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the commit
        type: throw
        error: Forbidden — committing a project's specs requires project:write over it
      - stepNumber: 5
        description: >-
          Resolve the project's repository scope: its family root's isolated root (the family's one
          repository) and its own .wai/ pathspec ('.wai/' for a family root, '<member path>/.wai/'
          for a member) — a member commits through its family root's repository, confined to its own
          tree
        type: call
        targetComponent: project_repository
        targetMethod: repositoryScope
      - stepNumber: 6
        description: >-
          Bind the repository root and narrow the pathspec to <project .wai>/specs/<subsystem>/ when
          a subsystem is given (a staging convenience only — git history stays per-repository; a
          member's own history is the log filtered to its pathspec); default the message, naming the
          project
        type: local
      - stepNumber: 7
        description: >-
          Publish the scoped commit and push (commit = local save, push = the actual backup); a
          clean scope publishes nothing
        type: call
        targetComponent: host_git_adapter
        targetMethod: publish
      - stepNumber: 8
        description: Return the publish outcome
        type: return
        outcome: GitPublish
  - name: getGitBinding
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: authentication
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Resolve the caller's project:admin permission over the target project
        type: call
        targetComponent: authorization
        targetMethod: authorize
      - stepNumber: 3
        description: If the effective value is not yes, deny
        type: branch
        condition: the effective project:admin value is not yes
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the binding read
        type: throw
        error: Forbidden — reading a project's git binding requires project:admin over it
      - stepNumber: 5
        description: Bind the project's isolated root
        type: local
      - stepNumber: 6
        description: Read the git-backing status (remote/branch, sync setting, scoped dirtiness)
        type: call
        targetComponent: host_git_adapter
        targetMethod: status
      - stepNumber: 7
        description: Return the status
        type: return
        outcome: git backing status
  - name: configureGitSync
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: authentication
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: >-
          Resolve the caller's project:admin permission over the target project (the backup cadence
          is binding administration)
        type: call
        targetComponent: authorization
        targetMethod: authorize
      - stepNumber: 3
        description: If the effective value is not yes, deny
        type: branch
        condition: the effective project:admin value is not yes
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the sync configuration
        type: throw
        error: Forbidden — configuring the periodic sync requires project:admin over the project
      - stepNumber: 5
        description: Bind the project's isolated root
        type: local
      - stepNumber: 6
        description: Persist the periodic-sync setting into the project's git-backing config
        type: call
        targetComponent: host_git_adapter
        targetMethod: configureSync
      - stepNumber: 7
        description: Return once persisted
        type: return
        outcome: sync setting persisted
  - name: runPeriodicGitSync
    narrative:
      - stepNumber: 1
        description: >-
          List the hosted project records (pre-authorized internal sweep — the host supervisor's
          timer is the only caller; never exposed on a portal)
        type: call
        targetComponent: project_repository
        targetMethod: list
      - stepNumber: 2
        description: >-
          For each hosted FAMILY ROOT record (a member record has no repository of its own and is
          swept with its family)
        type: loop
        loopKind: forEach
        over: the hosted family root records
        endStep: 7
      - stepNumber: 3
        description: >-
          Bind the family root's isolated root and collect the family's pathspecs: its own .wai/ and
          every member record's <path>/.wai/
        type: local
      - stepNumber: 4
        description: Read the project's git-backing status
        type: call
        targetComponent: host_git_adapter
        targetMethod: status
      - stepNumber: 5
        description: >-
          Publish only when the binding enables periodic sync AND the scoped .wai/ path is dirty (or
          skipIfClean is false) — a quiet project never commits noise
        type: branch
        condition: periodic sync is enabled and the scoped path is dirty (or skipIfClean is false)
        onTrueStep: 6
        onFalseStep: 7
      - stepNumber: 6
        description: >-
          Publish one backup commit covering the family's pathspecs and push — never a path outside
          a project's .wai/
        type: call
        targetComponent: host_git_adapter
        targetMethod: publish
      - stepNumber: 7
        description: >-
          Record any per-project failure as a server diagnostic and continue — one project's failure
          never aborts the sweep
        type: local
      - stepNumber: 8
        description: Return once the sweep completes
        type: return
        outcome: sweep completed
  - name: configureProducer
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: authentication
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: >-
          Resolve the caller's project:admin permission over the target project (a producer
          publishes the project's specs to an external target)
        type: call
        targetComponent: authorization
        targetMethod: authorize
      - stepNumber: 3
        description: If the effective value is not yes, deny
        type: branch
        condition: the effective project:admin value is not yes
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the producer configuration
        type: throw
        error: Forbidden — configuring a producer requires project:admin over the project
      - stepNumber: 5
        description: Bind the project's isolated root
        type: local
      - stepNumber: 6
        description: Configure the producer target (tokens come from the secret store by ref, never inline)
        type: call
        targetComponent: host_producer_adapter
        targetMethod: configure
      - stepNumber: 7
        description: Return once configured
        type: return
        outcome: configured
  - name: produceProducer
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: authentication
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Resolve the caller's project:admin permission over the target project
        type: call
        targetComponent: authorization
        targetMethod: authorize
      - stepNumber: 3
        description: If the effective value is not yes, deny
        type: branch
        condition: the effective project:admin value is not yes
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the producer run
        type: throw
        error: Forbidden — running a producer requires project:admin over the project
      - stepNumber: 5
        description: Bind the project's isolated root
        type: local
      - stepNumber: 6
        description: Mint a signed view token for the project's canvas
        type: call
        targetComponent: authentication
        targetMethod: signViewToken
      - stepNumber: 7
        description: Compose the canvas link from the public base URL and token
        type: local
      - stepNumber: 8
        description: Read the project's configured producers
        type: call
        targetComponent: host_producer_adapter
        targetMethod: list
      - stepNumber: 9
        description: Is the target configured? An unconfigured target needs no token
        type: branch
        condition: the target is configured
        onFalseStep: 13
      - stepNumber: 10
        description: >-
          Resolve the target's token (<target>-token) from the host's own secret repository — the
          value never leaves the host except as this one call's argument
        type: call
        targetComponent: secret_repository
        targetMethod: resolve
      - stepNumber: 11
        description: Is a token stored?
        type: branch
        condition: no token is stored for the target
        onFalseStep: 13
      - stepNumber: 12
        description: >-
          Refuse the run before the producer does anything, naming the environment variable and the
          host secret to set
        type: throw
        error: No <Target> token
      - stepNumber: 13
        label: produce
        description: >-
          Project and push the project to the target, handing the producer the token resolved above
          as an argument (none for an unconfigured target, which the producer refuses by name)
        type: call
        targetComponent: host_producer_adapter
        targetMethod: produce
      - stepNumber: 14
        description: Return once produced
        type: return
        outcome: produced
  - name: removeProducer
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: authentication
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Resolve the caller's project:admin permission over the target project
        type: call
        targetComponent: authorization
        targetMethod: authorize
      - stepNumber: 3
        description: If the effective value is not yes, deny
        type: branch
        condition: the effective project:admin value is not yes
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the producer removal
        type: throw
        error: Forbidden — removing a producer requires project:admin over the project
      - stepNumber: 5
        description: Bind the project's isolated root
        type: local
      - stepNumber: 6
        description: Remove the producer target
        type: call
        targetComponent: host_producer_adapter
        targetMethod: remove
      - stepNumber: 7
        description: Return once removed
        type: return
        outcome: removed
  - name: listProducers
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: authentication
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Resolve the caller's project:admin permission over the target project
        type: call
        targetComponent: authorization
        targetMethod: authorize
      - stepNumber: 3
        description: If the effective value is not yes, deny
        type: branch
        condition: the effective project:admin value is not yes
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the producer listing
        type: throw
        error: Forbidden — listing producers requires project:admin over the project
      - stepNumber: 5
        description: Bind the project's isolated root
        type: local
      - stepNumber: 6
        description: List configured producers
        type: call
        targetComponent: host_producer_adapter
        targetMethod: list
      - stepNumber: 7
        description: Return the producer list
        type: return
        outcome: producer list
  - name: exportProjectTree
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential (bootstrap master or a user-bound token)
        type: call
        targetComponent: authentication
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Resolve the caller's project:read permission over the target project
        type: call
        targetComponent: authorization
        targetMethod: authorize
      - stepNumber: 3
        description: If the effective value is not yes, deny
        type: branch
        condition: the effective value is not yes
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the export
        type: throw
        error: Forbidden — exporting a project's spec tree requires project:read over it
      - stepNumber: 5
        description: >-
          Bind the project's root — a member's own root when the project is a member record (derived
          from its parent's root and memberPath through the containment guard)
        type: local
      - stepNumber: 6
        description: Pack the bound tree into a .waitree archive within that scope
        type: call
        targetComponent: host_core_adapter
        targetMethod: exportSpecTree
      - stepNumber: 7
        description: Return the archive and its provenance
        type: return
        outcome: exported tree
  - name: importProjectTree
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential (bootstrap master or a user-bound token)
        type: call
        targetComponent: authentication
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: >-
          Resolve the caller's project:admin permission over the target project — deliberately above
          project:write, because this replaces the whole design rather than editing one spec
        type: call
        targetComponent: authorization
        targetMethod: authorize
      - stepNumber: 3
        description: If the effective value is not yes, deny
        type: branch
        condition: the effective value is not yes
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the import
        type: throw
        error: Forbidden — importing a project's spec tree requires project:admin over it
      - stepNumber: 5
        description: Bind the project's root — a member's own root when the project is a member record
        type: local
      - stepNumber: 6
        description: >-
          Import the archive within that scope, ALWAYS refusing executable entries (it arrived over
          the wire) and passing the caller's replace choice through unchanged
        type: call
        targetComponent: host_core_adapter
        targetMethod: importSpecTree
      - stepNumber: 7
        description: Return what was written and where the replaced tree was backed up
        type: return
        outcome: imported tree
  - name: registerLocalDevProject
    narrative:
      - stepNumber: 1
        description: Admit only a development-mode host configuration
        type: branch
        condition: the host configuration is not in development mode
        onTrueStep: 2
        onFalseStep: 3
      - stepNumber: 2
        description: >-
          Refuse: registration at a caller-named directory is reserved for the local development
          server
        type: throw
        error: Error
      - stepNumber: 3
        description: Register the project record at the working directory
        type: call
        targetComponent: project_repository
        targetMethod: register
      - stepNumber: 4
        description: Return the registered record
        type: return
        outcome: project record
  - name: gateIdentity
    narrative:
      - stepNumber: 1
        description: >-
          Bind the root exactly as executeApprovedLock does: the project's own root — a member
          record's derived from its parent's root and memberPath
        type: local
      - stepNumber: 2
        description: Compute the bound tree's gate identity
        type: call
        targetComponent: host_validator_adapter
        targetMethod: computeGateStateId
      - stepNumber: 3
        description: Return it rendered `<algorithm>:<digest>`
        type: return
        outcome: gate identity
status: complete
