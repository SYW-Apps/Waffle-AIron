id: admin_orchestrator_impl
name: Admin Orchestrator Implementation
description: >-
  Control-plane workflows: credential auth then project/key lifecycle, git-aware lock, diagrams, and
  git backing. Project create/destroy/lock are scope-aware (a super-admin via the master credential
  or an instance-wide grant, or a unit-scoped admin holding the matching capability for an
  organization unit); the remaining key/git/producer/secret/diagram workflows stay
  master-credential-only.
contract: iadmin_orchestrator
sourcePath: src/server/admin.ts
methods:
  - name: listProjects
    narrative:
      - stepNumber: 1
        description: Authenticate the master credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateMaster
      - stepNumber: 2
        description: If not an admin principal, reject
        type: branch
        condition: not an admin principal
        onFalseStep: 4
      - stepNumber: 3
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 4
        description: List hosted projects
        type: call
        targetComponent: project_registry
        targetMethod: list
      - stepNumber: 5
        description: Return the project list
        type: return
        outcome: project list
  - name: mintKey
    narrative:
      - stepNumber: 1
        description: Authenticate the master credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateMaster
      - stepNumber: 2
        description: If not an admin principal, reject
        type: branch
        condition: not an admin principal
        onFalseStep: 4
      - stepNumber: 3
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 4
        description: >-
          If the requested role is admin or the project is the '*' wildcard — either would project
          to an instance-wide *:* super-admin grant — reject the mint
        type: branch
        condition: role is admin or project is '*' (would project to instance-wide *:*)
        onFalseStep: 6
      - stepNumber: 5
        description: >-
          Refuse: instance-wide super-admin (*:*) keys cannot be minted — the env-anchored built-in
          admin account (WAIRON_ADMIN_TOKEN / WAIRON_ADMIN_USER) is the only super-admin; only
          project-scoped keys are mintable
        type: return
        outcome: rejected — *:* keys are not mintable
      - stepNumber: 6
        description: >-
          Generate a random API key and its salted hash; assemble an ApiKeyRecord bound to the
          project and role
        type: local
      - stepNumber: 7
        description: Persist the credential
        type: call
        targetComponent: credential_registry
        targetMethod: create
      - stepNumber: 8
        description: Return the plaintext key (shown once)
        type: return
        outcome: plaintext key
  - name: revokeKey
    narrative:
      - stepNumber: 1
        description: Authenticate the master credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateMaster
      - stepNumber: 2
        description: If not an admin principal, reject
        type: branch
        condition: not an admin principal
        onFalseStep: 4
      - stepNumber: 3
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 4
        description: Revoke the credential by id
        type: call
        targetComponent: credential_registry
        targetMethod: revoke
      - stepNumber: 5
        description: Return once revoked
        type: return
        outcome: revoked
  - name: listKeys
    narrative:
      - stepNumber: 1
        description: Authenticate the master credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateMaster
      - stepNumber: 2
        description: If not an admin principal, reject
        type: branch
        condition: not an admin principal
        onFalseStep: 4
      - stepNumber: 3
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 4
        description: List the project's credentials
        type: call
        targetComponent: credential_registry
        targetMethod: list
      - stepNumber: 5
        description: Return the key list
        type: return
        outcome: key list
  - name: generateDiagram
    narrative:
      - stepNumber: 1
        description: Authenticate the master credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateMaster
      - stepNumber: 2
        description: If not an admin principal, reject
        type: branch
        condition: not an admin principal
        onFalseStep: 4
      - stepNumber: 3
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 4
        description: Bind the project's isolated root
        type: local
      - stepNumber: 5
        description: Render the diagram in scope
        type: call
        targetComponent: host_core_adapter
        targetMethod: renderDiagram
      - stepNumber: 6
        description: Return the diagram artifact
        type: return
        outcome: diagram artifact
  - name: downloadDiagram
    narrative:
      - stepNumber: 1
        description: Authenticate the master credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateMaster
      - stepNumber: 2
        description: If not an admin principal, reject
        type: branch
        condition: not an admin principal
        onFalseStep: 4
      - stepNumber: 3
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 4
        description: Bind the project's isolated root
        type: local
      - stepNumber: 5
        description: Render the diagram in scope
        type: call
        targetComponent: host_core_adapter
        targetMethod: renderDiagram
      - stepNumber: 6
        description: Return the diagram artifact as an attachment
        type: return
        outcome: diagram artifact
  - name: diagramViewLink
    narrative:
      - stepNumber: 1
        description: Authenticate the master credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateMaster
      - stepNumber: 2
        description: If not an admin principal, reject
        type: branch
        condition: not an admin principal
        onFalseStep: 4
      - stepNumber: 3
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 4
        description: Mint a signed view token for the project's canvas
        type: call
        targetComponent: auth_specialist
        targetMethod: signViewToken
      - stepNumber: 5
        description: Compose the /view/diagram URL carrying the token
        type: local
      - stepNumber: 6
        description: Return the signed view link
        type: return
        outcome: signed view link
  - name: setSecret
    narrative:
      - stepNumber: 1
        description: Authenticate the master credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateMaster
      - stepNumber: 2
        description: If not an admin principal, reject
        type: branch
        condition: not an admin principal
        onFalseStep: 4
      - stepNumber: 3
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 4
        description: Store the secret at runtime
        type: call
        targetComponent: secret_registry
        targetMethod: write
      - stepNumber: 5
        description: Return once set
        type: return
        outcome: secret set
  - name: listSecrets
    narrative:
      - stepNumber: 1
        description: Authenticate the master credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateMaster
      - stepNumber: 2
        description: If not an admin principal, reject
        type: branch
        condition: not an admin principal
        onFalseStep: 4
      - stepNumber: 3
        description: Return 403 Forbidden
        type: return
        outcome: 403 Forbidden
      - stepNumber: 4
        description: List configured secret keys (names only)
        type: call
        targetComponent: secret_registry
        targetMethod: list
      - stepNumber: 5
        description: Return the secret key names
        type: return
        outcome: secret keys
  - name: executeApprovedCreate
    narrative:
      - stepNumber: 1
        description: Allocate and register the project
        type: call
        targetComponent: project_registry
        targetMethod: create
      - stepNumber: 2
        description: Bind the new project's isolated root
        type: local
      - stepNumber: 3
        description: Bootstrap the isolated spec tree
        type: call
        targetComponent: host_core_adapter
        targetMethod: provisionProject
      - stepNumber: 4
        description: >-
          Place the new project in the required owner organization unit (from the request's
          ownerUnitId)
        type: call
        targetComponent: organization_repository
        targetMethod: placeProject
      - stepNumber: 5
        description: Return the created project record
        type: return
        outcome: created project record
  - name: executeApprovedLock
    narrative:
      - stepNumber: 1
        description: >-
          Bind the root this lock concerns: the project's isolated root, or — when a subproject
          qualifier was supplied — the chained CHILD's tree, resolved through the project registry's
          containment-checked qualified resolution so a qualifier can never resolve outside the
          project root. Every step below therefore operates on the bound tree.
        type: local
      - stepNumber: 2
        description: >-
          Sync the default branch into the working branch so the lock is based on the latest (no-op
          for a native project, and equally a no-op for a subproject-scoped lock: the git binding is
          read from the BOUND root and a child tree carries none — the child is not the git unit).
        type: call
        targetComponent: host_git_adapter
        targetMethod: sync
      - stepNumber: 3
        description: Validate the tree as-complete
        type: call
        targetComponent: host_validator_adapter
        targetMethod: validateAsComplete
      - stepNumber: 4
        description: If validation reports errors, refuse to lock
        type: branch
        condition: result reports errors
        onFalseStep: 6
      - stepNumber: 5
        description: Return cannot-lock with the validation errors
        type: return
        outcome: cannot lock — validation failed
      - stepNumber: 6
        description: Compute the validated GATE StateId (spec content + governing doctrine)
        type: call
        targetComponent: host_core_adapter
        targetMethod: computeGateStateId
      - stepNumber: 7
        description: >-
          Record the approved tree as the baseline, OUTSIDE the working tree. Nothing is written
          into the spec files: a hosted lock also commits and pushes .wai/, so the old status
          ratchet published the whole rewrite into the repository.
        type: call
        targetComponent: host_core_adapter
        targetMethod: writeBaseline
      - stepNumber: 8
        description: >-
          Commit the .wai/-scoped tree and push, returning the commit and compare URL a human opens
          the PR from — the lock is the semantic checkpoint that triggers the auto-publish. A no-op
          for a native project, and for a subproject-scoped lock (no binding at the bound child
          root), so a subproject freeze never commits or pushes against the parent's repository; the
          parent's next lock or scoped commit carries the frozen child tree.
        type: call
        targetComponent: host_git_adapter
        targetMethod: publish
      - stepNumber: 9
        description: >-
          Assemble a LockRecord (stateId, lockedAt, lockedBy, validatorVersion, validationResult,
          status ready, plus commitSha/compareUrl when git-backed)
        type: local
      - stepNumber: 10
        description: Persist the lock record
        type: call
        targetComponent: host_core_adapter
        targetMethod: writeLockRecord
      - stepNumber: 11
        description: Return the lock record (with the compare URL to open the PR when git-backed)
        type: return
        outcome: lock record
  - name: createProject
    narrative:
      - stepNumber: 1
        description: >-
          Authenticate the caller credential (bootstrap master resolves to an instance-admin, or a
          user-bound token)
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: >-
          Validate the REQUIRED target unitId (reject when missing or not an existing organization
          unit) and resolve the target scope for authorization (kind 'unit')
        type: local
      - stepNumber: 3
        description: >-
          Resolve the caller's project:create permission over the target scope (an instance-admin
          bypasses to yes)
        type: call
        targetComponent: authorization_specialist
        targetMethod: authorize
      - stepNumber: 4
        description: >-
          If the effective value is not yes, deny (an approval-valued caller must use the
          execute-primary project-lifecycle path)
        type: branch
        condition: the effective value is not yes
        onTrueStep: 5
        onFalseStep: 6
      - stepNumber: 5
        description: Reject the project creation
        type: throw
        error: Forbidden — creating a project requires project:create authority for the target
      - stepNumber: 6
        description: Allocate and register the project
        type: call
        targetComponent: project_registry
        targetMethod: create
      - stepNumber: 7
        description: Bind the new project's isolated root
        type: local
      - stepNumber: 8
        description: Bootstrap the isolated spec tree
        type: call
        targetComponent: host_core_adapter
        targetMethod: provisionProject
      - stepNumber: 9
        description: Place the newly created project in the required target organization unit
        type: call
        targetComponent: organization_repository
        targetMethod: placeProject
      - stepNumber: 10
        description: Return the created project record
        type: return
        outcome: created project record
    detail: full
  - name: destroyProject
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential (bootstrap master or a user-bound token)
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Resolve the caller's project:admin permission over the target project
        type: call
        targetComponent: authorization_specialist
        targetMethod: authorize
      - stepNumber: 3
        description: If the effective value is not yes, deny
        type: branch
        condition: the effective value is not yes
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the project destruction
        type: throw
        error: Forbidden — destroying a project requires project:admin over it
      - stepNumber: 5
        description: Deregister the project and remove its tree
        type: call
        targetComponent: project_registry
        targetMethod: remove
      - stepNumber: 6
        description: Return once destroyed
        type: return
        outcome: destroyed
    detail: full
  - name: lockProject
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential (bootstrap master or a user-bound token)
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Resolve the caller's project:write permission over the target project
        type: call
        targetComponent: authorization_specialist
        targetMethod: authorize
      - stepNumber: 3
        description: If the effective value is not yes, deny
        type: branch
        condition: the effective value is not yes
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the lock
        type: throw
        error: Forbidden — locking a project requires project:write over it
      - stepNumber: 5
        description: Bind the project's isolated root
        type: local
      - stepNumber: 6
        description: Sync the default branch into the working branch (no-op for native projects)
        type: call
        targetComponent: host_git_adapter
        targetMethod: sync
      - stepNumber: 7
        description: Validate the tree as-complete
        type: call
        targetComponent: host_validator_adapter
        targetMethod: validateAsComplete
      - stepNumber: 8
        description: If validation reports errors, refuse to lock
        type: branch
        condition: result reports errors
        onTrueStep: 9
        onFalseStep: 10
      - stepNumber: 9
        description: Return cannot-lock with the validation errors
        type: return
        outcome: cannot lock — validation failed
      - stepNumber: 10
        description: Compute the validated GATE StateId (spec content + governing doctrine)
        type: call
        targetComponent: host_core_adapter
        targetMethod: computeGateStateId
      - stepNumber: 11
        description: >-
          Record the approved tree as the baseline, OUTSIDE the working tree — the spec files are
          never written to.
        type: call
        targetComponent: host_core_adapter
        targetMethod: writeBaseline
      - stepNumber: 12
        description: >-
          Publish to git: commit the .wai/-scoped tree and push the working branch, returning the
          commit sha and compare URL
        type: call
        targetComponent: host_git_adapter
        targetMethod: publish
      - stepNumber: 13
        description: >-
          Assemble a LockRecord (stateId, lockedAt, lockedBy, validatorVersion, validationResult,
          status ready, plus commitSha/compareUrl when git-backed)
        type: local
      - stepNumber: 14
        description: Persist the lock record
        type: call
        targetComponent: host_core_adapter
        targetMethod: writeLockRecord
      - stepNumber: 15
        description: Return the lock record (with the compare URL to open the PR when git-backed)
        type: return
        outcome: lock record
    detail: full
  - name: enableGit
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: >-
          Resolve the caller's project:admin permission over the target project (binding a
          repository is project administration)
        type: call
        targetComponent: authorization_specialist
        targetMethod: authorize
      - stepNumber: 3
        description: If the effective value is not yes, deny
        type: branch
        condition: the effective project:admin value is not yes
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the git binding
        type: throw
        error: Forbidden — binding a repository requires project:admin over the project
      - stepNumber: 5
        description: >-
          Ensure the project record and an empty directory exist (no native provisioning) and bind
          the root
        type: local
      - stepNumber: 6
        description: >-
          Bind the project to its REAL repository (clone the remote onto the isolated working
          branch); wairon will commit ONLY .wai/ inside it
        type: call
        targetComponent: host_git_adapter
        targetMethod: enable
      - stepNumber: 7
        description: Return the project record
        type: return
        outcome: project record
  - name: disableGit
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Resolve the caller's project:admin permission over the target project
        type: call
        targetComponent: authorization_specialist
        targetMethod: authorize
      - stepNumber: 3
        description: If the effective value is not yes, deny
        type: branch
        condition: the effective project:admin value is not yes
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the git unbinding
        type: throw
        error: Forbidden — unbinding a repository requires project:admin over the project
      - stepNumber: 5
        description: Bind the project's isolated root
        type: local
      - stepNumber: 6
        description: Disable git backing (clear the binding; the working tree is untouched)
        type: call
        targetComponent: host_git_adapter
        targetMethod: disable
      - stepNumber: 7
        description: Return once disabled
        type: return
        outcome: disabled
  - name: syncGit
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Resolve the caller's project:write permission over the target project
        type: call
        targetComponent: authorization_specialist
        targetMethod: authorize
      - stepNumber: 3
        description: If the effective value is not yes, deny
        type: branch
        condition: the effective project:write value is not yes
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the git sync
        type: throw
        error: Forbidden — syncing a project's repository requires project:write over it
      - stepNumber: 5
        description: Bind the project's isolated root
        type: local
      - stepNumber: 6
        description: Sync the default branch into the working branch
        type: call
        targetComponent: host_git_adapter
        targetMethod: sync
      - stepNumber: 7
        description: Return once synced
        type: return
        outcome: synced
  - name: commitProject
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: >-
          Resolve the caller's project:write permission over the target project (a commit is a spec
          write's save, not administration)
        type: call
        targetComponent: authorization_specialist
        targetMethod: authorize
      - stepNumber: 3
        description: If the effective value is not yes, deny
        type: branch
        condition: the effective project:write value is not yes
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the commit
        type: throw
        error: Forbidden — committing a project's specs requires project:write over it
      - stepNumber: 5
        description: >-
          Bind the project's isolated root and resolve the staging scope: .wai/ by default, or
          .wai/specs/<subsystem>/ when a subsystem is given (a subsystem scope is a staging
          convenience only — git history stays per-repo); default the message when none is given
        type: local
      - stepNumber: 6
        description: >-
          Publish the scoped commit and push (commit = local save, push = the actual backup); a
          clean scope publishes nothing
        type: call
        targetComponent: host_git_adapter
        targetMethod: publish
      - stepNumber: 7
        description: Return the publish outcome
        type: return
        outcome: GitPublish
  - name: getGitBinding
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Resolve the caller's project:admin permission over the target project
        type: call
        targetComponent: authorization_specialist
        targetMethod: authorize
      - stepNumber: 3
        description: If the effective value is not yes, deny
        type: branch
        condition: the effective project:admin value is not yes
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the binding read
        type: throw
        error: Forbidden — reading a project's git binding requires project:admin over it
      - stepNumber: 5
        description: Bind the project's isolated root
        type: local
      - stepNumber: 6
        description: Read the git-backing status (remote/branch, sync setting, scoped dirtiness)
        type: call
        targetComponent: host_git_adapter
        targetMethod: status
      - stepNumber: 7
        description: Return the status
        type: return
        outcome: git backing status
  - name: configureGitSync
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: >-
          Resolve the caller's project:admin permission over the target project (the backup cadence
          is binding administration)
        type: call
        targetComponent: authorization_specialist
        targetMethod: authorize
      - stepNumber: 3
        description: If the effective value is not yes, deny
        type: branch
        condition: the effective project:admin value is not yes
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the sync configuration
        type: throw
        error: Forbidden — configuring the periodic sync requires project:admin over the project
      - stepNumber: 5
        description: Bind the project's isolated root
        type: local
      - stepNumber: 6
        description: Persist the periodic-sync setting into the project's git-backing config
        type: call
        targetComponent: host_git_adapter
        targetMethod: configureSync
      - stepNumber: 7
        description: Return once persisted
        type: return
        outcome: sync setting persisted
  - name: runPeriodicGitSync
    narrative:
      - stepNumber: 1
        description: >-
          List the hosted project records (pre-authorized internal sweep — the host supervisor's
          timer is the only caller; never exposed on a portal)
        type: call
        targetComponent: project_registry
        targetMethod: list
      - stepNumber: 2
        description: For each hosted project
        type: loop
        loopKind: forEach
        over: the hosted project records
        endStep: 7
      - stepNumber: 3
        description: Bind the iterated project's isolated root
        type: local
      - stepNumber: 4
        description: Read the project's git-backing status
        type: call
        targetComponent: host_git_adapter
        targetMethod: status
      - stepNumber: 5
        description: >-
          Publish only when the binding enables periodic sync AND the scoped .wai/ path is dirty (or
          skipIfClean is false) — a quiet project never commits noise
        type: branch
        condition: periodic sync is enabled and the scoped path is dirty (or skipIfClean is false)
        onTrueStep: 6
        onFalseStep: 7
      - stepNumber: 6
        description: Publish the .wai/-scoped backup commit and push
        type: call
        targetComponent: host_git_adapter
        targetMethod: publish
      - stepNumber: 7
        description: >-
          Record any per-project failure as a server diagnostic and continue — one project's failure
          never aborts the sweep
        type: local
      - stepNumber: 8
        description: Return once the sweep completes
        type: return
        outcome: sweep completed
  - name: configureProducer
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: >-
          Resolve the caller's project:admin permission over the target project (a producer
          publishes the project's specs to an external target)
        type: call
        targetComponent: authorization_specialist
        targetMethod: authorize
      - stepNumber: 3
        description: If the effective value is not yes, deny
        type: branch
        condition: the effective project:admin value is not yes
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the producer configuration
        type: throw
        error: Forbidden — configuring a producer requires project:admin over the project
      - stepNumber: 5
        description: Bind the project's isolated root
        type: local
      - stepNumber: 6
        description: Configure the producer target (tokens come from the secret store by ref, never inline)
        type: call
        targetComponent: host_producer_adapter
        targetMethod: configure
      - stepNumber: 7
        description: Return once configured
        type: return
        outcome: configured
  - name: produceProducer
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Resolve the caller's project:admin permission over the target project
        type: call
        targetComponent: authorization_specialist
        targetMethod: authorize
      - stepNumber: 3
        description: If the effective value is not yes, deny
        type: branch
        condition: the effective project:admin value is not yes
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the producer run
        type: throw
        error: Forbidden — running a producer requires project:admin over the project
      - stepNumber: 5
