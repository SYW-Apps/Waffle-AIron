id: skills_exporter_impl
name: Skills Exporter Implementation
description: >-
  Writes the built-in SDD skill templates and the pack-provided skills into each active target's
  skills directory, in src/core/skills.ts, through the shared file helper so an installed skill
  keeps its line endings.
contract: iskills_exporter
sourcePath: src/core/skills.ts
methods:
  - name: exportSddSkills
    narrative:
      - stepNumber: 1
        description: >-
          Read the project configuration through the core adapter: its enabled targets when no
          target types were passed, and always the targets the wairon plugin serves
          (project_config.pluginTargetTypes).
        type: call
        targetComponent: skills_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 2
        description: >-
          Determine the built-in skill template directory and each active target's skills directory
          — the passed target types, else the configured enabled targets.
        type: local
      - stepNumber: 3
        description: Is the built-in skill template present? A missing one is skipped
        type: call
        targetComponent: files_adapter
        targetMethod: exists
      - stepNumber: 4
        description: >-
          Write each built-in SDD skill into every active target's skills directory as
          <name>/SKILL.md, skipping targets that have no skills directory and the targets the wairon
          plugin serves, which provide the built-in skills themselves and are listed in the result
          as pluginServed; from a plugin-served target's directory, remove each built-in skill an
          earlier export left there (only the reserved sdd-* names), listing it as removed. The file
          keeps its line endings (the shared file helper): an installed SKILL.md checked out with
          CRLF stays CRLF and one that is unchanged is not rewritten, so a lock or generate that
          re-exports the skills never turns them into whole-file diffs.
        type: local
      - stepNumber: 5
        description: Load the governing extension packs to obtain their provided skills.
        type: call
        targetComponent: skills_core_adapter
        targetMethod: loadProjectExtensions
      - stepNumber: 6
        description: Read each pack skill's SKILL.md source (skipping one whose file is absent)
        type: call
        targetComponent: files_adapter
        targetMethod: readText
      - stepNumber: 7
        description: >-
          For each pack skill whose targets include an active target, a plugin-served one included
          (the plugin cannot carry a project's pack skills), write its SKILL.md (resolved relative
          to the pack directory) into that target's skills directory namespaced as
          <pack-id>-<skill-id>, keeping the installed file's line endings the same way; the built-in
          sdd-* names are reserved so a pack cannot shadow them.
        type: local
      - stepNumber: 8
        description: >-
          Return the export result (destinations, file count, skipped targets, plugin-served
          targets, removed duplicates).
        type: return
        outcome: skills installed
  - name: listSkillNames
    narrative: []
    detail: intent
    intent: >-
      Returns a copy of the bundled list of built-in SDD skill names; a pure read of a constant that
      never fails.
  - name: checkSkillFreshness
    narrative: []
    detail: intent
    intent: >-
      Resolves the target's skills directory (none: every list empty). Reads the project
      configuration through the core adapter: for a target the wairon plugin serves no built-in
      skill is owed, so none is missing or stale, and each built-in skill still present in the
      directory is listed as duplicate. Otherwise loads the project's pack skills for that target
      through the core adapter and, for each built-in skill, compares the installed file with the
      skill composed with its extending pack skills: absent is missing, different is stale,
      identical is ok. Reads only; never writes a file.
    calls:
      - skills_core_adapter.loadProjectExtensions
      - files_adapter.exists
      - files_adapter.readText
      - skills_core_adapter.loadProjectConfig
detail: calls-only
status: complete
createdAt: '2026-06-11T14:50:00Z'
updatedAt: '2026-11-15T02:14:59.451Z'
