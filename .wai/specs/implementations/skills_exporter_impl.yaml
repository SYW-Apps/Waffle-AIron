id: skills_exporter_impl
name: Skills Exporter Implementation
description: >-
  Copies the built-in SDD skill templates and the pack-provided skills into each active target's
  skills directory, in src/core/skills.ts.
contract: iskills_exporter
sourcePath: src/core/skills.ts
methods:
  - name: exportSddSkills
    narrative:
      - stepNumber: 1
        description: >-
          When no target types were passed, read the project configuration through the core adapter
          for its enabled targets.
        type: call
        targetComponent: skills_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 2
        description: >-
          Determine the built-in skill template directory and each active target's skills directory
          — the passed target types, else the configured enabled targets.
        type: local
      - stepNumber: 3
        description: >-
          Copy each built-in SDD skill template into every active target's skills directory as
          <name>/SKILL.md, skipping targets that have no skills directory.
        type: local
      - stepNumber: 4
        description: Load the governing extension packs to obtain their provided skills.
        type: call
        targetComponent: skills_core_adapter
        targetMethod: loadProjectExtensions
      - stepNumber: 5
        description: >-
          For each pack skill whose targets include an active target, copy its SKILL.md (resolved
          relative to the pack directory) into that target's skills directory namespaced as
          <pack-id>-<skill-id>; the built-in sdd-* names are reserved so a pack cannot shadow them.
        type: local
      - stepNumber: 6
        description: Return the export result (destinations, file count, skipped targets).
        type: return
        outcome: skills installed
  - name: listSkillNames
    narrative: []
    detail: intent
    intent: >-
      Returns a copy of the bundled list of built-in SDD skill names; a pure read of a constant that
      never fails.
  - name: checkSkillFreshness
    narrative: []
    detail: intent
    intent: >-
      Resolves the target's skills directory (none: every list empty). Otherwise loads the project's
      pack skills for that target through the core adapter and, for each built-in skill, compares
      the installed file with the skill composed with its extending pack skills: absent is missing,
      different is stale, identical is ok. Reads only; never writes a file.
    calls:
      - skills_core_adapter.loadProjectExtensions
detail: calls-only
status: complete
createdAt: '2026-06-11T14:50:00Z'
updatedAt: '2026-09-25T21:13:46.560Z'
