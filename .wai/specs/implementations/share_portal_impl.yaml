id: share_portal_impl
name: Share Portal Implementation
description: >-
  Public /share HTTP surface: each portal method is a function shaped like its contract, answering a
  ShareResponse; handleShareRequest is the transport the host listener mounts — it parses the path,
  derives the request meta and the `spec` selection, calls the method and writes the response with
  no-referrer / noindex / frame-ancestors and no session cookie.
contract: ishare_portal
sourcePath: src/server/sharehttp.ts
injectedParams:
  - cfg
router: handleShareRequest
methods:
  - name: getSharedView
    narrative:
      - stepNumber: 1
        description: >-
          Derive the request meta and resolve the token; on success render the read-only shared-view
          page (which loads the snapshot model), else 404.
        type: call
        targetComponent: share_access_orchestrator
        targetMethod: resolveSharedView
  - name: getSharedModel
    narrative:
      - stepNumber: 1
        description: Resolve the token and return the snapshot model JSON for the view page to render.
        type: call
        targetComponent: share_access_orchestrator
        targetMethod: resolveSharedView
  - name: getSharedOpenApi
    narrative:
      - stepNumber: 1
        description: >-
          Read the `spec` query parameter (a portalId), fetch that permitted per-portal OpenAPI
          document, and wrap it in a bundled, self-contained Swagger UI page. With several captured
          specs and no `spec`, the access orchestrator returns an openapi_spec_index and this portal
          renders it as an index page listing every shared API, each linking to its own viewer; with
          exactly one, open it directly.
        type: call
        targetComponent: share_access_orchestrator
        targetMethod: downloadArtifact
  - name: downloadSharedArtifact
    narrative:
      - stepNumber: 1
        description: >-
          Serve the permitted artifact download (html | openapi), forwarding the `spec` query
          parameter (a portalId) for openapi so one per-portal document is downloaded; with several
          captured specs and no `spec` the payload is an openapi_spec_index listing the APIs rather
          than a document, or 404/403.
        type: call
        targetComponent: share_access_orchestrator
        targetMethod: downloadArtifact
conformance: declared
status: complete
createdAt: '2026-07-18T09:31:51.087Z'
updatedAt: '2026-10-06T18:55:18.208Z'
