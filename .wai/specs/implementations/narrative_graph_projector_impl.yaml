id: narrative_graph_projector_impl
name: Narrative Graph Projector Implementation
description: >-
  Realizes the shared BFS narrative-graph walker moved out of graph.ts, deriving a NarrativeReach
  from a seed set without persisting or mutating any state.
contract: inarrative_graph_projector
simPath: tests/core/validation.test.ts
methods:
  - name: walk
    sourcePath: src/core/rules/narrative-graph-projector.ts
    narrative:
      - stepNumber: 1
        description: >-
          Resolve WalkOptions: followDispatchTables defaults to true when unset, followRegisterEdges
          defaults to true when unset. Initialize an empty NarrativeReach (reachedComponents and
          reachedMethods both empty) and an empty FIFO queue of pending {compId, methodName}
          entries.
        type: local
      - stepNumber: 2
        label: seedLoop
        description: 'For each seed in seeds:'
        type: loop
        loopKind: forEach
        over: seeds
        endStep: 7
      - stepNumber: 3
        description: >-
          Reach the seed's component (the shared 'reach a component' behavior reused everywhere
          below): if reach.reachesComponent(seed.compId) is false, add seed.compId to
          reachedComponents; then, only when followDispatchTables is true, flood the component's
          dispatch table into the reach — for each binding whose target is in ctx.componentMap,
          reach that bound component the same way and, if not already reached, add its bound method
          to reachedMethods and enqueue it, recursively repeating the flood for a newly reached
          bound Portal.
        type: local
      - stepNumber: 4
        description: Does this seed target one specific method, or the whole component?
        type: branch
        condition: the seed declares a methodName
        onFalseStep: 7
      - stepNumber: 5
        description: >-
          Seed names one method: if reach.reachesMethod(seed.compId, seed.methodName) is false, add
          methodKey(seed.compId, seed.methodName) to reachedMethods and push {compId: seed.compId,
          methodName: seed.methodName} onto the queue.
        type: local
      - stepNumber: 6
        description: Continue to the next seed.
        type: jump
        toStep: 2
      - stepNumber: 7
        label: seedEnqueueAll
        description: >-
          Seed names no method: enqueue every contract method of the component — for each interface
          in ctx.interfacesByComponent.get(seed.compId) and each of its methods, if
          reach.reachesMethod(seed.compId, methodName) is false, add methodKey(seed.compId,
          methodName) to reachedMethods and push {compId: seed.compId, methodName} onto the queue.
        type: local
      - stepNumber: 8
        label: bfsLoop
        description: 'While the queue has pending entries:'
        type: loop
        condition: the queue is non-empty
        loopKind: while
        endStep: 24
      - stepNumber: 9
        description: Dequeue the next {compId, methodName} from the front of the queue.
        type: local
      - stepNumber: 10
        description: >-
          Resolve the method's implementation: for each interface in
          ctx.interfacesByComponent.get(compId), look up
          ctx.implementationsByContract.get(interfaceId) for an implementation whose methods include
          one named methodName; take the first (impl, methodImpl) match found, else leave both
          undefined.
        type: local
      - stepNumber: 11
        description: Did the method resolve to a real implementation?
        type: branch
        condition: impl or methodImpl is undefined (no implementation resolved for this method)
        onFalseStep: 13
      - stepNumber: 12
        description: >-
          A reached method with no implementation contributes nothing — continue to the next queued
          entry.
        type: jump
        toStep: 8
      - stepNumber: 13
        label: narrativeLoop
        description: 'For each step in the resolved method''s narrative:'
        type: loop
        loopKind: forEach
        over: methodImpl.narrative
        endStep: 20
      - stepNumber: 14
        description: >-
          Only call, register and dispatch narrative steps carry reachability edges; branch on the
          step's type — any other type contributes nothing and moves to the next narrative step.
        type: switch
        'on': the narrative step's type
        cases:
          - value: call
            step: 15
          - value: register
            step: 17
          - value: dispatch
            step: 19
        defaultStep: 13
      - stepNumber: 15
        label: callEdge
        description: >-
          Call step: when it also declares targetComponent and targetMethod, reach targetComponent
          (the shared reach-a-component behavior above) and, if reach.reachesMethod(targetComponent,
          targetMethod) is false, add methodKey(targetComponent, targetMethod) to reachedMethods and
          push {compId: targetComponent, methodName: targetMethod} onto the queue; otherwise this
          step contributes no edge.
        type: local
      - stepNumber: 16
        description: Continue to the next narrative step.
        type: jump
        toStep: 13
      - stepNumber: 17
        label: registerEdge
        description: >-
          Register step: only when followRegisterEdges is true and the step also declares
          targetComponent and targetMethod, reach targetComponent and enqueue targetMethod exactly
          as a call step does — the callback is reached wherever its registering narrative is, but
          the edge is skipped entirely when the option is off.
        type: local
      - stepNumber: 18
        description: Continue to the next narrative step.
        type: jump
        toStep: 13
      - stepNumber: 19
        label: dispatchEdge
        description: >-
          Dispatch step: when it declares targetComponent, reach targetComponent (the routed
          Portal), then look up its dispatch table for the binding whose capability matches the
          step's capability; when a binding exists and ctx.componentMap has its bound component,
          reach that bound component and, if reach.reachesMethod on it and the bound method is
          false, add it to reachedMethods and enqueue it.
        type: local
      - stepNumber: 20
        label: dispatchEdgeContinue
        description: Continue to the next narrative step (also the narrative loop's last body step).
        type: jump
        toStep: 13
      - stepNumber: 21
        description: >-
          An empty narrative below full detail falls back to component-level reachability; a
          full-detail method's empty narrative is a real gap with no fallback, and an unresolvable
          component has nothing to fall back to.
        type: branch
        condition: >-
          methodImpl.narrative is empty, compId resolves to a component in ctx.componentMap, and
          methodImpl.effectiveDetail(impl, component).level is not 'full'
        onFalseStep: 24
      - stepNumber: 22
        label: fallbackLoop
        description: 'For each id in the component''s dependsOn and owns:'
        type: loop
        loopKind: forEach
        over: '[...component.dependsOn, ...component.owns]'
        endStep: 23
      - stepNumber: 23
        label: fallbackApply
        description: >-
          When ctx.componentMap has this id, reach it (the shared reach-a-component behavior above)
          and enqueue every one of its contract methods, exactly as a methodless seed does.
        type: local
      - stepNumber: 24
        label: bfsContinue
        description: Continue to the next queued entry.
        type: jump
        toStep: 8
      - stepNumber: 25
        description: 'The queue is empty: return the walk''s reach.'
        type: return
        outcome: the accumulated NarrativeReach (reachedComponents, reachedMethods)
status: draft
