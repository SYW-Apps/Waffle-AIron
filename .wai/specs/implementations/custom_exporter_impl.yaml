id: custom_exporter_impl
name: Custom Agent File Exporter Implementation
description: >-
  src/exporters/custom.ts. The smallest of the three, because everything tool-specific comes from
  the target configuration rather than from code.
contract: icustom_exporter
sourcePath: src/exporters/custom.ts
methods:
  - name: export
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the output directory the target configuration names, and the file name for this
          agent
        type: local
      - stepNumber: 2
        description: >-
          Compose the file: the wairon-managed banner, then the rendered instructions unchanged — a
          tool wairon knows nothing about gets the instructions and no assumptions
        type: local
      - stepNumber: 3
        description: Decide whether anything needs writing
        type: branch
        condition: the file already holds exactly this content
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Leave it alone and answer unchanged
        type: return
        outcome: unchanged
      - stepNumber: 5
        description: Create the parent directory if needed and write the file
        type: local
      - stepNumber: 6
        description: Answer with where it landed and what it holds
        type: return
        outcome: written
  - name: outputPath
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the configured output directory against the project root and name the file for the
          agent, without writing anything
        type: return
        outcome: resolved
status: complete
createdAt: '2026-09-20T19:46:27.069Z'
updatedAt: '2026-09-20T19:46:27.077Z'
