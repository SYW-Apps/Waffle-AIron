id: family_validator_impl
name: Family Validator Implementation
description: >-
  The family run over the bound root's graph, in src/core/family-validation.ts. Reach is granted by
  binding each selected project's root under a ceiling: a plain run narrows it to the family root,
  `--family` keeps the request's (none locally, the credential's hosted), and nothing widens it. The
  composition's out-of-reach externals are counted for the run's hint; the family codes are tuned by
  the owning project's sddRuleSeverity (the consumer for composition, the root for the member
  checks) and lint.allow never applies to them, because they name no spec.
contract: ifamily_validator
sourcePath: src/core/family-validation.ts
simPath: tests/core/family-validation.test.ts
methods:
  - name: run
    narrative:
      - stepNumber: 1
        description: >-
          Read the bound root's project graph through the core adapter: the root, the members it
          contains (depth-bounded by a numeric `recursive`), their keys and directories, the
          cross-project references and the identity and membership problems. This is the selection;
          nothing above the bound root is in it
        type: call
        targetComponent: validator_core_adapter
        targetMethod: projectFamily
      - stepNumber: 2
        description: >-
          Grant reach before any further read: unless the options ask for the family explicitly,
          narrow the request's reach ceiling to the bound root, so composing an external never reads
          a producer above the family. With `family` set, keep the request's reach unchanged —
          locally the walk up is then explicit, hosted it is the credential's — and never widen it
        type: local
      - stepNumber: 3
        description: For each selected project, the root first
        type: loop
        loopKind: forEach
        over: the selected projects of the graph, root first, then members in scan order
        endStep: 8
      - stepNumber: 4
        description: Bind the project's root for the next calls, restoring the caller's binding afterwards
        type: local
      - stepNumber: 5
        description: >-
          Read the project's own configuration through the core adapter: its own rule severities and
          projectType judge it, never the root's
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 6
        label: own-gate
        description: >-
          Run the project's own gate with its own configuration and the run's scope and strictness —
          the same call its own `validate` makes, so its verdict here is its verdict everywhere
        type: call
        targetComponent: spec_validator
        targetMethod: validateProject
      - stepNumber: 7
        description: Compose the project's externals against their live producers in reach
        type: call
        targetComponent: family_validator
        targetMethod: compose
      - stepNumber: 8
        description: >-
          Carry the project's own findings verbatim, each stamped with the project's key (spec ids
          shown under it), add the composition findings, and record the project's totals
        type: local
      - stepNumber: 9
        description: Run the family checks over the root's graph
        type: call
        targetComponent: family_validator
        targetMethod: checkMembers
      - stepNumber: 10
        description: >-
          Run the governance checks over the root's graph: each requiring project's
          composition.requirePolicies judged against the members below it
        type: call
        targetComponent: family_validator
        targetMethod: checkPolicies
      - stepNumber: 11
        description: >-
          When externals were left out because their producers lie outside the reach, add a one-line
          hint counting them and naming `validate --family` from the member that declares them
        type: local
      - stepNumber: 12
        description: >-
          Return the family verdict: valid when no project's gate and no family finding holds an
          error, with every project's totals
        type: return
        outcome: ValidationResult
  - name: compose
    narrative:
      - stepNumber: 1
        description: >-
          Read, through the surfaces adapter, each of the bound project's externals compared at
          signature level with its live producer: per used member unchanged, changed, removed,
          unlocked or unavailable, whether the producer drifted from its pin, and whether it lay out
          of reach (then it was never read)
        type: call
        targetComponent: validator_surfaces_adapter
        targetMethod: getExternalsStatus
      - stepNumber: 2
        description: >-
          Read the bound project's configuration through the core adapter for its own severity
          overrides
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 3
        description: For each external's status
        type: loop
        loopKind: forEach
        over: the statuses, in declaration order
        endStep: 8
      - stepNumber: 4
        description: Is the producer out of reach?
        type: branch
        condition: the status is outOfReach
        onFalseStep: 7
      - stepNumber: 5
        description: 'Record it as not selected — no finding: the run did not reach it'
        type: local
      - stepNumber: 6
        description: Next external
        type: jump
        toStep: 8
      - stepNumber: 7
        label: judge
        description: >-
          Turn the status into findings on the consumer's external: each used member changed or
          removed is EXTERNAL_INCOMPATIBLE (naming the member, what the lock recorded and what the
          live table now holds); a drifted producer with every used member unchanged is one
          EXTERNAL_DRIFTED; each unavailable or unlocked use is EXTERNAL_CHECK_UNAVAILABLE with its
          reason — never a pass. Each severity is the project's own sddRuleSeverity override, else
          the code default
        type: local
      - stepNumber: 8
        label: next
        description: The external is judged
        type: local
      - stepNumber: 9
        description: Return the composition findings, with the aliases of the externals not selected
        type: return
        outcome: ValidationIssue[]
  - name: checkMembers
    narrative:
      - stepNumber: 1
        description: >-
          Report the graph's member problems: each member-absent problem as MEMBER_NOT_FOUND (naming
          the declaring project, the alias and the path); each id-collision as PROJECT_ID_COLLISION
          (pointing at consumption: one member, several consumers); each defaulted member as
          PROJECT_ID_DEFAULTED, naming the name slug it answers to now and its alias as the id to
          declare (doctor --fix writes it); each member with no id as PROJECT_ID_AMBIGUOUS
        type: local
      - stepNumber: 2
        description: >-
          Find the loops of the selection with project_family.dependencyCycles and report each as
          PROJECT_DEPENDENCY_CYCLE on each project in it, with the references that make each edge,
          cheapest first
        type: local
      - stepNumber: 3
        description: For each present member
        type: loop
        loopKind: forEach
        over: the graph's members that loaded
        endStep: 7
      - stepNumber: 4
        description: Bind the member's root for the next calls, restoring the caller's binding afterwards
        type: local
      - stepNumber: 5
        description: >-
          Compute the member's own gate identity — its tree, doctrine, externals lock and pins,
          never an ancestor's
        type: call
        targetComponent: spec_validator
        targetMethod: computeGateStateId
      - stepNumber: 6
        description: Read the member's lock record through the core adapter
        type: call
        targetComponent: validator_core_adapter
        targetMethod: readLockRecord
      - stepNumber: 7
        description: >-
          No record is MEMBER_UNAPPROVED; a record whose identity differs from the one just computed
          is MEMBER_DRIFTED. The root's own lock is not a family finding
        type: local
      - stepNumber: 8
        description: >-
          Resolve each finding's severity with the root's sddRuleSeverity override, else the code
          default, and return them
        type: return
        outcome: ValidationIssue[]
  - name: checkPolicies
    narrative:
      - stepNumber: 1
        description: >-
          For each selected project that may require something of the projects below it, the root
          first
        type: loop
        loopKind: forEach
        over: >-
          the selected projects of the graph that have members in the selection, root first, then in
          scan order
        endStep: 9
      - stepNumber: 2
        description: Bind the project's root for the next calls, restoring the caller's binding afterwards
        type: local
      - stepNumber: 3
        description: >-
          Read the project's own configuration through the core adapter: its requirements and the
          severity overrides that tune the findings about them
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 4
        description: >-
          Read its requirements with project_config.requiredPolicies; each whose range does not
          parse (pack_requirement.rangeProblem) is POLICY_REQUIREMENT_INVALID on this project,
          quoting the range and the unreadable token, and is judged no further
        type: local
      - stepNumber: 5
        description: Nothing valid is required here
        type: branch
        condition: the project has no valid requirement
        onTrueStep: 9
        onFalseStep: 6
      - stepNumber: 6
        label: members
        description: >-
          For each selected member below this project, at every level (the graph's parent links,
          followed down)
        type: loop
        loopKind: forEach
        over: the selected projects whose parent chain reaches this project, in scan order
        endStep: 8
      - stepNumber: 7
        description: >-
          Bind the member's root for the next call, restoring the requiring project's binding
          afterwards
        type: local
      - stepNumber: 8
        label: member-judged
        description: Judge the member's adoption of this project's valid requirements
        type: call
        targetComponent: family_validator
        targetMethod: adoption
      - stepNumber: 9
        label: requirer-done
        description: >-
          Resolve each of this project's findings — POLICY_REQUIREMENT_INVALID and every adoption
          finding it caused — at this project's sddRuleSeverity override, else the code default,
          dropping those it turned off
        type: local
      - stepNumber: 10
        description: Return the governance findings
        type: return
        outcome: ValidationIssue[]
  - name: adoption
    narrative:
      - stepNumber: 1
        description: >-
          Read the member's own configuration through the core adapter: its selections, projectType
          and rule settings
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 2
        description: >-
          Load the packs that govern the member, with each loaded pack's name and version (a legacy
          path reference is known by its manifest's name)
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadProjectExtensions
      - stepNumber: 3
        description: >-
          Read the member's subsystem specs, for their profile and designDepth overrides and their
          lint allows
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadSubsystemSpecs
      - stepNumber: 4
        description: Read the member's component specs, for their lint allows
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadComponentSpecs
      - stepNumber: 5
        description: Read the member's interface specs, for their lint allows
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadInterfaceSpecs
      - stepNumber: 6
        description: Read the member's implementation specs, for their lint allows
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadImplementationSpecs
      - stepNumber: 7
        description: Read the member's type specs, for their lint allows
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadTypeSpecs
      - stepNumber: 8
        description: For each requirement
        type: loop
        loopKind: forEach
        over: the requirements, in declaration order
        endStep: 24
      - stepNumber: 9
        description: >-
          Find the member's entry for the required pack: a selection of that name, else a legacy
          path reference whose loaded manifest carries it
        type: local
      - stepNumber: 10
        description: Does the member select it at all?
        type: branch
        condition: the member has no entry for the pack
        onFalseStep: 13
      - stepNumber: 11
        description: >-
          POLICY_NOT_ADOPTED: the member does not select the pack — naming the pack, the range, the
          profile when one is required, and the requiring project
        type: local
      - stepNumber: 12
        description: Next requirement
        type: jump
        toStep: 24
      - stepNumber: 13
        label: version
        description: >-
          Read the version that governs the member: the loaded pack's version, else the selection's
          pin. A floating selection whose pack did not resolve has none, and its range is not
          judged: the member's own gate already reports why it did not resolve (one judge)
        type: local
      - stepNumber: 14
        label: range
        description: >-
          Does pack_requirement.admits accept the governing version? (a loaded pack whose manifest
          declares no version is admitted by no range)
        type: branch
        condition: a version governs, or the loaded pack declares none, and the requirement does not admit it
        onFalseStep: 17
      - stepNumber: 15
        description: >-
          POLICY_NOT_ADOPTED: selected outside the range — naming the range, the member's selection
          and the version that governs it (or that the pack declares none)
        type: local
      - stepNumber: 16
        description: Next requirement
        type: jump
        toStep: 24
      - stepNumber: 17
        label: profile
        description: When the requirement names a profile, is the member governed by it?
        type: branch
        condition: the requirement names a profile and the member's projectType is another
        onFalseStep: 20
      - stepNumber: 18
        description: >-
          POLICY_NOT_ADOPTED: the pack is selected but the required profile does not govern — naming
          the profile and the member's projectType
        type: local
      - stepNumber: 19
        description: Next requirement
        type: jump
        toStep: 24
      - stepNumber: 20
        label: settings
        description: Read the adopted pack's manifest the loader's way
        type: call
        targetComponent: validator_core_adapter
        targetMethod: packManifest
      - stepNumber: 21
        description: >-
          A manifest that did not load has no settings to compare; the member's own gate reports the
          load failure
        type: branch
        condition: no manifest resolved
        onFalseStep: 23
      - stepNumber: 22
        description: Next requirement
        type: jump
        toStep: 24
      - stepNumber: 23
        label: deviations
        description: >-
          Read the pack's settings with extension_pack.settings under the governing profile — the
          required one, else the member's projectType when the pack defines it, else none — and
          report a POLICY_DEVIATION for each setting the member changes, naming the setting, the
          pack's value and the member's: each rules.sddRuleSeverity entry for a code the pack sets
          with a different severity; rules.designDepth, and each subsystem's designDepth, other than
          the profile's; each subsystem `profile` other than the governing profile; and each
          lint.allow on the member's specs over a code the pack sets (naming the spec and site).
          Never a comparison with wairon's defaults: what the pack loosens is not a deviation
        type: local
      - stepNumber: 24
        label: next
        description: The requirement is judged
        type: local
      - stepNumber: 25
        description: >-
          Return the adoption findings at their default severities, each stamped with the member's
          key; the requiring project's overrides are applied by checkPolicies
        type: return
        outcome: ValidationIssue[]
    symbol: judgeAdoption
status: complete
