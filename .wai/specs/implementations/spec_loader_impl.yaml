id: spec_loader_impl
name: Spec Loader Implementation
description: >-
  Pure repository facade: every method forwards 1:1 to the owned face that does the work — loads to
  the Spec Index, saves and the round-trip dry run to the Spec Registry.
contract: ispec_loader
sourcePath: src/core/specs.ts
methods:
