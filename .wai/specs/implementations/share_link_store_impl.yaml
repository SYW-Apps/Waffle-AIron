id: share_link_store_impl
name: Share Link Store Implementation
description: >-
  Read-through file I/O over the share-link collection at <dataDir>/share-links.json: load parses
  the file fresh; update holds the file's write lock across a fresh read and the atomic replacement.
contract: ishare_link_store
sourcePath: src/server/sharelinks.ts
methods:
  - name: load
    narrative: []
    intent: >-
      Read share-links.json under the data dir fresh and return the parsed ShareLink array. A
      missing file yields an empty set; a malformed file fails with a storage error naming the path
      so the fault is diagnosable rather than silently swallowed.
  - name: update
    narrative: []
    intent: >-
      Under share-links.json's write lock (file_write_lock.run), read the set fresh - absent is
      empty, a file that exists but cannot be read or parsed throws and nothing is written - apply
      the change, replace the file via write-temp-then-rename (a crashed or partial write leaves the
      prior file intact) and release the lock, also when the change throws. Answers the set written.
    calls:
      - file_write_lock.run
    symbol: updateLinks
detail: intent
status: complete
