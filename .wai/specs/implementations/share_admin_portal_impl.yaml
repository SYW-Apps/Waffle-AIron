id: share_admin_portal_impl
name: Share Admin Portal Implementation
description: >-
  Authenticated /web/admin/share routes forwarding to the share admin orchestrator; the session id
  comes from the cookie via the dispatch layer.
contract: ishare_admin_portal
sourcePath: src/server/shareadminhttp.ts
methods:
  - name: createShareLink
    narrative:
      - stepNumber: 1
        description: Forward to the orchestrator to create the link.
        type: call
        targetComponent: share_admin_orchestrator
        targetMethod: createShareLink
  - name: refreshShareSnapshot
    narrative:
      - stepNumber: 1
        description: Forward to the orchestrator to refresh the snapshot.
        type: call
        targetComponent: share_admin_orchestrator
        targetMethod: refreshSnapshot
  - name: updateShareLink
    narrative:
      - stepNumber: 1
        description: Forward to the orchestrator to update the link.
        type: call
        targetComponent: share_admin_orchestrator
        targetMethod: updateShareLink
  - name: removeShareLink
    narrative:
      - stepNumber: 1
        description: Forward to the orchestrator to remove the link.
        type: call
        targetComponent: share_admin_orchestrator
        targetMethod: removeShareLink
  - name: listShareLinks
    narrative:
      - stepNumber: 1
        description: Forward to the orchestrator to list the project's links.
        type: call
        targetComponent: share_admin_orchestrator
        targetMethod: listShareLinks
  - name: getShareAccessLog
    narrative:
      - stepNumber: 1
        description: Forward to the orchestrator for the link's access log.
        type: call
        targetComponent: share_admin_orchestrator
        targetMethod: getShareAccessLog
conformance: declared
status: complete
createdAt: '2026-07-18T09:34:33.337Z'
updatedAt: '2026-07-18T10:10:40.517Z'
