id: reachability_migration_impl
name: Reachability Migration Implementation
description: The migration in its own module, beside the stereotype migration it mirrors.
contract: ireachability_migration
sourcePath: src/core/reachability-migration.ts
methods:
  - name: migrate
    narrative:
      - stepNumber: 1
        description: Read the retired forms the scan recorded, with what each stored spec held
        type: call
        targetComponent: spec_loader
        targetMethod: retiredReachFacts
      - stepNumber: 2
        description: >-
          Load every component spec: the Portals to retype, the listeners and the Portals they
          mounted
        type: call
        targetComponent: spec_loader
        targetMethod: loadComponentSpecs
      - stepNumber: 3
        description: >-
          Plan the transports: each portalType becomes transport (HTTP_API as HTTP); a Custom Portal
          that binds no endpoint on any verb, or whose Custom addresses all name in-process calls,
          becomes InProcess, its addresses dropped and reported as symbol hints
        type: local
      - stepNumber: 4
        description: >-
          Plan the listeners: for each listener's mounts, a Portal-level entry (kind entry, scope
          outside, the caller naming the listener and the prefixes it routed) on the listener and on
          every Portal it mounted that declares none; each mount's via as the mounted Portal
          implementation's router; each HTTP endpoint outside every prefix of its mounts reported. A
          Portal neither a listener nor mounted gets no entry
        type: local
      - stepNumber: 5
        description: >-
          Plan the invokedBy kinds: external becomes entry on a Portal and runtime elsewhere;
          sibling-subsystem is reported (model the call), never rewritten
        type: local
      - stepNumber: 6
        description: >-
          Plan the export types: an authored L1 or L0 type that equals the backing Portal's
          transport.exportKind() is dropped, one that differs is reported
        type: local
      - stepNumber: 7
        description: >-
          Plan the lint allows: each allow of a retired code is removed, and an allow of
          MISSING_PORTAL_TYPE is rekeyed to MISSING_PORTAL_TRANSPORT
        type: local
      - stepNumber: 8
        description: Without apply, nothing is written
        type: branch
        condition: apply is true and the plan has a rewrite
        onFalseStep: 18
      - stepNumber: 9
        label: write
        description: Write each rewritten spec through the store's own writers
        type: loop
        loopKind: forEach
        over: >-
          the specs the plan rewrites, components first, then interfaces, implementations,
          subsystems and the system
        endStep: 16
      - stepNumber: 10
        description: Which writer?
        type: switch
        'on': the spec's kind
        cases:
          - value: component
            step: 11
          - value: interface
            step: 13
        defaultStep: 15
      - stepNumber: 11
        label: component
        description: Save the rewritten component (transport, Portal-level entry, no mounts, no portalType)
        type: call
        targetComponent: spec_loader
        targetMethod: saveComponentSpec
      - stepNumber: 12
        description: On to the next spec
        type: jump
        toStep: 9
      - stepNumber: 13
        label: interface
        description: Save the rewritten interface (invokedBy kinds, dropped in-process addresses)
        type: call
        targetComponent: spec_loader
        targetMethod: saveInterfaceSpec
      - stepNumber: 14
        description: On to the next spec
        type: jump
        toStep: 9
      - stepNumber: 15
        label: other
        description: >-
          Save any other rewritten spec (an implementation's router, an export table's dropped
          types, a lint allow)
        type: call
        targetComponent: spec_loader
        targetMethod: saveSpec
      - stepNumber: 16
        label: writeEnd
        description: Done with this spec
        type: local
      - stepNumber: 17
        description: Invalidate the spec cache, so the next scan reads the migrated tree
        type: call
        targetComponent: spec_loader
        targetMethod: invalidateCache
      - stepNumber: 18
        label: answer
        description: Answer the plan, applied or not, with what it reports instead of writing
        type: return
        outcome: ReachabilityMigrationPlan
    detail: full
status: complete
createdAt: '2026-10-06T13:07:22.189Z'
updatedAt: '2026-10-06T13:07:37.543Z'
