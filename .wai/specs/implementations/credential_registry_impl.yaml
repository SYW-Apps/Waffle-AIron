id: credential_registry_impl
name: Credential Registry Implementation
description: File-backed I/O for hashed API-key records under the data root.
contract: icredential_registry
sourcePath: src/server/credentials.ts
methods:
  - name: findByToken
    narrative: []
    intent: >-
      Reads the credential store and returns the record whose keyHash matches the given token hash,
      or null. Read-only; never logs the token.
    symbol: findByTokenHash
  - name: create
    narrative: []
    intent: >-
      Appends a new ApiKeyRecord to the credential store under the data root, keyed by id, and
      persists atomically. Fails if the id already exists.
    symbol: createCredential
  - name: revoke
    narrative: []
    intent: Deletes the credential with the given id from the store. Idempotent — a missing id is a no-op.
    symbol: revokeCredential
  - name: list
    narrative: []
    intent: >-
      Returns all credential records whose authorized project set includes the given project (or
      every record for the wildcard). Read-only.
    symbol: listCredentials
  - name: revokeAllForOwner
    narrative: []
    intent: >-
      Loads the credential store and, for every record whose ownerSubject.userId equals the given
      ownerUserId and whose revokedAt is unset, stamps revokedAt with the current time; persists the
      store atomically and returns the count of records newly revoked. Read-modify-write and
      idempotent — records already revoked (or lacking an ownerSubject) are left unchanged and
      excluded from the count. Never logs token material.
  - name: listByOwner
    narrative: []
    detail: intent
    intent: >-
      Scan the persisted credential records and return those whose ownerSubject.userId equals the
      given owner user id (the same owner-identity match revokeAllForOwner uses), each with its
      hashed token preserved and the plaintext never present. A pure read over the store; an owner
      with no records yields an empty list.
status: complete
