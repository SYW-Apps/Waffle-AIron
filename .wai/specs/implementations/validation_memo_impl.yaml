id: validation_memo_impl
name: Validation Memo Implementation
description: >-
  src/core/validation-memo.ts: fingerprint what a gate reads, answer the remembered run of that gate
  when both fingerprints match, otherwise run it and remember it. The owner's gate and the
  as-complete gate share the fingerprints and are remembered under separate keys.
contract: ivalidation_memo
sourcePath: src/core/validation-memo.ts
simPath: tests/core/validation-memo.test.ts
methods:
  - name: validateProject
    narrative:
      - stepNumber: 1
        description: Scan the specs, so the loader's issues are this tree's whether or not the gate runs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: scanAllSpecs
      - stepNumber: 2
        description: Read the project configuration for its source roots and exclusions
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 3
        description: Spell the options as a stable key (rules, project type, scope, strictness, member depth)
        type: local
      - stepNumber: 4
        description: >-
          List every file under the project's .wai/ folder and under each declared member's .wai/
          folder (the gate reads a member's export table), recursively
        type: call
        targetComponent: files_adapter
        targetMethod: listEntries
      - stepNumber: 5
        description: >-
          Fold each file's path, size and modification time into the tree fingerprint, members'
          files included
        type: call
        targetComponent: files_adapter
        targetMethod: statOrNull
      - stepNumber: 6
        description: Read the implementation specs, whose source paths the code model reads
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadImplementationSpecs
      - stepNumber: 7
        description: Read the type specs, whose source paths the code model reads
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadTypeSpecs
      - stepNumber: 8
        description: Fingerprint the source files the gate's code model reads
        type: call
        targetComponent: source_analysis_adapter
        targetMethod: fingerprintSources
      - stepNumber: 9
        description: Read the remembered run for this root and options
        type: call
        targetComponent: validation_memo_cache
        targetMethod: get
      - stepNumber: 10
        description: Is it a run of the same files?
        type: branch
        condition: an entry is held and both its fingerprints equal the ones just taken
        onFalseStep: 12
      - stepNumber: 11
        description: Answer a copy of the remembered result
        type: return
        outcome: the remembered result
      - stepNumber: 12
        description: Run the owner's gate
        type: call
        targetComponent: spec_validator
        targetMethod: validateProject
      - stepNumber: 13
        description: Remember the result with the options key and both fingerprints
        type: call
        targetComponent: validation_memo_cache
        targetMethod: put
      - stepNumber: 14
        description: Answer a copy of the result
        type: return
        outcome: the fresh result
  - name: validateAsComplete
    narrative:
      - stepNumber: 1
        description: Scan the specs, so the loader's issues are this tree's whether or not the gate runs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: scanAllSpecs
      - stepNumber: 2
        description: Read the project configuration for its source roots and exclusions
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 3
        description: >-
          Spell the options as a stable key marked as an as-complete run, so it never matches an
          owner's-gate run
        type: local
      - stepNumber: 4
        description: >-
          List every file under the project's .wai/ folder and under each declared member's .wai/
          folder, recursively
        type: call
        targetComponent: files_adapter
        targetMethod: listEntries
      - stepNumber: 5
        description: >-
          Fold each file's path, size and modification time into the tree fingerprint, members'
          files included
        type: call
        targetComponent: files_adapter
        targetMethod: statOrNull
      - stepNumber: 6
        description: Read the implementation specs, whose source paths the code model reads
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadImplementationSpecs
      - stepNumber: 7
        description: Read the type specs, whose source paths the code model reads
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadTypeSpecs
      - stepNumber: 8
        description: Fingerprint the source files the gate's code model reads
        type: call
        targetComponent: source_analysis_adapter
        targetMethod: fingerprintSources
      - stepNumber: 9
        description: Read the remembered run for this root and key
        type: call
        targetComponent: validation_memo_cache
        targetMethod: get
      - stepNumber: 10
        description: Is it a run of the same files?
        type: branch
        condition: an entry is held and both its fingerprints equal the ones just taken
        onFalseStep: 12
      - stepNumber: 11
        description: Answer a copy of the remembered result
        type: return
        outcome: the remembered result
      - stepNumber: 12
        description: Run the as-complete gate
        type: call
        targetComponent: spec_validator
        targetMethod: validateAsComplete
      - stepNumber: 13
        description: Remember the result with the key and both fingerprints
        type: call
        targetComponent: validation_memo_cache
        targetMethod: put
      - stepNumber: 14
        description: Answer a copy of the result
        type: return
        outcome: the fresh result
status: complete
