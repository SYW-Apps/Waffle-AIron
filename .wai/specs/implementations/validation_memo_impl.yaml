id: validation_memo_impl
name: Validation Memo Implementation
description: >-
  src/core/validation-memo.ts: fingerprint what a gate reads by content, answer a remembered run of
  that gate (memory first, then the result file) when both fingerprints match, otherwise run it and
  remember it in both. The owner's gate and the as-complete gate share the fingerprints and are
  remembered under separate keys.
contract: ivalidation_memo
sourcePath: src/core/validation-memo.ts
simPath: tests/core/validation-memo.test.ts
methods:
  - name: validateProject
    narrative:
      - stepNumber: 1
        description: Scan the specs, so the loader's issues are this tree's whether or not the gate runs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: scanAllSpecs
      - stepNumber: 2
        description: Read the project configuration for its source roots and exclusions
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 3
        description: Spell the options as a stable key (rules, project type, scope, strictness, member depth)
        type: local
      - stepNumber: 4
        description: >-
          List every file under the project's .wai/ folder and under each declared member's .wai/
          folder (the gate reads a member's export table), recursively, leaving out each local-state
          folder (.wai/.local)
        type: call
        targetComponent: files_adapter
        targetMethod: listEntries
      - stepNumber: 5
        description: 'Fingerprint those files by content: the tree fingerprint'
        type: call
        targetComponent: content_fingerprint
        targetMethod: digest
      - stepNumber: 6
        description: Read the implementation specs, whose source paths the code model reads
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadImplementationSpecs
      - stepNumber: 7
        description: Read the type specs, whose source paths the code model reads
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadTypeSpecs
      - stepNumber: 8
        description: >-
          Fingerprint the source files the gate's code model reads, with the implementations'
          claims: the code fingerprint
        type: call
        targetComponent: code_model_loader
        targetMethod: fingerprint
      - stepNumber: 9
        description: Load the extension packs the gate judges with
        type: call
        targetComponent: validator_core_adapter
        targetMethod: loadProjectExtensions
      - stepNumber: 10
        description: >-
          Name what the gate reads outside the tree and the code model: the binding modules the
          implementations name, and the files of each loaded pack inside the project root (a pack
          outside it counts by its name, version and location)
        type: local
      - stepNumber: 11
        description: >-
          Fingerprint those files by content, and fold them with the outside packs' identities into
          the code fingerprint
        type: call
        targetComponent: content_fingerprint
        targetMethod: digest
      - stepNumber: 12
        description: Look for a run of these options over these fingerprints in this process's memory
        type: call
        targetComponent: validation_memo_cache
        targetMethod: get
      - stepNumber: 13
        description: Held in memory?
        type: branch
        condition: an entry was found
        onFalseStep: 15
      - stepNumber: 14
        description: Answer a copy of the remembered result
        type: return
        outcome: the remembered result
      - stepNumber: 15
        description: Look for it in the result file a process before this one left
        type: call
        targetComponent: validation_result_file
        targetMethod: get
      - stepNumber: 16
        description: Held on disk?
        type: branch
        condition: an entry was found
        onFalseStep: 19
      - stepNumber: 17
        description: Hold it in memory too
        type: call
        targetComponent: validation_memo_cache
        targetMethod: put
      - stepNumber: 18
        description: Answer a copy of its result
        type: return
        outcome: the remembered result
      - stepNumber: 19
        label: run
        description: Run the owner's gate
        type: call
        targetComponent: spec_validator
        targetMethod: validateProject
      - stepNumber: 20
        description: Remember the result in memory with the options key and both fingerprints
        type: call
        targetComponent: validation_memo_cache
        targetMethod: put
      - stepNumber: 21
        description: Remember it in the result file for the next process
        type: call
        targetComponent: validation_result_file
        targetMethod: put
      - stepNumber: 22
        description: Answer a copy of the result
        type: return
        outcome: the fresh result
  - name: validateAsComplete
    narrative:
      - stepNumber: 1
        description: Scan the specs, so the loader's issues are this tree's whether or not the gate runs
        type: call
        targetComponent: validator_core_adapter
        targetMethod: scanAllSpecs
      - stepNumber: 2
        description: Read the project configuration for its source roots and exclusions
