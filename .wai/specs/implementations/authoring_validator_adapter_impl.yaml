id: authoring_validator_adapter_impl
name: Authoring Validator Adapter Implementation
description: >-
  sdd_authoring's client hop into sdd_validator, in a module of its own: identity re-exports of the
  validator portal. The seam imports this module, so its calls into the validator land here.
contract: iauthoring_validator_adapter
sourcePath: src/core/adapters/authoring-validator.ts
methods:
  - name: validateComponentCandidate
    narrative:
      - stepNumber: 1
        description: Call validateComponentCandidate on validator portal
        type: call
        targetComponent: validator_portal
        targetMethod: validateComponentCandidate
  - name: findTestsReferencing
    narrative:
      - stepNumber: 1
        description: >-
          Forward the search to the validator portal; an empty test-root list answers empty rather
          than throwing, because naming the tests must never be the thing that fails a write
        type: call
        targetComponent: validator_portal
        targetMethod: findTestsReferencing
status: complete
