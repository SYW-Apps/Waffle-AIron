id: authoring_validator_adapter_impl
name: Authoring Validator Adapter Implementation
description: >-
  sdd_authoring's client hop into sdd_validator, in a module of its own: identity re-exports of the
  validator portal. The seam imports this module, so its calls into the validator land here.
contract: iauthoring_validator_adapter
sourcePath: src/core/adapters/authoring-validator.ts
methods:
  - name: validateComponentCandidate
    narrative:
      - stepNumber: 1
        description: Call validateComponentCandidate on validator portal
        type: call
        targetComponent: validator_portal
        targetMethod: validateComponentCandidate
  - name: findTestsReferencing
    narrative:
      - stepNumber: 1
        description: >-
          Forward the search to the validator portal; an empty test-root list answers empty rather
          than throwing, because naming the tests must never be the thing that fails a write
        type: call
        targetComponent: validator_portal
        targetMethod: findTestsReferencing
  - name: implementsProblem
    narrative:
      - stepNumber: 1
        description: Forward to the validator portal
        type: call
        targetComponent: validator_portal
        targetMethod: implementsProblem
  - name: introducedFindings
    narrative:
      - stepNumber: 1
        description: Call introducedFindings on the validator portal
        type: call
        targetComponent: validator_portal
        targetMethod: introducedFindings
  - name: validateProject
    narrative:
      - stepNumber: 1
        description: Call validateProject on validator portal
        type: call
        targetComponent: validator_portal
        targetMethod: validateProject
  - name: listRules
    narrative:
      - stepNumber: 1
        description: Call listRules on validator portal
        type: call
        targetComponent: validator_portal
        targetMethod: listRules
  - name: findReferences
    narrative:
      - stepNumber: 1
        description: >-
          Forward the lookup to the validator portal; a lookup that throws answers no references,
          because naming callers must never fail a write
        type: call
        targetComponent: validator_portal
        targetMethod: findReferences
status: complete
createdAt: '2026-09-18T21:13:03.714Z'
updatedAt: '2026-11-22T22:56:10.929Z'
