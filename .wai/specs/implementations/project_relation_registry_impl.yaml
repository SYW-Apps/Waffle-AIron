id: project_relation_registry_impl
name: Project Relation Registry Implementation
description: >-
  Write path for cross-project relations: id stamping, status defaulting and durable persistence.
  Preserves orchestrator-supplied provenance and validated interface refs; performs no authorization
  or public-surface validation. Every operation is ONE store update on the set read fresh under
  relations.json's write lock.
contract: iproject_relation_registry
sourcePath: src/server/relations.ts
methods:
  - name: upsert
    narrative: []
    intent: >-
      In one store update: stamp the relation's id on create while preserving the
      orchestrator-supplied createdAt and createdBy, default status to active when unset, leave the
      orchestrator-validated targetPublicInterface untouched, and append or replace it in the set
      read under the lock; return the stored relation. A failure leaves the previous set intact.
      Public-surface validation and authorization are enforced by the orchestrator, not here.
    calls:
      - project_relation_store.update
  - name: remove
    narrative: []
    intent: >-
      In one store update: locate the relation by id and remove it from the set read under the lock
      (or mark it removed per retention policy). A missing id is a safe not-found; a failure leaves
      the previous set intact.
    calls:
      - project_relation_store.update
detail: intent
status: complete
