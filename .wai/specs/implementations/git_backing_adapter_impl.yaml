id: git_backing_adapter_impl
name: Git Backing Adapter Implementation
description: >-
  git + filesystem I/O for container backup working copies under
  &lt;dataDir&gt;/git-backing/&lt;bindingId&gt;/, using the bot committer identity and
  WAIRON_GIT_TOKEN conventions.
contract: igit_backing_adapter
sourcePath: src/server/gitbacking.ts
methods:
  - name: cloneOrOpen
    narrative:
      - stepNumber: 1
        description: >-
          When the workdir holds no repository, git clone the remote at the branch into it;
          otherwise fetch and checkout the branch. Return the workdir path.
        type: local
  - name: mirrorTree
    narrative:
      - stepNumber: 1
        description: >-
          Replace the target directory's content with an exact copy of the source directory
          (deletions included), so the backing repo reflects the current state
        type: local
  - name: commitAndPush
    narrative:
      - stepNumber: 1
        description: >-
          Stage the working copy, and when the index holds changes commit with the bot identity and
          push the branch (WAIRON_GIT_TOKEN); return false without committing when clean
        type: local
lint:
  allow:
    - code: UNDECLARED_DEPENDENCY
      reason: >-
        Uses the shared secrets utility (utils/secrets.ts, spec-homed under sdd_host's
        secret_registry) for the git bot token, exactly like the per-project git_adapter_impl —
        placement debt (shared infrastructure candidate), not a sanctioned cross-subsystem reach.
status: complete
createdAt: '2026-07-16T15:40:11.338Z'
updatedAt: '2026-07-16T17:42:37.281Z'
