id: git_backing_adapter_impl
name: Git Backing Adapter Implementation
description: >-
  git + filesystem I/O for container backup working copies under
  &lt;dataDir&gt;/git-backing/&lt;bindingId&gt;/, using the bot committer identity and
  WAIRON_GIT_TOKEN conventions.
contract: igit_backing_adapter
sourcePath: src/server/gitbacking.ts
methods:
  - name: cloneOrOpen
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the token the clone authenticates with: the binding's own secret, else the shared
          git-token
        type: call
        targetComponent: secret_repository
        targetMethod: resolveGit
      - stepNumber: 2
        description: >-
          When the workdir holds no repository, git clone the remote (authenticated with that token
          when it is an https remote) at the branch into it; otherwise fetch and checkout the
          branch. Return the workdir path.
        type: local
  - name: mirrorTree
    narrative:
      - stepNumber: 1
        description: Remove the target directory, deletions included
        type: call
        targetComponent: files_adapter
        targetMethod: remove
      - stepNumber: 2
        description: Look up the source directory; an absent source mirrors as an absent target
        type: call
        targetComponent: files_adapter
        targetMethod: statOrNull
      - stepNumber: 3
        description: Make the target's parent directory
        type: call
        targetComponent: files_adapter
        targetMethod: ensureDir
      - stepNumber: 4
        description: >-
          Replace the target directory's content with an exact copy of the source directory
          (deletions included), so the backing repo reflects the current state
        type: call
        targetComponent: files_adapter
        targetMethod: copy
  - name: commitAndPush
    narrative:
      - stepNumber: 1
        description: >-
          Stage the working copy, and when the index holds changes commit with the bot identity and
          push the branch (WAIRON_GIT_TOKEN); return false without committing when clean
        type: local
lint:
  allow: []
status: complete
createdAt: '2026-07-16T15:40:11.338Z'
updatedAt: '2026-10-31T23:43:40.229Z'
