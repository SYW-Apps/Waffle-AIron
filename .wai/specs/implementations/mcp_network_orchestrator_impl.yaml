id: mcp_network_orchestrator_impl
name: MCP Network Orchestrator Implementation
description: The network tools' workflows, beside the externals workflows.
contract: imcp_network_orchestrator
sourcePath: src/mcp/network.ts
methods:
  - name: flows
    narrative:
      - stepNumber: 1
        description: >-
          Ask for the matrix as JSON, the selection being the request's (the family at a project
          that declares members, within its reach)
        type: call
        targetComponent: mcp_network_adapter
        targetMethod: flows
      - stepNumber: 2
        description: Parse the document's flows and keep only those into `to` when it is given
        type: local
      - stepNumber: 3
        description: Answer them, as text and structured content
        type: return
        outcome: list<NetworkFlow>
  - name: explain
    narrative:
      - stepNumber: 1
        description: Explain the pair
        type: call
        targetComponent: mcp_network_adapter
        targetMethod: why
      - stepNumber: 2
        description: Answer the explanation, as text and structured content
        type: return
        outcome: FlowExplanation
  - name: declare
    narrative:
      - stepNumber: 1
        description: 'The declaration: a NetworkDeclaration with the description when declared, else none'
        type: local
      - stepNumber: 2
        description: Write it through the core client adapter
        type: call
        targetComponent: mcp_core_adapter
        targetMethod: setNetwork
      - stepNumber: 3
        description: Answer whether it wrote
        type: return
        outcome: bool
status: complete
createdAt: '2026-10-06T13:15:29.445Z'
updatedAt: '2026-10-06T23:09:13.473Z'
