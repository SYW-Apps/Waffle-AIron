id: mcp_network_orchestrator_impl
name: MCP Network Orchestrator Implementation
description: The network tools' workflows, beside the externals workflows.
contract: imcp_network_orchestrator
sourcePath: src/mcp/network.ts
methods:
  - name: flows
    narrative:
      - stepNumber: 1
        description: >-
          Ask for the matrix as JSON, the selection being the request's (the family at a project
          that declares members, within its reach)
        type: call
        targetComponent: mcp_network_adapter
        targetMethod: flows
      - stepNumber: 2
        description: >-
          Read `to` as a party the way the network commands read one: the bound project's own id
          written as a prefix (`<project>::<component>`, `<project>::<portal>.<verb>`) names its own
          party, read bare; then parse the document's flows and keep only those whose called end the
          name denotes (flow_party.isNamed: its project, subsystem, component, workload or
          portal.verb) when it is given
        type: local
      - stepNumber: 3
        description: Is the answer empty for a name it was filtered by?
        type: branch
        condition: '`to` is given and no flow lands in it'
        onFalseStep: 7
      - stepNumber: 4
        description: >-
          Ask the network portal to explain a flow from outside to `to`, which names every party the
          design does not know
        type: call
        targetComponent: mcp_network_adapter
        targetMethod: why
      - stepNumber: 5
        description: Does the explanation name `to` as a party the design does not know?
        type: branch
        condition: the explanation lists `to` among its unknown parties
        onFalseStep: 7
      - stepNumber: 6
        label: unknown-party
        description: >-
          Refuse, naming the party and how a party is named, so an empty answer always means no flow
          lands there and never a name that resolved to nothing
        type: throw
        error: 'unknown party: nothing in the design is named so'
      - stepNumber: 7
        label: answer
        description: Answer them, as text and structured content
        type: return
        outcome: list<NetworkFlow>
  - name: explain
    narrative:
      - stepNumber: 1
        description: Explain the pair
        type: call
        targetComponent: mcp_network_adapter
        targetMethod: why
      - stepNumber: 2
        description: Answer the explanation, as text and structured content
        type: return
        outcome: FlowExplanation
  - name: declare
    narrative:
      - stepNumber: 1
        description: >-
          Read the project's configuration: a declaration it already holds keeps its description
          when none is given
        type: call
        targetComponent: mcp_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 2
        description: >-
          The declaration: a NetworkDeclaration with the given description (else the one already
          declared) when declared, else none
        type: local
      - stepNumber: 3
        description: Write it through the core client adapter
        type: call
        targetComponent: mcp_core_adapter
        targetMethod: setNetwork
      - stepNumber: 4
        description: Answer whether it wrote
        type: return
        outcome: bool
status: complete
createdAt: '2026-10-06T13:15:29.445Z'
updatedAt: '2026-10-07T21:47:59.655Z'
