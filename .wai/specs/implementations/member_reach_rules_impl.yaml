id: member_reach_rules_impl
name: Member Reach Rules Implementation
description: >-
  Pure rules of member reach over supplied values: the world after a membership change, the reach
  comparison across it, and the token qualifier rewrite.
contract: imember_reach_rules
sourcePath: src/server/member-reach.ts
methods:
  - name: relink
    narrative:
      - stepNumber: 1
        description: >-
          Copy the world's parent links, drop every link whose projectId is in removed, add every
          added link (replacing any link the member already had), drop every placement of an
          unplaced project, and append the given placements
        type: local
      - stepNumber: 2
        description: Return the world with the new links and every other collection unchanged
        type: return
        outcome: PermissionWorld
    detail: full
  - name: compare
    narrative:
      - stepNumber: 1
        description: >-
          Derive the subjects: each user record as its permission subject, plus one subject with no
          settings of its own standing for everyone else
        type: local
      - stepNumber: 2
        description: For every subject and every capability
        type: loop
        loopKind: forEach
        over: subjects x capabilities
        endStep: 5
      - stepNumber: 3
        description: >-
          Resolve the before value over (project, beforeId) in the before world; 'no' when beforeId
          is null
        type: call
        targetComponent: permission_rules
        targetMethod: resolvePermission
      - stepNumber: 4
        description: >-
          Resolve the after value over (project, afterId) in the after world; 'no' when afterId is
          null
        type: call
        targetComponent: permission_rules
        targetMethod: resolvePermission
      - stepNumber: 5
        description: Record the row with equal = (before.value is after.value)
        type: local
      - stepNumber: 6
        description: Return every row
        type: return
        outcome: ReachComparison[]
    detail: full
  - name: narrowing
    narrative:
      - stepNumber: 1
        description: Does any entry carry '::' (a member qualifier)?
        type: branch
        condition: an entry of the narrowing is member-qualified
        onTrueStep: 3
        onFalseStep: 2
      - stepNumber: 2
        description: 'Nothing to rewrite: a project entry covers its members through the chain'
        type: return
        outcome: 'null'
      - stepNumber: 3
        description: >-
          Replace each qualified entry by the record id of the member whose qualifier equals it,
          keep every other entry, collapse duplicates keeping first order
        type: local
      - stepNumber: 4
        description: >-
          State the widening: record-level tools (status, approval, lock requests, packs, policy,
          producers, commit, landscape discovery) now act on the member's own record — within the
          member only
        type: local
      - stepNumber: 5
        description: Return the planned rewrite
        type: return
        outcome: PlannedNarrowing
    detail: full
  - name: carryPlan
    narrative:
      - stepNumber: 1
        description: >-
          Collect the parent's project:write assignments with yes or no at `<parentId>/<subsystem>`
          for every moved subsystem, grouped by subject (a user id, or everyone)
        type: local
      - stepNumber: 2
        description: >-
          Drop the subjects already holding a project:write setting on the new project's own scope:
          theirs is kept
        type: local
      - stepNumber: 3
        description: >-
          Fold each subject's rules into one: carried when one subsystem names it, the most
          restrictive value (no over yes) when several do
        type: local
      - stepNumber: 4
        description: >-
          List every user's role binding anchored at a moved subsystem as not carried (can only
          narrow)
        type: local
      - stepNumber: 5
        description: Return the rules
        type: return
        outcome: CarriedSubsystemRule[]
    detail: full
status: complete
