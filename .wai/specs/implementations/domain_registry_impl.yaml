id: domain_registry_impl
name: Domain Registry Implementation
description: >-
  src/core/domains.ts. Every write is read-modify-write through the store: load the configuration,
  change the domains array, save it back. Nothing is cached between calls, so two commands in one
  process cannot disagree about what is registered.
contract: idomain_registry
sourcePath: src/core/domains.ts
methods:
  - name: resolve
    narrative:
      - stepNumber: 1
        description: Derive the subsystem-bound domains from the spec tree
        type: local
      - stepNumber: 2
        description: Read the registered free-standing domains from the configuration
        type: call
        targetComponent: topology_store
        targetMethod: loadConfig
      - stepNumber: 3
        description: Answer both kinds as one list — the distinction matters to a writer, not to a reader
        type: return
        outcome: resolved
    symbol: resolveDomains
  - name: find
    narrative:
      - stepNumber: 1
        description: Resolve every domain and answer the one with this id, or nothing
        type: return
        outcome: found
    symbol: findDomain
  - name: listFreeStanding
    narrative:
      - stepNumber: 1
        description: >-
          Read the configuration and answer the domains it registers — the writable set, and only
          that
        type: call
        targetComponent: topology_store
        targetMethod: loadConfig
    symbol: listFreeStandingDomains
  - name: deriveFromSubsystems
    narrative:
      - stepNumber: 1
        description: >-
          Read the subsystems this layer declares and emit one domain per subsystem, bound to it and
          owning its path. Derived on every call, never stored, so a renamed subsystem cannot leave
          a stale domain behind
        type: return
        outcome: derived
    symbol: deriveSubsystemDomains
  - name: addFreeStanding
    narrative:
      - stepNumber: 1
        description: Read the configuration as it stands
        type: call
        targetComponent: topology_store
        targetMethod: loadConfig
      - stepNumber: 2
        description: Decide whether the id is free
        type: branch
        condition: a domain with this id already exists, derived or registered
        onTrueStep: 3
        onFalseStep: 4
      - stepNumber: 3
        description: >-
          Refuse by name — two domains answering to one id makes every later lookup ambiguous, and
          the caller can see which kind already holds it
        type: throw
        error: duplicate domain id
      - stepNumber: 4
        description: Append the domain and write the configuration back
        type: call
        targetComponent: topology_store
        targetMethod: saveConfig
      - stepNumber: 5
        description: Done
        type: return
        outcome: registered
    symbol: addFreeStandingDomain
  - name: removeFreeStanding
    narrative:
      - stepNumber: 1
        description: Read the configuration as it stands
        type: call
        targetComponent: topology_store
        targetMethod: loadConfig
      - stepNumber: 2
        description: >-
          Drop the domain with this id from the registered set and write the configuration back. A
          derived domain is not in that set, so asking to remove one changes nothing rather than
          pretending to
        type: call
        targetComponent: topology_store
        targetMethod: saveConfig
      - stepNumber: 3
        description: Done
        type: return
        outcome: unregistered
    symbol: removeFreeStandingDomain
status: complete
createdAt: '2026-09-20T22:02:08.143Z'
updatedAt: '2026-09-20T22:02:08.149Z'
