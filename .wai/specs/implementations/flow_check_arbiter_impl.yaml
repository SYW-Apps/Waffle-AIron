id: flow_check_arbiter_impl
name: Flow Check Arbiter Implementation
description: Observed flows against the matrix, pure.
contract: iflow_check_arbiter
sourcePath: src/network/flow-check.ts
methods:
  - name: check
    narrative:
      - stepNumber: 1
        description: >-
          Name each observed party in design terms: through the bindings (the workload whose
          selector the name maps from) when given, else as written; outside stays outside. A name
          (or binding key) that is a renamed project's former name (model.formerNames) is read as
          its current key, and a note names it to rename
        type: local
      - stepNumber: 2
        label: observed
        description: For each observed flow
        type: loop
        loopKind: forEach
        over: the observed flows
        endStep: 8
      - stepNumber: 3
        description: >-
          The admitted flows on its pair: a caller within the source, a callee within the
          destination, and no refusal (refusedBy) on it
        type: local
      - stepNumber: 4
        description: >-
          Does the observation match a verb the destination declares (at L7, a verb of model.verbs
          within the destination whose binding matches the method and path, a template segment
          matching any value), and is it admitted on the pair?
        type: switch
        'on': admitted flows on the pair, and a declared verb matching it
        cases:
          - value: no admitted flow, a declared verb matches or a refused flow joins the pair
            step: 5
          - value: no admitted flow, nothing declared matches
            step: 6
        defaultStep: 7
      - stepNumber: 5
        label: disallowed
        description: >-
          Record it as disallowed: a known verb (or a flow the gate refuses), but not from this
          source
        type: jump
        toStep: 2
      - stepNumber: 6
        label: unexpected
        description: 'Record it as unexpected: nothing allows the pair'
        type: jump
        toStep: 2
      - stepNumber: 7
        label: admitted
        description: >-
          At L7, the admitted flows whose binding matches the method and path; none matching is
          disallowed when another declared verb of the destination matches, else an unknown verb
        type: local
      - stepNumber: 8
        label: observedEnd
        description: Mark every matching admitted flow exercised
        type: local
      - stepNumber: 9
        description: >-
          Record every admitted flow never marked exercised as unexercised (a refused flow is no
          allowance to exercise), and carry the model's gate findings and the former-name notes
        type: local
      - stepNumber: 10
        description: Answer the report
        type: return
        outcome: FlowCheckReport
    detail: full
status: complete
