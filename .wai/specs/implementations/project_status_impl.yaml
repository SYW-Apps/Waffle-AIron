id: project_status_impl
name: Project Status Implementation
description: >-
  src/core/status.ts. Every layer is counted from the specs the loader already holds rather than
  from the filesystem, so the report describes the tree as the rest of wairon sees it — a report
  built by walking directories could disagree with the validator about what exists, and the
  disagreement would be invisible.
contract: iproject_status
sourcePath: src/core/status.ts
methods:
  - name: report
    narrative:
      - stepNumber: 1
        description: Load the tree, following members as far as the options allow
        type: call
        targetComponent: spec_loader
        targetMethod: loadSystemSpec
      - stepNumber: 2
        description: Decide whether anything failed to parse
        type: branch
        condition: the loader reported issues
        onTrueStep: 3
        onFalseStep: 4
      - stepNumber: 3
        description: >-
          Answer with each failure named — the file, the code and the message — and say plainly that
          the report failed. Refusing to answer would withhold the one thing the asker needs;
          answering without marking it failed would let a script read a broken tree as a healthy one
        type: return
        outcome: parse failures
      - stepNumber: 4
        description: Decide whether there is a system at all
        type: branch
        condition: no L0 system specification is present
        onTrueStep: 5
        onFalseStep: 6
      - stepNumber: 5
        description: >-
          Say the system specification is missing, and mark the report failed. A different state
          from a tree that would not parse, and it reads differently to whoever is looking
        type: return
        outcome: no system
      - stepNumber: 6
        description: Read the subsystems, components, interfaces and implementations the tree holds
        type: call
        targetComponent: spec_loader
        targetMethod: loadSubsystemSpecs
      - stepNumber: 7
        description: >-
          Read the project graph: each member the tree reaches (its alias, project id, declaration
          form and parent), so members print as projects rather than as subsystems
        type: call
        targetComponent: spec_loader
        targetMethod: graph
      - stepNumber: 8
        description: >-
          Count each component's progress through the layers — whether it has a contract, an
          implementation, and source files its implementation names — narrowing to one subsystem
          when the options asked for that, and marking each part through the role the caller
          supplied: structure, layer, score, draft, present or missing. A subsystem that holds types
          but no components (a shared contracts library) scores by its own status — complete is
          100%, not 0%. Each member prints as a `[Project]` node (alias and project id, `mount form`
          noted for a legacy declaration) holding its own subsystems, never as a `[Subsystem]`; a
          subsystem whose key repeats its member's alias (`billing::billing`) is labelled by its
          local name under its project. Roles rather than colours, so this renderer never learns
          what a terminal is
        type: local
      - stepNumber: 9
        description: >-
          When the options carry the pin tree (options.approvals, computed by the validator at each
          project's own root and handed in — this component cannot compute a gate identity), mark
          each `[Project]` line with that member's approval state in words (approved | drifted |
          never approved, `re-lock once` for an upgrade-only drift) and how its parent's lock pinned
          it (pinned | pin moved | not pinned), and close the report with the root's own state as a
          sentence (`Approval: this project is approved | drifted since its approval | never
          approved`) — a lone project never approved says so too, so the report never leaves the
          question open. States are read, never recomputed here, so the report from a parent and
          from the member agree by construction (status-agrees). Without approvals the report shows
          no states
        type: local
      - stepNumber: 10
        description: >-
          Answer the report as text, not failed. One renderer, so the terminal and the MCP status
          tool cannot drift into disagreeing about what this tree contains — which they did, for as
          long as each had its own copy
        type: return
        outcome: report
    symbol: getStatusReport
status: complete
