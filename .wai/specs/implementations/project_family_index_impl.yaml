id: project_family_index_impl
name: Project Family Index Implementation
description: >-
  src/core/project-family.ts. Projects the scan's roots and specs into the project graph once per
  scan and memoizes it on that scan. The scan already bound every reference, so the graph reads the
  bindings instead of qualifying anything itself. Lookups (node, ownerOf, producerOf, declares,
  dependencyCycles) are pure methods of the ProjectFamily value every consumer already holds, so the
  Index publishes the graph alone.
contract: iproject_family_index
sourcePath: src/core/project-family.ts
methods:
  - name: graph
    narrative:
      - stepNumber: 1
        description: >-
          Read the project roots the current scan read from the Spec Index — the scan the graph is
          memoized on
        type: call
        targetComponent: spec_index
        targetMethod: listProjectRoots
      - stepNumber: 2
        description: Is the graph memoized for this scan?
        type: branch
        condition: the memo holds a graph for this scan's roots
        onTrueStep: 16
        onFalseStep: 3
      - stepNumber: 3
        description: >-
          Read the scanned subsystems (lifecycle entries, L1 re-exports, trustedLinks' declaring
          subsystems) from the Spec Index
        type: call
        targetComponent: spec_index
        targetMethod: loadSubsystemSpecs
      - stepNumber: 4
        description: Read the scanned components (dependsOn, dispatch tables, mounts) from the Spec Index
        type: call
        targetComponent: spec_index
        targetMethod: loadComponentSpecs
      - stepNumber: 5
        description: Read the scanned interfaces (param and return types) from the Spec Index
        type: call
        targetComponent: spec_index
        targetMethod: loadInterfaceSpecs
      - stepNumber: 6
        description: >-
          Read the scanned implementations (narrative targets, declared calls, auth sources) from
          the Spec Index
        type: call
        targetComponent: spec_index
        targetMethod: loadImplementationSpecs
      - stepNumber: 7
        description: Read the scanned types (field types) from the Spec Index
        type: call
        targetComponent: spec_index
        targetMethod: loadTypeSpecs
      - stepNumber: 8
        description: >-
          Make one node per root: its key, parent, alias and declaration form, legacy mount and
          directory as the scan recorded them; its id from project_config.effectiveId() — declared,
          else the name slug, the one default every reader uses — with where it came from (declared,
          name, none); its name; whether it has an L0; its alias table; its members, the contained
          project roots it declares; and its parts as the scan recorded them (stage 8), which are
          not nodes. A root with no readable configuration has no name and no id
        type: local
      - stepNumber: 9
        description: >-
          Record the owner of every spec key: the root whose files declared it — for a part's spec,
          the root that declares the part, since its specs are that project's own
        type: local
      - stepNumber: 10
        description: >-
          Record the family's problems the scan met: an id two or more members resolve to is an
          id-collision naming each and where its id came from; a member with no id is a no-id; a
          member that declares no id is defaulted, carrying its alias as the id to declare (the
          bound root's own identity is judged from its configuration and lock, so it is not repeated
          here); a member whose directory is missing is member-absent; an alias declared both as a
          member and as an external is an alias-conflict; a key declared twice in one project is a
          duplicate-spec naming both files; and each root's stage-8 member problems as the scan
          recorded them (part-unavailable, kind-mismatch)
        type: local
      - stepNumber: 11
        description: For each node
        type: loop
        loopKind: forEach
        over: the nodes
        endStep: 12
      - stepNumber: 12
        label: bind-externals
        description: >-
          Bind each of the node's project_config.declaredExternals() to its producer (role
          external), then each of its referenced project members (a `../`, git or hosted source
          whose content the scan found to be a project's; role member, bound exactly like an
          external — stage 8). A declaration with a problem is unresolved with that problem. With a
          source.path: the path resolved against the node's directory; the family node at that
          directory makes it a family producer (a declared producer id that differs from that node's
          id is the problem), any other directory makes it a path producer at audience instance —
          whether a project lives there is established when it is pinned, since the index does no
          I/O of its own. With a source.git: a git producer at audience instance — an external's
          directory left for the external producers workflow to resolve and materialize, a
          referenced member's taken from where the scan located it (ScannedProjectRoot.referenced:
          the fetch cache at its pinned commit, with that commit; unavailable with the scan's
          reason). With a source.hosted: left for the hosted lookup. Without a source: the family
          nodes whose id equals the producer id — none leaves it unresolved, two leave it unresolved
          as ambiguous, one makes it a family producer at audience project, related to the consumer
          as its parent, a sibling (same parent), a member, or otherwise family
        type: local
      - stepNumber: 13
        description: >-
          Collect the cross-project references from the bindings the scan recorded: every reference
          in a counted position (dependsOn, call/register/dispatch targets, declared calls,
          dispatch-table bindings, mounts, lifecycle entries, component auth sources, L1 re-exports,
          field/param/return types) whose bound target lies in another project than the referring
          spec's owner, with its authored text, the public name it bound to (none for unexported and
          undeclared), the member it reaches and, for a reference an implementation writes (a call,
          register or dispatch step, a declared call), its caller: the component that
          implementation's contract belongs to
        type: local
      - stepNumber: 14
        description: >-
          Gather every root's authored references — each with its form, binding and rewrite — into
          the graph
        type: local
      - stepNumber: 15
        description: Memoize the graph on this scan
        type: local
      - stepNumber: 16
        label: answer
        description: Answer with the graph
        type: return
        outcome: ProjectFamily
    detail: full
    symbol: projectFamilyGraph
status: complete
