    symbol: getWebProjectMembers
  - name: outdate
    narrative:
      - stepNumber: 1
        description: Mark every kept view as no longer current, keeping each view and its findings
        type: call
        targetComponent: web_view_cache
        targetMethod: outdate
      - stepNumber: 2
        description: Return
        type: return
        outcome: outdated
    symbol: outdateViews
