id: web_graph_orchestrator_impl
name: Web Graph Orchestrator Implementation
description: >-
  Serves the unified web UI's live level-of-detail graph. Authenticates the browser session to a
  Principal, then reshapes the already-scoped hosted landscape or projects one authorized project's
  spec tree at the requested detail level with validator issues overlaid.
contract: iweb_graph_orchestrator
sourcePath: src/server/web.ts
injectedParams:
  - cfg
methods:
  - name: get
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the browser session to a Principal through the single auth authority's session
          bridge (rejects an expired or absent session as unauthenticated)
        type: call
        targetComponent: authentication
        targetMethod: authenticateSession
      - stepNumber: 2
        description: Dispatch on the requested graph tier
        type: switch
        'on': tier
        cases:
          - value: landscape
            step: 3
          - value: project
            step: 6
        defaultStep: 12
      - stepNumber: 3
        description: >-
          Landscape tier: delegate to the landscape orchestrator's already-scoped landscape
          generation, presenting the session id as the credential (the auth bridge: a session
          resolves to a Principal exactly like a bearer token) and the requested scope; the
          landscape orchestrator applies its own landscape:read scoping and returns only in-scope
          units and projects
        type: call
        targetComponent: landscape_orchestrator
        targetMethod: generate
      - stepNumber: 4
        description: >-
          Reshape the returned LandscapeGraphModel into a WebGraphModel: tier 'landscape', map each
          LandscapeNode to a WebGraphNode (orgUnit->kind 'unit' at level 0, project->kind 'project'
          at level 0, publicInterface->kind 'interface' at level 2; carry id, label, projectId, the
          unit's parent as parentId, and status), keep only nodes within the requested detail level,
          and carry the LandscapeEdges over: a relation edge (relationId set) whose
          publishedInterface endpoint was dropped by the detail cutoff is RETARGETED to that
          interface's owning project node — one edge per relation, keeping edgeKind, relationId, and
          label — so cross-project relations stay visible at the project level of detail; any other
          edge touching a dropped node is dropped. Set level = the requested level, generatedAt =
          now, scope = 'instance'
        type: local
      - stepNumber: 5
        description: Return the landscape-tier web graph model
        type: return
        outcome: landscape web graph model
      - stepNumber: 6
        description: >-
          Project tier: resolve and bind the requested project's isolated root within the
          principal's authorized set through the project repository (rejects cross-project access,
          so an out-of-scope project is Forbidden)
        type: call
        targetComponent: project_repository
        targetMethod: resolveRoot
      - stepNumber: 7
        description: Bind the resolved target project root for the host-core reads that follow
        type: local
      - stepNumber: 8
        description: >-
          Project the bound project's spec tree into a level-filtered WebGraphModel via the host
          core adapter
        type: call
        targetComponent: host_core_adapter
        targetMethod: buildProjectGraph
      - stepNumber: 9
        description: >-
          Run the as-complete conformance gate over the bound project to gather its current
          validator issues
        type: call
        targetComponent: host_validator_adapter
        targetMethod: validateAsComplete
      - stepNumber: 10
        description: >-
          Overlay the validation issues onto the project graph's nodes as per-node issueCounts of
          errors and warnings and, apart from them, noticeCounts of notices (grouping each issue by
          the component/spec id it references), and stamp tier 'project', scope = the project id,
          level = the requested level, generatedAt = now
        type: local
      - stepNumber: 11
        description: Return the project-tier web graph model with issue counts overlaid
        type: return
        outcome: project web graph model
      - stepNumber: 12
        description: Reject an unsupported graph tier
        type: throw
        error: unsupported graph tier
    detail: full
    symbol: getGraph
  - name: getProjectCanvas
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the browser session to a Principal through the single auth authority's session
          bridge (rejects an expired or absent session as unauthenticated)
        type: call
        targetComponent: authentication
        targetMethod: authenticateSession
      - stepNumber: 2
        description: >-
          Confirm the project is in the caller's resolved read set through the web project
          orchestrator's scoped list — a unit-scoped grant must not render another tenant's canvas —
          refusing anything else as Forbidden
        type: call
        targetComponent: web_project_orchestrator
        targetMethod: list
      - stepNumber: 3
        description: >-
          Resolve and bind the requested project's isolated root within the principal's authorized
          set through the project repository (rejects cross-project access, so an out-of-scope or
          unknown project is Forbidden)
        type: call
        targetComponent: project_repository
        targetMethod: resolveRoot
      - stepNumber: 4
        description: Bind the resolved target project root for the canvas render that follows
        type: local
      - stepNumber: 5
        description: >-
          Grant the read its reach: the listed projects from step 2 — every project the caller may
          read, write or administer — exactly as the canvas model and the Relations tab read, so a
          member or producer outside it is answered unavailable, never read and never ok
        type: local
      - stepNumber: 6
        description: >-
          Read the family's relation health over the bound root through the host validator adapter:
          each project's externals status at its own root, per use, stamped with when it was
          compared
        type: call
        targetComponent: host_validator_adapter
        targetMethod: familyRelations
      - stepNumber: 7
        description: >-
          Render the interactive architecture canvas ('canvas' format — the full Cytoscape canvas
          with edge routing, type-ERD/database views, search, and the details sidebar) over the
          bound project's spec tree via the host core adapter, handing it the relations so each
          consumption edge carries its health — the same health the canvas model carries
        type: call
        targetComponent: host_core_adapter
        targetMethod: renderDiagram
      - stepNumber: 8
        description: Return the self-contained canvas HTML
        type: return
        outcome: project canvas html
    detail: full
  - name: getProjectCanvasModel
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the browser session to a Principal through the single auth authority's session
          bridge (rejects an expired or absent session as unauthenticated)
        type: call
        targetComponent: authentication
        targetMethod: authenticateSession
      - stepNumber: 2
        description: >-
          Confirm the project is in the caller's resolved read set through the web project
          orchestrator's scoped list, refusing anything else as Forbidden
        type: call
        targetComponent: web_project_orchestrator
        targetMethod: list
      - stepNumber: 3
        description: >-
          Resolve the project's isolated root within the principal's authorized set through the
          project repository; an unresolvable one is Forbidden too, with no existence leak
        type: call
        targetComponent: project_repository
        targetMethod: resolveRoot
      - stepNumber: 4
        description: Bind that root for the build that follows
        type: local
      - stepNumber: 5
        description: >-
          Grant the read its reach: the listed projects from step 2 — every project the caller may
          read, write or administer — exactly as the Relations tab's read does, so a member or
          producer outside it is answered unavailable, never read and never ok
        type: local
      - stepNumber: 6
        description: >-
          Read the family's relation health over the bound root through the host validator adapter:
          each project's externals status at its own root, per use, stamped with when it was
          compared — the same comparison the Relations tab shows
        type: call
        targetComponent: host_validator_adapter
        targetMethod: familyRelations
      - stepNumber: 7
        description: >-
          Build the canvas model over the bound spec tree through the host core adapter, handing it
          the relations so each consumption edge carries its health
        type: call
        targetComponent: host_core_adapter
        targetMethod: buildCanvasDataModel
      - stepNumber: 8
        description: >-
          Read the project's hosted family — the member records the canvas's member project nodes
          stand for
        type: call
        targetComponent: project_repository
        targetMethod: family
      - stepNumber: 9
        description: >-
          Read the project's configuration through the host core adapter: the hosted record each
          declared external names (`source.hosted`), the record its external project node stands for
        type: call
        targetComponent: host_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 10
        description: >-
          Give each member project node its member's record id, and each external project node the
          hosted record its external names, only when that record is in the caller's listed projects
          from step 2 (read, write or administer); any other node stays one without one (no id
          leaks). The engine opens that project's own page from exactly those nodes through the
          app's open-project hook; a node without an id is drawn without a link (and an external out
          of reach is already unavailable in the relations)
        type: local
      - stepNumber: 11
        description: Return the model
        type: return
        outcome: project canvas model
    symbol: getWebProjectCanvasModel
  - name: getProjectOpenApi
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the browser session to a Principal through the single auth authority's session
          bridge (rejects an expired or absent session as unauthenticated)
        type: call
        targetComponent: authentication
        targetMethod: authenticateSession
      - stepNumber: 2
        description: >-
          Confirm the project is in the caller's resolved read set through the web project
          orchestrator's scoped list, refusing anything else as Forbidden
        type: call
        targetComponent: web_project_orchestrator
        targetMethod: list
      - stepNumber: 3
        description: >-
          Resolve the project's isolated root within the principal's authorized set through the
          project repository; an unresolvable one is Forbidden
        type: call
        targetComponent: project_repository
        targetMethod: resolveRoot
      - stepNumber: 4
        description: >-
          Export the bound project's gateway surface at the project audience ceiling as OpenAPI
          through the host surfaces adapter: one named document per public portal, or a single
          rendered document
        type: call
        targetComponent: host_surfaces_adapter
        targetMethod: exportSurface
      - stepNumber: 5
        label: choose
        description: Choose the page
        type: branch
        condition: >-
          the project publishes no document, or a portal was named that the project does not
          publish, or several portals and none named
        onTrueStep: 6
        onFalseStep: 7
      - stepNumber: 6
        label: index
        description: >-
          Return the index page listing the project's APIs — never an empty explorer, never a
          different API in place of the one asked for
        type: return
        outcome: api index html
      - stepNumber: 7
        label: explorer
        description: Return the explorer page for the named portal's document, or for the only one
        type: return
        outcome: api explorer html
    symbol: getWebProjectOpenApi
  - name: getProjectExternals
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the browser session to a Principal through the single auth authority's session
          bridge (rejects an expired or absent session as unauthenticated)
        type: call
        targetComponent: authentication
        targetMethod: authenticateSession
      - stepNumber: 2
        description: >-
          Confirm the project is in the caller's resolved read set through the web project
          orchestrator's scoped list, refusing anything else as Forbidden
        type: call
        targetComponent: web_project_orchestrator
        targetMethod: list
      - stepNumber: 3
        description: >-
          Resolve the project's root within the principal's authorized set through the project
          repository (a member's own root when the project is a member); an unresolvable one is
          Forbidden too, with no existence leak
        type: call
        targetComponent: project_repository
        targetMethod: resolveRoot
      - stepNumber: 4
        description: >-
          Bind that root with the caller's reach: the listed projects from step 2 — every project
          the caller may read, write or administer, not only read. The family above the project is
          in reach when the family root is listed, and a source.hosted producer when its record is;
          anything else is reported unavailable
        type: local
      - stepNumber: 5
        description: Read the project's externals status over the bound root through the host surfaces adapter
        type: call
        targetComponent: host_surfaces_adapter
        targetMethod: externalsStatus
      - stepNumber: 6
        description: Return one status per external
        type: return
        outcome: ExternalStatus[]
    detail: full
    symbol: getWebProjectExternals
  - name: getProjectNetwork
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the browser session to a Principal through the single auth authority's session
          bridge (rejects an expired or absent session as unauthenticated)
        type: call
        targetComponent: authentication
        targetMethod: authenticateSession
      - stepNumber: 2
        description: >-
          Confirm the project is in the caller's resolved read set through the web project
          orchestrator's scoped list, refusing anything else as Forbidden
        type: call
        targetComponent: web_project_orchestrator
        targetMethod: list
      - stepNumber: 3
        description: >-
          Resolve the project's root within the principal's authorized set through the project
          repository; an unresolvable one is Forbidden too, with no existence leak
        type: call
        targetComponent: project_repository
        targetMethod: resolveRoot
      - stepNumber: 4
        description: >-
          Bind that root with the caller's reach: the listed projects from step 2, so the family
          above the project is composed only when its root is listed
        type: local
      - stepNumber: 5
        description: Read the network view over the bound root through the host network adapter
        type: call
        targetComponent: host_network_adapter
        targetMethod: view
      - stepNumber: 6
        description: Return the view model
        type: return
        outcome: NetworkViewModel
    detail: full
    symbol: getWebProjectNetwork
