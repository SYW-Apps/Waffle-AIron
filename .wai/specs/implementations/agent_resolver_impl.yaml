id: agent_resolver_impl
name: Agent Topology Resolver Implementation
description: Concrete implementation resolving dynamic agent topology from spec loaders.
contract: iagent_resolver
sourcePath: src/core/agent_resolver.ts
methods:
  - name: resolveAgentTopology
    narrative:
      - stepNumber: 1
        description: Load system spec
        type: call
        targetComponent: spec_loader
        targetMethod: loadSystemSpec
      - stepNumber: 2
        description: >-
          Load subsystem specs and keep only THIS layer's LOCAL subsystems — a member project's
          subsystem carries its project key as a :: prefix and belongs to the member's own layer,
          not this one
        type: call
        targetComponent: spec_loader
        targetMethod: loadSubsystemSpecs
      - stepNumber: 3
        description: Load component specs
        type: call
        targetComponent: spec_loader
        targetMethod: loadComponentSpecs
      - stepNumber: 4
        description: Load interface specs
        type: call
        targetComponent: spec_loader
        targetMethod: loadInterfaceSpecs
      - stepNumber: 5
        description: Load implementation specs
        type: call
        targetComponent: spec_loader
        targetMethod: loadImplementationSpecs
      - stepNumber: 6
        description: >-
          Load the component-variant registry (the dynamic layer on top of packs), so each
          owner/implementer can carry its variant-tagged components' guidance + same-variant
          siblings
        type: call
        targetComponent: variant_registry_adapter
        targetMethod: loadProjectVariants
      - stepNumber: 7
        description: >-
          Render each owner/implementer's variant guidance through the variant registry, so the
          generated agent and the MCP spec-read path emit the SAME text from one implementation
          rather than two copies kept in step by hand.
        type: call
        targetComponent: variant_registry_adapter
        targetMethod: composeVariantGuidance
      - stepNumber: 8
        description: >-
          Read the project configuration through the project config repository: its enabled targets,
          stamped on every record, and rules.generateComponentImplementers.
        type: call
        targetComponent: project_config_repository
        targetMethod: load
      - stepNumber: 9
        description: >-
          Read the declared domains through the topology repository's facade, so a domain the
          repository declares but the spec tree does not model still gets an owner — domains are a
          superset of subsystems, which is the whole reason this read exists
        type: call
        targetComponent: topology_repository
        targetMethod: loadConfig
      - stepNumber: 10
        description: >-
          For each member the bound root declares directly, bind the member's own root and collect
          the ids of the agents ITS layer resolves (its architect, its owners and implementers, and
          its own members' delegating owners — never expanding those further), each qualified
          `<alias>::<agentId>`. Ids only: nothing of the member's agents is rendered here, and the
          walk stops at one level, so this layer's topology stays proportional to itself
        type: local
      - stepNumber: 11
        description: Ask the spec loader where each local subsystem's spec lives, for its owner's ownedPaths
        type: call
        targetComponent: spec_loader
        targetMethod: subsystemPath
      - stepNumber: 12
        description: Ask where each component's spec lives, for its owner's and implementer's ownedPaths
        type: call
        targetComponent: spec_loader
        targetMethod: componentPath
      - stepNumber: 13
        description: Ask where each of the component's interfaces lives, for its implementer's ownedPaths
        type: call
        targetComponent: spec_loader
        targetMethod: interfacePath
      - stepNumber: 14
        description: Ask where each of the component's implementations lives, for its implementer's ownedPaths
        type: call
        targetComponent: spec_loader
        targetMethod: implementationPath
      - stepNumber: 15
        description: >-
          Build the LAYERED AgentRecord list: the system architect, one owner per local subsystem,
          and ONE delegating owner per member project this project declares (in `members`, or for
          one release a legacy L1 mount) that routes work into the member without enumerating its
          internals and lists the member's agents by reference (delegatesTo); component implementers
          only when generateComponentImplementers is enabled. A PART (stage 8) is no member project
          here: its subsystems are this layer's local subsystems, so each gets an ordinary owner
          whose fence holds the part's spec files where the part stores them, and whose description
          names the part — a part fetched from git is read, never owned (its files are the fetch
          cache's; it is changed in its own repository and taken in with `member update`). Each
          owner's and implementer's ownedPaths fence holds the source files its implementations and
          their methods name, and each carries the rendered variantGuidance for its variant-tagged
          components.
        type: local
  - name: composeAgentBrief
    narrative:
      - stepNumber: 1
        description: >-
          Is the id qualified by a direct member's alias (`<alias>::<rest>`, the alias declared in
          this project's `members` or, for one release, a legacy mount)?
        type: branch
        condition: the id's first segment is the alias of a direct member
        onTrueStep: 2
        onFalseStep: 5
      - stepNumber: 2
        description: >-
          Bind the member's own root and compose the brief for `<rest>` there — the member's own
          topology, template, guidance and configuration, so the brief is exactly the one the
          member's own session gets and never grows with the family; `<rest>` may itself be
          qualified, one hop per member. The binding is restored afterwards
        type: call
        targetComponent: agent_resolver
        targetMethod: composeAgentBrief
      - stepNumber: 3
        description: >-
          Re-express the brief's ownedPaths and readPaths under the member's directory relative to
          this root, set `root` to that directory, and qualify its agentId with the alias, so the
          fence is correct from the asking root
        type: local
      - stepNumber: 4
        description: Return the member's brief
        type: return
        outcome: brief composed through the mount
      - stepNumber: 5
        description: >-
          Resolve the current agent topology (resolveAgentTopology over the live spec tree) and
          locate the record whose id matches agentId
        type: local
      - stepNumber: 6
        description: Refuse unknown agents
        type: branch
        condition: no record matches agentId
        onTrueStep: 7
        onFalseStep: 8
      - stepNumber: 7
        description: Unknown agent id — name the known ids in the error so a caller can self-correct
        type: throw
        error: UnknownAgentError
      - stepNumber: 8
        description: >-
          Read the project configuration through the project config repository: the global templates
          directory the template lookup consults, and the execution settings the brief's budget is
          resolved from.
        type: call
        targetComponent: project_config_repository
        targetMethod: load
      - stepNumber: 9
        description: Load the record's instruction template through the template source adapter
        type: call
        targetComponent: template_source_adapter
        targetMethod: loadTemplate
      - stepNumber: 10
        description: >-
          Build the variable map from the record (agentName, ownedPaths fence, domain context,
          rendered variantGuidance) and substitute the {{variable}} placeholders into the template
          body
        type: local
      - stepNumber: 11
        description: >-
          Read the optional per-agent project guidance file (.wai/agents/<agentId>.md) — live, so a
          user edit applies on the next fetch
        type: call
        targetComponent: template_source_adapter
        targetMethod: loadAgentOverride
      - stepNumber: 12
        description: >-
          When guidance exists, append it to the rendered instructions under an attributed '##
          Project guidance' section — the user's delta stays legible AS a delta over the inferred
          brief
        type: local
      - stepNumber: 13
        description: >-
          Fold in the type mapping: find the language the record's implementations are written in
          (their technologies' language, else the language their source files are analyzed as), take
          the dialect shipped for it (type_dialect.forLanguage) and, when there is one, carry its
          write table (type_dialect.mappingLines) as the brief's typeMapping and as a '## Types in
          <language>' section of the instructions — so an implementer maps `list<T>`, `T?`, `async
          T` and an enum by rule rather than by guess. No dialect, or no implementation to write,
          adds nothing
        type: local
      - stepNumber: 14
        description: >-
          Return the AgentBrief: rendered instructions plus the structured scope fields (ownedPaths,
          readPaths, domainRoot, template)
        type: return
        outcome: brief composed
  - name: loadRegistry
    narrative:
      - stepNumber: 1
        description: >-
          Refuse unless the project is initialized, and answer an empty registry when the tree holds
          no system spec — a project that has not been designed yet has no agents, which is an
          answer rather than a failure
        type: local
      - stepNumber: 2
        description: >-
          Derive the agent topology from the spec tree and wrap it in the Registry shape, stamped
          with the time it was derived
        type: return
        outcome: derived
    symbol: loadRegistry
status: complete
createdAt: '2026-06-11T14:50:00Z'
