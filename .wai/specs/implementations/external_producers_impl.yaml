id: external_producers_impl
name: External Producers Implementation
description: >-
  src/core/external-producers.ts. Climbs to the highest reachable root of the family, reads the
  graph there, and binds the bound project's declarations — a source.hosted one through the request
  binding's hosted record lookup; restores the caller's binding on every path.
contract: iexternal_producers
sourcePath: src/core/external-producers.ts
methods:
  - name: resolveDeclared
    narrative:
      - stepNumber: 1
        description: >-
          Remember the bound root — the consumer, whose node is found by its directory — and the
          caller's binding, which every path restores
        type: local
      - stepNumber: 2
        description: Climb the mount chain one hop at a time
        type: loop
        condition: the last hop found a parent in reach
        loopKind: doWhile
        endStep: 4
      - stepNumber: 3
        description: >-
          Detect the bound root's chaining parent through the core workflow's detection, which is
          null for a top root and null when the bound request may not read above its root — the
          caller must gate on reach itself, and this is where it does
        type: call
        targetComponent: core_orchestrator
        targetMethod: resolveChainingParent
      - stepNumber: 4
        label: climbed
        description: >-
          When a parent was found, bind its root read-only and continue from there; when none was
          found for a root that is itself chained (the next hop is out of reach), record that the
          family could not be read whole
        type: local
      - stepNumber: 5
        description: Read the project graph of the highest root reached
        type: call
        targetComponent: spec_loader
        targetMethod: graph
      - stepNumber: 6
        description: 'Find the consumer''s node: the one whose directory is the remembered root'
        type: local
      - stepNumber: 7
        description: >-
          For each of the node's externals — its declared externals, then its referenced project
          members (a `../`, git or hosted source; role member, stage 8), which are bound and judged
          exactly as externals are
        type: loop
        loopKind: forEach
        over: the consumer node's externals and referenced project members
        endStep: 17
      - stepNumber: 8
        description: Is the producer in the family?
        type: branch
        condition: the external's sourceKind is family
        onFalseStep: 11
      - stepNumber: 9
        description: Map the consumer's references into the producer onto the producer's public names
        type: call
        targetComponent: spec_loader
        targetMethod: exportUsage
      - stepNumber: 10
        description: A family producer is bound
        type: jump
        toStep: 17
      - stepNumber: 11
        label: outside
        description: >-
          Count the consumer's references through the alias by the public name they spell, since the
          scan did not read this producer — so its pin's `used` map is filled and its status
          compares per use, closing the gap where an outside producer was reported unavailable per
          use
        type: call
        targetComponent: spec_loader
        targetMethod: pinnedUsage
      - stepNumber: 12
        description: Is the producer in a git repository?
        type: branch
        condition: the producer's source is git
        onFalseStep: 16
      - stepNumber: 13
        description: >-
          For an external, resolve its ref's head now: that is the live producer a status compares
          the pin against. A referenced member keeps its declared commit instead — the family is
          made of the pinned revision. A remote that cannot be reached leaves the binding without a
          directory and with the problem "git producer unavailable: <reason>" — unavailable, never a
          pass
        type: call
        targetComponent: git_source_adapter
        targetMethod: resolve
      - stepNumber: 14
        description: >-
          Materialize that commit (served from the cache offline when it is there) and take its
          directory, under the source's dir, as the producer's root; record the commit on the
          binding
        type: call
        targetComponent: git_source_adapter
        targetMethod: fetch
      - stepNumber: 15
        description: A git producer is bound
        type: jump
        toStep: 17
      - stepNumber: 16
        label: hosted
        description: >-
          For a source.hosted external, ask the request binding's hosted record lookup for the
          producer's root — the hosting server answers it only for a record the request may read, so
          the caller must gate on reach itself and this is where it does. Outside a hosted server
          there is no lookup: the external is unresolved with "hosted-only producer `<id>`:
          available only through the hosted server"; a record the lookup does not answer (unknown,
          or out of reach) is unresolved too — unavailable, never a pass
        type: local
      - stepNumber: 17
        label: bound
        description: >-
          Record the binding: the external, its usage when one was mapped, and whether the family
          was read whole
        type: local
      - stepNumber: 18
        description: Restore the caller's binding
        type: local
      - stepNumber: 19
        description: Answer the bindings in declaration order
        type: return
        outcome: ExternalBinding[]
    detail: full
status: complete
createdAt: '2026-09-26T17:44:00.485Z'
updatedAt: '2026-10-02T20:47:01.920Z'
