id: permission_admin_orchestrator_impl
name: Permission Admin Orchestrator Implementation
description: >-
  Role, assignment, and role-binding management: authenticate, authorize through the authorization
  component (instance-level project:admin for roles, project:admin over the scope for
  assignments/bindings), mutate through the role/permission/user repositories, and audit at security
  level. Reserves the built-in role ids (e.g. 'sso-admin' — intrinsic, not stored) against
  create/update/delete, and rejects any attempt to set the reserved '*' capability (there is no
  instance-admin assignment — the bypass is env-anchored to the built-in admin).
contract: ipermission_admin_orchestrator
sourcePath: src/server/permissionadmin.ts
methods:
  - name: listRoles
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: authentication
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Resolve the caller's project:admin permission at instance scope
        type: call
        targetComponent: authorization
        targetMethod: authorize
      - stepNumber: 3
        description: If the effective value is not yes, deny
        type: branch
        condition: the effective project:admin value is not yes
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the role listing
        type: throw
        error: Forbidden — listing roles requires instance-level project:admin
      - stepNumber: 5
        description: List all defined roles through the role repository
        type: call
        targetComponent: role_repository
        targetMethod: list
      - stepNumber: 6
        description: Return the roles
        type: return
        outcome: the defined roles
  - name: setAssignment
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: authentication
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: >-
          HARD RESERVATION: if the assignment is the reserved '*' capability at instance scope,
          reject before any authorization
        type: branch
        condition: the assignment's capability is '*' at instance scope (the reserved instance-admin marker)
        onTrueStep: 3
        onFalseStep: 4
      - stepNumber: 3
        description: Reject the reserved marker unconditionally
        type: throw
        error: >-
          Forbidden — the instance-admin marker ('*'@instance) is reserved to the built-in admin
          account
      - stepNumber: 4
        label: subsystem-shape
        description: >-
          A subsystem scope carries one capability as a yes/no setting: is this a subsystem-scope
          assignment that is not project:write with yes, no or inherit, or whose scope id is not
          `<projectId>/<subsystemId>`?
        type: branch
        condition: >-
          the assignment's scope kind is subsystem and its capability, value or scope id does not
          fit a subsystem
        onFalseStep: 6
      - stepNumber: 5
        description: >-
          Refuse it before any authorization, naming what a subsystem carries: only project:write,
          as yes or no (reading stays whole-project; there is no approval flow for a single spec
          write)
        type: throw
        error: a subsystem scope carries only project:write, yes or no, at <projectId>/<subsystemId>
      - stepNumber: 6
        description: Resolve the caller's project:admin permission over the assignment's scope
        type: call
        targetComponent: authorization
        targetMethod: authorize
      - stepNumber: 7
        description: If the effective value is not yes, deny
        type: branch
        condition: the effective project:admin value is not yes
        onTrueStep: 8
        onFalseStep: 9
      - stepNumber: 8
        description: Reject the assignment
        type: throw
        error: Forbidden — setting an assignment requires project:admin over its scope
      - stepNumber: 9
        description: >-
          Canonicalize a user-kind subjectId onto the subject's userId (the id every live principal
          carries — a record id passed from the Users list resolves through the user record; an id
          with no record passes through), then upsert the assignment through the permission
          repository
        type: call
        targetComponent: permission_repository
        targetMethod: setAssignment
      - stepNumber: 10
        description: Append a redacted audit event without letting a failure fail the write
        type: try
        endStep: 12
        catches:
          - error: audit append failure
            step: 13
      - stepNumber: 11
        description: Append the redacted permission.set audit event (security level)
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 12
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 14
      - stepNumber: 13
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 14
        description: Return the stored assignment
        type: return
        outcome: the stored assignment
  - name: removeAssignment
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: authentication
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Look up the assignment by id to read its own scope
        type: call
        targetComponent: permission_repository
        targetMethod: getAssignment
      - stepNumber: 3
        description: If no assignment matches, reject as not found
        type: branch
        condition: no assignment matches the id
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject as not found
        type: throw
        error: not found
      - stepNumber: 5
        description: >-
          Resolve the caller's project:admin permission over the assignment's OWN scope (never a
          caller-supplied one)
        type: call
        targetComponent: authorization
        targetMethod: authorize
      - stepNumber: 6
        description: If the effective value is not yes, deny
        type: branch
        condition: the effective project:admin value is not yes
        onTrueStep: 7
        onFalseStep: 8
      - stepNumber: 7
        description: Reject the removal
        type: throw
        error: Forbidden — removing an assignment requires project:admin over its scope
      - stepNumber: 8
        description: Remove the assignment through the permission repository
        type: call
        targetComponent: permission_repository
        targetMethod: removeAssignment
      - stepNumber: 9
        description: Append a redacted audit event without letting a failure fail the removal
        type: try
        endStep: 11
        catches:
          - error: audit append failure
            step: 12
      - stepNumber: 10
        description: Append the redacted permission.remove audit event (security level)
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 11
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 13
      - stepNumber: 12
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 13
        description: Return once the assignment has been removed
        type: return
        outcome: assignment removed
  - name: listAssignments
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: authentication
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Resolve the caller's project:admin permission over the queried scope
        type: call
        targetComponent: authorization
        targetMethod: authorize
      - stepNumber: 3
        description: If the effective value is not yes, deny
        type: branch
        condition: the effective project:admin value is not yes
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the assignment listing
        type: throw
        error: Forbidden — listing assignments requires project:admin over the scope
      - stepNumber: 5
        description: >-
          List assignments through the permission repository; a user-subject filter matches the raw
          id AND its canonical form, so legacy rows keyed by a diverged record id stay visible next
          to canonical ones
        type: call
        targetComponent: permission_repository
        targetMethod: listAssignments
      - stepNumber: 6
        description: Return the assignments
        type: return
        outcome: the assignments
  - name: bindRole
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: authentication
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Is this a subsystem-scope binding whose scope id is not `<projectId>/<subsystemId>`?
        type: branch
        condition: >-
          the binding's scope kind is subsystem and its scope id does not name a project and a
          subsystem
        onFalseStep: 4
      - stepNumber: 3
        description: Refuse it before any authorization
        type: throw
        error: a subsystem scope id is <projectId>/<subsystemId>
      - stepNumber: 4
        description: Resolve the caller's project:admin permission over the binding's scope
        type: call
        targetComponent: authorization
        targetMethod: authorize
      - stepNumber: 5
        description: If the effective value is not yes, deny
        type: branch
        condition: the effective project:admin value is not yes
        onTrueStep: 6
        onFalseStep: 7
      - stepNumber: 6
        description: Reject the role binding
        type: throw
        error: Forbidden — binding a role requires project:admin over the scope
      - stepNumber: 7
        description: Look up the target user by id
        type: call
        targetComponent: user_repository
        targetMethod: getById
      - stepNumber: 8
        description: If no user matches, reject as not found
        type: branch
        condition: no user matches userId
        onTrueStep: 9
        onFalseStep: 10
      - stepNumber: 9
        description: Reject as not found
        type: throw
        error: not found
      - stepNumber: 10
        description: >-
          Add the {roleId, scopeKind, scopeId} binding to the user's roleBindings (idempotent — no
          duplicate)
        type: local
      - stepNumber: 11
        description: Persist the updated user record through the user repository
        type: call
        targetComponent: user_repository
        targetMethod: upsert
      - stepNumber: 12
        description: Append a redacted audit event without letting a failure fail the binding
        type: try
        endStep: 14
        catches:
          - error: audit append failure
            step: 15
      - stepNumber: 13
        description: Append the redacted role.bind audit event (security level)
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 14
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 16
      - stepNumber: 15
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 16
        description: Return the updated user record
        type: return
        outcome: the updated user record
  - name: unbindRole
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: authentication
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Resolve the caller's project:admin permission over the binding's scope
        type: call
        targetComponent: authorization
        targetMethod: authorize
      - stepNumber: 3
        description: If the effective value is not yes, deny
        type: branch
        condition: the effective project:admin value is not yes
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the role unbinding
        type: throw
        error: Forbidden — unbinding a role requires project:admin over the scope
      - stepNumber: 5
        description: Look up the target user by id
        type: call
        targetComponent: user_repository
        targetMethod: getById
      - stepNumber: 6
        description: If no user matches, reject as not found
        type: branch
        condition: no user matches userId
        onTrueStep: 7
        onFalseStep: 8
      - stepNumber: 7
        description: Reject as not found
        type: throw
        error: not found
      - stepNumber: 8
        description: Remove the matching {roleId, scopeKind, scopeId} binding from the user's roleBindings
        type: local
      - stepNumber: 9
        description: Persist the updated user record through the user repository
        type: call
        targetComponent: user_repository
        targetMethod: upsert
      - stepNumber: 10
        description: Append a redacted audit event without letting a failure fail the unbinding
        type: try
        endStep: 12
        catches:
          - error: audit append failure
            step: 13
      - stepNumber: 11
        description: Append the redacted role.unbind audit event (security level)
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 12
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 14
      - stepNumber: 13
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 14
        description: Return the updated user record
        type: return
        outcome: the updated user record
  - name: createRole
    narrative:
      - stepNumber: 1
        description: >-
          If the role id is a reserved built-in id (e.g. 'sso-admin'), reject before anything else —
          built-in roles are intrinsic constants, not admin-defined stored rows
        type: branch
        condition: the role id is a reserved built-in id
        onTrueStep: 2
        onFalseStep: 3
      - stepNumber: 2
        description: Reject creating over a reserved built-in role
        type: throw
        error: Forbidden — built-in reserved roles are intrinsic and cannot be created or overridden
      - stepNumber: 3
        description: Authenticate the caller credential
        type: call
        targetComponent: authentication
        targetMethod: authenticateCredential
      - stepNumber: 4
        description: Resolve the caller's project:admin permission at instance scope (roles are instance-level)
        type: call
        targetComponent: authorization
        targetMethod: authorize
      - stepNumber: 5
        description: If the effective value is not yes, deny
        type: branch
        condition: the effective project:admin value is not yes
        onTrueStep: 6
        onFalseStep: 7
      - stepNumber: 6
        description: Reject the role management
        type: throw
        error: Forbidden — managing roles requires instance-level project:admin
      - stepNumber: 7
        description: Create the role through the role repository
        type: call
        targetComponent: role_repository
        targetMethod: create
      - stepNumber: 8
        description: Append a redacted audit event without letting a failure fail the write
        type: try
        endStep: 10
        catches:
          - error: audit append failure
            step: 11
      - stepNumber: 9
        description: Append the redacted role.create audit event (security level)
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 10
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 12
      - stepNumber: 11
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 12
        description: Return the stored role
        type: return
        outcome: the stored role
  - name: updateRole
    narrative:
      - stepNumber: 1
        description: If the role id is a reserved built-in id (e.g. 'sso-admin'), reject before anything else
        type: branch
        condition: the role id is a reserved built-in id
        onTrueStep: 2
        onFalseStep: 3
      - stepNumber: 2
        description: Reject modifying a reserved built-in role
        type: throw
        error: Forbidden — built-in reserved roles are intrinsic and cannot be modified
      - stepNumber: 3
        description: Authenticate the caller credential
        type: call
        targetComponent: authentication
        targetMethod: authenticateCredential
      - stepNumber: 4
        description: Resolve the caller's project:admin permission at instance scope
        type: call
        targetComponent: authorization
        targetMethod: authorize
      - stepNumber: 5
        description: If the effective value is not yes, deny
        type: branch
        condition: the effective project:admin value is not yes
        onTrueStep: 6
        onFalseStep: 7
      - stepNumber: 6
        description: Reject the role management
        type: throw
        error: Forbidden — managing roles requires instance-level project:admin
      - stepNumber: 7
        description: Update the role through the role repository
        type: call
        targetComponent: role_repository
        targetMethod: update
      - stepNumber: 8
        description: Append a redacted audit event without letting a failure fail the write
        type: try
        endStep: 10
        catches:
          - error: audit append failure
            step: 11
      - stepNumber: 9
        description: Append the redacted role.update audit event (security level)
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 10
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 12
      - stepNumber: 11
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 12
        description: Return the stored role
        type: return
        outcome: the stored role
  - name: deleteRole
    narrative:
      - stepNumber: 1
        description: If the role id is a reserved built-in id (e.g. 'sso-admin'), reject before anything else
        type: branch
        condition: the role id is a reserved built-in id
        onTrueStep: 2
        onFalseStep: 3
      - stepNumber: 2
        description: Reject deleting a reserved built-in role
        type: throw
        error: Forbidden — built-in reserved roles are intrinsic and cannot be deleted
      - stepNumber: 3
        description: Authenticate the caller credential
        type: call
        targetComponent: authentication
        targetMethod: authenticateCredential
      - stepNumber: 4
        description: Resolve the caller's project:admin permission at instance scope
        type: call
        targetComponent: authorization
        targetMethod: authorize
      - stepNumber: 5
        description: If the effective value is not yes, deny
        type: branch
        condition: the effective project:admin value is not yes
        onTrueStep: 6
        onFalseStep: 7
      - stepNumber: 6
        description: Reject the role management
        type: throw
        error: Forbidden — managing roles requires instance-level project:admin
      - stepNumber: 7
        description: Delete the role through the role repository (bindings to it become inert)
        type: call
        targetComponent: role_repository
        targetMethod: delete
      - stepNumber: 8
        description: Append a redacted audit event without letting a failure fail the delete
        type: try
        endStep: 10
        catches:
          - error: audit append failure
            step: 11
      - stepNumber: 9
        description: Append the redacted role.delete audit event (security level)
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 10
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 12
      - stepNumber: 11
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 12
        description: Return once the role has been deleted
        type: return
        outcome: role deleted
  - name: explain
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: authentication
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: >-
          Resolve the caller's project:admin permission over the target scope (a subsystem's
          resolves at its project)
        type: call
        targetComponent: authorization
        targetMethod: authorize
      - stepNumber: 3
        description: Only an administrator of the scope may ask why someone can or cannot act there
        type: branch
        condition: the effective project:admin value is not yes
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the question
        type: throw
        error: Forbidden — explaining a permission requires project:admin over its scope
      - stepNumber: 5
        label: user
        description: Read the user by record id or subject id
        type: call
        targetComponent: user_repository
        targetMethod: findByRecordOrSubjectId
      - stepNumber: 6
        description: No such user?
        type: branch
        condition: no user matches
        onFalseStep: 8
      - stepNumber: 7
        description: Reject as not found
        type: throw
        error: not found
      - stepNumber: 8
        label: subject
        description: >-
          Build the user's permission subject as authentication resolves it: the subject's userId,
          the record id as an alias when the two diverged, and the record's role bindings (a user
          record is never the instance admin)
        type: local
      - stepNumber: 9
        description: Resolve that subject's effective permission at the scope through the authorization seam
        type: call
        targetComponent: authorization
        targetMethod: explain
      - stepNumber: 10
        description: Return the value, its source and the rung that decided it
        type: return
        outcome: EffectivePermission
    detail: full
