id: user_registry_impl
name: User Registry Implementation
description: >-
  Write path for hosted-user records: mutates the user set, persists it durably to the users file,
  then refreshes the owned store. Never touches the index (the index projects over the store's
  references).
contract: iuser_registry
sourcePath: src/server/users.ts
methods:
  - name: upsert
    narrative: []
    intent: >-
      Merge the supplied record into the current user set by id — inserting when absent, replacing
      field-for-field when present — stamp updatedAt (and createdAt on insert), persist the complete
      set durably via write-temp-then-rename so a crash never truncates the file, then push the new
      set into the store with replaceAll and return the stored record. When persistence fails, no
      in-memory state changes and the storage error propagates to the caller.
    symbol: registryUpsert
  - name: setStatus
    narrative: []
    intent: >-
      Locate the user by id — failing with a not-found error when absent — set its lifecycle status
      (active, suspended, deactivated) while preserving identity, grant, and audit-history fields
      untouched, stamp updatedAt, then persist and swap exactly as upsert does. Invalid status
      values are rejected before any mutation.
    symbol: registrySetStatus
  - name: replaceGrants
    narrative: []
    intent: >-
      Locate the user by id — failing with a not-found error when absent — replace its grants array
      wholesale with the supplied set (no merging; the caller has already computed and authorized
      the final grant state), stamp updatedAt, then persist and swap exactly as upsert does. The
      registry performs no authorization itself.
    symbol: registryReplaceGrants
  - name: remapUnitReferences
    narrative: []
    detail: intent
    intent: >-
      For every user record, rewrite its home unitId and each role binding's scopeId to the new id
      when the old matches a remap entry, and clear its home unitId or a role binding whose scope is
      in removedScopeIds. Rewrite the persisted user collection via write-temp-then-rename and
      refresh the store. Users referencing none of the ids are untouched.
detail: intent
status: complete
