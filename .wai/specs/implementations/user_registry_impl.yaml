id: user_registry_impl
name: User Registry Implementation
description: >-
  Write path for hosted-user records: mutates the user set and persists it durably to the users
  file. Every operation is ONE store update: the set is read fresh under users.json's write lock,
  the change is applied to that set and the replacement is written before the lock is released, so a
  user upserted or deactivated in another process is never lost. Never touches the index.
contract: iuser_registry
sourcePath: src/server/users.ts
injectedParams:
  - dataDir
methods:
  - name: upsert
    narrative: []
    intent: >-
      In one store update: merge the supplied record into the user set read under the lock by id -
      inserting when absent, replacing field-for-field when present - stamp updatedAt (and createdAt
      on insert), and return the stored record. A failure leaves the previous set intact and the
      storage error propagates to the caller.
    calls:
      - user_store.update
    symbol: registryUpsert
  - name: setStatus
    narrative: []
    intent: >-
      In one store update: locate the user by id in the set read under the lock - failing with a
      not-found error when absent - set its lifecycle status (active or inactive) while preserving
      identity, grant, and audit-history fields untouched, and stamp updatedAt. Any other status
      value is rejected before any mutation, naming the two.
    calls:
      - user_store.update
    symbol: registrySetStatus
  - name: remapUnitReferences
    narrative:
      - stepNumber: 1
        description: Nothing moved and nothing was removed
        type: branch
        condition: remap and removedScopeIds are both empty
        onTrueStep: 2
        onFalseStep: 3
      - stepNumber: 2
        description: Return without touching the store
        type: return
        outcome: unchanged
      - stepNumber: 3
        description: >-
          Everything below is the change of the ONE store update: it works on the hosted-user
          records the update hands over (fresh, under the file's write lock)
        type: local
      - stepNumber: 4
        description: Rewrite each record's unit references
        type: loop
        loopKind: forEach
        over: records
        endStep: 6
      - stepNumber: 5
        description: 'Home unit: a moved unitId takes its new id, a unitId inside a removed subtree is cleared'
        type: local
      - stepNumber: 6
        description: >-
          Role bindings: drop the ones scoped to a removed id and retarget the ones scoped to a
          moved id, noting whether anything changed
        type: local
      - stepNumber: 7
        description: An untouched set is not rewritten
        type: branch
        condition: no record changed
        onTrueStep: 8
        onFalseStep: 9
      - stepNumber: 8
        description: Return without writing
        type: return
        outcome: unchanged
      - stepNumber: 9
        description: 'Persist the rewritten set atomically: the store writes the change''s result under the lock'
        type: call
        targetComponent: user_store
        targetMethod: update
    detail: full
    intent: >-
      In one store update: for every user record in the set read under the lock, rewrite its home
      unitId and each role binding's scopeId to the new id when the old matches a remap entry, and
      clear its home unitId or a role binding whose scope is in removedScopeIds. Users referencing
      none of the ids are untouched.
    calls: []
    symbol: registryRemapUnitReferences
detail: intent
status: complete
createdAt: '2026-07-09T17:30:03.044Z'
updatedAt: '2026-10-23T22:20:17.790Z'
