id: tree_codec_impl
name: Tree Codec Implementation
description: >-
  sdk/src/treecodec.ts — pure format + safety logic for the .waitree spec-tree archive.
  selectTreeFiles is the single portability decision; planTreeExtraction the single pre-decompress
  safety chokepoint; assertPortableTreePaths the over-the-wire executable guard;
  sealTreeIntegrity/verifyTreeIntegrity the produce/verify pair. No I/O, no clock.
contract: itree_codec
sourcePath: sdk/src/treecodec.ts
methods:
  - name: parseTreeManifest
    narrative:
      - stepNumber: 1
        description: Parse the envelope YAML text (throw on malformed YAML).
        type: local
      - stepNumber: 2
        description: >-
          Validate the required fields (formatVersion, projectName, roots) are present and
          well-typed; throw on any missing/invalid, and on a roots list that is empty or holds a
          non-string.
        type: local
      - stepNumber: 3
        description: Is the format major newer than this wairon supports?
        type: branch
        condition: manifest.formatVersion major exceeds the supported version
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Fail loudly on a newer format rather than silently mis-read it.
        type: throw
        error: unsupported tree-archive formatVersion (newer than this wairon understands)
      - stepNumber: 5
        description: Return the parsed TreeArchiveManifest.
        type: return
        outcome: success
  - name: serializeTreeManifest
    narrative:
      - stepNumber: 1
        description: Drop undefined optional fields for a clean, canonical envelope.
        type: local
      - stepNumber: 2
        description: Return the wairon-tree.yaml text.
        type: return
        outcome: success
  - name: defaultTreeLimits
    narrative:
      - stepNumber: 1
        description: >-
          Return the tree caps profile: 20000 entries, 64 MiB total inflated, 8 MiB per entry, 100:1
          compression ratio, depth 24 — sized for thousands of small YAML files across several
          chained roots.
        type: return
        outcome: success
  - name: selectTreeFiles
    narrative:
      - stepNumber: 1
        description: Did the caller ask for regenerable artifacts too?
        type: branch
        condition: includeDerived is true
        onTrueStep: 2
        onFalseStep: 3
      - stepNumber: 2
        description: Return the file map unchanged — an explicit full-fidelity archive.
        type: return
        outcome: all files
      - stepNumber: 3
        description: >-
          Drop every file under a regenerable root (generated/, docs/) from the map: a moved tree
          carries the design, not its rendered output, which the destination regenerates from the
          same specs.
        type: local
      - stepNumber: 4
        description: Return the portable design state.
        type: return
        outcome: success
  - name: planTreeExtraction
    narrative:
      - stepNumber: 1
        description: 'Resolve effective caps: each field of `limits` over the tree default profile.'
        type: local
      - stepNumber: 2
        description: Initialize an empty approved-path list and a running total of 0.
        type: local
      - stepNumber: 3
        description: Vet each enumerated entry.
        type: loop
        loopKind: forEach
        over: entries
        endStep: 8
      - stepNumber: 4
        description: >-
          Reject symlinks, unknown non-file kinds, and structurally unsafe paths. (Directory entries
          carry no bytes and are skipped — the tree is recreated from the written file paths.)
        type: branch
        condition: >-
          entry.kind is a symlink or an unknown non-file kind, or path is absolute / contains '..' /
          uses a backslash or drive letter
        onTrueStep: 10
        onFalseStep: 5
      - stepNumber: 5
        description: Normalize the entry path to a destination-relative POSIX path.
        type: local
      - stepNumber: 6
        description: Reject zip-slip and over-deep paths.
        type: branch
        condition: the normalized path escapes the destination (zip-slip) or its depth exceeds maxDepth
        onTrueStep: 10
        onFalseStep: 7
      - stepNumber: 7
        description: Reject oversized entries and zip bombs.
        type: branch
        condition: >-
          uncompressedSize exceeds maxEntryBytes, or uncompressedSize/compressedSize exceeds
          maxCompressionRatio
        onTrueStep: 10
        onFalseStep: 8
      - stepNumber: 8
        label: vetEnd
        description: >-
          Accept: append the normalized path of this regular file to approved; add its
          uncompressedSize to the total.
        type: local
      - stepNumber: 9
        description: Reject archives exceeding the aggregate caps.
        type: branch
        condition: approved length exceeds maxEntries, or total exceeds maxTotalUncompressedBytes
        onTrueStep: 10
        onFalseStep: 11
      - stepNumber: 10
        label: reject
        description: Shared rejection for any failed safety check.
        type: throw
        error: 'reject: unsafe or oversized tree-archive entry (zip-slip / size / ratio / depth guard)'
      - stepNumber: 11
        description: Return the PackExtractionPlan (approved paths + total).
        type: return
        outcome: success
  - name: assertPortableTreePaths
    narrative:
      - stepNumber: 1
        description: Check each planned path.
        type: loop
        loopKind: forEach
        over: paths
        endStep: 4
      - stepNumber: 2
        description: Is this an executable file (a bundled code pack's .js/.cjs/.mjs entry)?
        type: branch
        condition: the path ends in an executable extension
        onTrueStep: 6
        onFalseStep: 3
      - stepNumber: 3
        description: >-
          Does the path sit outside any recognized spec-tree root (no .wai segment, or the envelope
          itself aside, content that is not part of a tree)?
        type: branch
        condition: the path is neither the envelope nor located under a root's .wai directory
        onTrueStep: 7
        onFalseStep: 4
      - stepNumber: 4
        label: checkEnd
        description: This path is portable spec-tree content.
        type: local
      - stepNumber: 5
        description: Every path is portable.
        type: return
        outcome: success
      - stepNumber: 6
        label: rejectExecutable
        description: >-
          Refuse executable content arriving over the wire, with the same guidance the pack surface
          gives.
        type: throw
        error: >-
          refused: the archive carries executable content. Only declarative spec state transfers
          over this surface; rule/code packs are executable and install via the trusted filesystem
          (mount into WAIRON_PACKS_DIR, or run `wairon packs add`).
      - stepNumber: 7
        label: rejectForeign
        description: >-
          Refuse content that is not spec-tree state — a tree archive carries .wai trees, never
          arbitrary project files.
        type: throw
        error: 'refused: the archive carries an entry outside any spec-tree root'
  - name: verifyTreeIntegrity
    narrative:
      - stepNumber: 1
        description: Did the envelope carry no integrity data?
        type: branch
        condition: manifest has no entryDigests
        onTrueStep: 2
        onFalseStep: 3
      - stepNumber: 2
        description: No integrity data present — return false.
        type: return
        outcome: no integrity data
      - stepNumber: 3
        description: >-
          Check each PAYLOAD file's digest (the wairon-tree.yaml envelope is skipped — it carries
          the digests, so it can never digest itself).
        type: loop
        loopKind: forEach
        over: files
        endStep: 5
      - stepNumber: 4
        description: >-
          Does the recomputed sha256 of this payload file differ from the recorded
          entryDigests[file.path]?
        type: branch
        condition: sha256(file.contents) != entryDigests[file.path]
        onTrueStep: 7
        onFalseStep: 5
      - stepNumber: 5
        label: checkEnd
        description: This file's digest matches.
        type: local
      - stepNumber: 6
        description: All digests matched — return true.
        type: return
        outcome: verified
      - stepNumber: 7
        label: mismatch
        description: A digest mismatch means tampering.
        type: throw
        error: tree integrity digest mismatch
  - name: sealTreeIntegrity
    narrative:
      - stepNumber: 1
        description: Initialize an empty entryDigests map.
        type: local
      - stepNumber: 2
        description: >-
          Hash each PAYLOAD file (the wairon-tree.yaml envelope is excluded — it is the digest
          carrier and is re-sealed after).
        type: loop
        loopKind: forEach
        over: files
        endStep: 3
      - stepNumber: 3
        label: hashEnd
        description: >-
          Compute sha256(file.contents) and record it under file.path (skipping the envelope
          itself).
        type: local
      - stepNumber: 4
        description: Compute an overall manifest digest over the sorted entryDigests.
        type: local
      - stepNumber: 5
        description: >-
          Set manifest.entryDigests, manifest.digest, manifest.generatedBy, and manifest.generatedAt
          from the caller-supplied stamps.
        type: local
      - stepNumber: 6
        description: Return the sealed manifest.
        type: return
        outcome: success
  - name: checkTreeCompatibility
    narrative:
      - stepNumber: 1
        description: Is the archive format unsupported?
        type: branch
        condition: manifest.formatVersion is unsupported
        onTrueStep: 4
        onFalseStep: 2
      - stepNumber: 2
        description: Is the running wairon below the archive's minimum?
        type: branch
        condition: minWaironVersion is set and the running wairon is below it
        onTrueStep: 4
        onFalseStep: 3
      - stepNumber: 3
        description: Compatible.
        type: return
        outcome: compatible
      - stepNumber: 4
        label: incompatible
        description: Incompatible.
        type: return
        outcome: incompatible
status: complete
