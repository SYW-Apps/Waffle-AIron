id: surface_index_impl
name: Surface Index Implementation
description: Read-path lookups sharing the store's references.
contract: isurface_index
sourcePath: src/core/surfaces.ts
methods:
  - name: byProject
    narrative: []
    detail: intent
    intent: >-
      Looks the producing project name up in the store's held snapshots (rebuilding the projection
      through the store's file read-through when empty) and returns the reference or null. Shares
      the store's references — never copies, never stale.
    symbol: getSnapshot
  - name: all
    narrative: []
    detail: intent
    intent: >-
      Returns every snapshot reference held at the given project root (the bound root when omitted);
      a malformed snapshot file is skipped, never fatal.
    symbol: listSnapshots
status: complete
