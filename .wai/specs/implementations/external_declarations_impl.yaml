id: external_declarations_impl
name: External Declarations Implementation
description: >-
  The declare, remove and update workflows: read the request, refuse in one sentence, check against
  the producer before anything is written, write, pin — or take a declaration and its pin out
  together, or change its `use` imports and its location field by field. A declaration with no
  source is given the relative path of the family project that answers to its producer id, so every
  external the gate judges is read live by path or pinned. The alias is judged by
  identifier.problemAs alias (so "[a-z0-9-_]+" below is that grammar in full: at most 64 characters,
  no leading "-", never a Windows device name — it names its pin file — super or __proto__), and the
  declared maps are read by own key only.
contract: iexternal_declarations
sourcePath: src/core/external-declarations.ts
methods:
  - name: declare
    narrative:
      - stepNumber: 1
        description: >-
          Read the bound project's configuration through the core, for the aliases its `members` and
          `externals` already hold
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 2
        description: >-
          Read the request: the alias against [a-z0-9-_]+ and against every alias already declared;
          the source through the one location grammar (member_source parsed: `hosted:<id>`, a git
          URL with an optional `#<full commit>`, a leading-`../` sibling or a contained path;
          refused: empty, absolute, an inner `..`, and text that is no location at all — braces,
          quotes, whitespace, the YAML of an object pasted as a string) — a git `#<commit>` becoming
          the declaration's ref, which the pin then follows fixed at that commit; `ref` and `dir`
          only beside a git source; the producer id against the project-id grammar; each `use` entry
          `*` or a public name. Build the normalized declaration in object form, or the one-sentence
          refusal naming the accepted form
        type: local
      - stepNumber: 3
        description: Anything refused?
        type: branch
        condition: the request was refused
        onFalseStep: 5
      - stepNumber: 4
        description: Answer the refusal, writing nothing
        type: return
        outcome: refused
      - stepNumber: 5
        label: candidate
        description: >-
          Bind the normalized declaration to its producer BEFORE writing it, through the core's
          candidate binding — the binding the written declaration will get (a git producer fetched;
          one that cannot be reached is bound with its problem, so declaring still works offline)
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: resolveExternalCandidate
      - stepNumber: 6
        label: sourceless
        description: A request with no source is filled in from the family
        type: branch
        condition: the request names no source
        onFalseStep: 13
      - stepNumber: 7
        description: >-
          Did the candidate binding find the family project that answers to the producer id, as a
          folder on disk?
        type: branch
        condition: >-
          the binding is a family producer whose project is a folder on disk (not a git or hosted
          member read from a cache)
        onFalseStep: 10
      - stepNumber: 8
        description: >-
          Give the normalized declaration its source: the relative path from this project's root to
          that family project's root (forward slashes, a leading `../` when it climbs), so it is
          written and read live as a path dependency, never as a bare name only the family run
          resolves
        type: local
      - stepNumber: 9
        description: Go on to read the producer at that location
        type: jump
        toStep: 13
      - stepNumber: 10
        description: >-
          For the refusal's wording, climb from the bound root to the family's top, one chaining
          parent at a time (best effort: a failure names no ids)
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: resolveChainingParent
      - stepNumber: 11
        description: Read the project graph at that top root, for the ids the family's projects answer to
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: projectFamily
      - stepNumber: 12
        label: no-family
        description: >-
          Answer the refusal, writing nothing: no family project on disk answers to the producer id
          — naming the ids the family's projects answer to, and for a git or hosted member that
          does, its location to give as the source
        type: return
        outcome: refused
      - stepNumber: 13
        label: producer-id
        description: >-
          When the binding has a root, read the producer's configuration with that root bound
          read-only, for the id it answers to (the caller's binding restored afterwards)
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 14
        label: producer-exports
        description: >-
          With the producer's root bound the same way, read its resolved export table: the public
          names it exports at this project's audience, and every public name with the audience it is
          exported to, so a name kept from this project by its audience is told apart from one that
          does not exist
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: resolveProjectExports
      - stepNumber: 15
        description: >-
          Does the producer contradict the declaration — answering to another id than declared (read
          from its configuration, or named by the family's own resolution of the alias), or, once
          read, not exporting a `use` name to this project?
        type: branch
        condition: >-
          the producer answers to another id than the declared one, or it was read and a `use` name
          is not in its export table at this project's audience
        onFalseStep: 17
      - stepNumber: 16
        description: >-
          Answer the refusal naming what the producer contradicted, writing nothing: the id it
          answers to (declare `project:` or use that alias); each unexported `use` name with the
          closest names it does export; or, for a name exported only to a narrower audience, that
          audience, the one this project is read at (a family project at project, a path, git or
          hosted consumer at instance) and the ranking project < department < instance < partner <
          external
        type: return
        outcome: refused by the producer
      - stepNumber: 17
        label: dry
        description: A dry run stops here, the producer already checked
        type: branch
        condition: request.dryRun
        onFalseStep: 19
      - stepNumber: 18
        description: >-
          Answer what would be written (written false, the normalized declaration, the id the
          producer answers to) and, when the producer could not be read, why — nothing is written
        type: return
        outcome: dry run
      - stepNumber: 19
        label: write
        description: >-
          Write the normalized declaration into `.wai/project.yaml` through the core's configuration
          portal
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: declareExternal
      - stepNumber: 20
        label: kept
        description: >-
          Pin it now when asked (the default) and the producer was read; an unreadable producer
          leaves it declared and unpinned, with the reason carried as `unreachable`
        type: branch
        condition: request.pin is not false and the producer was read
        onFalseStep: 22
      - stepNumber: 21
        description: >-
          Pin the new alias — its snapshot and lock entry — so its uses are judged against a
          reproducible pin from the first validate
        type: call
        targetComponent: surface_orchestrator
        targetMethod: pinExternals
      - stepNumber: 22
        label: answer
        description: >-
          Answer the addition: written, the declaration, the producer id it answers to, the pin when
          taken, and `unreachable` with the reason when the producer could not be read
        type: return
        outcome: declared
  - name: remove
    narrative:
      - stepNumber: 1
        description: Read the bound project's configuration through the core, for the externals it declares
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 2
        description: >-
          List the bound project's externals — the declared ones with their lock entries, and every
          orphaned pin (a lock entry whose alias is no longer declared) — for whether the alias
          holds a pin
        type: call
        targetComponent: surface_orchestrator
        targetMethod: listExternals
      - stepNumber: 3
        description: Neither declared nor pinned?
        type: branch
        condition: the alias is neither a declared external nor a pinned one
        onFalseStep: 5
      - stepNumber: 4
        description: Answer the refusal naming the externals that are declared or pinned, writing nothing
        type: return
        outcome: refused
      - stepNumber: 5
        label: dry
        description: >-
          A dry run answers what would be removed — the declaration when declared, the pin when
          pinned
        type: branch
        condition: dryRun
        onFalseStep: 7
      - stepNumber: 6
        description: >-
          Answer the dry run, writing nothing, and say it is one: `dryRun` true, `removed` and
          `unpinned` false (this call removed nothing), and `wouldRemove` naming what the real run
          then takes out — the declaration when declared, the pin when pinned — so the answer alone
          tells a dry run from an apply
        type: return
        outcome: dry run
      - stepNumber: 7
        label: declaration
        description: >-
          Take the declaration out of `.wai/project.yaml` through the core's configuration portal,
          when it is declared
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: removeExternal
      - stepNumber: 8
        description: >-
          Remove the alias's pin — its lock entry and its pinned snapshot — so nothing orphaned is
          left
        type: call
        targetComponent: surface_orchestrator
        targetMethod: unpin
      - stepNumber: 9
        description: 'Answer the removal: whether the declaration and the pin went'
        type: return
        outcome: removed
  - name: update
    narrative:
      - stepNumber: 1
        description: >-
          Read the bound project's configuration through the core, for the external's declaration
          and its current `use`
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 2
        description: >-
          Read the request: the alias must be a declared external; every added and removed entry `*`
          or a public name ([a-z0-9-_]+); a new location through the one location grammar, refused
          as declare refuses it. Compute the resulting list: the current names in order, minus the
          removed, plus each added name not already there (`*` covers every name); and the resulting
          declaration: the current one with the new location in place of the old, every other field
          kept
        type: local
      - stepNumber: 3
        description: Anything refused?
        type: branch
        condition: the request was refused
        onFalseStep: 5
      - stepNumber: 4
        description: Answer the refusal in one sentence, writing nothing
        type: return
        outcome: refused
      - stepNumber: 5
        label: binding
        description: >-
          When names are added, resolve the declared externals to read this alias's binding — its
          producer and where it is — offline, no producer fetched over the network
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: resolveExternals
      - stepNumber: 6
        label: producer-exports
        description: >-
          When the binding has a root, read the producer's resolved export table with that root
          bound read-only, for the public names it exports at this project's audience (and the
          audience of every other)
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: resolveProjectExports
      - stepNumber: 7
        description: An added name the producer does not export to this project?
        type: branch
        condition: the producer was read and an added name is not exported to this project
        onFalseStep: 9
      - stepNumber: 8
        description: >-
          Answer the refusal naming the closest exported names, or the narrower audience the name is
          exported to, writing nothing
        type: return
        outcome: refused by the producer
      - stepNumber: 9
        label: location
        description: A new location is checked against the producer it reaches before anything is written
        type: branch
        condition: the request gives a location other than the declared one
        onFalseStep: 14
      - stepNumber: 10
        description: >-
          Bind the resulting declaration to its producer through the core's candidate binding, as
          declare does
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: resolveExternalCandidate
      - stepNumber: 11
        description: >-
          When the binding has a root, read the producer's configuration with that root bound
          read-only, for the id it answers to
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 12
        description: Does the producer at the new location answer to another id than the declared one?
        type: branch
        condition: the producer was read and answers to another id
        onFalseStep: 14
      - stepNumber: 13
        description: Answer the refusal naming the id the producer at that location answers to, writing nothing
        type: return
        outcome: refused by the producer
      - stepNumber: 14
        label: dry
        description: >-
          A dry run, or a change that changes nothing (the same `use` and the same location), writes
          nothing
        type: branch
        condition: dryRun, or the resulting list equals the current one and no new location is given
        onFalseStep: 16
      - stepNumber: 15
        description: Answer the resulting list and declaration, written false
        type: return
        outcome: unchanged or dry run
      - stepNumber: 16
        label: drop
        description: >-
          Names removed, or a new location? The configuration portal only appends imports, so either
          restates the declaration: take it out and write it back as the resulting declaration —
          restoring the original one if the restatement is refused
        type: branch
        condition: the change removes a name or gives a new location
        onFalseStep: 19
      - stepNumber: 17
        description: Take the declaration out
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: removeExternal
      - stepNumber: 18
        description: >-
          Write it back as the resulting declaration: the resulting `use` and location, every other
          field kept as written
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: declareExternal
      - stepNumber: 19
        label: append
        description: >-
          Import the added names (append-only and idempotent; after a restatement nothing is left to
          add)
        type: call
        targetComponent: surfaces_core_adapter
        targetMethod: importNames
      - stepNumber: 20
        label: repin
        description: Did the location change? The pin follows the location
        type: branch
        condition: the change gave a new location
        onFalseStep: 22
      - stepNumber: 21
        description: >-
          Pin the alias again at its new location: a path producer's earlier pin and snapshot are
          dropped, since it is read live; a git or hosted producer is pinned anew
        type: call
        targetComponent: surface_orchestrator
        targetMethod: pinExternals
      - stepNumber: 22
        label: answer
        description: >-
          Answer the change: written, the resulting list, what was added and removed, and the
          location and what happened to the pin when the location changed
        type: return
        outcome: changed
status: complete
createdAt: '2026-10-06T10:14:16.933Z'
updatedAt: '2026-11-28T00:22:06.726Z'
