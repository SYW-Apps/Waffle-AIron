id: project_relation_store_impl
name: Project Relation Store Implementation
description: >-
  Read-through file I/O over the cross-project relation set at relations.json under the server data
  root: load parses the file fresh; update holds the file's write lock across a fresh read and the
  replacement.
contract: iproject_relation_store
sourcePath: src/server/relations.ts
methods:
  - name: load
    narrative: []
    intent: >-
      Read relations.json fresh (no in-memory copy), returning the set. A missing file yields an
      empty set; an unreadable file or structurally invalid JSON fails with a storage error naming
      the path, so a lost relation never silently drops a declared cross-project dependency.
  - name: update
    narrative: []
    intent: >-
      Under relations.json's write lock (file_write_lock.run), read the set fresh - absent is empty,
      a file that exists but cannot be read or parsed throws and nothing is written - apply the
      change, replace the file atomically via write-temp-then-rename and release the lock, also when
      the change throws. Answers the set written.
    calls:
      - file_write_lock.run
      - files_adapter.ensureDir
detail: intent
status: complete
