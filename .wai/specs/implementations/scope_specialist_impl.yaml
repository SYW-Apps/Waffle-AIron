id: scope_specialist_impl
name: Scope Specialist Implementation
description: >-
  Pure authorization-scope resolution: expand a principal's grants over the organization-unit
  subtree and project placements into the in-scope project and unit sets for a required permission,
  or signal instance-wide super-admin. No I/O; the recursive descendant-unit walk is a private
  helper. permits is the point check for write actions.
contract: iscope_specialist
sourcePath: src/server/scope.ts
methods:
  - name: resolveScope
    narrative:
      - stepNumber: 1
        description: >-
          Initialize the ScopeResolution accumulator: all=false, an empty deduplicated set of
          in-scope project ids, and an empty deduplicated set of in-scope unit ids. Treat a grant as
          carrying the required permission when its permissions include the exact permission string
          or the '*' permission wildcard.
        type: local
      - stepNumber: 2
        description: First pass — scan every grant for an instance-wide super-admin grant.
        type: loop
        loopKind: forEach
        over: the grants
        endStep: 3
      - stepNumber: 3
        description: >-
          If this grant's projectId is '*' and it carries the required permission, set the
          accumulator's all flag to true (an instance-wide super-admin grant covers everything).
        type: local
      - stepNumber: 4
        description: >-
          If an instance-wide super-admin grant was found, short-circuit — no per-unit/project
          filtering is needed.
        type: branch
        condition: the accumulator's all flag is true
        onTrueStep: 5
        onFalseStep: 6
      - stepNumber: 5
        description: >-
          Return the super-admin scope: all=true with empty projectIds and unitIds (which callers
          must ignore when all=true).
        type: return
        outcome: super-admin scope (all=true, no filtering)
      - stepNumber: 6
        description: >-
          Second pass — accumulate unit- and project-scoped authority from every grant that carries
          the required permission (reached only when no super-admin grant was found).
        type: loop
        loopKind: forEach
        over: the grants
        endStep: 7
      - stepNumber: 7
        description: >-
          For this grant, when it carries the required permission: if it has an orgUnitId, compute
          the recursive descendant subtree of that unit by walking the units via parentId (the unit
          plus all its transitive descendants — implemented as a private recursive helper over the
          units list), add every unit id in that subtree to the in-scope unit set, and add the
          projectId of every placement whose unitId falls in that subtree to the in-scope project
          set; otherwise, if it names a specific projectId (not '*'), add that projectId directly to
          the in-scope project set. A grant that does not carry the required permission, or whose
          only scope is an instance-wide '*' that failed the super-admin check, contributes nothing.
          Duplicates are absorbed by the sets.
        type: local
      - stepNumber: 8
        description: >-
          Return the resolved scope with all=false and the accumulated in-scope project ids and unit
          ids.
        type: return
        outcome: scoped resolution (all=false)
  - name: permits
    narrative:
      - stepNumber: 1
        description: >-
          Compute whether the resolved scope permits the target project: permitted when scope.all is
          true, otherwise permitted only when scope.projectIds contains the given projectId.
        type: local
      - stepNumber: 2
        description: Return the boolean point-check result.
        type: return
        outcome: true when scope.all or scope.projectIds includes projectId, else false
detail: full
