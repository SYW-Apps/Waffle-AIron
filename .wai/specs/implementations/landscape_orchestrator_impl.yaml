id: landscape_orchestrator_impl
name: Landscape Orchestrator Implementation
description: >-
  Hosted-instance landscape ADMINISTRATION workflows: organization-unit administration, project
  placement, public-surface snapshot refresh, cross-project relation management (visibility-gated
  once organization units exist), and landscape graph generation. Authorization resolves through the
  permission resolver — project:admin over the relevant unit/project for writes, project:read
  visible scopes for reads (actionable scopes plus their ancestor breadcrumb) — never stored grants.
  Cross-project reads never touch target private specs. Audit appends are best-effort.
  Consumer-facing discovery/exchange workflows live on the surface exchange orchestrator.
contract: ilandscape_orchestrator
sourcePath: src/server/landscape.ts
methods:
  - name: generateLandscape
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Gather all organization units (also used to resolve the caller's landscape-read scope)
        type: call
        targetComponent: organization_repository
        targetMethod: listUnits
      - stepNumber: 3
        description: Gather all project placements (also used to resolve scope)
        type: call
        targetComponent: organization_repository
        targetMethod: listPlacements
      - stepNumber: 4
        description: >-
          Compute the caller's project:read visible scopes over the organization tree (also gating
          the landscape read)
        type: call
        targetComponent: authorization_specialist
        targetMethod: visibleScopes
      - stepNumber: 5
        description: If the caller has no actionable project/unit scope, deny
        type: branch
        condition: the caller has no actionable scope in the visible set
        onTrueStep: 6
        onFalseStep: 7
      - stepNumber: 6
        description: Reject the landscape generation
        type: throw
        error: Forbidden — generating the landscape requires landscape:read scope
      - stepNumber: 7
        description: Gather all hosted project records
        type: call
        targetComponent: project_registry
        targetMethod: list
      - stepNumber: 8
        description: Gather all cross-project relations
        type: call
        targetComponent: project_relation_repository
        targetMethod: list
      - stepNumber: 9
        description: >-
          Narrow the gathered projects, placements, and relations to the caller's actionable
          projects/units in the visible set, AND keep the ancestor-breadcrumb (context) units so the
          hierarchy stays navigable up to the root — context units are marked non-actionable
          (read-only navigation, their non-visible children are never included); an instance-admin
          keeps everything as actionable (instance-wide landscape)
        type: local
      - stepNumber: 10
        description: Initialize an empty public-surface snapshot collection
        type: local
      - stepNumber: 11
        description: For each in-scope hosted project
        type: loop
        loopKind: forEach
        over: the in-scope hosted projects
        endStep: 12
      - stepNumber: 12
        description: >-
          Fetch the project's public-surface snapshot and, when present, add it to the snapshot
          collection
        type: call
        targetComponent: public_surface_repository
        targetMethod: getSnapshot
      - stepNumber: 13
        description: >-
          Project the in-scope units, projects, placements, snapshots, and relations into a
          LandscapeGraphModel
        type: call
        targetComponent: landscape_diagram_specialist
        targetMethod: buildGraph
      - stepNumber: 14
        description: Return the landscape graph model scoped to the caller
        type: return
        outcome: the landscape graph model
  - name: placeProject
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Resolve the caller's project:admin permission over the target unit (placement.unitId)
        type: call
        targetComponent: authorization_specialist
        targetMethod: authorize
      - stepNumber: 3
        description: If the effective project:admin value is not yes, deny
        type: branch
        condition: the effective project:admin value is not yes
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the project placement
        type: throw
        error: Forbidden — placing a project requires project:admin over the target unit
      - stepNumber: 5
        description: Load the target organization unit for the placement (placement.unitId)
        type: call
        targetComponent: organization_repository
        targetMethod: getUnit
      - stepNumber: 6
        description: If the target organization unit does not exist, reject
        type: branch
        condition: the target organization unit does not exist
        onTrueStep: 7
        onFalseStep: 8
      - stepNumber: 7
        description: Reject the placement into a missing unit
        type: throw
        error: the target organization unit does not exist
      - stepNumber: 8
        description: Place the hosted project in the organization unit
        type: call
        targetComponent: organization_repository
        targetMethod: placeProject
      - stepNumber: 9
        description: Append a redacted audit event without letting a failure fail the placement
        type: try
        endStep: 11
        catches:
          - error: audit append failure
            step: 12
      - stepNumber: 10
        description: Append the redacted project.place audit event (info level)
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 11
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 13
      - stepNumber: 12
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 13
        description: Return the stored project placement
        type: return
        outcome: the stored project placement
    detail: full
  - name: refreshPublicSurface
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Resolve the caller's project:admin permission over the target project
        type: call
        targetComponent: authorization_specialist
        targetMethod: authorize
      - stepNumber: 3
        description: If the effective project:admin value is not yes, deny
        type: branch
        condition: the effective project:admin value is not yes
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the public-surface refresh
        type: throw
        error: Forbidden — refreshing a project's public surface requires project:admin over the project
      - stepNumber: 5
        description: Resolve and bind the target project's isolated root within the principal's authorized set
        type: call
        targetComponent: project_registry
        targetMethod: resolveRoot
      - stepNumber: 6
        description: Bind the resolved target project root for host-core reads
        type: local
      - stepNumber: 7
        description: Capture the target project's current spec-tree StateId for the snapshot
        type: call
        targetComponent: host_core_adapter
        targetMethod: computeStateId
      - stepNumber: 8
        description: Read the target project's L0 system spec at the bound root
        type: call
        targetComponent: host_core_adapter
        targetMethod: loadSystemSpec
      - stepNumber: 9
        description: Read the target project's L1 subsystem specs at the bound root
        type: call
        targetComponent: host_core_adapter
        targetMethod: loadSubsystemSpecs
      - stepNumber: 10
        description: >-
          Leniently read the L0 publicInterfaces, resolve each against its subsystem public
          interface, and assemble the redacted ProjectPublicSurfaceSnapshot (never private
          components/narratives/roots/secrets)
        type: local
      - stepNumber: 11
        description: Replace the target project's redacted public-surface snapshot in the repository
        type: call
        targetComponent: public_surface_repository
        targetMethod: replaceSnapshot
      - stepNumber: 12
        description: Append a redacted audit event without letting a failure fail the refresh
        type: try
        endStep: 14
        catches:
          - error: audit append failure
            step: 15
      - stepNumber: 13
        description: Append the redacted surface.refresh audit event (info level)
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 14
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 16
      - stepNumber: 15
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 16
        description: Return the stored public-surface snapshot
        type: return
        outcome: the stored public-surface snapshot
    detail: full
  - name: upsertRelation
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: >-
          Resolve the caller's project:admin permission over the relation's source project
          (relation.sourceProjectId)
        type: call
        targetComponent: authorization_specialist
        targetMethod: authorize
      - stepNumber: 3
        description: If the effective project:admin value is not yes, deny
        type: branch
        condition: the effective project:admin value is not yes
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the relation management
        type: throw
        error: >-
          Forbidden — managing a cross-project relation requires project:admin over its source
          project
      - stepNumber: 5
        description: Gather all organization units for the source's surface-visibility view
        type: call
        targetComponent: organization_repository
        targetMethod: listUnits
      - stepNumber: 6
        description: Gather all project placements
        type: call
        targetComponent: organization_repository
        targetMethod: listPlacements
      - stepNumber: 7
        description: >-
          Resolve the SOURCE project's surface-visibility view over the unit graph (postures,
          exposeTo grants)
        type: call
        targetComponent: visibility_specialist
        targetMethod: resolveVisibility
      - stepNumber: 8
        description: >-
          Point-check whether the target project (relation.targetPublicInterface.projectId) is
          visible to the source
        type: call
        targetComponent: visibility_specialist
        targetMethod: isVisible
      - stepNumber: 9
        description: If the target project's surface is not visible to the source, deny
        type: branch
        condition: the target project is not visible to the source (isVisible is false)
        onTrueStep: 10
        onFalseStep: 11
      - stepNumber: 10
        description: Reject the relation against an invisible target
        type: throw
        error: >-
          Forbidden — the target project's surface is not exposed to the source project's
          organization units
      - stepNumber: 11
        description: Load the target project's public-surface snapshot
        type: call
        targetComponent: public_surface_repository
        targetMethod: getSnapshot
      - stepNumber: 12
        description: If the target project has no stored public-surface snapshot, reject with guidance
        type: branch
        condition: the target project has no stored public-surface snapshot
        onTrueStep: 13
        onFalseStep: 14
      - stepNumber: 13
        description: Reject the relation against a target with no snapshot
        type: throw
        error: >-
          the target project has no public-surface snapshot — run refreshPublicSurface for it before
          creating a relation
      - stepNumber: 14
        description: Resolve the referenced system public interface within the snapshot
        type: call
        targetComponent: public_surface_repository
        targetMethod: findInterface
      - stepNumber: 15
        description: If the referenced system public interface is absent from the target's snapshot, reject
        type: branch
        condition: the referenced system public interface is absent from the target's snapshot
        onTrueStep: 16
        onFalseStep: 17
      - stepNumber: 16
        description: Reject the relation against an unknown interface ref
        type: throw
        error: >-
          unknown target public interface — a relation must target a system public interface present
          in the target's public-surface snapshot
      - stepNumber: 17
        description: Create or update the validated cross-project relation
        type: call
        targetComponent: project_relation_repository
        targetMethod: upsert
      - stepNumber: 18
        description: Append a redacted audit event without letting a failure fail the relation write
        type: try
        endStep: 20
        catches:
          - error: audit append failure
            step: 21
      - stepNumber: 19
        description: Append the redacted relation.upsert audit event (info level)
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 20
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 22
      - stepNumber: 21
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 22
        description: Return the stored cross-project relation
        type: return
        outcome: the stored cross-project relation
    detail: full
  - name: removeRelation
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: List cross-project relations to resolve the relation being removed by its id
        type: call
        targetComponent: project_relation_repository
        targetMethod: list
      - stepNumber: 3
        description: >-
          Find the relation whose id matches; its sourceProjectId is the authorization target (a
          missing relation fails closed)
        type: local
      - stepNumber: 4
        description: Resolve the caller's project:admin permission over the relation's source project
        type: call
        targetComponent: authorization_specialist
        targetMethod: authorize
      - stepNumber: 5
        description: If the effective project:admin value is not yes, deny
        type: branch
        condition: the effective project:admin value is not yes
        onTrueStep: 6
        onFalseStep: 7
      - stepNumber: 6
        description: Reject the relation removal
        type: throw
        error: >-
          Forbidden — removing a cross-project relation requires project:admin over its source
          project
      - stepNumber: 7
        description: Remove the cross-project relation by id
        type: call
        targetComponent: project_relation_repository
        targetMethod: remove
      - stepNumber: 8
        description: Append a redacted audit event without letting a failure fail the removal
        type: try
        endStep: 10
        catches:
          - error: audit append failure
            step: 11
      - stepNumber: 9
        description: Append the redacted relation.remove audit event (info level)
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 10
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 12
      - stepNumber: 11
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 12
        description: Return once the relation has been removed
        type: return
        outcome: the relation is removed
    detail: full
  - name: listRelations
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Compute the caller's project:read visible scopes over the organization tree
        type: call
        targetComponent: authorization_specialist
        targetMethod: visibleScopes
      - stepNumber: 3
        description: If the caller has no actionable project scope, deny
        type: branch
        condition: the caller has no actionable project scope in the visible set
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the relation listing
        type: throw
        error: Forbidden — listing cross-project relations requires project:read scope
      - stepNumber: 5
        description: List cross-project relations, optionally narrowed to the given project as source
        type: call
        targetComponent: project_relation_repository
        targetMethod: list
      - stepNumber: 6
        description: >-
          Filter the relations to those whose source or target project is an actionable project in
          the visible set (an instance-admin keeps every relation)
        type: local
      - stepNumber: 7
        description: Return the cross-project relations scoped to the caller
        type: return
        outcome: the cross-project relations
    detail: full
  - name: upsertUnit
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Gather all organization units (to distinguish an update from a create)
        type: call
        targetComponent: organization_repository
        targetMethod: listUnits
      - stepNumber: 3
        description: >-
          Resolve the caller's project:admin permission over the target unit (its own id when
          updating, its parent unit when creating a child; an instance-admin may create top-level
          units)
        type: call
        targetComponent: authorization_specialist
        targetMethod: authorize
      - stepNumber: 4
        description: If the effective project:admin value is not yes, deny
        type: branch
        condition: the effective project:admin value is not yes
        onTrueStep: 5
        onFalseStep: 6
      - stepNumber: 5
        description: Reject the organization-unit administration
        type: throw
        error: >-
          Forbidden — managing an organization unit requires project:admin over the unit or its
          parent
      - stepNumber: 6
        description: >-
          If the record matches an existing unit among the gathered units, update its metadata;
          otherwise create a new unit
        type: branch
        condition: the record matches an existing unit among the gathered units
        onFalseStep: 9
      - stepNumber: 7
        description: Update the existing unit's metadata through the organization repository
        type: call
        targetComponent: organization_repository
        targetMethod: updateUnit
        assertsGuarantees:
          - atomic
      - stepNumber: 8
        description: Metadata updated — skip the create step
        type: jump
        toStep: 10
      - stepNumber: 9
        description: >-
          Create a new organization unit through the organization repository (qualified-id
          computation and collision rejection happen there)
        type: call
        targetComponent: organization_repository
        targetMethod: createUnit
        assertsGuarantees:
          - atomic
      - stepNumber: 10
        description: Append a redacted audit event without letting a failure fail the write
        type: try
        endStep: 12
        catches:
          - error: audit append failure
            step: 13
      - stepNumber: 11
        description: Append the redacted unit.upsert audit event (info level)
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 12
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 14
      - stepNumber: 13
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 14
        description: Return the stored organization unit
        type: return
        outcome: the stored organization unit
    detail: full
status: complete
