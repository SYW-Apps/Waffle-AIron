id: landscape_orchestrator_impl
name: Landscape Orchestrator Implementation
description: >-
  Hosted-instance landscape workflows: organization-unit administration, project placement,
  public-surface snapshot refresh, cross-project relation management, landscape graph generation,
  and the two data-plane MCP discovery workflows. Every method authenticates the credential through
  the single auth authority (auth_specialist) and authorizes by Principal grants — landscape:manage
  or instance-admin for writes, landscape:read (or landscape:manage/instance-admin) for the
  control-plane reads. Reachability for discovery is directional and relations-only: a target is
  reachable from the current project only through an ACTIVE relation whose sourceProjectId is the
  current project — placements confer none and there is no transitive closure. Cross-project reads
  never touch target private specs; they read only the stored redacted public-surface snapshots.
  Audit appends (unit.upsert, project.place, relation.upsert, surface.refresh — all info) are
  best-effort and never fail the primary action; control-plane reads and MCP discovery are not
  audited (the data-plane mcp.tool.call append covers discovery).
contract: ilandscape_orchestrator
sourcePath: src/server/landscape.ts
methods:
  - name: upsertUnit
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: If the caller holds neither a landscape:manage grant nor an instance-admin grant, deny
        type: branch
        condition: the caller holds neither a landscape:manage grant nor an instance-admin grant
        onFalseStep: 4
      - stepNumber: 3
        description: Reject the organization-unit administration
        type: throw
        error: >-
          Forbidden — managing organization units requires a landscape:manage grant or an
          instance-admin grant
      - stepNumber: 4
        description: >-
          Create or update the organization unit (the registry stamps id/timestamps, validates
          parentId existence, and rejects cycles)
        type: call
        targetComponent: organization_repository
        targetMethod: upsertUnit
      - stepNumber: 5
        description: Append a redacted audit event without letting a failure fail the upsert
        type: try
        endStep: 7
        catches:
          - error: audit append failure
            step: 8
      - stepNumber: 6
        description: Append the redacted unit.upsert audit event (info level) under the active retention policy
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 7
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 9
      - stepNumber: 8
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 9
        description: Return the stored organization unit
        type: return
        outcome: the stored organization unit
  - name: refreshPublicSurface
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: If the caller holds neither a landscape:manage grant nor an instance-admin grant, deny
        type: branch
        condition: the caller holds neither a landscape:manage grant nor an instance-admin grant
        onFalseStep: 4
      - stepNumber: 3
        description: Reject the public-surface refresh
        type: throw
        error: >-
          Forbidden — refreshing a project's public surface requires a landscape:manage grant or an
          instance-admin grant
      - stepNumber: 4
        description: >-
          Resolve and bind the target project's isolated root within the principal's authorized set
          (rejects cross-project access)
        type: call
        targetComponent: project_registry
        targetMethod: resolveRoot
      - stepNumber: 5
        description: Bind the resolved target project root for host-core reads
        type: local
      - stepNumber: 6
        description: Capture the target project's current spec-tree StateId for the snapshot
        type: call
        targetComponent: host_core_adapter
        targetMethod: computeStateId
      - stepNumber: 7
        description: Read the target project's L0 system spec at the bound root
        type: call
        targetComponent: host_core_adapter
        targetMethod: loadSystemSpec
      - stepNumber: 8
        description: Read the target project's L1 subsystem specs at the bound root
        type: call
        targetComponent: host_core_adapter
        targetMethod: loadSubsystemSpecs
      - stepNumber: 9
        description: >-
          Leniently read the L0 publicInterfaces (tolerating the optional/absent field), resolve
          each against its referenced subsystem public interface, and build redacted
          PublicInterfaceSummary entries — public method/endpoint metadata and public DTO names
          only, never private components, narratives, implementations, root paths, secrets, or
          non-public types; assemble the ProjectPublicSurfaceSnapshot (projectId, the captured
          stateId, systemName, redacted interfaces, exportedBy from the caller's subject). A project
          with no L0 public surfaces yields an empty interfaces list — private by default.
        type: local
      - stepNumber: 10
        description: Replace the target project's redacted public-surface snapshot in the repository
        type: call
        targetComponent: public_surface_repository
        targetMethod: replaceSnapshot
      - stepNumber: 11
        description: Append a redacted audit event without letting a failure fail the refresh
        type: try
        endStep: 13
        catches:
          - error: audit append failure
            step: 14
      - stepNumber: 12
        description: >-
          Append the redacted surface.refresh audit event (info level) under the active retention
          policy
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 13
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 15
      - stepNumber: 14
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 15
        description: Return the stored public-surface snapshot
        type: return
        outcome: the stored public-surface snapshot
  - name: upsertRelation
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: If the caller holds neither a landscape:manage grant nor an instance-admin grant, deny
        type: branch
        condition: the caller holds neither a landscape:manage grant nor an instance-admin grant
        onFalseStep: 4
      - stepNumber: 3
        description: Reject the relation management
        type: throw
        error: >-
          Forbidden — managing cross-project relations requires a landscape:manage grant or an
          instance-admin grant
      - stepNumber: 4
        description: >-
          Load the target project's public-surface snapshot
          (relation.targetPublicInterface.projectId)
        type: call
        targetComponent: public_surface_repository
        targetMethod: getSnapshot
      - stepNumber: 5
        description: If the target project has no stored public-surface snapshot, reject with guidance
        type: branch
        condition: the target project has no stored public-surface snapshot
        onFalseStep: 7
      - stepNumber: 6
        description: Reject the relation against a target with no snapshot
        type: throw
        error: >-
          the target project has no public-surface snapshot — run refreshPublicSurface for it before
          creating a relation
      - stepNumber: 7
        description: >-
          Resolve the referenced system public interface (targetPublicInterface.projectId,
          targetPublicInterface.systemInterfaceId) within the snapshot
        type: call
        targetComponent: public_surface_repository
        targetMethod: findInterface
      - stepNumber: 8
        description: If the referenced system public interface is absent from the target's snapshot, reject
        type: branch
        condition: the referenced system public interface is absent from the target's snapshot
        onFalseStep: 10
      - stepNumber: 9
        description: Reject the relation against an unknown interface ref
        type: throw
        error: >-
          unknown target public interface — a relation must target a system public interface present
          in the target project's public-surface snapshot
      - stepNumber: 10
        description: Create or update the validated cross-project relation
        type: call
        targetComponent: project_relation_repository
        targetMethod: upsert
      - stepNumber: 11
        description: Append a redacted audit event without letting a failure fail the relation write
        type: try
        endStep: 13
        catches:
          - error: audit append failure
            step: 14
      - stepNumber: 12
        description: >-
          Append the redacted relation.upsert audit event (info level) under the active retention
          policy
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 13
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 15
      - stepNumber: 14
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 15
        description: Return the stored cross-project relation
        type: return
        outcome: the stored cross-project relation
  - name: listRelations
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: >-
          If the caller holds none of a landscape:read, landscape:manage, or instance-admin grant,
          deny
        type: branch
        condition: the caller holds none of a landscape:read, landscape:manage, or instance-admin grant
        onFalseStep: 4
      - stepNumber: 3
        description: Reject the relation listing
        type: throw
        error: >-
          Forbidden — listing cross-project relations requires a landscape:read, landscape:manage,
          or instance-admin grant
      - stepNumber: 4
        description: List cross-project relations, optionally narrowed to the given project as source
        type: call
        targetComponent: project_relation_repository
        targetMethod: list
      - stepNumber: 5
        description: Return the cross-project relations
        type: return
        outcome: the cross-project relations
  - name: generateLandscape
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: >-
          If the caller holds none of a landscape:read, landscape:manage, or instance-admin grant,
          deny
        type: branch
        condition: the caller holds none of a landscape:read, landscape:manage, or instance-admin grant
        onFalseStep: 4
      - stepNumber: 3
        description: Reject the landscape generation
        type: throw
        error: >-
          Forbidden — generating the landscape requires a landscape:read, landscape:manage, or
          instance-admin grant
      - stepNumber: 4
        description: Gather all organization units
        type: call
        targetComponent: organization_repository
        targetMethod: listUnits
      - stepNumber: 5
        description: Gather all project placements
        type: call
        targetComponent: organization_repository
        targetMethod: listPlacements
      - stepNumber: 6
        description: Gather all hosted project records
        type: call
        targetComponent: project_registry
        targetMethod: list
      - stepNumber: 7
        description: Gather all cross-project relations
        type: call
        targetComponent: project_relation_repository
        targetMethod: list
      - stepNumber: 8
        description: Initialize an empty public-surface snapshot collection
        type: local
      - stepNumber: 9
        description: For each gathered hosted project
        type: loop
        loopKind: forEach
        over: the gathered hosted projects
        endStep: 10
      - stepNumber: 10
        description: >-
          Fetch the project's public-surface snapshot and, when present, add it to the snapshot
          collection
        type: call
        targetComponent: public_surface_repository
        targetMethod: getSnapshot
      - stepNumber: 11
        description: >-
          Project the gathered units, projects, placements, snapshots, and relations into a
          LandscapeGraphModel
        type: call
        targetComponent: landscape_diagram_specialist
        targetMethod: buildGraph
      - stepNumber: 12
        description: Return the landscape graph model
        type: return
        outcome: the landscape graph model
  - name: listReachableProjectsForMcp
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential through the single auth authority
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: >-
          List the ACTIVE cross-project relations whose sourceProjectId is currentProjectId (source
          = currentProjectId, status 'active')
        type: call
        targetComponent: project_relation_repository
        targetMethod: list
      - stepNumber: 3
        description: >-
          Group the active relations by targetProjectId and map each group to a ReachableProjectRef
          carrying the target project id, the relation ids, the relation kinds, and the target
          public interface ids (targetPublicInterface.systemInterfaceId) that make it reachable.
          Reachability is directional and relations-only — organization placements confer none and
          there is no transitive closure.
        type: local
      - stepNumber: 4
        description: Return the reachable project references
        type: return
        outcome: the reachable project references
  - name: listReachableProjectInterfacesForMcp
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential through the single auth authority
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: >-
          List the ACTIVE cross-project relations whose sourceProjectId is currentProjectId (source
          = currentProjectId, status 'active')
        type: call
        targetComponent: project_relation_repository
        targetMethod: list
      - stepNumber: 3
        description: >-
          If no active relation from the current project targets targetProjectId (the target is
          outside the reachable set), deny
        type: branch
        condition: no active relation from the current project targets targetProjectId
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the interface discovery for an unreachable target
        type: throw
        error: >-
          Forbidden — the target project is not reachable from the current project through an active
          relation
      - stepNumber: 5
        description: Load the target project's stored public-surface snapshot
        type: call
        targetComponent: public_surface_repository
        targetMethod: getSnapshot
      - stepNumber: 6
        description: If the target project has no stored snapshot, it exposes no public surface
        type: branch
        condition: the target project has no stored public-surface snapshot
        onFalseStep: 8
      - stepNumber: 7
        description: Return an empty list — the target exposes no public surface (private by default)
        type: return
        outcome: empty list
      - stepNumber: 8
        description: Return only the redacted PublicInterfaceSummary entries from the target's snapshot
        type: return
        outcome: the redacted public interface summaries
  - name: removeRelation
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: If the caller holds neither a landscape:manage grant nor an instance-admin grant, deny
        type: branch
        condition: the caller holds neither a landscape:manage grant nor an instance-admin grant
        onFalseStep: 4
      - stepNumber: 3
        description: Reject the relation removal
        type: throw
        error: >-
          Forbidden — managing cross-project relations requires a landscape:manage grant or an
          instance-admin grant
      - stepNumber: 4
        description: Remove the cross-project relation by id
        type: call
        targetComponent: project_relation_repository
        targetMethod: remove
      - stepNumber: 5
        description: Append a redacted audit event without letting a failure fail the removal
        type: try
        endStep: 7
        catches:
          - error: audit append failure
            step: 8
      - stepNumber: 6
        description: >-
          Append the redacted relation.remove audit event (info level) under the active retention
          policy
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 7
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 9
      - stepNumber: 8
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 9
        description: Return once the relation has been removed
        type: return
        outcome: the relation is removed
  - name: placeProject
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: If the caller holds neither a landscape:manage grant nor an instance-admin grant, deny
        type: branch
        condition: the caller holds neither a landscape:manage grant nor an instance-admin grant
        onFalseStep: 4
      - stepNumber: 3
        description: Reject the project placement
        type: throw
        error: Forbidden — placing a project requires a landscape:manage grant or an instance-admin grant
      - stepNumber: 4
        description: Load the target organization unit for the placement (placement.unitId)
        type: call
        targetComponent: organization_repository
        targetMethod: getUnit
      - stepNumber: 5
        description: If the target organization unit does not exist, reject
        type: branch
        condition: the target organization unit does not exist
        onFalseStep: 7
      - stepNumber: 6
        description: Reject the placement into a missing unit
        type: throw
        error: the target organization unit does not exist
      - stepNumber: 7
        description: >-
          Place the hosted project in the organization unit (the registry stamps id, re-validates
          unitId existence)
        type: call
        targetComponent: organization_repository
        targetMethod: placeProject
      - stepNumber: 8
        description: Append a redacted audit event without letting a failure fail the placement
        type: try
        endStep: 10
        catches:
          - error: audit append failure
            step: 11
      - stepNumber: 9
        description: >-
          Append the redacted project.place audit event (info level) under the active retention
          policy
        type: call
        targetComponent: audit_repository
        targetMethod: append
      - stepNumber: 10
        description: On a successful append, continue to the return and skip the audit-failure handler
        type: jump
        toStep: 12
      - stepNumber: 11
        description: Record the audit append failure as a server diagnostic and continue
        type: local
      - stepNumber: 12
        description: Return the stored project placement
        type: return
        outcome: the stored project placement
