id: topology_repository_impl
name: Topology Repository Implementation
description: >-
  src/core/topology.ts — a facade and nothing else. Every method is one forward to the member that
  owns the work: the writes to the registry, the file to the store. It holds no logic of its own by
  construction, which is what a Repository facade is for; anything that needed a decision would
  belong in a member instead, and the moment one appears here the pattern has been misread.
contract: itopology_repository
sourcePath: src/core/topology.ts
methods:
  - name: addFreeStanding
    narrative:
      - stepNumber: 1
        description: Forward 1:1 to the domain registry
        type: call
        targetComponent: domain_registry
        targetMethod: addFreeStanding
  - name: removeFreeStanding
    narrative:
      - stepNumber: 1
        description: Forward 1:1 to the domain registry
        type: call
        targetComponent: domain_registry
        targetMethod: removeFreeStanding
  - name: loadConfig
    narrative:
      - stepNumber: 1
        description: Forward 1:1 to the store
        type: call
        targetComponent: topology_store
        targetMethod: loadConfig
status: complete
