id: policy_registry_impl
name: Policy Registry Implementation
description: >-
  Write path for the active hosted instance pack/profile policy, the identity-provider (SSO)
  configuration collection and the instance exposure policy: stamp updatedAt server-side and
  persist. Owns no authorization; pack-policy writes own no updatedBy stamping. Every operation is
  ONE store update of ONE of the three files, read fresh under that file's write lock, so two
  administrators saving different identity providers at once keep both.
contract: ipolicy_registry
sourcePath: src/server/policy.ts
injectedParams:
  - dataDir
methods:
  - name: setPackPolicy
    narrative: []
    intent: >-
      Stamp updatedAt to the current server time on the supplied policy - preserving the
      orchestrator-supplied updatedBy and the caller's pack/profile lists and enforcement posture
      verbatim - then, in one store update of pack-policy.json, persist it as the single active
      record, and return the stored policy. A failure leaves the previous record intact and surfaces
      as a storage error. Authorization is enforced by the orchestrator, not here; the registry owns
      only server-side stamping and durable replacement of the one active record.
    calls:
      - policy_store.updatePackPolicy
    symbol: registrySetPackPolicy
  - name: upsertIdentityProvider
    narrative: []
    intent: >-
      Stamp updatedAt to the current server time on the supplied identity-provider config -
      preserving its id, provider metadata, and clientSecretRef verbatim - then, in one store update
      of identity-providers.json, insert or replace it by id within the collection read under the
      lock; return the stored config. The config carries only a clientSecretRef into the host secret
      mechanism; the registry writes the reference and never a raw client secret. A failure leaves
      the previous collection intact and surfaces as a storage error.
    calls:
      - policy_store.updateIdentityProviders
    symbol: registryUpsertIdentityProvider
  - name: removeIdentityProvider
    narrative: []
    intent: >-
      In one store update of identity-providers.json: reject with a not-found error when no
      identity-provider configuration in the collection read under the lock has the supplied id;
      otherwise drop it. A failure leaves the previous collection intact and surfaces as a storage
      error. Authorization is enforced by the orchestrator, not here.
    calls:
      - policy_store.updateIdentityProviders
    symbol: registryRemoveIdentityProvider
  - name: setExposurePolicy
    narrative: []
    detail: intent
    intent: >-
      In one store update of exposure-policy.json, persist the supplied instance exposure policy
      wholesale and return the stored policy. No stamping - the exposure posture is a plain settings
      object.
    calls:
      - policy_store.updateExposurePolicy
    symbol: registrySetExposurePolicy
detail: intent
status: complete
createdAt: '2026-07-09T20:47:44.803Z'
updatedAt: '2026-10-24T11:33:06.796Z'
