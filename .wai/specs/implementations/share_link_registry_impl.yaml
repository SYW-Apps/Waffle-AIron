id: share_link_registry_impl
name: Share Link Registry Implementation
description: >-
  Write path for share-link records through the store: each operation is ONE store update on the
  collection read fresh under share-links.json's write lock.
contract: ishare_link_registry
sourcePath: src/server/sharelinks.ts
methods:
  - name: create
    narrative: []
    intent: >-
      In one store update: stamp a fresh id + createdAt on the record (persisting its tokenHash
      only, never a raw token) and append it to the collection read under the lock; return the
      stored record.
    calls:
      - share_link_store.update
  - name: update
    narrative: []
    intent: >-
      In one store update: replace the record matching the given id in the collection read under the
      lock in place (preserving id/createdAt/tokenHash); return the updated record. A missing id is
      a not-found error.
    calls:
      - share_link_store.update
  - name: remove
    narrative: []
    intent: >-
      In one store update: drop the record with the given id from the collection read under the
      lock; an absent id is a silent no-op.
    calls:
      - share_link_store.update
detail: intent
status: complete
