id: web_project_orchestrator_impl
name: Web Project Orchestrator Implementation
description: >-
  Bridges project lifecycle to the admin orchestrator (session as credential; grant-scope authorized
  there); owns the scoped project list because the admin list is master-only.
contract: iweb_project_orchestrator
sourcePath: src/server/webproject.ts
methods:
  - name: createProject
    narrative:
      - stepNumber: 1
        description: >-
          Forward to the admin orchestrator passing the sessionId as the credential (project:create
          scope enforced there)
        type: call
        targetComponent: admin_orchestrator
        targetMethod: createProject
    detail: calls-only
  - name: lockProject
    narrative:
      - stepNumber: 1
        description: >-
          Forward to the admin orchestrator passing the sessionId as the credential (lock:create
          scope enforced there)
        type: call
        targetComponent: admin_orchestrator
        targetMethod: lockProject
    detail: calls-only
  - name: promoteProject
    narrative:
      - stepNumber: 1
        description: >-
          Forward to the admin orchestrator passing the sessionId as the credential
          (promote:mark-ready scope enforced there)
        type: call
        targetComponent: admin_orchestrator
        targetMethod: promoteProject
    detail: calls-only
  - name: destroyProject
    narrative:
      - stepNumber: 1
        description: >-
          Forward to the admin orchestrator passing the sessionId as the credential (project:destroy
          scope enforced there)
        type: call
        targetComponent: admin_orchestrator
        targetMethod: destroyProject
    detail: calls-only
  - name: listProjects
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the browser session to a Principal (an expired or absent session yields an
          unauthenticated principal)
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateSession
      - stepNumber: 2
        description: Compute the caller's project-read visible scopes over the organization tree
        type: call
        targetComponent: authorization_specialist
        targetMethod: visibleScopes
      - stepNumber: 3
        description: List all hosted project records
        type: call
        targetComponent: project_registry
        targetMethod: list
      - stepNumber: 4
        description: >-
          Keep only the records whose id is an actionable project scope in the visible set (an
          instance-admin sees all)
        type: local
      - stepNumber: 5
        description: Return the project records the caller may see
        type: return
        outcome: scoped hosted project records
    detail: full
detail: calls-only
status: complete
createdAt: '2026-07-13T20:36:25.016Z'
updatedAt: '2026-07-15T21:39:56.982Z'
