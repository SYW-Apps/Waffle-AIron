id: web_project_orchestrator_impl
name: Web Project Orchestrator Implementation
description: >-
  Bridges project lifecycle to the admin orchestrator (session as credential; grant-scope authorized
  there); owns the scoped project list because the admin list is master-only.
contract: iweb_project_orchestrator
sourcePath: src/server/webproject.ts
methods:
  - name: lockProject
    narrative:
      - stepNumber: 1
        description: >-
          Forward to the admin orchestrator passing the sessionId as the credential (project:write
          permission enforced there)
        type: call
        targetComponent: admin_orchestrator
        targetMethod: lockProject
    detail: calls-only
  - name: promoteProject
    narrative:
      - stepNumber: 1
        description: >-
          Forward to the admin orchestrator passing the sessionId as the credential (project:write
          permission enforced there)
        type: call
        targetComponent: admin_orchestrator
        targetMethod: promoteProject
    detail: calls-only
  - name: destroyProject
    narrative:
      - stepNumber: 1
        description: >-
          Forward to the admin orchestrator passing the sessionId as the credential (project:admin
          permission enforced there)
        type: call
        targetComponent: admin_orchestrator
        targetMethod: destroyProject
    detail: calls-only
  - name: listProjects
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the browser session to a Principal (an expired or absent session yields an
          unauthenticated principal)
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateSession
      - stepNumber: 2
        description: Compute the caller's project-read visible scopes over the organization tree
        type: call
        targetComponent: authorization_specialist
        targetMethod: visibleScopes
      - stepNumber: 3
        description: List all hosted project records
        type: call
        targetComponent: project_registry
        targetMethod: list
      - stepNumber: 4
        description: >-
          Keep only the records whose id is an actionable project scope in the visible set (an
          instance-admin sees all)
        type: local
      - stepNumber: 5
        description: Return the project records the caller may see
        type: return
        outcome: scoped hosted project records
    detail: full
  - name: createProject
    narrative:
      - stepNumber: 1
        description: >-
          Build a ProjectInitRequest from the arguments (id, REQUIRED ownerUnitId, optional
          profileSelection)
        type: local
      - stepNumber: 2
        description: >-
          Forward to the project policy orchestrator's profile-aware initialization with the session
          as the credential — the instance pack policy and the project:create-over-unit gate apply
          exactly as they do to the MCP init
        type: call
        targetComponent: project_policy_orchestrator
        targetMethod: initializeProjectWithProfile
      - stepNumber: 3
        description: Return the created hosted project record
        type: return
        outcome: created project record
    detail: full
detail: calls-only
status: complete
createdAt: '2026-07-13T20:36:25.016Z'
updatedAt: '2026-07-16T15:31:49.622Z'
