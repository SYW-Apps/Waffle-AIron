id: credential_write_registry_impl
name: Credential Write Registry Implementation
description: >-
  Write path over the credential store's backing file: create, single revoke, per-owner bulk revoke,
  and the member upgrade's narrowing rewrite. Each operation changes the set through one store
  update, which reads it fresh and persists the replacement under the file's write lock, so
  concurrent writers in other processes are never lost. The data root is wiring supplied ahead of
  the contract's parameters.
contract: icredential_write_registry
sourcePath: src/server/credentials.ts
injectedParams:
  - dataDir
methods:
  - name: create
    narrative: []
    intent: >-
      In one store update: refuses an id the set already holds, and appends the new record (hashed
      token only).
    calls:
      - credential_store.update
    symbol: createCredential
  - name: revoke
    narrative: []
    intent: >-
      In one store update: stamps revokedAt on the matching id; idempotent for an unknown or
      already-revoked id.
    calls:
      - credential_store.update
    symbol: revokeCredential
  - name: revokeAllForOwner
    narrative: []
    intent: >-
      In one store update: stamps revokedAt on every active record owned by the user, and returns
      the count revoked.
    calls:
      - credential_store.update
    symbol: revokeAllForOwner
  - name: renarrow
    narrative: []
    intent: >-
      Refuses an empty narrowing; in one store update, refuses an unknown or revoked id and replaces
      the record's projects with the given entries, leaving every other field untouched.
    calls:
      - credential_store.update
    symbol: renarrowCredential
status: complete
createdAt: '2026-07-19T08:58:36.608Z'
updatedAt: '2026-10-22T13:48:53.010Z'
