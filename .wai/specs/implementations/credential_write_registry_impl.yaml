id: credential_write_registry_impl
name: Credential Write Registry Implementation
description: >-
  Write path over the credential store's backing file: create, single revoke, per-owner bulk revoke,
  and the member upgrade's narrowing rewrite. Each operation loads the persisted set, mutates it,
  and persists the replacement atomically. The data root is wiring supplied ahead of the contract's
  parameters.
contract: icredential_write_registry
sourcePath: src/server/credentials.ts
injectedParams:
  - dataDir
methods:
  - name: create
    narrative: []
    intent: >-
      Loads the persisted set, appends the new record (hashed token only), and persists the
      replacement.
    calls:
      - credential_store.read
      - credential_store.write
    symbol: createCredential
  - name: revoke
    narrative: []
    intent: >-
      Loads the persisted set, stamps revokedAt on the matching id, and persists; idempotent for an
      unknown or already-revoked id.
    calls:
      - credential_store.read
      - credential_store.write
    symbol: revokeCredential
  - name: revokeAllForOwner
    narrative: []
    intent: >-
      Loads the persisted set, stamps revokedAt on every active record owned by the user, persists,
      and returns the count revoked.
    calls:
      - credential_store.read
      - credential_store.write
    symbol: revokeAllForOwner
  - name: renarrow
    narrative: []
    intent: >-
      Refuses an empty narrowing; loads the persisted set, refuses an unknown or revoked id,
      replaces the record's projects with the given entries leaving every other field untouched, and
      persists the set.
    calls:
      - credential_store.read
      - credential_store.write
    symbol: renarrowCredential
status: complete
createdAt: '2026-07-19T08:58:36.608Z'
updatedAt: '2026-10-01T17:40:24.035Z'
