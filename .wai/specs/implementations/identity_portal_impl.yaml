id: identity_portal_impl
name: Identity Portal Implementation
description: >-
  Control-plane HTTP boundary for hosted identity: forwards each token, user-grant, and audit
  operation to the identity orchestrator.
contract: iidentity_portal
sourcePath: src/server/identity.ts
injectedParams:
  - cfg
methods:
  - name: mintToken
    narrative:
      - stepNumber: 1
        description: >-
          If the request body carries no projects list, or an empty one, reject it before it reaches
          the orchestrator — the narrowing is required, and '*' is the full reach
        type: branch
        condition: request.projects is missing or empty
        onTrueStep: 2
        onFalseStep: 3
      - stepNumber: 2
        description: Answer 400, telling the caller to pass the project ids or '*'
        type: throw
        error: >-
          projects is required: pass the project ids the token may name, or '*' for the owner's full
          reach
      - stepNumber: 3
        description: Forward to the identity orchestrator
        type: call
        targetComponent: identity_orchestrator
        targetMethod: mintToken
  - name: revokeToken
    narrative:
      - stepNumber: 1
        description: Forward to the identity orchestrator
        type: call
        targetComponent: identity_orchestrator
        targetMethod: revokeToken
  - name: listUsers
    narrative:
      - stepNumber: 1
        description: Forward to the identity orchestrator
        type: call
        targetComponent: identity_orchestrator
        targetMethod: listUsers
  - name: listAuditEvents
    narrative:
      - stepNumber: 1
        description: Forward to the identity orchestrator's audit query
        type: call
        targetComponent: identity_orchestrator
        targetMethod: queryAuditEvents
    symbol: queryAuditEvents
  - name: pruneAuditEvents
    narrative:
      - stepNumber: 1
        description: Forward to the identity orchestrator
        type: call
        targetComponent: identity_orchestrator
        targetMethod: pruneAuditEvents
  - name: upsertUser
    narrative:
      - stepNumber: 1
        description: Forward to the identity orchestrator
        type: call
        targetComponent: identity_orchestrator
        targetMethod: upsertUser
  - name: setUserStatus
    narrative:
      - stepNumber: 1
        description: Forward to the identity orchestrator
        type: call
        targetComponent: identity_orchestrator
        targetMethod: setUserStatus
  - name: startSsoLogin
    narrative:
      - stepNumber: 1
        description: Forward to the identity orchestrator
        type: call
        targetComponent: identity_orchestrator
        targetMethod: startSsoLogin
  - name: completeSsoLogin
    narrative:
      - stepNumber: 1
        description: Forward to the identity orchestrator
        type: call
        targetComponent: identity_orchestrator
        targetMethod: completeSsoLogin
  - name: listIdentityProviders
    narrative:
      - stepNumber: 1
        description: Forward to the identity orchestrator
        type: call
        targetComponent: identity_orchestrator
        targetMethod: listProviders
    symbol: listProviders
  - name: upsertIdentityProvider
    narrative:
      - stepNumber: 1
        description: Forward to the identity orchestrator
        type: call
        targetComponent: identity_orchestrator
        targetMethod: upsertProvider
    symbol: upsertProvider
  - name: removeIdentityProvider
    narrative:
      - stepNumber: 1
        description: Forward to the identity orchestrator
        type: call
        targetComponent: identity_orchestrator
        targetMethod: removeProvider
    symbol: removeProvider
  - name: countAuditEvents
    narrative:
      - stepNumber: 1
        description: Forward to the identity orchestrator's audit count
        type: call
        targetComponent: identity_orchestrator
        targetMethod: countAuditEvents
detail: calls-only
