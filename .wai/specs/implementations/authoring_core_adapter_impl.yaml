id: authoring_core_adapter_impl
name: Authoring Core Adapter Implementation
description: >-
  The outward hop into sdd_core, as the import seam inside src/core/authoring.ts. All three methods
  forward straight to the core's published surface: the two writes, and the configuration read the
  module's own `candidateOptions` wraps — deliberately defensively, because an uninitialized or
  unreadable project must yield the default severities rather than fail a write closed. Swappable
  for a remote spec store without changing the workflow that calls it.
contract: iauthoring_core_adapter
sourcePath: src/core/authoring.ts
methods:
  - name: saveComponentSpec
    narrative:
      - stepNumber: 1
        description: Persist the judged component through the core subsystem's published write
        type: call
        targetComponent: core_portal
        targetMethod: saveComponentSpec
  - name: updateSpec
    narrative:
      - stepNumber: 1
        description: >-
          Apply the delta through the core subsystem's published update, passing the caller's
          judgement in as the write hook so it runs on the merged spec at the last point before
          anything reaches disk
        type: call
        targetComponent: core_portal
        targetMethod: updateSpec
  - name: loadProjectConfig
    narrative:
      - stepNumber: 1
        description: >-
          Read the bound project's configuration through the core subsystem's published read,
          answering with nothing when the project has none or cannot be read — a configuration read
          must never be the thing that fails a write closed
        type: call
        targetComponent: core_portal
        targetMethod: loadProjectConfig
    symbol: candidateOptions
  - name: moveMethods
    narrative:
      - stepNumber: 1
        description: >-
          Forward the move to the core portal with the caller's hooks and dry-run request carried
          through unchanged
        type: call
        targetComponent: core_portal
        targetMethod: moveMethods
status: complete
createdAt: '2026-09-18T21:43:38.007Z'
updatedAt: '2026-09-20T12:05:53.879Z'
