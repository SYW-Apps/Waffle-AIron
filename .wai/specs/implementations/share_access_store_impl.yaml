id: share_access_store_impl
name: Share Access Store Implementation
description: >-
  Disk-backed append-only access log at <dataDir>/share-access.json, loaded fresh per call; each
  append is one locked read-modify-write.
contract: ishare_access_store
sourcePath: src/server/shareaccesslog.ts
methods:
  - name: load
    narrative: []
    intent: >-
      Reads share-access.json under the data dir and returns the parsed ShareAccessEntry array; a
      missing file yields an empty set.
  - name: append
    narrative: []
    intent: >-
      Under share-access.json's write lock (file_write_lock.run): read the current entries fresh (an
      absent file is empty; a file that exists but cannot be read or parsed throws and nothing is
      written), append the new one, and swap the file via write-temp-then-rename (atomic).
      Append-only - existing entries are never rewritten, so the log is a faithful audit trail; two
      appends in different processes both survive.
    calls:
      - file_write_lock.run
detail: intent
status: complete
