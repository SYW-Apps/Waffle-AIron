id: claude_exporter_impl
name: Claude Agent File Exporter Implementation
description: >-
  src/exporters/claude.ts. One class serving four targets through options; `emitBudget` is set only
  for the `claude` target, which is the single behavioural difference between the four.
contract: iclaude_exporter
sourcePath: src/exporters/claude.ts
methods:
  - name: export
    narrative:
      - stepNumber: 1
        description: Resolve where this target's file belongs
        type: local
      - stepNumber: 2
        description: >-
          Compose the file: frontmatter naming the agent, its description and the paths it owns; the
          execution budget when this target emits one; the wairon-managed banner marking the file as
          generated; then the rendered instructions
        type: local
      - stepNumber: 3
        description: Decide whether anything needs writing
        type: branch
        condition: the file already holds exactly this content
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: >-
          Leave it alone and answer unchanged — a run that rewrote nothing should not report work,
          and an untouched timestamp is what lets a watcher or a build cache trust the output
        type: return
        outcome: unchanged
      - stepNumber: 5
        description: Create the parent directory if needed and write the file
        type: local
      - stepNumber: 6
        description: Answer with where it landed and what it holds
        type: return
        outcome: written
  - name: outputPath
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the target's output directory against the project root and name the file for the
          agent, without rendering or writing anything
        type: return
        outcome: resolved
status: complete
createdAt: '2026-09-20T19:46:13.061Z'
updatedAt: '2026-09-20T19:46:13.069Z'
