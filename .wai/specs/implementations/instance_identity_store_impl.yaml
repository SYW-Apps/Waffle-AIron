id: instance_identity_store_impl
name: Instance Identity Store Implementation
description: >-
  Read-through file I/O over the singleton InstanceIdentity record at instance.json under the hosted
  data root: load parses the file fresh; update holds the file's write lock across a fresh read and
  the replacement.
contract: iinstance_identity_store
sourcePath: src/server/instance.ts
methods:
  - name: load
    narrative: []
    intent: >-
      Read the persisted instance identity fresh from instance.json under the hosted data root (no
      in-memory copy); an absent file resolves to null (the instance has never been seeded) without
      creating anything.
  - name: update
    narrative: []
    intent: >-
      Under instance.json's write lock (file_write_lock.run), read the record fresh (null when the
      file is absent; a file that exists but cannot be read or parsed throws and nothing is
      written), apply the change to what was read, replace the file atomically via
      write-temp-then-rename and release the lock, also when the change throws. Answers the identity
      written - for a seed that lost the race, the identity the winner wrote.
    calls:
      - file_write_lock.run
      - files_adapter.ensureDir
detail: intent
status: complete
