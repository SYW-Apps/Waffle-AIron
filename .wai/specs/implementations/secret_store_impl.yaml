id: secret_store_impl
name: Secret Store Implementation
description: >-
  Read-through file I/O over the data-dir secret file (WAIRON_DATA_DIR-anchored): read parses it
  fresh; update holds the file's write lock across a fresh read and the replacement.
contract: isecret_store
sourcePath: src/utils/secrets.ts
methods:
  - name: read
    narrative: []
    intent: >-
      Parses the secret file fresh from disk; an unset data dir or absent/malformed file reads as
      the empty map.
    symbol: readStore
  - name: update
    narrative: []
    intent: >-
      Requires the data dir (throws when unset). Under the secret file's write lock
      (file_write_lock.run), read the map fresh - absent is empty, a file that exists but cannot be
      read or parsed throws and nothing is written (a corrupt file is never replaced by a map of one
      key) - apply the change, write the full map owner-readable through a temporary sibling named
      for this writer and rename it over the file, and release the lock, also when the change
      throws. Answers the map written.
    calls:
      - file_write_lock.run
    symbol: updateStore
status: complete
createdAt: '2026-07-19T08:59:27.302Z'
updatedAt: '2026-10-24T11:32:00.625Z'
