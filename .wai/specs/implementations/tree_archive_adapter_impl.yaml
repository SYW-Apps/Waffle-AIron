id: tree_archive_adapter_impl
name: Tree Archive Adapter Implementation
description: >-
  src/core/treetransfer.ts — the archive + filesystem boundary for spec-tree transfer. The three
  archive capabilities forward 1:1 to the @wairon/sdk portal; the staging/probe/swap/discard
  operations are the only directory moves a tree import performs.
contract: itree_archive_adapter
sourcePath: src/core/treetransfer.ts
methods:
  - name: buildTreeArchive
    narrative:
      - stepNumber: 1
        description: Forward to the SDK portal.
        type: call
        targetComponent: sdk_portal
        targetMethod: buildTreeArchive
  - name: inspectTreeArchive
    narrative:
      - stepNumber: 1
        description: Forward to the SDK portal.
        type: call
        targetComponent: sdk_portal
        targetMethod: inspectTreeArchive
  - name: extractTreeArchive
    narrative:
      - stepNumber: 1
        description: >-
          Forward to the SDK portal, letting the omitted limits fall back to its tree caps profile
          and passing the caller's executable-entry policy through unchanged.
        type: call
        targetComponent: sdk_portal
        targetMethod: extractTreeArchive
  - name: hasSpecTree
    narrative:
      - stepNumber: 1
        description: Does the root hold a .wai directory carrying a project config?
        type: branch
        condition: the root's .wai directory exists and contains project.yaml
        onTrueStep: 2
        onFalseStep: 3
      - stepNumber: 2
        description: A spec tree is present.
        type: return
        outcome: present
      - stepNumber: 3
        description: No spec tree here.
        type: return
        outcome: absent
    detail: full
  - name: createStagingDir
    narrative:
      - stepNumber: 1
        description: Make sure the destination root folder exists
        type: call
        targetComponent: files_adapter
        targetMethod: ensureDir
      - stepNumber: 2
        description: >-
          Derive a uniquely named staging directory beside the destination root (a sibling, so the
          swap is a rename within one filesystem rather than a cross-device copy) and create it
          empty.
        type: call
        targetComponent: files_adapter
        targetMethod: makeTempDir
      - stepNumber: 3
        description: Return the staging directory path.
        type: return
        outcome: success
    detail: full
  - name: commitStagedTree
    narrative:
      - stepNumber: 1
        description: >-
          Derive the timestamped backup directory path beside the destination root; nothing has
          moved yet.
        type: local
      - stepNumber: 2
        description: Swap each root into place.
        type: loop
        loopKind: forEach
        over: roots
        endStep: 9
      - stepNumber: 3
        description: Does the destination root hold an existing .wai?
        type: call
        targetComponent: files_adapter
        targetMethod: exists
      - stepNumber: 4
        description: Does this root hold an existing .wai that the caller asked to preserve?
        type: branch
        condition: backupExisting is set and the destination root's .wai exists
        onTrueStep: 5
        onFalseStep: 7
      - stepNumber: 5
        description: Make the backup folder for this root's project-relative path
        type: call
        targetComponent: files_adapter
        targetMethod: ensureDir
      - stepNumber: 6
        description: >-
          Move the existing .wai into the backup directory, so one backup holds the whole previous
          tree in its original shape.
        type: call
        targetComponent: files_adapter
        targetMethod: rename
      - stepNumber: 7
        label: swapEnd
        description: Make sure the target's parent folder exists, ready for the staged root's .wai
        type: call
        targetComponent: files_adapter
        targetMethod: ensureDir
      - stepNumber: 8
        description: Remove whatever remains at the target, when present
        type: call
        targetComponent: files_adapter
        targetMethod: remove
      - stepNumber: 9
        description: Move the staged root's .wai into position under the destination
        type: call
        targetComponent: files_adapter
        targetMethod: rename
      - stepNumber: 10
        description: Was anything moved aside?
        type: branch
        condition: the backup directory was created
        onTrueStep: 11
        onFalseStep: 12
      - stepNumber: 11
        description: Return the backup directory path.
        type: return
        outcome: replaced
      - stepNumber: 12
        description: Return an empty string — the destination held no previous tree.
        type: return
        outcome: fresh
    detail: full
  - name: discardStagingDir
    narrative:
      - stepNumber: 1
        description: >-
          Remove the staging directory and everything under it, swallowing any failure — tidying
          must never fail an import that already succeeded.
        type: call
        targetComponent: files_adapter
        targetMethod: remove
    detail: full
  - name: hasAuthoredSpecs
    narrative:
      - stepNumber: 1
        description: Locate the root's specs directory.
        type: local
      - stepNumber: 2
        description: Is there no specs directory at all?
        type: branch
        condition: the specs directory does not exist
        onTrueStep: 3
        onFalseStep: 4
      - stepNumber: 3
        description: Nothing authored.
        type: return
        outcome: none
      - stepNumber: 4
        description: Scan the specs tree for any spec file other than the L0 system index.
        type: loop
        loopKind: forEach
        over: the spec files under the specs directory
        endStep: 6
      - stepNumber: 5
        description: Is this file something other than the L0 system index?
        type: branch
        condition: the file is not the system index
        onTrueStep: 8
        onFalseStep: 6
      - stepNumber: 6
        label: scanEnd
        description: This file is the bootstrap index — keep looking.
        type: local
      - stepNumber: 7
        description: Only the bootstrap L0 index — nothing authored.
        type: return
        outcome: none
      - stepNumber: 8
        label: authored
        description: Authored design is present.
        type: return
        outcome: authored
    detail: full
  - name: dropStagedApprovals
    narrative:
      - stepNumber: 1
        description: Does the staged root hold a lock.json?
        type: call
        targetComponent: files_adapter
        targetMethod: exists
      - stepNumber: 2
        description: For each staged root, remove its .wai/lock.json when present and collect the root
        type: call
        targetComponent: files_adapter
        targetMethod: removeFileIfPresent
      - stepNumber: 3
        description: Return the roots whose approval record was removed
        type: return
        outcome: the roots
    detail: full
status: complete
