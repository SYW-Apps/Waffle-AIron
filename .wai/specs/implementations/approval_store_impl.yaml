id: approval_store_impl
name: Approval Store Implementation
description: >-
  Read-through file I/O over the redacted approval-request set at approvals.json under the server
  data root: load parses the file fresh per call; update holds the file's write lock across a fresh
  read and the replacement.
contract: iapproval_store
sourcePath: src/server/approvals.ts
methods:
  - name: load
    narrative: []
    intent: >-
      Read and parse approvals.json fresh from disk (no in-memory copy), returning the requests. A
      missing file yields an empty set; an unreadable file or structurally invalid JSON fails with a
      storage error naming the path - the store never silently drops persisted approvals, because a
      lost pending request would silently deny a legitimate action or strand an approved one.
  - name: update
    narrative: []
    intent: >-
      Under approvals.json's write lock (file_write_lock.run), read the set fresh - an absent file
      is the empty set, a file that exists but cannot be read or parsed throws and nothing is
      written - apply the change, replace the file with the result atomically (a temporary sibling
      named for this writer, then renamed over the file), and release the lock, also when the change
      throws, which writes nothing. Answers the set written.
    calls:
      - file_write_lock.run
detail: intent
status: complete
