id: approval_store_impl
name: Approval Store Implementation
description: >-
  Authoritative in-memory holder of the redacted approval-request set, file-backed under the server
  data root (approvals.json).
contract: iapproval_store
sourcePath: src/server/approvals.ts
methods:
  - name: load
    narrative: []
    intent: >-
      Read the persisted approval-request set from the approvals file (approvals.json) under the
      server data root and hold it as the authoritative in-memory representation, returning the
      loaded requests. A missing file yields an empty set; an unreadable file or structurally
      invalid JSON fails with a storage error naming the path — the store never silently drops
      persisted approvals, because a lost pending request would silently deny a legitimate action or
      strand an approved one.
  - name: replaceAll
    narrative: []
    intent: >-
      Swap the authoritative in-memory request set to the supplied complete set in one assignment,
      only ever called by the owned registry after durable persistence has succeeded. Never
      partially applies, so concurrent status and decision queries through the index always observe
      a consistent request set.
detail: intent
status: complete
