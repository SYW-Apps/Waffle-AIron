id: git_adapter_impl
name: Git Client Adapter Implementation
description: >-
  git I/O against the bound project's checkout, using the container bot identity. Staging is
  pathspec-confined — there is deliberately NO stage-everything code path (`git add -A` was the bug
  that made a shared real repository unsafe).
contract: igit_adapter
sourcePath: src/git/adapter.ts
methods:
  - name: clone
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the git token through the host's secret portal: the connection's own credential
          ref first, when it has one, then the shared git-token
        type: call
        targetComponent: secret_portal
        targetMethod: resolve
      - stepNumber: 2
        description: >-
          Run git clone of the remote (at branch) into the bound project directory, the token
          injected into an https remote so origin carries it
        type: local
  - name: fetch
    narrative:
      - stepNumber: 1
        description: Run git fetch from the remote
        type: local
  - name: ensureWorkingBranch
    narrative:
      - stepNumber: 1
        description: Create or checkout the isolated working branch
        type: local
  - name: integrateDefault
    narrative:
      - stepNumber: 1
        description: Integrate origin/<defaultBranch> into the working branch (fast-forward/merge)
        type: local
  - name: push
    narrative:
      - stepNumber: 1
        description: Push the branch to the remote using WAIRON_GIT_TOKEN
        type: local
  - name: compareUrl
    narrative:
      - stepNumber: 1
        description: Derive the host's compare/PR URL from the remote, default and working branches
        type: local
  - name: commitScoped
    narrative:
      - stepNumber: 1
        description: >-
          Stage ONLY the given subpath (`git add -- <subpath>`), probe the scoped index for staged
          changes, and when non-empty commit with the bot committer identity; return the new commit
          SHA, or null when the scoped path was clean
        type: local
  - name: isClean
    narrative:
      - stepNumber: 1
        description: Run `git status --porcelain -- <subpath>` and report true when it prints nothing
        type: local
  - name: excludeLocalFiles
    narrative:
      - stepNumber: 1
        description: >-
          Read the repository's `.git/info/exclude`, creating its directory if needed; drop any
          `.wai/lock.json` line an earlier version wrote, warning that approvals now ship; add
          `.wai/git.json` if it is not already there; and write the file back, so running it twice
          changes nothing
        type: local
status: complete
