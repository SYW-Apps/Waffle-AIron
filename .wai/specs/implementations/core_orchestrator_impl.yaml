  - name: provisionProject
    narrative:
      - stepNumber: 1
        description: Compose a default ProjectConfig and a bootstrap L0 SystemSpec named `name`
        type: local
      - stepNumber: 2
        description: Persist the L0 system spec via the spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: saveSystemSpec
      - stepNumber: 3
        description: Write the default project.yaml config at the bound project root
        type: local
  - name: computeStateId
    narrative:
      - stepNumber: 1
        description: Delegate to the state hash specialist
        type: call
        targetComponent: state_hash_specialist
        targetMethod: hashSpecTree
  - name: readLockRecord
    narrative:
      - stepNumber: 1
        description: Read the lock record via the lock registry
        type: call
        targetComponent: lock_registry
        targetMethod: read
  - name: writeLockRecord
    narrative:
      - stepNumber: 1
        description: Write the lock record via the lock registry
        type: call
        targetComponent: lock_registry
        targetMethod: write
  - name: promoteAllComplete
    narrative:
      - stepNumber: 1
        description: Load subsystem specs
        type: call
        targetComponent: spec_loader
        targetMethod: loadSubsystemSpecs
      - stepNumber: 2
        description: For each subsystem
        type: loop
        loopKind: forEach
        over: subsystems
        endStep: 3
      - stepNumber: 3
        description: Re-save the subsystem with status complete
        type: call
        targetComponent: spec_loader
        targetMethod: saveSubsystemSpec
      - stepNumber: 4
        description: Load component specs
        type: call
        targetComponent: spec_loader
        targetMethod: loadComponentSpecs
