        targetMethod: saveComponentSpec
      - stepNumber: 22
        description: >-
          Rebase those variant files in place through the variant registry adapter, from base
          Specialist to base Orchestrator; its result gives the rebased ids
        type: call
        targetComponent: variant_registry_adapter
        targetMethod: rebaseProjectVariants
      - stepNumber: 23
        description: Invalidate the spec cache
        type: call
        targetComponent: spec_loader
        targetMethod: invalidateCache
      - stepNumber: 24
        description: Return the plan with applied true
        type: return
        outcome: applied
  - name: renameComponent
    sourcePath: src/core/provision.ts
    narrative:
      - stepNumber: 1
        description: Load the component to rename
        type: call
        targetComponent: spec_loader
        targetMethod: loadComponentSpec
      - stepNumber: 2
        description: 'Guard: the component must exist'
        type: branch
        condition: the component does not exist
        onFalseStep: 4
      - stepNumber: 3
        label: component-missing
        description: Refuse a component that does not exist
        type: throw
        error: 'component-missing: no component has this id'
      - stepNumber: 4
        description: 'Guard: the component must belong to the bound project itself'
        type: branch
        condition: 'componentId is namespaced into a chained mount (it carries the :: separator)'
        onFalseStep: 6
      - stepNumber: 5
        label: chained-component
        description: Refuse a component inside a chained subproject
        type: throw
        error: >-
          chained-component: the component lives in a chained subproject; rename it from that
          project's own root
      - stepNumber: 6
        description: 'Guard: the new id must be a plain lowercase identifier'
        type: branch
        condition: >-
          newId is outside the id grammar: not a lowercase identifier, or carrying a namespace
          separator
        onFalseStep: 8
      - stepNumber: 7
        label: invalid-id
        description: Refuse a new id outside the grammar
        type: throw
        error: 'invalid-id: the new id must be a lowercase identifier with no namespace separator'
      - stepNumber: 8
        description: Load every component spec, for the component ids already taken
        type: call
        targetComponent: spec_loader
        targetMethod: loadComponentSpecs
      - stepNumber: 9
        description: Load every interface spec, for the interface ids taken and the component's own contracts
        type: call
        targetComponent: spec_loader
        targetMethod: loadInterfaceSpecs
      - stepNumber: 10
        description: >-
          Load every implementation spec, for the implementation ids taken and the realizations of
          those contracts
        type: call
        targetComponent: spec_loader
        targetMethod: loadImplementationSpecs
      - stepNumber: 11
        description: 'Guard: nothing may already hold the new ids'
        type: branch
        condition: >-
          newId is already a component id, or i<newId> is an interface id, or <newId>_impl is an
          implementation id
        onFalseStep: 13
      - stepNumber: 12
        label: id-taken
        description: Refuse a new id already taken
        type: throw
        error: 'id-taken: the new id, or the interface or implementation id it implies, is already in use'
      - stepNumber: 13
        description: >-
          Collect what moves: the component's interface named i<componentId>, and the implementation
          named <componentId>_impl that realizes one of the component's contracts. Interfaces and
          implementations named otherwise keep their ids; only their component and contract
          references change
        type: local
      - stepNumber: 14
        description: >-
          Describe the move as the debt register and the lint allows key findings by it
          (identity_rename): every renamed spec with its old and new id, and the component wherever
          a covered unit or an edge site names it
        type: local
      - stepNumber: 15
        description: >-
          Rekey the debt register as a DRY RUN, before the first write: a register that cannot be
          rewritten without disturbing its comments and formatting refuses the rename here, so it
          never half-lands with its debt left behind reading as both paid and new
        type: call
        targetComponent: project_config_repository
        targetMethod: rekeyCarried
      - stepNumber: 16
        description: >-
          Rewrite every reference to a renamed id across the bound tree with the provisioning
          rewriter, the moved specs' own files included: a component's dependsOn, owns and dispatch
          components, and the portal each of its listener mounts names; a subsystem's lifecycle
          components and its published interfaces' component and interface; the system's published
          interfaces' component and interface; narrative call, dispatch and register targets, and a
          step's auth.from component source; an interface's component; an implementation's contract;
          and an entity's componentClass. Record the other specs it rewrote (the moved specs,
          matched by their old ids, are not among them). References from chained subprojects are not
          rewritten
        type: local
      - stepNumber: 17
        description: >-
          Rekey every lint allow in the bound tree by the same move (identity_rename.rekeyAnchor): a
          site on an edge naming the component and every covered unit naming it follow, and each
          spec whose allows changed joins the rewritten specs — a spec the rename moves carries its
          allows with it
        type: local
      - stepNumber: 18
        description: Drop the cached spec index, so the saves below place specs by the rewritten owns
        type: call
        targetComponent: spec_loader
        targetMethod: invalidateCache
      - stepNumber: 19
        description: >-
          Move each renamed spec to its new id: reload it as the rewrite left it, write it under the
          new id where the loader places it, remove the file it left behind and drop the cached
          index again
        type: call
        targetComponent: core_orchestrator
        targetMethod: moveRenamedSpecs
      - stepNumber: 20
        description: >-
          Rekey the debt register for real: every carried entry anchored on a renamed spec or naming
          the component in its site or units, rewritten in place with every comment and all other
          formatting kept
        type: call
        targetComponent: project_config_repository
        targetMethod: rekeyCarried
      - stepNumber: 21
        description: >-
          Return renamed (each moved spec's kind with its old and new id), rewritten (the ids of the
          other specs whose references or lint allows changed) and carried (each register edit)
        type: return
  - name: renameMethod
    sourcePath: src/core/provision.ts
    narrative:
      - stepNumber: 1
        description: Load the component whose contract method is renamed
        type: call
        targetComponent: spec_loader
        targetMethod: loadComponentSpec
      - stepNumber: 2
        description: 'Guard: the component must exist'
        type: branch
        condition: the component does not exist
        onFalseStep: 4
      - stepNumber: 3
        label: component-missing
        description: Refuse a component that does not exist
        type: throw
        error: 'component-missing: no component has this id'
      - stepNumber: 4
        description: 'Guard: the component must belong to the bound project itself'
        type: branch
        condition: 'componentId is namespaced into a chained mount (it carries the :: separator)'
        onFalseStep: 6
      - stepNumber: 5
        label: chained-component
        description: Refuse a component inside a chained subproject
        type: throw
        error: >-
          chained-component: the component lives in a chained subproject; rename its method from
          that project's own root
      - stepNumber: 6
        description: 'Guard: the new name must be a camel-case identifier'
        type: branch
        condition: >-
          newName is outside the identifier grammar: not a camel-case identifier, or carrying a
          separator
        onFalseStep: 8
      - stepNumber: 7
        label: invalid-name
        description: Refuse a new name outside the grammar
        type: throw
        error: 'invalid-name: the new name must be a camel-case identifier'
      - stepNumber: 8
        description: >-
          Load every interface spec, for the component's own contracts and the names they already
          declare, and collect the contracts that move: every interface of this component that
          declares methodName
        type: call
        targetComponent: spec_loader
        targetMethod: loadInterfaceSpecs
      - stepNumber: 9
        description: 'Guard: the component must declare the method'
        type: branch
        condition: no contract of the component declares methodName
        onFalseStep: 11
      - stepNumber: 10
        label: method-missing
        description: Refuse a method the component does not declare
        type: throw
        error: 'method-missing: no contract of this component declares that method'
      - stepNumber: 11
        description: 'Guard: the new name must be free on every contract that moves'
        type: branch
        condition: one of those contracts already declares a method under newName
        onFalseStep: 13
      - stepNumber: 12
        label: name-taken
        description: Refuse a new name already declared on that interface
        type: throw
        error: 'name-taken: that interface already declares a method under the new name'
      - stepNumber: 13
        description: >-
          Load every implementation spec, for the realizations of those contracts and the narratives
          that refer to the method
        type: call
        targetComponent: spec_loader
        targetMethod: loadImplementationSpecs
      - stepNumber: 14
        description: >-
          Describe the move as the debt register and the lint allows key findings by it
          (identity_rename: the method on this component becomes newName, on the contracts that
          declare it and the implementations of those contracts that realize it) and rekey the debt
          register as a DRY RUN, before the first write: a register that cannot be rewritten without
          disturbing its comments and formatting refuses the rename here
        type: call
        targetComponent: project_config_repository
        targetMethod: rekeyCarried
      - stepNumber: 15
        description: Move the method on every contract of the component that declares it
        type: loop
        loopKind: forEach
        over: each contract that declares the method
        endStep: 16
      - stepNumber: 16
        description: >-
          Write the contract with the method under newName: its name, and the method name inside its
          signature string. Params, returns, description, guarantees and findings stay as they are
        type: call
        targetComponent: spec_loader
        targetMethod: saveInterfaceSpec
      - stepNumber: 17
        description: Move it on the implementations of those contracts too
        type: loop
        loopKind: forEach
        over: each implementation realizing one of those contracts that declares the method
        endStep: 20
      - stepNumber: 18
        description: >-
          An implementation that named no symbol needs one now: the function it binds to still
          carries the old name
        type: branch
        condition: the method declares no symbol and pinSymbol is not false
        onFalseStep: 20
      - stepNumber: 19
        description: >-
          Pin it: declare symbol <the old name> on the moved method, so that function keeps binding,
          and record it as the pinned symbol
        type: local
      - stepNumber: 20
        description: >-
          Write the implementation with the method under newName, carrying its narrative,
          sourcePath, symbol, detail and intent unchanged
        type: call
        targetComponent: spec_loader
        targetMethod: saveImplementationSpec
      - stepNumber: 21
        description: >-
          Drop the cached spec index, so the retargeting below reads the moved names rather than the
          cached ones
        type: call
        targetComponent: spec_loader
        targetMethod: invalidateCache
      - stepNumber: 22
        description: >-
          Retarget every reference to the method with the provisioning rewriter, which persists what
          it changes: narrative call, register and dispatch steps naming this component and this
          method; dispatch-table bindings routing a capability to this component and method; and
          lifecycle entrypoints naming it for a phase. Then rekey every lint allow in the bound tree
          by the same move (identity_rename.rekeyAnchor): an allow at the method on a spec it moved
          in follows to newName, and a covered <component>.<method> unit anywhere follows too.
          Record the specs either rewrote
        type: local
      - stepNumber: 23
        description: >-
          Collect what names the method but is left alone: the specs whose description, intent or
          narrative text still carries the old name, and the gRPC endpoint bindings whose wire
          method still carries it. A rename never edits prose, and never changes a published wire
          name
        type: local
      - stepNumber: 24
        description: >-
          Rekey the debt register for real: every carried entry anchored at the method on a spec it
          moved in, or naming <component>.<method> in a covered unit, rewritten in place with every
          comment and all other formatting kept
        type: call
        targetComponent: project_config_repository
        targetMethod: rekeyCarried
      - stepNumber: 25
        description: >-
          Return the report: the component, from and to, the specs the method moved in, the specs
          whose references or lint allows were retargeted, the mentions left alone, the pinned
          symbol when one was set, and carried (each register edit)
        type: return
        outcome: renamed
  - name: moveRenamedSpecs
    sourcePath: src/core/provision.ts
    narrative:
      - stepNumber: 1
        description: Reload the component as the rewrite left it
        type: call
        targetComponent: spec_loader
        targetMethod: loadComponentSpec
      - stepNumber: 2
        description: Does the component's own interface move?
        type: branch
        condition: the component's interface named i<componentId> moves
        onFalseStep: 4
      - stepNumber: 3
        description: Reload the interface as the rewrite left it
        type: call
        targetComponent: spec_loader
        targetMethod: loadInterfaceSpec
      - stepNumber: 4
        description: Does the component's own implementation move?
        type: branch
        condition: the implementation named <componentId>_impl moves
        onFalseStep: 6
      - stepNumber: 5
        description: Reload the implementation as the rewrite left it
        type: call
        targetComponent: spec_loader
        targetMethod: loadImplementationSpec
      - stepNumber: 6
        description: >-
          Write the component under newId, its own id rewritten; the loader nests a member of a
          pattern under its owner
        type: call
        targetComponent: spec_loader
        targetMethod: saveComponentSpec
      - stepNumber: 7
        description: Save the moved interface?
        type: branch
        condition: the component's interface moves
        onFalseStep: 9
      - stepNumber: 8
        description: Write the interface under i<newId>, its id and component rewritten
        type: call
        targetComponent: spec_loader
        targetMethod: saveInterfaceSpec
      - stepNumber: 9
        description: Save the moved implementation?
        type: branch
        condition: the component's implementation moves
        onFalseStep: 13
      - stepNumber: 10
        description: Does the new path collide with the implementation's current file?
        type: branch
        condition: >-
          the implementation's new path is the file it already occupies (the nested layout, with a
          contract that keeps its id)
        onFalseStep: 12
      - stepNumber: 11
        description: 'Delete that file first: the loader refuses to write a spec over a file holding another id'
        type: local
      - stepNumber: 12
        description: >-
          Write the implementation under <newId>_impl, its id rewritten and its contract following a
          renamed interface
        type: call
        targetComponent: spec_loader
        targetMethod: saveImplementationSpec
      - stepNumber: 13
        description: Remove each moved spec's old file, found by its old id, and prune the folders left empty
        type: local
      - stepNumber: 14
        description: >-
          Drop the cached spec index again: the removed files changed the tree outside the save
          paths
        type: call
        targetComponent: spec_loader
        targetMethod: invalidateCache
      - stepNumber: 15
        description: Return — every renamed spec now sits under its new id and the file it left is gone
        type: return
        outcome: void
  - name: updateSpec
    narrative:
      - stepNumber: 1
        description: >-
          Load the stored spec the delta addresses, through the loader entry for its level — this
          component load and its five siblings; the L0 is a singleton whose load ignores the id
        type: call
        targetComponent: spec_loader
        targetMethod: loadComponentSpec
      - stepNumber: 2
        description: 'Guard: the addressed spec must exist'
        type: branch
        condition: no spec of that kind holds that id
        onFalseStep: 4
      - stepNumber: 3
        label: spec-missing
        description: Refuse an update to a spec that has not been defined
        type: throw
        error: 'spec-missing: no spec of that kind holds that id'
      - stepNumber: 4
        description: 'Guard: a system-kind update must actually address the singleton L0'
        type: branch
        condition: the kind is system and the id names neither the singleton nor the system's own name
        onFalseStep: 6
      - stepNumber: 5
        label: mis-selected-kind
        description: >-
          Refuse a mis-selected kind rather than silently rewriting the L0, and name the kind the
          caller probably meant
        type: throw
        error: 'mis-selected-kind: kind system targets the singleton L0'
      - stepNumber: 6
        description: 'Guard: every delta key must be a field of the level, or one of the delta''s own verbs'
        type: branch
        condition: the delta names a key the level's canonical schema does not know
        onFalseStep: 8
      - stepNumber: 7
        label: unknown-key
        description: >-
          Refuse the whole delta, naming each unknown key and its nearest known field — an unknown
          key is dropped on write, so the edit would report success and change nothing
        type: throw
        error: 'unknown-key: the delta names a field the level does not have'
      - stepNumber: 8
        description: >-
          Merge the delta onto the stored spec: references qualify against the spec's namespace
          first, identity-keyed arrays upsert element by element and honour their delete markers at
          every depth, narrative steps insert and delete in ascending order with every jump field
          relocating around them, a step whose type changes is rebuilt for its new type keeping its
          description and label, and `unset` removes the fields it names at the level it sits in
          while `[]` clears the list it names. A step delete is refused outright when it addresses
          no step, when a jump still targets it, when a restated label or description does not match
          it, or when it is a region header whose body would be left standing
        type: local
      - stepNumber: 9
        description: >-
          Resolve the narratives' symbolic label references against the merged numbering, a label
          supplied by the delta replacing the stored number it twins; an unresolved reference aborts
          the whole update, because a dropped reference would silently become a dangling numeric
          jump
        type: local
      - stepNumber: 10
        description: >-
          Collect every difference between the stored spec and the merged one as an addressed
          change, both read through the level's canonical schema so a key the writer would drop
          cannot count as a change — a narrative by step identity across the renumbering, so an
          insert reads as the step added, the shift as renumbered runs and the jumps that followed
          their targets as relocations, never as every later step rewritten — and name every path
          the delta carried that the write does not act on — one the schema drops at a depth the
          permissive delta cannot refuse, and one whose value the stored spec already held. Read the
          stored FILE raw as well and name every key it carries that the level's canonical schema
          does not know, each as `path: value` (strippedKeys): the parse already discarded them, and
          the write re-serializes through the schema, so they would otherwise be lost without a word
        type: local
      - stepNumber: 11
        description: Decide whether there is anything to write
        type: branch
        condition: the merged spec matches what is stored
        onFalseStep: 13
      - stepNumber: 12
        description: >-
          Write nothing, leave the stored updatedAt untouched, and report that the delta matched
          what is stored, naming the paths it did not act on; a caller asking only what the delta
          would do is answered the same way, because there is nothing it would do
        type: return
        outcome: unchanged
      - stepNumber: 13
        description: >-
          Run the caller's injected judgement on the merged spec — the last point before anything
          could reach disk, and run for a caller asking only what the delta would do as well, so an
          answer that reports changes reports a write that would really be accepted
        type: local
      - stepNumber: 14
        description: Decide whether the caller wanted the write or only the account of it
        type: branch
        condition: the caller asked only what the delta would do
        onFalseStep: 16
      - stepNumber: 15
        label: dry-run
        description: >-
          Answer with the changes the write would make, the paths it would not act on and the stored
          keys it would drop (strippedKeys), marked as an account rather than a write: nothing is
          stamped and not one byte of the stored file moves
        type: return
        outcome: dry run
      - stepNumber: 16
        description: >-
          Stamp updatedAt and persist the merged spec through the saver for its level, allowing a
          deliberate status demotion when the delta carried an explicit status
        type: call
        targetComponent: spec_loader
        targetMethod: saveComponentSpec
      - stepNumber: 17
        description: >-
          Report what was written: every change it made, every path of the delta it did not act on,
          the stored keys the write dropped (strippedKeys), the store's placement notices and the
          judgement's warnings
        type: return
        outcome: written
  - name: repairForeignStepFields
    sourcePath: src/core/narrative-repair.ts
    narrative:
      - stepNumber: 1
        description: Load every implementation spec in the bound tree
        type: call
        targetComponent: spec_loader
        targetMethod: loadImplementationSpecs
      - stepNumber: 2
        label: impls
        description: Walk each implementation, collecting what its narratives carry that they cannot
        type: loop
        loopKind: forEach
        over: each loaded implementation
        endStep: 10
      - stepNumber: 3
        description: Walk every step of every one of its methods
        type: loop
        loopKind: forEach
        over: each step of each method's narrative, in method then step order
        endStep: 8
      - stepNumber: 4
        description: >-
          Read the step's foreign fields through narrative_step.foreignFields(), the one per-type
          table a retype also rebuilds against
        type: local
      - stepNumber: 5
        description: A step whose every field belongs to its type is left alone
        type: branch
        condition: the step carries at least one foreign field
        onFalseStep: 8
      - stepNumber: 6
        description: >-
          Record the repair: the implementation id, the method name, the step number, the step's own
          type, and the foreign fields in declaration order
        type: local
      - stepNumber: 7
        description: >-
          Drop those fields from the step, in memory. Its type, description, label and every field
          its type does carry are untouched — the repair removes what means nothing, it never
          reinterprets the step
        type: local
      - stepNumber: 8
        label: stepsEnd
        description: On to the next step
        type: local
      - stepNumber: 9
        description: >-
          Only an implementation that changed is written, and only when the caller asked for the
          write
        type: branch
        condition: apply, and this implementation had at least one step repaired
        onFalseStep: 2
      - stepNumber: 10
        description: Save the repaired implementation spec
        type: call
        targetComponent: spec_loader
        targetMethod: saveImplementationSpec
      - stepNumber: 11
        description: Answer with every repair, planned or written
        type: return
        outcome: the repairs, in tree order
  - name: loadTypeSpec
    narrative:
      - stepNumber: 1
        description: Call loadTypeSpec on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: loadTypeSpec
  - name: moveMethods
    narrative:
      - stepNumber: 1
        description: Load the source component spec
        type: call
        targetComponent: spec_loader
        targetMethod: loadComponentSpec
      - stepNumber: 2
        description: >-
          Check what the caller named: the source and target both exist and differ, every named
          method is declared on the source contract, no name is already declared on the target, the
          target's receiving contract is decidable (none yet, one, or one named i<target>), no other
          spec already holds the id of a contract or implementation the move would create, and
          neither component sits inside a chained subproject
        type: local
      - stepNumber: 3
        description: Decide whether the request itself is answerable
        type: branch
        condition: any of those checks failed
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: >-
          Refuse before the first write, naming which check failed — a mistyped id must read as a
          mistyped id, never as a rule refusing the design
        type: throw
        error: unmovable request
      - stepNumber: 5
        description: >-
          Load the interfaces of both components, so the contract entries to move and the names
          already declared on the target are both in hand
        type: call
        targetComponent: spec_loader
        targetMethod: loadInterfaceSpecs
      - stepNumber: 6
        description: >-
          Build the plan in memory: the contract entries that leave the source interface and arrive
          on the target's — on i<target>, created at the source contract's status, when the target
          declares no contract yet — the implementation entries that travel with them carrying
          narrative, sourcePath, symbol, detail, intent, calls and findings — into <target>_impl,
          created inheriting the source implementation's sourcePath, when no implementation realizes
          the receiving contract — the specs it creates named for the report, and the dependencies
          the moved narratives call that the target does not have yet
        type: local
      - stepNumber: 7
        description: >-
          Load every implementation to find the references that name the old home: narrative call,
          register and dispatch steps, dispatch-table bindings, lifecycle entrypoints and `calls`
          entries. Prose and wire endpoint addresses are recorded as mentions and left alone — a
          move must not silently re-address an RPC
        type: call
        targetComponent: spec_loader
        targetMethod: loadImplementationSpecs
      - stepNumber: 8
        description: >-
          Describe the move as the debt register and the lint allows key findings by it
          (identity_rename): each spec the methods left re-homes the findings anchored at a moved
          method to the spec they arrived in, and <from>.<method> becomes <to>.<method> wherever a
          unit names it. Rekey every lint allow in the tree by it (identity_rename.rekeyAnchor),
          staging each spec it changes like any other reference: an allow at a moved method moves to
          the receiving spec, a covered unit follows in place
        type: local
      - stepNumber: 9
        description: Decide whether a judgement was injected
        type: branch
        condition: the caller passed write hooks
        onTrueStep: 10
        onFalseStep: 14
      - stepNumber: 10
        description: >-
          Judge the resulting source and target components at the write boundary; the hook throws to
          refuse
        type: local
      - stepNumber: 11
        description: Decide on the judgement
        type: branch
        condition: the hook refused the resulting target
        onTrueStep: 12
        onFalseStep: 14
      - stepNumber: 12
        description: >-
          Enumerate the other components of the source's subsystem as candidate homes and ask the
          hook to assess each without throwing, recording the dependencies each would have to add
          and the rule codes that would refuse it
        type: local
      - stepNumber: 13
        description: >-
          Answer with the refusal: the rule codes, and the candidates ranked cheapest legal home
          first with the requested target among them so its shortfall reads beside the rest. Nothing
          has reached disk
        type: return
        outcome: refused
      - stepNumber: 14
        description: >-
          Rekey the debt register as a DRY RUN: the register edits the move makes, computed and
          proven writable without disturbing the register's comments and formatting before anything
          is written — a register that cannot be edited that precisely refuses the move here
        type: call
        targetComponent: project_config_repository
        targetMethod: rekeyCarried
      - stepNumber: 15
        description: Decide whether the caller wanted the write
        type: branch
        condition: the caller asked for a dry run
        onTrueStep: 16
        onFalseStep: 17
      - stepNumber: 16
        description: >-
          Answer with the edits the move would have made, the register edits it would make, and
          write nothing
        type: return
        outcome: previewed
      - stepNumber: 17
        description: >-
          Write every edit in the plan — the specs it creates, both contracts, both implementations,
          and each referencing implementation — restoring the ones already written if any write
          fails, and deleting any it created, because a half-moved method leaves callers naming a
          home it no longer has
        type: call
        targetComponent: spec_loader
        targetMethod: saveImplementationSpec
      - stepNumber: 18
        description: >-
          Rekey the debt register for real, as the last write of the move and inside the same guard:
          a register that cannot be written restores every spec already written, so nothing moves by
          halves
        type: call
        targetComponent: project_config_repository
        targetMethod: rekeyCarried
      - stepNumber: 19
        description: >-
          Answer with what moved, what the move created, how many references followed it, the
          register edits it made, and the prose still naming the old home
        type: return
        outcome: moved
  - name: specPathsInScope
    narrative:
      - stepNumber: 1
        description: >-
          Walk the spec tree's own layout and collect every spec file path inside the scope, or all
          of them when no subsystem was named
        type: local
      - stepNumber: 2
        description: >-
          Answer the paths, so an approval taken over part of a tree records exactly which files it
          covers rather than implying the whole
        type: return
        outcome: paths
  - name: loadSpec
    narrative:
      - stepNumber: 1
        description: Load the spec of that kind through the loader
        type: call
        targetComponent: spec_loader
        targetMethod: loadSpec
  - name: saveSpec
    narrative:
      - stepNumber: 1
        description: Persist the spec of that kind through the loader
        type: call
        targetComponent: spec_loader
        targetMethod: saveSpec
  - name: deleteSpec
    narrative:
      - stepNumber: 1
        description: Delete the spec document of that kind through the loader
        type: call
        targetComponent: spec_loader
        targetMethod: deleteSpec
  - name: findChainingParent
    narrative:
      - stepNumber: 1
        description: >-
          Walk up from the child root, below the ceiling when one is given, through the spec
          loader's chaining detection
        type: call
        targetComponent: spec_loader
        targetMethod: findChainingParent
  - name: scanAllSpecs
    narrative:
      - stepNumber: 1
        description: >-
          Read the bound root's workspace index at the requested recursion depth: the cached one
          while the tree's file signature is unchanged, else a fresh scan
        type: local
      - stepNumber: 2
        description: Return the index
        type: return
        outcome: success
  - name: getLoaderIssues
    narrative:
      - stepNumber: 1
        description: Return the bound root workspace's recorded loader issues
        type: return
        outcome: success
  - name: clearLoaderIssues
    narrative:
      - stepNumber: 1
        description: Empty the bound root workspace's recorded loader issues
        type: local
      - stepNumber: 2
        description: Drop every cached spec index so the next read starts from disk
        type: call
        targetComponent: spec_loader
        targetMethod: invalidateCache
  - name: findLegacySpecFiles
    narrative:
      - stepNumber: 1
        description: >-
          List the bound tree's spec files, and pair each one stored under a legacy (undotted) file
          name with the name the current layout expects
        type: local
      - stepNumber: 2
        description: Return the pairs
        type: return
        outcome: success
  - name: findChainingSubprojectsMissingConfig
    sourcePath: src/core/provision.ts
    narrative:
      - stepNumber: 1
        description: >-
          Walk the members recursively from the root — each project's `members` entries and, for one
          release, its legacy L1 mounts — and keep each directory that holds a spec tree but no
          project configuration
        type: local
      - stepNumber: 2
        description: Return the directories
        type: return
        outcome: success
  - name: backfillChainedSubprojectConfigs
    sourcePath: src/core/provision.ts
    narrative:
      - stepNumber: 1
        description: >-
          Walk the members recursively from the root, either declaration form; for each that holds a
          spec tree but no project configuration, write a default configuration named for its alias
          and declaring the alias as its project id, leaving its specs untouched
        type: local
      - stepNumber: 2
        description: Return the directories repaired
        type: return
        outcome: success
  - name: assertContainedProjectPath
    narrative:
      - stepNumber: 1
        description: Resolve the projectPath against the root
        type: local
      - stepNumber: 2
        description: Does the path escape the root — absolute, parent-escaping or through a link?
        type: branch
        condition: the resolved path escapes the root
        onFalseStep: 4
      - stepNumber: 3
        description: Refuse the path, naming it and the root
        type: throw
        error: Error
      - stepNumber: 4
        label: contained
        description: Return the contained absolute child root
        type: return
        outcome: success
  - name: loadProjectVariants
    sourcePath: src/core/variants.ts
    narrative:
      - stepNumber: 1
        description: Load the layered variant registry
        type: call
        targetComponent: variant_registry_adapter
        targetMethod: loadProjectVariants
  - name: resolveVariantGuidance
    sourcePath: src/core/variants.ts
    narrative:
      - stepNumber: 1
        description: Resolve the component's variant guidance and siblings
        type: call
        targetComponent: variant_registry_adapter
        targetMethod: resolveVariantGuidance
  - name: setProjectId
    narrative:
      - stepNumber: 1
        description: Write through the project config Repository
        type: call
        targetComponent: project_config_repository
        targetMethod: setId
  - name: declareExternal
    narrative:
      - stepNumber: 1
        description: Write through the project config Repository
        type: call
        targetComponent: project_config_repository
        targetMethod: declareExternal
  - name: moveMountToMembers
    sourcePath: src/core/provision.ts
    narrative:
      - stepNumber: 1
        description: >-
          Read the project graph of the bound root: the member the alias declares, with its legacy
          mount as written (projectPath, description)
        type: call
        targetComponent: spec_loader
        targetMethod: graph
      - stepNumber: 2
        description: Is there a legacy mount under the alias?
        type: branch
        condition: the bound root declares no member under the alias in the legacy L1 form
        onFalseStep: 4
      - stepNumber: 3
        description: >-
          Nothing to move: answer false when the alias is already an equal member, else refuse
          naming the alias
        type: return
        outcome: already moved
      - stepNumber: 4
        label: declare
        description: >-
          Declare the member under the alias — the mount's projectPath as its path, its description
          when it has one — through the project config Repository; a different member under the
          alias is refused there and nothing below runs
        type: call
        targetComponent: project_config_repository
        targetMethod: declareMember
      - stepNumber: 5
        description: >-
          Delete the L1 mount document through the spec repository, so the member is declared in one
          place
        type: call
        targetComponent: spec_loader
        targetMethod: deleteMount
      - stepNumber: 6
        description: Answer that it wrote
        type: return
        outcome: moved
  - name: normalizeReferences
    sourcePath: src/core/provision.ts
    narrative:
      - stepNumber: 1
        description: Re-save the spec with its references in canonical form through the spec repository
        type: call
        targetComponent: spec_loader
        targetMethod: normalizeReferences
