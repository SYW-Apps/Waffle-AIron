id: core_orchestrator_impl
name: Core Orchestrator Implementation
description: >-
  Concrete implementation of the Core Orchestrator: spec tree read/write workflows in
  src/core/specs.ts. Methods whose bodies live in sibling core modules name them in their own
  sourcePath: the provisioning, chained-subsystem and rename workflows in provision.ts, and the
  Specialist retirement in stereotype-migration.ts. The lock, state-hash and diagram forwards
  realized in lockfile.ts, statehash.ts and diagram.ts, republished by the core portal barrel, keep
  their method-realization checks dialed off.
contract: icore_orchestrator
sourcePath: src/core/specs.ts
methods:
  - name: loadSystemSpec
    narrative:
      - stepNumber: 1
        description: Call loadSystemSpec on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: loadSystemSpec
  - name: loadSubsystemSpecs
    narrative:
      - stepNumber: 1
        description: Call loadSubsystemSpecs on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: loadSubsystemSpecs
  - name: loadComponentSpecs
    narrative:
      - stepNumber: 1
        description: Call loadComponentSpecs on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: loadComponentSpecs
  - name: loadInterfaceSpecs
    narrative:
      - stepNumber: 1
        description: Call loadInterfaceSpecs on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: loadInterfaceSpecs
  - name: loadImplementationSpecs
    narrative:
      - stepNumber: 1
        description: Call loadImplementationSpecs on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: loadImplementationSpecs
  - name: loadSubsystemSpec
    narrative:
      - stepNumber: 1
        description: Call loadSubsystemSpec on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: loadSubsystemSpec
  - name: loadComponentSpec
    narrative:
      - stepNumber: 1
        description: Call loadComponentSpec on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: loadComponentSpec
  - name: loadInterfaceSpec
    narrative:
      - stepNumber: 1
        description: Call loadInterfaceSpec on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: loadInterfaceSpec
  - name: loadImplementationSpec
    narrative:
      - stepNumber: 1
        description: Call loadImplementationSpec on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: loadImplementationSpec
  - name: provisionProject
    sourcePath: src/core/provision.ts
    narrative:
      - stepNumber: 1
        description: >-
          Compose a default ProjectConfig declaring the id `name` slugified
          (project_config.effectiveId of the composed configuration) and a bootstrap L0 SystemSpec
          named `name`
        type: local
      - stepNumber: 2
        description: >-
          Write the default configuration through the project config Repository first, so a root
          that already has one is refused before anything is written
        type: call
        targetComponent: project_config_repository
        targetMethod: create
      - stepNumber: 3
        description: Persist the L0 system spec via the spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: saveSystemSpec
    conformance: 'off'
  - name: computeStateId
    narrative:
      - stepNumber: 1
        description: Delegate to state_hash
        type: call
        targetComponent: state_hash
        targetMethod: compute
    conformance: 'off'
  - name: readLockRecord
    narrative:
      - stepNumber: 1
        description: Read the lock record via the lock store
        type: call
        targetComponent: lock_store
        targetMethod: read
    conformance: 'off'
  - name: writeLockRecord
    narrative:
      - stepNumber: 1
        description: Write the lock record via the lock store
        type: call
        targetComponent: lock_store
        targetMethod: write
    conformance: 'off'
  - name: renderDiagram
    narrative:
      - stepNumber: 1
        description: Delegate to architecture_diagrams
        type: call
        targetComponent: architecture_diagrams
        targetMethod: render
    conformance: 'off'
  - name: createMember
    sourcePath: src/core/provision.ts
    narrative:
      - stepNumber: 1
        description: Guard the alias and the path
        type: branch
        condition: the alias is outside [a-z0-9-_]+ or the path is empty
        onFalseStep: 3
      - stepNumber: 2
        description: 'Reject: a member needs an alias of [a-z0-9-_]+ and a path'
        type: throw
        error: an alias and a path are required to create a member
      - stepNumber: 3
        description: Resolve the member directory by joining the bound project root with the path
        type: local
      - stepNumber: 4
        description: >-
          Containment guard: reject a path that escapes the declaring project. The member directory
          must resolve strictly within the bound project root, lexically and through links
        type: branch
        condition: >-
          the resolved child project directory is not contained within the bound project root (an
          absolute path or a ../-escaping projectPath)
        onFalseStep: 6
      - stepNumber: 5
        description: Reject a path that resolves outside the project root
        type: throw
        error: a member path must resolve within the project root
      - stepNumber: 6
        description: >-
          Scope the project root to the member directory, so the next reads and writes address the
          member project
        type: local
      - stepNumber: 7
        description: Check whether the member already has a configuration
        type: call
        targetComponent: project_config_repository
        targetMethod: exists
      - stepNumber: 8
        description: 'Complete only what is missing: an existing configuration is never overwritten'
        type: branch
        condition: the member has no configuration
        onFalseStep: 10
      - stepNumber: 9
        description: >-
          Write the member's default configuration, named after the alias (or the display name
          given) and declaring the alias as its project id, through the project config Repository
        type: call
        targetComponent: project_config_repository
        targetMethod: create
      - stepNumber: 10
        label: bootstrap_l0
        description: 'Keep an existing spec tree intact: bootstrap an L0 only for a member that has none'
        type: branch
        condition: the member has no L0 system spec
        onFalseStep: 12
      - stepNumber: 11
        description: >-
          Persist the member's bootstrap L0 system spec, creating its specs directory — its vision
          is the description given, else one line naming it a member of this project — so a fresh
          member becomes runnable standalone
        type: call
        targetComponent: spec_loader
        targetMethod: saveSystemSpec
      - stepNumber: 12
        description: Restore the declaring project's scope
        type: local
      - stepNumber: 13
        label: declare
        description: >-
          Declare the member in the declaring project's `members` — the path as given, the
          description when one is given — through the project config Repository; an equal
          declaration writes nothing and a different one under the alias is refused. No L1 spec is
          written: a member carries no content in its parent
        type: call
        targetComponent: project_config_repository
        targetMethod: declareMember
      - stepNumber: 14
        description: Member declared and its project ensured
        type: return
        outcome: member created
    conformance: 'off'
  - name: moveMember
    sourcePath: src/core/provision.ts
    narrative:
      - stepNumber: 1
        description: >-
          Read the project graph of the bound root: the member the alias declares, with its
          declaration form and path
        type: call
        targetComponent: spec_loader
        targetMethod: graph
      - stepNumber: 2
        description: Guard that the alias declares a member
        type: branch
        condition: the bound root declares no member under the alias
        onFalseStep: 4
      - stepNumber: 3
        description: 'Reject: the alias names no member'
        type: throw
        error: no member is declared under that alias
      - stepNumber: 4
        label: legacy
        description: Is the member still declared in the legacy L1 form?
        type: branch
        condition: the member is declared by a legacy L1 mount
        onFalseStep: 9
      - stepNumber: 5
        label: carries-fields
        description: Does the legacy mount carry more than a path and a description?
        type: branch
        condition: >-
          the mount's L1 spec carries a field beyond projectPath and description that its member
          would have to hold: a non-empty publicInterfaces or trustedLinks, a lint allow, a
          lifecycle, profile, targetLanguage, designDepth or ext
        onFalseStep: 7
      - stepNumber: 6
        description: >-
          Refuse before anything is written, naming the fields and pointing at `wairon doctor
          --fix`, whose chaining migration carries them into the member plan-first — a move never
          drops a field
        type: throw
        error: the legacy mount carries fields a move cannot carry
      - stepNumber: 7
        label: declare
        description: >-
          Move the declaration into `members` first (its current path, the mount's description), so
          wairon never rewrites the L1 form
        type: call
        targetComponent: project_config_repository
        targetMethod: declareMember
      - stepNumber: 8
        description: Delete the L1 mount document
        type: call
        targetComponent: spec_loader
        targetMethod: deleteMount
      - stepNumber: 9
        label: relocate
        description: >-
          Resolve the old and new member directories from the bound project root under the
          containment guard; reject a target that already exists; relocate the directory on disk
        type: local
      - stepNumber: 10
        description: Point the `members` entry at the new path
        type: call
        targetComponent: project_config_repository
        targetMethod: setMemberPath
    conformance: 'off'
  - name: externalizeSubsystem
    sourcePath: src/core/provision.ts
    narrative:
      - stepNumber: 1
        description: Load the target subsystem
        type: call
        targetComponent: spec_loader
        targetMethod: loadSubsystemSpec
      - stepNumber: 2
        description: Guard the subsystem exists and is a subsystem
        type: branch
        condition: the subsystem is missing, or is a legacy mount (a member declaration, not a subsystem)
        onFalseStep: 4
      - stepNumber: 3
        description: 'Reject: cannot externalize a missing subsystem or a member'
        type: throw
        error: 'cannot externalize: subsystem is missing or is already a member'
      - stepNumber: 4
        description: >-
          With the project root scoped to the member directory at the path (under the containment
          guard), write the member's default configuration — declaring the externalized subsystem's
          id as its project id — through the project config Repository
        type: call
        targetComponent: project_config_repository
        targetMethod: create
      - stepNumber: 5
        description: Persist the member's bootstrap L0 system spec (still scoped to the member root)
        type: call
        targetComponent: spec_loader
        targetMethod: saveSystemSpec
      - stepNumber: 6
        description: >-
          Move the subsystem's spec subtree (its .index.yaml, components, interfaces,
          implementations, and types) into the member's specs dir, re-expressing each moved
          implementation's file paths — sourcePath, each method's sourcePath, simPath — relative to
          the member root (the same files; code is never moved). The moved subsystem is now keyed
          `<id>::<id>`; every other moved spec `<id>::<local>`. Each reference that now crosses the
          boundary is re-expressed so it keeps binding its old target — the parent's references into
          the moved subtree (components, contracts and the types it takes along) as `<id>::<local>`,
          the moved subtree's component and contract references back into the parent as `<parent
          id>::<local>`, and a `super::` the moved subtree wrote as `<project id>::<local>` by the
          project the scan bound it to — never as `super::`. A type the moved subtree names in the
          parent resolves by name from any project and stays as written. A moved `super::` whose
          target lies beyond the bound root's reach has no such text: it is refused before anything
          moves (run from the top project, `wairon doctor --fix` rewrites it first)
        type: local
      - stepNumber: 7
        description: >-
          Back in the parent's scope, declare the member in `members` under the subsystem id with
          the path — no L1 mount is written
        type: call
        targetComponent: project_config_repository
        targetMethod: declareMember
      - stepNumber: 8
        description: >-
          Re-save every spec on either side whose references now cross the new boundary, targets
          unchanged, so the writer spells each again from where it lives: the parent's references
          into the member as `alias::name`, the member's references back into the parent as `<parent
          id>::name`
        type: call
        targetComponent: spec_loader
        targetMethod: normalizeReferences
      - stepNumber: 9
        description: >-
          Under the member's scope, declare the parent as an external under the parent's id when the
          moved specs reference it (the same declaration again writes nothing)
        type: call
        targetComponent: project_config_repository
        targetMethod: declareExternal
      - stepNumber: 10
        description: >-
          Re-point the parent L0 entries that re-exported the subsystem (`from: <subsystem>`) at the
          member (`from: <alias>`) — restating what was already exported, never adding to it — and
          drop the spec cache. The exports each side newly needs are left to `wairon doctor --fix`;
          EXTERNAL_NOT_EXPORTED names them until then
        type: call
        targetComponent: spec_loader
        targetMethod: saveSystemSpec
      - stepNumber: 11
        description: Subsystem externalized into a member project
        type: return
        outcome: externalized
    conformance: 'off'
  - name: internalizeMember
    sourcePath: src/core/provision.ts
    narrative:
      - stepNumber: 1
        description: >-
          Read the project graph of the bound root: the member under the alias, its declaration
          form, its subsystems, members and externals
        type: call
        targetComponent: spec_loader
        targetMethod: graph
      - stepNumber: 2
        description: Guard the alias declares a member
        type: branch
        condition: the bound root declares no member under the alias
        onFalseStep: 4
      - stepNumber: 3
        description: 'Reject: the alias names no member'
        type: throw
        error: 'cannot internalize: no member is declared under that alias'
      - stepNumber: 4
        description: Guard the member can be taken in whole
        type: branch
        condition: >-
          the member holds more than one subsystem, or declares members or externals of its own
          other than the parent
        onFalseStep: 6
      - stepNumber: 5
        description: >-
          Reject: a multi-subsystem member (stage 6) or one whose own members and externals would
          have no home here
        type: throw
        error: >-
          cannot internalize: the member is not a single subsystem, or declares members or externals
          of its own
      - stepNumber: 6
        label: referenced
        description: Does another project of the family reference the member?
        type: branch
        condition: >-
          a project of the family other than the bound root and the member itself references the
          member (the graph's cross-project references)
        onFalseStep: 8
      - stepNumber: 7
        description: >-
          Refuse before anything is written, listing each such reference (the project, the spec and
          the text as written): internalizing would leave them naming a project that no longer
          exists, and rewriting other projects is the family migration's job, named and dry-run
          first
        type: throw
        error: 'cannot internalize: other projects of the family reference the member'
      - stepNumber: 8
        label: take-in
        description: >-
          Delete its legacy L1 mount document first (false, writing nothing, for a member declared
          in `members`), so the moved subsystem can take the folder the mount document held
        type: call
        targetComponent: spec_loader
        targetMethod: deleteMount
      - stepNumber: 9
        description: >-
          Move the member's spec subtree under the bound project's specs — its subsystem folder and
          any project-level spec files beside it, refused before anything moves when one would land
          on an existing file — its keys becoming local, and re-express each moved implementation's
          file paths — sourcePath, each method's sourcePath, simPath — relative to the bound root.
          Each reference that crossed the old boundary is re-expressed with the target the scan
          bound it to before the move, so the re-save below keeps every target
        type: local
      - stepNumber: 10
        description: >-
          Remove the member from `members` (false, writing nothing, for a member declared in the
          legacy form)
        type: call
        targetComponent: project_config_repository
        targetMethod: removeMember
      - stepNumber: 11
        description: Delete the member's .wai project (project.yaml + specs)
        type: local
      - stepNumber: 12
        description: >-
          Re-save every spec that referenced across the old boundary, targets unchanged: the
          parent's `alias::name` references and the moved specs' `<parent id>::name` references
          become local ids
        type: call
        targetComponent: spec_loader
        targetMethod: normalizeReferences
      - stepNumber: 13
        description: >-
          Re-point the parent L0 entries that re-exported from the member (`from: <alias>`) at the
          moved subsystem, and drop the spec cache
        type: call
        targetComponent: spec_loader
        targetMethod: saveSystemSpec
      - stepNumber: 14
        description: Member internalized into the bound project
        type: return
        outcome: internalized
    conformance: 'off'
  - name: loadTypeSpecs
    narrative:
      - stepNumber: 1
        description: Call loadTypeSpecs on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: loadTypeSpecs
  - name: dryRunSerializeSpecs
    narrative:
      - stepNumber: 1
        description: Delegate the in-memory round-trip serialization check to spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: dryRunSerializeSpecs
  - name: buildProjectGraph
    narrative:
      - stepNumber: 1
        description: Forward to the pure graph projection of architecture_diagrams
        type: call
        targetComponent: architecture_diagrams
        targetMethod: buildGraphModel
    detail: calls-only
  - name: resolveChainingParent
    narrative:
      - stepNumber: 1
        description: Detect the chaining-mount context through the spec loader's read face
        type: call
        targetComponent: spec_loader
        targetMethod: findChainingParent
  - name: computeStateIdAt
    narrative:
      - stepNumber: 1
        description: >-
          Bind the given root READ-ONLY for the duration of this computation, remembering the
          previous binding; a root with no loadable spec tree short-circuits to null
        type: local
      - stepNumber: 2
        description: Digest the bound tree into its deterministic StateId
        type: call
        targetComponent: state_hash
        targetMethod: compute
      - stepNumber: 3
        description: Restore the previous root binding unconditionally (also on failure paths)
        type: local
      - stepNumber: 4
        description: Return the computed state hash
        type: return
        outcome: StateId or null
  - name: resolveSubprojectForNamespace
    narrative:
      - stepNumber: 1
        description: Resolve the mount through the spec loader's read face
        type: call
        targetComponent: spec_loader
        targetMethod: resolveSubprojectForNamespace
  - name: createProjectConfig
    narrative:
      - stepNumber: 1
        description: Write the fresh configuration through the project config Repository
        type: call
        targetComponent: project_config_repository
        targetMethod: create
    conformance: 'off'
  - name: upsertPackSelection
    narrative:
      - stepNumber: 1
        description: Write through the project config Repository
        type: call
        targetComponent: project_config_repository
        targetMethod: upsertPackSelection
    conformance: 'off'
  - name: removePackSelection
    narrative:
      - stepNumber: 1
        description: Write through the project config Repository
        type: call
        targetComponent: project_config_repository
        targetMethod: removePackSelection
    conformance: 'off'
  - name: setProjectType
    narrative:
      - stepNumber: 1
        description: Write through the project config Repository
        type: call
        targetComponent: project_config_repository
        targetMethod: setProjectType
    conformance: 'off'
  - name: recordProfileSelection
    narrative:
      - stepNumber: 1
        description: Write through the project config Repository
        type: call
        targetComponent: project_config_repository
        targetMethod: recordProfileSelection
    conformance: 'off'
  - name: setExecutionTier
    narrative:
      - stepNumber: 1
        description: Write through the project config Repository
        type: call
        targetComponent: project_config_repository
        targetMethod: setExecutionTier
    conformance: 'off'
  - name: registerPackRef
    narrative:
      - stepNumber: 1
        description: Write through the project config Repository
        type: call
        targetComponent: project_config_repository
        targetMethod: registerPackRef
    conformance: 'off'
  - name: deregisterPackRef
    narrative:
      - stepNumber: 1
        description: Write through the project config Repository
        type: call
        targetComponent: project_config_repository
        targetMethod: deregisterPackRef
    conformance: 'off'
  - name: markSelectionsBundled
    narrative:
      - stepNumber: 1
        description: Write through the project config Repository
        type: call
        targetComponent: project_config_repository
        targetMethod: markSelectionsBundled
    conformance: 'off'
  - name: ensureProjectInitialized
    sourcePath: src/core/provision.ts
    narrative:
      - stepNumber: 1
        description: Check whether the bound root already holds an L0 system spec
        type: local
      - stepNumber: 2
        description: Does a system spec exist?
        type: branch
        condition: a system spec exists at the bound root
        onFalseStep: 4
      - stepNumber: 3
        description: Prefer the existing system spec's name over the fallback
        type: call
        targetComponent: spec_loader
        targetMethod: loadSystemSpec
      - stepNumber: 4
        description: Does the project already have a configuration?
        type: call
        targetComponent: project_config_repository
        targetMethod: exists
      - stepNumber: 5
        description: Complete only what is missing
        type: branch
        condition: the project has no configuration
        onFalseStep: 7
      - stepNumber: 6
        description: >-
          Create the default configuration under the chosen name, declaring the given id, else the
          chosen name slugified
        type: call
        targetComponent: project_config_repository
        targetMethod: create
      - stepNumber: 7
        description: Is the system spec still missing?
        type: branch
        condition: no system spec exists at the bound root
        onFalseStep: 9
      - stepNumber: 8
        description: Write the bootstrap L0 system spec under the chosen name
        type: call
        targetComponent: spec_loader
        targetMethod: saveSystemSpec
      - stepNumber: 9
        description: Invalidate the spec cache when anything was written
        type: local
      - stepNumber: 10
        description: Report which files were written
        type: return
        outcome: ProjectBootstrap
  - name: listDirectChainedSubprojects
    sourcePath: src/core/provision.ts
    narrative:
      - stepNumber: 1
        description: >-
          Read the project's member declarations at that root: its project.yaml `members`
          (project_config.declaredMembers(), read through that root's binding, as the scan reads a
          root's configuration) and, for one release, the subsystem specs of its own tree carrying a
          projectPath; a `members` entry wins over a legacy mount under the same alias
        type: local
      - stepNumber: 2
        description: Walk the member declarations
        type: loop
        loopKind: forEach
        over: the project's member declarations, members entries first
        endStep: 4
      - stepNumber: 3
        description: Resolve the path inside the project root; an absolute or escaping path is skipped
        type: local
      - stepNumber: 4
        description: Record the member's directory with its alias and declaration form
        type: local
      - stepNumber: 5
        description: Return the direct members
        type: return
        outcome: ChainedSubprojectDir[]
  - name: readLockState
    narrative:
      - stepNumber: 1
        description: Read the persisted lock record through the lock store
        type: call
        targetComponent: lock_store
        targetMethod: read
      - stepNumber: 2
        description: No record means the project was never locked, a normal state rather than a fault
        type: branch
        condition: no lock record exists
        onFalseStep: 4
      - stepNumber: 3
        description: Return unlocked with no record, carrying current as the identity a lock would record
        type: return
        outcome: unlocked
      - stepNumber: 4
        description: >-
          Compare the recorded gate identity with the one the caller computed now; nothing is hashed
          here
        type: branch
        condition: the record's stateId equals current
        onFalseStep: 6
      - stepNumber: 5
        description: Return locked with the record and current
        type: return
        outcome: locked
      - stepNumber: 6
        description: >-
          Return stale with the record and current, keeping the record: staleness is a judgement
          about the record, so a caller can prompt for a re-lock rather than present the project as
          never frozen
        type: return
        outcome: stale
  - name: consumedContractInputs
    narrative:
      - stepNumber: 1
        description: List every chained mount root beneath the bound project, project-relative in walk order
        type: call
        targetComponent: spec_loader
        targetMethod: listChainedRoots
      - stepNumber: 2
        description: 'The roots to read: the bound root, then each chained root joined onto it'
        type: local
      - stepNumber: 3
        description: Read each root's consumed contract inputs
        type: loop
        loopKind: forEach
        over: the roots
        endStep: 5
      - stepNumber: 4
        description: >-
          Read the root's consumed contracts: its stored surface snapshots under .wai/surfaces, its
          pinned external snapshots under .wai/externals and its .wai/externals.lock.yaml. A missing
          directory or lock holds none, and a malformed file is skipped rather than aborting the
          read. Read locally: the snapshot and lock files are modelled in sdd_surfaces, which
          sdd_core must not depend on
        type: local
      - stepNumber: 5
        description: >-
          Reduce each to its canonical content key: a snapshot with its provenance (stateId,
          generatedAt, origin) stripped and the rest canonicalized, so re-pinning an unchanged
          contract never moves the key; the lock canonicalized whole, since its digests and `used`
          map are what a verdict consults. Each key names its kind (surface, external, lock) so
          equal content in two kinds never collides
        type: local
      - stepNumber: 6
        description: Return every root's content keys
        type: return
        outcome: string[]
  - name: retireSpecialists
    sourcePath: src/core/stereotype-migration.ts
    narrative:
      - stepNumber: 1
        description: Load every component spec in the bound tree
        type: call
        targetComponent: spec_loader
        targetMethod: loadComponentSpecs
      - stepNumber: 2
        description: >-
          Collect the Specialists, each unclassified. Gateways are not migrated here:
          STEREOTYPE_RETIRED gives their manual steps
        type: local
      - stepNumber: 3
        description: Classify over the dependency graph in passes, until a pass classifies nothing
        type: loop
        condition: the pass classified at least one Specialist
        loopKind: doWhile
        endStep: 14
      - stepNumber: 4
        description: Try each Specialist still unclassified
        type: loop
        loopKind: forEach
        over: each Specialist still unclassified
        endStep: 13
      - stepNumber: 5
        description: A Specialist with a dependency still unclassified waits for the next pass
        type: branch
        condition: 'every dependency is decided: none is a Specialist still unclassified'
        onFalseStep: 4
      - stepNumber: 6
        description: Pure when every dependency is pure
        type: branch
        condition: >-
          every dependency is pure: an Orchestrator declaring dependencyClass pure, or a Specialist
          classified pure
        onFalseStep: 9
      - stepNumber: 7
        description: Classify it pure
        type: local
      - stepNumber: 8
        description: Go record its reason
        type: jump
        toStep: 13
      - stepNumber: 9
        description: Read when every dependency is pure or read logic, or a data facade it may read
        type: branch
        condition: >-
          every dependency is pure or read logic (declared or classified), or a Repository, Index or
          Adapter
        onFalseStep: 12
      - stepNumber: 10
        description: Classify it read
        type: local
      - stepNumber: 11
        description: Go record its reason
        type: jump
        toStep: 13
      - stepNumber: 12
        description: 'Leave its class unset, a workflow Orchestrator: some dependency fits neither class'
        type: local
      - stepNumber: 13
        label: record
        description: Record the dependencies that decided its class as its reason
        type: local
      - stepNumber: 14
        description: Close the pass, noting whether it classified any Specialist
        type: local
      - stepNumber: 15
        description: >-
          Settle the Specialists still unclassified, those in a dependency cycle or waiting on one,
          with the weakest class that fits: read when every dependency is pure or read logic, a
          Repository, Index or Adapter, or another of them; otherwise unset. One left unset makes
          those depending on it unset in turn, until nothing changes. Each records the dependencies
          that decided it
        type: local
      - stepNumber: 16
        description: >-
          Read the project's own variants through the variant registry adapter, keeping those whose
          base is Specialist
        type: call
        targetComponent: variant_registry_adapter
        targetMethod: listProjectVariants
      - stepNumber: 17
        description: >-
          Compose the plan: retyped, each Specialist with its dependencyClass when set and its
          reason; rebasedVariants, the ids of those variants
        type: local
      - stepNumber: 18
        description: Without apply, nothing is written
        type: branch
        condition: apply is false
