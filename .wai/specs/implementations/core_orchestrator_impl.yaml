id: core_orchestrator_impl
name: Core Orchestrator Implementation
description: >-
  Concrete implementation of the Core Orchestrator: spec tree read/write workflows in
  src/core/specs.ts. Provisioning, chained-subsystem, lock, state-hash, and diagram forwarding
  methods are realized in sibling core modules (provision.ts, lockfile.ts, statehash.ts, diagram.ts)
  republished by the core portal barrel — their structural-conformance method checks are dialed off
  under the single-sourcePath Level 1 model; Level 2 dependency conformance will cover the edges.
contract: icore_orchestrator
sourcePath: src/core/specs.ts
methods:
  - name: loadSystemSpec
    narrative:
      - stepNumber: 1
        description: Call loadSystemSpec on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: loadSystemSpec
  - name: loadSubsystemSpecs
    narrative:
      - stepNumber: 1
        description: Call loadSubsystemSpecs on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: loadSubsystemSpecs
  - name: loadComponentSpecs
    narrative:
      - stepNumber: 1
        description: Call loadComponentSpecs on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: loadComponentSpecs
  - name: loadInterfaceSpecs
    narrative:
      - stepNumber: 1
        description: Call loadInterfaceSpecs on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: loadInterfaceSpecs
  - name: loadImplementationSpecs
    narrative:
      - stepNumber: 1
        description: Call loadImplementationSpecs on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: loadImplementationSpecs
  - name: loadSubsystemSpec
    narrative:
      - stepNumber: 1
        description: Call loadSubsystemSpec on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: loadSubsystemSpec
  - name: loadComponentSpec
    narrative:
      - stepNumber: 1
        description: Call loadComponentSpec on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: loadComponentSpec
  - name: loadInterfaceSpec
    narrative:
      - stepNumber: 1
        description: Call loadInterfaceSpec on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: loadInterfaceSpec
  - name: loadImplementationSpec
    narrative:
      - stepNumber: 1
        description: Call loadImplementationSpec on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: loadImplementationSpec
  - name: saveSystemSpec
    narrative:
      - stepNumber: 1
        description: Call saveSystemSpec on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: saveSystemSpec
  - name: saveSubsystemSpec
    narrative:
      - stepNumber: 1
        description: Call saveSubsystemSpec on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: saveSubsystemSpec
  - name: saveComponentSpec
    narrative:
      - stepNumber: 1
        description: Call saveComponentSpec on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: saveComponentSpec
  - name: saveInterfaceSpec
    narrative:
      - stepNumber: 1
        description: Call saveInterfaceSpec on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: saveInterfaceSpec
  - name: saveImplementationSpec
    narrative:
      - stepNumber: 1
        description: Call saveImplementationSpec on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: saveImplementationSpec
  - name: provisionProject
    narrative:
      - stepNumber: 1
        description: Compose a default ProjectConfig and a bootstrap L0 SystemSpec named `name`
        type: local
      - stepNumber: 2
        description: Persist the L0 system spec via the spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: saveSystemSpec
      - stepNumber: 3
        description: Write the default project.yaml config at the bound project root
        type: local
    conformance: 'off'
  - name: computeStateId
    narrative:
      - stepNumber: 1
        description: Delegate to the state hash specialist
        type: call
        targetComponent: state_hash_specialist
        targetMethod: hashSpecTree
    conformance: 'off'
  - name: readLockRecord
    narrative:
      - stepNumber: 1
        description: Read the lock record via the lock registry
        type: call
        targetComponent: lock_registry
        targetMethod: read
    conformance: 'off'
  - name: writeLockRecord
    narrative:
      - stepNumber: 1
        description: Write the lock record via the lock registry
        type: call
        targetComponent: lock_registry
        targetMethod: write
    conformance: 'off'
  - name: promoteAllComplete
    narrative:
      - stepNumber: 1
        description: Load subsystem specs
        type: call
        targetComponent: spec_loader
        targetMethod: loadSubsystemSpecs
      - stepNumber: 2
        description: For each subsystem
        type: loop
        loopKind: forEach
        over: subsystems
        endStep: 3
      - stepNumber: 3
        description: Re-save the subsystem with status complete
        type: call
        targetComponent: spec_loader
        targetMethod: saveSubsystemSpec
      - stepNumber: 4
        description: Load component specs
        type: call
        targetComponent: spec_loader
        targetMethod: loadComponentSpecs
      - stepNumber: 5
        description: For each component
        type: loop
        loopKind: forEach
        over: components
        endStep: 6
      - stepNumber: 6
        description: Re-save the component with status complete
        type: call
        targetComponent: spec_loader
        targetMethod: saveComponentSpec
      - stepNumber: 7
        description: Load interface specs
        type: call
        targetComponent: spec_loader
        targetMethod: loadInterfaceSpecs
      - stepNumber: 8
        description: For each interface
        type: loop
        loopKind: forEach
        over: interfaces
        endStep: 9
      - stepNumber: 9
        description: Re-save the interface with status complete
        type: call
        targetComponent: spec_loader
        targetMethod: saveInterfaceSpec
      - stepNumber: 10
        description: Load implementation specs
        type: call
        targetComponent: spec_loader
        targetMethod: loadImplementationSpecs
      - stepNumber: 11
        description: For each implementation
        type: loop
        loopKind: forEach
        over: implementations
        endStep: 12
      - stepNumber: 12
        description: Re-save the implementation with status complete
        type: call
        targetComponent: spec_loader
        targetMethod: saveImplementationSpec
    conformance: 'off'
  - name: renderDiagram
    narrative:
      - stepNumber: 1
        description: Delegate to the diagram specialist
        type: call
        targetComponent: diagram_specialist
        targetMethod: renderDiagram
    conformance: 'off'
  - name: createChainedSubsystem
    narrative:
      - stepNumber: 1
        description: Guard that the subsystem carries a projectPath
        type: branch
        condition: subsystem.projectPath is missing or empty
        onFalseStep: 3
      - stepNumber: 2
        description: 'Reject: a chained subsystem requires a projectPath'
        type: throw
        error: projectPath is required to create a chained subsystem
      - stepNumber: 3
        description: Persist the parent L1 subsystem spec (with projectPath) at the bound project root
        type: call
        targetComponent: spec_loader
        targetMethod: saveSubsystemSpec
      - stepNumber: 4
        description: >-
          Resolve the child project directory by joining the bound project root with
          subsystem.projectPath
        type: local
      - stepNumber: 5
        description: >-
          Containment guard: reject a projectPath that escapes the owning project. The child project
          directory must resolve to a location strictly within the bound project root
        type: branch
        condition: >-
          the resolved child project directory is not contained within the bound project root (an
          absolute path or a ../-escaping projectPath)
        onFalseStep: 7
      - stepNumber: 6
        description: Reject a projectPath that resolves outside the project root
        type: throw
        error: projectPath must resolve within the project root
      - stepNumber: 7
        description: >-
          Branch on whether the child is already fully initialized — both project.yaml and an L0
          system spec present
        type: branch
        condition: the child directory already has both project.yaml and an L0 system spec
        onTrueStep: 9
        onFalseStep: 8
      - stepNumber: 8
        description: >-
          Scope the project root to the child directory and NON-DESTRUCTIVELY complete its bootstrap
          — create the specs dir, project.yaml, and L0 system spec only when each is absent
          (preferring an existing system spec's name), so a fresh child becomes runnable standalone
          and a partially-scaffolded child is completed without overwriting its existing spec tree —
          then restore the parent root scope
        type: local
      - stepNumber: 9
        description: Chained subsystem wired and child project ensured
        type: return
        outcome: chained subsystem created
    conformance: 'off'
  - name: moveSubsystemProject
    narrative:
      - stepNumber: 1
        description: Load the target subsystem spec
        type: call
        targetComponent: spec_loader
        targetMethod: loadSubsystemSpec
      - stepNumber: 2
        description: Guard that the subsystem is an external subproject
        type: branch
        condition: the subsystem has no existing projectPath
        onFalseStep: 4
      - stepNumber: 3
        description: 'Reject: the subsystem is not an external subproject'
        type: throw
        error: subsystem has no projectPath to move (not an external subproject)
      - stepNumber: 4
        description: >-
          Resolve the old and new child directories from the bound project root; reject if the
          target already exists; relocate the subproject directory on disk and set the subsystem's
          projectPath to the new path
        type: local
      - stepNumber: 5
        description: Persist the subsystem spec with its updated projectPath
        type: call
        targetComponent: spec_loader
        targetMethod: saveSubsystemSpec
    conformance: 'off'
  - name: externalizeSubsystem
    narrative:
      - stepNumber: 1
        description: Load the target subsystem
        type: call
        targetComponent: spec_loader
        targetMethod: loadSubsystemSpec
      - stepNumber: 2
        description: Guard the subsystem exists and is currently internal
        type: branch
        condition: the subsystem is missing or already has a projectPath (already external)
        onFalseStep: 4
      - stepNumber: 3
        description: 'Reject: cannot externalize a missing or already-external subsystem'
        type: throw
        error: 'cannot externalize: subsystem is missing or already external'
      - stepNumber: 4
        description: >-
          Provision an isolated child project at projectPath (project.yaml + L0), scoped to the
          child root
        type: local
      - stepNumber: 5
        description: >-
          Move the subsystem's spec subtree (its .index.yaml, components, interfaces,
          implementations, and types) from the parent specs dir into the child specs dir
        type: local
      - stepNumber: 6
        description: >-
          Compose a minimal parent mount for the subsystem: id + parentSystem + projectPath with an
          empty public surface
        type: local
      - stepNumber: 7
        description: Persist the parent mount
        type: call
        targetComponent: spec_loader
        targetMethod: saveSubsystemSpec
      - stepNumber: 8
        description: >-
          Rewrite cross-subsystem references across the remaining parent specs (dependsOn, narrative
          call targets, type refs) from bare ids to the subsystem-namespaced ids
        type: local
      - stepNumber: 9
        description: Invalidate the spec cache
        type: local
      - stepNumber: 10
        description: Subsystem externalized into a standalone subproject
        type: return
        outcome: externalized
    conformance: 'off'
  - name: internalizeSubsystem
    narrative:
      - stepNumber: 1
        description: Load the target subsystem
        type: call
        targetComponent: spec_loader
        targetMethod: loadSubsystemSpec
      - stepNumber: 2
        description: Guard the subsystem exists and is currently external
        type: branch
        condition: the subsystem is missing or has no projectPath (not external)
        onFalseStep: 4
      - stepNumber: 3
        description: 'Reject: cannot internalize a missing or non-external subsystem'
        type: throw
        error: 'cannot internalize: subsystem is missing or not external'
      - stepNumber: 4
        description: Guard the subproject is a single flat subsystem matching the mount id
        type: branch
        condition: the subproject declares subsystems other than the mount id (a multi-subsystem system)
        onFalseStep: 6
      - stepNumber: 5
        description: 'Reject: the subproject is not a flat subsystem'
        type: throw
        error: 'cannot internalize: subproject is a multi-subsystem system, not a flat subsystem'
      - stepNumber: 6
        description: >-
          Move the subproject's spec subtree back under the parent subsystem folder, stripping the
          namespace
        type: local
      - stepNumber: 7
        description: Restore the parent subsystem spec from the child's realization, dropping projectPath
        type: local
      - stepNumber: 8
        description: Persist the internalized subsystem
        type: call
        targetComponent: spec_loader
        targetMethod: saveSubsystemSpec
      - stepNumber: 9
        description: Delete the child .wai project (project.yaml + specs)
        type: local
      - stepNumber: 10
        description: Rewrite references across the parent specs from the namespaced ids back to bare ids
        type: local
      - stepNumber: 11
        description: Invalidate the spec cache
        type: local
      - stepNumber: 12
        description: Subsystem internalized back into the parent tree
        type: return
        outcome: internalized
    conformance: 'off'
  - name: loadTypeSpecs
    narrative:
      - stepNumber: 1
        description: Call loadTypeSpecs on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: loadTypeSpecs
  - name: dryRunSerializeSpecs
    narrative:
      - stepNumber: 1
        description: Delegate the in-memory round-trip serialization check to spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: dryRunSerializeSpecs
  - name: buildProjectGraph
    narrative:
      - stepNumber: 1
        description: Forward to the diagram specialist's pure graph projection
        type: call
        targetComponent: diagram_specialist
        targetMethod: buildGraphModel
    detail: calls-only
  - name: resolveChainingParent
    narrative:
      - stepNumber: 1
        description: Detect the chaining-mount context through the spec loader's read face
        type: call
        targetComponent: spec_loader
        targetMethod: findChainingParent
  - name: computeStateIdAt
    narrative:
      - stepNumber: 1
        description: >-
          Bind the given root READ-ONLY for the duration of this computation, remembering the
          previous binding; a root with no loadable spec tree short-circuits to null
        type: local
      - stepNumber: 2
        description: Digest the bound tree into its deterministic StateId
        type: call
        targetComponent: state_hash_specialist
        targetMethod: hashSpecTree
      - stepNumber: 3
        description: Restore the previous root binding unconditionally (also on failure paths)
        type: local
      - stepNumber: 4
        description: Return the computed state hash
        type: return
        outcome: StateId or null
  - name: computeGateStateId
    narrative:
      - stepNumber: 1
        description: >-
          Load the governing extension packs through the extension workflow (global then project,
          project winning on collision) — the doctrine the gate ran with.
        type: call
        targetComponent: extension_orchestrator
        targetMethod: loadProjectExtensions
      - stepNumber: 2
        description: >-
          Hand that doctrine to the state hash specialist, which digests it together with the spec
          tree.
        type: call
        targetComponent: state_hash_specialist
        targetMethod: hashGateState
      - stepNumber: 3
        description: Return the gate StateId.
        type: return
        outcome: gate StateId
    conformance: 'off'
lint:
  allow:
    - code: UNREALIZED_DEPENDENCY
      reason: >-
        The lock/state-hash forwarding methods are realized in sibling core modules (provision.ts,
        lockfile.ts, statehash.ts) — specs.ts itself never imports them; same split-file facade
        documented on the structural-conformance per-method offs.
status: complete
createdAt: '2026-06-19T12:00:00Z'
updatedAt: '2026-07-29T14:54:57.093Z'
