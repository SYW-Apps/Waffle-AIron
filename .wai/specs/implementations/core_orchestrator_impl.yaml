id: core_orchestrator_impl
name: Core Orchestrator Implementation
description: >-
  Concrete implementation of the Core Orchestrator: spec tree read/write workflows in
  src/core/specs.ts. Methods whose bodies live in sibling core modules name them in their own
  sourcePath: the provisioning, chained-subsystem and rename workflows in provision.ts, and the
  Specialist retirement in stereotype-migration.ts. The lock, state-hash and diagram forwards
  realized in lockfile.ts, statehash.ts and diagram.ts, republished by the core portal barrel, keep
  their method-realization checks dialed off.
contract: icore_orchestrator
sourcePath: src/core/specs.ts
methods:
  - name: loadSystemSpec
    narrative:
      - stepNumber: 1
        description: Call loadSystemSpec on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: loadSystemSpec
  - name: loadSubsystemSpecs
    narrative:
      - stepNumber: 1
        description: Call loadSubsystemSpecs on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: loadSubsystemSpecs
  - name: loadComponentSpecs
    narrative:
      - stepNumber: 1
        description: Call loadComponentSpecs on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: loadComponentSpecs
  - name: loadInterfaceSpecs
    narrative:
      - stepNumber: 1
        description: Call loadInterfaceSpecs on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: loadInterfaceSpecs
  - name: loadImplementationSpecs
    narrative:
      - stepNumber: 1
        description: Call loadImplementationSpecs on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: loadImplementationSpecs
  - name: loadSubsystemSpec
    narrative:
      - stepNumber: 1
        description: Call loadSubsystemSpec on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: loadSubsystemSpec
  - name: loadComponentSpec
    narrative:
      - stepNumber: 1
        description: Call loadComponentSpec on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: loadComponentSpec
  - name: loadInterfaceSpec
    narrative:
      - stepNumber: 1
        description: Call loadInterfaceSpec on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: loadInterfaceSpec
  - name: loadImplementationSpec
    narrative:
      - stepNumber: 1
        description: Call loadImplementationSpec on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: loadImplementationSpec
  - name: saveSystemSpec
    narrative:
      - stepNumber: 1
        description: Call saveSystemSpec on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: saveSystemSpec
  - name: saveSubsystemSpec
    narrative:
      - stepNumber: 1
        description: Call saveSubsystemSpec on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: saveSubsystemSpec
  - name: saveComponentSpec
    narrative:
      - stepNumber: 1
        description: Call saveComponentSpec on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: saveComponentSpec
  - name: saveInterfaceSpec
    narrative:
      - stepNumber: 1
        description: Call saveInterfaceSpec on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: saveInterfaceSpec
  - name: saveImplementationSpec
    narrative:
      - stepNumber: 1
        description: Call saveImplementationSpec on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: saveImplementationSpec
  - name: provisionProject
    sourcePath: src/core/provision.ts
    narrative:
      - stepNumber: 1
        description: Compose a default ProjectConfig and a bootstrap L0 SystemSpec named `name`
        type: local
      - stepNumber: 2
        description: >-
          Write the default configuration through the project config Repository first, so a root
          that already has one is refused before anything is written
        type: call
        targetComponent: project_config_repository
        targetMethod: create
      - stepNumber: 3
        description: Persist the L0 system spec via the spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: saveSystemSpec
    conformance: 'off'
  - name: computeStateId
    narrative:
      - stepNumber: 1
        description: Delegate to state_hash
        type: call
        targetComponent: state_hash
        targetMethod: compute
    conformance: 'off'
  - name: readLockRecord
    narrative:
      - stepNumber: 1
        description: Read the lock record via the lock store
        type: call
        targetComponent: lock_store
        targetMethod: read
    conformance: 'off'
  - name: writeLockRecord
    narrative:
      - stepNumber: 1
        description: Write the lock record via the lock store
        type: call
        targetComponent: lock_store
        targetMethod: write
    conformance: 'off'
  - name: renderDiagram
    narrative:
      - stepNumber: 1
        description: Delegate to architecture_diagrams
        type: call
        targetComponent: architecture_diagrams
        targetMethod: render
    conformance: 'off'
  - name: createChainedSubsystem
    sourcePath: src/core/provision.ts
    narrative:
      - stepNumber: 1
        description: Guard that the subsystem carries a projectPath
        type: branch
        condition: subsystem.projectPath is missing or empty
        onFalseStep: 3
      - stepNumber: 2
        description: 'Reject: a chained subsystem requires a projectPath'
        type: throw
        error: projectPath is required to create a chained subsystem
      - stepNumber: 3
        description: Persist the parent L1 subsystem spec (with projectPath) at the bound project root
        type: call
        targetComponent: spec_loader
        targetMethod: saveSubsystemSpec
      - stepNumber: 4
        description: >-
          Resolve the child project directory by joining the bound project root with
          subsystem.projectPath
        type: local
      - stepNumber: 5
        description: >-
          Containment guard: reject a projectPath that escapes the owning project. The child project
          directory must resolve to a location strictly within the bound project root
        type: branch
        condition: >-
          the resolved child project directory is not contained within the bound project root (an
          absolute path or a ../-escaping projectPath)
        onFalseStep: 7
      - stepNumber: 6
        description: Reject a projectPath that resolves outside the project root
        type: throw
        error: projectPath must resolve within the project root
      - stepNumber: 7
        description: >-
          Scope the project root to the child directory, so the next reads and writes address the
          child project
        type: local
      - stepNumber: 8
        description: Check whether the child already has a configuration
        type: call
        targetComponent: project_config_repository
        targetMethod: exists
      - stepNumber: 9
        description: 'Complete only what is missing: an existing configuration is never overwritten'
        type: branch
        condition: the child has no configuration
        onFalseStep: 11
      - stepNumber: 10
        description: >-
          Write the child's default configuration, named after the child, through the project config
          Repository
        type: call
        targetComponent: project_config_repository
        targetMethod: create
      - stepNumber: 11
        label: bootstrap_l0
        description: 'Keep an existing spec tree intact: bootstrap an L0 only for a child that has none'
        type: branch
        condition: the child has no L0 system spec
        onFalseStep: 13
      - stepNumber: 12
        description: >-
          Persist the child's bootstrap L0 system spec, creating its specs directory, so a fresh
          child becomes runnable standalone
        type: call
        targetComponent: spec_loader
        targetMethod: saveSystemSpec
      - stepNumber: 13
        description: Restore the parent root scope
        type: local
      - stepNumber: 14
        description: Chained subsystem wired and child project ensured
        type: return
        outcome: chained subsystem created
    conformance: 'off'
  - name: moveSubsystemProject
    sourcePath: src/core/provision.ts
    narrative:
      - stepNumber: 1
        description: Load the target subsystem spec
        type: call
        targetComponent: spec_loader
        targetMethod: loadSubsystemSpec
      - stepNumber: 2
        description: Guard that the subsystem is an external subproject
        type: branch
        condition: the subsystem has no existing projectPath
        onFalseStep: 4
      - stepNumber: 3
        description: 'Reject: the subsystem is not an external subproject'
        type: throw
        error: subsystem has no projectPath to move (not an external subproject)
      - stepNumber: 4
        description: >-
          Resolve the old and new child directories from the bound project root; reject if the
          target already exists; relocate the subproject directory on disk and set the subsystem's
          projectPath to the new path
        type: local
      - stepNumber: 5
        description: Persist the subsystem spec with its updated projectPath
        type: call
        targetComponent: spec_loader
        targetMethod: saveSubsystemSpec
    conformance: 'off'
  - name: externalizeSubsystem
    sourcePath: src/core/provision.ts
    narrative:
      - stepNumber: 1
        description: Load the target subsystem
        type: call
        targetComponent: spec_loader
        targetMethod: loadSubsystemSpec
      - stepNumber: 2
        description: Guard the subsystem exists and is currently internal
        type: branch
        condition: the subsystem is missing or already has a projectPath (already external)
        onFalseStep: 4
      - stepNumber: 3
        description: 'Reject: cannot externalize a missing or already-external subsystem'
        type: throw
        error: 'cannot externalize: subsystem is missing or already external'
      - stepNumber: 4
        description: >-
          With the project root scoped to the child directory at projectPath, write the child's
          default configuration through the project config Repository
        type: call
        targetComponent: project_config_repository
        targetMethod: create
      - stepNumber: 5
        description: >-
          Persist the child's bootstrap L0 system spec (still scoped to the child root), then return
          to the parent scope for the move
        type: call
        targetComponent: spec_loader
        targetMethod: saveSystemSpec
      - stepNumber: 6
        description: >-
          Move the subsystem's spec subtree (its .index.yaml, components, interfaces,
          implementations, and types) from the parent specs dir into the child specs dir,
          re-expressing each moved implementation's file paths — sourcePath, each method's
          sourcePath, simPath — relative to the child root (the same files; code is never moved)
        type: local
      - stepNumber: 7
        description: >-
          Compose a minimal parent mount for the subsystem: id + parentSystem + projectPath with an
          empty public surface
        type: local
      - stepNumber: 8
        description: Persist the parent mount
        type: call
        targetComponent: spec_loader
        targetMethod: saveSubsystemSpec
      - stepNumber: 9
        description: >-
          Rewrite cross-subsystem references across the remaining parent specs (dependsOn, narrative
          call targets, type refs) from bare ids to the subsystem-namespaced ids, and the moved
          subtree's own outgoing references (to the parent's other subsystems and to other chained
          projects) into super:: form
        type: local
      - stepNumber: 10
        description: Invalidate the spec cache
        type: local
      - stepNumber: 11
        description: Subsystem externalized into a standalone subproject
        type: return
        outcome: externalized
    conformance: 'off'
  - name: internalizeSubsystem
    sourcePath: src/core/provision.ts
    narrative:
      - stepNumber: 1
        description: Load the target subsystem
        type: call
        targetComponent: spec_loader
        targetMethod: loadSubsystemSpec
      - stepNumber: 2
        description: Guard the subsystem exists and is currently external
        type: branch
        condition: the subsystem is missing or has no projectPath (not external)
        onFalseStep: 4
      - stepNumber: 3
        description: 'Reject: cannot internalize a missing or non-external subsystem'
        type: throw
        error: 'cannot internalize: subsystem is missing or not external'
      - stepNumber: 4
        description: Guard the subproject is a single flat subsystem matching the mount id
        type: branch
        condition: the subproject declares subsystems other than the mount id (a multi-subsystem system)
        onFalseStep: 6
      - stepNumber: 5
        description: 'Reject: the subproject is not a flat subsystem'
        type: throw
        error: 'cannot internalize: subproject is a multi-subsystem system, not a flat subsystem'
      - stepNumber: 6
        description: >-
          Move the subproject's spec subtree back under the parent subsystem folder, stripping the
          namespace and re-expressing each moved implementation's file paths — sourcePath, each
          method's sourcePath, simPath — relative to the parent root
        type: local
      - stepNumber: 7
        description: Restore the parent subsystem spec from the child's realization, dropping projectPath
        type: local
      - stepNumber: 8
        description: Persist the internalized subsystem
        type: call
        targetComponent: spec_loader
        targetMethod: saveSubsystemSpec
      - stepNumber: 9
        description: Delete the child .wai project (project.yaml + specs)
        type: local
      - stepNumber: 10
        description: >-
          Rewrite references across the parent specs from the namespaced ids back to bare ids, and
          the moved subtree's super:: references back to their parent-local form
        type: local
      - stepNumber: 11
        description: Invalidate the spec cache
        type: local
      - stepNumber: 12
        description: Subsystem internalized back into the parent tree
        type: return
        outcome: internalized
    conformance: 'off'
  - name: loadTypeSpecs
    narrative:
      - stepNumber: 1
        description: Call loadTypeSpecs on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: loadTypeSpecs
  - name: dryRunSerializeSpecs
    narrative:
      - stepNumber: 1
        description: Delegate the in-memory round-trip serialization check to spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: dryRunSerializeSpecs
  - name: buildProjectGraph
    narrative:
      - stepNumber: 1
        description: Forward to the pure graph projection of architecture_diagrams
        type: call
        targetComponent: architecture_diagrams
        targetMethod: buildGraphModel
    detail: calls-only
  - name: resolveChainingParent
    narrative:
      - stepNumber: 1
        description: Detect the chaining-mount context through the spec loader's read face
        type: call
        targetComponent: spec_loader
        targetMethod: findChainingParent
  - name: computeStateIdAt
    narrative:
      - stepNumber: 1
        description: >-
          Bind the given root READ-ONLY for the duration of this computation, remembering the
          previous binding; a root with no loadable spec tree short-circuits to null
        type: local
      - stepNumber: 2
        description: Digest the bound tree into its deterministic StateId
        type: call
        targetComponent: state_hash
        targetMethod: compute
      - stepNumber: 3
        description: Restore the previous root binding unconditionally (also on failure paths)
        type: local
      - stepNumber: 4
        description: Return the computed state hash
        type: return
        outcome: StateId or null
  - name: resolveSubprojectForNamespace
    narrative:
      - stepNumber: 1
        description: Resolve the mount through the spec loader's read face
        type: call
        targetComponent: spec_loader
        targetMethod: resolveSubprojectForNamespace
  - name: createProjectConfig
    narrative:
      - stepNumber: 1
        description: Write the fresh configuration through the project config Repository
        type: call
        targetComponent: project_config_repository
        targetMethod: create
    conformance: 'off'
  - name: upsertPackSelection
    narrative:
      - stepNumber: 1
        description: Write through the project config Repository
        type: call
        targetComponent: project_config_repository
        targetMethod: upsertPackSelection
    conformance: 'off'
  - name: removePackSelection
    narrative:
      - stepNumber: 1
        description: Write through the project config Repository
        type: call
        targetComponent: project_config_repository
        targetMethod: removePackSelection
    conformance: 'off'
  - name: setProjectType
    narrative:
      - stepNumber: 1
        description: Write through the project config Repository
        type: call
        targetComponent: project_config_repository
        targetMethod: setProjectType
    conformance: 'off'
  - name: recordProfileSelection
    narrative:
      - stepNumber: 1
        description: Write through the project config Repository
        type: call
        targetComponent: project_config_repository
        targetMethod: recordProfileSelection
    conformance: 'off'
  - name: setExecutionTier
    narrative:
      - stepNumber: 1
        description: Write through the project config Repository
        type: call
        targetComponent: project_config_repository
        targetMethod: setExecutionTier
    conformance: 'off'
  - name: registerPackRef
    narrative:
      - stepNumber: 1
        description: Write through the project config Repository
        type: call
        targetComponent: project_config_repository
        targetMethod: registerPackRef
    conformance: 'off'
  - name: deregisterPackRef
    narrative:
      - stepNumber: 1
        description: Write through the project config Repository
        type: call
        targetComponent: project_config_repository
        targetMethod: deregisterPackRef
    conformance: 'off'
  - name: markSelectionsBundled
    narrative:
      - stepNumber: 1
        description: Write through the project config Repository
        type: call
        targetComponent: project_config_repository
        targetMethod: markSelectionsBundled
    conformance: 'off'
  - name: ensureProjectInitialized
    sourcePath: src/core/provision.ts
    narrative:
      - stepNumber: 1
        description: Check whether the bound root already holds an L0 system spec
        type: local
      - stepNumber: 2
        description: Does a system spec exist?
        type: branch
        condition: a system spec exists at the bound root
        onFalseStep: 4
      - stepNumber: 3
        description: Prefer the existing system spec's name over the fallback
        type: call
        targetComponent: spec_loader
        targetMethod: loadSystemSpec
      - stepNumber: 4
        description: Does the project already have a configuration?
        type: call
        targetComponent: project_config_repository
        targetMethod: exists
      - stepNumber: 5
        description: Complete only what is missing
        type: branch
        condition: the project has no configuration
        onFalseStep: 7
      - stepNumber: 6
        description: Create the default configuration under the chosen name
        type: call
        targetComponent: project_config_repository
        targetMethod: create
      - stepNumber: 7
        description: Is the system spec still missing?
        type: branch
        condition: no system spec exists at the bound root
        onFalseStep: 9
      - stepNumber: 8
        description: Write the bootstrap L0 system spec under the chosen name
        type: call
        targetComponent: spec_loader
        targetMethod: saveSystemSpec
      - stepNumber: 9
        description: Invalidate the spec cache when anything was written
        type: local
      - stepNumber: 10
        description: Report which files were written
        type: return
        outcome: ProjectBootstrap
  - name: listDirectChainedSubprojects
    sourcePath: src/core/provision.ts
    narrative:
      - stepNumber: 1
        description: Read every spec file in this project's own spec tree
        type: local
      - stepNumber: 2
        description: Walk the subsystem specs that declare a non-empty projectPath
        type: loop
        loopKind: forEach
        over: the subsystem specs with a projectPath
        endStep: 4
      - stepNumber: 3
        description: Resolve the projectPath inside the project root; an absolute or escaping path is skipped
        type: local
      - stepNumber: 4
        description: Record the child directory with its mounting subsystem id
        type: local
      - stepNumber: 5
        description: Return the direct chained subprojects
        type: return
        outcome: ChainedSubprojectDir[]
  - name: readLockState
    narrative:
      - stepNumber: 1
        description: Read the persisted lock record through the lock store
        type: call
        targetComponent: lock_store
        targetMethod: read
      - stepNumber: 2
        description: No record means the project was never locked, a normal state rather than a fault
        type: branch
        condition: no lock record exists
        onFalseStep: 4
      - stepNumber: 3
        description: Return unlocked with no record, carrying current as the identity a lock would record
        type: return
        outcome: unlocked
      - stepNumber: 4
        description: >-
          Compare the recorded gate identity with the one the caller computed now; nothing is hashed
          here
        type: branch
        condition: the record's stateId equals current
        onFalseStep: 6
      - stepNumber: 5
        description: Return locked with the record and current
        type: return
        outcome: locked
      - stepNumber: 6
        description: >-
          Return stale with the record and current, keeping the record: staleness is a judgement
          about the record, so a caller can prompt for a re-lock rather than present the project as
          never frozen
        type: return
        outcome: stale
  - name: consumedContractInputs
    narrative:
      - stepNumber: 1
        description: List every chained mount root beneath the bound project, project-relative in walk order
        type: call
        targetComponent: spec_loader
        targetMethod: listChainedRoots
      - stepNumber: 2
        description: 'The roots to read: the bound root, then each chained root joined onto it'
        type: local
      - stepNumber: 3
        description: Read each root's consumed contract inputs
        type: loop
        loopKind: forEach
        over: the roots
        endStep: 5
      - stepNumber: 4
        description: >-
          Read the root's stored surface snapshots under .wai/surfaces: a missing directory holds
          none, and a malformed file is skipped rather than aborting the read. Read locally: the
          snapshot files are modelled in sdd_surfaces, which sdd_core must not depend on
        type: local
      - stepNumber: 5
        description: >-
          Reduce each snapshot to its canonical content key: provenance (stateId, generatedAt,
          origin) stripped and the rest canonicalized, so re-pinning an unchanged contract never
          moves the key
        type: local
      - stepNumber: 6
        description: Return every root's content keys
        type: return
        outcome: string[]
  - name: retireSpecialists
    sourcePath: src/core/stereotype-migration.ts
    narrative:
      - stepNumber: 1
        description: Load every component spec in the bound tree
        type: call
        targetComponent: spec_loader
        targetMethod: loadComponentSpecs
      - stepNumber: 2
        description: >-
          Collect the Specialists, each unclassified. Gateways are not migrated here:
          STEREOTYPE_RETIRED gives their manual steps
        type: local
      - stepNumber: 3
        description: Classify over the dependency graph in passes, until a pass classifies nothing
        type: loop
        condition: the pass classified at least one Specialist
        loopKind: doWhile
        endStep: 14
      - stepNumber: 4
        description: Try each Specialist still unclassified
        type: loop
        loopKind: forEach
        over: each Specialist still unclassified
        endStep: 13
      - stepNumber: 5
        description: A Specialist with a dependency still unclassified waits for the next pass
        type: branch
        condition: 'every dependency is decided: none is a Specialist still unclassified'
        onFalseStep: 4
      - stepNumber: 6
        description: Pure when every dependency is pure
        type: branch
        condition: >-
          every dependency is pure: an Orchestrator declaring dependencyClass pure, or a Specialist
          classified pure
        onFalseStep: 9
      - stepNumber: 7
        description: Classify it pure
        type: local
      - stepNumber: 8
        description: Go record its reason
        type: jump
        toStep: 13
      - stepNumber: 9
        description: Read when every dependency is pure or read logic, or a data facade it may read
        type: branch
        condition: >-
          every dependency is pure or read logic (declared or classified), or a Repository, Index or
          Adapter
        onFalseStep: 12
      - stepNumber: 10
        description: Classify it read
        type: local
      - stepNumber: 11
        description: Go record its reason
        type: jump
        toStep: 13
      - stepNumber: 12
        description: 'Leave its class unset, a workflow Orchestrator: some dependency fits neither class'
        type: local
      - stepNumber: 13
        label: record
        description: Record the dependencies that decided its class as its reason
        type: local
      - stepNumber: 14
        description: Close the pass, noting whether it classified any Specialist
        type: local
      - stepNumber: 15
        description: >-
          Settle the Specialists still unclassified, those in a dependency cycle or waiting on one,
          with the weakest class that fits: read when every dependency is pure or read logic, a
          Repository, Index or Adapter, or another of them; otherwise unset. One left unset makes
          those depending on it unset in turn, until nothing changes. Each records the dependencies
          that decided it
        type: local
      - stepNumber: 16
        description: >-
          Read the project's own variants through the variant registry adapter, keeping those whose
          base is Specialist
        type: call
        targetComponent: variant_registry_adapter
        targetMethod: listProjectVariants
      - stepNumber: 17
        description: >-
          Compose the plan: retyped, each Specialist with its dependencyClass when set and its
          reason; rebasedVariants, the ids of those variants
        type: local
      - stepNumber: 18
        description: Without apply, nothing is written
        type: branch
        condition: apply is false
        onFalseStep: 20
      - stepNumber: 19
        description: Return the plan with applied false
        type: return
        outcome: planned
      - stepNumber: 20
        description: Write each retype
        type: loop
        loopKind: forEach
        over: each retyped Specialist
        endStep: 21
      - stepNumber: 21
        description: Save it with componentType Orchestrator and its dependencyClass when set
        type: call
        targetComponent: spec_loader
        targetMethod: saveComponentSpec
      - stepNumber: 22
        description: >-
          Rebase those variant files in place through the variant registry adapter, from base
          Specialist to base Orchestrator; its result gives the rebased ids
        type: call
        targetComponent: variant_registry_adapter
        targetMethod: rebaseProjectVariants
      - stepNumber: 23
        description: Invalidate the spec cache
        type: call
        targetComponent: spec_loader
        targetMethod: invalidateCache
      - stepNumber: 24
        description: Return the plan with applied true
        type: return
        outcome: applied
  - name: renameComponent
    sourcePath: src/core/provision.ts
    narrative:
      - stepNumber: 1
        description: Load the component to rename
        type: call
        targetComponent: spec_loader
        targetMethod: loadComponentSpec
      - stepNumber: 2
        description: 'Guard: the component must exist'
        type: branch
        condition: the component does not exist
        onFalseStep: 4
      - stepNumber: 3
        label: component-missing
        description: Refuse a component that does not exist
        type: throw
        error: 'component-missing: no component has this id'
      - stepNumber: 4
        description: 'Guard: the component must belong to the bound project itself'
        type: branch
        condition: 'componentId is namespaced into a chained mount (it carries the :: separator)'
        onFalseStep: 6
      - stepNumber: 5
        label: chained-component
        description: Refuse a component inside a chained subproject
        type: throw
        error: >-
          chained-component: the component lives in a chained subproject; rename it from that
          project's own root
      - stepNumber: 6
        description: 'Guard: the new id must be a plain lowercase identifier'
        type: branch
        condition: >-
          newId is outside the id grammar: not a lowercase identifier, or carrying a namespace
          separator
        onFalseStep: 8
      - stepNumber: 7
        label: invalid-id
        description: Refuse a new id outside the grammar
        type: throw
        error: 'invalid-id: the new id must be a lowercase identifier with no namespace separator'
      - stepNumber: 8
        description: Load every component spec, for the component ids already taken
        type: call
        targetComponent: spec_loader
        targetMethod: loadComponentSpecs
      - stepNumber: 9
        description: Load every interface spec, for the interface ids taken and the component's own contracts
        type: call
        targetComponent: spec_loader
        targetMethod: loadInterfaceSpecs
      - stepNumber: 10
        description: >-
          Load every implementation spec, for the implementation ids taken and the realizations of
          those contracts
        type: call
        targetComponent: spec_loader
        targetMethod: loadImplementationSpecs
      - stepNumber: 11
        description: 'Guard: nothing may already hold the new ids'
        type: branch
        condition: >-
          newId is already a component id, or i<newId> is an interface id, or <newId>_impl is an
          implementation id
        onFalseStep: 13
      - stepNumber: 12
        label: id-taken
        description: Refuse a new id already taken
        type: throw
        error: 'id-taken: the new id, or the interface or implementation id it implies, is already in use'
      - stepNumber: 13
        description: >-
          Collect what moves: the component's interface named i<componentId>, and the implementation
          named <componentId>_impl that realizes one of the component's contracts. Interfaces and
          implementations named otherwise keep their ids; only their component and contract
          references change
        type: local
      - stepNumber: 14
        description: >-
          Rewrite every reference to a renamed id across the bound tree with the provisioning
          rewriter, the moved specs' own files included: a component's dependsOn, owns and dispatch
          components; a subsystem's lifecycle components and its published interfaces' component and
          interface; the system's published interfaces' component and interface; narrative call,
          dispatch and register targets, and a step's auth.from component source; an interface's
          component; an implementation's contract; and an entity's componentClass. Record the other
          specs it rewrote (the moved specs, matched by their old ids, are not among them).
          References from chained subprojects are not rewritten
        type: local
      - stepNumber: 15
        description: Drop the cached spec index, so the saves below place specs by the rewritten owns
        type: call
        targetComponent: spec_loader
        targetMethod: invalidateCache
      - stepNumber: 16
        description: >-
          Move each renamed spec to its new id: reload it as the rewrite left it, write it under the
          new id where the loader places it, remove the file it left behind and drop the cached
          index again
        type: call
        targetComponent: core_orchestrator
        targetMethod: moveRenamedSpecs
      - stepNumber: 17
        description: >-
          Return renamed (each moved spec's kind with its old and new id) and rewritten (the ids of
          the other specs whose references changed)
        type: return
  - name: renameMethod
    sourcePath: src/core/provision.ts
    narrative:
      - stepNumber: 1
        description: Load the component whose contract method is renamed
        type: call
        targetComponent: spec_loader
        targetMethod: loadComponentSpec
      - stepNumber: 2
        description: 'Guard: the component must exist'
        type: branch
        condition: the component does not exist
        onFalseStep: 4
      - stepNumber: 3
        label: component-missing
        description: Refuse a component that does not exist
        type: throw
        error: 'component-missing: no component has this id'
      - stepNumber: 4
        description: 'Guard: the component must belong to the bound project itself'
        type: branch
        condition: 'componentId is namespaced into a chained mount (it carries the :: separator)'
        onFalseStep: 6
      - stepNumber: 5
        label: chained-component
        description: Refuse a component inside a chained subproject
        type: throw
        error: >-
          chained-component: the component lives in a chained subproject; rename its method from
          that project's own root
      - stepNumber: 6
        description: 'Guard: the new name must be a camel-case identifier'
        type: branch
        condition: >-
          newName is outside the identifier grammar: not a camel-case identifier, or carrying a
          separator
        onFalseStep: 8
      - stepNumber: 7
        label: invalid-name
        description: Refuse a new name outside the grammar
        type: throw
        error: 'invalid-name: the new name must be a camel-case identifier'
      - stepNumber: 8
        description: >-
          Load every interface spec, for the component's own contracts and the names they already
          declare
        type: call
        targetComponent: spec_loader
        targetMethod: loadInterfaceSpecs
      - stepNumber: 9
        description: >-
          Collect the contracts that move: every interface of this component that declares
          methodName
        type: local
      - stepNumber: 10
        description: 'Guard: the component must declare the method'
        type: branch
        condition: no contract of the component declares methodName
        onFalseStep: 12
      - stepNumber: 11
        label: method-missing
        description: Refuse a method the component does not declare
        type: throw
        error: 'method-missing: no contract of this component declares that method'
      - stepNumber: 12
        description: 'Guard: the new name must be free on every contract that moves'
        type: branch
        condition: one of those contracts already declares a method under newName
        onFalseStep: 14
      - stepNumber: 13
        label: name-taken
        description: Refuse a new name already declared on that interface
        type: throw
        error: 'name-taken: that interface already declares a method under the new name'
      - stepNumber: 14
        description: >-
          Load every implementation spec, for the realizations of those contracts and the narratives
          that refer to the method
        type: call
        targetComponent: spec_loader
        targetMethod: loadImplementationSpecs
      - stepNumber: 15
        description: Move the method on every contract of the component that declares it
        type: loop
        loopKind: forEach
        over: each contract that declares the method
        endStep: 16
      - stepNumber: 16
        description: >-
          Write the contract with the method under newName: its name, and the method name inside its
          signature string. Params, returns, description, guarantees and findings stay as they are
        type: call
        targetComponent: spec_loader
        targetMethod: saveInterfaceSpec
      - stepNumber: 17
        description: Move it on the implementations of those contracts too
        type: loop
        loopKind: forEach
        over: each implementation realizing one of those contracts that declares the method
        endStep: 20
      - stepNumber: 18
        description: >-
          An implementation that named no symbol needs one now: the function it binds to still
          carries the old name
        type: branch
        condition: the method declares no symbol and pinSymbol is not false
        onFalseStep: 20
      - stepNumber: 19
        description: >-
          Pin it: declare symbol <the old name> on the moved method, so that function keeps binding,
          and record it as the pinned symbol
        type: local
      - stepNumber: 20
        description: >-
          Write the implementation with the method under newName, carrying its narrative,
          sourcePath, symbol, detail and intent unchanged
        type: call
        targetComponent: spec_loader
        targetMethod: saveImplementationSpec
      - stepNumber: 21
        description: >-
          Drop the cached spec index, so the retargeting below reads the moved names rather than the
          cached ones
        type: call
        targetComponent: spec_loader
        targetMethod: invalidateCache
      - stepNumber: 22
        description: >-
          Retarget every reference to the method with the provisioning rewriter, which persists what
          it changes: narrative call, register and dispatch steps naming this component and this
          method; dispatch-table bindings routing a capability to this component and method; and
          lifecycle entrypoints naming it for a phase. Record the specs it rewrote
        type: local
      - stepNumber: 23
        description: >-
          Collect what names the method but is left alone: the specs whose description, intent or
          narrative text still carries the old name, and the gRPC endpoint bindings whose wire
          method still carries it. A rename never edits prose, and never changes a published wire
          name
        type: local
      - stepNumber: 24
        description: >-
          Return the report: the component, from and to, the specs the method moved in, the specs
          whose references were retargeted, the mentions left alone, and the pinned symbol when one
          was set
        type: return
        outcome: renamed
  - name: moveRenamedSpecs
    sourcePath: src/core/provision.ts
    narrative:
      - stepNumber: 1
        description: Reload the component as the rewrite left it
        type: call
        targetComponent: spec_loader
        targetMethod: loadComponentSpec
      - stepNumber: 2
        description: Does the component's own interface move?
        type: branch
        condition: the component's interface named i<componentId> moves
        onFalseStep: 4
      - stepNumber: 3
        description: Reload the interface as the rewrite left it
        type: call
        targetComponent: spec_loader
        targetMethod: loadInterfaceSpec
      - stepNumber: 4
        description: Does the component's own implementation move?
        type: branch
        condition: the implementation named <componentId>_impl moves
        onFalseStep: 6
      - stepNumber: 5
        description: Reload the implementation as the rewrite left it
        type: call
        targetComponent: spec_loader
        targetMethod: loadImplementationSpec
      - stepNumber: 6
        description: >-
          Write the component under newId, its own id rewritten; the loader nests a member of a
          pattern under its owner
        type: call
        targetComponent: spec_loader
        targetMethod: saveComponentSpec
      - stepNumber: 7
        description: Save the moved interface?
        type: branch
        condition: the component's interface moves
        onFalseStep: 9
      - stepNumber: 8
        description: Write the interface under i<newId>, its id and component rewritten
        type: call
        targetComponent: spec_loader
        targetMethod: saveInterfaceSpec
      - stepNumber: 9
        description: Save the moved implementation?
        type: branch
        condition: the component's implementation moves
        onFalseStep: 13
      - stepNumber: 10
        description: Does the new path collide with the implementation's current file?
        type: branch
        condition: >-
          the implementation's new path is the file it already occupies (the nested layout, with a
          contract that keeps its id)
        onFalseStep: 12
      - stepNumber: 11
        description: 'Delete that file first: the loader refuses to write a spec over a file holding another id'
        type: local
      - stepNumber: 12
        description: >-
          Write the implementation under <newId>_impl, its id rewritten and its contract following a
          renamed interface
        type: call
        targetComponent: spec_loader
        targetMethod: saveImplementationSpec
      - stepNumber: 13
        description: Remove each moved spec's old file, found by its old id, and prune the folders left empty
        type: local
      - stepNumber: 14
        description: >-
          Drop the cached spec index again: the removed files changed the tree outside the save
          paths
        type: call
        targetComponent: spec_loader
        targetMethod: invalidateCache
      - stepNumber: 15
        description: Return — every renamed spec now sits under its new id and the file it left is gone
        type: return
        outcome: void
  - name: updateSpec
    narrative:
      - stepNumber: 1
        description: >-
          Load the stored spec the delta addresses, through the loader entry for its level — this
          component load and its five siblings; the L0 is a singleton whose load ignores the id
        type: call
        targetComponent: spec_loader
        targetMethod: loadComponentSpec
      - stepNumber: 2
        description: 'Guard: the addressed spec must exist'
        type: branch
        condition: no spec of that kind holds that id
        onFalseStep: 4
      - stepNumber: 3
        label: spec-missing
        description: Refuse an update to a spec that has not been defined
        type: throw
        error: 'spec-missing: no spec of that kind holds that id'
      - stepNumber: 4
        description: 'Guard: a system-kind update must actually address the singleton L0'
        type: branch
        condition: the kind is system and the id names neither the singleton nor the system's own name
        onFalseStep: 6
      - stepNumber: 5
        label: mis-selected-kind
        description: >-
          Refuse a mis-selected kind rather than silently rewriting the L0, and name the kind the
          caller probably meant
        type: throw
        error: 'mis-selected-kind: kind system targets the singleton L0'
      - stepNumber: 6
        description: 'Guard: every delta key must be a field of the level, or one of the delta''s own verbs'
        type: branch
        condition: the delta names a key the level's canonical schema does not know
        onFalseStep: 8
      - stepNumber: 7
        label: unknown-key
        description: >-
          Refuse the whole delta, naming each unknown key and its nearest known field — an unknown
          key is dropped on write, so the edit would report success and change nothing
        type: throw
        error: 'unknown-key: the delta names a field the level does not have'
      - stepNumber: 8
        description: >-
          Merge the delta onto the stored spec: references qualify against the spec's namespace
          first, identity-keyed arrays upsert element by element and honour their delete markers at
          every depth, narrative steps insert and delete in ascending order with every jump field
          relocating around them, a step whose type changes is rebuilt for its new type keeping its
          description and label, and `unset` removes the fields it names at the level it sits in
          while `[]` clears the list it names. A step delete is refused outright when it addresses
          no step, when a jump still targets it, when a restated label or description does not match
          it, or when it is a region header whose body would be left standing
        type: local
      - stepNumber: 9
        description: >-
          Resolve the narratives' symbolic label references against the merged numbering, a label
          supplied by the delta replacing the stored number it twins; an unresolved reference aborts
          the whole update, because a dropped reference would silently become a dangling numeric
          jump
        type: local
      - stepNumber: 10
        description: >-
          Collect every difference between the stored spec and the merged one as an addressed
          change, both read through the level's canonical schema so a key the writer would drop
          cannot count as a change, and name every path the delta carried that the write does not
          act on — one the schema drops at a depth the permissive delta cannot refuse, and one whose
          value the stored spec already held
        type: local
      - stepNumber: 11
        description: Decide whether there is anything to write
        type: branch
        condition: the merged spec matches what is stored
        onFalseStep: 13
      - stepNumber: 12
        description: >-
          Write nothing, leave the stored updatedAt untouched, and report that the delta matched
          what is stored, naming the paths it did not act on; a caller asking only what the delta
          would do is answered the same way, because there is nothing it would do
        type: return
        outcome: unchanged
      - stepNumber: 13
        description: >-
          Run the caller's injected judgement on the merged spec — the last point before anything
          could reach disk, and run for a caller asking only what the delta would do as well, so an
          answer that reports changes reports a write that would really be accepted
        type: local
      - stepNumber: 14
        description: Decide whether the caller wanted the write or only the account of it
        type: branch
        condition: the caller asked only what the delta would do
        onFalseStep: 16
      - stepNumber: 15
        label: dry-run
        description: >-
          Answer with the changes the write would make and the paths it would not act on, marked as
          an account rather than a write: nothing is stamped and not one byte of the stored file
          moves
        type: return
        outcome: dry run
      - stepNumber: 16
        description: >-
          Stamp updatedAt and persist the merged spec through the saver for its level, allowing a
          deliberate status demotion when the delta carried an explicit status
        type: call
        targetComponent: spec_loader
        targetMethod: saveComponentSpec
      - stepNumber: 17
        description: >-
          Report what was written: every change it made, every path of the delta it did not act on,
          the store's placement notices and the judgement's warnings
        type: return
        outcome: written
  - name: repairForeignStepFields
    sourcePath: src/core/narrative-repair.ts
    narrative:
      - stepNumber: 1
        description: Load every implementation spec in the bound tree
        type: call
        targetComponent: spec_loader
        targetMethod: loadImplementationSpecs
      - stepNumber: 2
        label: impls
        description: Walk each implementation, collecting what its narratives carry that they cannot
        type: loop
        loopKind: forEach
        over: each loaded implementation
        endStep: 10
      - stepNumber: 3
        description: Walk every step of every one of its methods
        type: loop
        loopKind: forEach
        over: each step of each method's narrative, in method then step order
        endStep: 8
      - stepNumber: 4
        description: >-
          Read the step's foreign fields through narrative_step.foreignFields(), the one per-type
          table a retype also rebuilds against
        type: local
      - stepNumber: 5
        description: A step whose every field belongs to its type is left alone
        type: branch
        condition: the step carries at least one foreign field
        onFalseStep: 8
      - stepNumber: 6
        description: >-
          Record the repair: the implementation id, the method name, the step number, the step's own
          type, and the foreign fields in declaration order
        type: local
      - stepNumber: 7
        description: >-
          Drop those fields from the step, in memory. Its type, description, label and every field
          its type does carry are untouched — the repair removes what means nothing, it never
          reinterprets the step
        type: local
      - stepNumber: 8
        label: stepsEnd
        description: On to the next step
        type: local
      - stepNumber: 9
        description: >-
          Only an implementation that changed is written, and only when the caller asked for the
          write
        type: branch
        condition: apply, and this implementation had at least one step repaired
        onFalseStep: 2
      - stepNumber: 10
        description: Save the repaired implementation spec
        type: call
        targetComponent: spec_loader
        targetMethod: saveImplementationSpec
      - stepNumber: 11
        description: Answer with every repair, planned or written
        type: return
        outcome: the repairs, in tree order
  - name: loadTypeSpec
    narrative:
      - stepNumber: 1
        description: Call loadTypeSpec on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: loadTypeSpec
  - name: saveTypeSpec
    narrative:
      - stepNumber: 1
        description: Call saveTypeSpec on spec loader
        type: call
        targetComponent: spec_loader
        targetMethod: saveTypeSpec
  - name: moveMethods
    narrative:
      - stepNumber: 1
        description: Load the source component spec
        type: call
        targetComponent: spec_loader
        targetMethod: loadComponentSpec
      - stepNumber: 2
        description: >-
          Check what the caller named: the source and target both exist and differ, every named
          method is declared on the source contract, no name is already declared on the target, and
          neither component sits inside a chained subproject
        type: local
      - stepNumber: 3
        description: Decide whether the request itself is answerable
        type: branch
        condition: any of those checks failed
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: >-
          Refuse before the first write, naming which check failed — a mistyped id must read as a
          mistyped id, never as a rule refusing the design
        type: throw
        error: unmovable request
      - stepNumber: 5
        description: >-
          Load the interfaces of both components, so the contract entries to move and the names
          already declared on the target are both in hand
        type: call
        targetComponent: spec_loader
        targetMethod: loadInterfaceSpecs
      - stepNumber: 6
        description: >-
          Build the plan in memory: the contract entries that leave the source interface and arrive
          on the target's, the implementation entries that travel with them carrying narrative,
          sourcePath, symbol, detail, intent, calls and findings, and the dependencies the moved
          narratives call that the target does not have yet
        type: local
      - stepNumber: 7
        description: >-
          Load every implementation to find the references that name the old home: narrative call,
          register and dispatch steps, dispatch-table bindings, lifecycle entrypoints and `calls`
          entries. Prose and wire endpoint addresses are recorded as mentions and left alone — a
          move must not silently re-address an RPC
        type: call
        targetComponent: spec_loader
        targetMethod: loadImplementationSpecs
      - stepNumber: 8
        description: Decide whether a judgement was injected
        type: branch
        condition: the caller passed write hooks
        onTrueStep: 9
        onFalseStep: 13
      - stepNumber: 9
        description: >-
          Judge the resulting source and target components at the write boundary; the hook throws to
          refuse
        type: local
      - stepNumber: 10
        description: Decide on the judgement
        type: branch
        condition: the hook refused the resulting target
        onTrueStep: 11
        onFalseStep: 13
      - stepNumber: 11
        description: >-
          Enumerate the other components of the source's subsystem as candidate homes and ask the
          hook to assess each without throwing, recording the dependencies each would have to add
          and the rule codes that would refuse it
        type: local
      - stepNumber: 12
        description: >-
          Answer with the refusal: the rule codes, and the candidates ranked cheapest legal home
          first with the requested target among them so its shortfall reads beside the rest. Nothing
          has reached disk
        type: return
        outcome: refused
      - stepNumber: 13
        description: Decide whether the caller wanted the write
        type: branch
        condition: the caller asked for a dry run
        onTrueStep: 14
        onFalseStep: 15
      - stepNumber: 14
        description: Answer with the edits the move would have made and write nothing
        type: return
        outcome: previewed
      - stepNumber: 15
        description: >-
          Write every edit in the plan — both contracts, both implementations, and each referencing
          implementation — restoring the ones already written if any write fails, because a
          half-moved method leaves callers naming a home it no longer has
        type: call
        targetComponent: spec_loader
        targetMethod: saveImplementationSpec
      - stepNumber: 16
        description: >-
          Answer with what moved, how many references followed it, and the prose still naming the
          old home
        type: return
        outcome: moved
status: complete
