id: host_core_adapter_impl
name: Host Core Client Adapter Implementation
description: Forwards spec-tree operations to the core portal for provisioning and lock/promote.
contract: ihost_core_adapter
sourcePath: src/server/adapters.ts
methods:
  - name: provisionProject
    narrative:
      - stepNumber: 1
        description: Forward provisioning to the core portal
        type: call
        targetComponent: core_portal
        targetMethod: provisionProject
  - name: computeStateId
    narrative:
      - stepNumber: 1
        description: Forward StateId computation to the core portal
        type: call
        targetComponent: core_portal
        targetMethod: computeStateId
  - name: readLockRecord
    narrative:
      - stepNumber: 1
        description: Forward lock-record read to the core portal
        type: call
        targetComponent: core_portal
        targetMethod: readLockRecord
  - name: writeLockRecord
    narrative:
      - stepNumber: 1
        description: Forward lock-record write to the core portal
        type: call
        targetComponent: core_portal
        targetMethod: writeLockRecord
  - name: promoteAllComplete
    narrative:
      - stepNumber: 1
        description: Forward status promotion to the core portal
        type: call
        targetComponent: core_portal
        targetMethod: promoteAllComplete
  - name: renderDiagram
    narrative:
      - stepNumber: 1
        description: Forward diagram rendering to the core portal
        type: call
        targetComponent: core_portal
        targetMethod: renderDiagram
  - name: loadSystemSpec
    narrative:
      - stepNumber: 1
        description: Forward the L0 system spec read to the core portal
        type: call
        targetComponent: core_portal
        targetMethod: loadSystemSpec
  - name: loadSubsystemSpecs
    narrative:
      - stepNumber: 1
        description: Forward the subsystem specs read to the core portal
        type: call
        targetComponent: core_portal
        targetMethod: loadSubsystemSpecs
  - name: buildProjectGraph
    narrative:
      - stepNumber: 1
        description: Forward the project-graph projection to the core portal
        type: call
        targetComponent: core_portal
        targetMethod: buildProjectGraph
    detail: calls-only
  - name: globalPacksDir
    narrative: []
    detail: intent
    intent: >-
      Forwards to the core extension loader's global-packs-directory resolution (WAIRON_PACKS_DIR,
      else the default), so the hosted pack store never reaches into sdd_core directly.
  - name: discoverPacks
    narrative: []
    detail: intent
    intent: >-
      Forwards to the core extension loader's directory discovery, returning the pack refs found in
      the given directory (empty for a missing/unreadable directory, never an error).
  - name: loadExtensionPacks
    narrative: []
    detail: intent
    intent: >-
      Forwards to the core extension loader, loading the given refs against the project root into a
      LoadedExtensions (a failed pack rides on the result's errors rather than throwing).
  - name: checkDeclarativePack
    narrative: []
    detail: intent
    intent: >-
      Validates the parsed manifest against the declarative-pack schema via the core loader,
      returning the first schema error message or null when valid — so the hosted store can reject
      non-declarative (rule/code) packs over the API.
  - name: builtinProfileIds
    narrative: []
    detail: intent
    intent: >-
      Return the ids of wairon's built-in architectural profiles by reading the core rules
      registry's built-in profile set (BUILTIN_PROFILES). A pure, side-effect-free read of a bundled
      constant; never fails.
  - name: resolveContainedProjectPath
    narrative:
      - stepNumber: 1
        description: >-
          Resolve and assert the projectPath within the root via the core containment guard
          (assertContainedProjectPath — a pure path utility of the core module, not a portal
          workflow), returning the contained absolute child root
        type: local
  - name: builtinProjectKinds
    narrative: []
    detail: intent
    intent: >-
      Return the ids of wairon's built-in composite project kinds by reading the core rules
      registry's bundled PROJECT_KINDS constant (fullstack, system-of-systems, monorepo). A pure,
      side-effect-free read of a bundled constant; never fails. Kept beside builtinProfileIds so the
      two halves of a legal projectType value — architectural profiles and composite project kinds —
      come from the same core source instead of being restated in the hosting layer, where they
      would drift.
status: complete
