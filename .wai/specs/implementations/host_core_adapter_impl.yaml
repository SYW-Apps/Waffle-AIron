id: host_core_adapter_impl
name: Host Core Client Adapter Implementation
description: >-
  Forwards spec-tree operations to the core portal for provisioning, lock records, and the approval
  baseline.
contract: ihost_core_adapter
sourcePath: src/server/adapters/core.ts
methods:
  - name: provisionProject
    narrative:
      - stepNumber: 1
        description: Forward provisioning to the core portal
        type: call
        targetComponent: spec_maintenance_portal
        targetMethod: provisionProject
  - name: computeStateId
    narrative:
      - stepNumber: 1
        description: Forward StateId computation to the core portal
        type: call
        targetComponent: approval_portal
        targetMethod: computeStateId
  - name: readLockRecord
    narrative:
      - stepNumber: 1
        description: Forward lock-record read to the core portal
        type: call
        targetComponent: approval_portal
        targetMethod: readLockRecord
  - name: writeLockRecord
    narrative:
      - stepNumber: 1
        description: Forward lock-record write to the core portal
        type: call
        targetComponent: approval_portal
        targetMethod: writeLockRecord
  - name: renderDiagram
    narrative:
      - stepNumber: 1
        description: Forward diagram rendering to the core portal
        type: call
        targetComponent: spec_tree_portal
        targetMethod: renderDiagram
  - name: loadSystemSpec
    narrative:
      - stepNumber: 1
        description: Forward the L0 system spec read to the core portal
        type: call
        targetComponent: spec_tree_portal
        targetMethod: loadSystemSpec
  - name: loadSubsystemSpecs
    narrative:
      - stepNumber: 1
        description: Forward the subsystem specs read to the core portal
        type: call
        targetComponent: spec_tree_portal
        targetMethod: loadSubsystemSpecs
  - name: buildProjectGraph
    narrative:
      - stepNumber: 1
        description: Forward the project-graph projection to the core portal
        type: call
        targetComponent: spec_tree_portal
        targetMethod: buildProjectGraph
    detail: calls-only
  - name: globalPacksDir
    narrative:
      - stepNumber: 1
        description: Forward to the extension portal
        type: call
        targetComponent: extension_portal
        targetMethod: globalPacksDir
    detail: calls-only
  - name: discoverPacks
    narrative:
      - stepNumber: 1
        description: Forward to the extension portal
        type: call
        targetComponent: extension_portal
        targetMethod: discoverPacks
    detail: calls-only
  - name: loadExtensionPacks
    narrative:
      - stepNumber: 1
        description: Forward to the extension portal
        type: call
        targetComponent: extension_portal
        targetMethod: loadExtensionPacks
    detail: calls-only
  - name: checkDeclarativePack
    narrative:
      - stepNumber: 1
        description: Forward to the extension portal
        type: call
        targetComponent: extension_portal
        targetMethod: checkDeclarativePack
    detail: calls-only
  - name: assertContainedProjectPath
    narrative:
      - stepNumber: 1
        description: >-
          Forward to the spec tree portal's containment check, which answers the contained absolute
          child root
        type: call
        targetComponent: spec_tree_portal
        targetMethod: assertContainedProjectPath
  - name: readLockState
    narrative:
      - stepNumber: 1
        description: >-
          Forward the lock-verdict resolution to the core portal, passing the caller's current gate
          identity
        type: call
        targetComponent: approval_portal
        targetMethod: readLockState
  - name: exportSpecTree
    narrative:
      - stepNumber: 1
        description: Forward the spec-tree export to the core portal
        type: call
        targetComponent: spec_tree_portal
        targetMethod: exportSpecTree
  - name: importSpecTree
    narrative:
      - stepNumber: 1
        description: Forward the spec-tree import to the core portal
        type: call
        targetComponent: spec_maintenance_portal
        targetMethod: importSpecTree
  - name: currentChildPins
    narrative:
      - stepNumber: 1
        description: Forward chained-child pin resolution to the core portal
        type: call
        targetComponent: approval_portal
        targetMethod: currentChildPins
  - name: captureApprovedSpecs
    narrative:
      - stepNumber: 1
        description: Forward approval capture to the core portal
        type: call
        targetComponent: approval_portal
        targetMethod: captureApprovedSpecs
  - name: loadProjectConfig
    narrative:
      - stepNumber: 1
        description: Forward to the core portal
        type: call
        targetComponent: project_config_portal
        targetMethod: loadProjectConfig
  - name: removePackSelection
    narrative:
      - stepNumber: 1
        description: Forward to the core portal
        type: call
        targetComponent: project_config_portal
        targetMethod: removePackSelection
  - name: setProjectType
    narrative:
      - stepNumber: 1
        description: Forward to the core portal
        type: call
        targetComponent: project_config_portal
        targetMethod: setProjectType
  - name: recordProfileSelection
    narrative:
      - stepNumber: 1
        description: Forward to the core portal
        type: call
        targetComponent: project_config_portal
        targetMethod: recordProfileSelection
  - name: registerPackRef
    narrative:
      - stepNumber: 1
        description: Forward to the core portal
        type: call
        targetComponent: project_config_portal
        targetMethod: registerPackRef
  - name: deregisterPackRef
    narrative:
      - stepNumber: 1
        description: Forward to the core portal
        type: call
        targetComponent: project_config_portal
        targetMethod: deregisterPackRef
  - name: buildCanvasDataModel
    narrative:
      - stepNumber: 1
        description: Forward to the spec tree portal
        type: call
        targetComponent: spec_tree_portal
        targetMethod: buildCanvasDataModel
  - name: packEntryRef
    narrative:
      - stepNumber: 1
        description: Forward to the extension portal
        type: call
        targetComponent: extension_portal
        targetMethod: packEntryRef
  - name: packEntryLabel
    narrative:
      - stepNumber: 1
        description: Forward to the extension portal
        type: call
        targetComponent: extension_portal
        targetMethod: packEntryLabel
status: complete
