id: spec_index_impl
name: Spec Index Implementation
description: >-
  Read/lookup pipeline of the spec workspace: path resolution across flat and per-subsystem layouts,
  document reads through the file store, and level-schema parsing that collects loader issues
  instead of throwing.
contract: ispec_index
sourcePath: src/core/specs.ts
methods:
  - name: loadSystemSpec
    narrative:
      - stepNumber: 1
        description: Resolve the system spec path (.index.yaml at the specs root)
        type: local
      - stepNumber: 2
        description: Read the YAML document through the file store
        type: call
        targetComponent: spec_file_store
        targetMethod: read
      - stepNumber: 3
        description: Parse against SystemSpecSchema; an absent document yields null
        type: local
  - name: loadSubsystemSpecs
    narrative:
      - stepNumber: 1
        description: >-
          Walk the specs tree for subsystem documents (the workspace scan is recursive across flat
          and per-subsystem layouts). A workspace serves its cached scan while the tree's file
          signature (paths, mtimes, sizes) is unchanged, re-checking the signature at most once per
          short TTL — and ALWAYS on the first read after the bound project root switches to this
          workspace, so a tree changed outside the process (an editor save, a git pull) is never
          served stale to a caller that just bound it
        type: call
        targetComponent: spec_file_store
        targetMethod: listTree
      - stepNumber: 2
        description: Read each listed file's document through the file store
        type: call
        targetComponent: spec_file_store
        targetMethod: read
      - stepNumber: 3
        description: >-
          Parse each against SubsystemSpecSchema, keying it under its project and binding its
          references the way the scan does (listProjectRoots: local first, `alias::name` through the
          root's alias table), collecting refusals as loader issues — a bad file never aborts the
          sweep. A legacy mount subsystem (one carrying projectPath) is not among them: it is a
          member declaration of its project, recorded on the member's root
        type: local
  - name: loadSubsystemSpec
    narrative:
      - stepNumber: 1
        description: Resolve the subsystem id to its spec file path
        type: local
      - stepNumber: 2
        description: Read the YAML document through the file store
        type: call
        targetComponent: spec_file_store
        targetMethod: read
      - stepNumber: 3
        description: >-
          Parse against SubsystemSpecSchema, keyed and bound as the scan binds it; an absent
          document yields null
        type: local
  - name: loadComponentSpecs
    narrative:
      - stepNumber: 1
        description: Walk the specs tree for component documents (flat and per-subsystem layouts)
        type: call
        targetComponent: spec_file_store
        targetMethod: listTree
      - stepNumber: 2
        description: Read each listed file's document through the file store
        type: call
        targetComponent: spec_file_store
        targetMethod: read
      - stepNumber: 3
        description: >-
          Parse each against ComponentSpecSchema, keyed under its project and its references bound
          as the scan binds them, collecting refusals as loader issues
        type: local
  - name: loadComponentSpec
    narrative:
      - stepNumber: 1
        description: Resolve the component id to its spec file path (flat or per-subsystem layout)
        type: local
      - stepNumber: 2
        description: Read the YAML document through the file store
        type: call
        targetComponent: spec_file_store
        targetMethod: read
      - stepNumber: 3
        description: >-
          Parse against ComponentSpecSchema, keyed and bound as the scan binds it; an absent
          document yields null
        type: local
  - name: loadInterfaceSpecs
    narrative:
      - stepNumber: 1
        description: Walk the specs tree for interface documents (flat and per-subsystem layouts)
        type: call
        targetComponent: spec_file_store
        targetMethod: listTree
      - stepNumber: 2
        description: Read each listed file's document through the file store
        type: call
        targetComponent: spec_file_store
        targetMethod: read
      - stepNumber: 3
        description: >-
          Parse each against InterfaceSpecSchema, keyed under its project and its references bound
          as the scan binds them, collecting refusals as loader issues
        type: local
  - name: loadInterfaceSpec
    narrative:
      - stepNumber: 1
        description: Resolve the interface id to its spec file path
        type: local
      - stepNumber: 2
        description: Read the YAML document through the file store
        type: call
        targetComponent: spec_file_store
        targetMethod: read
      - stepNumber: 3
        description: >-
          Parse against InterfaceSpecSchema, keyed and bound as the scan binds it; an absent
          document yields null
        type: local
  - name: loadImplementationSpecs
    narrative:
      - stepNumber: 1
        description: Walk the specs tree for implementation documents (flat and per-subsystem layouts)
        type: call
        targetComponent: spec_file_store
        targetMethod: listTree
      - stepNumber: 2
        description: Read each listed file's document through the file store
        type: call
        targetComponent: spec_file_store
        targetMethod: read
      - stepNumber: 3
        description: >-
          Parse each against ImplementationSpecSchema, keyed under its project and its references
          bound as the scan binds them, collecting refusals as loader issues
        type: local
  - name: loadImplementationSpec
    narrative:
      - stepNumber: 1
        description: Resolve the implementation id to its spec file path
        type: local
      - stepNumber: 2
        description: Read the YAML document through the file store
        type: call
        targetComponent: spec_file_store
        targetMethod: read
      - stepNumber: 3
        description: >-
          Parse against ImplementationSpecSchema, keyed and bound as the scan binds it; an absent
          document yields null
        type: local
  - name: loadTypeSpecs
    narrative:
      - stepNumber: 1
        description: >-
          Walk the full specs tree for type documents — types live flat, per-subsystem, and in
          groups
        type: call
        targetComponent: spec_file_store
        targetMethod: listTree
      - stepNumber: 2
        description: Read each type document through the file store
        type: call
        targetComponent: spec_file_store
        targetMethod: read
      - stepNumber: 3
        description: Parse each against TypeSpecSchema, collecting refusals as loader issues
        type: local
      - stepNumber: 4
        description: Return the parsed type specs
        type: return
        outcome: TypeSpec[]
  - name: resolveSubprojectForNamespace
    narrative: []
    detail: intent
    intent: >-
      Looks the key up among the roots the current scan recorded and answers that root's directory;
      the scan already resolved every member's path against the project declaring it and refused an
      escaping one (PROJECTPATH_ESCAPE), so a key that names no recorded root — a refused member, or
      no member at all — yields null.
  - name: inspectChainedRoots
    narrative: []
    detail: intent
    intent: >-
      Walks the members exactly as the scan recurses — each path resolved against its declaring
      project and contained by that project's root, lexically and through links, whether declared
      under `members` or as a legacy L1 mount — collecting the followable roots in walk order and
      every refused member (escapes, missing, cyclic, too-deep) with its key, alias, form, declared
      path and reason; listChainedRoots returns the roots half.
  - name: loadTypeSpec
    narrative:
      - stepNumber: 1
        description: >-
          Walk the full specs tree for type documents — types live flat, per-subsystem, and in
          groups
        type: call
        targetComponent: spec_file_store
        targetMethod: listTree
      - stepNumber: 2
        description: Read each type document through the file store
        type: call
        targetComponent: spec_file_store
        targetMethod: read
      - stepNumber: 3
        description: >-
          Parse each against TypeSpecSchema and answer with the one whose id matches, or null when
          none does
        type: local
  - name: load
    narrative:
      - stepNumber: 1
        description: >-
          Turn the kind into this index's typed loader of that kind — the one switch every
          kind-holding caller used to repeat; the L0 ignores the id
        type: local
      - stepNumber: 2
        description: The typed loader reads the document through the file store
        type: call
        targetComponent: spec_file_store
        targetMethod: read
      - stepNumber: 3
        description: Answer with the parsed spec, or null when no document is stored
        type: return
        outcome: loaded
  - name: listProjectRoots
    narrative:
      - stepNumber: 1
        label: scan
        description: >-
          Serve the workspace scan while the tree's file signature holds. Otherwise phase one walks
          the bound root's spec directories, and each member's the same way when the walk reaches it
        type: call
        targetComponent: spec_file_store
        targetMethod: listTree
      - stepNumber: 2
        description: >-
          Record the root's configuration, read through the configuration bound at that root — the
          per-root binding the scan already reads the root's specs folder through (a scan may read
          the configuration of the root it is walking) — and add the root's .wai/project.yaml to the
          scan's freshness signature, so an edit to its members or externals re-scans
        type: local
      - stepNumber: 3
        description: >-
          Read the root's member declarations: project_config.declaredMembers() — each with its one
          source parsed (contained path, `../` sibling path, git at a commit, hosted record), the
          `as` it asserts if any, and whether it used the deprecated long-form `path` — and, for one
          release, every top-level L1 subsystem of the root carrying projectPath — a legacy mount,
          recorded with every field as written on the member it declares and never loaded as a
          subsystem, since a mount carries no content. A `members` entry and a legacy mount under
          one alias are one member, the `members` entry winning; an alias declared both as a member
          and as an external is an alias-conflict problem; a declaration with a problem is recorded
          and not followed
        type: local
      - stepNumber: 4
        description: >-
          Read the root's own L0 and every spec document through the file store; a member's L0 is
          recorded on its root, never merged into the index, whose L0 stays the bound root's
        type: call
        targetComponent: spec_file_store
        targetMethod: read
      - stepNumber: 5
        label: key
        description: >-
          Key the root: '' for the bound root, else its effective project id
          (project_config.effectiveId()) — the same at every depth — or, when another member already
          holds that id or it has none, its alias path, with an id-collision or no-id problem. Key
          every declaration under it (`billing::invoice_portal`; a subsystem `billing` declared
          inside member billing is `billing::billing`), and put the root's specs in the index under
          those keys, folding nothing into another root's namespace. A second declaration of one key
          in one root is a duplicate-spec problem naming both files; the first stays in the index
        type: local
      - stepNumber: 6
        label: kinds
        description: >-
          Decide what each followable member is FROM ITS CONTENT (stage 8): its root — the contained
          or sibling directory, or a git member's fetched commit below — declaring an id, holding an
          L0 or carrying a lock (.wai/lock.json) makes it a project; anything else is a part. A
          hosted source is a project. An asserted `as` the content contradicts is a kind-mismatch
          problem, and the content still decides. Nothing is inferred and nothing needs writing: an
          existing member is project-shaped, so it reads as the project it always was. A referenced
          PROJECT member (a `../` or git source) is recorded with the root it was located at and its
          commit (ScannedProjectRoot.referenced) and nothing of it is read into this root. On a
          hosted instance (a request bound with a hosted record lookup) a `../` or git source is
          never read: it is unavailable, since a hosted project reaches another root only by a
          `hosted:` source
        type: local
      - stepNumber: 7
        label: parts
        description: >-
          Read each part the root declares into the root itself, before its local references are
          bound: a part is a piece of this project stored elsewhere, not a project
        type: loop
        loopKind: forEach
        over: the root's parts without a problem, in declaration order
        endStep: 11
      - stepNumber: 8
        description: Is the part fetched from git?
        type: branch
        condition: the part's source is git
        onFalseStep: 10
      - stepNumber: 9
        description: >-
          Materialize the part's pinned commit (its declaration's source.commit) in the fetch cache
          and take the answered directory — a cached commit needs no network, so an offline run
          reads it exactly as an online one. No pinned commit, or a commit that cannot be fetched
          (offline, refused, unknown), is a part-unavailable problem naming why, and the part is
          skipped: never a ref resolved here, never a pass
        type: call
        targetComponent: git_source_adapter
        targetMethod: fetch
      - stepNumber: 10
        label: read-part
        description: >-
          Walk the part's specs folder: a contained part's path resolved under the containment guard
          against this root; a `../` sibling path resolved against this root (the explicit `..` is
          the one way out of the root), or the fetched cache directory. A directory that is absent
          is a part-unavailable problem and the part is skipped. A contained part has no
          configuration and needs none — one declaring PartOf is kind-mismatch. A non-contained
          part's configuration must hold its PartOf naming this root's id: none, or another id, is
          kind-mismatch. A part's configuration declaring project fields (members, externals, rules,
          extensions, composition, targets) without the id that would make it a project is
          kind-mismatch, and those fields are never loaded — a part is governed by this root's
        type: call
        targetComponent: spec_file_store
        targetMethod: listTree
      - stepNumber: 11
        label: fold
        description: >-
          Read every spec document of the part through the file store and key each declaration under
          THIS root's key, exactly as the root's own files are keyed, adding them to the index: the
          part's subsystems are this project's subsystems, so the next step binds their local
          references as the root's own and the ordinary subsystem rules judge them
          (part-is-the-parents-subsystem). A key the root or another part already declares is
          duplicate-spec naming both files. Record the ScannedPart: alias, storage, the directory
          read, the commit (the pinned one for git; for a `../` sibling only when it is stored in
          another git repository than this root — git_source_adapter.repositoryRoot compared, then
          git_source_adapter.head; a contained or same-repository part records none and runs no git
          process), its PartOf (null for a contained part), its subsystem keys and spec keys, and
          the content digest over its documents keyed by their path inside the part
        type: local
      - stepNumber: 12
        description: >-
          Bind every local reference of the root — an id without `::` that names a spec of the root,
          compared by reference_resolution.nameKey as local resolution always has — inside it
          (`key::id`); a reference whose first segment (before `::` or `.`) is the root's own id
          binds locally too and is recorded as a self-prefix (form path, binding local, rewrite the
          bare local id), the form stage 3 left and stage 4's positional step rewrites; set aside
          every other bare name that names none, for the import binding; and record every reference
          with `::` exactly as written, with its spec and position, before binding erases the form.
          Type expressions are read per identifier, builtins and generic parameters excepted
        type: local
      - stepNumber: 13
        label: members
        description: >-
          Follow each followable CONTAINED PROJECT member the root declares (a referenced project
          member — a `../`, git or hosted source — is not followed: its alias stays in the root's
          alias table bound to nothing the scan read, so its references bind as outside and the
          declaring project's own gate judges them against its pin, as an external's; the family run
          opens its root explicitly, at the root step 6 recorded)
        type: loop
        loopKind: forEach
        over: the root's contained project members without a problem, in declaration order
        endStep: 14
      - stepNumber: 14
        label: follow
        description: >-
          Resolve the member's path against THIS root and under the containment guard against this
          root, lexically and through links (the declaring project decides containment, so a member
          is accepted or refused identically whichever root loads it): an escaping path is
          PROJECTPATH_ESCAPE and a directory already on the walk CIRCULAR_SUBPROJECT_REFERENCE, each
          a loader issue carrying the member's key; a missing one records a member-absent problem in
          the graph and no loader issue — the family run reports it as MEMBER_NOT_FOUND (stage 4
          retires SUBPROJECT_NOT_FOUND), and the declaring project's own gate reports its references
          into the member as unavailable. A project member whose configuration declares PartOf is a
          kind-mismatch problem. Each is skipped. Otherwise, below the depth bound, walk the member
          the same way from step 2, as a member of this root declared under its alias
        type: local
      - stepNumber: 15
        label: tables
        description: >-
          Phase two: resolve every root's export tables, in dependency order — each after the
          members and externals its L0 re-exports from, a root met again on its own path handed on
          as null
        type: loop
        loopKind: forEach
        over: the roots read, producers before their consumers
        endStep: 17
      - stepNumber: 16
        description: Resolve the root's L1 subsystem tables from its own specs
        type: call
        targetComponent: export_resolver
        targetMethod: subsystemTables
      - stepNumber: 17
        description: >-
          Resolve the root's L0 table, handing it the root's key, its alias table and the tables
          already resolved for the producers its aliases name
        type: call
        targetComponent: export_resolver
        targetMethod: projectTable
      - stepNumber: 18
        label: bind
        description: Bind every recorded reference with `::`
        type: loop
        loopKind: forEach
        over: the references with `::` every root's files wrote
        endStep: 19
      - stepNumber: 19
        label: bound
        description: >-
          Local first; then by form. alias — the first segment is an alias of the referring root: a
          PART's alias names no namespace (its specs are the root's own), so `part::x` binds nothing
          and is unresolved with the hint to write the local id; otherwise the name is looked up
          among the public names of the named producer's resolved L0 table: found, it binds to that
          entry's canonical target (exported); not found, to the producer's spec of that local id
          (unexported, lenient until stage 4); an alias whose producer the scan did not read — an
          external outside the family, or a referenced project member — keeps the text as written
          (outside). leading `::a::rest` and path `a::rest` (a first segment the root does not
          declare) are read the stage-2 way, as a member path from the bound root, one alias per
          segment, the last segment a local id; a path whose first segment walks no member path from
          the bound root but names exactly one project of the family by its id — the bound root
          included, as a path written from a root above it reads — walks on from that project, one
          alias per segment, at any depth, so a deprecated form lands on the same target whichever
          root the family is loaded from, for its one-release grace; `super::x` climbs one
          containing project per hop and reads the rest there, local first. A deprecated form
          landing in the referring root is local; landing in another project it binds like the alias
          form when the referrer declares that producer, else leniently (undeclared). A first
          segment that names no alias, no member path and no family project id stays as written
          (unresolved). Record the form, the binding, the producer, the public name and the rewrite
          the writer would emit (AuthoredReference)
        type: local
      - stepNumber: 20
        label: imports
        description: >-
          Bind every bare name set aside, per root, through the root's imports — local first always
          held, so an import never shadows a local spec (a NAMED import a local spec hides is
          IMPORT_SHADOWED_BY_LOCAL, reported by external-declarations; a `*` import hidden by locals
          is silent, as in Rust). The candidates are the public names each import supplies: a
          member's or external's resolved L0 table when the scan read the producer (its `use` names,
          or every name for `*`), compared by nameKey. An explicit name beats a `*` from another
          import (the ES-module and Rust idiom); exactly one supplier binds it to that entry's
          canonical target (exported); two explicit suppliers, or two `*` suppliers and no explicit
          one, bind nothing (ambiguous, IMPORT_AMBIGUOUS); no supplier the scan read, while an
          import names an external the scan did not read, keeps the name as written (outside — the
          owner's gate resolves it against that external's pin); otherwise it is unresolved, with
          the hint naming a declared external or member whose table exports the key without
          importing it and the `use` line that would. Nothing outside the root's own alias table is
          ever consulted: no family-wide lookup. Record each as an AuthoredReference of form import
        type: local
      - stepNumber: 21
        description: >-
          Record per root its key, parent, alias and form, the description its parent's declaration
          gives it, legacy mount, L0, configuration, alias table, tables, spec keys, its parts, and
          authored references, and the family problems met (its members' part-unavailable and
          kind-mismatch problems included)
        type: local
      - stepNumber: 22
        description: Answer the recorded roots, bound root first
        type: return
        outcome: ScannedProjectRoot[]
    detail: full
  - name: subsystemPath
    narrative:
      - stepNumber: 1
        description: Answer the path the workspace's index records for the subsystem's spec
        type: local
    symbol: getSubsystemPath
  - name: componentPath
    narrative:
      - stepNumber: 1
        description: >-
          Answer the path the index records for the component's spec, or its placement under its
          subsystem when it is not stored yet
        type: local
    symbol: getComponentPath
  - name: interfacePath
    narrative:
      - stepNumber: 1
        description: >-
          Answer the path the index records for the interface's spec, or its placement under its
          component when it is not stored yet
        type: local
    symbol: getInterfacePath
  - name: implementationPath
    narrative:
      - stepNumber: 1
        description: >-
          Answer the path the index records for the implementation's spec, or its placement under
          its contract when it is not stored yet
        type: local
    symbol: getImplementationPath
  - name: snapshot
    narrative:
      - stepNumber: 1
        description: List every spec file of the workspace
        type: local
      - stepNumber: 2
        description: Read each file's bytes and answer them keyed by path
        type: local
    symbol: snapshotSpecFiles
status: complete
