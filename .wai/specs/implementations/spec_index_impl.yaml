id: spec_index_impl
name: Spec Index Implementation
description: >-
  Read/lookup pipeline of the spec workspace: path resolution across flat and per-subsystem layouts,
  document reads through the file store, and level-schema parsing that collects loader issues
  instead of throwing.
contract: ispec_index
sourcePath: src/core/specs.ts
methods:
  - name: loadSystemSpec
    narrative:
      - stepNumber: 1
        description: Resolve the system spec path (.index.yaml at the specs root)
        type: local
      - stepNumber: 2
        description: Read the YAML document through the file store
        type: call
        targetComponent: spec_file_store
        targetMethod: read
      - stepNumber: 3
        description: Parse against SystemSpecSchema; an absent document yields null
        type: local
  - name: loadSubsystemSpecs
    narrative:
      - stepNumber: 1
        description: >-
          Walk the specs tree for subsystem documents (the workspace scan is recursive across flat
          and per-subsystem layouts). A workspace serves its cached scan while the tree's file
          signature (paths, mtimes, sizes) is unchanged, re-checking the signature at most once per
          short TTL — and ALWAYS on the first read after the bound project root switches to this
          workspace, so a tree changed outside the process (an editor save, a git pull) is never
          served stale to a caller that just bound it
        type: call
        targetComponent: spec_file_store
        targetMethod: listTree
      - stepNumber: 2
        description: Read each listed file's document through the file store
        type: call
        targetComponent: spec_file_store
        targetMethod: read
      - stepNumber: 3
        description: >-
          Parse each against SubsystemSpecSchema, qualifying namespaces and collecting refusals as
          loader issues — a bad file never aborts the sweep
        type: local
  - name: loadSubsystemSpec
    narrative:
      - stepNumber: 1
        description: Resolve the subsystem id to its spec file path
        type: local
      - stepNumber: 2
        description: Read the YAML document through the file store
        type: call
        targetComponent: spec_file_store
        targetMethod: read
      - stepNumber: 3
        description: Parse against SubsystemSpecSchema, qualifying namespaces; an absent document yields null
        type: local
  - name: loadComponentSpecs
    narrative:
      - stepNumber: 1
        description: Walk the specs tree for component documents (flat and per-subsystem layouts)
        type: call
        targetComponent: spec_file_store
        targetMethod: listTree
      - stepNumber: 2
        description: Read each listed file's document through the file store
        type: call
        targetComponent: spec_file_store
        targetMethod: read
      - stepNumber: 3
        description: >-
          Parse each against ComponentSpecSchema, qualifying namespaces and collecting refusals as
          loader issues
        type: local
  - name: loadComponentSpec
    narrative:
      - stepNumber: 1
        description: Resolve the component id to its spec file path (flat or per-subsystem layout)
        type: local
      - stepNumber: 2
        description: Read the YAML document through the file store
        type: call
        targetComponent: spec_file_store
        targetMethod: read
      - stepNumber: 3
        description: Parse against ComponentSpecSchema, qualifying namespaces; an absent document yields null
        type: local
  - name: loadInterfaceSpecs
    narrative:
      - stepNumber: 1
        description: Walk the specs tree for interface documents (flat and per-subsystem layouts)
        type: call
        targetComponent: spec_file_store
        targetMethod: listTree
      - stepNumber: 2
        description: Read each listed file's document through the file store
        type: call
        targetComponent: spec_file_store
        targetMethod: read
      - stepNumber: 3
        description: >-
          Parse each against InterfaceSpecSchema, qualifying namespaces and collecting refusals as
          loader issues
        type: local
  - name: loadInterfaceSpec
    narrative:
      - stepNumber: 1
        description: Resolve the interface id to its spec file path
        type: local
      - stepNumber: 2
        description: Read the YAML document through the file store
        type: call
        targetComponent: spec_file_store
        targetMethod: read
      - stepNumber: 3
        description: Parse against InterfaceSpecSchema, qualifying namespaces; an absent document yields null
        type: local
  - name: loadImplementationSpecs
    narrative:
      - stepNumber: 1
        description: Walk the specs tree for implementation documents (flat and per-subsystem layouts)
        type: call
        targetComponent: spec_file_store
        targetMethod: listTree
      - stepNumber: 2
        description: Read each listed file's document through the file store
        type: call
        targetComponent: spec_file_store
        targetMethod: read
      - stepNumber: 3
        description: >-
          Parse each against ImplementationSpecSchema, qualifying namespaces and collecting refusals
          as loader issues
        type: local
  - name: loadImplementationSpec
    narrative:
      - stepNumber: 1
        description: Resolve the implementation id to its spec file path
        type: local
      - stepNumber: 2
        description: Read the YAML document through the file store
        type: call
        targetComponent: spec_file_store
        targetMethod: read
      - stepNumber: 3
        description: >-
          Parse against ImplementationSpecSchema, qualifying namespaces; an absent document yields
          null
        type: local
  - name: loadTypeSpecs
    narrative:
      - stepNumber: 1
        description: >-
          Walk the full specs tree for type documents — types live flat, per-subsystem, and in
          groups
        type: call
        targetComponent: spec_file_store
        targetMethod: listTree
      - stepNumber: 2
        description: Read each type document through the file store
        type: call
        targetComponent: spec_file_store
        targetMethod: read
      - stepNumber: 3
        description: Parse each against TypeSpecSchema, collecting refusals as loader issues
        type: local
      - stepNumber: 4
        description: Return the parsed type specs
        type: return
        outcome: TypeSpec[]
  - name: listChainedRoots
    narrative:
      - stepNumber: 1
        description: >-
          Load this project's subsystem specs and keep the top-level ones carrying a projectPath —
          those are its chained mounts
        type: call
        targetComponent: spec_file_store
        targetMethod: listTree
      - stepNumber: 2
        description: >-
          Resolve each mount's projectPath against the project that declares it, under the
          containment guard against THAT project's root (lexically and through links), and skip a
          mount whose directory does not exist
        type: local
      - stepNumber: 3
        description: >-
          Recurse into each existing child root the same way, prefixing its own mounts with the
          child's project-relative path, so nested chains contribute every level
        type: local
      - stepNumber: 4
        description: Return the project-relative roots in walk order
        type: return
        outcome: string[]
  - name: resolveSubprojectForNamespace
    narrative: []
    detail: intent
    intent: >-
      Walks the namespace segment by segment through the scanned index, resolving each mount's
      projectPath against the previous mount's directory; a hop whose path escapes the project
      declaring it (lexically or through a link) raises PROJECTPATH_ESCAPE and is skipped, and a
      namespace in which no segment is a mount yields null.
  - name: inspectChainedRoots
    narrative: []
    detail: intent
    intent: >-
      Walks the chained mounts exactly as the loader recurses — each projectPath resolved against
      its declaring project and contained by that project's root, lexically and through links —
      collecting the followable roots in walk order and every refused mount (escapes, missing,
      cyclic, too-deep) with its qualified id, declared path and reason; listChainedRoots returns
      the roots half.
  - name: loadTypeSpec
    narrative:
      - stepNumber: 1
        description: >-
          Walk the full specs tree for type documents — types live flat, per-subsystem, and in
          groups
        type: call
        targetComponent: spec_file_store
        targetMethod: listTree
      - stepNumber: 2
        description: Read each type document through the file store
        type: call
        targetComponent: spec_file_store
        targetMethod: read
      - stepNumber: 3
        description: >-
          Parse each against TypeSpecSchema and answer with the one whose id matches, or null when
          none does
        type: local
  - name: load
    narrative:
      - stepNumber: 1
        description: >-
          Turn the kind into this index's typed loader of that kind — the one switch every
          kind-holding caller used to repeat; the L0 ignores the id
        type: local
      - stepNumber: 2
        description: The typed loader reads the document through the file store
        type: call
        targetComponent: spec_file_store
        targetMethod: read
      - stepNumber: 3
        description: Answer with the parsed spec, or null when no document is stored
        type: return
        outcome: loaded
  - name: listProjectRoots
    narrative:
      - stepNumber: 1
        description: >-
          Serve the workspace scan (cached while the tree's file signature holds): the scan walks
          every spec directory of the bound root and each chained member, recording per root its
          namespace, parent, mount alias and directory as it recurses
        type: call
        targetComponent: spec_file_store
        targetMethod: listTree
      - stepNumber: 2
        description: >-
          At each root, read its own L0 document through the file store — a member's L0 is recorded
          on its root, never merged into the index, whose L0 stays the bound root's
        type: call
        targetComponent: spec_file_store
        targetMethod: read
      - stepNumber: 3
        description: >-
          Qualify the member L0's export entries into the member's namespace the way the loader
          qualifies an L1 re-export (`from` against the namespace the member declares its subsystems
          in, `component`, `interface` and `typeDef` against that source's namespace)
        type: local
      - stepNumber: 4
        description: >-
          Record the root's configuration, read through the configuration bound at that root — the
          per-root binding the scan already reads the root's specs folder through (a scan may read
          the configuration of the root it is walking) — and add the root's .wai/project.yaml to the
          scan's freshness signature, so an edit to its externals re-scans
        type: local
      - stepNumber: 5
        description: >-
          Record the ids of every spec the root's files declared (a mount subsystem merged with its
          realization belongs to the root it mounts), and every reference the root's files wrote
          with a leading `::`, with its position and the absolute id it qualified to, before
          qualification erases the form
        type: local
      - stepNumber: 6
        description: Answer the recorded roots, bound root first
        type: return
        outcome: ScannedProjectRoot[]
    detail: full
status: complete
