id: authoring_orchestrator_impl
name: Authoring Orchestrator Implementation
description: >-
  The gated write composition in src/core/authoring.ts. It holds no state and owns no merge logic:
  it resolves the settings to judge with, reads what a write is applied to, runs the candidate
  judgement, and hands the write outward to sdd_core — as a direct save for a whole-spec
  restatement, and as an injected hook for a delta update or a method move, because the store must
  not import the rule engine that already reads it. What a restatement becomes over the stored spec
  is the restatement's own pure behaviour (spec_restatement.applyTo), not this workflow's. Both
  collaborators are peers of this subsystem, not members of it, which is why each hop is named by
  its own client adapter.
contract: iauthoring_orchestrator
sourcePath: src/core/authoring.ts
methods:
  - name: updateSpecGated
    narrative:
      - stepNumber: 1
        description: >-
          Read the bound project's configuration: the rule severities and project type the judgement
          uses, and the test roots the report searches. A project that has none is judged on the
          defaults and searches nothing
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 2
        description: >-
          Read the spec as it stands before the delta: the owning subsystem the judgement compares
          against, and — when the project declares test roots — a method the delta deletes, placed
          in its file and named by its stored code-level symbol, which only the version that still
          held it can answer
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: loadSpec
      - stepNumber: 3
        description: >-
          Build the judgement as a write hook over those same settings. It judges the MERGED spec,
          because a delta on its own cannot tell you the resulting componentType, and it is the
          resulting componentType that decides whether a field belongs. The merge is over the spec
          as STORED, so a method that takes its signature from a source carries only the source, not
          the params the loader resolved into it; the hook refuses a merged interface method that
          names a signatureFrom and also states params or returns (SIGNATURE_SOURCE_RESTATED), so
          adopting a source on a method that restated it means unsetting its params and returns in
          the same delta. For an interface or a type it reads the merged spec's type positions under
          the grammar (interface_spec.canonicalTypes, type_spec.canonicalTypes): every alias is
          respelled and recorded for the change report, and a position the delta itself WROTE that
          is not canonical is refused (TYPE_EXPRESSION_INVALID, TYPE_POSITION_INVALID,
          TYPE_FORM_UNSUPPORTED or TYPE_NOT_NEUTRAL, naming the replacement — `number` asks "int or
          float?"); a stored position the delta leaves alone is not judged, so a spec holding one
          from before the grammar can still be edited and repaired. For an interface or a type it
          refuses, the same way writeSpec does, a method, parameter or field name the delta
          introduces that breaks identifier.problemAs, is reserved in the target language
          (identifier.reservedIn), repeats one in its place, or — a new contract method on a
          contract that implements nothing — breaks the method casing (invalid-name); a name the
          stored spec already held is not judged. For a component or a type it also refuses an
          owning subsystem the delta sets to one the tree does not have, read through the core
          adapter's loadSpec — the store permits a delta to set the owner only as the repair of a
          spec whose stored owner the tree does not have, so the repair must land somewhere real.
          For a component it judges the merged spec against the spec-scoped rules
          (validateComponentCandidate), and for a component or an interface it asks which design
          findings the merged spec introduces in the bound tree (introducedFindings): an error
          refuses the write with the formatted refusal, a warning or notice joins the report's
          notices — the same judgement writeSpec runs, so a create and a delta accept the same
          designs
        type: local
      - stepNumber: 4
        description: >-
          Apply the delta through the core client adapter's update with that hook injected, so the
          judgement runs on the merged spec at the last point before anything reaches disk,
          forwarding a caller's request to be told what the delta would do rather than have it
          written
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: updateSpec
      - stepNumber: 5
        description: >-
          When the write changes a Portal's transport — a dry run included, before anything is
          written — name its impact on the callers: read the components (and, through
          loadImplementationSpecs, their implementations' call, register and dispatch steps) and add
          one notice per Adapter that states another transport and calls this Portal: the
          ADAPTER_TRANSPORT_MISMATCH the change raises there, with the way out (state the new
          transport, or none to follow the Portal)
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: loadComponentSpecs
      - stepNumber: 6
        description: >-
          When the delta writes a contract's `implements` — a dry run included, before anything is
          written — ask what validate will say of it: an undeclared alias, a name the producer does
          not export, or one exported for calling rather than as an extension point (role
          implement); a problem is added to the report as a notice that names the finding that will
          follow
        type: call
        targetComponent: authoring_validator_adapter
        targetMethod: implementsProblem
      - stepNumber: 7
        description: Decide whether this write invalidated any test
        type: branch
        condition: the change report names a changed or deleted method and the project declares test roots
        onTrueStep: 8
        onFalseStep: 10
      - stepNumber: 8
        description: >-
          Place each changed method in the file realizing it: for a contract, every implementation
          realizing it with its symbol and file; for an implementation or a type, the method's entry
          in the stored spec, its sourcePath else the spec's. A symbol the delta itself states wins
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: loadImplementationSpecs
      - stepNumber: 9
        description: >-
          Find the tests that encode those methods, so the write that creates the collision is the
          one that reports it — a spec pass that changes a contract and says nothing is how a brief
          comes to promise green tests it has already broken. The method names come from the change
          report's own paths, which covers a rewrite and a removal alike, and a `symbol` is taken
          from the delta when it carries one: a method whose symbol was set by an earlier write and
          not restated is searched by its contract name, because the report does not carry the
          merged spec to read it back from
        type: call
        targetComponent: authoring_validator_adapter
        targetMethod: findTestsReferencing
      - stepNumber: 10
        description: >-
          Return the change report: what changed, which of the delta's paths changed nothing, or
          that nothing did and nothing was written — carrying the respellings the write applied
          (each type position the canonical spelling replaced) and the tests to revisit when this
          write invalidated any
        type: return
        outcome: reported
  - name: moveMethods
    narrative:
      - stepNumber: 1
        description: >-
          Read the bound project's configuration for the rule severities, project type and
          dependency ceiling to judge with; a project that has none is judged on the defaults
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 2
        description: >-
          Build the judgement as a write hook over those settings, with both halves: `gate` to
          refuse the resulting components at the write boundary, and `assess` to answer the same
          question about a candidate home without throwing, so the store can rank alternatives
          without driving a search on caught exceptions
        type: local
      - stepNumber: 3
        description: >-
          Hand the move to the core client adapter with that hook injected, so the judgement runs on
          the resulting components at the last point before anything reaches disk, and the store —
          which holds the tree — enumerates the candidate homes a refusal needs
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: moveMethods
      - stepNumber: 4
        description: >-
          Return the move's report unchanged: what moved and how many references followed it, or
          which rule refused it and where these methods could live instead
        type: return
        outcome: reported
  - name: writeSpec
    narrative:
      - stepNumber: 1
        description: >-
          Read the bound project's configuration: the rule severities and project type a component
          candidate is judged with, and the test roots the receipt searches. A project that has
          none, or whose configuration cannot be read, is judged on the defaults and searches
          nothing
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 2
        description: >-
          Ask the restatement which spec it cannot be written without (spec_restatement.parent), and
          decide whether there is a parent to read
        type: branch
        condition: the restatement names a parent
        onTrueStep: 3
        onFalseStep: 4
      - stepNumber: 3
        description: >-
          Read the parent through the core client adapter; an absent parent is the restatement's to
          refuse, below
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: loadSpec
      - stepNumber: 4
        label: existing
        description: Read the spec this restatement re-authors, if one already holds the id
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: loadSpec
      - stepNumber: 5
        description: Decide whether this write gives an id to a new spec of a kind that keeps a rename trace
        type: branch
        condition: no spec already holds the id and the kind is component, interface, implementation or type
        onTrueStep: 6
        onFalseStep: 9
      - stepNumber: 6
        description: Read the bound tree's spec index, for the rename traces
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: scanAllSpecs
      - stepNumber: 7
        description: Ask which spec of this kind retired the id (spec_index.retiredBy; a type within its owner)
        type: branch
        condition: a spec of this kind lists the id in its rename trace (previousIds)
        onTrueStep: 8
        onFalseStep: 9
      - stepNumber: 8
        label: id-retired
        description: >-
          Refuse before anything reaches disk (id-retired), naming the holder and the way out:
          unsetting the holder's previousIds releases the id, at the cost that a consumer holding
          the old key reads a delete and an add — left alone, it would read the new spec as the
          renamed one
        type: throw
        error: id-retired
      - stepNumber: 9
        description: >-
          Apply the restatement to the stored spec (spec_restatement.applyTo): the status, the
          candidate with every unexpressed field carried, the parent-derived fields, the narrative
          labels resolved, the notices, and the methods it changes or removes — or the refusal that
          stops it
        type: local
      - stepNumber: 10
        description: Decide whether the restatement may be written at all
        type: branch
        condition: the application carries a refusal
        onTrueStep: 11
        onFalseStep: 12
      - stepNumber: 11
        description: >-
          Refuse with the application's own sentence — a missing parent, a status the write would
          lower, a label that does not resolve, an interface method that names a signature source
          and also states params or returns (SIGNATURE_SOURCE_RESTATED), or a type position that is
          not canonical (TYPE_EXPRESSION_INVALID, TYPE_POSITION_INVALID, TYPE_FORM_UNSUPPORTED or
          TYPE_NOT_NEUTRAL, naming the replacement) — before anything reaches disk
        type: throw
        error: restatement refused
      - stepNumber: 12
        label: name-check
        description: >-
          Decide whether an interface or a type candidate introduces a name the tree cannot hold,
          reading the L0 and the owning subsystem it names (an interface through its component)
          through the core client adapter's loadSpec for the effective targetLanguage: a method,
          parameter or field name the stored spec does not already hold — so a spec carrying an
          older name can still be edited — that breaks the identifier grammar (identifier.problemAs:
          empty, over 64 characters, a leading digit, __proto__), is a word the target language
          reserves for that kind (identifier.reservedIn), is a second member of the same name in one
          place, or — a contract method on a contract that implements no other project's extension
          point — is outside the tree's method casing (naming_rule_config.methodCasingFor): exactly
          what sdd_rename_method refuses, so define and rename accept the same names
        type: branch
        condition: >-
          the candidate is an interface or a type, and an introduced method, parameter or field name
          breaks the grammar, is reserved, repeats one in its place, or breaks the method casing
        onFalseStep: 14
      - stepNumber: 13
        label: invalid-name
        description: >-
          Refuse before anything reaches disk (invalid-name), naming every such name and why — the
          language and an alternative for a reserved word
        type: throw
        error: invalid-name
      - stepNumber: 14
        label: judge
        description: >-
          Decide whether the candidate is a component, the one kind the intrinsic rules judge at the
          write boundary
        type: branch
        condition: the restatement's kind is component
        onTrueStep: 15
        onFalseStep: 16
      - stepNumber: 15
        description: >-
          Judge the candidate — the spec that will actually be written, carried fields included, so
          retyping a Portal carries its auth into the judgement instead of letting it vanish unseen
          — against the spec-scoped rules with the project's own settings
        type: call
        targetComponent: authoring_validator_adapter
        targetMethod: validateComponentCandidate
      - stepNumber: 16
        label: in-tree
        description: >-
          Ask which design findings the candidate introduces in the bound tree: an edge between two
          existing blocks whose stereotypes forbid it, or a route two bound methods share — only
          those the stored tree did not already hold and no later write in the authoring order can
          cure; a kind those rules do not judge answers an empty verdict
        type: call
        targetComponent: authoring_validator_adapter
        targetMethod: introducedFindings
      - stepNumber: 17
        description: Decide on the verdicts
        type: branch
        condition: the intrinsic or the in-tree verdict holds at least one error
        onTrueStep: 18
        onFalseStep: 19
      - stepNumber: 18
        description: >-
          Refuse the write with the formatted refusal, naming every rule code the candidate broke or
          would introduce — the same codes and messages validate gives — before anything reaches
          disk, so the remedy is to fix the arguments and call again; a warning or notice (a code
          the project tuned down) rides along as one of the receipt's notices instead
        type: throw
        error: rule violation
      - stepNumber: 19
        label: persist
        description: >-
          Refuse the legacy mount form: a subsystem that names a projectPath is a member
          declaration, not a subsystem
        type: branch
        condition: the candidate is a subsystem that names a projectPath
        onTrueStep: 20
        onFalseStep: 21
      - stepNumber: 20
        description: >-
          Refuse before anything reaches disk, naming the subsystem and the replacement: a member is
          declared in project.yaml `members` (sdd_add_member / `wairon member add`), which scaffolds
          its project; wairon never writes the L1 mount form
        type: throw
        error: mount form refused
      - stepNumber: 21
        label: save
        description: >-
          Persist the candidate through the core client adapter, collecting the store's placement
          notices
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: saveSpec
      - stepNumber: 22
        label: tests
        description: Decide whether this write invalidated any test
        type: branch
        condition: the application names a changed or removed method and the project declares test roots
        onTrueStep: 23
        onFalseStep: 25
      - stepNumber: 23
        description: >-
          Place each changed method in the file realizing it (the private searchedMethods): for a
          contract, read every implementation realizing it and take each one's symbol and file for
          the method, since a contract method's tests import its realization; for an implementation
          or a type, the method's own entry in the stored spec before the restated one, its symbol,
          and its own sourcePath else the spec's. A method no spec places in a file is searched by
          name alone
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: loadImplementationSpecs
      - stepNumber: 24
        description: >-
          Find the tests that encode those methods, so the restatement that drops or rewrites a
          method reports the collision exactly as a delta that does the same does, each method
          searched by its stored symbol when it has one
        type: call
        targetComponent: authoring_validator_adapter
        targetMethod: findTestsReferencing
      - stepNumber: 25
        label: receipt
        description: >-
          Return the write receipt: the kind, id and name written, whether a spec already held the
          id, the status written, the notices — the gate's warnings, the application's re-authoring
          notices and the store's placement notices — the respellings the application applied (each
          type position the input wrote as an alias, with the canonical spelling stored), and the
          tests to revisit
        type: return
        outcome: written
  - name: deleteSpec
    narrative:
      - stepNumber: 1
        label: member-key
        description: >-
          Decide whether the id names the L0 or a spec of a member project read through this tree
          (its key carries the member's prefix): neither has a subtree this project may plan
        type: branch
        condition: the kind is system, or the id is a member project's key
        onTrueStep: 2
        onFalseStep: 4
      - stepNumber: 2
        description: >-
          Delete that one document through the core client adapter, as the store always has — the
          store refuses the L0, the root every other spec hangs from; a dry run only reads whether
          it is there
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: deleteSpec
      - stepNumber: 3
        label: single-document
        description: 'Answer with that single document: removed, or not there'
        type: return
        outcome: single document
      - stepNumber: 4
        description: >-
          Read the bound project's configuration for the test roots the report searches; a project
          that has none searches nothing
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 5
        description: >-
          Read the bound tree's spec index, this project's own specs only — a member's specs are
          deleted from its own root
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: scanAllSpecs
      - stepNumber: 6
        description: Read the L0, whose export table may name what the deletion removes
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: loadSpec
      - stepNumber: 7
        description: >-
          Ask the index what deleting the spec takes with it (spec_index.subtreeOf): the spec itself
          and everything it contains, innermost first
        type: local
      - stepNumber: 8
        description: Decide whether there is anything to delete
        type: branch
        condition: no spec of the kind holds the id
        onFalseStep: 10
      - stepNumber: 9
        label: not-found
        description: >-
          Answer that nothing was deleted: a spec that was not there is not a failure, but it is not
          a deletion either
        type: return
        outcome: nothing deleted
      - stepNumber: 10
        description: >-
          Ask the index which references specs outside that set still hold to it
          (spec_index.referencesTo), each with the spec holding it and its position
        type: local
      - stepNumber: 11
        description: Decide whether the deletion takes away any method
        type: branch
        condition: >-
          a removed contract, implementation or type held methods and the project declares test
          roots
        onFalseStep: 14
      - stepNumber: 12
        description: >-
          Place each removed method in the file realizing it — for a removed contract, the
          implementations realizing it; for an implementation or a type, the method's own sourcePath
          else the spec's — read now, while those implementations still exist
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: loadImplementationSpecs
      - stepNumber: 13
        description: >-
          Find the tests that encode the removed methods, each searched by its symbol when it
          declared one
        type: call
        targetComponent: authoring_validator_adapter
        targetMethod: findTestsReferencing
      - stepNumber: 14
        label: plan
        description: Decide whether the caller asked only for the plan
        type: branch
        condition: the caller asked for a dry run
        onFalseStep: 16
      - stepNumber: 15
        label: dry-run
        description: >-
          Answer with the plan: every spec that would go, every reference that would be left, and
          the tests to revisit — nothing removed
        type: return
        outcome: dry run
      - stepNumber: 16
        description: Decide whether the deletion would leave references dangling
        type: branch
        condition: a spec outside the set still references it and the caller did not force the deletion
        onFalseStep: 18
      - stepNumber: 17
        label: referenced
        description: >-
          Refuse before anything is removed, naming each reference with the spec that holds it and
          its position, and the two ways on: edit those specs first, or force the deletion and leave
          them for validate to report — they are the invalid references the deletion itself would
          introduce
        type: throw
        error: 'referenced: other specs still reference what the deletion removes'
      - stepNumber: 18
        label: remove
        description: For each spec of the set, innermost first, so a container goes after its content
        type: loop
        loopKind: forEach
        over: the specs the deletion takes
        endStep: 19
      - stepNumber: 19
        description: >-
          Delete the spec document through the core client adapter, which prunes the folders it
          leaves empty
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: deleteSpec
      - stepNumber: 20
        description: >-
          Return the deletion: the kind and id, that it was removed, every spec it took, the
          references a forced deletion left dangling, and the tests to revisit
        type: return
        outcome: deleted
status: complete
