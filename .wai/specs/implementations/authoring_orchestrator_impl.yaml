id: authoring_orchestrator_impl
name: Authoring Orchestrator Implementation
description: >-
  The gated write composition in src/core/authoring.ts. It holds no state and owns no merge logic:
  it resolves the settings to judge with, reads what a write is applied to, runs the candidate
  judgement, and hands the write outward to sdd_core — as a direct save for a whole-spec
  restatement, and as an injected hook for a delta update or a method move, because the store must
  not import the rule engine that already reads it. What a restatement becomes over the stored spec
  is the restatement's own pure behaviour (spec_restatement.applyTo), not this workflow's. Both
  collaborators are peers of this subsystem, not members of it, which is why each hop is named by
  its own client adapter.
contract: iauthoring_orchestrator
sourcePath: src/core/authoring.ts
methods:
  - name: updateSpecGated
    narrative:
      - stepNumber: 1
        description: >-
          Read the bound project's configuration: the rule severities and project type the judgement
          uses, and the test roots the report searches. A project that has none is judged on the
          defaults and searches nothing
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 2
        description: >-
          Ask the core adapter whether the spec lives in another project — a member's spec read
          through this tree, or one named through an external's alias — or, asked to exist, is one
          the bound project does not hold (another project's when only a member holds that bare id,
          else missing), answering for the tool the caller names (sdd_set_endpoints,
          sdd_set_public_interfaces), sdd_update_spec when it names none, so the refusal names the
          call to make in that project's session
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: crossProjectWriteRefusal
      - stepNumber: 3
        description: Decide on the project boundary
        type: branch
        condition: the spec lives in another project
        onFalseStep: 5
      - stepNumber: 4
        label: chained-spec
        description: >-
          Refuse before anything is judged or written, with the core's sentence: the member, its
          folder, the session to open there and the call to make there
        type: throw
        error: 'chained-spec: the spec lives in another project'
      - stepNumber: 5
        description: >-
          Read the spec as it stands before the delta: the owning subsystem the judgement compares
          against, the contract methods a delta may remove, and — when the project declares test
          roots — a method the delta deletes, placed in its file and named by its stored code-level
          symbol, which only the version that still held it can answer
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: loadSpec
      - stepNumber: 6
        description: >-
          Decide whether the delta removes contract methods: a method element with a delete marker
          on a contract, or the contract's method list emptied
        type: branch
        condition: the spec is a contract and the delta removes at least one method it holds
        onFalseStep: 12
      - stepNumber: 7
        description: Read the bound tree's spec index, this project's own specs
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: scanAllSpecs
      - stepNumber: 8
        description: >-
          Ask the index which specs reference a removed method (spec_index.methodReferencesTo) —
          leaving out the removed methods' own implementation entries, which go with them — and
          which implementation entries realize one: the entries the write removes with them
          (cascaded)
        type: local
      - stepNumber: 9
        description: Decide whether a removal would leave references dangling
        type: branch
        condition: a spec that stays references a removed method
        onFalseStep: 11
      - stepNumber: 10
        label: method-referenced
        description: >-
          Refuse before anything is written, naming each reference with the spec holding it and its
          position: they are the invalid method references the removal would introduce. Edit those
          specs first
        type: throw
        error: 'method-referenced: specs that stay still reference a removed method'
      - stepNumber: 11
        description: >-
          Read, before the write, every public name a consumer reaches a removed method through —
          the entries publishing it and every published verb forwarding it — for the report's
          published list
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: publishedUsesOf
      - stepNumber: 12
        description: >-
          Build the judgement as a write hook over the settings read in step 1. It judges the MERGED
          spec, because a delta on its own cannot tell you the resulting componentType, and it is
          the resulting componentType that decides whether a field belongs. The merge is over the
          spec as STORED, so a method that takes its signature from a source carries only the
          source; the hook refuses a merged interface method that names a signatureFrom and also
          states params or returns (SIGNATURE_SOURCE_RESTATED). For an interface or a type it reads
          the merged spec's type positions under the grammar: every alias is respelled and recorded,
          and a position the delta itself WROTE that is not canonical is refused, naming the
          replacement; a stored one the delta leaves alone is not judged. It refuses a method,
          parameter or field name the delta introduces that breaks the identifier grammar, is
          reserved in the target language, repeats one in its place, or breaks the method casing
          (invalid-name). For a component or a type it refuses an owning subsystem the delta sets to
          one the tree does not have. For a component it judges the merged spec against the
          spec-scoped rules (validateComponentCandidate), and for a component or an interface it
          asks which design findings the merged spec introduces in the bound tree
          (introducedFindings): an error refuses the write, a warning or notice joins the report's
          notices
        type: local
      - stepNumber: 13
        label: abstraction-touched
        description: >-
          Decide whether the write touches an abstraction, whose findings land on specs the write
          does not name: a contract that implements one or belongs to an abstract component, as
          stored or as the delta leaves it, or a component the delta makes or unmakes abstract
        type: branch
        condition: the spec is such a contract or component
        onFalseStep: 21
      - stepNumber: 14
        description: >-
          Rehearse the delta, as a method move rehearses its own: a private copy of the bound tree
          to write it on
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: rehearsalCopy
      - stepNumber: 15
        description: >-
          Bound to the copy, read the active rule set, to set aside the findings that judge code — a
          copy holds the design alone
        type: call
        targetComponent: authoring_validator_adapter
        targetMethod: listRules
      - stepNumber: 16
        description: 'Judge the copy as it stands: the owner''s gate, its design errors and warnings'
        type: call
        targetComponent: authoring_validator_adapter
        targetMethod: validateProject
      - stepNumber: 17
        description: >-
          Apply the delta on the copy through the core client adapter with the hook injected,
          exactly as the real write applies it
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: updateSpec
      - stepNumber: 18
        description: Judge the copy as the delta leaves it, the same way
        type: call
        targetComponent: authoring_validator_adapter
        targetMethod: validateProject
      - stepNumber: 19
        description: Discard the copy, whatever the rehearsal did
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: discardRehearsal
      - stepNumber: 20
        description: >-
          The findings the write brings: each error and warning the copy reports after the delta
          that it did not report before, counted by code and spec (a message naming the copy's
          folder read as the project's) — an IMPLEMENTS_MISMATCH on an implementer, an abstraction
          left unimplemented. Reported, never refusing: an abstraction edit leaves its implementers
          mismatched until each is restated. A rehearsal that throws names nothing
        type: local
      - stepNumber: 21
        description: >-
          Apply the delta through the core client adapter's update with that hook injected, so the
          judgement runs on the merged spec at the last point before anything reaches disk,
          forwarding a caller's request to be told what the delta would do rather than have it
          written
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: updateSpec
      - stepNumber: 22
        description: Decide whether removed methods take implementation entries with them
        type: branch
        condition: the write removed contract methods that implementation entries realize
        onFalseStep: 24
      - stepNumber: 23
        description: >-
          For each implementation holding such an entry, remove the entries through the core
          adapter's update in the same dry-run mode, and record each `<implementation>.<method>` as
          cascaded, with a notice naming it
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: updateSpec
      - stepNumber: 24
        description: >-
          When the write changes a Portal's transport — a dry run included — name its impact on the
          callers: read the components (and their implementations' call, register and dispatch
          steps) and add one notice per Adapter that states another transport and calls this Portal:
          the ADAPTER_TRANSPORT_MISMATCH the change raises there, with the way out
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: loadComponentSpecs
      - stepNumber: 25
        description: >-
          When the delta writes a contract's `implements` — a dry run included — ask what validate
          will say of it, and add a problem to the report as a notice that names the finding that
          will follow
        type: call
        targetComponent: authoring_validator_adapter
        targetMethod: implementsProblem
      - stepNumber: 26
        description: >-
          Decide whether the write changed a contract method's signature, a dry run included: a
          parameter added, removed, retyped or made optional or required, the returns changed, or
          whether it completes later
        type: branch
        condition: >-
          the spec is a contract and the change report names a changed params or returns of one of
          its methods
        onFalseStep: 28
      - stepNumber: 27
        description: >-
          For each such method, look up the references to <component>.<method> without text mentions
          and keep the callers: the calling specs (a call, dispatch or register step, a declared
          call) and the code sites the call graph resolved to it, and for a method whose contract
          implements an abstraction the callers of that abstraction's method too, since they reach
          it through the abstraction, and for a method of an abstraction the callers of every
          abstraction below it that restates it, which the lookup answers as its own. For a method
          of an abstraction, record as implementers each contract implementing it at any depth that
          restates the method with the signature the stored contract held: each will report
          IMPLEMENTS_MISMATCH until edited. Record each method as callersToReview with what changed,
          at most ten callers beside the total, and the implementers. Information only: no finding,
          no gate, and a failed lookup records nothing
        type: call
        targetComponent: authoring_validator_adapter
        targetMethod: findReferences
      - stepNumber: 28
        description: Decide whether this write invalidated any test
        type: branch
        condition: the change report names a changed or deleted method and the project declares test roots
        onFalseStep: 31
      - stepNumber: 29
        description: >-
          Place each changed method in the file realizing it: for a contract, every implementation
          realizing it with its symbol and file; for an implementation or a type, the method's entry
          in the stored spec, its sourcePath else the spec's. A symbol the delta itself states wins
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: loadImplementationSpecs
      - stepNumber: 30
        description: >-
          Find the tests that encode those methods, so the write that creates the collision is the
          one that reports it; the method names come from the change report's own paths, which
          covers a rewrite and a removal alike
        type: call
        targetComponent: authoring_validator_adapter
        targetMethod: findTestsReferencing
      - stepNumber: 31
        description: >-
          Return the change report: what changed, which of the delta's paths changed nothing, or
          that nothing did and nothing was written — the respellings applied, the implementation
          entries cascaded, the public names a removed method was published under, the callers to
          review of a changed signature and the implementers that must restate it, the findings a
          write touching an abstraction brings, and the tests to revisit. A write that changed code
          linkage (a sourcePath, symbol, exportedVia, injectedParams, router, bindings or simPath)
          carries one notice that the code findings it may bring are not judged here, naming
          sdd_validate_tree, which judges them: no rehearsal holds the code
        type: return
        outcome: reported
  - name: moveMethods
    narrative:
      - stepNumber: 1
        description: >-
          Ask the core adapter whether either component lives in another project or, asked to exist,
          is one the bound project does not hold — answering with the exact move to make at the
          owning project's root
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: crossProjectWriteRefusal
      - stepNumber: 2
        description: Decide on the project boundary
        type: branch
        condition: the source or the target lives in another project
        onFalseStep: 4
      - stepNumber: 3
        label: chained-spec
        description: Refuse before anything is judged or written, with the core's sentence
        type: throw
        error: 'chained-spec: the component lives in another project'
      - stepNumber: 4
        description: >-
          Read the bound project's configuration for the rule severities, project type and
          dependency ceiling to judge with; a project that has none is judged on the defaults
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 5
        description: >-
          Build the judgement as a write hook over those settings, with both halves: `gate` to
          refuse the resulting components at the write boundary, and `assess` to answer the same
          question about a candidate home without throwing, so the store can rank alternatives
          without driving a search on caught exceptions
        type: local
      - stepNumber: 6
        description: >-
          Rehearse the move, as a spec move rehearses its own: a private copy of the bound tree to
          write it on
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: rehearsalCopy
      - stepNumber: 7
        description: >-
          Bound to the copy, read the active rule set, to set aside the findings that judge code — a
          copy holds the design alone
        type: call
        targetComponent: authoring_validator_adapter
        targetMethod: listRules
      - stepNumber: 8
        description: 'Judge the copy as it stands: the owner''s gate, its design errors and warnings'
        type: call
        targetComponent: authoring_validator_adapter
        targetMethod: validateProject
      - stepNumber: 9
        description: >-
          Write the move on the copy through the core client adapter with the hook injected, exactly
          as the real move would be written
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: moveMethods
      - stepNumber: 10
        description: Judge the copy as the move leaves it, the same way
        type: call
        targetComponent: authoring_validator_adapter
        targetMethod: validateProject
      - stepNumber: 11
        description: Discard the copy, whatever the rehearsal did
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: discardRehearsal
      - stepNumber: 12
        description: >-
          The findings the move brings: each error and warning the copy reports after the move that
          it did not report before, counted by code and spec (a message naming the copy's folder
          read as the project's) — an undeclared dependency call, an implementation left without its
          method, a leaked technology. A rehearsal that throws names nothing
        type: local
      - stepNumber: 13
        description: Did a rule refuse the move on the copy?
        type: branch
        condition: the rehearsal's report carries refusals
        onFalseStep: 15
      - stepNumber: 14
        description: >-
          Return that refusal as the move's report (marked dryRun when asked): which rule refused it
          and where these methods could live instead; nothing was written
        type: return
        outcome: refused report
      - stepNumber: 15
        description: >-
          Does the rehearsal leave a new error? Asked of a dry run too, so a dry run is refused
          exactly when the move would be
        type: branch
        condition: the findings hold an error
        onFalseStep: 17
      - stepNumber: 16
        description: >-
          Return the move refused: its refusals name each new error with its code, spec and message,
          as a spec move's refusal does, and its findings list them; nothing was written
        type: return
        outcome: refused report
      - stepNumber: 17
        description: A dry run stops here
        type: branch
        condition: dryRun
        onFalseStep: 19
      - stepNumber: 18
        description: >-
          Return the rehearsal's report, marked dryRun, with the findings the result will have;
          nothing was written
        type: return
        outcome: the planned move
      - stepNumber: 19
        description: >-
          Hand the move to the core client adapter with that hook injected, so the judgement runs on
          the resulting components at the last point before anything reaches disk, and the store —
          which holds the tree — enumerates the candidate homes a refusal needs; the move was
          rehearsed whole, so it is written as rehearsed
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: moveMethods
      - stepNumber: 20
        description: >-
          Return the move's report with the rehearsal's findings: what moved and how many references
          followed it
        type: return
        outcome: the move's report
  - name: moveSpec
    narrative:
      - stepNumber: 1
        description: >-
          Ask the core adapter whether the spec, or any spec moving together with it, lives in
          another project or, asked to exist, is one the bound project does not hold; then whether
          the subsystem they move to lives in another project
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: crossProjectWriteRefusal
      - stepNumber: 2
        description: Decide on the project boundary
        type: branch
        condition: the spec or the target lives in another project
        onFalseStep: 4
      - stepNumber: 3
        label: chained-spec
        description: Refuse before anything is judged or written, with the core's sentence
        type: throw
        error: 'chained-spec: the spec lives in another project'
      - stepNumber: 4
        description: 'Decide whether components move: their edges are judged first; a type carries no edges'
        type: branch
        condition: the kind is component
        onFalseStep: 12
      - stepNumber: 5
        description: >-
          Read the bound project's configuration: the rule severities and project type the move is
          judged with
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 6
        description: >-
          Ask the core adapter for the move's plan as a dry run, for the addressed component and
          each one moving together with it (a member a listed pattern owns goes with its owner):
          what moves — each component and every member it owns — refused exactly as the move would
          be, so one refused spec refuses them all before anything is written
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: moveSpec
      - stepNumber: 7
        description: >-
          Read every moved component as stored, and set its new subsystem — all of them at once, so
          an edge between two of them stays inside the new subsystem
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: loadSpec
      - stepNumber: 8
        description: >-
          Ask which design findings the moved components introduce in the bound tree TOGETHER —
          every edge into or out of the moved set read with their new subsystem, an edge between two
          moved components judged as the one subsystem it now lies in
        type: call
        targetComponent: authoring_validator_adapter
        targetMethod: introducedFindings
      - stepNumber: 9
        description: Decide on the verdict
        type: branch
        condition: the verdict holds an error
        onFalseStep: 11
      - stepNumber: 10
        label: refused
        description: >-
          Refuse the move with the rule's own words — a forbidden doctrine edge, or a
          cross-subsystem edge into a non-Portal the move would create, or an abstraction
          implemented across the new subsystem boundary without a publication with role implement —
          before anything is written, naming the collaborators left behind (the components of the
          old subsystem with an edge into or out of the moved set, a dependsOn, a call or an
          implements entry among them) as the `together` list that takes them along
        type: throw
        error: the move would introduce an error validate reports
      - stepNumber: 11
        description: >-
          Keep the verdict's warnings and notices — a curable boundary finding the move introduces —
          for the report; the components are planned, go to the rehearsal
        type: jump
        toStep: 13
      - stepNumber: 12
        description: >-
          A type: plan it and each type moving together with it as a dry run through the core
          adapter, refused exactly as the move would be, so one refused type refuses them all before
          anything is written
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: moveSpec
      - stepNumber: 13
        label: rehearse
        description: >-
          Rehearse the move, as the family migrations rehearse theirs: a private copy of the bound
          tree to write it on
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: rehearsalCopy
      - stepNumber: 14
        description: >-
          Bound to the copy, read the active rule set, to set aside the findings that judge code — a
          copy holds the design alone
        type: call
        targetComponent: authoring_validator_adapter
        targetMethod: listRules
      - stepNumber: 15
        description: 'Judge the copy as it stands: the owner''s gate, its design errors and warnings'
        type: call
        targetComponent: authoring_validator_adapter
        targetMethod: validateProject
      - stepNumber: 16
        description: >-
          Write the move on the copy through the core client adapter — each moving spec in turn, the
          addressed one first — collecting its reports: every spec moved and rewritten, every file
          written (a moved file as old → new) and every reference re-pointed
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: moveSpec
      - stepNumber: 17
        description: Judge the copy as the move leaves it, the same way
        type: call
        targetComponent: authoring_validator_adapter
        targetMethod: validateProject
      - stepNumber: 18
        description: Discard the copy, whatever the rehearsal did
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: discardRehearsal
      - stepNumber: 19
        description: >-
          The findings the move brings: each error and warning the copy reports after the move that
          it did not report before, counted by code and spec (a message naming the copy's folder
          read as the project's)
        type: local
      - stepNumber: 20
        description: >-
          Does the rehearsal leave a new error? Asked of a dry run too, so a dry run is refused
          exactly when the move would be
        type: branch
        condition: the rehearsal's findings hold an error
        onFalseStep: 22
      - stepNumber: 21
        description: >-
          Refuse the move with the findings it would leave — each error's code, spec and message —
          before anything is written; a dry run is answered with the same refusal, never as a plan
        type: throw
        error: the move would leave an error
      - stepNumber: 22
        description: A dry run stops here
        type: branch
        condition: dryRun
        onFalseStep: 24
      - stepNumber: 23
        label: rehearsal-refused
        description: >-
          Return the rehearsal's report, marked dryRun — the specs it moves and rewrites, the files
          and references, the findings the result will have (warnings only: an error refused it
          above) and the gate's notices; nothing was written
        type: return
        outcome: the planned move
      - stepNumber: 24
        description: >-
          Move each spec through the core client adapter in turn — the addressed one first, then
          each moving together with it; the whole set was judged and rehearsed, so no move in
          between is judged on its own. The reports fold into one: what moved, what was rewritten,
          the files and the references
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: moveSpec
      - stepNumber: 25
        description: Return the move's report with the gate's notices and the rehearsal's findings
        type: return
        outcome: SpecMove
  - name: writeSpec
    narrative:
      - stepNumber: 1
        description: >-
          Read the bound project's configuration: the rule severities and project type a component
          candidate is judged with, and the test roots the receipt searches. A project that has
          none, or whose configuration cannot be read, is judged on the defaults and searches
          nothing
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 2
        description: >-
          Ask the core adapter whether the spec, or the parent it is written under
          (spec_restatement.parent), lives in another project, answering for the create tool of its
          kind
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: crossProjectWriteRefusal
      - stepNumber: 3
        description: >-
          Decide on the project boundary, and on the names this write turns into paths: the spec's
          own id, the parent it names (a component's or a type's subsystem, an interface's
          component, an implementation's contract) and a type's group each become a folder or a file
          name, so each must be an id of the grammar — no path separator, no `.` or `..` segment,
          nothing but letters, digits, `-` and `_` per `::`-segment — and a parent must name a spec
          the tree holds under exactly that id, never one a case-insensitive filesystem would find
          under another case. Both are asked before any path is built
        type: branch
        condition: the spec or its parent lives in another project
        onFalseStep: 5
      - stepNumber: 4
        label: chained-spec
        description: >-
          Refuse before anything is judged or written: with the core's sentence (the member, its
          folder, the session to open there and the call to make there), or not-an-id, naming the
          name, where it sits and the grammar — so a path-shaped subsystem
          (`../../other/.wai/specs/x`, `links/../analytics`, `Links`) never writes into another tree
          or another subsystem
        type: throw
        error: 'chained-spec: the spec lives in another project'
      - stepNumber: 5
        description: >-
          Read the parent the restatement names (spec_restatement.parent) through the core client
          adapter, when it names one; a parent the bound project does not hold is refused with the
          core's boundary sentence, asked to exist — another project's when only a member holds that
          bare id, else the one sentence every write tool answers with for a missing spec — and only
          an absent L0 is the restatement's to refuse, below
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: loadSpec
      - stepNumber: 6
        label: existing
        description: Read the spec this restatement re-authors, if one already holds the id
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: loadSpec
      - stepNumber: 7
        description: >-
          When the write gives an id to a new spec of a kind that keeps a rename trace (component,
          interface, implementation, type), read the bound tree's spec index for the rename traces
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: scanAllSpecs
      - stepNumber: 8
        description: Ask which spec of this kind retired the id (spec_index.retiredBy; a type within its owner)
        type: branch
        condition: the id is new and a spec of this kind lists it in its rename trace (previousIds)
        onFalseStep: 10
      - stepNumber: 9
        label: id-retired
        description: >-
          Refuse before anything reaches disk (id-retired), naming the holder and the way out:
          unsetting the holder's previousIds releases the id
        type: throw
        error: id-retired
      - stepNumber: 10
        description: >-
          Apply the restatement to the stored spec (spec_restatement.applyTo): the status, the
          candidate with every unexpressed field carried, the parent-derived fields, the narrative
          labels resolved, the notices, and the methods it changes or removes — or the refusal that
          stops it — and read every method, parameter and field name an interface or a type
          candidate introduces, reading the L0 and the owning subsystem through the core client
          adapter's loadSpec for the effective targetLanguage: a name the stored spec does not
          already hold that breaks the identifier grammar, is reserved in the target language,
          repeats one in its place, or — a contract method on a contract that implements no other
          project's extension point (an `alias::name` entry; a local abstraction's methods are this
          project's own and are never exempt) — breaks the tree's method casing
        type: local
      - stepNumber: 11
        description: Decide whether the restatement may be written at all
        type: branch
        condition: >-
          the application carries a refusal, it introduces a name the tree cannot hold, or the
          candidate is a subsystem naming a projectPath (the legacy mount form)
        onFalseStep: 13
      - stepNumber: 12
        description: >-
          Refuse before anything reaches disk with the sentence that applies: the application's own
          (a missing parent, a status the write would lower, a label that does not resolve, a
          restated signature source, a type position that is not canonical), invalid-name naming
          every such name, or the mount form — a member is declared in project.yaml `members`
          (sdd_add_member), and wairon never writes the L1 mount form
        type: throw
        error: restatement refused
      - stepNumber: 13
        description: >-
          For a component candidate — the spec that will actually be written, carried fields
          included — judge it against the spec-scoped rules with the project's own settings
        type: call
        targetComponent: authoring_validator_adapter
        targetMethod: validateComponentCandidate
      - stepNumber: 14
        label: in-tree
        description: >-
          Ask which design findings the candidate introduces in the bound tree: an edge between two
          existing blocks whose stereotypes forbid it, a cross-subsystem edge into a non-Portal, or
          a route two bound methods share — only those the stored tree did not already hold and no
          later write in the authoring order can cure; a kind those rules do not judge answers an
          empty verdict
        type: call
        targetComponent: authoring_validator_adapter
        targetMethod: introducedFindings
      - stepNumber: 15
        label: dropped
        description: >-
          When a re-authored contract drops methods it held, read the bound tree's spec index and
          ask it which specs reference a dropped method (spec_index.methodReferencesTo), the dropped
          methods' own implementation entries left out, and which implementation entries realize one
          — the entries that go with them
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: scanAllSpecs
      - stepNumber: 16
        description: Decide on the verdicts
        type: branch
        condition: >-
          the intrinsic or the in-tree verdict holds an error, or a spec that stays references a
          dropped method
        onFalseStep: 18
      - stepNumber: 17
        description: >-
          Refuse the write before anything reaches disk: with the formatted refusal naming every
          rule code the candidate broke or would introduce — the same codes and messages validate
          gives — or naming each reference to a dropped method (method-referenced: edit those specs
          first, or restate the method); a warning or notice rides along as one of the receipt's
          notices instead
        type: throw
        error: rule violation or method-referenced
      - stepNumber: 18
        label: abstraction-touched
        description: >-
          Decide whether the write touches an abstraction, whose findings land on specs the write
          does not name: a contract candidate that implements one or belongs to an abstract
          component, or a component candidate that is abstract or was
        type: branch
        condition: the candidate is such a contract or component
        onFalseStep: 26
      - stepNumber: 19
        description: >-
          Rehearse the write, as a delta update touching an abstraction rehearses its own: a private
          copy of the bound tree to write it on
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: rehearsalCopy
      - stepNumber: 20
        description: >-
          Bound to the copy, read the active rule set, to set aside the findings that judge code — a
          copy holds the design alone
        type: call
        targetComponent: authoring_validator_adapter
        targetMethod: listRules
      - stepNumber: 21
        description: 'Judge the copy as it stands: the owner''s gate, its design errors and warnings'
        type: call
        targetComponent: authoring_validator_adapter
        targetMethod: validateProject
      - stepNumber: 22
        description: >-
          Persist the candidate on the copy through the core client adapter, exactly as the real
          write persists it
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: saveSpec
      - stepNumber: 23
        description: Judge the copy as the write leaves it, the same way
        type: call
        targetComponent: authoring_validator_adapter
        targetMethod: validateProject
      - stepNumber: 24
        description: Discard the copy, whatever the rehearsal did
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: discardRehearsal
      - stepNumber: 25
        description: >-
          The findings the write brings: each error and warning the copy reports after the write
          that it did not report before, counted by code and spec (a message naming the copy's
          folder read as the project's) — an IMPLEMENTS_MISMATCH on an implementer, an abstraction
          left unimplemented. Reported, never refusing. A rehearsal that throws names nothing
        type: local
      - stepNumber: 26
        description: >-
          When the restatement changes the signature of a contract method the stored contract held —
          a parameter added, removed, retyped or made optional or required, the returns changed, or
          whether it completes later; a dry run included — look up its callers as the change report
          does (updateSpecGated), the abstraction's callers and those of every abstraction below it
          included, and record callersToReview, at most ten callers beside the total, with the
          implementers that restate the old signature. Information only: no finding, no gate, and a
          failed lookup records nothing
        type: call
        targetComponent: authoring_validator_adapter
        targetMethod: findReferences
      - stepNumber: 27
        label: tests
        description: >-
          When the application names a changed or removed method and the project declares test
          roots, place each in the file realizing it (the private searchedMethods): for a contract,
          every implementation realizing it with its symbol and file; for an implementation or a
          type, the method's own entry in the stored spec before the restated one
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: loadImplementationSpecs
      - stepNumber: 28
        description: >-
          Find the tests that encode those methods, each searched by its stored symbol when it has
          one
        type: call
        targetComponent: authoring_validator_adapter
        targetMethod: findTestsReferencing
      - stepNumber: 29
        label: dry-run
        description: Decide whether the caller asked only what the write would do
        type: branch
        condition: the restatement is a dry run
        onFalseStep: 31
      - stepNumber: 30
        description: >-
          Answer the receipt the write would give, marked dryRun — the implementation entries it
          would cascade and the findings a write touching an abstraction would bring among it — with
          nothing written
        type: return
        outcome: dry run
      - stepNumber: 31
        label: save
        description: >-
          Persist the candidate through the core client adapter, collecting the store's placement
          notices
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: saveSpec
      - stepNumber: 32
        description: >-
          Remove the dropped methods' implementation entries through the core adapter's update, each
          recorded as cascaded with a notice naming it
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: updateSpec
      - stepNumber: 33
        label: receipt
        description: >-
          Return the write receipt: the kind, id and name written, whether a spec already held the
          id, the status written, the notices — the gate's warnings, the application's re-authoring
          notices and the store's placement notices — the respellings applied, the entries cascaded,
          the callers to review of a changed signature, the findings a write touching an abstraction
          brings, and the tests to revisit
        type: return
        outcome: written
  - name: deleteSpec
    narrative:
      - stepNumber: 1
        description: >-
          Ask the core adapter whether the spec lives in another project — a member's, by its key or
          an `alias::name`, or one named through an external's alias — answering for sdd_delete_spec
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: crossProjectWriteRefusal
      - stepNumber: 2
        description: 'Decide on the project boundary and the L0: a dry run is refused exactly as the deletion'
        type: branch
        condition: the spec lives in another project, or the kind is system
        onFalseStep: 4
      - stepNumber: 3
        label: chained-spec
        description: >-
          Refuse before anything is planned or removed: with the core's sentence (the member, its
          folder, the session to open there and the call to make there), or — for the L0, the root
          every other spec hangs from — that it is never deleted
        type: throw
        error: chained-spec, or the L0 is never deleted
      - stepNumber: 4
        label: plan-scope
        description: >-
          Read the bound project's configuration for the test roots the report searches; a project
          that has none searches nothing
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 5
        description: Read the bound tree's spec index, this project's own specs only
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: scanAllSpecs
      - stepNumber: 6
        description: Read the L0, whose export table may name what the deletion removes
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: loadSpec
      - stepNumber: 7
        description: >-
          Ask the index what deleting the spec takes with it (spec_index.subtreeOf): the spec itself
          and everything it contains, innermost first
        type: local
      - stepNumber: 8
        description: Decide whether there is anything to delete
        type: branch
        condition: no spec of the kind holds the id
        onFalseStep: 10
      - stepNumber: 9
        label: spec-missing
        description: >-
          Refuse, nothing deleted, with the core's boundary sentence asked to exist: another
          project's when only a member holds that bare id; else the one sentence every write tool
          answers with for a missing spec, followed by what the id might have meant — the kind of
          spec that does hold it, a type addressed by its bare id or as subsystem::id, and the ids
          the kind does hold
        type: throw
        error: 'spec-missing: this project has no spec of the kind under the id'
      - stepNumber: 10
        description: >-
          Ask the index which references specs outside that set still hold to it
          (spec_index.referencesTo), each with the spec holding it and its position: a dependsOn or
          owns, a contract's local implements entry naming an abstraction among them. An `owns`
          entry naming a removed component is set apart as released: the deletion drops it from its
          owner, since an owned member that goes leaves nothing to decide, so it neither dangles nor
          refuses
        type: local
      - stepNumber: 11
        description: >-
          Read, before anything goes, every public name a consumer reaches what goes through: the
          deletion's published list, from which the door names the consumers it breaks
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: publishedUsesOf
      - stepNumber: 12
        description: Decide whether the deletion takes away any method
        type: branch
        condition: >-
          a removed contract, implementation or type held methods and the project declares test
          roots
        onFalseStep: 15
      - stepNumber: 13
        description: >-
          Place each removed method in the file realizing it, read now, while those implementations
          still exist
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: loadImplementationSpecs
      - stepNumber: 14
        description: >-
          Find the tests that encode the removed methods, each searched by its symbol when it
          declared one
        type: call
        targetComponent: authoring_validator_adapter
        targetMethod: findTestsReferencing
      - stepNumber: 15
        description: >-
          Rehearse the deletion, as a move rehearses its own: a private copy of the bound tree to
          delete on
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: rehearsalCopy
      - stepNumber: 16
        description: >-
          Bound to the copy, read the active rule set, to set aside the findings that judge code — a
          copy holds the design alone
        type: call
        targetComponent: authoring_validator_adapter
        targetMethod: listRules
      - stepNumber: 17
        description: 'Judge the copy as it stands: the owner''s gate, its design errors, warnings and notices'
        type: call
        targetComponent: authoring_validator_adapter
        targetMethod: validateProject
      - stepNumber: 18
        description: Delete every spec of the set on the copy, innermost first
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: deleteSpec
      - stepNumber: 19
        description: On the copy, drop each released `owns` entry from its owner, as the deletion will
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: updateSpec
      - stepNumber: 20
        description: Judge the copy as the deletion leaves it, the same way
        type: call
        targetComponent: authoring_validator_adapter
        targetMethod: validateProject
      - stepNumber: 21
        description: Discard the copy, whatever the rehearsal did
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: discardRehearsal
      - stepNumber: 22
        description: >-
          The findings the deletion brings: each error, warning and notice the copy reports after
          the deletion that it did not report before, counted by code and spec (a message naming the
          copy's folder read as the project's) — an abstraction left with one implementer
          (ABSTRACTION_SINGLE_IMPLEMENTER), a caller left without its callee. A rehearsal that
          throws names nothing
        type: local
      - stepNumber: 23
        label: plan
        description: Decide whether the caller asked only for the plan
        type: branch
        condition: the caller asked for a dry run
        onFalseStep: 25
      - stepNumber: 24
        label: dry-run
        description: >-
          Answer with the plan: every spec that would go, every reference that would be left, every
          public name it publishes, the tests to revisit and the findings the result will have —
          nothing removed
        type: return
        outcome: dry run
      - stepNumber: 25
        description: Decide whether the deletion would leave references dangling
        type: branch
        condition: a spec outside the set still references it and the caller did not force the deletion
        onFalseStep: 27
      - stepNumber: 26
        label: referenced
        description: >-
          Refuse before anything is removed, naming each reference with the spec that holds it and
          its position, and the two ways on: edit those specs first, or force the deletion and leave
          them for validate to report
        type: throw
        error: 'referenced: other specs still reference what the deletion removes'
      - stepNumber: 27
        label: remove
        description: For each spec of the set, innermost first, so a container goes after its content
        type: loop
        loopKind: forEach
        over: the specs the deletion takes
        endStep: 28
      - stepNumber: 28
        label: delete-one
        description: >-
          Delete the spec document through the core client adapter, which prunes the folders it
          leaves empty
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: deleteSpec
      - stepNumber: 29
        label: release
        description: >-
          For each released `owns` entry, drop it from its owner through the core client adapter,
          after the specs went
        type: loop
        loopKind: forEach
        over: the released owns entries
        endStep: 30
      - stepNumber: 30
        description: Remove the entry from the owner's owns list
        type: call
        targetComponent: authoring_core_adapter
        targetMethod: updateSpec
      - stepNumber: 31
        description: >-
          Return the deletion: the kind and id, that it was removed, every spec it took, the owns
          entries it released from their owners, the references a forced deletion left dangling, the
          public names it published, the tests to revisit (and whether tests were searched at all: a
          project with no test roots searches none) and the findings the rehearsal named
        type: return
        outcome: deleted
lint:
  allow:
    - code: EXCESSIVE_NARRATIVE_STEPS
      reason: >-
        deleteSpec, writeSpec and updateSpecGated each carry the same seven-step rehearsal (copy,
        rule set, judge, write, judge, discard, compare) moveSpec and moveMethods run inline, beside
        their boundary refusals, judgement and reports. The rehearsal is one copy-bound region whose
        findings feed the result; splitting it into a helper would only move that region behind a
        call the tools make with different writes.
status: complete
