id: surface_fs_adapter_impl
name: Surface FS Adapter Implementation
description: Own-aggregate snapshot file I/O.
contract: isurface_fs_adapter
sourcePath: src/core/surfaces.ts
methods:
  - name: readAllSnapshots
    narrative: []
    detail: intent
    intent: >-
      Reads and schema-parses every YAML file under .wai/surfaces/ at the bound root into
      SurfaceSnapshot values, returning an empty list when the directory is absent. A malformed file
      is skipped rather than aborting the whole read.
    exportedVia: surfaceFsAdapter
  - name: writeSnapshot
    narrative: []
    detail: intent
    intent: >-
      Schema-parses the snapshot and writes it as YAML to .wai/surfaces/<sanitized
      projectName>.yaml, creating the directory when missing, and answers the file's path. A file
      whose content (provenance stripped) already matches is left untouched, so a re-pin of an
      unchanged contract rewrites no bytes; an unreadable existing file is rewritten.
    exportedVia: surfaceFsAdapter
  - name: deleteSnapshot
    narrative: []
    detail: intent
    intent: >-
      Removes .wai/surfaces/<sanitized projectName>.yaml and reports whether a file existed; failing
      that, finds a legacy file written under the raw project name by the key stored inside it,
      skipping malformed files.
    exportedVia: surfaceFsAdapter
status: complete
