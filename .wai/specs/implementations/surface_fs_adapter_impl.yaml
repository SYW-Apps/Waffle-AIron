id: surface_fs_adapter_impl
name: Surface FS Adapter Implementation
description: Own-aggregate snapshot file I/O.
contract: isurface_fs_adapter
sourcePath: src/core/surfaces.ts
methods:
  - name: readAllSnapshots
    narrative: []
    detail: intent
    intent: >-
      Reads and schema-parses every YAML file under .wai/surfaces/ into SurfaceSnapshot values,
      returning an empty list when the directory is absent. A malformed file is surfaced as a
      loader-style issue and skipped rather than aborting the whole read.
    symbol: loadSurfaceSnapshots
  - name: writeSnapshot
    narrative: []
    detail: intent
    intent: >-
      Serializes the snapshot to YAML and writes it to .wai/surfaces/<projectName>.yaml, creating
      the directory when missing and overwriting an existing file atomically.
    symbol: saveSnapshot
  - name: deleteSnapshot
    narrative: []
    detail: intent
    intent: >-
      Removes .wai/surfaces/<projectName>.yaml and reports whether a file existed; cleans up an
      emptied surfaces directory.
    symbol: removeSnapshot
  - name: readExternalsLock
    narrative: []
    detail: intent
    intent: >-
      Reads .wai/externals.lock.yaml at the bound root and schema-parses it into an ExternalsLock,
      returning null when the file is absent. A file that fails to parse or fails the schema throws
      an error naming the file, because reading it as empty would silently drop every pin.
  - name: writeExternalsLock
    narrative: []
    detail: intent
    intent: >-
      Serializes the lock to YAML with its aliases sorted and writes .wai/externals.lock.yaml
      atomically, creating .wai/ when missing; a write failure propagates.
  - name: readExternalSnapshot
    narrative: []
    detail: intent
    intent: >-
      Reads and schema-parses .wai/externals/<alias>.yaml into a SurfaceSnapshot, returning null
      when the file is absent or malformed (status then reports the alias as unpinned rather than
      failing).
  - name: writeExternalSnapshot
    narrative: []
    detail: intent
    intent: >-
      Serializes the snapshot to YAML and writes .wai/externals/<alias>.yaml atomically, creating
      the directory when missing; a write failure propagates.
  - name: deleteExternalSnapshot
    narrative: []
    detail: intent
    intent: >-
      Removes .wai/externals/<alias>.yaml, reports whether a file existed, and removes an emptied
      externals directory.
status: complete
