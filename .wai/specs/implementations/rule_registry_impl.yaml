        description: For each registered built-in rule, in that order
        type: loop
        loopKind: forEach
        over: the registered built-in rules
        endStep: 63
      - stepNumber: 63
        label: append-builtin
        description: Append the rule to the store
        type: call
        targetComponent: rule_store
        targetMethod: add
  - name: registerPackRules
    narrative:
      - stepNumber: 1
        description: >-
          For each pack rule, in project pack order (the extension loader has already refused any
          entry that is not rule-shaped)
        type: loop
        loopKind: forEach
        over: the pack rules
        endStep: 2
      - stepNumber: 2
        label: append-pack
        description: Append the pack rule to the store, after the built-ins
        type: call
        targetComponent: rule_store
        targetMethod: add
