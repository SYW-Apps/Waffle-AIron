id: cli_portal_impl
name: CLI Portal Implementation
description: >-
  The commander program in src/cli/index.ts — the `wairon` (and `wai`) bin entry. Each command
  registration is one endpoint: its `.command('…')` literal is the method's anchor (the anchored
  conformance tier, a route registration), and its action hands the parsed arguments and flags to
  one cli_runner workflow, either in ./runner.ts or in the command module that realizes it. A
  preAction hook sets the log level from --verbose/--silent and hands the command's path to
  cli_runner.announceBinding, so every command that acts on a project names the one it bound before
  it runs; main() parses argv and turns a WaironError into its message and exit 1. The file reaches
  no adapter and holds no workflow.
contract: icli_portal
sourcePath: src/cli/index.ts
methods:
  - name: init
    narrative:
      - stepNumber: 1
        description: Run cli_runner.runInit with the parsed --yes flag.
        type: call
        targetComponent: cli_runner
        targetMethod: runInit
      - stepNumber: 2
        description: For each --pack source named on the command line.
        type: loop
        loopKind: forEach
        over: each --pack source, in the order given
        endStep: 3
      - stepNumber: 3
        description: Add the pack through the runner's pack add (project scope, --yes passed through).
        type: call
        targetComponent: cli_runner
        targetMethod: runPack
  - name: generate
    narrative:
