id: instance_backup_adapter_impl
name: Data Dir Backup Adapter Implementation
description: >-
  src/server/upgrade.ts: a recursive copy beside the data directory, and the removal of a disposable
  development data directory with its backups.
contract: iinstance_backup_adapter
sourcePath: src/server/upgrade.ts
injectedParams:
  - dataDir
methods:
  - name: copy
    narrative: []
    detail: intent
    intent: >-
      Copy every file of the data directory, recursively and keeping its layout, to
      `<dataDir>.backup-v<from>-to-v<to>-<UTC timestamp>` beside it, and answer that path. A copy
      that fails removes what it wrote and refuses with the cause, so no upgrade runs without a
      complete backup.
    calls:
      - files_adapter.copy
      - files_adapter.remove
    symbol: copyDataDir
  - name: discard
    narrative: []
    detail: intent
    intent: >-
      Remove the data directory recursively, then every sibling named `<the directory's
      name>.backup-*` beside it (the copies an earlier start of the same development data directory
      took), and answer the paths removed in the order removed. An absent directory or backup is not
      an error. A removal that fails (a file held open, a permission refusal) throws naming the
      path, so a development start that could not start fresh says so instead of serving stale
      state.
    symbol: discardDataDir
previousIds:
  - data_dir_backup_adapter_impl
status: draft
createdAt: '2026-10-18T14:27:59.122Z'
updatedAt: '2026-10-31T23:43:36.176Z'
