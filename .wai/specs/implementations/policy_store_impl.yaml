id: policy_store_impl
name: Policy Store Implementation
description: >-
  Authoritative in-memory holder of the single active hosted instance pack/profile policy,
  file-backed as one record under the server data root (pack-policy.json).
contract: ipolicy_store
sourcePath: src/server/policy.ts
methods:
  - name: load
    narrative: []
    intent: >-
      Read the single persisted policy record from the pack-policy.json file under the server data
      root and hold it as the authoritative in-memory representation, returning it. A missing file
      yields null — signalling that no policy has ever been configured, which the orchestrator
      resolves to the documented permissive default. An unreadable file or structurally invalid JSON
      fails with a storage error naming the path; the store never silently drops a persisted policy,
      because losing it would silently relax enforcement for every subsequent project
      initialization.
  - name: replaceActive
    narrative: []
    intent: >-
      Swap the authoritative in-memory active policy to the supplied record in one assignment, only
      ever called by the owned registry after durable persistence has succeeded. Never partially
      applies, so concurrent reads through the index always observe a single consistent policy
      record.
detail: intent
status: complete
