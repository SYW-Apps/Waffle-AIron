id: policy_store_impl
name: Policy Store Implementation
description: >-
  Read-through file I/O over hosted instance policy: the single active pack/profile policy record
  (pack-policy.json), the identity-provider (SSO) configuration collection (identity-providers.json)
  and the instance exposure policy (exposure-policy.json), all under the server data root. Reads
  parse fresh; each update holds ITS file's write lock across a fresh read and the replacement.
contract: ipolicy_store
sourcePath: src/server/policy.ts
injectedParams:
  - dataDir
methods:
  - name: load
    narrative: []
    intent: >-
      Read pack-policy.json and identity-providers.json fresh (no in-memory copy), returning the
      pack policy. A missing pack-policy file yields null - signalling that no policy has ever been
      configured, which the orchestrator resolves to the documented permissive default; a missing
      identity-providers file yields an empty collection. An unreadable file or structurally invalid
      JSON fails with a storage error naming the path; the store never silently drops a persisted
      policy or provider configuration, because losing either would silently relax enforcement or
      sign-in for every subsequent operation.
    symbol: storeLoadPackPolicy
  - name: updatePackPolicy
    narrative: []
    intent: >-
      Under pack-policy.json's write lock (file_write_lock.run), read the record fresh (null when
      absent; a file that exists but cannot be read or parsed throws and nothing is written), apply
      the change, replace the file atomically via write-temp-then-rename and release the lock, also
      when the change throws. Answers the policy written.
    calls:
      - file_write_lock.run
  - name: updateIdentityProviders
    narrative: []
    intent: >-
      Under identity-providers.json's write lock (file_write_lock.run), read the collection fresh
      (empty when absent; unreadable or malformed throws and nothing is written), apply the change,
      replace the file atomically and release the lock, also when the change throws. Answers the
      collection written.
    calls:
      - file_write_lock.run
  - name: updateExposurePolicy
    narrative: []
    intent: >-
      Under exposure-policy.json's write lock (file_write_lock.run), read the record fresh (null
      when absent; unreadable or malformed throws and nothing is written), apply the change, replace
      the file atomically and release the lock, also when the change throws. Answers the policy
      written.
    calls:
      - file_write_lock.run
detail: intent
status: complete
