id: mcp_skills_adapter_impl
name: MCP Skills Client Adapter Implementation
description: >-
  Forwards MCP resource list/read calls across the subsystem boundary to the published skills
  portal.
contract: imcp_skills_adapter
sourcePath: src/mcp/server.ts
methods:
  - name: listResources
    narrative:
      - stepNumber: 1
        description: Call listResources on the skills portal across the subsystem boundary.
        type: call
        targetComponent: skills_portal
        targetMethod: listResources
    symbol: listSkillResources
  - name: readResource
    narrative:
      - stepNumber: 1
        description: Call readResource on the skills portal across the subsystem boundary.
        type: call
        targetComponent: skills_portal
        targetMethod: readResource
    symbol: readSkillResource
lint:
  allow:
    - code: CALL_STEP_UNREALIZED
      reason: >-
        Skill resources are served from the embedded exported skill set inside the MCP server, not
        by calling the skills portal at runtime — the narrative names the semantic owner of the
        resource content. Revisit with the skills-resource refactor.
status: complete
createdAt: '2026-07-10T12:21:52.237Z'
updatedAt: '2026-07-18T18:47:54.647Z'
