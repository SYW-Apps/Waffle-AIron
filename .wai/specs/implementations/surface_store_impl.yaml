id: surface_store_impl
name: Surface Store Implementation
description: >-
  src/core/surfaces.ts. A read-through Store: each method is one file operation through the surface
  fs adapter; nothing is held in memory.
contract: isurface_store
sourcePath: src/core/surfaces.ts
methods:
  - name: put
    narrative: []
    detail: intent
    intent: >-
      Writes the snapshot through the fs adapter and answers the file's path; a write failure
      propagates.
    calls:
      - surface_fs_adapter.writeSnapshot
    exportedVia: surfaceStore
  - name: get
    narrative: []
    detail: intent
    intent: >-
      Reads every stored snapshot through the fs adapter on each call and answers the one whose
      producing project name matches, or null when none does.
    calls:
      - surface_fs_adapter.readAllSnapshots
    exportedVia: surfaceStore
  - name: list
    narrative: []
    detail: intent
    intent: >-
      Reads every stored snapshot through the fs adapter on each call (read-through: no RAM copy); a
      malformed file is skipped by the adapter, never fatal.
    calls:
      - surface_fs_adapter.readAllSnapshots
    exportedVia: surfaceStore
  - name: remove
    narrative: []
    detail: intent
    intent: Removes the project's snapshot file through the fs adapter and reports whether one existed.
    calls:
      - surface_fs_adapter.deleteSnapshot
    exportedVia: surfaceStore
status: complete
createdAt: '2026-07-10T23:15:30.692Z'
updatedAt: '2026-10-04T22:34:22.276Z'
