id: remote_binding_store_impl
name: Remote Binding Store Implementation
description: >-
  src/commands/remotebinding.ts — the two persisted files behind an attached checkout:
  .wai/remote.json in the project (binding, never secret) and ~/.wairon/credentials.json in the
  user's home (credentials, keyed by instance URL).
contract: iremote_binding_store
sourcePath: src/commands/remotebinding.ts
methods:
  - name: read
    narrative: []
    intent: >-
      Read <root>/.wai/remote.json and parse it into a RemoteBinding carrying source 'binding-file'.
      A missing file, unreadable file, malformed JSON, or a record missing url/projectId all yield
      null: an unattached checkout is the normal state and must never surface as an error
      mid-command. Reads from disk on every call, so a re-attach in another process (or an edited
      file) is picked up immediately.
    symbol: readBinding
  - name: write
    narrative: []
    intent: >-
      Write { url, projectId, attachedAt } to <root>/.wai/remote.json, creating .wai/ if needed,
      replacing any previous record. The credential is deliberately absent from what is written —
      this file lives in the project and may be committed. Written atomically through a temp file of
      its own beside the record, then renamed over it, so a concurrent read never observes a
      half-written record and two writers never share one temp file. A whole-record replace reads
      nothing first, so it needs no write lock: the last attach wins, as it should.
    symbol: writeBinding
  - name: clear
    narrative: []
    intent: >-
      Delete <root>/.wai/remote.json. Idempotent and silent when it does not exist — detaching an
      unattached checkout is a success, not an error.
    symbol: clearBinding
  - name: readCredential
    narrative: []
    intent: >-
      Read ~/.wairon/credentials.json (a map of instance URL to token, URLs normalized so a trailing
      slash or differing case never hides a stored credential) and return the token for the given
      instance, or null when the file is absent, unreadable, or carries no entry.
  - name: writeCredential
    narrative: []
    intent: >-
      Under credentials.json's write lock (the generation lock primitive, file_write_lock's module
      src/utils/file-lock.ts, with its default limits), read the map fresh — an absent file is
      empty, while a file that exists but cannot be read or parsed is refused, naming it, and
      nothing is written, so a damaged store is never replaced by a map of one credential — then
      upsert the token under the normalized instance URL, preserving every other instance's entry,
      and replace the file atomically, creating ~/.wairon if needed, with owner-only permissions
      (0600) where the platform supports it, because it holds live bearer credentials. The lock is
      released also when the change throws, so two `wairon login` or `remote attach` commands at
      once both keep their credential.
  - name: clearCredential
    narrative: []
    intent: >-
      Under the same write lock, read the map fresh: an absent file has nothing to forget, and a
      file that cannot be read or parsed is refused, naming it, with nothing written. Remove the
      entry for the normalized instance URL, preserving every other, and replace the file atomically
      (0600). Idempotent. This forgets the credential LOCALLY only — it does not and cannot revoke
      it on the instance, which the caller's output must say plainly.
  - name: listCredentialUrls
    narrative: []
    intent: >-
      Return the instance URLs the credential file holds entries for, sorted, with no token values —
      the safe projection `wairon remote status` and `wairon logout` (with no argument) print.
detail: intent
lint:
  allow:
    - code: UNDECLARED_DEPENDENCY
      at: src/commands/remotebinding.ts -> src/utils/file-lock.ts
      reason: >-
        The credential store's read-change-write takes the same generation lock primitive the hosted
        stores and the spec tree take (src/utils/file-lock.ts, file_write_lock): one safety-critical
        protocol every holder must follow. Like src/utils/fs.ts it is shared infrastructure below
        the subsystems; a second copy in sdd_cli would be two implementations of one protocol that
        can drift apart, and routing a lock through sdd_host's portal would make the CLI depend on
        the hosted server.
    - code: IMPORT_BYPASSES_PORTAL
      at: src/commands/remotebinding.ts -> src/utils/file-lock.ts
      reason: >-
        Same import as the UNDECLARED_DEPENDENCY allow: the credential store uses the shared
        generation lock primitive directly, which no sdd_host portal publishes because it is not a
        capability of the hosted server.
status: complete
