id: user_config_store_impl
name: User Config Store Implementation
description: >-
  src/config/userconfig.ts. Every setter is one read-modify-write through the same two primitives,
  held under the settings file's write lock (the generation lock primitive, file_write_lock's module
  src/utils/file-lock.ts, with its default limits), so setting one field can never discard another
  written by a different command — by the same command a moment earlier, or by another wairon
  process at the same moment (two commands each recording the release notes they showed, a channel
  switch beside an alias change). Nothing is cached between calls, which is what lets a hand edit or
  another process take effect immediately.
contract: iuser_config_store
sourcePath: src/config/userconfig.ts
methods:
  - name: load
    narrative:
      - stepNumber: 1
        description: Decide whether there is anything to read
        type: branch
        condition: the file exists and parses
        onTrueStep: 2
        onFalseStep: 3
      - stepNumber: 2
        description: Answer the settings it holds
        type: return
        outcome: loaded
      - stepNumber: 3
        description: >-
          Answer nothing configured. An absent file, an unreadable one and a malformed one are the
          same answer on purpose: a machine that has never been set up is normal, and a broken file
          must not stop the tool running
        type: return
        outcome: unconfigured
    symbol: loadUserConfig
  - name: save
    narrative:
      - stepNumber: 1
        description: >-
          Create the directory if this is the first write — nothing creates it at install time, so
          the first setting anyone records is also what makes the home for it
        type: local
      - stepNumber: 2
        description: >-
          Replace the whole document, pretty-printed so a person can read and hand-edit it,
          atomically through a temp file of its own renamed over the old one, so a concurrent read
          never sees a half-written file
        type: local
      - stepNumber: 3
        description: Done
        type: return
        outcome: saved
    symbol: saveUserConfig
  - name: channel
    narrative:
      - stepNumber: 1
        description: Read the settings
        type: call
        targetComponent: user_config_store
        targetMethod: load
      - stepNumber: 2
        description: Decide whether the recorded channel is one this build knows
        type: branch
        condition: a channel is recorded and this build recognizes it
        onTrueStep: 3
        onFalseStep: 4
      - stepNumber: 3
        description: Answer it
        type: return
        outcome: channel
      - stepNumber: 4
        description: >-
          Answer the narrowest channel instead. A hand-edited or future-version file can name
          something this build does not know, and honouring it would let an unrecognized value widen
          what a stable install is willing to fetch
        type: return
        outcome: stable
    symbol: getChannel
  - name: setChannel
    narrative:
      - stepNumber: 1
        description: >-
          Take the settings file's write lock, so no other wairon process reads and writes the file
          until the steps below end; it is released also when one of them throws
        type: local
      - stepNumber: 2
        description: Read the settings as they stand
        type: call
        targetComponent: user_config_store
        targetMethod: load
      - stepNumber: 3
        description: Replace the channel, leaving every other setting untouched
        type: local
      - stepNumber: 4
        description: Write the whole document back
        type: call
        targetComponent: user_config_store
        targetMethod: save
      - stepNumber: 5
        description: Done
        type: return
        outcome: recorded
    symbol: setChannel
  - name: disabledAliases
    narrative:
      - stepNumber: 1
        description: Read the settings
        type: call
        targetComponent: user_config_store
        targetMethod: load
      - stepNumber: 2
        description: >-
          Answer the opted-out names, or none at all when the field is absent — which is the default
          state, because every supported alias is active until somebody opts out
        type: return
        outcome: disabled
    symbol: getDisabledAliases
  - name: setDisabledAliases
    narrative:
      - stepNumber: 1
        description: >-
          Take the settings file's write lock, so no other wairon process reads and writes the file
          until the steps below end; it is released also when one of them throws
        type: local
      - stepNumber: 2
        description: Read the settings as they stand
        type: call
        targetComponent: user_config_store
        targetMethod: load
      - stepNumber: 3
        description: Replace the opted-out list, leaving every other setting untouched
        type: local
      - stepNumber: 4
        description: Write the whole document back
        type: call
        targetComponent: user_config_store
        targetMethod: save
      - stepNumber: 5
        description: Done
        type: return
        outcome: recorded
    symbol: setDisabledAliases
  - name: lastSeenVersion
    narrative:
      - stepNumber: 1
        description: Read the settings
        type: call
        targetComponent: user_config_store
        targetMethod: load
      - stepNumber: 2
        description: Answer the recorded version, or nothing
        type: return
        outcome: version
  - name: setLastSeenVersion
    narrative:
      - stepNumber: 1
        description: >-
          Take the settings file's write lock, so no other wairon process reads and writes the file
          until the steps below end; it is released also when one of them throws
        type: local
      - stepNumber: 2
        description: Read the settings as they stand
        type: call
        targetComponent: user_config_store
        targetMethod: load
      - stepNumber: 3
        description: Replace the version, leaving every other setting untouched
        type: local
      - stepNumber: 4
        description: Write them back
        type: call
        targetComponent: user_config_store
        targetMethod: save
      - stepNumber: 5
        description: Done
        type: return
        outcome: saved
lint:
  allow:
    - code: UNDECLARED_DEPENDENCY
      at: src/config/userconfig.ts -> src/utils/file-lock.ts
      reason: >-
        The settings file's read-change-write takes the same generation lock primitive the hosted
        stores and the spec tree take (src/utils/file-lock.ts, file_write_lock): one safety-critical
        protocol every holder must follow. Like src/utils/fs.ts it is shared infrastructure below
        the subsystems; a second copy in sdd_cli would be two implementations of one protocol that
        can drift apart, and routing a lock through sdd_host's portal would make the CLI depend on
        the hosted server.
    - code: IMPORT_BYPASSES_PORTAL
      at: src/config/userconfig.ts -> src/utils/file-lock.ts
      reason: >-
        Same import as the UNDECLARED_DEPENDENCY allow: the settings store uses the shared
        generation lock primitive directly, which no sdd_host portal publishes because it is not a
        capability of the hosted server.
status: complete
