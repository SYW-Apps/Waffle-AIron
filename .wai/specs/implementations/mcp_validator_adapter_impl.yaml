id: mcp_validator_adapter_impl
name: MCP Validator Adapter Implementation
description: >-
  sdd_mcp's client hop into sdd_validator, in a module of its own: identity re-exports of the
  validator portal. The MCP server imports this module.
contract: imcp_validator_adapter
sourcePath: src/mcp/adapters/validator.ts
methods:
  - name: validateProject
    narrative:
      - stepNumber: 1
        description: Call validateProject on the validator portal
        type: call
        targetComponent: validator_portal
        targetMethod: validateProject
  - name: validateRegistry
    narrative:
      - stepNumber: 1
        description: Call validateRegistry on validator portal
        type: call
        targetComponent: validator_portal
        targetMethod: validateRegistry
  - name: validateFamily
    narrative:
      - stepNumber: 1
        description: Call validateFamily on the validator portal
        type: call
        targetComponent: validator_portal
        targetMethod: validateFamily
  - name: measurePackImpact
    narrative:
      - stepNumber: 1
        description: Call measurePackImpact on the validator portal
        type: call
        targetComponent: validator_portal
        targetMethod: measurePackImpact
  - name: familyApprovals
    narrative:
      - stepNumber: 1
        description: Forward to the validator portal's pin tree
        type: call
        targetComponent: validator_portal
        targetMethod: familyApprovals
  - name: adviseExternals
    narrative:
      - stepNumber: 1
        description: Forward to the validator portal's advisory live comparison
        type: call
        targetComponent: validator_portal
        targetMethod: adviseExternals
status: complete
createdAt: '2026-06-19T12:00:00Z'
updatedAt: '2026-10-06T10:18:00.365Z'
