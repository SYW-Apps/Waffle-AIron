id: diagnostics_specialist_impl
name: Diagnostics Specialist Implementation
description: >-
  Pure derivation of redacted diagnostic checks and usage snapshots from supplied hosted project
  records, the two server-global pack-tier name listings, and per-project pack/profile references,
  plus assembly of an aggregated instance health report. No I/O.
contract: idiagnostics_specialist
sourcePath: src/server/operations.ts
methods:
  - name: runChecks
    narrative:
      - stepNumber: 1
        description: >-
          Filter the supplied project records to the requested scope when a scope selector is
          provided
        type: local
      - stepNumber: 2
        description: >-
          Derive a project-registry consistency check (unique ids and resolvable roots) from the
          records
        type: local
      - stepNumber: 3
        description: >-
          Derive a per-project state-presence check summarizing projects with and without an active
          state
        type: local
      - stepNumber: 4
        description: Derive a project-count sanity check from the number of active records
        type: local
      - stepNumber: 5
        description: >-
          Derive a 'pack-shadowing' check: compute the pack names present in BOTH the image-tier and
          instance-tier listings; when non-empty, warn and name each shadowed pack (noting the
          instance copy takes precedence over the image copy), otherwise ok
        type: local
      - stepNumber: 6
        description: >-
          Derive a 'missing-pack-references' check: for each in-scope project, compute the
          referenced pack names absent from the union of both tier listings; when any project has
          missing references, fail (error) and name each such project with its missing pack refs
          plus any profile ids thereby invalidated, otherwise ok
        type: local
      - stepNumber: 7
        description: >-
          Relation health (when relation data is supplied): verify every ACTIVE cross-project
          relation targets a project whose stored snapshot exists and still exposes the referenced
          interface — missing snapshots or drifted interfaces yield a warn check naming the relation
          ids
        type: local
      - stepNumber: 8
        description: Assemble the DiagnosticCheckResult list with redacted messages and observation timestamps
        type: local
      - stepNumber: 9
        description: Return the diagnostic check results
        type: return
        outcome: diagnostic check results
  - name: collectUsage
    narrative:
      - stepNumber: 1
        description: >-
          Filter the supplied project records to the requested scope when a scope selector is
          provided
        type: local
      - stepNumber: 2
        description: >-
          Build an instance-level usage snapshot capturing the active project count at the capture
          timestamp
        type: local
      - stepNumber: 3
        description: >-
          When the scope selects a single project, build a project-scoped usage snapshot from that
          record's available metadata
        type: local
      - stepNumber: 4
        description: >-
          Leave quota messages empty; advisory quota evaluation is applied separately by the quota
          specialist
        type: local
      - stepNumber: 5
        description: Return the usage snapshots
        type: return
        outcome: usage snapshots
  - name: buildHealthReport
    narrative:
      - stepNumber: 1
        description: >-
          Compute the overall status: unhealthy when any check is error, degraded when any check is
          warning, otherwise ok
        type: local
      - stepNumber: 2
        description: >-
          Assemble the InstanceHealthReport from the overall status, a generation timestamp, the
          checks, and the usage snapshots
        type: local
      - stepNumber: 3
        description: Return the aggregated health report
        type: return
        outcome: aggregated health report
detail: full
status: complete
