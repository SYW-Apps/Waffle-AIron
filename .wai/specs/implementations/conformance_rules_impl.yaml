id: conformance_rules_impl
name: Conformance Rules Implementation
description: >-
  The conformance rule family, one file per rule under src/core/rules/conformance/, each exporting
  the rule object whose check realizes the method of the same name.
contract: iconformance_rules
simPath: tests/core/validation.test.ts
methods:
  - name: hiddenState
    sourcePath: src/core/rules/conformance/hidden-state.ts
    narrative:
      - stepNumber: 1
        label: implLoop
        description: Map each source file to the implementations that name it
        type: loop
        over: ctx.implementations
        endStep: 4
      - stepNumber: 2
        description: >-
          Resolve component = ctx.componentMap.get(contract.component) for contract =
          ctx.interfaceMap.get(impl.contract)
        type: local
      - stepNumber: 3
        description: >-
          Unresolvable or chained-subproject implementations map no files: continue with the next
          implementation
        type: branch
        condition: component resolves and !ctx.isInChainedSubproject(component.subsystem)
        onFalseStep: 1
      - stepNumber: 4
        label: mapFiles
        description: >-
          Map only the files the conformance dial trusts as evidence (a file dialed off is generated
          or vendored code): impl.sourcePath unless impl.conformance is off, and
          method.sourceFile(impl.sourcePath) for each method of impl.methods unless
          method.conformance ?? impl.conformance is off. For each trusted file, add {impl,
          component} to byPath under ctx.codeModel.pathKey(file), once per implementation per path
        type: local
      - stepNumber: 5
        label: fileLoop
        description: >-
          Judge each exact-grade source file: the code index's own exact-grade path set is the loop,
          so lower analysis grades never reach a verdict to guess at
        type: loop
        over: ctx.codeIndex().exactPaths
        endStep: 7
      - stepNumber: 6
        description: >-
          A file with no module-scope let or var, an unmapped file, or a file also mapped to any
          component that is not stateless logic is exempt: a data or boundary component's file hosts
          that component's state (N:1 collapse), and a Supervisor or Actor holds runtime state by
          definition, so its file may keep module-scope state. Continue with the next file
        type: branch
        condition: >-
          facts = ctx.codeIndex().factsAt(path) has non-empty topLevelMutableBindings, mapped =
          byPath.get(path) is non-empty, and every mapped component is stateless logic:
          component.isLogic() and not component.holdsState(), which is an Orchestrator (or a
          Specialist until it is migrated)
        onFalseStep: 5
      - stepNumber: 7
        label: report
        description: >-
          Report HIDDEN_STATE (warning; spec the mapped implementation with the lowest impl.id;
          draft context when any mapped implementation is ctx.isImplementationDraft) naming
          facts.path, its bindings and the distinct mapped component id (componentType) pairs:
          promote the state to a Store (durability cache for a loss-safe memo), or lint.allow with
          the reason it is wiring or ephemeral; measured let and var at module scope at exact grade,
          const-bound container mutation is beyond the check
        type: local
    symbol: check
  - name: dependencyConformance
    sourcePath: src/core/rules/conformance/dependency-conformance.ts
    narrative:
      - stepNumber: 1
        description: >-
          code = ctx.codeIndex(); realization = ctx.realizationIndex(); mappedPaths = the
          realization index's paths that code.exactPaths holds. A component maps to every file its
          implementations name (each implementation's sourcePath and each method's), chained
          subprojects are absent from the index as in Level 1, and only exact-grade analyzed files
          participate: pattern and generic imports are too coarse to accuse anyone with
        type: local
      - stepNumber: 2
        description: >-
          graph = ctx.importGraph(mappedPaths): the import edges and re-export traces resolved
          against exactly those files. The closed set is part of the graph's identity, so a
          specifier can never resolve to a file outside the mapped set. filesOf(compId) =
          realization.filesOf narrowed to code.exactPaths, kept per component; mappedImplsOf(compId)
          = the component's implementations that named at least one such file
        type: local
      - stepNumber: 3
        description: >-
          Build ownerOf over ctx.components: each id in a component's owns maps to that owning
          component. This is the PLAIN reading — every claim, the last claimant winning —
          deliberately not ctx.ownershipIndex(), which records nothing for an illegal claim: the two
          differ only on trees that already carry an ownership error, where narrowing this map would
          turn one finding into two, so adopting the strict reading here is a doctrine decision
          rather than a refactor
        type: local
      - stepNumber: 4
        label: edgeLoop
        description: Every runtime import edge between mapped files needs a justification
        type: loop
        over: >-
          each import edge fromPath to toPath: for every path in mappedPaths, its graph.importsOf
          targets
        endStep: 7
      - stepNumber: 5
        description: >-
          justified = the private edgeJustified over realization.componentsAt(fromPath) and
          realization.componentsAt(toPath): true when some component cf of the importer and cg of
          the imported are the same component; cf dependsOn or owns cg; they share a subsystem and
          cg, a Portal or Observer, dependsOn or owns cf (the mounting shape); ownerOf(cg) is cf or
          cf dependsOn or owns it; ownerOf(cf) is cg or dependsOn or owns cg; both have the same
          owner; or they sit in different subsystems and cf dependsOn a component published in
          ctx.publicSet for cg's subsystem (the private declaresSurfaceEdge)
        type: local
      - stepNumber: 6
        description: A justified edge continues with the next edge
        type: branch
        condition: justified is false
        onFalseStep: 4
      - stepNumber: 7
        label: undeclaredReport
        description: >-
          Report UNDECLARED_DEPENDENCY (warning; spec the first of
          realization.implementationsAt(fromPath); draft context when any implementation naming
          either file is ctx.isImplementationDraft) naming fromPath and toPath with the components
          each realizes: declare the collaboration on the component that uses it, or route the
          cross-subsystem hop through the target's published surface
        type: local
      - stepNumber: 8
        label: compLoop
        description: >-
          Every declared edge should leave a trace. A trace is a runtime import or a re-export
          (barrel forwarding), and for a mounting declarer the reverse import counts too
        type: loop
        over: ctx.components
        endStep: 14
      - stepNumber: 9
        description: A component with no exact-grade file continues with the next component
        type: branch
        condition: fromFiles = filesOf(component.id) is non-empty
        onFalseStep: 8
      - stepNumber: 10
        label: targetLoop
        description: Check each declared edge
        type: loop
        over: >-
          the distinct ids of component.dependsOn then component.owns (targetId), so a target
          declared under both is one edge
        endStep: 14
      - stepNumber: 11
        description: An unresolvable target continues with the next target
        type: branch
        condition: ctx.componentMap resolves targetId to target
        onFalseStep: 10
      - stepNumber: 12
        description: >-
          toFiles = across subsystems, the exact-grade files of
          realization.filesIn(target.subsystem) minus fromFiles, since the published surface's
          barrel is cosmetic at runtime so any module of the subsystem proves the hop and a shared
          file satisfies it trivially; within one subsystem, filesOf(targetId)
        type: local
      - stepNumber: 13
        label: traceGuard
        description: >-
          An empty toFiles is Level 1 territory (an unmapped target, or a target subsystem whose
          every mapped file is shared with the source), a shared file is the N:1 same-file collapse,
          and a trace realizes the edge: continue with the next target
        type: branch
        condition: >-
          toFiles is non-empty, fromFiles and toFiles share no file, and graph.connects(fromFiles,
          toFiles, component is a Portal or Observer) is false
        onFalseStep: 10
      - stepNumber: 14
        label: unrealizedReport
        description: >-
          Report UNREALIZED_DEPENDENCY (warning; spec the first of mappedImplsOf(component.id), else
          component.id; draft context when ctx.isComponentDraft(component.id),
          ctx.isComponentDraft(targetId), or any of those implementations is
          ctx.isImplementationDraft) naming the edge as dependsOn and owns when both declare
          targetId, else as whichever of the two does, with fromFiles and the target subsystem
          across subsystems or the target's files: the collaboration is wired indirectly (DI) or the
          declared edge is stale
        type: local
    symbol: check
  - name: sourceFileLinkage
    sourcePath: src/core/rules/conformance/source-file-linkage.ts
    narrative:
      - stepNumber: 1
        description: >-
          code = ctx.codeIndex(): the run's source files keyed by canonical path, derived once and
          shared with every conformance rule
        type: local
      - stepNumber: 2
        description: >-
          Collect degradedTsFiles: the analyzed files whose language is typescript or javascript and
          whose analysisGrade is not exact
        type: local
      - stepNumber: 3
        description: 'A silently degraded gate is worse than a degraded gate: surface it once per run'
        type: branch
        condition: degradedTsFiles is non-empty
        onFalseStep: 5
      - stepNumber: 4
        description: >-
          Report CONFORMANCE_DEGRADED (warning; run-wide: no spec id, no draft context) with the
          count of degradedTsFiles: structural findings carry their grade, but dependency
          conformance skips these files; install typescript in the analyzed project
        type: local
      - stepNumber: 5
        label: implLoop
        description: Check each implementation
        type: loop
        over: ctx.implementations
        endStep: 20
      - stepNumber: 6
        description: >-
          Resolve contract = ctx.interfaceMap.get(impl.contract), then component =
          ctx.componentMap.get(contract.component)
        type: local
      - stepNumber: 7
        description: >-
          Unresolvable implementations are skipped, and so are chained-subproject implementations
          (their sourcePaths are relative to the child root and the child validates them in its own
          run): continue with the next implementation
        type: branch
        condition: contract and component both resolve and !ctx.isInChainedSubproject(component.subsystem)
        onFalseStep: 5
      - stepNumber: 8
        description: >-
          draft = ctx.isImplementationDraft(impl). unlinked = the names of contract.methods whose
          source file is none: the entry of impl.methods with the same name gives
          methodImpl.sourceFile(impl.sourcePath), and a contract method with no entry falls back to
          impl.sourcePath. noFileAtAll = impl.sourceFiles() is empty
        type: local
      - stepNumber: 9
        description: >-
          An implementation-type external link is the external source-of-record wairon cannot
          analyze, so it suppresses the missing-path finding
        type: branch
        condition: >-
          (unlinked is non-empty or noFileAtAll) and no entry of component.externalLinks has type
          implementation
        onFalseStep: 11
      - stepNumber: 10
        description: >-
          Report MISSING_SOURCE_PATH (warning; spec impl.id; draft context from draft): when
          unlinked is non-empty, naming those contract methods of impl.contract as naming no source
          file of their own while the implementation declares no sourcePath; otherwise stating that
          the implementation names no source file at all
        type: local
      - stepNumber: 11
        label: fileLoop
        description: >-
          Check the status of each distinct file the implementation names; the existence check
          applies at every conformance tier
        type: loop
        over: impl.sourceFiles() (its own sourcePath, then each method's)
        endStep: 20
      - stepNumber: 12
        description: key = ctx.codeModel.pathKey(file); facts = factsByPath.get(key)
        type: local
      - stepNumber: 13
        description: >-
          Each distinct file is reported once, and only when the code model marks it escaped,
          missing or unreadable (no facts means no code model for the path): otherwise continue with
          the next file
        type: branch
        condition: >-
          key is not yet in reported (record it there now) and facts exist with a status other than
          analyzed
        onFalseStep: 11
      - stepNumber: 14
        description: >-
          owner = the implementation itself when impl.sourcePath normalizes to key; otherwise the
          names of impl.methods whose sourcePath normalizes to key, or the implementation itself
          when none does
        type: local
      - stepNumber: 15
        description: Dispatch on the file's status
        type: switch
        'on': facts.status
        cases:
          - value: escaped
            step: 16
          - value: missing
            step: 18
        defaultStep: 20
      - stepNumber: 16
        label: escapedReport
        description: >-
          Report SOURCE_PATH_ESCAPES_ROOT (error; spec impl.id; draft context from draft) naming
          owner and file: the sourcePath is absolute or escapes the project root
        type: local
      - stepNumber: 17
        description: Continue with the next file
        type: jump
        toStep: 11
      - stepNumber: 18
        label: missingReport
        description: >-
          Report MISSING_SOURCE_FILE (error; spec impl.id; draft context from draft) naming owner
          and file: the sourcePath does not resolve to a file
        type: local
      - stepNumber: 19
        description: Continue with the next file
        type: jump
        toStep: 11
      - stepNumber: 20
        label: skippedReport
        description: >-
          Report CONFORMANCE_ANALYSIS_SKIPPED (warning; spec impl.id; draft context from draft)
          naming owner and file: it could not be analyzed (binary or unreadable), so the methods in
          it were not checked
        type: local
    symbol: check
  - name: findingRealization
    sourcePath: src/core/rules/conformance/finding-realization.ts
    narrative:
      - stepNumber: 1
        description: >-
          code = ctx.codeIndex(): the shared per-path index, whose findingAnchorsAt is anchoredNames
          alone (string literals and property-access names at exact grade; the pattern grade adds
          every identifier outside comments, the generic grade every word)
        type: local
      - stepNumber: 2
        label: implLoop
        description: Check each implementation
        type: loop
        over: ctx.implementations
        endStep: 11
      - stepNumber: 3
        description: >-
          Resolve contract = ctx.interfaceMap.get(impl.contract), then component =
          ctx.componentMap.get(contract.component)
        type: local
      - stepNumber: 4
        description: >-
          Unresolvable and chained-subproject implementations are skipped: continue with the next
          implementation
        type: branch
        condition: contract and component both resolve and !ctx.isInChainedSubproject(component.subsystem)
        onFalseStep: 2
      - stepNumber: 5
        description: >-
          draft = ctx.isImplementationDraft(impl); specTier = impl.conformance ??
          component.defaultConformanceTier()
        type: local
      - stepNumber: 6
        label: methodLoop
        description: Check the finding codes each contract method declares
        type: loop
        over: contract.methods
        endStep: 11
      - stepNumber: 7
        description: >-
          methodImpl = the entry of impl.methods carrying the method's name; tier =
          methodImpl.conformance ?? specTier; file = methodImpl.sourceFile(impl.sourcePath), else
          impl.sourcePath; facts = code.factsAt(file)
        type: local
      - stepNumber: 8
        description: >-
          A method declaring no findings is skipped, and so is one the dial turns off, one with no
          file, and one whose file is not analyzed (source-file-linkage reports that file once):
          continue with the next method
        type: branch
        condition: >-
          method.findings is non-empty, tier is not off, file is named, and facts exist with status
          analyzed
        onFalseStep: 6
      - stepNumber: 9
        label: findingLoop
        description: Check each declared finding code
        type: loop
        over: method.findings
        endStep: 11
      - stepNumber: 10
        description: >-
          A code among the file's finding anchors (a string literal, or a property-access name at
          exact grade) continues with the next finding
        type: branch
        condition: code.findingAnchorsAt(file) lacks finding.code
        onFalseStep: 9
      - stepNumber: 11
        label: findingReport
        description: >-
          Report UNREALIZED_FINDING (warning; spec impl.id; draft context from draft) naming the
          method, impl.contract, finding.code, file and facts.analysisGrade: report the finding
          under its declared code, or remove the declaration
        type: local
    symbol: check
  - name: integrationSimDeclaration
    sourcePath: src/core/rules/conformance/integration-sim-declaration.ts
    narrative:
      - stepNumber: 1
        description: >-
          adopted = the subsystem of every component whose implementation declares a simPath,
          resolved through contract = ctx.interfaceMap.get(impl.contract) and comp =
          ctx.componentMap.get(contract.component), skipping what does not resolve and what sits in
          a chained subproject (whose paths are relative to the child's own root)
        type: local
      - stepNumber: 2
        label: implLoop
        description: Judge each implementation against its subsystem's adoption
        type: loop
        over: ctx.implementations
        endStep: 7
      - stepNumber: 3
        description: >-
          A declared harness is integration-sim-file's, -wiring's and -coverage's question, not this
          one: continue with the next implementation
        type: branch
        condition: impl declares no simPath
        onFalseStep: 2
      - stepNumber: 4
        description: >-
          Resolve comp = ctx.componentMap.get(contract.component) for contract =
          ctx.interfaceMap.get(impl.contract)
        type: local
      - stepNumber: 5
        description: >-
          Unresolvable and chained-subproject implementations are skipped: continue with the next
          implementation
        type: branch
        condition: comp resolves and !ctx.isInChainedSubproject(comp.subsystem)
        onFalseStep: 2
      - stepNumber: 6
        description: >-
          Expected only once the subsystem has adopted sims, only for complete implementations, and
          only for non-leaf components (a leaf's unit suite is its sim): otherwise continue with the
          next implementation
        type: branch
        condition: >-
          adopted has comp.subsystem, !ctx.isImplementationDraft(impl), and deps — the distinct ids
          of comp.dependsOn then comp.owns that ctx.componentMap resolves — is non-empty
        onFalseStep: 2
      - stepNumber: 7
        label: report
        description: >-
          Report MISSING_INTEGRATION_SIM (warning; spec impl.id; no draft context argument, draft
          implementations were already skipped) naming the component, its dependency count and its
          subsystem: declare the committed harness that constructs it with its real dependencies, or
          lint.allow with the reason
        type: local
    symbol: check
  - name: integrationSimFile
    sourcePath: src/core/rules/conformance/integration-sim-file.ts
    narrative:
      - stepNumber: 1
        description: >-
          code = ctx.codeIndex(): the run's source files keyed by canonical path, derived once and
          shared with every conformance rule
        type: local
      - stepNumber: 2
        label: implLoop
        description: Judge each declared integration harness
        type: loop
        over: ctx.implementations
        endStep: 7
      - stepNumber: 3
        description: >-
          An implementation that declares no harness is integration-sim-declaration's question:
          continue with the next implementation
        type: branch
        condition: impl declares a simPath
        onFalseStep: 2
      - stepNumber: 4
        description: >-
          Resolve comp = ctx.componentMap.get(contract.component) for contract =
          ctx.interfaceMap.get(impl.contract)
        type: local
      - stepNumber: 5
        description: >-
          Unresolvable and chained-subproject implementations are skipped, a chained child's paths
          being relative to its own root: continue with the next implementation
        type: branch
        condition: comp resolves and !ctx.isInChainedSubproject(comp.subsystem)
        onFalseStep: 2
      - stepNumber: 6
        description: >-
          A harness that resolves to a readable committed file is sound: continue with the next
          implementation
        type: branch
        condition: facts = code.factsAt(impl.simPath) is absent or has status missing, escaped or unreadable
        onFalseStep: 2
      - stepNumber: 7
        label: report
        description: >-
          Report SIM_FILE_MISSING (warning; spec impl.id; draft context
          ctx.isImplementationDraft(impl)) naming impl.simPath and why: it resolves to no file (no
          facts, or status missing), escapes the project root, or is not readable as source text
        type: local
    symbol: check
  - name: integrationSimWiring
    sourcePath: src/core/rules/conformance/integration-sim-wiring.ts
    narrative:
      - stepNumber: 1
        description: >-
          code = ctx.codeIndex(); realization = ctx.realizationIndex(); graph = ctx.importGraph()
          over every path the run analyzed — the graph's default closed set, which is the one a
          harness is walked over. A named file is a module only when it exists: code.factsAt reports
          status analyzed or unreadable, a missing or escaped file being structural conformance's
          finding alone that no harness can reach. modulesOf(compId) = realization.filesOf(compId)
          narrowed to those, and modulesIn(subsystemId) = realization.filesIn(subsystemId) narrowed
          the same way — the realization index already leaves out implementations whose component
          does not resolve and those inside a chained subproject
        type: local
      - stepNumber: 2
        label: implLoop
        description: Judge each declared harness's import graph
        type: loop
        over: ctx.implementations
        endStep: 12
      - stepNumber: 3
        description: >-
          An implementation that declares no harness is integration-sim-declaration's question:
          continue with the next implementation
        type: branch
        condition: impl declares a simPath
        onFalseStep: 2
      - stepNumber: 4
        description: >-
          Resolve comp = ctx.componentMap.get(contract.component) for contract =
          ctx.interfaceMap.get(impl.contract)
        type: local
      - stepNumber: 5
        description: >-
          Unresolvable and chained-subproject implementations are skipped: continue with the next
          implementation
        type: branch
        condition: comp resolves and !ctx.isInChainedSubproject(comp.subsystem)
        onFalseStep: 2
      - stepNumber: 6
        description: >-
          integration-sim-file's verdict restated — a harness that resolves to no readable file
          reaches nothing and is its finding, not ours — and only exact-grade import graphs prove
          wiring, weaker grades staying silent: otherwise continue with the next implementation
        type: branch
        condition: facts = code.factsAt(impl.simPath) has status analyzed at analysisGrade exact
        onFalseStep: 2
      - stepNumber: 7
        description: >-
          deps = the distinct ids of comp.dependsOn then comp.owns that ctx.componentMap resolves.
          reach = graph.reachFrom(simPath): the paths reached from the normalized simPath by
          following the imports and re-exports of each reached analyzed file transitively, every
          specifier resolved against the graph's closed set. ownFiles = modulesOf(comp.id). missing
          starts with the component's own module when ownFiles is non-empty and reach holds none of
          them
        type: local
      - stepNumber: 8
        label: depLoop
        description: Check that the harness reaches each direct dependency
        type: loop
        over: deps
        endStep: 10
      - stepNumber: 9
        description: >-
          A technology boundary's fake is sanctioned, an unrealized dependency is covered by its own
          findings, and one reached module proves the wiring (any module of the subsystem across
          subsystems): continue with the next dependency
        type: branch
        condition: >-
          the private isTechBoundary(dep) is false (no implementation in
          realization.implementationsOf(dep) declares technologies), depFiles is non-empty
          (modulesIn(depComp.subsystem) when depComp = ctx.componentMap.get(dep) sits in another
          subsystem, else modulesOf(dep)), and reach holds none of depFiles
        onFalseStep: 8
      - stepNumber: 10
        label: appendDep
        description: >-
          Append the dependency to missing: dep with its subsystem (any module of it) across
          subsystems, else dep with its files
        type: local
      - stepNumber: 11
        description: A fully wired harness continues with the next implementation
        type: branch
        condition: missing is non-empty
        onFalseStep: 2
      - stepNumber: 12
        label: report
        description: >-
          Report UNWIRED_INTEGRATION_SIM (warning; spec impl.id; draft context
          ctx.isImplementationDraft(impl)) naming impl.simPath and every module in missing its
          import graph does not reach: import the real modules (technology-boundary adapters may
          stay faked), or fix the simPath
        type: local
    symbol: check
  - name: integrationSimCoverage
    sourcePath: src/core/rules/conformance/integration-sim-coverage.ts
    narrative:
      - stepNumber: 1
        description: >-
          code = ctx.codeIndex(): the run's source files keyed by canonical path, derived once and
          shared with every conformance rule
        type: local
      - stepNumber: 2
        label: implLoop
        description: Judge the path coverage each harness claims
        type: loop
        over: ctx.implementations
        endStep: 12
      - stepNumber: 3
        description: >-
          An implementation that declares no harness is integration-sim-declaration's question:
          continue with the next implementation
        type: branch
        condition: impl declares a simPath
        onFalseStep: 2
      - stepNumber: 4
        description: >-
          Resolve comp = ctx.componentMap.get(contract.component) for contract =
          ctx.interfaceMap.get(impl.contract)
        type: local
      - stepNumber: 5
        description: >-
          Unresolvable and chained-subproject implementations are skipped: continue with the next
          implementation
        type: branch
        condition: comp resolves and !ctx.isInChainedSubproject(comp.subsystem)
        onFalseStep: 2
      - stepNumber: 6
        description: >-
          integration-sim-file's verdict restated — a harness that resolves to no readable file
          carries no anchors and is its finding, not ours — and anchors are read from the file, so
          only exact grade may accuse: otherwise continue with the next implementation
        type: branch
        condition: facts = code.factsAt(impl.simPath) has status analyzed at analysisGrade exact
        onFalseStep: 2
      - stepNumber: 7
        description: >-
          Path coverage is opt-in per component: simAnchors = the sim: anchors of the harness, and
          only an anchor for this component claims coverage (no sim: anchors means no claim):
          otherwise continue with the next implementation. Start an empty uncovered list
        type: branch
        condition: 'some anchor in facts.anchoredNames that starts with sim: starts with sim:<comp.id>.'
        onFalseStep: 2
      - stepNumber: 8
        label: methodLoop
        description: Check each narrated method's paths
        type: loop
        over: impl.methods
        endStep: 10
      - stepNumber: 9
        description: A method with no narrative continues with the next method
        type: branch
        condition: method.narrative is non-empty
        onFalseStep: 8
      - stepNumber: 10
        label: appendPaths
        description: >-
          Append the happy path to uncovered when simAnchors lacks sim:<comp.id>.<method.name>,
          then, for each throw step that carries a label, its error path when simAnchors lacks
          sim:<comp.id>.<method.name>:<step.label>
        type: local
      - stepNumber: 11
        description: A fully covered harness continues with the next implementation
        type: branch
        condition: uncovered is non-empty
        onFalseStep: 2
      - stepNumber: 12
        label: report
        description: >-
          Report SIM_PATH_UNCOVERED (warning; spec impl.id; draft context
          ctx.isImplementationDraft(impl)) naming impl.simPath, comp.id and every uncovered happy or
          error path: drive the path and anchor it with the exact string literal, or drop the
          component's sim: anchors to withdraw the claim
        type: local
    symbol: check
  - name: typeRealization
    sourcePath: src/core/rules/conformance/type-realization.ts
    narrative:
      - stepNumber: 1
        label: typeLoop
        description: Judge each type that claims code
        type: loop
        loopKind: forEach
        over: ctx.types
        endStep: 12
      - stepNumber: 2
        description: >-
          A type that names no sourcePath claims nothing, and a chained child's sourcePaths are
          relative to its own root, so the child judges them in its own run: continue with the next
          type
        type: branch
        condition: type.sourcePath is set and !ctx.isInChainedSubproject(type.subsystem)
        onFalseStep: 1
      - stepNumber: 3
        description: >-
          code = ctx.codeIndex(); blocked = an empty set of the files whose status already stopped
          them from realizing anything
        type: local
      - stepNumber: 4
        label: fileLoop
        description: Check the status of each distinct file the type names, once per file
        type: loop
        loopKind: forEach
        over: type.sourceFiles() (its own sourcePath, then each method's)
        endStep: 6
      - stepNumber: 5
        description: >-
          An analyzed file realizes what it holds; a file the model knows nothing about is judged by
          nobody here
        type: branch
        condition: facts = code.factsAt(ctx.codeModel.pathKey(file)) exists with a status other than analyzed
        onFalseStep: 4
      - stepNumber: 6
        description: >-
          Add the file to blocked and report the problem its status names, spec'd to type.id:
          SOURCE_PATH_ESCAPES_ROOT (error) when escaped, MISSING_SOURCE_FILE (error) when missing,
          CONFORMANCE_ANALYSIS_SKIPPED (warning) when unreadable — naming the file and, when it is a
          method's own file rather than the type's, the methods that name it
        type: local
      - stepNumber: 7
        description: >-
          The declaration the claim promises: its symbol when the code-level name legitimately
          differs, else the type's own name. The declaration tier alone would accept a file that
          merely imports the name, which every consumer does
        type: branch
        condition: >-
          facts = code.factsAt(ctx.codeModel.pathKey(type.sourcePath)) exists, the file is not in
          blocked, and the names the file publishes do not hold type.symbol, else type.name —
          published being facts.exportedNames at exact grade (empty when facts.reexportOnly, a
          barrel declaring nothing of its own), else code.declarationsAt(that key), since only exact
          analysis separates an export from a mention
        onFalseStep: 9
      - stepNumber: 8
        description: >-
          Report UNREALIZED_TYPE (warning; spec type.id) naming the type, the name looked for, the
          file and the grade it was analyzed at: the claim points at code that does not hold the
          declaration — correct the sourcePath, or bind the code-level name with symbol
        type: local
      - stepNumber: 9
        label: methodLoop
        description: Judge each pure method of the claim
        type: loop
        loopKind: forEach
        over: type.methods
        endStep: 12
      - stepNumber: 10
        description: file = the method's own sourcePath when it names one, else type.sourcePath
        type: local
      - stepNumber: 11
        description: >-
          A method is realized under its symbol when the code names it differently — a pure type
          method is often a free function named after its type
        type: branch
        condition: >-
          file is not in blocked, code.factsAt(ctx.codeModel.pathKey(file)) reports it analyzed, and
          code.declarationsAt(that key) does not hold method.symbol, else method.name
        onFalseStep: 9
      - stepNumber: 12
        description: >-
          Report UNREALIZED_TYPE_METHOD (warning; spec type.id) naming the method, the name looked
          for, the file and the grade it was analyzed at
        type: local
    symbol: check
  - name: unclaimedSource
    sourcePath: src/core/rules/conformance/unclaimed-source.ts
    narrative:
      - stepNumber: 1
        description: walked = ctx.codeModel.rootFiles, the files the source-root walk found
        type: local
      - stepNumber: 2
        description: A project that declares no source root opted out of the check
        type: branch
        condition: walked is empty
        onFalseStep: 4
      - stepNumber: 3
        description: >-
          Report nothing: auditing the frozen list against a walk that found nothing would call
          every entry stale for a reason the reader never chose. Silent means silent
        type: return
        outcome: void
      - stepNumber: 4
        description: >-
          claimed = every file the specs name, as canonical keys: each implementation's
          sourceFiles() and its simPath, then each type's sourceFiles()
        type: local
      - stepNumber: 5
        description: >-
          listed = the entries of the project's rules.conformance.unclaimed list, as canonical keys
          — the frozen debt register
        type: local
      - stepNumber: 6
        label: fileLoop
        description: Judge each file the walk found
        type: loop
        loopKind: forEach
        over: walked
        endStep: 10
      - stepNumber: 7
        description: 'A file some spec names is designed code: continue with the next file'
        type: branch
        condition: claimed does not hold the file
        onFalseStep: 6
      - stepNumber: 8
        description: >-
          A pure re-export barrel declares nothing of its own and only republishes other modules, so
          it has no code to claim. Only exact analysis proves that, and a weaker grade never takes
          the exemption
        type: branch
        condition: the file's facts do not report reexportOnly
        onFalseStep: 6
      - stepNumber: 9
        description: A listed file is debt already written down where a reviewer sees the whole list
        type: branch
        condition: listed does not hold the file
        onFalseStep: 6
      - stepNumber: 10
        description: >-
          Report UNCLAIMED_SOURCE_FILE (warning; no spec id — the finding is about a file no spec
          names) naming the file: give it to a spec as a sourcePath, or carry it in
          rules.conformance.unclaimed until it is designed
        type: local
      - stepNumber: 11
        label: entryLoop
        description: Audit the frozen list against what the walk found, so it can only shrink
        type: loop
        loopKind: forEach
        over: listed
        endStep: 13
      - stepNumber: 12
        description: 'Live debt — exactly what the list is for: continue with the next entry'
        type: branch
        condition: >-
          the entry names a walked file that no spec claims and that is not a proven re-export
          barrel
        onTrueStep: 11
        onFalseStep: 13
      - stepNumber: 13
        description: >-
          Report STALE_UNCLAIMED_ENTRY (warning; no spec id) naming the entry: a spec now claims it,
          it is a proven barrel, or the walk no longer finds it (deleted, renamed, excluded, or
          outside the declared roots) — delete the entry, the list only shrinks
        type: local
    symbol: check
  - name: methodRealization
    sourcePath: src/core/rules/conformance/method-realization.ts
    narrative:
      - stepNumber: 1
        description: >-
          code = ctx.codeIndex(): the shared per-path index, whose declarationsAt is declaredNames
          plus exportedNames (the declared tier) and whose anchorsAt adds anchoredNames (the
          anchored tier)
        type: local
      - stepNumber: 2
        label: implLoop
        description: Check each implementation
        type: loop
        over: ctx.implementations
        endStep: 15
      - stepNumber: 3
        description: >-
          Resolve contract = ctx.interfaceMap.get(impl.contract), then component =
          ctx.componentMap.get(contract.component)
        type: local
      - stepNumber: 4
        description: >-
          Unresolvable and chained-subproject implementations are skipped: continue with the next
          implementation
        type: branch
        condition: contract and component both resolve and !ctx.isInChainedSubproject(component.subsystem)
        onFalseStep: 2
      - stepNumber: 5
        description: >-
          draft = ctx.isImplementationDraft(impl); specTier = impl.conformance ??
          component.defaultConformanceTier()
        type: local
      - stepNumber: 6
        label: methodLoop
        description: Check that each contract method is realized in its own source file
        type: loop
        over: contract.methods
        endStep: 15
      - stepNumber: 7
        description: >-
          methodImpl = the entry of impl.methods carrying the method's name; tier =
          methodImpl.conformance ?? specTier; file = methodImpl.sourceFile(impl.sourcePath), else
          impl.sourcePath; facts = code.factsAt(file)
        type: local
      - stepNumber: 8
        description: >-
          Tier off, no file (source-file-linkage's MISSING_SOURCE_PATH covers it) or a file that is
          not analyzed (source-file-linkage's own finding covers it, and only the methods realized
          in it are blocked): continue with the next method
        type: branch
        condition: tier is not off, file is named, and facts exist with status analyzed
        onFalseStep: 6
      - stepNumber: 9
        description: >-
          symbol = methodImpl.symbol ?? method.name; inDeclared = code.declarationsAt(file) holds
          symbol; realized = inDeclared at tier declared, and inDeclared or code.anchorsAt(file)
          holds symbol at any other tier
        type: local
      - stepNumber: 10
        description: 'A realized method is asked the second question instead: is there a body under that name?'
        type: branch
        condition: realized is false
        onFalseStep: 13
      - stepNumber: 11
        label: methodReport
        description: >-
          Report UNREALIZED_METHOD (warning; spec impl.id; draft context from draft) naming the
          method (with its symbol when one is mapped), impl.contract, file, tier and
          facts.analysisGrade; adds the weak-anchor hint when the tier is declared and only
          code.anchorsAt(file) holds symbol
        type: local
      - stepNumber: 12
        description: 'An unrealized method is reported once: continue with the next method'
        type: jump
        toStep: 6
      - stepNumber: 13
        label: bodyReach
        description: >-
          reachable = the private bodyReachable(code, file, symbol): the origins code.originOf
          resolves a bare call site of symbol in file to, answering true when any of them holds
          facts.hasFunctionBody under symbol — or under the file's importBindingOf(symbol).imported
          when the import renamed it. No origin at all, or one below exact grade, also answers true:
          unreadable is not absent
        type: local
      - stepNumber: 14
        description: >-
          A weak string anchor claims no function (the anchored tier's registration is deliberate),
          a weaker grade measures no bodies, and a reachable body is realization: continue with the
          next method
        type: branch
        condition: inDeclared, facts.analysisGrade is exact, and reachable is false
        onFalseStep: 6
      - stepNumber: 15
        label: bodyReport
        description: >-
          Report METHOD_BODY_NOT_FOUND (warning; spec impl.id; draft context from draft) naming the
          method (with its symbol when one is mapped), impl.contract and file: the name is a
          declaration with no function body behind it — a signature, an ambient or interface
          declaration, a value binding, or a name this file only imports or re-exports — so every
          deeper check reads nothing and the method is judged on its name alone
        type: local
    symbol: check
  - name: callConformance
    sourcePath: src/core/rules/conformance/call-conformance.ts
    narrative:
      - stepNumber: 1
        description: >-
          code = ctx.codeIndex(): the run's source files keyed by canonical path. methods =
          ctx.implementationMethods() — the descent resolved once for the whole run: the
          implementation, its contract's component, the file that realizes the method (its
          sourcePath, else the implementation's) and its draft context, with unresolvable and
          chained-subproject implementations already left out. modelledAt = for every entry that
          names a sourceFile, its realizing symbol (implMethod.symbol ?? implMethod.name) under that
          file's canonical key, carrying the component and method it belongs to — the converse
          direction's whole subject, read off the same descent so a component and its colocated
          neighbour come from one walk
        type: local
      - stepNumber: 2
        label: methodLoop
        description: >-
          Judge each method's narrative call steps against the calls its realized function makes,
          and those calls against its narrative
        type: loop
        over: methods
        endStep: 18
      - stepNumber: 3
        description: >-
          tier = implMethod.conformance ?? impl.conformance ?? component.defaultConformanceTier();
          facts = code.factsAt(the entry's sourceFile) when it names one
        type: local
      - stepNumber: 4
        description: >-
          The conformance dial off skips, only exact analysis grade fires (weaker grades never
          guess), and a method that CLAIMS no call is this rule's subject in neither direction —
          nothing to prove forward, and nothing it could have failed to declare, so what it leaves
          unsaid is UNUSED_*'s subject and not a charge of hiding a colocated call. The stance stays
          written here, where the accusation is read: otherwise continue with the next method
        type: branch
        condition: >-
          tier is not off, implMethod.narrative or implMethod.calls is non-empty, the entry names a
          sourceFile, and facts exist with status analyzed at analysisGrade exact
        onFalseStep: 2
      - stepNumber: 5
        description: >-
          fnSymbol = implMethod.symbol ?? implMethod.name; colocated = modelledAt at that file;
          sites = the private closedCallSites(code, file, fnSymbol): the function's own
          facts.callSitesOf entry, closed transitively over the named helpers it calls, each site
          carrying the file its names resolve in. The forward direction closes over EVERYTHING the
          function reaches — a wider callee set can only accept more, never accuse. claims = the
          private claimsOf(implMethod): every narrative call step carrying its stepNumber, then
          every declared `calls` entry parsed into the component and method it names and carrying no
          stepNumber at all. One subject, because the two assert the same call and only a step also
          says where in the flow it happens — which this check never reads. A dispatch step names a
          capability rather than a method and asserts nothing about a call site, and a declared
          reference that is not <component>.<method> names no target (MALFORMED_DECLARED_CALL
          reports exactly that): neither becomes a claim. Start an empty missed list
        type: local
      - stepNumber: 6
        description: >-
          The function has no body here at all — UNREALIZED_METHOD's find when the name is absent,
          METHOD_BODY_NOT_FOUND's when it is a bodyless declaration: continue with the next method
        type: branch
        condition: sites is present
        onFalseStep: 2
      - stepNumber: 7
        label: stepLoop
        description: Check each call the method claims
        type: loop
        over: claims
        endStep: 13
      - stepNumber: 8
        description: >-
          A target this tree does not contain is cross-tree-references' finding, and
          surface-reference-backing's once it resolves: continue with the next claim
        type: branch
        condition: ctx.componentMap has claim.component
        onFalseStep: 7
      - stepNumber: 9
        description: >-
          target = the private resolveCallTarget over the implementations of each interface in
          ctx.interfacesByComponent.get(claim.component): accepted = claim.method plus the symbol
          each target-side implementation declares for it, files = each such implementation's method
          sourcePath, else its own
        type: local
      - stepNumber: 10
        description: >-
          N:1 identity forwarding — the caller's own realized symbol IS the target name, so facade
          and target collapse onto one function and the claim is realized by identity, exactly as
          Level 1's N:1 sharing blesses. A declaration earns this on the same terms a step does: the
          reason is the shape of the CODE, which does not know which way the claim was written.
          Continue with the next claim
        type: branch
        condition: accepted lacks fnSymbol
        onFalseStep: 7
      - stepNumber: 11
        description: >-
          matching = the sites whose name is in accepted. reached = the union of
          code.possibleOriginsOf(site, file) over matching — every file each matching call CAN have
          been written in, a this.<field>.<method>() receiver followed through the field's declared
          type and a new Class(...).<method>() receiver through the module its class name came from.
          landed = the union of code.originOf(site, file) over the same sites — the files a call
          PROVABLY lands in, empty where a pure model cannot say, and the only tier a finding may
          name a landing from: widening what a call reached can accept a claim, it must never accuse
          one
        type: local
      - stepNumber: 12
        description: >-
          A target naming no file of its own has nothing to resolve AGAINST (MISSING_SOURCE_PATH
          reports exactly that), so it falls back to the name membership this check has always had;
          otherwise a call landing in one of the target's own files realizes the claim: continue
          with the next claim
        type: branch
        condition: >-
          the claim is unrealized: target.files is empty and matching is empty, or target.files is
          non-empty and reached meets none of it
        onFalseStep: 7
      - stepNumber: 13
        label: appendMissed
        description: >-
          Append to missed: the claim's stepNumber when it has one, its target (component.method),
          the accepted names and the miss — absent when matching is empty, unresolved when landed is
          empty, carrying the distinct SHAPES the matching sites were written in, which is what an
          unresolved answer is about, else elsewhere carrying the files it did land in
        type: local
      - stepNumber: 14
        label: unrealizedReport
        description: >-
          When missed holds an entry whose miss is NOT unresolved, report CALL_STEP_UNREALIZED
          (warning; spec impl.id; draft context the entry's draftContext), one finding per method
          listing each such claim with its target, the names looked for and the files it landed in
          instead, plus the function fnSymbol and file: callees are closed over the named helpers
          the function calls and resolved through this file's import bindings, order and arguments
          unchecked. A claim reads as "step 3" or as "declared call" and is carried as a unit the
          same way — stepNumber:target for a step, target alone for a declaration, which is the
          `calls` entry verbatim. Only what RESOLVED may accuse, so an unresolved miss is never
          counted here
        type: local
      - stepNumber: 15
        label: unresolvedReport
        description: >-
          When missed holds an unresolved entry, report CALL_ORIGIN_UNRESOLVED (warning; spec
          impl.id; draft context the entry's draftContext), one finding per method listing each such
          claim with the shape its call sites were written in: the target name IS called inside
          fnSymbol, but from no site this analysis can resolve to a file. It names which forms
          resolve and which do not, and asks for nothing — this is a coverage hole in the reader,
          not a defect in the code or in what the method claims, so the claim is neither proven
          realized nor accused of being missing and no working call is asked to be rewritten to suit
          the analysis
        type: local
      - stepNumber: 16
        description: >-
          declared = every targetComponent.targetMethod any narrative step of the method names,
          together with every entry of its declared `calls`. A dispatch or register step asserts
          nothing about a call site, but it does name the target out loud, and this direction asks
          only whether the boundary hop is written down where a reader will find it. crossings = the
          sites of closedCallSites(code, file, fnSymbol, stopping AT the colocated names) whose name
          is a colocated modelled method of another component, is not in declared, and whose
          code.originOf resolves to this very file. The converse direction stops at a modelled
          method because what it goes on to call belongs to its own narrative
        type: local
      - stepNumber: 17
        description: >-
          A call to a same-file PRIVATE helper is no modelled method and never appears among the
          crossings, so a rule's internal factoring is never a finding: continue with the next
          method
        type: branch
        condition: crossings is non-empty
        onFalseStep: 2
      - stepNumber: 18
        label: colocatedReport
        description: >-
          Report UNDECLARED_COLOCATED_CALL (warning; spec impl.id; draft context the entry's
          draftContext), one finding per method naming each crossing's called symbol and the
          component method it is: sharing a file does not make the hop internal — it crosses a
          component boundary nothing imports, which no file-level check can see. Narrate the call,
          declare it in `calls`, or move the code so the boundary is real
        type: local
    symbol: check
  - name: carriedDebt
    sourcePath: src/core/rules/conformance/carried-debt.ts
    narrative:
      - stepNumber: 1
        description: >-
          carried = ctx.carriedFindings, the conformance debt register flattened to one entry per
          carried finding, each holding its reason group's kind and why
        type: local
      - stepNumber: 2
        description: A project that declares no debt has nothing to audit
        type: branch
        condition: carried is empty
        onFalseStep: 4
      - stepNumber: 3
        description: Report nothing
        type: return
        outcome: void
      - stepNumber: 4
        label: legality
        description: >-
          Legality first, and whatever the run saw: a code that may not be carried is wrong even in
          a run that judged no code at all
        type: loop
        loopKind: forEach
        over: carried
        endStep: 7
      - stepNumber: 5
        description: 'A carryable code is the register''s whole domain: continue with the next entry'
        type: branch
        condition: ctx.carryableIssueCodes holds the entry's code
        onTrueStep: 4
        onFalseStep: 6
      - stepNumber: 6
        description: >-
          why = ctx.knownIssueCodes holds the code ? that code is not CARRYABLE, because the
          register holds measured code↔spec debt and a doctrine, soundness or configuration finding
          says the design is illegal rather than unfinished : no registered rule emits that code
        type: local
      - stepNumber: 7
        description: >-
          Report UNCARRYABLE_FINDING (error; no spec id, so no lint allow can reach it) naming the
          code, the spec, the site and why: remove the entry, or declare the code carryable on the
          rule that emits it
        type: local
      - stepNumber: 8
        description: A run that built no code model could not have fired one conformance finding
        type: branch
        condition: ctx.codeModel.files is empty
        onFalseStep: 10
      - stepNumber: 9
        description: 'Report nothing: every entry would read as stale for a reason the reader never chose'
        type: return
        outcome: void
      - stepNumber: 10
        description: known = every spec id in the tree; addressed = the spec, code and site keys already judged
        type: local
      - stepNumber: 11
        label: audit
        description: Audit each entry against what the run actually saw, so the register can only shrink
        type: loop
        loopKind: forEach
        over: carried
        endStep: 22
      - stepNumber: 12
        description: >-
          A silence the project itself chose, and a spec this run never reached, are not debts
          anyone paid: continue with the next entry
        type: branch
        condition: >-
          the entry's code is carryable, the project did not switch that code off, and its spec is
          in this run's scope
        onTrueStep: 13
        onFalseStep: 11
      - stepNumber: 13
        description: Only the first entry for a finding can ever match, so a repeat carries nothing
        type: branch
        condition: addressed already holds the entry's spec, code and site
        onTrueStep: 14
        onFalseStep: 16
      - stepNumber: 14
        description: >-
          Report STALE_CARRIED_FINDING (warning; no spec id) naming the repeat: delete it and merge
          its units into the one entry
        type: local
      - stepNumber: 15
        description: Continue with the next entry
        type: jump
        toStep: 11
      - stepNumber: 16
        description: Record the entry's spec, code and site in addressed
        type: local
      - stepNumber: 17
        description: An entry no finding matched carries nothing
        type: branch
        condition: the entry fired this run
        onTrueStep: 20
        onFalseStep: 18
      - stepNumber: 18
        description: >-
          Report STALE_CARRIED_FINDING (warning; no spec id) naming the entry with its kind and
          reason: no such finding fired, so the debt is paid or the spec no longer reaches that site
          — or the tree holds no such spec at all. Delete the entry; the register only shrinks
        type: local
      - stepNumber: 19
        description: Continue with the next entry
        type: jump
        toStep: 11
      - stepNumber: 20
        description: paid = the entry's covers the live finding did not report
        type: local
      - stepNumber: 21
        description: >-
          An entry that lists exactly what fired is the register doing its job: continue with the
          next entry
        type: branch
        condition: paid is empty
        onTrueStep: 11
        onFalseStep: 22
      - stepNumber: 22
        description: >-
          Report STALE_CARRIED_FINDING (warning; no spec id) naming the paid units: that much of the
          debt is paid, so delete those lines from the entry's covers; the register only shrinks
        type: local
    symbol: check
status: complete
