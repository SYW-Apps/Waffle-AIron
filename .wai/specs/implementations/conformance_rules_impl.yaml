id: conformance_rules_impl
name: Conformance Rules Implementation
description: >-
  The conformance rule family, one file per rule under src/core/rules/conformance/, each exporting
  the rule object whose check realizes the method of the same name.
contract: iconformance_rules
simPath: tests/core/validation.test.ts
methods:
  - name: callConformance
    sourcePath: src/core/rules/conformance/call-conformance.ts
    narrative:
      - stepNumber: 1
        description: Index ctx.codeModel.files by ctx.codeModel.pathKey(path) into factsByPath
        type: local
      - stepNumber: 2
        label: implLoop
        description: Check each implementation
        type: loop
        over: ctx.implementations
        endStep: 17
      - stepNumber: 3
        description: >-
          Resolve contract = ctx.interfaceMap.get(impl.contract), then component =
          ctx.componentMap.get(contract.component)
        type: local
      - stepNumber: 4
        description: >-
          Unresolvable and chained-subproject implementations are skipped: continue with the next
          implementation
        type: branch
        condition: contract and component both resolve and !ctx.isInChainedSubproject(component.subsystem)
        onFalseStep: 2
      - stepNumber: 5
        description: >-
          specTier = impl.conformance ?? component.defaultConformanceTier(); isDraftCtx =
          ctx.isImplementationDraft(impl)
        type: local
      - stepNumber: 6
        label: methodLoop
        description: Check each implementation method
        type: loop
        over: impl.methods
        endStep: 17
      - stepNumber: 7
        description: >-
          tier = implMethod.conformance ?? specTier; file = implMethod.sourceFile(impl.sourcePath);
          facts = factsByPath.get(ctx.codeModel.pathKey(file)) when file is named
        type: local
      - stepNumber: 8
        description: >-
          The conformance dial off skips, and only exact analysis grade fires (weaker grades never
          guess): otherwise continue with the next method
        type: branch
        condition: >-
          tier is not off, implMethod.narrative is non-empty, file is named, and facts exist with
          status analyzed at analysisGrade exact
        onFalseStep: 6
      - stepNumber: 9
        description: >-
          fnSymbol = implMethod.symbol ?? implMethod.name. callees = the private
          closedCallees(facts, fnSymbol): the function's own entry in facts.functionCalls (read
          through the private ownEntry, own properties only, so names like toString never resolve to
          Object.prototype), closed transitively over the same-file named functions it calls; none
          when the function has no entry. Start an empty missing list
        type: local
      - stepNumber: 10
        description: >-
          A missing realized function is structural conformance's finding, and a duplicate here
          would be noise: continue with the next method
        type: branch
        condition: callees is present
        onFalseStep: 6
      - stepNumber: 11
        label: stepLoop
        description: Check each narrative step
        type: loop
        over: implMethod.narrative
        endStep: 15
      - stepNumber: 12
        description: >-
          Only call steps count (dispatch steps route through runtime tables, so the bound name
          never appears at the call site); dangling targets are the contracts rule's findings:
          continue with the next step
        type: branch
        condition: >-
          step is a call step with targetComponent and targetMethod, and ctx.componentMap has
          step.targetComponent
        onFalseStep: 11
      - stepNumber: 13
        description: >-
          accepted = step.targetMethod plus the symbol of the same-named method in each
          implementation (ctx.implementationsByContract.get(interface.id)) of each interface in
          ctx.interfacesByComponent.get(step.targetComponent)
        type: local
      - stepNumber: 14
        description: >-
          N:1 identity forwarding (the caller's own realized symbol is the target name) or a
          matching callee realizes the step: continue with the next step
        type: branch
        condition: accepted lacks fnSymbol and no name in accepted is among callees
        onFalseStep: 11
      - stepNumber: 15
        label: appendMissing
        description: >-
          Append the step's stepNumber, its target (targetComponent.targetMethod) and the accepted
          names to missing
        type: local
      - stepNumber: 16
        description: A method with every call step realized continues with the next method
        type: branch
        condition: missing is non-empty
        onFalseStep: 6
      - stepNumber: 17
        label: report
        description: >-
          Report CALL_STEP_UNREALIZED (warning; spec impl.id; draft context isDraftCtx), one finding
          per method listing each unrealized step with its target and the names looked for, the
          function fnSymbol and file: callees are matched by name, closed over same-file helpers,
          set membership only (order and arguments are not checked)
        type: local
    symbol: check
  - name: hiddenState
    sourcePath: src/core/rules/conformance/hidden-state.ts
    narrative:
      - stepNumber: 1
        label: implLoop
        description: Map each source file to the implementations that name it
        type: loop
        over: ctx.implementations
        endStep: 4
      - stepNumber: 2
        description: >-
          Resolve component = ctx.componentMap.get(contract.component) for contract =
          ctx.interfaceMap.get(impl.contract)
        type: local
      - stepNumber: 3
        description: >-
          Unresolvable or chained-subproject implementations map no files: continue with the next
          implementation
        type: branch
        condition: component resolves and !ctx.isInChainedSubproject(component.subsystem)
        onFalseStep: 1
      - stepNumber: 4
        label: mapFiles
        description: >-
          Map only the files the conformance dial trusts as evidence (a file dialed off is generated
          or vendored code): impl.sourcePath unless impl.conformance is off, and
          method.sourceFile(impl.sourcePath) for each method of impl.methods unless
          method.conformance ?? impl.conformance is off. For each trusted file, add {impl,
          component} to byPath under ctx.codeModel.pathKey(file), once per implementation per path
        type: local
      - stepNumber: 5
        label: fileLoop
        description: Judge each source file in the code model
        type: loop
        over: ctx.codeModel.files
        endStep: 8
      - stepNumber: 6
        description: 'Lower analysis grades never guess: continue with the next file'
        type: branch
        condition: facts.status is analyzed and facts.analysisGrade is exact
        onFalseStep: 5
      - stepNumber: 7
        description: >-
          A file with no module-scope let or var, an unmapped file, or a file also mapped to any
          component that is not stateless logic is exempt: a data or boundary component's file hosts
          that component's state (N:1 collapse), and a Supervisor or Actor holds runtime state by
          definition, so its file may keep module-scope state. Continue with the next file
        type: branch
        condition: >-
          facts.topLevelMutableBindings is non-empty, mapped =
          byPath.get(ctx.codeModel.pathKey(facts.path)) is non-empty, and every mapped component is
          stateless logic: component.isLogic() and not component.holdsState(), which is an
          Orchestrator (or a Specialist until it is migrated)
        onFalseStep: 5
      - stepNumber: 8
        label: report
        description: >-
          Report HIDDEN_STATE (warning; spec the mapped implementation with the lowest impl.id;
          draft context when any mapped implementation is ctx.isImplementationDraft) naming
          facts.path, its bindings and the distinct mapped component id (componentType) pairs:
          promote the state to a Store (durability cache for a loss-safe memo), or lint.allow with
          the reason it is wiring or ephemeral; measured let and var at module scope at exact grade,
          const-bound container mutation is beyond the check
        type: local
    symbol: check
  - name: dependencyConformance
    sourcePath: src/core/rules/conformance/dependency-conformance.ts
    narrative:
      - stepNumber: 1
        description: >-
          Index ctx.codeModel.files by ctx.codeModel.pathKey(path) into factsByPath; start empty
          nodes (per file: path, components, anchorImplId, imports, reexports, draft),
          filesByComponent and implsByComponent
        type: local
      - stepNumber: 2
        label: implLoop
        description: Map component files, exact grade and non-chained only
        type: loop
        over: ctx.implementations
        endStep: 8
      - stepNumber: 3
        description: >-
          Resolve contract = ctx.interfaceMap.get(impl.contract), then component =
          ctx.componentMap.get(contract.component)
        type: local
      - stepNumber: 4
        description: >-
          Unresolvable implementations are skipped, and chained-subproject implementations validate
          standalone in their own run as in Level 1: continue with the next implementation
        type: branch
        condition: contract and component both resolve and !ctx.isInChainedSubproject(component.subsystem)
        onFalseStep: 2
      - stepNumber: 5
        label: fileLoop
        description: Map each file the implementation names
        type: loop
        over: impl.sourceFiles() (its own sourcePath, then each method's)
        endStep: 7
      - stepNumber: 6
        description: 'Only exact-grade analyzed files participate: continue with the next file'
        type: branch
        condition: >-
          factsByPath holds facts for p = ctx.codeModel.pathKey(file) with status analyzed at
          analysisGrade exact
        onFalseStep: 5
      - stepNumber: 7
        label: mapFile
        description: >-
          Get or create the node for p (anchorImplId = impl.id, imports and reexports from its
          facts, draft false); add component to node.components when absent; OR
          ctx.isImplementationDraft(impl) into node.draft; add p to filesByComponent[component.id];
          note that the implementation mapped a file
        type: local
      - stepNumber: 8
        label: recordImpl
        description: >-
          When the implementation mapped at least one file, append impl to
          implsByComponent[component.id]
        type: local
      - stepNumber: 9
        description: >-
          Resolve import edges between mapped files with the importing file's
          facts.resolveImport(specifier, mapped paths), which takes relative specifiers only and
          tries the joined path, its .js to .ts/.tsx swaps, the .ts/.tsx/.js suffixes and
          index.ts/index.js: edges[node.path] = the resolved runtime imports other than the node
          itself; realizationEdges[node.path] = those plus the resolved reexports other than the
          node itself
        type: local
      - stepNumber: 10
        description: >-
          Build ownerOf over ctx.components: each id in a component's owns maps to that owning
          component
        type: local
      - stepNumber: 11
        label: edgeLoop
        description: Every runtime import edge needs a justification
        type: loop
        over: each import edge fromPath to toPath in edges
        endStep: 14
      - stepNumber: 12
        description: >-
          justified = the private edgeJustified(fromNode, toNode): true when some component cf of
          fromNode and cg of toNode are the same component; cf dependsOn or owns cg; they share a
          subsystem and cg, a Portal or Observer, dependsOn or owns cf (the mounting shape);
          ownerOf(cg) is cf or cf dependsOn or owns it; ownerOf(cf) is cg or dependsOn or owns cg;
          both have the same owner; or they sit in different subsystems and cf dependsOn a component
          published in ctx.publicSet for cg's subsystem (the private declaresSurfaceEdge)
        type: local
      - stepNumber: 13
        description: A justified edge continues with the next edge
        type: branch
        condition: justified is false
        onFalseStep: 11
      - stepNumber: 14
        label: undeclaredReport
        description: >-
          Report UNDECLARED_DEPENDENCY (warning; spec fromNode.anchorImplId; draft context
          fromNode.draft or toNode.draft) naming fromPath and toPath with the components each
          realizes: declare the collaboration on the component that uses it, or route the
          cross-subsystem hop through the target's published surface
        type: local
      - stepNumber: 15
        label: compLoop
        description: Every declared edge should leave a trace
        type: loop
        over: ctx.components
        endStep: 23
      - stepNumber: 16
        description: An unmapped component continues with the next component
        type: branch
        condition: filesByComponent has fromFiles for component.id
        onFalseStep: 15
      - stepNumber: 17
        label: targetLoop
        description: Check each declared edge
        type: loop
        over: >-
          the distinct ids of component.dependsOn then component.owns (targetId), so a target
          declared under both is one edge
        endStep: 23
      - stepNumber: 18
        description: An unresolvable target continues with the next target
        type: branch
        condition: ctx.componentMap resolves targetId to target
        onFalseStep: 17
      - stepNumber: 19
        description: Cross-subsystem edges are realized by any import landing in the target subsystem
        type: branch
        condition: component.subsystem differs from target.subsystem
        onFalseStep: 22
      - stepNumber: 20
        description: >-
          subsystemFiles = the paths of nodes realizing any component of target.subsystem, minus
          fromFiles (shared files satisfy trivially)
        type: local
      - stepNumber: 21
        description: >-
          The private hasImportBetween finds a trace when a realizationEdges target of some
          from-file is a to-file, or, with reverse allowed for a mounting declarer, a
          realizationEdges target of some to-file is a from-file. An empty set or a trace continues
          with the next target
        type: branch
        condition: >-
          subsystemFiles is non-empty and hasImportBetween(fromFiles, subsystemFiles, component is a
          Portal or Observer) is false
        onTrueStep: 23
        onFalseStep: 17
      - stepNumber: 22
        label: sameSubsystem
        description: >-
          An unmapped target is Level 1 territory, a shared file is the N:1 same-file collapse, and
          a trace realizes the edge: continue with the next target
        type: branch
        condition: >-
          filesByComponent has toFiles for targetId, fromFiles and toFiles share no file, and
          hasImportBetween(fromFiles, toFiles, component is a Portal or Observer) is false
        onFalseStep: 17
      - stepNumber: 23
        label: unrealizedReport
        description: >-
          Report UNREALIZED_DEPENDENCY (warning; spec the first implementation in
          implsByComponent[component.id], else component.id; draft context when
          ctx.isComponentDraft(component.id), ctx.isComponentDraft(targetId), or any of those
          implementations is ctx.isImplementationDraft) naming the edge as dependsOn and owns when
          both declare targetId, else as whichever of the two does, with fromFiles and the target
          subsystem across subsystems or the target's files: the collaboration is wired indirectly
          (DI) or the declared edge is stale
        type: local
    symbol: check
  - name: integrationConformance
    sourcePath: src/core/rules/conformance/integration-conformance.ts
    narrative:
      - stepNumber: 1
        description: >-
          Index ctx.codeModel.files by ctx.codeModel.pathKey(path) into factsByPath; allPaths = its
          keys
        type: local
      - stepNumber: 2
        description: >-
          For each implementation whose component resolves through ctx.interfaceMap and
          ctx.componentMap and does not sit in a chained subproject
          (!ctx.isInChainedSubproject(component.subsystem): a chained child's sourcePaths are
          relative to its own root, and the child validates them in its own run): append it to
          implsByComponent[component.id]; add each of impl.sourceFiles() that exists, by
          ctx.codeModel.pathKey, to filesByComponent[component.id] and
          filesBySubsystem[component.subsystem] (it exists when factsByPath holds facts for it with
          status analyzed or unreadable; a missing or escaped file is structural conformance's
          finding alone); and when it declares a simPath, add component.subsystem to adopted
        type: local
      - stepNumber: 3
        label: implLoop
        description: Judge each implementation's integration harness
        type: loop
        over: ctx.implementations
        endStep: 25
      - stepNumber: 4
        description: >-
          Resolve comp = ctx.componentMap.get(contract.component) for contract =
          ctx.interfaceMap.get(impl.contract); once comp resolves, deps = the distinct ids of
          comp.dependsOn then comp.owns that ctx.componentMap resolves
        type: local
      - stepNumber: 5
        description: >-
          Unresolvable and chained-subproject implementations are skipped: continue with the next
          implementation
        type: branch
        condition: comp resolves and !ctx.isInChainedSubproject(comp.subsystem)
        onFalseStep: 3
      - stepNumber: 6
        description: 'Expectation half: whether this implementation should declare a harness'
        type: branch
        condition: impl declares no simPath
        onFalseStep: 10
      - stepNumber: 7
        description: >-
          Expected only once the subsystem has adopted sims, only for complete implementations, and
          only for non-leaf components (a leaf's unit suite is its sim): otherwise continue with the
          next implementation
        type: branch
        condition: adopted has comp.subsystem, !ctx.isImplementationDraft(impl), and deps is non-empty
        onFalseStep: 3
      - stepNumber: 8
        description: >-
          Report MISSING_INTEGRATION_SIM (warning; spec impl.id; no draft context argument, draft
          implementations were already skipped) naming the component, its dependency count and its
          subsystem: declare the committed harness that constructs it with its real dependencies, or
          lint.allow with the reason
        type: local
      - stepNumber: 9
        description: Continue with the next implementation
        type: jump
        toStep: 3
      - stepNumber: 10
        label: soundness
        description: 'Soundness half: the declared harness must exist inside the project'
        type: branch
        condition: >-
          facts = factsByPath.get(ctx.codeModel.pathKey(impl.simPath)) is absent or has status
          missing, escaped or unreadable
        onFalseStep: 13
      - stepNumber: 11
        description: >-
          Report SIM_FILE_MISSING (warning; spec impl.id; draft context
          ctx.isImplementationDraft(impl)) naming impl.simPath and why: it resolves to no file (no
          facts, or status missing), escapes the project root, or is not readable as source text
        type: local
      - stepNumber: 12
        description: Continue with the next implementation
        type: jump
        toStep: 3
      - stepNumber: 13
        label: gradeGate
        description: >-
          Only exact-grade import graphs prove wiring, and weaker grades stay silent: continue with
          the next implementation
        type: branch
        condition: facts.analysisGrade is exact
        onFalseStep: 3
      - stepNumber: 14
        description: >-
          reach = the private reachFrom(simPath): the paths reached depth-first from the normalized
          simPath over the imports and reexports of each reached file with analyzed facts, each
          specifier resolved by the importing file's facts.resolveImport(specifier, allPaths).
          ownFiles = filesByComponent.get(comp.id) or empty. missing starts with the component's own
          module when ownFiles is non-empty and reach holds none of them
        type: local
      - stepNumber: 15
        label: depLoop
        description: Check that the harness reaches each direct dependency
        type: loop
        over: deps
        endStep: 17
      - stepNumber: 16
        description: >-
          A technology boundary's fake is sanctioned, an unrealized dependency is covered by its own
          findings, and one reached module proves the wiring (any module of the subsystem across
          subsystems): continue with the next dependency
        type: branch
        condition: >-
          the private isTechBoundary(dep) is false (no implementation in implsByComponent[dep]
          declares technologies), depFiles is non-empty (filesBySubsystem.get(depComp.subsystem)
          when depComp = ctx.componentMap.get(dep) sits in another subsystem, else
          filesByComponent.get(dep)), and reach holds none of depFiles
        onFalseStep: 15
      - stepNumber: 17
        label: appendDep
        description: >-
          Append the dependency to missing: dep with its subsystem (any module of it) across
          subsystems, else dep with its files
        type: local
      - stepNumber: 18
        description: A fully wired harness goes on to path coverage
        type: branch
        condition: missing is non-empty
        onFalseStep: 20
      - stepNumber: 19
        description: >-
          Report UNWIRED_INTEGRATION_SIM (warning; spec impl.id; draft context
          ctx.isImplementationDraft(impl)) naming impl.simPath and every module in missing its
          import graph does not reach: import the real modules (technology-boundary adapters may
          stay faked), or fix the simPath
        type: local
      - stepNumber: 20
        label: coverage
        description: >-
          Path coverage is opt-in per component: simAnchors = the sim: anchors of the harness, and
          only an anchor for this component claims coverage (no sim: anchors means no claim):
          otherwise continue with the next implementation. Start an empty uncovered list
        type: branch
        condition: 'some anchor in facts.anchoredNames that starts with sim: starts with sim:<comp.id>.'
        onFalseStep: 3
      - stepNumber: 21
        label: methodLoop
        description: Check each narrated method's paths
        type: loop
        over: impl.methods
        endStep: 23
      - stepNumber: 22
        description: A method with no narrative continues with the next method
        type: branch
        condition: method.narrative is non-empty
        onFalseStep: 21
      - stepNumber: 23
        label: appendPaths
        description: >-
          Append the happy path to uncovered when simAnchors lacks sim:<comp.id>.<method.name>,
          then, for each throw step that carries a label, its error path when simAnchors lacks
          sim:<comp.id>.<method.name>:<step.label>
        type: local
      - stepNumber: 24
        description: A fully covered harness continues with the next implementation
        type: branch
        condition: uncovered is non-empty
        onFalseStep: 3
      - stepNumber: 25
        label: coverageReport
        description: >-
          Report SIM_PATH_UNCOVERED (warning; spec impl.id; draft context
          ctx.isImplementationDraft(impl)) naming impl.simPath, comp.id and every uncovered happy or
          error path: drive the path and anchor it with the exact string literal, or drop the
          component's sim: anchors to withdraw the claim
        type: local
    symbol: check
  - name: sourceFileLinkage
    sourcePath: src/core/rules/conformance/source-file-linkage.ts
    narrative:
      - stepNumber: 1
        description: Index ctx.codeModel.files into factsByPath, keyed by ctx.codeModel.pathKey(facts.path)
        type: local
      - stepNumber: 2
        description: >-
          Collect degradedTsFiles: the analyzed files whose language is typescript or javascript and
          whose analysisGrade is not exact
        type: local
      - stepNumber: 3
        description: 'A silently degraded gate is worse than a degraded gate: surface it once per run'
        type: branch
        condition: degradedTsFiles is non-empty
        onFalseStep: 5
      - stepNumber: 4
        description: >-
          Report CONFORMANCE_DEGRADED (warning; run-wide: no spec id, no draft context) with the
          count of degradedTsFiles: structural findings carry their grade, but dependency
          conformance skips these files; install typescript in the analyzed project
        type: local
      - stepNumber: 5
        label: implLoop
        description: Check each implementation
        type: loop
        over: ctx.implementations
        endStep: 20
      - stepNumber: 6
        description: >-
          Resolve contract = ctx.interfaceMap.get(impl.contract), then component =
          ctx.componentMap.get(contract.component)
        type: local
      - stepNumber: 7
        description: >-
          Unresolvable implementations are skipped, and so are chained-subproject implementations
          (their sourcePaths are relative to the child root and the child validates them in its own
          run): continue with the next implementation
        type: branch
        condition: contract and component both resolve and !ctx.isInChainedSubproject(component.subsystem)
        onFalseStep: 5
      - stepNumber: 8
        description: >-
          draft = ctx.isImplementationDraft(impl). unlinked = the names of contract.methods whose
          source file is none: the entry of impl.methods with the same name gives
          methodImpl.sourceFile(impl.sourcePath), and a contract method with no entry falls back to
          impl.sourcePath. noFileAtAll = impl.sourceFiles() is empty
        type: local
      - stepNumber: 9
        description: >-
          An implementation-type external link is the external source-of-record wairon cannot
          analyze, so it suppresses the missing-path finding
        type: branch
        condition: >-
          (unlinked is non-empty or noFileAtAll) and no entry of component.externalLinks has type
          implementation
        onFalseStep: 11
      - stepNumber: 10
        description: >-
          Report MISSING_SOURCE_PATH (warning; spec impl.id; draft context from draft): when
          unlinked is non-empty, naming those contract methods of impl.contract as naming no source
          file of their own while the implementation declares no sourcePath; otherwise stating that
          the implementation names no source file at all
        type: local
      - stepNumber: 11
        label: fileLoop
        description: >-
          Check the status of each distinct file the implementation names; the existence check
          applies at every conformance tier
        type: loop
        over: impl.sourceFiles() (its own sourcePath, then each method's)
        endStep: 20
      - stepNumber: 12
        description: key = ctx.codeModel.pathKey(file); facts = factsByPath.get(key)
        type: local
      - stepNumber: 13
        description: >-
          Each distinct file is reported once, and only when the code model marks it escaped,
          missing or unreadable (no facts means no code model for the path): otherwise continue with
          the next file
        type: branch
        condition: >-
          key is not yet in reported (record it there now) and facts exist with a status other than
          analyzed
        onFalseStep: 11
      - stepNumber: 14
        description: >-
          owner = the implementation itself when impl.sourcePath normalizes to key; otherwise the
          names of impl.methods whose sourcePath normalizes to key, or the implementation itself
          when none does
        type: local
      - stepNumber: 15
        description: Dispatch on the file's status
        type: switch
        'on': facts.status
        cases:
          - value: escaped
            step: 16
          - value: missing
            step: 18
        defaultStep: 20
      - stepNumber: 16
        label: escapedReport
        description: >-
          Report SOURCE_PATH_ESCAPES_ROOT (error; spec impl.id; draft context from draft) naming
          owner and file: the sourcePath is absolute or escapes the project root
        type: local
      - stepNumber: 17
        description: Continue with the next file
        type: jump
        toStep: 11
      - stepNumber: 18
        label: missingReport
        description: >-
          Report MISSING_SOURCE_FILE (error; spec impl.id; draft context from draft) naming owner
          and file: the sourcePath does not resolve to a file
        type: local
      - stepNumber: 19
        description: Continue with the next file
        type: jump
        toStep: 11
      - stepNumber: 20
        label: skippedReport
        description: >-
          Report CONFORMANCE_ANALYSIS_SKIPPED (warning; spec impl.id; draft context from draft)
          naming owner and file: it could not be analyzed (binary or unreadable), so the methods in
          it were not checked
        type: local
    symbol: check
  - name: methodRealization
    sourcePath: src/core/rules/conformance/method-realization.ts
    narrative:
      - stepNumber: 1
        description: >-
          Index ctx.codeModel.files into lookups keyed by ctx.codeModel.pathKey(facts.path):
          declared = declaredNames plus exportedNames, anchored = declared plus anchoredNames, each
          kept with its facts
        type: local
      - stepNumber: 2
        label: implLoop
        description: Check each implementation
        type: loop
        over: ctx.implementations
        endStep: 11
      - stepNumber: 3
        description: >-
          Resolve contract = ctx.interfaceMap.get(impl.contract), then component =
          ctx.componentMap.get(contract.component)
        type: local
      - stepNumber: 4
        description: >-
          Unresolvable and chained-subproject implementations are skipped: continue with the next
          implementation
        type: branch
        condition: contract and component both resolve and !ctx.isInChainedSubproject(component.subsystem)
        onFalseStep: 2
      - stepNumber: 5
        description: >-
          draft = ctx.isImplementationDraft(impl); specTier = impl.conformance ??
          component.defaultConformanceTier()
        type: local
      - stepNumber: 6
        label: methodLoop
        description: Check that each contract method is realized in its own source file
        type: loop
        over: contract.methods
        endStep: 11
      - stepNumber: 7
        description: >-
          methodImpl = the entry of impl.methods carrying the method's name; tier =
          methodImpl.conformance ?? specTier; file = methodImpl.sourceFile(impl.sourcePath), else
          impl.sourcePath; lookup = lookups.get(ctx.codeModel.pathKey(file))
        type: local
      - stepNumber: 8
        description: >-
          Tier off, no file (source-file-linkage's MISSING_SOURCE_PATH covers it) or a file that is
          not analyzed (source-file-linkage's own finding covers it, and only the methods realized
          in it are blocked): continue with the next method
        type: branch
        condition: tier is not off, file is named, and lookup holds facts with status analyzed
        onFalseStep: 6
      - stepNumber: 9
        description: >-
          symbol = methodImpl.symbol ?? method.name; realized = lookup.declared holds symbol at tier
          declared, and lookup.declared or lookup.anchored holds it at any other tier
        type: local
      - stepNumber: 10
        description: A realized method continues with the next method
        type: branch
        condition: realized is false
        onFalseStep: 6
      - stepNumber: 11
        label: methodReport
        description: >-
          Report UNREALIZED_METHOD (warning; spec impl.id; draft context from draft) naming the
          method (with its symbol when one is mapped), impl.contract, file, tier and
          lookup.facts.analysisGrade; adds the weak-anchor hint when the tier is declared and only
          lookup.anchored holds symbol
        type: local
    symbol: check
  - name: findingRealization
    sourcePath: src/core/rules/conformance/finding-realization.ts
    narrative:
      - stepNumber: 1
        description: >-
          Index ctx.codeModel.files into lookups keyed by ctx.codeModel.pathKey(facts.path):
          findingAnchors = anchoredNames alone (string literals and property-access names at exact
          grade; the pattern grade adds every identifier outside comments, the generic grade every
          word), each kept with its facts
        type: local
      - stepNumber: 2
        label: implLoop
        description: Check each implementation
        type: loop
        over: ctx.implementations
        endStep: 11
      - stepNumber: 3
        description: >-
          Resolve contract = ctx.interfaceMap.get(impl.contract), then component =
          ctx.componentMap.get(contract.component)
        type: local
      - stepNumber: 4
        description: >-
          Unresolvable and chained-subproject implementations are skipped: continue with the next
          implementation
        type: branch
        condition: contract and component both resolve and !ctx.isInChainedSubproject(component.subsystem)
        onFalseStep: 2
      - stepNumber: 5
        description: >-
          draft = ctx.isImplementationDraft(impl); specTier = impl.conformance ??
          component.defaultConformanceTier()
        type: local
      - stepNumber: 6
        label: methodLoop
        description: Check the finding codes each contract method declares
        type: loop
        over: contract.methods
        endStep: 11
      - stepNumber: 7
        description: >-
          methodImpl = the entry of impl.methods carrying the method's name; tier =
          methodImpl.conformance ?? specTier; file = methodImpl.sourceFile(impl.sourcePath), else
          impl.sourcePath; lookup = lookups.get(ctx.codeModel.pathKey(file))
        type: local
      - stepNumber: 8
        description: >-
          A method declaring no findings is skipped, and so is one the dial turns off, one with no
          file, and one whose file is not analyzed (source-file-linkage reports that file once):
          continue with the next method
        type: branch
        condition: >-
          method.findings is non-empty, tier is not off, file is named, and lookup holds facts with
          status analyzed
        onFalseStep: 6
      - stepNumber: 9
        label: findingLoop
        description: Check each declared finding code
        type: loop
        over: method.findings
        endStep: 11
      - stepNumber: 10
        description: >-
          A code among the file's finding anchors (a string literal, or a property-access name at
          exact grade) continues with the next finding
        type: branch
        condition: lookup.findingAnchors lacks finding.code
        onFalseStep: 9
      - stepNumber: 11
        label: findingReport
        description: >-
          Report UNREALIZED_FINDING (warning; spec impl.id; draft context from draft) naming the
          method, impl.contract, finding.code, file and lookup.facts.analysisGrade: report the
          finding under its declared code, or remove the declaration
        type: local
    symbol: check
lint:
  allow:
    - code: NARRATIVE_COMPLEXITY
      reason: >-
        D2b splits the narratives this reports (callConformance, dependencyConformance and
        integrationConformance); the doctrine's own rules are the worst offenders and go first.
