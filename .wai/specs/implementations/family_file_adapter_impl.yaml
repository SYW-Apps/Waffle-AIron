id: family_file_adapter_impl
name: Family File Adapter Implementation
description: >-
  src/migrations/family-files.ts: node:fs over the live family's .wai trees. The Windows retry is
  one helper shared by replace, place and remove: up to 8 attempts, 25 ms doubling to 400 ms, only
  for EPERM, EBUSY and EACCES, and never for a read-only file (checked first, reported at once).
contract: ifamily_file_adapter
sourcePath: src/migrations/family-files.ts
methods:
  - name: mirror
    narrative: []
    detail: intent
    intent: >-
      For each scoped owner, refuses one that does not lie within the coordinator root, then copies
      its areas (its .wai tree by default, skipping .wai/transactions/ and following no link; the
      named files and directories when the scope names areas) and, for each owner the scope names
      whole, every file under it except .wai/transactions/, to the same relative path under the
      target, hashing the live bytes it read. Owners lying inside a whole owner are copied once, by
      the whole owner. Answers the digests by live absolute path. A read failure throws naming the
      file; the caller drops the half-made rehearsal.
  - name: compare
    narrative: []
    detail: intent
    intent: >-
      Walks every .wai directory in the rehearsal tree (or, for a scope that names areas, every
      copied owner's areas) and every whole owner's image, pairs files by path relative to the
      coordinator root, and emits a FileChange for each pair whose bytes differ (write), each
      rehearsal-only file (create) and each live-only file the mirror copied (delete). The owner is
      the directory holding the .wai — or the whole owner for a file under one — mapped back to its
      live path; baseDigest comes from the rehearsal's recorded digests, stagedDigest is hashed from
      the rehearsal bytes. A file present in both with equal bytes is not a change, so a writer that
      re-saved identically adds nothing.
  - name: read
    narrative: []
    detail: intent
    intent: Reads the file; null on ENOENT; any other error throws naming the file.
  - name: digest
    narrative: []
    detail: intent
    intent: Hashes the file's bytes with sha256 and answers `sha256:<hex>`; null on ENOENT.
  - name: replace
    narrative: []
    detail: intent
    intent: >-
      fs.renameSync(source, target) — on Windows a MoveFileEx with replace-existing, so readers see
      the old or the new file whole. On EPERM, EBUSY or EACCES retries with the bounded backoff; a
      target carrying the read-only attribute fails at once. Throws the last error with the file
      named.
  - name: place
    narrative: []
    detail: intent
    intent: >-
      Writes the bytes to `<path>.wairon-restore` in the same directory, fsyncs it, and renames it
      over the path with replace's retries; removes the temporary sibling when the rename fails.
  - name: remove
    narrative: []
    detail: intent
    intent: fs.unlinkSync with the bounded retries; ENOENT is success.
  - name: makeDirs
    narrative: []
    detail: intent
    intent: >-
      Walks up from the directory to the first existing ancestor, then creates the missing ones
      downward, answering them shallowest first.
  - name: prune
    narrative: []
    detail: intent
    intent: >-
      From the directory upward, removes each directory that is empty, stopping at the first
      non-empty one or at stopAt, answering the removed ones deepest first.
  - name: sameVolume
    narrative: []
    detail: intent
    intent: Compares fs.statSync(a).dev with fs.statSync(b).dev; a missing path answers false.
  - name: resolve
    narrative: []
    detail: intent
    intent: >-
      Refuses (null) an empty path, an absolute one on either platform, and one that does not lie
      strictly within the root lexically. Then follows links: walks up from the resolved directory
      to its nearest existing ancestor and answers the directory only when that ancestor's real path
      is the root's real path or lies within it, else null. Never throws for an absent directory: an
      absent one is judged by the ancestor that exists.
  - name: holdsProject
    narrative: []
    detail: intent
    intent: >-
      Answers whether <dir>/.wai/project.yaml exists; an absent directory answers false. Never
      throws.
  - name: move
    narrative: []
    detail: intent
    intent: >-
      Walks every file under the source (following no link), refuses when the target already holds a
      file at any of their paths, then for each creates the missing parent directories under the
      target and renames the file there with replace's bounded retries; finally prunes the emptied
      directories below the source, the source included. Throws the first failure naming the file.
status: complete
