id: host_server_impl
name: Host Server Implementation
description: >-
  HTTP listener lifecycle for the data-plane and admin-plane portals, with control-plane exposure
  gating resolved from HostExposurePolicy.
contract: ihost_server
sourcePath: src/server/http.ts
methods:
  - name: start
    narrative:
      - stepNumber: 1
        description: >-
          Resolve bind and auth configuration; refuse to start without an auth file unless --no-auth
          is set
        type: local
      - stepNumber: 2
        description: >-
          Resolve the effective HostExposurePolicy from HostConfig.exposurePolicy, applying the
          secure default posture when it is unset
        type: local
      - stepNumber: 3
        description: Bind the data-plane listener and route /mcp, /healthz, /readyz to the host HTTP portal
        type: local
      - stepNumber: 4
        description: >-
          Bind the admin-plane listener (separate, loopback-by-default bind); then, when
          adminApiMode is not 'disabled', mount the control-plane routers on it per the resolved
          exposure policy: the existing admin API (/admin/*), and — each only when its exposure flag
          enables it — the identity/audit API, the project-policy API (/projects and /instance), the
          landscape API, the operations API (/operations/*), the approvals API, and the optional
          browser admin UI; a surface whose flag is disabled is not mounted and answers
          404/disabled. When adminApiMode is 'disabled', no control-plane router is mounted.
        type: local
      - stepNumber: 5
        description: Begin accepting connections on both listeners
        type: local
      - stepNumber: 6
        description: >-
          Schedule the periodic git-backup timer: at each interval run the pre-authorized
          .wai/-scoped backup sweep over the git-bound projects (skip-if-clean — a quiet project
          never commits noise)
        type: call
        targetComponent: admin_orchestrator
        targetMethod: runPeriodicGitSync
      - stepNumber: 7
        description: >-
          The same timer also sweeps the container-level backup bindings (unit container repos + the
          instance-structure backup repo) whose interval has elapsed
        type: call
        targetComponent: git_backing_orchestrator
        targetMethod: runPeriodicBackingSync
      - stepNumber: 8
        description: Return the running server handle
        type: return
        outcome: running
    symbol: startHostServer
  - name: stop
    narrative:
      - stepNumber: 1
        description: Cancel the periodic git-backup timer
        type: local
      - stepNumber: 2
        description: Stop accepting new connections and drain in-flight requests
        type: local
      - stepNumber: 3
        description: Close the data-plane and admin-plane listeners
        type: local
      - stepNumber: 4
        description: Return once stopped
        type: return
        outcome: stopped
    conformance: anchored
    symbol: close
  - name: init
    narrative:
      - stepNumber: 1
        description: >-
          Seed-or-load the boot-reserved built-in subject UUIDs (first boot generates and persists
          them to instance.json; later boots return the record unchanged)
        type: call
        targetComponent: instance_identity_repository
        targetMethod: ensureSeeded
        assertsGuarantees:
          - idempotent
      - stepNumber: 2
        description: If devMode is not enabled, skip the synthetic local development unit
        type: branch
        condition: config.devMode is enabled
        onTrueStep: 3
        onFalseStep: 6
      - stepNumber: 3
        description: Look up the synthetic local development unit
        type: call
        targetComponent: organization_repository
        targetMethod: getUnit
      - stepNumber: 4
        description: If the synthetic local development unit already exists, skip creation
        type: branch
        condition: the synthetic local development unit already exists
        onTrueStep: 6
        onFalseStep: 5
      - stepNumber: 5
        description: >-
          Create the synthetic local development unit so dev projects can always be placed (unitId
          is required at creation)
        type: call
        targetComponent: organization_repository
        targetMethod: createUnit
      - stepNumber: 6
        description: Return once the instance is initialized
        type: return
        outcome: initialized
    detail: full
status: complete
