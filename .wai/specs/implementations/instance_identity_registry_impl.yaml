id: instance_identity_registry_impl
name: Instance Identity Registry Implementation
description: >-
  Create-once write path for the singleton InstanceIdentity persisted atomically to instance.json
  under the hosted data root. The create-once decision is made INSIDE one store update, under the
  file's write lock, so two processes seeding at once cannot write different identities.
contract: iinstance_identity_registry
sourcePath: src/server/instance.ts
methods:
  - name: seed
    narrative: []
    intent: >-
      In one store update: when the record read under the lock already holds an identity, return it
      unchanged (idempotent - ids are never regenerated or rotated). Otherwise generate
      cryptographically random UUIDs (crypto.randomUUID) for the built-in super-admin and
      local-developer subjects, stamp createdAt from the supplied timestamp, and write that as the
      record; return it. Fails by throwing on an unwritable data root; it never partially seeds.
    calls:
      - instance_identity_store.update
detail: intent
status: complete
