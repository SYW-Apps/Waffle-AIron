id: mcp_migration_orchestrator_impl
name: MCP Migration Orchestrator Implementation
description: src/mcp/migrations.ts.
contract: imcp_migration_orchestrator
sourcePath: src/mcp/migrations.ts
methods:
  - name: run
    narrative:
      - stepNumber: 1
        description: >-
          Plan the request from the bound project, asking it to announce the findings its result
          will have (announce: true): the answer's notes name them, the dry run's and the applied
          one's alike
        type: call
        targetComponent: mcp_migration_adapter
        targetMethod: plan
      - stepNumber: 2
        description: Dry run, refused or empty?
        type: branch
        condition: dryRun is true, or the plan is blocked, or it has no file change
        onFalseStep: 5
      - stepNumber: 3
        description: Drop the plan's rehearsal
        type: call
        targetComponent: mcp_migration_adapter
        targetMethod: discard
      - stepNumber: 4
        description: >-
          Answer the plan, applied false; a refused plan is answered as a tool error carrying it, so
          an agent cannot read it as success
        type: return
        outcome: the plan, not applied
      - stepNumber: 5
        label: apply
        description: Apply the plan, all or nothing
        type: call
        targetComponent: mcp_migration_adapter
        targetMethod: apply
      - stepNumber: 6
        description: >-
          Did the applied migration make a project (a promote, or an externalize as project), whose
          folder now holds a configuration?
        type: branch
        condition: the report is applied, the request made a project, and its folder holds .wai/project.yaml
        onFalseStep: 11
      - stepNumber: 7
        description: Under the new project's binding, read its configuration for the targets it enables
        type: call
        targetComponent: mcp_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 8
        description: Write its project-local guides and root pointer for those targets
        type: call
        targetComponent: mcp_core_adapter
        targetMethod: reinjectLocalGuides
      - stepNumber: 9
        description: Export the SDD skills into it
        type: call
        targetComponent: mcp_skills_adapter
        targetMethod: exportSddSkills
      - stepNumber: 10
        description: >-
          When claude is one of its targets, register the wairon server in its portable .mcp.json
          (an existing registration is kept); record every file written as the report's session
          scaffold. A failure here is said in the answer with the commands to run there, never
          fatal: the migration already committed
        type: call
        targetComponent: mcp_core_adapter
        targetMethod: registerProjectServer
      - stepNumber: 11
        label: answer
        description: >-
          Answer the report as structured content: applied with the projects to re-lock — and, when
          it made a new project, the folder it lives in and the session scaffold written there, so a
          team's own session can open it — or the failure (a tool error) and whether the family was
          restored
        type: return
        outcome: FamilyMigrationReport
  - name: pending
    narrative:
      - stepNumber: 1
        description: >-
          Ask the migration portal for the unfinished transactions under the bound root, fix false —
          a report, nothing written
        type: call
        targetComponent: mcp_migration_adapter
        targetMethod: recover
      - stepNumber: 2
        description: >-
          Answer one notice line per transaction: its id, verb and coordinator phase, and `run
          wairon doctor --fix`
        type: return
        outcome: notice lines
status: complete
createdAt: '2026-09-30T20:39:33.686Z'
updatedAt: '2026-10-08T20:19:44.112Z'
