id: boundary_migration_impl
name: Boundary Migration Implementation
description: >-
  src/migrations/boundary.ts. The parent-scoped move is sdd_core's; this adds the family's other
  projects around it.
contract: iboundary_migration
sourcePath: src/migrations/boundary.ts
methods:
  - name: planInternalize
    narrative:
      - stepNumber: 1
        description: >-
          Find the member under the alias in the bound node: none is not-a-member, its directory
          absent is member-absent. A PART (stage 8) is planned as a storage move alone and answered
          here: a part fetched from git is read-only, one that cannot be read member-absent, one
          stored outside the family root not-contained; otherwise the core's internalize (its
          subsystems moved in, the member entry and what remains of its .wai removed) and nothing
          else
        type: local
      - stepNumber: 2
        description: Is there a member to fold in?
        type: branch
        condition: a refusal was recorded
        onFalseStep: 4
      - stepNumber: 3
        description: Answer the refusals
        type: return
        outcome: refused plan
      - stepNumber: 4
        label: consumers
        description: >-
          From the graph's cross-project references, collect every family project other than the
          bound one that consumes the member (the member's own members included), each with the
          public names it uses; one out of reach is family-partial
        type: local
      - stepNumber: 5
        description: Read the member's resolved export table
        type: call
        targetComponent: migration_core_adapter
        targetMethod: resolveProjectExports
      - stepNumber: 6
        description: Read the bound project's resolved export table
        type: call
        targetComponent: migration_core_adapter
        targetMethod: resolveProjectExports
      - stepNumber: 7
        description: >-
          Complete the destination's exports with every public name a consumer uses; a name the
          bound project already exports for another target is name-collision
        type: local
      - stepNumber: 8
        description: >-
          With the member bound, read its configuration for the externals the bound project will
          carry (to pin there); restore the binding
        type: call
        targetComponent: migration_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 9
        description: >-
          Plan each consumer's edits: one that already declares an alias for the bound project gets
          its `member::name` references respelled to that alias at their positions (from the graph's
          authoredReferences), the member alias's `use` merged into it, and the member external and
          pin removed; any other gets its external repointed at the bound project's id (a source
          path re-expressed) and re-pinned, with a note that the pin will read drifted. Plan the
          core's internalize with the completed destination, and the carried externals pinned in the
          bound project
        type: local
      - stepNumber: 10
        description: Answer the plan
        type: return
        outcome: the internalize plan
  - name: planExternalize
    narrative:
      - stepNumber: 1
        description: >-
          Resolve the new member's path from the bound project's directory under the containment
          guard, lexically and through links, through the family file adapter (a planner touches no
          file itself)
        type: call
        targetComponent: family_file_adapter
        targetMethod: resolve
      - stepNumber: 2
        description: Ask whether that directory already holds a project
        type: call
        targetComponent: family_file_adapter
        targetMethod: holdsProject
      - stepNumber: 3
        description: >-
          Judge the request against the bound node: no such subsystem, one already in a part or a
          member, or an `as` other than part or project is externalize-refused; a path not strictly
          within the bound project or already holding a project is not-contained; the subsystem id
          already an alias is alias-taken (unless the path is an existing part's, which the
          subsystem joins); as a project, the id already a family project's is id-collision. As a
          PART (the default) a storage move needs nothing more: plan the core's externalize alone
          and answer it
        type: local
      - stepNumber: 4
        description: Is the externalize possible so far?
        type: branch
        condition: a refusal was recorded
        onFalseStep: 6
      - stepNumber: 5
        description: Answer the refusals
        type: return
        outcome: refused plan
      - stepNumber: 6
        label: crossing
        description: Read the bound project's resolved export table
        type: call
        targetComponent: migration_core_adapter
        targetMethod: resolveProjectExports
      - stepNumber: 7
        description: >-
          From the graph, find each reference of the moved subtree back into the bound project at a
          component whose subsystem does not publish it: externalize-refused, naming it — publishing
          is a design decision to make first
        type: local
      - stepNumber: 8
        description: >-
          Check every other family project consuming the bound project: each public name it uses
          that the moved subsystem realizes must stay exported through the bound project's
          re-pointed re-exports; one that would not is externalize-refused. Nothing is planned for
          them: the names they use do not move (externalize-updates-siblings)
        type: local
      - stepNumber: 9
        description: >-
          As a project: under each family project that pins the bound project, read its externals'
          status; a pin whose every use is unchanged is re-pinned after the move, one already broken
          is left with a note
        type: call
        targetComponent: migration_surfaces_adapter
        targetMethod: getExternalsStatus
      - stepNumber: 10
        description: >-
          Plan the core's externalize, the new member's external for the bound project pinned in the
          member, and the re-pin of each family consumer read intact. The references the move
          respells are listed when the plan is rehearsed, from what the core answers
        type: local
      - stepNumber: 11
        description: Answer the plan
        type: return
        outcome: the externalize plan
  - name: write
    narrative:
      - stepNumber: 1
        description: Remember the caller's binding; every path below restores it
        type: local
      - stepNumber: 2
        description: Which verb?
        type: branch
        condition: plan.request.verb is internalize
        onFalseStep: 11
      - stepNumber: 3
        description: >-
          Bind the rehearsal's top root and respell each consumer's planned references, while the
          member's keys still exist
        type: call
        targetComponent: migration_core_adapter
        targetMethod: rewriteReferences
      - stepNumber: 4
        description: >-
          Bind the bound project's rehearsal root and fold the member in with the completed
          destination; a core refusal propagates
        type: call
        targetComponent: migration_core_adapter
        targetMethod: internalizeMember
      - stepNumber: 5
        description: >-
          For each consumer that already had an alias for the bound project, bind its rehearsal root
          and merge the member alias's `use` into it
        type: call
        targetComponent: migration_core_adapter
        targetMethod: importNames
      - stepNumber: 6
        description: Remove that consumer's pin of the member alias
        type: call
        targetComponent: migration_surfaces_adapter
        targetMethod: unpin
      - stepNumber: 7
        description: Remove that consumer's member external
        type: call
        targetComponent: migration_core_adapter
        targetMethod: removeExternal
      - stepNumber: 8
        description: >-
          For each other consumer, bind its rehearsal root and repoint its external at the bound
          project's id
        type: call
        targetComponent: migration_core_adapter
        targetMethod: repointExternal
      - stepNumber: 9
        description: >-
          Last, pin what changed producer: each repointed consumer's external under its binding, and
          the carried externals under the bound project's
        type: call
        targetComponent: migration_surfaces_adapter
        targetMethod: pinExternals
      - stepNumber: 10
        description: Internalize written
        type: jump
        toStep: 21
      - stepNumber: 11
        description: Externalize, or a composition verb?
        type: branch
        condition: plan.request.verb is externalize
        onFalseStep: 15
      - stepNumber: 12
        label: externalize
        description: >-
          Bind the bound project's rehearsal root and externalize the subsystem — into a part, or
          with `as: project` into a member project; a core refusal propagates. As a project, record
          what the core answers — each respelled reference, export, import and dropped consumers
          entry — as the plan's edits, so the plan lists exactly what the rehearsal wrote
        type: call
        targetComponent: migration_core_adapter
        targetMethod: externalizeSubsystem
      - stepNumber: 13
        description: >-
          For an externalize as project, bind the new member's rehearsal root and pin its external
          for the bound project, then re-pin each family consumer the plan read intact; a part needs
          no pin
        type: call
        targetComponent: migration_surfaces_adapter
        targetMethod: pinExternals
      - stepNumber: 14
        description: Externalize written
        type: jump
        toStep: 21
      - stepNumber: 15
        label: promote-or-demote
        description: Promote or demote?
        type: branch
        condition: plan.request.verb is promote
        onFalseStep: 19
      - stepNumber: 16
        description: >-
          Bind the bound project's rehearsal root and promote the part in place; a core refusal
          propagates. Record what the core answers — each respelled reference, export, import and
          dropped consumers entry — as the plan's edits, so the plan lists exactly what the
          rehearsal wrote
        type: call
        targetComponent: migration_core_adapter
        targetMethod: promoteMember
      - stepNumber: 17
        description: >-
          Pin LAST, on both sides: the new project's external for the bound project under its
          binding, the bound project's pin of the new member under its own, and each family consumer
          the plan read intact re-pinned under its own
        type: call
        targetComponent: migration_surfaces_adapter
        targetMethod: pinExternals
      - stepNumber: 18
        description: Promote written
        type: jump
        toStep: 21
      - stepNumber: 19
        label: demote
        description: >-
          Bind the bound project's rehearsal root and demote the member in place with the plan's
          destination; a core refusal propagates
        type: call
        targetComponent: migration_core_adapter
        targetMethod: demoteMember
      - stepNumber: 20
        description: >-
          Remove the bound project's pin of the member: a part is not pinned, its specs are the
          project's own
        type: call
        targetComponent: migration_surfaces_adapter
        targetMethod: unpin
      - stepNumber: 21
        label: restore
        description: Restore the caller's binding
        type: local
  - name: planPromote
    narrative:
      - stepNumber: 1
        description: >-
          Find the part under the alias in the bound node (none is not-a-part); refuse a part whose
          storage is git (read-only: promote it in a checkout of its repository)
        type: local
      - stepNumber: 2
        description: Read the bound project's resolved export table, for what other family projects use of it
        type: call
        targetComponent: migration_core_adapter
        targetMethod: resolveProjectExports
      - stepNumber: 3
        description: >-
          From the graph, collect what crosses the would-be boundary: each reference between the
          part's specs and the rest of the bound project, with the component's subsystem export (one
          not published is externalize-refused), and each trustedLink joining a part subsystem and
          another (trusted-link-crosses); the new id against every family project's id and the bound
          project's aliases (id-collision, alias-taken); every other family project's used names
          realized in the part, which must stay exported through the re-pointed re-exports
          (externalize-updates-siblings)
        type: local
      - stepNumber: 4
        description: Can it be promoted?
        type: branch
        condition: a refusal was recorded
        onFalseStep: 6
      - stepNumber: 5
        description: Answer the refusals
        type: return
        outcome: refused plan
      - stepNumber: 6
        description: >-
          Under each family project that pins the bound project, read its externals' status: a pin
          whose every use is unchanged is re-pinned after the promote (its names only moved
          location, which re-pinning alone answers); one already broken is left as it is, with a
          note, so a migration never launders a real incompatibility
        type: call
        targetComponent: migration_surfaces_adapter
        targetMethod: getExternalsStatus
      - stepNumber: 7
        description: >-
          Plan the core's promote with the id, then the pins: the new project's external for the
          bound project, the bound project's pin of the new member when it is stored outside, and
          the re-pin of each family consumer read intact; for a part in a sibling checkout, note
          that files are all-or-nothing and commits one per repository; the bound project to re-lock
          and the new project to lock for the first time. The references the promote respells are
          listed when the plan is rehearsed, from what the core answers
        type: local
      - stepNumber: 8
        description: Answer the plan
        type: return
        outcome: the promote plan
    detail: full
  - name: planDemote
    narrative:
      - stepNumber: 1
        description: >-
          Find the project member under the alias in the bound node (none is not-a-member; a part is
          already one); refuse a member whose storage is git (read-only)
        type: local
      - stepNumber: 2
        description: >-
          From the graph's cross-project references, collect every family project OTHER than the
          bound one that consumes the member, each with the public names it uses: any is
          consumed-elsewhere (a part has no exports), listed
        type: local
      - stepNumber: 3
        description: >-
          With the member bound, read its configuration for the externals, members and packs the
          destination must place; restore the binding
        type: call
        targetComponent: migration_core_adapter
        targetMethod: loadProjectConfig
      - stepNumber: 4
        description: Can it be demoted?
        type: branch
        condition: a refusal was recorded
        onFalseStep: 6
      - stepNumber: 5
        description: Answer the refusals
        type: return
        outcome: refused plan
      - stepNumber: 6
        description: >-
          Plan the core's demote with the destination; name, as an edit each for confirmation, every
          L0 export entry of the bound project the demote removes (audience project, naming a target
          only the member used — read from the member's references back into the bound project and
          the bound project's export table — hand-written ones included); plan the removal of the
          bound project's pin of the member; for a member in a sibling checkout, note that files are
          all-or-nothing and commits one per repository; the bound project to re-lock, the member's
          lock listed as ended
        type: local
      - stepNumber: 7
        description: Answer the plan
        type: return
        outcome: the demote plan
    detail: full
  - name: plan
    narrative:
      - stepNumber: 1
        description: Route by verb
        type: switch
        'on': request.verb
        cases:
          - value: internalize
            step: 2
          - value: externalize
            step: 4
          - value: promote
            step: 6
          - value: demote
            step: 8
      - stepNumber: 2
        label: internalize
        description: Plan the internalize
        type: call
        targetComponent: boundary_migration
        targetMethod: planInternalize
      - stepNumber: 3
        description: Planned
        type: jump
        toStep: 9
      - stepNumber: 4
        label: externalize
        description: Plan the externalize
        type: call
        targetComponent: boundary_migration
        targetMethod: planExternalize
      - stepNumber: 5
        description: Planned
        type: jump
        toStep: 9
      - stepNumber: 6
        label: promote
        description: Plan the promote
        type: call
        targetComponent: boundary_migration
        targetMethod: planPromote
      - stepNumber: 7
        description: Planned
        type: jump
        toStep: 9
      - stepNumber: 8
        label: demote
        description: Plan the demote
        type: call
        targetComponent: boundary_migration
        targetMethod: planDemote
      - stepNumber: 9
        label: planned
        description: Answer the verb's plan
        type: return
        outcome: MigrationPlan
    detail: full
status: complete
