id: surface_exchange_orchestrator_impl
name: Surface Exchange Orchestrator Implementation
description: >-
  Consumer-facing surface-exchange workflows: reachability and visibility discovery, contract-grade
  consumer fetch (visibility-gated with the legacy relations-only fallback), and operator artifact
  export. Realized in src/server/landscape.ts alongside the administration orchestrator — the split
  is a responsibility split, not a file split.
contract: isurface_exchange_orchestrator
sourcePath: src/server/landscape.ts
methods:
  - name: listReachableProjectsForMcp
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential through the single auth authority
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: List the ACTIVE cross-project relations whose sourceProjectId is currentProjectId
        type: call
        targetComponent: project_relation_repository
        targetMethod: list
      - stepNumber: 3
        description: >-
          Group the active relations by targetProjectId and map each group to a ReachableProjectRef
          (target id, relation ids, kinds, target public interface ids). Reachability is directional
          and relations-only.
        type: local
      - stepNumber: 4
        description: Return the reachable project references
        type: return
        outcome: the reachable project references
  - name: listReachableProjectInterfacesForMcp
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential through the single auth authority
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: List the ACTIVE cross-project relations whose sourceProjectId is currentProjectId
        type: call
        targetComponent: project_relation_repository
        targetMethod: list
      - stepNumber: 3
        description: If no active relation from the current project targets targetProjectId, deny
        type: branch
        condition: no active relation from the current project targets targetProjectId
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the interface discovery for an unreachable target
        type: throw
        error: >-
          Forbidden — the target project is not reachable from the current project through an active
          relation
      - stepNumber: 5
        description: Load the target project's stored public-surface snapshot
        type: call
        targetComponent: public_surface_repository
        targetMethod: getSnapshot
      - stepNumber: 6
        description: If the target project has no stored snapshot, it exposes no public surface
        type: branch
        condition: the target project has no stored public-surface snapshot
        onFalseStep: 8
      - stepNumber: 7
        description: Return an empty list — private by default
        type: return
        outcome: empty list
      - stepNumber: 8
        description: Gather all organization units for audience-distance classification
        type: call
        targetComponent: organization_repository
        targetMethod: listUnits
      - stepNumber: 9
        description: Gather all project placements
        type: call
        targetComponent: organization_repository
        targetMethod: listPlacements
      - stepNumber: 10
        description: Resolve the current project's visibility view over the unit graph
        type: call
        targetComponent: visibility_specialist
        targetMethod: resolveVisibility
      - stepNumber: 11
        description: >-
          Classify the observer→target audience distance (an invisible target classifies as the
          farthest class; a unit-less instance keeps all entries)
        type: call
        targetComponent: visibility_specialist
        targetMethod: audienceDistance
      - stepNumber: 12
        description: >-
          Return only the redacted PublicInterfaceSummary entries whose declared audience ceiling
          covers the observer's distance
        type: return
        outcome: the audience-filtered redacted public interface summaries
  - name: listVisibleSurfaces
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential through the single auth authority
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Gather all organization units (postures + exposeTo grants)
        type: call
        targetComponent: organization_repository
        targetMethod: listUnits
      - stepNumber: 3
        description: Gather all project placements
        type: call
        targetComponent: organization_repository
        targetMethod: listPlacements
      - stepNumber: 4
        description: Resolve the observer project's visibility view over the unit graph
        type: call
        targetComponent: visibility_specialist
        targetMethod: resolveVisibility
      - stepNumber: 5
        description: For each visible target project in the resolution
        type: loop
        loopKind: forEach
        over: the resolution's visible projects
        endStep: 8
      - stepNumber: 6
        description: >-
          Fetch the target's stored public-surface snapshot (a target without one contributes an
          empty entry — private by default)
        type: call
        targetComponent: public_surface_repository
        targetMethod: getSnapshot
      - stepNumber: 7
        description: Classify the observer→target audience distance
        type: call
        targetComponent: visibility_specialist
        targetMethod: audienceDistance
      - stepNumber: 8
        description: >-
          Keep only the redacted summaries whose audience ceiling covers the distance and collect
          the VisibleSurfaceEntry
        type: local
      - stepNumber: 9
        description: Return the visibility-resolved surface catalog
        type: return
        outcome: VisibleSurfaceEntry[]
  - name: getProjectSurfaceForMcp
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential through the single auth authority
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: Gather all organization units
        type: call
        targetComponent: organization_repository
        targetMethod: listUnits
      - stepNumber: 3
        description: The instance defines organization units (visibility semantics active)
        type: branch
        condition: at least one organization unit exists
        onTrueStep: 7
        onFalseStep: 4
      - stepNumber: 4
        description: 'Legacy posture: list the ACTIVE relations from the current project'
        type: call
        targetComponent: project_relation_repository
        targetMethod: list
      - stepNumber: 5
        description: An active relation covers the target (ceiling = instance)
        type: branch
        condition: an ACTIVE relation whose sourceProjectId is the current project targets the target project
        onTrueStep: 12
        onFalseStep: 6
      - stepNumber: 6
        description: Reject the unreachable target
        type: throw
        error: >-
          Forbidden — the target project is not reachable from the current project through an active
          relation
      - stepNumber: 7
        description: Gather all project placements
        type: call
        targetComponent: organization_repository
        targetMethod: listPlacements
      - stepNumber: 8
        description: Resolve the current project's visibility view over the unit graph
        type: call
        targetComponent: visibility_specialist
        targetMethod: resolveVisibility
      - stepNumber: 9
        description: >-
          Classify the observer→target audience distance — it becomes the ceiling of the generated
          snapshot
        type: call
        targetComponent: visibility_specialist
        targetMethod: audienceDistance
      - stepNumber: 10
        description: The target is not visible to the current project (distance is null)
        type: branch
        condition: the distance is null (target not visible through the unit graph)
        onTrueStep: 11
        onFalseStep: 12
      - stepNumber: 11
        description: Reject the invisible target
        type: throw
        error: >-
          Forbidden — the target project's surface is not exposed to the current project's
          organization units
      - stepNumber: 12
        description: >-
          Locate the target project's record and root server-side — trusted intermediary; the caller
          never reads the target tree directly
        type: local
      - stepNumber: 13
        description: >-
          Generate the target's contract-grade snapshot at the resolved audience ceiling against the
          target's bound root
        type: call
        targetComponent: host_surfaces_adapter
        targetMethod: exportBoundSurface
      - stepNumber: 14
        description: Stamp the snapshot origin exchanged for the consumer's import
        type: local
      - stepNumber: 15
        description: Return the exchanged contract-grade snapshot
        type: return
        outcome: SurfaceSnapshot (origin exchanged)
  - name: exportProjectSurface
    narrative:
      - stepNumber: 1
        description: Authenticate the caller credential
        type: call
        targetComponent: auth_specialist
        targetMethod: authenticateCredential
      - stepNumber: 2
        description: >-
          Resolve the caller's project:admin permission over the target project (an instance-admin
          bypasses to yes)
        type: call
        targetComponent: authorization_specialist
        targetMethod: authorize
      - stepNumber: 3
        description: If the effective value is not yes, deny
        type: branch
        condition: the effective project:admin value is not yes
        onTrueStep: 4
        onFalseStep: 5
      - stepNumber: 4
        description: Reject the surface export
        type: throw
        error: Forbidden — exporting a project's surface artifact requires project:admin over the project
      - stepNumber: 5
        description: Resolve and bind the target project's isolated root within the principal's authorized set
        type: call
        targetComponent: project_registry
        targetMethod: resolveRoot
      - stepNumber: 6
        description: >-
          Generate the audience-filtered surface artifact for the bound project (native snapshot or
          rendered OpenAPI)
        type: call
        targetComponent: host_surfaces_adapter
        targetMethod: exportBoundSurface
      - stepNumber: 7
        description: Return the typed downloadable artifact (body, content type, filename)
        type: return
        outcome: SurfaceArtifact
    detail: full
status: complete
