id: share_snapshots_impl
name: Share Snapshots Implementation
description: Freezes a project view into an immutable snapshot payload set via the core + surfaces adapters.
contract: ishare_snapshots
sourcePath: src/server/sharesnapshots.ts
methods:
  - name: capture
    narrative:
      - stepNumber: 1
        description: Start an empty snapshot payload set stamped with the project id, view, and capture time.
        type: local
      - stepNumber: 2
        description: >-
          Read the family's relation health as it is now, within the creator's reach, through the
          host validator adapter — frozen into the snapshot with its compared-at time, never
          refreshed behind the link
        type: call
        targetComponent: host_validator_adapter
        targetMethod: familyRelations
      - stepNumber: 3
        description: >-
          Build the bound project's canvas model as data — the payload the shared engine renders —
          with those relations on its consumption edges
        type: call
        targetComponent: host_core_adapter
        targetMethod: buildCanvasDataModel
      - stepNumber: 4
        description: An HTML export was requested for this link.
        type: branch
        condition: artifacts includes 'html'
        onFalseStep: 6
      - stepNumber: 5
        description: Render the standalone self-contained HTML export payload, with the same relations
        type: call
        targetComponent: host_core_adapter
        targetMethod: renderDiagram
      - stepNumber: 6
        description: An OpenAPI document was requested for this link.
        type: branch
        condition: artifacts includes 'openapi'
        onFalseStep: 8
      - stepNumber: 7
        description: >-
          Project EVERY per-portal OpenAPI document at the shared audience ceiling (the project
          ceiling — all published portals, so the captured APIs match the shared canvas) and store
          the whole set on the snapshot; the single-document field is filled only when exactly one
          portal exists. Never collapse several portals to one document or to an empty placeholder.
        type: call
        targetComponent: host_surfaces_adapter
        targetMethod: exportSurface
      - stepNumber: 8
        description: The immutable snapshot payload set, ready to persist.
        type: return
        outcome: snapshot
    symbol: captureSnapshot
status: complete
createdAt: '2026-07-18T09:30:49.067Z'
updatedAt: '2026-10-03T12:17:03.359Z'
