kind: value-object
id: design_export_entry
name: DesignExportEntry
description: >-
  One entry of a resolved export table (L0 for the project, L1 for a subsystem): a public name bound
  to the canonical target its re-export chain ends at.
subsystem: sdd_surfaces
fields:
  - name: publicName
    type: string
    description: The name a consumer uses (`alias::publicName` from another project)
    optional: false
  - name: targetKind
    type: string
    description: component, interface or type
    optional: false
  - name: target
    type: string
    description: The key of the canonical target in this document
    optional: false
  - name: audience
    type: SurfaceAudience
    description: The exposure ceiling (L0 entries)
    optional: true
  - name: version
    type: string
    optional: true
  - name: stability
    type: string
    optional: true
  - name: type
    type: string
    description: >-
      The entry's export kind (REST, GraphQL, MessageBus, RPC or Custom), derived from the backing
      Portal's transport (transport.exportKind); absent for a type export
    optional: true
  - name: role
    type: string
    description: >-
      What consumers do with the entry: implement for an extension point; absent for call, the
      default
    optional: true
methods: []
sourcePath: src/models/design-export.ts
createdAt: '2026-10-04T13:52:52.929Z'
updatedAt: '2026-10-06T18:15:10.698Z'
