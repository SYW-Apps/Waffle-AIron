kind: value-object
id: planned_member_kind
name: PlannedMemberKind
description: >-
  One stage-8 member-kind repair the chaining migration plans: `as: project` written onto a member
  read as a project by inference, or PartOf written into a part that lacks one. Neither changes what
  the member is — it records what the scan already reads (existing-members-unchanged).
subsystem: sdd_migrations
fields:
  - name: owner
    type: string
    description: >-
      The key of the project whose file is written: the declaring project for `as`, the part's
      declaring project for PartOf (the part's own configuration is written under its directory).
    optional: false
  - name: alias
    type: string
    description: The member's alias in its declaring project.
    optional: false
    key: primary
  - name: write
    type: string
    description: 'as-project | part-of: which repair.'
    optional: false
  - name: partOf
    type: PartOf
    description: 'For part-of: the PartOf to write.'
    optional: true
methods: []
sourcePath: src/migrations/position-migration.ts
createdAt: '2026-10-02T20:38:05.665Z'
updatedAt: '2026-10-02T20:38:05.666Z'
