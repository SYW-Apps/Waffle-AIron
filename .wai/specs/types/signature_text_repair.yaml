kind: value-object
id: signature_text_repair
name: SignatureTextRepair
description: >-
  One spec the doctor's signature repair rewrites into its stored form: the methods whose stored
  text it regenerates from their params, and the sourced methods whose restated params and returns —
  equal to the source's — it drops. A sourced method restating DIFFERENT ones is never repaired:
  only its author knows which contract was meant, and SIGNATURE_SOURCE_RESTATED keeps reporting it.
subsystem: sdd_core
fields:
  - name: specId
    type: string
    description: The interface or type the repair rewrites
    optional: false
  - name: kind
    type: TypedSpecKind
    description: The kind of the spec holding it.
    optional: false
  - name: regenerated
    type: list<StaleSignatureText>
    description: Each method whose stored text is replaced by its derived text
    optional: false
  - name: dropped
    type: list<string>
    description: Each sourced method whose restated params and returns are dropped
    optional: false
methods: []
sourcePath: src/core/signature-repair.ts
createdAt: '2026-10-03T19:31:33.599Z'
updatedAt: '2026-10-04T23:40:38.243Z'
