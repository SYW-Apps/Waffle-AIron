kind: value-object
id: rule_ext
name: RuleExt
description: >-
  The extension-pack data merged into validation and exposed on the RuleContext: pack-registered
  profiles, language/platform tables, reusable pattern definitions, and declared guarantee tokens.
  Rules merge these over their built-in tables and resolve spec references against them.
fields:
  - name: profiles
    type: ProfileDef[]
    description: Pack-registered profiles, keyed by profile id.
    optional: false
  - name: languages
    type: LanguagePackDef[]
    description: Pack-registered language/platform tables, keyed by normalized language.
    optional: false
  - name: patterns
    type: PatternDef[]
    description: Pack-registered reusable pattern definitions, resolvable by PatternRef.
    optional: false
  - name: guarantees
    type: string[]
    description: >-
      Pack-declared guarantee tokens; the guarantee-token rule unions these with the builtin
      SEMANTIC_GUARANTEES set to form the accepted vocabulary.
    optional: false
  - name: assertions
    type: PackAssertion[]
    description: >-
      Loaded declarative assertions the declarative-assertions rule evaluates; their namespaced
      codes join the known-issue-code set so lint.allow and severity overrides treat them like
      builtins.
    optional: false
  - name: packSelections
    type: PackSelection[]
    description: >-
      The project's by-name pack selections (legacy path references excluded), which the
      pack-reproducibility rule checks for a version or integrity pin
    optional: false
  - name: selectionFailures
    type: PackSelectionFailure[]
    description: >-
      Declared selections the extension loader could not resolve, each carrying the code the
      pack-resolution rule reports it under
    optional: false
  - name: packRequirements
    type: PackRequirement[]
    description: >-
      The bound project's OWN composition.requirePolicies (project_config.requiredPolicies), which
      the pack-requirements rule checks for a readable range. Never a parent's: a project's gate
      judges only what its own configuration states, and a parent's requirements reach a member only
      in the family run (member-gate-unchanged-by-requirements). Empty when nothing is required.
    optional: false
methods: []
