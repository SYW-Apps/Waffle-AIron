kind: entity
id: share_snapshot
name: Share Snapshot
description: >-
  An immutable, point-in-time capture of a project view that a share link serves — written once at
  share-creation (or refresh) and never mutated, so a link always shows exactly what was shared
  regardless of later spec changes.
subsystem: sdd_host
fields:
  - name: id
    type: string
    description: Stable snapshot id.
    optional: false
    key: primary
  - name: projectId
    type: string
    optional: false
  - name: view
    type: string
    optional: false
  - name: capturedAt
    type: string
    description: ISO-8601 capture time.
    optional: false
  - name: canvasModel
    type: string
    description: Serialized CanvasModel JSON for the view.
    optional: true
  - name: openapi
    type: string
    description: >-
      Serialized OpenAPI document — captured when the shared surface has exactly ONE portal.
      Retained so share links created before per-portal capture keep serving their document
      unchanged; multi-portal shares populate openapiSet instead.
    optional: true
  - name: html
    type: string
    description: Standalone HTML export, when captured.
    optional: true
  - name: openapiSet
    type: NamedOpenApiSpec[]
    description: >-
      Every per-portal OpenAPI document in the shared surface, one per published Portal, so a
      multi-portal project shares each API separately — distinct portals are never merged into a
      combined document. Serving selects one by portalId; when more than one is present and none is
      selected, an index lists them.
    optional: true
methods: []
createdAt: '2026-07-17T22:32:32.574Z'
updatedAt: '2026-07-23T22:07:59.329Z'
