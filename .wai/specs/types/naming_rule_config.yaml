kind: value-object
id: naming_rule_config
name: NamingRuleConfig
description: >-
  Context-sensitive naming convention rules for the SDD linter. Each pattern is either a known
  casing style (snake_case, PascalCase, camelCase, kebab-case, UPPER_CASE) or a valid regular
  expression; invalid regex patterns are reported as validation errors.
fields:
  - name: components
    type: string
    description: Casing for component IDs (e.g. snake_case)
    optional: true
  - name: methods
    type: string
    description: >-
      Casing for interface method names (e.g. camelCase). When unset, it follows the target
      language's convention (see methodCasingFor), so a Rust tree is snake_case without configuring
      anything
    optional: true
  - name: types
    type: string
    description: Default casing for type names (e.g. PascalCase)
    optional: true
  - name: entities
    type: string
    description: Casing override for entity type names; falls back to types
    optional: true
  - name: valueObjects
    type: string
    description: Casing override for value-object type names; falls back to types
    optional: true
  - name: fields
    type: string
    description: Default casing for type fields (e.g. camelCase)
    optional: true
  - name: constants
    type: string
    description: Casing override for constant-style fields (e.g. UPPER_CASE); falls back to fields
    optional: true
  - name: variables
    type: string
    description: Casing for method parameters and variables (e.g. camelCase)
    optional: true
  - name: subsystems
    type: string
    description: Casing for subsystem IDs (e.g. snake_case)
    optional: true
  - name: interfaces
    type: string
    description: Casing for interface IDs (e.g. snake_case)
    optional: true
  - name: stereotypes
    type: any
    description: Per-component-type prefix, suffix, or regex naming constraints
    optional: true
methods:
  - name: methodCasingFor
    signature: 'methodCasingFor(targetLanguage: string?): string'
    params:
      - name: targetLanguage
        type: string?
        description: >-
          The effective targetLanguage of the subsystem holding the method, lowercased; none when
          the tree declares none
    returns: string
    description: >-
      The casing a method name must have in a tree of this target language: the configured `methods`
      casing when set, else the language's convention: snake_case for rust, python, ruby, c and
      elixir; PascalCase for csharp and go exports; camelCase for typescript, javascript, java,
      kotlin, swift, dart and any language not listed. The naming-conventions rule and the authoring
      and rename tools ask it, so define and rename accept the same names. Pure
