kind: value-object
id: topic_end
name: TopicEnd
description: >-
  One end of the pub/sub graph in a reach model: a component that emits (an emits declaration or a
  MessageBus publish endpoint) or subscribes to (a subscribesTo declaration or a MessageBus
  subscribe endpoint) one topic. The family run pairs topics across projects with them.
fields:
  - name: component
    type: string
    description: The component key, as the model names its components
    optional: false
  - name: topic
    type: string
    description: The topic, exactly as used on the bus
    optional: false
  - name: emits
    type: bool
    description: True on the publishing end, false on the subscribing end
    optional: false
methods: []
sourcePath: src/models/reach.ts
