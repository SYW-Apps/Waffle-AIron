kind: value-object
id: pack_install_options
name: PackInstallOptions
description: The switches of `wairon pack install` that concern the registry.
subsystem: sdd_cli
fields:
  - name: registry
    type: bool
    description: Read the source as a registry name even when a path of that name exists (--registry).
    optional: true
  - name: allowUnverifiedCode
    type: bool
    description: >-
      Consent, given up front, to install a code pack whose publisher is not verified
      (--allow-unverified-code). --yes is not this consent.
    optional: true
methods: []
sourcePath: src/commands/packs.ts
