kind: value-object
id: skill_resource_descriptor
name: SkillResourceDescriptor
description: >-
  MCP-safe descriptor for a Wairon-provided skill resource. This lets cloud agents discover built-in
  guidance such as the SDD architect skill without requiring local filesystem export.
fields:
  - name: id
    type: string
    description: Stable skill resource id, such as "sdd-architect".
    optional: false
  - name: name
    type: string
    description: Human-readable skill name.
    optional: false
  - name: description
    type: string
    description: Short description of when an agent should use the skill.
    optional: false
  - name: version
    type: string
    description: Skill content version or Wairon version that provides it.
    optional: true
  - name: resourceUri
    type: string
    description: MCP resource URI or tool-addressable id used to fetch the skill content.
    optional: false
  - name: defaultForHostedMcp
    type: boolean
    description: Whether hosted MCP should advertise this skill by default to connected agents.
    optional: false
methods: []
createdAt: '2026-07-08T22:01:23.487Z'
updatedAt: '2026-07-08T22:01:23.511Z'
