kind: value-object
id: member_relocation
name: MemberRelocation
description: >-
  How a detach also MOVES the member, as the hosted server asks for it: the member's directory
  leaves its family root's isolated tree for an isolated root of its own, inside the same
  transaction as the detach's file edits and the host store writes, all or nothing. The coordinator
  is the host data directory, which contains every family root and every new root, so every owner
  lies within it. With a relocation, every external the detach writes names its producer by hosted
  record id instead of by path, since a path cannot cross isolated roots; a hosted project's record
  id is its project id (member records are keyed by it, and the hosted caller refuses a family whose
  root record id differs from its project id).
subsystem: sdd_migrations
fields:
  - name: to
    type: string
    description: >-
      The member's new isolated root, absolute (where a new hosted project with its id would be
      allocated); must not exist
    optional: false
  - name: coordinator
    type: string
    description: The host data directory, absolute — the transaction's coordinator and an owner itself
    optional: false
  - name: areas
    type: string[]
    description: The host store files the coordinator owner contributes (project records, organization)
    optional: false
methods: []
