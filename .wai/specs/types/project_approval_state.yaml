kind: enum
id: project_approval_state
name: ProjectApprovalState
description: >-
  A project's approval as judged at its own root: whether its own design and policy still hold.
  Build inputs never decide it (ProjectApproval.inputs). A part has no lock of its own and records
  its declaring project's state.
fields: []
methods: []
sourcePath: src/models/lock.ts
values:
  - name: approved
    description: Its lock matches its own approval identity (own design and policy), recomputed at its own root
  - name: drifted
    description: It has a lock, and its own design or policy moved since
  - name: never
    description: No lock, or no project on disk at the declared path
