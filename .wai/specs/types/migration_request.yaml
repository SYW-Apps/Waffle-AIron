kind: value-object
id: migration_request
name: MigrationRequest
description: >-
  One family migration as a person or an agent asks for it, from the bound project: the verb and
  exactly the arguments that verb reads. The same value comes in through `wairon member …` / `wairon
  project rename` and through the sdd_* member tools, so both doors plan identically.
subsystem: sdd_migrations
fields:
  - name: verb
    type: string
    description: attach | rename | rename-alias | detach | adopt | internalize | externalize.
    optional: false
  - name: alias
    type: string
    description: >-
      attach: the alias to declare; rename-alias: the alias as declared now; detach, adopt,
      internalize: the member or external it acts on.
    optional: true
  - name: path
    type: string
    description: >-
      attach: the existing project's root; externalize: the new member's root — relative to the
      bound project.
    optional: true
  - name: project
    type: string
    description: >-
      rename: the project whose id moves, as a member alias path from the bound project
      (`billing/payments`); empty or absent for the bound project itself.
    optional: true
  - name: newId
    type: string
    description: 'rename: the new project id.'
    optional: true
  - name: newAlias
    type: string
    description: 'rename-alias: the alias to declare it under.'
    optional: true
  - name: subsystem
    type: string
    description: 'externalize: the subsystem that becomes a member.'
    optional: true
  - name: destination
    type: InternalizeDestination
    description: 'internalize: where the member''s own metadata goes.'
    optional: true
methods: []
createdAt: '2026-09-30T20:24:03.011Z'
updatedAt: '2026-09-30T20:29:33.334Z'
