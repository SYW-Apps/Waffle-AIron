kind: value-object
id: type_ref_resolution
name: TypeRefResolution
description: >-
  How one written type reference resolved, decided from the referrer's own subsystem first: the one
  type it lands on, every type it matches, and a same-named type of the referrer's subsystem that
  the binding passed over. Pure: computed from the reference, the referrer's subsystem and the types
  handed in. Every local resolver reads it (the unused-type and type-reference rules, the agent
  brief's type reads, the type rename) so that one reference binds to one type everywhere.
fields:
  - name: type
    type: string
    description: The id of the one type the reference resolves to; absent when the outcome is ambiguous or none
    optional: true
  - name: candidates
    type: list<string>
    description: >-
      The ids, in qualified form, of every type the reference matches (type_spec.matchesRef holds),
      in the order the types were handed in
    optional: false
  - name: outcome
    type: TypeRefOutcome
    description: Whether the reference resolved to one type, matched several, or matched none
    optional: false
  - name: shadowedBy
    type: string
    description: >-
      The id of another type, not a candidate, whose display name has the reference's nameKey and
      that sits at least as close to the referrer as the type the reference resolved to (closeness:
      the referrer's own subsystem is nearest, a type with no subsystem is in the middle, another
      subsystem is far). Absent when the reference is qualified with :: or written exactly as the
      resolved type's id. The binding does not change silently: it is reported
    optional: true
methods:
  - name: resolve
    signature: 'resolve(ref: string, from?: string, types: list<TypeSpec>): TypeRefResolution'
    params:
      - name: ref
        type: string
        description: The type reference as written
      - name: from
        type: string
        description: >-
          The referring spec's subsystem: a contract's is its component's subsystem, a type's
          fields, type-method signatures and signature params its own subsystem, an L1 export
          entry's that subsystem; the L0 has none
        optional: true
      - name: types
        type: list<TypeSpec>
        description: The types the reference may name
    returns: TypeRefResolution
    description: >-
      Resolve a written type reference, the referrer's subsystem first. The candidates are the types
      whose matchesRef(ref) holds; none of them is outcome none. When from is given and some
      candidates belong to from, only those count: exactly one resolves to it, several are ambiguous
      among them. Otherwise exactly one candidate resolves to it and several are ambiguous. A
      resolved reference to a type X carries shadowedBy when some other type t, not a candidate, has
      nameKey(t.name) equal to the nameKey of the reference's last segment and is at least as close
      to the referrer as X. Closeness of a type to a referrer whose subsystem is from: near when the
      type's subsystem is from, middle when the type has no subsystem, far when it belongs to
      another subsystem; a referrer with no subsystem (the L0, a project-level type) sees
      project-level types as middle and every subsystem type as far. shadowedBy is the id of the
      closest such t, the first in the order the types were handed in on a tie. A reference that
      already says which type it means is never shadowed: one qualified with ::, or one written
      exactly as X's id (the way to say it for a project-level type, which has no subsystem to
      qualify with). The reference stays resolved. Pure.
    sourcePath: src/models/type-references.ts
    symbol: resolveTypeRef
sourcePath: src/models/type-references.ts
