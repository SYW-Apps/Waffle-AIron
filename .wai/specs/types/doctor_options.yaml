kind: value-object
id: doctor_options
name: DoctorOptions
description: The flags of `wairon doctor`.
subsystem: sdd_cli
fields:
  - name: fix
    type: bool
    description: >-
      Apply the repairs before the report. A tree another major wrote is not repaired: `wairon
      upgrade` moves it first.
    optional: true
  - name: 'yes'
    type: bool
    description: >-
      Answer the confirmation of the writes outside the project root, together with --global, for a
      non-interactive run.
    optional: true
  - name: global
    type: bool
    description: >-
      Consent to the --fix writes outside the project root (a machine-wide MCP configuration, the
      legacy global plugin). Together with --yes it answers their confirmation for a non-interactive
      run; without it such a run skips them and says so. Each replaced file is backed up beside
      itself either way.
    optional: true
methods: []
sourcePath: src/commands/doctor.ts
