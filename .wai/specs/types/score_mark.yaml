kind: signature
id: score_mark
name: ScoreMark
description: >-
  A caller's markup for a completeness score, given the percentage it shows, so the caller grades it
  however it grades things; the renderer never decides what a number means.
fields: []
methods: []
lint:
  allow:
    - code: MISSING_TYPE_SOURCE_PATH
      reason: >-
        No named declaration: the signature is the `score` method member of the StatusDecor
        interface in src/core/status.ts, not a type of its own, so there is no symbol a sourcePath
        could bind.
params:
  - name: pct
    type: int
    description: The completeness percentage, a whole number from 0 to 100
  - name: text
    type: string
    description: The score as the renderer would print it
returns: string
