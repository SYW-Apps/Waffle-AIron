kind: enum
id: domain_type
name: DomainType
description: >-
  How a domain came to be recognised. Three of the four are things the detector can see on disk, and
  the fourth, manual, is the one a human asserted. Keeping them distinct is what lets a scan
  re-derive its own proposals without ever second-guessing a domain somebody added on purpose.
fields: []
methods: []
sourcePath: src/models/domain.ts
values:
  - name: git-submodule
    description: Declared in .gitmodules
  - name: git-repo
    description: A directory holding its own .git
  - name: package-root
    description: A manifest such as package.json, pyproject.toml, Cargo.toml or go.mod
  - name: manual
    description: Added by a person rather than detected
createdAt: '2026-09-20T22:07:36.599Z'
updatedAt: '2026-10-04T23:34:37.978Z'
