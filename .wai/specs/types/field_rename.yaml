kind: value-object
id: field_rename
name: FieldRename
description: >-
  What renaming a field of a type changed: the field moved to its new name (its old name appended to
  the field's rename trace, previousNames, which the design export shows as `formerly`), and the
  specs whose references to it were respelled.
subsystem: sdd_core
fields:
  - name: type
    type: string
    description: The type whose field moved, qualified by its owning subsystem when it has one
    optional: false
  - name: from
    type: string
    description: The field's name before the rename
    optional: false
  - name: to
    type: string
    description: The field's name after the rename
    optional: false
  - name: rewritten
    type: list<string>
    description: >-
      Ids of the other specs whose references to the field (a foreign key's `references:
      <type>.<field>`) were respelled
    optional: false
methods: []
sourcePath: src/core/provision.ts
createdAt: '2026-10-06T23:07:04.066Z'
updatedAt: '2026-10-06T23:07:04.951Z'
