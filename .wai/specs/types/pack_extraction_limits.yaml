kind: value-object
id: pack_extraction_limits
name: PackExtractionLimits
description: >-
  The configurable safety caps the codec enforces when planning an extraction — the zip-bomb /
  oversized-archive guardrails. Every field is optional; unset fields fall back to the codec's
  default profile. Hosted install passes a stricter profile than local CLI install.
fields:
  - name: maxEntries
    type: number
    description: Max entry count (default 4096)
    optional: true
  - name: maxTotalUncompressedBytes
    type: number
    description: Max total inflated size (default 32 MiB; hosted 8 MiB)
    optional: true
  - name: maxEntryBytes
    type: number
    description: Max single-entry inflated size (default 8 MiB)
    optional: true
  - name: maxCompressionRatio
    type: number
    description: Max inflated:compressed ratio, zip-bomb guard (default 100)
    optional: true
  - name: maxDepth
    type: number
    description: Max path nesting depth (default 16)
    optional: true
methods: []
componentClass: pack_codec
createdAt: '2026-07-21T18:12:45.243Z'
updatedAt: '2026-07-21T18:12:45.380Z'
