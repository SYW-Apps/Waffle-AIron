kind: value-object
id: approved_revision
name: ApprovedRevision
description: >-
  Where the baseline of a surface comparison was read: the bound project's tree at one commit,
  materialized read-only in the fetch cache, and how a reader names it.
subsystem: sdd_core
fields:
  - name: directory
    type: string
    description: The project's root at that commit, in the fetch cache.
    optional: false
  - name: commit
    type: string
    description: The full commit.
    optional: false
  - name: label
    type: string
    description: 'How a changelog names the baseline: the last approval with its commit, or the ref asked for.'
    optional: false
  - name: committedAt
    type: datetime
    description: >-
      The commit's committer time: the moment a sibling member's approval is read as of when this
      revision is a comparison's baseline.
    optional: false
methods: []
sourcePath: src/core/external-producers.ts
