kind: value-object
id: external_binding
name: ExternalBinding
description: >-
  One declared external of the bound project — or one of its referenced project members (a `../`,
  git or hosted source) — bound to its producer, with what the project's references reach in it. The
  answer the surface plane pins, lists and checks status from.
subsystem: sdd_core
fields:
  - name: external
    type: ResolvedExternal
    description: The declaration bound to its producer (or left unresolved, with the problem).
    optional: false
  - name: usage
    type: ExportUsage
    description: >-
      The consumer's references into the producer by public name, with the member each reaches. For
      a family producer, mapped onto its live table (export_index.usage); for any other — path, git,
      hosted, a referenced project member — the references written through its alias or bound
      through its `use`, counted by the public name they spell (export_index.pinnedUsage), since the
      scan does not read that producer. So every pin's `used` map is filled and every status
      compares per use: the stage-2 gap where an outside producer reported per-use comparison as
      unavailable is closed (stage 8). Absent only for an unresolved producer.
    optional: true
  - name: reachable
    type: boolean
    description: >-
      Whether the climb reached the whole family: false when a hop above the bound root was out of
      reach, so a family producer above it could not be looked for.
    optional: false
methods: []
sourcePath: src/models/project-family.ts
createdAt: '2026-09-26T17:43:46.075Z'
updatedAt: '2026-10-02T20:48:03.259Z'
