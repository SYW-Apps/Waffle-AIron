kind: value-object
id: system_public_interface
name: SystemPublicInterface
description: >-
  One entry of the project's L0 export table — the only thing another project may consume, like a
  crate root's `pub use` or an `index.js` re-export. An entry is one of: an OWN item — `{ typeDef:
  host-var-values }` with no `from`, a project-level type (a type owned by no subsystem), the
  crate-root `pub struct`; a one-to-one re-export of a component (optionally narrowed to one
  interface) or a type from a source, optionally renamed with `as`; or, with neither `component` nor
  `typeDef`, everything the source exports (a wildcard). A source is one of the project's
  subsystems, or a member or declared external by its alias. There is no project-level type
  wildcard: each exported type is one entry, so a type becomes public contract only by being named.
  The export resolver follows each entry to its canonical target once per scan; explicit entries
  shadow a name a wildcard brings in. A legacy entry `{ subsystem, component, id }` reads as `{
  from: subsystem, component, as: id }`, and a component or subsystem-owned type without a source
  infers it from its owner, so existing trees keep their published names.
fields:
  - name: id
    type: string
    description: Legacy public name, read as `as` when `as` is absent.
    optional: true
  - name: name
    type: string
    description: Human-readable public surface name; defaults to the target component's name.
    optional: true
  - name: subsystem
    type: string
    description: >-
      Legacy source subsystem, read as `from` when `from` is absent; when both are absent the source
      is inferred from the component's (or type's) owner.
    optional: true
  - name: component
    type: string
    description: >-
      The component re-exported one to one. Without it and without `typeDef`, the entry re-exports
      everything the source exports.
    optional: true
  - name: interface
    type: string
    description: >-
      The L3 interface the export narrows to; the default public name when neither `as` nor `id` is
      set.
    optional: true
  - name: type
    type: string
    description: >-
      Surface kind, aligned with subsystem publicInterfaces: REST, GraphQL, MessageBus, RPC, or
      Custom; inherited from the source's entry when omitted.
    optional: true
  - name: details
    type: string
    description: >-
      Consumer-facing description of what the surface exposes and what remains private; inherited
      from the source's entry when omitted.
    optional: true
  - name: audience
    type: string
    description: >-
      Exposure ceiling, ascending reach: "project" (family-internal — exported only into own chained
      children, never beyond), "department" (owning org-unit subtree), "instance" (whole hosted
      instance; the default), "partner" (grant-gated cross-tenant), "external" (publicly consumable
      / 3rd-party-facing). A wildcard entry's audience applies to every name it brings in. The
      surface projector filters snapshot entries by this ceiling; org-unit grants then decide
      direction WITHIN the ceiling — effective visibility is the intersection.
    optional: true
  - name: authPolicy
    type: string
    description: Short policy identifier or prose summary for how callers authenticate to this surface.
    optional: true
  - name: version
    type: string
    description: Optional public contract version.
    optional: true
  - name: stability
    type: string
    description: 'Contract stability: "draft", "stable", or "deprecated".'
    optional: true
  - name: from
    type: string
    description: >-
      The source the entry re-exports from: a subsystem of this project, or a member or declared
      external by its alias. Absent for an own project-level type, and for a legacy entry whose
      source is inferred.
    optional: true
  - name: typeDef
    type: string
    description: >-
      A type (entity, value object, enum) exported as is, giving it a public name. Without `from`, a
      type this project owns at project level (no subsystem) is an own item; a subsystem-owned type
      without `from` infers the subsystem as its source.
    optional: true
  - name: as
    type: string
    description: >-
      The public name consumers use. Defaults to `id`, then `interface`, then `component` or
      `typeDef`, so an entry without it keeps today's name. Must fit [a-z0-9-_]+ (else
      EXPORT_INVALID).
    optional: true
methods: []
sourcePath: src/models/specs.ts
