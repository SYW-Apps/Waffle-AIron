kind: value-object
id: external_use_request
name: ExternalUseRequest
description: >-
  What `wairon externals use` and sdd_update_external ask for: one declared external changed field
  by field — the public names added to and removed from its `use` imports, and a new location — so a
  project never hand-edits `.wai/project.yaml` and never removes and re-adds an external to change
  one field.
subsystem: sdd_surfaces
fields:
  - name: alias
    type: string
    description: The declared external whose `use` changes
    optional: false
  - name: add
    type: list<string>
    description: >-
      Public names to import bare (`*` for all); each must be exported by the producer to this
      project when it can be read
    optional: true
  - name: remove
    type: list<string>
    description: Names to stop importing
    optional: true
  - name: dryRun
    type: bool
    description: Answer what the `use` would become, writing nothing
    optional: true
  - name: source
    type: MemberSource
    description: >-
      A new location for the producer, in the one location grammar; checked against the producer
      exactly as declaring one is, the pin following it (dropped for a path producer, which is read
      live; re-taken for a git or hosted one)
    optional: true
methods: []
sourcePath: src/models/specs.ts
createdAt: '2026-10-06T23:03:05.551Z'
updatedAt: '2026-11-27T22:41:48.161Z'
