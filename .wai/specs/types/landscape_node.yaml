kind: value-object
id: landscape_node
name: LandscapeNode
description: >-
  Node in a hosted-instance landscape graph. Unlike GraphNode, this can represent organization
  units, hosted projects, and public interfaces rather than only local components.
fields:
  - name: id
    type: string
    description: Stable graph node id.
    optional: false
  - name: label
    type: string
    description: Display label.
    optional: false
  - name: nodeKind
    type: string
    description: 'Node kind: "orgUnit", "project", or "publicInterface".'
    optional: false
  - name: projectId
    type: string
    description: Hosted project id when this node represents a project or one of its public interfaces.
    optional: true
  - name: unitId
    type: string
    description: Organization unit id when this node represents an organization unit.
    optional: true
  - name: publicInterfaceId
    type: string
    description: System public interface id when this node represents a public interface.
    optional: true
  - name: status
    type: string
    description: Optional lifecycle/status label for filtering and styling.
    optional: true
  - name: actionable
    type: boolean
    description: >-
      True when the caller can act on this scope (it is an actionable visible scope). False/absent
      on an ancestor-breadcrumb (context) organization unit included only so the hierarchy stays
      navigable up to the root — such a context unit is shown read-only and its non-visible children
      are omitted. An instance-admin sees every node actionable.
    optional: true
methods: []
