kind: value-object
id: spec_index
name: SpecIndex
description: >-
  The bound tree as one scan read it: every loaded spec by kind, and the file each one is stored in.
  What a reader outside the loader needs to relate a spec to its file — the validator matches
  approved files to specs through it.
subsystem: sdd_core
fields:
  - name: subsystems
    type: list<SubsystemSpec>
    description: Every loaded subsystem spec
    optional: false
  - name: components
    type: list<ComponentSpec>
    description: Every loaded component spec
    optional: false
  - name: interfaces
    type: list<InterfaceSpec>
    description: Every loaded interface spec
    optional: false
  - name: implementations
    type: list<ImplementationSpec>
    description: Every loaded implementation spec
    optional: false
  - name: types
    type: list<TypeSpec>
    description: Every loaded type spec
    optional: false
  - name: groups
    type: list<any>
    description: Every loaded type group
    optional: false
  - name: paths
    type: map<string, map<string, string>>
    description: Per kind, each spec id's absolute file path
    optional: false
  - name: signatures
    type: SignatureFacts
    description: >-
      What the scan's signature resolution recorded: each signatureFrom it met and how it resolved,
      and each stored signature text its params contradict
    optional: false
  - name: typeSpellings
    type: TypeSpellingFacts
    description: >-
      What the scan's type canonicalisation recorded: each stored type position that is an alias of
      its canonical spelling, and each that is not canonical at all. The loaded interfaces and types
      hold canonical text, so this is the only place the stored spellings are still visible
    optional: false
methods: []
sourcePath: src/core/specs.ts
createdAt: '2026-09-25T21:05:18.930Z'
updatedAt: '2026-10-04T10:21:08.990Z'
