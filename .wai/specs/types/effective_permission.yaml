kind: value-object
id: effective_permission
name: EffectivePermission
description: >-
  The resolved effective permission for one (subject, capability, target scope): the decided value
  plus which source and which rung decided it — the explanation of why someone can or cannot act,
  shown by the permission explanation, quoted by a refused write, and kept in audit.
subsystem: sdd_host
fields:
  - name: value
    type: EffectiveValue
    description: 'The resolved effective permission (never inherit: inherit is consumed during the walk).'
    optional: false
  - name: source
    type: PermissionSource
    description: Which source decided it.
    optional: false
  - name: decidedScopeKind
    type: ScopeKind
    description: Scope kind whose setting won.
    optional: true
  - name: decidedScopeId
    type: string
    description: The ancestor-chain scope whose setting won.
    optional: true
  - name: scopeNote
    type: string
    description: >-
      Set by the permission explanation only: "subsystem not found" when the explained scope is a
      subsystem its project's tree does not declare (or whose project has no record) — the rules
      stored there are kept and would apply again if the subsystem were re-created.
    optional: true
methods: []
sourcePath: src/server/types.ts
createdAt: '2026-07-15T20:25:33.560Z'
updatedAt: '2026-10-04T23:38:28.650Z'
