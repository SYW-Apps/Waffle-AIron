kind: value-object
id: permission_subject
name: PermissionSubject
description: >-
  The resolved caller handed to the pure permission resolver: the principal's id, their role
  bindings, and whether they are the env-anchored instance super-admin. An instance-admin resolves
  to yes everywhere, bypassing the walk (non-overridable).
subsystem: sdd_host
fields:
  - name: subjectId
    type: string
    description: The user/principal id being authorized.
    optional: false
  - name: roleBindings
    type: RoleBinding[]
    description: The subject's role bindings.
    optional: false
  - name: instanceAdmin
    type: boolean
    description: >-
      True ONLY for the env-anchored built-in super-admin subject (issuer 'local', userId
      'builtin:superadmin'), the master credential, or (devMode only) the synthetic local-developer
      subject — the resolver then bypasses to yes. A regular user is NEVER instanceAdmin, even a
      delegated instance-wide project:admin (that resolves as a normal overridable permission). It
      is determined by subject identity, never by an assignment.
    optional: false
methods: []
createdAt: '2026-07-15T20:25:25.002Z'
updatedAt: '2026-07-15T23:07:27.761Z'
