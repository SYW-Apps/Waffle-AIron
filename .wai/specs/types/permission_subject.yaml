kind: value-object
id: permission_subject
name: PermissionSubject
description: >-
  The resolved caller handed to the pure permission resolver: the principal's id, their role
  bindings, and whether they are the env-anchored instance super-admin. An instance-admin resolves
  to yes everywhere, bypassing the walk (non-overridable).
subsystem: sdd_host
fields:
  - name: subjectId
    type: string
    description: The user/principal id being authorized.
    optional: false
  - name: roleBindings
    type: RoleBinding[]
    description: The subject's role bindings.
    optional: false
  - name: instanceAdmin
    type: boolean
    description: >-
      True ONLY for the built-in super-admin subject (issuer 'local', userId === the persisted
      boot-reserved super-admin UUID seeded at first boot), the master credential, or (devMode only)
      the synthetic local-developer subject (issuer 'local', userId === the persisted boot-reserved
      local-developer UUID) — the resolver then bypasses to yes. A regular user is NEVER
      instanceAdmin, even a delegated instance-wide project:admin (that resolves as a normal
      overridable permission). It is determined by subject identity compared against the persisted
      instance identity, never by an assignment and never by an account name.
    optional: false
  - name: aliasSubjectIds
    type: string[]
    description: >-
      Alternate ids this subject is also known by when a user record's id and its subject's userId
      have diverged (legacy records). The resolver honors a per-user assignment keyed by any alias
      exactly as one keyed by subjectId; write paths canonicalize new assignments onto the subject's
      userId, so aliases only carry legacy rows.
    optional: true
methods: []
