kind: value-object
id: project_grant
name: ProjectGrant
description: >-
  Server-side authorization grant binding a principal or token to a hosted project and a precise
  permission set. Grants are evaluated by the hosted request and control-plane workflows; callers
  may not self-assert them.
fields:
  - name: projectId
    type: string
    description: Hosted project id the grant applies to, or "*" for an instance-wide administrative grant.
    optional: false
  - name: permissions
    type: string[]
    description: >-
      Permission identifiers such as "mcp:read", "mcp:write", "project:create", "lock:create",
      "promote:mark-ready", "key:manage", "pack:manage", or "audit:read".
    optional: false
  - name: role
    type: string
    description: >-
      Optional coarse display role derived from permissions for UI compatibility, such as "viewer",
      "editor", "maintainer", "owner", or "admin".
    optional: true
  - name: expiresAt
    type: string
    description: Optional ISO-8601 expiry for temporary grants.
    optional: true
methods: []
