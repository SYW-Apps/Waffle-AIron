kind: value-object
id: agent_record
name: AgentRecord
description: Agent record
fields:
  - name: id
    type: string
    description: Stable agent identifier
  - name: name
    type: string
    description: Display name of the agent
  - name: template
    type: string
    description: Generation template (architect, domain-owner, implementer, …)
  - name: creationReason
    type: string
    description: Why this agent exists in the topology
  - name: domainRoot
    type: string
    description: Domain the agent belongs to (absent = global root)
    optional: true
  - name: ownedPaths
    type: string[]
    description: Glob patterns of the files this agent owns
  - name: tags
    type: string[]
    description: Classification tags (meta, guardian, architect, …)
methods: []
createdAt: '2026-06-10T22:00:00.000Z'
updatedAt: '2026-07-03T00:00:00.000Z'
