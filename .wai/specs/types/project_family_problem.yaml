kind: value-object
id: project_family_problem
name: ProjectFamilyProblem
description: >-
  A fact about the family's identities and membership that no single project can see alone: two
  members resolving to one project id, a member resolving to none, a member that declares none, a
  member whose directory is absent, or an alias one project declares twice. Reported, never judged —
  the project-identity rule turns the identity kinds into PROJECT_ID_COLLISION, PROJECT_ID_AMBIGUOUS
  or PROJECT_ID_DEFAULTED, and the member-declarations rule judges the others; the chaining
  migration refuses to write a family with an absent member.
subsystem: sdd_core
fields:
  - name: kind
    type: string
    description: >-
      id-collision | no-id | defaulted | member-absent | alias-conflict | duplicate-spec. A
      defaulted problem is a member that declares no id: it answers to its name slug, and the id it
      should declare is its alias. A member-absent problem is a `members` entry or legacy mount
      whose directory does not exist. An alias-conflict is an alias a project declares both as a
      member and as an external. A duplicate-spec problem is one key declared by two spec files of
      one project (the first stays in the index).
    optional: false
  - name: id
    type: string
    description: >-
      The id two or more members resolve to, for an id-collision; the alias to declare as the id,
      for a defaulted member; the alias, for member-absent and alias-conflict.
    optional: true
  - name: projects
    type: string[]
    description: The namespaces of the projects concerned ('' is the bound root).
    optional: false
  - name: detail
    type: string
    description: >-
      What is wrong, in words a finding can quote, including where each id came from (declared or
      name).
    optional: false
methods: []
sourcePath: src/models/project-family.ts
