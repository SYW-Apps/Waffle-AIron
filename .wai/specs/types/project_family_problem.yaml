kind: value-object
id: project_family_problem
name: ProjectFamilyProblem
description: >-
  A fact about the family's identities and membership that no single project can see alone: two
  members resolving to one project id, a member resolving to none, a member that declares none, a
  member whose directory is absent, or an alias one project declares twice. Reported, never judged —
  the family run's member checks (family_validator.checkMembers) turn the identity kinds into
  PROJECT_ID_COLLISION, PROJECT_ID_AMBIGUOUS or PROJECT_ID_DEFAULTED and an absent member into
  MEMBER_NOT_FOUND, and the member-declarations rule judges the others; the chaining migration
  refuses to write a family with an absent member.
subsystem: sdd_core
fields:
  - name: kind
    type: string
    description: >-
      id-collision | no-id | defaulted | member-absent | alias-conflict | duplicate-spec |
      part-unavailable | part-project-content | kind-mismatch | kind-inferred |
      part-parent-undeclared. A defaulted problem is a member that declares no id: it answers to its
      name slug, and the id it should declare is its alias. A member-absent problem is a contained
      project member's `members` entry or legacy mount whose directory does not exist. An
      alias-conflict is an alias a project declares both as a member and as an external. A
      duplicate-spec problem is one key declared by two spec files of one project (the first stays
      in the index) — a part's file and its parent's included, since a part shares its parent's
      namespace. Stage 8: part-unavailable — a part whose files could not be read (its directory
      absent, its git commit not cached and not fetchable, or no commit pinned);
      part-project-content — a part whose root holds an L0 or whose configuration declares a project
      field (only `partOf` is a part's); kind-mismatch — the declaring project's `as` and the
      member's own root disagree (a part whose PartOf names another project, or a project member
      whose configuration declares partOf); kind-inferred — a member with no `as` read as a project
      because its root is project-shaped; part-parent-undeclared — a part whose root carries no
      PartOf, so opened alone it cannot say what it belongs to.
    optional: false
  - name: id
    type: string
    description: >-
      The id two or more members resolve to, for an id-collision; the alias to declare as the id,
      for a defaulted member; the alias, for member-absent and alias-conflict.
    optional: true
  - name: projects
    type: string[]
    description: The namespaces of the projects concerned ('' is the bound root).
    optional: false
  - name: detail
    type: string
    description: >-
      What is wrong, in words a finding can quote, including where each id came from (declared or
      name).
    optional: false
methods: []
sourcePath: src/models/project-family.ts
