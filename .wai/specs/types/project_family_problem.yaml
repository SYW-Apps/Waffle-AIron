kind: value-object
id: project_family_problem
name: ProjectFamilyProblem
description: >-
  A fact about the family's identities that no single project can see alone: two projects of one
  family resolving to one id, a member resolving to none, or a member that declares no id. Reported,
  never judged — the project-identity rule turns it into PROJECT_ID_AMBIGUOUS or
  PROJECT_ID_DEFAULTED.
subsystem: sdd_core
fields:
  - name: kind
    type: string
    description: >-
      id-collision | no-id | defaulted. A defaulted problem is a member (a project the graph knows
      is mounted) that declares no id: it answers to its name slug, and the id it should declare is
      its mount's subsystem id.
    optional: false
  - name: id
    type: string
    description: >-
      The id two or more projects resolve to, for an id-collision; the mount's subsystem id to
      declare, for a defaulted member.
    optional: true
  - name: projects
    type: string[]
    description: The namespaces of the projects concerned ('' is the bound root).
    optional: false
  - name: detail
    type: string
    description: >-
      What is wrong, in words a finding can quote, including where each id came from (declared or
      name).
    optional: false
methods: []
sourcePath: src/models/project-family.ts
createdAt: '2026-09-26T17:39:43.662Z'
updatedAt: '2026-09-26T18:32:24.849Z'
