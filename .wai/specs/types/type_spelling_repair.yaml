kind: value-object
id: type_spelling_repair
name: TypeSpellingRepair
description: >-
  One spec the doctor's type-spelling repair plans for: the positions it rewrites to their canonical
  spelling, the `number` positions for which it only PROPOSES int, the string-literal unions for
  which it only PROPOSES an enum, and the positions only an author can settle. A proposal is never
  applied by the repair: int is offered where the name plainly says an integer (a count, size,
  length, limit, port, step, index, depth, level, days, minutes, seconds, bytes, version, ...) and
  an author confirms it by writing int, or writes float; an enum is offered for a union of string
  literals and an author confirms it by defining the enum and writing its id. A number position with
  no such name gets no proposal and stays reported as TYPE_NOT_NEUTRAL until an author chooses.
subsystem: sdd_core
fields:
  - name: specId
    type: string
    description: The interface or type the repair concerns
    optional: false
  - name: kind
    type: TypedSpecKind
    description: The kind of the spec holding it.
    optional: false
  - name: rewritten
    type: list<TypeRespelling>
    description: Each alias position rewritten to its canonical spelling (written when apply)
    optional: false
  - name: proposals
    type: list<TypeRespelling>
    description: >-
      Each number position whose name plainly says an integer, with int as the proposed spelling;
      never written by the repair
    optional: false
  - name: authorNeeded
    type: list<TypeExpressionProblem>
    description: >-
      Each position no mechanical rewrite and no proposal can settle: an inline function type (name
      a signature type), a union mixing a primitive, a number without a proposal, a builtin with no
      neutral meaning, an expression that does not parse
    optional: false
  - name: enumProposals
    type: list<TypeEnumProposal>
    description: Each string-literal union position, with the enum proposed for it; never written by the repair
    optional: false
methods: []
sourcePath: src/models/type-grammar.ts
