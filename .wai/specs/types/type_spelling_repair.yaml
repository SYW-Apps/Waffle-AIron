kind: value-object
id: type_spelling_repair
name: TypeSpellingRepair
description: >-
  One spec the doctor's type-spelling repair plans for: the positions it rewrites to their canonical
  spelling, the `number` positions for which it only PROPOSES int, and the positions only an author
  can settle. A proposal is never applied by the repair: it is offered where the name plainly says
  an integer (a count, size, length, limit, port, step, index, depth, level, days, minutes, seconds,
  bytes, version, ...) and an author confirms it by writing int, or writes float; a number position
  with no such name gets no proposal and stays reported as TYPE_NOT_NEUTRAL until an author chooses.
subsystem: sdd_core
fields:
  - name: specId
    type: string
    description: The interface or type the repair concerns
    optional: false
  - name: kind
    type: string
    description: interface | type
    optional: false
  - name: rewritten
    type: TypeRespelling[]
    description: Each alias position rewritten to its canonical spelling (written when apply)
    optional: false
  - name: proposals
    type: TypeRespelling[]
    description: >-
      Each number position whose name plainly says an integer, with int as the proposed spelling;
      never written by the repair
    optional: false
  - name: authorNeeded
    type: TypeExpressionProblem[]
    description: >-
      Each position no mechanical rewrite can settle: an inline function type (name a signature
      type), a literal union (name an enum), a union mixing a primitive, a number without a
      proposal, a builtin with no neutral meaning, an expression that does not parse
    optional: false
methods: []
