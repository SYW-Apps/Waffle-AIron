kind: value-object
id: spec_identity_move
name: SpecIdentityMove
description: >-
  One spec id an identity move changes, as the findings keyed on it see it. With sites, only a
  finding anchored at one of those sites follows — a method move re-homes the moved methods'
  findings and leaves every other finding of the source spec where it is.
subsystem: sdd_core
fields:
  - name: from
    type: string
    description: The spec id before the move
    optional: false
  - name: to
    type: string
    description: The spec id after it
    optional: false
  - name: sites
    type: string[]
    description: When given, only a finding anchored at one of these sites follows the move
    optional: true
methods: []
sourcePath: src/models/identity-rename.ts
createdAt: '2026-09-26T10:58:28.249Z'
updatedAt: '2026-09-26T10:58:28.254Z'
