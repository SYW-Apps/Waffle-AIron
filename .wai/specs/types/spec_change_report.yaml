kind: value-object
id: spec_change_report
name: SpecChangeReport
description: >-
  The answer to an authoring write: exactly what changed, or that nothing did. A write that changes
  nothing writes nothing — `written` is false and the stored `updatedAt` is untouched. One sentence
  for both outcomes is what let a delta that landed nowhere read as a completed edit.
fields:
  - name: kind
    type: string
    description: 'The spec kind written: system, subsystem, component, interface, implementation or type.'
    optional: false
  - name: id
    type: string
    description: The stored spec's id.
    optional: false
  - name: written
    type: boolean
    description: 'False when the merged spec equals what is stored: nothing reached disk.'
    optional: false
  - name: changes
    type: SpecChange[]
    description: Every change the write made; empty exactly when `written` is false.
    optional: false
  - name: notices
    type: string[]
    description: Store placement notices, component gate warnings and delta notices.
    optional: false
  - name: summary
    type: string
    description: One line for people, naming the spec and either the change count or that nothing was written.
    optional: false
  - name: dryRun
    type: boolean
    description: >-
      True when the caller asked what the delta would do and nothing was written. `written` is false
      for a dry run exactly as it is for a delta that changed nothing, and only this field tells the
      two apart.
    optional: false
  - name: ineffective
    type: string[]
    description: >-
      Every path the delta named that the write did not act on, each with why: a key the level's
      schema drops (a nested typo the permissive delta cannot refuse), or a value the stored spec
      already held. Named rather than stripped, because a key silently dropped is how a typo reads
      as a completed edit.
    optional: false
  - name: testsToRevisit
    type: TestsToRevisit[]
    description: >-
      The tests that encode a method this write changed or deleted, one entry per such method. Empty
      when the write touched no method, when the project declares no test roots, or when nothing
      references them. This is what a spec pass never said: eight hosted tests once encoded
      behaviour a committed spec had changed, and a brief that said "keep existing tests green"
      collided with the spec because nothing listed them. The write that creates the collision is
      the one that reports it.
    optional: false
  - name: strippedKeys
    type: string[]
    description: >-
      Keys the stored document on disk carries that its level's schema does not know — read from the
      raw file, not the parsed spec, since the parse already discards them — which this write will
      drop, each as `path: value` (e.g. `status: draft` on an L0). A dry run lists them too, so a
      caller can show them before anything is written. Absent when there are none. Named, never
      silently lost.
    optional: true
  - name: respellings
    type: TypeRespelling[]
    description: >-
      Each type position of the merged spec the write normalised (or, on a dry run, would): what the
      delta or the stored file wrote against the canonical spelling stored. Empty when every
      position was already canonical.
    optional: false
methods: []
sourcePath: src/core/specs.ts
