kind: value-object
id: planned_narrowing
name: PlannedNarrowing
description: >-
  One API key's project narrowing as the member upgrade rewrites it: each member-QUALIFIED entry
  ('platform::billing', one alias per hop) becomes that member's record id, and one that names no
  member the family declares is dropped (it resolved to nothing, so dropping it narrows, never
  widens). A key left with no entry is revoked. Nothing else changes - an entry naming a project
  already covers its members through the project chain, so a family-root entry is never expanded,
  and '*' is kept. A qualified entry already bound the member's own record, so the rewrite spells
  the same reach in record ids.
subsystem: sdd_host
fields:
  - name: keyId
    type: string
    description: The credential id
    optional: false
  - name: before
    type: list<string>
    description: The stored narrowing
    optional: false
  - name: after
    type: list<string>
    description: 'The rewritten narrowing: record ids only, no qualifier'
    optional: false
  - name: widening
    type: string
    description: 'Empty: the rewrite only spells the reach the entry already had in record ids'
    optional: false
  - name: revokes
    type: bool
    description: 'True when no entry survives: the key is revoked instead of narrowed'
    optional: false
methods: []
sourcePath: src/server/types.ts
createdAt: '2026-10-01T16:27:13.765Z'
updatedAt: '2026-10-19T06:11:47.030Z'
