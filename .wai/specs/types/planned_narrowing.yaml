kind: value-object
id: planned_narrowing
name: PlannedNarrowing
description: >-
  One API key's project narrowing as the member upgrade rewrites it so the key reaches exactly the
  trees it reached: a member-qualified entry becomes the member's record id plus the record ids of
  the members below it; a plain family-root entry gains the record id of every member of that family
  (it reached them through qualified selectors). '*' and entries naming no family are kept. widening
  states what the key may now do that it could not: call record-level tools (status, approval, lock
  requests, packs, policy, producers, commit, landscape discovery) on the member's own record —
  within the member only.
subsystem: sdd_host
fields:
  - name: keyId
    type: string
    description: The credential id
    optional: false
  - name: before
    type: string[]
    description: The stored narrowing
    optional: false
  - name: after
    type: string[]
    description: 'The rewritten narrowing: record ids only, no qualifier'
    optional: false
  - name: widening
    type: string
    description: The documented widening, or empty when the rewrite only spells the same reach in record ids
    optional: false
methods: []
