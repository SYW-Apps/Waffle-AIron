kind: value-object
id: profile_def
name: ProfileDef
description: >-
  A pack-defined architectural profile. family opts into the built-in stereotype fencing; the
  explicit forbidden/discouraged stereotype lists carry the profile's own doctrine with a stated
  reason. Registered under a profile id and validated against subsystem/project profiles
  (UNKNOWN_PROFILE for unregistered names).
fields:
  - name: family
    type: ProfileFamily
    description: Opts the profile into the built-in stereotype fencing (default neutral).
    optional: false
  - name: forbiddenStereotypes
    type: list<StereotypeConstraint>
    description: Stereotypes this profile forbids (PROFILE_FORBIDDEN_STEREOTYPE, error).
    optional: false
  - name: discouragedStereotypes
    type: list<StereotypeConstraint>
    description: Stereotypes this profile discourages (PROFILE_DISCOURAGED_STEREOTYPE, warning).
    optional: false
  - name: rules
    type: any
    description: Optional partial RulesConfig overrides (rule severities etc.) the profile applies.
    optional: true
  - name: allowedEdges
    type: list<AllowedEdge>
    description: >-
      Edge licenses (the allow half of the profile-scoped dependency matrix): intra-subsystem
      dependsOn edges the built-in stereotype matrix refuses, licensed for components this profile
      governs, each with its reason. Cross-subsystem boundary rules and pattern containment are
      never relaxable; the deny half is a forbid-edge declarative assertion. Defaults to none.
    optional: false
methods: []
sourcePath: src/core/extensions.ts
createdAt: '2026-07-14T18:56:48.916Z'
updatedAt: '2026-10-04T23:38:50.996Z'
