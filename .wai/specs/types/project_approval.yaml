kind: value-object
id: project_approval
name: ProjectApproval
description: >-
  One project's approval and build-input state, computed at that project's OWN root — its lock
  record against its own approval identity recomputed there, and its inputs against its own
  .wai/inputs.lock.yaml — so the answer is the same whichever root asked (status-agrees). The
  family's approvals are a list of these: the root's own entry first, then each member within the
  requested depth. Two separate questions: `state` says whether the approved design and policy still
  hold; `inputs` says what the build inputs owe beside it. `wairon lock-check` passes when the state
  is approved and nothing is owed; status, sdd_get_status and the dev page print both.
fields:
  - name: key
    type: string
    description: >-
      The project's key in the scan: empty for the root the question was asked at, else the member's
      key.
    optional: false
  - name: alias
    type: string
    description: The alias the parent declares this member under. Absent on the root's own entry.
    optional: true
  - name: parent
    type: string
    description: The key of the project that declares this member. Absent on the root's own entry.
    optional: true
  - name: projectId
    type: string
    description: The project's effective id, when it has a usable one.
    optional: true
  - name: state
    type: ProjectApprovalState
    description: >-
      Its approval, judged at its own root: whether its own design and policy moved since its lock.
      Never moved by a release, a re-pin, a pack's content or a member's lock.
    optional: false
  - name: as
    type: MemberKind
    description: >-
      What the member is. A part's state is its declaring project's (its specs are that project's
      own and in its record), and it carries no inputs of its own.
    optional: true
  - name: owed
    type: string
    description: >-
      Why the approval on record does not cover the project although its approval identity matches,
      in one sentence a verdict can quote: its project id moved since the approval (renamed by the
      rename migration, or changed by hand — the id is no input of the identity). Set only on a
      drifted entry.
    optional: true
  - name: partsMoved
    type: list<string>?
    description: >-
      On a drifted entry: the parts of its approval identity that moved (lock_record.movedParts) —
      design, rules, composition, network, selections — so every verdict names the one that did
      instead of listing every candidate.
    optional: true
    previousNames:
      - inputsMoved
  - name: partsIgnored
    type: string?
    description: >-
      Set when the record's `parts` do not break down its stateId (lock_record.partsProblem): why,
      in one clause. They are ignored — no part is named from them — and every surface says so as a
      notice; `wairon lock` rewrites them.
    optional: true
  - name: approvable
    type: bool
    description: >-
      Whether the project's own tree holds anything to approve, judged at its own root by the shared
      predicate spec_loader.holdsDesign (a subsystem, a type anywhere, an L0 export entry or a
      direct member project). False only for an L0 with nothing below it: `wairon lock` refuses
      there, so a parent's MEMBER_UNAPPROVED would prescribe a lock that cannot be taken (the family
      finding is then MEMBER_NOTHING_APPROVABLE, a notice). Absent when the member's tree could not
      be read.
    optional: true
  - name: inputs
    type: list<InputDebt>
    description: >-
      What the build inputs owe beside the approval (unpinned or unrecorded external uses, a pack
      whose content no longer matches the inputs lock, and — under
      composition.requireApprovedMembers — a direct member whose own lock does not hold). Empty when
      they hold. Never makes the state drifted: the approval holds, the build does not.
    optional: false
methods: []
sourcePath: src/models/lock.ts
