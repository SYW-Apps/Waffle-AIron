kind: value-object
id: method_signature
name: MethodSignature
description: >-
  One L3 contract method signature: the unit of the interface_spec methods list. Structured params
  are authoritative for type checking when present (the prose signature is then display-only);
  guarantees are open tokens backed by builtins or loaded packs; endpoint binds a Portal method to
  its wire surface; effect (read | write) is required on a durable Store's methods so the durability
  round-trip rule can pair external writes with hydration read-backs; invokedBy declares a real
  caller outside the modeled narrative graph, seeding the method as a reachability entrypoint;
  findings declare the finding codes the method reports.
fields:
  - name: name
    type: string
    description: Method name, unique within the contract
    optional: false
    key: primary
  - name: signature
    type: string
    description: Prose signature; display-only when structured params are present
    optional: true
  - name: params
    type: object[]
    description: Structured parameters ({name, type}) — authoritative for cross-contract type checking
    optional: true
  - name: returns
    type: string
    description: Return type or description
    optional: true
  - name: guarantees
    type: string[]
    description: >-
      Open guarantee tokens (builtins: idempotent | atomic | transactional | exactly-once, plus
      pack-declared) — must back any guarantee a narrative step asserts
    optional: true
  - name: endpoint
    type: object
    description: Wire binding for a Portal method (transport, address/topic, direction)
    optional: true
  - name: effect
    type: string
    description: >-
      read | write — required on a durable Store's contract methods for the durability round-trip
      pairing
    optional: true
  - name: invokedBy
    type: DeclaredInvocation
    description: >-
      Declared external invocation ({kind: runtime | external | sibling-subsystem, caller}) —
      unused-detection seeds this method as an entrypoint; caller prose mandatory
      (INVOKED_BY_UNDESCRIBED), stale when internally reached anyway (INVOKED_BY_REDUNDANT)
    optional: true
  - name: findings
    type: FindingDeclaration[]
    description: >-
      The finding codes this method can report, each with its default severity and summary (see
      finding_declaration). Each declared code must be anchored in the method's source file as a
      string literal or a property-access name (UNREALIZED_FINDING).
    optional: true
  - name: ext
    type: json
    description: >-
      Opaque namespaced extension data a pack or tool attaches to this method. Never validated or
      interpreted by the core, preserved verbatim through load and save.
    optional: true
methods:
  - name: typeRefs
    signature: 'typeRefs(): string[]'
    returns: string[]
    description: >-
      The type identifiers this method names: from its structured params and returns when params are
      given, else parsed from the prose signature and returns
    sourcePath: src/models/type-references.ts
    symbol: methodTypeRefs
  - name: passesIntentFloor
    signature: 'passesIntentFloor(text?: string): boolean'
    returns: boolean
    description: >-
      Whether prose is substantial enough to specify this method: at least 40 characters, and not
      just the method's name
  - name: genericParameters
    signature: 'genericParameters(): Set<string>'
    returns: Set<string>
    description: >-
      The generic parameters declared before the parameter list of its prose signature (find<T>(id:
      string) gives T)
    sourcePath: src/models/type-references.ts
    symbol: methodGenericParameters
sourcePath: src/models/specs.ts
