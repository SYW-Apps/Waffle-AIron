kind: value-object
id: method_signature
name: MethodSignature
description: >-
  One L3 contract method signature: the unit of the interface_spec methods list. Structured params
  are authoritative for type checking when present, and the shown signature text is then DERIVED
  from name, params (with their optional markers) and returns — written derived on every save,
  re-derived on every load, so the text can never disagree with the params; a method without params
  keeps its prose signature untouched. A method may instead take its params and returns from ONE
  source (signatureFrom): a named signature type, or a contract method `component.method` its
  component already reaches along a dependsOn/owns edge — no chains. Such a method stores only the
  source: the loader resolves the source's params and returns into it, so every consumer reads
  resolved params, and the writer drops them again. guarantees are open tokens backed by builtins or
  loaded packs; endpoint binds a Portal method to its wire surface; effect (read | write) is
  required on a durable Store's methods so the durability round-trip rule can pair external writes
  with hydration read-backs; invokedBy declares a real caller outside the modeled narrative graph,
  seeding the method as a reachability entrypoint; findings declare the finding codes the method
  reports.
fields:
  - name: name
    type: string
    description: Method name, unique within the contract
    optional: false
    key: primary
  - name: signature
    type: string
    description: >-
      Shown signature text. Derived from name, params and returns whenever params are present
      (method_signature.derivedSignature), and stored that way; prose only for a method without
      params; absent from the stored form of a method that names a signatureFrom
    optional: false
  - name: params
    type: object[]
    description: >-
      Structured parameters ({name, type, description, optional}) — authoritative for cross-contract
      type checking. On a method with a signatureFrom they are the source's, resolved by the loader
      and never stored
    optional: true
  - name: returns
    type: string
    description: >-
      Return type. On a method with a signatureFrom it is the source's, resolved by the loader and
      never stored
    optional: false
  - name: guarantees
    type: string[]
    description: >-
      Open guarantee tokens (builtins: idempotent | atomic | transactional | exactly-once, plus
      pack-declared) — must back any guarantee a narrative step asserts
    optional: true
  - name: endpoint
    type: object
    description: Wire binding for a Portal method (transport, address/topic, direction)
    optional: true
  - name: effect
    type: string
    description: >-
      read | write — required on a durable Store's contract methods for the durability round-trip
      pairing
    optional: true
  - name: invokedBy
    type: DeclaredInvocation
    description: >-
      Declared external invocation ({kind: runtime | external | sibling-subsystem, caller}) —
      unused-detection seeds this method as an entrypoint; caller prose mandatory
      (INVOKED_BY_UNDESCRIBED), stale when internally reached anyway (INVOKED_BY_REDUNDANT)
    optional: true
  - name: findings
    type: FindingDeclaration[]
    description: >-
      The finding codes this method can report, each with its default severity and summary (see
      finding_declaration). Each declared code must be anchored in the method's source file as a
      string literal or a property-access name (UNREALIZED_FINDING).
    optional: true
  - name: ext
    type: json
    description: >-
      Opaque namespaced extension data a pack or tool attaches to this method. Never validated or
      interpreted by the core, preserved verbatim through load and save.
    optional: true
  - name: description
    type: string
    description: What the method does and what it promises its caller
    optional: false
  - name: signatureFrom
    type: string
    description: >-
      Where this method takes its params and returns from instead of restating them: a signature
      type id (`billing.change_listener`, `alias::name` when another project exports it), or a
      contract method `component.method` whose component this method's component names in dependsOn
      or owns. The value is resolved both ways: as a method source and as a signature type. Exactly
      one resolving decides it; both resolving is SIGNATURE_SOURCE_AMBIGUOUS (qualify the
      reference), neither is SIGNATURE_SOURCE_UNRESOLVED. The source may not itself name a
      signatureFrom (no chains). A method naming one states no params or returns of its own — a
      write restating them is refused (SIGNATURE_SOURCE_RESTATED)
    optional: true
methods:
  - name: typeRefs
    signature: 'typeRefs(): string[]'
    returns: string[]
    description: >-
      The type identifiers this method names: from its structured params and returns when params are
      given, else parsed from the prose signature and returns
    sourcePath: src/models/type-references.ts
    symbol: methodTypeRefs
  - name: passesIntentFloor
    signature: 'passesIntentFloor(text?: string): boolean'
    returns: boolean
    description: >-
      Whether prose is substantial enough to specify this method: at least 40 characters, and not
      just the method's name
  - name: genericParameters
    signature: 'genericParameters(): Set<string>'
    returns: Set<string>
    description: >-
      The generic parameters declared before the parameter list of its prose signature (find<T>(id:
      string) gives T)
    sourcePath: src/models/type-references.ts
    symbol: methodGenericParameters
  - name: derivedSignature
    signature: 'derivedSignature(): string | undefined'
    returns: string | undefined
    description: >-
      The signature text its structured params determine: `name(a: T, b?: U): R` — each param as
      `name: type` in declared order, `?` after an optional one's name, the types exactly as the
      params write them, then the returns. A generic parameter list the stored text opens with
      (`find<T>(`) is carried over, since nothing structured declares it yet. Undefined for a method
      without params, whose prose is its signature.
    sourcePath: src/models/specs.ts
    symbol: deriveMethodSignature
  - name: storedForm
    signature: 'storedForm(): MethodSignature'
    returns: MethodSignature
    description: >-
      The method as a spec file holds it: a method naming a signatureFrom keeps the source and drops
      params, returns and signature, which the source supplies on every load; a method with params
      has its signature replaced by derivedSignature(); a prose method is returned as it is. What
      every save writes, whoever saves — a rename, a move, a lock's status promotion and an authored
      write alike.
    sourcePath: src/models/specs.ts
    symbol: storedMethodSignature
sourcePath: src/models/specs.ts
