kind: entity
id: hosted_user_record
name: HostedUserRecord
description: >-
  A hosted-instance user or service principal known to Wairon. The record links tokens, project
  grants, and audit events to a stable actor identity without storing external-provider secrets.
subsystem: sdd_host
fields:
  - name: id
    type: string
    description: Stable Wairon user or service-principal id.
    optional: false
  - name: subject
    type: PrincipalSubject
    description: Resolved actor subject shown in audit logs and admin UI.
    optional: false
  - name: status
    type: string
    description: 'Lifecycle status: "active", "disabled", or "deleted".'
    optional: false
  - name: grants
    type: ProjectGrant[]
    description: Current project and instance permissions granted to this actor.
    optional: false
  - name: createdAt
    type: string
    description: ISO-8601 creation timestamp.
    optional: false
  - name: lastSeenAt
    type: string
    description: ISO-8601 timestamp of the most recent authenticated action.
    optional: true
methods: []
createdAt: '2026-07-08T19:34:35.627Z'
updatedAt: '2026-07-08T19:34:35.660Z'
