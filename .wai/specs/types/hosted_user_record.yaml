kind: entity
id: hosted_user_record
name: HostedUserRecord
description: >-
  A hosted-instance user or service principal known to Wairon. The record links tokens, permission
  bindings (roleBindings + the assignment grid), and audit events to a stable actor identity without
  storing external-provider secrets or any legacy grants.
subsystem: sdd_host
fields:
  - name: id
    type: string
    description: Stable Wairon user or service-principal id.
    optional: false
  - name: subject
    type: PrincipalSubject
    description: Resolved actor subject shown in audit logs and admin UI.
    optional: false
  - name: status
    type: string
    description: >-
      Lifecycle status collapsed to a single axis: "active" or "inactive". Any non-"active" value
      (including legacy "disabled"/"deleted" and the former distinct suspend/deactivate states, now
      collapsed) is treated as inactive. An inactive record is retained for audit provenance but the
      user cannot act: on deactivation every one of the user's credentials is revoked and SSO
      re-login is blocked. Returning to "active" does NOT auto-restore revoked tokens — the user
      re-logs in via SSO or an admin mints fresh.
    optional: false
  - name: createdAt
    type: string
    description: ISO-8601 creation timestamp.
    optional: false
  - name: lastSeenAt
    type: string
    description: ISO-8601 timestamp of the most recent authenticated action.
    optional: true
  - name: unitId
    type: string
    description: >-
      The user's home organization unit; scoped user administration lists and filters users by their
      home unit subtree.
    optional: true
  - name: roleBindings
    type: RoleBinding[]
    description: >-
      Roles bound to this user, optionally scoped to a unit/project subtree; combined with direct
      permission assignments and everyone-defaults during hierarchical resolution. Authorization is
      expressed ONLY here (plus the assignment grid), never via stored grants. Deploy-time migration
      of any legacy grants into role bindings/assignments is a doctor concern, not stored on the
      record.
    optional: true
  - name: displayName
    type: string
    description: >-
      Human-readable display name (from the SSO id_token 'name'/'preferred_username' claim at
      provisioning, refreshed on re-login). Shown in the admin UI and audit views instead of the
      opaque subject id; may be unset for service principals or when the provider supplies no name.
    optional: true
  - name: email
    type: string
    description: >-
      Email address from the SSO id_token 'email' claim when present; shown alongside the display
      name in the admin UI so admins identify users by name/email rather than the raw subject id.
      May be unset.
    optional: true
methods: []
