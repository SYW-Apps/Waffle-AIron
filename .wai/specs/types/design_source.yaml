kind: value-object
id: design_source
name: DesignSource
description: >-
  Which tree a design export was projected from, and the approval verdict over it — the one verdict
  `wairon lock-check` and `wairon status` give, decided against the GATE identity (the parsed own
  tree, its governing doctrine, declared inputs, composition and direct members' approvals), never a
  weaker per-spec digest comparison. The core cannot compute the gate identity, so the caller
  decides the verdict and hands it in, exactly as status receives its approvals.
subsystem: sdd_surfaces
fields:
  - name: projectId
    type: string
    description: The project's effective id
    optional: false
  - name: stateId
    type: string
    description: >-
      `sha256:<digest>`, the CONTENT identity of the parsed spec tree the export was read from (the
      same StateId snapshots and archives are stamped with: every spec the scan loads, volatile
      timestamps excluded, in id order). It is the consumer's cache key: equal state ids with equal
      approvals mean equal documents. It is NOT the lock's gate identity: `.wai/lock.json` records
      `sha256+content+doctrine+inputs+members:<digest>`, which hashes only the project's OWN specs
      plus the governing doctrine, the declared inputs, `composition` and each direct member's
      composition subject — so the two digests never compare equal, and an export is related to its
      approval through `approval`, never by comparing ids
    optional: false
  - name: approved
    type: bool
    description: >-
      True exactly when approval is locked: the design passed the gate and a human signed it off, by
      the same verdict lock-check exits on. False for stale, unlocked and unjudged
    optional: false
  - name: approval
    type: DesignApproval
    description: >-
      The lock-check state the caller decided: locked (the approval still covers this design), stale
      (the design or something it was approved under moved past it), unlocked (never approved) — or
      unjudged when the caller passed no verdict (an in-process caller that did not obtain one),
      which claims nothing either way
    optional: false
methods: []
sourcePath: src/models/design-export.ts
