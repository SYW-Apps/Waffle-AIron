      reason: >-
        A named scalar domain, not a placeholder: a pack file path held as a string (realized as
        `type PackPath = string` in src/models/project.ts). It exists so `PackSelection | PackPath`
        is a union of named types (M3); the type grammar has no form for saying which primitive a
        named value-object holds.
