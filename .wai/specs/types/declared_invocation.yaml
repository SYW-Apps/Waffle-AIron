kind: value-object
id: declared_invocation
name: DeclaredInvocation
description: >-
  A declared external invocation on an L3 contract method — the typed, reviewable acknowledgment
  that a real caller exists OUTSIDE the modeled narrative graph (the method-level sibling of
  lifecycle_entrypoint, which roots runtime-driven flows at subsystem level). Unused-detection seeds
  the declaring method as an entrypoint alongside Portals, Observers, published components, and
  lifecycle entrypoints, so reachability PROPAGATES through the method's narrative — unlike a
  lint.allow, which only silences one spec and lets everything reachable solely through the
  suppressed method cascade into further allows. Honesty guards: the caller prose is mandatory
  (INVOKED_BY_UNDESCRIBED when missing), and a declaration on a method the internal walk reaches
  anyway is stale (INVOKED_BY_REDUNDANT) so the declaration set shrinks as edges become properly
  modeled. When the wiring is internal — the system itself hands the method to a runtime as a
  callback — prefer a register narrative step on the registering method instead: it keeps
  reachability derived, so the callback correctly returns to unused if its registrar does. A
  sibling-subsystem declaration is a typed second-best to modeling the edge (e.g. a published-Portal
  passthrough); it must never be used to dodge an edge that could legally exist.
fields:
  - name: kind
    type: string
    description: >-
      runtime | external | sibling-subsystem. runtime = a composition root, scheduler, or process
      host outside the modeled call chains invokes it (bootstrap start/stop, signal handlers).
      external = the caller is outside the system entirely (library embedders, third-party
      integrations). sibling-subsystem = the caller lives in this tree but crosses a boundary that
      licenses no modeled component edge (e.g. through a published code barrel onto an internal
      component).
    optional: false
  - name: caller
    type: string
    description: >-
      Who invokes this method and via what path — name the command, doc, or subsystem so a human
      reviewer can verify the claim (the trustedLinks doctrine: a reviewable exception, not tribal
      knowledge).
    optional: false
methods: []
