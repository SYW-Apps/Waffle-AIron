kind: value-object
id: export_problem
name: ExportProblem
description: >-
  A fact the export resolver met while resolving one table. It is reported, never judged: the
  export-tables rule decides each problem's finding and severity.
fields:
  - name: kind
    type: ExportProblemKind
    description: What is wrong; the export-tables rule maps each kind to its finding code.
    optional: false
  - name: owner
    type: string
    description: >-
      The table's owner — a subsystem id, or the system name for the L0 table — which is the spec a
      finding anchors to.
    optional: false
  - name: publicName
    type: string
    description: The public name concerned, when there is one.
    optional: true
  - name: targets
    type: list<string>
    description: >-
      For a duplicate, the canonical targets competing for the name; for a cycle, the levels on the
      loop, in order; for a widening, the declared audience then the source export's audience.
    optional: true
  - name: detail
    type: string
    description: What is wrong, in words a finding can quote.
    optional: false
  - name: renamedTo
    type: string
    description: >-
      On an invalid named re-export whose item its source no longer exports: the public name the
      source's rename trace carries that item to (a renamed component, interface or type keeps its
      former names), so the finding and every consumer of the re-export can say "renamed to" instead
      of "gone". Absent when the source records no such rename.
    optional: true
  - name: source
    type: string
    description: 'On an invalid named re-export: the `from` it names, as written.'
    optional: true
methods: []
sourcePath: src/models/exports.ts
