kind: enum
id: spec_digest_reading
name: SpecDigestReading
description: >-
  Which reading of a spec file a lock record's per-spec digests were taken in. The record names it,
  so a reader compares like with like and an approval taken before linkage left the approval stays
  readable.
subsystem: sdd_core
fields: []
methods: []
sourcePath: src/models/lock.ts
values:
  - name: content
    description: >-
      The file's raw text with line endings normalized: every byte counts, code linkage and
      timestamps included. What every record written before format 3 carries (the field absent).
  - name: design
    description: >-
      The spec's design view (its type's designView, timestamps out for every kind) in canonical
      form: a sourcePath, symbol or simPath added, moved or removed, a whitespace edit or a no-op
      re-save never moves it.
createdAt: '2026-10-06T10:07:07.114Z'
updatedAt: '2026-10-07T06:28:26.006Z'
