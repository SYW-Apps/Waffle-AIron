kind: value-object
id: lock_options
name: LockOptions
description: Flags of the local `wairon lock` command.
subsystem: sdd_cli
fields:
  - name: 'yes'
    type: bool
    description: Skip the interactive confirmation (scripts / CI).
    optional: true
  - name: subsystem
    type: string
    description: >-
      Narrow the approval to one subsystem of this project: only its specs' digests are re-captured,
      the rest of the previous approval carries forward. The gate identity recorded is always the
      whole project's.
    optional: true
  - name: recursive
    type: bool
    description: >-
      Accepted for one release and ignored for what is written: a lock approves this project only
      and never writes below it (parent-lock-writes-nothing-below). Each member is locked at its own
      root.
    optional: true
  - name: all
    type: bool
    description: >-
      List every changed spec of the approval summary. Without it a long list is summarized — the
      first few paths of each kind, then a count of the rest and the flag that lists them all.
    optional: true
methods: []
sourcePath: src/commands/lock.ts
createdAt: '2026-07-24T18:06:34.277Z'
updatedAt: '2026-10-07T06:23:04.629Z'
