kind: value-object
id: finding_declaration
name: FindingDeclaration
description: >-
  One finding code a method can report: the unit of a contract method's findings list. The code must
  be anchored in the method's source file, as a string literal or a property-access name such as
  Codes.X, or UNREALIZED_FINDING says so; below exact analysis grade any identifier counts. For a
  validator rule, its findings are its catalog entry.
fields:
  - name: code
    type: string
    description: >-
      Finding code, UPPER_SNAKE and unique within the method; a pack's codes carry the pack prefix
      (<PACK>_<CODE>)
    optional: false
    key: primary
  - name: severity
    type: string
    description: 'error | warning: the default before project severity overrides and draft-context downgrades'
    optional: false
  - name: summary
    type: string
    description: One line saying what the finding means
    optional: false
methods: []
sourcePath: src/models/specs.ts
createdAt: '2026-09-13T18:36:53.603Z'
updatedAt: '2026-09-19T11:07:07.775Z'
