kind: value-object
id: finding_declaration
name: FindingDeclaration
description: >-
  One finding code a method can report: the unit of a contract method's findings list. The code must
  be anchored in the method's source file, as a string literal or a property-access name such as
  Codes.X, or UNREALIZED_FINDING says so; below exact analysis grade any identifier counts. On an
  abstraction's method, whose file only declares the interface, a code is instead one a caller of
  the abstraction may meet: at least one concrete implementer declares it on its own method
  (ABSTRACTION_FINDING_UNRAISED otherwise), and an implementer may declare codes of its own that the
  abstraction does not. For a validator rule, its findings are its catalog entry.
fields:
  - name: code
    type: string
    description: >-
      Finding code, UPPER_SNAKE and unique within the method; a pack's codes carry the pack prefix
      (<PACK>_<CODE>)
    optional: false
    key: primary
  - name: severity
    type: IssueSeverity
    description: The default before project severity overrides and draft-context downgrades
    optional: false
  - name: summary
    type: string
    description: One line saying what the finding means
    optional: false
methods: []
sourcePath: src/models/specs.ts
