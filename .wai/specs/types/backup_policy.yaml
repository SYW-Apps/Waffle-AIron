kind: value-object
id: backup_policy
name: BackupPolicy
description: >-
  Hosted-instance backup policy for self-hosted Wairon data. It defines whether backups are enabled,
  where backup archives are written, and how many backups are retained. Raw secrets may be excluded
  or encrypted according to policy.
fields:
  - name: enabled
    type: boolean
    description: Whether scheduled or operator-triggered backups are enabled.
    optional: false
  - name: targetRef
    type: string
    description: >-
      Backup target reference such as a mounted directory, object-storage profile id, or
      operator-managed path. Must not embed raw credentials.
    optional: false
  - name: schedule
    type: string
    description: Optional cron-like schedule or "manual" for operator-triggered backups only.
    optional: true
  - name: retentionCount
    type: number
    description: Maximum number of successful backup records retained before pruning older backups.
    optional: false
  - name: includeAuditLogs
    type: boolean
    description: Whether durable audit logs are included in backups.
    optional: false
  - name: includeSecrets
    type: boolean
    description: >-
      Whether secret records are included. If true, the backup adapter must apply encryption or rely
      on an encrypted target.
    optional: false
  - name: encryptionRequired
    type: boolean
    description: >-
      Whether backup writes must fail unless the selected target/encryption configuration is
      verified.
    optional: false
methods: []
