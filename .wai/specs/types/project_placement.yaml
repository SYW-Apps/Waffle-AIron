kind: entity
id: project_placement
name: ProjectPlacement
description: >-
  Many-to-many assignment placing a hosted project inside one organization unit without making that
  unit part of the project's SDD subsystem tree.
subsystem: sdd_host
fields:
  - name: id
    type: string
    description: Stable placement id.
    optional: false
  - name: projectId
    type: string
    description: Hosted project id being placed.
    optional: false
  - name: unitId
    type: string
    description: Organization unit id that contains or shares the project.
    optional: false
  - name: role
    type: string
    description: Placement role such as "owner", "shared", "consumer", or "stakeholder".
    optional: false
  - name: createdAt
    type: string
    description: ISO-8601 creation timestamp.
    optional: false
  - name: createdBy
    type: PrincipalSubject
    description: Identity that created the placement.
    optional: true
methods: []
createdAt: '2026-07-08T21:11:16.787Z'
updatedAt: '2026-07-08T21:11:16.832Z'
