kind: enum
id: admin_api_mode
name: AdminApiMode
description: >-
  Whether a hosted instance serves its admin API. Where it listens is the host's admin bind address
  (--admin-host, loopback by default), not this mode. local_only, private_network and public are not
  values: the data-directory upgrade stores them as enabled once (each only ever meant served), and
  the exposure policy loader and setter refuse any value but these two.
fields: []
methods: []
sourcePath: src/server/types.ts
values:
  - name: disabled
    description: 'Nothing on the admin listener is mounted: every admin surface answers 404'
  - name: enabled
    description: The admin listener serves the control-plane surfaces the exposure flags enable (the default)
