kind: enum
id: admin_api_mode
name: AdminApiMode
description: >-
  How a hosted instance exposes its admin API. Only disabled changes what is mounted today: every
  other mode serves the admin listener wherever the host binds it (the network scoping the other
  modes name is not implemented).
fields: []
methods: []
sourcePath: src/server/types.ts
values:
  - name: disabled
    description: 'Nothing on the admin listener is mounted: every admin surface answers 404'
  - name: local_only
    description: Served on the admin listener (the default; it binds to loopback by default)
  - name: private_network
    description: Served on the admin listener; meant for a private network
  - name: public
    description: Served on the admin listener; meant for public exposure
createdAt: '2026-10-04T23:53:11.363Z'
updatedAt: '2026-10-04T23:53:12.003Z'
