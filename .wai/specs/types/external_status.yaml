kind: value-object
id: external_status
name: ExternalStatus
description: >-
  The status of one declared external: how it resolves now, what the lock recorded, and each used
  member compared with the live producer when it is reachable. Stale only when a used member changed
  or went away.
subsystem: sdd_surfaces
fields:
  - name: alias
    type: string
    description: The alias.
    optional: false
    key: primary
  - name: project
    type: string
    description: The producer id declared.
    optional: false
  - name: sourceKind
    type: string
    description: family | path | unresolved.
    optional: false
  - name: pinned
    type: bool
    description: Whether the lock holds an entry for the alias and its snapshot file exists.
    optional: false
  - name: reachable
    type: bool
    description: Whether the live producer could be projected.
    optional: false
  - name: stale
    type: bool
    description: True when any used member is changed or removed.
    optional: false
  - name: drifted
    type: bool
    description: >-
      Informational: the live table's content digest differs from the pinned one (something changed,
      used or not); absent when the producer is unreachable.
    optional: true
  - name: uses
    type: list<ExternalUseStatus>
    description: One verdict per used member (locked or used now).
    optional: false
  - name: detail
    type: string
    description: The external's problem when unresolved, or why the producer is unreachable.
    optional: true
  - name: outOfReach
    type: bool
    description: >-
      True when the producer's root lies outside the request's reach and was therefore not read. A
      family run that narrowed the reach to its selection reads it as an external it did not select
      — counted in its hint — rather than as a comparison that failed.
    optional: true
  - name: pinnedDigest
    type: string
    description: >-
      The content digest the lock recorded for this producer (ExternalLockEntry.digest); absent when
      the alias is not pinned. Provenance a reader sees beside the verdict (the canvas shows it
      shortened); never compared by a verdict here — drifted already says whether it moved.
    optional: true
  - name: pinnedCommit
    type: string
    description: >-
      The producer's commit as the lock recorded it (ExternalLockEntry.commit) — only for a producer
      in another git repository than the consumer; absent otherwise. Provenance only.
    optional: true
methods:
  - name: health
    signature: 'health(): string'
    returns: string
    description: >-
      The relation's health in one word, the same on the canvas's edges and on the hosted Relations
      tab: `incompatible` when a used member changed or was removed (stale); else `unavailable` when
      anything could not be compared — the producer unreachable or out of reach, or any use
      unavailable or unlocked (used now, not in the lock); else `drifted` when the producer's
      content moved since the pin while nothing used changed; else `ok` — only when the producer was
      read and every use compared unchanged. A known break outranks the unknown, and the unknown
      outranks a benign change, so nothing that could not be checked ever reads as ok. Pure: over
      the status's own fields.
    symbol: relationHealth
sourcePath: src/models/specs.ts
