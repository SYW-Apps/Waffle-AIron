  - name: members
    description: A class's members and who may reach them
  - name: imports
    description: The module's imports, resolvable to the project's modules
  - name: calls
    description: A function's call sites, by the receivers the code declares
  - name: routes
    description: The routes each router object answers, read off its route decorators
  - name: types
    description: >-
      The fields of each declarative data class: a dataclass, a Pydantic model, a TypedDict, a
