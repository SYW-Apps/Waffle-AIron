kind: value-object
id: project_migration
name: ProjectMigration
description: >-
  What the chaining migration writes into one project of the family — its owner's share of the plan:
  the id to declare, the minimal L0 to create, the L0 entries to add, the externals to declare, the
  aliases to pin, the legacy mounts to move into its `members`, and the stage-1 family pins to
  delete.
subsystem: sdd_cli
fields:
  - name: project
    type: string
    description: The project's key in the family graph ('' is the top root).
    optional: false
    key: primary
  - name: directory
    type: string
    description: The project's root directory, absolute — the root apply binds to write it.
    optional: false
  - name: id
    type: string
    description: 'The id the project answers to after apply: its declared id, or the one planned for it.'
    optional: true
  - name: idToWrite
    type: string
    description: >-
      The id apply declares in its project.yaml; absent when it declares one already or its id is
      reported.
    optional: true
  - name: exports
    type: PlannedExport[]
    description: >-
      The L0 entries apply adds: re-exports for the references other projects make, own `{ typeDef
      }` entries for the project-level types they use, and the entries carried from its legacy
      mount, in source then item order (own types first).
    optional: false
  - name: externals
    type: PlannedExternal[]
    description: The externals apply declares in its project.yaml, in alias order.
    optional: false
  - name: pins
    type: string[]
    description: >-
      The aliases apply pins once every write is done: each planned external, and each existing one
      whose producer gains entries this project uses.
    optional: false
  - name: supersededPins
    type: string[]
    description: >-
      The storage keys of its stage-1 family pins in .wai/surfaces (the parent's family surface and
      every sibling pin): nothing reads them since stage 3, so apply deletes them once the externals
      they are replaced by are pinned. The report prints them as one line per project with their
      count, never one line per pin.
    optional: false
  - name: createsSystem
    type: boolean
    description: >-
      Whether apply writes a minimal L0 first: the project gains export entries and has no L0 of its
      own. The minimal L0 is new content, so it goes through the gated authoring seam: its name is
      the project's display name, its vision the description the parent gives the member (or one
      line naming it an exporting project when there is none), and nothing else.
    optional: false
  - name: members
    type: PlannedMember[]
    description: >-
      The legacy L1 mounts apply moves into this project's `members`, each with what it carries, in
      declaration order.
    optional: false
methods: []
sourcePath: src/commands/chaining-migration.ts
