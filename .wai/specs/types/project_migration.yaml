kind: value-object
id: project_migration
name: ProjectMigration
description: >-
  What the chaining migration writes into one project of the family — its owner's share of the plan:
  the id to declare, the L0 re-export entries to add, the externals to declare, the aliases to pin,
  and the stage-1 sibling pins those supersede.
subsystem: sdd_cli
fields:
  - name: project
    type: string
    description: The project's namespace in the family graph ('' is the top root).
    optional: false
    key: primary
  - name: directory
    type: string
    description: The project's root directory, absolute — the root apply binds to write it.
    optional: false
  - name: id
    type: string
    description: 'The id the project answers to after apply: its declared id, or the one planned for it.'
    optional: true
  - name: idToWrite
    type: string
    description: >-
      The id apply declares in its project.yaml; absent when it declares one already or its id is
      reported.
    optional: true
  - name: exports
    type: PlannedExport[]
    description: >-
      The re-export entries apply adds to its L0 publicInterfaces, in source-subsystem then item
      order.
    optional: false
  - name: externals
    type: PlannedExternal[]
    description: The externals apply declares in its project.yaml, in alias order.
    optional: false
  - name: pins
    type: string[]
    description: >-
      The aliases apply pins once every write is done: each planned external, and each existing one
      whose producer gains entries this project uses.
    optional: false
  - name: supersededPins
    type: string[]
    description: >-
      The storage keys of its stage-1 sibling pins in .wai/surfaces: they held L1 items the parent
      never exported, and the planned exports serve those references now. Left on disk — stage-1
      resolution still reads them until stage 3.
    optional: false
methods: []
createdAt: '2026-09-26T21:11:55.782Z'
updatedAt: '2026-09-26T21:11:55.784Z'
