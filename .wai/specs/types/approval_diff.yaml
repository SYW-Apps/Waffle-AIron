kind: value-object
id: approval_diff
name: ApprovalDiff
description: >-
  What changed in a spec tree since it was approved, as lists of paths rather than a count. The
  lists are the answer: a caller deciding whether to re-lock needs to say WHICH specs moved, and a
  number cannot. `unchangedPaths` is carried alongside the change lists so a reader can see the
  whole approval, not only its edges, and `moved` names the specs whose storage moved while their
  content did not.
fields:
  - name: added
    type: list<string>
    description: Spec paths present now that the approval does not cover.
    optional: false
  - name: changed
    type: list<string>
    description: Spec paths the approval covers whose content digest no longer matches.
    optional: false
  - name: removed
    type: list<string>
    description: Spec paths the approval covers that are no longer on disk.
    optional: false
  - name: unchangedPaths
    type: list<string>
    description: Spec paths whose digest still matches what was approved.
    optional: false
  - name: moved
    type: list<string>
    description: >-
      Specs whose storage moved with their content unchanged — a part's folder relocating them —
      each written `<approved path> -> <path now>`. A move is no design change: it is in none of the
      three change lists, its new path counts among unchangedPaths, and diffSize leaves it out, so
      `wairon lock` and `wairon lock-check` agree that a storage move changed nothing.
    optional: false
methods:
  - name: diffSize
    signature: 'diffSize(): number'
    returns: int
    description: >-
      How many specs moved: added plus changed plus removed, ignoring what stayed put. Pure
      arithmetic over the type's own fields, so it lives here rather than on the component that
      builds it — a caller holding a diff should not have to reach for a service to count it.
sourcePath: src/core/approval.ts
