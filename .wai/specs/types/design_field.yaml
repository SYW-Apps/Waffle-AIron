kind: value-object
id: design_field
name: DesignField
description: One field of an exported entity or value-object, in declared order.
subsystem: sdd_surfaces
fields:
  - name: name
    type: string
    description: The field's name, its key inside its type
    optional: false
  - name: type
    type: DesignTypeRef
    description: Its type
    optional: false
  - name: optional
    type: bool
    description: Whether the field may be left out
    optional: false
  - name: description
    type: string
    optional: true
  - name: key
    type: string
    description: primary, unique or foreign, when the field is an identity marker
    optional: true
  - name: references
    type: string
    description: For a foreign key, the referenced type key and optional field
    optional: true
  - name: formerly
    type: list<string>
    description: >-
      The field's rename trace: every name it held before, oldest first (the field's previousNames).
      Present only when it was renamed, so an export of a never-renamed field reads exactly as
      before
    optional: true
methods: []
