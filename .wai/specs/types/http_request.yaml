kind: value-object
id: http_request
name: HttpRequest
description: >-
  An inbound HTTP request at the hosting boundary: method, path, headers, and body. The transport
  shape the portals receive.
fields:
  - name: method
    type: string
    description: HTTP verb
    optional: false
  - name: path
    type: string
    description: Request path
    optional: false
  - name: headers
    type: list<string>
    description: Raw header lines (includes Authorization)
    optional: false
  - name: body
    type: string
    description: Raw request body
    optional: true
methods: []
lint:
  allow:
    - code: MISSING_TYPE_SOURCE_PATH
      reason: >-
        No wairon declaration: the hosting boundary receives Node's own http IncomingMessage
        (src/server/http.ts), a platform type, so no file of this project declares the shape.
