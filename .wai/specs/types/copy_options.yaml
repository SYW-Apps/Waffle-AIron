  - name: force
    type: bool
    description: Overwrite what exists at the destination
    optional: true
  - name: errorOnExist
    type: bool
    description: Throw when the destination exists and force is off
    optional: true
  - name: filter
    type: CopyFilter
    description: Which paths to copy
    optional: true
