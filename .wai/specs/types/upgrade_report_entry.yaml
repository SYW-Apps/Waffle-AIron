kind: value-object
id: upgrade_report_entry
name: UpgradeReportEntry
description: >-
  One finding of today's owner's gate that stage 4 changed, with the reason it is new. Every reason
  is computed from files that exist now; none is recalled from a previous run, because nothing
  records one.
subsystem: sdd_cli
fields:
  - name: project
    type: string
    description: The key of the project whose gate reported it ('' for the bound root)
    optional: false
  - name: code
    type: string
    description: The finding's code
    optional: false
  - name: severity
    type: string
    description: Its severity now
    optional: false
  - name: specId
    type: string
    description: The spec it is on, when it names one
    optional: true
  - name: reason
    type: UpgradeReason
    description: Why the upgrade changes the finding's verdict.
    optional: false
  - name: resolvedAs
    type: string
    description: >-
      For a positional finding: what the family's top matched the reference to, `<producer
      id>::<id>`
    optional: true
  - name: rewrite
    type: string
    description: >-
      For a positional finding: what the positional migration step writes — the `use` line
      (`externals.shared.use: [waffler-error]`), plus the producer's export and the consumer's
      external when missing; or the bare local id for a self-prefixed reference
    optional: true
methods: []
sourcePath: src/commands/verdict-changes.ts
createdAt: '2026-09-28T06:15:18.135Z'
updatedAt: '2026-10-04T23:40:53.036Z'
