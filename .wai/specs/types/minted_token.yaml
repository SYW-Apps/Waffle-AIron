kind: value-object
id: minted_token
name: MintedToken
description: >-
  The answer of an administrative token mint: the plaintext token, shown exactly once, and what the
  stored narrowing says when it differs from what was asked — each deprecated member-qualified entry
  and the member record id it was stored as, so the caller learns that the token now names the
  member's own record.
subsystem: sdd_host
fields:
  - name: token
    type: string
    description: The plaintext token, shown exactly once and never stored
    optional: false
  - name: mapped
    type: string[]
    description: >-
      One line per deprecated member-qualified entry: '<qualified entry> -> <member record id>'
      (e.g. 'platform::billing -> billing'); empty when every entry was stored as asked
    optional: false
methods: []
