kind: value-object
id: callers_to_review
name: CallersToReview
description: >-
  The callers of one contract method whose signature a write just changed: information for whoever
  made the change, never a finding and never a gate. A parameter added as optional, or a value of
  the right type that now means something else, is legal code the compiler and the gate both accept,
  so the moment of the change is the only one at which anything can point at the callers to look at.
  Capped so a widely called method stays readable: at most ten callers are listed, the total says
  how many the lookup found, and sdd_find_references lists them all.
fields:
  - name: method
    type: string
    description: The changed contract method, as <component>.<method>.
    optional: false
  - name: change
    type: string
    description: >-
      What changed in its signature, in one line: the parameters added, removed, retyped or made
      optional or required, the returns changed, or whether it completes later.
    optional: false
  - name: callers
    type: list<string>
    description: >-
      Up to ten callers, design first: each calling spec as <component>.<method> (a call, dispatch
      or register step, or a declared call), callers of an abstraction the method's component
      implements included, since they reach it through that abstraction, and, for a method of an
      abstraction, the callers of every abstraction below it that restates it, since they reach the
      same contract; then each code site the call graph resolved to it, as path:line.
    optional: false
  - name: total
    type: int
    description: How many callers the lookup found; more than callers lists when it was capped.
    optional: false
  - name: implementers
    type: list<string>
    description: >-
      For a method of an abstraction: each contract implementing it, at any depth, that restates the
      method with the signature it had before this write, as <contract>.<method>. Each will report
      IMPLEMENTS_MISMATCH until it restates the new signature (a hand edit follows nothing; renames
      do). Absent when there are none.
    optional: true
  - name: implementersLater
    type: list<string>
    description: >-
      The implementers in `implementers` that sit below another abstraction of the chain: they
      report IMPLEMENTS_MISMATCH only after the level above them is restated, while the others
      report it now. Absent when every implementer is direct
    optional: true
methods: []
sourcePath: src/core/specs.ts
