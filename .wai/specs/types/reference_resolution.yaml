kind: value-object
id: reference_resolution
name: ReferenceResolution
description: >-
  How one cross-project reference was resolved by the owner's gate, decided BEFORE any severity: the
  structured result a finding about that reference carries, so a reader (or a later stage) can tell
  a reference that is not exported from one that could not be compared without parsing prose. It is
  computed from the referring project's own files only — its scan (its own specs and its contained
  members' export tables), its externals lock and its pinned snapshots — so the same reference
  resolves the same way from every root. `resolved` means the reference lands on one public name the
  referrer may see, and the ordinary contract checks then apply to that entry; every other outcome
  is reported once, by the project-boundaries rule.
fields:
  - name: outcome
    type: string
    description: >-
      resolved (one public name whose audience covers the referrer, in a contained member's live
      export table or in the pinned snapshot of a declared external — written `alias::name`, or bare
      through a `use` import) | missing (the producer does not export that name or member:
      EXTERNAL_NOT_EXPORTED) | ambiguous (two imports supply one bare name: IMPORT_AMBIGUOUS; or
      several foreign surface snapshots expose a name with different contracts:
      SURFACE_REF_AMBIGUOUS) | unavailable (nothing to judge against: no pin for the alias, an
      unreadable pin, a member absent on disk, or a deprecated form naming no alias:
      EXTERNAL_CHECK_UNAVAILABLE, never a pass) | forbidden (the reference reaches a project the
      referrer does not declare as a member or an external, or a trusted link crosses into another
      project: EXTERNAL_UNDECLARED or TRUSTED_LINK_CROSSES_PROJECT)
    optional: false
  - name: owner
    type: string
    description: >-
      The referring project's id (its key when it has no usable id): the one project whose gate
      judges this reference
    optional: false
  - name: callSite
    type: string
    description: >-
      Where the reference is written: the referring spec id and the position in it (a dependsOn
      entry, a narrative step by number, a field or parameter type, a trusted link)
    optional: false
  - name: canonicalTarget
    type: string
    description: >-
      The target in producer-id form, `<producer id>::<public name>` with `.<member>` when a method
      or a type member is named; the reference as written when it lands nowhere
    optional: true
  - name: inputDigest
    type: string
    description: >-
      The digest of the input the reference was judged against: the pinned snapshot's content digest
      from the externals lock, or the content digest of a contained member's live export table.
      Absent when there was nothing to judge against
    optional: true
  - name: reason
    type: string
    description: One sentence saying why the outcome is what it is, in the words the finding repeats
    optional: false
  - name: importedVia
    type: string
    description: >-
      For a bare name resolved through an import: the alias whose `use` supplied it, and whether by
      name or by `*`
    optional: true
methods:
  - name: nameKey
    signature: 'nameKey(name: string): string'
    returns: string
    description: >-
      The one key a bare name is compared by, locally and through imports alike: lower-cased, with
      every character outside [a-z0-9] removed — so `WafflerError`, `waffler-error` and
      `waffler_error` are one name. It is the per-segment normalization type_spec.matchesRef already
      applies (normalizePart in src/models/type-references.ts, which this names), so a bare name
      that resolved locally before stage 4 resolves the same way now, and one the family-wide suffix
      match used to accept resolves through an import with the same spelling. Two public names of
      one producer that share a key are the producer's EXPORT_ID_DUPLICATE.
    sourcePath: src/models/type-references.ts
sourcePath: src/models/project-family.ts
