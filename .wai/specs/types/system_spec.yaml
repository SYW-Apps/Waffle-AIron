kind: value-object
id: system_spec
name: SystemSpec
description: >-
  L0 System specification, including optional system-level public surfaces that intentionally expose
  selected subsystem public interfaces across project or organization boundaries.
fields:
  - name: name
    type: string
    description: System name — the root identity of the spec tree
    optional: false
    key: primary
  - name: vision
    type: string
    description: One-paragraph statement of what the system is for
    optional: false
  - name: targetLanguage
    type: string
    description: Default implementation language for language-aware validation
    optional: true
  - name: boundaries
    type: string[]
    description: Declared system boundaries
    optional: false
  - name: globalRequirements
    type: string[]
    description: System-wide requirements every subsystem must honour
    optional: false
  - name: databases
    type: DatabaseSpec[]
    description: Database definitions at the system level, grouping type specs that serve as table schemas
    optional: true
  - name: diagram
    type: DiagramConfig
    description: Diagram rendering configuration for the interactive canvas
    optional: true
  - name: publicInterfaces
    type: SystemPublicInterface[]
    description: >-
      The project's gateway surface: L0 entries intentionally exported beyond the project, each
      backed by a subsystem-published Portal and carrying an audience ceiling. Cross-PROJECT
      consumption may only target these entries (never subsystem internals); the surface projector
      snapshots them at contract grade.
    optional: true
methods: []
createdAt: '2026-06-10T22:00:00.000Z'
updatedAt: '2026-07-10T23:12:00.493Z'
