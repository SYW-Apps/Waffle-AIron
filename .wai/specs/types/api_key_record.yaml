kind: entity
id: api_key_record
name: ApiKeyRecord
description: >-
  A persisted MCP/API credential: the hashed bearer token bound server-side to an owner identity and
  a projects narrowing. The token carries no permissions of its own — within its narrowing it acts
  as the owner user's live permission (the resolver gates per project). The plaintext key is shown
  once at mint time and never stored.
subsystem: sdd_host
fields:
  - name: id
    type: string
    description: Stable credential id (audit handle)
    optional: false
  - name: keyHash
    type: string
    description: Salted hash of the bearer token; compared in constant time
    optional: false
  - name: role
    type: string
    description: >-
      Legacy coarse display role ('editor'/'admin'), optional and display-only — NOT an authority
      source (authorization resolves from the owner's permissionSubject). Set by the legacy
      master-only mintKey path; unset by the user-bound mint flows.
    optional: true
  - name: projects
    type: string[]
    description: >-
      The token's project narrowing: the project ids this token may act on, or "*" for the owner's
      full accessible set. An entry MAY be subproject-qualified — 'projectId::subsystemId' (nested
      mounts compose, e.g. 'proj::a::b') — scoping the token INTO that chained subproject:
      data-plane requests then bind the mounted child root instead of the project root. The token
      carries no permissions of its own — within this narrowing it acts as the owner user's LIVE
      permission (the resolver gates per project; a subproject qualifier narrows reach, it never
      widens or refines grants).
    optional: false
  - name: createdAt
    type: string
    description: ISO-8601 mint timestamp
    optional: false
  - name: ownerSubject
    type: PrincipalSubject
    description: Human or service identity that owns this token.
    optional: true
  - name: createdBySubject
    type: PrincipalSubject
    description: Identity that minted this token, useful when an admin creates a token for someone else.
    optional: true
  - name: label
    type: string
    description: Human-readable label for token administration and audit screens.
    optional: true
  - name: expiresAt
    type: string
    description: Optional ISO-8601 expiration timestamp.
    optional: true
  - name: revokedAt
    type: string
    description: ISO-8601 revocation timestamp when the token has been revoked instead of hard-deleted.
    optional: true
methods: []
createdAt: '2026-07-04T12:44:18.552Z'
