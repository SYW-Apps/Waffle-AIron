kind: entity
id: api_key_record
name: ApiKeyRecord
description: >-
  A persisted MCP/API credential: the hashed bearer token bound server-side to an owner identity and
  a projects narrowing. The token carries no permissions of its own — within its narrowing it acts
  as the owner user's live permission (permission rules gate per project). The plaintext key is
  shown once at mint time and never stored.
subsystem: sdd_host
fields:
  - name: id
    type: string
    description: Stable credential id (audit handle)
    optional: false
  - name: keyHash
    type: string
    description: Salted hash of the bearer token; compared in constant time
    optional: false
  - name: role
    type: DisplayRole
    description: >-
      Legacy coarse display role, optional and display-only — NOT an authority source (authorization
      resolves from the owner's permissionSubject). Set by the legacy master-only mintKey path;
      unset by the user-bound mint flows.
    optional: true
  - name: projects
    type: list<string>
    description: >-
      The token's project narrowing: the hosted record ids this token may act on, or "*" for the
      owner's full accessible set. An entry naming a project covers that project and every member
      below it, transitively (projects nest like units), so a family root's entry reaches its
      members with no expansion. Since stage 7 a member is a record of its own; the upgrade rewrites
      every member-QUALIFIED entry ('projectId::alias', one alias per hop) to the member's record
      id, and a qualified entry left unrewritten still resolves for one release, to the member's
      record. The token carries no permissions of its own — within this narrowing it acts as the
      owner user's LIVE permission, resolved over each bound record's chain.
    optional: false
  - name: createdAt
    type: string
    description: ISO-8601 mint timestamp
    optional: false
  - name: ownerSubject
    type: PrincipalSubject
    description: Human or service identity that owns this token.
    optional: true
  - name: createdBySubject
    type: PrincipalSubject
    description: Identity that minted this token, useful when an admin creates a token for someone else.
    optional: true
  - name: label
    type: string
    description: Human-readable label for token administration and audit screens.
    optional: true
  - name: expiresAt
    type: string
    description: Optional ISO-8601 expiration timestamp.
    optional: true
  - name: revokedAt
    type: string
    description: ISO-8601 revocation timestamp when the token has been revoked instead of hard-deleted.
    optional: true
methods:
  - name: hashOf
    signature: 'hashOf(token: string): string'
    returns: string
    description: >-
      The keyHash a record stores for a plaintext bearer token: its salted SHA-256 digest under the
      credential store's namespace. Every minting and lookup site hashes the same way, so no record
      ever holds a plaintext token.
    sourcePath: src/server/credentials.ts
    symbol: hashToken
sourcePath: src/server/types.ts
