kind: value-object
id: complexity_rule_config
name: ComplexityRuleConfig
description: >-
  Complexity thresholds enforced by the SDD linter. Each field is an optional ceiling; when set,
  violations are reported as warnings or errors depending on sddRuleSeverity overrides.
fields:
  - name: maxMethodParams
    type: i32
    description: Non-negative integer maximum number of parameters per interface method
    optional: true
  - name: maxInterfaceMethods
    type: i32
    description: Non-negative integer maximum number of methods per interface
    optional: true
  - name: maxNarrativeSteps
    type: i32
    description: >-
      Non-negative integer maximum number of narrative steps per method, reported as a warning.
      Defaults to 25 when unset.
    optional: true
  - name: maxComponentDependencies
    type: i32
    description: Non-negative integer maximum number of dependsOn entries per component
    optional: true
  - name: maxSubsystemComponents
    type: i32
    description: Non-negative integer maximum number of components per subsystem
    optional: true
  - name: narrativeStepsHardMax
    type: i32
    description: >-
      Non-negative integer step count above which a narrative is an error rather than a warning. No
      default: unset means the step count only ever warns.
    optional: true
  - name: cognitiveWarnAbove
    type: string
    description: >-
      The complexity band a narrative may reach before it warns: linear, simple, moderate, complex
      or severe. Defaults to moderate, so complex and severe warn.
    optional: true
  - name: maxCognitiveLevel
    type: string
    description: >-
      The band above which a narrative is an error rather than a warning. No default: unset means
      the cognitive band only ever warns.
    optional: true
methods: []
sourcePath: src/models/project.ts
