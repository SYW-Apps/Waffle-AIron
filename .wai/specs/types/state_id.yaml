kind: value-object
id: state_id
name: StateId
description: >-
  The deterministic identity of a spec-tree state. Two states with identical content produce the
  same StateId; any change alters it. Flavours are distinguished by `algorithm` so they can never
  compare equal: the CONTENT identity over the spec tree alone (surface/landscape snapshot stamps),
  the DESIGN identity of a project's own specs (state_hash.ownDesign, code linkage and readiness
  out), and the APPROVAL identity a lock records and every staleness check recomputes — the
  project's own design together with its policy (type, design rule tuning, composition, network,
  pack selections). Nothing a project consumes is in the approval identity: those are build inputs.
fields:
  - name: algorithm
    type: string
    description: >-
      Algorithm identifier, also distinguishing the flavour: "sha256" = spec-tree content only;
      "sha256-design-2" = a project's own design; "sha256+design+policy" = the approval identity.
      equals compares this field, so two flavours never match.
    optional: false
  - name: digest
    type: string
    description: >-
      Hex digest over the canonicalized content (the spec tree; for the approval flavour the own
      design digest and the policy projection)
    optional: false
  - name: parts
    type: map<string, string>?
    description: >-
      On an approval identity only: the digest of each half it covers, taken on its own
      (gate_identity.parts) — `design` (the own design), `rules` (projectType and the design rule
      tuning), `composition`, `network` (absent when none is declared) and `selections` (the packs
      selected by name, declared version and scope). Never part of the digest; a lock records them
      as `parts`, so a later check can say WHICH half moved.
    optional: true
methods:
  - name: equals
    signature: 'equals(other: StateId | null | undefined): boolean'
    returns: bool
    description: >-
      Whether two state ids name the same state: the same algorithm and the same digest. An absent
      id equals nothing, not even another absent one.
    symbol: stateIdEquals
sourcePath: src/core/statehash.ts
