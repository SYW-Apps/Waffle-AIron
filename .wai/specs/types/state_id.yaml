kind: value-object
id: state_id
name: StateId
description: >-
  The deterministic content identity of a spec-tree state. Two states with identical content produce
  the same StateId; any change alters it. Two flavours exist, distinguished by `algorithm` so they
  can never compare equal: the CONTENT identity over the spec tree alone (surface/landscape snapshot
  stamps and freshness comparisons, where doctrine is irrelevant), and the GATE identity over the
  spec tree PLUS the governing doctrine (pack identities, profiles, languages, patterns, guarantees,
  assertions, rule codes) — what the commit-scoped lock record is scoped to and what every staleness
  re-check recomputes, because a lock asserts that these specs pass THIS gate.
fields:
  - name: algorithm
    type: string
    description: >-
      Hash algorithm identifier, also distinguishing the flavour: "sha256" = spec-tree content only;
      "sha256+doctrine" = tree plus governing doctrine. stateIdEquals compares this, so a
      content-only identity never satisfies a gate comparison — which is what makes lock records
      written before doctrine coverage read as stale instead of as valid.
    optional: false
  - name: digest
    type: string
    description: >-
      Hex digest over the canonicalized content (spec tree, plus the doctrine projection for the
      gate flavour)
    optional: false
methods: []
