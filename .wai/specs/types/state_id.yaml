kind: value-object
id: state_id
name: StateId
description: >-
  The deterministic identity of a spec-tree state. Two states with identical content produce the
  same StateId; any change alters it. Two flavours exist, distinguished by `algorithm` so they can
  never compare equal: the CONTENT identity over the spec tree alone (surface/landscape snapshot
  stamps, where doctrine is irrelevant), and the GATE identity a lock records and every staleness
  re-check recomputes — the project's OWN spec content, the governing design doctrine, the consumed
  contract inputs of its own root, its `composition`, and each direct member's composition subject —
  because a lock asserts that these specs pass THIS gate against THESE inputs.
fields:
  - name: algorithm
    type: string
    description: >-
      Algorithm identifier, also distinguishing the flavour: "sha256" = spec-tree content only;
      "sha256+content+doctrine+inputs+members" = the stage-5 gate identity. Earlier gate markers
      ("sha256+doctrine+inputs", "sha256+content+doctrine+inputs") are no longer produced;
      stateIdEquals compares this field, so a lock taken under an earlier marker reads stale once
      (LockStatus.upgraded) instead of passing.
    optional: false
  - name: digest
    type: string
    description: >-
      Hex digest over the canonicalized content (the spec tree, plus for the gate flavour the
      doctrine projection, the consumed contract inputs, the composition block and the members'
      subjects)
    optional: false
methods:
  - name: equals
    signature: 'equals(other: StateId | null | undefined): boolean'
    returns: boolean
    description: >-
      Whether two state ids name the same state: the same algorithm and the same digest. An absent
      id equals nothing, not even another absent one.
    symbol: stateIdEquals
sourcePath: src/core/statehash.ts
