kind: value-object
id: build_freshness
name: BuildFreshness
description: >-
  Whether a running MCP server still runs the build on disk, and whether a spec write through it may
  proceed. A rebuild that left the spec and tool schemas alone only earns a warning; one that
  changed them refuses every spec write, because a server holding the old schemas silently drops the
  fields only the new build knows.
subsystem: sdd_mcp
fields:
  - name: state
    type: BuildFreshnessState
    description: Whether the build on disk is still the one this server runs, and whether its schemas moved.
    optional: false
  - name: writesRefused
    type: bool
    description: >-
      True for schema-changed and unreadable: every spec write tool refuses and writes nothing until
      the server is reconnected.
    optional: false
  - name: reason
    type: string
    description: >-
      The sentence the answers carry: what changed, and what the human has to do about it. Empty
      when fresh.
    optional: false
methods: []
sourcePath: src/mcp/server.ts
createdAt: '2026-09-26T00:24:02.946Z'
updatedAt: '2026-10-04T23:38:51.517Z'
