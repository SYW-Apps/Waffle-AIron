kind: value-object
id: membership_screen
name: MembershipScreen
description: >-
  What the hosted data plane learns before it dispatches a membership-changing tool it does not
  serve itself: for attach and adopt, the principals whose reach the change alters — every subject x
  capability whose effective permission over the incoming member differs once its parent link is
  added (they gain the bound project's access by inheritance); for a project rename, whether the
  hosted model refuses it. A dry run's result carries the list; reconcile audits the applied change.
  A hosted detach is not screened: member registration serves it whole (it relocates the member).
subsystem: sdd_host
fields:
  - name: refusal
    type: string
    description: >-
      Why the hosted model refuses the call, when it does: sdd_rename_project bound at a family root
      (renaming a hosted project record is an admin operation outside the family migrations)
    optional: true
  - name: reachChanges
    type: ReachComparison[]
    description: The rows whose before and after differ
    optional: false
methods: []
