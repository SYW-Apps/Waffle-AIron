kind: value-object
id: membership_screen
name: MembershipScreen
description: >-
  What the hosted data plane learns before it dispatches a membership-changing tool it does not
  serve itself: for attach, promote and an externalize as a project, the principals whose reach the
  change alters — every subject x capability whose effective permission over the incoming member
  differs once its parent link is added (they gain the bound project's access by inheritance); for
  promote and an externalize as a project, also every subsystem setting the move carries onto the
  new project; for a project rename, whether the hosted model refuses it. A dry run's result carries
  the list; reconcile audits the applied change. A hosted detach or adopt is not screened: member
  registration serves each whole (they relocate the project).
subsystem: sdd_host
fields:
  - name: refusal
    type: string
    description: >-
      Why the hosted model refuses the call, when it does: sdd_rename_project bound at a family root
      — "renaming a hosted family root's id is not supported; a member can be renamed, or the root
      recreated"
    optional: true
  - name: reachChanges
    type: list<ReachComparison>
    description: The rows whose before and after differ
    optional: false
  - name: carried
    type: list<CarriedSubsystemRule>
    description: >-
      Promote and an externalize as a project: every subsystem setting of the bound project the move
      carries onto the new project — carried, collapsed (most restrictive wins), or a role binding
      not carried (can only narrow)
    optional: true
methods: []
createdAt: '2026-10-01T16:55:21.624Z'
updatedAt: '2026-10-04T10:20:26.699Z'
