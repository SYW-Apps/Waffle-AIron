kind: value-object
id: network_command_options
name: NetworkCommandOptions
description: The parsed arguments and flags of the `wairon network` commands.
subsystem: sdd_cli
fields:
  - name: format
    type: string
    description: >-
      --format: json (default), csv or markdown for flows; kubernetes-network-policy (default) for
      policy
    optional: true
  - name: bindings
    type: string
    description: >-
      --bindings <file>: the team's bindings file, kept outside .wai/ (required by policy; optional
      for check)
    optional: true
  - name: observed
    type: string
    description: '--observed <file>: the observed-flow export (check)'
    optional: true
  - name: out
    type: string
    description: '--out <file>: write the output there instead of stdout'
    optional: true
  - name: from
    type: string
    description: 'why: the caller, a project, project::component or outside'
    optional: true
  - name: to
    type: string
    description: 'why: the callee, a project, project::portal or project::portal.verb'
    optional: true
  - name: recursive
    type: bool
    description: '--no-recursive: the bound project alone instead of its family'
    optional: true
  - name: description
    type: string
    description: >-
      declare --description: what the network encloses, in the project's words; shown on the network
      diagram
    optional: true
methods: []
sourcePath: src/commands/network.ts
createdAt: '2026-10-06T13:12:51.479Z'
updatedAt: '2026-10-06T23:05:46.290Z'
