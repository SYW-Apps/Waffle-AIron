kind: enum
id: permission_source
name: PermissionSource
description: Which source decided an effective permission.
subsystem: sdd_host
fields: []
methods: []
sourcePath: src/server/types.ts
values:
  - name: instance-admin
    description: The env-anchored built-in super-admin bypass
  - name: user
    description: A direct assignment to the user
  - name: role
    description: A role bound to the user
  - name: everyone-default
    description: A scope's everyone assignment
  - name: instance-default
    description: Nothing decided; the instance default applied
  - name: key-narrowing
    description: >-
      The API key the request came with is narrowed to projects that do not cover the target, so its
      owner's permissions do not apply there
  - name: key-read-only
    description: >-
      The API key the request came with is read-only, and the capability is not project:read, so its
      owner's permissions do not apply
