kind: value-object
id: policy_evaluation_result
name: PolicyEvaluationResult
description: >-
  Result of evaluating a hosted project against instance pack/profile policy. Used before
  initialization, lock, or reconciliation to decide whether the project is compliant, warning-only,
  blocked, or needs automatic pack/profile changes.
fields:
  - name: compliant
    type: bool
    description: Whether the project satisfies the active instance policy.
    optional: false
  - name: mode
    type: PackEnforcementMode
    description: Policy mode that produced the result.
    optional: false
  - name: missingPackNames
    type: list<string>
    description: Required/default packs absent from the project or global scope.
    optional: false
  - name: blockedPackNames
    type: list<string>
    description: Blocked packs found in the project or requested selection.
    optional: false
  - name: missingProfileIds
    type: list<string>
    description: Required profile ids absent from the project selection.
    optional: false
  - name: messages
    type: list<string>
    description: Human-readable warnings or blocking reasons.
    optional: false
  - name: unresolvedPacks
    type: list<string>
    description: >-
      Required/default packs the active instance pack set cannot resolve at all — absent from BOTH
      server-global tiers (or a directory/name-mismatch the resolver cannot map). Distinct from
      missingPackNames (resolvable, just not yet installed into the project): an unresolved pack
      cannot be remedied by reconciliation and signals an instance-side gap (a policy naming a pack
      that was never installed globally). Surfaced so evaluate and reconcile report honestly instead
      of silently skipping.
    optional: false
  - name: governingProfileId
    type: string
    description: >-
      The project's effective projectType at evaluation time — the architectural profile actually
      governing its components. Absent for an init-request evaluation (no project exists yet).
      Reported so a selection recorded but never applied is visible: profile compliance is about the
      recorded selection, while this is what the validator really enforces.
    optional: true
  - name: unappliedProfileIds
    type: list<string>
    description: >-
      Profile ids present in the project's recorded profileSelection that are not the governing
      projectType. Empty for an init-request evaluation. A non-empty list is the honest report of
      selection-versus-reality drift: reconciliation applies the first resolvable one when instance
      policy requires a profile that is not governing, or when the recorded projectType resolves to
      no loaded profile — a deliberate, resolvable, policy-compliant choice is reported here and
      left alone.
    optional: false
  - name: impacts
    type: list<PackImpact>
    description: >-
      Per pack a reconcile applies (or, from an evaluation, would apply under auto_reconcile): its
      impact on the project, measured before the write against the configuration as it stood
      (pack_impact.measure with the resolved declarative content supplied). A reconcile is an
      unattended policy write, so it shows no report beforehand; these are how its result states
      what it changed. Empty when nothing is, or would be, applied.
    optional: true
  - name: doctrine
    type: list<PackDoctrine>
    description: >-
      evaluateInitRequest only: per required/default pack the init would apply, what it changes
      against wairon's defaults — the doctrine half ALONE. There is deliberately no finding diff:
      the project does not exist yet, so there is nothing to validate before or after. The executed
      init reports the full impacts in its GovernedProjectCreation.
    optional: true
methods: []
sourcePath: src/server/types.ts
