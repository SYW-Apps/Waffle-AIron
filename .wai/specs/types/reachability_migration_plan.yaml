kind: value-object
id: reachability_migration_plan
name: ReachabilityMigrationPlan
description: >-
  The reachability migration of one project, planned and (with apply) written: each rewrite with the
  spec it touches, and what it reports instead of guessing.
subsystem: sdd_core
fields:
  - name: rewrites
    type: list<ReachRewrite>
    description: Every rewrite, in spec order
    optional: false
  - name: reported
    type: list<ReachRewrite>
    description: >-
      What it will not decide for the author, and why: an endpoint outside every old prefix, a
      dropped sibling-subsystem declaration whose caller is not modelled, a dropped export type that
      disagreed with the derived one or that no Portal derives, a portalType that named no
      transport. Never a form left in place: wairon 6 cannot read one
    optional: false
  - name: applied
    type: bool
    description: Whether the rewrites were written
    optional: false
methods: []
sourcePath: src/core/reachability-migration.ts
createdAt: '2026-10-06T13:06:43.847Z'
updatedAt: '2026-10-20T18:38:26.785Z'
