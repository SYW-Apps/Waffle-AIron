kind: value-object
id: lint_config
name: LintConfig
description: >-
  A spec's own answers to the validator: the findings it has looked at and accepted. Held per spec
  rather than centrally so the acknowledgement sits where the design decision it defends lives, and
  a reader of the spec sees it without going looking.
fields:
  - name: allow
    type: LintAllow[]
    description: The acknowledged findings. Always present, empty when the spec accepts nothing
    optional: false
methods: []
