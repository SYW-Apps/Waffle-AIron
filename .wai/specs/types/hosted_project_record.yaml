kind: entity
id: hosted_project_record
name: HostedProjectRecord
description: >-
  A registered hosted project: maps a project id to its .wai/ root. This is the isolation unit for
  request scoping, permissions, audit, approval and git binding. Since stage 7 a family's members
  are records too: a member record carries parentProjectId and memberPath and is a project for every
  hosted operation — its own audit, approval page, status, lock requests and data-plane binding.
  Projects nest like organization units: a member's permission chain is its own project scope, then
  its parent's, up to its family root, then the family root's unit placements, then the instance —
  so access to a project reaches all its members transitively, and the most specific setting wins
  (an explicit no on the member's own record beats anything inherited). A member record never copies
  its parent's directory: its root is the parent's root plus memberPath, derived on read.
subsystem: sdd_host
fields:
  - name: id
    type: string
    description: URL-safe project id (validated against path traversal)
    optional: false
  - name: rootPath
    type: string
    description: >-
      Absolute filesystem root of the project's .wai/ tree. Persisted for a family root (its
      isolated root under the data directory, or the dev server's working tree); for a member record
      NEVER persisted — the project index derives it as the parent's root joined with memberPath
      through the containment guard, so moving a family's directory moves its members with it.
    optional: false
  - name: status
    type: string
    description: 'Lifecycle status: "active" or "disabled"'
    optional: false
  - name: createdAt
    type: string
    description: ISO-8601 provisioning timestamp
    optional: false
  - name: displayName
    type: string
    description: Human-readable project name for hosted UI, token administration, and audit views.
    optional: true
  - name: description
    type: string
    description: >-
      Short hosted-instance description of the project; not a replacement for the project's own L0
      spec.
    optional: true
  - name: createdBySubject
    type: PrincipalSubject
    description: Identity that provisioned the hosted project.
    optional: true
  - name: ownerSubject
    type: PrincipalSubject
    description: Primary responsible identity for project administration.
    optional: true
  - name: tags
    type: string[]
    description: Optional instance-level tags for filtering projects in hosted UI and audit views.
    optional: true
  - name: environment
    type: string
    description: Optional environment label such as "development", "staging", or "production".
    optional: true
  - name: ownerUnitId
    type: string
    description: Primary organization unit responsible for this hosted project, if one is assigned.
    optional: true
  - name: placementIds
    type: string[]
    description: ProjectPlacement ids that place or share this project across hosted organization units.
    optional: true
  - name: mcpServerDisplayName
    type: string
    description: >-
      Optional MCP server display name for clients that cannot override server names. Defaults to
      "Wairon - <displayName or id>" when omitted.
    optional: true
  - name: parentProjectId
    type: string
    description: >-
      The record id of the project that declares this one as a member (its project.yaml `members`);
      absent for a family root. Names the crumb to the parent and the next rung of the member's
      permission chain.
    optional: true
  - name: memberPath
    type: string
    description: >-
      The member's path relative to its parent's root, forward slashes, exactly as the parent
      declares it; present iff parentProjectId is. The member's alias is not stored: the parent's
      project.yaml owns it.
    optional: true
methods: []
sourcePath: src/server/types.ts
