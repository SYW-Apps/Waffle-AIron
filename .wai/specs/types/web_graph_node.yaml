kind: value-object
id: web_graph_node
name: WebGraphNode
description: >-
  A single node in a level-of-detail (LOD) web graph payload for the unified web UI. Unifies the
  hosted landscape/environment tier (organization units nested org→dept→team, hosted projects) and
  the project tier (subsystems, components, interfaces, types) into one node shape the client
  renders at a chosen depth, as either the whole-environment collapsible hierarchy or a project's
  canvas. Kept consistent with LandscapeNode (landscape tier maps onto it) and the local GraphNode
  (project tier), adding only the LOD/UI fields (level, parentId, issueCount, actionable).
fields:
  - name: id
    type: string
    description: Stable graph node id, unique within the payload.
    optional: false
  - name: label
    type: string
    description: Display label.
    optional: false
  - name: kind
    type: string
    description: >-
      Node kind: "unit" | "project" | "subsystem" | "component" | "interface" | "implementation" |
      "type".
    optional: false
  - name: level
    type: number
    description: >-
      Level-of-detail depth of this node: 0 = landscape/organization tier (units, projects), 1 =
      subsystem, 2 = component (L2), 3 = interface/type (L3), 4 = implementation (L4). The client
      shows nodes whose level is at or below the requested detail level.
    optional: false
  - name: parentId
    type: string
    description: >-
      Id of the containing node, for hierarchical expand/collapse. Spans the full environment tree:
      unit→unit (nested organization hierarchy over the qualified unit paths), unit→project,
      project→subsystem, subsystem→component, component→interface. Absent only at the environment
      root.
    optional: true
  - name: projectId
    type: string
    description: >-
      Hosted project id this node belongs to, when it represents a project or one of its inner
      specs.
    optional: true
  - name: status
    type: string
    description: Optional lifecycle/status label for filtering and styling (e.g. spec completeness).
    optional: true
  - name: issueCount
    type: number
    description: Number of validator issues overlaid onto this node (project tier), 0 or absent when clean.
    optional: true
  - name: actionable
    type: boolean
    description: >-
      True when the caller can act on this scope. False/absent on an ancestor-breadcrumb (context)
      unit shown read-only only so the tree stays navigable to a deeper actionable scope (the no@org
      + yes@one-project case) — its non-visible children are omitted. An instance-admin sees every
      node actionable. Carried through from LandscapeNode.actionable on the landscape tier.
    optional: true
methods: []
