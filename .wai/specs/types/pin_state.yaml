kind: enum
id: pin_state
name: PinState
description: How the parent's lock pinned a member.
fields: []
methods: []
sourcePath: src/models/lock.ts
values:
  - name: matches
    description: >-
      The parent's record carries this member's subject (its members entry, or for one release its
      legacy children entry)
  - name: moved
    description: The parent recorded another subject, so the parent's own lock is stale until it re-locks
  - name: unpinned
    description: The parent has no lock, or its lock names no pin for this alias
