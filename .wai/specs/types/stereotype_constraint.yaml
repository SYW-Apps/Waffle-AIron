kind: value-object
id: stereotype_constraint
name: StereotypeConstraint
description: >-
  A profile's constraint on component stereotypes: the stereotype names it forbids or discourages,
  with a stated reason. Used by both the forbidden and discouraged lists of a ProfileDef.
fields:
  - name: types
    type: list<string>
    description: Stereotype names this constraint applies to (e.g. Actor, Supervisor).
    optional: false
  - name: reason
    type: string
    description: Why the governing profile forbids or discourages these stereotypes.
    optional: false
methods: []
lint:
  allow:
    - code: MISSING_TYPE_SOURCE_PATH
      reason: >-
        No named declaration: the shape is the inline zod object of ProfileDefSchema's
        forbiddenStereotypes and discouragedStereotypes arrays in src/core/extensions.ts, so there
        is no symbol a sourcePath could bind.
