kind: value-object
id: type_dialect
name: TypeDialect
description: >-
  One language's reading and writing of the neutral type grammar: the seam through which code
  conformance and implementer briefs meet a language without the design ever speaking it. read turns
  the language's own spelling of a type into the canonical expression; write gives the language's
  idiomatic spelling of a canonical one. The TypeScript dialect ships first, and its reader IS the
  alias table type_expression.parse normalises input with — one table, so normalising a spec and
  reading code can never drift apart — plus the loose readings only code needs: `number` agrees with
  int and float alike (TypeScript cannot tell them apart), `T | undefined` with `T?`, and a code
  annotation T with a contract's `result<T, E>`. Its writer: string, boolean, Uint8Array, number for
  int and float, string (ISO 8601) for date, datetime and duration, T[], Set<T>, Record<K, V>, `T |
  null`, `A | B`, Promise<T>, T for `result<T, E>` (the function returns T and throws E on failure —
  TypeScript has no checked failure type, so E is the error it throws and conformance never compares
  it), an enum as a string-literal union alias, unknown for any. A dialect is code shipped beside
  the analyzer that reads that language, never configuration: a future analyzer brings its own (for
  Rust: Vec<T> to list, HashMap to map, HashSet to set, Option<T> to `T?`, Result<T, E> to result<T,
  E>, String to string, the sized integers to int, f32/f64 to float, Vec<u8> to bytes, async fn to
  async). The omittable marker (`x?: T`) and the async modifier are what the code's position says,
  not its type, so the analyzer reports them as facts of their own (parameter_fact.optional,
  source_file_facts.asyncFunctions) rather than through read.
fields:
  - name: language
    type: string
    description: The language this dialect reads and writes, as the code analyzer names it (typescript)
    optional: false
methods:
  - name: forLanguage
    signature: 'forLanguage(language: string): TypeDialect?'
    params:
      - name: language
        type: string
        description: The effective language a source file was analyzed as, or an L4 technology's language
    returns: TypeDialect?
    description: >-
      The dialect shipped for a language, or none when no dialect reads it yet — a conformance check
      then stays silent rather than guess.
    symbol: typeDialectFor
  - name: read
    signature: 'read(annotation: string): TypeExpression?'
    params:
      - name: annotation
        type: string
        description: The annotation as the code writes it, whitespace-normalised
    returns: TypeExpression?
    description: >-
      The canonical expression a code annotation spells, or none when the annotation has no
      canonical reading (a type the grammar leaves out); none is silence for every caller, never a
      finding.
  - name: agrees
    signature: 'agrees(annotation: string, expression: TypeExpression, codeNames: map<string, string>): bool'
    params:
      - name: annotation
        type: string
        description: The annotation as the code writes it
      - name: expression
        type: TypeExpression
        description: The spec's canonical expression
      - name: codeNames
        type: map<string, string>
        description: Each type id (bare and subsystem-qualified) to the code-level name realizing it
    returns: bool
    description: >-
      Whether a code annotation and a canonical spec expression describe the same type: the
      annotation read through this dialect equals the expression, a named type matching through its
      code-level name, and this dialect's loose readings counting as agreement — in TypeScript a
      `result<T, E>` agrees with an annotation of T (its failure is thrown, so E is never compared).
      An annotation it cannot read never agrees.
  - name: write
    signature: 'write(expression: TypeExpression): string'
    params:
      - name: expression
        type: TypeExpression
        description: The canonical expression
    returns: string
    description: This language's idiomatic spelling of a canonical expression.
  - name: mappingLines
    signature: 'mappingLines(): list<string>'
    params: []
    returns: list<string>
    description: >-
      The write table as lines an implementer brief carries (`list<T> → T[]`, `T? → T | null`,
      `async T → Promise<T>`, `result<T, E> → T, throwing E`, an enum → a string-literal union
      alias, a named scalar → a type alias of its primitive, ...), so an implementer maps a
      contract's types by rule rather than by guess.
  - name: mappingFor
    signature: 'mappingFor(language: string): list<string>?'
    params:
      - name: language
        type: string
        description: >-
          The language an implementer writes in: an analyzer language key, a technology name, or the
          L0 targetLanguage
    returns: list<string>?
    description: >-
      The write table an implementer brief carries for a language: a shipped dialect's mappingLines
      when one reads the language, else a MAPPING-ONLY table shipped for it — Rust (String, i64,
      f64, bool, Vec<u8>, chrono types, Vec<T>, HashSet<T>, HashMap<K, V>, Option<T>, Result<T, E>,
      async fn, an enum, a newtype) and Python (str, int, float, bool, bytes, datetime types,
      list[T], set[T], dict[K, V], Optional / `T | None`, async def, raising E, an Enum, a NewType).
      A mapping-only table spells types for the implementer and nothing else: no analyzer reads that
      language's annotations, so code conformance does not compare them, and the table's last line
      says so. None for a language with neither.
    symbol: typeMappingFor
