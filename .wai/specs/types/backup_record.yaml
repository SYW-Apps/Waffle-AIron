kind: entity
id: backup_record
name: BackupRecord
description: >-
  Durable metadata for one hosted instance backup attempt. It records scope, state, target
  reference, and verification result without storing archive bytes or credentials in the spec tree.
subsystem: sdd_host
fields:
  - name: id
    type: string
    description: Stable backup record id.
    optional: false
  - name: scope
    type: string
    description: 'Backup scope: "instance" or a hosted project id.'
    optional: false
  - name: status
    type: string
    description: 'Backup status: "pending", "running", "succeeded", "failed", "pruned", or "restored".'
    optional: false
  - name: targetRef
    type: string
    description: Operator-safe target/archive reference. Must not contain raw credentials.
    optional: false
  - name: startedAt
    type: string
    description: ISO-8601 start timestamp.
    optional: false
  - name: completedAt
    type: string
    description: ISO-8601 completion timestamp.
    optional: true
  - name: createdBy
    type: PrincipalSubject
    description: Identity that triggered the backup, when available.
    optional: true
  - name: stateId
    type: StateId
    description: Project state id when the backup is project-scoped and available.
    optional: true
  - name: verified
    type: boolean
    description: Whether the backup archive was verified after write.
    optional: false
  - name: message
    type: string
    description: Redacted success/failure summary.
    optional: true
methods: []
createdAt: '2026-07-09T09:07:42.808Z'
updatedAt: '2026-07-09T09:07:42.860Z'
