kind: value-object
id: implementation_spec
name: ImplementationSpec
description: L4 Implementation specification
fields:
  - name: id
    type: string
    description: Implementation spec id
    optional: false
    key: primary
  - name: name
    type: string
    description: Human-readable implementation name
    optional: false
  - name: description
    type: string
    description: Implementation approach summary
    optional: false
  - name: contract
    type: string
    description: L3 interface id this implements
    optional: false
  - name: sourcePath
    type: string
    description: >-
      Concrete source file realizing it, relative to the root of the project that holds the spec —
      for a chained subproject's implementation, that subproject's own root
    optional: true
  - name: detail
    type: string
    description: 'Narrative detail default: full | calls-only | intent'
    optional: true
  - name: methods
    type: object[]
    description: >-
      Per-method L5 narratives (steps, detail, intent). A dispatch step routes a named capability
      through a target Portal's dispatch table — validated against that table (UNSERVED_CAPABILITY)
      and traversed by reachability, unlike a bare call to the generic handle. A register step
      (targetComponent + targetMethod, target resolved exactly like a call step against a declared
      dependency's contract) hands the target method to the runtime as a callback — a
      deferred-invocation edge: unused-detection treats the registered method as reached wherever
      its registering narrative is (so the callback correctly returns to unused if its registrar
      does), while call-graph conformance exempts register steps from CALL_STEP_UNREALIZED because a
      registration references the callback rather than invoking it. Each method may also override
      the conformance tier and bind an explicit realizing symbol (code-level name) for
      intent-language renames — e.g. a store's put realized by saveSnapshot.
    optional: false
  - name: status
    type: string
    description: draft | design | complete
    optional: true
  - name: conformance
    type: string
    description: >-
      Structural-conformance tier default for all contract methods: declared | anchored | off
      (omitted = stereotype default: Portal → anchored, else declared). off skips method realization
      checks; the sourcePath file-existence check always applies.
    optional: true
methods: []
