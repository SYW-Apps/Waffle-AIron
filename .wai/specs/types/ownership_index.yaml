kind: value-object
id: ownership_index
name: OwnershipIndex
description: >-
  Which pattern privately owns each member block — the tree's one ownership reading, derived once
  per run behind rule_context.ownershipIndex. The skips are semantics that decide findings, not
  shortcuts: a retired claimant records nothing (its migration decides what its owns becomes), a
  building block's claim records nothing (BLOCK_OWNS_MEMBERS is the whole finding, so the member it
  named stays standalone and its dependants are judged as if the claim were absent), an unresolved
  member records nothing (INVALID_OWNED_MEMBER), an inner pattern records nothing
  (PATTERN_OWNS_PATTERN — patterns compose at L1), and where two patterns claim one block the first
  claimant stays the owner so every later claim is reported against it.
subsystem: sdd_validator
fields:
  - name: ownedMembers
    type: Set<string>
    description: >-
      The member blocks a legal claim was made on — the domain of ownerOf; a block outside it is a
      facade or standalone
    optional: false
methods:
  - name: ownerOf
    signature: 'ownerOf(memberId: string): string | undefined'
    returns: string | undefined
    description: The pattern that owns a member block, or none when no legal claim was made on it
createdAt: '2026-09-18T00:21:32.070Z'
updatedAt: '2026-09-18T23:56:23.448Z'
