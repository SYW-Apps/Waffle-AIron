kind: entity
id: organization_unit_record
name: OrganizationUnitRecord
description: >-
  Hosted-instance organization node used to group projects outside the SDD subsystem hierarchy.
  Units can represent business entities, departments, teams, portfolios, or other administrative
  groups.
subsystem: sdd_host
fields:
  - name: id
    type: string
    description: >-
      Qualified dot-path identity from the org root: the parent's qualified id + '.' + slug (a root
      unit's id IS its slug), e.g. "company_a.it.team_a". The stable unique key referenced by
      placements.unitId, grants.orgUnitId, user.unitId, and exposeTo[]. Uniqueness is enforced on
      this qualified path; a create or move onto an existing id is an error (never a silent
      overwrite). Renames/reparents rewrite this id together with its descendants' ids and every
      reference, performed explicitly via a removeUnit disposition — there is no hidden opaque key.
    optional: false
  - name: name
    type: string
    description: Human-readable unit name.
    optional: false
  - name: kind
    type: string
    description: 'Unit kind: "business_entity", "department", "team", "portfolio", or "group".'
    optional: false
  - name: parentId
    type: string
    description: Qualified id of the parent organization unit; absent for a root/tenant unit.
    optional: true
  - name: status
    type: string
    description: 'Lifecycle status: "active", "archived", or "deleted".'
    optional: false
  - name: createdAt
    type: string
    description: ISO-8601 creation timestamp.
    optional: false
  - name: createdBy
    type: PrincipalSubject
    description: Identity that created the unit.
    optional: true
  - name: visibility
    type: string
    description: >-
      Surface-visibility posture of this unit's subtree: "inherit" (default — take the parent's
      posture; a root unit inherits "open"), "open" (placements visible throughout the owning tenant
      subtree), or "closed" (placements hidden from everyone outside this unit's subtree except
      units granted via exposeTo). Tenant ROOT units are always closed toward OTHER tenant roots —
      cross-tenant visibility exists only through exposeTo grants (fail-closed).
    optional: true
  - name: exposeTo
    type: string[]
    description: >-
      Organization unit ids granted visibility into this unit's subtree placements — the allow-list
      that punches holes through a closed posture and the ONLY path across tenant roots. No
      deny-lists: restrict by placing sensitive projects in a closed group instead.
    optional: true
  - name: slug
    type: string
    description: >-
      Local segment, unique among sibling units under the same parentId (top-level/root slugs are
      unique instance-wide). Lowercase [a-z0-9-], dot-free ('.' is the qualified-id separator). The
      human-chosen leaf name at this level (e.g. "it", "team_a"), reused freely across different
      parents: company_a.it and company_b.it coexist.
    optional: false
methods: []
