kind: entity
id: organization_unit_record
name: OrganizationUnitRecord
description: >-
  Hosted-instance organization node used to group projects outside the SDD subsystem hierarchy.
  Units can represent business entities, departments, teams, portfolios, or other administrative
  groups.
subsystem: sdd_host
fields:
  - name: id
    type: string
    description: Stable organization unit id.
    optional: false
  - name: name
    type: string
    description: Human-readable unit name.
    optional: false
  - name: kind
    type: string
    description: 'Unit kind: "business_entity", "department", "team", "portfolio", or "group".'
    optional: false
  - name: parentId
    type: string
    description: Optional parent organization unit id.
    optional: true
  - name: status
    type: string
    description: 'Lifecycle status: "active", "archived", or "deleted".'
    optional: false
  - name: createdAt
    type: string
    description: ISO-8601 creation timestamp.
    optional: false
  - name: createdBy
    type: PrincipalSubject
    description: Identity that created the unit.
    optional: true
methods: []
