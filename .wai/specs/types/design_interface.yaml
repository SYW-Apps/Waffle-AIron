kind: value-object
id: design_interface
name: DesignInterface
description: One exported contract with its methods resolved.
subsystem: sdd_surfaces
fields:
  - name: key
    type: string
    description: The interface's id
    optional: false
  - name: component
    type: string
    description: The key of the component it belongs to
    optional: false
  - name: name
    type: string
    optional: false
  - name: description
    type: string
    optional: false
  - name: status
    type: string
    optional: false
  - name: methods
    type: list<DesignMethod>
    description: In declared order
    optional: false
  - name: formerly
    type: list<string>
    optional: false
  - name: ext
    type: map<string, any>
    optional: true
  - name: implements
    type: list<string>
    description: >-
      The abstractions the contract realizes, each a component key or `alias::publicName` across
      projects, in declared order; absent when it implements none
    optional: true
  - name: omits
    type: list<OmittedMethod>
    description: >-
      On a Portal implementing a Portal abstraction: the verbs its transport deliberately does not
      serve, each with its reason; absent otherwise
    optional: true
methods: []
