kind: value-object
id: lock_status
name: LockStatus
description: >-
  The resolved verdict on a project's lock, plus the evidence it was decided from. Exists so every
  surface answers "is this locked?" identically: the hosted project config view, `wairon status`,
  and `wairon doctor`. Only a format-4 record reaches it: lock_store refuses an earlier one, naming
  `wairon upgrade`, so no identity of another algorithm is ever compared here.
fields:
  - name: state
    type: LockState
    description: Whether the lock record still covers the own design and policy.
    optional: false
  - name: record
    type: LockRecord?
    description: >-
      The persisted record, or null when the project was never locked. Retained for a stale verdict
      too — staleness is a judgement ABOUT the record, not its deletion, so a caller can prompt for
      a re-lock rather than present the project as never frozen.
    optional: false
  - name: current
    type: StateId
    description: >-
      The approval identity as it stands now — what the verdict was decided against, and what a
      re-lock would record.
    optional: false
methods: []
sourcePath: src/core/specs.ts
createdAt: '2026-07-30T15:58:52.007Z'
updatedAt: '2026-11-19T20:30:18.932Z'
