kind: value-object
id: lock_status
name: LockStatus
description: >-
  The resolved verdict on a project's lock, plus the evidence it was decided from. Exists so every
  surface answers "is this locked?" identically: the hosted project config view, `wairon status`,
  and `wairon doctor`. Before it, the gated re-check compared state identities while the config view
  answered from record existence alone — so a stale lock reported as locked, claiming a freeze that
  no longer held.
fields:
  - name: state
    type: string
    description: >-
      unlocked (no record) | locked (a record whose gate identity still matches) | stale (a record
      the design, its governing doctrine, its declared inputs, its `composition` or a direct
      member's composition subject have moved past, or one taken under an earlier gate identity
      algorithm — see upgraded()).
    optional: false
  - name: record
    type: LockRecord?
    description: >-
      The persisted record, or null when the project was never locked. Retained for a stale verdict
      too — staleness is a judgement ABOUT the record, not its deletion, so a caller can prompt for
      a re-lock rather than present the project as never frozen.
    optional: false
  - name: current
    type: StateId
    description: >-
      The gate identity as it stands now — what the verdict was decided against, and what a re-lock
      would record.
    optional: false
methods:
  - name: upgraded
    signature: 'upgraded(): boolean'
    returns: bool
    description: >-
      Whether a stale verdict comes from the identity itself changing shape rather than from
      anything it covers: true when the state is stale and the record's stateId.algorithm differs
      from current.algorithm. A lock taken before stage 5 (algorithm sha256+content+doctrine+inputs)
      against the stage-5 identity (sha256+content+doctrine+inputs+members) answers true — every
      lock reads stale once, and a surface that says so can tell the human that nothing in the
      design is known to have moved. Pure over the status's own fields.
    symbol: lockUpgraded
sourcePath: src/core/specs.ts
