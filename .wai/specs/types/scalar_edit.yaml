kind: value-object
id: scalar_edit
name: ScalarEdit
description: >-
  One scalar of the project configuration document to replace in place: where it sits, as a path of
  keys and sequence indexes from the document root, what it must hold now, and what it holds after.
  The unit of the comment-preserving write.
subsystem: sdd_core
fields:
  - name: path
    type: list<string>
    description: >-
      Keys and sequence indexes from the document root to the scalar, each a string: where the
      document holds a block sequence the segment is the item's index in decimal digits, anywhere
      else a mapping key — the document's own structure says which, so a mapping key that is all
      digits stays a key
    optional: false
  - name: from
    type: string
    description: What the scalar must hold now; a document holding anything else is refused
    optional: false
  - name: to
    type: string
    description: What it holds after the edit
    optional: false
methods: []
sourcePath: src/config/project-config.ts
createdAt: '2026-09-26T10:58:42.146Z'
updatedAt: '2026-10-04T10:54:03.208Z'
