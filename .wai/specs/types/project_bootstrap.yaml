kind: value-object
id: project_bootstrap
name: ProjectBootstrap
description: >-
  What completing a project's bootstrap wrote: the default configuration, the L0 system spec, both,
  or neither.
fields:
  - name: wroteConfig
    type: bool
    description: True when the default project configuration was created
    optional: false
  - name: wroteSystem
    type: bool
    description: True when the L0 system spec was created
    optional: false
methods: []
lint:
  allow:
    - code: MISSING_TYPE_SOURCE_PATH
      reason: >-
        No named declaration: the shape is the inline return type `{ wroteConfig; wroteSystem }` of
        ensureProjectInitialized in src/core/provision.ts, so there is no symbol a sourcePath could
        bind.
