kind: value-object
id: transaction_scope
name: TransactionScope
description: >-
  What a rehearsal copies: the coordinator root and the owner roots under it, and which paths under
  each owner. A family migration copies every project's .wai tree (the default area); the hosted
  member upgrade scopes one owner, the host data directory, with its store files as the areas — the
  same staged, journaled, all-or-nothing commit over different bytes.
subsystem: sdd_migrations
fields:
  - name: familyRoot
    type: string
    description: The live top root, absolute.
    optional: false
  - name: projects
    type: string[]
    description: >-
      Each project root to copy, absolute; every one lies within familyRoot (containment is decided
      against the declaring root, so this holds for every member and every adoptable path).
    optional: false
  - name: areas
    type: string[]
    description: >-
      Paths relative to each owner root to copy, compare and swap, forward slashes; absent means
      ['.wai'] (every family migration). A file named here that does not exist is a create when the
      rehearsal writes it. .wai/transactions/ is never an area.
    optional: true
  - name: whole
    type: string[]
    description: >-
      Owner roots copied, compared and swapped IN FULL (every file under them, .wai/transactions/
      excluded): the relocated member's old directory, whose files leave as deletes, and its new
      root, whose files arrive as creates. This is how a directory move joins the transaction — as
      staged, backed-up, journaled file changes, never as a rename outside it.
    optional: true
  - name: base
    type: string
    description: >-
      Stage 8: the directory every owner's image is laid out under in the rehearsal — the nearest
      common ancestor of the coordinator and every owner, so a sibling checkout outside the family
      root (on the same volume) keeps its relative place beside the family; the coordinator when
      absent. Computed by the rehearsal, never by a caller.
    optional: true
methods: []
sourcePath: src/migrations/types.ts
