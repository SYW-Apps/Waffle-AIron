kind: value-object
id: member_upgrade_report
name: MemberUpgradeReport
description: >-
  The answer of the stage-7 upgrade (`wairon host doctor`, and with --fix its apply): the plan as
  reported, whether it was applied, and the transaction outcome when it was attempted.
subsystem: sdd_host
fields:
  - name: plan
    type: MemberUpgradePlan
    description: The plan, rehearsal dropped
    optional: false
  - name: applied
    type: boolean
    description: True only when the transaction committed
    optional: false
  - name: outcome
    type: TransactionOutcome
    description: The transaction outcome, absent for a dry run or a refused plan
    optional: true
methods: []
createdAt: '2026-10-01T16:27:26.465Z'
updatedAt: '2026-10-01T16:27:26.467Z'
