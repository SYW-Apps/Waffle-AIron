kind: value-object
id: rule_code
name: RuleCode
description: >-
  One issue code a validation rule can emit, with its default severity and a one-line summary. Every
  code a rule emits is declared here so allow-validation and the rule catalog know the full code
  set.
fields:
  - name: code
    type: string
    description: Stable issue code, e.g. UNKNOWN_PATTERN_REF.
    optional: false
  - name: defaultSeverity
    type: string
    description: >-
      error | warning | notice (before user severity overrides). A code that defaults to notice is
      reported but never fails the gate, until a project raises it through rules.sddRuleSeverity.
    optional: false
  - name: summary
    type: string
    description: One-line description of what the code flags.
    optional: false
  - name: carryable
    type: boolean
    description: >-
      This code may appear in the conformance debt register (rules.conformance.carried) — the
      allowlist that keeps the register from becoming a second, general-purpose lint.allow. A code
      earns it by MEASURING this project's own code against its own spec at a site the finding can
      name, so paying it means changing code or spec; a doctrine, soundness or configuration finding
      says the design is illegal rather than unfinished and is never carryable. Naming an
      uncarryable code in the register is UNCARRYABLE_FINDING, an error.
    optional: true
methods: []
sourcePath: src/core/rules/types.ts
