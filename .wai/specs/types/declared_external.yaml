kind: value-object
id: declared_external
name: DeclaredExternal
description: >-
  One external as the configuration declares it, normalized: the alias, the producer id it defaults
  or names, the explicit source when one is given (a path, or on a hosted instance a record id), and
  what is wrong with the declaration on its own (before any producer is looked for). The answer of
  project_config.declaredExternals().
subsystem: sdd_core
fields:
  - name: alias
    type: string
    description: The alias key as written in project.yaml.
    optional: false
    key: primary
  - name: project
    type: string
    description: 'The producer id: the declaration''s `project`, else the alias.'
    optional: false
  - name: sourcePath
    type: string
    description: The declaration's `source.path`, as written.
    optional: true
  - name: problem
    type: string
    description: >-
      Set when the declaration cannot be used as written: an alias outside [a-z0-9-_]+ (a dotted
      producer id declared without an explicit alias lands here) or one Windows reserves for a
      device (con, prn, aux, nul, com0-9, lpt0-9 — the alias names its pin file), a producer id
      outside the project-id grammar, a `use` entry that is neither `*` nor a public name of
      [a-z0-9-_]+, a source naming more or fewer than one of `path`, `hosted` and `git`, or a
      `commit` on an external's source (an external's commit is the pin's, recorded in the externals
      lock).
    optional: true
  - name: use
    type: list<string>
    description: >-
      The declaration's `use` as written, deduplicated in first-seen order; empty when it imports
      nothing. `*` stays `*`.
    optional: false
  - name: sourceHosted
    type: string
    description: >-
      The declaration's `source.hosted`, as written: the producer's hosted project record id (stage
      7).
    optional: true
  - name: sourceGit
    type: string
    description: >-
      The declaration's `source.git`, as written (or read from the string shorthand): the producer's
      repository URL (stage 8).
    optional: true
  - name: sourceRef
    type: string
    description: 'The declaration''s `source.ref`, as written: the branch or tag a pin follows.'
    optional: true
  - name: sourceDir
    type: string
    description: 'The declaration''s `source.dir`, as written: the producer''s root inside the repository.'
    optional: true
methods: []
sourcePath: src/models/project.ts
createdAt: '2026-09-26T17:39:19.261Z'
updatedAt: '2026-10-07T18:29:37.509Z'
