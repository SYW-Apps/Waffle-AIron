kind: value-object
id: part_of
name: PartOf
description: >-
  What a NON-CONTAINED part's own .wai/project.yaml says about it (stage 8): the project it is a
  part of, and where that project's root is when it sits on disk beside it. Written only where a
  part cannot be found from its parent — a sibling checkout or a git repository; a contained part
  has no configuration (its parent finds it, and opening it resolves to the parent's root). It is
  the only thing such a configuration declares: a part is governed by its parent's configuration. It
  exists so a part opened alone (its own repository's CI) knows what it belongs to: with a pinned
  parent excerpt it is judged against that pin, without one it says "part of <parent>; validate from
  the parent". A missing or contradicting PartOf is MEMBER_KIND_MISMATCH at the parent. Written by
  `member add`, `member demote`, and the repository's owner for a git part, never needed by hand
  otherwise.
subsystem: sdd_core
fields:
  - name: project
    type: string
    description: The parent project's id, as its project.yaml declares it.
    optional: false
  - name: path
    type: string
    description: >-
      The parent's root relative to this part's root, when the part was created or last pinned with
      the parent on disk (`..` style for a contained part, `../platform` for a sibling checkout).
      Read only by `wairon externals pin` at the part, to refresh the parent excerpt; never by a
      validate, which reads the pin alone. Absent for a part fetched from git whose parent was never
      beside it.
    optional: true
methods: []
sourcePath: src/models/project.ts
