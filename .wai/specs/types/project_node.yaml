kind: value-object
id: project_node
name: ProjectNode
description: >-
  One project root of the family the scan read: the bound root, or a member at any depth. Keyed by
  its in-memory key (its project id, or its alias path when the id is taken or missing), because two
  projects may (wrongly) resolve to one id and the graph must still tell them apart.
subsystem: sdd_core
fields:
  - name: namespace
    type: string
    description: >-
      The project's key: '' for the bound root, else its effective project id (billing, transpiler —
      the same at every depth), or its alias path when another member holds its id or it has none.
      Every spec the project declares is keyed under it.
    optional: false
    key: primary
  - name: id
    type: string
    description: >-
      The effective project id: project_config.effectiveId() — declared, else the name slug, exactly
      as every other reader resolves it. Absent when none can be made.
    optional: true
  - name: idSource
    type: ProjectIdOrigin
    description: Where the id came from.
    optional: false
  - name: name
    type: string
    description: The display name from project.yaml, absent when the root has no readable configuration.
    optional: true
  - name: parent
    type: string
    description: The key of the project that declares this one as a member; absent for the bound root.
    optional: true
  - name: mountAlias
    type: string
    description: >-
      The alias the parent declares it under (its `members` key, or the legacy mount subsystem's
      local id); absent for the bound root.
    optional: true
  - name: mountForm
    type: MountForm
    description: How the parent declares it; absent for the bound root.
    optional: true
  - name: legacyMount
    type: SubsystemSpec?
    description: >-
      The legacy L1 mount subsystem as its parent wrote it, for the migration to carry; null
      otherwise.
    optional: false
  - name: hasSystem
    type: bool
    description: >-
      Whether the project has an L0 of its own — a project that exports needs one, and the migration
      writes a minimal one where it is missing.
    optional: false
  - name: directory
    type: string
    description: The project's root directory, absolute.
    optional: false
  - name: members
    type: list<string>
    description: The keys of the projects this one declares as members, either form.
    optional: false
  - name: aliases
    type: map<string, string>
    description: >-
      The project's alias table as the scan bound it: alias → the key of the project it names
      (members and family externals).
    optional: false
  - name: externals
    type: list<ResolvedExternal>
    description: >-
      The project's declared externals, each bound to its producer, followed by its referenced
      project members (a `../`, git or hosted source; role member) — a referenced project is judged
      against its pin exactly as an external is, so it is bound the same way. Empty when there are
      none.
    optional: false
  - name: memberDescription
    type: string
    description: >-
      What the parent's declaration says the member is — the `members` long form's description, or a
      legacy mount's description — which the canvas shows on the member's project node; absent for
      the bound root and for a member declared without one.
    optional: true
  - name: imports
    type: list<ProjectImport>
    description: >-
      The project's `use` imports: one per declared member and external alias without a problem, in
      declaration order (members first), each with the names it imports as written — empty when the
      alias imports nothing (stage 4). What the owner's gate resolves a bare name through.
    optional: false
  - name: parts
    type: list<ScannedPart>
    description: >-
      The project's parts (stage 8): its subsystems stored in another directory or repository. The
      canvas draws each part's subsystems as this project's own subsystems with the part's storage
      badge; nothing about them is a project.
    optional: false
  - name: targetLanguage
    type: string
    description: >-
      The project's own L0 targetLanguage, as authored; absent when it has no L0 or declares none.
      What a consumer in another project judges a call into its native (no abi) InProcess library
      against (LANGUAGE_BRIDGE_MISSING).
    optional: true
methods: []
sourcePath: src/models/project-family.ts
