kind: value-object
id: project_node
name: ProjectNode
description: >-
  One project root of the family the scan read: the bound root, or a member at any depth. Keyed by
  its in-memory key (its project id, or its alias path when the id is taken or missing), because two
  projects may (wrongly) resolve to one id and the graph must still tell them apart.
subsystem: sdd_core
fields:
  - name: namespace
    type: string
    description: >-
      The project's key: '' for the bound root, else its effective project id (billing, transpiler —
      the same at every depth), or its alias path when another member holds its id or it has none.
      Every spec the project declares is keyed under it.
    optional: false
    key: primary
  - name: id
    type: string
    description: >-
      The effective project id: project_config.effectiveId() — declared, else the name slug, exactly
      as every other reader resolves it. Absent when none can be made.
    optional: true
  - name: idSource
    type: string
    description: 'declared | name | none: where the id came from.'
    optional: false
  - name: name
    type: string
    description: The display name from project.yaml, absent when the root has no readable configuration.
    optional: true
  - name: parent
    type: string
    description: The key of the project that declares this one as a member; absent for the bound root.
    optional: true
  - name: mountAlias
    type: string
    description: >-
      The alias the parent declares it under (its `members` key, or the legacy mount subsystem's
      local id); absent for the bound root.
    optional: true
  - name: mountForm
    type: string
    description: 'members | mount: how the parent declares it; absent for the bound root.'
    optional: true
  - name: legacyMount
    type: SubsystemSpec | null
    description: >-
      The legacy L1 mount subsystem as its parent wrote it, for the migration to carry; null
      otherwise.
    optional: false
  - name: hasSystem
    type: boolean
    description: >-
      Whether the project has an L0 of its own — a project that exports needs one, and the migration
      writes a minimal one where it is missing.
    optional: false
  - name: directory
    type: string
    description: The project's root directory, absolute.
    optional: false
  - name: members
    type: string[]
    description: The keys of the projects this one declares as members, either form.
    optional: false
  - name: aliases
    type: Map<string, string>
    description: >-
      The project's alias table as the scan bound it: alias → the key of the project it names
      (members and family externals).
    optional: false
  - name: externals
    type: ResolvedExternal[]
    description: The project's declared externals, each bound to its producer (empty when none are declared).
    optional: false
methods: []
sourcePath: src/models/project-family.ts
createdAt: '2026-09-26T17:39:52.264Z'
updatedAt: '2026-09-27T10:33:24.520Z'
