kind: value-object
id: role_binding
name: RoleBinding
description: >-
  Binds a role to a user within a scope. An unscoped binding (no scopeId) applies instance-wide; a
  scoped binding applies within that unit/project subtree.
subsystem: sdd_host
fields:
  - name: roleId
    type: string
    description: The bound role's id.
    optional: false
  - name: scopeKind
    type: string
    description: instance | unit | project; absent = instance-wide.
    optional: true
  - name: scopeId
    type: string
    description: Qualified unit/project id the role applies within; absent = instance-wide.
    optional: true
methods: []
