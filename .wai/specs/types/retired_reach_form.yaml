kind: enum
id: retired_reach_form
name: RetiredReachForm
description: >-
  A form the reachability model retired, as the scan met it in a stored spec. The loader reads each
  one compatibly for one release, and the reachability migration rewrites it.
subsystem: sdd_core
fields: []
methods: []
sourcePath: src/models/specs.ts
values:
  - name: portal-type
    description: A Portal's `portalType` (HTTP_API read as HTTP)
  - name: listener-mounts
    description: 'A Portal''s `mounts`: the portals it served, their prefixes and router entries'
  - name: invoked-by-kind
    description: 'An invokedBy of a retired kind: external or sibling-subsystem'
  - name: export-type
    description: >-
      An authored `type` on an L1 or L0 export entry, now derived from the backing Portal's
      transport
  - name: in-process-endpoint
    description: >-
      A Custom endpoint whose address names an in-process call (`in-process …`,
      `<package>#<function>`), or a Custom Portal that binds no endpoint at all
  - name: retired-allow
    description: >-
      A lint allow of a code the reachability model retired (UNMOUNTED_PORTAL,
      ENDPOINT_OUTSIDE_MOUNT, MOUNT_TARGET_NOT_PORTAL, PUBLIC_INTERFACE_TYPE_MISMATCH,
      PUBLIC_INTERFACE_EVENT_MISTYPED, MISSING_PORTAL_TYPE). The scan does not record it; the
      reachability migration reads the allows itself and names its rewrites with this form
