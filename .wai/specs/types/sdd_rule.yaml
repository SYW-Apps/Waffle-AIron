kind: value-object
id: sdd_rule
name: SddRule
description: >-
  A single SDD conformance check: a named, documented unit declaring the issue codes it can emit.
  Registered in the rule registry (built-in) or supplied by a programmatic extension pack; the
  registry runs each rule's check against the shared RuleContext. The executable check itself is
  behaviour held by the registry, not intrinsic type data.
fields:
  - name: name
    type: string
    description: Stable kebab-case rule id (e.g. pattern-references).
    optional: false
  - name: description
    type: string
    description: One-paragraph statement of what the rule enforces and why.
    optional: false
  - name: codes
    type: RuleCode[]
    description: Every issue code this rule can emit, with default severity and summary.
    optional: false
  - name: scope
    type: string
    description: >-
      spec | tree (the default): what the check needs to see. A spec-scoped rule reads only one
      spec's own fields, so the write gate also runs it on a candidate before saving; in the spec
      tree the spec-scoped built-ins are exactly intrinsic_rules' methods.
    optional: true
  - name: judges
    type: string
    description: >-
      design (the default) | code: what the rule's verdict is about. A rule that reads the source
      code model — the structural, dependency, call-graph, type-shape, export and integration-sim
      conformance rules, and detail sufficiency — judges code. Its codes are left out of the gate
      identity and summarized apart in the as-complete run's analysis (CodeAnalysis), so an approval
      certifies the design and an analyzer upgrade never stales it. A pack rule declares none and
      counts as design.
    optional: true
methods: []
sourcePath: src/core/rules/types.ts
