kind: value-object
id: composition_config
name: CompositionConfig
description: >-
  The `composition` block of project.yaml: what this project requires of the projects it contains
  when they are composed. At this project's own gate only its syntax is judged (pack-requirements:
  POLICY_REQUIREMENT_INVALID for a range that does not parse); it governs nothing else there and
  nothing at a member's own gate (member-gate-unchanged-by-requirements). The family run judges
  members against it, createMember reads it once when scaffolding a new member, and the project's
  own lock honours requireApprovedMembers. It IS part of the gate identity (stage 5), so a changed
  requirement stales the requiring project's lock. It coexists with, and is never merged into, the
  two hosted pack mechanisms: the hosted instance floor (InstancePackPolicy.requiredGlobalPacks /
  defaultProjectPacks), which a hosted reconcile WRITES into every hosted project's packs and
  records in profileSelection, and the hosted profile selection, which records what a hosted policy
  workflow chose. A pack both require is satisfied by one selection in the member; neither mechanism
  reads the other.
fields:
  - name: requirePolicies
    type: list<PackRequirement>
    description: >-
      The packs every member below this project (all levels, as far as a family run selects) must
      select, each by semver range and optionally one profile. Empty or absent: nothing is required.
    optional: true
  - name: requireApprovedMembers
    type: bool
    description: >-
      Opt-in, off by default. When true, this project's lock (local and hosted) REFUSES while any
      DIRECT member is drifted or never approved, naming each with its state, and writes nothing.
      Off: the lock proceeds and records each member's state in `members`. Either way the family run
      keeps MEMBER_UNAPPROVED / MEMBER_DRIFTED as warnings. It judges direct members only: a
      grandchild is covered transitively through its parent's subject.
    optional: true
methods: []
sourcePath: src/models/project.ts
