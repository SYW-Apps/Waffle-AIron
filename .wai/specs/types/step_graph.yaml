kind: value-object
id: step_graph
name: StepGraph
description: >-
  The step graph of one narrative, the single source of successor semantics. Simple steps fall
  through; a branch continues at its true and false steps, a switch at its cases and default; a loop
  at its body and the step after its region; a try at its body, catch steps, finally step and the
  step after its region; a parallel fans out to its arms, whose last steps continue at the join; a
  jump at its target; return and throw end the path. The narrative-reachability check and the
  antipattern analysis both read it, so they never disagree about what comes next.
fields:
  - name: stepNumbers
    type: list<int>
    description: The narrative's step numbers in ascending order
    optional: false
methods:
  - name: stepAt
    signature: 'stepAt(stepNumber: number): NarrativeStep | undefined'
    returns: NarrativeStep?
    description: The step with this number, if there is one
  - name: nextOf
    signature: 'nextOf(stepNumber: number): number | undefined'
    returns: int?
    description: The next step number in ascending order, ignoring jumps and parallel joins
  - name: successorsOf
    signature: 'successorsOf(stepNumber: number): number[]'
    returns: list<int>
    description: The distinct existing step numbers flow can continue at from this step
sourcePath: src/models/step-graph.ts
createdAt: '2026-09-14T06:03:35.169Z'
updatedAt: '2026-10-04T10:29:19.802Z'
