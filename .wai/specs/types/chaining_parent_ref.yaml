kind: value-object
id: chaining_parent_ref
name: ChainingParentRef
description: >-
  The detected membership context of the current project root: which parent project declares this
  tree as a member. Produced by a filesystem walk-up (never configured), so it reflects where the
  tree ACTUALLY sits.
subsystem: sdd_core
fields:
  - name: parentRoot
    type: string
    description: >-
      Absolute root directory of the parent project whose `members` entry resolves to this project's
      root and stays within the parent's own root.
    optional: false
  - name: alias
    type: string
    description: 'The alias the parent declares this project under: its `members` key.'
    optional: false
methods: []
sourcePath: src/core/specs.ts
createdAt: '2026-07-24T17:53:35.762Z'
updatedAt: '2026-11-21T16:11:39.425Z'
