kind: value-object
id: chaining_migration_report
name: ChainingMigrationReport
description: >-
  The answer of writing a chaining migration into its rehearsal, shaped after `wairon host doctor`'s
  MigrationReport { findings, applied }: the plan it wrote, whether it wrote, every file written in
  write order (named by its live project), and the projects whose approval the writes stale — each
  needs its human to re-lock. The family transaction makes those writes live or none of them.
subsystem: sdd_migrations
fields:
  - name: plan
    type: ChainingMigrationPlan
    description: The plan applied, findings included.
    optional: false
  - name: applied
    type: bool
    description: True when apply wrote; false when the plan was empty and nothing was written.
    optional: false
  - name: written
    type: list<string>
    description: >-
      Every write apply made, in write order (project.yaml ids, L0 system specs created or extended
      and L1 publications carried from a mount, project.yaml externals, pinned snapshots and
      externals locks, then project.yaml members, deleted L1 mount documents, rewritten specs and
      deleted family-pin snapshots); a write the adapter answers only with whether it wrote is named
      by where it landed (`<project root>/.wai/specs: <kind> <local id>`, `<project
      root>/.wai/surfaces: <pin key>`); a write that changed nothing is not listed.
    optional: false
  - name: relock
    type: list<string>
    description: >-
      The directories of the projects whose lock the writes left stale: a producer whose L0 changed
      (its spec digests moved), a consumer whose externals and pins changed (gate inputs). Nothing
      is locked on anyone's behalf.
    optional: false
methods: []
sourcePath: src/migrations/chaining-migration.ts
createdAt: '2026-09-26T21:12:09.954Z'
updatedAt: '2026-10-04T10:19:57.845Z'
