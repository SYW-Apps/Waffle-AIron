kind: value-object
id: planned_external
name: PlannedExternal
description: >-
  One `externals` declaration the chaining migration adds to a consumer project: the producer it
  reaches, under an alias equal to the producer's id, so the declaration is `{}`.
subsystem: sdd_migrations
fields:
  - name: alias
    type: string
    description: >-
      The alias key: the producer's planned id, which fits [a-z0-9-_]+ (a dotted id is reported
      instead — its alias is a person's choice).
    optional: false
    key: primary
  - name: project
    type: string
    description: The producer's project id — equal to the alias.
    optional: false
  - name: producer
    type: string
    description: The producer's namespace in the family graph.
    optional: false
  - name: reason
    type: PlannedExternalReason
    description: Why the declaration is planned.
    optional: false
  - name: sourcePath
    type: string
    description: >-
      The producer's folder relative to the consumer's root: the chaining migration declares every
      external it plans with `source: { path }` (each is a sibling project in a folder), read live
      and never pinned.
    optional: false
methods: []
sourcePath: src/migrations/chaining-migration.ts
createdAt: '2026-09-26T21:11:44.325Z'
updatedAt: '2026-11-20T20:50:25.184Z'
