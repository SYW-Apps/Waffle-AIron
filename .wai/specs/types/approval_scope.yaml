kind: value-object
id: approval_scope
name: ApprovalScope
description: >-
  The spec paths a SCOPED approval (`wairon lock --subsystem x`) covers. Everything outside keeps
  whatever approval it already had, so approving one subsystem can never silently mark the rest of
  the tree reviewed — and a spec deleted inside the scope leaves the record with it. Absent means
  the whole tree.
fields:
  - name: paths
    type: set<string>
    description: >-
      Spec paths in scope, relative to the project root with POSIX separators — the same keys the
      approval is recorded under.
    optional: false
methods: []
lint:
  allow:
    - code: MISSING_TYPE_SOURCE_PATH
      reason: >-
        No named declaration: the code spells it as an inline `{ paths: Set<string> }` parameter
        type in src/core/approval.ts, so there is no symbol a sourcePath could bind.
createdAt: '2026-09-12T00:19:27.640Z'
updatedAt: '2026-10-07T06:30:06.117Z'
