kind: value-object
id: surface_contract_entry
name: SurfaceContractEntry
description: >-
  One exported interface of a surface snapshot at CONTRACT grade: the full method signatures
  (structured params, returns, guarantees, effect, endpoints) and the portal's dispatch table —
  everything a consumer's validator needs to verify an adapter edge, unlike the name-only catalog
  grade used for landscape browsing.
fields:
  - name: id
    type: string
    description: >-
      The entry's public name in the producing project's export table (`as`, else the legacy L0 id,
      else the narrowed interface, else the component).
    optional: false
    key: primary
  - name: name
    type: string
    description: Human-readable surface name.
    optional: false
  - name: audience
    type: string
    description: >-
      Exposure level from the L0 entry: project < department < instance < partner < external
      (ascending reach).
    optional: false
  - name: type
    type: string
    description: 'Transport kind: REST, GraphQL, MessageBus, RPC, or Custom.'
    optional: false
  - name: component
    type: string
    description: Local name of the backing Portal in the producing project (informational for consumers).
    optional: false
  - name: methods
    type: object[]
    description: >-
      Full contract methods: name, description, signature, params, returns, guarantees, effect,
      endpoint.
    optional: false
  - name: dispatch
    type: DispatchBinding[]
    description: >-
      The backing portal's capability dispatch table, when it is a generic-dispatch portal — carries
      the per-capability typing.
    optional: true
  - name: details
    type: string
    description: Consumer-facing description of what is exposed and what remains private.
    optional: false
  - name: version
    type: string
    description: Public contract version, when declared.
    optional: true
  - name: stability
    type: string
    description: draft | stable | deprecated.
    optional: true
  - name: auth
    type: PortalAuth
    description: >-
      Projected copy of the backing Portal's authentication requirement (security scheme). Absent or
      scheme 'none' means the surface requires no security. Copied onto the entry by the projector;
      the codec renders it into OpenAPI securitySchemes/security.
    optional: true
  - name: basePath
    type: string
    description: >-
      The backing Portal's basePath, projected onto the entry so the codec can emit this portal's
      OpenAPI `servers`.
    optional: true
  - name: componentType
    type: string
    description: >-
      Stereotype of the backing component (a consumable entry is a Portal — a gateway is a Portal
      variant — or an Observer for an event surface), carried so a consumer applies the same
      boundary rule the producer's tree would. Absent on snapshots written before exports carried
      it.
    optional: true
  - name: interface
    type: string
    description: >-
      The L3 interface the export narrows to, when it narrows; two narrowings of one component are
      distinct contracts.
    optional: true
methods:
  - name: sameContract
    signature: 'sameContract(other: SurfaceContractEntry): boolean'
    returns: boolean
    description: >-
      Whether two entries carry the same contract: the same backing component by local name, the
      same methods and the same dispatch table, so whichever judges an edge the verdict is the same
    sourcePath: src/models/surface-references.ts
sourcePath: src/models/specs.ts
createdAt: '2026-07-10T23:11:38.492Z'
updatedAt: '2026-09-26T16:08:06.104Z'
