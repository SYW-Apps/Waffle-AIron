kind: value-object
id: design_type_ref
name: DesignTypeRef
description: >-
  One type position of the design export: its canonical text under the neutral type grammar, and the
  same position parsed, so a consumer never tokenizes a string. In the parsed expression a named
  member's name is the resolved key of the type it names (`subsystem::id`, a bare id for a
  system-level type, or `alias::publicName` across projects) rather than the spelling as written.
subsystem: sdd_surfaces
fields:
  - name: text
    type: string
    description: The canonical text (`list<sdd_core::spec_index>`, `async void`)
    optional: false
  - name: expression
    type: TypeExpression
    description: >-
      The parsed position with named members resolved to keys. Absent when the grammar cannot read
      the position (TYPE_EXPRESSION_INVALID or TYPE_FORM_UNSUPPORTED on the tree): the consumer then
      has the text only and treats it as opaque, never as an invented shape
    optional: true
methods: []
createdAt: '2026-10-04T13:52:34.772Z'
updatedAt: '2026-10-04T13:52:34.773Z'
