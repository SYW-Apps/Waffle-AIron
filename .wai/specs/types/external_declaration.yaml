kind: value-object
id: external_declaration
name: ExternalDeclaration
description: >-
  One `externals` entry of project.yaml as written: the value under an alias key. `billing: {}`
  declares the producer whose id is the alias; `crm: { project: crm }` names the producer id
  explicitly; `ledger: { project: acme.ledger, source: { path: ../ledger } }` also says where to
  find it. A producer id with a dot does not fit the alias grammar, so it needs an explicit alias.
subsystem: sdd_core
fields:
  - name: project
    type: string
    description: The producer's project id; defaults to the alias.
    optional: true
  - name: source
    type: ExternalSource
    description: >-
      An explicit place to find the producer; without one it is found through the family (parent,
      members, siblings).
    optional: true
  - name: use
    type: list<string>
    description: >-
      The producer's public names this project imports, so its specs may name them bare, like `use`
      in code: `['*']` imports every public name the producer exports to this project,
      `[waffler-error, index-value]` only those. Omitted or empty imports nothing, and every
      reference into the producer is written `alias::name`. A listed name must be one of the
      producer's public names (IMPORT_UNRESOLVED otherwise).
    optional: true
  - name: description
    type: string
    description: >-
      What the producer is to this project, in this project's words — the external's twin of
      MemberDeclaration.description. The home of a member's description when `member detach` turns
      the member into an external, and the source of the member description `member adopt` writes
      back, so detach followed by adopt loses nothing.
    optional: true
methods: []
sourcePath: src/models/project.ts
