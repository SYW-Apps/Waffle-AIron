kind: value-object
id: family_member
name: FamilyMember
description: >-
  One member the project declares, as the family panel lists it: a part (this project's own content
  in another folder or repository) or a member project (its own boundary), with where it is stored.
  Read from the project's family graph alone: no validation, no relation health.
fields:
  - name: alias
    type: string
    description: The member's key in the project's `members`
    optional: false
  - name: kind
    type: string
    description: '`part` or `project`, decided from the member''s content'
    optional: false
  - name: storage
    type: string
    description: >-
      Where it is stored, as the canvas badge reads: `contained`, a sibling path, `git <short
      commit>`, `hosted` or `unresolved`
    optional: false
  - name: description
    type: string
    description: The declaration's description
    optional: true
  - name: subsystems
    type: list<string>
    description: A part's subsystems (empty for a member project)
    optional: false
methods: []
sourcePath: src/core/diagram.ts
createdAt: '2026-11-10T19:05:20.901Z'
updatedAt: '2026-11-10T19:05:22.287Z'
