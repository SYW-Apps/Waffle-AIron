kind: value-object
id: external_source
name: ExternalSource
description: >-
  Where a producer is found when the family does not hold it — for an external, and for a member
  declared by reference (stage 8: a part or a project stored outside the declaring project). Exactly
  one of `path`, `hosted` and `git` is set. Written as an object, or as a string shorthand: a string
  that is a git URL (a scheme of https://, ssh:// or git://, or the scp form user@host:path, or one
  ending in .git) reads as `{ git }`, any other string as `{ path }`. A consumer's own gate never
  needs an external producer's files: it judges against its pinned snapshot (stage 4), so a hosted
  or git source is only read live (status, re-pin) — a hosted one only through the hosting server's
  record lookup within the request's readable reach, a git one only through a fetch at a commit; out
  of reach, offline or outside a hosted server it is unavailable, never a pass.
subsystem: sdd_core
fields:
  - name: path
    type: string
    description: >-
      The producer's root directory, relative to the declaring project's root (an absolute path is
      kept as written). For a member it is a sibling checkout: unlike a member's own `path`, it is
      not held inside the declaring project, because declaring a source is the explicit statement
      that it lives elsewhere. Refused on a hosted instance, whose roots are isolated (a hosted
      project reaches another root only by `hosted`). Absent when hosted or git is set.
    optional: true
  - name: hosted
    type: string
    description: >-
      The producer's hosted project record id (stage 7) — how a project names a producer in another
      isolated root on the same hosted instance, which a path can never reach (each record's root is
      isolated). Written by the hosted detach for every consumer of the detached member, and for the
      detached member's own externals into its former family.
    optional: true
  - name: git
    type: string
    description: >-
      A git repository URL holding the producer (stage 8). Its revision is the `ref` to follow and,
      for a member, the pinned `commit`. Fetched into wairon's content-addressed cache
      (git_source_adapter), never into the declaring project's tree. Absent when path or hosted is
      set.
    optional: true
  - name: ref
    type: string
    description: >-
      git only: the branch or tag to follow when the source is pinned or updated (`wairon externals
      pin`, `wairon member update`); absent means the remote's default branch. Never resolved by a
      validate: a verdict reads the pinned commit only, so it does not move when the remote does.
    optional: true
  - name: commit
    type: string
    description: >-
      git members only: the full commit the member is pinned at, written by `member add` and `wairon
      member update`, never by a plain save. The scan loads a git part from the cache at exactly
      this commit, and the family run opens a git project there, so a verdict is the same on every
      machine that can fetch it. An external records its commit in the externals lock instead
      (ExternalLockEntry.commit), since its pinned snapshot, not its tree, is what is judged; a
      commit on an external's source is a declaration problem.
    optional: true
  - name: dir
    type: string
    description: >-
      git only: the directory inside the repository that is the producer's root (the one holding its
      .wai), relative to the repository root; absent means the repository root.
    optional: true
methods: []
sourcePath: src/models/project.ts
