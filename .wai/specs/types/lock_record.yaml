kind: entity
id: lock_record
name: LockRecord
description: >-
  The commit-scoped lock record (.wai/lock.json), format 4: the approval of ONE project's own design
  and policy. `stateId` is the approval identity (approval_identity.compute): the project's own
  design together with its policy (project type, design rule tuning, `composition`, `network` and
  the packs it selects by name, declared version and scope). Nothing the project consumes is in it:
  wairon's built-in rules (the release), a pack's resolved content, an external's contract and a
  member's approval are BUILD INPUTS, recorded in .wai/inputs.lock.yaml and judged beside the
  approval (ProjectApproval.inputs), so a release, a re-pin or a member's re-lock never re-opens it.
  `specs` carries one design digest per own spec file, so "which specs did the human sign off, and
  which have moved since?" is answered from a COMMITTED file; `parts` digests each half of the
  identity on its own, so a verdict names the one that moved; `code` records the code-conformance
  results beside the claim, with the analyzer that produced them. A lock writes nothing below or
  about its members: a member's approval is that member's own record, read at its own root. Written
  with sorted keys, so a re-lock diffs one line per spec actually re-approved. Only format 4 is
  read: a record written by an earlier wairon major is refused by lock_store, naming `wairon
  upgrade`, which rewrites it.
subsystem: sdd_core
fields:
  - name: stateId
    type: StateId
    description: >-
      The approval identity this lock certifies (algorithm `sha256+design+policy`), CAPTURED BEFORE
      the as-complete validation ran and confirmed unchanged immediately before this record was
      written — so a lock never certifies a design or policy that moved while it ran.
    optional: false
  - name: lockedAt
    type: string
    description: ISO-8601 lock timestamp
    optional: false
  - name: lockedBy
    type: ApproverIdentity
    description: >-
      The principal that authorized the lock, with the source that established them (never a raw
      credential).
    optional: false
  - name: validatorVersion
    type: string
    description: >-
      wairon version that took the lock. Informational only: the release is no input of the approval
      identity, so a newer release never re-opens it; the code analyzer's own version is recorded
      again under `code.analyzer`.
    optional: false
  - name: validationResult
    type: ValidationResult
    description: >-
      The DESIGN half of the as-complete validation captured at lock time
      (ValidationResult.designOnly): whether it was valid, and how many errors, warnings and notices
      it reported. The code-conformance findings are counted under `code` instead.
    optional: false
  - name: status
    type: string
    description: Always "ready". The lock IS the human gate; there is no second state.
    optional: false
  - name: commitSha
    type: string
    description: 'For git-backed projects: the pushed commit the PR is at'
    optional: true
  - name: compareUrl
    type: string
    description: 'For git-backed projects: the compare/PR URL a human opens to merge'
    optional: true
  - name: specs
    type: map<string, string>
    description: >-
      THE APPROVAL: spec path (relative to the project root, POSIX separators; a part's under
      `members/<alias>/<path inside the part>`) → sha256 of that spec's design view in canonical
      form when approved (code linkage, readiness and timestamps out).
    optional: false
  - name: projectId
    type: string
    description: >-
      The project's effective id when this lock was taken (project_config.effectiveId(), a defaulted
      id included). Consumers key on it, so validate reports PROJECT_ID_CHANGED (error) when
      project.yaml later resolves to a different id; the sanctioned change is the rename migration
      followed by a re-lock. Absent on a record written before project ids existed, and when the
      project had no effective id to record.
    optional: true
  - name: format
    type: int
    description: >-
      The record format: 4. A record with another format is never read as one (lock_store refuses
      it, naming `wairon upgrade` for an earlier one).
    optional: false
  - name: code
    type: CodeAnalysis
    description: >-
      The code-conformance results of the lock-time run, with the analyzer identity (validator
      version, code-conformance doctrine digest, weakest analysis grade) and the counts per severity
      — recorded BESIDE the approval, never part of what it certifies, and never a reason the lock
      refused: code errors are recorded here and the lock proceeds. CI enforces code conformance
      (`wairon validate --ci`), not the lock. Its `codes` list is left out.
    optional: true
  - name: parts
    type: map<string, string>
    description: >-
      The digest of each half of the certified approval identity, computed beside it
      (StateId.parts): `design` (the own design), `rules` (project type and design rule tuning),
      `composition`, `network` (absent when none is declared) and `selections` (the packs selected
      by name, declared version and scope). What lets a later check name the part that moved. They
      count only while they break down the stateId they sit beside (partsProblem); parts that do not
      are ignored with a notice. Empty on a record `wairon upgrade` could not carry
      (upgraded.carried false): nothing names a moved part, and the own specs that moved name the
      change.
    optional: false
    previousNames:
      - gateParts
  - name: upgraded
    type: LockUpgrade?
    description: >-
      Present when `wairon upgrade` rewrote this record from an earlier wairon major's format
      instead of a human re-approving it: who approved and when stay the human's. Carried (the
      current identity written) only when the upgrade proved the approved design and policy
      unchanged; otherwise the old identity is kept, so the record reads stale until one `wairon
      lock`.
    optional: true
methods:
  - name: approvalStamp
    signature: 'approvalStamp(): string'
    returns: string
    description: >-
      `<lockedAt> by <approver>` as every verdict names an approval, with `at an unrecorded time` /
      `an unrecorded approver` for a record that carries no lockedAt or no usable lockedBy — never
      `undefined by unknown`. Pure.
    sourcePath: src/models/lock.ts
    symbol: approvalStamp
  - name: partsProblem
    signature: 'partsProblem(current: StateId): string?'
    params:
      - name: current
        type: StateId
        description: The gate identity as it stands, with its parts
    returns: string?
    description: >-
      Why this record's `parts` do not break down the stateId they sit beside, or null when they do:
      a part every identity has is missing; the stateId equals the current identity while a part
      differs from the current one; or the stateId differs while no part does. Parts that fail it
      are IGNORED by every verdict (with a notice) — they name no moved part. Pure.
    sourcePath: src/models/lock.ts
    symbol: gatePartsProblem
  - name: missingTreeSentence
    signature: 'missingTreeSentence(): string?'
    returns: string?
    description: >-
      The sentence for a record that approved spec files while the tree it approved is gone — no
      `.wai/specs` L0 and no spec file below it: how many spec files the approval records, that a
      project with an approval on record has opted in, so an absent tree is a deleted design and
      never "no tree", and the fix (restore it from version control; to retire the design, delete
      .wai/lock.json in the same change). Null when the record records no spec file. Pure.
    sourcePath: src/models/lock.ts
    symbol: missingTreeSentence
  - name: movedParts
    signature: 'movedParts(current: map<string, string>): list<string>'
    params:
      - name: current
        type: map<string, string>
        description: The current identity's parts
    returns: list<string>
    description: >-
      The names of the parts that differ between this record's `parts` and `current` (a part present
      on one side only counts as moved), sorted. Pure.
    sourcePath: src/models/lock.ts
    symbol: movedParts
componentClass: lock_store
invariants:
  - id: single-record-per-project
    description: >-
      At most one lock record exists per project: .wai/lock.json is the only lock location and every
      write replaces the prior record wholesale — there is no append path, so a stale lock can never
      coexist with a fresh one.
sourcePath: src/core/lockfile.ts
