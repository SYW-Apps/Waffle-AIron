kind: entity
id: lock_record
name: LockRecord
description: >-
  The commit-scoped lock record (.wai/lock.json): proof that the spec tree validated as-complete at
  one exact gate StateId, AND the approval itself. `specs` carries a digest per spec file, so "which
  specs did the human sign off, and which have moved since?" is answered from a COMMITTED file —
  which is what lets a teammate, a fresh clone and CI see the same approval the approver saw.
  Written with sorted keys, so a re-lock diffs one line per spec actually re-approved rather than a
  rewritten blob.
subsystem: sdd_core
fields:
  - name: stateId
    type: StateId
    description: The exact spec-tree state this lock validated
    optional: false
  - name: lockedAt
    type: string
    description: ISO-8601 lock timestamp
    optional: false
  - name: lockedBy
    type: ApproverIdentity
    description: >-
      The principal that authorized the lock, with the source that established them (never a raw
      credential).
    optional: false
  - name: validatorVersion
    type: string
    description: wairon version that produced the validation
    optional: false
  - name: validationResult
    type: ValidationResult
    description: The as-complete validation outcome captured at lock time
    optional: false
  - name: status
    type: string
    description: Always "ready". The lock IS the human gate; there is no second state.
    optional: false
  - name: commitSha
    type: string
    description: 'For git-backed projects: the pushed commit the PR is at'
    optional: true
  - name: compareUrl
    type: string
    description: 'For git-backed projects: the compare/PR URL a human opens to merge'
    optional: true
  - name: lockedBySubject
    type: PrincipalSubject
    description: Resolved user or service identity that created the lock.
    optional: true
  - name: lockedByTokenId
    type: string
    description: Credential id used to create the lock, if the action came through MCP or HTTP auth.
    optional: true
  - name: specs
    type: Record<string, string>
    description: >-
      THE APPROVAL: spec path (relative to the project root, POSIX separators) → sha256 of that
      file's content when approved. Absent on a record written before approval moved in here — such
      a lock still proves the tree validated, but cannot say WHICH specs moved, only that the
      whole-tree StateId did.
    optional: true
  - name: children
    type: Record<string, string>
    description: >-
      Chained child mount id → that child's approved StateId, pinned the way a git submodule pins a
      commit. A child edit does not dirty the parent's own diff; it moves this pin, which is the
      parent's review signal.
    optional: true
methods: []
componentClass: lock_registry
invariants:
  - id: single-record-per-project
    description: >-
      At most one lock record exists per project: .wai/lock.json is the only lock location and every
      write replaces the prior record wholesale — there is no append path, so a stale lock can never
      coexist with a fresh one.
