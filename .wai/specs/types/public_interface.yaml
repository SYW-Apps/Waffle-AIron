kind: value-object
id: public_interface
name: PublicInterface
description: >-
  One entry of an L1 subsystem's published surface: the protocol it speaks, what it is for, and the
  L2 component — optionally the L3 contract on it — that realizes it. The binding is what makes a
  cross-subsystem dependency legal, because such a dependency may only target a published public
  component.
fields:
  - name: type
    type: string
    description: 'The protocol this surface speaks: REST, GraphQL, MessageBus, RPC or Custom.'
    optional: false
  - name: details
    type: string
    description: What the surface is and what it is for, in prose.
    optional: false
  - name: component
    type: string
    description: The L2 component that realizes this surface.
    optional: true
  - name: interface
    type: string
    description: The L3 contract on that component backing this entry.
    optional: true
  - name: consumers
    type: string[]
    description: >-
      The subsystems this surface is published to. Absent, anyone may depend on it; present, only
      these subsystems may — when every entry publishing the component names consumers, the union of
      those lists is the whole set. The provider says who may call, the way a Java module exports a
      package to named modules, instead of each caller's subset being copied into a contract of its
      own. Each id is a subsystem reference, so in a chained subproject it is qualified into the
      subproject's namespace exactly as the entry's component is, and written back relative to it.
    optional: true
methods: []
sourcePath: src/models/specs.ts
createdAt: '2026-09-19T22:58:35.555Z'
updatedAt: '2026-09-25T19:35:40.244Z'
