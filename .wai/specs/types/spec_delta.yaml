kind: value-object
id: spec_delta
name: SpecDelta
description: >-
  A partial change to one stored spec, as an update receives it. Keys are the spec's own fields,
  shaped like the spec, plus the delta's own markers: `action` (`insert` or `delete`; `remove: true`
  also deletes) on a narrative step or an identified array element; `unset`, the fields to remove
  from the element it sits in, honoured at every level; `captureJumps` on an inserted step, which
  takes over the jumps aimed at its number; and the `*Label` twin of every jump field
  (`onFalseLabel`, `toLabel`, …), resolved against step labels after the merge, where a label
  REPLACES the stored number it twins rather than contradicting it. `[]` clears the array it names.
  A TOP-LEVEL key that is neither a field nor a marker, and a marker the merge does not recognise —
  a non-boolean `remove`, an unknown `action`, a `captureJumps` outside an insert — have no effect
  at all, and refuse the write rather than reporting a success it did not perform. Deeper down the
  delta stays deliberately open, because the shapes nest further than any schema here should
  restate; a key the level's schema drops there is named back in the change report's ineffective
  list instead, so a nested typo still comes back named rather than stripped in silence.
fields:
  - name: patch
    type: object
    description: >-
      The fields to change, shaped like the spec. Identity-keyed arrays merge element by element at
      EVERY depth — methods, params and fields by name, switch cases by value, try catches by error,
      narrative steps by stepNumber; arrays of plain strings and parallel arms that name none
      replace wholesale. Steps apply in ascending stepNumber order, each against the numbering
      earlier entries of the same delta left behind, which is why labels are the reliable way to
      name a jump target and why a delete may restate the step's label or description as a guard. A
      step whose type changes is rebuilt for its new type, keeping its description and label and
      dropping what the new type cannot carry. A delete is refused when it addresses no step, when a
      jump still targets the step, or when the step is a region header whose body would be left
      standing.
    optional: false
methods: []
