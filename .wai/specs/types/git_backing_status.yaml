kind: value-object
id: git_backing_status
name: Git Backing Status
description: >-
  The read-model of a project's git backing shared across the git subsystem and the hosting server's
  admin surfaces: whether a repository is bound, its remote/branch pair, the periodic-sync setting,
  and whether the .wai/ tree carries unpublished changes. Wairon manages ONLY the .wai/ tree inside
  a bound repository — the repo can be shared with the project's own codebase — so `dirty` reflects
  the scoped path, never the whole working tree.
fields:
  - name: enabled
    type: boolean
    description: True when the project is bound to a repository.
    optional: false
  - name: remote
    type: string
    description: The bound remote URL (redacted of credentials).
    optional: true
  - name: branch
    type: string
    description: The default branch the working branch tracks.
    optional: true
  - name: workingBranch
    type: string
    description: The isolated working branch wairon commits to.
    optional: true
  - name: dirty
    type: boolean
    description: >-
      True when the .wai/ tree holds changes not yet published (scoped status, never the whole
      tree).
    optional: true
  - name: periodicSyncMinutes
    type: number
    description: Interval for the periodic backup sweep; absent disables periodic sync for this project.
    optional: true
  - name: skipIfClean
    type: boolean
    description: >-
      Periodic sweep skips the commit when the scoped path is clean (default true) so a quiet
      project never commits noise.
    optional: true
  - name: lastSyncAt
    type: string
    description: ISO-8601 timestamp of the last successful publish (manual or periodic).
    optional: true
methods: []
