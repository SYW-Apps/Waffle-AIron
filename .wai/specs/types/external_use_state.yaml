kind: enum
id: external_use_state
name: ExternalUseState
description: The verdict on one used member of a pinned external.
subsystem: sdd_surfaces
fields: []
methods: []
sourcePath: src/models/specs.ts
values:
  - name: unchanged
    description: The live digest equals the locked one
  - name: changed
    description: It differs
  - name: removed
    description: The live table no longer has the name or the member
  - name: unlocked
    description: 'Used now, but not in the lock: re-pin'
  - name: unavailable
    description: Cannot be compared
  - name: renamed
    description: >-
      Gone under the pinned name, but the live producer's rename trace (previousIds / previousNames,
      `formerly` in its export) names it as the former name of another public name: a rename, not a
      removal. Incompatible like removed — the references must follow it — but the fix is mechanical
      and the status names the new name.
createdAt: '2026-10-04T23:33:08.967Z'
updatedAt: '2026-10-06T10:07:27.984Z'
