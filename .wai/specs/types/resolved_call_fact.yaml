kind: value-object
id: resolved_call_fact
name: ResolvedCallFact
description: >-
  One call expression of a file as the TypeScript type checker resolved it — or one reference to a
  function or method of this project the code takes as a value: what was invoked, how it was
  written, which body it sits in, and every place in this project it can land. Where CallSiteFact
  records the SHAPE a pure model can follow, this records the checker's answer, so a receiver
  reached through an alias, a field chain, an element access, a destructured method, a factory's
  result, a barrel or a port interface lands where the checker says it lands, whatever its spelling.
  A call the code made unresolvable — a receiver typed any, unknown or not at all, a computed key
  that names no member, a cast to an index-signature type — is marked unresolved rather than
  dropped, with where its receiver's original type lands.
subsystem: sdd_validator
fields:
  - name: name
    type: string
    description: >-
      The invoked name: the declared member a target names, else the name as written (a property, an
      element-access string key, an identifier)
    optional: false
  - name: written
    type: string
    description: The callee as written, whitespace-collapsed and shortened — what a finding quotes
    optional: false
  - name: enclosing
    type: string
    description: >-
      The name of the innermost named function-like the call sits in (a function, a method, an
      accessor, or the named slot of an arrow or function initializer); absent at module scope
    optional: true
  - name: enclosingContainer
    type: string
    description: The top-level class or object literal whose member that function-like is, when it is one
    optional: true
  - name: targets
    type: list<CallTargetFact>
    description: >-
      Every place in this project's own code the call can land: the declaration the checker
      resolved, and, for a declaration in an interface or type shape, each class of the project that
      realizes it — the classes whose implements clause names it when any does, else every class
      whose instance type the checker finds assignable to it and which declares the member. Empty
      for a call that lands only in a dependency or the language library
    optional: false
  - name: unresolved
    type: bool
    description: >-
      True when the call lands nowhere this analysis can name and the CODE made it so: the checker
      resolved the callee to no declaration because its receiver (or the callee itself) is typed
      any, unknown or not at all; or it reaches no declaration of this project because a computed
      key names no single member, or its receiver is cast to an index-signature type — neither a
      landing nor its absence means anything. A reference is unresolved too when it reads a member
      by such a key — or a literal key off a receiver cast to any, unknown or an index signature —
      off a receiver that was a project class before any cast: taken as a value, it can be invoked
      as any of that class's members
    optional: true
  - name: receivers
    type: list<CallTargetFact>
    description: >-
      For an unresolved call, where its receiver's ORIGINAL type lands — the expression with every
      cast, assertion, non-null mark and parenthesis taken off: each project class that type is, or
      that realizes the interface or shape it is, as a target whose member is the call's name (empty
      when a computed key names none). What tells a cast that hid a data component from a receiver
      that never was one
    optional: true
  - name: reference
    type: bool
    description: >-
      True when this is no call but a REFERENCE to a function or method of this project the code
      takes as a value at this site — passes as an argument, assigns, returns, binds, or hands to
      Reflect.apply — rather than invoking it where it is written. A use all the same: what the
      reference lands on can be invoked anywhere the value travels. A member read by element access
      off a receiver that was a project class before any cast is one too when it names no single
      member, recorded unresolved
    optional: true
methods: []
sourcePath: src/models/code-model.ts
