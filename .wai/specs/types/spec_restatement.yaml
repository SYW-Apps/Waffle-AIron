kind: value-object
id: spec_restatement
name: SpecRestatement
description: >-
  A whole spec as a create tool states it, together with WHICH fields the tool could state. A create
  is an upsert: on an existing id it re-authors in place, replacing what the input expresses and
  carrying forward what it cannot express (lint, ext, endpoint bindings), so the write cannot be
  judged without knowing the difference between a field left out and a field the door has no way to
  say. The door knows its own input schema and passes that knowledge here; everything decided from
  it — status, carry, clear, removal, notices — is decided once, here, for every door.
subsystem: sdd_authoring
fields:
  - name: kind
    type: WritableSpecKind
    description: The kind of spec restated.
    optional: false
  - name: spec
    type: SystemSpec | SubsystemSpec | ComponentSpec | InterfaceSpec | ImplementationSpec | TypeSpec
    description: The spec as the caller stated it, before anything is carried into it
    optional: false
  - name: fields
    type: list<string>
    description: >-
      The spec-level fields this caller's input can express. A field on the list and absent from
      spec is cleared by omission (and reported); a field off the list is carried from the stored
      spec
    optional: false
  - name: memberFields
    type: list<string>
    description: >-
      The per-method fields this caller's input can express, for the kinds whose methods carry
      fields of their own (interface, implementation): a method's unexpressed fields are carried
      from the stored method of the same name
    optional: true
  - name: status
    type: SpecStatus
    description: >-
      The lifecycle status the caller stated. Absent keeps the stored status, and draft for a new
      spec
    optional: true
methods:
  - name: parent
    signature: 'parent(): SpecParent | null'
    returns: SpecParent?
    description: >-
      The spec this one cannot be written without: the L0 for a subsystem, the subsystem named by a
      component, the component named by an interface, the contract named by an implementation, and
      the subsystem a type names as its owner. None for the L0 itself and for a type that names no
      subsystem — a system-level value object belongs to no subsystem, so there is nothing to refuse
      it for. A type's subsystem is an ownership label rather than a container, but a label naming a
      subsystem the tree does not have owns the type to nothing, which is the same mistake a
      component under an unknown subsystem is — so the seam refuses it the same way.
    symbol: restatementParent
  - name: applyTo
    signature: >-
      applyTo(existing: SystemSpec | SubsystemSpec | ComponentSpec | InterfaceSpec |
      ImplementationSpec | TypeSpec | null, parent: SystemSpec | SubsystemSpec | ComponentSpec |
      InterfaceSpec | null): SpecRestatementApplication
    returns: SpecRestatementApplication
    description: >-
      What this restatement becomes over the stored spec, computed without touching disk — the way a
      delta applies itself: the status, the candidate with every unexpressed field carried and
      createdAt kept, the fields derived from the parent (a subsystem's parentSystem is the L0's
      name), every narrative *Label reference resolved to its step number
      (method_implementation.resolveLabels), and the notices naming what was carried, removed and
      cleared. The rename traces are unexpressed fields like any other: a spec's previousIds, and
      the previousNames of every method the restatement states again under its name, are carried,
      never dropped by a re-authoring. The candidate is then parsed through its kind's canonical
      schema, so a NEW spec arrives with the schema's defaults for every list and flag the door did
      not state — a door that states only the fields it owns (the CLI adding a chained subsystem)
      gets the same spec a door that states everything does, and nothing downstream sees a
      half-formed spec. A method's signature text is never taken from the door when the method
      states params: the writer stores the text they derive, and a stated text that differs is named
      in a notice. An interface or a type candidate has its type positions read under the grammar
      (interface_spec.canonicalTypes, type_spec.canonicalTypes): every alias is respelled to its
      canonical text and recorded as a respelling the receipt reports — an alias is accepted, never
      refused. It REFUSES instead, with the sentence that says why and how to proceed, when the
      parent the restatement needs is absent, when the stated status would lower the stored one (a
      restatement never reopens a frozen spec), when a narrative label does not resolve, when an
      interface method names a signatureFrom and also states params or returns
      (SIGNATURE_SOURCE_RESTATED — the source supplies them; state one or the other), when a method
      states neither params, a signatureFrom nor a prose signature, when an interface states a NEW
      method under a name one of its own methods retired (listed as `<this interface>.<name>` in
      that method's previousNames: name-retired, naming the holder; unsetting its previousNames
      releases the name), when a type position is not canonical (TYPE_EXPRESSION_INVALID,
      TYPE_POSITION_INVALID, TYPE_FORM_UNSUPPORTED or TYPE_NOT_NEUTRAL, each naming its replacement
      — `number` asks "int or float?"), or when the candidate does not parse (a new spec missing a
      field its kind requires). A new spec carries nothing and raises no notices.
    symbol: applyRestatement
sourcePath: src/core/authoring.ts
