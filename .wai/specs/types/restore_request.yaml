kind: value-object
id: restore_request
name: RestoreRequest
description: >-
  Operator-approved restore request for a hosted instance or project. Restore is intentionally
  explicit and high-friction because it can overwrite active hosted data.
fields:
  - name: backupId
    type: string
    description: BackupRecord id to restore from.
    optional: false
  - name: scope
    type: string
    description: 'Restore scope: "instance" or a hosted project id.'
    optional: false
  - name: targetProjectId
    type: string
    description: Optional new project id for restore-as-copy. Omitted means restore in place.
    optional: true
  - name: dryRun
    type: boolean
    description: Whether to validate restore feasibility without writing data.
    optional: false
  - name: requestedBy
    type: PrincipalSubject
    description: Identity requesting the restore.
    optional: false
  - name: reason
    type: string
    description: Human-readable reason for audit and approval.
    optional: false
methods: []
