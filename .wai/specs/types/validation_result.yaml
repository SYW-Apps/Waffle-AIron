kind: value-object
id: validation_result
name: ValidationResult
description: >-
  Aggregate outcome of a validation run: the owner's gate over one project (validateProject), or a
  family run (validateFamily) that carries every selected project's own verdict verbatim beside the
  composition and family findings. Nothing in it depends on where the run was started:
  resolve-through-parent and its resolvedThrough marker are gone (stage 4).
fields:
  - name: valid
    type: bool
    description: >-
      True when no error-severity issues were found; warnings and notices never make a result
      invalid
    optional: false
  - name: issues
    type: list<ValidationIssue>
    description: All findings (errors, warnings and notices) collected during the run
    optional: false
  - name: hint
    type: string
    description: >-
      One line, never a finding. The owner's gate: present when the project declares externals,
      saying that the gate judged them against the pins alone and that `validate` without
      `--no-recursive` composes them against their live producers. A family run: present when
      externals were left out because their producers lie outside the run's reach, counting them and
      naming what widens the reach: on a plain local run, `validate --family`; on a run that was
      already explicit or is hosted, that the producer lies outside the request's reach or cannot be
      read, with `wairon externals status` for the live comparison - never the flag the run already
      used.
    optional: true
  - name: projects
    type: list<ProjectVerdict>
    description: >-
      A family run only: one line per selected project (the root first, then its members in scan
      order) with its own gate's totals. Absent on the owner's gate.
    optional: true
  - name: analysis
    type: CodeAnalysis
    description: >-
      The as-complete run only (validateAsComplete): the code-conformance half of this result
      summarized with the analyzer that produced it — its identity, the codes code-judging rules
      declare, and the counts per severity among `issues`. Absent on the owner's gate and on a
      family run.
    optional: true
  - name: composed
    type: list<string>
    description: >-
      A family run only: the aliases of the bound project's externals the run composed as part of
      its gate (their producers within the run's reach). The advisory live comparison
      (validator_portal.adviseExternals) is handed them, so they get no second word. Absent on the
      owner's gate, and when nothing was composed.
    optional: true
  - name: codeReading
    type: string
    description: >-
      One line, never a finding: how the owner's gate read the code — the weakest analysis grade any
      file was read at (exact, pattern, generic) and, at exact grade, the compiler and its version,
      the project's own or wairon's copy; or that no source file the design names exists yet.
      `wairon validate` prints it, and sdd_validate_tree carries the same sentence in its hint.
      Absent on a family run's members.
    optional: true
  - name: codeCompact
    type: string
    description: >-
      The code reading in a few words, per language — its grade and what it did not check — for the
      closing verdict line: a pass says how much it read
    optional: true
  - name: validatorVersion
    type: string
    description: >-
      The wairon release of the process that ran the validation (WAIRON_VERSION,
      src/config/defaults.ts), set by validateProject, validateAsComplete and validateFamily alike
      (a family run's members each carry their own run's). `wairon validate` prints it on its
      verdict line and sdd_validate_tree reports it (structured content and the hint line) so a
      reading can be dated; it is not an input of the gate identity and never a finding. Distinct
      from analysis.analyzer.validatorVersion, which stays the code analyzer's identity.
    optional: false
methods:
  - name: changesTo
    signature: 'changesTo(after: ValidationResult): FindingChanges'
    returns: FindingChanges
    description: >-
      How `after` differs from this result, finding by finding: introduced (only in after), resolved
      (only here) and regraded (in both, at another severity), each finding identified by code,
      project key, spec and its message with the severity word removed. Pure over the two results'
      own issues; it never re-runs anything. The comparison behind a pack impact's dry validate,
      realized as the free function findingChanges in src/models/pack-impact.ts.
    sourcePath: src/models/pack-impact.ts
    symbol: findingChanges
  - name: designOnly
    signature: 'designOnly(): ValidationResult'
    returns: ValidationResult
    description: >-
      This result with every issue whose code is one of analysis.codes removed, `valid` recomputed
      over what remains, and `analysis` kept: the DESIGN half, which is what a lock gates on and
      certifies. Pure over the result's own fields; a result with no analysis answers itself
      unchanged. The lock refuses only on the errors this answers, and records its counts as the
      lock's validationResult.
    sourcePath: src/models/lock.ts
  - name: ciBlocking
    signature: 'ciBlocking(): list<ValidationIssue>'
    returns: list<ValidationIssue>
    description: >-
      The findings that fail `wairon validate --ci`: every error, and every warning but the
      draft-related ones --ci waives (the DRAFT_*_WARNING family, and UNUSED_COMPONENT in draft
      context); notices never count. Pure; the one reading `validate --ci` and the release
      re-validation share.
    sourcePath: src/models/lock.ts
    symbol: ciBlockingIssues
sourcePath: src/core/validation.ts
