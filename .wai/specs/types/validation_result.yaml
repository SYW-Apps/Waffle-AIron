kind: value-object
id: validation_result
name: ValidationResult
description: >-
  Aggregate outcome of a validation run: the owner's gate over one project (validateProject), or a
  family run (validateFamily) that carries every selected project's own verdict verbatim beside the
  composition and family findings. Nothing in it depends on where the run was started:
  resolve-through-parent and its resolvedThrough marker are gone (stage 4).
fields:
  - name: valid
    type: boolean
    description: >-
      True when no error-severity issues were found; warnings and notices never make a result
      invalid
    optional: false
  - name: issues
    type: ValidationIssue[]
    description: All findings (errors, warnings and notices) collected during the run
    optional: false
  - name: hint
    type: string
    description: >-
      One line, never a finding. The owner's gate: present when the project declares externals,
      saying that `validate --family` composes them against their live producers — the gate itself
      judged them against the pins alone. A family run: present when externals were left out because
      their producers lie outside the run's reach, counting them and naming `validate --family` from
      the project that declares them.
    optional: true
  - name: projects
    type: ProjectVerdict[]
    description: >-
      A family run only: one line per selected project (the root first, then its members in scan
      order) with its own gate's totals. Absent on the owner's gate.
    optional: true
  - name: analysis
    type: CodeAnalysis
    description: >-
      The as-complete run only (validateAsComplete): the code-conformance half of this result
      summarized with the analyzer that produced it — its identity, the codes code-judging rules
      declare, and the counts per severity among `issues`. Absent on the owner's gate and on a
      family run.
    optional: true
methods:
  - name: changesTo
    signature: 'changesTo(after: ValidationResult): FindingChanges'
    returns: FindingChanges
    description: >-
      How `after` differs from this result, finding by finding: introduced (only in after), resolved
      (only here) and regraded (in both, at another severity), each finding identified by code,
      project key, spec and its message with the severity word removed. Pure over the two results'
      own issues; it never re-runs anything. The comparison behind a pack impact's dry validate,
      realized as the free function findingChanges in src/models/pack-impact.ts.
    sourcePath: src/models/pack-impact.ts
    symbol: findingChanges
  - name: designOnly
    signature: 'designOnly(): ValidationResult'
    returns: ValidationResult
    description: >-
      This result with every issue whose code is one of analysis.codes removed, `valid` recomputed
      over what remains, and `analysis` kept: the DESIGN half, which is what a lock gates on and
      certifies. Pure over the result's own fields; a result with no analysis answers itself
      unchanged. The lock refuses only on the errors this answers, and records its counts as the
      lock's validationResult.
sourcePath: src/core/validation.ts
