kind: value-object
id: validation_result
name: ValidationResult
description: Aggregate outcome of a validation run over the spec tree or registry
fields:
  - name: valid
    type: boolean
    description: >-
      True when no error-severity issues were found; warnings and notices never make a result
      invalid
    optional: false
  - name: issues
    type: ValidationIssue[]
    description: All findings (errors, warnings and notices) collected during the run
    optional: false
  - name: resolvedThrough
    type: ResolvedThrough
    description: >-
      Present when a chained subproject's verdict was resolved through its parent: the root it was
      validated at and the mount chain it was scoped to.
    optional: true
methods: []
sourcePath: src/core/validation.ts
createdAt: '2026-06-10T22:00:00.000Z'
updatedAt: '2026-09-26T14:48:49.392Z'
