kind: value-object
id: loaded_extensions
name: LoadedExtensions
description: >-
  The merged result of loading all governing extension packs (global then project — project wins on
  collision). Consumed by the validator (rules/profiles/languages/patterns/guarantees), the skills
  exporter (skills), the MCP instructions composer (instructions), and the CLI. A pack that fails to
  load contributes an EXTENSION_LOAD_ERROR rather than being silently skipped.
fields:
  - name: packNames
    type: string[]
    description: Names of the successfully loaded packs.
    optional: false
  - name: packs
    type: PackProvenance[]
    description: Per-pack provenance (name, resolved ref, scope).
    optional: false
  - name: rules
    type: SddRule[]
    description: Programmatic rules, run after the built-in registry.
    optional: false
  - name: profiles
    type: ProfileDef[]
    description: Merged pack-registered profiles, keyed by id.
    optional: false
  - name: languages
    type: LanguagePackDef[]
    description: Merged pack-registered language tables, keyed by language.
    optional: false
  - name: skills
    type: PackSkill[]
    description: Merged pack-provided skills across all loaded packs.
    optional: false
  - name: patterns
    type: PatternDef[]
    description: Merged pack-registered pattern definitions.
    optional: false
  - name: errors
    type: string[]
    description: Pack load failures, surfaced as EXTENSION_LOAD_ERROR.
    optional: false
  - name: guarantees
    type: string[]
    description: >-
      Merged pack-declared guarantee tokens (deduped across packs) — the extension half of the
      guarantee vocabulary the guarantee-token rule accepts.
    optional: false
  - name: assertions
    type: PackAssertion[]
    description: >-
      Merged declarative assertions across all loaded packs, each tagged with pack provenance and
      its namespaced finding code (<PACK>_<CODE>).
    optional: false
  - name: instructions
    type: PackInstructionBlock[]
    description: >-
      Merged pack-contributed instruction blocks across all loaded packs, each tagged with its pack
      provenance, preserved in pack LOAD ORDER (load order is append order in the composed
      instructions).
    optional: false
  - name: selectionFailures
    type: PackSelectionFailure[]
    description: >-
      Declared by-name SELECTIONS that could not be resolved, each carrying the code the conformance
      gate reports it under (absent / wrong version / wrong content). Kept separate from `errors` —
      which covers packs that failed to parse — so the gate can report WHY a project is not getting
      the doctrine it declared instead of one undifferentiated load error. Every code is error
      severity: a gate running without declared doctrine must never look clean.
    optional: false
methods: []
