kind: value-object
id: git_config
name: GitConfig
description: >-
  A project's git-backing configuration: the canonical repo relocates the source of truth off the
  container. Persisted at .wai/git.json.
fields:
  - name: enabled
    type: boolean
    description: Whether git backing is active for the project
    optional: false
  - name: remote
    type: string
    description: The canonical remote repository URL
    optional: false
  - name: defaultBranch
    type: string
    description: The default/protected branch PRs target (e.g. main)
    optional: false
  - name: workingBranch
    type: string
    description: The isolated branch the container commits to (never the default)
    optional: false
methods: []
