kind: value-object
id: git_config
name: GitConfig
description: >-
  A project's git-backing configuration: the binding to the project's REAL repository — wairon
  manages ONLY the .wai/ tree inside it (commits are .wai/-scoped, never `git add -A`), so the
  repository is safely shared with the project's own codebase. Persisted at .wai/git.json.
fields:
  - name: enabled
    type: boolean
    description: Whether git backing is active for the project
    optional: false
  - name: remote
    type: string
    description: The canonical remote repository URL
    optional: false
  - name: defaultBranch
    type: string
    description: The default/protected branch PRs target (e.g. main)
    optional: false
  - name: workingBranch
    type: string
    description: The isolated branch the container commits to (never the default)
    optional: false
  - name: periodicSyncMinutes
    type: number
    description: >-
      Interval for the periodic .wai/-scoped backup sweep; absent disables periodic sync for this
      project.
    optional: true
  - name: skipIfClean
    type: boolean
    description: >-
      The periodic sweep skips the commit when the scoped path is clean (default true) — a quiet
      project never commits noise.
    optional: true
methods: []
