kind: value-object
id: http_response
name: HttpResponse
description: 'An outbound HTTP response at the hosting boundary: status code, headers, and body.'
fields:
  - name: status
    type: int
    description: HTTP status code
    optional: false
  - name: headers
    type: list<string>
    description: Raw response header lines
    optional: false
  - name: body
    type: string
    description: Response body
    optional: true
methods: []
