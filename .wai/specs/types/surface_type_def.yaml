kind: value-object
id: surface_type_def
name: SurfaceTypeDef
description: >-
  A self-contained type definition embedded in a surface snapshot — the member of the transitive
  type closure of the exported contracts, so a consumer can resolve every param/return/field
  reference without access to the producing project's tree. A signature type arrives complete: its
  params and returns travel with it, so a contract that types a param by a named function type is as
  self-contained as one using data types.
fields:
  - name: id
    type: string
    description: Type id as referenced by the exported signatures.
    optional: false
    key: primary
  - name: name
    type: string
    description: Human-readable type name.
    optional: false
  - name: kind
    type: TypeKind
    description: What the type declares
    optional: false
  - name: fields
    type: list<any>
    description: >-
      Data fields (name, type, optional, description) — types reference each other within the
      closure. Empty on a signature.
    optional: false
  - name: params
    type: list<any>
    description: >-
      A signature's parameters (name, type, optional, description), in declared order; types
      reference the closure. Only on kind signature.
    optional: true
  - name: returns
    type: string
    description: A signature's one output type, referencing the closure. Only on kind signature.
    optional: true
  - name: values
    type: list<EnumValue>
    description: An enum's values in declared order; only on kind enum
    optional: true
  - name: holds
    type: string
    description: A named scalar's one primitive, in place of fields; only on a value-object that declares it
    optional: true
  - name: formerly
    type: list<string>
    description: >-
      The type's rename trace as the producer recorded it (previousIds), carried into the snapshot
      and the surface export so a consumer pinned to a former name reads a rename rather than a
      removal; absent when it was never renamed.
    optional: true
  - name: methods
    type: list<any>
    description: >-
      The type's own pure methods — its checked constructors and operations (name, signature,
      params, returns, description) — so a binding written against a pin knows them. Carried, never
      digested: a pin taken before they were carried lacks them and reads as stale (a carried fact),
      never as incompatible.
    optional: true
methods: []
sourcePath: src/models/specs.ts
