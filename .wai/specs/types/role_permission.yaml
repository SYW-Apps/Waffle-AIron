kind: value-object
id: role_permission
name: RolePermission
description: >-
  One capability→value default a role confers. Combined most-permissively with the subject's other
  applicable roles at a scope during resolution.
subsystem: sdd_host
fields:
  - name: capability
    type: Capability
    description: One capability.
    optional: false
  - name: value
    type: PermissionValue
    description: >-
      yes or approval grant; roles are combined most-permissively (yes > approval) with the
      subject's other roles anchored at the same scope. A role never denies, so no (or inherit) is
      non-deciding during resolution: denial is expressed via a scope default (everyone) or a
      direct-user assignment, not a role.
    optional: false
methods: []
sourcePath: src/server/types.ts
