kind: value-object
id: retired_reach_fact
name: RetiredReachFact
description: >-
  One retired reachability form the current scan met, with what the stored spec held, so the
  migration can rewrite it and the doctor report can explain it without reading files again.
subsystem: sdd_core
fields:
  - name: form
    type: RetiredReachForm
    description: Which retired form
    optional: false
  - name: specId
    type: string
    description: The key of the spec holding it
    optional: false
  - name: at
    type: string
    description: 'Where in the spec: a method name, an export entry''s public name, a mounted portal''s id'
    optional: true
  - name: stored
    type: any
    description: >-
      What the stored spec held there, exactly as read (a mount with its prefixes and via, a kind, a
      type, an address)
    optional: false
methods: []
sourcePath: src/models/specs.ts
