kind: value-object
id: diagnostic_check_result
name: DiagnosticCheckResult
description: >-
  One operational diagnostic check result for a hosted Wairon instance. Diagnostic checks must
  redact paths, credentials, and project-private data unless the caller has explicit admin
  permission.
fields:
  - name: id
    type: string
    description: Stable diagnostic check id.
    optional: false
  - name: status
    type: DiagnosticStatus
    description: Check status.
    optional: false
  - name: message
    type: string
    description: Redacted human-readable result.
    optional: false
  - name: observedAt
    type: string
    description: ISO-8601 observation timestamp.
    optional: false
  - name: details
    type: string
    description: Optional small redacted diagnostic payload.
    optional: true
methods: []
sourcePath: src/server/types.ts
createdAt: '2026-07-09T09:08:24.914Z'
updatedAt: '2026-10-04T23:53:24.307Z'
