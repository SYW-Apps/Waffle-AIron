kind: value-object
id: promote_result
name: PromoteResult
description: >-
  What promoting a part (or externalizing a subsystem as a project) wrote across the new project
  boundary, each one named — so the family migration's plan lists exactly what its rehearsal, and
  therefore its apply, wrote: every reference respelled at its parsed position (a component, a
  contract, and every qualified token of a type expression, at every type position the
  reference-position table lists), every name exported on either side, every bare type imported by
  name, and every consumers entry that named a subsystem across the boundary and was dropped.
subsystem: sdd_core
fields:
  - name: respelled
    type: list<ReferenceEdit>
    description: >-
      Every reference of the PARENT's specs respelled across the new boundary, as written before and
      after, at the position the loader parses it — each reference into the new project as
      `alias::name`.
    optional: false
  - name: exported
    type: list<string>
    description: >-
      One line per export entry written or re-pointed, naming the side and the name, e.g. "platform
      L0: money (from contracts)" — every name crossing the boundary; every name the parent's L0
      re-exports from a moved subsystem, exported by the new project under the parent entry's public
      name at the parent entry's audience or wider ("analytics L0: reporting_portal as stats at
      instance (re-exported by the parent)"); and each parent entry re-pointed to re-export that
      public name through the new project, audience kept ("linkshort L0: stats re-exported through
      analytics as stats at instance (was reporting_portal from subsystem analytics)") — so no
      re-export is left pointing at nothing or wider than its source.
    optional: false
  - name: imported
    type: list<string>
    description: >-
      One line per bare type name imported by name through the `use` of the alias that now supplies
      it, e.g. "payments: platform.use gains money".
    optional: false
  - name: consumersDropped
    type: list<string>
    description: >-
      One line per publicInterfaces consumers entry that named a subsystem across the new boundary
      and was dropped — between projects the L0 export table governs who may use a name, and a
      consumers list admits only subsystems of its own tree — e.g. "payments payments_portal:
      orders".
    optional: false
  - name: memberRespelled
    type: list<ReferenceEdit>
    description: >-
      Every reference of the NEW PROJECT's specs respelled, as written before and after, at the
      position the loader parses it — each reference back into the parent as `<parent id>::name`,
      and each self-prefixed one (its id now equal to the prefix) as the bare local id.
    optional: false
  - name: entriesDeclared
    type: list<string>
    description: >-
      One line per entry the promote declared on a verb of the new project that callers left behind
      in the parent call (it has their modelled calls, so it never invents one): the verb, the scope
      (network on a network transport) and the callers, e.g. "payment_portal.openIntent: entry
      (network) — orders' payments_client". Without it the new project's own gate would find its
      Portal unreached
    optional: false
  - name: topicsCrossing
    type: list<string>
    description: >-
      One line per topic the new boundary now separates from its pair: emitted on one side and
      consumed only on the other, e.g. "payments.payment_captured: emitted by payment_publisher (new
      project), consumed in the parent by payment_outcome_observer". The family run pairs them
      across projects; the new project's own gate, run alone, reports them
    optional: false
  - name: pathsRebased
    type: list<string>
    description: >-
      One line per file path of the new project's implementations and types (sourcePath, a method's
      sourcePath, simPath) that escaped its root and was re-expressed member-relative — the path the
      code has relative to the family root, now read under the member's root — naming the spec, the
      field, the path before and after and where the file still lies, e.g. "hits_portal_http
      sourcePath: ../../src/analytics/ingestion-portal.ts → src/analytics/ingestion-portal.ts (the
      code is not moved: it is planned there until src/analytics/ingestion-portal.ts of the parent
      moves into parts/analytics)". A new project never names a file outside its own root.
    optional: false
  - name: signaturesRederived
    type: list<string>
    description: >-
      One line per contract or type method whose params the respelling changed and whose stored
      signature text was re-derived from them, e.g. "ihit_client.reportHit: reportHit(hit: hit):
      async void → reportHit(hit: analytics::hit): async void" — so no stored text is left stale.
    optional: false
  - name: externalsDeclared
    type: list<string>
    description: >-
      One line per external the new project declared for another project its moved specs name
      through the parent — a member of the family or the parent's own external — under the same
      alias: its producer id when it is not the alias, its source re-expressed from the new
      project's root, and the imported names its specs use as its `use`. The plan lists each, and
      pins them with the new project's other externals.
    optional: true
methods: []
sourcePath: src/core/provision.ts
