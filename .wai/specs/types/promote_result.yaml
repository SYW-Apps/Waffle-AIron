kind: value-object
id: promote_result
name: PromoteResult
description: >-
  Outcome of a gated promote: whether the locked StateId still matched (and the change-set was
  marked ready), or the lock was stale/absent. Never represents an actual merge — promotion to
  production is a separate, human-gated step.
fields:
  - name: status
    type: string
    description: '"ready" | "stale" | "not-locked"'
    optional: false
  - name: stateId
    type: StateId
    description: The StateId checked at promote time
    optional: false
  - name: message
    type: string
    description: Human-readable outcome detail
    optional: false
methods: []
createdAt: '2026-07-04T12:58:14.792Z'
updatedAt: '2026-07-04T12:58:14.803Z'
