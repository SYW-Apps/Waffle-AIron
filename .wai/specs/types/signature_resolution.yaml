kind: value-object
id: signature_resolution
name: SignatureResolution
description: >-
  The scan's specs with every signature resolved, and the facts resolving them produced: each
  sourced contract method carries its source's params and returns, and each contract method and type
  method with params carries its derived text. A signature type carries no text: its text is derived
  on display through type_spec.derivedSignature, never stored.
subsystem: sdd_core
fields:
  - name: interfaces
    type: list<InterfaceSpec>
    description: The interfaces, sourced methods resolved and every params-bearing method's signature derived
    optional: false
  - name: types
    type: list<TypeSpec>
    description: The types, every params-bearing type method's signature derived
    optional: false
  - name: facts
    type: SignatureFacts
    description: What the resolution found
    optional: false
methods: []
sourcePath: src/core/signature-sources.ts
createdAt: '2026-10-03T19:31:30.104Z'
updatedAt: '2026-10-04T10:21:05.380Z'
