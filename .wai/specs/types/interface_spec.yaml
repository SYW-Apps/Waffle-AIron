kind: value-object
id: interface_spec
name: InterfaceSpec
description: L3 Interface specification
fields:
  - name: id
    type: string
    description: Interface id (i-prefixed)
    optional: false
    key: primary
  - name: name
    type: string
    description: Human-readable contract name
    optional: false
  - name: description
    type: string
    description: What the contract covers
    optional: false
  - name: component
    type: string
    description: L2 component realizing this contract
    optional: false
  - name: methods
    type: MethodSignature[]
    description: >-
      Method signatures (see method_signature): name, params, returns, guarantees, endpoint, effect
      (read | write — required on a durable Store's contract methods so the durability round-trip
      rule can pair external writes with hydration read-backs), and an optional invokedBy
      declared-invocation ({kind: runtime | external | sibling-subsystem, caller} — see
      declared_invocation) acknowledging a real caller outside the modeled narrative graph:
      unused-detection seeds the method as a reachability entrypoint, with mandatory caller prose
      (INVOKED_BY_UNDESCRIBED) and a staleness flag when the internal walk reaches the method anyway
      (INVOKED_BY_REDUNDANT)
    optional: false
  - name: status
    type: string
    description: draft | design | complete
    optional: true
  - name: lint
    type: LintConfig
    description: >-
      This spec's own acknowledged findings — validator results its author looked at and accepted,
      each with a reason.
    optional: true
  - name: ext
    type: json
    description: >-
      Opaque namespaced extension data a pack or tool attaches. Never validated or interpreted by
      the core, preserved verbatim through load and save.
    optional: true
  - name: createdAt
    type: string
    description: 'When this spec was first written. Store-managed: the write decides it and no author sets it.'
    optional: false
  - name: updatedAt
    type: string
    description: When this spec was last written. Store-managed.
    optional: false
methods:
  - name: genericParameters
    signature: 'genericParameters(): Set<string>'
    returns: Set<string>
    description: The generic parameters declared in its name
    sourcePath: src/models/type-references.ts
    symbol: interfaceGenericParameters
sourcePath: src/models/specs.ts
createdAt: '2026-06-10T22:00:00.000Z'
updatedAt: '2026-09-23T18:35:50.360Z'
