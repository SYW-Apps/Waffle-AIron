kind: value-object
id: omitted_method
name: OmittedMethod
description: >-
  A verb a concrete Portal implementer deliberately does not serve: the method of a Portal
  abstraction it implements, directly or through a chain of abstractions, that it leaves out, with
  the reason this transport has no form of it.
fields:
  - name: method
    type: string
    description: >-
      The name of a method a Portal abstraction the contract implements, at any level of its chain,
      declares
    optional: false
  - name: reason
    type: string
    description: Why this transport does not serve it, for example that streaming has no form on a command line
    optional: false
methods: []
sourcePath: src/models/specs.ts
