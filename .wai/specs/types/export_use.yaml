kind: value-object
id: export_use
name: ExportUse
description: >-
  One public name of a producer's project table that a consumer's references reach, and the members
  they reach on it — the key half of a lock's `used` map (the snapshot supplies the digests).
subsystem: sdd_core
fields:
  - name: publicName
    type: string
    description: The producer's public name.
    optional: false
    key: primary
  - name: kind
    type: ExportKind
    description: What the public name binds.
    optional: false
  - name: members
    type: list<string>
    description: >-
      The members reached, sorted: contract method names, `capability:<name>` for a capability
      dispatched through the entry, `type` for a type export. Empty when the consumer only depends
      on the entry (a dependsOn with no call through it).
    optional: false
  - name: specs
    type: list<string>
    description: >-
      The consumer's specs whose references reach the name, sorted — so a pin can name who uses a
      member the snapshot no longer carries.
    optional: true
  - name: memberSpecs
    type: map<string, list<string>>
    description: >-
      Per member reached, the consumer's specs whose references reach THAT member, sorted — so a
      rename of one method or a type names the specs it breaks, not every spec that reaches the
      public name. A spec that only depends on the entry (a dependsOn with no call through it)
      reaches no member and is in no list here.
    optional: true
methods: []
sourcePath: src/models/exports.ts
createdAt: '2026-09-26T17:40:30.206Z'
updatedAt: '2026-10-08T08:23:49.036Z'
