kind: value-object
id: export_use
name: ExportUse
description: >-
  One public name of a producer's project table that a consumer's references reach, and the members
  they reach on it — the key half of a lock's `used` map (the snapshot supplies the digests).
subsystem: sdd_core
fields:
  - name: publicName
    type: string
    description: The producer's public name.
    optional: false
    key: primary
  - name: kind
    type: ExportKind
    description: What the public name binds.
    optional: false
  - name: members
    type: list<string>
    description: >-
      The members reached, sorted: contract method names, `capability:<name>` for a capability
      dispatched through the entry, `type` for a type export. Empty when the consumer only depends
      on the entry (a dependsOn with no call through it).
    optional: false
  - name: specs
    type: list<string>
    description: >-
      The consumer's specs whose references reach the name, sorted — so a pin can name who uses a
      member the snapshot no longer carries.
    optional: true
  - name: memberSpecs
    type: map<string, list<string>>
    description: >-
      Per member reached, the consumer's specs whose references reach THAT member, sorted — so a
      rename of one method or a type names the specs it breaks, not every spec that reaches the
      public name. A spec that only depends on the entry (a dependsOn with no call through it)
      reaches no member and is in no list here.
    optional: true
  - name: formerNames
    type: list<string>
    description: >-
      On a rename's published list only: the former public names of this entry, from the producer's
      rename trace (a type's previousIds, a narrowed interface's or backing component's previousIds,
      where the public name is the one that id gives) — a consumer still writing one of them reached
      the entry before its own rename, and breaks with this rename too. Absent when never renamed.
    optional: true
  - name: formerMembers
    type: map<string, list<string>>
    description: >-
      On a rename's published list only: per member, its former method names (previousNames) — a
      consumer whose call still names one no longer resolves since a method rename, and is still one
      this rename breaks. Absent when no member was renamed.
    optional: true
methods: []
sourcePath: src/models/exports.ts
