kind: value-object
id: gate_config
name: GateConfig
description: >-
  The project-level half of the gate identity: which profile governs, how the project tuned the
  design rules, and what it requires of the projects it contains. A lock taken under one and
  honoured under another was never judged by the gate it claims to have passed.
fields:
  - name: projectType
    type: string
    description: The project type, whose profile governs every subsystem that names none
    optional: true
  - name: rules
    type: RulesConfig
    description: >-
      The project's rule tuning: severity overrides, complexity caps and design depth. Its
      code-conformance tuning — rules.conformance, and every sddRuleSeverity override of a code a
      code-judging rule declares — is left out of the gate identity, since it tunes only findings
      the approval does not certify, and enters the analyzer's doctrine digest instead.
    optional: true
  - name: composition
    type: CompositionConfig
    description: >-
      The project's `composition` block (requirePolicies, requireApprovedMembers), null when absent.
      Stage 5: a changed requirement stales the requiring project's lock.
    optional: true
methods: []
sourcePath: src/core/rules/gate-identity.ts
createdAt: '2026-09-15T10:51:01.644Z'
updatedAt: '2026-09-30T06:03:07.439Z'
