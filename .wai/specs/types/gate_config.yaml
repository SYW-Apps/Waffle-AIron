kind: value-object
id: gate_config
name: GateConfig
description: >-
  The project's policy: the half of the approval identity beside its own design — which profile
  governs, how the project tuned the design rules, what it requires of the projects it contains,
  whether it declares a network, and which packs it selects. A lock taken under one policy and
  honoured under another was never approved under the policy it claims.
fields:
  - name: projectType
    type: string
    description: The project type, whose profile governs every subsystem that names none
    optional: true
  - name: rules
    type: RulesConfig
    description: >-
      The project's rule tuning: severity overrides, complexity caps and design depth. Its
      code-conformance tuning — rules.conformance, and every sddRuleSeverity override of a code a
      code-judging rule declares — is left out of the approval identity, since it tunes only
      findings the approval does not certify, and enters the analyzer's doctrine digest instead.
    optional: true
  - name: composition
    type: CompositionConfig
    description: >-
      The project's `composition` block (requirePolicies, requireApprovedMembers), null when absent.
      A changed requirement re-opens the requiring project's approval.
    optional: true
  - name: network
    type: NetworkDeclaration
    description: >-
      The project's network declaration, when it declares one: it changes the family run's network
      verdicts, so declaring, removing or redescribing one re-opens the declaring project's approval
    optional: true
  - name: selections
    type: list<PackSelection>
    description: >-
      The packs the project selects, by name, declared version and scope, as .wai/project.yaml
      states them — what the project CHOSE. What a selection resolves to (the pack's content) is a
      build input, recorded in .wai/inputs.lock.yaml, never part of the approval.
    optional: true
methods: []
sourcePath: src/core/rules/gate-identity.ts
