kind: value-object
id: cross_project_reference
name: CrossProjectReference
description: >-
  One reference that leaves the project that makes it. The scan binds every reference before this is
  built, so a reference is cross-project when the project that owns the referring spec differs from
  the project its bound target lies in, whatever form it was written in (an `alias::name`, or a
  deprecated leading `::`, `super::` or member path the scan still binds for one release). The
  positions counted: a component's dependsOn; a narrative call, register or dispatch step's
  targetComponent (with its targetMethod, or its capability); an intent method's declared `calls`; a
  Portal dispatch-table binding; a subsystem lifecycle entry; an `auth.from: component:` source; an
  L1 publicInterfaces re-export (`from`, `component`, `typeDef`); an interface's `implements`; and a
  type named by a field, param or return. A call, calls or dispatch reference that names a method is
  what the family run seeds the producer's reachability walk with, and what the derived flow matrix
  reads as a modelled flow. Not counted: `owns` (a pattern never owns across a subsystem, let alone
  a project), trustedLinks (judged by TRUSTED_LINK_CROSSES_PROJECT), L0 re-exports (judged by the
  export tables), and a reference bound as outside (its producer is not in the scan; the verdict
  comes through the parent until stage 4).
subsystem: sdd_core
fields:
  - name: specId
    type: string
    description: The qualified id of the referring spec.
    optional: false
  - name: position
    type: string
    description: >-
      dependsOn | call | register | dispatch | calls | dispatch-table | mounts | lifecycle | auth |
      reexport | type.
    optional: false
  - name: target
    type: string
    description: >-
      The in-memory key of what the reference names: a component, a subsystem (a re-export source)
      or a type — the canonical target when it bound to a public name, the lenient key of the
      producer's local id otherwise.
    optional: false
  - name: member
    type: string
    description: >-
      The contract method it reaches (call, register, calls, dispatch-table, lifecycle), or
      `capability:<name>` for a dispatch step; absent for a reference to the component or type as a
      whole.
    optional: true
  - name: consumer
    type: string
    description: The namespace of the project that owns the referring spec.
    optional: false
  - name: producer
    type: string
    description: The namespace of the project the reference lands in.
    optional: false
  - name: authored
    type: string
    description: The reference as its author wrote it.
    optional: false
  - name: publicName
    type: string
    description: >-
      The producer's public name it bound to; absent when it bound to none (unexported or
      undeclared).
    optional: true
  - name: caller
    type: string
    description: >-
      For a call, register, dispatch or calls reference written in an implementation: the key of the
      component that implementation realizes (its contract's component), the component making the
      call. Read from the implementation, never guessed from a dependsOn; absent for every other
      position.
    optional: true
methods: []
sourcePath: src/models/project-family.ts
