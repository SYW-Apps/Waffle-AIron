kind: value-object
id: type_spec
name: TypeSpec
description: >-
  L3 data type specification loaded from the types spec tree, of one of four kinds: an entity or a
  value-object (data: fields, pure methods, invariants), a signature — a named function type: params
  (the method_signature param shape) and one returns, with a description, and nothing else: no
  fields, no methods, no invariants, no inheritance — or an enum: a closed, ordered set of named
  values (EnumValue), with optional pure methods exactly as a value-object's, and nothing else (no
  fields, params, returns, componentClass, database, table or linkedEntity — ENUM_MEMBERS). A
  contract method takes a signature by naming it in its signatureFrom; a param may also be typed by
  one (a callback). An enum may type any position a named type may, a map key included. Every type
  position it holds — a field's type, a type method's params and returns, a signature's params and
  returns — is written in the neutral type grammar (type_expression). sourcePath and symbol make the
  type a CLAIM on code — the file it names must resolve and its declaration must be anchored in it —
  exactly as an implementation_spec's sourcePath claims the code realizing a contract; an enum's
  declaration is a string-literal union alias, a z.enum schema or a string enum in TypeScript, and
  its values are compared with the code's (UNREALIZED_ENUM_VALUE, UNDECLARED_ENUM_VALUE).
fields:
  - name: kind
    type: string
    description: 'Type category: entity, value-object, signature or enum'
    optional: false
  - name: id
    type: string
    description: Stable type identifier
    optional: false
  - name: name
    type: string
    description: Human-readable type name
    optional: false
  - name: description
    type: string
    description: Optional type description
    optional: true
  - name: subsystem
    type: string
    description: Owning subsystem id for entity types
    optional: true
  - name: group
    type: string
    description: Optional logical group id
    optional: true
  - name: fields
    type: object[]
    description: Data fields declared by this type; none on a signature (SIGNATURE_TYPE_MEMBERS)
    optional: false
  - name: methods
    type: TypeMethod[]
    description: >-
      Pure intrinsic methods declared by this type (type_method), none on a signature
      (SIGNATURE_TYPE_MEMBERS). Each may carry structured params, which then derive its shown
      signature exactly as a contract method's do, its own sourcePath (when it is realized outside
      the type's own file) and its own symbol (the code-level name realizing it, when that differs
      from the method name) — the same two overrides a method_implementation carries.
    optional: false
  - name: componentClass
    type: string
    description: Optional component id that implements or owns this logical entity
    optional: true
  - name: database
    type: string
    description: Optional database id for table-schema types
    optional: true
  - name: table
    type: string
    description: Optional table name for database schema types
    optional: true
  - name: linkedEntity
    type: string
    description: Optional logical entity id represented by a table-schema type
    optional: true
  - name: invariants
    type: Invariant[]
    description: >-
      Declared domain invariants (entities); every write-effect method of the componentClass must
      carry a narrative step asserting each one
    optional: true
  - name: sourcePath
    type: string
    description: >-
      Source file holding this type's declaration, and the default for every method that names no
      sourcePath of its own. Relative to the root of the project that holds the spec. Naming one
      turns the type into a claim on code: the file must resolve and the declaration must be
      anchored in it.
    optional: true
  - name: symbol
    type: string
    description: >-
      Code-level name realizing this type's declaration when it legitimately differs from name —
      e.g. a type named Invoice Line declared as InvoiceLine.
    optional: true
  - name: lint
    type: LintConfig
    description: >-
      This spec's own acknowledged findings — validator results its author looked at and accepted,
      each with a reason.
    optional: true
  - name: ext
    type: json
    description: >-
      Opaque namespaced extension data a pack or tool attaches. Never validated or interpreted by
      the core, preserved verbatim through load and save.
    optional: true
  - name: createdAt
    type: string
    description: 'When this spec was first written. Store-managed: the write decides it and no author sets it.'
    optional: false
  - name: updatedAt
    type: string
    description: When this spec was last written. Store-managed.
    optional: false
  - name: params
    type: object[]
    description: >-
      A signature's parameters, in the method_signature param shape ({name, type, description,
      optional}); only on kind signature (SIGNATURE_TYPE_MEMBERS otherwise)
    optional: true
  - name: returns
    type: string
    description: >-
      A signature's one output type; required on kind signature and only there
      (SIGNATURE_TYPE_MEMBERS)
    optional: true
  - name: values
    type: EnumValue[]
    description: >-
      An enum's values, in declared order (the order is part of the design), unique by nameKey;
      required and non-empty on kind enum and only there (ENUM_MEMBERS)
    optional: true
methods:
  - name: qualifiedId
    signature: 'qualifiedId(): string'
    returns: string
    description: Its id qualified by its owning subsystem, when the id is not already qualified
    sourcePath: src/models/type-references.ts
    symbol: qualifiedTypeId
  - name: matchesRef
    signature: 'matchesRef(ref: string): boolean'
    returns: boolean
    description: >-
      Whether a written type reference names this type: the reference's :: or . segments are a
      suffix of the qualified id, compared ignoring case and punctuation
    sourcePath: src/models/type-references.ts
    symbol: typeMatchesRef
  - name: genericParameters
    signature: 'genericParameters(): Set<string>'
    returns: Set<string>
    description: The generic parameters declared in its name (Page<T> gives T)
    sourcePath: src/models/type-references.ts
    symbol: typeGenericParameters
  - name: fieldTypeRefs
    signature: 'fieldTypeRefs(fieldType: string): string[]'
    returns: string[]
    description: >-
      The named types one of this type's field types references (type_expression.namedRefs of the
      field's parsed type), with this type's own generic parameters left out (compared ignoring
      case). A field type that does not parse names nothing here: the problem is
      TYPE_EXPRESSION_INVALID's to report. It takes the field's type rather than its name, because
      nothing makes field names unique within a type.
    sourcePath: src/models/type-references.ts
  - name: sourceFiles
    signature: 'sourceFiles(): string[]'
    returns: string[]
    description: >-
      Every source file this type names — its own sourcePath, then each method's — deduplicated, in
      declaration order.
    symbol: typeSourceFiles
  - name: derivedSignature
    signature: 'derivedSignature(): string | undefined'
    returns: string | undefined
    description: >-
      A signature type's shown text, `(a: T, b?: U): R`, derived from its params and returns the way
      method_signature.derivedSignature derives a method's, without a name; undefined on an entity
      or a value-object.
    sourcePath: src/models/specs.ts
    symbol: deriveTypeSignature
  - name: signatureTypeRefs
    signature: 'signatureTypeRefs(): string[]'
    returns: string[]
    description: >-
      The type identifiers a signature type names in place of fields: every param type, then its
      returns. None on an entity or a value-object, whose references are its fields'.
    sourcePath: src/models/type-references.ts
  - name: canonicalTypes
    signature: 'canonicalTypes(): TypeCanonicalization'
    params: []
    returns: TypeCanonicalization
    description: >-
      This type with every type position read under the grammar (type_expression.parse, with the
      position each stands in: field, type-method-param, type-method-returns, signature-param,
      signature-returns): each canonicalisable position respelled to its canonical text, every alias
      position recorded as a respelling, and every position that is not canonical recorded as a
      located problem and left as written. A type method without params keeps its prose signature;
      only its returns is read. Pure.
    sourcePath: src/models/type-grammar.ts
    symbol: typeCanonicalTypes
sourcePath: src/models/specs.ts
