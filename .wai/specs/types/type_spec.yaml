kind: value-object
id: type_spec
name: TypeSpec
description: >-
  L3 data type specification for entities and value objects loaded from the types spec tree.
  sourcePath and symbol make the type a CLAIM on code — the file it names must resolve and its
  declaration must be anchored in it — exactly as an implementation_spec's sourcePath claims the
  code realizing a contract.
fields:
  - name: kind
    type: string
    description: 'Type category: entity or value-object'
    optional: false
  - name: id
    type: string
    description: Stable type identifier
    optional: false
  - name: name
    type: string
    description: Human-readable type name
    optional: false
  - name: description
    type: string
    description: Optional type description
    optional: true
  - name: subsystem
    type: string
    description: Owning subsystem id for entity types
    optional: true
  - name: group
    type: string
    description: Optional logical group id
    optional: true
  - name: fields
    type: object[]
    description: Data fields declared by this type
    optional: false
  - name: methods
    type: object[]
    description: >-
      Pure intrinsic methods declared by this type. Each may carry its own sourcePath (when it is
      realized outside the type's own file) and its own symbol (the code-level name realizing it,
      when that differs from the method name) — the same two overrides a method_implementation
      carries.
    optional: false
  - name: componentClass
    type: string
    description: Optional component id that implements or owns this logical entity
    optional: true
  - name: database
    type: string
    description: Optional database id for table-schema types
    optional: true
  - name: table
    type: string
    description: Optional table name for database schema types
    optional: true
  - name: linkedEntity
    type: string
    description: Optional logical entity id represented by a table-schema type
    optional: true
  - name: invariants
    type: Invariant[]
    description: >-
      Declared domain invariants (entities); every write-effect method of the componentClass must
      carry a narrative step asserting each one
    optional: true
  - name: sourcePath
    type: string
    description: >-
      Source file holding this type's declaration, and the default for every method that names no
      sourcePath of its own. Relative to the root of the project that holds the spec. Naming one
      turns the type into a claim on code: the file must resolve and the declaration must be
      anchored in it.
    optional: true
  - name: symbol
    type: string
    description: >-
      Code-level name realizing this type's declaration when it legitimately differs from name —
      e.g. a type named Invoice Line declared as InvoiceLine.
    optional: true
methods:
  - name: qualifiedId
    signature: 'qualifiedId(): string'
    returns: string
    description: Its id qualified by its owning subsystem, when the id is not already qualified
    sourcePath: src/models/type-references.ts
    symbol: qualifiedTypeId
  - name: matchesRef
    signature: 'matchesRef(ref: string): boolean'
    returns: boolean
    description: >-
      Whether a written type reference names this type: the reference's :: or . segments are a
      suffix of the qualified id, compared ignoring case and punctuation
    sourcePath: src/models/type-references.ts
    symbol: typeMatchesRef
  - name: genericParameters
    signature: 'genericParameters(): Set<string>'
    returns: Set<string>
    description: The generic parameters declared in its name (Page<T> gives T)
    sourcePath: src/models/type-references.ts
    symbol: typeGenericParameters
  - name: fieldTypeRefs
    signature: 'fieldTypeRefs(fieldType: string): string[]'
    returns: string[]
    description: >-
      The type identifiers one of this type's field types names, with comments, trailing prose and
      string literals stripped and this type's own generic parameters left out (compared ignoring
      case). It takes the field's type rather than its name, because nothing makes field names
      unique within a type.
    sourcePath: src/models/type-references.ts
  - name: sourceFiles
    signature: 'sourceFiles(): string[]'
    returns: string[]
    description: >-
      Every source file this type names — its own sourcePath, then each method's — deduplicated, in
      declaration order.
    symbol: typeSourceFiles
sourcePath: src/models/specs.ts
createdAt: '2026-07-06T21:22:25.911Z'
updatedAt: '2026-09-19T11:07:20.076Z'
