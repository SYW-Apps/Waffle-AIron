kind: value-object
id: project_profile_selection
name: ProjectProfileSelection
description: >-
  Profile and pack choices applied when a hosted project is initialized or reconciled. The selection
  records the user's explicit choice plus any instance-required/default profiles so project setup is
  repeatable and auditable.
fields:
  - name: profileIds
    type: string[]
    description: Architectural profile ids selected for the project.
    optional: false
  - name: requiredPackNames
    type: string[]
    description: Instance-required pack names that must be active for the project.
    optional: false
  - name: defaultPackNames
    type: string[]
    description: Default pack names applied unless explicitly disabled by policy.
    optional: true
  - name: selectedBy
    type: PrincipalSubject
    description: Identity that selected or confirmed the profile set.
    optional: true
  - name: selectedAt
    type: string
    description: ISO-8601 timestamp of the selection.
    optional: false
methods: []
createdAt: '2026-07-08T21:58:31.373Z'
updatedAt: '2026-07-08T21:58:31.379Z'
