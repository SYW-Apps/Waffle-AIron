kind: value-object
id: candidate_verdict
name: CandidateVerdict
description: >-
  The write gate's verdict on one component candidate, split by severity: errors refuse the write,
  warnings ride along as notices.
fields:
  - name: errors
    type: ValidationIssue[]
    description: Intrinsic violations; the write is refused, and each names its rule code
    optional: false
  - name: warnings
    type: ValidationIssue[]
    description: Intrinsic advisories such as MISSING_DURABILITY; surfaced, never blocking
    optional: false
methods:
  - name: formatCandidateRefusal
    signature: 'formatCandidateRefusal(): string'
    returns: string
    description: >-
      The refusal an agent reads when the verdict holds errors: each error's code and message, then
      the remedy — nothing was written, fix the fields and retry, and on an existing spec remove a
      field with sdd_update_spec's unset rather than null. Pure over the verdict's own errors;
      written as one message because the authoring seam's channel is a thrown error's text.
sourcePath: src/models/candidate.ts
createdAt: '2026-09-14T06:03:51.301Z'
updatedAt: '2026-09-25T21:05:28.932Z'
