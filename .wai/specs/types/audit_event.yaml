kind: entity
id: audit_event
name: AuditEvent
description: >-
  Durable hosted-instance audit event recording who acted, through which token, against which
  project or instance resource, and with what outcome. Events deliberately exclude raw bearer
  tokens, secrets, and full specification payloads.
subsystem: sdd_host
fields:
  - name: id
    type: string
    description: Stable event id.
    optional: false
  - name: timestamp
    type: string
    description: ISO-8601 event timestamp.
    optional: false
  - name: level
    type: AuditLevel
    description: Event level.
    optional: false
  - name: category
    type: string
    description: >-
      Event category such as "auth", "mcp", "admin", "project", "lock", "pack", "producer", or
      "audit".
    optional: false
  - name: action
    type: string
    description: >-
      Canonical action name, for example "mcp.tool.call", "project.create", "token.mint", or
      "lock.create".
    optional: false
  - name: outcome
    type: AuditOutcome
    description: How the action ended.
    optional: false
  - name: actor
    type: PrincipalSubject
    description: Resolved user or service identity responsible for the action.
    optional: false
  - name: tokenId
    type: string
    description: Credential id used for the request, if any; never the raw token.
    optional: true
  - name: projectId
    type: string
    description: >-
      Hosted project affected by the action, when project-scoped — the member's own record id when a
      member was acted on, never its parent's.
    optional: true
  - name: requestId
    type: string
    description: Request correlation id for HTTP/MCP tracing.
    optional: true
  - name: target
    type: string
    description: Redacted target identifier such as tool name, route, key id, pack name, or producer target.
    optional: true
  - name: metadata
    type: string
    description: >-
      Small redacted diagnostic payload serialized by policy; must not contain secrets or full spec
      bodies.
    optional: true
  - name: composition
    type: string
    description: >-
      The project whose operation reached this one, when the action did not bind it directly: the
      project a family migration or family run was started at, or the family root a deprecated
      member-qualified selector named. Absent when the request bound the project itself. With
      projectId it answers both who owns the change and where it was initiated.
    optional: true
methods: []
sourcePath: src/server/types.ts
