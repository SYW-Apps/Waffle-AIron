kind: value-object
id: binding_member
name: BindingMember
description: >-
  One member a binding module declares inside a declaration: a method (a call signature, a class
  method, a function-typed field) with its parameter names, or a data field.
subsystem: sdd_validator
fields:
  - name: name
    type: string
    description: The member's name as the binding spells it.
    optional: false
  - name: params
    type: list<string>
    description: >-
      A method's parameter names in order (an empty string for one bound by a destructuring
      pattern); absent for a data field.
    optional: true
  - name: type
    type: string
    description: >-
      A data field's declared type as the binding writes it (`TileCoord[]`, `Money | null`), when it
      declares one: the type names it references are compared with the pin, so a field still typed
      by a type the producer renamed is told the new name. Absent for a method, and for a field
      declared without a type (a JavaScript object literal's value).
    optional: true
methods: []
sourcePath: src/core/binding-modules.ts
createdAt: '2026-10-08T08:21:17.594Z'
updatedAt: '2026-10-08T18:48:24.654Z'
