kind: value-object
id: member_creation
name: MemberCreation
description: >-
  What creating a member wrote: what it is (a part by default, a project with --project), where it
  lives, the commit a git member was pinned at, and — for a project only — the declaring project's
  required packs it selected in the new member and the requirements it could not satisfy from what
  is installed. The answer a CLI or MCP caller states ("applied ..."), since scaffolding is an
  unattended pack write and shows no impact report. A part selects no packs: its parent's govern it.
fields:
  - name: configCreated
    type: bool
    description: >-
      Whether this call created the member's configuration. Only then were requirements scaffolded:
      an existing configuration is the member's own and is never given selections.
    optional: false
  - name: adopted
    type: list<PackSelection>
    description: >-
      Project only: the selections written into the new member's extensions.packs, one per
      requirement, each pinned to the highest installed version the range admits, with its digest
      and fetchable source as `pack use --pin` records them. Empty for a part.
    optional: false
  - name: unadopted
    type: list<PackRequirement>
    description: >-
      Requirements no installed version satisfies. Nothing is written for them; the next family run
      reports each as POLICY_NOT_ADOPTED until the member selects the pack.
    optional: false
  - name: projectType
    type: string
    description: >-
      The profile written as the new member's projectType, when exactly one adopted requirement
      names a profile.
    optional: true
  - name: as
    type: string
    description: 'part | project: what was created.'
    optional: false
  - name: storage
    type: string
    description: >-
      contained | path | git: where its files live (a hosted record is created by the hosted project
      creation, never here).
    optional: false
  - name: commit
    type: string
    description: 'git: the commit the member was pinned at (the source''s ref head when it was created).'
    optional: true
methods: []
sourcePath: src/core/provision.ts
symbol: MemberCreation
