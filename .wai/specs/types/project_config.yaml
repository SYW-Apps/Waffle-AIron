kind: value-object
id: project_config
name: ProjectConfig
description: >-
  Project configuration: the project's identity, output targets, rule configuration, extension pack
  registration, and the hosted/profile selection applied when the project was initialized or
  reconciled. Identity resolution is intrinsic, pure behaviour of the configuration itself
  (effectiveId, identity): it needs no collaborator.
fields:
  - name: name
    type: string
    description: 'Display name. Not an identity: `id` is.'
    optional: false
  - name: targets
    type: object[]
    description: 'Output targets: type (claude | gemini | custom), outputDir, enabled'
    optional: false
  - name: rules
    type: RulesConfig
    description: Topology + conformance rule configuration
    optional: false
  - name: extensions
    type: object
    description: Extension configuration such as registered pack references and whether global packs are used.
    optional: true
  - name: profileSelection
    type: ProjectProfileSelection
    description: >-
      Hosted/profile selection applied to this project, when initialized or reconciled through
      hosted policy workflows.
    optional: true
  - name: projectType
    type: string
    description: >-
      The project-level architectural profile GOVERNING the project: a built-in profile, a project
      kind (fullstack | system-of-systems | monorepo), or a profile id contributed by a registered
      extension pack. This is the field validation reads — every component whose subsystem declares
      no profile of its own resolves to it, and the profile's doctrine (stereotype fencing plus its
      rules block: designDepth, rule severities, naming, complexity) applies through it. A value
      that resolves to no loaded profile disables that doctrine (UNKNOWN_PROFILE), which is why
      hosted writes ensure the contributing pack is registered before writing it. Defaults to
      'backend' when the config omits it.
    optional: true
  - name: schemaVersion
    type: string
    description: >-
      The config-format version this file was written at, so a later wairon can read an earlier
      project rather than guess at it. Always present — a missing version is filled on write.
    optional: false
  - name: createdAt
    type: string
    description: 'When the project was initialized. Store-managed: the write decides it and no author sets it.'
    optional: false
  - name: updatedAt
    type: string
    description: When the config was last written. Store-managed.
    optional: false
  - name: id
    type: string
    description: >-
      The project's stable identity: a slug of [a-z0-9-_.] that starts and ends alphanumeric. When
      absent, the effective id is `name` slugified (see effectiveId) and no save writes it in,
      because the default can be wrong: an existing chained child answers to its mount's subsystem
      id, which a plain save cannot know. Only deliberate writers set it: init and provisioning
      write it from the name, hosted creation writes the hosted project id, and a chained child is
      created (or repaired by doctor) with its mount's subsystem id. Changing it is the rename
      migration (`wairon project rename`), which moves the old id into `previousIds`: a lock records
      the id it approved, and a later mismatch is PROJECT_ID_CHANGED unless the approved id is one
      of `previousIds` (PROJECT_ID_RENAMED, a notice until the re-lock).
    optional: true
    key: primary
  - name: externals
    type: Map<string, ExternalDeclaration>
    description: >-
      The other projects this project consumes, keyed by alias — the first segment of its
      `alias::name` references. Each value is an ExternalDeclaration; the alias defaults the
      producer id, and a producer is found through the family (parent, members' siblings) or an
      explicit source (a path, a git repository, or on a hosted instance a record id). Its `use`
      imports producer names so they may be written bare: a bare name resolves to a local spec
      first, then to a name exactly one import supplies. A member needs no declaration: its
      `members` key is its alias. An alias both here and under `members` is a problem of both
      declarations. A part's configuration declares none: a part's specs use the parent's aliases.
      Read by the scan and the project graph. Written by hand, or by `doctor --fix` through the
      registry's declareExternal (adds an alias, never overwrites one) and importNames (adds names
      to an alias's `use`).
    optional: true
  - name: members
    type: Map<string, MemberDeclaration | string>
    description: >-
      What this project is made of beyond its own specs folder, keyed by alias: `scheduler:
      services/scheduler` (shorthand: a contained part) or the long form, a MemberDeclaration — `as:
      part | project` (absent: part, unless the member's root is project-shaped, which reads as
      project with MEMBER_KIND_INFERRED) and either a contained `path` or a `source` stored
      elsewhere (sibling path, git repository at a commit, hosted record). A PART's subsystems are
      this project's own subsystems: keyed under this project, referenced by local id, judged by the
      ordinary subsystem rules and approved by this project's lock. A PROJECT member is not a
      subsystem of this project: it has no L1 spec here, and this project reaches it only as
      `alias::name` through its L0 exports, like any consumer — or bare, for the names the long
      form's `use` imports; a contained one is read live, one stored by `source` is judged against
      its pin. Together with `externals` it is this project's alias table, and one alias names one
      member or external. Written by hand, by `member add` / `promote` / `demote` / `update`, or by
      `doctor --fix` through the registry's declareMember, updateMember and importNames; the L1
      `projectPath` form still loads for one release (DEPRECATED_MOUNT_FORM).
    optional: true
  - name: composition
    type: CompositionConfig
    description: >-
      What this project requires of the projects it contains when they are composed:
      `requirePolicies`, the packs each member must select (by semver range, optionally one
      profile). This project's own gate judges only its syntax (POLICY_REQUIREMENT_INVALID); the
      family run judges members against it, and createMember reads it once when it scaffolds a new
      member. No member's own gate reads it, so a member's verdict is the same with and without a
      parent's requirement. Not part of the gate identity until stage 5. Written by hand. Coexists
      with, and is never merged into, the hosted instance floor and profileSelection (see
      CompositionConfig).
    optional: true
  - name: previousIds
    type: string[]
    description: >-
      The ids this project answered to before, oldest first, each appended by the rename migration
      and never removed or reordered by a writer. It is the project's own record that an id moved
      deliberately: a lock that approved one of them reads as renamed (PROJECT_ID_RENAMED, notice)
      rather than changed, so the re-lock the rename asks for is not refused by the error it would
      otherwise raise — the deadlock stage 3 reported as id-locked. Nothing resolves through it: a
      reference or an external that still names an old id is rewritten by the rename, or reported,
      never redirected.
    optional: true
  - name: partOf
    type: PartOf
    description: >-
      Set only in a PART's configuration (stage 8): the project it is a part of. A configuration
      that sets it is a part's, and declares nothing else a project declares — no id, members,
      externals, composition, rules, extensions or targets — because a part is governed by its
      parent's configuration; one that does is PART_HAS_PROJECT_CONTENT. Absent in every project's
      configuration.
    optional: true
methods:
  - name: declaredPackNames
    signature: 'declaredPackNames(): string[]'
    returns: string[]
    description: >-
      The names of the packs this configuration declares, deduplicated in first-seen order: each
      `extensions.packs` entry (a selection's name, or a legacy path reference's file stem — its
      basename without a pack extension), then the required and default pack names recorded in
      `profileSelection`. Empty when nothing is declared.
  - name: declaredProfileIds
    signature: 'declaredProfileIds(): string[]'
    returns: string[]
    description: >-
      The profile ids recorded in `profileSelection`, deduplicated in first-seen order; empty when
      no selection is recorded. The governing `projectType` is not included.
  - name: activeTargetTypes
    signature: 'activeTargetTypes(): string[]'
    returns: string[]
    description: >-
      The target types this configuration enables: every target not explicitly disabled. Empty for a
      configuration with no enabled targets.
  - name: effectiveId
    signature: 'effectiveId(): string | null'
    returns: string | null
    description: >-
      The declared id when there is one, as written; otherwise `name` slugified — in every reader,
      the project graph included, so a project answers to one id wherever it is read (a chained
      child that declares none is not given its mount's subsystem id here: PROJECT_ID_DEFAULTED
      names that id as the one to declare, and 2c's doctor --fix writes it). Slugifying lower-cases
      the name, collapses each run of characters outside [a-z0-9-_.] to one '-', and trims the
      result until it starts and ends alphanumeric. Returns null when no declared id exists and no
      slug can be made; it never invents a fallback.
    symbol: effectiveProjectId
  - name: identity
    signature: 'identity(lockedProjectId?: string): ProjectIdentity'
    returns: ProjectIdentity
    description: >-
      Resolve the effective id against the id a lock approved, naming every problem with it:
      defaulted when no id is declared and the name yields one; ambiguous when no id is declared and
      the name yields no slug, or when a declared id breaks the grammar; renamed when a
      lockedProjectId is given, the effective id differs from it and it is one of `previousIds` (the
      rename migration moved it, and only the re-lock is owed); changed when a lockedProjectId is
      given and the effective id differs from it otherwise (an effective id of none included).
    symbol: projectIdentity
  - name: declaredExternals
    signature: 'declaredExternals(): DeclaredExternal[]'
    returns: DeclaredExternal[]
    description: >-
      The configuration's `externals`, one DeclaredExternal per alias in declaration order: the
      producer id is the entry's `project`, else the alias; the source path is copied as written;
      `use` is deduplicated in first-seen order; an alias outside [a-z0-9-_]+, an alias `members`
      also declares, a producer id outside the project-id grammar, or a `use` entry that is neither
      `*` nor a public name is recorded as the entry's problem rather than dropped. Empty when
      nothing is declared.
  - name: declaredMembers
    signature: 'declaredMembers(): DeclaredMember[]'
    returns: DeclaredMember[]
    description: >-
      The configuration's `members`, one DeclaredMember per alias in declaration order, the
      shorthand read as `{ path }` (a contained member, `as` unstated) with no imports: `as`, the
      path or the source normalized from its object or string form, the storage it implies, the
      description and `use` copied as written; an alias outside [a-z0-9-_]+, both or neither of path
      and source, an empty or absolute path, a malformed source, a git source without a commit, an
      `as` that is neither part nor project, a hosted part, a `use` on a part, an alias `externals`
      also declares, or a malformed `use` entry is recorded as the entry's problem rather than
      dropped. Empty when nothing is declared.
  - name: withPack
    signature: 'withPack(entry: PackSelection | string, remove?: boolean): ProjectConfig'
    returns: ProjectConfig
    description: >-
      The configuration as it would read after one pack write, without writing it: a selection drops
      every same-name selection and is appended last (the highest precedence), exactly as the
      registry's upsertPackSelection writes it; a legacy path reference is appended only when
      absent, exactly as registerPackRef writes it; with `remove`, the same-name selection (or that
      exact path reference) is dropped instead, as removePackSelection / deregisterPackRef do. The
      one reading of a pack write that the dry validate and the registry share, which is what makes
      an impact report equal what the write then produces (impact-matches-apply).
  - name: requiredPolicies
    signature: 'requiredPolicies(): PackRequirement[]'
    returns: PackRequirement[]
    description: >-
      The configuration's `composition.requirePolicies` in declaration order, a second requirement
      for a pack already required dropped (the first one stands, and the family run reports nothing
      about the duplicate). Empty when nothing is required.
  - name: isPart
    signature: 'isPart(): boolean'
    returns: boolean
    description: >-
      Whether this is a part's configuration: `partOf` is set. The one test every reader that treats
      a part's root differently from a project's (the owner's gate opened at a part, `externals pin`
      at a part, status) asks, so they cannot disagree about it.
