kind: value-object
id: project_init_request
name: ProjectInitRequest
description: >-
  Hosted project initialization request used by the project-lifecycle tools, admin UI, CLI, or
  MCP-assisted setup. It captures project identity, the required owning organization unit, and
  explicit profile selection without exposing raw filesystem paths.
fields:
  - name: id
    type: string
    description: URL-safe hosted project id.
    optional: false
  - name: displayName
    type: string
    description: Human-readable project name.
    optional: true
  - name: description
    type: string
    description: Hosted-instance project description.
    optional: true
  - name: ownerUnitId
    type: string
    description: >-
      The organization unit that owns the project. REQUIRED — every project is placed at creation so
      the permission resolver can always enumerate it; a fresh instance must create its first
      organization unit before initializing projects.
    optional: false
  - name: environment
    type: string
    description: Optional environment label such as "development", "staging", or "production".
    optional: true
  - name: profileSelection
    type: ProjectProfileSelection
    description: >-
      Explicit profile and pack selection for the project. Required when instance policy requires
      profile selection.
    optional: true
methods: []
