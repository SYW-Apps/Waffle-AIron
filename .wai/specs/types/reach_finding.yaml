kind: value-object
id: reach_finding
name: ReachFinding
description: >-
  One network finding of a judged reach model (network_arbiter.judge), as the derived networking
  outputs read it: its severity, code and message, and the spec and site it sits on — a verb's
  Portal and the verb, or a call's calling component and the call's evidence. An error refuses the
  flows it sits on; a warning or notice marks them.
fields:
  - name: severity
    type: IssueSeverity
    description: error, warning or notice, after the owning project's severity tuning
    optional: false
  - name: code
    type: string
    description: 'The finding code: GATEWAY_BYPASSED, ENTRY_UNPROVEN, ...'
    optional: false
  - name: message
    type: string
    description: The finding's message, as the gate reports it
    optional: false
  - name: specId
    type: string
    description: 'The spec it sits on: the verb''s Portal, or the call''s calling component (family keys)'
    optional: true
  - name: at
    type: string
    description: 'The site inside that spec: the verb, or the call''s evidence'
    optional: true
methods: []
sourcePath: src/models/reach.ts
createdAt: '2026-10-06T23:02:20.977Z'
updatedAt: '2026-10-06T23:02:21.803Z'
