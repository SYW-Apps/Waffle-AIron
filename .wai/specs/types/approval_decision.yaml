kind: value-object
id: approval_decision
name: ApprovalDecision
description: >-
  Decision supplied by an authorized user/admin for a pending hosted approval request. Its decidedBy
  MUST differ from the originating request's requestedBy and the decider must hold an
  approval-capable grant; the workflow rejects self-approval.
fields:
  - name: requestId
    type: string
    description: ApprovalRequest id being decided.
    optional: false
  - name: approved
    type: boolean
    description: Whether the request is approved. False means denied.
    optional: false
  - name: reason
    type: string
    description: Optional human-readable decision reason.
    optional: true
  - name: decidedBy
    type: PrincipalSubject
    description: Identity making the decision.
    optional: false
  - name: decidedAt
    type: string
    description: ISO-8601 decision timestamp.
    optional: false
methods: []
createdAt: '2026-07-09T07:18:53.391Z'
updatedAt: '2026-07-09T15:43:11.166Z'
