kind: value-object
id: resolved_external
name: ResolvedExternal
description: >-
  One declared external of a project — or one of its referenced project members (a `../`, git or
  hosted source; stage 8: role member) — bound to its producer: found in the family by id (or by the
  directory its source.path names), or — for a source.path outside the family — only by that
  directory, or — for a source.git — by the git cache directory of a fetched commit, or — for a
  source.hosted record id — by the root the hosting server's record lookup answers within the
  request's readable reach. The audience a producer shows it follows from where it was found: the
  family sees `project`, any other source sees `instance`.
subsystem: sdd_core
fields:
  - name: alias
    type: string
    description: The alias the consumer declared.
    optional: false
    key: primary
  - name: project
    type: string
    description: The producer id the declaration names (its `project`, else the alias).
    optional: false
  - name: sourceKind
    type: ExternalSourceKind
    description: Where the producer was found.
    optional: false
  - name: relation
    type: ExternalRelation
    description: 'For a family producer: how it stands to the consumer.'
    optional: true
  - name: producer
    type: string
    description: The producer's namespace in the family graph, for a family producer.
    optional: true
  - name: directory
    type: string
    description: >-
      The producer's root directory, absolute: the family node's, the resolved source.path, or the
      root the hosted record lookup answered.
    optional: true
  - name: audience
    type: string
    description: >-
      The audience ceiling the consumer sees: project for a family producer, instance for any other
      source.
    optional: false
  - name: problem
    type: string
    description: >-
      Why the external is unresolved or unusable: the declaration's own problem, no family project
      with that id and no source.path, a source.path that holds no project, a source.path whose
      project declares another id, two family projects answering to the id, a source.hosted read
      outside a hosted server ("hosted-only producer `<id>`: available only through the hosted
      server"), or a source.hosted record that is unknown or outside the request's reach.
    optional: true
  - name: hosted
    type: string
    description: The source.hosted record id the declaration names, resolved or not.
    optional: true
  - name: role
    type: ExternalRole
    description: >-
      How it is declared. Both are judged by the owner's gate against their pins and composed by the
      family run per use; a member is also part of the family's composition (its own gate runs in
      the family run, its approval is recorded by the parent's lock), an external only consumed.
    optional: false
  - name: commit
    type: string
    description: >-
      The producer's commit, only when it lives in another git repository than the consumer: git —
      the commit the directory holds (the member's pinned commit for role member; for an external,
      the ref's head resolved when status or a pin asked, absent when it could not be resolved, e.g.
      offline); a `../` sibling or path producer that is its own repository — the head of that work
      tree. A family, contained or same-repository producer records none, so a monorepo re-pin never
      churns the lock.
    optional: true
methods: []
sourcePath: src/models/project-family.ts
