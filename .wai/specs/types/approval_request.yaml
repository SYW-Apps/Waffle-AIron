kind: entity
id: approval_request
name: ApprovalRequest
description: >-
  Durable request for a privileged hosted action initiated by a user, CLI, UI, or MCP-connected
  agent. The request records intent and payload summary, then waits for an authorized user/admin
  decision before the privileged workflow executes.
subsystem: sdd_host
fields:
  - name: id
    type: string
    description: Stable approval request id.
    optional: false
  - name: kind
    type: string
    description: >-
      Requested action kind, such as "project:init", "project:lock", "token:mint", "pack:install",
      or "policy:change".
    optional: false
  - name: status
    type: string
    description: 'Lifecycle status: "pending", "approved", "denied", "expired", "completed", or "cancelled".'
    optional: false
  - name: requestedBy
    type: PrincipalSubject
    description: Identity that requested the action, including MCP token owner or service principal.
    optional: false
  - name: requestedTokenId
    type: string
    description: Credential id used to request the action, when the request came through MCP or HTTP auth.
    optional: true
  - name: projectId
    type: string
    description: Hosted project affected by the request, if project-scoped.
    optional: true
  - name: summary
    type: string
    description: Human-readable redacted summary of the requested action for approval UI/CLI.
    optional: false
  - name: payloadType
    type: string
    description: >-
      Redacted payload type identifier, such as ProjectInitRequest or TokenMintRequest — or the
      subproject-scope shape a project:lock request records when the requester was bound to a
      chained subproject, so the approved execution stays confined to that child tree.
    optional: true
  - name: payload
    type: string
    description: >-
      Small redacted serialized payload required to execute the approved action. Must never contain
      raw secrets or bearer tokens. For a subproject-scoped lock request this carries the
      mount-chain qualifier the execution forwards, which is why an approval can never widen the
      scope the requester was bound to.
    optional: true
  - name: createdAt
    type: string
    description: ISO-8601 request creation timestamp.
    optional: false
  - name: expiresAt
    type: string
    description: ISO-8601 timestamp after which pending approval is invalid.
    optional: true
  - name: decidedAt
    type: string
    description: ISO-8601 decision timestamp.
    optional: true
  - name: decidedBy
    type: PrincipalSubject
    description: Identity that approved or denied the request.
    optional: true
  - name: decisionReason
    type: string
    description: Optional reason supplied when approving or denying the request.
    optional: true
  - name: executionSummary
    type: string
    description: >-
      Set when an approved project:init is executed: one line per pack the instance policy applied
      and for the governing-profile step, each with its headline doctrine changes and finding totals
      (from the init's GovernedProjectCreation), so whoever reads the approval — getApprovalStatus,
      awaitApproval, the decider — sees what the unattended init changed. The full impacts are in
      the init's GovernedProjectCreation; the project.init.policy audit event records a compact
      form. Absent for every other kind and before execution.
    optional: true
  - name: gateStateId
    type: string
    description: >-
      A project:lock request only: the gate identity of the tree the request was made about,
      captured when the request was created and rendered `<algorithm>:<digest>`. The approved
      execution refuses when the tree's gate identity no longer matches it — an approver decides
      about the design the requester asked about, and an approval must never certify a design nobody
      asked to have approved. Absent on a request created before stage 5, which executes against the
      tree as it then stands.
    optional: true
methods: []
sourcePath: src/server/types.ts
