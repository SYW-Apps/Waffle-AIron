kind: value-object
id: pack_archive_manifest
name: PackArchiveManifest
description: >-
  The `.wpack` envelope, serialized as `wairon-pack.yaml` at the archive root — the portable,
  versioned identity + integrity header wrapping an ordinary directory pack. `kind` distinguishes a
  data-only declarative pack from a code pack (whose `entry` is executable); `entry` is the
  archive-relative path to the pack entry file (e.g. pack.yaml or pack.cjs). `formatVersion` gates
  archive-format compatibility (a newer major fails loudly rather than silently mis-reading);
  `minWaironVersion` gates runtime compatibility. Optional integrity: `digest` over the whole
  manifest and `entryDigests` (archive path → sha256) so an installer can verify contents.
  `name`/`version` must match the inner pack manifest (verified on build and inspect).
fields:
  - name: formatVersion
    type: number
    description: Pack-archive format version (currently 1); a newer major is rejected, not silently mis-read
    optional: false
  - name: name
    type: string
    description: Pack identity; must equal the inner pack manifest's name
    optional: false
  - name: version
    type: string
    description: Pack version (semver); must equal the inner pack manifest's version
    optional: false
  - name: kind
    type: string
    description: '"declarative" (data only) | "code" (has an executable entry / programmatic rules)'
    optional: false
  - name: entry
    type: string
    description: Archive-relative path to the pack entry file (e.g. "pack.yaml", "pack.cjs")
    optional: false
  - name: minWaironVersion
    type: string
    description: Minimum compatible wairon version (semver range)
    optional: true
  - name: digest
    type: string
    description: Optional integrity digest over the manifest
    optional: true
  - name: entryDigests
    type: Record<string, string>
    description: 'Optional per-entry integrity map: archive path → sha256'
    optional: true
  - name: generatedBy
    type: string
    description: Producer stamp, e.g. "@wairon/sdk@X.Y.Z"
    optional: true
  - name: generatedAt
    type: string
    description: ISO-8601 build timestamp
    optional: true
methods: []
componentClass: pack_codec
createdAt: '2026-07-21T18:12:30.258Z'
updatedAt: '2026-07-21T18:12:30.289Z'
