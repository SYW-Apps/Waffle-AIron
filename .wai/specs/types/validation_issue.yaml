kind: value-object
id: validation_issue
name: ValidationIssue
description: A single validation finding produced by the spec validator
fields:
  - name: severity
    type: string
    description: >-
      Issue severity after project overrides — error, warning or notice. A notice is reported on
      every surface that lists findings, beside errors and warnings and never mixed into them, but
      never makes a result invalid and never fails the --ci gate; a project raises a code from
      notice to warning or error, or lowers one to notice, through rules.sddRuleSeverity.
    optional: false
  - name: code
    type: string
    description: Stable machine-readable rule code (e.g. CIRCULAR_DEPENDENCY)
    optional: false
  - name: message
    type: string
    description: Human-readable description with remediation guidance
    optional: false
  - name: agentId
    type: string
    description: Related agent id, when the issue concerns topology
    optional: true
  - name: specId
    type: string
    description: Related spec id, when the issue concerns a spec node
    optional: true
  - name: draftContext
    type: Boolean
    description: >-
      True when the issue was raised on a draft/design spec (or an ancestor) — lets the --ci gate
      waive warnings that merely reflect declared, unfinished work.
    optional: true
methods: []
sourcePath: src/core/validation.ts
createdAt: '2026-06-10T22:00:00.000Z'
updatedAt: '2026-09-26T14:48:46.126Z'
