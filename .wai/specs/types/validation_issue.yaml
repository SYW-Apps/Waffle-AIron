kind: value-object
id: validation_issue
name: ValidationIssue
description: A single validation finding produced by the spec validator
fields:
  - name: severity
    type: string
    description: Issue severity — error or warning
    optional: false
  - name: code
    type: string
    description: Stable machine-readable rule code (e.g. CIRCULAR_DEPENDENCY)
    optional: false
  - name: message
    type: string
    description: Human-readable description with remediation guidance
    optional: false
  - name: agentId
    type: string
    description: Related agent id, when the issue concerns topology
    optional: true
  - name: specId
    type: string
    description: Related spec id, when the issue concerns a spec node
    optional: true
  - name: draftContext
    type: Boolean
    description: >-
      True when the issue was raised on a draft/design spec (or an ancestor) — lets the --ci gate
      waive warnings that merely reflect declared, unfinished work.
    optional: true
  - name: crossTreeContext
    type: Boolean
    description: >-
      True when a code↔spec conformance finding was downgraded to a warning because the tree is a
      chained subproject whose source paths may be authored relative to the parent root — waived by
      --ci. References are never marked: a chained child is judged through its parent or keeps its
      raw verdict.
    optional: true
methods: []
createdAt: '2026-06-10T22:00:00.000Z'
updatedAt: '2026-09-12T12:47:51.952Z'
