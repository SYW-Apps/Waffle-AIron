kind: value-object
id: validation_issue
name: ValidationIssue
description: A single validation finding produced by the spec validator
fields:
  - name: severity
    type: IssueSeverity
    description: >-
      Issue severity after project overrides. A notice is reported on every surface that lists
      findings, beside errors and warnings and never mixed into them, but never makes a result
      invalid and never fails the --ci gate; a project raises a code from notice to warning or
      error, or lowers one to notice, through rules.sddRuleSeverity.
    optional: false
  - name: code
    type: string
    description: Stable machine-readable rule code (e.g. CIRCULAR_DEPENDENCY)
    optional: false
  - name: message
    type: string
    description: Human-readable description with remediation guidance
    optional: false
  - name: agentId
    type: string
    description: Related agent id, when the issue concerns topology
    optional: true
  - name: specId
    type: string
    description: Related spec id, when the issue concerns a spec node
    optional: true
  - name: draftContext
    type: bool
    description: >-
      True when the issue was raised on a draft/design spec (or an ancestor) — lets the --ci gate
      waive warnings that merely reflect declared, unfinished work.
    optional: true
  - name: resolution
    type: ReferenceResolution
    description: >-
      On a finding about a cross-project reference: how the owner's gate resolved it (outcome,
      owner, call site, canonical target, input digest, reason), decided before the severity. It
      replaces the retired surfaceResolved flag, which existed only so the resolve-through-parent
      merge could tell a contract verdict from a resolution failure.
    optional: true
  - name: project
    type: string
    description: >-
      In a family run: the key of the project whose gate (or whose external, for a composition
      finding) the finding belongs to — '' for the family root. The finding's message is that
      gate's, verbatim; the run only prefixes it. Absent on the owner's own run.
    optional: true
  - name: advisory
    type: bool
    description: >-
      True on a finding reported beside a gate rather than by it — the live comparison of an
      external with its producer (family_validator.advise). Printed and counted with its severity,
      but never part of a failure decision: `valid` and `validate --ci` both ignore it, because the
      pin is the reproducible gate and a live producer is not.
    optional: true
  - name: target
    type: string
    description: >-
      Internal to validation: on a finding about a reference, the spec it points into, as kind:id
      (component:x, subsystem:x, interface:x, contract-of:<component>). A finding whose target
      exists but failed to parse is folded into that spec's parse error; the field never leaves
      validation.
    optional: true
  - name: unparsed
    type: map<string, string>
    description: >-
      Internal to validation: on a loader finding for a spec file that exists but did not parse,
      which spec it was (kind, id, and for a contract the component it names when the file got that
      far), so references into it are folded rather than judged against a hole; the field never
      leaves validation.
    optional: true
methods:
  - name: unparsedSentence
    signature: 'unparsedSentence(kind: string, id: string, refusals: list<ValidationIssue>): string?'
    params:
      - name: kind
        type: string
        description: The kind of spec read or written
      - name: id
        type: string
        description: Its id
      - name: refusals
        type: list<ValidationIssue>
        description: The loader's findings for the bound tree
    returns: string?
    description: >-
      The one sentence a read or a write answers for a spec of this kind and id whose file exists
      but fails to parse (a SCHEMA_VALIDATION_ERROR keyed on its id), instead of saying it does not
      exist: it quotes the loader's reason and says the file is repaired first, nothing written.
      None when no such refusal stands. A refusal a scan recorded carries its kind (unparsed); one a
      single-spec load recorded names it in its message. Pure.
    sourcePath: src/models/unparsed-spec.ts
    symbol: unparsedSpecSentence
sourcePath: src/core/validation.ts
