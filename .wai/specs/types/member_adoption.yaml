kind: value-object
id: member_adoption
name: MemberAdoption
description: >-
  A hosted adopt, planned or applied — the exact inverse of a hosted detach: the family migration
  plan (with the adopted project's move as creates at the member path and deletes at its isolated
  root), the member path, the principals whose reach changes (everyone the adopting project's chain
  grants GAINS access; anyone whose access came through the project's own placements, which stop
  being rungs and are removed, may change), and — when applied — the transaction outcome and the
  family commit.
subsystem: sdd_host
fields:
  - name: memberId
    type: string
    description: The adopted project's record id, now a member
    optional: false
  - name: plan
    type: MigrationPlan
    description: The adopt plan, including the move and the host store writes, refusals listed
    optional: false
  - name: memberPath
    type: string
    description: Where it now lives, relative to the adopting project's root
    optional: false
  - name: reachChanges
    type: ReachComparison[]
    description: >-
      Every subject x capability whose effective permission over the project (and each member below
      it) changes — gains through the new parent chain, and changes through the former placements
    optional: false
  - name: applied
    type: boolean
    description: True only when the transaction committed
    optional: false
  - name: outcome
    type: TransactionOutcome
    description: The transaction outcome when applied
    optional: true
  - name: commit
    type: GitPublish
    description: >-
      The family repository commit covering the touched family projects' .wai/, the adopted member's
      included
    optional: true
methods: []
createdAt: '2026-10-01T17:08:53.404Z'
updatedAt: '2026-10-01T17:08:53.406Z'
