kind: value-object
id: host_config
name: HostConfig
description: >-
  Resolved runtime configuration for the hosting server: bind addresses for the data and admin
  planes, the data root, auth posture, durable audit policy, and control-plane exposure posture.
fields:
  - name: host
    type: string
    description: Bind host for the data plane
    optional: false
  - name: port
    type: number
    description: Data-plane port
    optional: false
  - name: adminPort
    type: number
    description: Admin-plane port (separately bound)
    optional: false
  - name: dataDir
    type: string
    description: Data root holding projects/ and auth/
    optional: false
  - name: authEnabled
    type: boolean
    description: Whether data-plane auth is enforced (false only via explicit --no-auth)
    optional: false
  - name: authFile
    type: string
    description: Path to the API-key auth file
    optional: true
  - name: auditPolicy
    type: AuditRetentionPolicy
    description: >-
      Instance-level durable audit capture and retention policy. If omitted, the server uses the
      secure default policy.
    optional: true
  - name: exposurePolicy
    type: HostExposurePolicy
    description: >-
      Runtime exposure policy controlling which admin/UI/control-plane surfaces are exposed over
      HTTP versus local/CLI-only access.
    optional: true
  - name: quotaPolicy
    type: ResourceQuotaPolicy
    description: >-
      Hosted quota/rate policy evaluated for advisory (observe/warn) reporting only in this draft;
      it does not yet block or throttle project, token, or MCP usage. Actual enforcement in the data
      plane is a future integration and out of scope for now.
    optional: true
  - name: devMode
    type: boolean
    description: >-
      True only when the server runs as the local single-project developer server (`wairon dev`):
      loopback-bound, auth off, the one project = the current working directory. NEVER set by the
      hosted `serve` command, so the dev-only auto-session path can never appear in a real
      deployment.
    optional: true
  - name: builtinAdminUser
    type: string
    description: >-
      Built-in super-admin web-login username, read from WAIRON_ADMIN_USER by the serve command.
      When this or builtinAdminPassword is unset, password login is disabled (SSO-only) — the server
      still starts.
    optional: true
  - name: builtinAdminPassword
    type: string
    description: >-
      Built-in super-admin web-login password, read from WAIRON_ADMIN_PASSWORD by the serve command.
      Held in memory only — never persisted or logged; compared constant-time by the auth
      specialist.
    optional: true
methods: []
