kind: value-object
id: host_config
name: HostConfig
description: >-
  Resolved runtime configuration for the hosting server: bind addresses for the data and admin
  planes, the data root, auth posture, durable audit policy, advisory quota policy, and
  control-plane exposure posture.
fields:
  - name: host
    type: string
    description: Bind host for the data plane
    optional: false
  - name: port
    type: number
    description: Data-plane port
    optional: false
  - name: adminPort
    type: number
    description: Admin-plane port (separately bound)
    optional: false
  - name: dataDir
    type: string
    description: Data root holding projects/ and auth/
    optional: false
  - name: authEnabled
    type: boolean
    description: Whether data-plane auth is enforced (false only via explicit --no-auth)
    optional: false
  - name: auditPolicy
    type: AuditRetentionPolicy
    description: >-
      Instance-level durable audit capture and retention policy, as overrides of the secure default:
      each field set here wins and every unset field keeps the default (see effectiveAuditPolicy).
      The serve command sets it from WAIRON_AUDIT_POLICY, a JSON object of these fields, refusing an
      unknown field or a wrong type at startup.
    optional: true
  - name: exposurePolicy
    type: HostExposurePolicy
    description: >-
      Runtime exposure policy controlling which admin/UI/control-plane surfaces are exposed over
      HTTP versus local/CLI-only access.
    optional: true
  - name: quotaPolicy
    type: ResourceQuotaPolicy
    description: >-
      Hosted quota/rate policy, as overrides of the disabled default: each field set here wins and
      every unset field keeps the default (see effectiveQuotaPolicy). The serve command sets it from
      WAIRON_QUOTA_POLICY, a JSON object of these fields — enabled (boolean), mode (observe | warn |
      block), and the non-negative integer limits maxProjectsPerUser, maxMcpRequestsPerMinute,
      maxProjectBytes and maxAuditEventsPerDay — refusing invalid JSON, an unknown field or a wrong
      type at startup, so a misspelt policy never silently runs as the default. Evaluated for
      advisory (observe/warn) reporting only; it does not yet block or throttle project, token, or
      MCP usage, and a block mode is downgraded to an observation.
    optional: true
  - name: devMode
    type: boolean
    description: >-
      True only when the server runs as the local single-project developer server (`wairon dev`):
      loopback-bound, auth off, the one project = the current working directory. NEVER set by the
      hosted `serve` command, so the dev-only auto-session path can never appear in a real
      deployment.
    optional: true
  - name: builtinAdminUser
    type: string
    description: >-
      Built-in super-admin web-login username, read from WAIRON_ADMIN_USER by the serve command.
      When this or builtinAdminPassword is unset, password login is disabled (SSO-only) — the server
      still starts.
    optional: true
  - name: builtinAdminPassword
    type: string
    description: >-
      Built-in super-admin web-login password, read from WAIRON_ADMIN_PASSWORD by the serve command.
      Held in memory only — never persisted or logged; compared constant-time by the authentication
      component.
    optional: true
  - name: adminHost
    type: string
    description: Bind host for the admin plane (default 127.0.0.1)
    optional: false
methods:
  - name: effectiveAuditPolicy
    signature: 'effectiveAuditPolicy(): AuditRetentionPolicy'
    returns: AuditRetentionPolicy
    description: >-
      The audit retention policy in force: the secure default (capture info and above, keep 90 days
      and security events a year, skip reads, redacted metadata) with each field the configured
      auditPolicy sets laid over it. The one place the policy is resolved; every audit append passes
      what it answers. A tool running without a host config (an offline migration) gets the secure
      default.
    sourcePath: src/server/audit.ts
  - name: effectiveQuotaPolicy
    signature: 'effectiveQuotaPolicy(): ResourceQuotaPolicy'
    returns: ResourceQuotaPolicy
    description: >-
      The quota policy in force: the disabled default (enabled false, mode observe, no limits) with
      each field the configured quotaPolicy sets laid over it. The one place the policy is resolved;
      quota evaluation passes what it answers.
    sourcePath: src/server/operations.ts
sourcePath: src/server/types.ts
