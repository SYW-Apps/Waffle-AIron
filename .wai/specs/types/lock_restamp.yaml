kind: value-object
id: lock_restamp
name: LockRestamp
description: >-
  Provenance on a lock record whose release stamp was refreshed rather than re-approved: the
  approved design was unchanged and re-validated clean under a newer wairon release, so `wairon
  lock` carried the approval over — a new stateId, gateParts and validatorVersion — keeping lockedAt
  and lockedBy (the approval stays the approver's). Read by nothing that decides; shown beside the
  approval.
subsystem: sdd_core
fields:
  - name: at
    type: string
    description: ISO-8601 time of the refresh
    optional: false
  - name: fromVersion
    type: string
    description: The wairon release the approval was taken (or last refreshed) under
    optional: false
  - name: toVersion
    type: string
    description: The wairon release that re-validated it clean
    optional: false
  - name: by
    type: string
    description: The command that refreshed it (`wairon lock`), never a person
    optional: false
  - name: subject
    type: string
    description: >-
      The composition subject (`<algorithm>:<digest>`) of the human approval this restamp carried
      over — the stateId the record held when a person approved it, kept through every later
      restamp. A restamp is not a re-approval, so this, not the refreshed stateId, is what a parent
      pins of this project (lock_record.approvalSubject): a member's restamp never moves its
      parent's gate identity. Absent on a restamp written before it existed.
    optional: true
methods: []
sourcePath: src/models/lock.ts
createdAt: '2026-10-08T08:35:30.128Z'
updatedAt: '2026-10-08T18:51:13.807Z'
