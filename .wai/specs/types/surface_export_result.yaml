kind: value-object
id: surface_export_result
name: SurfaceExportResult
description: >-
  Result of a surface export: the projected snapshot, plus the rendered document body when a codec
  format (e.g. openapi) was requested and the written output path when one was given.
fields:
  - name: snapshot
    type: SurfaceSnapshot
    description: The projected contract-grade snapshot.
    optional: false
  - name: rendered
    type: string
    description: Rendered document body (e.g. OpenAPI 3.1 JSON) when a codec format was requested.
    optional: true
  - name: writtenTo
    type: string
    description: Written output path when one was requested.
    optional: true
  - name: renderedSet
    type: list<NamedOpenApiSpec>
    description: >-
      One named OpenAPI document per public portal (openapi format), never one combined document;
      narrowed to a single entry when a portal was selected.
    optional: true
  - name: writtenPaths
    type: list<string>
    description: Every written path; a multi-portal export writes one file per portal.
    optional: true
methods: []
sourcePath: src/core/surfaces.ts
createdAt: '2026-07-11T09:48:49.299Z'
updatedAt: '2026-10-04T10:21:14.354Z'
