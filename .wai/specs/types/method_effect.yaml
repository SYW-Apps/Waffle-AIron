kind: enum
id: method_effect
name: MethodEffect
description: >-
  What a contract method does to its component's held state. Required on a durable Store's contract
  methods for the durability round-trip pairing; a Supervisor may call a data component it does not
  own only through read and lifecycle methods (SUPERVISOR_WRITE_SHORTCUT).
fields: []
methods: []
sourcePath: src/models/specs.ts
values:
  - name: read
    description: Observes held state
  - name: write
    description: Modifies an entity's domain fields
  - name: lifecycle
    description: >-
      Creates, destroys, or (un)registers an entity's existence or membership without modifying its
      domain fields; closed under composition: it calls only read and lifecycle methods
      (LIFECYCLE_CALLS_WRITE)
