kind: value-object
id: member_reconciliation
name: MemberReconciliation
description: >-
  What reconciling a hosted family's member records with the family on disk did after a family-shape
  tool succeeded: the members registered (no grants and no placement — they inherit through their
  parent), the records whose path or parent moved, the records re-keyed by a project rename, the
  records whose member left the family (disabled, never deleted), the principals whose reach changed
  through those membership changes, and the one commit covering every touched project when the
  family is git-backed.
subsystem: sdd_host
fields:
  - name: registered
    type: string[]
    description: Member record ids created
    optional: false
  - name: relocated
    type: string[]
    description: Member record ids whose memberPath or parentProjectId changed
    optional: false
  - name: departed
    type: string[]
    description: Member record ids disabled because the family no longer declares them
    optional: false
  - name: commit
    type: GitPublish
    description: The family commit, absent when the family is not git-backed or nothing changed
    optional: true
  - name: renamed
    type: string[]
    description: >-
      'old->new' for every member record re-keyed by a project rename (its own-scope settings and
      key entries moved with it)
    optional: false
  - name: reachChanges
    type: ReachComparison[]
    description: >-
      Every subject x capability x project whose effective permission changed because a member
      gained, lost or changed its parent — audited with the change
    optional: false
  - name: returned
    type: string[]
    description: >-
      Member record ids re-enabled because the family declares their member again after they were
      disabled as departed
    optional: false
  - name: retired
    type: string[]
    description: >-
      Member records retired because their member's content is now a part of its parent (stage 8:
      demote) — disabled with the reason "part of <parent>", never deleted, their own-scope settings
      kept for a later promote.
    optional: false
methods: []
