kind: value-object
id: pack_candidate
name: PackCandidate
description: >-
  A pack write that has not happened yet, as an impact measurement is asked about it: which entry
  would be written (or removed), and, for a hosted install whose content arrives with the request,
  the manifest itself. The project it applies to is the bound one.
fields:
  - name: entry
    type: PackSelection | PackPath
    description: >-
      The selection `pack use` would record, or the legacy path reference `pack add` / a hosted
      install or adopt would register. Absent only for a write that changes the projectType and
      nothing else (a hosted setProjectType whose profile is builtin or whose pack is already
      registered): then the doctrine half is empty and the findings half measures the projectType
      change.
    optional: true
  - name: manifest
    type: ExtensionPack
    description: >-
      The pack's manifest when it is not on disk yet (a hosted install whose YAML arrives in the
      request). Given, it is merged at the entry's position instead of resolving the entry.
    optional: true
  - name: remove
    type: bool
    description: >-
      Measure dropping the entry instead of writing it: `pack unuse`, and `pack impact` on a pack
      that is already applied exactly as asked (then the report is what the pack accounts for now).
    optional: true
  - name: projectType
    type: string
    description: >-
      The projectType the same write also sets, when it does (a hosted install that governs the
      project by the pack's profile). Omitted, the project's own stands.
    optional: true
methods: []
sourcePath: src/models/pack-impact.ts
createdAt: '2026-09-29T15:50:47.325Z'
updatedAt: '2026-10-04T10:27:29.888Z'
