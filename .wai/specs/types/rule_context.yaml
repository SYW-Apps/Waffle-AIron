kind: value-object
id: rule_context
name: RuleContext
description: >-
  The read model and issue sink every rule method takes. The validator gathers it once per run — the
  loaded spec collections and their lookup maps, the surface snapshots, the source-code model, the
  writer's round-trip dry-run results, the known issue codes, pack data and lint-allow bookkeeping —
  so no rule does I/O or calls core. Its query methods are the analysis rules share, the way ESLint
  rules share analysis through their context; addIssue is its one effectful method.
fields:
  - name: system
    type: SystemSpec
    description: The L0 system spec
    optional: false
  - name: subsystems
    type: list<SubsystemSpec>
    description: The loaded subsystem specs
    optional: false
  - name: components
    type: list<ComponentSpec>
    description: The loaded component specs
    optional: false
  - name: interfaces
    type: list<InterfaceSpec>
    description: The loaded interface specs
    optional: false
  - name: implementations
    type: list<ImplementationSpec>
    description: The loaded implementation specs
    optional: false
  - name: types
    type: list<TypeSpec>
    description: The loaded type specs
    optional: false
  - name: rules
    type: RulesConfig
    description: 'The project''s rules config: severity overrides, naming, complexity and documentation settings'
    optional: true
  - name: projectType
    type: string
    description: The project type or profile id
    optional: false
  - name: scopeSubsystem
    type: string
    description: The subsystem a scoped run is limited to
    optional: true
  - name: componentMap
    type: map<string, ComponentSpec>
    description: Components by id
    optional: false
  - name: interfaceMap
    type: map<string, InterfaceSpec>
    description: Interfaces by id
    optional: false
  - name: subsystemIds
    type: set<string>
    description: Ids of the loaded subsystems
    optional: false
  - name: componentIds
    type: set<string>
    description: Ids of the loaded components
    optional: false
  - name: interfaceIds
    type: set<string>
    description: Ids of the loaded interfaces
    optional: false
  - name: publicSet
    type: map<string, set<string>>
    description: >-
      Per subsystem, the ids of its published components — its OWN component entries only: a
      re-export is a name, not a licence, so a component another subsystem re-exports is still
      depended on through its owning subsystem's publication
    optional: false
  - name: interfacesByComponent
    type: map<string, list<InterfaceSpec>>
    description: >-
      Interfaces grouped by owning component: the one enumeration of a component's contract methods
      that rules and the walk share
    optional: false
  - name: implementationsByContract
    type: map<string, list<ImplementationSpec>>
    description: Implementations grouped by contract interface id
    optional: false
  - name: surfaceSnapshots
    type: list<SurfaceSnapshot>
    description: >-
      The foreign surface snapshots (exchanged or authored imports in .wai/surfaces/) the bound root
      holds, which references into a foreign provider are checked against. Only the bound root's
      own: no member's snapshots are pooled or consulted (the mount-pool lookup is retired with
      resolve-through-parent).
    optional: false
  - name: codeModel
    type: CodeModel
    description: >-
      The source-code model the source analysis adapter builds for the run; empty when the run has
      none
    optional: false
  - name: roundTripIssues
    type: list<ValidationIssue>
    description: >-
      The writer's dry-run findings for every in-scope spec, gathered by the validator so the
      round-trip rule does no I/O
    optional: false
  - name: ext
    type: RuleExt
    description: >-
      Pack data: profiles, language tables, patterns, guarantee tokens, declarative assertions, pack
      selections and their resolution failures
    optional: false
  - name: variants
    type: list<VariantDef>
    description: The component-variant registry
    optional: false
  - name: lintAllows
    type: list<any>
    description: >-
      Per-spec lint.allow entries ({specId, code, reason, used}): addIssue marks the ones it
      applies, and the lint-allows rule audits them last
    optional: false
  - name: knownIssueCodes
    type: set<string>
    description: >-
      Every code a registered rule or declarative assertion can report, gathered by the validator
      for the lint-allow audit
    optional: false
  - name: carriedFindings
    type: list<CarriedFindingEntry>
    description: >-
      The conformance debt register (rules.conformance.carried), flattened to one entry per carried
      finding and carrying its reason group's kind and why. Carrying happens inside addIssue — after
      the lint allows, so an allow and an entry can never both claim one finding — and the
      carried-debt rule audits these entries at the end of the run.
    optional: false
  - name: carryableIssueCodes
    type: set<string>
    description: >-
      Every issue code a registered rule declares CARRYABLE, gathered by the validator — what the
      debt register's entries are checked against.
    optional: false
  - name: projectIdentity
    type: ProjectIdentity
    description: >-
      The validated root's identity, resolved by the validator from its project configuration
      against the id its lock recorded (project_config.identity), so the project-identity rule does
      no I/O. Absent when the root has no readable configuration, and on the run that judges a
      chained child through its parent: that run is about the child's specs, not the parent's
      identity.
    optional: true
  - name: exportTables
    type: list<ResolvedExportTable>
    description: >-
      The resolved export tables — one per loaded subsystem, then the bound root's L0 table, then
      each member project's L0 table — gathered by the validator through the core adapter, so the
      export-tables rule judges the resolver's problems without resolving anything itself. Absent on
      a candidate run.
    optional: true
  - name: projectFamily
    type: ProjectFamily
    description: >-
      The project graph of the run's scan, gathered by the validator through the core adapter: nodes
      with their bound externals, owners, cross-project references, the leading-`::` references
      authors wrote and identity problems. The family rules (project-boundaries, reference-forms,
      external-declarations, and the family half of project-identity) judge it without I/O. Absent
      on a candidate run.
    optional: true
  - name: exportUsages
    type: list<ExportUsage>
    description: >-
      For every (consumer, producer) pair the graph's cross-project references connect, those
      references mapped onto the producer's public names; the unexported ones are
      EXTERNAL_NOT_EXPORTED's facts. Absent on a candidate run.
    optional: true
  - name: pinnedExternals
    type: list<PinnedExternal>
    description: >-
      The bound project's declared externals with their lock entries and pinned snapshots, read by
      the validator from the project's own .wai/externals files: what a reference into a project
      outside the scan is judged against. Never the live producer, never anything above the bound
      root. Empty on a candidate run.
    optional: false
  - name: declaredMembers
    type: list<DeclaredMember>
    description: >-
      The bound root's declared members (project_config.declaredMembers), read by the validator from
      its configuration (stage 8), so the member-declarations rule names a member declared with the
      deprecated long-form `path` without I/O. Absent when the root has no readable configuration,
      and on a candidate run.
    optional: true
  - name: signatureFacts
    type: SignatureFacts
    description: >-
      What the loader's signature resolution recorded — the sources it met and the stored texts
      their params contradict. The loaded interfaces and types are already resolved, so these facts
      are the only place the stored form is still visible. Absent on a candidate run.
    optional: true
  - name: typeSpellingFacts
    type: TypeSpellingFacts
    description: >-
      What the loader's type canonicalisation recorded — the stored positions that are aliases of
      their canonical spelling, and the ones that are not canonical at all. The loaded interfaces
      and types already hold canonical text, so these facts are the only place the stored spellings
      are still visible. Absent on a candidate run.
    optional: true
  - name: network
    type: NetworkDeclaration
    description: >-
      The bound project's own network declaration (project_config.network), read by the validator
      from its configuration, so network-boundaries judges the project's own network without I/O.
      Absent when the project declares none, when its configuration is unreadable, and on a
      candidate run. The networks around a member are the family run's.
    optional: true
  - name: projectLanguages
    type: map<string, string>
    description: >-
      Each scanned project's L0 targetLanguage by project key ('' for the bound root, a contained
      member by its key), normalized like targetLanguageFor, derived from the project graph's nodes
      (project_node.targetLanguage): what library-calls judges a contained member's native library
      against. A project that declares none is absent. Absent on a candidate run.
    optional: true
  - name: retiredReachFacts
    type: list<RetiredReachFact>
    description: >-
      The retired reachability forms the run's scan met (spec_loader.retiredReachFacts): the loaded
      specs already read them compatibly (a retired invokedBy kind as entry or runtime), so these
      facts are the only place the stored form is still visible. entry-declarations reports
      INVOKED_BY_RETIRED_KIND from them. Absent on a candidate run.
    optional: true
  - name: bindingModules
    type: list<BindingModule>
    description: >-
      Every binding module the bound project's implementations name (implementation_spec.bindings),
      read once by the validator through the binding module adapter: what binding conformance
      compares with ctx.pinnedExternals. Absent on a candidate run and a reach-only run.
    optional: true
  - name: memberApprovedSurfaces
    type: map<string, SurfaceSnapshot>
    description: >-
      Each live member of the bound project projected at the approval it is judged against (the one
      the bound project's lock records, else the member's own last committed approval), keyed by the
      alias the bound project declares it under, read by the validator through the surfaces adapter
      only when a binding module was read: what binding conformance names a name the member dropped
      since its approval against. Absent on a candidate run, a reach-only run, and when no binding
      module was read.
    optional: true
methods:
  - name: isComponentDraft
    signature: 'isComponentDraft(compId: string): boolean'
    returns: bool
    description: Whether the component or an ancestor is in draft or design status
  - name: isImplementationDraft
    signature: 'isImplementationDraft(impl: ImplementationSpec): boolean'
    returns: bool
    description: >-
      Whether the implementation, its contract or the contract's component is in draft or design
      status
  - name: getComponentProfile
    signature: 'getComponentProfile(compId: string): string'
    returns: string
    description: >-
      The architectural profile governing the component: its subsystem's profile, else the project
      type
  - name: isTypeResolved
    signature: 'isTypeResolved(ref: string, generics: Set<string>): boolean'
    returns: bool
    description: >-
      Whether a type reference resolves to a builtin, one of the given generic parameters, or a type
      the bound project may name — owner-scoped and explicit, with no family-wide suffix matching
      anywhere. A bare identifier resolves among the bound project's OWN types first (by
      type_spec.matchesRef, whose segments compare by nameKey), then through the project's imports
      exactly as resolveCrossProject resolves a bare name: to a public type one import supplies — a
      contained member's live L0 table, or the pin of a declared external (its exported types; a
      type only inside a signature's closure is not importable). A contained member's types are
      never matched otherwise: the suffix match that used to accept `WafflerError` from anywhere in
      the scan is gone. A reference written through an alias (`billing::money`) resolves to a public
      type of that project the same way. The dotted form `billing.money` is a SUBSYSTEM reference:
      when its first segment names no subsystem of the bound project but one of its aliases, it does
      NOT resolve — another project is reached only as `alias::name`, and a dotted spelling left
      behind by a boundary move must never pass silently (aliasSpelling names the replacement). A
      first segment equal to the project's own id is read as its own id and resolves locally,
      reported by reference-forms as a deprecated form.
  - name: targetLanguageFor
    signature: 'targetLanguageFor(subsystemId?: string): string | undefined'
    returns: string?
    description: >-
      The effective target language for a subsystem — its own, else the system's — normalized to the
      language-table key (ts → typescript, js or node → javascript, rs → rust, py → python, c# or
      dotnet → csharp, golang → go, else lowercased)
  - name: isSpecInScope
    signature: 'isSpecInScope(specId: string): boolean'
    returns: bool
    description: Whether a spec is inside the run's subsystem scope; always true for an unscoped run
  - name: addIssue
    signature: >-
      addIssue(defaultSeverity: string, code: string, message: string, specId?: string,
      isDraftContext?: boolean, resolution?: ReferenceResolution, parts?: FindingParts): void
    returns: void
    description: >-
      Record a finding in the run's issue sink, the context's one effectful method. It drops a
      finding on a spec a contained member owns — that member's own gate judges it, under its own
      configuration — then drops findings outside the scope, applies the project's severity
      overrides (off drops the finding), downgrades completeness findings in draft context, records
      where the finding landed and whether it landed as an error (what the lint-allows audit reads),
      lets a matching lint allow silence a warning, lets a matching debt-register entry carry a
      warning whose every unit it lists (naming back any unit it does not), and attaches the
      reference resolution a cross-project finding carries.
  - name: isInChainedSubproject
    signature: 'isInChainedSubproject(subsystemId: string): boolean'
    returns: bool
    description: >-
      Whether the subsystem belongs to a contained member rather than the bound project: its owner
      in the project graph is not the bound root. Nothing about such a spec is judged in this
      project's gate — addIssue drops it, and the conformance family does not even read its source
      paths, which are relative to the member's root. The member judges it in its own gate.
  - name: resolveSurfaceRef
    signature: 'resolveSurfaceRef(ref: string, fromSubsystem?: string): SurfaceRefResolution'
    returns: SurfaceRefResolution
    description: >-
      The declared contract entry a reference that leaves the bound project lands on, so the
      contract checks (method exposed, capability served, guarantees declared, the Adapter-to-Portal
      shape) judge it like a local one. A reference whose alias names a declared external is looked
      up in that alias's pinned snapshot, by public name only; any other reference into a foreign
      provider is looked up in the bound root's own foreign snapshots, matched by provider, and
      snapshots of several providers that disagree on the contract make it ambiguous. No member's
      snapshots are consulted, and a reference resolveCrossProject does not report resolved is never
      looked up here.
  - name: interfaceMethodsOf
    signature: 'interfaceMethodsOf(compId: string): MethodSignature[]'
    returns: list<MethodSignature>
    description: >-
      Every contract method across the component's interfaces, memoized: eight rules ask per
      dispatch binding or per narrative step, and the array was rebuilt on every call
  - name: complexityConfigFor
    signature: 'complexityConfigFor(subsystemId?: string): ComplexityRuleConfig | undefined'
    returns: ComplexityRuleConfig?
    description: >-
      The complexity rule config in force for a subsystem: its profile pack's settings, overlaid
      with the project's own, so a project's explicit value wins over the pack's and the rule's
      default applies only where neither sets one
  - name: documentationConfigFor
    signature: 'documentationConfigFor(subsystemId?: string): DocumentationRuleConfig | undefined'
    returns: DocumentationRuleConfig?
    description: >-
      The documentation rule config in force for a subsystem: its profile pack's settings, overlaid
      with the project's own, so a project's explicit value wins over the pack's
  - name: isBuiltinType
    signature: 'isBuiltinType(ref: string): boolean'
    returns: bool
    description: >-
      Whether a type identifier is in the language-agnostic builtin vocabulary (string, u64,
      Promise, Map, and the rest), compared ignoring case
  - name: namingConfigFor
    signature: 'namingConfigFor(subsystemId?: string): NamingRuleConfig | undefined'
    returns: NamingRuleConfig?
    description: >-
      The naming rule config in force for a subsystem: its profile pack's settings, overlaid with
      the project's own, stereotype patterns merged key by key with the project's key winning
  - name: codeIndex
    signature: 'codeIndex(): CodeIndex'
    returns: CodeIndex
    description: >-
      The run's source-code model keyed for lookup, derived on first ask and kept — the one index
      the conformance family and the narrative detail dial read instead of each building its own
  - name: realizationIndex
    signature: 'realizationIndex(): RealizationIndex'
    returns: RealizationIndex
    description: Which source files realize which components, both ways, derived on first ask and kept
  - name: importGraph
    signature: 'importGraph(paths?: Set<string>): ImportGraph'
    returns: ImportGraph
    description: >-
      The import graph over a closed set of source paths — every path the run analyzed when none is
      given. Memoized per set, because resolution is string matching against it: a wider set
      resolves specifiers differently, so two consumers with different sets get two graphs
  - name: ownershipIndex
    signature: 'ownershipIndex(): OwnershipIndex'
    returns: OwnershipIndex
    description: Which pattern privately owns each member block, derived on first ask and kept
  - name: dependencyEdges
    signature: 'dependencyEdges(): DependencyEdges'
    returns: DependencyEdges
    description: >-
      Every dependsOn edge in the tree, resolved on first ask and kept: the prologue the five
      dependency rules each used to re-pay before they could judge anything, including the pack
      allowedEdges escape that must relax the whole matrix or none of it. An edge into another
      project whose contract entry is backed by an InProcess Portal is classified library once,
      here, so no boundary or matrix rule needs its own exemption
  - name: specIds
    signature: 'specIds(): SpecId[]'
    returns: list<SpecId>
    description: >-
      Every spec id in the tree with the kind label its findings name it by, in subsystem,
      component, interface, implementation, type order, derived on first ask and kept: the id
      hygiene rules judge ids and nothing else, and the five-collection walk was most of what their
      narratives said
  - name: implementationMethods
    signature: 'implementationMethods(): ResolvedMethod[]'
    returns: list<ResolvedMethod>
    description: >-
      Every implementation method whose descent resolves, with the component it realizes, the file
      that realizes it and its draft context, derived on first ask and kept: the six hops a
      conformance rule paid before it could examine anything, and plumbing in all of them. The
      conformance dial and the exact-grade test are not applied — that stance stays written in the
      rule that accuses
  - name: resolveCrossProject
    signature: >-
      resolveCrossProject(specId: string, position: string, reference: string): ReferenceResolution
      | null
    returns: ReferenceResolution?
    description: >-
      The owner's resolution of one reference the scan recorded (the project graph's authored
      references), before any severity: null for a reference that stays inside the bound project. A
      reference bound to a contained member is resolved against that member's live L0 export table
      (exported: resolved; unexported: missing). A reference bound outside the scan — an alias of a
      declared external — is resolved against pinnedExternals only: no pin is unavailable, a public
      name or member the pinned snapshot does not carry is missing, one it carries is resolved. A
      bare name of form import is resolved by the scan's import binding, completed here for
      externals outside the scan: the names each such external's `use` supplies are read from its
      pin (every exported name, closure-only types excluded, for `*`), compared by nameKey, with the
      same precedence — an explicit name beats a `*`, one supplier resolves, two are ambiguous
      (IMPORT_AMBIGUOUS), none leaves the name unresolved with a hint. A reference that reaches a
      project the bound project does not declare, or names a first segment that is neither one of
      its subsystems, a declared alias nor the provider of a foreign snapshot, is forbidden. A
      deprecated form that names no alias is unavailable. The result carries the owner, the call
      site, the canonical target, the import it came through and the digest of the input it was
      judged against, so every rule that reads it agrees and only project-boundaries reports a
      non-resolved outcome.
  - name: importHint
    signature: 'importHint(name: string): string | null'
    returns: string?
    description: >-
      For a bare name that resolves nowhere: the declared external or member of the bound project
      whose table (a member's live one, an external's pin) exports a name with the same nameKey
      without the project importing it, and the `use` line that would — `externals.shared.use:
      [waffler-error]`. Null when no declared dependency exports it: the lookup never leaves the
      project's own alias table. The unresolved-reference rules (UNDEFINED_TYPE_REFERENCE,
      INVALID_DEPENDENCY_REFERENCE, INVALID_TARGET_COMPONENT_REFERENCE) append it to their message.
  - name: severityOf
    signature: 'severityOf(code: string, specId: string): string | undefined'
    returns: string?
    description: >-
      The severity a finding of this code on this spec would be reported at outside draft context:
      the project's override, else the governing pack profile's, else the code's default as the
      validator gathered it from the registered rules and loaded assertions. None for a code the run
      does not know. The lint-allows audit reads it to tell an allow that names an error — which no
      allow can cover — from a stale one
  - name: aliasSpelling
    signature: 'aliasSpelling(ref: string): string?'
    params:
      - name: ref
        type: string
        description: The type reference as written
    returns: string?
    description: >-
      For a dotted type reference `<first>.<name>` whose first segment is an alias the bound project
      declares (a member or an external) rather than one of its subsystems, and whose supplier
      exports the name: the `alias::publicName` text it must be written as; null otherwise. The
      type-reference rules append it to UNDEFINED_TYPE_REFERENCE, so the finding says the project is
      another project and how to name its type.
  - name: projectOf
    signature: 'projectOf(specId: string): string'
    params:
      - name: specId
        type: string
        description: A spec key of the run's scan
    returns: string
    description: >-
      The key of the project that owns a spec key of the run's scan: '' for the bound project, else
      the contained member's key (its owner in the project graph, else the longest member key
      prefixing it). Pure over the scan.
