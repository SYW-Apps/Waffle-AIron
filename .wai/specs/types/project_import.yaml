kind: value-object
id: project_import
name: ProjectImport
description: >-
  One declared alias of a project with the `use` imports its configuration lists for it (stage 4):
  what a bare name of that project resolves through. Read from the project's own project.yaml by the
  project graph; an alias that imports nothing lists an empty `use`.
subsystem: sdd_core
fields:
  - name: alias
    type: string
    description: The member or external alias
    optional: false
  - name: section
    type: string
    description: 'externals | members: where the alias is declared, for the `use` line a hint names'
    optional: false
  - name: use
    type: list<string>
    description: The `use` entries, deduplicated in first-seen order; `*` stays `*`
    optional: false
methods: []
sourcePath: src/models/project-family.ts
createdAt: '2026-09-28T17:16:21.747Z'
updatedAt: '2026-10-04T10:20:50.904Z'
