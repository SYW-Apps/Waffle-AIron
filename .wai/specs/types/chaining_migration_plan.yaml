kind: value-object
id: chaining_migration_plan
name: ChainingMigrationPlan
description: >-
  The chaining migration of one family, planned and not yet applied: computed only from what the
  project graph, the scan's reference bindings and export usage already report, with one entry per
  project that has something to write, the reference rewrites (applied from the family's top), and
  every finding it will not decide for a person. `doctor --report chaining` prints it; `doctor
  --fix` prints it, asks, and applies it.
subsystem: sdd_cli
fields:
  - name: familyRoot
    type: string
    description: >-
      The directory of the highest root the climb reached: the family's top, whose graph the plan
      was computed from.
    optional: false
  - name: whole
    type: boolean
    description: >-
      Whether the climb reached the family's true top; false when a hop above was out of reach, so a
      producer above it could need writes the plan cannot see.
    optional: false
  - name: projects
    type: ProjectMigration[]
    description: >-
      The projects the plan writes, top root first, then members in the graph's walk order; a
      project with nothing to write is left out.
    optional: false
  - name: findings
    type: ChainingMigrationFinding[]
    description: Every ambiguity reported and every reference the plan cannot migrate, in the order found.
    optional: false
  - name: rewrites
    type: PlannedRewrite[]
    description: >-
      Every reference apply rewrites out of a deprecated form (leading `::`, `super::`, member path)
      into its canonical text, each listed: projects in walk order, then spec, then position.
    optional: false
methods:
  - name: isEmpty
    signature: 'isEmpty(): boolean'
    returns: boolean
    description: >-
      True when nothing is left to write: no project has an id, an L0 to create, an export entry, an
      external, an import, a pin, a member to move or a family pin to delete, and no reference is to
      be rewritten. Findings do not count — a plan can be empty and still report. An applied plan
      re-plans empty: the migration is idempotent.
  - name: blocked
    signature: 'blocked(): boolean'
    returns: boolean
    description: >-
      True when a finding refuses apply: the family is partial, a project the plan writes is absent,
      a member the family declares is absent, or a legacy mount carries a field its member already
      holds differently.
sourcePath: src/commands/chaining-migration.ts
