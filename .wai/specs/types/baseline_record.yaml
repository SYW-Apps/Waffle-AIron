kind: value-object
id: baseline_record
name: BaselineRecord
description: >-
  What a human last approved: the approved spec tree itself, plus who approved it and when. Stored
  OUTSIDE the project tree so approving never writes into the spec files — a lock records a
  decision, it does not edit the design. Holding the tree rather than a hash of it is what lets a
  later run answer "WHAT changed since approval", which is the only form a human can review, and is
  what replaced the per-file status ratchet.
fields:
  - name: schemaVersion
    type: string
    description: Record format version.
    optional: false
  - name: projectRoot
    type: string
    description: Absolute root this baseline belongs to — for debuggability, never for lookup.
    optional: false
  - name: systemName
    type: string
    description: The L0 system name at approval.
    optional: false
  - name: approvedAt
    type: string
    description: ISO-8601 timestamp of the approval.
    optional: false
  - name: approvedBy
    type: string
    description: 'Who approved: local:<user> for a CLI lock, hosted:<project> for a hosted one.'
    optional: false
  - name: stateId
    type: StateId
    description: The gate identity (spec content plus governing doctrine) at approval.
    optional: false
  - name: specs
    type: Record<string, string>
    description: >-
      Spec path RELATIVE to the project root, mapped to its byte-exact content at approval. Excludes
      chained children, which own their own baselines.
    optional: false
  - name: children
    type: Record<string, string>
    description: >-
      Chained child mount id mapped to that child's approved StateId — the pin, the way a git
      submodule pins a commit. A child edit does not dirty the parent; a child MOVING is what the
      parent reviews.
    optional: false
methods: []
