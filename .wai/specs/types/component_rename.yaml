kind: value-object
id: component_rename
name: ComponentRename
description: >-
  What renaming a component changed: the specs moved to new ids, and the specs whose references were
  rewritten
fields:
  - name: renamed
    type: SpecRename[]
    description: >-
      The component, and each interface and implementation named after it (i<id>, <id>_impl), with
      its old and new id
    optional: false
  - name: rewritten
    type: string[]
    description: >-
      Ids of the other specs whose references to a renamed id were rewritten — lint allows naming
      the component included
    optional: false
  - name: carried
    type: CarriedRekey[]
    description: >-
      Every edit the rename made to the debt register (.wai/project.yaml rules.conformance.carried):
      an entry anchored on a renamed spec, or naming the component in its site or covered units.
      Empty when the register names none of them
    optional: false
methods: []
sourcePath: src/core/provision.ts
createdAt: '2026-09-15T10:51:05.887Z'
updatedAt: '2026-09-26T11:01:02.343Z'
