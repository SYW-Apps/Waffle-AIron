kind: value-object
id: chained_subproject_dir
name: ChainedSubprojectDir
description: >-
  One direct member of a project: its resolved directory, the alias the project declares it under,
  and whether it is declared in project.yaml `members` or by a legacy L1 mount.
fields:
  - name: dir
    type: string
    description: The member's resolved directory
    optional: false
  - name: alias
    type: string
    description: 'The alias it is declared under: the `members` key, or the legacy mount subsystem''s id'
    optional: false
  - name: form
    type: MountForm
    description: How the parent declares it.
    optional: false
methods: []
lint:
  allow:
    - code: MISSING_TYPE_SOURCE_PATH
      reason: >-
        No named declaration: the shape is the inline element type `{ dir; alias; form }` of
        listDirectChainedSubprojects' return in src/core/provision.ts, so there is no symbol a
        sourcePath could bind.
