kind: value-object
id: surface_type_export
name: SurfaceTypeExport
description: >-
  A type the producing project exports by name (a typeDef export), listed in a surface snapshot
  apart from the contract entries, because a type is not a contract. Its definition is in the
  snapshot's type closure.
fields:
  - name: id
    type: string
    description: The type's public name in the producer's export table.
    optional: false
    key: primary
  - name: type
    type: string
    description: The id of the type's definition in the snapshot's type closure.
    optional: false
  - name: audience
    type: string
    description: 'Exposure level from the L0 entry: project < department < instance < partner < external.'
    optional: false
methods: []
