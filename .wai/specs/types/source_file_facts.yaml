kind: value-object
id: source_file_facts
name: SourceFileFacts
description: >-
  Pure analysis facts for one resolved source path — an implementation's, a method's or a sim
  harness's; the unit of the CodeModel. Name sets are anchor tiers for realization checking:
  declaredNames satisfy the 'declared' conformance tier, anchoredNames additionally satisfy the
  'anchored' tier. Carries the analysis grade so findings can state how confident the analysis was
  (exact AST vs pattern table vs generic scan).
subsystem: sdd_validator
fields:
  - name: path
    type: string
    description: >-
      Project-relative resolved source path (the key many implementations and methods may share,
      N:1)
    optional: false
  - name: status
    type: string
    description: >-
      analyzed | missing (the path resolves to no file) | escaped (absolute or parent-escaping path,
      refused by containment) | unreadable (binary or read failure)
    optional: false
  - name: language
    type: string
    description: Effective language the file was analyzed as (from extension + language tables)
    optional: true
  - name: analysisGrade
    type: string
    description: >-
      exact (AST) | pattern (declarative per-language pattern table) | generic (word-boundary scan)
      — carried onto finding messages
    optional: true
  - name: declaredNames
    type: string[]
    description: >-
      Declaration-tier anchors: named declarations at any nesting depth, destructuring bindings,
      object-literal keys, import bindings, and export specifiers (export-* barrels chased through
      relative specifiers with a visited set)
    optional: false
  - name: anchoredNames
    type: string[]
    description: >-
      Weaker anchors: exact string-literal occurrences (tool/route registrations) and
      property-access references (forwarding through a namespace, e.g. specs.loadComponentSpecs) —
      satisfy only the 'anchored' conformance tier
    optional: false
  - name: exportedNames
    type: string[]
    description: Exported bindings of the file (Level 2 dependency-conformance and UNDECLARED_EXPORT fuel)
    optional: false
  - name: imports
    type: string[]
    description: >-
      Runtime import/require module specifiers found in the file (dependency-conformance fuel).
      Type-only imports are excluded — type coupling is allowed by default and never forms a
      dependency edge.
    optional: false
  - name: reexports
    type: string[]
    description: >-
      Module specifiers of export-from declarations — surface republication, not collaboration:
      never accused as an undeclared dependency, but realizes a declared forwarding edge (a portal
      barrel republishing its orchestrator).
    optional: false
  - name: functionComplexity
    type: Record<string, number>
    description: >-
      Cyclomatic complexity per named function-like (function, method and accessor declarations, and
      function or arrow initializers of named slots); exact grade only, and same-named functions
      record their maximum — fuel for the detail-sufficiency lint
    optional: true
  - name: topLevelMutableBindings
    type: string[]
    description: >-
      Module-scope let and var bindings; exact grade only — fuel for the hidden-state lint, which
      cannot see mutation of const-bound containers
    optional: true
  - name: reexportOnly
    type: boolean
    description: >-
      True when the file declares nothing of its own and every name it publishes comes from a
      re-export — a pure re-export barrel, which has no code to claim. Exact grade only: a weaker
      grade cannot tell a barrel from a file it failed to parse, so it leaves this unset rather than
      guess.
    optional: true
  - name: functionCallSites
    type: Record<string, CallSiteFact[]>
    description: >-
      Direct call SITES per named function-like, with the shape each call was written in (nested
      named functions carry their own entries; anonymous callbacks count toward their enclosing
      function); exact grade only, and same-named functions union their sites. A function-like WITH
      A BODY always gets an entry, empty when it calls nothing; a name with NO entry has no body in
      this file to read — which is the whole of hasFunctionBody, and why an empty entry is never
      dropped
    optional: true
  - name: importBindings
    type: Record<string, ImportBindingFact>
    description: >-
      Runtime (value) import bindings by local name; exact grade only — a weaker grade sees module
      specifiers but never which local name they bound. The closed set a call site's origin is
      resolved through
    optional: true
  - name: fieldTypes
    type: Record<string, string[]>
    description: >-
      The type names an instance FIELD is DECLARED with, by field name — read off class property
      declarations and constructor parameter properties, which is where a constructor-injected
      collaborator says what it is; exact grade only. Same-named fields of different classes in one
      file keep every declared type, since the file cannot say which class a call site's `this` was,
      and a wider answer only ever widens what a call may have reached. A field with no annotation
      records nothing: what an initializer INFERS is not what the code declares
    optional: true
  - name: typeOnlyBindings
    type: Record<string, string>
    description: >-
      The module specifier each TYPE-ONLY import binding came from, by local name; exact grade only.
      The half of the import list importBindings deliberately leaves out, because a type binding can
      never be a call ORIGIN — and exactly what a declared field type is resolved through, which is
      why it is kept apart rather than folded in
    optional: true
  - name: localTypes
    type: Record<string, string[]>
    description: >-
      The type names a locally BOUND name is DECLARED with, by name — read off function and method
      parameters and off variable declarations that carry an annotation, which is where a module
      that wires its collaborators as closures writes down what each one is; exact grade only. Keyed
      by name across the whole file, as fieldTypes is: the facts cannot say which function a call
      site sits in, and a receiver is as often a parameter of an ENCLOSING function as of the one
      that calls it — a closure captures it. Same-named bindings therefore keep every declared type,
      and a wider answer only ever widens what a call may have reached. A binding the file annotates
      with nothing records nothing, and so does one annotated with anything but a plain type
      reference: what an initializer INFERS is not what the code declares
    optional: true
  - name: typeShapes
    type: Record<string, TypeShapeFact>
    description: >-
      The members of each named shape the file declares, by declaration name — what lets a type
      spec's `fields` be checked against the data the code actually carries, rather than read as
      truth by the ERD and every brief. EXACT grade only: below it a member list cannot be told from
      a mention, and a guess about somebody's data model is worse than silence.
    optional: true
  - name: functionParams
    type: Record<string, ParameterFact[][]>
    description: >-
      The parameter lists of each named function-like in the file, by name — what lets a contract's
      declared `params` be checked against the signature that realizes them, the last of the three
      code-to-spec readings nothing had ever made. EVERY body under a name is kept, not the first: a
      file routinely holds a class member and the module-level facade that forwards to it under one
      name, with different parameters, and picking one silently drops the other's leading argument
      from view. Same-named bodies therefore keep every candidate, exactly as the field-type facts
      do, and a reader accuses only what all of them agree on. Overloads record the implementation
      signature, the one with a body, because that is the one a caller reaches. EXACT grade only:
      below it a parameter list cannot be told from a call.
    optional: true
  - name: functionRoutes
    type: Record<string, RouteFact[]>
    description: >-
      The routes each named function-like in the file handles, by name — what lets a listener's
      mount be read against the contract endpoints of the portal it serves, so a route the router
      answers that no contract declares cannot go unnoticed again. EXACT grade only: reading a guard
      as a route needs the conditions as expressions, not as text. A function with no recognisable
      route records none rather than an empty guess.
    optional: true
methods:
  - name: resolveImport
    signature: 'resolveImport(specifier: string, knownPaths: Set<string>): string | undefined'
    returns: string | undefined
    description: >-
      Resolve one of this file's relative import specifiers against a set of known source paths:
      join it with this file's directory, then try the joined path, .js swapped for .ts or .tsx, the
      .ts, .tsx and .js extensions, and an index file; undefined for a bare package specifier or
      when nothing matches
  - name: callSitesOf
    signature: 'callSitesOf(fn: string): CallSiteFact[] | undefined'
    returns: CallSiteFact[] | undefined
    description: >-
      The call sites written inside one named function-like, or undefined when the file holds no
      BODY under that name. The two answers are different findings and must never be collapsed: an
      empty array is a body that calls nothing, undefined is nothing to read
  - name: hasFunctionBody
    signature: 'hasFunctionBody(symbol: string): boolean'
    returns: boolean
    description: >-
      Whether the file holds a function-like BODY under a name, as the model measured it: a
      function, method or accessor declaration, or a function/arrow initializer bound to a named
      slot. A name declared WITHOUT one — an overload signature, an ambient declaration, an
      interface or type member, a plain value binding, an import binding, a re-export specifier —
      answers false. Only exact grade measures bodies, so a file below it always answers false and a
      caller that would ACCUSE on the answer must check the grade itself
  - name: importBindingOf
    signature: 'importBindingOf(name: string): ImportBindingFact | undefined'
    returns: ImportBindingFact | undefined
    description: >-
      The runtime import binding this file makes under a local name, or undefined when the name is
      not an import of this file — it is local, global, or bound type-only
  - name: fieldTypesOf
    signature: 'fieldTypesOf(field: string): string[]'
    returns: string[]
    description: >-
      The type names an instance field is declared with, or EMPTY when the file declares no such
      field, annotates it with nothing, or was analyzed below exact grade — an empty answer being
      what keeps an unresolvable field from becoming a guess
  - name: typeBindingOf
    signature: 'typeBindingOf(name: string): string | undefined'
    returns: string | undefined
    description: >-
      The module specifier a NAME was imported from, whether the import was type-only or a runtime
      one, since a declared type may be spelled either way; undefined when the file imports no such
      name, which leaves the name local, global or ambient
  - name: localTypesOf
    signature: 'localTypesOf(name: string): string[]'
    returns: string[]
    description: >-
      The type names a locally bound name is declared with, or EMPTY when the file binds no such
      name, annotates it with nothing, or was analyzed below exact grade — the empty answer being
      what keeps an unannotated receiver from becoming a guess, exactly as it is for a field
