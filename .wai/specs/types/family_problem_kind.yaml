kind: enum
id: family_problem_kind
name: FamilyProblemKind
description: >-
  What a family identity or membership problem is: a fact no single project can see alone. Reported,
  never judged.
subsystem: sdd_core
fields: []
methods: []
sourcePath: src/models/project-family.ts
values:
  - name: id-collision
    description: Two projects of the family hold one id
  - name: no-id
    description: A project declares no id and its name yields none
  - name: defaulted
    description: >-
      A member declares no id: it answers to its name slug, and the id it should declare is its
      alias
  - name: member-absent
    description: A contained project member's entry or legacy mount whose directory does not exist
  - name: alias-conflict
    description: An alias declared both as a member and as an external
  - name: duplicate-spec
    description: One key declared by two spec files of one project (a part's and its parent's included)
  - name: part-unavailable
    description: A part whose files could not be read
  - name: kind-mismatch
    description: What a member's content makes it disagrees with what is declared or written about it
