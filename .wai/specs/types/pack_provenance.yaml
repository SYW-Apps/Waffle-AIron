kind: value-object
id: pack_provenance
name: PackProvenance
description: >-
  Provenance record for a loaded extension pack: its declared name, the resolved ref it loaded from,
  and whether it was a global (machine-wide) or project-scoped pack.
fields:
  - name: name
    type: string
    description: The pack's declared name.
    optional: false
  - name: ref
    type: string
    description: The resolved ref/path the pack loaded from.
    optional: false
  - name: scope
    type: PackScope
    description: Which layer the pack loaded from (project packs win on collision).
    optional: false
methods: []
lint:
  allow:
    - code: MISSING_TYPE_SOURCE_PATH
      reason: >-
        No named declaration: the record is the inline element type of LoadedExtensions.packs in
        src/core/extensions.ts, so there is no symbol a sourcePath could bind.
createdAt: '2026-07-14T18:56:28.020Z'
updatedAt: '2026-10-07T06:30:22.593Z'
