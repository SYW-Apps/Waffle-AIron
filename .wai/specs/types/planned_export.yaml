kind: value-object
id: planned_export
name: PlannedExport
description: >-
  One L0 entry the chaining migration adds to a project so references another project makes into it
  land on a public name, or so a legacy mount's published surface survives the move into the member.
  One entry per source and item, shared by every consumer that needs it; written as `{ from,
  component | typeDef, audience: project }` for a subsystem-owned item, as the own `{ typeDef,
  audience: project }` for a project-level type, with no `as`, so its public name is the item's
  default. An entry carried from a mount also keeps the mount entry's transport kind and details.
subsystem: sdd_cli
fields:
  - name: from
    type: string
    description: >-
      The source subsystem's local id in the producer: the subsystem that owns the item and already
      publishes it at L1. Absent for a project-level type, which the project exports as its own
      item.
    optional: true
  - name: component
    type: string
    description: The re-exported component's local id, for a component reference.
    optional: true
  - name: typeDef
    type: string
    description: The re-exported type's local id, for a type reference.
    optional: true
  - name: publicName
    type: string
    description: >-
      The public name the entry binds: the item's default (its id), checked free in the producer's
      table when planned.
    optional: false
  - name: audience
    type: string
    description: >-
      Always project: the family sees `project`, and a migration never widens a surface beyond the
      family that already used it.
    optional: false
  - name: consumers
    type: string[]
    description: The namespaces of the projects whose references the entry serves, sorted.
    optional: false
  - name: members
    type: string[]
    description: >-
      The members the consumers reach through the entry (contract methods, `capability:<name>`, or
      `type`), sorted — what the report prints and the pin's `used` map will hold.
    optional: false
  - name: type
    type: string
    description: >-
      The transport kind a carried mount entry declared (REST, GraphQL, MessageBus, RPC, Custom);
      absent for a reference entry, which inherits it from its source.
    optional: true
  - name: details
    type: string
    description: The details a carried mount entry declared; absent for a reference entry.
    optional: true
  - name: reason
    type: string
    description: >-
      reference | mount: planned because references land on it, or carried from a legacy mount's
      publicInterfaces.
    optional: false
methods: []
sourcePath: src/commands/chaining-migration.ts
createdAt: '2026-09-26T21:11:40.727Z'
updatedAt: '2026-09-27T10:44:17.012Z'
