kind: entity
id: identity_provider_config
name: IdentityProviderConfig
description: >-
  Hosted-instance configuration for an external identity provider used by the admin UI or future
  user-facing control plane. It stores provider metadata and references to secrets by key name,
  never raw client secrets.
subsystem: sdd_host
fields:
  - name: id
    type: string
    description: Stable identity provider config id.
    optional: false
  - name: providerType
    type: string
    description: 'Provider kind: "oidc", "google_workspace", "entra_id", "keycloak", "authentik", or "local".'
    optional: false
  - name: issuerUrl
    type: string
    description: OIDC issuer/discovery URL when applicable.
    optional: true
  - name: clientId
    type: string
    description: Public client id for OIDC/browser flows.
    optional: true
  - name: clientSecretRef
    type: string
    description: Secret registry key holding the client secret; never the raw secret.
    optional: true
  - name: allowedDomains
    type: string[]
    description: Optional email domains allowed to authenticate through this provider.
    optional: true
  - name: adminGroupClaims
    type: string[]
    description: External group or claim values mapped to hosted instance admin grants.
    optional: true
  - name: enabled
    type: boolean
    description: Whether this provider is available for sign-in.
    optional: false
  - name: updatedAt
    type: string
    description: ISO-8601 update timestamp.
    optional: false
  - name: allowedRedirectUris
    type: string[]
    description: >-
      Exact-match allowlist of redirect URIs accepted for this provider's SSO flow. When set and
      non-empty, a redirectUri not on the list is refused (server-side redirect_uri pinning). When
      unset/empty, any redirectUri is accepted (backward compatible).
    optional: true
  - name: authorizationEndpoint
    type: string
    description: >-
      Explicit browser-facing authorization endpoint override. When set, wins over OIDC discovery
      and providerType templates. This is the PUBLIC front-channel URL the user's browser is
      redirected to — set it to a browser-reachable address (public, or VPN-internal if all users
      are inside the network). The split-horizon lever paired with an internal tokenEndpoint.
    optional: true
  - name: tokenEndpoint
    type: string
    description: >-
      Explicit server-facing token endpoint override. When set, wins over discovery/templates. This
      is the BACK-CHANNEL URL the host server calls directly for code->token exchange, so it may be
      a VPC-internal address (e.g. https://authentik.internal) unreachable from the public internet.
    optional: true
  - name: jwksUri
    type: string
    description: >-
      Explicit JWKS URI override for id_token signature verification. Server-facing back-channel
      (may be VPC-internal, like tokenEndpoint). When unset, resolved from discovery or the
      providerType template.
    optional: true
  - name: userinfoEndpoint
    type: string
    description: >-
      Explicit userinfo endpoint override. Server-facing back-channel used as a fallback
      identity-verification path when JWKS verification is unavailable.
    optional: true
  - name: displayName
    type: string
    description: >-
      Optional admin-set human label for this provider, shown on the login screen's "Sign in with
      <displayName>" button. Defaults to the provider id when unset. Presentation only — never used
      for provider resolution.
    optional: true
methods: []
