kind: value-object
id: rules_config
name: RulesConfig
description: Rules configuration
fields:
  - name: noOverlappingOwnership
    type: bool
    description: Two agents may not own the same path
    optional: false
  - name: requireOwnedPaths
    type: bool
    description: Non-meta agents must declare ownedPaths
    optional: false
  - name: metaAgentTags
    type: list<string>
    description: Tags exempting an agent from ownership requirements
    optional: false
  - name: enforceReproducibility
    type: bool
    description: Generated files must be reproducible from the registry
    optional: false
  - name: sddRuleSeverity
    type: any
    description: >-
      Per-code severity overrides for the SDD conformance rules: error, warning, notice or off. A
      code set to notice is still reported but never fails the gate; one set to off is not reported
      at all.
    optional: false
  - name: naming
    type: NamingRuleConfig
    description: Naming convention enforcement rules applied by the linter
    optional: true
  - name: complexity
    type: ComplexityRuleConfig
    description: Complexity threshold rules applied by the linter
    optional: true
  - name: documentation
    type: DocumentationRuleConfig
    description: Documentation completeness rules applied by the linter
    optional: true
  - name: conformance
    type: ConformanceRuleConfig
    description: >-
      Where this project's own source lives and what of it no spec claims yet — the opt-in domain of
      the unclaimed-source check
    optional: true
  - name: generateComponentImplementers
    type: bool
    description: 'Whether generation derives an implementer agent per component (default: false)'
    optional: false
  - name: materializeAgentFiles
    type: bool
    description: >-
      Whether generation writes agent files to disk; when false the live briefs are the only view of
      the topology (default: false)
    optional: false
  - name: designDepth
    type: DesignDepth
    description: How deep the design must go before it is complete. A subsystem may override it.
    optional: true
methods: []
sourcePath: src/models/project.ts
createdAt: '2026-06-10T22:00:00.000Z'
updatedAt: '2026-10-04T23:40:30.505Z'
