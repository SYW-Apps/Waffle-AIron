kind: value-object
id: token_mint_request
name: TokenMintRequest
description: >-
  Authorized request to mint a user-bound MCP/API token that acts as the owner user, narrowed to a
  set of projects. The token carries no permissions of its own — it can never exceed the owner's
  live permission (the resolver gates per project).
fields:
  - name: ownerUserId
    type: string
    description: Hosted user or service-principal id that will own the token.
    optional: false
  - name: label
    type: string
    description: Human-readable token label for administration and audit views.
    optional: false
  - name: expiresAt
    type: string
    description: Optional ISO-8601 token expiry.
    optional: true
  - name: projects
    type: string[]
    description: >-
      The project ids the token may act on (or "*" for the owner's full accessible set) — the
      token's narrowing.
    optional: false
methods: []
createdAt: '2026-07-08T20:17:13.853Z'
updatedAt: '2026-07-15T22:51:35.556Z'
