kind: value-object
id: variant_def
name: VariantDef
description: >-
  A component variant: a named, base-anchored specialization of a core stereotype (a "kind of
  Adapter/Orchestrator/Portal/…") carrying implementation guidance. Lives in a registry on top of
  packs, layered built-in, then global, then project; the base stays authoritative for generic
  semantics.
fields:
  - name: id
    type: string
    description: Variant id referenced by a component's variant (e.g. publisher, org/external-config-adapter).
    optional: false
  - name: base
    type: string
    description: >-
      The core stereotype this variant specializes — authoritative for generic semantics (Adapter,
      Orchestrator, Portal, …).
    optional: false
  - name: guidance
    type: string
    description: >-
      How to implement a component of this variant; the recipe reused across same-variant
      components.
    optional: false
  - name: target
    type: string
    description: 'Optional: only applies for the given target language.'
    optional: true
  - name: profile
    type: string
    description: 'Optional: only applies under the given architectural profile.'
    optional: true
methods: []
createdAt: '2026-07-15T12:23:33.024Z'
updatedAt: '2026-09-15T18:44:58.813Z'
