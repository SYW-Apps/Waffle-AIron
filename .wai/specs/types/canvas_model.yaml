kind: value-object
id: canvas_model
name: CanvasModel
description: >-
  The whole tree as the interactive canvas needs it: the system with its vision, target language,
  databases and view preferences, every subsystem and component with its prose, and the edges
  between them. Wider than the export model on purpose — the canvas is explorable, so it carries
  what a reader clicks into, while a static export carries only what it can draw. It is also the
  model the live web canvas consumes, which is why building it is a separate method from rendering
  it.
fields:
  - name: system
    type: object
    description: >-
      The system's name, vision, target language, declared databases, and the diagram view
      preferences the canvas opens with.
    optional: false
  - name: generatedAt
    type: string
    description: When the model was built, stamped into the rendered page.
    optional: false
  - name: subsystems
    type: object[]
    description: >-
      Each subsystem's id, name and description — and, for a project with members, each PROJECT
      member as a project node (stage 3), a referenced one (a `../`, git or hosted source; stage 8)
      drawn from outside with its storage; on a hosted instance a member node carries its hosted
      record id (recordId) only when the caller may read that record, and the engine makes exactly
      those nodes open the member's own project page through the host's open-project hook — a node
      without one is drawn without a link. A contained project member opens by drilling into it, as
      a subsystem does (its specs are in the model); a referenced one has no specs in the model, so
      locally it opens its details panel: its storage, and the relations that land on it. A part's
      subsystems are the project's own subsystems, each carrying the part's storage badge
      (`storage`: `part <alias> · contained`, `… · ../admin`, `… · git <short commit>`) and opening
      as any subsystem does — composition decides what is drawn, storage only how it is labelled.
    optional: false
  - name: components
    type: object[]
    description: Each component with what the canvas shows about it, including the findings marked on it.
    optional: false
  - name: edges
    type: object[]
    description: >-
      Dependency and ownership edges between the nodes, each flagged when it crosses a subsystem
      boundary; a dependency on a referenced project's public name lands on that project's node (a
      consumption edge, stage 8). A consumption edge — one whose source and target lie in different
      projects of the family — names the relation it belongs to (`relation`: a CanvasRelation id,
      `<consumer>→<producer>`) when the model carries relations, and takes that relation's health;
      an edge between two projects with relations computed but no entry for its pair names an
      unavailable relation, never none.
    optional: false
  - name: relations
    type: CanvasRelation[]
    description: >-
      Relation health, one entry per consumer-project-to-producer-project pair the canvas draws an
      edge between, with the per-use detail and the time it was compared. PRESENT only when health
      was computed for this model (an empty list when nothing is consumed); ABSENT when it was not
      (`wairon diagram --no-health`, a model built before this field) — then every consumption edge
      is drawn neutral and the legend says relation health was not checked, so a canvas never shows
      green for something no one compared. A snapshot or exported page carries the relations as they
      were when it was built, each with its comparedAt.
    optional: true
methods: []
sourcePath: src/core/canvas.ts
