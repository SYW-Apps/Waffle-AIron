kind: value-object
id: shared_view_result
name: Shared View Result
description: >-
  The outcome of resolving a share token: whether it was served, and on success the snapshot model
  plus the link's download permissions. Carries no owner-only fields.
subsystem: sdd_host
fields:
  - name: found
    type: bool
    optional: false
  - name: outcome
    type: ShareViewOutcome
    description: How resolving the token ended.
    optional: false
  - name: link
    type: ShareLink
    optional: true
  - name: model
    type: string
    description: Serialized snapshot canvas model, on success.
    optional: true
  - name: allowDownloadHtml
    type: bool
    optional: true
  - name: allowDownloadOpenapi
    type: bool
    optional: true
  - name: html
    type: string
    description: >-
      Captured self-contained view HTML, on success — served by the portal so it never reaches into
      the snapshot repository itself.
    optional: true
methods: []
sourcePath: src/server/types.ts
symbol: SharedViewResult
createdAt: '2026-07-17T22:32:51.513Z'
updatedAt: '2026-10-07T06:29:46.414Z'
