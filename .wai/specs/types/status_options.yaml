kind: value-object
id: status_options
name: StatusOptions
description: >-
  How much of the tree a status report should cover. Both fields are optional and both narrow rather
  than widen: absent means the whole project, recursively.
fields:
  - name: subsystem
    type: string
    description: >-
      Report on one subsystem rather than the whole tree. Accepts a namespaced id, so a chained
      subproject's subsystem can be named from the parent.
    optional: true
  - name: recursive
    type: boolean
    description: >-
      How far into chained subprojects to follow. Absent means all the way down; a depth may be
      given instead of a flag to stop at a level.
    optional: true
  - name: approvals
    type: ProjectApproval[]
    description: >-
      The pin tree to print, computed by the validator at each project's own root
      (validator_portal.familyApprovals) and handed in by the caller — core cannot compute a gate
      identity itself. When given, each [Project] line carries its member's approval state and how
      its parent pinned it, and the report ends with the root's own state. Absent: the report shows
      no approval states.
    optional: true
methods: []
sourcePath: src/core/status.ts
