kind: value-object
id: authored_reference
name: AuthoredReference
description: >-
  A reference as its author wrote it, recorded by the scan before binding replaces it with the
  in-memory key of its target: every reference that carries `::` (an `alias::name`, a leading `::`,
  a `super::`, or a first segment the referring project does not declare), and — since stage 4 —
  every bare name that names no spec of the referring project (form import, bound through its `use`
  imports or left unresolved), with the form it was read in, what it bound to, and the text the
  writer emits for it now. The raw material of DEPRECATED_REFERENCE_FORM, EXTERNAL_UNDECLARED,
  EXTERNAL_NOT_EXPORTED and IMPORT_AMBIGUOUS, of the export usage (so a lock's `used` covers
  imported names too), of the positional match the upgrade report and migration share, and of the
  migrations' reference rewrites. The writer reads it too: a reference whose in-memory value still
  equals `resolved` is written back as `authored`, so authored text round-trips byte for byte.
subsystem: sdd_core
fields:
  - name: specId
    type: string
    description: The in-memory key of the spec that holds the reference.
    optional: false
  - name: position
    type: string
    description: >-
      Where in that spec: dependsOn, owns, dispatch, mounts, lifecycle, publicInterfaces,
      trustedLinks, contract (an interface's component or an implementation's contract), subsystem,
      narrative (a step's targetComponent, with the method and step number), calls, auth, or type (a
      field, param or return type).
    optional: false
  - name: authored
    type: string
    description: The reference exactly as written.
    optional: false
  - name: form
    type: ReferenceForm
    description: >-
      How the reference is spelled. leading, super and path are deprecated and still bind for one
      release.
    optional: false
  - name: binding
    type: ReferenceBinding
    description: What the reference bound to when the family was scanned.
    optional: false
  - name: resolved
    type: string
    description: >-
      The in-memory key the reference bound to (the target's key, or the lenient key for unexported
      and undeclared); equal to `authored` for outside and unresolved.
    optional: false
  - name: producer
    type: string
    description: The key of the project it lands in; absent for outside and unresolved.
    optional: true
  - name: publicName
    type: string
    description: The public name it bound to, for exported.
    optional: true
  - name: rewrite
    type: string
    description: >-
      The text the writer emits for `resolved` from the referring project: a bare local id when it
      lands in the referrer; else `alias::publicName` with the referrer's alias for the producer
      (its project id when none is declared yet, which the migration declares) and the public name
      that binds the target (its local id when none does, which the migration exports). Equal to
      `authored` for an alias form already canonical; absent when no rewrite can be written
      (outside, unresolved, or a producer with no id).
    optional: true
  - name: importedVia
    type: string
    description: 'For an import: the alias (or aliases, when ambiguous) whose `use` supplies the name'
    optional: true
  - name: hint
    type: string
    description: >-
      For an unresolved import: the declared external or member that exports a name with the same
      key without importing it, and the `use` line that would import it — what the
      unresolved-reference finding repeats. Never a project the referrer does not declare: the
      lookup is owner-scoped, never family-wide.
    optional: true
methods: []
sourcePath: src/models/project-family.ts
