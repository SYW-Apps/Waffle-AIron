kind: value-object
id: authored_reference
name: AuthoredReference
description: >-
  A reference as its author wrote it, recorded by the scan before qualification erases the form: the
  loader turns `super::x` and `::x` into absolute ids, so nothing downstream could tell them apart
  from a plain id. Only the relative forms are recorded — the ones DEPRECATED_REFERENCE_FORM
  concerns.
subsystem: sdd_core
fields:
  - name: specId
    type: string
    description: The qualified id of the spec that holds the reference.
    optional: false
  - name: position
    type: string
    description: >-
      Where in that spec: dependsOn, owns, dispatch, mounts, lifecycle, publicInterfaces,
      trustedLinks, contract (an interface's component), narrative (a step's targetComponent, with
      the method and step number), or type (a field, param or return type).
    optional: false
  - name: authored
    type: string
    description: 'The reference exactly as written: a `super::`-prefixed or a leading-`::` form.'
    optional: false
  - name: resolved
    type: string
    description: What the loader qualified it to.
    optional: false
methods: []
createdAt: '2026-09-26T17:39:34.152Z'
updatedAt: '2026-09-26T17:43:23.355Z'
