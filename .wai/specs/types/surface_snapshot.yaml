kind: value-object
id: surface_snapshot
name: SurfaceSnapshot
description: >-
  The portable public-surface artifact of one project: identity + provenance + the audience-filtered
  contract entries + the transitive type closure. One format, three origins — generated (own
  parent/child family, written at generate/lock), exchanged (another wairon project or tenant,
  relation/grant-gated), authored (an external 3rd-party system, hand-declared or imported from
  OpenAPI). Consumers validate adapter edges against it and detect staleness via the embedded
  StateId/version.
fields:
  - name: projectName
    type: string
    description: Producing project/system name — the snapshot's identity for resolution.
    optional: false
    key: primary
  - name: origin
    type: string
    description: 'Provenance: generated | exchanged | authored.'
    optional: false
  - name: stateId
    type: string
    description: >-
      Producing spec tree's StateId at generation time — staleness detection for wairon-produced
      snapshots.
    optional: true
  - name: version
    type: string
    description: Contract version for authored/3rd-party surfaces that have no StateId.
    optional: true
  - name: generatedAt
    type: string
    description: ISO-8601 production timestamp.
    optional: false
  - name: interfaces
    type: SurfaceContractEntry[]
    description: The exported contract entries, already audience-filtered by the producer.
    optional: false
  - name: types
    type: SurfaceTypeDef[]
    description: >-
      Transitive type closure of every exported signature and every exported type — the snapshot is
      self-contained. Types are gathered by qualified id, so two subsystems' types of the same name
      both arrive (the later one under its qualified id).
    optional: false
  - name: projectId
    type: string
    description: >-
      The producing project's effective id (project.yaml id), recorded beside the display-oriented
      projectName; absent on snapshots written before project ids existed, and on authored or
      imported surfaces.
    optional: true
  - name: exportedTypes
    type: SurfaceTypeExport[]
    description: >-
      The types the producer exports by name (typeDef exports), audience-filtered like the contract
      entries and listed apart from them; each definition is in the type closure.
    optional: true
  - name: audience
    type: string
    description: >-
      The audience ceiling the producer's export table was filtered to: project for a snapshot
      pinned from the family, instance for one pinned through source.path; absent on surfaces
      written before externals and on imports.
    optional: true
methods:
  - name: isProvidedBy
    signature: 'isProvidedBy(provider: string): boolean'
    returns: boolean
    description: >-
      Whether the named provider published this snapshot: its projectName, or the last :: segment of
      it (a sibling's snapshot is keyed <systemName>::<subsystemId>, so a reference names a sibling
      by its subsystem id)
    sourcePath: src/models/surface-references.ts
  - name: contentDigest
    signature: 'contentDigest(): string'
    returns: string
    description: >-
      sha256 over the snapshot's canonical CONTRACT, never over how its references or types are
      spelled: the public names with each entry's stereotype, transport, auth kind, dispatch
      bindings and method shapes, the exported types and the closure's type shapes — a data type's
      shape is its kind and fields, a signature type's is its kind, its params' types and
      optionality in order (never their names) and its returns, an enum's is its kind and its value
      names in declared order — every type expression passed through canonicalTypeRef, every list in
      a fixed order — with provenance (stateId, generatedAt, origin) and prose (descriptions,
      groups, display names) left out. Because the type expressions are canonical, a producer
      respelling `T[]` as `list<T>` moves the digest once (the day the grammar ships) and never
      again.
    sourcePath: src/models/surface-references.ts
  - name: memberDigest
    signature: 'memberDigest(publicName: string, member: string): string | null'
    returns: string | null
    description: >-
      sha256 over one used member of one public name, canonicalized so only what a caller depends on
      moves it: for a contract method, its name, its parameters' types and optionality in order
      (never their names) and its return type; for `capability:<name>`, the dispatch binding and the
      bound method's signature so digested; for `type`, the type's shape; in every case followed by
      the shapes of every type in the transitive closure of the types it names — a signature type's
      closure followed through its params and returns as a data type's is through its fields, so
      changing a named signature moves the digest of every member that names it. Every type
      expression is passed through canonicalTypeRef before it is hashed, and the closure is found by
      canonical id, never by the suffix match — so the rewrite `shared::native-access-kind` →
      `native-access-kind` inside the producer moves no digest. Null when the name is not in the
      snapshot or the member is not on it (the entry's interface narrowing included) — a removed
      member, never a pass. A lock's `used` map holds these digests, and EXTERNAL_INCOMPATIBLE is an
      error only because they are canonical.
    sourcePath: src/models/surface-references.ts
  - name: canonicalTypeRef
    signature: 'canonicalTypeRef(typeExpr: string): string'
    returns: string
    description: >-
      A type expression rewritten into the one spelling a digest may see: parsed under the type
      grammar (type_expression.parse) and answered as its canonical text, so an alias and its
      canonical spelling digest alike, with every named reference rewritten in place — an identifier
      naming a type of this snapshot's closure (bare, or prefixed with this snapshot's own project
      id or alias, compared by reference_resolution.nameKey) becomes that type's id; an identifier
      that names another project's type becomes `<producer id>::<its id>`; anything unresolvable is
      kept as written. A text that does not parse is kept as written, identifier by identifier, as
      before the grammar. Pure: the snapshot is the whole input.
    sourcePath: src/models/surface-references.ts
sourcePath: src/models/specs.ts
