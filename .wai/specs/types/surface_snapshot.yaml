kind: value-object
id: surface_snapshot
name: SurfaceSnapshot
description: >-
  The portable public-surface artifact of one project: identity + provenance + the audience-filtered
  contract entries + the transitive type closure. One format, three origins — generated (own
  parent/child family, written at generate/lock), exchanged (another wairon project or tenant,
  relation/grant-gated), authored (an external 3rd-party system, hand-declared or imported from
  OpenAPI). Consumers validate adapter edges against it and detect staleness via the embedded
  StateId/version.
fields:
  - name: projectName
    type: string
    description: Producing project/system name — the snapshot's identity for resolution.
    optional: false
    key: primary
  - name: origin
    type: string
    description: 'Provenance: generated | exchanged | authored.'
    optional: false
  - name: stateId
    type: string
    description: >-
      Producing spec tree's StateId at generation time — staleness detection for wairon-produced
      snapshots.
    optional: true
  - name: version
    type: string
    description: Contract version for authored/3rd-party surfaces that have no StateId.
    optional: true
  - name: generatedAt
    type: string
    description: ISO-8601 production timestamp.
    optional: false
  - name: interfaces
    type: SurfaceContractEntry[]
    description: The exported contract entries, already audience-filtered by the producer.
    optional: false
  - name: types
    type: SurfaceTypeDef[]
    description: >-
      Transitive type closure of every exported signature and every exported type — the snapshot is
      self-contained. Types are gathered by qualified id, so two subsystems' types of the same name
      both arrive (the later one under its qualified id).
    optional: false
  - name: projectId
    type: string
    description: >-
      The producing project's effective id (project.yaml id), recorded beside the display-oriented
      projectName; absent on snapshots written before project ids existed, and on authored or
      imported surfaces.
    optional: true
  - name: exportedTypes
    type: SurfaceTypeExport[]
    description: >-
      The types the producer exports by name (typeDef exports), audience-filtered like the contract
      entries and listed apart from them; each definition is in the type closure.
    optional: true
  - name: audience
    type: string
    description: >-
      The audience ceiling the producer's export table was filtered to: project for a snapshot
      pinned from the family, instance for one pinned through source.path; absent on surfaces
      written before externals and on imports.
    optional: true
methods:
  - name: isProvidedBy
    signature: 'isProvidedBy(provider: string): boolean'
    returns: boolean
    description: >-
      Whether the named provider published this snapshot: its projectName, or the last :: segment of
      it (a sibling's snapshot is keyed <systemName>::<subsystemId>, so a reference names a sibling
      by its subsystem id)
    sourcePath: src/models/surface-references.ts
  - name: contentDigest
    signature: 'contentDigest(): string'
    returns: string
    description: >-
      sha256 over the snapshot's canonical content with its provenance (stateId, generatedAt,
      origin) stripped — the same stripping the gate's consumed-contract keys use — so re-pinning an
      unchanged contract never moves it. The lock's `digest`.
    sourcePath: src/models/surface-references.ts
  - name: memberDigest
    signature: 'memberDigest(publicName: string, member: string): string | null'
    returns: string | null
    description: >-
      sha256 over one used member of one public name, canonicalized so only what a caller depends on
      moves it: for a contract method, its name, its parameters' types and optionality in order
      (never their names) and its return type; for `capability:<name>`, the dispatch binding and the
      bound method's signature so digested; for `type`, the type's shape; in every case followed by
      the shapes of every type in the transitive closure of the types it names, from the snapshot's
      type closure. Null when the name is not in the snapshot or the member is not on it (the
      entry's interface narrowing included) — a removed member, never a pass. A lock's `used` map
      holds these digests.
    sourcePath: src/models/surface-references.ts
sourcePath: src/models/specs.ts
