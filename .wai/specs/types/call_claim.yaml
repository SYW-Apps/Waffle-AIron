kind: value-object
id: call_claim
name: CallClaim
description: >-
  One call a method states it makes: a narrative call step, pointed at by its step number, or a
  declared calls entry, which has no step. Both are statements, and every rule judging what a method
  calls reads both.
fields:
  - name: step
    type: int
    description: The narrative step's number; absent on a declared call
    optional: true
  - name: component
    type: string
    description: The component the call names
    optional: false
  - name: method
    type: string
    description: The method on it
    optional: false
  - name: detach
    type: bool
    description: >-
      True when the claim is a call step marked detach: the method goes on without waiting for the
      call. Absent on a declared call
    optional: true
  - name: caught
    type: bool
    description: >-
      True when the claim is a call step inside the body of a try step that names at least one catch
      — any enclosing one — so the design says an error the call raises is caught there. The try's
      catch and finally regions are not its body. Absent on a declared call
    optional: true
methods: []
sourcePath: src/models/specs.ts
symbol: CallClaim
