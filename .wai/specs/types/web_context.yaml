kind: value-object
id: web_context
name: WebContext
description: >-
  The session principal's identity and coarse admin/local flags returned to the unified web UI so
  the client renders role-appropriately. Purely a projection of the resolved Principal; the client
  gets its permission-filtered project list from listProjects and relies on per-endpoint enforcement
  for finer affordances. Asserts no authority the server does not already enforce.
fields:
  - name: subject
    type: PrincipalSubject
    description: The resolved identity behind the session.
    optional: false
  - name: isAdmin
    type: boolean
    description: True when the principal is an instance admin (permissionSubject.instanceAdmin).
    optional: false
  - name: local
    type: boolean
    description: >-
      True when this context comes from the local developer server (`wairon dev`): the SAME client
      hides the tenancy/login/account chrome (Landscape tier, project picker, sign-out, admin badge)
      and renders the single local project only. Absent/false in the hosted multi-tenant UI.
    optional: true
methods: []
createdAt: '2026-07-11T11:31:20.576Z'
updatedAt: '2026-07-15T22:57:10.390Z'
