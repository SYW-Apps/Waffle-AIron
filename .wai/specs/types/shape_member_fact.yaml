kind: value-object
id: shape_member_fact
name: ShapeMemberFact
description: >-
  One data member of a shape a file declares: its name, whether the code lets it be absent, and its
  annotation. Absent-able is the only optionality worth recording, because it is the only one a spec
  can be wrong about in a way a reader would notice — a field the spec calls required that the code
  lets you omit is a promise the data does not keep. A wrapper that FILLS a missing key is not
  absent-able: the value the type finally holds always has it, which is the shape the spec
  describes. The annotation is what type-shape compares with the spec field's type, read as a scalar
  or not at all.
subsystem: sdd_validator
fields:
  - name: name
    type: string
    description: The member's name as the code spells it
    optional: false
  - name: optional
    type: bool
    description: >-
      Whether the code lets the member be absent from a value of this shape; unset when the code
      does not settle it (a Python TypedDict whose total= is not a literal), and a check then
      compares nothing about it
    optional: true
  - name: type
    type: string
    description: >-
      The member's annotation as the code writes it (whitespace-normalized; a Python Required[...]
      or NotRequired[...] read through to what it wraps), where the member is annotated and the
      reading records it; unset otherwise, and then nothing about its type is compared
    optional: true
methods: []
sourcePath: src/models/code-model.ts
createdAt: '2026-09-23T18:11:19.486Z'
updatedAt: '2026-10-30T20:23:40.266Z'
