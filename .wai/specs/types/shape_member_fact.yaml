kind: value-object
id: shape_member_fact
name: ShapeMemberFact
description: >-
  One data member of a shape a file declares: its name, and whether the code lets it be absent.
  Absent-able is the only optionality worth recording, because it is the only one a spec can be
  wrong about in a way a reader would notice — a field the spec calls required that the code lets
  you omit is a promise the data does not keep. A wrapper that FILLS a missing key is not
  absent-able: the value the type finally holds always has it, which is the shape the spec
  describes.
subsystem: sdd_validator
fields:
  - name: name
    type: string
    description: The member's name as the code spells it
    optional: false
  - name: optional
    type: boolean
    description: Whether the code lets the member be absent from a value of this shape
    optional: false
methods: []
sourcePath: src/models/code-model.ts
