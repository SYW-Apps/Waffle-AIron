kind: value-object
id: audit_retention_policy
name: AuditRetentionPolicy
description: >-
  Instance-level policy for audit capture and retention. The policy controls event volume and
  pruning while preserving the rule that raw secrets and full spec payloads are never written to
  audit storage.
fields:
  - name: enabled
    type: bool
    description: Whether durable audit storage is enabled for the hosted instance.
    optional: false
  - name: minimumLevel
    type: AuditLevel
    description: Lowest event level persisted.
    optional: false
  - name: retentionDays
    type: int
    description: Default number of days to retain persisted audit events before pruning.
    optional: false
  - name: securityRetentionDays
    type: int
    description: >-
      Retention period for security-sensitive events such as denied access, token changes, project
      deletion, lock, and promotion.
    optional: true
  - name: includeReadEvents
    type: bool
    description: >-
      Whether low-risk read-only MCP and admin reads are persisted in addition to write/security
      events.
    optional: false
  - name: metadataMode
    type: AuditMetadataMode
    description: >-
      How much event metadata is persisted. Whatever the mode, an event whose fields look like a raw
      credential is refused before it persists.
    optional: false
methods: []
sourcePath: src/server/types.ts
