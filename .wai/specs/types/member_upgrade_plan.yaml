kind: value-object
id: member_upgrade_plan
name: MemberUpgradePlan
description: >-
  The stage-7 upgrade of a hosted data dir, planned and not yet applied: every member the hosted
  families declare on disk (members of members included) with the record it gets, the reach proof
  (today's reach over the family root vs the new chain over the member's own record — equal by
  construction, checked before writing), and every API key whose member-QUALIFIED entries are
  rewritten to record ids. It writes NO grants and NO placements: a member's reach comes through its
  project chain. Its writes (member records, key narrowings) were made into a rehearsal copy of the
  host stores; changes lists the file-level difference the apply would swap in, all or nothing.
subsystem: sdd_host
fields:
  - name: members
    type: list<PlannedMemberRecord>
    description: Every declared member, family roots first then depth-first
    optional: false
  - name: reach
    type: list<ReachComparison>
    description: >-
      The no-widening proof: every subject x capability x member, before (over the family root, as
      the data plane resolved members until now) and after (over the member's own record through the
      new chain). Any unequal row refuses the plan
    optional: false
  - name: narrowings
    type: list<PlannedNarrowing>
    description: Every API key with a member-qualified entry, rewritten to the member's record id
    optional: false
  - name: refusals
    type: list<MigrationFinding>
    description: >-
      What blocks the whole plan: a member id another record holds, a member declared twice, an
      unreadable member, a setting already scoped at a member's id (it would decide before the
      inherited chain), an unequal reach row
    optional: false
  - name: changes
    type: list<FileChange>
    description: The host store files the apply would replace, from the rehearsal
    optional: false
  - name: rehearsal
    type: Rehearsal
    description: The rehearsal the writes were made into; absent once applied or discarded
    optional: true
methods: []
