kind: value-object
id: position_migration_plan
name: PositionMigrationPlan
description: >-
  The share of a family's chaining migration that retires position, planned and not yet applied: the
  legacy mounts to move into `members` with what they carry, the references to rewrite out of a
  deprecated form (stage 4's self-prefixed ones among them), stage 4's positional imports, and every
  finding it will not decide for a person. The chaining migration merges it into its own plan.
subsystem: sdd_migrations
fields:
  - name: members
    type: PlannedMember[]
    description: The mounts to move, parents in walk order, each parent's mounts in declaration order.
    optional: false
  - name: rewrites
    type: PlannedRewrite[]
    description: The references to rewrite, projects in walk order, then spec, then position.
    optional: false
  - name: findings
    type: ChainingMigrationFinding[]
    description: >-
      Every mount field that stops the move, every reference with no rewrite, every absent member,
      in the order found.
    optional: false
  - name: imports
    type: PlannedImport[]
    description: >-
      Stage 4's positional imports, one per (consumer, alias, public name), each with every bare
      reference it resolves and whether the producer needs the export and the consumer the external
      — which the chaining migration plans with its own entries and declarations
    optional: false
methods: []
sourcePath: src/commands/position-migration.ts
createdAt: '2026-09-27T10:44:31.358Z'
updatedAt: '2026-09-30T20:47:41.185Z'
