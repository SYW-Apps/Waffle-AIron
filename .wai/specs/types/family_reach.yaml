kind: value-object
id: family_reach
name: FamilyReach
description: >-
  A request's reach into the hosted family of its bound project, resolved per record: the family
  projects the principal may read (what a family run may compose and a reach-gated read may open)
  and those it may write (what a family migration may write; it refuses family-partial beyond them).
  Each project is judged by its own record's permission — ancestry is not authorization.
subsystem: sdd_host
fields:
  - name: readable
    type: string[]
    description: Family record ids with project:read yes
    optional: false
  - name: writable
    type: string[]
    description: Family record ids with project:write yes
    optional: false
methods: []
