kind: value-object
id: code_index
name: CodeIndex
description: >-
  The run's source-code model keyed for lookup: every path's analysis facts and the three anchor
  tiers a realization check reads, derived once per run behind rule_context.codeIndex. Eight rules
  each rebuilt this map for themselves, with subtly different shapes; this is the reconciled one.
  The model holds one entry per canonical key, and were it to hold two the later one answers —
  exactly as the keyed maps the rules built did.
subsystem: sdd_validator
fields:
  - name: paths
    type: Set<string>
    description: Every canonical path the model holds — the closed set an import specifier is resolved against
    optional: false
  - name: exactPaths
    type: Set<string>
    description: >-
      The paths analyzed at exact AST grade: the only files an import graph may accuse from, a
      measured function be read in, or a module-scope binding be judged in
    optional: false
methods:
  - name: factsAt
    signature: 'factsAt(path: string): SourceFileFacts | undefined'
    returns: SourceFileFacts | undefined
    description: >-
      The analysis facts for a source path, by its canonical key; undefined when the run analyzed no
      such path
  - name: declarationsAt
    signature: 'declarationsAt(path: string): Set<string>'
    returns: Set<string>
    description: >-
      Declaration-tier anchors of a file: its declaredNames together with its exportedNames — what
      the declared conformance tier is satisfied by; empty for a path the run never analyzed
  - name: anchorsAt
    signature: 'anchorsAt(path: string): Set<string>'
    returns: Set<string>
    description: >-
      Anchored-tier anchors of a file: the declarations together with its anchoredNames — what the
      anchored conformance tier is satisfied by
  - name: findingAnchorsAt
    signature: 'findingAnchorsAt(path: string): Set<string>'
    returns: Set<string>
    description: >-
      The weak anchors of a file alone — string literals and property-access names, without the
      declarations — which is where a contract method's declared finding code must appear
  - name: originOf
    signature: 'originOf(site: CallSiteFact, from: string): Set<string>'
    returns: Set<string>
    description: >-
      The files the function a call site invokes IS written in, resolved against the closed path
      set, or EMPTY when a pure model cannot say — which is an answer of its own and never a denial.
      `from` is the file the site was read in, a carried site naming its own. Four shapes resolve: a
      bare call on an import binding lands in the module that binding came from; a bare call on a
      locally declared name lands in that file; a member call through a NAMESPACE import binding
      lands in that module; a member call through a VALUE binding lands in that module only when the
      module declares the invoked name too, since the property could otherwise have been attached
      anywhere. Every landing is widened by the modules it republishes, so a call through a barrel
      still lands where the function lives; a receiver that is not a plain identifier, a specifier
      outside the closed set, a name with no binding at all, and any file below exact grade resolve
      to nothing. This is the PROVEN tier, and the only one an accusation may be built on
  - name: possibleOriginsOf
    signature: 'possibleOriginsOf(site: CallSiteFact, from: string): Set<string>'
    returns: Set<string>
    description: >-
      Every file the function a call site invokes CAN have been written in: the proven origins,
      widened for the three receivers the code writes down. A this.<field>.<method>() site widens by
      the modules that declare the field's declared TYPE (its type-only or runtime import binding,
      else this file when it declares that name); a new Class(...).<method>() site widens by the
      module the CLASS NAME came from (its runtime import binding — a constructed class is a value,
      never a type-only one — else this file when it declares that class); a plain <name>.<method>()
      site widens by the modules that declare the type the file ANNOTATES that name with — a
      parameter's annotation or an annotated variable declaration's, resolved exactly as a field's
      declared type is, which is how a module that wires its collaborators as closures writes every
      call it makes. All three are possibilities and not facts: a declared type says what a
      collaborator is and never which class ships the body, a constructed class says where the class
      was written and never where a method it INHERITS from a base was, and an annotated name is
      read per FILE, so same-named bindings in different functions union their declared types. What
      a type name LEADS TO is the question and what it expands to is not, so an alias is never
      unwrapped. Empty for a field or a name the file annotates with nothing and for a class name it
      cannot place, exactly as the proven tier is. A widened answer may only ACCEPT a call as
      realized; naming a file a call landed in stays the proven tier's word alone, since a
      possibility can never accuse
