kind: value-object
id: design_method_body
name: DesignMethodBody
description: >-
  One method's body as the design states it: a flat numbered step list (the L5 narrative), or an
  intent paragraph at a lower detail level. A generator emits one node per step, in order, with the
  branches and loops in place; steps are keyed by number inside their method, and a step's label is
  the anchor that survives an edit where the author set one.
subsystem: sdd_surfaces
fields:
  - name: method
    type: string
    description: The key of the contract method it realizes
    optional: false
  - name: detail
    type: NarrativeDetail
    description: Narrative detail, after the stereotype default is applied
    optional: false
  - name: intent
    type: string
    optional: true
  - name: calls
    type: list<string>
    description: The method keys it declares it calls when its narrative does not show them; empty otherwise
    optional: false
  - name: narrative
    type: list<NarrativeStep>
    description: >-
      The steps as stored, with targetComponent and targetMethod resolved to keys; empty for an
      intent-level method
    optional: false
  - name: detailStated
    type: bool
    description: >-
      Whether the method or its implementation states its detail, or the method declares its calls.
      Stated detail is binding; unstated, detail is the component type's default and what the method
      calls beyond its narrative is open (2.1)
    optional: false
methods: []
sourcePath: src/models/design-export.ts
createdAt: '2026-10-04T13:53:19.761Z'
updatedAt: '2026-10-20T13:54:52.532Z'
