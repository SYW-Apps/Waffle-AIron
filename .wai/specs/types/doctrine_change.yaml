kind: value-object
id: doctrine_change
name: DoctrineChange
description: >-
  One thing a pack changes against wairon's defaults, stated neutrally: a loosening is a change like
  any other and is never a finding (pack-loosening-is-never-a-finding). Rule changes are scoped to
  the profile that carries them, because a pack profile's rules apply only to what that profile
  governs.
fields:
  - name: axis
    type: DoctrineAxis
    description: What the change is about.
    optional: false
  - name: change
    type: DoctrineChangeKind
    description: How the pack changes doctrine against the default.
    optional: false
  - name: subject
    type: string
    description: >-
      What changed: the rule code, the profile/pattern/guarantee/language id, the stereotype, the
      edge (from → to) or the flow construct.
    optional: false
  - name: profile
    type: string
    description: >-
      The pack profile carrying the change; absent for a pack-wide change (an added code, pattern,
      guarantee or language).
    optional: true
  - name: from
    type: string
    description: wairon's default for the subject (a severity or a depth), when it has one.
    optional: true
  - name: to
    type: string
    description: The pack's value for the subject, when it has one.
    optional: true
  - name: reason
    type: string
    description: >-
      The reason the pack states for it (a forbidden or discouraged stereotype, a licensed edge, an
      assertion), quoted.
    optional: true
methods: []
sourcePath: src/models/pack-impact.ts
createdAt: '2026-09-29T15:50:33.272Z'
updatedAt: '2026-10-04T23:39:28.090Z'
