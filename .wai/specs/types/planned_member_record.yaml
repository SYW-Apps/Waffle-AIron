kind: value-object
id: planned_member_record
name: PlannedMemberRecord
description: >-
  One member a hosted family declares on disk, as the member registration plans its hosted record:
  the record it would hold (its own project id, its parent's record id and its path in the parent's
  directory), the family root whose repository and isolated tree contain it, and the
  member-qualified selector (top id plus one alias per hop) that reached it before stage 7 — the
  string old tokens and selectors still carry for one release.
subsystem: sdd_host
fields:
  - name: record
    type: HostedProjectRecord
    description: >-
      The member's hosted record: id = the member's own project id (its project.yaml id),
      parentProjectId, memberPath; rootPath derived, never persisted
    optional: false
  - name: familyRootId
    type: string
    description: >-
      The id of the family root record — the top hosted project whose isolated tree and repository
      hold the member
    optional: false
  - name: qualifier
    type: string
    description: >-
      The pre-stage-7 member-qualified selector that bound the same root ('platform::billing',
      nested members one alias per hop)
    optional: false
  - name: action
    type: string
    description: >-
      register (no record yet), relocate (a record exists and the member's path or parent changed),
      rename (a record with another id held this parent and path: a project rename, re-keyed),
      return (a record disabled as departed or retired, its project member declared again:
      re-enabled), retire (stage 8: a record whose member is now declared as a part — disabled as
      "part of <parent>", own-scope settings kept), unchanged (the record agrees with the family on
      disk), unreadable
    optional: false
  - name: previousId
    type: string
    description: 'For action rename: the record id the member held before'
    optional: true
  - name: reason
    type: string
    description: >-
      For action unreadable: why, in words a person acts on — the declaration's own problem, a path
      that escapes its parent, a missing directory, a project.yaml that cannot be read or fails its
      schema, or no valid project id
    optional: true
methods: []
sourcePath: src/server/types.ts
createdAt: '2026-10-01T16:26:56.046Z'
updatedAt: '2026-10-07T06:28:43.955Z'
