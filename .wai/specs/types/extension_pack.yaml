kind: value-object
id: extension_pack
name: ExtensionPack
description: >-
  A parsed extension-pack manifest — wairon's plugin unit. A declarative (YAML) pack carries data
  only (profiles, languages, skills, patterns); a programmatic (JS) pack adds rules. Listed in
  project.yaml under extensions.packs, vendored into .wai/packs for reproducibility.
fields:
  - name: name
    type: string
    description: The pack's declared name.
    optional: false
  - name: profiles
    type: ProfileDef[]
    description: Custom architectural profiles, keyed by profile id.
    optional: false
  - name: languages
    type: LanguagePackDef[]
    description: Custom language/platform tables, keyed by language.
    optional: false
  - name: rules
    type: SddRule[]
    description: Programmatic conformance rules; empty for declarative packs.
    optional: false
  - name: skills
    type: PackSkill[]
    description: Pack-provided AI-agent skills, installed to client targets and the MCP resource mirror.
    optional: false
  - name: patterns
    type: PatternDef[]
    description: Named, versioned reusable pattern definitions referenceable by specs.
    optional: false
methods: []
createdAt: '2026-07-14T18:57:01.915Z'
updatedAt: '2026-07-14T18:57:01.958Z'
