kind: value-object
id: extension_pack
name: ExtensionPack
description: >-
  A parsed extension-pack manifest — wairon's plugin unit. A declarative (YAML) pack carries data
  only (profiles, languages, skills, patterns, guarantees, instructions); a programmatic (JS) pack
  adds rules. Listed in project.yaml under extensions.packs, vendored into .wai/packs for
  reproducibility. Its two pure methods (settings, changesAgainst) are to be realized as free
  functions (packSettings, doctrineChanges) in src/models/pack-impact.ts; the type claims no code
  yet. Note what a pack cannot carry today: variants and new component kinds — variants come from
  the project's and machine's variant files, not from packs, and pack-contributed stereotypes are
  deferred — so a pack's concept changes are profiles, stereotype fencing, edge licenses, patterns,
  guarantee tokens and language tables.
fields:
  - name: name
    type: string
    description: The pack's declared name.
    optional: false
  - name: profiles
    type: ProfileDef[]
    description: Custom architectural profiles, keyed by profile id.
    optional: false
  - name: languages
    type: LanguagePackDef[]
    description: Custom language/platform tables, keyed by language.
    optional: false
  - name: rules
    type: SddRule[]
    description: Programmatic conformance rules; empty for declarative packs.
    optional: false
  - name: skills
    type: PackSkill[]
    description: Pack-provided AI-agent skills, installed to client targets and the MCP resource mirror.
    optional: false
  - name: patterns
    type: PatternDef[]
    description: Named, versioned reusable pattern definitions referenceable by specs.
    optional: false
  - name: guarantees
    type: string[]
    description: >-
      Pack-declared semantic guarantee tokens extending the builtin vocabulary
      (idempotent/atomic/transactional/exactly-once); a referenced token that is neither builtin nor
      declared by any loaded pack is flagged UNKNOWN_GUARANTEE.
    optional: false
  - name: assertions
    type: PackAssertion[]
    description: >-
      Declarative rule assertions — instances of the closed kinds (forbid-edge / require-field /
      endpoint-shape), the hosted-safe doctrine channel; an unknown kind fails the pack load loudly.
    optional: false
  - name: instructions
    type: PackInstructionBlock[]
    description: >-
      Connecting-agent guidance appended to wairon's own MCP initialize instructions under an
      attributed per-pack heading, in pack load order. A pack contributes its platform delta only —
      wairon owns and teaches the SDD model itself.
    optional: false
  - name: applyByDefault
    type: boolean
    description: >-
      Seed this pack into the selections of projects created FROM NOW ON (wairon init) rather than
      applying it retroactively to every project on the machine. This is what a machine-wide install
      should mean: a default for new work, written explicitly into the new project's config where it
      is visible in review and removable — never silent authority over projects that never mentioned
      it.
    optional: false
  - name: version
    type: string
    description: >-
      The version the manifest declares, when it declares one. What a requirement's range is checked
      against for a pack loaded from a legacy path reference, which carries no selection version.
    optional: true
methods:
  - name: settings
    signature: 'settings(profile: string | null): PackSettings'
    returns: PackSettings
    description: >-
      The settings this pack sets for a project governed by `profile` (null, or a profile this pack
      does not define: none of its profiles governs): the profile's rules.sddRuleSeverity and
      rules.designDepth, then every assertion's namespaced code (<PACK>_<CODE>) at its declared
      severity and every programmatic rule's codes at their default severities. Pure over the
      manifest's own fields; what POLICY_DEVIATION compares a member's configuration with.
  - name: changesAgainst
    signature: 'changesAgainst(baseline: DoctrineBaseline): DoctrineChange[]'
    returns: DoctrineChange[]
    description: >-
      Everything this pack changes against wairon's defaults, as neutral changes: per profile, each
      rules.sddRuleSeverity entry against the baseline default (loosened, raised or off; a code the
      baseline lacks is added), a designDepth other than narratives, each forbidden stereotype
      (removed) and discouraged one (discouraged) with its reason, each allowedEdges license, and
      the profile itself (added, or redefined when its id is a builtin profile); pack-wide, each
      assertion and programmatic rule code (added), each pattern, guarantee token and language table
      the baseline lacks (added) and each unsupportedFlow entry (gated). An entry equal to the
      default is no change. Pure: the baseline is handed in, so the pack never reaches a registry to
      learn what wairon's defaults are.
