kind: value-object
id: network_bindings
name: NetworkBindings
description: >-
  The deployment side of the derived networking, kept by the team outside .wai/ and passed by path:
  which workload each design name runs as, and what outside means for a policy. A key is a project
  id, a `project::subsystem` (a bare subsystem for the bound root's own), a `project::portal` (a
  bare component for the root's own), or `network:<id>` for callers anywhere inside a declared
  network; the most specific key a party has wins, and a party no key maps falls back to its default
  workload name (flow_party.workload). A key written with a renamed project's former name (its
  previousIds) still binds it, and the output notes the key to rename. A name with no binding gets
  the placeholder label wairon.dev/workload: <name> (made a valid label value), listed in the output
  and failing `network policy`, so nothing is silently opened or silently denied; a flow from
  outside with no outside blocks admits nothing and is listed too.
subsystem: sdd_network
fields:
  - name: workloads
    type: map<string, WorkloadBinding>
    description: Each design name's workload
    optional: false
  - name: outside
    type: list<string>
    description: >-
      The address blocks a policy admits for callers from outside the outermost network (for example
      0.0.0.0/0, or an intranet's ranges): deployment facts, never in a spec
    optional: true
methods: []
sourcePath: src/network/types.ts
