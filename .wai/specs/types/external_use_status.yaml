kind: value-object
id: external_use_status
name: ExternalUseStatus
description: >-
  The verdict on one used member of one pinned external, compared at signature level with the live
  producer (decision 19). Only a report: verdicts from the comparison arrive with composed
  validation in stage 4.
subsystem: sdd_surfaces
fields:
  - name: publicName
    type: string
    description: >-
      The producer's public name; absent on the one unavailable entry reported for an external with
      nothing to compare.
    optional: true
  - name: member
    type: string
    description: The member (method, capability:<name>, type); absent for a name used only as a dependency.
    optional: true
  - name: state
    type: ExternalUseState
    description: The verdict on the used member.
    optional: false
  - name: code
    type: string
    description: EXTERNAL_CHECK_UNAVAILABLE on an unavailable entry — never a pass.
    optional: true
  - name: detail
    type: string
    description: >-
      Why it could not be compared: the producer is unresolved or unreachable, the reference is not
      exported, or the producer is outside the family — no stage-2 reference form reaches outside
      the family, so nothing there is used until stage 3's `alias::name`.
    optional: true
  - name: renamedTo
    type: string
    description: >-
      On a renamed use: the public name (and member) the live producer's rename trace carries the
      used name forward to — what the consumer's references should now name.
    optional: true
methods: []
sourcePath: src/models/specs.ts
createdAt: '2026-09-26T17:47:11.330Z'
updatedAt: '2026-10-06T10:07:29.269Z'
