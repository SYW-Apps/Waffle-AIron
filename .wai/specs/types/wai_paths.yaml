lint:
  allow:
    - code: UNUSED_TYPE
      reason: >-
        Referenced by no contract on purpose, and the finding is correct rather than disputed. This
        type exists to write down the on-disk shape of a wairon project — the one thing nineteen
        modules agree on — while the function that builds it belongs to no component, because a path
        convention is not a responsibility. A contract referencing it would have to belong to
        something, and making that something a component was tried and measured: nineteen components
        needed an edge to it. Deleting the type instead would leave the layout undesigned, which is
        the state Track D exists to end.
