kind: value-object
id: wai_paths
name: WaiPaths
description: >-
  Every location wairon addresses inside one project, derived from its root. Held as a set of
  resolvers rather than strings so that a caller holding it still resolves against the root it asked
  for — a parent reading a chained child's layout must not accidentally get its own. This is the one
  place the on-disk shape of a wairon project is written down; everything else asks.


  It deliberately names NO source file. The resolver that produces it lives in `src/config/paths.ts`
  and belongs to no component: nineteen modules use it, it holds no state and decides nothing, and
  claiming it would make nineteen components declare an edge that says only "this one resolves
  paths". `src/utils/fs.ts` is the precedent — forty-eight importers, unclaimed, zero findings. The
  shape is worth designing; the function that builds it is a convention, and this type is how the
  convention stays findable without being owned.
fields:
  - name: root
    type: string
    description: The project root everything else resolves within.
    optional: false
  - name: projectConfig
    type: string
    description: The project's own configuration file.
    optional: false
  - name: topologyConfig
    type: string
    description: The agent topology configuration.
    optional: false
  - name: specsDir
    type: string
    description: The spec tree's root directory.
    optional: false
  - name: specsSystem
    type: string
    description: The L0 system spec, whose presence is what makes a directory a wairon project.
    optional: false
  - name: specsSubsystemsDir
    type: string
    description: Where L1 subsystem specs live.
    optional: false
  - name: specsComponentsDir
    type: string
    description: Where L2 component specs live.
    optional: false
  - name: specsInterfacesDir
    type: string
    description: Where L3 interface specs live.
    optional: false
  - name: specsImplementationsDir
    type: string
    description: Where L4 implementation specs live.
    optional: false
  - name: specsTypesDir
    type: string
    description: Where type specs live.
    optional: false
  - name: templatesDir
    type: string
