kind: value-object
id: type_shape_fact
name: TypeShapeFact
description: >-
  The members of one named shape a file declares — what a data type is, read off the code so a type
  spec's claim about it can be checked. Two origins answer, and the difference is recorded rather
  than smoothed away. A DECLARED shape lists its own members, so the file is the whole answer. A
  DERIVED one names a value instead — an alias resolved one hop to the object literal its schema is
  built from, where the keys are the members, and on through any composition the same file writes
  out (`Base.extend({…})` on a schema constant it declares, the extension's keys laid over the
  base's) — so the answer is as good as that hop and no better: a base the file does not declare
  ends in no shape. A shape that EXTENDS another carries members this file never lists, which is why
  presence and absence are different questions for it: what it shows can be judged, what it omits
  cannot.
subsystem: sdd_validator
fields:
  - name: origin
    type: ShapeOrigin
    description: How the members were read
    optional: false
  - name: fields
    type: list<ShapeMemberFact>
    description: The data members, each with whether the code lets it be absent
    optional: false
  - name: methods
    type: list<string>
    description: >-
      The method-style members, kept apart from fields because a spec models them on a different
      axis and counting them as data would accuse every behavioural interface of carrying undeclared
      state; their signatures are in `signatures`
    optional: false
  - name: inherited
    type: bool
    description: >-
      True when the shape extends another, so members it does not list exist but are not in this
      file to count
    optional: true
  - name: signatures
    type: map<string, list<MemberSignatureFact>>
    description: >-
      The signature of each method-style member by member name, one entry per overload,
      function-typed properties included: the parameters, the return annotation and whether it
      completes later. Filled by the exact reader, and by the Python reader where it already reads a
      Protocol's members, an abstract base class (ABC or metaclass=ABCMeta, at least one
      @abstractmethod) being read as a Protocol is, every method it defines included; at exact grade
      an interface's or an intersection alias's signatures include the members it extends or
      intersects; absent where the grade cannot read member signatures, and a check then compares
      nothing, as it guesses none
    optional: true
  - name: declaration
    type: bool
    description: >-
      True when the shape declares what a caller holds rather than implementing it: an interface, a
      type literal, a trait, a Protocol, or an abstract class (TypeScript abstract, a Python ABC
      with at least one @abstractmethod), whatever constructor, helpers or default bodies the class
      also holds. A concrete class is false. Where it is true the signatures are what an abstraction
      declares; recorded where signatures are
    optional: true
methods: []
sourcePath: src/models/code-model.ts
