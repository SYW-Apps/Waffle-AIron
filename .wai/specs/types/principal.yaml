kind: value-object
id: principal
name: Principal
description: >-
  The authenticated caller identity and authorized scope produced by verifying a credential.
  Transient (never persisted). Its subject, grants, project set, and role are server-side bindings
  derived from the token or bootstrap credential, never from client-supplied parameters. The
  role/projects fields remain a coarse compatibility projection; precise authorization is expressed
  by grants.
fields:
  - name: tokenId
    type: string
    description: Stable id of the credential that authenticated, used for audit correlation; never the raw key.
    optional: false
  - name: role
    type: string
    description: Coarse compatibility role derived from grants, such as "editor" or "admin".
    optional: false
  - name: projects
    type: string[]
    description: Compatibility projection of project ids this principal may act on; "*" denotes all projects.
    optional: false
  - name: subject
    type: PrincipalSubject
    description: Resolved human, service, or bootstrap identity responsible for the authenticated action.
    optional: true
  - name: grants
    type: ProjectGrant[]
    description: Precise server-derived project and instance permissions for authorization checks.
    optional: true
methods: []
