kind: value-object
id: signature_facts
name: SignatureFacts
description: >-
  What one scan's signature resolution recorded, for the rules to judge: every signatureFrom it met
  and how it resolved, and every stored signature text its params contradict.
subsystem: sdd_core
fields:
  - name: sources
    type: SignatureSourceFact[]
    description: One fact per contract method naming a signatureFrom
    optional: false
  - name: staleTexts
    type: StaleSignatureText[]
    description: One fact per contract or type method whose stored text differs from its derived text
    optional: false
methods: []
