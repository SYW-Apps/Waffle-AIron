id: validator_portal
name: Validator Portal
description: >-
  Inbound portal for the SDD validator subsystem. Its two validation entries are the owner's gate
  (validateProject) and the family run (validateFamily); the library entry (src/index.ts, the
  embedding API a wrapper compiles its gate from) re-exports exactly those two names, and
  `validateSddTree` leaves the public API with no alias — a deliberate break in a major release,
  named in the CHANGELOG (stage 4).
subsystem: sdd_validator
componentType: Portal
owns: []
dependsOn:
  - spec_validator
  - family_validator
portalType: Custom
status: design
