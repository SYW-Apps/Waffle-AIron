id: extension_rules
name: Extension Rules
description: >-
  Judges what extension packs contribute: architectural profiles, pattern references, component
  variants and declarative assertions resolve and apply, and pack selections resolve and are pinned.
  Pure logic (dependencyClass: pure, the arbiter variant): it holds no state (the rule set belongs
  to the rule Repository), does no I/O and runs no workflow. Its verdicts are not type methods,
  because the rule set is open (packs register rules at runtime) and most verdicts read many specs.
subsystem: sdd_validator
componentType: Orchestrator
owns: []
dependsOn: []
dependencyClass: pure
variant: arbiter
