id: web_graph_orchestrator
name: Web Graph Orchestrator
description: >-
  Serves the unified web UI's live level-of-detail graph and the interactive project canvas.
  Authenticates the browser session to a Principal through the single auth authority, then either
  reshapes the existing scoped hosted landscape (delegating to the landscape orchestrator, which
  applies its own landscape:read scoping) or projects one authorized project's spec tree at the
  requested detail level (binding the project via the project repository within the principal's
  authorized set, projecting through the host core adapter, and overlaying validator issues as node
  issue counts). A project's built graph and canvas model are kept in the web view cache between
  reads: an unchanged project is answered from it, and a changed one is drawn at once with the last
  known findings while the gate runs again in the background. Split out of the web session
  orchestrator so neither exceeds the god-component dependency threshold; the web portal reaches it
  directly, because a hop that only forwards separates no responsibility.
subsystem: sdd_host
componentType: Orchestrator
owns: []
dependsOn:
  - authentication
  - landscape_orchestrator
  - web_project_orchestrator
  - host_core_adapter
  - host_validator_adapter
  - project_repository
  - host_surfaces_adapter
  - host_network_adapter
  - files_adapter
  - web_view_cache
status: complete
