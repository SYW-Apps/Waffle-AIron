id: mcp_network_orchestrator
name: MCP Network Orchestrator
description: >-
  The network tools' workflows: the allowed-flows matrix (optionally filtered to the flows into one
  project, Portal or verb) and the explanation of one flow, both read through the network client
  adapter, and the one write — the project's network declaration, through the core client adapter —
  answered as text and structured content. Its own component beside the externals workflows, because
  it shares no collaborator with the authoring workflows.
