id: mcp_skills_adapter
name: MCP Skills Client Adapter
description: >-
  Local client adapter in sdd_mcp that crosses the subsystem boundary to sdd_skills: forwards MCP
  resource list/read for the built-in SDD skills to the published skills portal, and fetches the
  composed server `instructions` the MCP server returns on the initialize handshake — so the MCP
  server can both TEACH the SDD model on connect and publish the skills as read-only MCP resources.
subsystem: sdd_mcp
componentType: Adapter
owns: []
dependsOn:
  - skills_portal
status: complete
