id: permission_rules
name: Permission Rules
description: >-
  Pure hierarchical permission resolution over the assignment grid, roles, the organization tree and
  the project-to-parent-project links. Computes a subject's effective permission (yes/approval/no)
  for a capability at a target scope via the nearest-ancestor walk (direct-user > role
  most-permissive > everyone-default > inherit; an instance-admin bypasses to yes), and the
  subject's visible-scope set (actionable scopes plus their ancestor breadcrumb, never an ancestor's
  other children). Projects nest like units: a member project's chain is its own project scope, then
  its parent project's, up to its family root, then the family root's placement units, then the
  instance — so access to a project reaches every member transitively, and the most specific setting
  wins (an explicit no on a member's own record beats an inherited yes). Performs no I/O and never
  authenticates — the calling orchestrator gathers the world and has already authenticated the
  principal. Follow-up, deliberately out of scope here: finer-grained rules below a project (e.g.
  denying a subject one subsystem) are a separate feature with a scope kind of their own.
subsystem: sdd_host
