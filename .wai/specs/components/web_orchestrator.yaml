id: web_orchestrator
name: Web Orchestrator
description: >-
  Owns the unified web UI's server-side shell workflows: SSO sign-in (start/complete), the built-in
  super-admin password sign-in (env-anchored, verified constant-time by the auth specialist behind a
  transient in-memory failed-attempt throttle — the ONLY path to an env-anchored instance-admin
  session), session lifecycle (resolve/sign-out), the session-principal context projection, the live
  graph entry point (delegated to the web graph orchestrator), and the unauthenticated pre-auth
  login-options projection (WebLoginOptions: whether password login is configured plus one { id,
  displayName } entry per ENABLED identity provider — never secrets, clientIds, or endpoint config).
  It creates and deletes browser sessions through the web session repository, reads
  identity-provider configuration through the policy repository, and provisions first-login users
  through the user repository — including the adminGroupClaims → built-in sso-admin role-binding
  refresh on SSO completion. It carries NO per-page workflows: every actual page (authoring,
  approvals, users, audit, policy, landscape) is the served client app calling the EXISTING scoped
  /mcp data plane and the existing identity/landscape/operations/policy control-plane portals,
  authenticated by the session cookie (the session-as-credential auth bridge); admin-chrome
  visibility for delegated/SSO admins is driven client-side by their project:admin visible scopes,
  not by the coarse instance-admin context flag. Audit appends are best-effort and never fail the
  primary action.
subsystem: sdd_host
componentType: Orchestrator
owns: []
dependsOn:
  - auth_specialist
  - identity_provider_adapter
  - user_repository
  - policy_repository
  - web_session_repository
  - audit_repository
  - web_graph_orchestrator
  - identity_orchestrator
  - operations_orchestrator
  - project_lifecycle_orchestrator
status: complete
