id: project_policy_orchestrator
name: Project Policy Orchestrator
description: >-
  Hosted workflow owner for profile-aware project initialization and pack/profile policy
  enforcement. Credential-bearing methods resolve the caller's permissions through the authorization
  seam; it requires or records profile selection according to policy, applies required/default
  declarative packs, evaluates project compliance, and audits policy decisions. It reads and writes
  the project configuration — pack registrations, projectType, the recorded profile selection — only
  through the core adapter; the pack registry vendors pack files and returns what to register. Two
  pre-authorized entries (executeApprovedInit, evaluateInitRequest) serve the project-lifecycle
  chain and are never portal-exposed. Identity-provider (SSO) configuration is deferred to Phase 5.
subsystem: sdd_host
componentType: Orchestrator
owns: []
dependsOn:
  - authentication
  - authorization
  - project_registry
  - pack_registry
  - policy_repository
  - admin_orchestrator
  - audit_repository
  - host_core_adapter
  - host_validator_adapter
status: complete
createdAt: '2026-07-08T21:59:23.605Z'
updatedAt: '2026-09-15T17:56:12.525Z'
