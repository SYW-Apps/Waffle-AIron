id: auth_specialist
name: Auth Specialist
description: >-
  Verifies an inbound credential to a Principal: constant-time hash comparison of a data-plane
  bearer token against stored API-key records, or of the bootstrap/control-plane master credential.
  Also verifies the built-in super-admin web-login username+password pair (env-injected
  WAIRON_ADMIN_USER / WAIRON_ADMIN_PASSWORD carried on the host configuration) — constant-time on
  BOTH values, and disabled (always rejecting) when either is unset — resolving on success to the
  PERSISTED boot-reserved super-admin subject (issuer 'local', userId = the random UUID seeded at
  first boot by the instance identity repository; an account name is never a subject id). Resolves a
  server-derived subject, token id, and live permissionSubject (roleBindings from the owner user
  record + instanceAdmin by persisted-UUID comparison), enforcing token expiry, revocation, and
  owner deactivation. Also owns the reserved-subject guard: isReservedSubject reports the ids user
  records may NEVER claim (the persisted boot-reserved UUIDs and the legacy 'builtin:*' literals —
  UUID = unguessable, guard = unclaimable). The single authority for authentication; performs no
  authorization routing itself.
subsystem: sdd_host
componentType: Specialist
owns: []
dependsOn:
  - credential_registry
  - web_session_repository
  - secret_registry
  - user_repository
  - instance_identity_repository
status: complete
