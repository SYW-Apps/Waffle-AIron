id: auth_specialist
name: Auth Specialist
description: >-
  Verifies an inbound credential to a Principal: constant-time hash comparison of a data-plane
  bearer token against stored API-key records, or of the bootstrap/control-plane master credential.
  Resolves a server-derived subject, token id, project grants, and compatibility role/project
  projections, enforcing token expiry and revocation. The single authority for authentication;
  performs no authorization routing itself.
subsystem: sdd_host
componentType: Specialist
owns: []
dependsOn:
  - credential_registry
status: complete
