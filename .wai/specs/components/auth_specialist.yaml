id: auth_specialist
name: Auth Specialist
description: >-
  Verifies an inbound credential to a Principal: constant-time hash comparison of a data-plane
  bearer token against stored API-key records, or of the bootstrap/control-plane master credential.
  Also verifies the built-in super-admin web-login username+password pair (env-injected
  WAIRON_ADMIN_USER / WAIRON_ADMIN_PASSWORD carried on the host configuration) to its stable subject
  — constant-time on BOTH values, and disabled (always rejecting) when either is unset. Resolves a
  server-derived subject, token id, project grants, and compatibility role/project projections,
  enforcing token expiry and revocation. The single authority for authentication; performs no
  authorization routing itself.
subsystem: sdd_host
componentType: Specialist
owns: []
dependsOn:
  - credential_registry
  - web_session_repository
  - secret_registry
  - user_repository
status: complete
