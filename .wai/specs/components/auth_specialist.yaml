id: auth_specialist
name: Auth Specialist
description: >-
  Verifies an inbound credential to a Principal: constant-time hash comparison of a data-plane
  bearer token against stored API-key records, or of the bootstrap/control-plane master credential,
  yielding a token id plus the authorized project set and role (editor | admin). That role/project
  projection is the authorization output the shipped code actually resolves; a distinct subject
  identity and precise per-project grants are a back-compatible draft extension not yet populated by
  this component. The single authority for authentication; performs no authorization routing itself.
subsystem: sdd_host
componentType: Specialist
owns: []
dependsOn:
  - credential_registry
status: complete
