id: source_analysis_adapter
name: Source Analysis Adapter
description: >-
  Reads code, never specs. Resolves every source path the implementations name — each
  implementation's sourcePath, each method's own sourcePath and each simPath — inside the project
  root, reads the source files, and produces the pure CodeModel (per-file
  declaration/export/import/string-anchor facts with an analysis grade, plus per-function cyclomatic
  complexity measured at exact AST grade only — the detail-sufficiency lint's fuel; lower grades
  omit complexity rather than guess) that the Level 1 conformance rules consume. Tiered,
  dependency-lean analysis: exact AST when the TypeScript compiler module resolves dynamically
  (analyzed project's node_modules first, wairon's own installation second — never bundled); else
  the language's declarative pattern table (built-in or extension-pack registered); else a generic
  word scan. Each file carries the grade it was analyzed at, so findings can say how sure they are.
subsystem: sdd_validator
componentType: Adapter
owns: []
dependsOn: []
