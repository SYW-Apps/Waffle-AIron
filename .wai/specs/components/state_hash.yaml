id: state_hash
name: State Hash
description: >-
  Computes the deterministic content identity (StateId) of the spec tree: loads every spec through
  the loader (the system, subsystems, components, interfaces, implementations and types),
  canonicalizes it (stable key ordering, normalized serialization) and digests it. Side-effect-free:
  identical spec content always yields the same StateId. The gate identity a lock records combines
  this content identity with the governing doctrine, and the validator's gate identity computes it.
subsystem: sdd_core
componentType: Orchestrator
owns: []
dependsOn:
  - spec_loader
dependencyClass: read
variant: projector
lint:
  allow:
    - code: COMPONENT_IS_ITS_ONLY_METHOD
      reason: D2b either folds this component into its caller or names it for its responsibility.
status: complete
