id: self_service_orchestrator
name: Self-Service Orchestrator
description: >-
  Approval-backed self-service for project initialization, lock, and promotion requested over MCP or
  CLI. Any authenticated principal may request initialization; lock/promote require a grant covering
  the project. Policy/profile evaluation is deferred to Phase 3; every request creates a pending
  ApprovalRequest and decisions surface through the admin portal until the admin UI lands. It
  records audit events and never lets an MCP-connected agent execute a privileged action without an
  approval. A decision's decidedBy MUST differ from the originating request's requestedBy and
  deciding requires an approval-capable grant; self-approval is rejected.
subsystem: sdd_host
componentType: Orchestrator
owns: []
dependsOn:
  - auth_specialist
  - approval_repository
  - admin_orchestrator
  - audit_repository
status: complete
