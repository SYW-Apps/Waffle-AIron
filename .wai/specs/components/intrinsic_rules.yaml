id: intrinsic_rules
name: Intrinsic Rules
description: >-
  Judges one spec's own fields against its stereotype — the spec-scoped rules the write gate also
  runs on a candidate before saving it: Portal wire fields and Store durability declarations.
  Specialist by last resort: its verdicts are not type methods, because the rule set is open (packs
  register rules at runtime) and most verdicts read many specs; it holds no state (the rule set
  belongs to the rule Repository), does no I/O and runs no workflow, which is the arbiter shape.
subsystem: sdd_validator
componentType: Specialist
owns: []
dependsOn: []
variant: arbiter
