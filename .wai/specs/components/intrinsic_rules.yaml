id: intrinsic_rules
name: Intrinsic Rules
description: >-
  Judges one spec's own fields against its stereotype — the spec-scoped rules the write gate also
  runs on a candidate before saving it: Portal wire fields, Store durability declarations, where a
  dependency class may be declared, and components still typed with a retired stereotype. Pure logic
  (dependencyClass: pure, the arbiter variant): it holds no state (the rule set belongs to the rule
  Repository), does no I/O and runs no workflow. Its verdicts are not type methods, because the rule
  set is open (packs register rules at runtime) and most verdicts read many specs.
subsystem: sdd_validator
componentType: Orchestrator
owns: []
dependsOn: []
dependencyClass: pure
variant: arbiter
status: draft
