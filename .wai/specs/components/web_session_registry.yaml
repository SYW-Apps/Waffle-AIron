id: web_session_registry
name: Web Session Registry
description: >-
  Write-path component for browser sessions: creates a new session, touches last-seen activity,
  removes a session on sign-out, and prunes expired sessions. All persisted session changes go
  through this registry, which persists the complete set durably then refreshes the owned store.
subsystem: sdd_host
componentType: Registry
owns: []
dependsOn:
  - web_session_store
status: complete
