id: host_request_orchestrator
name: Host Request Orchestrator
description: >-
  Per-request data-plane orchestrator: authenticate the bearer token, resolve and bind the
  authorized project scope (rejecting cross-project access), then dispatch the sdd_* tool call into
  the reused MCP tool surface within that scope. It also dispatches the execute-primary
  project-lifecycle MCP tools (sdd_host_initialize_project, sdd_host_lock_project,
  sdd_host_promote_project, sdd_host_get_approval_status, sdd_host_await_approval) to the project
  lifecycle orchestrator, the four hosted landscape MCP tools to the surface exchange orchestrator,
  and the project-ops MCP tools (sdd_host_pack_list, sdd_host_pack_install,
  sdd_host_policy_evaluate, sdd_host_policy_reconcile, sdd_host_produce, sdd_host_commit_project —
  all bound to THE one authorized project; instance-level operations are deliberately absent from
  the data plane) to the project ops orchestrator — each already resolver-gated upstream, bypassing
  the ordinary data-plane permission check. Appends a redacted audit event per handled call.
subsystem: sdd_host
componentType: Orchestrator
owns: []
dependsOn:
  - auth_specialist
  - project_registry
  - host_mcp_adapter
  - host_core_adapter
  - audit_repository
  - project_lifecycle_orchestrator
  - surface_exchange_orchestrator
  - authorization_specialist
  - project_ops_orchestrator
status: complete
