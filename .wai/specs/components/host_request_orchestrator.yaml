id: host_request_orchestrator
name: Host Request Orchestrator
description: >-
  Owns the per-request data-plane workflow: authenticate the bearer token to a principal, resolve
  the authorized project (honoring an optional client selector only within the token's authorized
  set), bind the request-scoped project root, then dispatch the sdd_* tool call into the reused MCP
  tool surface within that scope. It also dispatches the approval-backed self-service MCP tools
  (sdd_host_request_project_initialization, sdd_host_request_project_lock,
  sdd_host_request_project_promotion, sdd_host_get_approval_status) to the self-service
  orchestrator, and the four hosted landscape MCP tools (sdd_landscape_list_reachable_projects,
  sdd_landscape_list_reachable_project_interfaces, sdd_landscape_list_visible_surfaces,
  sdd_landscape_get_project_surface) to the surface exchange orchestrator with currentProjectId
  bound to the request-scoped project, instead of the scoped MCP tool surface. Rejects unknown
  tokens and cross-project access. Appends a redacted audit event for every handled data-plane tool
  call; append failures are recorded as server diagnostics and never fail the request.
subsystem: sdd_host
componentType: Orchestrator
owns: []
dependsOn:
  - auth_specialist
  - project_registry
  - host_mcp_adapter
  - host_core_adapter
  - audit_repository
  - self_service_orchestrator
  - surface_exchange_orchestrator
status: complete
