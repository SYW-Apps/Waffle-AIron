id: host_request_orchestrator
name: Host Request Orchestrator
description: >-
  Per-request data-plane workflow: authenticate the bearer token, resolve and bind the authorized
  project scope, then dispatch the sdd_* call — routing the execute-primary project-lifecycle tools
  (sdd_host_initialize_project, sdd_host_lock_project, sdd_host_get_approval_status,
  sdd_host_await_approval) to the project lifecycle orchestrator, and every other tool to the scoped
  MCP server after enforcing the granular data-plane permission over the bound project.
subsystem: sdd_host
componentType: Orchestrator
owns: []
dependsOn:
  - auth_specialist
  - project_registry
  - host_mcp_adapter
  - host_core_adapter
  - audit_repository
  - project_lifecycle_orchestrator
  - surface_exchange_orchestrator
  - authorization_specialist
  - project_ops_orchestrator
status: complete
createdAt: '2026-07-04T12:33:41.786Z'
updatedAt: '2026-09-11T21:03:20.390Z'
