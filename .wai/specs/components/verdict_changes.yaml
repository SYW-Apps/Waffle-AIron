id: verdict_changes
name: Verdict Changes
description: >-
  The upgrade report that replaces a `--legacy` evaluator (stage 4 decision: no old evaluator is
  kept). It says what stage 4 changed in each project's verdict using only what exists now: each
  project's as-complete owner's gate today, the totals and validator version its last lock recorded,
  and — for a reference that no longer resolves — how the family's top matches it by position
  (position_reader, the same match the positional migration step writes from; since stage 6 it lives
  in sdd_migrations and is reached through migration_portal.matchPositions), which is exactly how it
  passed before. The lock records totals and nothing per code, so the report never claims a per-code
  diff: it compares totals, and classifies today's findings by a reason it can compute (escalated,
  pinned, positional), counting what it cannot attribute. It writes nothing. Read-class: it only
  reads, through the CLI's validator, core and migration adapters (the last one's matchPositions is
  a pure read); the walk to the family's top goes through the reach-gated chaining detection and is
  explicit, because the report is asked for.
subsystem: sdd_cli
componentType: Orchestrator
owns: []
dependsOn:
  - cli_validator_adapter
  - cli_core_adapter
  - cli_migration_adapter
dependencyClass: read
status: complete
