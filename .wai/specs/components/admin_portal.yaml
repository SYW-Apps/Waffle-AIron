id: admin_portal
name: Admin Portal
description: >-
  Existing control-plane entrypoint: an authenticated HTTP admin API (separately bound from the data
  plane) for current project lifecycle, API-key lifecycle, pack management, producers, secrets, git
  backing, and privileged lock/promote actions. Dispatches to existing orchestrators; the CLI
  reaches the same workflows through this portal. Future user-bound identity and audit workflows are
  isolated in identity_portal until fully designed and implemented. Never exposed on the public
  data-plane surface.
subsystem: sdd_host
componentType: Portal
owns: []
dependsOn:
  - host_server
  - admin_orchestrator
  - pack_orchestrator
  - project_lifecycle_orchestrator
portalType: HTTP_API
status: complete
