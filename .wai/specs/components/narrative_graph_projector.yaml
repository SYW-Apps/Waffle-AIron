id: narrative_graph_projector
name: Narrative Graph Projector
description: >-
  Derives the components and methods reached over the L5 narrative graph from a seed set, taking the
  rule context, the seeds and the walk options as parameters. It follows call steps and dispatch
  steps (through the target Portal's dispatch table); when the options enable them, it also follows
  every binding of a reached Portal's dispatch table and register-step handoffs. A method below full
  narrative detail that has no narrative falls back to its component's dependsOn and owns.
  Unused-detection walks from every entrypoint with all edges; the durability round-trip walks the
  boot graph from lifecycle init flows without dispatch-table flooding or register edges. Recomputed
  per call; owns nothing, writes nothing. Pure logic (dependencyClass: pure, the projector variant)
  rather than a type method: the walk carries doctrine (register steps are handoffs, dispatch tables
  are served surfaces, the detail-dial fallback) that needs an L5 narrative, which a type method
  cannot carry; it is recomputed per call rather than maintained over a Store, so it is not an
  Index; and it is a derivation rather than a verdict, so it does not sit on a rule family's arbiter
  contract. stepEdges — which edges one narrative step contributes — stays here for the same reason
  and not on the narrative_step type: it is the register-handoff doctrine itself, it needs the whole
  tree's components to route a dispatch step through a Portal's dispatch table, and the option it
  takes is the walk's policy, not a property of the step.
subsystem: sdd_validator
componentType: Orchestrator
owns: []
dependsOn: []
dependencyClass: pure
variant: projector
