id: migration_core_adapter
name: Migration Core Client Adapter
description: >-
  Local client adapter in sdd_migrations for the hop into sdd_core: the family graph and export
  tables, each project's configuration and lock record, and the configuration, reference and member
  writes the verbs make — each at whatever project root the caller has bound, which during a
  rehearsal is the rehearsal copy's. In-process import seam today, swappable for a remote spec store
  without changing the verbs. It exists because only a client Adapter may cross a subsystem
  boundary.
