id: code_model_cache
name: Code Model Cache
description: >-
  The last code model built, for lookups and the validator's gate alike, with the fingerprint it was
  built from (the walked files' content and the implementations' claims, as
  code_model_loader.fingerprint takes it). Simple keyed state: one entry per project root, replaced
  whole on every rebuild, never read by anything but its key. Evictable and loss-safe: a lost entry
  costs one rebuild, never a wrong answer, because a reader compares the fingerprint before trusting
  it.
subsystem: sdd_validator
componentType: Store
owns: []
dependsOn: []
durability: cache
lint:
  allow:
    - code: UNOWNED_STORE
      reason: >-
        Simple keyed state: one entry per project root, replaced whole, read only by its key; its
        one writer and reader is the workflow code_model_loader. No lookup beyond the key needs a
        Registry or Index.
status: complete
createdAt: '2026-10-25T18:57:42.800Z'
updatedAt: '2026-11-10T19:02:48.107Z'
