id: instance_identity_registry
name: Instance Identity Registry
description: >-
  Write path for the singleton InstanceIdentity: first-boot seeding generates cryptographically
  random UUIDs for the built-in subjects and persists the record atomically to instance.json;
  re-seeding is a no-op returning the existing record (create-once, idempotent). Ids are never
  regenerated or rotated.
subsystem: sdd_host
componentType: Registry
owns: []
dependsOn:
  - instance_identity_store
status: complete
