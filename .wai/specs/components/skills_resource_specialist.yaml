id: skills_resource_specialist
name: Skills Resource Specialist
description: >-
  Resolves Wairon's four built-in SDD skills (sdd-architect, sdd-auditor, sdd-implement,
  sdd-narrative) into MCP-readable skill resources: it lists their MCP-safe descriptors and reads
  each skill's markdown content directly from the packaged skill templates, mirroring the templates
  skills_exporter copies to the filesystem. This lets cloud-only MCP agents, which cannot receive
  filesystem-exported skills, read the SDD guidance over the MCP protocol.
subsystem: sdd_skills
componentType: Specialist
owns: []
dependsOn:
  - skills_core_adapter
variant: composer
status: complete
