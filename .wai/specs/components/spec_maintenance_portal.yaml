id: spec_maintenance_portal
name: Spec Maintenance Portal
description: >-
  The mechanical writes of sdd_core — the ones that change identity, placement or format rather than
  what a component owns, and so need no candidate judgement: renaming a component or a method,
  relocating, externalizing or internalizing a chained subproject, the doctor's repairs (retiring
  Specialists, dropping step fields a step type cannot carry), importing an archived tree,
  provisioning a project and seeding a demo project's example tree. Kept apart from the raw store
  writes so the doors that legitimately perform these (the CLI, the MCP server, the hosted server)
  are not handed the ungated save and delete as well. In-process today: realized by
  src/core/index.ts alongside core's other portals.
subsystem: sdd_core
componentType: Portal
owns: []
dependsOn:
  - core_orchestrator
  - tree_transfer_orchestrator
  - reachability_migration
  - demo_orchestrator
transport: InProcess
invokedBy:
  kind: entry
  caller: >-
    Tools and scripts that import the @wairon/cli package's library entry (main dist/index.js, which
    re-exports the core barrel) and call its mechanical spec writes (renames, relocation, doctor
    repairs, tree import, provisioning) in their own process
status: complete
