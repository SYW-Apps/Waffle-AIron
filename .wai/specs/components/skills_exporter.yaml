id: skills_exporter
name: Skills Exporter
description: >-
  Copies the SDD AI Skill definitions to user-approved local AI CLI configuration directories,
  COMPOSING each builtin with any pack sections that extend it (`## Platform: <pack>`, in pack load
  order) and installing genuinely new pack skills namespaced beside them. Freshness is compared
  against what it WOULD write rather than against the raw template — an extended builtin
  legitimately differs from its template, and comparing to the template would report it stale
  forever.
subsystem: sdd_skills
componentType: Adapter
owns: []
dependsOn:
  - skills_core_adapter
  - files_adapter
status: complete
createdAt: '2026-06-10T19:28:00.000Z'
updatedAt: '2026-10-31T23:21:22.073Z'
