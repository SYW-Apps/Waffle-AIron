id: export_index
name: Export Index
description: >-
  Read face of the spec repository for export tables. It projects the scanned specs the Spec Index
  holds into resolved export tables, the way a module resolver flattens `export … from`: each
  re-export is followed to its canonical target, wildcards are expanded with explicit and own
  entries shadowing, a wildcard cycle resolves to its union, and every problem is returned as a fact
  for the validator to judge. A project table's sources are its subsystems, its members and its
  externals, which it finds through the Project Family Index; the same graph lets it map a
  consumer's cross-project references onto a producer's public names. The projection is memoized per
  scan and dropped with it, so it is never stale. It depends on the Spec Index and the Project
  Family Index of the same Repository — the sanctioned exceptional case of an Index projecting
  another Index, never in a cycle (the family index depends on the Spec Index alone) — because a
  second parse of the tree would duplicate state the Spec Index already holds.
subsystem: sdd_core
componentType: Index
owns: []
dependsOn:
  - spec_index
  - project_family_index
