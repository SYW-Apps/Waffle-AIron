id: migration_surfaces_adapter
name: Migration Surfaces Client Adapter
description: >-
  Local client adapter in sdd_migrations for the hop into sdd_surfaces: read a project's pinned
  externals, pin new ones, carry a pin to a new alias or producer id without re-pinning, and remove
  one — at the project root the caller has bound. In-process import seam today. The caller must gate
  on reach itself.
