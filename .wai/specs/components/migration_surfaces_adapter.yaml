id: migration_surfaces_adapter
name: Migration Surfaces Client Adapter
description: >-
  Local client adapter in sdd_migrations for the hop into sdd_surfaces: read a project's pinned
  externals, pin the git or hosted ones a migration owes a pin (a path external is read live and
  never pinned; a member is never pinned), carry a pin to a new alias or producer id without
  re-pinning, and remove one — at the project root the caller has bound. In-process import seam
  today. The caller must gate on reach itself.
subsystem: sdd_migrations
componentType: Adapter
owns: []
dependsOn:
  - surface_portal
  - pin_maintenance_portal
status: complete
