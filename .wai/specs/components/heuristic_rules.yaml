id: heuristic_rules
name: Heuristic Rules
description: >-
  Advisory judgements on size, naming and technology fit: coupling health, target-language fit,
  technology boundaries, naming conventions and naming discipline, narrative complexity, method
  cohesion, and documentation and complexity caps. Pure logic (dependencyClass: pure, the arbiter
  variant): it holds no state (the rule set belongs to the rule Repository), does no I/O and runs no
  workflow. Its verdicts are not type methods, because the rule set is open (packs register rules at
  runtime) and most verdicts read many specs.
subsystem: sdd_validator
componentType: Orchestrator
owns: []
dependsOn: []
dependencyClass: pure
variant: arbiter
