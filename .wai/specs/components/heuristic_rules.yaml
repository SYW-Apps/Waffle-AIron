id: heuristic_rules
name: Heuristic Rules
description: >-
  Advisory judgements on size, naming and technology fit: coupling health, target-language fit,
  technology boundaries, naming conventions and naming discipline, narrative complexity, method
  cohesion, removable forwarders, and documentation and complexity caps. Pure logic
  (dependencyClass: pure, the arbiter variant): it holds no state (the rule set belongs to the rule
  Repository), does no I/O and runs no workflow. Its verdicts are not type methods, because the rule
  set is open (packs register rules at runtime) and most verdicts read many specs. It depends on the
  doctrine rules for one thing: whether a forwarder is removable is the doctrine family's own
  verdict on the direct edge each caller would need, read through the edge judgements those rules
  export, so the two can never drift apart.
subsystem: sdd_validator
componentType: Orchestrator
owns: []
dependsOn:
  - doctrine_rules
dependencyClass: pure
variant: arbiter
status: complete
createdAt: '2026-09-14T05:42:23.080Z'
updatedAt: '2026-10-16T17:16:30.038Z'
