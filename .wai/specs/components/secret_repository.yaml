id: secret_repository
name: Secret Repository
description: >-
  Facade for the container's integration secrets — promoted to a real Repository under the option F
  registry-taxonomy ruling. Writes go to the secret write registry, key-name listings and single-key
  resolution to the secret index, both over the read-through secret store. A value leaves the
  repository only through resolve, to the integration that presents that credential; no listing ever
  carries one.
subsystem: sdd_host
componentType: Repository
owns:
  - secret_store
  - secret_write_registry
  - secret_index
dependsOn: []
status: complete
createdAt: '2026-07-04T17:37:10.470Z'
updatedAt: '2026-09-25T21:12:19.261Z'
