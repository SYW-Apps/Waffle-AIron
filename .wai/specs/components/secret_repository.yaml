id: secret_repository
name: Secret Repository
description: >-
  Facade for the container's integration secrets — promoted to a real Repository under the option F
  registry-taxonomy ruling. Writes go to the secret write registry, key-name listings and single-key
  resolution to the secret index, both over the read-through secret store. Values never leave the
  boundary: no listing carries one, and nothing outside sdd_host can ask for a secret by name. The
  host resolves a value only for the one call it authorizes — a producer run, a git clone — and
  hands it to that call as an argument.
subsystem: sdd_host
componentType: Repository
owns:
  - secret_store
  - secret_write_registry
  - secret_index
dependsOn: []
status: complete
createdAt: '2026-07-04T17:37:10.470Z'
updatedAt: '2026-09-25T22:01:13.499Z'
