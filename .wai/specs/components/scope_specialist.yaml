id: scope_specialist
name: Scope Specialist
description: >-
  Pure resolver of authorization scope: given a principal's grants, the organization unit tree, and
  project placements, computes the set of hosted project ids and unit ids in scope for a required
  permission — or signals ALL (instance-wide '*' super-admin). Performs no I/O; the caller gathers
  org data.
subsystem: sdd_host
componentType: Specialist
owns: []
dependsOn:
  - organization_repository
