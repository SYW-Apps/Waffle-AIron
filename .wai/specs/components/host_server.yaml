id: host_server
name: Host Server
description: >-
  Supervisor for the hosted instance lifecycle. On init it runs the instance bootstrap, the one-time
  boot initialization; on start it binds the data-plane and admin-plane HTTP listeners, accepts
  connections and starts the backup schedule; on stop it stops the schedule and shuts the listeners
  down gracefully. Owns the live listeners and supervises the backup schedule; holds no domain logic
  and no persistence. It is also the control-plane exposure-enforcement point: control-plane routers
  are mounted on the admin listener only as permitted by the resolved HostExposurePolicy (secure
  default when unset), and a disabled surface is not served.
subsystem: sdd_host
componentType: Supervisor
owns: []
dependsOn:
  - backup_schedule
  - instance_bootstrap
  - permission_model_migration
lint:
  allow: []
status: complete
