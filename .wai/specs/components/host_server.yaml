id: host_server
name: Host Server
description: >-
  Supervisor for the hosted instance lifecycle: one-time boot initialization (seeding the persisted
  instance identity and, under devMode, the synthetic local development unit) followed by the HTTP
  listener lifecycle serving both the data-plane and admin-plane portals — binds host/port(s),
  accepts connections, manages graceful startup and shutdown. Owns the live server processes; holds
  no domain logic and no persistence. It is also the control-plane exposure-enforcement point:
  control-plane routers are mounted on the admin listener only as permitted by the resolved
  HostExposurePolicy (secure default when unset), and a disabled surface is not served.
subsystem: sdd_host
componentType: Supervisor
owns: []
dependsOn:
  - instance_identity_repository
  - organization_repository
lint:
  allow:
    - code: UNUSED_METHOD
      reason: >-
        Bootstrap entry points: start/stop are invoked by the `wairon serve` composition root, not
        reached via a modeled HTTP call chain (an HTTP_API portal cannot expose a non-HTTP bootstrap
        method). Boot reachability is modeled by the lifecycle init entrypoint; this gap is by
        design.
status: complete
createdAt: '2026-07-04T12:33:41.732Z'
updatedAt: '2026-07-16T00:28:22.478Z'
