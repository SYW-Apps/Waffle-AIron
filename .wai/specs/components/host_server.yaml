id: host_server
name: Host Server
description: >-
  Supervisor for the HTTP listener lifecycle serving both the data-plane and admin-plane portals:
  binds host/port(s), accepts connections, manages graceful startup and shutdown. Owns the live
  server processes; holds no domain logic and no persistence.
subsystem: sdd_host
componentType: Supervisor
owns: []
dependsOn: []
lint:
  allow:
    - code: UNUSED_COMPONENT
      reason: >-
        Bootstrap entry point: the data/admin HTTP listener supervisor is started by the `wairon
        serve` composition root, not reached via a modeled HTTP call chain. An HTTP_API portal
        cannot expose a non-HTTP bootstrap method to reach it (endpoint-transport constraint), so
        this reachability gap is by design.
status: complete
