id: operations_orchestrator
name: Operations Orchestrator
description: >-
  Workflow owner for hosted operational insight and instance posture: it authenticates and
  authorizes each caller, then assembles redacted instance health reports, resource usage snapshots,
  and advisory (observe/warn) quota observations — and owns the instance EXPOSURE-policy
  administration (read/replace the webUiEnabled/requireTls posture, instance-level project:admin,
  audited at security level). It gathers the hosted project records, the two server-global pack-tier
  listings, and per-project pack/profile references, delegates diagnostic and usage derivation to
  the diagnostics specialist and quota evaluation to the quota specialist. The exposure write is its
  only mutation. Durable backup/restore is intentionally out of scope: operators rely on the
  git-backing sweeps and platform-level data-volume snapshots per the hosted deployment guidance.
subsystem: sdd_host
componentType: Orchestrator
owns: []
dependsOn:
  - auth_specialist
  - project_registry
  - diagnostics_specialist
  - quota_specialist
  - pack_registry
  - authorization_specialist
  - project_relation_repository
  - public_surface_repository
  - policy_repository
  - audit_repository
status: complete
