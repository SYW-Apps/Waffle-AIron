id: operations_orchestrator
name: Operations Orchestrator
description: >-
  Workflow owner for hosted read-only operational insight: it authenticates and authorizes each
  caller, then assembles redacted instance health reports, resource usage snapshots, and advisory
  (observe/warn) quota observations. It gathers the hosted project records, the two server-global
  pack-tier listings, and per-project pack/profile references (derived from each project's
  configuration, loaded through the core adapter), delegates diagnostic and usage derivation to the
  diagnostics component and quota evaluation to quota_rules. It performs no writes; the instance
  exposure-policy administration lives in exposure_policy_orchestrator. Durable backup/restore is
  intentionally out of scope: operators rely on the git-backing sweeps and platform-level
  data-volume snapshots per the hosted deployment guidance.
subsystem: sdd_host
componentType: Orchestrator
owns: []
dependsOn:
  - authentication
  - project_registry
  - diagnostics
  - quota_rules
  - pack_registry
  - authorization
  - project_relation_repository
  - public_surface_repository
  - host_core_adapter
status: complete
createdAt: '2026-07-09T09:09:26.722Z'
updatedAt: '2026-09-15T20:46:21.032Z'
