id: operations_orchestrator
name: Operations Orchestrator
description: >-
  Read-only workflow owner for hosted operational insight: it authenticates and authorizes each
  caller, then assembles redacted instance health reports, resource usage snapshots, and advisory
  (observe/warn) quota observations. It delegates diagnostic and usage derivation to the diagnostics
  specialist and quota evaluation to the quota specialist, and performs no writes. Durable
  backup/restore is intentionally out of scope: operators rely on platform-level data-volume
  snapshots per the hosted deployment guidance.
subsystem: sdd_host
componentType: Orchestrator
owns: []
dependsOn:
  - auth_specialist
  - project_registry
  - diagnostics_specialist
  - quota_specialist
status: complete
