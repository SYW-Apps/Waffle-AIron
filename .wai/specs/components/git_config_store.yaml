      reason: >-
        Option F registry-taxonomy ruling (2026-07-19): deliberate standalone Store — per-project
        git-backing configuration is genuinely simple held state (one config file per scoped repo),
        consumed only by the git orchestrator. durability: read-through to be declared once the
        level3 branch merges (the enum value does not exist in this branch's schema).
