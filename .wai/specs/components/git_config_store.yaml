id: git_config_store
name: Git Config Store
description: >-
  The project's git-backing config boundary (.wai/git.json): remote URL, default branch, working
  branch, and enabled flag. A standalone read-through Store — the file is the persistence medium,
  this component is the state boundary; every read hits the file, so hydration is definitionally
  covered.
subsystem: sdd_git
componentType: Store
owns: []
dependsOn: []
durability: read-through
