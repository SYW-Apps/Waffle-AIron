description: >-
  How complete the spec tree is, as a report anything can print: which subsystems exist, how far
  each has been specified, and what failed to parse. Declared `read`, because asking after a
  project's state must never change it. It lives in sdd_core rather than beside the command that
  shows it because it has two readers already — the terminal and the MCP server — and a report the
  MCP server reaches into a CLI command file to get is a boundary crossing waiting to be discovered.
