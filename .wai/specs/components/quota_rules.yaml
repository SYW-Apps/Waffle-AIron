id: quota_rules
name: Quota Rules
description: >-
  Pure logic that evaluates resource usage snapshots against ResourceQuotaPolicy and labels each
  exceeded limit observe or warn, without owning durable state. The evaluation is advisory only:
  nothing in the data plane consults it. Actual blocking or throttling enforcement requires a future
  data-plane integration and is explicitly out of scope for now; until then there is no block mode.
