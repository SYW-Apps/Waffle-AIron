id: spec_registry
name: Spec Registry
description: >-
  Validated write face of the spec repository: every save keys the spec's own id, writes its
  references back relative to the project that owns it — the exact inverse of the scan's binding —
  stamps updatedAt, and re-parses through the writer schema before routing the serialized document
  to the file store of the project that owns it; it also exercises that same writer pipeline in
  memory for the round-trip dry run. The inverse: a key under the owning project's key is written
  bare; a reference whose in-memory value still equals what the scan bound its authored text to is
  written back as authored, so authored text round-trips byte for byte; any other key in another
  project is written `alias::publicName`, with the owning project's alias for the producer (its
  project id when it declares none) and the public name that binds the target in the producer's
  recorded table (its local id when none does); an outside or unresolved reference is written as it
  came. It reads the owning project's alias table and the producers' public names from the workspace
  scan — the same scan every save already consults to route a key to its member's files — and never
  emits `super::`, a leading `::` or a member path. Two maintenance writes serve the chaining
  migration: deleting a legacy L1 mount once its fields are carried, and re-saving a spec with every
  reference in that canonical form.
subsystem: sdd_core
componentType: Registry
owns: []
dependsOn:
