id: network_diagram_projector
name: Network Diagram Projector
description: >-
  Projects the network picture from a reach model and its flows: the declared networks as nested
  boundaries, the gateways on them, an outside node, and the flows aggregated per workload pair with
  their transport and verb count. It answers it as Mermaid text, and as the view model the hosted
  canvas's network view draws. It is a data-flow diagram with trust boundaries, which is what a
  threat-modelling session starts from. Pure.
subsystem: sdd_network
componentType: Orchestrator
