id: rule_registry
name: Rule Registry
description: >-
  Write path for the rule set: seeds the built-in SDD conformance rules and registers programmatic
  pack rules (after the built-ins, so project pack order is precedence) into the rule store. Holds
  no state itself. Depends on the eight rule families because seeding hands each built-in rule
  method to the store through a register step, a handoff the validator later invokes rather than a
  call.
subsystem: sdd_validator
componentType: Registry
owns: []
dependsOn:
  - rule_store
  - integrity_rules
  - narrative_rules
  - intrinsic_rules
  - doctrine_rules
  - extension_rules
  - wiring_rules
  - conformance_rules
  - heuristic_rules
status: complete
createdAt: '2026-07-14T19:16:58.718Z'
updatedAt: '2026-09-14T05:42:58.620Z'
