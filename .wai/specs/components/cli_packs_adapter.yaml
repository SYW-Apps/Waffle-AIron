id: cli_packs_adapter
name: CLI Packs Client Adapter
description: >-
  Local client adapter in sdd_cli for the unified `wairon pack` command family (with `wairon packs`
  kept as a deprecated alias). Authoring goes through the @wairon/sdk portal: init scaffolds a pack
  project, build emits an installable .wpack archive. The STORE commands — install / uninstall /
  which — manage this wairon install's machine-wide pool through the pack store adapter, and install
  applies to nothing until a project selects the pack by name. The legacy commands remain: add is
  ZIP-aware (a .wpack/.zip is safely extracted via the SDK into .wai/packs/<name>/ and the directory
  registered, a plain file/dir is vendored), list reads the merged set via the core portal, remove
  deregisters + deletes a vendored pack.
subsystem: sdd_cli
componentType: Adapter
owns: []
dependsOn:
  - core_portal
  - sdk_portal
status: complete
