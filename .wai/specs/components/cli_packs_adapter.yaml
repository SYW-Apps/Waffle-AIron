id: cli_packs_adapter
name: CLI Packs Client Adapter
description: >-
  Local client adapter in sdd_cli for the `wairon packs` command family. Vendors a pack into
  .wai/packs and registers it in project.yaml (add), lists the loaded packs and what each provides
  via the core portal (list), and deregisters plus deletes a vendored pack (remove).
subsystem: sdd_cli
componentType: Adapter
owns: []
dependsOn:
  - core_portal
