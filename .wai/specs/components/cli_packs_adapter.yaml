id: cli_packs_adapter
name: CLI Packs Client Adapter
description: >-
  Local client adapter in sdd_cli for the unified `wairon pack` command family (with `wairon packs`
  kept as a deprecated alias). Authoring goes through the @wairon/sdk portal: init scaffolds a pack
  project, build emits an installable .wpack archive. Install (add) is ZIP-aware — a .wpack/.zip
  source is safely extracted (via the SDK) into .wai/packs/<name>/ and the directory registered,
  while a plain file/dir source is vendored as before; list reads the merged set via the core
  portal; remove deregisters + deletes a vendored pack.
subsystem: sdd_cli
componentType: Adapter
owns: []
dependsOn:
  - core_portal
  - sdk_portal
status: complete
