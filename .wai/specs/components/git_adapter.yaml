id: git_adapter
name: Git Client Adapter
description: >-
  The only block doing git I/O: clone, fetch, ensure/checkout the working branch, integrate the
  default branch, commit the working tree, push, read the head commit, and compute the host-agnostic
  compare URL. Runs git against the bound project's checkout using the container's bot committer
  identity. The clone's token is INJECTED by whoever wires the adapter up: this subsystem never asks
  anyone for a secret by name.
subsystem: sdd_git
componentType: Adapter
owns: []
dependsOn:
  - files_adapter
  - process_adapter
status: complete
