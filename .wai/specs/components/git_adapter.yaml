id: git_adapter
name: Git Client Adapter
description: >-
  The only block doing git I/O: clone, fetch, ensure/checkout the working branch, integrate the
  default branch, commit the working tree, push, read the head commit, and compute the host-agnostic
  compare URL. Runs git against the bound project's checkout using the container's bot identity
  (WAIRON_GIT_TOKEN + committer name/email).
