id: validator_surfaces_adapter
name: Validator Surfaces Client Adapter
description: >-
  Client adapter loading the available surface snapshots from the surface-exchange subsystem's
  published portal, so validation can resolve cross-tree and remote adapter references against
  declared contracts (SURFACE_STALE on StateId mismatch; CROSS_TREE_REF_UNRESOLVED only when no
  snapshot covers a reference).
