id: validator_surfaces_adapter
name: Validator Surfaces Client Adapter
description: >-
  Client adapter into the surface-exchange subsystem's published portal: the bound root's own
  foreign surface snapshots and its pinned externals, which the owner's gate judges references into
  other projects against, and each external's status against its live producer, which a family run
  composes from. It reads no member's snapshots: the mount-pool lookup went with
  resolve-through-parent (stage 4).
subsystem: sdd_validator
componentType: Adapter
owns: []
dependsOn:
  - surface_portal
status: design
