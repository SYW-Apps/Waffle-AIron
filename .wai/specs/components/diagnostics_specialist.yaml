id: diagnostics_specialist
name: Diagnostics Specialist
description: >-
  Pure specialist that derives redacted operational diagnostics and usage snapshots from hosted
  project records supplied by the operations orchestrator, and assembles an aggregated instance
  health report. It performs no I/O of its own and owns no state; it reasons only over the records
  passed to it.
