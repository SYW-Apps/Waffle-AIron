id: instance_upgrade
name: Instance Upgrade
description: >-
  Brings a hosting data directory and its hosted trees to the running major when the server starts,
  before it serves anything: it refuses to start on a data directory a newer major or a major
  outside the window wrote, copies an older one whole first, runs the kept data-directory steps in
  order (for 5 to 6: the permission model, the retired stored values, then every hosted tree, then
  the member records the upgraded trees declare), and records the running major. Any failure stops
  the start, naming what failed and the backup to restore.
subsystem: sdd_host
componentType: Orchestrator
owns: []
dependsOn:
  - instance_version_store
  - instance_backup_adapter
  - permission_model_migration
  - member_registration
  - audit_repository
  - host_upgrade_adapter
  - project_repository
  - retired_value_migration
  - files_adapter
previousIds:
  - data_dir_upgrade
lint:
  allow:
    - code: INCOHESIVE_METHODS
      reason: >-
        Two halves of one start-time concern: run and resetDevDataDir bring the data directory to
        the running major, while upgradeTrees and behind act on and read the served trees' standing
        that run decides about. run calls both of the latter, so the concern is one; splitting the
        trees into their own orchestrator would leave run a forwarder.
status: complete
createdAt: '2026-10-18T14:29:20.735Z'
updatedAt: '2026-11-27T22:52:54.573Z'
