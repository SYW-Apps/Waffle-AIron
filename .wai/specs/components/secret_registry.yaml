id: secret_registry
name: Secret Registry
description: >-
  I/O manager for the container's integration secrets (git token, Notion token, diagram signing
  secret) at $WAIRON_DATA_DIR/auth/secrets.json — set at runtime so integrations can be added
  without a restart. Reads resolve data-dir secret then env; listing returns key names only, never
  values. Modeled as a single file-backed Registry.
