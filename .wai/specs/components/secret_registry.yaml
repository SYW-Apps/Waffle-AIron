id: secret_registry
name: Secret Registry
description: >-
  Facade for the container's integration secrets — promoted to a real Repository under the option F
  registry-taxonomy ruling. Writes go to the secret write registry, key-name listings to the secret
  index, both over the read-through secret store. Values never leave the repository boundary through
  the contract.
subsystem: sdd_host
componentType: Repository
owns:
  - secret_store
  - secret_write_registry
  - secret_index
dependsOn: []
status: complete
