id: project_config_portal
name: Project Config Portal
description: >-
  Published project configuration of sdd_core: read the bound project's configuration and whether it
  has one, create it, and change what it selects — pack selections and pack references, the project
  type, the profile selection, the execution tier, which selections are bundled, and whether it
  declares machine-wide packs. In-process today: realized by src/core/index.ts alongside core's
  other portals.
subsystem: sdd_core
componentType: Portal
owns: []
dependsOn:
  - core_orchestrator
  - project_config_repository
transport: InProcess
invokedBy:
  kind: entry
  caller: >-
    Tools and scripts that import the @wairon/cli package's library entry (main dist/index.js, which
    re-exports the core barrel) and read or change the project configuration in their own process
status: complete
