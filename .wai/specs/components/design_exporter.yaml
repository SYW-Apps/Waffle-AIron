id: design_exporter
name: Design Exporter
description: >-
  Projects the bound project's loaded, resolved spec tree into the design export (DesignExport):
  every subsystem, component, interface, implementation and type keyed and resolved, the export
  tables resolved, the dependencies listed, and the source stamped with the tree's StateId and its
  approval state. It reads only what the loader already resolved (stage 1 signatures, stage 2
  canonical types) through the core client adapter, and writes nothing: the surface snapshot's
  sibling for the whole design, not for the public contract. Pure projection, deterministic over the
  tree it reads.
subsystem: sdd_surfaces
componentType: Orchestrator
owns: []
dependsOn:
  - surfaces_core_adapter
dependencyClass: read
variant: projector
status: design
