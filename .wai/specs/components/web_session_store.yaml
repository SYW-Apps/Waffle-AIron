id: web_session_store
name: Web Session Store
description: >-
  Authoritative in-memory holder of the unified web UI's browser sessions, file-backed under the
  hosted data root (mirroring the user/credential store convention). Owns state only, no workflow
  decisions; it is the state holder behind the web session repository.
subsystem: sdd_host
componentType: Store
owns: []
dependsOn:
  - file_write_lock
  - files_adapter
durability: read-through
status: complete
