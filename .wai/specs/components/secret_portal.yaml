id: secret_portal
name: Secret Portal
description: >-
  In-process front door onto the container's integration secrets for the subsystems whose adapters
  present a credential to an outside service (sdd_git's clone, sdd_producers' Notion and Miro sync).
  Resolves one key to its value through the secret repository's read face; it writes nothing and
  lists nothing. Kept apart from the admin plane, which sets and lists secrets for operators.
subsystem: sdd_host
componentType: Portal
owns: []
dependsOn:
  - secret_repository
portalType: Custom
status: complete
createdAt: '2026-09-25T21:12:24.385Z'
updatedAt: '2026-09-25T21:12:24.398Z'
