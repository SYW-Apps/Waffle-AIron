id: pinned_externals_store
name: Pinned Externals Store
description: >-
  Authoritative state for the project's pinned externals: the lock (.wai/externals.lock.yaml) and
  the snapshots it names (.wai/externals/<alias>.yaml) — one aggregate, as a lockfile and the
  contracts it digests are one. Read-through: every read is the file read through the externals file
  adapter, nothing is held in memory, so there is nothing to hydrate.
subsystem: sdd_surfaces
componentType: Store
owns: []
dependsOn:
  - externals_file_adapter
durability: read-through
status: design
