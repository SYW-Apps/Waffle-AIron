id: gate_identity
name: Gate Identity
description: >-
  Computes the gate identity a lock records and every staleness check compares: the spec tree's
  content identity together with the doctrine that governs it (the built-in rules by name, codes and
  default severities; the packs, profiles, languages, patterns, guarantees, assertions and pack
  rules; the project's type and rule tuning) and the consumed contract inputs a verdict can consult.
  Pure: the caller gathers every input. The project's `composition` block (requirePolicies) is
  deliberately NOT part of it until stage 5: its only effect on the project's own gate is the syntax
  check of its own requirements, and what it requires of members is judged in the family run, which
  a lock does not record yet — stage 5's composition subjects add the adopted policies. Until then,
  changing a requirement does not make the requiring project's lock stale.
subsystem: sdd_validator
componentType: Orchestrator
owns: []
dependsOn: []
dependencyClass: pure
