id: gate_identity
name: Gate Identity
description: >-
  Computes the gate identity a lock records and every staleness check compares: the spec tree's
  content identity together with the doctrine that governs it (the built-in rules by name, codes and
  default severities; the packs, profiles, languages, patterns, guarantees, assertions and pack
  rules; the project's type and rule tuning) and the consumed contract inputs a verdict can consult.
  Pure: the caller gathers every input.
