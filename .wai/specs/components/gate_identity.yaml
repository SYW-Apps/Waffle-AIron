id: gate_identity
name: Gate Identity
description: >-
  Computes the gate identity a lock records and every staleness check compares: ONE project's own
  spec content identity together with the design doctrine that governs it (the built-in rules that
  judge design, by name, codes and default severities; the packs, profiles, languages, patterns,
  guarantees, assertions and pack rules; the project's type and rule tuning, less its
  code-conformance tuning), its own consumed contract inputs, its `composition` block, and each
  direct member's composition subject. That is the whole of what a lock certifies (decision #10):
  the design under its declared inputs. A member's specs and inputs are not hashed — its subject
  stands for them, transitively — and the rules that judge code are not either: their doctrine has a
  digest of its own (analyzer), recorded beside the claim with the code results, so an analyzer
  upgrade never stales an approval. Pure: the caller gathers every input.
subsystem: sdd_validator
componentType: Orchestrator
