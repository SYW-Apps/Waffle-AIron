id: dev_cockpit_orchestrator
name: Dev Cockpit Orchestrator
description: >-
  The local development server's control plane behind the dev page: the pending review requests an
  agent made, the human's decision on one (locking a lock request runs the CLI's own lock first),
  the human commands the CLI handed the server (lock, generate, doctor --fix), and the family
  panel's commands (externals pin and live status, network declare and undeclare, the member
  commands, each previewed with its report before it is applied), each answered with what it
  printed. It also names the projects on disk the served project reads, which the dev server
  watches. Refuses outside the local development server, where no commands were handed over.
subsystem: sdd_host
componentType: Orchestrator
owns: []
dependsOn:
  - host_core_adapter
  - authentication
  - project_repository
status: complete
