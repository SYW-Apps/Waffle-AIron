id: dev_cockpit_orchestrator
name: Dev Cockpit Orchestrator
description: >-
  The local development server's control plane behind the dev page: the pending review requests an
  agent made, the human's decision on one (locking a lock request runs the CLI's own lock first),
  and the human commands the CLI handed the server (lock, generate, doctor --fix), each answered
  with what it printed. Refuses outside the local development server, where no commands were handed
  over.
subsystem: sdd_host
componentType: Orchestrator
owns: []
dependsOn:
  - host_core_adapter
  - authentication
  - project_repository
status: complete
