id: mcp_migration_orchestrator
name: MCP Migration Orchestrator
description: >-
  The one workflow behind every member tool that changes a family's shape (sdd_attach_member,
  sdd_rename_project, sdd_rename_member_alias, sdd_detach_member, sdd_adopt_member,
  sdd_internalize_member, sdd_externalize_subsystem): plan the request, and with dryRun answer the
  plan and drop it; otherwise apply it when nothing refuses. An agent has no confirmation prompt, so
  dryRun is the confirmation: the tool descriptions tell an agent to dry-run first and show the
  plan. It also answers the pending-transaction banner sdd_get_status and sdd_validate_tree lead
  with. Its own component beside mcp_orchestrator for the reason mcp_externals_orchestrator is: one
  responsibility, one collaborator.
subsystem: sdd_mcp
componentType: Orchestrator
owns: []
dependsOn:
  - mcp_migration_adapter
status: design
