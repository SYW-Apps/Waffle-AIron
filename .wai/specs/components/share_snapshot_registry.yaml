name: Share Snapshot Registry
description: >-
  Write path for captured share snapshots: persist a freshly captured payload set (canvas model /
  openapi / html) under a new snapshot id. Write-once — a stored snapshot is never mutated. No
  authorization; the share admin orchestrator drives capture.
