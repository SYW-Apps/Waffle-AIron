id: network_portal
name: Network Portal
description: >-
  The derived networking front door, called in-process by the CLI's `wairon network` commands, the
  MCP read tools and the hosted canvas's network view. It terminates the call and dispatches each
  request to the network workflows. Everything it answers is read-only: no spec, lock or file is
  written here.
