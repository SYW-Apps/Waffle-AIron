id: code_model_loader
name: Code Model Loader
description: >-
  Answers the code model for a set of specs, fresh for the files on disk: fingerprints the source
  files the specs name by their content together with which of them the implementations claim,
  answers the cached model when that fingerprint matches, and otherwise rebuilds it through the
  source analysis adapter and replaces the cache entry. The one writer of the code model cache.
  Lookups read it, and so does the validator's gate: the model depends on the specs only through
  that file set and its claims, so a fingerprint over both and the files' content is exact, and a
  spec edit that moves neither (a description, a contract, a narrative) re-judges the tree against
  the model already built instead of type-checking the source again. A gate run never builds a
  different model than a fresh build would.
subsystem: sdd_validator
componentType: Orchestrator
owns: []
dependsOn:
  - code_model_cache
  - source_analysis_adapter
  - validator_core_adapter
  - content_fingerprint
status: complete
