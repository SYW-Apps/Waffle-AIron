id: extension_orchestrator
name: Extension Orchestrator
description: >-
  Owns the extension-pack load workflow. Gathers what governs the project — global packs (unless
  opted out) plus the project's own declared entries, each either a legacy path ref or a by-name
  SELECTION — resolves every selection against the committed bundle first and this install's pack
  store second, reads each through the pack source adapter, parses and validates it against the pack
  schema, and merges the results (project packs win on collision) into a single LoadedExtensions
  carrying rules, profiles, languages, skills, patterns, guarantees, assertions, connecting-agent
  instruction blocks, per-pack provenance, and collected load errors. A declared pack that cannot be
  resolved — not installed, no version satisfying the pin, or content failing a pinned integrity
  digest — becomes an EXTENSION_LOAD_ERROR on the same channel as a pack that fails to parse, so
  validate, status, lock, generate, and every sdd_* call refuse rather than appearing clean while
  the declared doctrine is absent. One unresolvable entry never suppresses the packs that did
  resolve. Instruction blocks are the one merged field whose ORDER is semantic — they accumulate in
  pack load order because that is the order they are appended to wairon's own MCP instructions.
subsystem: sdd_core
componentType: Orchestrator
owns: []
dependsOn:
  - pack_source_adapter
  - pack_store_adapter
lint:
  allow: []
