id: agent_plugin_adapter
name: Agent Plugin Adapter
description: >-
  The client for the AI tools' own plugin listings: knows which tools answer `plugin list --json`
  (Claude Code and Codex), how to run that listing with a time limit, and how to read whether the
  wairon plugin is installed and enabled in it. Every other tool, a missing command, a failed or
  slow listing and output it cannot read answer unknown, never absent. Holds no state.
subsystem: sdd_cli
componentType: Adapter
owns: []
dependsOn:
  - process_adapter
status: complete
