id: project_family_index
name: Project Family Index
description: >-
  Read face of the spec repository for the project graph. It projects the roots the Spec Index's
  scan read into one node per project (key, effective id, name, parent, alias and declaration form,
  legacy mount, directory, members, alias table, and its declared externals bound to their
  producers), an owner for every spec key, every reference that leaves the project making it and
  every reference with `::` as the scan bound it, and the family's identity and membership problems.
  The projection is memoized on the scan and dropped with it, so it is never stale. It depends on
  the Spec Index of the same Repository — the sanctioned exceptional case of an Index projecting
  another Index, never in a cycle — because the scan already walked every member and bound every
  reference; a second walk would duplicate state the Spec Index holds.
subsystem: sdd_core
componentType: Index
owns: []
dependsOn:
  - spec_index
