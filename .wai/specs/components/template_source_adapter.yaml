id: template_source_adapter
name: Template Source Adapter
description: >-
  The only component doing agent-instruction-source file I/O: resolves a template name through the
  three-tier override chain (project .wai/templates/ → user home ~/.wairon/templates/ → packaged
  built-in templates) and reads the optional per-agent project guidance file
  (.wai/agents/<agent-id>.md) — the user-owned customization seam folded live into every brief.
  Serves both the generate-time exporters and the live composeAgentBrief path from one
  implementation, so file-based and MCP-served agent instructions can never drift.
subsystem: sdd_core
componentType: Adapter
