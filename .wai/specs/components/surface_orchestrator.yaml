id: surface_orchestrator
name: Surface Orchestrator
description: >-
  Owns the surface-exchange workflows: project the own tree into an audience-filtered snapshot
  (optionally rendered via a codec and written out), import exchanged/authored surfaces (native YAML
  or OpenAPI), serve stored snapshots to consumers, and generate parent-surface snapshots into every
  chained child project.
