id: project_config_registry
name: Project Config Registry
description: >-
  Write path for the project-configuration aggregate: every change to `.wai/project.yaml` is
  validated against the schema and written through the store — creating a configuration, registering
  and removing packs (path references and by-name selections), bundling and pinning, the governing
  project type, the recorded profile selection and the execution tier. A save never writes a
  defaulted project id; only a deliberate writer sets one. Read and write paths stay decoupled, so
  it never touches the index.
subsystem: sdd_core
componentType: Registry
owns: []
dependsOn:
  - project_config_store
status: complete
