id: cli_lock_adapter
name: CLI Lock Adapter
description: >-
  CLI-side forwarding of the local `wairon lock` mechanics: obtains the tree's gate identity from
  the validator's published portal and persists the commit-scoped lock record, which carries the
  approval, through the core subsystem's published portal. The as-complete dry-run gate runs BEFORE
  this adapter (through the validator adapter), and the generated agent and skill outputs are
  refreshed AFTER it; the runner owns that workflow, and this adapter owns only the lock-record hop.
subsystem: sdd_cli
componentType: Adapter
owns: []
dependsOn:
  - core_portal
  - validator_portal
status: complete
