id: policy_index
name: Policy Index
description: >-
  Read-path projection over hosted instance policies, supporting lookup of the active pack/profile
  policy and any future policy variants.
subsystem: sdd_host
componentType: Index
owns: []
dependsOn:
  - policy_store
  - files_adapter
lint:
  allow:
    - code: INDEX_DOES_IO
      at: files_adapter
      reason: >-
        Known debt under the 6.x data-block standard: this Index reads the policy files itself. In
        7.0 the read moves to its Store and the Index projects what the Store holds.
status: complete
