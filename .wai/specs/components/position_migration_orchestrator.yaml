id: position_migration_orchestrator
name: Position Migration Orchestrator
description: >-
  The share of a family's chaining migration that retires position. It plans, from the project graph
  the chaining migration already read, each legacy L1 mount's move into its parent's `members` (with
  the mount's published entries carried into the member's L0, and a finding for every field that has
  no home), each reference rewrite out of a deprecated form (the scan's own rewrite: a bare local id
  or `alias::publicName`), and — stage 4 — the positional step: every reference that resolved only
  by position (position_reader, the same match the upgrade report explains) becomes a `use` import
  on its consumer, and every self-prefixed reference a rewrite to its bare local id; an ambiguous
  match is a finding, never guessed. It writes a confirmed plan after the chaining migration's ids,
  exports and externals and before any pin — imports first, then members, then the rewrites from the
  family's top root, then the deletion of the stage-1 family pins — into the roots it is handed:
  since stage 6 a rehearsal's, so the family transaction swaps the result in all-or-nothing. It
  holds no state, binds each project's root for its writes and restores the caller's binding on
  every path, and never locks. Its own component because the chaining migration's plan and write
  were already at their size limit and these steps are one responsibility — removing the positional
  forms — with their own findings. It moved from sdd_cli to sdd_migrations in stage 6 with the
  chaining migration. The caller must gate on reach itself.
subsystem: sdd_migrations
componentType: Orchestrator
owns: []
dependsOn:
  - migration_core_adapter
  - migration_surfaces_adapter
  - position_reader
status: complete
