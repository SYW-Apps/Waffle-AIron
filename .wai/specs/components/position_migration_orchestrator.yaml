id: position_migration_orchestrator
name: Position Migration Orchestrator
description: >-
  The stage-3 share of a family's chaining migration: retiring position. It plans, from the project
  graph the chaining migration already read, each legacy L1 mount's move into its parent's `members`
  (with the mount's published entries carried into the member's L0, and a finding for every field
  that has no home), and each reference rewrite out of a deprecated form (the scan's own rewrite: a
  bare local id or `alias::publicName`); and it applies a confirmed plan after the chaining
  migration's ids, exports, externals and pins are written — members first, then the rewrites from
  the family's top root, then the deletion of the stage-1 family pins. It holds no state, binds each
  project's root for its writes and restores the caller's binding on every path, and never locks.
  Its own component because the chaining migration's plan and apply were already at their size limit
  and these steps are one responsibility — removing the positional forms — with their own findings.
  The caller must gate on reach itself.
subsystem: sdd_cli
componentType: Orchestrator
owns: []
dependsOn:
  - cli_core_adapter
  - cli_surfaces_client_adapter
status: design
