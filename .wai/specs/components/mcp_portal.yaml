id: mcp_portal
name: MCP Portal
description: >-
  Inbound portal for the SDD MCP subsystem: receives sdd_* tool calls and resource reads as MCP
  JSON-RPC (over stdio, or carried by the hosted data plane's HTTP endpoint) and dispatches them to
  the MCP workflows. The server these verbs are mounted on is built by mcp_hosting_portal.
subsystem: sdd_mcp
componentType: Portal
owns: []
dependsOn:
  - mcp_orchestrator
  - mcp_externals_orchestrator
  - mcp_migration_orchestrator
  - mcp_network_orchestrator
transport: JSONRPC
invokedBy:
  kind: entry
  caller: >-
    AI coding tools (Claude Code, Gemini/Antigravity, Codex and other MCP clients) that spawn
    `wairon mcp serve` and speak MCP JSON-RPC over its stdio; the hosted data plane serves the same
    verbs to remote MCP clients through a server built from this Portal's router
status: complete
createdAt: '2026-06-19T12:00:00Z'
updatedAt: '2026-10-06T19:02:02.654Z'
