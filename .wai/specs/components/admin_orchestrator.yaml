id: admin_orchestrator
name: Admin Orchestrator
description: >-
  Owns the existing control-plane workflows: provision a new isolated project, mint/rotate/revoke
  API keys, the state-scoped lock, per-project git backing (bind to the project's REAL repository —
  wairon commits ONLY .wai/, with the deliberate commitProject primitive, the lock auto-publish, and
  the periodic skip-if-clean sweep), and per-project producer targets. Lock validates the tree
  as-complete via the validator adapter, then records a lock scoped to the exact validated state id.
  Never merges to production itself. Project/key/lifecycle methods authorize through the permission
  resolver (project:create/write/admin over the relevant scope); git and producer administration
  require project:admin over the project (sync/commit require project:write).
subsystem: sdd_host
componentType: Orchestrator
owns: []
dependsOn:
  - auth_specialist
  - project_registry
  - credential_registry
  - host_core_adapter
  - host_validator_adapter
  - host_git_adapter
  - host_producer_adapter
  - secret_registry
  - organization_repository
  - authorization_specialist
lint:
  allow: []
status: complete
