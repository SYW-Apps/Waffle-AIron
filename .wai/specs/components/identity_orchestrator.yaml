id: identity_orchestrator
name: Identity Orchestrator
description: >-
  Owns hosted identity workflows that are not pure authentication: headless SSO login
  (start/complete with inlined first-login user provisioning), resolving or creating local user
  records, minting and revoking user-bound MCP/API tokens, instance-admin identity-provider (SSO)
  configuration, and scoped audit read/count access. Every effectful method authenticates the caller
  credential through the single auth authority and authorizes through the permission resolver
  (project:admin over the relevant scope) before any effect — except the SSO start/complete pair,
  which is unauthenticated by nature (trust derives from the signed SSO state and the provider code
  exchange). The user directory's project filter intersects the listing with the permission grid
  (users holding a DIRECT assignment at that project scope), since user records carry no project
  reference. It does not handle raw HTTP transport.
subsystem: sdd_host
componentType: Orchestrator
owns: []
dependsOn:
  - auth_specialist
  - user_repository
  - credential_registry
  - project_registry
  - audit_repository
  - identity_provider_adapter
  - policy_repository
  - authorization_specialist
  - web_session_repository
  - permission_repository
lint:
  allow: []
status: complete
