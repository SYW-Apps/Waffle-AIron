id: identity_orchestrator
name: Identity Orchestrator
description: >-
  Owns hosted identity workflows that are not pure authentication: resolving or creating local user
  records, granting project permissions, minting and revoking user-bound MCP tokens, and recording
  identity/audit events for those changes. It does not handle raw HTTP transport.
subsystem: sdd_host
componentType: Orchestrator
owns: []
dependsOn:
