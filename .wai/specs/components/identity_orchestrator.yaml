id: identity_orchestrator
name: Identity Orchestrator
description: >-
  Owns hosted identity workflows that are not pure authentication: headless SSO login
  (start/complete with inlined first-login user provisioning), resolving or creating local user
  records, granting project permissions, minting and revoking user-bound MCP/API tokens,
  instance-admin identity-provider (SSO) configuration, and admin-only audit read/count access.
  Every effectful method authenticates the caller credential through the single auth authority and
  authorizes by grants before any effect — except the SSO start/complete pair, which is
  unauthenticated by nature (trust derives from the signed SSO state and the provider code
  exchange). It does not handle raw HTTP transport.
subsystem: sdd_host
componentType: Orchestrator
owns: []
dependsOn:
  - auth_specialist
  - user_repository
  - credential_registry
  - project_registry
  - audit_repository
  - identity_provider_adapter
  - policy_repository
  - organization_repository
  - authorization_specialist
  - web_session_repository
lint:
  allow: []
