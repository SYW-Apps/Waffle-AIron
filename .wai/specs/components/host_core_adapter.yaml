id: host_core_adapter
name: Host Core Client Adapter
description: >-
  Local client adapter crossing the subsystem boundary to sdd_core via its published portal:
  provisions a project's spec skeleton, computes the deterministic spec-tree state id, reads/writes
  the lock record, and applies status promotion — the spec-tree operations the admin orchestrator
  composes for provisioning and lock/promote.
