id: doctrine_rules
name: Doctrine Rules
description: >-
  Judges the architecture standard's stereotype and pattern doctrine: Portal endpoints and
  cross-call auth, stereotype dependency rules, pattern ownership, and 1:1 facade forwarding. Pure
  logic (dependencyClass: pure, the arbiter variant): it holds no state (the rule set belongs to the
  rule Repository), does no I/O and runs no workflow. Its verdicts are not type methods, because the
  rule set is open (packs register rules at runtime) and most verdicts read many specs.
subsystem: sdd_validator
componentType: Orchestrator
owns: []
dependsOn: []
dependencyClass: pure
variant: arbiter
status: complete
