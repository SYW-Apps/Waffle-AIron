id: web_portal
name: Web Portal
description: >-
  Browser-facing HTTP entrypoint for the unified role-based web UI, on the PUBLIC data-plane
  listener. Serves the client app shell and its static assets at the root, and the thin
  session/SSO/context/graph endpoints under /web that back the app. It authenticates browser
  requests by a session cookie whose value the single auth authority resolves to a Principal
  (authenticateSession); because a session resolves to a Principal exactly like a bearer token, the
  served client reuses the scoped /mcp data plane with the session as its credential. The
  identity/admin/policy/landscape/operations control-plane portals, however, are bound to the
  LOOPBACK admin listener and are unreachable from a remote browser; so the admin control plane the
  web UI needs is exposed HERE on the data plane and forwarded with the session as the credential:
  user, identity-provider/SSO, organization-unit, role, and permission-assignment management under
  /web/admin/* to the web admin orchestrator; packs, pack policy, the audit viewer, and the exposure
  editor under /web/admin/* and per-project packs/policy/producers/git under /web/projects/* to the
  PROJECT OPS orchestrator, whose owning orchestrators re-apply the exact resolver authorization.
  Session-lifecycle/SSO/graph routes forward to the web orchestrator; project lifecycle to the web
  project orchestrator. The login screen is DYNAMIC: the unauthenticated pre-auth GET
  /web/login-options read (gated like every /web route) reports which sign-in methods exist — the
  password-login flag plus enabled-provider { id, displayName } pairs — so the served shell renders
  exactly the available options and never a free-text provider input. Served by the host server and
  exposure-gated by HostExposurePolicy (webUiEnabled).
subsystem: sdd_host
componentType: Portal
