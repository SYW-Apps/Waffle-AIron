id: git_orchestrator
name: Git Orchestrator
description: >-
  Owns the git-backing workflows: enable (clone the remote and set up the isolated working branch),
  disable, sync (fetch + integrate the default branch into the working branch), and publish (commit
  the promoted working tree, push the working branch, and produce the compare URL). Each read/write
  of git state goes through the config registry and the git adapter; sync and publish no-op when the
  project is not git-backed.
subsystem: sdd_git
componentType: Orchestrator
owns: []
dependsOn:
  - git_adapter
  - git_config_registry
status: complete
