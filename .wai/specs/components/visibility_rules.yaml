id: visibility_rules
name: Visibility Rules
description: >-
  Pure surface-visibility resolution over the organization graph (no I/O, no authorization side
  effects — the visibility sibling of permission_rules): given the unit tree (with visibility
  postures and exposeTo grants) and the project placements, computes which projects' public surfaces
  an observer project may discover and at what audience distance. Semantics: within a tenant subtree
  open-unless-closed; a closed unit hides its subtree placements from everyone outside it except
  units granted via exposeTo; tenant roots are always closed toward other tenant roots (cross-tenant
  visibility ONLY via exposeTo — fail-closed); no deny-lists.
subsystem: sdd_host
componentType: Orchestrator
