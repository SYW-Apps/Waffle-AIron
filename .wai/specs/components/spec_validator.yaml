id: spec_validator
name: Spec Validator
description: >-
  The owner's gate (stage 4). It gathers one project's own inputs — its spec tree and the export
  tables of the members it contains, its foreign surface snapshots, its pinned externals, the
  source-code model, the writer's round-trip results and the project's pack selections — into one
  rule context; seeds the rule set with the built-in and pack rules; runs the rule sequence over
  that context; and returns the findings. It never walks above the bound root and discovers nothing,
  so a project's verdict is the same from every root. It also gathers the inputs of the gate
  identity a lock records (the content identity, the governing extensions and gate config, the
  consumed contract inputs and the built-in rules) and has the gate identity computed from them. Its
  write-gate half runs only the spec-scoped rules against a component candidate before the component
  is saved. It holds no state of its own: the rule set belongs to the rule Repository, and each
  rule's verdict to its rule family. The family run that composes projects is family_validator's,
  which calls this gate once per project.
subsystem: sdd_validator
componentType: Orchestrator
owns: []
dependsOn:
  - validator_core_adapter
  - validator_surfaces_adapter
  - source_analysis_adapter
  - binding_module_adapter
  - rule_repository
  - gate_identity
  - reach_model_projector
