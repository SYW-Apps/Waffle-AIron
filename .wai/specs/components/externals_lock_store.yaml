id: externals_lock_store
name: Externals Lock Store
description: >-
  Authoritative state for the project's pinned externals: the lock (.wai/externals.lock.yaml) and
  the snapshots it names (.wai/externals/<alias>.yaml) — one aggregate, as a lockfile and the
  contracts it digests are one. Read-through: every read is the file read through the surface file
  adapter, nothing is held in memory, so there is nothing to hydrate. Kept apart from the Surface
  Store, whose .wai/surfaces snapshots are a separate aggregate that stage 3 retires.
subsystem: sdd_surfaces
componentType: Store
owns: []
dependsOn:
  - surface_fs_adapter
durability: read-through
status: design
createdAt: '2026-09-26T17:47:45.022Z'
updatedAt: '2026-09-26T17:47:45.034Z'
