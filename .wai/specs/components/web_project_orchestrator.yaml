id: web_project_orchestrator
name: Web Project Orchestrator
description: >-
  Server-side project-lifecycle workflows for the web UI on the PUBLIC data plane. Bridges project
  create/lock/destroy to the owning orchestrators passing the ws_ session AS the credential — those
  methods authorize through the permission rules, so a signed-in human manages exactly the projects
  their permissions allow. create routes through the PROJECT POLICY orchestrator profile-aware
  initialization (the same body the MCP init uses), so a web create honors the instance pack policy
  and can carry a profile selection. lock routes through the PROJECT LIFECYCLE orchestrator, the
  decision the MCP lock tool makes: approval:decide locks directly, a writer creates a pending
  approval request. list is owned here because the admin orchestrator list is master-only: it
  resolves the session to a Principal, computes the caller project:read visible scopes over the
  organization tree, and returns the project records within that scope.
subsystem: sdd_host
componentType: Orchestrator
owns: []
dependsOn:
  - admin_orchestrator
  - project_policy_orchestrator
  - authentication
  - authorization
  - project_repository
  - organization_repository
  - project_lifecycle_orchestrator
status: complete
