id: spec_loader
name: Spec Loader
description: >-
  The spec repository — authoritative state boundary of the product. A pure facade over its owned
  faces: loads forward 1:1 to the Spec Index, export tables and reference usage forward 1:1 to the
  Export Index, the project graph forwards 1:1 to the Project Family Index, saves and the round-trip
  dry run forward 1:1 to the Spec Registry, and all file I/O lives in the Spec File Store. Consumers
  depend on this facade only.
subsystem: sdd_core
componentType: Repository
owns:
  - spec_file_store
  - spec_registry
  - spec_index
  - export_index
  - project_family_index
dependsOn: []
lint:
  allow: []
status: complete
