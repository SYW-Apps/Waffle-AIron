id: integrity_rules
name: Integrity Rules
description: >-
  Judges whether the spec tree holds together: every reference resolves (hierarchy, type references,
  published surfaces), ids stay resolvable in the namespace grammar, every spec re-serializes
  through the writer (judged from the round-trip dry-run results the validator gathers), and every
  lint allow names a known code and actually suppresses a finding (run last, after every other rule,
  pack rules included). Specialist by last resort: its verdicts are not type methods, because the
  rule set is open (packs register rules at runtime) and most verdicts read many specs; it holds no
  state (the rule set belongs to the rule Repository), does no I/O and runs no workflow, which is
  the arbiter shape.
subsystem: sdd_validator
componentType: Specialist
owns: []
dependsOn: []
variant: arbiter
