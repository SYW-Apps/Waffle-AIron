id: spec_file_store
name: Spec File Store
description: >-
  Durable YAML file state of the spec tree — the single file-I/O face of the spec repository. Reads
  and writes go straight through to disk (read-through: the workspace's index cache is an evictable
  convenience, never the source of truth). The specs folder it addresses is fixed when a project
  root is bound, resolved once from the project configuration's `paths.specsDir` (default
  `.wai/specs`); the store itself never reads `project.yaml`.
subsystem: sdd_core
componentType: Store
owns: []
dependsOn: []
durability: read-through
status: complete
