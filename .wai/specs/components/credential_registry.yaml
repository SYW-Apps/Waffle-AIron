id: credential_registry
name: Credential Registry
description: >-
  Facade for durable hosted credential (API-key) storage — promoted to a real Repository under the
  option F registry-taxonomy ruling. Hashed tokens only, never plaintext. Reads go to the credential
  index (token-hash lookup, scoped listings), writes to the credential write registry (create,
  revoke, per-owner bulk revoke), both over the read-through credential store.
subsystem: sdd_host
componentType: Repository
owns:
  - credential_store
  - credential_write_registry
  - credential_index
dependsOn: []
status: complete
