id: credential_registry
name: Credential Registry
description: >-
  I/O manager for MCP/API credential records under the data root. Persists the hashed bearer token
  with its role and authorized project set (the compatibility projection) and supports
  create/read/revoke, backing both data-plane token verification and control-plane token lifecycle.
  Records MAY also carry owner-subject, precise-grant, label, expiry, and revocation metadata,
  populated by the identity mint flow; legacy admin-minted keys carry only role and projects.
  Modeled as the existing file-backed Registry to preserve current credential behavior.
subsystem: sdd_host
componentType: Registry
