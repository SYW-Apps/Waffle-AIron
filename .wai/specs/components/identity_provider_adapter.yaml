id: identity_provider_adapter
name: Identity Provider Adapter
description: >-
  Draft external I/O adapter for OIDC/SSO providers such as Authentik, Keycloak, Google Workspace,
  and Entra ID. It performs discovery, authorization-code exchange, and token/userinfo verification
  behind a provider-neutral contract while never storing raw client secrets itself.
