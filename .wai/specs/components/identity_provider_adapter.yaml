id: identity_provider_adapter
name: Identity Provider Adapter
description: >-
  External I/O adapter for OIDC/SSO providers (authentik, Keycloak, Google Workspace, Entra ID and
  any other OIDC provider, all handled as plain OIDC). It performs discovery, authorization-code
  exchange, and token/userinfo verification behind a provider-neutral contract while never storing
  raw client secrets itself.
subsystem: sdd_host
componentType: Adapter
owns: []
dependsOn:
  - secret_repository
  - http_client_adapter
status: complete
