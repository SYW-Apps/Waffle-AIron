id: project_config_fs_adapter
name: Project Config FS Adapter
description: >-
  File I/O for a project's configuration document, `.wai/project.yaml` at the bound project root:
  reads the raw document or its text, and writes a document as an edit of the file's YAML node tree,
  so the comments people keep there (the debt register's carried-group notes among them), key order
  and unknown keys survive every write. It applies no schema and no defaults — the schema belongs to
  the store.
subsystem: sdd_core
componentType: Adapter
