id: web_admin_orchestrator
name: Web Admin Orchestrator
description: >-
  Server-side control-bridge for the unified web UI on the PUBLIC data plane. It is a switchboard
  and nothing else: every method hands the browser ws_ session to the control-plane orchestrator
  that owns the capability, so that orchestrator's scope authorization and auditing apply unchanged.
  ADMIN capabilities (user and identity-provider/SSO management) forward to the identity
  orchestrator; roles and permission assignments to the permission admin orchestrator. It ALSO
  carries user-scoped SELF-SERVICE: minting a single-project MCP token for an AI agent via the
  identity orchestrator (mintSelfToken authorizes strictly against the caller's own project access).
  Web-UI login (human, session/SSO) and MCP tokens (agent, one project) are deliberately separate
  concerns — no mixing. The instance-structure workflows this bridge once owned — organization
  units, project placements, the secret key names — moved to the web instance admin orchestrator, so
  nothing here authorizes, mutates or audits on its own.
subsystem: sdd_host
componentType: Orchestrator
owns: []
dependsOn:
  - identity_orchestrator
  - permission_admin_orchestrator
lint:
