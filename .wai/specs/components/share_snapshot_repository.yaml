id: share_snapshot_repository
name: Share Snapshot Repository
description: >-
  Facade over the owned share-snapshot store, registry, and index for the immutable captured
  payloads a share link serves. Pure 1:1 forwarding — writes to the registry, reads to the index;
  consumers use this facade only, never the inner blocks.
subsystem: sdd_host
componentType: Repository
owns:
