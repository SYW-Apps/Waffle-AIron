id: cli_runner
name: CLI Runner
description: Coordinates terminal subcommand actions and flags, mapping CLI input to core engine execution.
subsystem: sdd_cli
componentType: Orchestrator
owns: []
dependsOn:
  - cli_core_adapter
  - cli_validator_adapter
  - cli_lock_adapter
  - cli_host_adapter
  - cli_producer_adapter
  - cli_packs_adapter
  - cli_skills_adapter
  - cli_rules_adapter
  - cli_patterns_adapter
  - cli_variants_adapter
  - cli_surfaces_client_adapter
  - remote_orchestrator
  - cli_mcp_adapter
lint:
  allow:
    - code: GOD_COMPONENT
      reason: >-
        The runner IS the terminal dispatch hub by design: every dependency is a thin per-concern
        CLI adapter (one per subsystem/command family) with no domain logic of its own. Splitting
        the dispatcher or hiding adapters behind a synthetic facade would add a hop without
        separating any real responsibility.
    - code: EXCESSIVE_DEPENDENCIES
      reason: >-
        Same deliberate hub shape as the GOD_COMPONENT allow: 11 thin command adapters fanned out
        from the one CLI entry orchestrator.
    - code: INCOHESIVE_METHODS
      reason: >-
        This is a deliberate facade and keeps this allow permanently: it is the terminal dispatch
        hub whose dependencies are thin per-concern adapters, so splitting would add a hop without
        separating a responsibility.
status: complete
createdAt: '2026-06-10T19:28:00.000Z'
updatedAt: '2026-09-17T17:53:17.960Z'
