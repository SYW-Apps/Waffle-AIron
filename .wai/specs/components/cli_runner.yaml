id: cli_runner
name: CLI Runner
description: Coordinates terminal subcommand actions and flags, mapping CLI input to core engine execution.
subsystem: sdd_cli
componentType: Orchestrator
owns: []
dependsOn:
  - cli_core_adapter
  - cli_validator_adapter
  - cli_lock_adapter
  - cli_host_adapter
  - cli_producer_adapter
  - cli_packs_adapter
  - cli_skills_adapter
  - cli_rules_adapter
  - cli_patterns_adapter
  - cli_variants_adapter
  - cli_surfaces_client_adapter
  - remote_orchestrator
  - cli_mcp_adapter
  - user_config_store
lint:
  allow:
    - code: GOD_COMPONENT
      reason: >-
        The runner IS the terminal dispatch hub by design: almost every dependency is a thin
        per-concern CLI adapter, one per subsystem or command family, with no domain logic of its
        own. The two that are not — `remote_orchestrator` and `user_config_store` — are sdd_cli's
        own workflow and its own held state, which belong to this subsystem rather than behind an
        adapter onto another. Splitting the dispatcher, or hiding adapters behind a synthetic
        facade, would add a hop without separating any real responsibility.
    - code: EXCESSIVE_DEPENDENCIES
      reason: >-
        Same deliberate hub shape as the GOD_COMPONENT allow: fourteen dependencies fanned out from
        the one CLI entry orchestrator, of which twelve are thin command adapters and two are
        sdd_cli's own workflow and held state. The count tracks how many command families the
        terminal exposes, not how much this component knows.
    - code: INCOHESIVE_METHODS
      reason: >-
        NOT the pure forwarder the rule now exempts, and this allow does not claim to be one: most
        of the runner's narrated methods hold flow of their own — flag branching, argument shaping,
        output formatting — so only a minority are single hand-offs. The allow stands on different
        ground, and stands permanently: the runner IS the terminal's one entry point, and its
        dependencies are thin per-concern command adapters. Splitting it along the call groups would
        mint one dispatcher per command family and separate no responsibility.
status: complete
createdAt: '2026-06-10T19:28:00.000Z'
updatedAt: '2026-09-22T21:19:43.271Z'
