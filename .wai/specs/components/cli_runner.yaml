id: cli_runner
name: CLI Runner
description: >-
  The terminal's workflows: one method per command (or per command group served by one workflow),
  each reached from a cli_portal endpoint, mapping the parsed command onto the core engine through
  per-concern command adapters — plus the startup cleanup the binary runs before it parses argv.
subsystem: sdd_cli
componentType: Orchestrator
owns: []
dependsOn:
  - cli_core_adapter
  - cli_validator_adapter
  - cli_lock_adapter
  - cli_host_adapter
  - cli_producer_adapter
  - cli_packs_adapter
  - cli_skills_adapter
  - cli_rules_adapter
  - cli_patterns_adapter
  - cli_variants_adapter
  - cli_surfaces_client_adapter
  - remote_orchestrator
  - verdict_changes
  - cli_mcp_adapter
  - user_config_store
  - cli_migration_adapter
lint:
  allow:
    - code: GOD_COMPONENT
      reason: >-
        The runner is the terminal's workflow layer behind the one CLI portal, by design: almost
        every dependency is a thin per-concern CLI adapter, one per subsystem or command family,
        with no domain logic of its own. The three that are not — `remote_orchestrator`,
        `verdict_changes` and `user_config_store` — are sdd_cli's own workflows and its own held
        state, which belong to this subsystem rather than behind an adapter onto another (the
        chaining migration moved to sdd_migrations in stage 6 and is reached through
        `cli_migration_adapter`). Splitting the workflows by command family, or hiding adapters
        behind a synthetic facade, would add a hop without separating any real responsibility.
    - code: EXCESSIVE_DEPENDENCIES
      reason: >-
        Same deliberate shape as the GOD_COMPONENT allow: sixteen dependencies fanned out from the
        one workflow layer cli_portal dispatches to, of which thirteen are thin command adapters and
        three are sdd_cli's own workflows and held state. The count tracks how many command families
        and subsystem hops the terminal exposes, not how much this component knows.
    - code: INCOHESIVE_METHODS
      reason: >-
        NOT the pure forwarder the rule now exempts, and this allow does not claim to be one: most
        of the runner's narrated methods hold flow of their own — flag branching, argument shaping,
        output formatting — so only a minority are single hand-offs. The allow stands on different
        ground, and stands permanently: the runner is the one workflow layer behind the terminal's
        one portal, and its dependencies are thin per-concern command adapters. Splitting it along
        the call groups would mint one workflow component per command family and separate no
        responsibility.
status: complete
