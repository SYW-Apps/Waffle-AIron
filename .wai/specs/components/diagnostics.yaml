id: diagnostics
name: Diagnostics
description: >-
  Pure logic that derives redacted operational diagnostics and usage snapshots from inputs supplied
  by the operations orchestrator — hosted project records, the two server-global pack-tier name
  listings (image and instance), and per-project pack/profile references — and assembles an
  aggregated instance health report. It performs no I/O of its own and owns no state; it reasons
  only over the values passed to it.
