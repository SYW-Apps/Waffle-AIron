id: agent_context_portal
name: Agent Context Portal
description: >-
  Published agent context of sdd_core: the agent topology the spec tree derives and the live brief
  for one agent, the agent files it generates and where they go, the domains and domain detection,
  the execution profile and budget a delegation runs under, and the context documents wairon writes
  for AI tools — the guides, the version stamp and the synced context files. In-process today:
  realized by src/core/index.ts alongside core's other portals.
subsystem: sdd_core
componentType: Portal
owns: []
dependsOn:
  - agent_file_generator
  - agent_resolver
  - ai_tool_guide
  - budget_policy
  - context_composer
  - domain_curator
  - domain_detector
  - domain_projector
  - execution_profiler
  - version_stamp
transport: InProcess
invokedBy:
  kind: entry
  caller: >-
    Tools and scripts that import the @wairon/cli package's library entry (main dist/index.js, which
    re-exports the core barrel) and resolve the agent topology, briefs, generated agent files and
    context documents in their own process
status: complete
