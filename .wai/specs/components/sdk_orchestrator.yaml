id: sdk_orchestrator
name: SDK Orchestrator
description: >-
  Owns the pack-authoring/archive workflows AND the spec-tree archive workflows, delegating format
  decisions to the codecs, template rendering to the scaffold specialist, and all I/O to the archive
  adapter (holds no state of its own). scaffoldPack: ask the scaffold specialist for the file map,
  then write it to the target directory via the adapter. buildPack: read the source pack directory,
  derive/validate the envelope and verify it matches the inner pack manifest (pack codec), then
  assemble the files + envelope into archive bytes via the adapter. inspectArchive: enumerate
  entries via the adapter, read + version-check the envelope (pack codec), and return a descriptor
  without extracting. extractPack: enumerate entries via the adapter, compute a safe extraction plan
  under the caller's limit profile (pack codec, rejecting unsafe/oversized archives), inflate the
  approved entries and write the tree under the destination via the adapter. buildTreeArchive /
  inspectTreeArchive / extractTreeArchive are the same three shapes for a project's SPEC TREE,
  routed through the tree codec instead: build reads each supplied root's .wai directory and
  prefixes its files with that root's project-relative path so a chained-subproject layout survives
  the move; extract optionally applies the portable-path guard, which every over-the-wire surface
  sets. Root discovery stays with the caller — the SDK never walks a spec tree, it only archives the
  roots it is handed. Stateless transforms — the SDK persists nothing.
subsystem: sdd_sdk
componentType: Orchestrator
owns: []
dependsOn:
  - pack_codec
  - pack_scaffold_specialist
  - pack_archive_adapter
  - tree_codec
