id: openapi_codec
name: OpenAPI Codec
description: >-
  Bidirectional codec between surface snapshots and OpenAPI 3.1 documents: exports the
  HTTP-transport entries of a snapshot as an OpenAPI spec (types rendered as JSON-Schema
  components), and imports a 3rd-party OpenAPI document into an authored-origin snapshot.
subsystem: sdd_surfaces
componentType: Specialist
owns: []
dependsOn: []
lint:
  allow:
    - code: UNUSED_METHOD
      reason: >-
        toOpenApi is retained as the single-document codec entry point consumed by sdd_host
        share/download portals (a sibling subsystem, out of sdd_surfaces scope). Within this
        subsystem the orchestrator now renders via the per-portal toOpenApiSet; toOpenApi stays live
        through its cross-subsystem callers.
status: complete
