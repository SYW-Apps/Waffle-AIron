id: cli_host_adapter
name: CLI Host Client Adapter
description: >-
  Local client adapter crossing the subsystem boundary to sdd_host's in-process administration
  portal (local_admin_portal): lets the wairon CLI administer an instance in-process — project/key
  lifecycle, producers, secrets, git backing, packs, permission assignments, the state-scoped lock,
  and the boot-time writes of `wairon serve` and `wairon dev` — as a thin identity re-export of that
  portal in a module of its own. The credential is passed through from the caller; the host's
  workflows authorize it.
subsystem: sdd_cli
componentType: Adapter
owns: []
dependsOn:
  - local_admin_portal
status: complete
