id: chaining_migration_orchestrator
name: Chaining Migration Orchestrator
description: >-
  The chaining migration of one project family, plan first — the fourth verb family of
  sdd_migrations (verb `chaining`), run by `doctor --fix` and `doctor --report chaining` through
  migration_portal. It plans from what the project graph, the scan's reference bindings and export
  usage already report — the ids to declare, the L0 entries producers lack (re-exports, own `{
  typeDef }` entries for project-level types, and a minimal L0 where a producer has none), the
  externals consumers must declare, the stage-1 family pins to convert and delete — and hands the
  retirement of position (mounts into `members`, reference rewrites, and stage 4's positional
  imports and self-prefix rewrites) to the position migration, merging its plan: a positional
  import's export joins the producer's exports and its undeclared producer becomes a planned
  external. It writes a confirmed plan in a fixed order: ids, then exports, then externals, then the
  position migration (imports, moves, rewrites, pin deletions), and pins LAST, so every snapshot and
  every lock's `used` map is taken from the final spelling — into the roots it is handed, which
  since stage 6 are a rehearsal's: the family transaction then swaps the whole result in or nothing,
  where before a failure mid-apply left a half-migrated family that only idempotence could finish.
  Config writes go through the core's registry intents, new spec content through the gated authoring
  seam, restatements through the core's maintenance intents, pins through the surfaces plane; it
  binds each project's root to write it and restores the caller's binding on every path. It is
  idempotent (an applied plan re-plans empty) and never locks. It holds no state: the plan is a
  value its caller holds between plan and write. It moved from sdd_cli in stage 6 because it is a
  family migration and only sdd_migrations composes the same three planes behind the transaction.
  The caller must gate on reach itself.
