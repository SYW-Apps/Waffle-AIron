id: chaining_migration_orchestrator
name: Chaining Migration Orchestrator
description: >-
  The stage-2c chaining migration of one project family, plan first. It plans from what the project
  graph and export usage already report — the ids to declare, the L0 re-export entries producers
  lack, the externals consumers must declare, the stage-1 family pins to convert — and applies a
  confirmed plan in a fixed order: ids, then exports, then externals, then pins. Config writes go
  through the core's registry intents, spec writes through the gated authoring seam, pins through
  the surfaces plane; it binds each project's root to write it and restores the caller's binding on
  every path. It holds no state: the plan is a value its caller holds between plan and apply. It
  lives in sdd_cli, not sdd_core, because it composes three planes and only a layer above all three
  can: sdd_authoring already depends on sdd_core, and sdd_validator (which sdd_authoring depends on)
  depends on sdd_surfaces, so a core or surfaces workflow calling the gated seam would close a
  cycle. The caller must gate on reach itself.
subsystem: sdd_cli
componentType: Orchestrator
owns: []
dependsOn:
  - cli_core_adapter
  - cli_authoring_adapter
  - cli_surfaces_client_adapter
status: design
