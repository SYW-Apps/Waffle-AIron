id: narrative_rules
name: Narrative Rules
description: >-
  Judges whether contracts and narratives agree and are sound: implementations mirror their
  contracts, call steps resolve and are declared, guarantee tokens are known and backed, flow steps
  are well-formed and reachable, narratives avoid provable antipatterns, and narrative detail
  matches the realized code's complexity. Specialist by last resort: its verdicts are not type
  methods, because the rule set is open (packs register rules at runtime) and most verdicts read
  many specs; it holds no state (the rule set belongs to the rule Repository), does no I/O and runs
  no workflow, which is the arbiter shape.
subsystem: sdd_validator
componentType: Specialist
owns: []
dependsOn: []
variant: arbiter
