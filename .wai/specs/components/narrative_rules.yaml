id: narrative_rules
name: Narrative Rules
description: >-
  Judges whether contracts and narratives agree and are sound: implementations mirror their
  contracts, call steps resolve and are declared, guarantee tokens are known and backed, flow steps
  are well-formed and reachable, narratives avoid provable antipatterns, and narrative detail
  matches the realized code's complexity. Pure logic (dependencyClass: pure, the arbiter variant):
  it holds no state (the rule set belongs to the rule Repository), does no I/O and runs no workflow.
  Its verdicts are not type methods, because the rule set is open (packs register rules at runtime)
  and most verdicts read many specs.
subsystem: sdd_validator
componentType: Orchestrator
owns: []
dependsOn: []
dependencyClass: pure
variant: arbiter
