id: admin_ui_orchestrator
name: Admin UI Orchestrator
description: >-
  Draft workflow owner for browser-based hosted administration: SSO sign-in, session resolution,
  landing-page data composition, and dispatch to identity, policy, landscape, and audit workflows.
  It reads identity provider configuration through the policy repository and keeps UI/session
  concerns out of the existing completed admin API.
