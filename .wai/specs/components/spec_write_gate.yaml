id: spec_write_gate
name: Spec Write Gate
description: >-
  The write boundary for spec authoring: one place that decides what may be written and then writes
  it, shared by every access path. wairon is one backend behind several doors — the CLI, the stdio
  MCP server, the hosted web interface and the hosted MCP — and which door a caller came through
  decides authentication and transport, never what a spec may contain. So the rule lives here, above
  the store and above the rule engine, where every door reuses it, and it is injected into the
  store's delta update as a hook rather than called from inside it, because the rule engine already
  reads the store and a store that reached back would close the cycle. Mechanical writes stay
  outside this gate by construction — status promotion at lock, layout normalization, migrations and
  doctor repairs call the store directly — which is what keeps a spec authored before a rule existed
  loadable and repairable.
subsystem: sdd_core
componentType: Orchestrator
