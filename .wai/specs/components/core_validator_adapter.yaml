id: core_validator_adapter
name: Core Validator Client Adapter
description: >-
  Local client adapter in sdd_core to cross the subsystem boundary to sdd_validator: runs the
  component candidate gate through the validator portal before a component spec reaches disk. It
  exists because the write gate sits above the rule engine while the rule engine reads the spec
  store below it — the seam has to be named for the hop to be legal in either direction.
subsystem: sdd_core
componentType: Adapter
owns: []
dependsOn:
  - validator_portal
status: complete
