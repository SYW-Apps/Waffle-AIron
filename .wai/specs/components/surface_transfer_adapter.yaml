id: surface_transfer_adapter
name: Surface Transfer Adapter
description: >-
  File I/O for surface exchange with OTHER locations: writes generated snapshots into chained child
  project directories (.wai/surfaces/ of the child) and rendered exports to output paths, and reads
  foreign documents (native snapshots or OpenAPI) on import. Distinct from the repository's fs
  adapter, which owns only this project's own aggregate.
subsystem: sdd_surfaces
componentType: Adapter
owns: []
dependsOn:
  - files_adapter
