id: git_backing_orchestrator
name: Git Backing Orchestrator
description: >-
  Owns the container-level backup workflows, distinct from the per-project real-repo binding:
  bind/unbind a unit's container repo or the instance-structure backup repo (project:admin over the
  unit, or instance-level project:admin for the instance binding and listings), and run a sync —
  mirror-export every subtree project's .wai/ tree (unit binding) or the instance-structure JSON
  collections excluding the secret store (instance binding) into the backing repo's working copy,
  then commit+push skip-if-clean through the git backing adapter. Since stage 7 a member is a record
  with no placement of its own (its units come through its family root), so a unit's subtree is
  every family root placed in it PLUS every member record of those families, each mirrored as
  projects/<its own id>/.wai/ from its own root — before stage 7 a member's .wai/ lay inside its
  parent's tree but outside the parent's .wai/ and was never mirrored. The mirror working copy is
  wairon's alone, which is why its commit may stage it wholesale; no project's repository is ever
  staged that way. Also exposes the pre-authorized periodic sweep the host supervisor's timer
  drives. Writes are audited at security level (bind/unbind) or info level (sync).
subsystem: sdd_host
componentType: Orchestrator
owns: []
dependsOn:
  - authentication
  - authorization
  - git_backing_repository
  - git_backing_adapter
  - organization_repository
  - project_repository
  - audit_repository
lint:
  allow: []
