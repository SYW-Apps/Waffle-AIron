id: mcp_server
name: MCP Server Manager
description: >-
  Assembles an MCP server for the bound project: composes the server instructions, instantiates the
  server, registers its tools, prompts and skill resources, and announces a chained subproject's
  parent on startup. It builds a new server on every call (the stdio command and the hosted
  per-request server both use it) and supervises nothing.
subsystem: sdd_mcp
componentType: Orchestrator
owns: []
dependsOn:
  - mcp_core_adapter
  - mcp_validator_adapter
  - mcp_skills_adapter
lint:
  allow:
    - code: COMPONENT_IS_ITS_ONLY_METHOD
      reason: D2b either folds this component into its caller or names it for its responsibility.
    - code: GENERIC_COMPONENT_NAME
      reason: D2b renames this component; 'Manager' in its name says nothing about what it does.
status: complete
createdAt: '2026-06-10T19:28:00.000Z'
updatedAt: '2026-09-17T17:53:09.358Z'
