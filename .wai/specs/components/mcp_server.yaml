id: mcp_server
name: MCP Server
description: >-
  Assembles an MCP server for the bound project: composes the server instructions, instantiates the
  server, registers its tools, prompts and skill resources, and announces a chained subproject's
  parent on startup. It builds a new server on every call (the stdio command and the hosted
  per-request server both use it) and supervises nothing. It also judges whether the server still
  runs the build on disk: every tool call passes the build-freshness guard, which refuses a spec
  write when the running server's spec and tool schemas differ from the rebuilt ones on disk, and
  warns on everything else a stale server answers.
subsystem: sdd_mcp
componentType: Orchestrator
owns: []
dependsOn:
  - mcp_core_adapter
  - mcp_validator_adapter
  - mcp_skills_adapter
  - mcp_build_adapter
lint:
  allow: []
status: complete
