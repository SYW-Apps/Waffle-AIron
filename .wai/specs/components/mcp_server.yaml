id: mcp_server
name: MCP Server Manager
description: >-
  Owns the live MCP server process: composes the server `instructions` returned on the initialize
  handshake (so a connecting agent is TAUGHT the SDD model before it authors anything, rather than
  depending on a human having briefed it), constructs the tool registry (sdd_*
  authoring/validation/status tools, topology tools, and — when hosted — the advertised data-plane
  tool descriptors), publishes the skill set through BOTH surfaces (read-only resources for
  programmatic pulls, and prompts so a client can offer each skill as a slash command or attachable
  context — mirrored from one descriptor list so the two can never drift), binds the stdio
  transport, and supervises the session lifecycle. Carries the BUILD-FRESHNESS GUARD: the server
  stamps its own entry file at startup and, once the build on disk changes (rebuild/update), appends
  a loud stale-server warning to every tool result until the session restarts — a long-running
  process keeps its startup-time schemas, and writes through a stale process silently strip fields
  introduced by newer schemas.
subsystem: sdd_mcp
componentType: Supervisor
owns: []
dependsOn:
  - mcp_core_adapter
  - mcp_validator_adapter
  - mcp_skills_adapter
status: complete
