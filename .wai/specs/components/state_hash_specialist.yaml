id: state_hash_specialist
name: State Hash Specialist
description: >-
  Computes the deterministic content hash (StateId) of the spec tree: loads every spec via the
  loader, canonicalizes it (stable key ordering, normalized serialization), and digests it. Pure and
  side-effect-free — identical spec content always yields the same StateId, so any edit after a lock
  invalidates that lock automatically.
subsystem: sdd_core
componentType: Specialist
owns: []
dependsOn:
  - spec_loader
variant: projector
status: complete
