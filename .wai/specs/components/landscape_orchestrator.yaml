id: landscape_orchestrator
name: Landscape Orchestrator
description: >-
  Owns hosted-instance landscape workflows: organization-unit administration, project placement,
  public-surface snapshot refresh, cross-project relation management, and landscape graph
  generation, plus the two data-plane MCP discovery workflows
  (sdd_landscape_list_reachable_projects, sdd_landscape_list_reachable_project_interfaces) that the
  host_request_orchestrator dispatches to it with the bound project as the current project. It
  authenticates credentials through the single auth authority, authorizes by Principal grants
  (landscape:manage or instance-admin for writes; landscape:read or higher for control-plane reads),
  reads a target project's specs only to produce its redacted public-surface snapshot and otherwise
  consumes only stored redacted snapshots, and records audit events for landscape changes.
subsystem: sdd_host
componentType: Orchestrator
owns: []
dependsOn:
  - auth_specialist
  - organization_repository
  - project_registry
  - project_relation_repository
  - public_surface_repository
  - landscape_diagram_specialist
  - audit_repository
  - host_core_adapter
  - scope_specialist
lint:
  allow: []
