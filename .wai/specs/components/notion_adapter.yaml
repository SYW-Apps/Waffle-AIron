id: notion_adapter
name: Notion Client Adapter
description: >-
  The only block doing Notion I/O: idempotently mirrors a DocPage tree into a "wairon specs"
  subsection under a parent page via the Notion REST API (find-or-create the subsection, refresh its
  children, never touching sibling content). Authenticates with WAIRON_NOTION_TOKEN.
