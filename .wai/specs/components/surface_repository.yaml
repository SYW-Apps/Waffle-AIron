id: surface_repository
name: Surface Repository
description: >-
  Facade over the contracts this project has taken in from other projects: the stored surface
  snapshots (.wai/surfaces/ — imported exchanged/authored surfaces and received parent-generated
  snapshots) and the pinned externals (the lock and its snapshots under .wai/externals/). Consumers
  use the facade only.
subsystem: sdd_surfaces
componentType: Repository
owns:
  - surface_store
  - surface_registry
  - surface_index
  - surface_fs_adapter
  - externals_lock_store
dependsOn: []
status: complete
