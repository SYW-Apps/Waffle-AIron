id: project_ops_orchestrator
name: Project Ops Orchestrator
description: >-
  The single operational seam that surfaces the control-plane project/instance operations to BOTH
  the web portal (browser session as the credential) and the MCP data plane (bearer token as the
  credential): declarative packs (global + per-project), pack/profile policy (read/replace,
  per-project evaluate/reconcile), producer targets (configure/list/remove/run), per-project git
  backing (bind/unbind/sync/commit/status/sync-cadence), the scoped audit viewer, and the instance
  exposure policy. Every method is a pure 1:1 forward passing the caller's credential to the OWNING
  orchestrator, which authenticates and authorizes through the permission rules — no authorization
  logic and no state lives here, so the two portals stay lean and the gates stay single-sourced.
subsystem: sdd_host
componentType: Orchestrator
owns: []
dependsOn:
  - pack_orchestrator
  - project_policy_orchestrator
  - admin_orchestrator
  - identity_orchestrator
  - exposure_policy_orchestrator
  - git_backing_orchestrator
lint:
  allow:
    - code: REMOVABLE_FORWARDER
      reason: >-
        Deliberate seam: the one list of control-plane project operations that BOTH entry paths
        expose, the web portal (browser session) and the MCP data plane through
        host_request_orchestrator (bearer token). One Orchestrator keeps the two surfaces identical
        and both callers lean; the owning orchestrators still authorize every call, and
        per-entry-path translation goes here when it is needed.
status: complete
createdAt: '2026-07-16T15:29:55.392Z'
updatedAt: '2026-10-16T17:24:46.477Z'
