id: validation_memo_cache
name: Validation Memo Cache
description: >-
  The last owner's-gate results per project root, one entry per run options, each with the
  fingerprints of the files it read. Evictable and loss-safe: a lost entry costs one validation run,
  never a wrong answer, because a reader compares both fingerprints before trusting it. Held in the
  process only (a long-running server: the dev server, the hosted server, an MCP session).
subsystem: sdd_validator
componentType: Store
owns: []
dependsOn: []
durability: cache
lint:
  allow:
    - code: UNOWNED_STORE
      reason: >-
        Simple keyed state: one entry per project root and options, replaced whole, read only by its
        key; its one writer and reader is the workflow validation_memo. No lookup beyond the key
        needs a Registry or Index.
status: complete
createdAt: '2026-11-07T15:06:15.144Z'
updatedAt: '2026-11-07T15:06:50.044Z'
