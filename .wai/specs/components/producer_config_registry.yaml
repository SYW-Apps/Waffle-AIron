id: producer_config_registry
name: Producer Config Registry
description: >-
  The project's producer-config boundary (.wai/producers.json): per-target settings such as Notion's
  parent page id. A standalone read-through Store — the file is the persistence medium, this
  component is the state boundary; every read hits the file, so hydration is definitionally covered.
  (Previously mistyped as a file-backed Registry; retyped per the registry-taxonomy review.)
subsystem: sdd_producers
componentType: Store
owns: []
dependsOn: []
durability: read-through
lint:
  allow:
    - code: UNOWNED_STORE
      reason: >-
        Sanctioned lightweight form: a small per-project config file with read/write/clear — a full
        Repository around it would be ceremony. Consumer is workflow-layer (producer_orchestrator).
status: complete
