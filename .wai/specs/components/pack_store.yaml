id: pack_store
name: Pack Store
description: >-
  Storage for the container's extension packs — the plugin surface that adds architectural profiles,
  language/platform tables, and rules. Server-global packs are discovered from TWO tiers: the
  immutable image-layer directory (WAIRON_IMAGE_PACKS_DIR, default /opt/wairon/packs), baked into
  extended images at build time (built FROM the base image + COPY packs/) and never written at
  runtime, and the mutable instance directory (WAIRON_PACKS_DIR, defaulted onto the data volume so
  installs persist across restarts). The global pack set is their merge; on a name collision the
  INSTANCE pack wins and the shadowed image pack is surfaced as drift. Installs and removals operate
  ONLY on the mutable instance directory — the image tier is immutable. It also stores a bound
  project's vendored pack files under .wai/packs/ (committed with the project, so every clone and CI
  resolve them). It holds pack storage only and never reads or writes .wai/project.yaml: a project's
  pack registration lives in the project configuration (sdd_core's project_config_repository,
  reached through the core adapter) and is written by the calling orchestrators. Project-scoped
  probes therefore take the loaded configuration as a parameter, a project install returns the probe
  whose ref the caller registers, and a project removal only deletes the vendored files of a
  registration the caller has matched and deregistered. Installs over this surface accept
  declarative packs only (profiles + language/platform tables — pure data); programmatic rule/code
  packs are refused and must be installed via the trusted filesystem (a baked image layer, a mounted
  packs volume, or local `wairon packs add`). Listing probes each pack for its name, tier, and
  profile/language/rule counts, or its load error.
subsystem: sdd_host
componentType: Store
owns: []
dependsOn:
  - host_core_adapter
  - host_sdk_adapter
  - host_validator_adapter
durability: read-through
lint:
  allow:
    - code: UNOWNED_STORE
      reason: >-
        Option F registry-taxonomy ruling (2026-07-19): deliberate standalone Store — pack storage
        is genuinely simple held state (vendored declarative pack files under the data root),
        consumers are workflow-layer Orchestrators. durability: read-through to be declared once the
        level3 branch merges (the enum value does not exist in this branch's schema).
status: complete
