name: Bug report
description: wairon crashed, wrote something wrong, or behaved differently from its documentation.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security issue? Do not file it here - use the private "Report a vulnerability" link on the Security tab.
  - type: input
    id: version
    attributes:
      label: wairon version
      description: Output of `wairon --version` (and how you installed it - binary, npm, from source).
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and Node version
      placeholder: Windows 11, Node 20.11
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The commands or MCP tool calls, and a minimal spec tree if it matters.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Error text or command output.
      render: shell
