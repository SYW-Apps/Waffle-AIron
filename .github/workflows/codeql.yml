name: CodeQL

# Code scanning for the code wairon ships and the workflows that build it. The
# configuration (what is scanned, what is left out and why) is in
# .github/codeql/codeql-config.yml.

on:
  push:
    branches: [main, dev, beta]
  pull_request:
    branches: [main, dev, beta]
  schedule:
    # Weekly, so new queries reach code that has not changed.
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
