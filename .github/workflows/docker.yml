name: Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/syw-apps/wairon

jobs:
  publish:
    name: Build and publish GHCR image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        shell: bash
        run: |
          CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          REVISION="${GITHUB_SHA}"
          VERSION="${GITHUB_REF_NAME#v}"
          TAGS="${IMAGE_NAME}:sha-${GITHUB_SHA::12}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            TAGS="${TAGS},${IMAGE_NAME}:${VERSION}"
            if [[ "${VERSION}" =~ -preview\.[0-9]+$ ]]; then
              TAGS="${TAGS},${IMAGE_NAME}:preview"
            elif [[ "${VERSION}" =~ -beta\.[0-9]+$ ]]; then
              TAGS="${TAGS},${IMAGE_NAME}:beta"
            elif [[ "${VERSION}" =~ -dev\.[0-9]+$ ]]; then
              TAGS="${TAGS},${IMAGE_NAME}:dev"
            elif [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              TAGS="${TAGS},${IMAGE_NAME}:stable"
            else
              echo "::notice::Version '${VERSION}' matches no release channel (stable/beta/preview); publishing version + sha tags only."
            fi
          fi

          echo "created=${CREATED}" >> "$GITHUB_OUTPUT"
          echo "revision=${REVISION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ steps.meta.outputs.revision }}
            CREATED=${{ steps.meta.outputs.created }}
