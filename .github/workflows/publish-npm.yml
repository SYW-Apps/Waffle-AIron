name: Publish to npm

# Reusable workflow: publishes the package in this repo to the public npm
# registry WITH provenance (a Sigstore attestation tying the tarball to this
# exact commit + CI run). Called by release.yml on version tags, and only by
# it: npm accepts a publish only from the workflow registered as the trusted
# publisher (release.yml). To retry a failed publish, re-run the release run.
#
# Versioning: git tags are the source of truth. The published version is taken
# from the tag and written into package.json at build time in the CI checkout
# only — it is NEVER committed, so publishing cannot re-trigger a release.
#
#   tag vX.Y.Z            -> version X.Y.Z,           dist-tag `latest`
#   tag vX.Y.Z-beta.N     -> version X.Y.Z-beta.N,    dist-tag `beta`
#   tag vX.Y.Z-preview.N  -> version X.Y.Z-preview.N, dist-tag `preview`
#   tag vX.Y.Z-dev.N      -> version X.Y.Z-dev.N,     dist-tag `dev`
#
# Requirements:
#   - npm trusted publishing: @wairon/cli names this repository and release.yml
#     as its trusted publisher (npmjs.com, package Settings). The publish
#     authenticates with a short-lived OIDC credential (npm 11.5.1+); no token is
#     stored, and the package requires 2FA and disallows tokens.
#   - A trusted publisher cannot create a package: a NEW package's first publish
#     is done once by hand.
#   - The GitHub repository must be PUBLIC (provenance refuses private repos).

on:
  workflow_call:
    outputs:
      version:
        description: 'The exact version that was published (e.g. 5.1.2 or 5.1.2-dev.3)'
        value: ${{ jobs.publish.outputs.version }}

permissions:
  contents: read
  id-token: write   # REQUIRED for --provenance (OIDC to Sigstore)

jobs:
  publish:
    name: Publish (public, with provenance)
    runs-on: ubuntu-latest
    # Exposed to callers (release.yml's post-publish verify installs exactly
    # this version from the registry).
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # Trusted publishing (OIDC) needs npm 11.5.1 or later; Node 22 ships npm 10.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Resolve version and dist-tag
        id: v
        shell: bash
        run: |
          # Tag trigger: GITHUB_REF_NAME is the tag, e.g. v5.0.1-dev.2
          VER="${GITHUB_REF_NAME#v}"
          case "$VER" in
            *-dev.*)     TAG=dev ;;
            *-beta.*)    TAG=beta ;;
            *-preview.*) TAG=preview ;;
            *)           TAG=latest ;;
          esac
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "dist_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${VER} under dist-tag '${TAG}'"

      - name: Install dependencies
        run: npm ci

      # The React web app (web/) is a separate package: build it FIRST so the
      # embed step copies it to dist/webapp.html. WAIRON_REQUIRE_WEBAPP makes a
      # missing bundle fail the build instead of silently shipping the legacy UI.
      - name: Build web app
        run: npm run build:web

      - name: Build
        run: npm run build
        env:
          WAIRON_REQUIRE_WEBAPP: '1'

      - name: Package ships the web app
        shell: bash
        run: |
          npm pack --dry-run --json > pack.json
          grep -q '"dist/webapp.html"' pack.json || { echo "::error::dist/webapp.html is missing from the package"; exit 1; }
          rm -f pack.json

      # Align package.json with the release version in the CI checkout only.
      # Not committed — the tarball carries the right version, git stays clean.
      - name: Set version from tag
        run: npm pkg set version="${{ steps.v.outputs.version }}"

      - name: Publish to npm
        run: npm publish --provenance --access public --tag "${{ steps.v.outputs.dist_tag }}"
