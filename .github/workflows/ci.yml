name: CI

on:
  push:
    branches: [main, dev, beta]
  pull_request:
    branches: [main, dev, beta]

# The token reads the repository only; a job that needs more says so itself.
permissions:
  contents: read

jobs:
  check:
    name: Typecheck, Test, Build & Conformance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Build FIRST: `npm run build` builds the @wairon/sdk workspace (via the
      # prebuild script) before bundling, so the subsequent typecheck and tests can
      # resolve the @wairon/sdk package (its dist must exist for tsc + vitest to
      # import the workspace sibling).
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      # The web app is a SEPARATE package (not an npm workspace), so the root
      # typecheck above never covers it and `build:web` does not run in CI — a
      # type error in web/src reached main unnoticed. Its own `tsc --noEmit`,
      # with its deps installed on demand.
      - name: Typecheck web app
        run: npm run typecheck:web

      - name: Run tests
        run: npm test

      # The e2e journeys run in their own parallel job (`e2e` below), not here:
      # they are the slowest tier and need only the build, not the typecheck or
      # the unit suite, so running them alongside this job cuts CI wall-clock
      # without dropping a check.

      # Dogfood the approval gate too — the thing .github/workflows/lock-check.yml
      # offers to other repositories, run here against the CLI THIS commit builds
      # rather than the published one (a released binary would be testing a
      # different wairon than the one under review).
      #
      # Six times in this programme the lock was taken after the pull request had
      # already merged, leaving dev holding specs nobody approved. This step is
      # what makes that visible: it fails when the spec tree moved past the
      # approval recorded in .wai/lock.json, and the fix is to run `wairon lock`
      # on the branch and commit the record BEFORE merging.
      #
      # --strict, as the README recommends: this repository has an approval on
      # record, so a deleted .wai/lock.json or a member project nobody approved
      # must fail too, not pass with a notice.
      - name: Approved-design gate
        run: node dist/cli/index.js lock-check --strict

      # The conformance gate, the way docs/cli.md and the reusable workflow
      # recommend it: `validate --ci` at the FAMILY ROOT, after the approval check.
      # This repository is nobody's member, so it is the root its proofs are
      # judged at: were members declared, this same plain run would be the family
      # run (ENTRY_UNPROVEN, networks, gateways). --ci treats warnings as errors.
      - name: Architecture conformance gate (family root)
        run: node dist/cli/index.js validate --ci

  # Black-box agent journeys against the BUILT artifact: spawns
  # `node dist/cli/index.js mcp serve` as a real subprocess, speaks MCP stdio,
  # and asserts tool results + the YAML on disk. This is the tier that catches
  # the stale-server / stale-binary incident class the src-importing unit tests
  # cannot see. Split out of `check` so it runs in parallel with it; it needs
  # only `npm ci` + `npm run build` (dist/ plus the @wairon/sdk workspace the
  # prebuild script builds), which it does itself. The unit config
  # (vitest.config.ts) excludes tests/e2e/**, so nothing runs twice.
  e2e:
    name: E2E journeys (built artifact)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run e2e journeys (built artifact)
        run: npm run test:e2e

  # The release gate: dev -> main merges only carry a QA verdict the code still
  # matches. See docs/release-qa.md. Runs only on pull requests into main.
  release-qa-verdict:
    name: Release QA verdict
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    # Reads the pull request's title for the version bump.
    permissions:
      contents: read
      pull-requests: read

    steps:
      # The pull request's own head (not the synthetic merge commit), with the
      # whole history: the check asks whether the QA'd RC is an ancestor of it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The version auto-tag will give this merge: the bump is read from the
      # pull request title (a default merge message carries it), live, so a
      # retitled pull request is judged by its new title on a re-run.
      - name: The version this merge tags
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          TITLE="$(gh pr view "$PR" --json title --jq .title)"
          case "$TITLE" in
            *'[major]'*) BUMP=major ;;
            *'[minor]'*) BUMP=minor ;;
            *) BUMP=patch ;;
          esac
          VERSION="$(bash scripts/next-version.sh stable "$BUMP")"
          echo "This merge tags v${VERSION} (${BUMP}, from the title \"${TITLE}\")."
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: A passing verdict covers this head
        run: node qa/scripts/check-verdict.mjs --expect "${{ steps.next.outputs.version }}"

  docker-build:
    name: Build Docker image (no push)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Catch a broken Dockerfile at PR time. docker.yml only runs on tags, and
      # auto-tag publishes every main merge, so without this a bad Dockerfile is
      # only discovered when the stable publish fails post-merge. Single-arch
      # linux/amd64, no QEMU, no push.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: |
            VERSION=ci-check
            REVISION=${{ github.sha }}
