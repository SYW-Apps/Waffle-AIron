name: CI

on:
  push:
    branches: [main, dev, beta]
  pull_request:
    branches: [main, dev, beta]

jobs:
  check:
    name: Typecheck, Test, Build & Conformance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Build FIRST: `npm run build` builds the @wairon/sdk workspace (via the
      # prebuild script) before bundling, so the subsequent typecheck and tests can
      # resolve the @wairon/sdk package (its dist must exist for tsc + vitest to
      # import the workspace sibling).
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      # Dogfood: enforce wairon's own architecture-conformance gate on its spec tree.
      # --ci treats warnings as errors.
      - name: Architecture conformance gate
        run: node dist/cli/index.js validate --ci

  docker-build:
    name: Build Docker image (no push)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Catch a broken Dockerfile at PR time. docker.yml only runs on tags, and
      # auto-tag publishes every main merge, so without this a bad Dockerfile is
      # only discovered when the stable publish fails post-merge. Single-arch
      # linux/amd64, no QEMU, no push.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: |
            VERSION=ci-check
            REVISION=${{ github.sha }}
