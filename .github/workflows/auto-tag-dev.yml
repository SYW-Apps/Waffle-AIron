name: Auto Tag (Dev)

on:
  push:
    branches: [dev]

# Only one auto-tag run at a time. If a second push lands while one is
# already running, queue it rather than cancelling — we want every push
# to eventually get a version bump.
concurrency:
  group: auto-tag-dev
  cancel-in-progress: false

jobs:
  tag:
    name: Bump dev version and tag
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore: release v')"

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          # Use a PAT so the pushed tag triggers release.yml
          # (pushes from GITHUB_TOKEN do not trigger other workflows)
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Pull latest dev
        run: git pull --rebase origin dev

      - name: Determine version bump
        id: bump
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if echo "$MSG" | grep -q '\[major\]'; then
            echo "bump=major" >> "$GITHUB_OUTPUT"
          elif echo "$MSG" | grep -q '\[minor\]'; then
            echo "bump=minor" >> "$GITHUB_OUTPUT"
          else
            echo "bump=patch" >> "$GITHUB_OUTPUT"
          fi

      # Dev version is derived from git tags: continues X.Y.Z-dev.N while that
      # base is ahead of the latest stable, else starts a fresh -dev.1 line.
      - name: Compute next dev version
        id: version
        run: |
          VERSION="$(bash scripts/next-version.sh dev ${{ steps.bump.outputs.bump }})"
          echo "plain=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Next dev version: v${VERSION}"

      - name: Skip if tag already exists
        id: exists
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.version.outputs.tag }} already exists — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update WAIRON_VERSION in defaults.ts
        if: steps.exists.outputs.skip == 'false'
        run: |
          sed -i "s/export const WAIRON_VERSION = '[^']*'/export const WAIRON_VERSION = '${{ steps.version.outputs.plain }}'/" src/config/defaults.ts

      - name: Commit and tag
        if: steps.exists.outputs.skip == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BASE="$(git rev-parse HEAD)"
          git add src/config/defaults.ts
          git commit -m "chore: release ${TAG}" || echo "defaults.ts already current"
          git tag "${TAG}"
          if git push origin dev; then
            git push origin "${TAG}"
            exit 0
          fi
          # dev moved between "Pull latest dev" and this push: a merge landed
          # while the bump was being computed, so the ref this run expected to
          # fast-forward is stale. That push starts its own auto-tag run — the
          # concurrency group above has it queued already — and the tag that run
          # creates covers these commits too, because they are its ancestors.
          # So a lost race is superseded work, not a broken release: leave dev
          # and the tag alone and say which push won.
          git fetch -q origin dev
          if [ "$(git rev-parse origin/dev)" != "${BASE}" ]; then
            echo "::notice::dev moved to $(git rev-parse --short origin/dev) while ${TAG} was being prepared — the queued run for that push tags these commits. Nothing pushed."
            exit 0
          fi
          echo "::error::Pushing dev failed while dev was still at ${BASE} — this is not a lost race."
          exit 1
