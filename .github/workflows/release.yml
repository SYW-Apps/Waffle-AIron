name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            pkg_target: node20-win-x64
            asset_ext: .zip

          - os: ubuntu-latest
            target: linux-x64
            pkg_target: node20-linux-x64
            asset_ext: .tar.gz

          - os: ubuntu-latest
            target: linux-arm64
            pkg_target: node20-linux-arm64
            asset_ext: .tar.gz

          - os: macos-latest
            target: macos-x64
            pkg_target: node20-macos-x64
            asset_ext: .tar.gz

          - os: macos-latest
            target: macos-arm64
            pkg_target: node20-macos-arm64
            asset_ext: .tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript + copy assets
        run: npm run build

      - name: Build binary (${{ matrix.target }})
        shell: bash
        run: |
          npx --yes @yao-pkg/pkg dist/cli/index.js \
            --target ${{ matrix.pkg_target }} \
            --output wairon \
            --compress GZip \
            --config package.json

      # Authenticode-sign the Windows .exe. Dormant until a cert is configured:
      # if WINDOWS_CERT_PFX_BASE64 is unset the binary ships unsigned (a notice,
      # not a failure). Drop in a self-signed cert to test the pipeline, or a
      # CA-issued cert for public trust — the step is identical either way.
      - name: Sign Windows binary (Authenticode)
        if: matrix.asset_ext == '.zip'
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PWD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT_B64)) {
            Write-Host "::notice::No signing cert (WINDOWS_CERT_PFX_BASE64 unset) — shipping the Windows binary unsigned."
            exit 0
          }
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found on runner" }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
          try {
            & $signtool.FullName sign /f $pfx /p $env:CERT_PWD /fd SHA256 `
              /tr http://timestamp.digicert.com /td SHA256 wairon.exe
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed ($LASTEXITCODE)" }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }
          # Confirm a signature is present (works for self-signed too; a CA cert
          # would additionally report Status=Valid on a trusting machine).
          $sig = Get-AuthenticodeSignature wairon.exe
          if (-not $sig.SignerCertificate) { throw "no signature present after signing" }
          Write-Host "Signed wairon.exe by $($sig.SignerCertificate.Subject) (status: $($sig.Status))"

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Detect pre-release
        id: prerelease
        shell: bash
        run: |
          if echo "${GITHUB_REF_NAME}" | grep -qE '\-(beta|preview|dev)\.[0-9]+$'; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Package (Unix tar.gz)
        if: matrix.asset_ext == '.tar.gz'
        shell: bash
        run: |
          mkdir -p wairon-pkg
          # pkg on Linux/macOS outputs just "wairon" (no extension)
          cp wairon wairon-pkg/wairon 2>/dev/null || cp wairon-bin wairon-pkg/wairon
          chmod +x wairon-pkg/wairon
          tar -czf wairon-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz \
            -C wairon-pkg wairon

      - name: Package (Windows zip)
        if: matrix.asset_ext == '.zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path wairon-pkg -Force
          # pkg on Windows outputs "wairon.exe"
          Copy-Item "wairon.exe" "wairon-pkg\wairon.exe" -ErrorAction SilentlyContinue
          if (!(Test-Path "wairon-pkg\wairon.exe")) {
            Copy-Item "wairon" "wairon-pkg\wairon.exe"
          }
          Compress-Archive -Path "wairon-pkg\wairon.exe" `
            -DestinationPath "wairon-${{ steps.version.outputs.version }}-${{ matrix.target }}.zip" -Force

      - name: Generate checksum (Unix)
        if: matrix.asset_ext == '.tar.gz'
        run: |
          sha256sum wairon-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz \
            > wairon-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz.sha256

      - name: Generate checksum (Windows)
        if: matrix.asset_ext == '.zip'
        shell: pwsh
        run: |
          $file = "wairon-${{ steps.version.outputs.version }}-${{ matrix.target }}.zip"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  $file" | Out-File -FilePath "$file.sha256" -Encoding utf8NoBOM

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            wairon-${{ steps.version.outputs.version }}-${{ matrix.target }}${{ matrix.asset_ext }}
            wairon-${{ steps.version.outputs.version }}-${{ matrix.target }}${{ matrix.asset_ext }}.sha256

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Detect pre-release
        id: prerelease
        run: |
          if echo "${GITHUB_REF_NAME}" | grep -qE '\-(beta|preview|dev)\.[0-9]+$'; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "wairon ${{ github.ref_name }}"
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.sha256

  publish-npm:
    name: Publish to npm
    needs: build
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-npm.yml
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
