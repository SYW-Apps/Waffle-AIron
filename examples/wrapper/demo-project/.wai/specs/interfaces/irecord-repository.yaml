schemaVersion: 1.0.0
id: irecord-repository
name: IRecordRepository
description: Intent-language persistence contract for scenario records.
component: record-repository
methods:
  - name: get
    description: Loads a stored scenario record by its id.
    signature: "get(id: string): scenario_record"
    returns: "scenario_record"
    params:
      - name: id
        type: string
  - name: save
    description: Persists a scenario record.
    signature: "save(record: scenario_record): void"
    returns: "void"
    params:
      - name: record
        type: scenario_record
