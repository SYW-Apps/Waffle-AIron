schemaVersion: 1.0.0
id: impl-record-repository
name: Record Repository Implementation
description: Facade over the store; storage-technology agnostic by design.
contract: irecord-repository
methods:
  - name: getRecord
    detail: intent
    intent: Resolves the record through the store by id; returns an empty record marker when the id is unknown rather than failing.
  - name: saveRecord
    detail: intent
    intent: Writes the record through the store, overwriting an existing row with the same id; storage failures surface to the caller unchanged.
