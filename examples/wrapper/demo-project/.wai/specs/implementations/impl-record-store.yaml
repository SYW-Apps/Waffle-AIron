id: impl-record-store
name: Record Store Implementation
description: Maps scenario records onto raw rows behind the adapter.
contract: irecord-store
methods:
  - name: readRow
    narrative: []
    detail: intent
    intent: >-
      Fetches the raw row through the adapter and maps it into a scenario record; unknown ids yield
      the empty record marker.
    calls:
      - sheets-adapter.fetchRow
  - name: writeRow
    narrative: []
    detail: intent
    intent: >-
      Serializes the record into a row shape and appends or updates it through the adapter in a
      single operation.
    calls:
      - sheets-adapter.appendRow
lint:
  allow:
    - code: MISSING_SOURCE_PATH
      reason: Spec-only demo project — the flowops automation ships no source checkout in this example.
status: complete
